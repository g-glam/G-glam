<script>

function addToCart(){

let cart = JSON.parse(localStorage.getItem("cart")) || [];


cart.push({
name:"Concealer Ruby Rose",
price:150
});


localStorage.setItem(
"cart",
JSON.stringify(cart)
);


alert("تمت إضافة المنتج إلى السلة");

}
