<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | حالة الطلب</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#F5F0E8;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
color:#222;
}

.card{
background:white;
width:100%;
max-width:500px;
padding:30px;
border-radius:22px;
box-shadow:0 5px 25px rgba(0,0,0,.08);
text-align:center;
}

.logo{
font-size:35px;
font-weight:bold;
margin-bottom:10px;
}

.logo span{
color:#f47b20;
}

.subtitle{
color:#777;
margin-bottom:25px;
}

.icon{
font-size:60px;
margin-bottom:15px;
}

h1{
font-size:24px;
margin-bottom:12px;
}

.description{
color:#666;
line-height:1.8;
margin-bottom:20px;
}

.status-box{
padding:20px;
border-radius:15px;
margin-top:20px;
}

.pending{
background:#fff3cd;
color:#856404;
}

.approved{
background:#d4edda;
color:#155724;
}

.rejected{
background:#f8d7da;
color:#721c24;
}

.status-title{
font-size:20px;
font-weight:bold;
margin-bottom:10px;
}

.status-text{
line-height:1.8;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#222;
color:white;
font-size:16px;
cursor:pointer;
margin-top:15px;
}

button:hover{
opacity:.9;
}

.secondary{
background:#eee;
color:#222;
}

.info{
margin-top:20px;
padding:15px;
background:#f8f8f8;
border-radius:12px;
text-align:right;
font-size:14px;
line-height:1.8;
}

.hidden{
display:none;
}

.loading{
color:#777;
}

</style>

</head>

<body>


<div class="card">

<div class="logo">
G-<span>Glam</span>
</div>

<div class="subtitle">
حالة إنشاء متجرك
</div>


<div
class="icon"
id="statusIcon">

⏳

</div>


<h1 id="statusTitle">

جاري التحقق...

</h1>


<div
class="description"
id="statusDescription">

جاري الاتصال بحسابك والتحقق من حالة الدفع.

</div>


<!-- =========================
     حالة الطلب
========================= -->

<div
class="status-box pending"
id="statusBox">

<div
class="status-title"
id="boxTitle">

⏳ طلبك قيد المراجعة

</div>

<div
class="status-text"
id="boxText">

سيتم مراجعة طلبك والتأكد من الدفع من طرف الإدارة،
وبعد تأكيد الدفع ستتمكن من الدخول إلى متجرك.

</div>

</div>


<!-- =========================
     معلومات الطلب
========================= -->

<div
class="info"
id="orderInfo">

<strong>
معلومات الطلب
</strong>

<br>

البريد:

<span id="emailText">
جاري التحميل...
</span>

<br>

المتجر:

<span id="storeText">
جاري التحميل...
</span>

</div>


<!-- =========================
     زر الدخول
========================= -->

<button
id="dashboardBtn"
class="hidden">

🏪 الدخول إلى لوحة المتجر

</button>


<!-- =========================
     تحديث الحالة
========================= -->

<button
id="retryBtn"
class="secondary">

🔄 تحديث الحالة

</button>


</div>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


import {
getFirestore,
doc,
onSnapshot
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const statusIcon =
document.getElementById(
"statusIcon"
);

const statusTitle =
document.getElementById(
"statusTitle"
);

const statusDescription =
document.getElementById(
"statusDescription"
);

const statusBox =
document.getElementById(
"statusBox"
);

const boxTitle =
document.getElementById(
"boxTitle"
);

const boxText =
document.getElementById(
"boxText"
);

const emailText =
document.getElementById(
"emailText"
);

const storeText =
document.getElementById(
"storeText"
);

const dashboardBtn =
document.getElementById(
"dashboardBtn"
);

const retryBtn =
document.getElementById(
"retryBtn"
);


/* =====================================================
   VARIABLES
===================================================== */

let unsubscribe = null;


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
auth,
function(user){

/* المستخدم غير مسجل الدخول */

if(!user){

statusIcon.textContent =
"⚠️";

statusTitle.textContent =
"لم يتم تسجيل الدخول";

statusDescription.textContent =
"يجب تسجيل الدخول أولًا لمتابعة حالة طلب المتجر.";

statusBox.className =
"status-box rejected";

boxTitle.textContent =
"⚠️ الحساب غير مسجل";

boxText.textContent =
"يرجى تسجيل الدخول ثم العودة إلى هذه الصفحة.";

retryBtn.style.display =
"none";

return;

}


/* المستخدم مسجل */

emailText.textContent =
user.email || "-";


/* مراقبة طلب المتجر */

watchRequest(
user.uid
);

});


/* =====================================================
   WATCH STORE REQUEST
===================================================== */

function watchRequest(uid){

/* إلغاء المراقبة السابقة */

if(unsubscribe){

unsubscribe();

}


/*
   مهم جدًا:
   register-store.html يحفظ الطلب
   داخل مجموعة stores
*/

const requestRef =
doc(
db,
"stores",
uid
);


/*
   مراقبة الطلب لحظيًا
*/

unsubscribe =
onSnapshot(

requestRef,

function(snapshot){

/* =====================================================
   الطلب غير موجود
===================================================== */

if(!snapshot.exists()){

showNotFound();

return;

}


/* بيانات المتجر */

const data =
snapshot.data();


/* اسم المتجر */

storeText.textContent =
data.storeName ||
data.name ||
"-";


/* =====================================================
   تحديد الحالة
===================================================== */

const status =
data.status ||
"pending";


/* =====================================================
   قيد المراجعة
===================================================== */

if(
status === "pending"
){

showPending();

}


/* =====================================================
   مقبول
===================================================== */

else if(
status === "approved" ||
status === "active"
){

showApproved();

}


/* =====================================================
   مرفوض
===================================================== */

else if(
status === "rejected"
){

showRejected(
data.rejectionReason
);

}


/* أي حالة أخرى */

else{

showPending();

}

},


function(error){

console.error(
"Firestore error:",
error
);


statusIcon.textContent =
"⚠️";

statusTitle.textContent =
"حدث خطأ";

statusDescription.textContent =
"تعذر الاتصال بقاعدة البيانات.";

statusBox.className =
"status-box rejected";

boxTitle.textContent =
"❌ خطأ في الاتصال";

boxText.textContent =
error.message;

}

);

}


/* =====================================================
   PENDING
===================================================== */

function showPending(){

statusIcon.textContent =
"⏳";


statusTitle.textContent =
"طلبك قيد المراجعة";


statusDescription.textContent =
"سيتم مراجعة طلبك والتأكد من الدفع من طرف الإدارة، وبعد تأكيد الدفع ستتمكن من الدخول إلى متجرك.";


statusBox.className =
"status-box pending";


boxTitle.textContent =
"⏳ طلبك قيد المراجعة";


boxText.textContent =
"سيتم مراجعة طلبك والتأكد من الدفع من طرف الإدارة، وبعد تأكيد الدفع ستتمكن من الدخول إلى متجرك.";


dashboardBtn.classList.add(
"hidden"
);


retryBtn.style.display =
"block";

}


/* =====================================================
   APPROVED
===================================================== */

function showApproved(){

statusIcon.textContent =
"✅";


statusTitle.textContent =
"تم قبول متجرك!";


statusDescription.textContent =
"تمت الموافقة على وصل الدفع وإنشاء متجرك بنجاح.";


statusBox.className =
"status-box approved";


boxTitle.textContent =
"✅ تم تأكيد الدفع";


boxText.textContent =
"مبروك! تمت الموافقة على طلبك. يمكنك الآن الدخول إلى لوحة التحكم الخاصة بمتجرك وإضافة المنتجات وإدارة الطلبات.";


dashboardBtn.classList.remove(
"hidden"
);


retryBtn.style.display =
"none";


/* حفظ الحالة */

localStorage.setItem(
"paymentStatus",
"approved"
);

localStorage.setItem(
"storeStatus",
"active"
);


/* زر الدخول */

dashboardBtn.onclick =
function(){

window.location.href =
"dashboard.html";

};

}


/* =====================================================
   REJECTED
===================================================== */

function showRejected(reason){

statusIcon.textContent =
"❌";


statusTitle.textContent =
"تم رفض الطلب";


statusDescription.textContent =
"لم تتم الموافقة على طلب إنشاء المتجر.";


statusBox.className =
"status-box rejected";


boxTitle.textContent =
"❌ تم رفض الطلب";


if(
reason &&
reason.trim()
){

boxText.innerHTML =
"سبب الرفض:<br><strong>" +
escapeHtml(reason) +
"</strong>";

}

else{

boxText.textContent =
"تم رفض الطلب من طرف الإدارة. يرجى التواصل مع الإدارة لمعرفة السبب.";

}


dashboardBtn.classList.add(
"hidden"
);


retryBtn.style.display =
"block";


localStorage.setItem(
"paymentStatus",
"rejected"
);


localStorage.setItem(
"storeStatus",
"rejected"
);

}


/* =====================================================
   NOT FOUND
===================================================== */

function showNotFound(){

/*
   لا نظهر رسالة مخيفة للمستخدم.
   لأن الطلب قد يكون مازال تتم مزامنته.
*/

statusIcon.textContent =
"⏳";


statusTitle.textContent =
"طلبك قيد المراجعة";


statusDescription.textContent =
"سيتم مراجعة طلبك والتأكد من الدفع من طرف الإدارة، وبعد تأكيد الدفع ستتمكن من الدخول إلى متجرك.";


statusBox.className =
"status-box pending";


boxTitle.textContent =
"⏳ طلبك قيد المراجعة";


boxText.textContent =
"سيتم مراجعة طلبك والتأكد من الدفع من طرف الإدارة، وبعد تأكيد الدفع ستتمكن من الدخول إلى متجرك.";


dashboardBtn.classList.add(
"hidden"
);


retryBtn.style.display =
"block";

}


/* =====================================================
   RETRY
===================================================== */

retryBtn.addEventListener(
"click",
function(){

location.reload();

});


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}

</script>

</body>

</html>
