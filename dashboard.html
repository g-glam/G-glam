<style>

/* =====================================================
   COLORS
===================================================== */

:root{

--orange:#F47B20;
--orange-dark:#DF6810;

--bg:#F7F7F7;
--card:#FFFFFF;

--dark:#222222;
--dark-2:#333333;

--text:#333333;
--muted:#888888;

--border:#E9E9E9;

--success:#198754;
--success-bg:#E5F5EC;

--danger:#DC3545;
--danger-bg:#FBE7EA;

--shadow:0 4px 18px rgba(0,0,0,.06);

}


/* =====================================================
   RESET
===================================================== */

*{

box-sizing:border-box;

margin:0;
padding:0;

font-family:"Tajawal",Arial,sans-serif;

}


/* =====================================================
   BODY
===================================================== */

body{

background:var(--bg);

color:var(--text);

min-height:100vh;

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

position:fixed;

right:0;
top:0;

height:100vh;

width:75px;

background:#EEEEEE;

color:#444;

overflow:hidden;

transition:.3s;

z-index:1100;

box-shadow:-3px 0 15px rgba(0,0,0,.04);

border-left:1px solid #E3E3E3;

}

.sidebar:hover{

width:240px;

}


/* =====================================================
   LOGO
===================================================== */

.logo{

height:78px;

display:flex;

align-items:center;

justify-content:center;

font-size:23px;

font-weight:800;

color:#222;

border-bottom:1px solid #DDDDDD;

white-space:nowrap;

}

.logo span{

color:var(--orange);

}


/* =====================================================
   MENU
===================================================== */

.menu{

margin-top:18px;

padding:0 10px;

}

.menu a{

display:flex;

align-items:center;

gap:15px;

height:52px;

padding:0 10px;

margin-bottom:7px;

border-radius:12px;

color:#555;

text-decoration:none;

white-space:nowrap;

transition:.2s;

}

.menu a:hover{

background:#E3E3E3;

color:#222;

}

.menu a.active{

background:var(--orange);

color:white;

box-shadow:
0 5px 15px rgba(244,123,32,.22);

}

.icon{

min-width:35px;

text-align:center;

font-size:20px;

}

.text{

opacity:0;

transition:.25s;

font-size:14px;

font-weight:700;

}

.sidebar:hover .text{

opacity:1;

}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{

position:fixed;

top:0;

right:75px;

left:0;

height:78px;

background:white;

border-bottom:1px solid var(--border);

display:flex;

align-items:center;

justify-content:space-between;

padding:0 25px;

z-index:1000;

box-shadow:
0 2px 12px rgba(0,0,0,.04);

transition:.3s;

}


/* =====================================================
   STORE TOP
===================================================== */

.store-top{

display:flex;

align-items:center;

gap:12px;

min-width:0;

}


/* =====================================================
   STORE IMAGE
===================================================== */

.store-image{

width:48px;

height:48px;

border-radius:50%;

object-fit:cover;

background:#F1F1F1;

border:2px solid #FFE0C8;

flex-shrink:0;

}


/* =====================================================
   STORE DETAILS
===================================================== */

.store-details{

display:flex;

flex-direction:column;

min-width:0;

}

.store-label{

font-size:11px;

color:#999;

margin-bottom:2px;

}

.store-top-name{

font-size:16px;

font-weight:800;

color:#222;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

max-width:250px;

}


/* =====================================================
   VIEW STORE
===================================================== */

.view-store-btn{

display:flex;

align-items:center;

gap:7px;

background:#FFF1E6;

color:var(--orange-dark);

text-decoration:none;

padding:10px 15px;

border-radius:11px;

font-size:13px;

font-weight:700;

transition:.2s;

white-space:nowrap;

border:1px solid #FFE0CA;

}

.view-store-btn:hover{

background:var(--orange);

color:white;

}


/* =====================================================
   CONTENT
===================================================== */

.content{

margin-right:75px;

padding:103px 25px 25px;

transition:.3s;

}


/* =====================================================
   HEADER
===================================================== */

.header{

background:var(--card);

border:1px solid var(--border);

border-radius:18px;

padding:25px;

box-shadow:var(--shadow);

margin-bottom:22px;

position:relative;

overflow:hidden;

}

.header::before{

content:"";

position:absolute;

right:0;

top:0;

width:5px;

height:100%;

background:var(--orange);

}

.header h1{

font-size:27px;

color:var(--dark-2);

margin-bottom:8px;

}

.header p{

color:var(--muted);

font-size:14px;

}

.owner-email{

font-size:13px;

color:var(--muted);

margin-top:13px;

}

.owner-email span{

color:var(--dark-2);

font-weight:700;

}


/* =====================================================
   MESSAGES
===================================================== */

.message{

display:none;

padding:14px 18px;

border-radius:12px;

margin-bottom:18px;

text-align:center;

font-size:14px;

}

.success{

background:var(--success-bg);

color:#155724;

border:1px solid #c5e8d3;

}

.error{

background:var(--danger-bg);

color:#721c24;

border:1px solid #efc7cc;

}


/* =====================================================
   STATISTICS
===================================================== */

.stats{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:18px;

margin-bottom:22px;

}

.stat{

background:white;

border:1px solid var(--border);

border-radius:18px;

padding:22px;

box-shadow:var(--shadow);

position:relative;

overflow:hidden;

}

.stat::after{

content:"";

position:absolute;

bottom:0;

right:0;

height:3px;

width:100%;

background:var(--orange);

opacity:.8;

}

.stat-title{

color:var(--muted);

font-size:14px;

margin-bottom:12px;

display:flex;

align-items:center;

gap:8px;

}

.stat-value{

font-size:30px;

font-weight:800;

color:var(--dark);

}


/* =====================================================
   ACTIONS
===================================================== */

.actions{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:18px;

margin-bottom:22px;

}

.action{

background:white;

border:1px solid var(--border);

border-radius:18px;

padding:23px;

text-align:right;

cursor:pointer;

box-shadow:var(--shadow);

transition:.25s;

position:relative;

overflow:hidden;

}

.action::before{

content:"";

position:absolute;

right:0;

top:0;

width:4px;

height:100%;

background:var(--orange);

transform:scaleY(0);

transition:.25s;

}

.action:hover{

transform:translateY(-3px);

box-shadow:
0 8px 25px rgba(0,0,0,.09);

}

.action:hover::before{

transform:scaleY(1);

}

.action h3{

font-size:18px;

color:var(--dark);

margin-bottom:8px;

}

.action p{

color:var(--muted);

font-size:14px;

}


/* =====================================================
   SECTION
===================================================== */

.section{

background:white;

border:1px solid var(--border);

padding:22px;

border-radius:18px;

box-shadow:var(--shadow);

margin-bottom:22px;

}

.section-header{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:20px;

}

.section-header h2{

}


/* =====================================================

===================================================== */

.add-btn{

border:none;

padding:11px 18px;

border-radius:11px;

cursor:pointer;

font-size:14px;

font-weight:700;

transition:.2s;

box-shadow:
0 4px 10px rgba(244,123,32,.18);

}

.add-btn:hover{

background:var(--orange-dark);

}


/* =====================================================
   PRODUCTS
===================================================== */

.products{

display:grid;

grid-template-columns:repeat(4,1fr);

/* =====================================================
   PRODUCT
===================================================== */

.product{

border:1px solid var(--border);

border-radius:16px;

padding:10px;

transition:.25s;

overflow:hidden;

}

.product:hover{

0 8px 25px rgba(0,0,0,.08);

/* =====================================================

height:190px;

/* =====================================================

/* =====================================================

/* =====================================================
   PRODUCT STOCK

}


/* =====================================================
   PRODUCT BUTTONS
===================================================== */

.product-buttons{

display:flex;

gap:7px;

}

.product-buttons button{

flex:1;

padding:10px 5px;

border:none;

border-radius:9px;

cursor:pointer;

font-size:13px;

font-weight:700;

transition:.2s;

}

.edit-btn{

background:#FFF1E6;

color:var(--orange-dark);

}

.edit-btn:hover{

background:#FFE2CC;

}

.delete-btn{

background:var(--danger-bg);

color:#B52B39;

}

.delete-btn:hover{

background:#F6D1D6;

}


/* =====================================================
   EMPTY
===================================================== */

.empty{

background:#FAFAFA;

border:1px dashed #DDD;

padding:40px 20px;

text-align:center;

color:var(--muted);

border-radius:14px;

}

/* =====================================================

@media(max-width:1000px){

/* =====================================================

/* =====================================================

===================================================== */

@media(max-width:550px){

}

.sidebar:hover{

}

.topbar{

}

.header{

.product img{

/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:380px){

.products{

grid-template-columns:1fr;

.product img{

}

.view-store-btn{

padding:0;

justify-content:center;

}

.view-store-btn::before{

content:"👁️";

/* =====================================================
   SCROLLBAR
===================================================== */

::-webkit-scrollbar{

width:7px;

}

}

::-webkit-scrollbar-thumb{

background:#CCC;

border-radius:10px;

}

::-webkit-scrollbar-thumb:hover{

background:var(--orange);

}

</style>

<script type="module">


/* =====================================================
   IMPORTS
===================================================== */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
collection,
getDocs,
query,
where,
deleteDoc,
doc,
getDoc

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


import {

getAuth,
onAuthStateChanged,
signOut

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


const auth =
getAuth(app);


/* =====================================================
   ELEMENTS
===================================================== */

const storeNameElement =
document.getElementById(
"storeName"
);


const storeNameStat =
document.getElementById(
"storeNameStat"
);


const ownerEmailElement =
document.getElementById(
"ownerEmail"
);


const productsCount =
document.getElementById(
"productsCount"
);


const ordersCount =
document.getElementById(
"ordersCount"
);


const productsContainer =
document.getElementById(
"productsContainer"
);


const topStoreName =
document.getElementById(
"topStoreName"
);


const topStoreImage =
document.getElementById(
"topStoreImage"
);


const viewStoreBtn =
document.getElementById(
"viewStoreBtn"
);


/* =====================================================
   VARIABLES
===================================================== */

let currentOwnerEmail = "";

let currentOwnerUid = "";

let currentStoreId = "";

let currentStoreName = "G-Glam";


/* =====================================================
   LOAD STORE
===================================================== */

async function loadStore(){

try{


if(!auth.currentUser){

window.location.href =
"login.html";

return;

}


const uid =
auth.currentUser.uid;


currentOwnerUid =
uid;


/* =====================================================
   STORES / UID
===================================================== */

const storeRef =
doc(
db,
"stores",
uid
);


const storeSnapshot =
await getDoc(
storeRef
);


   /* =====================================================
   NO STORE
===================================================== */

if(!storeSnapshot.exists()){

alert(
"⚠️ لم يتم العثور على متجر مرتبط بهذا الحساب."
);

await signOut(auth);

window.location.href =
"login.html";

return;

}


/* =====================================================
   STORE DATA
===================================================== */

const store =
storeSnapshot.data();


currentStoreId =
storeSnapshot.id;


/* =====================================================
   STATUS
===================================================== */

const status =

String(
store.status || "pending"
)

.toLowerCase()
.trim();


/* =====================================================
   PENDING
===================================================== */

if(

status === "pending" ||

status === "waiting" ||

status === "review"

){

alert(
"⏳ طلب إنشاء متجرك مازال قيد المراجعة من طرف الإدارة."
);

await signOut(auth);

window.location.href =
"login.html";

return;

}


/* =====================================================
   REJECTED
===================================================== */

if(

status === "rejected" ||

status === "refused"

){

const reason =
store.rejectionReason ||
"لم يتم ذكر سبب الرفض.";


alert(

"❌ تم رفض طلب إنشاء المتجر.\n\n" +

"سبب الرفض:\n" +

reason

);


await signOut(auth);

window.location.href =
"login.html";

return;

}


/* =====================================================
   APPROVED
===================================================== */

if(

status !== "active" &&

status !== "approved"

){

alert(
"⚠️ لا يمكنك الدخول إلى لوحة التحكم حاليًا."
);

await signOut(auth);

window.location.href =
"login.html";

return;

}


/* =====================================================
   STORE ACCEPTED
===================================================== */

currentStoreName =

store.storeName ||

store.name ||

"G-Glam";


currentOwnerEmail =

store.ownerEmail ||

store.email ||

auth.currentUser.email ||

"";


/* =====================================================
   STORE IMAGE
===================================================== */

const storeImage =

store.storeImage ||

store.image ||

store.logo ||

store.photoURL ||

"";


if(storeImage){

topStoreImage.src =
storeImage;

}


/* =====================================================
   DISPLAY
===================================================== */

storeNameElement.textContent =
currentStoreName;


storeNameStat.textContent =
currentStoreName;


ownerEmailElement.textContent =
currentOwnerEmail;


topStoreName.textContent =
currentStoreName;


/* =====================================================
   VIEW STORE
===================================================== */

/*
   إذا كان لديك رابط متجر محفوظ في Firestore
   سيتم استخدامه.

   وإذا لم يوجد، نستخدم index.html.
*/

const storeUrl =

store.storeUrl ||

store.url ||

store.shopUrl ||

"index.html";


viewStoreBtn.href =
storeUrl;


/* =====================================================
   LOCAL STORAGE
===================================================== */

localStorage.setItem(
"storeId",
currentStoreId
);


localStorage.setItem(
"storeName",
currentStoreName
);


localStorage.setItem(
"storeOwnerEmail",
currentOwnerEmail
);


localStorage.setItem(
"ownerEmail",
currentOwnerEmail
);


localStorage.setItem(
"ownerUid",
currentOwnerUid
);


localStorage.setItem(
"paymentStatus",
"approved"
);


/* =====================================================
   LOAD PRODUCTS
===================================================== */

await loadProducts();


/* =====================================================
   LOAD ORDERS
===================================================== */

await loadOrders();


}catch(error){

console.error(
"LOAD STORE ERROR:",
error
);


if(
error.code ===
"permission-denied"
){

alert(
"❌ لا توجد صلاحية للوصول إلى بيانات المتجر."
);

"❌ حدث خطأ أثناء تحميل المتجر.\n\n" +

);

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

try{


const q =
query(

collection(
db,
"products"
),

where(
"ownerUid",
"==",
currentOwnerUid
)

);


let snapshot;


try{

snapshot =
await getDocs(q);

}catch(error){


if(

error.code ===
"failed-precondition"

||

error.code ===
"permission-denied"

){

const oldQuery =
query(

collection(
db,
"products"
),

where(
"ownerEmail",
"==",
currentOwnerEmail
)

);

snapshot =
await getDocs(
oldQuery
);

}else{

throw error;

}

}


/* =====================================================
   PRODUCTS COUNT
===================================================== */

productsCount.textContent =
snapshot.size;


/* =====================================================
   CLEAR
===================================================== */

productsContainer.innerHTML =
"";


/* =====================================================
   EMPTY
===================================================== */

if(snapshot.empty){

productsContainer.innerHTML = `

<div class="empty">

لا توجد منتجات حاليًا.

<br><br>

<button
class="add-btn"
onclick="goAddProduct()">

➕ إضافة أول منتج

</button>

</div>

`;

return;

}


/* =====================================================
   DISPLAY
===================================================== */

snapshot.forEach(
productDoc=>{

const product =
productDoc.data();


const id =
productDoc.id;


const card =
document.createElement(
"div"
);


card.className =
"product";


card.innerHTML = `

<img

src="${
product.image ||
"https://via.placeholder.com/400x400?text=G-Glam"
}"

alt="${escapeHtml(
product.name ||
"منتج"
)}"

>


<h3>

${escapeHtml(
product.name ||
"بدون اسم"
)}

</h3>


<div class="product-price">

${Number(
product.price || 0
)} DA

</div>


<div class="product-stock">

المخزون:

${Number(
product.stock || 0
)}

</div>


<div class="product-buttons">


<button
class="edit-btn">

✏️ تعديل

</button>


<button
class="delete-btn">

🗑️ حذف

</button>


</div>

`;


/* =====================================================
   EDIT
===================================================== */

card
.querySelector(
".edit-btn"
)
.addEventListener(
"click",
function(){

window.location.href =
"edit-product.html?id=" +
encodeURIComponent(id);

}
);
   /* =====================================================
   DELETE
===================================================== */

card
.querySelector(
".delete-btn"
)
.addEventListener(
"click",
function(){

deleteProduct(id);

}
);


productsContainer.appendChild(
card
);

});

}catch(error){

console.error(
"PRODUCTS ERROR:",
error
);


productsContainer.innerHTML = `

<div class="empty">

❌ حدث خطأ أثناء تحميل المنتجات.

<br><br>

${escapeHtml(
error.message || ""
)}

</div>

`;

}

}


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

try{

const q =
query(

collection(
db,
"orders"
),

where(
"ownerUid",
"==",
currentOwnerUid
)

);


let snapshot;


try{

snapshot =
await getDocs(q);

}catch(error){

if(

error.code ===
"failed-precondition"

||

error.code ===
"permission-denied"

){

const oldQuery =
query(

collection(
db,
"orders"
),

where(
"ownerEmail",
"==",
currentOwnerEmail
)

);

snapshot =
await getDocs(
oldQuery
);

}else{

throw error;

}

}


ordersCount.textContent =
snapshot.size;


}catch(error){

console.error(
"ORDERS ERROR:",
error
);

ordersCount.textContent =
"0";

}

}


/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(id){

const ok =
confirm(
"هل تريد حذف هذا المنتج؟"
);


if(!ok){

return;

}


try{

await deleteDoc(

doc(
db,
"products",
id
)

);


showSuccess(
"تم حذف المنتج بنجاح ✅"
);


await loadProducts();


}catch(error){

console.error(
"DELETE PRODUCT ERROR:",
error
);


showError(
"❌ حدث خطأ أثناء حذف المنتج."
);

}

}


/* =====================================================
   NAVIGATION
===================================================== */

window.goAddProduct =
function(){

window.location.href =
"add-product.html";

};


window.goOrders =
function(){

window.location.href =
"orders.html";

};


/* =====================================================
   LOGOUT
===================================================== */

document
.getElementById(
"logoutBtn"
)
.addEventListener(
"click",
async function(event){

event.preventDefault();


const ok =
confirm(
"هل تريد تسجيل الخروج؟"
);


if(!ok){

return;

}


try{

await signOut(
auth
);


/* تنظيف بيانات الدخول */

localStorage.removeItem(
"storeId"
);

localStorage.removeItem(
"ownerUid"
);

localStorage.removeItem(
"ownerEmail"
);

localStorage.removeItem(
"storeOwnerEmail"
);

localStorage.removeItem(
"storeName"
);

localStorage.removeItem(
"paymentStatus"
);


window.location.href =
"login.html";


}catch(error){

console.error(
"LOGOUT ERROR:",
error
);


showError(
"❌ تعذر تسجيل الخروج."
);

}

});


/* =====================================================
   SUCCESS MESSAGE
===================================================== */

function showSuccess(text){

const box =
document.getElementById(
"successMessage"
);


box.textContent =
text;


box.style.display =
"block";


setTimeout(
function(){

box.style.display =
"none";

},
3000
);

}


/* =====================================================
   ERROR MESSAGE
===================================================== */

function showError(text){

const box =
document.getElementById(
"errorMessage"
);


box.textContent =
text;


box.style.display =
"block";


setTimeout(
function(){

box.style.display =
"none";

},
4000
);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
   AUTHENTICATION
===================================================== */

onAuthStateChanged(

auth,

async function(user){

if(!user){

window.location.href =
"login.html";

return;

}


/* =====================================================
   USER UID
===================================================== */

currentOwnerUid =
user.uid;


/* =====================================================
   USER EMAIL
===================================================== */

currentOwnerEmail =
user.email || "";


ownerEmailElement.textContent =
currentOwnerEmail;


/* =====================================================
   CHECK STORE
===================================================== */

await loadStore();

});


/* =====================================================
   START
===================================================== */

console.log(
"G-Glam Store Dashboard Started"
);

</script>
