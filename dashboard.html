<style>

:root{

--orange:#F47B20;
--orange-dark:#DF6810;

--bg:#F7F7F7;
--card:#FFFFFF;

--dark:#222222;
--dark-2:#333333;

--text:#333333;
--muted:#888888;

--border:#E9E9E9;

--success:#198754;
--success-bg:#E5F5EC;

--danger:#DC3545;
--danger-bg:#FBE7EA;

--shadow:0 4px 18px rgba(0,0,0,.06);

}


/* =====================================================
   RESET
===================================================== */

*{

box-sizing:border-box;

margin:0;
padding:0;

font-family:"Tajawal",Arial,sans-serif;

}


body{

background:var(--bg);

color:var(--text);

min-height:100vh;

transition:
background .3s,
color .3s;

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

position:fixed;

right:0;
top:0;

height:100vh;

width:75px;

background:#EEEEEE;

color:#444;

overflow:hidden;

transition:.3s;

z-index:1100;

box-shadow:-3px 0 15px rgba(0,0,0,.04);

border-left:1px solid #E3E3E3;

}

.sidebar:hover{

width:240px;

}


/* =====================================================
   LOGO
===================================================== */

.logo{

height:78px;

display:flex;

align-items:center;

justify-content:center;

border-bottom:1px solid #DDDDDD;

white-space:nowrap;

padding:10px;

}

.logo img{

width:48px;

height:48px;

object-fit:contain;

display:block;

transition:.3s;

}

.sidebar:hover .logo img{

width:130px;

height:55px;

}


/* =====================================================
   MENU
===================================================== */

.menu{

margin-top:18px;

padding:0 10px;

}

.menu a{

display:flex;

align-items:center;

gap:15px;

height:52px;

padding:0 10px;

margin-bottom:7px;

border-radius:12px;

color:#555;

text-decoration:none;

white-space:nowrap;

transition:.2s;

}

.menu a:hover{

background:#E3E3E3;

color:#222;

}

.menu a.active{

background:var(--orange);

color:white;

box-shadow:
0 5px 15px rgba(244,123,32,.22);

}

.icon{

min-width:35px;

text-align:center;

font-size:20px;

}

.text{

opacity:0;

transition:.25s;

font-size:14px;

font-weight:700;

}

.sidebar:hover .text{

opacity:1;

}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{

position:fixed;

top:0;

right:75px;

left:0;

height:78px;

background:white;

border-bottom:1px solid var(--border);

display:flex;

align-items:center;

justify-content:space-between;

padding:0 25px;

z-index:1000;

box-shadow:
0 2px 12px rgba(0,0,0,.04);

transition:.3s;

}


/* =====================================================
   STORE TOP
===================================================== */

.store-top{

display:flex;

align-items:center;

gap:12px;

min-width:0;

}


/* =====================================================
   STORE IMAGE
===================================================== */

.store-image{

width:48px;

height:48px;

border-radius:50%;

object-fit:cover;

background:#F1F1F1;

border:2px solid #FFE0C8;

flex-shrink:0;

}


/* =====================================================
   STORE DETAILS
===================================================== */

.store-details{

display:flex;

flex-direction:column;

min-width:0;

}

.store-label{

font-size:11px;

color:#999;

margin-bottom:2px;

}

.store-top-name{

font-size:16px;

font-weight:800;

color:#222;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

max-width:250px;

}


/* =====================================================
   TOPBAR ACTIONS
===================================================== */

.topbar-actions{

display:flex;

align-items:center;

gap:10px;

}


/* =====================================================
   DARK MODE BUTTON
===================================================== */

.theme-btn{

width:42px;

height:42px;

border-radius:12px;

border:1px solid #E5E5E5;

background:#F7F7F7;

color:#333;

display:flex;

align-items:center;

justify-content:center;

font-size:20px;

cursor:pointer;

transition:.25s;

}

.theme-btn:hover{

background:#FFF1E6;

border-color:#FFD2B0;

transform:translateY(-1px);

}


/* =====================================================
   VIEW STORE
===================================================== */

.view-store-btn{

display:flex;

align-items:center;

gap:7px;

background:#FFF1E6;

color:var(--orange-dark);

text-decoration:none;

padding:10px 15px;

border-radius:11px;

font-size:13px;

font-weight:700;

transition:.2s;

white-space:nowrap;

border:1px solid #FFE0CA;

}

.view-store-btn:hover{

background:var(--orange);

color:white;

}


/* =====================================================
   CONTENT
===================================================== */

.content{

margin-right:75px;

padding:103px 25px 25px;

transition:.3s;

}


/* =====================================================
   MESSAGES
===================================================== */

.message{

display:none;

padding:14px 18px;

border-radius:12px;

margin-bottom:18px;

text-align:center;

font-size:14px;

}

.success{

background:var(--success-bg);

color:#155724;

border:1px solid #c5e8d3;

}

.error{

background:var(--danger-bg);

color:#721c24;

border:1px solid #efc7cc;

}


/* =====================================================
   STATISTICS
===================================================== */

.stats{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:18px;

margin-bottom:22px;

}

.stat{

background:white;

border:1px solid var(--border);

border-radius:18px;

padding:22px;

box-shadow:var(--shadow);

position:relative;

overflow:hidden;

}

.stat::after{

content:"";

position:absolute;

bottom:0;

right:0;

height:3px;

width:100%;

background:var(--orange);

opacity:.8;

}

.stat-title{

color:var(--muted);

font-size:14px;

margin-bottom:12px;

display:flex;

align-items:center;

gap:8px;

}

.stat-value{

font-size:30px;

font-weight:800;

color:var(--dark);

}


/* =====================================================
   ACTIONS
===================================================== */

.actions{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:18px;

margin-bottom:22px;

}

.action{

background:white;

border:1px solid var(--border);

border-radius:18px;

padding:23px;

text-align:right;

cursor:pointer;

box-shadow:var(--shadow);

transition:.25s;

position:relative;

overflow:hidden;

color:var(--text);

}

.action::before{

content:"";

position:absolute;

right:0;

top:0;

width:4px;

height:100%;

background:var(--orange);

transform:scaleY(0);

transition:.25s;

}

.action:hover{

transform:translateY(-3px);

box-shadow:
0 8px 25px rgba(0,0,0,.09);

}

.action:hover::before{

transform:scaleY(1);

}

.action h3{

font-size:18px;

color:var(--dark);

margin-bottom:8px;

}

.action p{

color:var(--muted);

font-size:14px;

}


/* =====================================================
   SECTION
===================================================== */

.section{

background:white;

border:1px solid var(--border);

padding:22px;

border-radius:18px;

box-shadow:var(--shadow);

margin-bottom:22px;

}

.section-header{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:20px;

}

.section-header h2{

font-size:21px;

color:var(--dark);

}


/* =====================================================
   ADD BUTTON
===================================================== */

.add-btn{

background:var(--orange);

color:white;

border:none;

padding:11px 18px;

border-radius:11px;

cursor:pointer;

font-size:14px;

font-weight:700;

transition:.2s;

box-shadow:
0 4px 10px rgba(244,123,32,.18);

}

.add-btn:hover{

background:var(--orange-dark);

transform:translateY(-1px);

}


/* =====================================================
   PRODUCTS
===================================================== */

.products{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:17px;

}


/* =====================================================
   PRODUCT
===================================================== */

.product{

background:white;

border:1px solid var(--border);

border-radius:16px;

padding:10px;

transition:.25s;

overflow:hidden;

}

.product:hover{

transform:translateY(-3px);

box-shadow:
0 8px 25px rgba(0,0,0,.08);

}


/* =====================================================
   PRODUCT IMAGE
===================================================== */

.product img{

width:100%;

height:190px;

object-fit:cover;

border-radius:12px;

background:#F2F2F2;

}


/* =====================================================
   PRODUCT NAME
===================================================== */

.product h3{

font-size:16px;

margin:12px 6px 7px;

color:var(--dark);

}


/* =====================================================
   PRODUCT PRICE
===================================================== */

.product-price{

font-size:16px;

font-weight:700;

color:var(--orange);

margin:0 6px 8px;

}


/* =====================================================
   PRODUCT STOCK
===================================================== */

.product-stock{

font-size:13px;

color:var(--muted);

margin:0 6px 12px;

}


/* =====================================================
   PRODUCT BUTTONS
===================================================== */

.product-buttons{

display:flex;

gap:7px;

}

.product-buttons button{

flex:1;

padding:10px 5px;

border:none;

border-radius:9px;

cursor:pointer;

font-size:13px;

font-weight:700;

transition:.2s;

font-family:"Tajawal",Arial,sans-serif;

}

.edit-btn{

background:#FFF1E6;

color:var(--orange-dark);

}

.edit-btn:hover{

background:#FFE2CC;

}

.delete-btn{

background:var(--danger-bg);

color:#B52B39;

}

.delete-btn:hover{

background:#F6D1D6;

}


/* =====================================================
   EMPTY
===================================================== */

.empty{

background:#FAFAFA;

border:1px dashed #DDD;

padding:40px 20px;

text-align:center;

color:var(--muted);

border-radius:14px;

grid-column:1/-1;

line-height:1.8;

}

const themeBtn =
document.getElementById("themeBtn");


function applyTheme(){

const isDesktop =
window.innerWidth >= 1000;

const savedTheme =
localStorage.getItem(
"gGlamDashboardTheme"
);


if(
isDesktop &&
savedTheme === "dark"
){

document.body.classList.add(
"dark-mode"
);

themeBtn.textContent =
"☀️";

themeBtn.title =
"الوضع الفاتح";

}else{

document.body.classList.remove(
"dark-mode"
);

themeBtn.textContent =
"🌙";

themeBtn.title =
"الوضع الليلي";

}

}


/* =====================================================
   THEME TOGGLE
===================================================== */

themeBtn.addEventListener(

"click",

function(){

/*
   الوضع الليلي للكمبيوتر فقط
*/

if(
window.innerWidth < 1000
){

return;

}


const isDark =
document.body.classList.toggle(
"dark-mode"
);


localStorage.setItem(

"gGlamDashboardTheme",

isDark
? "dark"
: "light"

);


themeBtn.textContent =
isDark
? "☀️"
: "🌙";


themeBtn.title =
isDark
? "الوضع الفاتح"
: "الوضع الليلي";

});


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(

"resize",

applyTheme

);


/* =====================================================
   APPLY SAVED THEME IMMEDIATELY
===================================================== */

applyTheme();


/* =====================================================
   ELEMENTS
===================================================== */

const storeNameStat =
document.getElementById("storeNameStat");

const productsCount =
document.getElementById("productsCount");

const ordersCount =
document.getElementById("ordersCount");

const productsContainer =
document.getElementById("productsContainer");

const topStoreName =
document.getElementById("topStoreName");

const topStoreImage =
document.getElementById("topStoreImage");

const viewStoreBtn =
document.getElementById("viewStoreBtn");


/* =====================================================
   VARIABLES
===================================================== */

let currentOwnerEmail = "";

let currentOwnerUid = "";

let currentStoreId = "";

let currentStoreName = "G-Glam";

let currentStore = null;


/* =====================================================
   LOAD STORE BY UID
===================================================== */

async function loadStore(){

try{

const user =
auth.currentUser;


if(!user){

window.location.href =
"login.html";

return false;

}


currentOwnerUid =
user.uid;


currentOwnerEmail =
user.email || "";


/* =====================================================
   FIRST METHOD
   stores/{UID}
===================================================== */

let storeSnapshot =

await getDoc(

doc(
db,
"stores",
currentOwnerUid
)

);


/* =====================================================
   SECOND METHOD
   ownerUid == UID
===================================================== */

if(!storeSnapshot.exists()){

console.log(
"Store document ID is not UID. Searching ownerUid..."
);


const ownerQuery =
query(

collection(
db,
"stores"
),

where(
"ownerUid",
"==",
currentOwnerUid
)

);


const ownerSnapshot =
await getDocs(
ownerQuery
);


if(!ownerSnapshot.empty){

storeSnapshot =
ownerSnapshot.docs[0];

}

}


/* =====================================================
   THIRD METHOD
   ownerEmail == EMAIL
===================================================== */

if(!storeSnapshot.exists()){

console.log(
"Searching store by ownerEmail..."
);


if(currentOwnerEmail){

const emailQuery =
query(

collection(
db,
"stores"
),

where(
"ownerEmail",
"==",
currentOwnerEmail
)

);


const emailSnapshot =
await getDocs(
emailQuery
);


if(!emailSnapshot.empty){

storeSnapshot =
emailSnapshot.docs[0];

}

}

}


/* =====================================================
   STORE NOT FOUND
===================================================== */

if(!storeSnapshot.exists()){

alert(

"⚠️ لم يتم العثور على متجر مرتبط بهذا الحساب.\n\n" +

"UID:\n" +

currentOwnerUid

);


await signOut(auth);

window.location.href =
"login.html";

return false;

}


/* =====================================================
   STORE DATA
===================================================== */

currentStore =
storeSnapshot.data();

currentStoreId =
storeSnapshot.id;


/* =====================================================
   STORE STATUS
===================================================== */

const status =

String(
currentStore.status ||
"pending"
)

.toLowerCase()
.trim();


if(

status === "pending" ||

status === "waiting" ||

status === "review"

){

alert(
"⏳ طلب إنشاء متجرك مازال قيد المراجعة من طرف الإدارة."
);

await signOut(auth);

window.location.href =
"login.html";

return false;

}


if(

status === "rejected" ||

status === "refused"

){

const reason =

currentStore.rejectionReason ||

"لم يتم ذكر سبب الرفض.";


alert(

"❌ تم رفض طلب إنشاء المتجر.\n\n" +

"سبب الرفض:\n" +

reason

);


await signOut(auth);

window.location.href =
"login.html";

return false;

}


if(

status !== "active" &&

status !== "approved"

){

alert(
"⚠️ لا يمكنك الدخول إلى لوحة التحكم حاليًا."
);

await signOut(auth);

window.location.href =
"login.html";

return false;

}


/* =====================================================
   STORE NAME
===================================================== */

currentStoreName =

currentStore.storeName ||

currentStore.name ||

"G-Glam";


/* =====================================================
   OWNER EMAIL
===================================================== */

currentOwnerEmail =

currentStore.ownerEmail ||

currentStore.email ||

user.email ||

"";


/* =====================================================
   STORE IMAGE
===================================================== */

const storeImage =

currentStore.storeImage ||

currentStore.image ||

currentStore.logo ||

currentStore.photoURL ||

"";


if(storeImage){

topStoreImage.src =
storeImage;

}else{

topStoreImage.src =
"logotrans.png";

}


/* =====================================================
   DISPLAY STORE
===================================================== */

storeNameStat.textContent =
currentStoreName;

topStoreName.textContent =
currentStoreName;


/* =====================================================
   STORE URL
===================================================== */

viewStoreBtn.href =

"index.html?store=" +

encodeURIComponent(
currentOwnerUid
);


/* =====================================================
   LOCAL STORAGE
===================================================== */

localStorage.setItem(
"storeId",
currentOwnerUid
);

localStorage.setItem(
"storeDocumentId",
currentStoreId
);

localStorage.setItem(
"storeName",
currentStoreName
);

localStorage.setItem(
"storeOwnerEmail",
currentOwnerEmail
);

localStorage.setItem(
"ownerEmail",
currentOwnerEmail
);

localStorage.setItem(
"ownerUid",
currentOwnerUid
);

localStorage.setItem(
"paymentStatus",
"approved"
);


/* =====================================================
   LOAD PRODUCTS
===================================================== */

await loadProducts();


/* =====================================================
   LOAD ORDERS
===================================================== */

await loadOrders();


return true;


}catch(error){

console.error(
"LOAD STORE ERROR:",
error
);


alert(

"❌ حدث خطأ أثناء تحميل بيانات المتجر.\n\n" +

error.message

);

return false;

}

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

try{

let snapshot;


try{

const q =
query(

collection(
db,
"products"
),

where(
"ownerUid",
"==",
currentOwnerUid
)

);

snapshot =
await getDocs(q);

}catch(error){

console.log(
"ownerUid products query failed:",
error
);


try{

const q2 =
query(

collection(
db,
"products"
),

where(
"storeId",
"==",
currentOwnerUid
)

);

snapshot =
await getDocs(q2);

}catch(error2){

console.log(
"storeId products query failed:",
error2
);


const q3 =
query(

collection(
db,
"products"
),

where(
"ownerEmail",
"==",
currentOwnerEmail
)

);

snapshot =
await getDocs(q3);

}

}


productsCount.textContent =
snapshot.size;


productsContainer.innerHTML =
"";


if(snapshot.empty){

productsContainer.innerHTML = `

<div class="empty">

لا توجد منتجات حاليًا.

<br><br>

<button
class="add-btn"
onclick="goAddProduct()">

➕ إضافة أول منتج

</button>

</div>

`;

return;

}


snapshot.forEach(

productDoc => {

const product =
productDoc.data();

const id =
productDoc.id;

const card =
document.createElement("div");

card.className =
"product";


const image =

product.image ||

(

Array.isArray(product.images) &&

product.images.length

?

product.images[0]

:

"logotrans.png"

);


card.innerHTML = `

<img

src="${escapeHtml(image)}"

alt="${escapeHtml(
product.name || "منتج"
)}"

onerror="this.src='logotrans.png';"

>


<h3>

${escapeHtml(
product.name ||
"بدون اسم"
)}

</h3>


<div class="product-price">

${Number(
product.price || 0
)} DA

</div>


<div class="product-stock">

المخزون:

${Number(
product.stock || 0
)}

</div>


<div class="product-buttons">


<button
class="edit-btn">

✏️ تعديل

</button>


<button
class="delete-btn">

🗑️ حذف

</button>


</div>

`;


card
.querySelector(".edit-btn")
.addEventListener(
"click",
function(){

window.location.href =

"edit-product.html?id=" +

encodeURIComponent(id);

}
);


card
.querySelector(".delete-btn")
.addEventListener(
"click",
function(){

deleteProduct(id);

}
);


productsContainer.appendChild(card);

});


}catch(error){

console.error(
"PRODUCTS ERROR:",
error
);


productsContainer.innerHTML = `

<div class="empty">

❌ حدث خطأ أثناء تحميل المنتجات.

<br><br>

${escapeHtml(
error.message || ""
)}

</div>

`;

}

}


/* =====================================================
   LOAD ORDERS
===================================================== */

try{

let snapshot;


try{

const q =
query(

collection(
db,
"orders"
),

where(
"ownerUid",
"==",
currentOwnerUid
)

);

snapshot =
await getDocs(q);

}catch(error){

console.log(
"ownerUid orders query failed:",
error
);


try{

const q2 =
query(

collection(
db,

),

where(
"storeId",
"==",
currentOwnerUid
)

);

snapshot =
await getDocs(q2);

}catch(error2){

const q3 =
query(

collection(
db,

),

await getDocs(q3);

/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(id){

const ok =
confirm(
"هل تريد حذف هذا المنتج؟"
);


if(!ok){

return;

}


try{

await deleteDoc(

doc(
db,
"products",
id
)

);


showSuccess(
"تم حذف المنتج بنجاح ✅"
);


await loadProducts();


}catch(error){

console.error(
"DELETE PRODUCT ERROR:",
error
);


showError(
"❌ حدث خطأ أثناء حذف المنتج."
);

}

}


/* =====================================================
   NAVIGATION
===================================================== */

window.goAddProduct =
function(){

window.location.href =
"add-product.html";

};


window.goOrders =
function(){

window.location.href =
"orders.html";

};


/* =====================================================
   LOGOUT
===================================================== */

document
.getElementById("logoutBtn")
.addEventListener(
"click",
async function(event){

event.preventDefault();


const ok =
confirm(
"هل تريد تسجيل الخروج؟"
);


if(!ok){

return;

}


try{

await signOut(auth);


localStorage.removeItem(
"storeId"
);

localStorage.removeItem(
"storeDocumentId"
);

localStorage.removeItem(
"ownerUid"
);

localStorage.removeItem(
"ownerEmail"
);

localStorage.removeItem(
"storeOwnerEmail"
);

localStorage.removeItem(
"storeName"
);

localStorage.removeItem(
"paymentStatus"
);


window.location.href =
"login.html";


}catch(error){

console.error(
"LOGOUT ERROR:",
error
);


showError(
"❌ تعذر تسجيل الخروج."
);

}

});


/* =====================================================
   SUCCESS
===================================================== */

function showSuccess(text){

const box =
document.getElementById(
"successMessage"
);


box.textContent =
text;


box.style.display =
"block";


setTimeout(
function(){

box.style.display =
"none";

},
3000
);

}


/* =====================================================
   ERROR
===================================================== */

function showError(text){

const box =
document.getElementById(
"errorMessage"
);


box.textContent =
text;


box.style.display =
"block";


setTimeout(
function(){

box.style.display =
"none";

},
4000
);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
   AUTHENTICATION
===================================================== */

onAuthStateChanged(

auth,

async function(user){

if(!user){

window.location.href =
"login.html";

return;

}


currentOwnerUid =
user.uid;

currentOwnerEmail =
user.email || "";


await loadStore();

});


/* =====================================================
   START
===================================================== */

console.log(
"G-Glam Store Dashboard Started"
);

</script>
