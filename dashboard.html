<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#F47B20"
>

<title>G-Glam | لوحة تحكم المتجر</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

/* =====================================================
   VARIABLES
===================================================== */

:root {

    --orange: #F47B20;
    --orange-dark: #DF6810;
    --orange-light: #FFF1E6;

    --bg: #F5F6F8;

    --sidebar: #FFFFFF;
    --card: #FFFFFF;

    --text: #252525;
    --dark: #252525;
    --dark-2: #333333;

    --muted: #777777;

    --border: #E5E7EB;

    --input: #FAFAFA;

    --success: #198754;
    --success-bg: #EAF7EF;

    --danger: #D92D20;
    --danger-bg: #FDECEC;

    --blue: #1769AA;
    --blue-bg: #EAF4FF;

    --dark-bg: #07111F;
    --dark-sidebar: #0A1726;
    --dark-card: #0D1B2A;
    --dark-card-2: #102234;

    --dark-text: #F4F7FB;
    --dark-muted: #AAB7C7;
    --dark-border: #1D334A;

    --shadow:
        0 8px 30px rgba(0, 0, 0, .06);

}


/* =====================================================
   RESET
===================================================== */

* {

    box-sizing: border-box;

    margin: 0;
    padding: 0;

    font-family:
        "Tajawal",
        Arial,
        sans-serif;

}


html {

    scroll-behavior: smooth;

}


body {

    min-height: 100vh;

    background: var(--bg);

    color: var(--text);

    transition:
        background .3s,
        color .3s;

}


button,
input,
textarea,
select {

    font-family: inherit;

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {

    position: fixed;

    top: 0;
    right: 0;

    width: 75px;
    height: 100vh;

    background: var(--sidebar);

    border-left:
        1px solid var(--border);

    overflow: hidden;

    z-index: 1100;

    transition: .3s;

    box-shadow:
        -4px 0 20px rgba(0, 0, 0, .04);

}


.sidebar:hover {

    width: 240px;

}


/* =====================================================
   LOGO
===================================================== */

.logo {

    height: 78px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-bottom:
        1px solid var(--border);

    padding: 10px;

    white-space: nowrap;

}


.logo img {

    width: 48px;
    height: 48px;

    object-fit: contain;

    display: block;

    transition: .3s;

}


.sidebar:hover .logo img {

    width: 130px;
    height: 55px;

}


/* =====================================================
   MENU
===================================================== */

.menu {

    padding:
        18px 10px;

}


.menu a {

    height: 52px;

    display: flex;

    align-items: center;

    gap: 15px;

    padding:
        0 10px;

    margin-bottom: 7px;

    color: #555;

    text-decoration: none;

    border-radius: 12px;

    white-space: nowrap;

    transition: .2s;

}


.menu a:hover {

    background: #F1F1F1;

    color: #222;

}


.menu a.active {

    background: var(--orange);

    color: white;

    box-shadow:
        0 6px 18px
        rgba(244, 123, 32, .22);

}


/* =====================================================
   ICON
===================================================== */

.icon {

    width: 35px;
    min-width: 35px;

    height: 35px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 18px;

    transition: .25s;

}


.icon i {

    width: 20px;

    text-align: center;

}


.menu a:hover .icon {

    transform:
        scale(1.08);

}


/* =====================================================
   MENU TEXT
===================================================== */

.text {

    opacity: 0;

    font-size: 14px;

    font-weight: 700;

    transition: .25s;

}


.sidebar:hover .text {

    opacity: 1;

}


/* =====================================================
   TOPBAR
===================================================== */

.topbar {

    position: fixed;

    top: 0;

    right: 75px;
    left: 0;

    height: 78px;

    background: var(--card);

    border-bottom:
        1px solid var(--border);

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 25px;

    z-index: 1000;

    box-shadow:
        0 2px 15px
        rgba(0, 0, 0, .04);

    transition:
        background .3s,
        border-color .3s;

}


/* =====================================================
   STORE TOP
===================================================== */

.store-top {

    display: flex;

    align-items: center;

    gap: 12px;

    min-width: 0;

}


.store-image {

    width: 48px;
    height: 48px;

    border-radius: 50%;

    object-fit: cover;

    border:
        2px solid #FFE0CA;

    background: #F3F3F3;

    flex-shrink: 0;

}


.store-details {

    display: flex;

    flex-direction: column;

    min-width: 0;

}


.store-label {

    color: #999;

    font-size: 11px;

    margin-bottom: 2px;

}


.store-top-name {

    max-width: 260px;

    color: #222;

    font-size: 16px;

    font-weight: 800;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* =====================================================
   TOP ACTIONS
===================================================== */

.topbar-actions {

    display: flex;

    align-items: center;

    gap: 9px;

}


/* =====================================================
   THEME BUTTON
===================================================== */

.theme-btn {

    width: 44px;
    height: 44px;

    border-radius: 12px;

    border:
        1px solid #E5E5E5;

    background: #F7F7F7;

    color: #333;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 18px;

    cursor: pointer;

    transition: .25s;

}


.theme-btn:hover {

    background: #FFF1E6;

    border-color: #FFD2B0;

    transform:
        translateY(-1px);

}


/* =====================================================
   VIEW STORE
===================================================== */

.view-store-btn {

    height: 44px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 7px;

    padding:
        0 15px;

    background:
        var(--orange-light);

    color:
        var(--orange-dark);

    border:
        1px solid #FFE0CA;

    border-radius: 12px;

    text-decoration: none;

    font-size: 13px;

    font-weight: 700;

    white-space: nowrap;

    transition: .2s;

}


.view-store-btn:hover {

    background:
        var(--orange);

    color: white;

}


/* =====================================================
   CONTENT
===================================================== */

.content {

    margin-right: 75px;

    padding:
        103px
        25px
        30px;

    transition: .3s;

}


/* =====================================================
   MESSAGES
===================================================== */

.message {

    display: none;

    padding:
        13px 15px;

    border-radius: 11px;

    margin-bottom: 18px;

    text-align: center;

    font-size: 14px;

}


.success {

    color: var(--success);

    background:
        var(--success-bg);

    border:
        1px solid #C9E8D5;

}


.error {

    color: var(--danger);

    background:
        var(--danger-bg);

    border:
        1px solid #F0CACA;

}


/* =====================================================
   STATS
===================================================== */

.stats {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 18px;

    margin-bottom: 22px;

}


.stat {

    position: relative;

    overflow: hidden;

    background: var(--card);

    border:
        1px solid var(--border);

    border-radius: 18px;

    padding: 22px;

    box-shadow: var(--shadow);

    transition:
        transform .25s,
        background .3s,
        border-color .3s;

}


.stat:hover {

    transform:
        translateY(-2px);

}


.stat::after {

    content: "";

    position: absolute;

    bottom: 0;
    right: 0;

    width: 100%;
    height: 3px;

    background:
        var(--orange);

    opacity: .8;

}


.stat-title {

    display: flex;

    align-items: center;

    gap: 8px;

    color: var(--muted);

    font-size: 14px;

    margin-bottom: 12px;

}


.stat-title i {

    color:
        var(--orange);

    font-size: 16px;

}


.stat-value {

    color:
        var(--dark);

    font-size: 30px;

    font-weight: 800;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

}


/* =====================================================
   QUICK ACTIONS
===================================================== */

.actions {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 18px;

    margin-bottom: 22px;

}


.action {

    position: relative;

    overflow: hidden;

    width: 100%;

    background:
        var(--card);

    border:
        1px solid var(--border);

    border-radius: 18px;

    padding: 23px;

    text-align: right;

    cursor: pointer;

    box-shadow:
        var(--shadow);

    transition:
        transform .25s,
        box-shadow .25s,
        background .3s,
        border-color .3s;

    color:
        var(--text);

}


.action::before {

    content: "";

    position: absolute;

    right: 0;
    top: 0;

    width: 4px;
    height: 100%;

    background:
        var(--orange);

    transform:
        scaleY(0);

    transform-origin: center;

    transition: .25s;

}


.action:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 8px 25px
        rgba(0, 0, 0, .09);

}


.action:hover::before {

    transform:
        scaleY(1);

}


.action h3 {

    display: flex;

    align-items: center;

    gap: 9px;

    color:
        var(--dark);

    font-size: 18px;

    margin-bottom: 8px;

}


.action h3 i {

    color:
        var(--orange);

    font-size: 18px;

}


.action p {

    color:
        var(--muted);

    font-size: 14px;

}


/* =====================================================
   SECTION
===================================================== */

.section {

    background:
        var(--card);

    border:
        1px solid var(--border);

    padding: 22px;

    border-radius: 18px;

    box-shadow:
        var(--shadow);

    margin-bottom: 22px;

    transition:
        background .3s,
        border-color .3s;

}


.section-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 20px;

}


.section-header h2 {

    display: flex;

    align-items: center;

    gap: 9px;

    color:
        var(--dark);

    font-size: 21px;

}


.section-header h2 i {

    color:
        var(--orange);

    font-size: 20px;

}


/* =====================================================
   ADD BUTTON
===================================================== */

.add-btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 7px;

    background:
        var(--orange);

    color: white;

    border: none;

    padding:
        11px 18px;

    border-radius: 11px;

    cursor: pointer;

    font-size: 14px;

    font-weight: 700;

    transition: .2s;

    box-shadow:
        0 4px 10px
        rgba(244, 123, 32, .18);

}


.add-btn:hover {

    background:
        var(--orange-dark);

    transform:
        translateY(-1px);

}


/* =====================================================
   PRODUCTS
===================================================== */

.products {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 17px;

}


/* =====================================================
   PRODUCT
===================================================== */

.product {

    background:
        var(--card);

    border:
        1px solid var(--border);

    border-radius: 16px;

    padding: 10px;

    transition:
        transform .25s,
        box-shadow .25s,
        background .3s,
        border-color .3s;

    overflow: hidden;

}


.product:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 8px 25px
        rgba(0, 0, 0, .08);

}


/* =====================================================
   PRODUCT IMAGE
===================================================== */

.product img {

    width: 100%;

    height: 190px;

    object-fit: cover;

    border-radius: 12px;

    background: #F2F2F2;

    display: block;

}


/* =====================================================
   PRODUCT NAME
===================================================== */

.product h3 {

    color:
        var(--dark);

    font-size: 16px;

    margin:
        12px 6px 7px;

}


/* =====================================================
   PRODUCT PRICE
===================================================== */

.product-price {

    color:
        var(--orange);

    font-size: 16px;

    font-weight: 700;

    margin:
        0 6px 8px;

}


/* =====================================================
   PRODUCT STOCK
===================================================== */

.product-stock {

    color:
        var(--muted);

    font-size: 13px;

    margin:
        0 6px 12px;

}


/* =====================================================
   PRODUCT BUTTONS
===================================================== */

.product-buttons {

    display: flex;

    gap: 7px;

}


.product-buttons button {

    flex: 1;

    padding:
        10px 5px;

    border: none;

    border-radius: 9px;

    cursor: pointer;

    font-size: 13px;

    font-weight: 700;

    transition: .2s;

}


.edit-btn {

    background:
        var(--orange-light);

    color:
        var(--orange-dark);

}


.edit-btn:hover {

    background:
        #FFE2CC;

}


.delete-btn {

    background:
        var(--danger-bg);

    color:
        #B52B39;

}


.delete-btn:hover {

    background:
        #F6D1D6;

}


/* =====================================================
   EMPTY
===================================================== */

.empty {

    grid-column:
        1 / -1;

    background:
        #FAFAFA;

    border:
        1px dashed #DDD;

    padding:
        40px 20px;

    text-align: center;

    color:
        var(--muted);

    border-radius: 14px;

    line-height: 1.8;

}


/* =====================================================
   DARK MODE
===================================================== */

body.dark-mode {

    background:
        var(--dark-bg);

    color:
        var(--dark-text);

}


/* =====================================================
   DARK SIDEBAR
===================================================== */

body.dark-mode .sidebar {

    background:
        var(--dark-sidebar);

    border-left-color:
        var(--dark-border);

    box-shadow:
        -4px 0 20px
        rgba(0, 0, 0, .35);

}


body.dark-mode .logo {

    border-bottom-color:
        var(--dark-border);

}


body.dark-mode .menu a {

    color:
        var(--dark-muted);

}


body.dark-mode .menu a:hover {

    background:
        #17283A;

    color:
        #FFFFFF;

}


body.dark-mode .menu a.active {

    background:
        var(--orange);

    color:
        #FFFFFF;

}


/* =====================================================
   DARK TOPBAR
===================================================== */

body.dark-mode .topbar {

    background:
        var(--dark-sidebar);

    border-bottom-color:
        var(--dark-border);

    box-shadow:
        0 2px 15px
        rgba(0, 0, 0, .25);

}


body.dark-mode .store-label {

    color:
        #7F91A6;

}


body.dark-mode .store-top-name {

    color:
        var(--dark-text);

}


body.dark-mode .store-image {

    background:
        #142538;

    border-color:
        #5A3A22;

}


/* =====================================================
   DARK THEME BUTTON
===================================================== */

body.dark-mode .theme-btn {

    background:
        #17283A;

    color:
        #FFD28F;

    border-color:
        #29425B;

}


body.dark-mode .theme-btn:hover {

    background:
        #20364B;

}


/* =====================================================
   DARK VIEW STORE
===================================================== */

body.dark-mode .view-store-btn {

    background:
        #17283A;

    color:
        #FF9A4D;

    border-color:
        #5A3A22;

}


body.dark-mode .view-store-btn:hover {

    background:
        var(--orange);

    color:
        #FFFFFF;

}


/* =====================================================
   DARK CARDS
===================================================== */

body.dark-mode .stat,
body.dark-mode .action,
body.dark-mode .section {

    background:
        var(--dark-card);

    border-color:
        var(--dark-border);

    box-shadow:
        0 8px 28px
        rgba(0, 0, 0, .30);

}


body.dark-mode .stat-title {

    color:
        var(--dark-muted);

}


body.dark-mode .stat-title i {

    color:
        #FF8C32;

}


body.dark-mode .stat-value {

    color:
        var(--dark-text);

}


body.dark-mode .action {

    color:
        var(--dark-text);

}


body.dark-mode .action h3 {

    color:
        var(--dark-text);

}


body.dark-mode .action h3 i {

    color:
        #FF8C32;

}


body.dark-mode .action p {

    color:
        var(--dark-muted);

}


body.dark-mode .section-header h2 {

    color:
        var(--dark-text);

}


body.dark-mode .section-header h2 i {

    color:
        #FF8C32;

}


/* =====================================================
   DARK PRODUCTS
===================================================== */

body.dark-mode .product {

    background:
        var(--dark-card-2);

    border-color:
        var(--dark-border);

}


body.dark-mode .product:hover {

    background:
        #13283B;

    box-shadow:
        0 8px 28px
        rgba(0, 0, 0, .35);

}


body.dark-mode .product img {

    background:
        #142538;

}


body.dark-mode .product h3 {

    color:
        var(--dark-text);

}


body.dark-mode .product-price {

    color:
        #FF8C32;

}


body.dark-mode .product-stock {

    color:
        var(--dark-muted);

}


/* =====================================================
   DARK PRODUCT BUTTONS
===================================================== */

body.dark-mode .edit-btn {

    background:
        #17283A;

    color:
        #FF9A4D;

}


body.dark-mode .edit-btn:hover {

    background:
        #20364B;

}


body.dark-mode .delete-btn {

    background:
        #351B20;

    color:
        #FF8B86;

}


body.dark-mode .delete-btn:hover {

    background:
        #452126;

}


/* =====================================================
   DARK EMPTY
===================================================== */

body.dark-mode .empty {

    background:
        #102234;

    border-color:
        #29425B;

    color:
        var(--dark-muted);

}


/* =====================================================
   DARK MESSAGES
===================================================== */

body.dark-mode .success {

    background:
        #173426;

    color:
        #8DE0B2;

    border-color:
        #285B40;

}


body.dark-mode .error {

    background:
        #351B20;

    color:
        #FF8B86;

    border-color:
        #5A292E;

}


/* =====================================================
   DARK SCROLLBAR
===================================================== */

body.dark-mode::-webkit-scrollbar-track {

    background:
        var(--dark-bg);

}


body.dark-mode::-webkit-scrollbar-thumb {

    background:
        #263E57;

}


body.dark-mode::-webkit-scrollbar-thumb:hover {

    background:
        var(--orange);

}


/* =====================================================
   TABLET
===================================================== */

@media (max-width: 1000px) {

    .products {

        grid-template-columns:
            repeat(3, 1fr);

    }

}


/* =====================================================
   TABLET 2
===================================================== */

@media (max-width: 800px) {

    .sidebar {

        width: 65px;

    }


    .sidebar:hover {

        width: 210px;

    }


    .topbar {

        right: 65px;

    }


    .content {

        margin-right: 65px;

        padding-top: 93px;

    }


    .stats {

        grid-template-columns:
            repeat(3, 1fr);

        gap: 10px;

    }


    .stat {

        padding: 16px;

    }


    .stat-value {

        font-size: 24px;

    }


    .actions {

        grid-template-columns:
            1fr;

    }


    .products {

        grid-template-columns:
            repeat(2, 1fr);

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 550px) {

    .sidebar {

        width: 60px;

    }


    .sidebar:hover {

        width: 200px;

    }


    .topbar {

        right: 60px;

        height: 68px;

        padding:
            0 12px;

    }


    .content {

        margin-right: 60px;

        padding:
            83px
            12px
            20px;

    }


    .store-image {

        width: 42px;
        height: 42px;

    }


    .store-label {

        display: none;

    }


    .store-top-name {

        max-width: 120px;

        font-size: 14px;

    }


    .theme-btn {

        width: 40px;
        height: 40px;

    }


    .view-store-btn {

        width: 40px;
        height: 40px;

        padding: 0;

        font-size: 0;

    }


    .view-store-btn i {

        font-size: 17px;

    }


    .stats {

        grid-template-columns:
            1fr;

    }


    .actions {

        grid-template-columns:
            1fr;

    }


    .section {

        padding: 15px;

    }


    .section-header {

        gap: 10px;

    }


    .section-header h2 {

        font-size: 18px;

    }


    .add-btn {

        padding:
            10px 12px;

        font-size: 12px;

    }


    .products {

        grid-template-columns:
            1fr 1fr;

        gap: 10px;

    }


    .product img {

        height: 150px;

    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media (max-width: 380px) {

    .products {

        grid-template-columns:
            1fr;

    }


    .product img {

        height: 190px;

    }


    .view-store-btn {

        font-size: 0;

        width: 40px;
        height: 40px;

        padding: 0;

        justify-content: center;

    }


    .view-store-btn::before {

        font-family:
            "Font Awesome 6 Free";

        font-weight: 900;

        content:
            "\f06e";

        font-size: 18px;

    }

}


/* =====================================================
   SCROLLBAR
===================================================== */

::-webkit-scrollbar {

    width: 7px;

}


::-webkit-scrollbar-track {

    background:
        #F1F1F1;

}

/* =====================================================

async function loadStore() {

    try {

        const user =
            auth.currentUser;


        if (!user) {

            window.location.href =
                "login.html";

            return false;

        }


        /* =================================================
           AUTH UID
        ================================================= */

        currentOwnerUid =
            user.uid;

        currentOwnerEmail =
            user.email || "";


        /* =================================================
           METHOD 1
           stores/{UID}
        ================================================= */

        let storeSnapshot =
            await getDoc(

                doc(
                    db,
                    "stores",
                    currentOwnerUid
                )

            );


        /* =================================================
           METHOD 2
           ownerUid == UID
        ================================================= */

        if (
            !storeSnapshot.exists()
        ) {

            console.log(
                "Searching store by ownerUid..."
            );


            const ownerQuery =
                query(

                    collection(
                        db,
                        "stores"
                    ),

                    where(
                        "ownerUid",
                        "==",
                        currentOwnerUid
                    )

                );


            const ownerSnapshot =
                await getDocs(
                    ownerQuery
                );


            if (
                !ownerSnapshot.empty
            ) {

                storeSnapshot =
                    ownerSnapshot.docs[0];

            }

        }


        /* =================================================
           METHOD 3
           ownerEmail == EMAIL
           FALLBACK ONLY
        ================================================= */

        if (
            !storeSnapshot.exists() &&
            currentOwnerEmail
        ) {

            console.log(
                "Searching store by ownerEmail..."
            );


            const emailQuery =
                query(

                    collection(
                        db,
                        "stores"
                    ),

                    where(
                        "ownerEmail",
                        "==",
                        currentOwnerEmail
                    )

                );


            const emailSnapshot =
                await getDocs(
                    emailQuery
                );


            if (
                !emailSnapshot.empty
            ) {

                storeSnapshot =
                    emailSnapshot.docs[0];

            }

        }


        /* =================================================
           STORE NOT FOUND
        ================================================= */

        if (
            !storeSnapshot.exists()
        ) {

            alert(

                "⚠️ لم يتم العثور على متجر مرتبط بهذا الحساب.\n\n" +

                "UID:\n" +

                currentOwnerUid

            );


            await signOut(
                auth
            );


            window.location.href =
                "login.html";


            return false;

        }


        /* =================================================
           STORE DATA
        ================================================= */

        currentStore =
            storeSnapshot.data();


        currentStoreId =
            storeSnapshot.id;


        /* =================================================
           OWNER UID VALIDATION
           UID remains primary identifier
        ================================================= */

        if (
            currentStore.ownerUid &&
            currentStore.ownerUid !==
                currentOwnerUid
        ) {

            console.error(
                "STORE OWNER UID MISMATCH"
            );


            alert(
                "⚠️ هذا المتجر غير مرتبط بحسابك."
            );


            await signOut(
                auth
            );


            window.location.href =
                "login.html";


            return false;

        }


        /* =================================================
           STATUS
        ================================================= */

        const status =
            String(
                currentStore.status ||
                "pending"
            )
            .toLowerCase()
            .trim();


        if (

            status === "pending" ||

            status === "waiting" ||

            status === "review"

        ) {

            alert(
                "⏳ طلب إنشاء متجرك مازال قيد المراجعة من طرف الإدارة."
            );


            await signOut(
                auth
            );


            window.location.href =
                "login.html";


            return false;

        }


        if (

            status === "rejected" ||

            status === "refused"

        ) {

            const reason =
                currentStore.rejectionReason ||
                "لم يتم ذكر سبب الرفض.";


            alert(

                "❌ تم رفض طلب إنشاء المتجر.\n\n" +

                "سبب الرفض:\n" +

                reason

            );


            await signOut(
                auth
            );


            window.location.href =
                "login.html";


            return false;

        }


        if (

            status !== "active" &&

            status !== "approved"

        ) {

            alert(
                "⚠️ لا يمكنك الدخول إلى لوحة التحكم حاليًا."
            );


            await signOut(
                auth
            );


            window.location.href =
                "login.html";


            return false;

        }


        /* =================================================
           STORE NAME
        ================================================= */

        currentStoreName =

            currentStore.storeName ||

            currentStore.name ||

            "G-Glam";


        /* =================================================
           OWNER EMAIL
        ================================================= */

        currentOwnerEmail =

            currentStore.ownerEmail ||

            currentStore.email ||

            user.email ||

            "";


        /* =================================================
           STORE IMAGE
        ================================================= */

        const storeImage =

            currentStore.storeImage ||

            currentStore.image ||

            currentStore.logo ||

            currentStore.photoURL ||

            "";


        topStoreImage.src =

            storeImage ||

            "logotrans.png";


        /* =================================================
           DISPLAY
        ================================================= */

        storeNameStat.textContent =
            currentStoreName;


        topStoreName.textContent =
            currentStoreName;


        /* =================================================
           VIEW STORE
           Uses real store document ID
        ================================================= */

        viewStoreBtn.href =

            "index.html?store=" +

            encodeURIComponent(
                currentStoreId
            );


        /* =================================================
           LOCAL STORAGE
        ================================================= */

        localStorage.setItem(
            "storeId",
            currentStoreId
        );


        localStorage.setItem(
            "storeDocumentId",
            currentStoreId
        );


        localStorage.setItem(
            "storeOwnerUid",
            currentOwnerUid
        );


        localStorage.setItem(
            "storeName",
            currentStoreName
        );


        localStorage.setItem(
            "storeOwnerEmail",
            currentOwnerEmail
        );


        localStorage.setItem(
            "ownerEmail",
            currentOwnerEmail
        );


        localStorage.setItem(
            "ownerUid",
            currentOwnerUid
        );


        localStorage.setItem(
            "paymentStatus",
            "approved"
        );


        /* =================================================
           KEEP SLUG FOR OLD FILES
        ================================================= */

        localStorage.setItem(
            "storeSlug",
            currentStore.slug || ""
        );


        /* =================================================
           LOAD DATA
        ================================================= */

        await loadProducts();

        await loadOrders();


        return true;


    } catch (error) {

        console.error(
            "LOAD STORE ERROR:",
            error
        );


        alert(

            "❌ حدث خطأ أثناء تحميل بيانات المتجر.\n\n" +

            error.message

        );


        return false;

    }

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts() {

    try {

        let snapshot;


        /* =================================================
           METHOD 1
           ownerUid
        ================================================= */

        try {

            const q =
                query(

                    collection(
                        db,
                        "products"
                    ),

                    where(
                        "ownerUid",
                        "==",
                        currentOwnerUid
                    )

                );


            snapshot =
                await getDocs(
                    q
                );


        } catch (error) {

            console.log(
                "ownerUid products query failed:",
                error
            );


            /* =============================================
               METHOD 2
               storeId
            ============================================= */

            try {

                const q2 =
                    query(

                        collection(
                            db,
                            "products"
                        ),

                        where(
                            "storeId",
                            "==",
                            currentStoreId
                        )

                    );


                snapshot =
                    await getDocs(
                        q2
                    );


            } catch (error2) {

                console.log(
                    "storeId products query failed:",
                    error2
                );


                /* =========================================
                   METHOD 3
                   ownerEmail
                   FALLBACK ONLY
                ========================================= */

                const q3 =
                    query(

                        collection(
                            db,
                            "products"
                        ),

                        where(
                            "ownerEmail",
                            "==",
                            currentOwnerEmail
                        )

                    );


                snapshot =
                    await getDocs(
                        q3
                    );

            }

        }


        productsCount.textContent =
            snapshot.size;


        productsContainer.innerHTML =
            "";


        /* =================================================
           EMPTY
        ================================================= */

        if (
            snapshot.empty
        ) {

            productsContainer.innerHTML = `

                <div class="empty">

                    <i class="fa-solid fa-box-open"></i>

                    <br>

                    لا توجد منتجات حاليًا.

                    <br><br>

                    <button
                        type="button"
                        class="add-btn"
                        onclick="goAddProduct()"
                    >

                        <i class="fa-solid fa-circle-plus"></i>

                        إضافة أول منتج

                    </button>

                </div>

            `;


            return;

        }


        /* =================================================
           PRODUCTS LOOP
        ================================================= */

        snapshot.forEach(

            productDoc => {

                const product =
                    productDoc.data();


                const id =
                    productDoc.id;


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "product";


                const image =

                    product.image ||

                    (

                        Array.isArray(
                            product.images
                        ) &&

                        product.images.length

                            ? product.images[0]

                            : "logotrans.png"

                    );


                card.innerHTML = `

                    <img

                        src="${escapeHtml(
                            image
                        )}"

                        alt="${escapeHtml(
                            product.name ||
                            "منتج"
                        )}"

                        onerror="
                            this.src='logotrans.png';
                        "

                    >


                    <h3>

                        ${escapeHtml(
                            product.name ||
                            "بدون اسم"
                        )}

                    </h3>


                    <div class="product-price">

                        ${Number(
                            product.price || 0
                        ).toLocaleString("fr-DZ")}

                        DA

                    </div>


                    <div class="product-stock">

                        المخزون:

                        ${Number(
                            product.stock || 0
                        )}

                    </div>


                    <div class="product-buttons">

                        <button
                            type="button"
                            class="edit-btn"
                        >

                            <i class="fa-solid fa-pen-to-square"></i>

                            تعديل

                        </button>


                        <button
                            type="button"
                            class="delete-btn"
                        >

                            <i class="fa-solid fa-trash"></i>

                            حذف

                        </button>

                    </div>

                `;


                /* =========================================
                   EDIT
                ========================================= */

                card
                    .querySelector(
                        ".edit-btn"
                    )
                    .addEventListener(

                        "click",

                        function () {

                            window.location.href =

                                "edit-product.html?id=" +

                                encodeURIComponent(
                                    id
                                );

                        }

                    );


                /* =========================================
                   DELETE
                ========================================= */

                card
                    .querySelector(
                        ".delete-btn"
                    )
                    .addEventListener(

                        "click",

                        function () {

                            deleteProduct(
                                id
                            );

                        }

                    );


                productsContainer.appendChild(
                    card
                );

            }

        );


    } catch (error) {

        console.error(
            "PRODUCTS ERROR:",
            error
        );


        productsContainer.innerHTML = `

            <div class="empty">

                <i class="fa-solid fa-circle-exclamation"></i>

                <br>

                حدث خطأ أثناء تحميل المنتجات.

                <br><br>

                ${escapeHtml(
                    error.message || ""
                )}

            </div>

        `;

    }

}

===================================================== */

async function deleteProduct(
    id
) {

    const ok =
        confirm(
            "هل تريد حذف هذا المنتج؟"
        );


    if (!ok) {

        return;

    }


    try {

        await deleteDoc(

            doc(
                db,
                "products",
                id
            )

        );


        showSuccess(
            "تم حذف المنتج بنجاح ✅"
        );


        await loadProducts();


    } catch (error) {

        console.error(
            "DELETE PRODUCT ERROR:",
            error
        );


        showError(
            "❌ حدث خطأ أثناء حذف المنتج."
        );

    }

}

            const ok =
                confirm(

                );


            if (!ok) {

                return;

            }


            try {

                await signOut(

                localStorage.removeItem(
                    "storeId"

                localStorage.removeItem(

                localStorage.removeItem(
                    "storeOwnerUid"

                localStorage.removeItem(
                    "ownerEmail"

                localStorage.removeItem(

                localStorage.removeItem(

                );


                localStorage.removeItem(
                    "storeSlug"
                );


                localStorage.removeItem(
                    "paymentStatus"
                );


                /* =========================================
                   IMPORTANT:
                   Do NOT remove gGlamDarkMode
                   because theme is shared between
                   dashboard / orders / add-product
                ========================================= */


                window.location.href =
                    "login.html";


            } catch (error) {

                console.error(
                    "LOGOUT ERROR:",
                    error
                );


                showError(
                    "❌ تعذر تسجيل الخروج."
                );

            }

        }

    );


/* =====================================================
   SUCCESS MESSAGE
===================================================== */

function showSuccess(
    text
) {

    const box =
        document.getElementById(
            "successMessage"
        );


    box.textContent =
        text;


    box.style.display =
        "block";


    setTimeout(

        function () {

            box.style.display =
                "none";

        },

        3000

    );

}


/* =====================================================
   ERROR MESSAGE
===================================================== */

function showError(
    text
) {

    const box =
        document.getElementById(
            "errorMessage"
        );


    box.textContent =
        text;


    box.style.display =
        "block";


    setTimeout(

        function () {

            box.style.display =
                "none";

        },

        4000

    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(

    auth,

    async function (user) {

        if (!user) {

            window.location.href =
                "login.html";

            return;

        }


        currentOwnerUid =
            user.uid;


        currentOwnerEmail =
            user.email || "";


        await loadStore();

    }

);


/* =====================================================
   START
===================================================== */

console.log(
    "G-Glam Store Dashboard Started"
);

</script>
