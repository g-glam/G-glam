<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | لوحة التحكم</title>

<style>

:root{
    --bg:#F5F0E8;
    --card:#FFFFFF;
    --text:#222;
    --muted:#777;
    --accent:#B89B7A;
    --dark:#222;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

.header{
    height:75px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    box-shadow:0 2px 12px rgba(0,0,0,.06);
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    font-size:28px;
    font-weight:800;
}

.menu-btn{
    width:45px;
    height:45px;
    border:none;
    border-radius:14px;
    background:var(--bg);
    font-size:22px;
    cursor:pointer;
}

.store-name{
    font-weight:bold;
    font-size:16px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px 15px 100px;
}

.welcome{
    margin-bottom:25px;
}

.welcome h1{
    font-size:27px;
    margin-bottom:7px;
}

.welcome p{
    color:var(--muted);
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:#fff;
    border-radius:18px;
    padding:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.stat-title{
    color:var(--muted);
    font-size:14px;
    margin-bottom:10px;
}

.stat-value{
    font-size:25px;
    font-weight:bold;
}

.actions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-bottom:25px;
}

.action{
    background:#fff;
    border:none;
    border-radius:18px;
    padding:22px;
    text-align:right;
    cursor:pointer;
    box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.action h3{
    margin-bottom:7px;
    font-size:18px;
}

.action p{
    color:var(--muted);
    font-size:14px;
}

.products-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.products-title h2{
    font-size:22px;
}

.add-btn{
    background:var(--dark);
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:14px;
    cursor:pointer;
    font-size:15px;
}

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.product{
    background:#fff;
    border-radius:18px;
    padding:10px;
    box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.product img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:14px;
    display:block;
}

.product h3{
    font-size:16px;
    margin:10px 5px 5px;
}

.product-price{
    font-weight:bold;
    margin:0 5px 10px;
}

.product-buttons{
    display:flex;
    gap:7px;
}

.product-buttons button{
    flex:1;
    padding:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
}

.edit-btn{
    background:var(--bg);
}

.delete-btn{
    background:#f1dede;
    color:#9b3030;
}

.empty{
    background:#fff;
    border-radius:18px;
    padding:35px;
    text-align:center;
    color:var(--muted);
    grid-column:1/-1;
}

.loading{
    text-align:center;
    padding:35px;
    color:var(--muted);
}

.side-menu{
    position:fixed;
    top:0;
    right:-300px;
    width:280px;
    height:100vh;
    background:#fff;
    z-index:100;
    box-shadow:-5px 0 20px rgba(0,0,0,.12);
    padding:25px 20px;
    transition:.3s;
}

.side-menu.open{
    right:0;
}

.side-menu h2{
    margin-bottom:25px;
}

.side-menu button{
    width:100%;
    border:none;
    background:var(--bg);
    padding:15px;
    margin-bottom:10px;
    border-radius:12px;
    text-align:right;
    cursor:pointer;
    font-size:15px;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    z-index:90;
    display:none;
}

.overlay.show{
    display:block;
}

@media(max-width:800px){

    .products{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .stats{
        grid-template-columns:1fr;
    }

    .actions{
        grid-template-columns:1fr;
    }

    .header{
        padding:0 12px;
    }

    .welcome h1{
        font-size:23px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .product img{
        height:150px;
    }

}

</style>

</head>

<body>

<header class="header">

<button
class="menu-btn"
id="menuBtn">
☰
</button>

<div class="logo">
G-Glam
</div>

<div
class="store-name"
id="storeName">
G-Glam
</div>

</header>


<div
class="overlay"
id="overlay">
</div>


<div
class="side-menu"
id="sideMenu">

<h2>G-Glam</h2>

<button onclick="goAddProduct()">
➕ إضافة منتج
</button>

<button onclick="goOrders()">
📦 الطلبات
</button>

<button onclick="closeMenu()">
✕ إغلاق
</button>

</div>


<main class="container">

<div class="welcome">

<h1>
مرحبًا بك 👋
</h1>

<p>
إدارة متجرك من مكان واحد
</p>

</div>


<div class="stats">

<div class="stat">

<div class="stat-title">
عدد المنتجات
</div>

<div
class="stat-value"
id="productsCount">
0
</div>

</div>


<div class="stat">

<div class="stat-title">
عدد الطلبات
</div>

<div
class="stat-value"
id="ordersCount">
0
</div>

</div>


<div class="stat">

<div class="stat-title">
اسم المتجر
</div>

<div
class="stat-value"
id="storeNameStat">
G-Glam
</div>

</div>

</div>


<div class="actions">

<button
class="action"
onclick="goAddProduct()">

<h3>
➕ إضافة منتج
</h3>

<p>
أضف منتجًا جديدًا إلى متجرك
</p>

</button>


<button
class="action"
onclick="goOrders()">

<h3>
📦 الطلبات
</h3>

<p>
عرض وإدارة طلبات الزبائن
</p>

</button>

</div>


<div class="products-title">

<h2>
منتجاتي
</h2>

<button
class="add-btn"
onclick="goAddProduct()">

+ إضافة منتج

</button>

</div>


<div
class="products"
id="productsContainer">

<div class="loading">
جاري تحميل المنتجات...
</div>

</div>

</main>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs,
    deleteDoc,
    doc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

    authDomain:
    "g-glam.firebaseapp.com",

    projectId:
    "g-glam",

    storageBucket:
    "g-glam.firebasestorage.app",

    messagingSenderId:
    "997228419719",

    appId:
    "1:997228419719:web:f9d88de7ea2c6f457e3622",

    measurementId:
    "G-WX1K1F83F6"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


/* =========================
   ELEMENTS
========================= */

const productsContainer =
    document.getElementById(
        "productsContainer"
    );


const productsCount =
    document.getElementById(
        "productsCount"
    );


const ordersCount =
    document.getElementById(
        "ordersCount"
    );


/* =========================
   MENU
========================= */

const menuBtn =
    document.getElementById(
        "menuBtn"
    );


const sideMenu =
    document.getElementById(
        "sideMenu"
    );


const overlay =
    document.getElementById(
        "overlay"
    );


menuBtn.addEventListener(
    "click",
    function(){

        sideMenu.classList.add(
            "open"
        );

        overlay.classList.add(
            "show"
        );

    }
);


overlay.addEventListener(
    "click",
    closeMenu
);


window.closeMenu =
function(){

    sideMenu.classList.remove(
        "open"
    );

    overlay.classList.remove(
        "show"
    );

};


/* =========================
   PRODUCTS
========================= */

async function loadProducts(){

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "products"
                )
            );


        productsContainer.innerHTML =
            "";


        productsCount.textContent =
            snapshot.size;


        if(snapshot.empty){

            productsContainer.innerHTML = `

                <div class="empty">

                    لا توجد منتجات حاليًا

                </div>

            `;

            return;

        }


        snapshot.forEach(
            function(productDoc){

                const product =
                    productDoc.data();


                const id =
                    productDoc.id;


                const name =
                    product.name ||
                    product.title ||
                    "منتج";


                const price =
                    product.price ??
                    product.prix ??
                    0;


                const image =
                    product.image ||
                    product.imageUrl ||
                    product.photo ||
                    "https://via.placeholder.com/400x400?text=G-Glam";


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "product";


                card.innerHTML = `

                    <img
                        src="${image}"
                        alt="${name}"
                        onerror="this.src='https://via.placeholder.com/400x400?text=G-Glam'"
                    >

                    <h3>
                        ${name}
                    </h3>

                    <div class="product-price">
                        ${price} دج
                    </div>

                    <div class="product-buttons">

                        <button
                            class="edit-btn"
                            onclick="editProduct('${id}')">

                            تعديل

                        </button>


                        <button
                            class="delete-btn"
                            onclick="deleteProduct('${id}')">

                            حذف

                        </button>

                    </div>

                `;


                productsContainer.appendChild(
                    card
                );

            }
        );


    }

    catch(error){

        console.error(
            "Firebase error:",
            error
        );


        productsContainer.innerHTML = `

            <div class="empty">

                حدث خطأ أثناء تحميل المنتجات

                <br><br>

                ${error.message}

            </div>

        `;

    }

}


/* =========================
   ORDERS COUNT
========================= */

async function loadOrdersCount(){

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "orders"
                )
            );


        ordersCount.textContent =
            snapshot.size;

    }

    catch(error){

        console.error(
            "Orders error:",
            error
        );

        ordersCount.textContent =
            "0";

    }

}


/* =========================
   DELETE PRODUCT
========================= */

window.deleteProduct =
async function(id){

    const confirmDelete =
        confirm(
            "هل أنت متأكد من حذف هذا المنتج؟"
        );


    if(!confirmDelete){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "products",
                id
            )
        );


        alert(
            "تم حذف المنتج بنجاح"
        );


        loadProducts();

    }

    catch(error){

        console.error(
            error
        );


        alert(
            "حدث خطأ أثناء حذف المنتج"
        );

    }

};


/* =========================
   EDIT PRODUCT
========================= */

window.editProduct =
function(id){

    window.location.href =
        "edit-product.html?id=" +
        encodeURIComponent(id);

};


/* =========================
   ADD PRODUCT
========================= */

window.goAddProduct =
function(){

    window.location.href =
        "add-product.html";

};


/* =========================
   ORDERS
========================= */

window.goOrders =
function(){

    window.location.href =
        "orders.html";

};


/* =========================
   START
========================= */

loadProducts();

loadOrdersCount();

</script>

</body>

</html>
