<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | لوحة تحكم المتجر</title>

<!-- Tajawal -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>

/* =====================================================
   COLORS
===================================================== */

:root{

--orange:#F47B20;
--orange-dark:#DF6810;

--bg:#F6F6F6;
--card:#FFFFFF;

--dark:#252525;
--text:#333333;
--muted:#888888;

--border:#E8E8E8;

--success:#198754;
--success-bg:#E8F6EE;

--danger:#DC3545;
--danger-bg:#FBE8EB;

--shadow:0 4px 18px rgba(0,0,0,.055);

}


/* =====================================================
   RESET
===================================================== */

*{

box-sizing:border-box;

margin:0;
padding:0;

font-family:"Tajawal",sans-serif;

}


/* =====================================================
   BODY
===================================================== */

body{

background:var(--bg);

color:var(--text);

min-height:100vh;

}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{

position:fixed;

top:0;
left:0;
right:0;

height:78px;

background:#fff;

border-bottom:1px solid var(--border);

display:flex;

align-items:center;

justify-content:space-between;

padding:0 25px;

z-index:900;

box-shadow:0 2px 12px rgba(0,0,0,.05);

}


/* STORE INFO */

.top-store{

display:flex;

align-items:center;

gap:12px;

}


/* STORE IMAGE */

.store-image{

width:48px;

height:48px;

border-radius:50%;

object-fit:cover;

background:#F0F0F0;

border:2px solid #F2F2F2;

display:block;

}


/* STORE NAME */

.top-store-name{

font-size:18px;

font-weight:800;

color:var(--dark);

}


/* SMALL LABEL */

.top-store-label{

font-size:12px;

color:var(--muted);

margin-top:2px;

}


/* VIEW STORE */

.view-store-btn{

display:inline-flex;

align-items:center;

justify-content:center;

gap:7px;

padding:10px 17px;

border:none;

border-radius:11px;

background:var(--orange);

color:white;

text-decoration:none;

font-size:14px;

font-weight:700;

cursor:pointer;

transition:.2s;

box-shadow:0 4px 12px rgba(244,123,32,.18);

}

.view-store-btn:hover{

background:var(--orange-dark);

transform:translateY(-1px);

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

position:fixed;

right:0;

top:78px;

height:calc(100vh - 78px);

width:75px;

background:#F0F0F0;

color:var(--dark);

overflow:hidden;

transition:.3s;

z-index:1000;

border-left:1px solid #E2E2E2;

box-shadow:-3px 0 15px rgba(0,0,0,.04);

}

.sidebar:hover{

width:240px;

}


/* =====================================================
   LOGO
===================================================== */

.logo{

height:70px;

display:flex;

align-items:center;

justify-content:center;

font-size:22px;

font-weight:800;

border-bottom:1px solid #DDDDDD;

white-space:nowrap;

color:var(--dark);

}

.logo span{

color:var(--orange);

}


/* =====================================================
   MENU
===================================================== */

.menu{

margin-top:18px;

padding:0 10px;

}

.menu a{

display:flex;

align-items:center;

gap:15px;

height:52px;

padding:0 10px;

margin-bottom:7px;

border-radius:12px;

color:#555;

text-decoration:none;

white-space:nowrap;

transition:.2s;

}

.menu a:hover{

background:#E4E4E4;

color:var(--dark);

}

.menu a.active{

background:var(--orange);

color:white;

box-shadow:
0 5px 15px rgba(244,123,32,.20);

}

.icon{

min-width:35px;

text-align:center;

font-size:20px;

}

.text{

opacity:0;

transition:.25s;

font-size:14px;

font-weight:700;

}

.sidebar:hover .text{

opacity:1;

}


/* =====================================================
   CONTENT
===================================================== */

.content{

margin-right:75px;

padding:25px;

padding-top:103px;

transition:.3s;

}


/* =====================================================
   HEADER
===================================================== */

.header{

background:var(--card);

border:1px solid var(--border);

border-radius:18px;

padding:25px;

box-shadow:var(--shadow);

margin-bottom:22px;

position:relative;

overflow:hidden;

}

.header::before{

content:"";

position:absolute;

right:0;

top:0;

width:5px;

height:100%;

background:var(--orange);

}

.header h1{

font-size:27px;

color:var(--dark);

margin-bottom:8px;

}

.header p{

color:var(--muted);

font-size:14px;

}

.owner-email{

font-size:13px;

color:var(--muted);

margin-top:13px;

}

.owner-email span{

color:var(--dark);

font-weight:700;

}


/* =====================================================
   MESSAGES
===================================================== */

.message{

display:none;

padding:14px 18px;

border-radius:12px;

margin-bottom:18px;

text-align:center;

font-size:14px;

}

.success{

background:var(--success-bg);

color:#155724;

border:1px solid #c5e8d3;

}

.error{

background:var(--danger-bg);

color:#721c24;

border:1px solid #efc7cc;

}


/* =====================================================
   STATISTICS
===================================================== */

.stats{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:18px;

margin-bottom:22px;

}

.stat{

background:white;

border:1px solid var(--border);

border-radius:18px;

padding:22px;

box-shadow:var(--shadow);

position:relative;

overflow:hidden;

}

.stat::after{

content:"";

position:absolute;

bottom:0;

right:0;

height:3px;

width:100%;

background:var(--orange);

}

.stat-title{

color:var(--muted);

font-size:14px;

margin-bottom:12px;

display:flex;

align-items:center;

gap:8px;

}

.stat-value{

font-size:30px;

font-weight:800;

color:var(--dark);

}


/* =====================================================
   ACTIONS
===================================================== */

.actions{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:18px;

margin-bottom:22px;

}

.action{

background:white;

border:1px solid var(--border);

border-radius:18px;

padding:23px;

text-align:right;

cursor:pointer;

box-shadow:var(--shadow);

transition:.25s;

position:relative;

overflow:hidden;

font-family:"Tajawal",sans-serif;

}

.action::before{

content:"";

position:absolute;

right:0;

top:0;

width:4px;

height:100%;

background:var(--orange);

transform:scaleY(0);

transition:.25s;

}

.action:hover{

transform:translateY(-3px);

box-shadow:0 8px 25px rgba(0,0,0,.08);

}

.action:hover::before{

transform:scaleY(1);

}

.action h3{

font-size:18px;

color:var(--dark);

margin-bottom:8px;

}

.action p{

color:var(--muted);

font-size:14px;

}


/* =====================================================
   PRODUCTS SECTION
===================================================== */

.section{

background:white;

border:1px solid var(--border);

padding:22px;

border-radius:18px;

box-shadow:var(--shadow);

margin-bottom:22px;

}

.section-header{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:20px;

}

.section-header h2{

font-size:21px;

color:var(--dark);

}


/* =====================================================
   ADD BUTTON
===================================================== */

.add-btn{

background:var(--orange);

color:white;

border:none;

padding:11px 18px;

border-radius:11px;

cursor:pointer;

font-size:14px;

font-weight:700;

font-family:"Tajawal",sans-serif;

transition:.2s;

box-shadow:0 4px 10px rgba(244,123,32,.18);

}

.add-btn:hover{

background:var(--orange-dark);

transform:translateY(-1px);

}


/* =====================================================
   PRODUCTS
===================================================== */

.products{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:17px;

}


/* =====================================================
   PRODUCT CARD
===================================================== */

.product{

background:white;

border:1px solid var(--border);

border-radius:16px;

padding:10px;

transition:.25s;

overflow:hidden;

}

.product:hover{

transform:translateY(-3px);

box-shadow:0 8px 25px rgba(0,0,0,.08);

}

.product img{

width:100%;

height:175px;

object-fit:cover;

border-radius:12px;

background:#F1F1F1;

}

.product h3{

font-size:16px;

margin:12px 6px 7px;

color:var(--dark);

}

.product-price{

font-size:16px;

font-weight:800;

color:var(--orange);

margin:0 6px 8px;

}

.product-stock{

font-size:13px;

color:var(--muted);

margin:0 6px 12px;

}

.product-buttons{

display:flex;

gap:7px;

}

.product-buttons button{

flex:1;

padding:10px 5px;

border:none;

border-radius:9px;

cursor:pointer;

font-size:13px;

font-weight:700;

font-family:"Tajawal",sans-serif;

transition:.2s;

}

.edit-btn{

background:#FFF1E6;

color:var(--orange-dark);

}

.edit-btn:hover{

background:#FFE2CC;

}

.delete-btn{

background:var(--danger-bg);

color:#B52B39;

}

.delete-btn:hover{

background:#F6D1D6;

}


/* =====================================================
   EMPTY
===================================================== */

.empty{

background:#FAFAFA;

border:1px dashed #DDD;

padding:40px 20px;

text-align:center;

color:var(--muted);

border-radius:14px;

grid-column:1/-1;

line-height:1.8;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:1000px){

.products{

grid-template-columns:repeat(3,1fr);

}

}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:800px){

.topbar{

height:70px;

padding:0 14px;

}

.sidebar{

top:70px;

height:calc(100vh - 70px);

width:65px;

}

.sidebar:hover{

width:210px;

}

.content{

margin-right:65px;

padding:16px;

padding-top:88px;

}

.stats{

grid-template-columns:repeat(3,1fr);

gap:10px;

}

.stat{

padding:16px;

}

.stat-value{

font-size:24px;

}

.products{

grid-template-columns:repeat(2,1fr);

}

.top-store-name{

font-size:16px;

}

.store-image{

width:43px;

height:43px;

}

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:550px){

.topbar{

height:65px;

}

.sidebar{

top:65px;

height:calc(100vh - 65px);

width:60px;

}

.sidebar:hover{

width:200px;

}

.content{

padding:12px;

padding-top:80px;

margin-right:60px;

}

.header{

padding:20px;

}

.header h1{

font-size:22px;

}

.stats{

grid-template-columns:1fr;

}

.actions{

grid-template-columns:1fr;

}

.section{

padding:15px;

}

.section-header{

gap:10px;

}

.section-header h2{

font-size:18px;

}

.add-btn{

padding:10px 12px;

font-size:12px;

}

.products{

grid-template-columns:1fr 1fr;

gap:10px;

}

.product img{

height:135px;

}

.view-store-btn{

padding:8px 10px;

font-size:12px;

}

.top-store-label{

display:none;

}

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:380px){

.products{

grid-template-columns:1fr;

}

.product img{

height:190px;

}

.top-store-name{

font-size:14px;

}

}


/* =====================================================
   SCROLLBAR
===================================================== */

::-webkit-scrollbar{

width:7px;

}

::-webkit-scrollbar-track{

background:#F1F1F1;

}

::-webkit-scrollbar-thumb{

background:#CCC;

border-radius:10px;

}

::-webkit-scrollbar-thumb:hover{

background:var(--orange);

}

</style>

</head>

<script type="module">

/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
collection,
getDocs,
query,
where,
deleteDoc,
doc,
getDoc

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


import {

getAuth,
onAuthStateChanged,
signOut

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLMB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);


/* =====================================================
   ELEMENTS
===================================================== */

const storeNameElement =
document.getElementById("storeName");

const storeNameStat =
document.getElementById("storeNameStat");

const ownerEmailElement =
document.getElementById("ownerEmail");

const productsCount =
document.getElementById("productsCount");

const ordersCount =
document.getElementById("ordersCount");

const productsContainer =
document.getElementById("productsContainer");

const topStoreName =
document.getElementById("topStoreName");

const topStoreImage =
document.getElementById("topStoreImage");

const viewStoreBtn =
document.getElementById("viewStoreBtn");


/* =====================================================
   VARIABLES
===================================================== */

let currentOwnerEmail = "";

let currentOwnerUid = "";

let currentStoreId = "";

let currentStoreName = "G-Glam";

let currentStoreImage = "";


/* =====================================================
   LOAD STORE
===================================================== */

async function loadStore(){

try{

if(!auth.currentUser){

window.location.href =
"login.html";

return;

}


const uid =
auth.currentUser.uid;


currentOwnerUid =
uid;


/* =====================================================
   STORES / UID
===================================================== */

const storeRef =
doc(
db,
"stores",
uid
);


const storeSnapshot =
await getDoc(storeRef);


/* =====================================================
   NO STORE
===================================================== */

if(!storeSnapshot.exists()){

alert(
"⚠️ لم يتم العثور على متجر مرتبط بهذا الحساب."
);

await signOut(auth);

window.location.href =
"login.html";

return;

}


const store =
storeSnapshot.data();


currentStoreId =
storeSnapshot.id;


/* =====================================================
   STATUS
===================================================== */

const status =
String(
store.status || "pending"
)
.toLowerCase()
.trim();


if(

status === "pending" ||

status === "waiting" ||

status === "review"

){

alert(
"⏳ طلب إنشاء متجرك مازال قيد المراجعة من طرف الإدارة."
);

await signOut(auth);

window.location.href =
"login.html";

return;

}


if(

status === "rejected" ||

status === "refused"

){

const reason =
store.rejectionReason ||
"لم يتم ذكر سبب الرفض.";


alert(

"❌ تم رفض طلب إنشاء المتجر.\n\n" +
"سبب الرفض:\n" +
reason

);


await signOut(auth);

window.location.href =
"login.html";

return;

}


if(

status !== "active" &&

status !== "approved"

){

alert(
"⚠️ لا يمكنك الدخول إلى لوحة التحكم حاليًا."
);

await signOut(auth);

window.location.href =
"login.html";

return;

}


/* =====================================================
   STORE DATA
===================================================== */

currentStoreName =

store.storeName ||

store.name ||

"G-Glam";


currentOwnerEmail =

store.ownerEmail ||

store.email ||

auth.currentUser.email ||

"";


/*
=====================================================
صورة المتجر

ندعم عدة أسماء محتملة للحقل حتى لا تتعطل
الصفحة إذا كان الحقل في Firestore باسم مختلف.
=====================================================
*/

currentStoreImage =

store.storeImage ||

store.image ||

store.logo ||

store.photo ||

store.imageUrl ||

"";


/* =====================================================
   DISPLAY
===================================================== */

storeNameElement.textContent =
currentStoreName;

storeNameStat.textContent =
currentStoreName;

ownerEmailElement.textContent =
currentOwnerEmail;

topStoreName.textContent =
currentStoreName;

   /* =====================================================
   STORE IMAGE
===================================================== */

if(currentStoreImage){

topStoreImage.src =
currentStoreImage;

}


/* =====================================================
   VIEW STORE
===================================================== */

viewStoreBtn.onclick =
function(event){

event.preventDefault();


/*
إذا كان لديك رابط متجر محفوظ داخل Firestore
نستخدمه أولًا.
*/

const storeUrl =

store.storeUrl ||

store.url ||

store.shopUrl ||

store.link ||

"";


if(storeUrl){

window.open(
storeUrl,
"_blank"
);

return;

}


/*
إذا لم يوجد رابط محفوظ، نفتح الصفحة الرئيسية
مع storeId كمعرف للمتجر.
*/

window.open(
"index.html?storeId=" +
encodeURIComponent(currentStoreId),
"_blank"
);

};


/* =====================================================
   LOCAL STORAGE
===================================================== */

localStorage.setItem(
"storeId",
currentStoreId
);

localStorage.setItem(
"storeName",
currentStoreName
);

localStorage.setItem(
"storeOwnerEmail",
currentOwnerEmail
);

localStorage.setItem(
"ownerEmail",
currentOwnerEmail
);

localStorage.setItem(
"ownerUid",
currentOwnerUid
);

localStorage.setItem(
"paymentStatus",
"approved"
);


/* =====================================================
   LOAD PRODUCTS
===================================================== */

await loadProducts();


/* =====================================================
   LOAD ORDERS
===================================================== */

await loadOrders();


}catch(error){

console.error(
"LOAD STORE ERROR:",
error
);


if(
error.code ===
"permission-denied"
){

alert(
"❌ لا توجد صلاحية للوصول إلى بيانات المتجر."
);

}else{

alert(
"❌ حدث خطأ أثناء تحميل المتجر.\n\n" +
error.message
);

}

}

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

try{

const q =
query(

collection(db,"products"),

where(
"ownerUid",
"==",
currentOwnerUid
)

);


let snapshot;


try{

snapshot =
await getDocs(q);

}catch(error){

if(

error.code === "failed-precondition" ||

error.code === "permission-denied"

){

const oldQuery =
query(

collection(db,"products"),

where(
"ownerEmail",
"==",
currentOwnerEmail
)

);

snapshot =
await getDocs(oldQuery);

}else{

throw error;

}

}


productsCount.textContent =
snapshot.size;

productsContainer.innerHTML =
"";


if(snapshot.empty){

productsContainer.innerHTML = `

<div class="empty">

لا توجد منتجات حاليًا.

<br><br>

<button
class="add-btn"
onclick="goAddProduct()">

➕ إضافة أول منتج

</button>

</div>

`;

return;

}


snapshot.forEach(
productDoc=>{

const product =
productDoc.data();

const id =
productDoc.id;

const card =
document.createElement("div");

card.className =
"product";


card.innerHTML = `

<img

src="${
product.image ||
(
Array.isArray(product.images) &&
product.images[0]
) ||
"https://via.placeholder.com/400x400?text=G-Glam"
}"

alt="${escapeHtml(
product.name ||
"منتج"
)}"

>


<h3>

${escapeHtml(
product.name ||
"بدون اسم"
)}

</h3>


<div class="product-price">

${Number(
product.price || 0
)} DA

</div>


<div class="product-stock">

المخزون:

${Number(
product.stock || 0
)}

</div>


<div class="product-buttons">

<button
class="edit-btn">

✏️ تعديل

</button>


<button
class="delete-btn">

🗑️ حذف

</button>

</div>

`;


/* EDIT */

card
.querySelector(".edit-btn")
.addEventListener(
"click",
function(){

window.location.href =
"edit-product.html?id=" +
encodeURIComponent(id);

}
);


/* DELETE */

card
.querySelector(".delete-btn")
.addEventListener(
"click",
function(){

deleteProduct(id);

}
);


productsContainer.appendChild(card);

});


}catch(error){

console.error(
"PRODUCTS ERROR:",
error
);


productsContainer.innerHTML = `

<div class="empty">

❌ حدث خطأ أثناء تحميل المنتجات.

<br><br>

${escapeHtml(
error.message || ""
)}

</div>

`;

}

}

/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(id){

const ok =
confirm(
"هل تريد حذف هذا المنتج؟"
);


if(!ok){

return;

}


try{

await deleteDoc(

doc(
db,
"products",
id
)

);


showSuccess(
"تم حذف المنتج بنجاح ✅"
);


await loadProducts();


}catch(error){

console.error(
"DELETE PRODUCT ERROR:",
error
);


showError(
"❌ حدث خطأ أثناء حذف المنتج."
);

}

}

/* =====================================================
   SUCCESS
===================================================== */

function showSuccess(text){

const box =
document.getElementById(
"successMessage"
);

box.textContent =
text;

box.style.display =
"block";


setTimeout(
function(){

box.style.display =
"none";

},
3000
);

}


/* =====================================================
   ERROR
===================================================== */

function showError(text){

const box =
document.getElementById(
"errorMessage"
);

box.textContent =
text;

box.style.display =
"block";


setTimeout(
function(){

box.style.display =
"none";

},
4000
);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(

auth,

async function(user){

if(!user){

window.location.href =
"login.html";

return;

}


currentOwnerUid =
user.uid;

currentOwnerEmail =
user.email || "";


ownerEmailElement.textContent =
currentOwnerEmail;


await loadStore();

});


console.log(
"G-Glam Store Dashboard Started"
);
