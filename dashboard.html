<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | لوحة تحكم المتجر</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#F5F0E8;
color:#222;
min-height:100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
position:fixed;
right:0;
top:0;
height:100vh;
width:70px;
background:#222;
color:white;
overflow:hidden;
transition:.3s;
z-index:1000;
}

.sidebar:hover{
width:230px;
}

.logo{
height:75px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
border-bottom:1px solid #444;
white-space:nowrap;
}

.menu{
margin-top:20px;
}

.menu a{
display:flex;
align-items:center;
gap:15px;
padding:15px;
color:white;
text-decoration:none;
white-space:nowrap;
transition:.2s;
}

.menu a:hover{
background:#333;
}

.menu a.active{
background:#B89B7A;
}

.icon{
min-width:35px;
text-align:center;
font-size:20px;
}

.text{
opacity:0;
transition:.3s;
}

.sidebar:hover .text{
opacity:1;
}

/* =========================
   CONTENT
========================= */

.content{
margin-right:70px;
padding:20px;
}

/* =========================
   HEADER
========================= */

.header{
background:white;
padding:20px;
border-radius:18px;
box-shadow:0 3px 15px rgba(0,0,0,.06);
margin-bottom:20px;
}

.header h1{
font-size:28px;
margin-bottom:8px;
}

.header p{
color:#777;
}

.owner-email{
font-size:13px;
color:#777;
margin-top:10px;
}

/* =========================
   STATISTICS
========================= */

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-bottom:20px;
}

.stat{
background:white;
padding:20px;
border-radius:18px;
box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.stat-title{
color:#777;
font-size:14px;
margin-bottom:10px;
}

.stat-value{
font-size:28px;
font-weight:bold;
}

/* =========================
   ACTIONS
========================= */

.actions{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
margin-bottom:25px;
}

.action{
background:white;
border:none;
border-radius:18px;
padding:22px;
text-align:right;
cursor:pointer;
box-shadow:0 3px 15px rgba(0,0,0,.06);
transition:.2s;
}

.action:hover{
transform:translateY(-2px);
}

.action h3{
font-size:18px;
margin-bottom:7px;
}

.action p{
color:#777;
font-size:14px;
}

/* =========================
   PRODUCTS
========================= */

.section{
background:white;
padding:20px;
border-radius:18px;
box-shadow:0 3px 15px rgba(0,0,0,.06);
margin-bottom:20px;
}

.section-header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:18px;
}

.section-header h2{
font-size:21px;
}

.add-btn{
background:#222;
color:white;
border:none;
padding:12px 18px;
border-radius:12px;
cursor:pointer;
}

.products{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
}

.product{
background:white;
border:1px solid #eee;
border-radius:16px;
padding:10px;
}

.product img{
width:100%;
height:180px;
object-fit:cover;
border-radius:14px;
}

.product h3{
font-size:16px;
margin:10px 5px 5px;
}

.product-price{
font-weight:bold;
margin:0 5px 10px;
}

.product-stock{
font-size:13px;
color:#777;
margin:0 5px 10px;
}

.product-buttons{
display:flex;
gap:7px;
}

.product-buttons button{
flex:1;
padding:9px;
border:none;
border-radius:10px;
cursor:pointer;
}

.edit-btn{
background:#F5F0E8;
}

.delete-btn{
background:#f1dede;
color:#9b3030;
}

/* =========================
   EMPTY
========================= */

.empty{
background:white;
padding:35px;
text-align:center;
color:#777;
border-radius:16px;
grid-column:1/-1;
}

/* =========================
   MESSAGES
========================= */

.message{
display:none;
padding:12px;
border-radius:10px;
margin-bottom:15px;
text-align:center;
}

.success{
background:#d4edda;
color:#155724;
}

.error{
background:#f8d7da;
color:#721c24;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

.products{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:700px){

.sidebar{
width:60px;
}

.sidebar:hover{
width:200px;
}

.content{
margin-right:60px;
padding:10px;
}

.stats{
grid-template-columns:1fr;
}

.actions{
grid-template-columns:1fr;
}

.products{
grid-template-columns:1fr 1fr;
}

}

@media(max-width:450px){

.products{
grid-template-columns:1fr;
}

.header h1{
font-size:22px;
}

}

</style>

</head>

<body>

<!-- =========================
     SIDEBAR
========================= -->

<div class="sidebar">

<div class="logo">
G-Glam
</div>

<div class="menu">

<a href="dashboard.html"
class="active">

<span class="icon">🏠</span>

<span class="text">
الرئيسية
</span>

</a>

<a href="orders.html">

<span class="icon">📦</span>

<span class="text">
الطلبات
</span>

</a>

<a href="products.html">

<span class="icon">🛍️</span>

<span class="text">
المنتجات
</span>

</a>

<a href="add-product.html">

<span class="icon">➕</span>

<span class="text">
إضافة منتج
</span>

</a>

<a href="delivery.html">

<span class="icon">🚚</span>

<span class="text">
أسعار التوصيل
</span>

</a>

<a href="settings.html">

<span class="icon">⚙️</span>

<span class="text">
الإعدادات
</span>

</a>

<a href="#"
id="logoutBtn">

<span class="icon">🚪</span>

<span class="text">
تسجيل الخروج
</span>

</a>

</div>

</div>

<!-- =========================
     CONTENT
========================= -->

<div class="content">

<div class="header">

<h1 id="storeName">
جاري تحميل المتجر...
</h1>

<p>
لوحة تحكم متجرك
</p>

<div class="owner-email">

📧 الحساب:

<span id="ownerEmail">
جاري التحميل...
</span>

</div>

</div>

<!-- الرسائل -->

<div
class="message success"
id="successMessage">
</div>

<div
class="message error"
id="errorMessage">
</div>

<!-- =========================
     STATISTICS
========================= -->

<div class="stats">

<div class="stat">

<div class="stat-title">
🛍️ منتجاتي
</div>

<div
class="stat-value"
id="productsCount">
0
</div>

</div>

<div class="stat">

<div class="stat-title">
📦 طلباتي
</div>

<div
class="stat-value"
id="ordersCount">
0
</div>

</div>

<div class="stat">

<div class="stat-title">
🏪 المتجر
</div>

<div
class="stat-value"
id="storeNameStat">
G-Glam
</div>

</div>

</div>

<!-- =========================
     ACTIONS
========================= -->

<div class="actions">

<button
class="action"
onclick="goAddProduct()">

<h3>
➕ إضافة منتج
</h3>

<p>
إضافة منتج جديد إلى متجرك
</p>

</button>

<button
class="action"
onclick="goOrders()">

<h3>
📦 الطلبات
</h3>

<p>
عرض وإدارة طلبات الزبائن
</p>

</button>

</div>

<!-- =========================
     PRODUCTS
========================= -->

<div class="section">

<div class="section-header">

<h2>
🛍️ أحدث منتجاتي
</h2>

<button
class="add-btn"
onclick="goAddProduct()">

+ إضافة منتج

</button>

</div>

<div
class="products"
id="productsContainer">

<div class="empty">

⏳ جاري تحميل المنتجات...

</div>

</div>

</div>

</div>
<script type="module">

/* =========================
   FIREBASE
========================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {
getFirestore,
collection,
getDocs,
query,
where,
deleteDoc,
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


import {
getAuth,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =========================
   INITIALIZE FIREBASE
========================= */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);


/* =========================
   ELEMENTS
========================= */

const storeNameElement =
document.getElementById(
"storeName"
);

const storeNameStat =
document.getElementById(
"storeNameStat"
);

const ownerEmailElement =
document.getElementById(
"ownerEmail"
);

const productsCount =
document.getElementById(
"productsCount"
);

const ordersCount =
document.getElementById(
"ordersCount"
);

const productsContainer =
document.getElementById(
"productsContainer"
);


/* =========================
   VARIABLES
========================= */

let currentOwnerEmail = "";

let currentOwnerUid = "";

let currentStoreId = "";

let currentStoreName = "G-Glam";


/* =========================
   LOAD STORE BY UID
========================= */

async function loadStore(){

try{


/*
   التأكد من وجود المستخدم
*/

if(!auth.currentUser){

window.location.href =
"login.html";

return;

}


/*
   UID الحقيقي من Firebase Authentication
*/

const uid =
auth.currentUser.uid;

currentOwnerUid =
uid;


/* =========================
   قراءة stores/{UID}
========================= */

const storeRef =
doc(
db,
"stores",
uid
);


const storeSnapshot =
await getDoc(
storeRef
);


/* =========================
   لا يوجد متجر
========================= */

if(!storeSnapshot.exists()){

alert(
"⚠️ لم يتم العثور على متجر مرتبط بهذا الحساب."
);

await signOut(auth);

window.location.href =
"login.html";

return;

}


/* =========================
   بيانات المتجر
========================= */

const store =
storeSnapshot.data();

currentStoreId =
storeSnapshot.id;


/* =========================
   حالة المتجر
========================= */

const status =

String(
store.status || "pending"
)
.toLowerCase()
.trim();


/* =========================
   الطلب قيد المراجعة
========================= */

if(

status === "pending" ||

status === "waiting" ||

status === "review"

){

alert(
"⏳ طلب إنشاء متجرك مازال قيد المراجعة من طرف الإدارة."
);

await signOut(auth);

window.location.href =
"login.html";

return;

}


/* =========================
   المتجر مرفوض
========================= */

if(

status === "rejected" ||

status === "refused"

){

const reason =
store.rejectionReason ||
"لم يتم ذكر سبب الرفض.";


alert(

"❌ تم رفض طلب إنشاء المتجر.\n\n" +

"سبب الرفض:\n" +

reason

);

await signOut(auth);

window.location.href =
"login.html";

return;

}


/* =========================
   التحقق من حالة القبول
========================= */

if(

status !== "active" &&

status !== "approved"

){

alert(
"⚠️ لا يمكنك الدخول إلى لوحة التحكم حاليًا."
);

await signOut(auth);

window.location.href =
"login.html";

return;

}


/* =========================
   المتجر مقبول
========================= */

currentStoreName =

store.storeName ||

store.name ||

"G-Glam";


currentOwnerEmail =

store.ownerEmail ||

store.email ||

auth.currentUser.email ||

"";


/* =========================
   عرض معلومات المتجر
========================= */

storeNameElement.textContent =
currentStoreName;

storeNameStat.textContent =
currentStoreName;

ownerEmailElement.textContent =
currentOwnerEmail;


/* =========================
   حفظ المعلومات محليًا
========================= */

localStorage.setItem(
"storeId",
currentStoreId
);

localStorage.setItem(
"storeName",
currentStoreName
);

localStorage.setItem(
"storeOwnerEmail",
currentOwnerEmail
);

localStorage.setItem(
"ownerEmail",
currentOwnerEmail
);

localStorage.setItem(
"ownerUid",
currentOwnerUid
);

localStorage.setItem(
"paymentStatus",
"approved"
);


/* =========================
   تحميل المنتجات
========================= */

await loadProducts();


/* =========================
   تحميل الطلبات
========================= */

await loadOrders();


}catch(error){

console.error(
"LOAD STORE ERROR:",
error
);


if(
error.code ===
"permission-denied"
){

alert(
"❌ لا توجد صلاحية للوصول إلى بيانات المتجر."
);

}else{

alert(

"❌ حدث خطأ أثناء تحميل المتجر.\n\n" +

error.message

);

}

}

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

try{


const q =
query(

collection(
db,
"products"
),

where(
"ownerUid",
"==",
currentOwnerUid
)

);


let snapshot;

try{

snapshot =
await getDocs(q);

}catch(error){

/*
   توافق مع المنتجات القديمة
   التي تستخدم ownerEmail
*/

if(
error.code ===
"failed-precondition"
||
error.code ===
"permission-denied"
){

const oldQuery =
query(

collection(
db,
"products"
),

where(
"ownerEmail",
"==",
currentOwnerEmail
)

);

snapshot =
await getDocs(oldQuery);

}else{

throw error;

}

}


productsCount.textContent =
snapshot.size;


productsContainer.innerHTML = "";


if(snapshot.empty){

productsContainer.innerHTML = `

<div class="empty">

لا توجد منتجات حاليًا.

<br><br>

<button
class="add-btn"
onclick="goAddProduct()">

➕ إضافة أول منتج

</button>

</div>

`;

return;

}


/* =========================
   عرض المنتجات
========================= */

snapshot.forEach(
productDoc=>{

const product =
productDoc.data();

const id =
productDoc.id;


const card =
document.createElement(
"div"
);

card.className =
"product";


card.innerHTML = `

<img

src="${
product.image ||
"https://via.placeholder.com/400x400?text=G-Glam"
}"

alt="${escapeHtml(
product.name ||
"منتج"
)}"

>


<h3>

${escapeHtml(
product.name ||
"بدون اسم"
)}

</h3>


<div class="product-price">

${Number(
product.price || 0
)} DA

</div>


<div class="product-stock">

المخزون:
${Number(
product.stock || 0
)}

</div>


<div class="product-buttons">


<button
class="edit-btn">

✏️ تعديل

</button>


<button
class="delete-btn">

🗑️ حذف

</button>


</div>

`;


/* تعديل */

card
.querySelector(
".edit-btn"
)
.addEventListener(
"click",
function(){

window.location.href =
"edit-product.html?id=" +
encodeURIComponent(id);

}
);


/* حذف */

card
.querySelector(
".delete-btn"
)
.addEventListener(
"click",
function(){

deleteProduct(id);

}
);


productsContainer.appendChild(
card
);

});


}catch(error){

console.error(
"PRODUCTS ERROR:",
error
);

productsContainer.innerHTML = `

<div class="empty">

❌ حدث خطأ أثناء تحميل المنتجات.

<br><br>

${escapeHtml(
error.message
)}

</div>

`;

}

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

try{


/*
   البحث بواسطة UID
*/

const q =
query(

collection(
db,
"orders"
),

where(
"ownerUid",
"==",
currentOwnerUid
)

);


let snapshot;


try{

snapshot =
await getDocs(q);

}catch(error){

/*
   دعم الطلبات القديمة
   بواسطة البريد
*/

if(
error.code ===
"failed-precondition"
||
error.code ===
"permission-denied"
){

const oldQuery =
query(

collection(
db,
"orders"
),

where(
"ownerEmail",
"==",
currentOwnerEmail
)

);

snapshot =
await getDocs(oldQuery);

}else{

throw error;

}

}


ordersCount.textContent =
snapshot.size;


}catch(error){

console.error(
"ORDERS ERROR:",
error
);

ordersCount.textContent =
"0";

}

}


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id){

const ok =
confirm(
"هل تريد حذف هذا المنتج؟"
);


if(!ok){

return;

}


try{

await deleteDoc(

doc(
db,
"products",
id
)

);


showSuccess(
"تم حذف المنتج بنجاح ✅"
);


await loadProducts();


}catch(error){

console.error(
"DELETE PRODUCT ERROR:",
error
);

showError(
"❌ حدث خطأ أثناء حذف المنتج."
);

}

}


/* =========================
   NAVIGATION
========================= */

window.goAddProduct =
function(){

window.location.href =
"add-product.html";

};


window.goOrders =
function(){

window.location.href =
"orders.html";

};


/* =========================
   LOGOUT
========================= */

document
.getElementById(
"logoutBtn"
)
.addEventListener(
"click",
async function(event){

event.preventDefault();


const ok =
confirm(
"هل تريد تسجيل الخروج؟"
);


if(!ok){

return;

}


try{

await signOut(auth);

localStorage.removeItem(
"storeId"
);

localStorage.removeItem(
"ownerUid"
);

window.location.href =
"login.html";


}catch(error){

console.error(
"LOGOUT ERROR:",
error
);

showError(
"❌ تعذر تسجيل الخروج."
);

}

});


/* =========================
   SUCCESS MESSAGE
========================= */

function showSuccess(text){

const box =
document.getElementById(
"successMessage"
);

box.textContent =
text;

box.style.display =
"block";


setTimeout(
function(){

box.style.display =
"none";

},
3000
);

}


/* =========================
   ERROR MESSAGE
========================= */

function showError(text){

const box =
document.getElementById(
"errorMessage"
);

box.textContent =
text;

box.style.display =
"block";


setTimeout(
function(){

box.style.display =
"none";

},
4000
);

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =========================
   FIREBASE AUTH
========================= */

onAuthStateChanged(

auth,

async function(user){

if(!user){

window.location.href =
"login.html";

return;

}


/* =========================
   USER UID
========================= */

currentOwnerUid =
user.uid;


/* =========================
   USER EMAIL
========================= */

currentOwnerEmail =
user.email || "";


ownerEmailElement.textContent =
currentOwnerEmail;


/* =========================
   CHECK STORE
========================= */

await loadStore();

}

);


/* =========================
   START
========================= */

console.log(
"G-Glam Store Dashboard Started"
);

</script>


</body>

</html>
