<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<style>

    white-space:pre-line;
}
</style>

<body>

<h1>🚚 إعداد أسعار التوصيل</h1>

<p>
اضغطي الزر لإضافة جميع الولايات إلى Firebase
</p>

<br>

<button id="startBtn">
إضافة أسعار التوصيل
</button>

<div id="result">

<script type="module">

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

    storageBucket:"g-glam.firebasestorage.app",

    messagingSenderId:"997228419719",

    appId:"1:997228419719:web:f9d88de7ea2c6f457e3622",

    measurementId:"G-WX1K1F83F6"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


const tarifs = {


"Adrar":{office:1100,home:1400},
"Chlef":{office:450,home:650},

"In Guezzam":{office:1000,home:1300}

};


const result =
document.getElementById("result");


document
.getElementById("startBtn")
.addEventListener("click", async ()=>{

    const confirmAction =
    confirm(
        "هل تريدين إضافة جميع أسعار التوصيل إلى Firebase؟"
    );

    if(!confirmAction) return;


    result.innerText =
    "⏳ جاري إضافة الولايات...\n";


    let count = 0;


    try{

        for(const [wilaya, prices] of Object.entries(tarifs)){

            await setDoc(

                doc(
                    db,
                    "delivery",
                    wilaya
                ),

                {
                    office: prices.office,
                    home: prices.home
                }

            );

            count++;

            result.innerText +=
            "✅ " + wilaya +
            " : مكتب " +
            prices.office +
            " / منزل " +
            prices.home +
            "\n";
        }


        result.innerText +=
        "\n🎉 تم بنجاح!\n" +
        "عدد الولايات: " +
        count;


        alert(
            "تمت إضافة جميع أسعار التوصيل بنجاح ✅"
        );


    }catch(error){

        console.error(error);

        result.innerText +=
        "\n❌ حدث خطأ:\n" +
        error.message;


        alert(
            "حدث خطأ أثناء الحفظ"
        );

    }

});

</script>
