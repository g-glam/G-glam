        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: "Tajawal", Arial, sans-serif;
            background: #F5F0E8;
            color: #222;
            min-height: 100vh;
            padding: 25px 15px 50px;
        }


        .container {
            width: 100%;
            max-width: 1000px;
            margin: auto;
        }


        /* =====================================================
           HEADER
        ====================================================== */

        .page-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 800;
            color: #222;
            margin-bottom: 8px;
        }

        .page-header h1 i {
            color: #F47B20;
            margin-left: 8px;
        }

        .page-header p {
            color: #666;
            font-size: 14px;
            line-height: 1.9;
        }


        /* =====================================================
           INFO
        ====================================================== */

        .info-box {
            background: #fff;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid #E8E8E8;
            box-shadow: 0 4px 15px rgba(0,0,0,.06);
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.7;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-row i {
            color: #F47B20;
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .info-row strong {
            color: #222;
            word-break: break-word;
        }


        /* =====================================================
           CARD
        ====================================================== */

        .card {
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #E8E8E8;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }


        /* =====================================================
           SECTION TITLE
        ====================================================== */

        .section-title {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 18px;
            color: #222;
        }

        .section-title i {
            color: #F47B20;
        }


        /* =====================================================
           ADD FORM
        ====================================================== */

        .add-form {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr auto;
            gap: 10px;
            align-items: end;
        }

        .form-group {
            width: 100%;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #444;
            margin-bottom: 7px;
        }


        /* =====================================================
           INPUTS
        ====================================================== */

        input {
            width: 100%;
            height: 46px;
            padding: 0 13px;
            border: 1px solid #DDD;
            border-radius: 11px;
            background: #FAFAFA;
            color: #222;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #F47B20;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(244,123,32,.10);
        }


        /* =====================================================
           BUTTON
        ====================================================== */

        button {
            font-family: inherit;
            border: none;
            cursor: pointer;
            transition: .2s;
        }


        .add-btn {
            height: 46px;
            padding: 0 18px;
            border-radius: 11px;
            background: #F47B20;
            color: #fff;
            font-size: 14px;
            font-weight: 800;
            white-space: nowrap;
        }

        .add-btn:hover {
            background: #DF6810;
        }

        .add-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }


        /* =====================================================
           ACTION BAR
        ====================================================== */

        .action-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .count {
            color: #666;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
        }


        .reload-btn {
            background: #222;
            color: #fff;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .reload-btn:hover {
            background: #444;
        }


        /* =====================================================
           DELIVERY LIST
        ====================================================== */

        .delivery-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }


        .delivery-row {
            display: grid;
            grid-template-columns:
                minmax(180px, 1.5fr)
                1fr
                1fr
                auto;

            gap: 10px;
            align-items: center;

            padding: 13px;

            background: #FAFAFA;

            border: 1px solid #E5E5E5;

            border-radius: 14px;

            transition: .2s;
        }

        .delivery-row:hover {
            border-color: #FFD0AD;
            background: #FFFDFC;
        }


        .wilaya-name {
            font-size: 15px;
            font-weight: 800;
            color: #222;
        }

        .wilaya-name i {
            color: #F47B20;
            margin-left: 7px;
        }

           PRICE
        ====================================================== */

        .price-field label {
            display: block;
            font-size: 11px;
            color: #777;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .price-field input {
            height: 40px;
            background: #fff;
        }


        /* =====================================================
           ACTIONS
        ====================================================== */

        .row-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }

        .save-btn,
        .delete-btn {
            width: 42px;
            height: 40px;
            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #fff;
        }

        .save-btn {
            background: #198754;
        }

        .save-btn:hover {
            background: #157347;
        }

        .delete-btn {
            background: #D9534F;
        }

        .delete-btn:hover {
            background: #B52B27;
        }


        /* =====================================================
           EMPTY
        ====================================================== */

        .empty {
            text-align: center;
            padding: 45px 20px;
            color: #888;
        }

        .empty i {
            font-size: 42px;
            color: #BBB;
            margin-bottom: 12px;
        }

        .empty p {
            font-size: 14px;
            line-height: 1.8;
        }


        /* =====================================================
           LOADING
        ====================================================== */

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #777;
            font-size: 14px;
        }

        .loading i {
            color: #F47B20;
            margin-left: 7px;
        }


        /* =====================================================
           MESSAGE
        ====================================================== */

        .message {
            display: none;
            padding: 13px 15px;
            border-radius: 11px;
            margin-bottom: 15px;
            font-size: 13px;
            line-height: 1.7;
            text-align: center;
        }

        .message.success {
            display: block;
            background: #EFFAF3;
            border: 1px solid #C8E8D4;
            color: #198754;
        }

        .message.error {
            display: block;
            background: #FDECEC;
            border: 1px solid #F2C8C8;
            color: #B42318;
        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 750px) {

            body {

            .card {

                border-radius: 17px;
            }

            .add-form {
                grid-template-columns: 1fr 1fr;
            }

            .add-form .form-group:first-child {
                grid-column: 1 / -1;
            }

            .add-btn {
                width: 100%;
            }

            .delivery-row {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .wilaya-name {
                grid-column: 1 / -1;
                padding-bottom: 5px;
            }

            .row-actions {
                grid-column: 1 / -1;
                justify-content: flex-end;
                padding-top: 3px;
            }

            .save-btn,
            .delete-btn {
                width: 46px;
            }
        }

           SMALL MOBILE
        ====================================================== */

                margin-bottom: 18px;

                font-size: 21px;
            }

            .page-header p {
                font-size: 13px;
            }

            .info-box {
                padding: 15px;
            }

            .info-row {
                align-items: flex-start;
                font-size: 13px;
            }

            .add-form {
                grid-template-columns: 1fr;
            }

            .add-form .form-group:first-child {
                grid-column: auto;
            }

            .delivery-row {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .wilaya-name {
                grid-column: auto;
            }

            .row-actions {
                grid-column: auto;
                justify-content: stretch;
            }

            .save-btn,
            .delete-btn {
                flex: 1;
            }

            .action-bar {
                align-items: flex-start;
                flex-direction: column;
            }

            .reload-btn {
                width: 100%;
            }

            .section-title {
                font-size: 18px;
            }
        }


        @media (max-width: 350px) {

            .card {
                padding: 12px;
            }

            .info-row {
                font-size: 12px;
            }

            .page-header h1 {
                font-size: 19px;
            }

        }

    </style>

</head>

        </div>

    </div>


    <!-- =====================================================
         DELIVERY LIST
    ====================================================== -->

    <div class="card">

        <div class="action-bar">

            <div

            >

                الولايات والأسعار

            </div>


            <button
                type="button"

            >

    /* =====================================================
       MESSAGE
    ====================================================== */

    function showMessage(
        text,
        type = "success"
    ) {

        messageElement.textContent =
            text;

        messageElement.className =
            "message " + type;

        setTimeout(
            hideMessage,
            4000
        );

    }


    function hideMessage() {

        messageElement.textContent =
            "";

        messageElement.className =
            "message";

    }


    /* =====================================================
       DELIVERY COLLECTION
       
       IMPORTANT:
       
       stores/{UID}/delivery
    ====================================================== */

    function getDeliveryCollection() {

        if (!currentUser) {
            return null;
        }

        return collection(
            db,
            "stores",
            currentUser.uid,
            "delivery"
        );

    }


    /* =====================================================
       DELIVERY DOCUMENT
       
       stores/{UID}/delivery/{wilaya}
    ====================================================== */

    function getDeliveryDoc(
        wilayaId
    ) {

        return doc(
            db,
            "stores",
            currentUser.uid,
            "delivery",
            wilayaId
        );

    }


    /* =====================================================
       LOAD STORE
    ====================================================== */

    async function loadStore() {

        const storeRef =
            doc(
                db,
                "stores",
                currentUser.uid
            );

        const snapshot =
            await getDoc(
                storeRef
            );

        if (!snapshot.exists()) {

            throw new Error(
                "لم يتم العثور على متجر مرتبط بهذا الحساب."
            );

        }

        const store =
            snapshot.data();

        storeNameElement.textContent =
            store.storeName ||
            store.name ||
            "متجري";

        ownerUidElement.textContent =
            currentUser.uid;

    }


    /* =====================================================
       LOAD DELIVERY
    ====================================================== */

    async function loadDelivery() {

        if (!currentUser) {
            return;
        }

        deliveryList.innerHTML = `

            <div class="loading">

                <i class="fa-solid fa-spinner fa-spin"></i>

                جاري تحميل أسعار التوصيل...

            </div>

        `;

        countElement.textContent =
            "جاري تحميل الولايات...";


        try {

            const snapshot =
                await getDocs(
                    getDeliveryCollection()
                );

            const items = [];


            snapshot.forEach(
                docSnap => {

                    const data =
                        docSnap.data();

                    items.push({

                        id:
                            docSnap.id,

                        name:
                            data.name ||
                            docSnap.id,

                        office:
                            Number(
                                data.office ?? 0
                            ),

                        home:
                            Number(
                                data.home ?? 0
                            )

                    });

                }
            );


            items.sort(
                (a, b) =>
                    a.name.localeCompare(
                        b.name,
                        "ar"
                    )
            );


            renderDelivery(
                items
            );


        } catch (error) {

            console.error(
                "LOAD DELIVERY ERROR:",
                error
            );

            deliveryList.innerHTML = `

                <div class="empty">

                    <i class="fa-solid fa-triangle-exclamation"></i>

                    <p>

                        تعذر تحميل أسعار التوصيل.

                        <br><br>

                        ${escapeHtml(
                            error.message
                        )}

                    </p>

                </div>

            `;

            countElement.textContent =
                "حدث خطأ";

        }

    }


    /* =====================================================
       RENDER
    ====================================================== */

    function renderDelivery(
        items
    ) {

        deliveryList.innerHTML =
            "";


        if (
            items.length === 0
        ) {

            deliveryList.innerHTML = `

                <div class="empty">

                    <i class="fa-solid fa-map-location-dot"></i>

                    <p>

                        لا توجد ولايات في هذا المتجر حاليًا.

                        <br>

                        يمكنك إضافة الولايات من الأعلى.

                    </p>

                </div>

            `;

            countElement.textContent =
                "0 ولاية";

            return;

        }


        countElement.textContent =
            items.length +
            " ولاية";


        items.forEach(
            item => {

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "delivery-row";


                row.innerHTML = `

                    <div class="wilaya-name">

                        <i class="fa-solid fa-location-dot"></i>

                        ${escapeHtml(
                            item.name
                        )}

                    </div>


                    <div class="price-field">

                        <label>
                            التوصيل إلى المكتب
                        </label>

                        <input
                            type="number"
                            min="0"
                            step="1"
                            class="office-input"
                            value="${item.office}"
                            data-id="${escapeAttribute(item.id)}"
                            inputmode="numeric"
                        >

                    </div>


                    <div class="price-field">

                        <label>
                            التوصيل إلى المنزل
                        </label>

                        <input
                            type="number"
                            min="0"
                            step="1"
                            class="home-input"
                            value="${item.home}"
                            data-id="${escapeAttribute(item.id)}"
                            inputmode="numeric"
                        >

                    </div>


                    <div class="row-actions">

                        <button
                            type="button"
                            class="save-btn"
                            title="حفظ"
                            data-action="save"
                            data-id="${escapeAttribute(item.id)}"
                        >

                            <i class="fa-solid fa-check"></i>

                        </button>


                        <button
                            type="button"
                            class="delete-btn"
                            title="حذف"
                            data-action="delete"
                            data-id="${escapeAttribute(item.id)}"
                        >

                            <i class="fa-solid fa-trash"></i>

                        </button>

                    </div>

                `;


                deliveryList.appendChild(
                    row
                );

            }
        );

    }


    /* =====================================================
       SAVE WILAYA
    ====================================================== */

    async function saveWilaya(
        wilayaId,
        row
    ) {

        try {

            const officeInput =
                row.querySelector(
                    ".office-input"
                );

            const homeInput =
                row.querySelector(
                    ".home-input"
                );


            const office =
                Number(
                    officeInput.value
                );

            const home =
                Number(
                    homeInput.value
                );


            if (
                !Number.isFinite(office) ||
                office < 0 ||
                !Number.isInteger(office)
            ) {

                showMessage(
                    "❌ سعر المكتب غير صحيح.",
                    "error"
                );

                return;

            }


            if (
                !Number.isFinite(home) ||
                home < 0 ||
                !Number.isInteger(home)
            ) {

                showMessage(
                    "❌ سعر المنزل غير صحيح.",
                    "error"
                );

                return;

            }


            const ref =
                getDeliveryDoc(
                    wilayaId
                );


            await setDoc(

                ref,

                {

                    name:
                        wilayaId,

                    office:
                        office,

                    home:
                        home,

                    updatedAt:
                        serverTimestamp()

                },

                {
                    merge: true
                }

            );


            showMessage(
                "✅ تم حفظ أسعار " +
                wilayaId +
                " بنجاح."
            );


        } catch (error) {

            console.error(
                "SAVE DELIVERY ERROR:",
                error
            );

            showMessage(
                "❌ فشل حفظ الأسعار: " +
                error.message,
                "error"
            );

        }

    }


    /* =====================================================
       DELETE WILAYA
    ====================================================== */

    async function deleteWilaya(
        wilayaId
    ) {

        const confirmed =
            confirm(
                "هل تريد حذف ولاية " +
                wilayaId +
                " من أسعار التوصيل؟"
            );


        if (!confirmed) {
            return;
        }


        try {

            await deleteDoc(
                getDeliveryDoc(
                    wilayaId
                )
            );


            showMessage(
                "✅ تم حذف " +
                wilayaId +
                " من متجرك."
            );


            await loadDelivery();


        } catch (error) {

            console.error(
                "DELETE DELIVERY ERROR:",
                error
            );

            showMessage(
                "❌ فشل حذف الولاية: " +
                error.message,
                "error"
            );

        }

    }


    /* =====================================================
       ADD NEW WILAYA
    ====================================================== */

    async function addNewWilaya() {

        hideMessage();


        if (!currentUser) {

            showMessage(
                "❌ يجب تسجيل الدخول أولًا.",
                "error"
            );

            return;

        }


        const name =
            newWilaya.value.trim();


        const officeValue =
            newOffice.value.trim();


        const homeValue =
            newHome.value.trim();


        if (!name) {

            showMessage(
                "❌ أدخل اسم الولاية.",
                "error"
            );

            newWilaya.focus();

            return;

        }


        if (
            officeValue === "" ||
            homeValue === ""
        ) {

            showMessage(
                "❌ أدخل سعر المكتب وسعر المنزل.",
                "error"
            );

            return;

        }


        const office =
            Number(
                officeValue
            );


        const home =
            Number(
                homeValue
            );


        if (
            !Number.isFinite(office) ||
            office < 0 ||
            !Number.isInteger(office)
        ) {

            showMessage(
                "❌ أدخل سعر مكتب صحيح بدون كسور.",
                "error"
            );

            return;

        }


        if (
            !Number.isFinite(home) ||
            home < 0 ||
            !Number.isInteger(home)
        ) {

            showMessage(
                "❌ أدخل سعر منزل صحيح بدون كسور.",
                "error"
            );

            return;

        }


        addBtn.disabled =
            true;


        addBtn.innerHTML = `

            <i class="fa-solid fa-spinner fa-spin"></i>

            جاري الإضافة...

        `;


        try {

            const ref =
                getDeliveryDoc(
                    name
                );


            const existing =
                await getDoc(
                    ref
                );


            if (
                existing.exists()
            ) {

                showMessage(
                    "⚠️ هذه الولاية موجودة بالفعل.",
                    "error"
                );

                return;

            }


            await setDoc(

                ref,

                {

                    name:
                        name,

                    office:
                        office,

                    home:
                        home,

                    createdAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                }

            );


            newWilaya.value =
                "";

            newOffice.value =
                "";

            newHome.value =
                "";


            showMessage(
                "✅ تمت إضافة ولاية " +
                name +
                " بنجاح."
            );


            await loadDelivery();


        } catch (error) {

            console.error(
                "ADD DELIVERY ERROR:",
                error
            );

            showMessage(
                "❌ فشل إضافة الولاية: " +
                error.message,
                "error"
            );


        } finally {

            addBtn.disabled =
                false;


            addBtn.innerHTML = `

                <i class="fa-solid fa-plus"></i>

                إضافة

            `;

        }

    }


    /* =====================================================
       INITIALIZE DEFAULT TARIFFS
    ====================================================== */

    async function initializeDefaults() {

        if (!currentUser) {
            return;
        }


        try {

            const snapshot =
                await getDocs(
                    getDeliveryCollection()
                );


            /*
             * مهم جدًا:
             *
             * إذا كان المتجر لديه أي
             * ولاية محفوظة بالفعل،
             * لن نقوم بإنشاء القائمة
             * الافتراضية مرة أخرى.
             */

            if (
                !snapshot.empty
            ) {

                return;

            }


            const entries =
                Object.entries(
                    defaultTariffs
                );


            /*
             * إنشاء الأسعار الافتراضية
             * لهذا المتجر فقط.
             */

            for (
                const [
                    wilaya,
                    prices
                ]
                of entries
            ) {

                await setDoc(

                    getDeliveryDoc(
                        wilaya
                    ),

                    {

                        name:
                            wilaya,

                        office:
                            prices.office,

                        home:
                            prices.home,

                        createdAt:
                            serverTimestamp(),

                        updatedAt:
                            serverTimestamp()

                    }

                );

            }


            showMessage(
                "✅ تمت إضافة قائمة أسعار التوصيل الافتراضية لمتجرك."
            );


        } catch (error) {

            console.error(
                "DEFAULT DELIVERY ERROR:",
                error
            );


            showMessage(
                "❌ تعذر إنشاء الأسعار الافتراضية: " +
                error.message,
                "error"
            );

        }

    }


    /* =====================================================
       ESCAPE HTML
    ====================================================== */

    function escapeHtml(
        value
    ) {

        return String(
            value ?? ""
        )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

    }


    function escapeAttribute(
        value
    ) {

        return escapeHtml(
            value
        );

    }


    /* =====================================================
       DELIVERY EVENTS
    ====================================================== */

    deliveryList.addEventListener(
        "click",
        async function(event) {

            const button =
                event.target.closest(
                    "button"
                );


            if (!button) {
                return;
            }


            const action =
                button.dataset.action;


            const wilayaId =
                button.dataset.id;


            if (!wilayaId) {
                return;
            }


            const row =
                button.closest(
                    ".delivery-row"
                );


            if (
                action === "save" &&
                row
            ) {

                await saveWilaya(
                    wilayaId,
                    row
                );

            }


            if (
                action === "delete"
            ) {

                await deleteWilaya(
                    wilayaId
                );

            }

        }
    );


    /* =====================================================
       ADD BUTTON
    ====================================================== */

    addBtn.addEventListener(
        "click",
        addNewWilaya
    );


    /* =====================================================
       RELOAD
    ====================================================== */

    reloadBtn.addEventListener(
        "click",
        async function() {

            hideMessage();

            await loadDelivery();

        }
    );


    /* =====================================================
       ENTER KEY
    ====================================================== */

    newWilaya.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                addNewWilaya();

            }

        }
    );


    newOffice.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                addNewWilaya();

            }

        }
    );


    newHome.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                addNewWilaya();

            }

        }
    );


    /* =====================================================
       AUTH STATE
    ====================================================== */

    onAuthStateChanged(

        auth,

        async function(user) {


            /* =============================================
               NOT LOGGED IN
            ============================================== */

            if (!user) {

                currentUser =
                    null;


                storeNameElement.textContent =
                    "غير مسجل";


                ownerUidElement.textContent =
                    "---";


                deliveryList.innerHTML = `

                    <div class="empty">

                        <i class="fa-solid fa-lock"></i>

                        <p>

                            يجب تسجيل الدخول إلى حساب المتجر أولًا.

                        </p>

                    </div>

                `;


                countElement.textContent =
                    "غير متاح";


                addBtn.disabled =
                    true;


                return;

            }


            /* =============================================
               CURRENT USER
            ============================================== */

            currentUser =
                user;


            ownerUidElement.textContent =
                user.uid;


            addBtn.disabled =
                false;


            try {


                /* =========================================
                   1. LOAD STORE
                ========================================== */

                await loadStore();


                /* =========================================
                   2. CREATE DEFAULT DELIVERY
                      ONLY IF EMPTY
                ========================================== */

                await initializeDefaults();


                /* =========================================
                   3. LOAD DELIVERY
                ========================================== */

                await loadDelivery();


            } catch (error) {

                console.error(
                    "INITIALIZATION ERROR:",
                    error
                );


                showMessage(
                    "❌ " +
                    error.message,
                    "error"
                );

            }

        }

    );

</script>
