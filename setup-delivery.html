<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | إعداد أسعار التوصيل</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#F5F0E8;
    padding:30px 15px;
    text-align:center;
    margin:0;
}

.container{
    max-width:850px;
    margin:auto;
}

h1{
    color:#222;
    margin-bottom:10px;
}

p{
    color:#555;
    line-height:1.8;
}

.info{
    background:#fff;
    padding:18px;
    border-radius:15px;
    margin:20px 0;
    text-align:right;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
    line-height:2;
}

.info strong{
    color:#222;
}

.path{
    direction:ltr;
    text-align:left;
    background:#f3f3f3;
    padding:8px 12px;
    border-radius:8px;
    margin-top:5px;
    word-break:break-all;
}

button{
    background:#222;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:12px;
    font-size:17px;
    cursor:pointer;
    width:100%;
    max-width:380px;
}

button:hover{
    background:#444;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#result{
    background:white;
    margin-top:20px;
    padding:20px;
    border-radius:15px;
    text-align:right;
    white-space:pre-line;
    line-height:1.9;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
    word-break:break-word;
}

.success{
    color:green;
}

.error{
    color:#c00;
}

.warning{
    color:#a05a00;
}

</style>

</head>


<body>

<div class="container">

<h1>🚚 إعداد أسعار التوصيل</h1>

<p>
سيتم تجهيز أسعار التوصيل الخاصة بهذا المتجر
اعتمادًا على الأسعار الافتراضية التي وضعتها الإدارة.
</p>


<div class="info">

<div>
<strong>المتجر:</strong>
<span id="storeName">جاري التحقق...</span>
</div>

<div>
<strong>UID:</strong>
<span id="userUid">جاري التحقق...</span>
</div>

<div style="margin-top:10px;">

<strong>الأسعار الافتراضية:</strong>

<div class="path">
delivery/{wilaya}
</div>

</div>

<div style="margin-top:10px;">

<strong>أسعار المتجر الخاصة:</strong>

<div class="path">
stores/{UID}/delivery/{wilaya}
</div>

</div>

</div>


<button id="startBtn" disabled>
تهيئة أسعار التوصيل للمتجر
</button>


<div id="result">
⏳ جاري التحقق من تسجيل الدخول...
</div>

</div>



<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs,
    writeBatch
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";



/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

    authDomain:"g-glam.firebaseapp.com",

    projectId:"g-glam",

    storageBucket:"g-glam.firebasestorage.app",

    messagingSenderId:"997228419719",

    appId:"1:997228419719:web:f9d88de7ea2c6f457e3622",

    measurementId:"G-WX1K1F83F6"

};



/* =====================================================
   INITIALIZE
===================================================== */

const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


const auth =
getAuth(app);



/* =====================================================
   ELEMENTS
===================================================== */

const result =
document.getElementById("result");


const startBtn =
document.getElementById("startBtn");


const storeNameElement =
document.getElementById("storeName");


const userUidElement =
document.getElementById("userUid");



/* =====================================================
   CURRENT USER
===================================================== */

let currentUser = null;



/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(auth, async (user)=>{

    if(!user){

        currentUser = null;

        startBtn.disabled = true;

        storeNameElement.innerText =
        "غير مسجل الدخول";

        userUidElement.innerText =
        "-";

        result.innerText =
        "❌ لا يوجد مستخدم مسجل الدخول.\n\n" +
        "يجب تسجيل الدخول إلى حساب المتجر أولاً.";

        result.className =
        "error";

        return;
    }


    currentUser = user;


    userUidElement.innerText =
    user.uid;


    try{

        /* =============================================
           GET STORE
        ============================================= */

        const storeRef =
        doc(
            db,
            "stores",
            user.uid
        );


        const storeSnapshot =
        await getDoc(storeRef);


        if(!storeSnapshot.exists()){

            startBtn.disabled = true;

            storeNameElement.innerText =
            "غير موجود";

            result.innerText =
            "❌ لم يتم العثور على متجر مرتبط بهذا الحساب.\n\n" +
            "UID:\n" +
            user.uid;

            result.className =
            "error";

            return;
        }


        const storeData =
        storeSnapshot.data();


        storeNameElement.innerText =
        storeData.storeName ||
        storeData.name ||
        "متجرك";


        startBtn.disabled = false;


        result.innerText =
        "✅ تم العثور على متجرك.\n\n" +
        "يمكنك الآن تهيئة أسعار التوصيل.";

        result.className =
        "";

    }catch(error){

        console.error(error);

        startBtn.disabled = true;

        result.innerText =
        "❌ حدث خطأ أثناء التحقق من المتجر:\n\n" +
        error.message;

        result.className =
        "error";
    }

});



/* =====================================================
   INITIALIZE DELIVERY FOR STORE
===================================================== */

startBtn.addEventListener(
"click",
async ()=>{

    if(!currentUser){

        alert(
            "يجب تسجيل الدخول إلى حساب المتجر أولاً."
        );

        return;
    }


    const confirmed =
    confirm(

        "سيتم نسخ أسعار التوصيل الافتراضية إلى متجرك.\n\n" +

        "الأسعار الموجودة مسبقًا في متجرك " +
        "لن يتم استبدالها.\n\n" +

        "هل تريدين المتابعة؟"

    );


    if(!confirmed){

        return;
    }


    startBtn.disabled = true;


    result.innerText =
    "⏳ جاري قراءة الأسعار الافتراضية...\n";


    try{


        /* =============================================
           1. GET DEFAULT DELIVERY COLLECTION
        ============================================= */

        const defaultDeliveryRef =
        collection(
            db,
            "delivery"
        );


        const defaultSnapshot =
        await getDocs(
            defaultDeliveryRef
        );


        if(defaultSnapshot.empty){

            throw new Error(
                "لم يتم العثور على أي أسعار في Collection delivery العامة."
            );

        }


        result.innerText =
        "⏳ تم العثور على " +
        defaultSnapshot.size +
        " ولاية.\n\n" +
        "جاري فحص أسعار متجرك...";



        /* =============================================
           2. STORE DELIVERY SUBCOLLECTION
        ============================================= */

        const storeDeliveryRef =
        collection(
            db,
            "stores",
            currentUser.uid,
            "delivery"
        );


        const existingSnapshot =
        await getDocs(
            storeDeliveryRef
        );


        const existingWilayas =
        new Set();


        existingSnapshot.forEach(
        (deliveryDoc)=>{

            existingWilayas.add(
                deliveryDoc.id
            );

        });



        /* =============================================
           3. PREPARE BATCH
        ============================================= */

        let batch =
        writeBatch(db);


        let operationCount = 0;

        let addedCount = 0;

        let existingCount = 0;


        const addedWilayas = [];



        /* =============================================
           4. COPY DEFAULT PRICES
           ONLY IF WILAYA DOES NOT EXIST
        ============================================= */

        defaultSnapshot.forEach(
        (wilayaDoc)=>{

            const wilaya =
            wilayaDoc.id;


            const defaultData =
            wilayaDoc.data();


            /* -----------------------------------------
               Already exists
            ----------------------------------------- */

            if(
                existingWilayas.has(wilaya)
            ){

                existingCount++;

                return;

            }



            /* -----------------------------------------
               Validate prices
            ----------------------------------------- */

            const office =
            Number(defaultData.office);


            const home =
            Number(defaultData.home);


            if(
                !Number.isFinite(office) ||
                !Number.isFinite(home)
            ){

                console.warn(
                    "أسعار غير صالحة:",
                    wilaya,
                    defaultData
                );

                return;

            }



            /* -----------------------------------------
               Store-specific document
            ----------------------------------------- */

            const storeWilayaRef =
            doc(
                db,
                "stores",
                currentUser.uid,
                "delivery",
                wilaya
            );


            batch.set(

                storeWilayaRef,

                {

                    office: office,

                    home: home

                }

            );


            operationCount++;

            addedCount++;

            addedWilayas.push(
                wilaya
            );


        });



        /* =============================================
           5. FIRESTORE BATCH LIMIT
        ============================================= */

        if(operationCount > 0){

            await batch.commit();

        }



        /* =============================================
           6. RESULT
        ============================================= */

        let message =
        "🎉 تمت تهيئة أسعار التوصيل بنجاح!\n\n";


        message +=
        "المتجر:\n" +
        (
            document.getElementById(
                "storeName"
            ).innerText
        ) +
        "\n\n";


        message +=
        "UID:\n" +
        currentUser.uid +
        "\n\n";


        message +=
        "الأسعار الافتراضية:\n" +
        defaultSnapshot.size +
        " ولاية\n\n";


        message +=
        "تمت إضافة:\n" +
        addedCount +
        " ولاية\n\n";


        message +=
        "كانت موجودة مسبقًا:\n" +
        existingCount +
        " ولاية\n\n";


        message +=
        "المسار:\n" +
        "stores/" +
        currentUser.uid +
        "/delivery/{wilaya}\n\n";


        if(
            addedCount === 0 &&
            existingCount > 0
        ){

            message +=
            "ℹ️ جميع الولايات موجودة مسبقًا.\n" +
            "لم يتم تغيير أي سعر.";

        }else{

            message +=
            "✅ تم نسخ الأسعار الافتراضية.\n" +
            "يمكن الآن للتاجر تعديل أسعار متجره.";

        }


        result.innerText =
        message;


        result.className =
        "success";


        alert(
            "تم تجهيز أسعار التوصيل الخاصة بالمتجر بنجاح ✅"
        );


    }catch(error){

        console.error(
            "Delivery initialization error:",
            error
        );


        result.innerText =
        "❌ حدث خطأ أثناء تجهيز أسعار التوصيل:\n\n" +
        error.message +
        "\n\n" +
        "تحققي من Firestore Rules وتسجيل الدخول.";

        result.className =
        "error";


        alert(
            "حدث خطأ أثناء حفظ أسعار التوصيل."
        );

    }


    startBtn.disabled = false;

});


</script>

</body>
</html>
