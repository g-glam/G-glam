<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | إعداد أسعار التوصيل</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#F5F0E8;
    padding:30px 15px;
    text-align:center;
    margin:0;
}

.container{
    max-width:700px;
    margin:auto;
}

h1{
    color:#222;
    margin-bottom:10px;
}

p{
    color:#555;
    line-height:1.8;
}

.info{
    background:#fff;
    padding:15px;
    border-radius:15px;
    margin:20px 0;
    text-align:right;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.info strong{
    color:#222;
}

button{
    background:#222;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:12px;
    font-size:17px;
    cursor:pointer;
    width:100%;
    max-width:350px;
}

button:hover{
    background:#444;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#result{
    background:white;
    margin-top:20px;
    padding:20px;
    border-radius:15px;
    text-align:right;
    white-space:pre-line;
    line-height:1.8;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.success{
    color:green;
}

.error{
    color:#c00;
}

</style>

</head>


<body>

<div class="container">

<h1>🚚 إعداد أسعار التوصيل</h1>

<p>
سيتم حفظ أسعار التوصيل داخل متجر صاحب الحساب الحالي.
</p>

<div class="info">

<div>
<strong>طريقة الربط:</strong>
Firebase Authentication UID
</div>

<div style="margin-top:8px;">
<strong>مكان التخزين:</strong>
stores / UID / delivery
</div>

</div>

<br>

<button id="startBtn">
إضافة أسعار التوصيل للمتجر
</button>

<div id="result">
لم يبدأ التنفيذ بعد...
</div>

</div>


<script type="module">


/* =========================================
   FIREBASE
========================================= */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {
    getFirestore,
    doc,
    getDoc,
    setDoc
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


const firebaseConfig = {

    apiKey:"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

    authDomain:"g-glam.firebaseapp.com",

    projectId:"g-glam",

    storageBucket:"g-glam.firebasestorage.app",

    messagingSenderId:"997228419719",

    appId:"1:997228419719:web:f9d88de7ea2c6f457e3622",

    measurementId:"G-WX1K1F83F6"

};


const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


const auth =
getAuth(app);



/* =========================================
   ELEMENTS
========================================= */

const result =
document.getElementById("result");


const startBtn =
document.getElementById("startBtn");



/* =========================================
   CURRENT USER
========================================= */

let currentUser = null;



onAuthStateChanged(auth, async (user)=>{

    if(user){

        currentUser = user;

        result.innerText =
        "✅ تم تسجيل الدخول.\n\n" +
        "UID:\n" +
        user.uid +
        "\n\nيمكنك الآن إضافة أسعار التوصيل لهذا المتجر.";

    }else{

        currentUser = null;

        startBtn.disabled = true;

        result.innerText =
        "❌ لا يوجد مستخدم مسجل الدخول.\n\n" +
        "يجب تسجيل الدخول إلى حساب المتجر أولاً.";

    }

});



/* =========================================
   DELIVERY TARIFFS
========================================= */

const tarifs = {

"Adrar":{office:1100,home:1400},
"Chlef":{office:450,home:650},
"Laghouat":{office:700,home:1000},
"Oum El Bouaghi":{office:500,home:650},
"Batna":{office:400,home:500},
"Bejaia":{office:500,home:650},
"Biskra":{office:600,home:950},
"Bechar":{office:1100,home:1400},
"Blida":{office:450,home:650},
"Bouira":{office:450,home:650},
"Tamanrasset":{office:1400,home:1600},
"Tebessa":{office:600,home:950},
"Tlemcen":{office:500,home:650},
"Tiaret":{office:500,home:650},
"Tizi Ouzou":{office:450,home:650},
"Alger":{office:450,home:700},
"Djelfa":{office:600,home:900},
"Jijel":{office:500,home:650},
"Setif":{office:450,home:650},
"Saida":{office:600,home:900},
"Skikda":{office:500,home:650},
"Sidi Bel Abbes":{office:500,home:650},
"Annaba":{office:500,home:650},
"Guelma":{office:600,home:900},
"Constantine":{office:450,home:650},
"Medea":{office:450,home:650},
"Mostaganem":{office:500,home:650},
"M'Sila":{office:500,home:650},
"Mascara":{office:600,home:900},
"Ouargla":{office:800,home:1100},
"Oran":{office:450,home:650},
"El Bayadh":{office:800,home:1100},
"Illizi":{office:1700,home:2000},
"Bordj Bou Arreridj":{office:450,home:650},
"Boumerdes":{office:450,home:650},
"El Tarf":{office:600,home:950},
"Tindouf":{office:1400,home:1600},
"Tissemsilt":{office:500,home:650},
"El Oued":{office:800,home:1100},
"Khenchela":{office:600,home:900},
"Souk Ahras":{office:600,home:900},
"Tipaza":{office:450,home:650},
"Mila":{office:500,home:650},
"Ain Defla":{office:450,home:650},
"Naama":{office:800,home:1100},
"Ain Temouchent":{office:600,home:900},
"Ghardaia":{office:800,home:1100},
"Relizane":{office:500,home:650},

"El M'Ghair":{office:1100,home:1400},
"El Menia":{office:1700,home:2000},
"Ouled Djellal":{office:700,home:1000},
"Bordj Badji Mokhtar":{office:1000,home:1400},
"Beni Abbes":{office:1100,home:1400},
"Timimoun":{office:1700,home:2000},
"Touggourt":{office:800,home:1100},
"Djanet":{office:1700,home:2000},
"In Salah":{office:800,home:1100},
"In Guezzam":{office:1000,home:1300}

};



/* =========================================
   ADD DELIVERY PRICES
========================================= */

startBtn.addEventListener(
"click",
async ()=>{

    if(!currentUser){

        alert(
            "يجب تسجيل الدخول إلى حساب المتجر أولاً."
        );

        return;
    }


    const confirmAction =
    confirm(

        "هل تريدين إضافة أسعار التوصيل لهذا المتجر؟\n\n" +

        "سيتم حفظ الأسعار داخل:\n" +

        "stores/" +

        currentUser.uid +

        "/delivery"

    );


    if(!confirmAction){

        return;

    }


    startBtn.disabled = true;


    result.innerText =
    "⏳ جاري تجهيز أسعار التوصيل...\n";


    try{


        /* =====================================
           1. التأكد من وجود المتجر
        ===================================== */

        const storeRef =
        doc(
            db,
            "stores",
            currentUser.uid
        );


        const storeSnapshot =
        await getDoc(storeRef);


        if(!storeSnapshot.exists()){

            throw new Error(
                "لم يتم العثور على متجر مرتبط بهذا الحساب."
            );

        }



        /* =====================================
           2. تجهيز Map الأسعار
        ===================================== */

        const deliveryData = {};


        for(
            const [wilaya, prices]
            of Object.entries(tarifs)
        ){

            deliveryData[wilaya] = {

                office: prices.office,

                home: prices.home

            };

        }



        /* =====================================
           3. حفظ delivery داخل المتجر
        ===================================== */

        await setDoc(

            storeRef,

            {

                delivery: deliveryData

            },

            {

                merge:true

            }

        );



        /* =====================================
           4. عرض النتيجة
        ===================================== */

        let output =
        "🎉 تم حفظ أسعار التوصيل بنجاح!\n\n";


        output +=
        "المتجر:\n" +
        currentUser.uid +
        "\n\n";


        output +=
        "مكان التخزين:\n" +
        "stores/" +
        currentUser.uid +
        " → delivery\n\n";


        output +=
        "عدد الولايات: " +
        Object.keys(tarifs).length +
        "\n\n";


        output +=
        "تفاصيل الأسعار:\n\n";


        for(
            const [wilaya, prices]
            of Object.entries(tarifs)
        ){

            output +=
            "✅ " +
            wilaya +
            " : مكتب " +
            prices.office +
            " DA / منزل " +
            prices.home +
            " DA\n";

        }


        result.innerText =
        output;


        result.className =
        "success";


        alert(
            "تم حفظ أسعار التوصيل الخاصة بالمتجر بنجاح ✅"
        );


    }catch(error){

        console.error(error);


        result.innerText =
        "❌ حدث خطأ أثناء الحفظ:\n\n" +
        error.message;


        result.className =
        "error";


        alert(
            "حدث خطأ أثناء حفظ أسعار التوصيل."
        );

    }


    startBtn.disabled = false;

});


</script>

</body>
</html>
