<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سلة التسوق</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f8f8f8;
padding:20px;
}

h1,h2,h3{
text-align:center;
}

.item{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:12px;
box-shadow:0 0 8px rgba(0,0,0,.1);
}

input,select{
width:100%;
padding:12px;
margin:6px 0;
border:1px solid #ddd;
border-radius:8px;
box-sizing:border-box;
}

.delete-btn{
background:red;
color:white;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
}

.order-btn{
background:#0084ff;
color:white;
border:none;
padding:14px;
border-radius:10px;
cursor:pointer;
width:100%;
font-size:18px;
margin-top:15px;
}

</style>

</head>

<body>

<h1>🛒 سلة التسوق</h1>

<div id="cart-items"></div>

<h3 id="productsTotal">
مجموع المنتجات: 0 DA
</h3>

<h2>معلومات الزبون</h2>

<input type="text" id="name" placeholder="الاسم واللقب">

<input type="text" id="phone" placeholder="رقم الهاتف">

<select id="wilaya">
<option value="">اختر الولاية</option>
</select>

<input type="text" id="commune" placeholder="البلدية">

<input type="text" id="address" placeholder="العنوان الكامل">
<select id="deliveryType">

<option value="">
نوع التوصيل
</option>

<option value="إلى المكتب">
إلى المكتب
</option>

<option value="إلى باب المنزل">
إلى باب المنزل
</option>

</select>

<h3 id="deliveryPrice">
سعر التوصيل: --
</h3>

<h2 id="finalTotal">
المجموع النهائي: --
</h2>

<button
onclick="sendOrder()"
class="order-btn">
📦 إرسال الطلب
</button>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzgEMuUVkrHmurIp3cU-EmBL612FlF52wvLTlXfVupbrEhFtlx2l_E-gvLWfwnNIv0taQ/exec";

let cart =
JSON.parse(
localStorage.getItem("cart")
) || [];

let tarifs = {};
let productsTotal = 0;
let deliveryCost = 0;

function displayCart(){

let container =
document.getElementById(
"cart-items"
);

container.innerHTML = "";

productsTotal = 0;
  if(cart.length === 0){

container.innerHTML =
"<p>السلة فارغة</p>";

}else{

cart.forEach((item,index)=>{

let qty =
item.quantity || 1;

let itemTotal =
item.price * qty;

productsTotal += itemTotal;

container.innerHTML += `

<div class="item">

<h3>${item.name}</h3>

<p>
الكمية: ${qty}<br>
الإجمالي: ${itemTotal} DA
</p>

<button
class="delete-btn"
onclick="removeItem(${index})">
حذف
</button>

</div>

`;

});

}

document.getElementById(
"productsTotal"
).innerText =
"مجموع المنتجات: " +
productsTotal +
" DA";

updateFinalTotal();

}

function removeItem(index){

cart.splice(index,1);

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

displayCart();

}

fetch(
SCRIPT_URL + "?action=prices"
)
.then(response => response.json())
.then(data => {

console.log(data);

tarifs = data;

let wilayaSelect =
document.getElementById("wilaya");

Object.keys(data).forEach(wilaya => {

let option =
document.createElement("option");

option.value = wilaya;
option.textContent = wilaya;

wilayaSelect.appendChild(option);

});
})
.catch(error => {
console.log(error);
alert(error);
});

tarifs = data;

let wilayaSelect =
document.getElementById("wilaya");

Object.keys(data).forEach(wilaya => {

let option =
document.createElement("option");

option.value = wilaya;
option.textContent = wilaya;

wilayaSelect.appendChild(option);

});

});

document.getElementById("wilaya")
.addEventListener(
"change",
updateDelivery
);

document.getElementById("deliveryType")
.addEventListener(
"change",
updateDelivery
);

function updateDelivery(){

let wilaya =
document.getElementById("wilaya").value;

let type =
document.getElementById("deliveryType").value;

if(!wilaya || !type || !tarifs[wilaya]){
return;
}

deliveryCost =
type === "إلى المكتب"
? Number(tarifs[wilaya].toOffice)
: Number(tarifs[wilaya].toHome);

document.getElementById(
"deliveryPrice"
).innerText =
"سعر التوصيل: " +
deliveryCost +
" DA";

updateFinalTotal();

}

function updateFinalTotal(){

document.getElementById(
"finalTotal"
).innerText =
"المجموع النهائي: " +
(productsTotal + deliveryCost) +
" DA";

}

displayCart();
  function sendOrder(){

if(cart.length === 0){

alert("السلة فارغة");

return;

}

let products = "";

cart.forEach(item => {

products +=
item.name +
" | الكمية: " +
(item.quantity || 1) +
"\n";

});

fetch(
SCRIPT_URL,
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

name:
document.getElementById(
"name"
).value,

phone:
document.getElementById(
"phone"
).value,

wilaya:
document.getElementById(
"wilaya"
).value,

commune:
document.getElementById(
"commune"
).value,

address:
document.getElementById(
"address"
).value,

deliveryType:
document.getElementById(
"deliveryType"
).value,

deliveryPrice:
deliveryCost,

total:
productsTotal +
deliveryCost,

products:
products

})

}
)
.then(response =>
response.text()
)
.then(data => {

alert(
"تم إرسال الطلب بنجاح"
);

localStorage.removeItem(
"cart"
);

window.location.href =
"index.html";

})
.catch(error => {

alert(
"حدث خطأ أثناء الإرسال"
);

console.log(error);

});

}

</script>

</body>
</html>
