<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سلة التسوق | G-Glam</title>


<style>

*{
box-sizing:border-box;
}


body{

font-family:Arial,sans-serif;
background:#f7f7f7;
margin:0;
padding:20px;

}



.container{

max-width:650px;
margin:auto;

}



h1{

text-align:center;
font-size:28px;
margin-bottom:25px;

}



.card{

background:white;
padding:20px;
border-radius:12px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
margin-bottom:20px;

}



.item{

border-bottom:1px solid #eee;
padding:15px 0;

}



.item:last-child{

border-bottom:none;

}



.item h3{

margin:0 0 10px;

}



.qty-box{

display:flex;
align-items:center;
justify-content:center;
gap:15px;
margin:10px 0;

}



.qty-btn{

width:35px;
height:35px;
border:none;
border-radius:50%;
background:#111;
color:white;
font-size:20px;
cursor:pointer;

}



.delete-btn{

background:#c62828;
color:white;
border:none;
padding:8px 15px;
border-radius:7px;
cursor:pointer;

}




input,
select{

width:100%;
padding:12px;
margin:7px 0;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;

}




.total{

background:#111;
color:white;
padding:15px;
border-radius:10px;
text-align:center;
font-size:18px;
font-weight:bold;
margin:15px 0;

}




.order-btn{

width:100%;
padding:15px;
background:#111;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;

}



.order-btn:hover{

background:#333;

}



h2{

font-size:20px;
border-bottom:1px solid #eee;
padding-bottom:10px;

}



</style>


</head>



<body>



<div class="container">



<h1>
G-Glam
</h1>



<div class="card">


<h2>
سلة التسوق
</h2>



<div id="cart-items">

</div>



<div class="total" id="productsTotal">

مجموع المنتجات: 0 DA

</div>


</div>





<div class="card">


<h2>
معلومات الزبون
</h2>



<input 
type="text"
id="name"
placeholder="الاسم واللقب">



<input 
type="text"
id="phone"
placeholder="رقم الهاتف">



<select id="wilaya">

<option value="">
اختر الولاية
</option>


</select>



<input
type="text"
id="commune"
placeholder="البلدية">



<input
type="text"
id="address"
placeholder="العنوان الكامل">



<select id="deliveryType">


<option value="">
اختر نوع التوصيل
</option>


<option value="إلى المكتب">
إلى المكتب
</option>



<option value="إلى باب المنزل">
إلى باب المنزل
</option>



</select>




<div class="total" id="deliveryPrice">

سعر التوصيل: --

</div>



<div class="total" id="finalTotal">

المجموع النهائي: --

</div>



<button 
class="order-btn"
onclick="sendOrder()">

إرسال الطلب

</button>



</div>



</div>



<script type="module">
    
import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
collection,
addDoc,
serverTimestamp

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";



const firebaseConfig = {


apiKey: "AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain: "g-glam.firebaseapp.com",

projectId: "g-glam",

storageBucket: "g-glam.firebasestorage.app",

messagingSenderId: "997228419719",

appId: "1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId: "G-WX1K1F83F6"

};



const app = initializeApp(firebaseConfig);


const db = getFirestore(app);





let cart =

JSON.parse(localStorage.getItem("cart")) || [];



let productsTotal = 0;


let deliveryCost = 0;




const tarifs = {

"Adrar":{office:1100,home:1400},
"Chlef":{office:450,home:650},
"Laghouat":{office:700,home:1000},
"Oum El Bouaghi":{office:500,home:650},
"Batna":{office:400,home:500},
"Bejaia":{office:500,home:650},
"Biskra":{office:600,home:950},
"Bechar":{office:1100,home:1400},
"Blida":{office:450,home:650},
"Bouira":{office:450,home:650},
"Tamanrasset":{office:1400,home:1600},
"Tebessa":{office:600,home:950},
"Tlemcen":{office:500,home:650},
"Tiaret":{office:500,home:650},
"Tizi Ouzou":{office:450,home:650},
"Alger":{office:450,home:700},
"Djelfa":{office:600,home:900},
"Jijel":{office:500,home:650},
"Setif":{office:450,home:650},
"Saida":{office:600,home:900},
"Skikda":{office:500,home:650},
"Sidi Bel Abbes":{office:500,home:650},
"Annaba":{office:500,home:650},
"Guelma":{office:600,home:900},
"Constantine":{office:450,home:650},
"Medea":{office:450,home:650},
"Mostaganem":{office:500,home:650},
"M'Sila":{office:500,home:650},
"Mascara":{office:600,home:900},
"Ouargla":{office:800,home:1100},
"Oran":{office:450,home:650},
"El Bayadh":{office:800,home:1100},
"Illizi":{office:1700,home:2000},
"Bordj Bou Arreridj":{office:450,home:650},
"Boumerdes":{office:450,home:650},
"El Tarf":{office:600,home:950},
"Tindouf":{office:1400,home:1600},
"Tissemsilt":{office:500,home:650},
"El Oued":{office:800,home:1100},
"Khenchela":{office:600,home:900},
"Souk Ahras":{office:600,home:900},
"Tipaza":{office:450,home:650},
"Mila":{office:500,home:650},
"Ain Defla":{office:450,home:650},
"Naama":{office:800,home:1100},
"Ain Temouchent":{office:600,home:900},
"Ghardaia":{office:800,home:1100},
"Relizane":{office:500,home:650},

"El M'Ghair":{office:1100,home:1400},
"El Menia":{office:1700,home:2000},
"Ouled Djellal":{office:700,home:1000},
"Bordj Badji Mokhtar":{office:1000,home:1400},
"Beni Abbes":{office:1100,home:1400},
"Timimoun":{office:1700,home:2000},
"Touggourt":{office:800,home:1100},
"Djanet":{office:1700,home:2000},
"In Salah":{office:800,home:1100},
"In Guezzam":{office:1000,home:1300}

};





const wilayaSelect =

document.getElementById("wilaya");



Object.keys(tarifs).forEach(w=>{


let option =
document.createElement("option");


option.value=w;

option.textContent=w;


wilayaSelect.appendChild(option);



});





function displayCart(){


let container =

document.getElementById("cart-items");



container.innerHTML="";


productsTotal=0;



if(cart.length===0){


container.innerHTML=

"السلة فارغة";


}else{


cart.forEach((item,index)=>{


let qty=item.quantity || 1;


let total=item.price * qty;


productsTotal += total;



container.innerHTML += `


<div class="item">


<h3>${item.name}</h3>


<p>

السعر: ${item.price} DA

</p>



<div class="qty-box">


<button 
class="qty-btn"
onclick="changeQty(${index},-1)">

-

</button>


<b>${qty}</b>



<button
class="qty-btn"
onclick="changeQty(${index},1)">

+

</button>


</div>



<p>

المجموع:
${total} DA

</p>



<button 
class="delete-btn"
onclick="removeItem(${index})">

حذف

</button>



</div>


`;



});


}



document.getElementById("productsTotal")
.innerText =

"مجموع المنتجات: "

+ productsTotal +

" DA";



updateFinalTotal();


}




displayCart();
    
// تغيير كمية المنتج

window.changeQty = function(index,value){


cart[index].quantity =
(cart[index].quantity || 1) + value;



if(cart[index].quantity < 1){

cart[index].quantity = 1;

}



localStorage.setItem(
"cart",
JSON.stringify(cart)
);



displayCart();


};





// حذف منتج

window.removeItem = function(index){


cart.splice(index,1);



localStorage.setItem(
"cart",
JSON.stringify(cart)
);



displayCart();


};






// تحديث سعر التوصيل

document
.getElementById("wilaya")
.addEventListener(
"change",
updateDelivery
);



document
.getElementById("deliveryType")
.addEventListener(
"change",
updateDelivery
);





function updateDelivery(){


let wilaya =

document.getElementById("wilaya").value;



let type =

document.getElementById("deliveryType").value;




if(!wilaya || !type){


deliveryCost = 0;


document.getElementById("deliveryPrice")
.innerText =
"سعر التوصيل: --";



updateFinalTotal();


return;


}





if(type === "إلى المكتب"){


deliveryCost =
tarifs[wilaya].office;



}else{


deliveryCost =
tarifs[wilaya].home;



}




document.getElementById("deliveryPrice")
.innerText =

"سعر التوصيل: "

+ deliveryCost +

" DA";



updateFinalTotal();


}





// المجموع النهائي


function updateFinalTotal(){


document.getElementById("finalTotal")
.innerText =


"المجموع النهائي: "

+

(productsTotal + deliveryCost)

+

" DA";



}





// إرسال الطلب إلى Firebase


window.sendOrder = async function(){



if(cart.length===0){


alert("السلة فارغة");


return;


}





let name =

document.getElementById("name").value.trim();



let phone =

document.getElementById("phone").value.trim();



let wilaya =

document.getElementById("wilaya").value;



let commune =

document.getElementById("commune").value.trim();



let address =

document.getElementById("address").value.trim();



let delivery =

document.getElementById("deliveryType").value;




if(
!name ||
!phone ||
!wilaya ||
!delivery
){


alert("يرجى ملء المعلومات المطلوبة");


return;


}





try{


await addDoc(

collection(db,"orders"),

{


name:name,


phone:phone,


wilaya:wilaya,


commune:commune,


address:address,



// مهم للوحة التحكم

delivery:delivery,



deliveryPrice:deliveryCost,



products:cart,



productsTotal:productsTotal,



total:
productsTotal + deliveryCost,



status:"تم التأكيد",



note:"",



// تاريخ الطلب

date:
new Date().toLocaleString("ar-DZ"),



createdAt:
serverTimestamp()



}

);



alert("تم إرسال الطلب بنجاح");



localStorage.removeItem("cart");



window.location.href="index.html";



}

catch(error){


console.error(error);



alert("فشل إرسال الطلب");


}



};
    
</script>

</body>

</html>
