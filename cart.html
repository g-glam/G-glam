<style>

/* =====================================================
   VARIABLES
===================================================== */

:root{

--orange:#F47B20;
--orange-dark:#DF6810;

--bg:#F7F7F7;
--card:#FFFFFF;

--dark:#222222;
--dark-2:#333333;

--text:#333333;
--muted:#888888;

--border:#E9E9E9;

--success:#198754;
--success-bg:#E5F5EC;

--danger:#DC3545;
--danger-bg:#FBE7EA;

--shadow:0 4px 18px rgba(0,0,0,.06);

}


/* =====================================================
   RESET
===================================================== */

*{

margin:0;
padding:0;
box-sizing:border-box;

font-family:"Tajawal",Arial,sans-serif;

}


/* =====================================================
   BODY
===================================================== */

body{

background:var(--bg);

color:var(--text);

min-height:100vh;

padding-bottom:110px;

}


/* =====================================================
   HEADER
===================================================== */

header{

height:78px;

background:#FFFFFF;

border-bottom:1px solid var(--border);

display:flex;

align-items:center;

justify-content:space-between;

padding:0 25px;

position:sticky;

top:0;

z-index:1000;

box-shadow:
0 2px 12px rgba(0,0,0,.04);

}


/* =====================================================
   MENU BUTTON
===================================================== */

.menu-btn{

width:44px;
height:44px;

display:flex;

align-items:center;

justify-content:center;

background:#F1F1F1;

border-radius:11px;

font-size:23px;

cursor:pointer;

color:#444;

transition:.2s;

}


.menu-btn:hover{

background:#E5E5E5;

}


/* =====================================================
   LOGO
===================================================== */

.logo{

font-size:30px;

font-weight:800;

color:#222;

letter-spacing:-1px;

}


/* =====================================================
   CART ICON
===================================================== */

.cart-icon{

width:44px;
height:44px;

display:flex;

align-items:center;

justify-content:center;

background:#FFF1E6;

border:1px solid #FFE0CA;

border-radius:11px;

font-size:22px;

cursor:pointer;

position:relative;

transition:.2s;

}


.cart-icon:hover{

background:#FFE5D2;

}


.cart-count{

position:absolute;

top:-6px;

left:-6px;

width:20px;

height:20px;

border-radius:50%;

background:var(--orange);

color:white;

font-size:11px;

font-weight:800;

display:flex;

align-items:center;

justify-content:center;

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

position:fixed;

top:0;

right:-280px;

width:280px;

height:100vh;

background:white;

box-shadow:-5px 0 20px rgba(0,0,0,.12);

z-index:2000;

transition:.3s;

padding-top:20px;

}


.sidebar.active{

right:0;

}


/* =====================================================
   SIDEBAR LOGO
===================================================== */

.sidebar-logo{

height:75px;

display:flex;

align-items:center;

justify-content:center;

border-bottom:1px solid var(--border);

margin-bottom:10px;

}


.sidebar-logo img{

width:130px;

height:55px;

object-fit:contain;

}


/* =====================================================
   SIDEBAR LINKS
===================================================== */

.sidebar a{

display:flex;

align-items:center;

gap:12px;

padding:15px 22px;

text-decoration:none;

color:#444;

font-size:15px;

font-weight:700;

border-bottom:1px solid #F1F1F1;

transition:.2s;

}


.sidebar a:hover{

background:#FFF1E6;

color:var(--orange-dark);

}


.sidebar-close{

position:absolute;

top:18px;

left:18px;

width:34px;

height:34px;

border:none;

background:#F1F1F1;

border-radius:50%;

font-size:18px;

cursor:pointer;

color:#555;

}


/* =====================================================
   OVERLAY
===================================================== */

.overlay{

position:fixed;

inset:0;

background:rgba(0,0,0,.35);

display:none;

z-index:1900;

}


.overlay.active{

display:block;

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

width:100%;

max-width:900px;

margin:0 auto;

padding:25px 18px;

}


/* =====================================================
   PAGE HEADER
===================================================== */

.page-header{

background:white;

border:1px solid var(--border);

border-radius:18px;

padding:22px 25px;

margin-bottom:20px;

box-shadow:var(--shadow);

position:relative;

overflow:hidden;

}


.page-header::before{

content:"";

position:absolute;

right:0;

top:0;

width:5px;

height:100%;

background:var(--orange);

}


.page-header h1{

font-size:25px;

font-weight:800;

color:var(--dark-2);

margin-bottom:6px;

}


.page-header p{

font-size:14px;

color:var(--muted);

}


/* =====================================================
   CARD
===================================================== */

.card{

background:var(--card);

border:1px solid var(--border);

border-radius:18px;

padding:22px;

margin-bottom:20px;

box-shadow:var(--shadow);

}


/* =====================================================
   SECTION TITLE
===================================================== */

.section-title{

display:flex;

align-items:center;

gap:9px;

font-size:20px;

font-weight:800;

color:var(--dark);

margin-bottom:18px;

}


/* =====================================================
   CART ITEM
===================================================== */

.item{

padding:18px 0;

border-bottom:1px solid var(--border);

}


.item:last-child{

border-bottom:none;

padding-bottom:5px;

}


.item-top{

display:flex;

align-items:center;

justify-content:space-between;

gap:15px;

}


.item-info{

min-width:0;

}


.item h3{

font-size:17px;

font-weight:800;

color:#222;

margin-bottom:7px;

}


.item-price{

font-size:13px;

color:var(--muted);

}


.item-total{

font-size:16px;

font-weight:800;

color:var(--orange-dark);

white-space:nowrap;

}


/* =====================================================
   QUANTITY
===================================================== */

.qty-box{

display:flex;

align-items:center;

justify-content:flex-start;

gap:10px;

margin-top:15px;

}


.qty-btn{

width:34px;

height:34px;

border:none;

border-radius:9px;

background:#F1F1F1;

color:#333;

font-size:19px;

font-weight:800;

cursor:pointer;

transition:.2s;

}


.qty-btn:hover{

background:var(--orange);

color:white;

}


.qty-number{

min-width:35px;

height:34px;

display:flex;

align-items:center;

justify-content:center;

background:#FFF1E6;

color:var(--orange-dark);

border-radius:9px;

font-size:15px;

font-weight:800;

}


/* =====================================================
   DELETE
===================================================== */

.delete-btn{

margin-top:13px;

border:none;

padding:8px 13px;

border-radius:9px;

background:var(--danger-bg);

color:#B52B39;

font-size:13px;

font-weight:700;

cursor:pointer;

font-family:"Tajawal",Arial,sans-serif;

transition:.2s;

}


.delete-btn:hover{

background:#F6D1D6;

}


/* =====================================================
   EMPTY CART
===================================================== */

.empty-cart{

text-align:center;

padding:40px 15px;

color:var(--muted);

}


.empty-icon{

font-size:45px;

margin-bottom:12px;

}


.empty-cart h3{

font-size:18px;

color:#555;

margin-bottom:6px;

}


.empty-cart p{

font-size:14px;

}


/* =====================================================
   PRODUCTS TOTAL
===================================================== */

.total-box{

display:flex;

align-items:center;

justify-content:space-between;

gap:10px;

background:#F3F3F3;

border:1px solid #E5E5E5;

padding:15px 17px;

border-radius:12px;

}


.total-label{

font-size:14px;

color:#555;

font-weight:600;

}


.total-value{

font-size:18px;

font-weight:800;

color:#222;

}


/* =====================================================
   FORM GROUP
===================================================== */

.form-group{

margin-bottom:15px;

}


.form-group label{

display:block;

font-size:13px;

font-weight:700;

color:#444;

margin-bottom:7px;

}


input,
select{

width:100%;

padding:13px 14px;

border:1px solid var(--border);

border-radius:10px;

background:#FCFCFC;

color:#333;

font-size:14px;

outline:none;

font-family:"Tajawal",Arial,sans-serif;

}


input:focus,
select:focus{

border-color:var(--orange);

background:white;

box-shadow:
0 0 0 3px rgba(244,123,32,.08);

}


input::placeholder{

}


/* =====================================================
   DELIVERY INFO
===================================================== */

.delivery-box{

margin-top:17px;

padding:15px;

border-radius:12px;

background:#FFF8F3;

border:1px solid #FFE1CB;

}


.delivery-row{

display:flex;

align-items:center;

justify-content:space-between;

gap:10px;

}


.delivery-label{

font-size:14px;

font-weight:600;

color:#555;

}


.delivery-value{

font-size:17px;

font-weight:800;

color:var(--orange-dark);

}


/* =====================================================
   FINAL TOTAL
===================================================== */

.final-total{

margin-top:12px;

background:#222;

color:white;

border-radius:13px;

padding:17px;

display:flex;

align-items:center;

justify-content:space-between;

gap:10px;

}


.final-total span:first-child{

font-size:14px;

font-weight:600;

}


.final-total span:last-child{

font-size:21px;

font-weight:800;

color:#FFFFFF;

}


/* =====================================================
   FLOATING ORDER BUTTON
===================================================== */

.floating-order{

position:fixed;

bottom:18px;

right:50%;

transform:translateX(50%);

width:calc(100% - 36px);

max-width:500px;

padding:15px 20px;

border:none;

border-radius:14px;

background:var(--orange);

color:white;

font-family:"Tajawal",Arial,sans-serif;

font-size:17px;

font-weight:800;

cursor:pointer;

box-shadow:
0 8px 25px rgba(244,123,32,.28);

z-index:1500;

transition:.2s;

}


.floating-order:hover{

background:var(--orange-dark);

transform:translateX(50%) translateY(-2px);

}


.floating-order:disabled{

opacity:.6;

cursor:not-allowed;

transform:translateX(50%);

}


/* =====================================================
   LOADING
===================================================== */

.loading{

text-align:center;

padding:25px;

color:var(--muted);

font-size:14px;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:600px){

header{

height:68px;

padding:0 12px;

}


.logo{

font-size:25px;

}


.menu-btn,
.cart-icon{

width:40px;
height:40px;

}


.container{

padding:15px 10px;

}


.page-header{

padding:19px;

}


.page-header h1{

font-size:22px;

}


.card{

padding:17px;

border-radius:15px;

}


.section-title{

font-size:18px;

}


.item-top{

align-items:flex-start;

}


.item h3{

font-size:15px;

}


.item-total{

font-size:14px;

}


.final-total span:last-child{

font-size:19px;

}


.floating-order{

width:calc(100% - 20px);

bottom:10px;

}

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:400px){

.sidebar{

width:260px;

}


.page-header{

padding:17px;

}


.page-header h1{

font-size:20px;

}


.card{

padding:14px;

}


.item-top{

flex-direction:column;

gap:7px;

}


.item-total{

align-self:flex-start;

}


.final-total{

flex-direction:column;

align-items:flex-start;

}


.final-total span:last-child{

font-size:20px;

}

}


/* =====================================================
   SCROLLBAR
===================================================== */

::-webkit-scrollbar{

width:7px;

height:7px;

}


::-webkit-scrollbar-track{

background:#F1F1F1;

}


::-webkit-scrollbar-thumb{

background:#CCC;

border-radius:10px;

}


::-webkit-scrollbar-thumb:hover{

background:var(--orange);

}

</style>

</head>

<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {

initializeApp

}

from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
collection,
addDoc,
getDocs,
serverTimestamp

}

from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


/* =====================================================
   CART
===================================================== */

let cart =

JSON.parse(
localStorage.getItem("cart")
) || [];


let productsTotal = 0;

let deliveryCost = 0;


/* =====================================================
   DELIVERY DATA
   يتم جلبها من Firebase
   collection: delivery
===================================================== */

let deliveryItems = [];


/* =====================================================
   ELEMENTS
===================================================== */

const cartItems =
document.getElementById(
"cart-items"
);

const productsTotalElement =
document.getElementById(
"productsTotal"
);

const deliveryPriceElement =
document.getElementById(
"deliveryPrice"
);

const finalTotalElement =
document.getElementById(
"finalTotal"
);

const wilayaSelect =
document.getElementById(
"wilaya"
);

const deliveryTypeSelect =
document.getElementById(
"deliveryType"
);


/* =====================================================
   LOAD DELIVERY FROM FIREBASE
===================================================== */

async function loadDelivery(){

try{

wilayaSelect.innerHTML = `

<option value="">

⏳ جاري تحميل الولايات...

</option>

`;


const snapshot =
await getDocs(

collection(
db,
"delivery"
)

);


deliveryItems = [];


snapshot.forEach(

docSnap=>{

const data =
docSnap.data();


deliveryItems.push({

id:docSnap.id,

office:
Number(data.office || 0),

home:
Number(data.home || 0)

});

});


/* =====================================================
   SORT ALPHABETICALLY
===================================================== */

deliveryItems.sort(

(a,b)=>

a.id.localeCompare(
b.id,
"en"
)

);


/* =====================================================
   DISPLAY WILAYAS
===================================================== */

wilayaSelect.innerHTML = `

<option value="">

اختر الولاية

</option>

`;


deliveryItems.forEach(

item=>{

const option =
document.createElement(
"option"
);

option.value =
item.id;

option.textContent =
item.id;

wilayaSelect.appendChild(
option
);

});


/* =====================================================
   UPDATE DELIVERY
===================================================== */

updateDelivery();


}catch(error){

console.error(
"DELIVERY LOAD ERROR:",
error
);


wilayaSelect.innerHTML = `

<option value="">

تعذر تحميل الولايات

</option>

`;

alert(
"تعذر تحميل أسعار التوصيل من لوحة التحكم."
);

}

}


/* =====================================================
   DISPLAY CART
===================================================== */

function displayCart(){

cartItems.innerHTML = "";

productsTotal = 0;


if(cart.length === 0){

cartItems.innerHTML = `

<div class="empty-cart">

<div class="empty-icon">

🛒

</div>

<h3>

السلة فارغة

</h3>

<p>

لم تقم بإضافة أي منتج إلى السلة بعد.

</p>

</div>

`;

productsTotalElement.textContent =
"0 DA";

updateFinalTotal();

updateCartCount();

return;

}


cart.forEach(

(item,index)=>{

const qty =
Number(item.quantity || 1);

const price =
Number(item.price || 0);

const total =
price * qty;

productsTotal += total;


const itemElement =
document.createElement(
"div"
);

itemElement.className =
"item";


itemElement.innerHTML = `

<div class="item-top">


<div class="item-info">

<h3>

${escapeHtml(
item.name || "منتج"
)}

</h3>

<div class="item-price">

السعر: ${price} DA

</div>

</div>


<div class="item-total">

${total} DA

</div>


</div>


<div class="qty-box">


<button
class="qty-btn"
data-index="${index}"
data-change="-1">

−

</button>


<div class="qty-number">

${qty}

</div>


<button
class="qty-btn"
data-index="${index}"
data-change="1">

+

</button>


</div>


<button
class="delete-btn"
data-index="${index}">

🗑️ حذف المنتج

</button>


`;


cartItems.appendChild(
itemElement
);

});


productsTotalElement.textContent =
productsTotal + " DA";


updateFinalTotal();

updateCartCount();

}


/* =====================================================
   CART ACTIONS
===================================================== */

cartItems.addEventListener(

"click",

function(event){

const qtyButton =
event.target.closest(
".qty-btn"
);


if(qtyButton){

const index =
Number(
qtyButton.dataset.index
);

const change =
Number(
qtyButton.dataset.change
);


changeQty(
index,
change
);

return;

}


const deleteButton =
event.target.closest(
".delete-btn"
);


if(deleteButton){

const index =
Number(
deleteButton.dataset.index
);

removeItem(index);

}

});


/* =====================================================
   CHANGE QUANTITY
===================================================== */

window.changeQty = function(
index,
value
){

if(!cart[index])
return;


cart[index].quantity =

Number(
cart[index].quantity || 1
) + value;


if(
cart[index].quantity < 1
){

cart[index].quantity = 1;

}


localStorage.setItem(

"cart",

JSON.stringify(cart)

);


displayCart();

};


/* =====================================================
   REMOVE ITEM
===================================================== */

window.removeItem = function(
index
){

if(!cart[index])
return;


cart.splice(
index,
1
);


localStorage.setItem(

"cart",

JSON.stringify(cart)

);


displayCart();

};


/* =====================================================
   UPDATE DELIVERY
===================================================== */

wilayaSelect.addEventListener(
"change",
updateDelivery
);


deliveryTypeSelect.addEventListener(
"change",
updateDelivery
);


function updateDelivery(){

const wilaya =
wilayaSelect.value;

const type =
deliveryTypeSelect.value;


deliveryCost = 0;


if(
!wilaya ||
!type
){

deliveryPriceElement.textContent =
"--";

updateFinalTotal();

return;

}


const selected =
deliveryItems.find(

item =>
item.id === wilaya

);


if(!selected){

deliveryPriceElement.textContent =
"--";

updateFinalTotal();

return;

}


if(
type === "إلى المكتب"
){

deliveryCost =
selected.office;

}else{

deliveryCost =
selected.home;

}


deliveryPriceElement.textContent =
deliveryCost + " DA";


updateFinalTotal();

}


/* =====================================================
   FINAL TOTAL
===================================================== */

function updateFinalTotal(){

const finalTotal =
productsTotal +
deliveryCost;


if(
!cart.length
){

finalTotalElement.textContent =
"--";

return;

}


finalTotalElement.textContent =
finalTotal + " DA";

}

/* =====================================================
   UPDATE CART COUNT
===================================================== */

function updateCartCount(){

const savedCart =

JSON.parse(
localStorage.getItem("cart")
) || [];


let total = 0;


savedCart.forEach(

item=>{

total +=
Number(
item.quantity || 1
);

});


document.getElementById(
"cartCount"
).textContent =
total;

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}
