<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#FFFFFF"
    id="themeColorMeta"
>

<link
    rel="manifest"
    href="manifest.json"
>

<link
    rel="apple-touch-icon"
    href="icons/icon-192.png"
>

<title>السلة | G-Glam</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Tajawal",Arial,sans-serif;
}


/* =====================================================
   ROOT
===================================================== */

:root{

    --bg:#F5F5F5;

    --card:#FFFFFF;

    --card-soft:#FCFCFC;

    --text:#222222;

    --text-soft:#444444;

    --muted:#777777;

    --border:#E8E8E8;

    --accent:#F47B20;

    --accent-dark:#DF6810;

    --accent-light:#FFF1E6;

    --accent-rgb:244,123,32;

    --theme-gradient:
        linear-gradient(
            135deg,
            #F47B20,
            #FF9B54
        );

    --sidebar-hover:#FFF1E6;

    --danger:#D9534F;

    --danger-bg:#FDECEC;

    --success:#198754;

    --success-bg:#EFFAF3;

    --shadow:
        0 6px 22px rgba(0,0,0,.07);

    --shadow-soft:
        0 4px 15px rgba(0,0,0,.05);

}


/* =====================================================
   BODY
===================================================== */

body{

    min-height:100vh;

    background:var(--bg);

    color:var(--text);

    padding-bottom:120px;

    transition:
        background .25s ease,
        color .25s ease;

}


/* =====================================================
   HEADER
===================================================== */

header{

    position:sticky;

    top:0;

    z-index:100;

    width:100%;

    min-height:78px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:14px 22px;

    background:var(--bg);

    border-bottom:1px solid var(--border);

    transition:.25s;

}


.logo{

    display:flex;

    align-items:center;

    justify-content:center;

    min-width:120px;

}


.logo img{

    width:120px;

    max-width:140px;

    height:auto;

    max-height:55px;

    object-fit:contain;

    display:block;

}


.menu-btn,
.cart-icon{

    width:46px;

    height:46px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:14px;

    color:var(--text);

    cursor:pointer;

    position:relative;

    transition:.2s;

}


.menu-btn{

    font-size:21px;

}


.cart-icon{

    font-size:21px;

}


.menu-btn:hover,
.cart-icon:hover{

    background:var(--accent-light);

    color:var(--accent);

}


.cart-count{

    position:absolute;

    top:-4px;

    left:-4px;

    width:20px;

    height:20px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    background:var(--accent);

    color:#fff;

    font-size:10px;

    font-weight:800;

    border:2px solid var(--bg);

}


/* =====================================================
   STORE INFO
===================================================== */

.store-info{

    width:calc(100% - 30px);

    max-width:1000px;

    margin:15px auto;

    padding:13px 20px;

    border-radius:17px;

    background:var(--card);

    border:1px solid var(--border);

    box-shadow:var(--shadow-soft);

    color:var(--muted);

    text-align:center;

    font-size:14px;

}


.store-info strong{

    color:var(--text);

    font-weight:800;

}


/* =====================================================
   MAIN
===================================================== */

.container{

    width:calc(100% - 30px);

    max-width:1180px;

    margin:0 auto;

}


/* =====================================================
   PAGE TOP
===================================================== */

.page-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin:18px 0;

}


.page-title{

    font-size:27px;

    font-weight:800;

    color:var(--text);

}


.page-title i{

    color:var(--accent);

    margin-left:7px;

}


.back-btn{

    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:10px 16px;

    border-radius:13px;

    background:var(--accent-light);

    color:var(--accent-dark);

    text-decoration:none;

    font-size:14px;

    font-weight:700;

    transition:.2s;

}


.back-btn:hover{

    background:var(--accent);

    color:#fff;

}


/* =====================================================
   CART GRID
===================================================== */

.cart-layout{

    display:grid;

    grid-template-columns:
        minmax(0,1.7fr)
        minmax(320px,.9fr);

    gap:22px;

    align-items:start;

}


/* =====================================================
   CARD
===================================================== */

.card{

    position:relative;

    background:var(--card);

    border:1px solid var(--border);

    border-radius:24px;

    padding:22px;

    box-shadow:var(--shadow);

    overflow:hidden;

}


.card::before{

    content:"";

    position:absolute;

    top:0;

    right:0;

    width:5px;

    height:100%;

    background:var(--accent);

}


.section-title{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:20px;

    color:var(--text);

    font-size:21px;

    font-weight:800;

}


.section-title i{

    color:var(--accent);

}


/* =====================================================
   CART ITEMS
===================================================== */

.item{

    position:relative;

    margin-bottom:14px;

    padding:16px;

    border-radius:19px;

    background:var(--card-soft);

    border:1px solid var(--border);

    transition:.2s;

}


.item:last-child{

    margin-bottom:0;

}


.item:hover{

    border-color:
        rgba(
            var(--accent-rgb),
            .35
        );

    transform:translateY(-1px);

}


.item-layout{

    display:grid;

    grid-template-columns:
        105px
        minmax(0,1fr)
        auto;

    gap:16px;

    align-items:center;

}


.item-image{

    width:105px;

    height:105px;

    border-radius:16px;

    overflow:hidden;

    background:var(--accent-light);

    border:1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:center;

}


.item-image img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

}


.no-image{

    display:flex;

    align-items:center;

    justify-content:center;

    width:100%;

    height:100%;

    color:var(--muted);

    font-size:28px;

}


.item-content{

    min-width:0;

}


.item h3{

    margin-bottom:7px;

    color:var(--text);

    font-size:18px;

    font-weight:800;

    line-height:1.55;

}


.item-info{

    color:var(--muted);

    font-size:14px;

    line-height:1.8;

}


.item-info strong{

    color:var(--accent-dark);

    font-size:15px;

}


.option-line{

    color:var(--muted);

    font-size:13px;

    line-height:1.8;

}


.option-line strong{

    color:var(--text-soft);

}


.item-actions{

    min-width:135px;

    display:flex;

    flex-direction:column;

    align-items:stretch;

    gap:9px;

}


/* =====================================================
   QUANTITY
===================================================== */

.qty-box{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;

    padding:7px;

    border-radius:14px;

    background:var(--accent-light);

}


.qty-btn{

    width:36px;

    height:36px;

    border:none;

    border-radius:50%;

    background:var(--accent);

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:14px;

    cursor:pointer;

    transition:.2s;

}


.qty-btn:hover{

    background:var(--accent-dark);

    transform:scale(1.05);

}


.qty-btn:disabled{

    background:#BDBDBD;

    cursor:not-allowed;

    transform:none;

}


.qty-number{

    min-width:28px;

    text-align:center;

    color:var(--text);

    font-size:17px;

    font-weight:800;

}


/* =====================================================
   ITEM TOTAL
===================================================== */

.item-total{

    padding:9px 10px;

    border-radius:11px;

    background:var(--card);

    border:1px solid var(--border);

    text-align:center;

    color:var(--muted);

    font-size:12px;

}


.item-total strong{

    display:block;

    margin-top:2px;

    color:var(--accent-dark);

    font-size:16px;

}


/* =====================================================
   DELETE
===================================================== */

.delete-btn{

    width:100%;

    border:1px solid rgba(217,83,79,.22);

    background:var(--danger-bg);

    color:#B42318;

    padding:9px;

    border-radius:11px;

    cursor:pointer;

    font-size:12px;

    font-weight:700;

    transition:.2s;

}


.delete-btn:hover{

    background:#F8D9D9;

}


/* =====================================================
   EMPTY
===================================================== */

.empty-cart{

    padding:55px 20px;

    text-align:center;

    color:var(--muted);

    font-size:15px;

    line-height:2;

}


.empty-icon{

    margin-bottom:12px;

    color:var(--accent);

    font-size:48px;

}


.empty-cart button{

    margin-top:18px;

    padding:12px 25px;

    border:0;

    border-radius:13px;

    background:var(--accent);

    color:#fff;

    font-size:14px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;

}


.empty-cart button:hover{

    background:var(--accent-dark);

}


/* =====================================================
   SUMMARY
===================================================== */

.summary-card{

    position:sticky;

    top:98px;

}


.summary-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    padding:13px 0;

    border-bottom:1px solid var(--border);

    color:var(--muted);

    font-size:14px;

}


.summary-row strong{

    color:var(--text);

    font-size:15px;

}


.total-box{

    margin-top:15px;

    padding:14px;

    border-radius:14px;

    background:var(--accent-light);

    color:var(--text);

    text-align:center;

    font-size:15px;

    font-weight:700;

}


.total-box strong{

    color:var(--accent-dark);

}


.total-box.final{

    background:var(--theme-gradient);

    color:#fff;

    border:none;

    font-size:19px;

    font-weight:800;

}


.total-box.final strong{

    color:#fff;

}


/* =====================================================
   NOTICE
===================================================== */

.notice{

    margin-bottom:20px;

    padding:13px 15px;

    border-radius:13px;

    background:var(--accent-light);

    border:1px solid
        rgba(
            var(--accent-rgb),
            .18
        );

    color:var(--accent-dark);

    font-size:13px;

    line-height:1.9;

}


.notice i{

    margin-left:5px;

}


/* =====================================================
   FORM
===================================================== */

.form-group{

    margin-bottom:15px;

}


.form-group label{

    display:block;

    margin-bottom:7px;

    color:var(--text-soft);

    font-size:13px;

    font-weight:700;

}


.required{

    color:var(--accent);

}


input,
select{

    width:100%;

    padding:13px 14px;

    border-radius:13px;

    border:1px solid var(--border);

    outline:none;

    background:var(--card-soft);

    color:var(--text);

    font-size:14px;

    transition:.2s;

}


input::placeholder{

    color:var(--muted);

}


input:focus,
select:focus{

    border-color:var(--accent);

    background:var(--card);

    box-shadow:
        0 0 0 3px
        rgba(
            var(--accent-rgb),
            .10
        );

}


select{

    cursor:pointer;

}


/* =====================================================
   DELIVERY
===================================================== */

.delivery-loading{

    display:none;

    margin:-5px 0 12px;

    color:var(--muted);

    font-size:12px;

}


.delivery-loading i{

    color:var(--accent);

    margin-left:5px;

}


.delivery-error{

    display:none;

    margin-bottom:15px;

    padding:12px;

    border-radius:11px;

    background:var(--danger-bg);

    border:1px solid #F5D0D0;

    color:#B42318;

    text-align:center;

    font-size:13px;

}


/* =====================================================
   FLOATING ORDER
===================================================== */

.floating-order{

    position:fixed;

    z-index:500;

    right:50%;

    bottom:16px;

    transform:translateX(50%);

    width:calc(100% - 30px);

    max-width:560px;

    padding:16px 20px;

    border:0;

    border-radius:30px;

    background:var(--theme-gradient);

    color:#fff;

    font-size:17px;

    font-weight:800;

    cursor:pointer;

    box-shadow:
        0 9px 28px
        rgba(
            var(--accent-rgb),
            .28
        );

    transition:.2s;

}


.floating-order:hover{

    transform:
        translateX(50%)
        translateY(-2px);

}


.floating-order:disabled{

    background:#BDBDBD;

    opacity:.85;

    cursor:not-allowed;

    box-shadow:none;

    transform:translateX(50%);

}


.floating-order i{

    margin-left:7px;

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

    position:fixed;

    top:0;

    right:-300px;

    z-index:999;

    width:290px;

    height:100vh;

    padding-top:25px;

    background:var(--card);

    box-shadow:
        -5px 0 20px
        rgba(0,0,0,.12);

    transition:.3s;

}


.sidebar.active{

    right:0;

}


.sidebar-title{

    padding:5px 25px 20px;

    margin-bottom:5px;

    border-bottom:1px solid var(--border);

    color:var(--text);

    font-size:24px;

    font-weight:800;

}


.sidebar a{

    display:flex;

    align-items:center;

    gap:12px;

    padding:16px 25px;

    border-bottom:1px solid var(--border);

    color:var(--text);

    text-decoration:none;

    font-size:15px;

    font-weight:600;

    transition:.2s;

}


.sidebar a i{

    width:22px;

    text-align:center;

    color:var(--accent);

}


.sidebar a:hover{

    background:var(--sidebar-hover);

    color:var(--accent-dark);

}


/* =====================================================
   OVERLAY
===================================================== */

.overlay{

    position:fixed;

    inset:0;

    z-index:998;

    display:none;

    background:rgba(0,0,0,.40);

}


.overlay.active{

    display:block;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    padding:55px 20px;

    color:var(--muted);

    text-align:center;

    font-size:15px;

}


.loading i{

    margin-left:7px;

    color:var(--accent);

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px){

    .cart-layout{

        grid-template-columns:1fr;

    }

    .summary-card{

        position:static;

    }

}


@media(max-width:650px){

    body{

        padding-bottom:110px;

    }

    header{

        min-height:68px;

        padding:11px 14px;

    }

    .logo img{

        width:105px;

        max-height:48px;

    }

    .menu-btn,
    .cart-icon{

        width:43px;

        height:43px;

    }

    .store-info{

        width:calc(100% - 20px);

        margin:10px auto 14px;

    }

    .container{

        width:calc(100% - 20px);

    }

    .page-top{

        align-items:flex-start;

        flex-direction:column;

    }

    .page-title{

        font-size:22px;

    }

    .back-btn{

        padding:9px 13px;

    }

    .card{

        padding:15px;

        border-radius:20px;

    }

    .section-title{

        font-size:19px;

    }

    .item{

        padding:12px;

    }

    .item-layout{

        grid-template-columns:

            78px

            minmax(0,1fr);

        gap:11px;

    }

    .item-image{

        width:78px;

        height:78px;

        grid-row:span 1;

    }

    .item-content{

        align-self:center;

    }

    .item h3{

        font-size:15px;

    }

    .item-info{

        font-size:12px;

    }

    .option-line{

        font-size:12px;

    }

    .item-actions{

        grid-column:1 / -1;

        width:100%;

        display:grid;

        grid-template-columns:

            1fr 1fr;

        gap:8px;

        margin-top:3px;

    }

    .qty-box{

        margin:0;

    }

    .item-total{

        margin:0;

        display:flex;

        align-items:center;

        justify-content:center;

        gap:5px;

    }

    .item-total strong{

        display:inline;

        margin:0;

    }

    .delete-btn{

        grid-column:1 / -1;

    }

    .floating-order{

        width:calc(100% - 24px);

        font-size:16px;

    }

}


@media(max-width:400px){

    .container{

        width:calc(100% - 16px);

    }

    .card{

        padding:13px;

    }

    .item-layout{

        grid-template-columns:

            68px

            minmax(0,1fr);

    }

    .item-image{

        width:68px;

        height:68px;

    }

    .qty-btn{

        width:34px;

        height:34px;

    }

}

}


/* DARK */

.theme-dark{

    --bg:#07111F;

    --text:#F4F7FB;

    --text-soft:#DCE5EE;

    --muted:#AAB7C7;

    --border:#1D334A;

    --accent:#F47B20;

    --accent-dark:#FF8C32;

    --accent-light:#17283A;

    --accent-rgb:244,123,32;

    --danger:#EF6461;

    --danger-bg:#351B20;

    --sidebar-hover:#17283A;

    --shadow:
        0 6px 22px rgba(0,0,0,.25);

}


/* =====================================================
   DARK THEME BODY
===================================================== */

.theme-dark body{

    background:#07111F;

    color:#F4F7FB;

}


.theme-dark header{

    background:#07111F;

}


.theme-dark .cart-count{

    border-color:#07111F;

}


.theme-dark .item:hover{

    background:#13283B;

}


.theme-dark input,
.theme-dark select{

    background:#102234;

}

/* =====================================================
   THEME HELPERS
===================================================== */

function normalizeHexColor(value){

    const v =
    String(value || "")
        .trim();


    if(/^#[0-9a-fA-F]{6}$/.test(v)){

        return v.toUpperCase();

    }


    if(/^#[0-9a-fA-F]{3}$/.test(v)){

        return (
            "#" +
            v[1] + v[1] +
            v[2] + v[2] +
            v[3] + v[3]
        ).toUpperCase();

    }


    return null;

}


function hexToRgb(hex){

    const normalized =
    normalizeHexColor(hex);


    if(!normalized){

        return null;

    }


    return {

        r:parseInt(
            normalized.slice(1,3),
            16
        ),

        g:parseInt(
            normalized.slice(3,5),
            16
        ),

        b:parseInt(
            normalized.slice(5,7),
            16
        )

    };

}


function rgbaFromHex(
    hex,
    alpha
){

    const rgb =
    hexToRgb(hex);


    if(!rgb){

        return `rgba(0,0,0,${alpha})`;

    }


    return `
        rgba(
            ${rgb.r},
            ${rgb.g},
            ${rgb.b},
            ${alpha}
        )
    `;

}


function darkenColor(
    hex,
    amount = 0.18
){

    const rgb =
    hexToRgb(hex);


    if(!rgb){

        return "#333333";

    }


    const factor =
    Math.max(
        0,
        Math.min(
            1,
            1 - amount
        )
    );


    const r =
    Math.round(
        rgb.r * factor
    );


    const g =
    Math.round(
        rgb.g * factor
    );


    const b =
    Math.round(
        rgb.b * factor
    );


    return (
        "#" +
        [r,g,b]
        .map(
            x =>
            x
            .toString(16)
            .padStart(2,"0")
        )
        .join("")
        .toUpperCase()
    );

}


/* =====================================================
   APPLY STORE THEME
===================================================== */

function applyStoreTheme(
    themeOrStore
){

    const oldClasses = [

        "theme-orange",
        "theme-blue",
        "theme-green",
        "theme-purple",
        "theme-pink",
        "theme-dark",
        "theme-red",
        "theme-teal",
        "theme-gold",
        "theme-luxury",
        "theme-sunset",
        "theme-emerald",
        "theme-navy",
        "theme-brown",
        "theme-rose",
        "theme-indigo",
        "theme-custom-solid",
        "theme-custom-gradient"

    ];


    document.body.classList.remove(
        ...oldClasses
    );


    document.documentElement.style.removeProperty(
        "--accent"
    );


    document.documentElement.style.removeProperty(
        "--accent-dark"
    );


    document.documentElement.style.removeProperty(
        "--accent-light"
    );


    document.documentElement.style.removeProperty(
        "--accent-rgb"
    );


    document.documentElement.style.removeProperty(
        "--theme-gradient"
    );


    document.documentElement.style.removeProperty(
        "--sidebar-hover"
    );


    /* ================================================
       LEGACY STRING THEME
    ================================================ */

    if(
        typeof themeOrStore === "string"
    ){

        const theme =
        validThemes.includes(
            themeOrStore
        )
        ?
        themeOrStore
        :
        "orange";


        document.body.classList.add(
            `theme-${theme}`
        );


        if(themeColorMeta){

            themeColorMeta.content =
            themeColors[theme] ||
            "#FFFFFF";

        }


        localStorage.setItem(
            "gglamStoreTheme",
            theme
        );


        localStorage.setItem(
            "gglamThemeType",
            "legacy"
        );


        return;

    }


    const store =
    themeOrStore || {};


    /* ================================================
       GRADIENT
    ================================================ */

    if(
        store.themeType === "gradient" &&
        Array.isArray(store.themeColors)
    ){

        const colors =
        store.themeColors
            .map(
                normalizeHexColor
            )
            .filter(Boolean)
            .slice(0,4);


        if(colors.length >= 2){

            let direction =
            store.themeDirection ||
            "135deg";


            if(
                !/^(?:\d+(?:\.\d+)?deg|to\s+.+)$/i
                .test(
                    String(direction)
                )
            ){

                direction = "135deg";

            }


            const gradient =
            `linear-gradient(
                ${direction},
                ${colors.join(",")}
            )`;


            document.body.classList.add(
                "theme-custom-gradient"
            );


            document.documentElement.style.setProperty(
                "--theme-gradient",
                gradient
            );


            document.documentElement.style.setProperty(
                "--accent",
                colors[0]
            );


            document.documentElement.style.setProperty(
                "--accent-dark",
                darkenColor(
                    colors[0],
                    .18
                )
            );


            document.documentElement.style.setProperty(
                "--accent-light",
                rgbaFromHex(
                    colors[0],
                    .10
                )
            );


            const rgb =
            hexToRgb(
                colors[0]
            );


            if(rgb){

                document.documentElement.style.setProperty(
                    "--accent-rgb",
                    `${rgb.r},${rgb.g},${rgb.b}`
                );

            }


            document.documentElement.style.setProperty(
                "--sidebar-hover",
                rgbaFromHex(
                    colors[0],
                    .08
                )
            );


            if(themeColorMeta){

                themeColorMeta.content =
                colors[0];

            }


            localStorage.setItem(
                "gglamStoreTheme",
                "custom-gradient"
            );


            localStorage.setItem(
                "gglamThemeType",
                "gradient"
            );


            localStorage.setItem(
                "gglamThemeColors",
                JSON.stringify(colors)
            );


            localStorage.setItem(
                "gglamThemeDirection",
                String(direction)
            );


            return;

        }

    }


    /* ================================================
       SOLID
    ================================================ */

    if(
        store.themeType === "solid"
    ){

        let solidColor =
        normalizeHexColor(
            Array.isArray(store.themeColors)
            ?
            store.themeColors[0]
            :
            null
        );


        if(!solidColor){

            solidColor =
            normalizeHexColor(
                store.themeColor
            );

        }


        const builtIn =
        validThemes.includes(
            store.theme
        )
        ?
        store.theme
        :
        null;


        if(builtIn){

            document.body.classList.add(
                `theme-${builtIn}`
            );


            if(themeColorMeta){

                themeColorMeta.content =
                themeColors[builtIn];

            }


            localStorage.setItem(
                "gglamStoreTheme",
                builtIn
            );


            localStorage.setItem(
                "gglamThemeType",
                "solid"
            );


            if(solidColor){

                localStorage.setItem(
                    "gglamThemeColor",
                    solidColor
                );

            }


            return;

        }


        if(solidColor){

            document.body.classList.add(
                "theme-custom-solid"
            );


            const dark =
            darkenColor(
                solidColor,
                .18
            );


            const rgb =
            hexToRgb(
                solidColor
            );


            document.documentElement.style.setProperty(
                "--accent",
                solidColor
            );


            document.documentElement.style.setProperty(
                "--accent-dark",
                dark
            );


            document.documentElement.style.setProperty(
                "--accent-light",
                rgbaFromHex(
                    solidColor,
                    .10
                )
            );


            if(rgb){

                document.documentElement.style.setProperty(
                    "--accent-rgb",
                    `${rgb.r},${rgb.g},${rgb.b}`
                );

            }


            document.documentElement.style.setProperty(
                "--sidebar-hover",
                rgbaFromHex(
                    solidColor,
                    .08
                )
            );


            if(themeColorMeta){

                themeColorMeta.content =
                solidColor;

            }


            localStorage.setItem(
                "gglamStoreTheme",
                "custom-solid"
            );


            localStorage.setItem(
                "gglamThemeType",
                "solid"
            );


            localStorage.setItem(
                "gglamThemeColor",
                solidColor
            );


            return;

        }

    }


    /* ================================================
       FALLBACK
    ================================================ */

    const fallback =
    validThemes.includes(
        store.theme
    )
    ?
    store.theme
    :
    (
        localStorage.getItem(
            "gglamStoreTheme"
        ) || "orange"
    );


    const finalTheme =
    validThemes.includes(
        fallback
    )
    ?
    fallback
    :
    "orange";


    document.body.classList.add(
        `theme-${finalTheme}`
    );


    if(themeColorMeta){

        themeColorMeta.content =
        themeColors[finalTheme] ||
        "#FFFFFF";

    }

}


/* =====================================================
   RESTORE THEME BEFORE STORE LOAD
===================================================== */

(function restoreSavedTheme(){

    const type =
    localStorage.getItem(
        "gglamThemeType"
    );


    if(type === "solid"){

        const color =
        localStorage.getItem(
            "gglamThemeColor"
        );

        localStorage.getItem(
            "gglamStoreTheme"
        );


        if(
            color &&
            normalizeHexColor(color) &&
            savedTheme === "custom-solid"
        ){

            applyStoreTheme({

                themeType:"solid",

                themeColor:color

            });

            return;

        }


        if(
            validThemes.includes(
                savedTheme
            )
        ){

            applyStoreTheme(
                savedTheme
            );

            return;

        }

    }


    if(type === "gradient"){

        try{

            const colors =
            JSON.parse(
                localStorage.getItem(
                    "gglamThemeColors"
                ) || "[]"
            );


            if(
                Array.isArray(colors) &&
                colors.length >= 2
            ){

                applyStoreTheme({

                    themeType:"gradient",

                    themeColors:colors,

                    themeDirection:
                    localStorage.getItem(
                        "gglamThemeDirection"
                    ) ||
                    "135deg"

                });

                return;

            }

        }catch(error){

            console.warn(
                "Saved gradient theme error:",
                error
            );

        }

    }


    applyStoreTheme(
        localStorage.getItem(
            "gglamStoreTheme"
        ) ||
        "orange"
    );

})();


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   SAFE IMAGE URL
===================================================== */

function safeUrl(value){

    const url =
    String(value || "")
        .trim();


    if(
        /^https?:\/\//i.test(url)
    ){

        return url;

    }


    if(
        /^data:image\//i.test(url)
    ){

        return url;

    }


    return "";

}

/* =====================================================
   GET ITEM OWNER UID
===================================================== */

function getItemOwnerUid(item){

    return String(

        item?.ownerUid ||
        item?.storeUid ||
        item?.storeId ||
        ""

    );

}


/* =====================================================
   GET CURRENT STORE CART
===================================================== */

function getCurrentStoreCart(){

    if(!currentStoreId){

        return cart;

    }


    return cart.filter(
        item => {

            const itemStore =
            getItemStoreId(item);


            return (

                !itemStore ||

                itemStore ===
                String(
                    currentStoreId
                )

            );

        }
    );

}


/* =====================================================
   DETERMINE OWNER UID
===================================================== */

function getStoreOwnerUid(){

    if(currentOwnerUid){

        return currentOwnerUid;

    }


    if(currentStoreId){

        for(
            const item of cart
        ){

            const itemStore =
            getItemStoreId(item);


            const itemOwner =
            getItemOwnerUid(item);


            if(
                itemStore ===
                String(currentStoreId) &&
                itemOwner
            ){

                currentOwnerUid =
                itemOwner;

                return currentOwnerUid;

            }

        }

    }


    if(currentStoreId){

        return String(
            currentStoreId
        );

    }


    return null;

}


/* =====================================================
   NAVIGATION
===================================================== */

function updateNavigation(){

    const targetStore =
    currentStoreId
    ?
    "?store=" +
    encodeURIComponent(
        String(currentStoreId)
    )
    :
    "";


    if(homeLink){

        homeLink.href =
        "index.html" +
        targetStore;

    }


    if(cartLink){

        cartLink.href =
        "cart.html" +
        targetStore;

    }


    if(cartButton){

        cartButton.onclick =
        function(){

            window.location.href =
            "cart.html" +
            targetStore;

        };

    }


    if(backToStoreTop){

        backToStoreTop.href =
        "index.html" +
        targetStore;

    }

}

/* =====================================================
   LOAD DELIVERY
===================================================== */

async function loadDelivery(){

    deliveryLoading.style.display =
    "block";


    deliveryError.style.display =
    "none";


    wilayaSelect.innerHTML = `

        <option value="">
            جاري تحميل الولايات...
        </option>

    `;


    deliveryItems = [];


    try{

        const ownerUid =
        getStoreOwnerUid();


        if(!ownerUid){

            throw new Error(
                "تعذر تحديد صاحب المتجر."
            );

        }


        const deliveryRef =
        collection(
            db,
            "stores",
            String(ownerUid),
            "delivery"
        );


        const snapshot =
        await getDocs(
            deliveryRef
        );


        snapshot.forEach(
            docSnap => {

                const data =
                docSnap.data();


                const wilayaName =
                data.name ||
                data.wilaya ||
                data.title ||
                docSnap.id;


                const officeValue =
                data.office ??
                data.officePrice ??
                data.bureau ??
                data.bureauPrice ??
                0;


                const homeValue =
                data.home ??
                data.homePrice ??
                data.domicile ??
                data.homeDelivery ??
                0;


                deliveryItems.push({

                    id:
                    docSnap.id,

                    name:
                    String(
                        wilayaName
                    ),

                    office:
                    Number(
                        officeValue
                    ) || 0,

                    home:
                    Number(
                        homeValue
                    ) || 0

                });

            }
        );


        deliveryItems.sort(
            (a,b) => {

                const aNum =
                parseInt(
                    String(a.id)
                    .match(/\d+/)?.[0]
                );


                const bNum =
                parseInt(
                    String(b.id)
                    .match(/\d+/)?.[0]
                );


                if(
                    !Number.isNaN(aNum) &&
                    !Number.isNaN(bNum)
                ){

                    return aNum - bNum;

                }


                return a.name.localeCompare(
                    b.name,
                    "ar"
                );

            }
        );


        wilayaSelect.innerHTML = `

            <option value="">
                اختر الولاية
            </option>

        `;


        if(
            deliveryItems.length === 0
        ){

            wilayaSelect.innerHTML = `

                <option value="">
                    لا توجد ولايات متاحة
                </option>

            `;


            deliveryError.textContent =
            "❌ لا توجد أسعار توصيل لهذا المتجر حاليًا.";


            deliveryError.style.display =
            "block";


        }else{

            deliveryItems.forEach(
                item => {

                    const option =
                    document.createElement(
                        "option"
                    );


                    option.value =
                    item.id;


                    option.textContent =
                    item.name;


                    wilayaSelect.appendChild(
                        option
                    );

                }
            );

        }


        deliveryLoading.style.display =
        "none";


        updateDelivery();


    }catch(error){

        console.error(
            "DELIVERY LOAD ERROR:",
            error
        );


        wilayaSelect.innerHTML = `

            <option value="">
                تعذر تحميل الولايات
            </option>

        `;


        deliveryError.textContent =
        "❌ تعذر تحميل أسعار التوصيل لهذا المتجر.";


        deliveryError.style.display =
        "block";


        deliveryLoading.style.display =
        "none";

    }

}

function getDeliveryItem(){

    const wilaya =
    wilayaSelect.value;


    if(!wilaya){

    }


    return deliveryItems.find(
        item =>
        String(item.id) ===
        String(wilaya)
    );

}


/* =====================================================

===================================================== */

function updateDelivery(){

    const item =

    const type =
    deliveryTypeSelect.value;


    if(!item || !type){

        deliveryCost = 0;


        deliveryPriceElement.textContent =

        Number(
            item.home
        ) || 0;

    }


    deliveryPriceElement.textContent =
    "سعر التوصيل: " +
    deliveryCost +
    " DA";


    updateFinalTotal();

function updateOrderButton(){

        "name"
    )
    .value
    .trim();

        "phone"
    )
    .value
    .trim();

    );

/* =====================================================
   CART ACTIONS
===================================================== */

cartContainer.addEventListener(
    "click",
    function(event){

        const button =
        event.target.closest(
            "button"
        );


        if(!button){

            return;

        }


        const action =
        button.dataset.action;


        const index =
        Number(
            button.dataset.index
        );


        if(
            action === "plus" ||
            action === "minus" ||
            action === "delete"
        ){

            if(
                Number.isNaN(index) ||
                !cart[index]
            ){

                return;

            }

        }


        if(
            action === "plus"
        ){

            const currentQty =
            Math.max(
                1,
                Number(
                    cart[index].quantity ||
                    1
                )
            );


            const stock =
            cart[index].stock;


            if(
                stock !== null &&
                stock !== undefined &&
                stock !== "" &&
                !Number.isNaN(
                    Number(stock)
                )
            ){

                if(
                    currentQty >=
                    Number(stock)
                ){

                    alert(
                        "❌ لا توجد كمية إضافية متوفرة."
                    );

                    return;

                }

            }


            cart[index].quantity =
            currentQty + 1;

        }


        if(
            action === "minus"
        ){

            const currentQty =
            Math.max(
                1,
                Number(
                    cart[index].quantity ||
                    1
                )
            );


            cart[index].quantity =
            Math.max(
                1,
                currentQty - 1
            );

        }


        if(
            action === "delete"
        ){

            cart.splice(
                index,
                1
            );

        }


        saveCart();

        displayCart();

        updateCartCount();

    }
);


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount(){

    const storeCart =
    getCurrentStoreCart();


    let total = 0;


    storeCart.forEach(
        item => {

            total +=
            Math.max(
                1,
                Number(
                    item.quantity || 1
                )
            );

        }
    );


    cartCount.textContent =
    total;

}


/* =====================================================
   PHONE VALIDATION
===================================================== */

function validatePhone(
    phone
){

    const normalized =
    String(phone)
        .replace(
            /[\s\-().]/g,
            ""
        );


    return /^0(5|6|7)[0-9]{8}$/
        .test(
            normalized
        );

}


/* =====================================================
   SEND ORDER
===================================================== */

async function sendOrder(){

    const storeCart =
    getCurrentStoreCart();


    if(
        storeCart.length === 0
    ){

        alert(
            "السلة فارغة."
        );

        return;

    }


    const name =
    document.getElementById(
        "name"
    )
    .value
    .trim();


    const phone =
    document.getElementById(
        "phone"
    )
    .value
    .trim();


    const wilaya =
    wilayaSelect.value;


    const commune =
    document.getElementById(
        "commune"
    )
    .value
    .trim();


    const address =
    document.getElementById(
        "address"
    )
    .value
    .trim();


    const delivery =
    deliveryTypeSelect.value;


    const ownerUid =
    getStoreOwnerUid();


    if(
        !name ||
        !phone ||
        !wilaya ||
        !delivery
    ){

        alert(
            "يرجى ملء جميع المعلومات المطلوبة."
        );

        return;

    }


    if(
        !validatePhone(phone)
    ){

        alert(
            "❌ يرجى إدخال رقم هاتف جزائري صحيح."
        );

        return;

    }


    if(!ownerUid){

        alert(
            "تعذر تحديد صاحب المتجر.\n\n" +
            "يرجى العودة إلى صفحة المتجر وإعادة المحاولة."
        );

        return;

    }


    const deliveryItem =
    getDeliveryItem();


    if(!deliveryItem){

        alert(
            "تعذر العثور على سعر التوصيل لهذه الولاية."
        );

        return;

    }


    updateDelivery();


    if(
        deliveryCost < 0 ||
        Number.isNaN(
            deliveryCost
        )
    ){

        alert(
            "تعذر حساب سعر التوصيل."
        );

        return;

    }


    orderBtn.disabled =
    true;


    orderBtn.innerHTML = `

        <i class="fa-solid fa-spinner fa-spin"></i>

        جاري إرسال الطلب...

    `;


    try{


        /* =============================================
           PRODUCTS
        ============================================== */

        const orderProducts =
        storeCart.map(
            item => {

                const quantity =
                Math.max(
                    1,
                    Number(
                        item.quantity ||
                        1
                    )
                );


                const price =
                Math.max(
                    0,
                    Number(
                        item.price ||
                        0
                    )
                );


                const itemOwnerUid =
                getItemOwnerUid(item) ||
                ownerUid;


                return {

                    id:
                    String(
                        item.id ||
                        ""
                    ),

                    name:
                    String(
                        item.name ||
                        "منتج"
                    ),

                    price:
                    price,

                    quantity:
                    quantity,

                    total:
                    price *
                    quantity,

                    image:
                    String(
                        item.image ||
                        ""
                    ),

                    color:
                    String(
                        item.color ||
                        "بدون لون"
                    ),

                    size:
                    String(
                        item.size ||
                        "بدون قياس"
                    ),

                    ownerUid:
                    itemOwnerUid,

                    storeId:
                    String(
                        item.storeId ||
                        item.storeUid ||
                        ownerUid
                    )

                };

            }
        );


        /* =============================================
           ORDER DATA
        ============================================== */

        const orderData = {

            ownerUid:
            String(
                ownerUid
            ),

            storeId:
            String(
                currentStoreId ||
                ownerUid
            ),

            storeName:
            currentStoreName,

            name:
            name,

            phone:
            phone,

            wilaya:
            wilaya,

            commune:
            commune,

            address:
            address,

            delivery:
            delivery,

            deliveryPrice:
            Number(
                deliveryCost
            ),

            deliveryWilaya:
            deliveryItem?.name ||
            wilaya,

            products:
            orderProducts,

            productsTotal:
            Number(
                productsTotal
            ),

            total:
            Number(
                productsTotal +
                deliveryCost
            ),

            status:
            "قيد المعالجة",

            note:
            "",

            date:
            new Date()
                .toLocaleString(
                    "ar-DZ"
                ),

            createdAt:
            serverTimestamp()

        };


        /* =============================================
           SAVE ORDER
        ============================================== */

        await addDoc(
            collection(
                db,
                "orders"
            ),
            orderData
        );


        /* =============================================
           META TRACKING
        ============================================== */

        try{

            if(
                typeof window.fbq ===
                "function"
            ){

                window.fbq(
                    "track",
                    "Purchase",
                    {

                        value:
                        Number(
                            productsTotal +
                            deliveryCost
                        ),

                        currency:
                        "DZD"

                    }
                );

            }

        }catch(error){

            console.warn(
                "Meta tracking error:",
                error
            );

        }


        /* =============================================
           TIKTOK TRACKING
        ============================================== */

        try{

            if(
                window.ttq &&
                typeof window.ttq.track ===
                "function"
            ){

                window.ttq.track(
                    "CompletePayment",
                    {

                        value:
                        Number(
                            productsTotal +
                            deliveryCost
                        ),

                        currency:
                        "DZD"

                    }
                );

            }

        }catch(error){

            console.warn(
                "TikTok tracking error:",
                error
            );

        }


        /* =============================================
           REMOVE CURRENT STORE PRODUCTS
        ============================================== */

        cart =
        cart.filter(
            item => {

                const itemStore =
                getItemStoreId(item);


                return !(
                    currentStoreId &&
                    itemStore ===
                    String(
                        currentStoreId
                    )
                );

            }
        );


        saveCart();


        if(
            cart.length === 0
        ){

            localStorage.removeItem(
                "cartStoreId"
            );

        }else{

            const nextStore =
            getItemStoreId(
                cart[0]
            );


            if(nextStore){

                localStorage.setItem(
                    "cartStoreId",
                    nextStore
                );

            }

        }


        /* =============================================
           SUCCESS
        ============================================== */

        alert(
            "تم إرسال الطلب بنجاح ✅"
        );


        window.location.href =
        "index.html?store=" +
        encodeURIComponent(
            currentStoreId ||
            ownerUid
        );


    }catch(error){

        console.error(
            "ORDER ERROR:",
            error
        );


        alert(
            "❌ فشل إرسال الطلب.\n\n" +
            "السبب:\n" +
            (
                error?.message ||
                "خطأ غير معروف"
            )
        );


        orderBtn.disabled =
        false;


        orderBtn.innerHTML = `

            <i class="fa-solid fa-box"></i>

            إرسال الطلب

        `;

    }

}

wilayaSelect.addEventListener(
    "change",
    function(){

        updateDelivery();

        updateOrderButton();

    }
);


deliveryTypeSelect.addEventListener(
    "change",
    function(){

        updateDelivery();

        updateOrderButton();

    }
);


/* =====================================================
   CUSTOMER INPUT
===================================================== */

[
    "name",
    "phone",
    "commune",
    "address"

].forEach(
    id => {

        document
        .getElementById(id)
        .addEventListener(
            "input",
            updateOrderButton
        );

    }
);


/* =====================================================
   ORDER BUTTON
===================================================== */

orderBtn.addEventListener(
    "click",
    sendOrder
);


/* =====================================================
   SIDEBAR OPEN
===================================================== */

function openSidebar(){

    sidebar.classList.add(
        "active"
    );

    overlay.classList.add(
        "active"
    );

}


/* =====================================================
   SIDEBAR CLOSE
===================================================== */

function closeSidebar(){

    sidebar.classList.remove(
        "active"
    );

    overlay.classList.remove(
        "active"
    );

}


/* =====================================================
   MENU
===================================================== */

menuBtn.addEventListener(
    "click",
    openSidebar
);


overlay.addEventListener(
    "click",
    closeSidebar
);


/* =====================================================
   SIDEBAR LINKS
===================================================== */

[
    homeLink,
    cartLink
].forEach(
    link => {

        if(link){

            link.addEventListener(
                "click",
                closeSidebar
            );

        }

    }
);


/* =====================================================
   CONTACT
===================================================== */

if(contactLink){

    contactLink.addEventListener(
        "click",
        function(){

            closeSidebar();

            const social =
            document.getElementById(
                "socialSection"
            );


            if(social){

                social.scrollIntoView({
                    behavior:"smooth"
                });

            }else{

                /*
                 * لا يوجد قسم تواصل في cart.
                 * نرجع للمتجر حتى يتمكن الزبون
                 * من الوصول إلى وسائل التواصل.
                 */

                if(currentStoreId){

                    window.location.href =
                    "index.html?store=" +
                    encodeURIComponent(
                        currentStoreId
                    );

                }else{

                    window.location.href =
                    "index.html";

                }

            }

        }
    );

}


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Escape"
        ){

            closeSidebar();

        }

    }
);


/* =====================================================
   START
===================================================== */

await loadStore();

updateNavigation();

displayCart();

updateCartCount();

await loadDelivery();

updateOrderButton();


console.log(
    "G-Glam Cart Started"
);


console.log(
    "Current Store ID:",
    currentStoreId
);


console.log(
    "Current Owner UID:",
    getStoreOwnerUid()
);


</script>


<script>

/* =====================================================
   SERVICE WORKER
===================================================== */

if(
    "serviceWorker" in navigator
){

    window.addEventListener(
        "load",
        function(){

            navigator.serviceWorker
            .register(
                "service-worker.js"
            )

            .then(
                function(){

                    console.log(
                        "G-Glam PWA جاهز"
                    );

                }
            )

            .catch(
                function(error){

                    console.log(
                        "خطأ في PWA:",
                        error
                    );

                }
            );

        }
    );

}

</script>


</body>

</html>
