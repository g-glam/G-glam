<style>

/* =====================================================
   COLORS
===================================================== */

:root{

--bg:#F4F4F4;
--card:#FFFFFF;
--text:#222222;

--accent:#F47B20;
--accent-dark:#DF6810;
--accent-light:#FFF1E6;

--muted:#777777;
--border:#E8E8E8;

--danger:#D9534F;
--danger-bg:#FDECEC;

--success:#198754;
--success-bg:#EFFAF3;

--shadow:
0 4px 15px rgba(0,0,0,.06);

}


/* =====================================================
   RESET
===================================================== */

*{

margin:0;
padding:0;
box-sizing:border-box;

font-family:"Tajawal",Arial,sans-serif;

}


/* =====================================================
   BODY
===================================================== */

body{

background:var(--bg);

color:var(--text);

padding-bottom:110px;

min-height:100vh;

}


/* =====================================================
   HEADER
===================================================== */

header{

display:flex;

align-items:center;

justify-content:space-between;

padding:18px 20px;

background:var(--bg);

position:sticky;

top:0;

z-index:100;

}


/* =====================================================
   LOGO
===================================================== */

.logo{

display:flex;

align-items:center;

justify-content:center;

}


.logo img{

width:120px;

height:auto;

max-height:55px;

object-fit:contain;

display:block;

}


/* =====================================================
   MENU + CART
===================================================== */

.menu-btn,
.cart-icon{

font-size:22px;

cursor:pointer;

position:relative;

width:45px;

height:45px;

display:flex;

align-items:center;

justify-content:center;

border-radius:12px;

transition:.2s;

color:var(--text);

}


.menu-btn:hover,
.cart-icon:hover{

background:var(--accent-light);

color:var(--accent);

}


/* =====================================================
   CART COUNT
===================================================== */

.cart-count{

position:absolute;

top:-5px;

left:-5px;

background:var(--accent);

color:#fff;

font-size:11px;

font-weight:bold;

width:20px;

height:20px;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

}


/* =====================================================
   STORE INFO
===================================================== */

.store-info{

width:calc(100% - 30px);

max-width:700px;

margin:8px auto 18px;

background:#fff;

border:1px solid var(--border);

border-radius:18px;

padding:12px 18px;

text-align:center;

color:var(--muted);

font-size:14px;

box-shadow:var(--shadow);

}


.store-info strong{

color:var(--text);

font-weight:800;

}


/* =====================================================
   MAIN
===================================================== */

.container{

width:calc(100% - 30px);

max-width:900px;

margin:0 auto 30px;

}


/* =====================================================
   CARD
===================================================== */

.card{

background:var(--card);

border-radius:24px;

padding:20px;

border:1px solid var(--border);

box-shadow:

0 6px 22px rgba(0,0,0,.07);

position:relative;

overflow:hidden;

margin-bottom:20px;

}


.card::before{

content:"";

position:absolute;

top:0;

right:0;

width:6px;

height:100%;

background:var(--accent);

}


/* =====================================================
   SECTION TITLE
===================================================== */

.section-title{

font-size:22px;

font-weight:800;

color:var(--text);

margin-bottom:20px;

display:flex;

align-items:center;

gap:10px;

}


.section-title i{

color:var(--accent);

}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-btn{

display:inline-flex;

align-items:center;

gap:7px;

margin-bottom:18px;

padding:10px 15px;

border-radius:12px;

background:var(--accent-light);

color:var(--accent-dark);

text-decoration:none;

font-size:14px;

font-weight:700;

transition:.2s;

}


.back-btn:hover{

background:var(--accent);

color:#fff;

}


/* =====================================================
   CART ITEM
===================================================== */

.item{

position:relative;

border:1px solid var(--border);

border-radius:17px;

padding:16px;

margin-bottom:12px;

background:#FCFCFC;

transition:.2s;

}


.item:hover{

border-color:#FFD8BB;

background:#FFFDFC;

}


.item:last-child{

margin-bottom:0;

}


/* =====================================================
   ITEM LAYOUT
===================================================== */

.item-layout{

display:flex;

align-items:center;

gap:15px;

}


.item-image{

width:90px;

height:90px;

flex-shrink:0;

border-radius:14px;

overflow:hidden;

background:#F1F1F1;

border:1px solid var(--border);

display:flex;

align-items:center;

justify-content:center;

}


.item-image img{

width:100%;

height:100%;

object-fit:cover;

display:block;

}


.no-image{

font-size:28px;

color:#aaa;

}


/* =====================================================
   ITEM CONTENT
===================================================== */

.item-content{

flex:1;

min-width:0;

}


.item-header{

display:flex;

align-items:flex-start;

justify-content:space-between;

gap:12px;

margin-bottom:8px;

}


.item h3{

font-size:17px;

font-weight:800;

color:#222;

line-height:1.6;

}


.item-info{

font-size:14px;

color:#777;

line-height:1.9;

}


.item-info strong{

color:#333;

}


.option-line{

font-size:13px;

color:#777;

margin-top:3px;

}


.option-line strong{

color:#444;

}


/* =====================================================
   QUANTITY
===================================================== */

.qty-box{

display:flex;

align-items:center;

justify-content:center;

gap:16px;

margin:15px 0;

padding:10px;

background:#F7F7F7;

border-radius:14px;

}


.qty-btn{

width:40px;

height:40px;

border:none;

border-radius:50%;

background:var(--accent);

color:#fff;

font-size:21px;

font-weight:700;

cursor:pointer;

transition:.2s;

display:flex;

align-items:center;

justify-content:center;

}


.qty-btn:hover{

background:var(--accent-dark);

transform:scale(1.04);

}


.qty-btn:disabled{

background:#BDBDBD;

cursor:not-allowed;

transform:none;

}


.qty-number{

min-width:35px;

text-align:center;

font-size:18px;

font-weight:800;

color:#222;

}


/* =====================================================
   ITEM TOTAL
===================================================== */

.item-total{

text-align:center;

font-size:15px;

font-weight:700;

padding:10px;

background:#fff;

border-radius:10px;

border:1px solid var(--border);

margin-bottom:10px;

}


.item-total strong{

color:var(--accent-dark);

font-size:17px;

}


/* =====================================================
   DELETE
===================================================== */

.delete-btn{

width:100%;

background:var(--danger-bg);

color:#B42318;

border:1px solid #F5D0D0;

padding:10px;

border-radius:11px;

cursor:pointer;

font-size:13px;

font-weight:700;

transition:.2s;

}


.delete-btn:hover{

background:#F8D9D9;

}


/* =====================================================
   EMPTY
===================================================== */

.empty-cart{

text-align:center;

padding:50px 20px;

color:#888;

font-size:15px;

line-height:2;

}


.empty-icon{

font-size:45px;

margin-bottom:12px;

color:#aaa;

}


.empty-cart button{

margin-top:18px;

background:var(--accent);

color:#fff;

border:none;

padding:13px 27px;

border-radius:13px;

font-weight:700;

cursor:pointer;

}


/* =====================================================
   TOTAL
===================================================== */

.total-box{

background:#222;

color:#fff;

padding:15px;

border-radius:13px;

text-align:center;

font-size:16px;

font-weight:700;

margin-top:18px;

}


.total-box.final{

background:var(--accent);

font-size:19px;

}


/* =====================================================
   FORM
===================================================== */

.form-group{

margin-bottom:15px;

}


.form-group label{

display:block;

font-size:13px;

font-weight:700;

color:#444;

margin-bottom:7px;

}


.required{

color:var(--accent);

}


input,
select{

width:100%;

padding:14px 15px;

border:1px solid var(--border);

border-radius:13px;

background:#F8F8F8;

color:#333;

font-size:14px;

outline:none;

transition:.2s;

}


input:focus,
select:focus{

border-color:var(--accent);

background:#fff;

box-shadow:

0 0 0 3px rgba(244,123,32,.10);

}


select{

cursor:pointer;

}


/* =====================================================
   DELIVERY
===================================================== */

.delivery-loading{

font-size:13px;

color:#888;

margin-top:-5px;

margin-bottom:12px;

display:none;

}


.delivery-error{

display:none;

background:var(--danger-bg);

border:1px solid #F5D0D0;

color:#B42318;

padding:12px;

border-radius:11px;

font-size:13px;

margin-bottom:15px;

text-align:center;

}


/* =====================================================
   NOTICE
===================================================== */

.notice{

background:var(--accent-light);

border:1px solid #FFD8BB;

color:#8A470F;

padding:12px 14px;

border-radius:12px;

font-size:13px;

line-height:1.8;

margin-bottom:18px;

}


/* =====================================================
   FLOATING ORDER
===================================================== */

.floating-order{

position:fixed;

bottom:15px;

right:50%;

transform:translateX(50%);

width:90%;

max-width:500px;

background:var(--accent);

color:#fff;

border:none;

padding:16px 20px;

border-radius:30px;

font-size:17px;

font-weight:800;

cursor:pointer;

box-shadow:

0 8px 22px rgba(244,123,32,.30);

z-index:500;

transition:.2s;

}


.floating-order:hover{

background:var(--accent-dark);

transform:translateX(50%) translateY(-2px);

}


.floating-order:disabled{

background:#BDBDBD;

opacity:.8;

cursor:not-allowed;

box-shadow:none;

transform:translateX(50%);

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

position:fixed;

top:0;

right:-280px;

width:280px;

height:100%;

background:#fff;

box-shadow:

-4px 0 15px rgba(0,0,0,.1);

z-index:999;

transition:.3s;

padding-top:30px;

}


.sidebar.active{

right:0;

}


.sidebar-title{

padding:0 25px 20px;

font-size:24px;

font-weight:800;

border-bottom:1px solid #eee;

margin-bottom:5px;

}


.sidebar a{

display:flex;

align-items:center;

gap:12px;

padding:16px 25px;

text-decoration:none;

color:#222;

font-size:16px;

font-weight:600;

border-bottom:1px solid #eee;

transition:.2s;

}


.sidebar a i{

width:22px;

text-align:center;

color:var(--accent);

}


.sidebar a:hover{

background:var(--accent-light);

color:var(--accent-dark);

}


/* =====================================================
   OVERLAY
===================================================== */

.overlay{

position:fixed;

inset:0;

background:rgba(0,0,0,.35);

display:none;

z-index:998;

}


.overlay.active{

display:block;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

text-align:center;

padding:50px 20px;

color:var(--muted);

font-size:15px;

line-height:2;

}


.loading i{

color:var(--accent);

margin-left:6px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

header{

padding:15px;

}

width:105px;

max-height:50px;

}

.cart-icon{

}


.store-info{

width:calc(100% - 20px);

margin-top:8px;

margin-bottom:12px;

}


.container{

width:calc(100% - 20px);

margin-bottom:20px;

}


.card{

padding:15px;

border-radius:20px;

}


.section-title{

font-size:19px;

}


.item-layout{

gap:10px;

}


.item-image{

width:75px;

height:75px;

}


.item h3{

font-size:15px;

}


.item-info{

font-size:13px;

}


.floating-order{

width:calc(100% - 30px);

font-size:16px;

}

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:400px){

.logo img{

width:100px;

}


.container{

width:calc(100% - 16px);

}


.card{

padding:13px;

}


.item{

padding:12px;

}


.item-image{

width:68px;

height:68px;

}


.qty-btn{

width:38px;

height:38px;

}

}

/* =====================================================

const app =

/* =====================================================

let cart =
JSON.parse(

);

cart = [];

function saveCart(){

localStorage.setItem(
"cart",

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(value ?? "")

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
   GET ITEM STORE ID
===================================================== */

function getItemStoreId(item){

return String(

item?.storeId ||
item?.storeUid ||
item?.ownerUid ||
""

);

}


/* =====================================================
   GET ITEM OWNER UID
===================================================== */

function getItemOwnerUid(item){

return String(

item?.ownerUid ||
item?.storeUid ||
item?.storeId ||
""

);

}


/* =====================================================
   GET CURRENT STORE CART
===================================================== */

function getCurrentStoreCart(){

if(!currentStoreId){

return cart;

}


return cart.filter(item => {

const itemStore =
getItemStoreId(item);

return (

!itemStore ||
itemStore === String(currentStoreId)

);

});

}


/* =====================================================
   DETERMINE OWNER UID
===================================================== */

function getStoreOwnerUid(){

/*
   المبدأ الأساسي:
   UID الخاص بصاحب المتجر هو المعرّف الأساسي.
*/

if(currentOwnerUid){

return currentOwnerUid;

}


/*
   ابحث أولًا داخل منتجات المتجر الحالي.
*/

if(currentStoreId){

for(const item of cart){

const itemStore =
getItemStoreId(item);

const itemOwner =
getItemOwnerUid(item);

if(

itemStore === String(currentStoreId) &&
itemOwner

){

currentOwnerUid =
itemOwner;

return currentOwnerUid;

}

}

}


/*
   إذا كان storeId نفسه هو UID
   فهذا هو السيناريو الأساسي للمشروع.
*/

if(currentStoreId){

return String(currentStoreId);

}


return null;

}

function(){

"cart.html";

}


/*

*/

doc(
db,
"stores",
String(currentStoreId)
);

await getDoc(storeRef);

storeSnap.data();

   نستخدمه، وإلا يبقى UID الخاص بالوثيقة.

store.ownerUid ||
store.uid ||
String(currentStoreId);

}else{

"G-Glam";

currentOwnerUid =
String(currentStoreId);

}


storeInfo.innerHTML = `

<strong>

"cart.html" + storeQuery;

}catch(error){

"STORE LOAD ERROR:",
error
);


currentOwnerUid =
currentStoreId
?
String(currentStoreId)
:
null;


storeInfo.innerHTML = `

متجر:

<strong>
G-Glam
</strong>

}

}


/* =====================================================
   LOAD DELIVERY
===================================================== */

async function loadDelivery(){

deliveryLoading.style.display =
"block";

deliveryError.style.display =
"none";


wilayaSelect.innerHTML = `

<option value="">

جاري تحميل الولايات...

</option>

`;


try{

const snapshot =
await getDocs(
collection(
db,
"delivery"
)
);


deliveryItems = [];


snapshot.forEach(docSnap => {

const data =
docSnap.data();


/*
   يدعم:

   office
   home

   وكذلك:

   officePrice
   homePrice

*/

const officeValue =

data.office ??
data.officePrice ??
data.bureau ??
data.bureauPrice ??
0;


const homeValue =

data.home ??
data.homePrice ??
data.domicile ??
data.homeDelivery ??
0;


deliveryItems.push({

id:
docSnap.id,

office:
Number(officeValue) || 0,

home:
Number(homeValue) || 0

});

});


/*
   ترتيب الولايات رقميًا إذا كانت
   الوثائق تحمل أرقامًا، وإلا أبجديًا.
*/

deliveryItems.sort((a,b) => {

const aNum =
Number(a.id);

const bNum =
Number(b.id);

if(
!Number.isNaN(aNum) &&
!Number.isNaN(bNum)
){

return aNum - bNum;

}

return a.id.localeCompare(
b.id,
"ar"
);

});


wilayaSelect.innerHTML = `

<option value="">

اختر الولاية

</option>

`;


if(deliveryItems.length === 0){

wilayaSelect.innerHTML = `

<option value="">

لا توجد ولايات متاحة

</option>

`;

deliveryError.textContent =
"❌ لا توجد أسعار توصيل متاحة حاليًا.";

deliveryError.style.display =
"block";

}else{

deliveryItems.forEach(item => {

const option =
document.createElement("option");

option.value =
item.id;

option.textContent =
item.id;

wilayaSelect.appendChild(option);

});

}


deliveryLoading.style.display =
"none";


updateDelivery();


}catch(error){

console.error(
"DELIVERY LOAD ERROR:",
error
);


wilayaSelect.innerHTML = `

<option value="">

تعذر تحميل الولايات

</option>

`;


deliveryError.textContent =
"❌ تعذر تحميل أسعار التوصيل. يرجى المحاولة مرة أخرى.";

deliveryError.style.display =
"block";

deliveryLoading.style.display =
"none";

}

}

   UPDATE DELIVERY

);

);

}

true;

}


storeCart.forEach(item => {

);

);

const image =

?
item.images[0]
:

);


const color =
item.color ||
"بدون لون";


const size =
item.size ||
"بدون قياس";


const realIndex =
cart.indexOf(item);


let imageHTML;


if(image){

imageHTML = `

<img
src="${escapeHtml(image)}"
alt="${escapeHtml(item.name || "منتج")}"
onerror="
this.style.display='none';
this.nextElementSibling.style.display='flex';
">

<span
class="no-image"
style="display:none">

<i class="fa-regular fa-image"></i>

</span>

`;

}else{

imageHTML = `

<span class="no-image">

<i class="fa-regular fa-image"></i>

</span>

`;

}


div.innerHTML = `

<div class="item-layout">


<div class="item-image">

${imageHTML}

</div>


<div class="item-content">


<div class="item-header">

<h3>

${escapeHtml(

)}

السعر:

<strong>
${price} DA
</strong>

</div>

اللون:

<strong>
${escapeHtml(color)}
</strong>

</div>


<div class="option-line">

القياس:

<strong>
${escapeHtml(size)}
</strong>

</div>


</div>

</div>


<div class="qty-box">


<button
type="button"
class="qty-btn"
data-action="minus"

aria-label="إنقاص الكمية">

<i class="fa-solid fa-minus"></i>

${qty}

<button

aria-label="زيادة الكمية">

cartContainer.appendChild(div);

});

}


/* =====================================================
   ORDER BUTTON STATE
===================================================== */

function updateOrderButton(){

const storeCart =
getCurrentStoreCart();


const hasProducts =
storeCart.length > 0;


const hasRequiredData =

document.getElementById("name")
.value.trim() &&

document.getElementById("phone")
.value.trim() &&

wilayaSelect.value &&

deliveryTypeSelect.value;


orderBtn.disabled =
!(
hasProducts &&
hasRequiredData
);

}


/* =====================================================
   CART ACTIONS
===================================================== */

cartContainer.addEventListener(
"click",
function(event){

const button =
event.target.closest("button");


if(!button){

return;

}


const action =
button.dataset.action;


const index =
Number(button.dataset.index);


if(

action === "plus" ||
action === "minus" ||
action === "delete"

){

if(
Number.isNaN(index) ||
!cart[index]
){

return;

}

}


/* PLUS */

if(action === "plus"){

const currentQty =
Math.max(
1,
Number(cart[index].quantity || 1)
);


const stock =
cart[index].stock;


if(

stock !== null &&
stock !== undefined &&
stock !== "" &&
!Number.isNaN(Number(stock))

){

if(
currentQty >= Number(stock)
){

alert(
"❌ لا توجد كمية إضافية متوفرة."
);

return;

}

}


cart[index].quantity =
currentQty + 1;

}


/* MINUS */

if(action === "minus"){

const currentQty =
Math.max(
1,
Number(cart[index].quantity || 1)
);


cart[index].quantity =
Math.max(
1,
currentQty - 1
);

}


/* DELETE */

if(action === "delete"){

cart.splice(
index,
1
);

}


saveCart();

displayCart();

updateCartCount();

}
);


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount(){

const storeCart =
getCurrentStoreCart();


let total = 0;


storeCart.forEach(item => {

total += Math.max(
1,
Number(item.quantity || 1)
);

});


cartCount.textContent =
total;

}


/* =====================================================
   VALIDATE PHONE
===================================================== */

function validatePhone(phone){

const normalized =
phone.replace(
/[\s\-().]/g,
""
);


return /^0(5|6|7)[0-9]{8}$/.test(
normalized
);

}


/* =====================================================
   SEND ORDER
===================================================== */

async function sendOrder(){

const storeCart =
getCurrentStoreCart();


if(storeCart.length === 0){

alert(
"السلة فارغة."
);

return;

}


const name =
document.getElementById("name")
.value
.trim();


const phone =
document.getElementById("phone")
.value
.trim();


const wilaya =
wilayaSelect.value;


const commune =
document.getElementById("commune")
.value
.trim();


const address =
document.getElementById("address")
.value
.trim();


const delivery =
deliveryTypeSelect.value;


const ownerUid =
getStoreOwnerUid();


/*
   التحقق من البيانات الأساسية
*/

if(
!name ||
!phone ||
!wilaya ||
!delivery
){

alert(
"يرجى ملء جميع المعلومات المطلوبة."
);

return;

}


/*
   التحقق من رقم الهاتف الجزائري
*/

if(!validatePhone(phone)){

alert(
"❌ يرجى إدخال رقم هاتف جزائري صحيح."
);

return;

}


/*
   التأكد من وجود UID
*/

if(!ownerUid){

alert(

"تعذر تحديد صاحب المتجر.\n\n" +

"يرجى العودة إلى صفحة المتجر وإعادة المحاولة."

);

return;

}


/*
   التأكد من وجود سعر التوصيل
*/

const deliveryItem =
getDeliveryItem();


if(!deliveryItem){

alert(
"تعذر العثور على سعر التوصيل لهذه الولاية."
);

return;

}


/*
   تحديث السعر قبل الإرسال
*/

updateDelivery();


/*
   التأكد من السعر
*/

if(
deliveryCost < 0 ||
Number.isNaN(deliveryCost)
){

alert(
"تعذر حساب سعر التوصيل."
);

return;

}


orderBtn.disabled =
true;


orderBtn.innerHTML = `

<i class="fa-solid fa-spinner fa-spin"></i>

جاري إرسال الطلب...

`;


try{


/* =====================================================
   PREPARE PRODUCTS
===================================================== */

const orderProducts =

storeCart.map(item => {

const quantity =
Math.max(
1,
Number(item.quantity || 1)
);


const price =
Math.max(
0,
Number(item.price || 0)
);


const itemOwnerUid =
getItemOwnerUid(item) ||
ownerUid;


return {

id:
String(item.id || ""),

name:
String(item.name || "منتج"),

price:
price,

quantity:
quantity,

total:
price * quantity,

image:
String(item.image || ""),

color:
String(item.color || "بدون لون"),

size:
String(item.size || "بدون قياس"),

/*
   UID هو المعرّف الأساسي
*/

ownerUid:
itemOwnerUid,

storeId:
String(
item.storeId ||
item.storeUid ||
ownerUid
)

};

});


/* =====================================================
   ORDER DATA
===================================================== */

const orderData = {

ownerUid:
String(ownerUid),

storeId:
String(
currentStoreId ||
ownerUid
),

storeName:
currentStoreName,

name:
name,

phone:
phone,

wilaya:
wilaya,

commune:
commune,

address:
address,

delivery:
delivery,

deliveryPrice:
Number(deliveryCost),

products:
orderProducts,

productsTotal:
Number(productsTotal),

total:
Number(
productsTotal +
deliveryCost
),

status:
"تم التأكيد",

note:
"",

date:
new Date().toLocaleString("ar-DZ"),

createdAt:
serverTimestamp()

};


/* =====================================================
   SAVE ORDER
===================================================== */

await addDoc(

collection(
db,
"orders"
),

orderData

);


/* =====================================================
   REMOVE ONLY CURRENT STORE PRODUCTS
===================================================== */

cart =
cart.filter(item => {

const itemStore =
getItemStoreId(item);


/*
   احتفظ بكل منتجات المتاجر الأخرى.
*/

return !(
currentStoreId &&
(
itemStore ===
String(currentStoreId)
)
);

});


saveCart();


/*
   لا نحذف cartStoreId إلا إذا
   لم تبقَ منتجات أخرى.
*/

if(cart.length === 0){

localStorage.removeItem(
"cartStoreId"
);

}else{

/*
   إذا بقيت منتجات متجر آخر،
   نحدد متجرها التالي إن أمكن.
*/

const nextStore =
getItemStoreId(cart[0]);


if(nextStore){

localStorage.setItem(
"cartStoreId",
nextStore
);

}

}


/* =====================================================
   SUCCESS
===================================================== */

alert(
"تم إرسال الطلب بنجاح ✅"
);


/*
   العودة إلى المتجر الحالي
*/

window.location.href =

"index.html?store=" +

encodeURIComponent(
currentStoreId ||
ownerUid
);


}catch(error){

console.error(
"ORDER ERROR:",
error
);


alert(

"❌ فشل إرسال الطلب.\n\n" +

"السبب:\n" +

(error?.message ||
"خطأ غير معروف")

);


orderBtn.disabled =
false;


orderBtn.innerHTML = `

<i class="fa-solid fa-box"></i>

إرسال الطلب

`;

}

}


/* =====================================================
   MAKE SEND ORDER GLOBAL
===================================================== */

window.sendOrder =
sendOrder;


/* =====================================================
   DELIVERY EVENTS
===================================================== */

wilayaSelect.addEventListener(
"change",
function(){

updateDelivery();
updateOrderButton();

}
);


deliveryTypeSelect.addEventListener(
"change",
function(){

updateDelivery();
updateOrderButton();

}
);


/* =====================================================
   CUSTOMER INPUT EVENTS
===================================================== */

[
"name",
"phone",
