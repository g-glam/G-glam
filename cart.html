<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سلة التسوق</title>

<style>

body{
font-family:Arial,sans-serif;
padding:20px;
background:#f8f8f8;
}

.item{
background:white;
padding:10px;
margin-bottom:10px;
border-radius:8px;
box-shadow:0 0 5px rgba(0,0,0,.1);
}

input,select{
width:100%;
padding:12px;
margin:6px 0;
border:1px solid #ddd;
border-radius:8px;
box-sizing:border-box;
}

.delete-btn{
background:red;
color:white;
border:none;
padding:8px 12px;
border-radius:5px;
cursor:pointer;
}

.order-btn{
background:#0084ff;
color:white;
border:none;
padding:12px;
border-radius:8px;
cursor:pointer;
width:100%;
margin-top:10px;
font-size:16px;
}

.back-btn{
display:inline-block;
margin-top:15px;
text-decoration:none;
color:black;
}

</style>

</head>

<body>

<h1>🛒 سلة التسوق</h1>

<div id="cart-items"></div>

<h3 id="total"></h3>

<h2>معلومات الزبون</h2>

<input type="text" id="name" placeholder="الاسم واللقب">

<input type="text" id="phone" placeholder="رقم الهاتف">

<input type="text" id="wilaya" placeholder="الولاية">

<input type="text" id="commune" placeholder="البلدية">

<input type="text" id="address" placeholder="العنوان">

<select id="deliveryType">
<option value="المنزل">التوصيل للمنزل</option>
<option value="المكتب">التوصيل للمكتب</option>
</select>

<button onclick="sendOrder()" class="order-btn">
📦 إرسال الطلب
</button>

<br>

<a href="index.html" class="back-btn">
⬅ العودة للمتجر
</a>

<script>

let cart = JSON.parse(localStorage.getItem('cart')) || [];

function displayCart(){

let container =
document.getElementById('cart-items');

container.innerHTML = "";

let total = 0;

if(cart.length === 0){

container.innerHTML =
"<p>السلة فارغة</p>";

document.getElementById("total")
.innerText = "";

return;

}

cart.forEach((item,index)=>{

let qty =
item.quantity || 1;

let itemTotal =
item.price * qty;

total += itemTotal;

container.innerHTML += `
<div class="item">

<h3>${item.name}</h3>

<p>

الكمية: ${qty}
<br>

سعر الوحدة: ${item.price} DA
<br>

الإجمالي: ${itemTotal} DA

</p>

<button
class="delete-btn"
onclick="removeItem(${index})">

حذف المنتج

</button>

</div>
`;

});

document.getElementById("total")
.innerText =
"المجموع الكلي: " + total + " DA";

}

function removeItem(index){

cart.splice(index,1);

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

displayCart();

}

function sendOrder(){

let name =
document.getElementById("name").value;

let phone =
document.getElementById("phone").value;

let wilaya =
document.getElementById("wilaya").value;

let commune =
document.getElementById("commune").value;

let address =
document.getElementById("address").value;

let deliveryType =
document.getElementById("deliveryType").value;

if(
!name ||
!phone ||
!wilaya ||
!commune ||
!address
){

alert("يرجى ملء جميع المعلومات");

return;

}

let products = "";

let total = 0;

cart.forEach(item=>{

let qty =
item.quantity || 1;

let itemTotal =
item.price * qty;

total += itemTotal;

products +=
item.name +
" | الكمية: " +
qty +
" | الإجمالي: " +
itemTotal +
" DA\n";

});

fetch(
"https://script.google.com/macros/s/AKfycbzgEMuUVkrHmurIp3cU-EmBL612FlF52wvLTlXfVupbrEhFtlx2l_E-gvLWfwnNIv0taQ/exec",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

name:name,
phone:phone,
wilaya:wilaya,
commune:commune,
address:address,
deliveryType:deliveryType,
deliveryPrice:0,
total:total,
products:products

})
}
)
.then(response=>response.text())
.then(data=>{

alert("تم إرسال الطلب بنجاح ✅");

localStorage.removeItem("cart");

window.location.href="index.html";

})
.catch(error=>{

alert("فشل إرسال الطلب");

console.log(error);

});

}

displayCart();

</script>

</body>
</html>
