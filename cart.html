<style>

/* =====================================================
   COLORS
===================================================== */

:root{

--bg:#F4F4F4;

--card:#FFFFFF;

--text:#222222;

--accent:#F47B20;

--accent-dark:#DF6810;

--accent-light:#FFF1E6;

--muted:#777777;

--border:#E8E8E8;

--danger:#D9534F;

--danger-bg:#FDECEC;

--success:#198754;

--success-bg:#EFFAF3;

--shadow:
0 4px 15px rgba(0,0,0,.06);

}


/* =====================================================
   RESET
===================================================== */

*{

margin:0;
padding:0;

box-sizing:border-box;

font-family:"Tajawal",Arial,sans-serif;

}


/* =====================================================
   BODY
===================================================== */

body{

background:var(--bg);

color:var(--text);

padding-bottom:110px;

min-height:100vh;

}


/* =====================================================
   HEADER
===================================================== */

header{

display:flex;

align-items:center;

justify-content:space-between;

padding:18px 20px;

background:var(--bg);

position:sticky;

top:0;

z-index:100;

}


/* =====================================================
   LOGO
===================================================== */

.logo{

display:flex;

align-items:center;

justify-content:center;

}


.logo img{

width:120px;

height:auto;

max-height:55px;

object-fit:contain;

display:block;

}


/* =====================================================
   MENU + CART
===================================================== */

.menu-btn,
.cart-icon{

font-size:27px;

cursor:pointer;

position:relative;

width:45px;

height:45px;

display:flex;

align-items:center;

justify-content:center;

border-radius:12px;

transition:.2s;

}


.menu-btn:hover,
.cart-icon:hover{

background:var(--accent-light);

}


/* =====================================================
   CART COUNT
===================================================== */

.cart-count{

position:absolute;

top:-5px;

left:-5px;

background:var(--accent);

color:#fff;

font-size:11px;

font-weight:bold;

width:20px;

height:20px;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

}


/* =====================================================
   STORE INFO
===================================================== */

.store-info{

width:calc(100% - 30px);

max-width:700px;

margin:8px auto 18px;

background:#fff;

border:1px solid var(--border);

border-radius:18px;

padding:12px 18px;

text-align:center;

color:var(--muted);

font-size:14px;

box-shadow:var(--shadow);

}


.store-info strong{

color:var(--text);

font-weight:800;

}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.container{

width:calc(100% - 30px);

max-width:900px;

margin:0 auto 30px;

}


/* =====================================================
   CARD
===================================================== */

.card{

background:var(--card);

border-radius:24px;

padding:20px;

border:1px solid var(--border);

box-shadow:

0 6px 22px rgba(0,0,0,.07);

position:relative;

overflow:hidden;

margin-bottom:20px;

}


.card::before{

content:"";

position:absolute;

top:0;

right:0;

width:6px;

height:100%;

background:var(--accent);

}


/* =====================================================
   SECTION TITLE
===================================================== */

.section-title{

font-size:22px;

font-weight:800;

color:var(--text);

margin-bottom:20px;

display:flex;

align-items:center;

gap:8px;

}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-btn{

display:inline-flex;

align-items:center;

gap:5px;

margin-bottom:18px;

padding:10px 15px;

border-radius:12px;

background:var(--accent-light);

color:var(--accent-dark);

text-decoration:none;

font-size:14px;

font-weight:700;

transition:.2s;

}


.back-btn:hover{

background:var(--accent);

color:#fff;

}


/* =====================================================
   CART ITEM
===================================================== */

.item{

position:relative;

border:1px solid var(--border);

border-radius:17px;

padding:16px;

margin-bottom:12px;

background:#FCFCFC;

transition:.2s;

}


.item:hover{

border-color:#FFD8BB;

background:#FFFDFC;

}


.item:last-child{

margin-bottom:0;

}


.item-header{

display:flex;

align-items:flex-start;

justify-content:space-between;

gap:12px;

margin-bottom:10px;

}


.item h3{

font-size:17px;

font-weight:800;

color:#222;

line-height:1.6;

}


.item-info{

font-size:14px;

color:#777;

line-height:1.9;

}


.item-info strong{

color:#333;

}


.item-price{

font-size:17px;

font-weight:800;

color:var(--accent-dark);

margin-top:4px;

}


/* =====================================================
   PRODUCT IMAGE
===================================================== */

.item-layout{

display:flex;

align-items:center;

gap:15px;

}


.item-image{

width:90px;

height:90px;

flex-shrink:0;

border-radius:14px;

overflow:hidden;

background:#F1F1F1;

border:1px solid var(--border);

}


.item-image img{

width:100%;

height:100%;

object-fit:cover;

display:block;

}


.item-content{

flex:1;

min-width:0;

}


/* =====================================================
   OPTIONS
===================================================== */

.option-line{

font-size:13px;

color:#777;

margin-top:3px;

}


.option-line strong{

color:#444;

}


/* =====================================================
   QUANTITY
===================================================== */

.qty-box{

display:flex;

align-items:center;

justify-content:center;

gap:16px;

margin:15px 0;

padding:10px;

background:#F7F7F7;

border-radius:14px;

}


.qty-btn{

width:40px;

height:40px;

border:none;

border-radius:50%;

background:var(--accent);

color:#fff;

font-size:22px;

font-weight:700;

cursor:pointer;

transition:.2s;

display:flex;

align-items:center;

justify-content:center;

}


.qty-btn:hover{

background:var(--accent-dark);

transform:scale(1.04);

}


.qty-btn:disabled{

background:#BDBDBD;

cursor:not-allowed;

transform:none;

}


.qty-number{

min-width:35px;

text-align:center;

font-size:18px;

font-weight:800;

color:#222;

}


/* =====================================================
   ITEM TOTAL
===================================================== */

.item-total{

text-align:center;

font-size:15px;

font-weight:700;

padding:10px;

background:#fff;

border-radius:10px;

border:1px solid var(--border);

margin-bottom:10px;

}


.item-total strong{

color:var(--accent-dark);

font-size:17px;

}


/* =====================================================
   DELETE
===================================================== */

.delete-btn{

width:100%;

background:var(--danger-bg);

color:#B42318;

border:1px solid #F5D0D0;

padding:10px;

border-radius:11px;

cursor:pointer;

font-family:"Tajawal",Arial,sans-serif;

font-size:13px;

font-weight:700;

transition:.2s;

}


.delete-btn:hover{

background:#F8D9D9;

}


/* =====================================================
   EMPTY
===================================================== */

.empty-cart{

text-align:center;

padding:50px 20px;

color:#888;

font-size:15px;

line-height:2;

}


.empty-icon{

font-size:50px;

margin-bottom:12px;

}


.empty-cart button{

margin-top:18px;

background:var(--accent);

color:#fff;

border:none;

padding:13px 27px;

border-radius:13px;

font-family:"Tajawal",Arial,sans-serif;

font-weight:700;

cursor:pointer;

}


/* =====================================================
   TOTAL
===================================================== */

.total-box{

background:#222;

color:#fff;

padding:15px;

border-radius:13px;

text-align:center;

font-size:16px;

font-weight:700;

margin-top:18px;

}


.total-box.final{

background:var(--accent);

font-size:19px;

}


/* =====================================================
   FORM
===================================================== */

.form-group{

margin-bottom:15px;

}


.form-group label{

display:block;

font-size:13px;

font-weight:700;

color:#444;

margin-bottom:7px;

}


.required{

color:var(--accent);

}


input,
select{

width:100%;

padding:14px 15px;

border:1px solid var(--border);

border-radius:13px;

background:#F8F8F8;

color:#333;

font-size:14px;

outline:none;

font-family:"Tajawal",Arial,sans-serif;

transition:.2s;

}


input:focus,
select:focus{

border-color:var(--accent);

background:#fff;

box-shadow:

0 0 0 3px rgba(244,123,32,.10);

}


select{

cursor:pointer;

}


/* =====================================================
   DELIVERY
===================================================== */

.delivery-loading{

font-size:13px;

color:#888;

margin-top:-5px;

margin-bottom:12px;

display:none;

}


.delivery-error{

display:none;

background:var(--danger-bg);

border:1px solid #F5D0D0;

color:#B42318;

padding:12px;

border-radius:11px;

font-size:13px;

margin-bottom:15px;

text-align:center;

}


/* =====================================================
   INFO NOTICE
===================================================== */

.notice{

background:var(--accent-light);

border:1px solid #FFD8BB;

color:#8A470F;

padding:12px 14px;

border-radius:12px;

font-size:13px;

line-height:1.8;

margin-bottom:18px;

}


/* =====================================================
   FLOATING ORDER
===================================================== */

.floating-order{

position:fixed;

bottom:15px;

right:50%;

transform:translateX(50%);

width:90%;

max-width:500px;

background:var(--accent);

color:#fff;

border:none;

padding:16px 20px;

border-radius:30px;

font-size:17px;

font-weight:800;

font-family:"Tajawal",Arial,sans-serif;

cursor:pointer;

box-shadow:

0 8px 22px rgba(244,123,32,.30);

z-index:500;

transition:.2s;

}


.floating-order:hover{

background:var(--accent-dark);

transform:translateX(50%) translateY(-2px);

}


.floating-order:disabled{

background:#BDBDBD;

opacity:.8;

cursor:not-allowed;

box-shadow:none;

transform:translateX(50%);

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

position:fixed;

top:0;

right:-280px;

width:280px;

height:100%;

background:#fff;

box-shadow:

-4px 0 15px rgba(0,0,0,.1);

z-index:999;

transition:.3s;

padding-top:30px;

}


.sidebar.active{

right:0;

}


.sidebar-title{

padding:0 25px 20px;

font-size:24px;

font-weight:800;

border-bottom:1px solid #eee;

margin-bottom:5px;

}


.sidebar a{

display:flex;

align-items:center;

gap:10px;

padding:16px 25px;

text-decoration:none;

color:#222;

font-size:16px;

font-weight:600;

border-bottom:1px solid #eee;

transition:.2s;

}


.sidebar a:hover{

background:var(--accent-light);

color:var(--accent-dark);

}


/* =====================================================
   OVERLAY
===================================================== */

.overlay{

position:fixed;

inset:0;

background:rgba(0,0,0,.35);

display:none;

z-index:998;

}


.overlay.active{

display:block;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

text-align:center;

padding:50px 20px;

color:var(--muted);

font-size:15px;

line-height:2;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

padding:15px 15px;

}


.logo img{

width:105px;

max-height:50px;

}

.cart-icon{

}


.store-info{

width:calc(100% - 20px);

margin-top:8px;

margin-bottom:12px;

}


.container{

width:calc(100% - 20px);

margin-bottom:20px;

}


.card{

padding:15px;

border-radius:20px;

}


.section-title{

font-size:19px;

}


.item-layout{

gap:10px;

}


.item-image{

width:75px;

height:75px;

}


.item h3{

font-size:15px;

}


.item-info{

font-size:13px;

}


.floating-order{

width:calc(100% - 30px);

font-size:16px;

}

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:400px){

.logo img{

width:100px;

}


.container{

width:calc(100% - 16px);

}


.card{

padding:13px;

}


.item{

padding:12px;

}


.item-image{

width:68px;

height:68px;

}


.qty-btn{

width:38px;

height:38px;

}

}

<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
collection,
addDoc,
serverTimestamp,
getDocs,
doc,
getDoc

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
initializeApp(
firebaseConfig
);


const db =
getFirestore(app);


/* =====================================================
   URL PARAMETERS
===================================================== */

const params =
new URLSearchParams(
window.location.search
);


const urlStoreId =
params.get("store");


/* =====================================================
   ELEMENTS
===================================================== */

const cartContainer =
document.getElementById(
"cart-items"
);


const productsTotalElement =
document.getElementById(
"productsTotal"
);


const wilayaSelect =
document.getElementById(
"wilaya"
);


const deliveryTypeSelect =
document.getElementById(
"deliveryType"
);


const deliveryPriceElement =
document.getElementById(
"deliveryPrice"
);


const finalTotalElement =
document.getElementById(
"finalTotal"
);


const deliveryLoading =
document.getElementById(
"deliveryLoading"
);


const deliveryError =
document.getElementById(
"deliveryError"
);


const orderBtn =
document.getElementById(
"orderBtn"
);


const storeInfo =
document.getElementById(
"storeInfo"
);


const cartCount =
document.getElementById(
"cartCount"
);


/* =====================================================
   VARIABLES
===================================================== */

let cart =

JSON.parse(
localStorage.getItem("cart")
) || [];


let productsTotal = 0;

let deliveryCost = 0;

let deliveryItems = [];

let currentStoreId =
urlStoreId ||
localStorage.getItem("cartStoreId") ||
null;

let currentStoreName =
"G-Glam";


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
   GET ITEM STORE
===================================================== */

function getItemStoreId(item){

return (

item.storeId ||

item.storeUid ||

item.ownerUid ||

""

);

}


/* =====================================================
   GET STORE OWNER UID
===================================================== */

function getStoreOwnerUid(){

for(const item of cart){

const ownerUid =
item.ownerUid ||
item.storeUid ||
item.storeId;

if(ownerUid){

if(
!currentStoreId ||
ownerUid === currentStoreId
){

return ownerUid;

}

}

}


const ownerUid =
localStorage.getItem(
"ownerUid"
);


if(ownerUid){

return ownerUid;

}


const storeId =
localStorage.getItem(
"storeId"
);


if(storeId){

return storeId;

}


return null;

}


/* =====================================================
   FILTER STORE CART
===================================================== */

function getCurrentStoreCart(){

if(!currentStoreId){

return cart;

}


return cart.filter(
item => {

const itemStore =
getItemStoreId(item);

return (

!itemStore ||

itemStore === currentStoreId

);

});

}


/* =====================================================
   LOAD STORE
===================================================== */

async function loadStore(){

try{

if(!currentStoreId){

storeInfo.innerHTML = `

متجر:

<strong>
G-Glam
</strong>

`;

return;

}


const storeRef =
doc(
db,
"stores",
currentStoreId
);


const storeSnap =
await getDoc(
storeRef
);


if(storeSnap.exists()){

const store =
storeSnap.data();


currentStoreName =

store.storeName ||

store.name ||

"G-Glam";

}else{

currentStoreName =
"G-Glam";

}


storeInfo.innerHTML = `

متجر:

<strong>
${escapeHtml(
currentStoreName
)}
</strong>

`;


document.getElementById(
"homeLink"
).href =

"index.html?store=" +

encodeURIComponent(
currentStoreId
);


document.getElementById(
"cartLink"
).href =

"cart.html?store=" +

encodeURIComponent(
currentStoreId
);


document.getElementById(
"cartButton"
).onclick =
function(){

window.location.href =

"cart.html?store=" +

encodeURIComponent(
currentStoreId
);

};


}catch(error){

console.error(
"STORE LOAD ERROR:",
error
);

storeInfo.innerHTML = `

متجر:

<strong>
G-Glam
</strong>

`;

}

}


/* =====================================================
   LOAD DELIVERY FROM FIREBASE
===================================================== */

async function loadDelivery(){

deliveryLoading.style.display =
"block";

deliveryError.style.display =
"none";

wilayaSelect.innerHTML = `

<option value="">

⏳ جاري تحميل الولايات...

</option>

`;

try{

const snapshot =
await getDocs(

collection(
db,
"delivery"
)

);


deliveryItems = [];


snapshot.forEach(

docSnap => {

const data =
docSnap.data();


deliveryItems.push({

id:
docSnap.id,

office:
Number(
data.office || 0
),

home:
Number(
data.home || 0
)

});

});


deliveryItems.sort(

(a,b) =>

a.id.localeCompare(
b.id,
"ar"
)

);


wilayaSelect.innerHTML = `

<option value="">

اختر الولاية

</option>

`;


if(
deliveryItems.length === 0
){

wilayaSelect.innerHTML = `

<option value="">

لا توجد ولايات متاحة

</option>

`;

}else{

deliveryItems.forEach(

item => {

const option =
document.createElement(
"option"
);


option.value =
item.id;


option.textContent =
item.id;


wilayaSelect.appendChild(
option
);

});

}


deliveryLoading.style.display =
"none";


}catch(error){

console.error(
"DELIVERY LOAD ERROR:",
error
);


wilayaSelect.innerHTML = `

<option value="">

تعذر تحميل الولايات

</option>

`;


deliveryError.textContent =

"❌ تعذر تحميل أسعار التوصيل. يرجى المحاولة مرة أخرى.";


deliveryError.style.display =
"block";


deliveryLoading.style.display =
"none";

}

}


/* =====================================================
   GET DELIVERY
===================================================== */

function getDeliveryItem(){

const wilaya =
wilayaSelect.value;


return deliveryItems.find(

item =>
item.id === wilaya

);

}


/* =====================================================
   UPDATE DELIVERY
===================================================== */

function updateDelivery(){

const item =
getDeliveryItem();


const type =
deliveryTypeSelect.value;


if(
!item ||
!type
){

deliveryCost = 0;


deliveryPriceElement.innerText =

"سعر التوصيل: --";


updateFinalTotal();

return;

}


if(
type === "إلى المكتب"
){

deliveryCost =
item.office;

}else{

deliveryCost =
item.home;

}


deliveryPriceElement.innerText =

"سعر التوصيل: " +
deliveryCost +
" DA";


updateFinalTotal();

}


/* =====================================================
   UPDATE FINAL TOTAL
===================================================== */

function updateFinalTotal(){

finalTotalElement.innerText =

"المجموع النهائي: " +

(
productsTotal +
deliveryCost
) +

" DA";

}


/* =====================================================
   DISPLAY CART
===================================================== */

function displayCart(){

const storeCart =
getCurrentStoreCart();


cartContainer.innerHTML = "";

productsTotal = 0;


if(
storeCart.length === 0
){

cartContainer.innerHTML = `

<div class="empty-cart">

<div class="empty-icon">

🛒

</div>

السلة فارغة

<br>

أضف بعض المنتجات للمتابعة.

<br>

<button
onclick="window.location.href='index.html${currentStoreId ? "?store="+encodeURIComponent(currentStoreId) : ""}'">

العودة إلى المتجر

</button>

</div>

`;


productsTotalElement.innerText =

"مجموع المنتجات: 0 DA";


updateFinalTotal();

orderBtn.disabled = true;

return;

}


orderBtn.disabled = false;


storeCart.forEach(

(item) => {


const qty =
Number(
item.quantity || 1
);


const price =
Number(
item.price || 0
);


const total =
price * qty;


productsTotal +=
total;


const div =
document.createElement(
"div"
);


div.className =
"item";


const image =

item.image ||

(
Array.isArray(
item.images
)

&&

item.images.length

?

item.images[0]

:

""
);


const color =

item.color ||

"بدون لون";


const size =

item.size ||

"بدون قياس";


const realIndex =
cart.indexOf(
item
);


div.innerHTML = `

<div class="item-layout">


<div class="item-image">

${
image

?

`

<img
src="${escapeHtml(image)}"
alt="${escapeHtml(
item.name || "منتج"
)}"
onerror="
this.style.display='none'
">

`

:

`

<span
style="
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
">

📷

</span>

`

}

</div>


<div class="item-content">


<div class="item-header">

<h3>

${escapeHtml(
item.name || "منتج"
)}

</h3>

</div>


<div class="item-info">

السعر:

<strong>
${price} DA
</strong>

</div>


<div class="option-line">

اللون:

<strong>
${escapeHtml(color)}
</strong>

</div>


<div class="option-line">

القياس:

<strong>
${escapeHtml(size)}
</strong>

</div>


</div>

</div>


<div class="qty-box">


<button
class="qty-btn"
data-action="minus"
data-index="${realIndex}">

−

</button>


<span
class="qty-number">

${qty}

</span>


<button
class="qty-btn"
data-action="plus"
data-index="${realIndex}">

+

</button>


</div>


<div class="item-total">

مجموع المنتج:

<strong>
${total} DA
</strong>

</div>


<button
class="delete-btn"
data-action="delete"
data-index="${realIndex}">

🗑️ حذف المنتج

</button>

`;


cartContainer.appendChild(
div
);

});


productsTotalElement.innerText =

"مجموع المنتجات: " +
productsTotal +
" DA";


updateFinalTotal();

}


/* =====================================================
   CART ACTIONS
===================================================== */

cartContainer.addEventListener(

"click",

function(event){

const button =
event.target.closest(
"button"
);


if(!button)
return;


const index =
Number(
button.dataset.index
);


const action =
button.dataset.action;


if(
isNaN(index) ||
!cart[index]
){

return;

}


if(
action === "plus"
){

const currentQty =
Number(
cart[index].quantity || 1
);


const stock =

cart[index].stock;


if(

stock !== null &&

stock !== undefined &&

stock !== "" &&

!Number.isNaN(
Number(stock)
)

&&

currentQty >= Number(stock)

){

alert(
"❌ لا توجد كمية إضافية متوفرة."
);

return;

}


cart[index].quantity =
currentQty + 1;

}


if(
action === "minus"
){

cart[index].quantity =

Number(
cart[index].quantity || 1
) - 1;


if(
cart[index].quantity < 1
){

cart[index].quantity = 1;

}

}


if(
action === "delete"
){

cart.splice(
index,
1
);

}


localStorage.setItem(

"cart",

JSON.stringify(
cart
)

);


displayCart();

updateCartCount();

});


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount(){

const storeCart =
getCurrentStoreCart();


let total = 0;


storeCart.forEach(

item => {

total +=

Number(
item.quantity || 1
);

});


cartCount.textContent =
total;

}


/* =====================================================
   SEND ORDER
===================================================== */

window.sendOrder =
async function(){

const storeCart =
getCurrentStoreCart();


if(
storeCart.length === 0
){

alert(
"السلة فارغة."
);

return;

}


const name =
document.getElementById(
"name"
).value.trim();


const phone =
document.getElementById(
"phone"
).value.trim();


const wilaya =
wilayaSelect.value;


const commune =
document.getElementById(
"commune"
).value.trim();


const address =
document.getElementById(
"address"
).value.trim();


const delivery =
deliveryTypeSelect.value;


const ownerUid =
getStoreOwnerUid();


if(
!name ||
!phone ||
!wilaya ||
!delivery
){

alert(
"يرجى ملء المعلومات المطلوبة."
);

return;

}


if(
!ownerUid
){

alert(

"تعذر تحديد المتجر الذي ينتمي إليه الطلب.\n\n" +

"يرجى العودة إلى صفحة المتجر وإعادة المحاولة."

);

return;

}


const deliveryItem =
getDeliveryItem();


if(
!deliveryItem
){

alert(
"تعذر العثور على سعر التوصيل لهذه الولاية."
);

return;

}


updateDelivery();


orderBtn.disabled = true;

orderBtn.textContent =
"⏳ جاري إرسال الطلب...";


try{


const orderProducts =

storeCart.map(

item => ({

id:
item.id || "",

name:
item.name || "منتج",

price:
Number(
item.price || 0
),

quantity:
Number(
item.quantity || 1
),

total:
Number(
item.price || 0
) *
Number(
item.quantity || 1
),

image:
item.image || "",

color:
item.color || "بدون لون",

size:
item.size || "بدون قياس",

storeId:
item.storeId ||
item.storeUid ||
ownerUid,

ownerUid:
item.ownerUid ||
item.storeUid ||
item.storeId ||
ownerUid

})

);


const orderData = {

ownerUid:

ownerUid,

storeId:

currentStoreId ||
ownerUid,

storeName:

currentStoreName,

name:

name,

phone:

phone,

wilaya:

wilaya,

commune:

commune,

address:

address,

delivery:

delivery,

deliveryPrice:

deliveryCost,

products:

orderProducts,

productsTotal:

productsTotal,

total:

productsTotal +
deliveryCost,

status:

"تم التأكيد",

note:

"",

date:

new Date()
.toLocaleString(
"ar-DZ"
),

createdAt:

serverTimestamp()

};


await addDoc(

collection(
db,
"orders"
),

orderData

);


alert(
"تم إرسال الطلب بنجاح ✅"
);


cart = cart.filter(

item => {

const itemStore =
getItemStoreId(item);


return (

currentStoreId &&

itemStore &&

itemStore !== currentStoreId

);

});


if(
cart.length === 0
){

localStorage.removeItem(
"cart"
);

}else{

localStorage.setItem(

"cart",

JSON.stringify(
cart
)

);

}


localStorage.removeItem(
"cartStoreId"
);


window.location.href =

"index.html?store=" +

encodeURIComponent(
currentStoreId || ownerUid
);


}catch(error){

console.error(
"ORDER ERROR:",
error
);


alert(

"❌ فشل إرسال الطلب.\n\n" +

"السبب: " +

error.message

);


orderBtn.disabled = false;

orderBtn.textContent =
"📦 إرسال الطلب";

}

};


/* =====================================================
   DELIVERY EVENTS
===================================================== */

wilayaSelect.addEventListener(

"change",

updateDelivery

);


deliveryTypeSelect.addEventListener(

"change",

updateDelivery

);


/* =====================================================
   SIDEBAR
===================================================== */

const sidebar =
document.getElementById(
"sidebar"
);


const overlay =
document.getElementById(
"overlay"
);


document
.getElementById("menuBtn")
.addEventListener(

"click",

function(){

sidebar.classList.add(
"active"
);

overlay.classList.add(
"active"
);

});


overlay.addEventListener(

"click",

function(){

sidebar.classList.remove(
"active"
);

overlay.classList.remove(
"active"
);

});


/* =====================================================
   START
===================================================== */

await loadStore();

displayCart();

updateCartCount();

loadDelivery();


console.log(
"G-Glam Cart Started"
);

</script>
