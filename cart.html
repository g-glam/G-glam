<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلة التسوق</title>

<style>

body{
    font-family:Arial,sans-serif;
    padding:20px;
    background:#f8f8f8;
}

.item{
    background:white;
    padding:10px;
    margin-bottom:10px;
    border-radius:8px;
    box-shadow:0 0 5px rgba(0,0,0,.1);
}

.delete-btn{
    background:red;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:5px;
    cursor:pointer;
}

.order-btn{
    background:#0084ff;
    color:white;
    border:none;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
    width:100%;
    margin-top:10px;
    font-size:16px;
}

.back-btn{
    display:inline-block;
    margin-top:15px;
    text-decoration:none;
}

</style>
</head>

<body>

<h1>🛒 سلة التسوق</h1>

<div id="cart-items"></div>

<h3 id="total"></h3>

<button onclick="openMessenger()" class="order-btn">
💬 اطلب الآن
</button>

<br>

<a href="index.html" class="back-btn">
⬅ العودة للمتجر
</a>

<script>

let cart = JSON.parse(localStorage.getItem('cart')) || [];

function displayCart(){

    let container =
    document.getElementById('cart-items');

    container.innerHTML = "";

    let total = 0;

    if(cart.length === 0){

        container.innerHTML =
        "<p>السلة فارغة</p>";

        document.getElementById("total")
        .innerText = "";

        return;
    }

    cart.forEach((item,index)=>{

        let quantity =
        item.quantity || 1;

        let color =
        item.color || "غير محدد";

        let itemTotal =
        item.price * quantity;

        total += itemTotal;

        container.innerHTML += `

        <div class="item">

            <h3>${item.name}</h3>

            <p>
            السعر: ${item.price} DA
            </p>

            <p>
            اللون: ${color}
            </p>

            <p>
            الكمية: ${quantity}
            </p>

            <p>
            المجموع: ${itemTotal} DA
            </p>

            <button
            class="delete-btn"
            onclick="removeItem(${index})">

            حذف المنتج

            </button>

        </div>

        `;
    });

    document.getElementById("total").innerText =
    "المجموع الكلي: " + total + " DA";
}

function removeItem(index){

    cart.splice(index,1);

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    displayCart();
}

function openMessenger(){

    let cart =
    JSON.parse(
    localStorage.getItem('cart')
    ) || [];

    let orderText =
    "المنتجات المطلوبة:\n\n";

    cart.forEach(item=>{

        let quantity =
        item.quantity || 1;

        let color =
        item.color || "غير محدد";

        orderText +=

        "- " + item.name +

        "\nاللون: " + color +

        "\nالكمية: " + quantity +

        "\nالسعر: " + item.price + " DA" +

        "\n-----------------\n";
    });

    prompt(
      "انسخ الطلب من هنا ثم أرسله في Messenger:",
      orderText
    );

    window.open(
      "https://www.messenger.com/t/543507055501751/",
      "_blank"
    );
}

displayCart();

</script>

</body>
</html>
