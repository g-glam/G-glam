<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#FFFFFF"
    id="themeColorMeta"
>

<link
    rel="manifest"
    href="manifest.json"
>

<link
    rel="apple-touch-icon"
    href="icons/icon-192.png"
>

<title>G-Glam | سلة التسوق</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

/* =====================================================
   ROOT
===================================================== */

:root{

    --bg:#F5F5F5;
    --header:#F5F5F5;

    --card:#FFFFFF;

    --text:#222222;
    --muted:#777777;

    --border:#E8E8E8;

    --accent:#F47B20;
    --accent-dark:#DF6810;
    --accent-light:#FFF1E6;

    --accent-rgb:244,123,32;

    --gradient:
        linear-gradient(
            135deg,
            #F47B20,
            #FF9B54
        );

    --shadow:
        0 5px 20px rgba(0,0,0,.06);

    --radius:18px;
}


/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:"Tajawal",sans-serif;

    background:var(--bg);

    color:var(--text);

    min-height:100vh;

    line-height:1.6;
}

button,
input,
select,
textarea{

    font-family:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
    text-decoration:none;
}


/* =====================================================
   HEADER
===================================================== */

header{

    position:sticky;

    top:0;

    z-index:1000;

    height:70px;

    background:var(--header);

    border-bottom:1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 18px;

    transition:.25s;
}

.header-right,
.header-left{

    display:flex;

    align-items:center;

    gap:10px;
}

.header-right{
    min-width:0;
}

.logo{

    font-size:21px;

    font-weight:900;

    color:var(--accent);

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    max-width:220px;
}

.icon-btn{

    width:44px;

    height:44px;

    border:none;

    border-radius:14px;

    background:var(--card);

    color:var(--text);

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    box-shadow:0 2px 8px rgba(0,0,0,.04);

    transition:.2s;
}

.icon-btn:hover{
    transform:translateY(-1px);
}

.icon-btn i{
    font-size:18px;
}

.cart-count{

    position:absolute;

    top:-4px;

    right:-4px;

    min-width:19px;

    height:19px;

    padding:0 5px;

    border-radius:20px;

    background:var(--accent);

    color:#fff;

    font-size:11px;

    font-weight:800;

    display:flex;

    align-items:center;

    justify-content:center;

    border:2px solid var(--header);
}


/* =====================================================
   PAGE
===================================================== */

.page{

    width:min(1200px,calc(100% - 28px));

    margin:25px auto 50px;
}

.page-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-bottom:22px;
}

.page-title{

    font-size:31px;

    font-weight:900;

    color:var(--text);
}

.continue-btn{

    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:11px 16px;

    border-radius:13px;

    background:var(--card);

    border:1px solid var(--border);

    color:var(--text);

    font-weight:700;

    transition:.2s;
}

.continue-btn:hover{

    border-color:var(--accent);

    color:var(--accent);
}


/* =====================================================
   STORE INFO
===================================================== */

.store-info{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:var(--radius);

    padding:15px 18px;

    margin-bottom:20px;

    box-shadow:var(--shadow);

    display:flex;

    align-items:center;

    gap:12px;
}

.store-info-icon{

    width:44px;

    height:44px;

    flex-shrink:0;

    border-radius:14px;

    background:var(--accent-light);

    color:var(--accent);

    display:flex;

    align-items:center;

    justify-content:center;
}

.store-info-text{

    min-width:0;
}

.store-info-label{

    color:var(--muted);

    font-size:12px;

    margin-bottom:1px;
}

.store-info-name{

    font-size:18px;

    font-weight:800;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}


/* =====================================================
   MAIN GRID
===================================================== */

.cart-layout{

    display:grid;

    grid-template-columns:minmax(0,1.6fr) minmax(320px,.9fr);

    gap:20px;

    align-items:start;
}


/* =====================================================
   CARD
===================================================== */

.card{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:var(--radius);

    box-shadow:var(--shadow);
}

.card-title{

    padding:18px 20px;

    border-bottom:1px solid var(--border);

    font-size:18px;

    font-weight:900;

    display:flex;

    align-items:center;

    gap:9px;
}

.card-title i{
    color:var(--accent);
}


/* =====================================================
   CART ITEMS
===================================================== */

#cart-items{
    padding:8px 18px 18px;
}

.cart-item{

    display:grid;

    grid-template-columns:105px minmax(0,1fr);

    gap:15px;

    padding:17px 0;

    border-bottom:1px solid var(--border);
}

.cart-item:last-child{
    border-bottom:none;
}

.cart-item-image{

    width:105px;

    height:115px;

    border-radius:15px;

    overflow:hidden;

    background:#f1f1f1;
}

.cart-item-image img{

    width:100%;

    height:100%;

    object-fit:cover;
}

.cart-item-content{
    min-width:0;
}

.cart-item-name{

    font-size:18px;

    font-weight:900;

    line-height:1.4;

    margin-bottom:6px;
}

.cart-item-price{

    color:var(--accent);

    font-size:16px;

    font-weight:800;

    margin-bottom:8px;
}

.cart-item-meta{

    display:flex;

    flex-wrap:wrap;

    gap:6px;

    margin-bottom:12px;
}

.meta-tag{

    background:var(--accent-light);

    color:var(--accent-dark);

    border-radius:8px;

    padding:4px 8px;

    font-size:12px;

    font-weight:700;
}


/* =====================================================
   QUANTITY
===================================================== */

.cart-item-actions{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    margin-top:5px;
}

.quantity-control{

    display:flex;

    align-items:center;

    border:1px solid var(--border);

    border-radius:11px;

    overflow:hidden;

    background:var(--card);
}

.quantity-btn{

    width:34px;

    height:34px;

    border:none;

    background:transparent;

    color:var(--text);

    font-size:16px;

    display:flex;

    align-items:center;

    justify-content:center;
}

.quantity-btn:hover{

    background:var(--accent-light);

    color:var(--accent);
}

.quantity-number{

    min-width:35px;

    text-align:center;

    font-size:14px;

    font-weight:800;
}


/* =====================================================
   ITEM BOTTOM
   السعر + حذف المنتج
===================================================== */

.cart-item-bottom{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    margin-top:13px;

    width:100%;
}

.item-total{

    font-size:19px;

    font-weight:900;

    color:var(--accent);

    line-height:1.2;
}

.delete-item-btn{

    width:38px;

    height:38px;

    flex-shrink:0;

    border:none;

    border-radius:11px;

    background:#FFF1F1;

    color:#E53935;

    display:flex;

    align-items:center;

    justify-content:center;

    transition:.2s;
}

.delete-item-btn:hover{

    background:#FFE0E0;

    transform:scale(1.04);
}

.delete-item-btn i{
    font-size:15px;
}


/* =====================================================
   EMPTY CART
===================================================== */

.empty-cart{

    text-align:center;

    padding:55px 20px;
}

.empty-cart-icon{

    width:80px;

    height:80px;

    margin:0 auto 15px;

    border-radius:50%;

    background:var(--accent-light);

    color:var(--accent);

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:32px;
}

.empty-cart h3{

    font-size:21px;

    margin-bottom:6px;
}

.empty-cart p{

    color:var(--muted);

    margin-bottom:20px;
}

.empty-cart-btn{

    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:12px 20px;

    background:var(--accent);

    color:#fff;

    border-radius:12px;

    font-weight:800;
}


/* =====================================================
   SUMMARY
===================================================== */

.summary-card{

    position:sticky;

    top:90px;

    overflow:hidden;
}

.summary-body{

    padding:18px;
}

.form-group{

    margin-bottom:14px;
}

.form-label{

    display:block;

    font-size:13px;

    font-weight:800;

    margin-bottom:6px;
}

.form-control{

    width:100%;

    height:46px;

    border:1px solid var(--border);

    border-radius:11px;

    padding:0 13px;

    background:var(--card);

    color:var(--text);

    outline:none;

    transition:.2s;
}

textarea.form-control{

    height:85px;

    resize:vertical;

    padding-top:11px;
}

.form-control:focus{

    border-color:var(--accent);

    box-shadow:
        0 0 0 3px
        rgba(var(--accent-rgb),.09);
}

.delivery-row{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;
}

.delivery-message{

    padding:10px 12px;

    border-radius:10px;

    font-size:12px;

    margin-bottom:13px;

    display:none;
}

.delivery-message.loading{

    display:block;

    background:#f5f5f5;

    color:#777;
}

.delivery-message.error{

    display:block;

    background:#FFF1F1;

    color:#D32F2F;
}


/* =====================================================
   TOTALS
===================================================== */

.totals{

    border-top:1px solid var(--border);

    margin-top:16px;

    padding-top:14px;
}

.total-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-bottom:10px;

    font-size:14px;
}

.total-row span:first-child{
    color:var(--muted);
}

.total-row strong{
    font-weight:800;
}

.final-total{

    border-top:1px dashed var(--border);

    margin-top:12px;

    padding-top:13px;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.final-total span{

    font-size:16px;

    font-weight:900;
}

.final-total strong{

    font-size:24px;

    color:var(--accent);

    font-weight:900;
}


/* =====================================================
   ORDER BUTTON
===================================================== */

.order-btn{

    width:100%;

    min-height:52px;

    border:none;

    border-radius:13px;

    background:var(--gradient);

    color:#fff;

    font-size:16px;

    font-weight:900;

    margin-top:17px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:9px;

    box-shadow:
        0 8px 20px
        rgba(var(--accent-rgb),.20);

    transition:.2s;
}

.order-btn:hover:not(:disabled){

    transform:translateY(-1px);

    box-shadow:
        0 10px 24px
        rgba(var(--accent-rgb),.28);
}

.order-btn:disabled{

    opacity:.5;

    cursor:not-allowed;

    box-shadow:none;
}


/* =====================================================
   SOCIAL
===================================================== */

.social-section{

    margin-top:20px;

    padding:20px;

    text-align:center;
}

.social-title{

    font-size:17px;

    font-weight:900;

    margin-bottom:13px;
}

.social-grid{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:9px;
}

.social-link{

    width:42px;

    height:42px;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#f5f5f5;

    color:var(--text);

    transition:.2s;
}

.social-link:hover{

    background:var(--accent-light);

    color:var(--accent);

    transform:translateY(-2px);
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar-overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.45);

    z-index:1998;

    opacity:0;

    visibility:hidden;

    transition:.25s;
}

.sidebar-overlay.active{

    opacity:1;

    visibility:visible;
}

.sidebar{

    position:fixed;

    top:0;

    right:-310px;

    width:290px;

    max-width:85vw;

    height:100vh;

    background:var(--card);

    z-index:1999;

    box-shadow:-5px 0 25px rgba(0,0,0,.12);

    transition:.28s;

    padding:20px;
}

.sidebar.active{
    right:0;
}

.sidebar-head{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    padding-bottom:18px;

    border-bottom:1px solid var(--border);

    margin-bottom:15px;
}

.sidebar-title{

    font-size:20px;

    font-weight:900;

    color:var(--accent);

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.sidebar-close{

    width:40px;

    height:40px;

    border:none;

    background:#f5f5f5;

    border-radius:11px;

    display:flex;

    align-items:center;

    justify-content:center;
}

.sidebar-link{

    display:flex;

    align-items:center;

    gap:12px;

    padding:13px 12px;

    border-radius:12px;

    font-weight:700;

    margin-bottom:5px;

    transition:.2s;
}

.sidebar-link:hover{

    background:var(--accent-light);

    color:var(--accent);
}

.sidebar-link i{

    width:23px;

    text-align:center;
}


/* =====================================================
   LOADING
===================================================== */

.loading-screen{

    position:fixed;

    inset:0;

    z-index:5000;

    background:rgba(255,255,255,.92);

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    gap:12px;
}

.loading-spinner{

    width:42px;

    height:42px;

    border:4px solid #eee;

    border-top-color:var(--accent);

    border-radius:50%;

    animation:spin .8s linear infinite;
}

.loading-text{

    color:var(--muted);

    font-weight:700;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}


/* =====================================================
   THEMES
===================================================== */

    --accent:#F47B20;
    --accent-dark:#DF6810;
    --accent-light:#FFF1E6;
    --accent-rgb:244,123,32;
    --gradient:linear-gradient(135deg,#F47B20,#FF9B54);
}

    --accent-dark:#125BA3;

/* =====================================================
   DARK SPECIAL
===================================================== */

body.theme-dark .icon-btn,
body.theme-luxury .icon-btn{

    background:#252525;

    color:#fff;
}

body.theme-dark .form-control,
body.theme-luxury .form-control{

    background:#252525;

    color:#fff;
}

body.theme-dark .quantity-control,
body.theme-luxury .quantity-control{

    background:#252525;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:900px){

    .cart-layout{

        grid-template-columns:1fr;
    }

    .summary-card{

        position:static;
    }

}

@media(max-width:650px){

    header{
        height:64px;

        padding:0 12px;
    }

    .logo{
        font-size:18px;

        max-width:170px;
    }

    .icon-btn{

        width:40px;
        height:40px;

        border-radius:12px;
    }

    .page{

        width:min(100% - 18px,1200px);

        margin-top:18px;
    }

    .page-top{

        align-items:flex-start;
    }

    .page-title{

        font-size:26px;
    }

    .continue-btn{

        padding:9px 11px;

        font-size:12px;
    }

    .cart-item{

        grid-template-columns:82px minmax(0,1fr);

        gap:11px;
    }

    .cart-item-image{

        width:82px;

        height:98px;
    }

    .cart-item-name{

        font-size:16px;
    }

    .cart-item-price{

        font-size:14px;
    }

    .item-total{

        font-size:17px;
    }

    .delivery-row{

        grid-template-columns:1fr;
    }

}

@media(max-width:400px){

    .page-title{

        font-size:23px;
    }

    .continue-btn span{

        display:none;
    }

    .cart-item{

        grid-template-columns:72px minmax(0,1fr);
    }

    .cart-item-image{

        width:72px;

        height:88px;
    }

    .cart-item-bottom{

        gap:8px;
    }

}


/* =====================================================
   FLOATING CART
===================================================== */

.floating-cart{

    position:fixed;

/* =====================================================
   COLOR HELPERS
===================================================== */

function normalizeHexColor(color){

    if(
        typeof color !== "string"
    ){

        return null;

    }

    let value =
        color.trim();

    if(
        !/^#?[0-9a-fA-F]{6}$/.test(value)
    ){

        return null;

    }

    if(
        !value.startsWith("#")
    ){

        value =
            "#" + value;

    }

    return value.toUpperCase();

}


function hexToRgb(hex){

    const normalized =
        normalizeHexColor(hex);

    if(!normalized){

        return null;

    }

    return {

        r:parseInt(
            normalized.slice(1,3),
            16
        ),

        g:parseInt(
            normalized.slice(3,5),
            16
        ),

        b:parseInt(
            normalized.slice(5,7),
            16
        )

    };

}


function rgbaFromHex(
    hex,
    alpha
){

    const rgb =
        hexToRgb(hex);

    if(!rgb){

        return `rgba(244,123,32,${alpha})`;

    }

    return `rgba(
        ${rgb.r},
        ${rgb.g},
        ${rgb.b},
        ${alpha}
    )`;

}


function darkenColor(
    hex,
    amount=0.15
){

    const rgb =
        hexToRgb(hex);

    if(!rgb){

        return "#DF6810";

    }

    return "#"+
        [rgb.r,rgb.g,rgb.b]
        .map(
            value =>
                Math.max(
                    0,
                    Math.round(
                        value *
                        (1-amount)
                    )
                )
                .toString(16)
                .padStart(2,"0")
        )
        .join("")
        .toUpperCase();

}


/* =====================================================
   APPLY THEME
===================================================== */

function applyStoreTheme(
    themeOrStore
){

    document.body.classList.remove(
        ...validThemes.map(
            theme =>
                `theme-${theme}`
        )
    );


    let theme =
        "orange";


    let themeType =
        null;

    let colors =
        null;

    let direction =
        "135deg";

    let customColor =
        null;


    if(
        typeof themeOrStore === "string"
    ){

        theme =
            themeOrStore;

    }else if(
        themeOrStore &&
        typeof themeOrStore === "object"
    ){

        theme =
            themeOrStore.theme ||
            themeOrStore.storeTheme ||
            themeOrStore.themeName ||
            "orange";

        themeType =
            themeOrStore.themeType ||
            null;

        colors =
            Array.isArray(
                themeOrStore.themeColors
            )
            ?
            themeOrStore.themeColors
            :
            null;

        direction =
            themeOrStore.themeDirection ||
            "135deg";

        customColor =
            themeOrStore.themeColor ||
            null;

    }


    if(
        themeType === "gradient" &&
        colors &&
        colors.length >= 2
    ){

        const c1 =
            normalizeHexColor(
                colors[0]
            );

        const c2 =
            normalizeHexColor(
                colors[1]
            );

        if(c1 && c2){

            document.documentElement
                .style
                .setProperty(
                    "--accent",
                    c1
                );

            document.documentElement
                .style
                .setProperty(
                    "--accent-dark",
                    darkenColor(c1)
                );

            document.documentElement
                .style
                .setProperty(
                    "--accent-light",
                    rgbaFromHex(
                        c1,
                        .10
                    )
                );

            const rgb =
                hexToRgb(c1);

            if(rgb){

                document.documentElement
                    .style
                    .setProperty(
                        "--accent-rgb",
                        `${rgb.r},${rgb.g},${rgb.b}`
                    );

            }

            document.documentElement
                .style
                .setProperty(
                    "--gradient",
                    `linear-gradient(
                        ${direction},
                        ${c1},
                        ${c2}
                    )`
                );

            localStorage.setItem(
                "gglamStoreTheme",
                "custom"
            );

            localStorage.setItem(
                "gglamThemeType",
                "gradient"
            );

            localStorage.setItem(
                "gglamThemeColors",
                JSON.stringify(colors)
            );

            localStorage.setItem(
                "gglamThemeDirection",
                direction
            );

            localStorage.removeItem(
                "gglamThemeColor"
            );

            return;

        }

    }


    if(
        themeType === "solid"
    ){

        const color =
            normalizeHexColor(
                customColor ||
                (
                    colors &&
                    colors[0]
                )
            );


        if(color){

            const rgb =
                hexToRgb(color);

            document.documentElement
                .style
                .setProperty(
                    "--accent",
                    color
                );

            document.documentElement
                .style
                .setProperty(
                    "--accent-dark",
                    darkenColor(color)
                );

            document.documentElement
                .style
                .setProperty(
                    "--accent-light",
                    rgbaFromHex(
                        color,
                        .10
                    )
                );

            if(rgb){

                document.documentElement
                    .style
                    .setProperty(
                        "--accent-rgb",
                        `${rgb.r},${rgb.g},${rgb.b}`
                    );

            }

            document.documentElement
                .style
                .setProperty(
                    "--gradient",
                    `linear-gradient(
                        135deg,
                        ${color},
                        ${color}
                    )`
                );


            localStorage.setItem(
                "gglamStoreTheme",
                "custom"
            );

            localStorage.setItem(
                "gglamThemeType",
                "solid"
            );

            localStorage.setItem(
                "gglamThemeColor",
                color
            );

            localStorage.removeItem(
                "gglamThemeColors"
            );

            return;

        }

    }


    if(
        !validThemes.includes(theme)
    ){

        theme =
            "orange";

    }


    document.body.classList.add(
        `theme-${theme}`
    );


    localStorage.setItem(
        "gglamStoreTheme",
        theme
    );

    localStorage.removeItem(
        "gglamThemeType"
    );

    localStorage.removeItem(
        "gglamThemeColors"
    );

    localStorage.removeItem(
        "gglamThemeDirection"
    );

    localStorage.removeItem(
        "gglamThemeColor"
    );


    const color =
        themeColors[theme] ||
        themeColors.orange;


    document.documentElement
        .style
        .setProperty(
            "--themeColor",
            color
        );


    const themeMeta =
        document.getElementById(
            "themeColorMeta"
        );

    if(themeMeta){

        themeMeta.setAttribute(
            "content",
            color
        );

    }

}

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function safeUrl(url){

    if(
        !url ||
        typeof url !== "string"
    ){

        return "#";

    }

    const value =
        url.trim();

    if(
        /^(https?:\/\/|tel:|mailto:)/i
            .test(value)
    ){

        return value;

    }

    return "#";

}


function formatPrice(
    price
){

    const number =
        Number(price) || 0;

    return (
        new Intl.NumberFormat(
            "fr-DZ"
        ).format(number)
        + " دج"
    );

}

function getCart(){

    try{

        const saved =
            localStorage.getItem(
                "cart"
            );

        if(saved){

            const parsed =
                JSON.parse(saved);

            if(
                Array.isArray(parsed)
            ){

                return parsed;

            }

        }


        const old =
            localStorage.getItem(
                "gglamCart"
            );

        if(old){

            const parsed =
                JSON.parse(old);

            if(
                Array.isArray(parsed)
            ){

                return parsed;

            }

        }

    }catch(error){

        console.error(
            "Cart read error:",
            error
        );

    }

    return [];

}


function saveCart(){

    try{

        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );

        if(currentStoreId){

            localStorage.setItem(
                "cartStoreId",

        if(currentOwnerUid){

            localStorage.setItem(
                "ownerUid",
                currentOwnerUid
            );

        }

    }catch(error){

        console.error(
            "Cart save error:",
            error
        );

    }

}


function getItemStoreId(
    item
){

    return (
        item?.storeId ||
        item?.storeUid ||
        item?.storeID ||
        ""
    );

}


function getItemOwnerUid(
    item
){

    return (
        item?.ownerUid ||
        item?.ownerId ||
        ""
    );

}


function getCurrentStoreCart(){

    if(!currentStoreId){

        return cart;

    }

    return cart.filter(
        item => {

            const itemStore =
                getItemStoreId(item);

            const itemOwner =
                getItemOwnerUid(item);


            if(
                itemStore &&
                itemStore ===
                currentStoreId
            ){

                return true;

            }


            if(
                itemOwner &&
                itemOwner ===
                currentStoreId
            ){

                return true;

            }


            return false;

        }
    );

}


function getStoreOwnerUid(){

    if(currentOwnerUid){

        return currentOwnerUid;

    }


    if(
        currentStore &&
        (
            currentStore.ownerUid ||
            currentStore.ownerId
        )
    ){

        return (
            currentStore.ownerUid ||
            currentStore.ownerId
        );

    }


    const matching =
        cart.find(
            item => {

                const itemStore =
                    getItemStoreId(item);

                return (
                    itemStore ===
                    currentStoreId
                );

            }
        );


    if(matching){

        const owner =
            getItemOwnerUid(
                matching
            );

        if(owner){

            return owner;

        }

    }


    return currentStoreId ||
        null;

}

async function loadStore(){

        applyStoreTheme("orange");

        updateStoreNameUI();

        return;

    }


    if(
        unsubscribeStore &&
        listeningStoreId ===
        currentStoreId
    ){

        return;

    }


    if(unsubscribeStore){

        unsubscribeStore();

        unsubscribeStore =
            null;

    }


    listeningStoreId =
        currentStoreId;


    const storeRef =
        doc(
            db,
            "stores",
            currentStoreId
        );


    unsubscribeStore =
        onSnapshot(

            storeRef,

            async snapshot => {

                if(
                    snapshot.exists()
                ){

                    currentStore =
                        {
                            id:
                                snapshot.id,
                            ...snapshot.data()
                        };


                    currentStoreName =
                        currentStore.storeName ||
                        currentStore.name ||
                        "G-Glam";


                    currentOwnerUid =
                        currentStore.ownerUid ||
                        currentStore.ownerId ||
                        currentStore.uid ||
                        currentOwnerUid ||
                        null;


                    if(currentOwnerUid){

                        localStorage.setItem(
                            "ownerUid",
                            currentOwnerUid
                        );

                    }


                    localStorage.setItem(
                        "cartStoreId",
                        currentStoreId
                    );


                    applyStoreTheme(
                        currentStore
                    );


                    await loadStoreOwnerName();


                    updateNavigation();

                    updateCartCount();

                    await loadDelivery();

                    updateOrderButton();


                    await loadSocialLinks();

                }else{

                    currentStore =
                        null;

                    currentStoreName =
                        "G-Glam";


                    applyStoreTheme(
                        "orange"
                    );

                    updateStoreNameUI();

                    updateNavigation();

                }

            },

            error => {

                console.error(

                );

                applyStoreTheme(
                    "orange"
                );

                updateStoreNameUI();

            }

        );

}

/* =====================================================
   SOCIAL URL
===================================================== */

function normalizeSocialUrl(
    type,
    value
){

    if(
        !value ||
        typeof value !== "string"
    ){

        return null;

    }

    let url =
        value.trim();


    if(
        type === "whatsapp" ||
        type === "phone"
    ){

        if(
            /^0(5|6|7)[0-9]{8}$/.test(
                url.replace(
                    /\s+/g,
                    ""
                )
            )
        ){

            url =
                url.replace(
                    /^0/,
                    "213"
                );

        }

        if(
            type === "whatsapp"
        ){

            url =
                url.replace(
                    /[^0-9+]/g,
                    ""
                );

            return (
                "https://wa.me/" +
                url.replace(
                    /^\+/,
                    ""
                )
            );

        }

        return "tel:" + url;

    }


    if(
        /^https?:\/\//i.test(url)
    ){

        return url;

    }


    if(
        type === "instagram"
    ){

        return `https://instagram.com/${url.replace(/^@/,"")}`;

    }


    if(
        type === "tiktok"
    ){

        return `https://www.tiktok.com/@${url.replace(/^@/,"")}`;

    }


    if(
        type === "telegram"
    ){

        return `https://t.me/${url.replace(/^@/,"")}`;

    }


    if(
        type === "facebook"
    ){

        return `https://facebook.com/${url.replace(/^@/,"")}`;

    }


    if(
        type === "youtube"
    ){

        return `https://youtube.com/${url}`;

    }


    if(
        type === "twitter" ||
        type === "x"
    ){

        return `https://x.com/${url.replace(/^@/,"")}`;

    }


    return null;

}

===================================================== */

async function loadDelivery(){

    const wilayaSelect =
        document.getElementById(
            "wilaya"
        );

    const message =
        document.getElementById(
            "deliveryMessage"
        );


    if(!wilayaSelect){

        return;

    }


    wilayaSelect.innerHTML =
        `<option value="">
            اختر الولاية
        </option>`;


    deliveryItems = [];


    const ownerUid =
        getStoreOwnerUid();


    if(!ownerUid){

        return;

    }


    if(message){

        message.className =
            "delivery-message loading";

        message.textContent =
            "جاري تحميل أسعار التوصيل...";

    }


    try{

        const deliveryRef =
            collection(
                db,
                "stores",
                ownerUid,
                "delivery"
            );


        const snapshot =
            await getDocs(
                deliveryRef
            );


        snapshot.forEach(
            itemDoc => {

                const data =
                    itemDoc.data() || {};


                const office =
                    Number(
                        data.office ??
                        data.officePrice ??
                        data.bureau ??
                        data.bureauPrice ??
                        0
                    ) || 0;


                const home =
                    Number(
                        data.home ??
                        data.homePrice ??
                        data.domicile ??
                        data.homeDelivery ??
                        0
                    ) || 0;


                deliveryItems.push({

                    id:
                        itemDoc.id,

                    name:
                        data.name ||
                        data.wilaya ||
                        data.title ||
                        itemDoc.id,

                    office,

                    home

                });

            }
        );


        deliveryItems.sort(
            (a,b) => {

                const aNum =
                    Number(a.id);

                const bNum =
                    Number(b.id);


                if(
                    !Number.isNaN(aNum) &&
                    !Number.isNaN(bNum)
                ){

                    return aNum-bNum;

                }


                return String(a.name)
                    .localeCompare(
                        String(b.name),
                        "ar"
                    );

            }
        );


        deliveryItems.forEach(
            item => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    item.id;

                option.textContent =
                    item.name;

                wilayaSelect.appendChild(
                    option
                );

            }
        );


        if(message){

            message.className =
                "delivery-message";

            message.textContent =
                "";

        }


        updateDelivery();


    }catch(error){

        console.error(
            "Delivery loading error:",
            error
        );


        if(message){

            message.className =
                "delivery-message error";

            message.textContent =
                "تعذر تحميل أسعار التوصيل.";

        }

    }

}

/* =====================================================
   INCREASE
===================================================== */

window.increaseItem =
function(index){

    if(
        !cart[index]
    ){

        return;

    }


    const item =
        cart[index];


    const current =
        Math.max(
            1,
            Number(
                item.quantity
            ) || 1
        );


    const stock =
        Number(
            item.stock
        );


    if(
        Number.isFinite(stock) &&
        stock > 0 &&
        current >= stock
    ){

        alert(
            `الكمية المتوفرة من هذا المنتج هي ${stock} فقط.`
        );

        return;

    }


    item.quantity =
        current + 1;


    saveCart();

    displayCart();

};


/* =====================================================
   DECREASE
===================================================== */

window.decreaseItem =
function(index){

    if(
        !cart[index]
    ){

        return;

    }


    const current =
        Math.max(
            1,
            Number(
                cart[index].quantity
            ) || 1
        );


    if(current <= 1){

        return;

    }


    cart[index].quantity =
        current - 1;


    saveCart();

    displayCart();

};


/* =====================================================
   DELETE
===================================================== */

window.deleteItem =
function(index){

    if(
        !cart[index]
    ){

        return;

    }


    cart.splice(
        index,
        1
    );


    saveCart();

    displayCart();

    updateCartCount();

};


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount(){

    const currentItems =
        getCurrentStoreCart();


    const count =
        currentItems.reduce(
            (
                total,
                item
            ) => {

                return total +
                    Math.max(
                        1,
                        Number(
                            item.quantity
                        ) || 1
                    );

            },
            0
        );


    const headerCount =
        document.getElementById(
            "headerCartCount"
        );


    const floatingCount =
        document.getElementById(
            "floatingCartCount"
        );


    if(headerCount){

        headerCount.textContent =
            count;

    }


    if(floatingCount){

        floatingCount.textContent =
            count;

    }

}

function isValidPhone(
    phone
){

    const normalized =
        String(phone || "")
            .replace(
                /[\s\-\(\)\.]/g,
                ""
            );


    return /^0(5|6|7)[0-9]{8}$/
        .test(normalized);

}

    const deliveryItem =
        getDeliveryItem();


    if(!deliveryItem){

        alert(
            "يرجى اختيار الولاية."
        );

        return;

    }


    const deliveryPrice =
        delivery === "home"
        ?
        Number(
            deliveryItem.home
        ) || 0
        :
        Number(
            deliveryItem.office
        ) || 0;


    const orderProducts =
        items.map(
            item => {

                const quantity =
                    Math.max(
                        1,
                        Number(
                            item.quantity
                        ) || 1
                    );


                const price =
                    Number(
                        item.price
                    ) || 0;


                return {

                    id:
                        item.id ||
                        item.productId ||
                        "",

                    productId:
                        item.productId ||
                        item.id ||
                        "",

                    name:
                        item.name ||
                        "منتج",

                    price,

                    quantity,

                    total:
                        price *
                        quantity,

                    image:
                        item.image ||
                        (
                            Array.isArray(
                                item.images
                            )
                            ?
                            item.images[0] ||
                            ""
                            :
                            ""
                        ),

                    color:
                        item.color ||
                        "بدون لون",

                    size:
                        item.size ||
                        "بدون قياس",

                    ownerUid,

                    storeId:
                        getItemStoreId(item) ||
                        currentStoreId ||
                        ""

                };

            }
        );


    const total =
        productsTotal +
        deliveryPrice;


    const button =
        document.getElementById(
            "orderBtn"
        );


    const oldButtonHTML =
        button?.innerHTML ||
        "";


    if(button){

        button.disabled =
            true;

        button.innerHTML = `

            <i class="fas fa-spinner fa-spin"></i>

            <span>
                جاري إرسال الطلب...
            </span>

        `;

    }


    try{

        await addDoc(
            collection(
                db,
                "orders"
            ),
            {

                ownerUid,

                storeId:
                    currentStoreId ||
                    ownerUid,

                storeName:
                    currentStoreName ||
                    "G-Glam",

                ownerName:
                    currentStoreOwnerName ||
                    "",

                name,

                phone,

                wilaya,

                commune,

                address,

                delivery,

                deliveryPrice,

                deliveryWilaya:
                    deliveryItem.name,

                products:
                    orderProducts,

                productsTotal,

                total,

                status:
                    "قيد المعالجة",

                note:
                    "",

                date:
                    new Date()
                        .toLocaleString(
                            "ar-DZ"
                        ),

                createdAt:
                    serverTimestamp()

            }
        );


        try{

            if(
                typeof fbq ===
                "function"
            ){

                fbq(
                    "track",
                    "Purchase",
                    {
                        value:
                            total,

                        currency:
                            "DZD"
                    }
                );

            }

        }catch(e){}


        try{

            if(
                window.ttq &&
                typeof
                window.ttq.track ===
                "function"
            ){

                window.ttq.track(
                    "CompletePayment",
                    {

                        value:
                            total,

                        currency:
                            "DZD"

                    }
                );

            }

        }catch(e){}


        /*
         * حذف منتجات المتجر الحالي فقط
         * مع الحفاظ على منتجات المتاجر الأخرى
         */

        cart =
            cart.filter(
                item => {

                    const itemStore =
                        getItemStoreId(item);


                    const itemOwner =
                        getItemOwnerUid(item);


                    if(
                        currentStoreId &&
                        itemStore
                    ){

                        return (
                            itemStore !==
                            currentStoreId
                        );

                    }


                    if(
                        currentOwnerUid &&
                        itemOwner
                    ){

                        return (
                            itemOwner !==
                            currentOwnerUid
                        );

                    }


                    return false;

                }
            );


        saveCart();

        displayCart();

        updateCartCount();


        alert(
            "تم إرسال طلبك بنجاح، شكرًا لتسوقك معنا."
        );


        const storeParam =
            currentStoreId
            ?
            `?store=${encodeURIComponent(currentStoreId)}`
            :
            "";


        window.location.href =
            `index.html${storeParam}`;


    }catch(error){

        console.error(
            "Order error:",
            error
        );


        alert(
            "حدث خطأ أثناء إرسال الطلب. يرجى المحاولة مرة أخرى."
        );


        if(button){

            button.disabled =
                false;

            button.innerHTML =
                oldButtonHTML ||
                `
                    <i class="fas fa-paper-plane"></i>
                    <span>إرسال الطلب</span>
                `;

        }

    }

}


/* =====================================================
   EVENTS
===================================================== */

document
    .getElementById(
        "wilaya"
    )
    ?.addEventListener(
        "change",
        () => {

            updateDelivery();

            updateOrderButton();

        }
    );


document
    .getElementById(
        "deliveryType"
    )
    ?.addEventListener(
        "change",
        () => {

            updateDelivery();

            updateOrderButton();

        }
    );


[
    "customerName",
    "customerPhone",
    "commune",
    "address"
]
.forEach(
    id => {

        document
            .getElementById(id)
            ?.addEventListener(
                "input",
                updateOrderButton
            );

    }
);


document
    .getElementById(
        "orderBtn"
    )
    ?.addEventListener(
        "click",
        sendOrder
    );


/* =====================================================
   SIDEBAR EVENTS
===================================================== */

const sidebar =
    document.getElementById(
        "sidebar"
    );

const sidebarOverlay =
    document.getElementById(
        "sidebarOverlay"
    );


function openSidebar(){

    sidebar?.classList.add(
        "active"
    );

    sidebarOverlay?.classList.add(
        "active"
    );

}


function closeSidebar(){

    sidebar?.classList.remove(
        "active"
    );

    sidebarOverlay?.classList.remove(
        "active"
    );

}


document
    .getElementById(
        "menuBtn"
    )
    ?.addEventListener(
        "click",
        openSidebar
    );


document
    .getElementById(
        "sidebarClose"
    )
    ?.addEventListener(
        "click",
        closeSidebar
    );


sidebarOverlay
    ?.addEventListener(
        "click",
        closeSidebar
    );


document
    .getElementById(
        "contactLink"
    )
    ?.addEventListener(
        "click",
        event => {

            event.preventDefault();

            closeSidebar();

            document
                .getElementById(
                    "socialSection"
                )
                ?.scrollIntoView({
                    behavior:"smooth"
                });

        }
    );


document.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Escape"
        ){

            closeSidebar();

        }

    }
);


/* =====================================================
   FLOATING CART
===================================================== */

document
    .getElementById(
        "floatingCart"
    )
    ?.addEventListener(
        "click",
        () => {

            window.scrollTo({

                top:0,

                behavior:"smooth"

            });

        }
    );


/* =====================================================
   START
===================================================== */

async function start(){

    try{

        await loadStore();

        updateNavigation();

        displayCart();

        updateCartCount();

        await loadDelivery();

        updateOrderButton();

    }catch(error){

        console.error(
            "Startup error:",
            error
        );

    }finally{

        const loading =
            document.getElementById(
                "loadingScreen"
            );

        if(loading){

            loading.style.display =
                "none";

        }

    }

}


start();


/* =====================================================
   SERVICE WORKER
===================================================== */

if(
    "serviceWorker"
    in navigator
){

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker
                .register(
                    "service-worker.js"
                )
                .catch(
                    error => {

                        console.warn(
                            "Service worker error:",
                            error
                        );

                    }
                );

        }
    );

}

</script>
