<style>

/* =====================================================
   VARIABLES
===================================================== */

:root{

--orange:#F47B20;
--orange-dark:#DF6810;

--bg:#F7F7F7;
--card:#FFFFFF;

--dark:#222222;
--dark-2:#333333;

--text:#333333;
--muted:#888888;

--border:#E9E9E9;

--danger:#DC3545;
--danger-bg:#FBE7EA;

--shadow:0 4px 18px rgba(0,0,0,.06);

}


/* =====================================================
   RESET
===================================================== */

*{

margin:0;
padding:0;

box-sizing:border-box;

font-family:"Tajawal",Arial,sans-serif;

}


body{

background:var(--bg);

color:var(--text);

min-height:100vh;

padding-bottom:110px;

}


/* =====================================================
   HEADER
===================================================== */

header{

height:78px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 22px;

background:white;

border-bottom:1px solid var(--border);

position:sticky;

top:0;

z-index:1000;

box-shadow:
0 2px 12px rgba(0,0,0,.04);

}


.logo{

font-size:30px;

font-weight:800;

color:#222;

letter-spacing:-1px;

}


.menu-btn,
.cart-icon{

font-size:24px;

cursor:pointer;

position:relative;

width:45px;

height:45px;

display:flex;

align-items:center;

justify-content:center;

border-radius:12px;

transition:.2s;

}


.menu-btn:hover,
.cart-icon:hover{

background:#FFF1E6;

}


.cart-count{

position:absolute;

top:0;

left:0;

background:var(--orange);

color:white;

width:20px;

height:20px;

border-radius:50%;

font-size:11px;

font-weight:700;

display:flex;

align-items:center;

justify-content:center;

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

position:fixed;

top:0;

right:-280px;

width:280px;

height:100vh;

background:white;

box-shadow:-5px 0 20px rgba(0,0,0,.12);

z-index:2000;

transition:.3s;

padding-top:25px;

}


.sidebar.active{

right:0;

}


.sidebar-title{

padding:15px 25px 20px;

font-size:22px;

font-weight:800;

color:#222;

border-bottom:1px solid var(--border);

margin-bottom:10px;

}


.sidebar a{

display:flex;

align-items:center;

gap:12px;

padding:15px 25px;

text-decoration:none;

color:#444;

font-size:15px;

font-weight:600;

border-bottom:1px solid #F2F2F2;

transition:.2s;

}


.sidebar a:hover{

background:#FFF5ED;

color:var(--orange-dark);

}


.overlay{

position:fixed;

inset:0;

background:rgba(0,0,0,.4);

display:none;

z-index:1900;

}


.overlay.active{

display:block;

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

width:100%;

max-width:900px;

margin:auto;

padding:25px 15px;

}


/* =====================================================
   CARD
===================================================== */

.card{

background:var(--card);

border:1px solid var(--border);

border-radius:18px;

padding:22px;

margin-bottom:20px;

box-shadow:var(--shadow);

}


/* =====================================================
   SECTION TITLE
===================================================== */

.section-title{

font-size:21px;

font-weight:800;

color:var(--dark);

margin-bottom:20px;

display:flex;

align-items:center;

gap:8px;

}


/* =====================================================
   CART ITEM
===================================================== */

.item{

position:relative;

border:1px solid var(--border);

border-radius:14px;

padding:16px;

margin-bottom:12px;

background:#FCFCFC;

transition:.2s;

}


.item:hover{

border-color:#FFD8BB;

background:#FFFDFC;

}


.item:last-child{

margin-bottom:0;

}


.item h3{

font-size:17px;

font-weight:800;

color:#222;

margin-bottom:8px;

}


.item p{

font-size:14px;

color:#777;

margin-bottom:7px;

}


.item p strong{

color:#333;

}


/* =====================================================
   QUANTITY
===================================================== */

.qty-box{

display:flex;

align-items:center;

justify-content:center;

gap:16px;

margin:14px 0;

}


.qty-btn{

width:38px;

height:38px;

border:none;

border-radius:10px;

background:var(--orange);

color:white;

font-size:21px;

font-weight:700;

cursor:pointer;

transition:.2s;

}


.qty-btn:hover{

background:var(--orange-dark);

transform:translateY(-1px);

}


.qty-number{

min-width:30px;

text-align:center;

font-size:17px;

font-weight:800;

color:#222;

}


/* =====================================================
   DELETE
===================================================== */

.delete-btn{

width:100%;

background:var(--danger-bg);

color:#B52B39;

border:1px solid #F2D0D5;

padding:10px;

border-radius:10px;

cursor:pointer;

font-family:"Tajawal",Arial,sans-serif;

font-size:13px;

font-weight:700;

transition:.2s;

}


.delete-btn:hover{

background:#F6D1D6;

}


/* =====================================================
   EMPTY
===================================================== */

.empty-cart{

text-align:center;

padding:40px 20px;

color:#888;

font-size:15px;

line-height:2;

}


.empty-icon{

font-size:45px;

margin-bottom:10px;

}


.empty-cart button{

margin-top:15px;

background:var(--orange);

color:white;

border:none;

padding:12px 25px;

border-radius:10px;

font-family:"Tajawal",Arial,sans-serif;

font-weight:700;

cursor:pointer;

}


/* =====================================================
   TOTAL
===================================================== */

.total-box{

background:#222;

color:white;

padding:15px;

border-radius:13px;

text-align:center;

font-size:16px;

font-weight:700;

margin-top:18px;

}


.total-box.final{

background:var(--orange);

font-size:18px;

}


/* =====================================================
   FORM
===================================================== */

.form-group{

margin-bottom:14px;

}


.form-group label{

display:block;

font-size:13px;

font-weight:700;

color:#444;

margin-bottom:7px;

}


input,
select{

width:100%;

padding:13px 14px;

border:1px solid var(--border);

border-radius:10px;

background:#FCFCFC;

color:#333;

font-size:14px;

outline:none;

font-family:"Tajawal",Arial,sans-serif;

transition:.2s;

}


input:focus,
select:focus{

border-color:var(--orange);

background:white;

box-shadow:
0 0 0 3px rgba(244,123,32,.08);

}


select{

cursor:pointer;

}


.delivery-loading{

font-size:13px;

color:#888;

margin-top:-5px;

margin-bottom:12px;

display:none;

}


.delivery-error{

display:none;

background:var(--danger-bg);

border:1px solid #F0C9CF;

color:#B52B39;

padding:12px;

border-radius:10px;

font-size:13px;

margin-bottom:15px;

text-align:center;

}


/* =====================================================
   REQUIRED
===================================================== */

.required{

color:var(--orange);

}


/* =====================================================
   FLOATING ORDER
===================================================== */

.floating-order{

position:fixed;

bottom:15px;

right:50%;

transform:translateX(50%);

width:90%;

max-width:500px;

background:var(--orange);

color:white;

border:none;

padding:15px 20px;

border-radius:30px;

font-size:17px;

font-weight:800;

font-family:"Tajawal",Arial,sans-serif;

cursor:pointer;

box-shadow:
0 8px 22px rgba(244,123,32,.30);

z-index:1500;

transition:.2s;

}


.floating-order:hover{

background:var(--orange-dark);

transform:translateX(50%) translateY(-2px);

}


.floating-order:disabled{

opacity:.6;

cursor:not-allowed;

transform:translateX(50%);

}


/* =====================================================
   LOADING
===================================================== */

.loading{

text-align:center;

padding:30px;

color:#888;

font-size:14px;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:600px){

header{

height:68px;

padding:0 12px;

}


.logo{

font-size:26px;

}


.container{

padding:15px 10px;

}


.card{

padding:16px;

border-radius:15px;

}


.section-title{

font-size:19px;

}


.floating-order{

bottom:12px;

width:92%;

}

}


</style>

<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {

initializeApp

}

from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
collection,
addDoc,
serverTimestamp,
getDocs

}

from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


/* =====================================================
   VARIABLES
===================================================== */

let cart =
JSON.parse(
localStorage.getItem("cart")
) || [];


let productsTotal = 0;

let deliveryCost = 0;

let deliveryItems = [];


/* =====================================================
   ELEMENTS
===================================================== */

const cartContainer =
document.getElementById(
"cart-items"
);


const productsTotalElement =
document.getElementById(
"productsTotal"
);


const wilayaSelect =
document.getElementById(
"wilaya"
);


const deliveryTypeSelect =
document.getElementById(
"deliveryType"
);


const deliveryPriceElement =
document.getElementById(
"deliveryPrice"
);


const finalTotalElement =
document.getElementById(
"finalTotal"
);


const deliveryLoading =
document.getElementById(
"deliveryLoading"
);


const deliveryError =
document.getElementById(
"deliveryError"
);


const orderBtn =
document.getElementById(
"orderBtn"
);


/* =====================================================
   LOAD DELIVERY FROM FIREBASE
===================================================== */

async function loadDelivery(){

deliveryLoading.style.display =
"block";

deliveryError.style.display =
"none";

wilayaSelect.innerHTML = `

<option value="">

⏳ جاري تحميل الولايات...

</option>

`;

try{

const snapshot =
await getDocs(

collection(
db,
"delivery"
)

);


deliveryItems = [];


snapshot.forEach(

docSnap => {

const data =
docSnap.data();


deliveryItems.push({

id:docSnap.id,

office:Number(
data.office || 0
),

home:Number(
data.home || 0
)

});

});


/* =====================================================
   SORT ALPHABETICALLY
===================================================== */

deliveryItems.sort(

(a,b)=>
a.id.localeCompare(
b.id,
"ar"
)

);


/* =====================================================
   DISPLAY WILAYAS
===================================================== */

wilayaSelect.innerHTML = `

<option value="">

اختر الولاية

</option>

`;


if(deliveryItems.length === 0){

wilayaSelect.innerHTML = `

<option value="">

لا توجد ولايات متاحة

</option>

`;

}else{

deliveryItems.forEach(

item => {

const option =
document.createElement(
"option"
);


option.value =
item.id;


option.textContent =
item.id;


wilayaSelect.appendChild(
option
);

});

}


deliveryLoading.style.display =
"none";


}catch(error){

console.error(
"DELIVERY LOAD ERROR:",
error
);


wilayaSelect.innerHTML = `

<option value="">

تعذر تحميل الولايات

</option>

`;


deliveryError.textContent =
"❌ تعذر تحميل أسعار التوصيل. يرجى المحاولة مرة أخرى.";


deliveryError.style.display =
"block";


deliveryLoading.style.display =
"none";

}

}


/* =====================================================
   GET DELIVERY ITEM
===================================================== */

function getDeliveryItem(){

const wilaya =
wilayaSelect.value;


return deliveryItems.find(

item =>
item.id === wilaya

);

}


/* =====================================================
   UPDATE DELIVERY
===================================================== */

function updateDelivery(){

const item =
getDeliveryItem();


const type =
deliveryTypeSelect.value;


if(!item || !type){

deliveryCost = 0;


deliveryPriceElement.innerText =
"سعر التوصيل: --";


updateFinalTotal();

return;

}


if(type === "إلى المكتب"){

deliveryCost =
item.office;

}else{

deliveryCost =
item.home;

}


deliveryPriceElement.innerText =

"سعر التوصيل: " +
deliveryCost +
" DA";


updateFinalTotal();

}


/* =====================================================
   UPDATE FINAL TOTAL
===================================================== */

function updateFinalTotal(){

finalTotalElement.innerText =

"المجموع النهائي: " +
(productsTotal + deliveryCost) +
" DA";

}


/* =====================================================
   DISPLAY CART
===================================================== */

function displayCart(){

cartContainer.innerHTML = "";

productsTotal = 0;


if(cart.length === 0){

cartContainer.innerHTML = `

<div class="empty-cart">

<div class="empty-icon">

🛒

</div>

السلة فارغة

<br>

أضف بعض المنتجات للمتابعة.

<br>

<button
onclick="window.location.href='index.html'">

العودة إلى المتجر

</button>

</div>

`;


productsTotalElement.innerText =
"مجموع المنتجات: 0 DA";


updateFinalTotal();


orderBtn.disabled = true;

return;

}


orderBtn.disabled = false;


cart.forEach(

(item,index)=>{

const qty =
Number(
item.quantity || 1
);


const price =
Number(
item.price || 0
);


const total =
price * qty;


productsTotal += total;


const div =
document.createElement(
"div"
);


div.className =
"item";


div.innerHTML = `

<h3>

${escapeHtml(
item.name || "منتج"
)}

</h3>


<p>

السعر:

<strong>
${price} DA
</strong>

</p>


<div class="qty-box">


<button
class="qty-btn"
data-action="minus"
data-index="${index}">

−

</button>


<span class="qty-number">

${qty}

</span>


<button
class="qty-btn"
data-action="plus"
data-index="${index}">

+

</button>


</div>


<p>

المجموع:

<strong>
${total} DA
</strong>

</p>


<button
class="delete-btn"
data-action="delete"
data-index="${index}">

🗑️ حذف المنتج

</button>

`;


cartContainer.appendChild(
div
);

});


productsTotalElement.innerText =

"مجموع المنتجات: " +
productsTotal +
" DA";


updateFinalTotal();

}


/* =====================================================
   CART ACTIONS
===================================================== */

cartContainer.addEventListener(

"click",

function(event){

const button =
event.target.closest(
"button"
);


if(!button)
return;


const index =
Number(
button.dataset.index
);


const action =
button.dataset.action;


if(
isNaN(index) ||
!cart[index]
)
return;


if(action === "plus"){

cart[index].quantity =
Number(
cart[index].quantity || 1
) + 1;

}


if(action === "minus"){

cart[index].quantity =
Number(
cart[index].quantity || 1
) - 1;


if(cart[index].quantity < 1){

cart[index].quantity = 1;

}

}


if(action === "delete"){

cart.splice(
index,
1
);

}


localStorage.setItem(

"cart",

JSON.stringify(cart)

);


displayCart();

updateCartCount();

});


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount(){

const savedCart =

JSON.parse(
localStorage.getItem("cart")
) || [];


let total = 0;


savedCart.forEach(

item => {

total += Number(
item.quantity || 1
);

});


document.getElementById(
"cartCount"
).textContent =
total;

}


/* =====================================================
   GET STORE OWNER UID
===================================================== */

function getStoreOwnerUid(){

/*
   نبحث أولاً داخل المنتجات الموجودة في السلة.
   المنتجات في مشروع G-Glam يجب أن تحتوي ownerUid.
*/

for(const item of cart){

if(
item.ownerUid
){

return item.ownerUid;

}

}


/*
   fallback من localStorage
*/

const ownerUid =
localStorage.getItem(
"ownerUid"
);


if(ownerUid){

return ownerUid;

}


/*
   بعض صفحات المشروع تستخدم storeId
*/

const storeId =
localStorage.getItem(
"storeId"
);


if(storeId){

return storeId;

}


return null;

}


/* =====================================================
   SEND ORDER
===================================================== */

window.sendOrder =
async function(){

if(cart.length === 0){

alert(
"السلة فارغة"
);

return;

}


const name =
document.getElementById(
"name"
).value.trim();


const phone =
document.getElementById(
"phone"
).value.trim();


const wilaya =
wilayaSelect.value;


const commune =
document.getElementById(
"commune"
).value.trim();


const address =
document.getElementById(
"address"
).value.trim();


const delivery =
deliveryTypeSelect.value;


const ownerUid =
getStoreOwnerUid();


/* =====================================================
   VALIDATION
===================================================== */

if(
!name ||
!phone ||
!wilaya ||
!delivery
){

alert(
"يرجى ملء المعلومات المطلوبة."
);

return;

}


if(!ownerUid){

alert(

"تعذر تحديد المتجر الذي ينتمي إليه الطلب. " +
"يرجى العودة إلى المتجر وإعادة المحاولة."

);

return;

}


/* =====================================================
   DELIVERY VALIDATION
===================================================== */

const deliveryItem =
getDeliveryItem();


if(!deliveryItem){

alert(
"تعذر العثور على سعر التوصيل لهذه الولاية."
);

return;

}


updateDelivery();


/* =====================================================
   PREVENT DOUBLE CLICK
===================================================== */

orderBtn.disabled = true;

orderBtn.textContent =
"⏳ جاري إرسال الطلب...";


try{


/* =====================================================

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}
