<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | دخول الأدمن</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f5f0e8;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.card{
width:100%;
max-width:420px;
background:white;
padding:30px;
border-radius:22px;
box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.logo{
text-align:center;
font-size:36px;
font-weight:bold;
margin-bottom:5px;
}

.admin-title{
text-align:center;
color:#8d7358;
font-weight:bold;
margin-bottom:25px;
}

h2{
margin-bottom:20px;
}

label{
display:block;
font-weight:bold;
margin-bottom:7px;
}

input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:11px;
font-size:16px;
margin-bottom:16px;
outline:none;
}

input:focus{
border-color:#B89B7A;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:11px;
background:#222;
color:white;
font-size:17px;
cursor:pointer;
}

button:disabled{
opacity:.6;
}

.message{
display:none;
padding:12px;
border-radius:10px;
margin-top:15px;
text-align:center;
line-height:1.6;
}

.error{
background:#f8d7da;
color:#721c24;
}

.success{
background:#d4edda;
color:#155724;
}

.note{
margin-top:20px;
padding:12px;
background:#f8f5f0;
border-radius:10px;
font-size:13px;
color:#666;
line-height:1.7;
}

</style>

</head>

<body>


<div class="card">

<div class="logo">
G-Glam
</div>

<div class="admin-title">
🔐 لوحة تحكم الإدارة
</div>


<h2>
تسجيل دخول الأدمن
</h2>


<label>
البريد الإلكتروني
</label>

<input
id="email"
type="email"
placeholder="admin@gmail.com"
autocomplete="username">


<label>
كلمة المرور
</label>

<input
id="password"
type="password"
placeholder="كلمة المرور"
autocomplete="current-password">


<button
id="loginBtn">

دخول لوحة الإدارة

</button>


<div
class="message error"
id="errorMsg">
</div>


<div
class="message success"
id="successMsg">
</div>


<div class="note">

⚠️ هذه الصفحة مخصصة لإدارة G-Glam فقط.
<br>
أصحاب المتاجر يستعملون صفحة تسجيل الدخول الخاصة بهم.

</div>

</div>


<script type="module">


import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


/* =========================
   Firebase
========================= */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);


/* =========================
   بريد الأدمن
=========================

   ⚠️ غيّري هذا البريد
   إلى البريد الذي ستستخدمينه
   لحساب الأدمن في Firebase.
*/

const ADMIN_EMAIL =
"loxenteam@gmail.com";

const loginBtn =
document.getElementById(
"loginBtn"
);

const emailInput =
document.getElementById(
"email"
);

const passwordInput =
document.getElementById(
"password"
);

const errorMsg =
document.getElementById(
"errorMsg"
);

const successMsg =
document.getElementById(
"successMsg"
);


/* رسالة الخطأ */

function showError(text){

errorMsg.textContent =
text;

errorMsg.style.display =
"block";

successMsg.style.display =
"none";

}


/* رسالة النجاح */

function showSuccess(text){

successMsg.textContent =
text;

successMsg.style.display =
"block";

errorMsg.style.display =
"none";

}


/* =========================
   تسجيل الدخول
========================= */

loginBtn.addEventListener(
"click",
async function(){

const email =
emailInput.value.trim();

const password =
passwordInput.value;


if(!email){

showError(
"يرجى إدخال البريد الإلكتروني."
);

return;

}


if(!password){

showError(
"يرجى إدخال كلمة المرور."
);

return;

}


/*
   منع صاحب متجر من الدخول
   حتى لو كانت كلمة المرور صحيحة.
*/

if(
email.toLowerCase() !==
ADMIN_EMAIL.toLowerCase()
){

showError(
"❌ هذا الحساب ليس حساب الأدمن."
);

return;

}


loginBtn.disabled =
true;

loginBtn.textContent =
"جاري تسجيل الدخول...";


try{


await signInWithEmailAndPassword(
auth,
email,
password
);


localStorage.setItem(
"adminLogged",
"true"
);


showSuccess(
"تم تسجيل دخول الأدمن بنجاح ✅"
);


setTimeout(
function(){

window.location.href =
"admin-dashboard.html";

},
700
);


}
catch(error){

console.error(error);

let text =
"فشل تسجيل الدخول.";


if(
error.code ===
"auth/invalid-credential"
){

text =
"البريد الإلكتروني أو كلمة المرور غير صحيحة.";

}

else if(
error.code ===
"auth/user-not-found"
){

text =
"حساب الأدمن غير موجود.";

}

else if(
error.code ===
"auth/wrong-password"
){

text =
"كلمة المرور غير صحيحة.";

}


showError(text);


loginBtn.disabled =
false;

loginBtn.textContent =
"دخول لوحة الإدارة";

}

});


/* =========================
   إذا كان الأدمن
   مسجلاً مسبقًا
========================= */

onAuthStateChanged(
auth,
function(user){

if(
user &&
user.email &&
user.email.toLowerCase() ===
ADMIN_EMAIL.toLowerCase()
){

localStorage.setItem(
"adminLogged",
"true"
);

}

});

</script>

</body>

</html>
