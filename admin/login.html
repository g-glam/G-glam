<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G-Glam | دخول الأدمن</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#f1f1f1;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:420px;
    background:#fff;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
    border:1px solid #e5e5e5;
}

.logo{
    text-align:center;
    font-size:36px;
    font-weight:800;
    margin-bottom:5px;
}

.logo span{
    color:#f47b20;
}

.admin-title{
    text-align:center;
    color:#777;
    font-weight:bold;
    margin-bottom:28px;
}

h2{
    margin-top:0;
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    height:50px;
    padding:0 14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    margin-bottom:17px;
    outline:none;
    background:#fafafa;
}

input:focus{
    border-color:#f47b20;
    background:#fff;
    box-shadow:0 0 0 3px rgba(244,123,32,.10);
}

button{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    background:#f47b20;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#df6810;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:12px;
    border-radius:10px;
    margin-top:15px;
    text-align:center;
    line-height:1.7;
}

.error{
    background:#fdeaea;
    color:#a52222;
}

.success{
    background:#e8f7ed;
    color:#176b35;
}

.note{
    margin-top:20px;
    padding:13px;
    background:#f8f8f8;
    border-radius:10px;
    font-size:13px;
    color:#666;
    line-height:1.8;
    text-align:center;
}

</style>

</head>

<body>

<div class="card">

    <div class="logo">
        G-<span>Glam</span>
    </div>

    <div class="admin-title">
        🔐 لوحة تحكم الإدارة
    </div>

    <h2>
        تسجيل دخول الأدمن
    </h2>

    <label for="email">
        البريد الإلكتروني
    </label>

    <input
        id="email"
        type="email"
        placeholder="البريد الإلكتروني"
        autocomplete="username"
    >

    <label for="password">
        كلمة المرور
    </label>

    <input
        id="password"
        type="password"
        placeholder="كلمة المرور"
        autocomplete="current-password"
    >

    <button id="loginBtn">
        دخول لوحة الإدارة
    </button>

    <div
        class="message error"
        id="errorMsg">
    </div>

    <div
        class="message success"
        id="successMsg">
    </div>

    <div class="note">
        ⚠️ هذه الصفحة مخصصة لإدارة متجر G-Glam فقط.
        <br>
        البريد المسموح به:
        <br>
        <strong>loxenteam@gmail.com</strong>
    </div>

</div>


<script type="module">

/* =====================================
   Firebase
===================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


/* =====================================
   Firebase Config
===================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

    authDomain:
    "g-glam.firebaseapp.com",

    projectId:
    "g-glam",

    storageBucket:
    "g-glam.firebasestorage.app",

    messagingSenderId:
    "997228419719",

    appId:
    "1:997228419719:web:f9d88de7ea2c6f457e3622",

    measurementId:
    "G-WX1K1F83F6"

};


/* =====================================
   تشغيل Firebase
===================================== */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);


/* =====================================
   بريد الأدمن
===================================== */

const ADMIN_EMAIL =
"loxenteam@gmail.com";


/* =====================================
   العناصر
===================================== */

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const errorMsg =
document.getElementById("errorMsg");

const successMsg =
document.getElementById("successMsg");


/* =====================================
   رسالة خطأ
===================================== */

function showError(message){

    successMsg.style.display = "none";

    errorMsg.textContent = message;

    errorMsg.style.display = "block";

}


/* =====================================
   رسالة نجاح
===================================== */

function showSuccess(message){

    errorMsg.style.display = "none";

    successMsg.textContent = message;

    successMsg.style.display = "block";

}


/* =====================================
   تسجيل الدخول
===================================== */

async function login(){

    const email =
    emailInput.value.trim();

    const password =
    passwordInput.value;


    /* التحقق من البريد */

    if(!email){

        showError(
            "يرجى إدخال البريد الإلكتروني."
        );

        return;

    }


    /* التحقق من كلمة المرور */

    if(!password){

        showError(
            "يرجى إدخال كلمة المرور."
        );

        return;

    }


    /* التحقق من أن الحساب هو الأدمن */

    if(
        email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ){

        showError(
            "❌ هذا الحساب ليس حساب الأدمن."
        );

        return;

    }


    loginBtn.disabled = true;

    loginBtn.textContent =
    "⏳ جاري تسجيل الدخول...";


    try{

        /* تسجيل الدخول في Firebase */

        const result =
        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        const user =
        result.user;


        /* التأكد مرة أخرى من البريد */

        if(
            !user.email ||
            user.email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
        ){

            showError(
                "❌ ليس لديك صلاحية الأدمن."
            );

            loginBtn.disabled = false;

            loginBtn.textContent =
            "دخول لوحة الإدارة";

            return;

        }


        /* حفظ حالة الأدمن */

        localStorage.setItem(
            "adminLogged",
            "true"
        );


        localStorage.setItem(
            "adminEmail",
            user.email
        );


        showSuccess(
            "تم تسجيل دخول الأدمن بنجاح ✅"
        );


        loginBtn.textContent =
        "✅ تم الدخول";


        /*
        ====================================
        الانتقال إلى لوحة التحكم
        ====================================
        */

        setTimeout(function(){

            window.location.replace(
                "./dashboard.html"
            );

        },800);


    }

    catch(error){

        console.error(error);

        let message =
        "حدث خطأ أثناء تسجيل الدخول.";


        if(
            error.code ===
            "auth/invalid-credential"
        ){

            message =
            "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.";

        }

        else if(
            error.code ===
            "auth/user-not-found"
        ){

            message =
            "❌ حساب الأدمن غير موجود في Firebase.";

        }

        else if(
            error.code ===
            "auth/wrong-password"
        ){

            message =
            "❌ كلمة المرور غير صحيحة.";

        }

        else if(
            error.code ===
            "auth/invalid-email"
        ){

            message =
            "❌ البريد الإلكتروني غير صحيح.";

        }

        else if(
            error.code ===
            "auth/too-many-requests"
        ){

            message =
            "⚠️ تم إجراء محاولات كثيرة. حاول لاحقًا.";

        }

        else if(
            error.code ===
            "auth/network-request-failed"
        ){

            message =
            "❌ لا يوجد اتصال بالإنترنت.";

        }

        else if(error.message){

            message =
            error.message;

        }


        showError(message);


        loginBtn.disabled = false;

        loginBtn.textContent =
        "دخول لوحة الإدارة";

    }

}


/* =====================================
   زر الدخول
===================================== */

loginBtn.addEventListener(
    "click",
    login
);


/* =====================================
   الضغط على Enter
===================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            if(!loginBtn.disabled){

                login();

            }

        }

    }
);


/* =====================================
   إذا كان الأدمن مسجلًا مسبقًا
===================================== */

onAuthStateChanged(
    auth,
    function(user){

        if(
            user &&
            user.email &&
            user.email.toLowerCase() ===
            ADMIN_EMAIL.toLowerCase()
        ){

            localStorage.setItem(
                "adminLogged",
                "true"
            );

            localStorage.setItem(
                "adminEmail",
                user.email
            );

        }

    }
);

</script>

</body>

</html>
