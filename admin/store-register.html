<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G-Glam | إنشاء المتجر</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
min-height:100vh;
background:#f1f1f1;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
color:#222;
}

/* الصفحة */

.page{
width:100%;
max-width:520px;
}

/* الشعار */

.logo{
text-align:center;
margin-bottom:20px;
}

.logo h1{
margin:0;
font-size:34px;
font-weight:800;
color:#222;
letter-spacing:1px;
}

.logo span{
color:#f47b20;
}

.logo p{
margin:8px 0 0;
color:#777;
font-size:14px;
}

/* البطاقة */

.card{
background:#fff;
border-radius:20px;
padding:30px;
box-shadow:0 5px 25px rgba(0,0,0,.08);
border:1px solid #e7e7e7;
}

.card h2{
margin:0 0 8px;
font-size:24px;
}

.subtitle{
color:#777;
font-size:14px;
margin-bottom:25px;
}

/* الحقول */

.form-group{
margin-bottom:17px;
}

label{
display:block;
font-weight:bold;
font-size:14px;
margin-bottom:8px;
}

input{
width:100%;
height:48px;
border:1px solid #ddd;
border-radius:10px;
padding:0 14px;
font-size:15px;
outline:none;
background:#fafafa;
transition:.2s;
}

input:focus{
border-color:#f47b20;
background:#fff;
box-shadow:0 0 0 3px rgba(244,123,32,.10);
}

/* زر */

.create-btn{
width:100%;
height:50px;
border:none;
border-radius:10px;
background:#f47b20;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
margin-top:8px;
transition:.2s;
}

.create-btn:hover{
background:#df6810;
}

.create-btn:disabled{
opacity:.6;
cursor:not-allowed;
}

/* الرسائل */

.message{
display:none;
padding:12px;
border-radius:9px;
margin-bottom:15px;
font-size:14px;
text-align:center;
line-height:1.6;
}

.success{
background:#e8f7ed;
color:#176b35;
}

.error{
background:#fdeaea;
color:#a52222;
}

/* تسجيل الدخول */

.login{
text-align:center;
margin-top:20px;
font-size:14px;
color:#777;
}

.login a{
color:#f47b20;
font-weight:bold;
text-decoration:none;
}

.login a:hover{
text-decoration:underline;
}

/* معلومات */

.info{
margin-top:20px;
padding:14px;
background:#fafafa;
border-right:4px solid #f47b20;
border-radius:8px;
font-size:13px;
color:#666;
line-height:1.8;
}

/* الهاتف */

@media(max-width:600px){

body{
padding:15px;
align-items:flex-start;
padding-top:35px;
}

.card{
padding:22px 18px;
border-radius:16px;
}

.logo h1{
font-size:30px;
}

.card h2{
font-size:21px;
}

}

</style>

</head>

<body>

<div class="page">

<!-- الشعار -->

<div class="logo">

<h1>
G-<span>Glam</span>
</h1>

<p>
إنشاء متجر جديد
</p>

</div>


<!-- البطاقة -->

<div class="card">

<h2>
🏪 إنشاء متجرك
</h2>

<div class="subtitle">
أدخل معلوماتك لإنشاء متجر جديد على G-Glam
</div>


<!-- الرسائل -->

<div
id="successMessage"
class="message success">
</div>

<div
id="errorMessage"
class="message error">
</div>


<!-- اسم المتجر -->

<div class="form-group">

<label for="storeName">
اسم المتجر
</label>

<input
id="storeName"
type="text"
placeholder="مثال: G-Glam Batna"
autocomplete="organization">

</div>


<!-- اسم صاحب المتجر -->

<div class="form-group">

<label for="ownerName">
اسم صاحب المتجر
</label>

<input
id="ownerName"
type="text"
placeholder="أدخل اسمك الكامل"
autocomplete="name">

</div>


<!-- البريد -->

<div class="form-group">

<label for="email">
البريد الإلكتروني
</label>

<input
id="email"
type="email"
placeholder="example@gmail.com"
autocomplete="email">

</div>


<!-- كلمة المرور -->

<div class="form-group">

<label for="password">
كلمة المرور
</label>

<input
id="password"
type="password"
placeholder="6 أحرف على الأقل"
autocomplete="new-password">

</div>


<!-- تأكيد كلمة المرور -->

<div class="form-group">

<label for="confirmPassword">
تأكيد كلمة المرور
</label>

<input
id="confirmPassword"
type="password"
placeholder="أعد كتابة كلمة المرور"
autocomplete="new-password">

</div>


<button
id="createBtn"
class="create-btn">

إنشاء المتجر

</button>


<div class="info">

💡 بعد إنشاء الحساب سيتم إنشاء متجر خاص بك وربطه بحسابك، ويمكنك بعدها الدخول إلى لوحة التحكم وإدارة المنتجات والطلبات.

</div>


<div class="login">

لديك حساب بالفعل؟

<a href="store-login.html">
تسجيل الدخول
</a>

</div>

</div>

</div>


<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getAuth,
createUserWithEmailAndPassword,
updateProfile

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


import {

getFirestore,
doc,
setDoc,
serverTimestamp

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =========================
   Firebase
========================= */

const firebaseConfig = {

apiKey:"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:"g-glam.firebaseapp.com",

projectId:"g-glam",

storageBucket:"g-glam.firebasestorage.app",

messagingSenderId:"997228419719",

appId:"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:"G-WX1K1F83F6"

};


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);


/* =========================
   العناصر
========================= */

const storeNameInput =
document.getElementById("storeName");

const ownerNameInput =
document.getElementById("ownerName");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const confirmPasswordInput =
document.getElementById("confirmPassword");

const createBtn =
document.getElementById("createBtn");

const successMessage =
document.getElementById("successMessage");

const errorMessage =
document.getElementById("errorMessage");


/* =========================
   الرسائل
========================= */

function showError(message){

successMessage.style.display="none";

errorMessage.textContent=message;

errorMessage.style.display="block";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function showSuccess(message){

errorMessage.style.display="none";

successMessage.textContent=message;

successMessage.style.display="block";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =========================
   إنشاء المتجر
========================= */

createBtn.addEventListener(
"click",
async function(){

const storeName =
storeNameInput.value.trim();

const ownerName =
ownerNameInput.value.trim();

const email =
emailInput.value.trim();

const password =
passwordInput.value;

const confirmPassword =
confirmPasswordInput.value;


/* التحقق */

if(!storeName){

showError(
"يرجى إدخال اسم المتجر."
);

return;

}


if(!ownerName){

showError(
"يرجى إدخال اسم صاحب المتجر."
);

return;

}


if(!email){

showError(
"يرجى إدخال البريد الإلكتروني."
);

return;

}


if(!password){

showError(
"يرجى إدخال كلمة المرور."
);

return;

}


if(password.length < 6){

showError(
"كلمة المرور يجب أن تحتوي على 6 أحرف على الأقل."
);

return;

}


if(password !== confirmPassword){

showError(
"كلمتا المرور غير متطابقتين."
);

return;

}


/* تعطيل الزر */

createBtn.disabled=true;

createBtn.textContent=
"⏳ جاري إنشاء المتجر...";


try{


/* إنشاء حساب Firebase */

const userCredential =
await createUserWithEmailAndPassword(
auth,
email,
password
);


const user =
userCredential.user;


/* اسم المستخدم */

try{

await updateProfile(
user,
{
displayName:ownerName
}
);

}catch(profileError){

console.warn(
"تعذر تحديث اسم الحساب:",
profileError
);

}


/* =========================
   إنشاء وثيقة المتجر
========================= */

await setDoc(

doc(
db,
"stores",
user.uid
),

{

name:storeName,

ownerName:ownerName,

email:email,

ownerId:user.uid,

status:"active",

createdAt:serverTimestamp(),

updatedAt:serverTimestamp()

}

);


/* =========================
   إنشاء إعدادات المتجر
========================= */

await setDoc(

doc(
db,
"storeSettings",
user.uid
),

{

storeId:user.uid,

storeName:storeName,

ownerName:ownerName,

email:email,

phone:"",

address:"",

logo:"",

createdAt:serverTimestamp(),

updatedAt:serverTimestamp()

}

);


/* النجاح */

showSuccess(
"تم إنشاء المتجر بنجاح ✅ سيتم تحويلك إلى لوحة التحكم..."
);


/* الانتقال */

setTimeout(()=>{

window.location.href=
"store-dashboard.html";

},1500);


}

catch(error){

console.error(error);

let message=
"حدث خطأ أثناء إنشاء المتجر.";


/* رسائل Firebase */

if(
error.code ===
"auth/email-already-in-use"
){

message=
"هذا البريد الإلكتروني مستخدم بالفعل. حاول تسجيل الدخول.";

}


else if(
error.code ===
"auth/invalid-email"
){

message=
"البريد الإلكتروني غير صحيح.";

}


else if(
error.code ===
"auth/weak-password"
){

message=
"كلمة المرور ضعيفة. استخدم 6 أحرف على الأقل.";

}


else if(
error.code ===
"auth/network-request-failed"
){

message=
"تعذر الاتصال بالإنترنت. تحقق من الاتصال وحاول مرة أخرى.";

}


else if(
error.code ===
"permission-denied"
){

message=
"ليس لديك صلاحية لإنشاء المتجر. تحقق من إعدادات Firestore.";

}


else if(error.message){

message=
error.message;

}


showError(message);


/* إعادة الزر */

createBtn.disabled=false;

createBtn.textContent=
"إنشاء المتجر";

}

});


/* =========================
   Enter
========================= */

document.addEventListener(
"keydown",
function(event){

if(event.key==="Enter"){

createBtn.click();

}

});

</script>

</body>

</html>
