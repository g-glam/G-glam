<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | دخول صاحب المتجر</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

margin:0;
min-height:100vh;

background:#f5f5f5;

display:flex;
align-items:center;
justify-content:center;

padding:20px;

}

.login-box{

width:100%;
max-width:420px;

background:white;

padding:30px;

border-radius:18px;

box-shadow:0 4px 20px rgba(0,0,0,.10);

}

.logo{

text-align:center;

font-size:30px;

font-weight:bold;

margin-bottom:10px;

}

.subtitle{

text-align:center;

color:#777;

margin-bottom:25px;

}

.form-group{

margin-bottom:15px;

}

label{

display:block;

font-weight:bold;

margin-bottom:7px;

}

input{

width:100%;

padding:13px;

border:1px solid #ddd;

border-radius:9px;

font-size:16px;

outline:none;

}

input:focus{

border-color:#111;

}

button{

width:100%;

padding:14px;

border:none;

border-radius:9px;

background:#111;

color:white;

font-size:17px;

cursor:pointer;

margin-top:8px;

}

button:disabled{

opacity:.6;

cursor:not-allowed;

}

.message{

display:none;

padding:12px;

border-radius:9px;

margin-bottom:15px;

text-align:center;

}

.error{

background:#f8d7da;

color:#721c24;

}

.success{

background:#d4edda;

color:#155724;

}

.loading{

text-align:center;

display:none;

margin-top:15px;

color:#777;

}

.back{

display:block;

text-align:center;

margin-top:20px;

color:#555;

text-decoration:none;

}

.back:hover{

text-decoration:underline;

}

</style>

</head>


<body>


<div class="login-box">


<div class="logo">

G-Glam

</div>


<div class="subtitle">

دخول صاحب المتجر

</div>


<div
id="error"
class="message error">
</div>


<div
id="success"
class="message success">

</div>


<form id="loginForm">


<div class="form-group">

<label>

البريد الإلكتروني

</label>

<input
type="email"
id="email"
placeholder="example@email.com"
required
autocomplete="email">

</div>


<div class="form-group">

<label>

كلمة المرور

</label>

<input
type="password"
id="password"
placeholder="أدخل كلمة المرور"
required
autocomplete="current-password">

</div>


<button
type="submit"
id="loginBtn">

تسجيل الدخول

</button>


</form>


<div
class="loading"
id="loading">

⏳ جاري تسجيل الدخول...

</div>


<a
href="../index.html"
class="back">

← العودة إلى المتجر

</a>


</div>


<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getAuth,

signInWithEmailAndPassword,

onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


import {

getFirestore,

collection,

query,

where,

getDocs

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:"g-glam.firebaseapp.com",

projectId:"g-glam",

storageBucket:"g-glam.firebasestorage.app",

messagingSenderId:"997228419719",

appId:"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:"G-WX1K1F83F6"

};


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);


const form =
document.getElementById("loginForm");


const emailInput =
document.getElementById("email");


const passwordInput =
document.getElementById("password");


const loginBtn =
document.getElementById("loginBtn");


const loading =
document.getElementById("loading");


const errorBox =
document.getElementById("error");


const successBox =
document.getElementById("success");


function showError(message){

errorBox.textContent=message;

errorBox.style.display="block";

successBox.style.display="none";

}


function showSuccess(message){

successBox.textContent=message;

successBox.style.display="block";

errorBox.style.display="none";

}


function hideMessages(){

errorBox.style.display="none";

successBox.style.display="none";

}


/*
--------------------------------
التحقق من وجود المتجر
--------------------------------
*/

async function checkStore(email){

const q =
query(

collection(db,"stores"),

where("email","==",email)

);


const snapshot =
await getDocs(q);


return !snapshot.empty;

}


/*
--------------------------------
إذا كان صاحب المتجر مسجل الدخول
--------------------------------
*/

onAuthStateChanged(auth,async(user)=>{

if(!user){

return;

}

try{

const exists =
await checkStore(user.email);


if(exists){

window.location.href=
"store-dashboard.html";

}

}

catch(error){

console.error(error);

}

});


/*
--------------------------------
تسجيل الدخول
--------------------------------
*/

form.addEventListener(
"submit",
async function(event){

event.preventDefault();

hideMessages();


const email =
emailInput.value.trim();


const password =
passwordInput.value;


if(!email || !password){

showError(
"يرجى إدخال البريد الإلكتروني وكلمة المرور"
);

return;

}


loginBtn.disabled=true;

loading.style.display="block";


try{


const userCredential =

await signInWithEmailAndPassword(

auth,

email,

password

);


const user =
userCredential.user;


/*
--------------------------------
التحقق من أن الحساب مرتبط بمتجر
--------------------------------
*/

const storeExists =
await checkStore(user.email);


if(!storeExists){

showError(
"تم تسجيل الدخول، لكن لا يوجد متجر مرتبط بهذا الحساب."
);

loginBtn.disabled=false;

loading.style.display="none";

return;

}


showSuccess(
"تم تسجيل الدخول بنجاح ✅"
);


/*
--------------------------------
الانتقال إلى لوحة المتجر
--------------------------------
*/

setTimeout(()=>{

window.location.href=
"store-dashboard.html";

},700);


}

catch(error){

console.error(error);


let message =
"حدث خطأ أثناء تسجيل الدخول";


switch(error.code){

case "auth/invalid-credential":

message=
"البريد الإلكتروني أو كلمة المرور غير صحيحة";

break;


case "auth/user-not-found":

message=
"لا يوجد حساب بهذا البريد الإلكتروني";

break;


case "auth/wrong-password":

message=
"كلمة المرور غير صحيحة";

break;


case "auth/invalid-email":

message=
"البريد الإلكتروني غير صحيح";

break;


case "auth/user-disabled":

message=
"تم تعطيل هذا الحساب";

break;


case "auth/too-many-requests":

message=
"تمت محاولات كثيرة. حاول لاحقًا";

break;

}


showError(message);


loginBtn.disabled=false;

loading.style.display="none";

}

});


</script>

</body>

</html>
