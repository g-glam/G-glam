<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G-Glam | تسجيل الدخول</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f0e8;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login-box{
width:100%;
max-width:420px;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.logo{
text-align:center;
font-size:32px;
font-weight:bold;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#777;
margin-bottom:25px;
}

label{
display:block;
font-weight:bold;
margin-bottom:8px;
}

input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
margin-bottom:15px;
direction:ltr;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#222;
color:white;
font-size:17px;
cursor:pointer;
}

button:disabled{
opacity:.6;
}

.message{
display:none;
padding:12px;
border-radius:10px;
margin-bottom:15px;
text-align:center;
}

.error{
background:#f8d7da;
color:#721c24;
}

.success{
background:#d4edda;
color:#155724;
}

.forgot{
display:block;
text-align:center;
margin-top:18px;
color:#777;
cursor:pointer;
}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">
G-Glam
</div>

<div class="subtitle">
تسجيل الدخول إلى متجرك
</div>

<div
class="message error"
id="errorMessage">
</div>

<div
class="message success"
id="successMessage">
تم تسجيل الدخول بنجاح ✅
</div>

<label>
البريد الإلكتروني
</label>

<input
type="email"
id="email"
placeholder="example@gmail.com"
autocomplete="email">


<label>
كلمة المرور
</label>

<input
type="password"
id="password"
placeholder="كلمة المرور"
autocomplete="current-password">


<button
id="loginBtn">

تسجيل الدخول

</button>

<div
class="forgot"
id="forgotPassword">

نسيت كلمة المرور؟
</div>

</div>


<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getAuth,
signInWithEmailAndPassword,
sendPasswordResetEmail

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


const firebaseConfig = {

apiKey:"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:"g-glam.firebaseapp.com",

projectId:"g-glam",

storageBucket:"g-glam.firebasestorage.app",

messagingSenderId:"997228419719",

appId:"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:"G-WX1K1F83F6"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);


const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const errorMessage =
document.getElementById("errorMessage");

const successMessage =
document.getElementById("successMessage");


function showError(message){

errorMessage.textContent = message;

errorMessage.style.display = "block";

successMessage.style.display = "none";

}


loginBtn.addEventListener(
"click",
async()=>{

const email =
emailInput.value.trim();

const password =
passwordInput.value;


errorMessage.style.display="none";


if(!email || !password){

showError(
"يرجى إدخال البريد الإلكتروني وكلمة المرور"
);

return;

}


loginBtn.disabled=true;

loginBtn.textContent=
"⏳ جاري تسجيل الدخول...";


try{

await signInWithEmailAndPassword(
auth,
email,
password
);


successMessage.style.display="block";


setTimeout(()=>{

window.location.href =
"store-dashboard.html";

},1000);


}

catch(error){

console.error(error);

let message =
"حدث خطأ أثناء تسجيل الدخول";


if(error.code ===
"auth/invalid-credential"){

message =
"البريد الإلكتروني أو كلمة المرور غير صحيحة";

}

else if(error.code ===
"auth/user-not-found"){

message =
"هذا البريد الإلكتروني غير مسجل";

}

else if(error.code ===
"auth/wrong-password"){

message =
"كلمة المرور غير صحيحة";

}

else if(error.code ===
"auth/invalid-email"){

message =
"البريد الإلكتروني غير صحيح";

}

showError(message);

}


loginBtn.disabled=false;

loginBtn.textContent=
"تسجيل الدخول";

});


/* نسيت كلمة المرور */

document
.getElementById("forgotPassword")
.addEventListener(
"click",
async()=>{

const email =
emailInput.value.trim();


if(!email){

showError(
"اكتبي البريد الإلكتروني أولًا"
);

return;

}


try{

await sendPasswordResetEmail(
auth,
email
);


alert(
"تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني 📧"
);

}

catch(error){

console.error(error);

showError(
"تعذر إرسال رسالة إعادة تعيين كلمة المرور"
);

}

});


</script>

</body>

</html>
