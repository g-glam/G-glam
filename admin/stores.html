<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G-Glam | إدارة المتاجر</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#222;
}

/* القائمة */

.sidebar{
position:fixed;
right:0;
top:0;
height:100vh;
width:70px;
background:#111;
color:white;
overflow:hidden;
transition:.3s;
z-index:1000;
}

.sidebar:hover{
width:230px;
}

.logo{
height:70px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
border-bottom:1px solid #333;
white-space:nowrap;
}

.menu{
margin-top:20px;
}

.menu a{
display:flex;
align-items:center;
gap:15px;
padding:15px;
color:white;
text-decoration:none;
white-space:nowrap;
}

.menu a:hover{
background:#222;
}

.icon{
min-width:35px;
text-align:center;
font-size:20px;
}

.text{
opacity:0;
transition:.3s;
}

.sidebar:hover .text{
opacity:1;
}

/* المحتوى */

.content{
margin-right:70px;
padding:20px;
}

.header{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-bottom:20px;
}

.header h1{
margin:0;
font-size:28px;
}

.header p{
color:#777;
}

/* زر الإضافة */

.add-box{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-bottom:20px;
}

.add-box h2{
margin-top:0;
}

input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:8px;
margin-bottom:12px;
font-size:16px;
}

button{
border:none;
border-radius:8px;
padding:13px 18px;
cursor:pointer;
font-size:15px;
}

.add-btn{
background:#111;
color:white;
width:100%;
}

.add-btn:hover{
opacity:.9;
}

/* قائمة المتاجر */

.stores-box{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.store{
border-bottom:1px solid #eee;
padding:18px 0;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.store:last-child{
border-bottom:none;
}

.store-info h3{
margin:0 0 7px;
}

.store-info p{
margin:4px 0;
color:#777;
}

.status{
display:inline-block;
padding:5px 10px;
border-radius:20px;
background:#d4edda;
color:#155724;
font-size:13px;
}

.delete-btn{
background:#f1dede;
color:#9b3030;
}

.empty{
text-align:center;
padding:30px;
color:#777;
}

.message{
display:none;
padding:12px;
border-radius:8px;
margin-bottom:15px;
text-align:center;
}

.success{
background:#d4edda;
color:#155724;
}

.error{
background:#f8d7da;
color:#721c24;
}

/* الهاتف */

@media(max-width:600px){

.sidebar{
width:60px;
}

.sidebar:hover{
width:200px;
}

.content{
margin-right:60px;
padding:10px;
}

.store{
align-items:flex-start;
flex-direction:column;
}

.delete-btn{
width:100%;
}

}

</style>

</head>

<body>


<!-- القائمة الجانبية -->

<div class="sidebar">

<div class="logo">
G-Glam
</div>

<div class="menu">

<a href="index.html">

<span class="icon">⌂</span>

<span class="text">
الرئيسية
</span>

</a>


<a href="orders.html">

<span class="icon">▣</span>

<span class="text">
الطلبات
</span>

</a>


<a href="products.html">

<span class="icon">□</span>

<span class="text">
المنتجات
</span>

</a>


<a href="add-product.html">

<span class="icon">+</span>

<span class="text">
إضافة منتج
</span>

</a>


<a href="delivery.html">

<span class="icon">🚚</span>

<span class="text">
أسعار التوصيل
</span>

</a>


<a href="stores.html">

<span class="icon">🏪</span>

<span class="text">
إدارة المتاجر
</span>

</a>


<a href="settings.html">

<span class="icon">⚙</span>

<span class="text">
الإعدادات
</span>

</a>

</div>

</div>


<!-- المحتوى -->

<div class="content">


<div class="header">

<h1>
🏪 إدارة المتاجر
</h1>

<p>
إنشاء وإدارة المتاجر التابعة لمنصتك
</p>

</div>


<!-- إضافة متجر -->

<div class="add-box">

<h2>
➕ إنشاء متجر جديد
</h2>


<div
class="message success"
id="successMessage">

تم إنشاء المتجر بنجاح ✅

</div>


<div
class="message error"
id="errorMessage">

حدث خطأ أثناء إنشاء المتجر

</div>


<input
type="email"
id="ownerEmail"
placeholder="البريد الإلكتروني لصاحب المتجر">


<input
type="text"
id="storeName"
placeholder="اسم المتجر">


<button
class="add-btn"
id="addStoreBtn">

إنشاء المتجر

</button>

</div>


<!-- المتاجر -->

<div class="stores-box">

<h2>
المتاجر
</h2>


<div id="storesContainer">

<div class="empty">

⏳ جاري تحميل المتاجر...

</div>

</div>

</div>


</div>


<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
serverTimestamp

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* Firebase */

const firebaseConfig = {

apiKey:"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:"g-glam.firebaseapp.com",

projectId:"g-glam",

storageBucket:"g-glam.firebasestorage.app",

messagingSenderId:"997228419719",

appId:"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:"G-WX1K1F83F6"

};


const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


/* العناصر */

const ownerEmail =
document.getElementById("ownerEmail");

const storeName =
document.getElementById("storeName");

const addStoreBtn =
document.getElementById("addStoreBtn");

const storesContainer =
document.getElementById("storesContainer");

const successMessage =
document.getElementById("successMessage");

const errorMessage =
document.getElementById("errorMessage");


/* تحميل المتاجر */

async function loadStores(){

try{

const snapshot =
await getDocs(
collection(db,"stores")
);

storesContainer.innerHTML="";


if(snapshot.empty){

storesContainer.innerHTML=`

<div class="empty">

لا توجد متاجر حاليًا

</div>

`;

return;

}


snapshot.forEach(storeDoc=>{

const store =
storeDoc.data();

const id =
storeDoc.id;


const div =
document.createElement("div");

div.className="store";


div.innerHTML=`

<div class="store-info">

<h3>
🏪 ${store.storeName || "بدون اسم"}
</h3>

<p>
📧 ${store.ownerEmail || "-"}
</p>

<p>
<span class="status">
${store.status || "نشط"}
</span>
</p>

</div>


<button
class="delete-btn"
onclick="deleteStore('${id}')">

حذف المتجر

</button>

`;


storesContainer.appendChild(div);

});

}

catch(error){

console.error(error);

storesContainer.innerHTML=`

<div class="empty">

❌ تعذر تحميل المتاجر

</div>

`;

}

}


/* إنشاء متجر */

addStoreBtn.addEventListener(
"click",
async()=>{

const email =
ownerEmail.value.trim();

const name =
storeName.value.trim();


successMessage.style.display="none";
errorMessage.style.display="none";


if(!email || !name){

errorMessage.textContent =
"يرجى إدخال البريد الإلكتروني واسم المتجر";

errorMessage.style.display="block";

return;

}


/* التحقق من Email */

if(!email.includes("@")){

errorMessage.textContent =
"يرجى إدخال بريد إلكتروني صحيح";

errorMessage.style.display="block";

return;

}


addStoreBtn.disabled=true;

addStoreBtn.textContent=
"⏳ جاري إنشاء المتجر...";


try{


await addDoc(

collection(db,"stores"),

{

ownerEmail:email,

storeName:name,

status:"نشط",

createdAt:serverTimestamp()

}

);


successMessage.textContent =
"تم إنشاء المتجر بنجاح ✅";

successMessage.style.display="block";


ownerEmail.value="";

storeName.value="";


loadStores();


}

catch(error){

console.error(error);

errorMessage.textContent =
"حدث خطأ: " + error.message;

errorMessage.style.display="block";

}


addStoreBtn.disabled=false;

addStoreBtn.textContent=
"إنشاء المتجر";

});


/* حذف متجر */

window.deleteStore =
async function(id){

const confirmDelete =
confirm(
"هل أنت متأكد من حذف هذا المتجر؟"
);


if(!confirmDelete)
return;


try{

await deleteDoc(
doc(db,"stores",id)
);


alert("تم حذف المتجر بنجاح ✅");


loadStores();

}

catch(error){

console.error(error);

alert(
"حدث خطأ أثناء حذف المتجر"
);

}

};


/* تشغيل الصفحة */

loadStores();


</script>

</body>

</html>
