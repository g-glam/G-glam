<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G-Glam | إدارة الطلبات</title>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
    color:#222;

}


/* القائمة الجانبية */

.sidebar{

    position:fixed;
    top:0;
    right:0;
    height:100vh;
    width:70px;
    background:#111;
    color:white;
    overflow:hidden;
    transition:.3s;
    z-index:1000;

}


.sidebar:hover{

    width:230px;

}


.logo{

    height:70px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
    border-bottom:1px solid #333;
    white-space:nowrap;

}



.menu{

    margin-top:20px;

}


.menu a{

    display:flex;
    align-items:center;
    gap:15px;
    padding:15px;
    color:white;
    text-decoration:none;
    white-space:nowrap;
    transition:.3s;

}



.menu a:hover{

    background:#222;

}



.icon{

    min-width:35px;
    text-align:center;
    font-size:18px;

}



.text{

    opacity:0;
    transition:.3s;

}


.sidebar:hover .text{

    opacity:1;

}



/* المحتوى */


.content{

    margin-right:70px;
    padding:20px;
    transition:.3s;

}



.header{

    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    margin-bottom:20px;

}



.header h1{

    margin:0;
    font-size:28px;

}



.header p{

    margin:8px 0 0;
    color:#777;

}



/* البحث */


.search-box{

    background:white;
    padding:15px;
    border-radius:12px;
    margin-bottom:20px;

}


.search-box input{

    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;

}




/* الجدول */


.table-box{

    background:white;
    padding:15px;
    border-radius:12px;
    overflow-x:auto;
    box-shadow:0 2px 10px rgba(0,0,0,.08);

}



table{

    width:100%;
    border-collapse:collapse;

}



th{

    background:#111;
    color:white;
    padding:12px;
    white-space:nowrap;

}



td{

    padding:12px;
    border-bottom:1px solid #eee;
    text-align:center;
    white-space:nowrap;

}



tr:hover{

    background:#fafafa;

}



/* الأزرار */


button{

    border:none;
    padding:8px 14px;
    border-radius:7px;
    cursor:pointer;
    font-size:14px;

}


.save-btn{

    background:#111;
    color:white;

}



.delete-btn{

    background:#c62828;
    color:white;

}




select{

    padding:8px;
    border-radius:7px;
    border:1px solid #ccc;

}



textarea{

    width:160px;
    height:60px;
    resize:none;
    border-radius:7px;
    border:1px solid #ccc;
    padding:8px;

}



/* الهاتف */

@media(max-width:700px){


.sidebar{

    width:60px;

}



.content{

    margin-right:60px;
    padding:10px;

}



.sidebar:hover{

    width:200px;

}



}

</style>

</head>


<body>



<!-- القائمة الجانبية -->


<div class="sidebar">


<div class="logo">

G-Glam

</div>



<div class="menu">


<a href="#">

<span class="icon">⌂</span>

<span class="text">
الرئيسية
</span>

</a>



<a href="#">

<span class="icon">▣</span>

<span class="text">
الطلبات
</span>

</a>




<a href="#">

<span class="icon">□</span>

<span class="text">
المنتجات
</span>

</a>




<a href="#">

<span class="icon">⚙</span>

<span class="text">
الإعدادات
</span>

</a>



</div>


</div>





<!-- المحتوى -->


<div class="content">


<div class="header">

<h1>
G-Glam
</h1>

<p>
إدارة المتجر والطلبات
</p>

</div>



<div class="search-box">


<input 
id="searchInput"
type="text"
placeholder="البحث عن طلب...">


</div>



<div class="table-box">


<table>


<thead>

<tr>

<th>رقم الطلب</th>

<th>تاريخ الطلب</th>

<th>الاسم</th>

<th>الهاتف</th>

<th>الولاية</th>

<th>العنوان</th>

<th>نوع التوصيل</th>

<th>المنتجات</th>

<th>المجموع</th>

<th>الملاحظات</th>

<th>الحالة</th>

<th>إجراءات</th>


</tr>


</thead>


<tbody id="ordersTable">


</tbody>


</table>


</div>


</div>



<script type="module">
    
import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
collection,
getDocs,
doc,
updateDoc,
deleteDoc

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";



const firebaseConfig = {


apiKey: "AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain: "g-glam.firebaseapp.com",

projectId: "g-glam",

storageBucket: "g-glam.firebasestorage.app",

messagingSenderId: "997228419719",

appId: "1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId: "G-WX1K1F83F6"


};



const app = initializeApp(firebaseConfig);


const db = getFirestore(app);



const ordersTable =
document.getElementById("ordersTable");


const searchInput =
document.getElementById("searchInput");



let orders=[];




// تحميل الطلبات

async function loadOrders(){


ordersTable.innerHTML="";


const snapshot =
await getDocs(
collection(db,"orders")
);



orders=[];



let number=1000;



snapshot.forEach((item)=>{


orders.push({

firebaseId:item.id,

orderNumber:number++,

...item.data()

});


});



displayOrders(orders);



}





// عرض الطلبات


function displayOrders(data){


ordersTable.innerHTML="";



data.forEach(order=>{



let products="";



if(order.products){


order.products.forEach(product=>{


products += `

<div>

${product.name || ""}

<br>

اللون:
${product.color || "-"}

<br>

الكمية:
${product.quantity || 1}

<hr>

</div>

`;


});


}




ordersTable.innerHTML += `


<tr>


<td>

${order.orderNumber}

</td>



<td>

${order.date || "-"}

</td>



<td>

${order.name || ""}

</td>




<td>


<a href="tel:${order.phone}">

${order.phone || ""}

</a>


</td>



<td>

${order.wilaya || ""}

</td>




<td>

${order.address || ""}

</td>




<td>

${order.delivery || "-"}

</td>




<td>


<button onclick="toggleProducts(this)">

عرض المنتجات

</button>


<div class="products-details"
style="display:none">

${products}

</div>


</td>




<td>

${order.total || 0} DA

</td>



<td>


<textarea id="note-${order.firebaseId}">

${order.note || ""}

</textarea>


<br>


<button class="save-btn"
onclick="saveNote('${order.firebaseId}')">

حفظ

</button>



</td>




<td>


<select onchange="updateStatus('${order.firebaseId}',this.value)">


<option ${order.status==="تم التأكيد"?"selected":""}>

تم التأكيد

</option>


<option ${order.status==="تم الشحن"?"selected":""}>

تم الشحن

</option>


<option ${order.status==="تم التسليم"?"selected":""}>

تم التسليم

</option>


<option ${order.status==="ملغي"?"selected":""}>

ملغي

</option>



</select>



</td>



<td>


<button class="delete-btn"
onclick="deleteOrder('${order.firebaseId}')">

حذف

</button>



</td>



</tr>



`;



});


}




loadOrders();
    
// فتح وإغلاق قائمة المنتجات

window.toggleProducts = function(button){


let box = button.nextElementSibling;


if(box.style.display === "block"){

box.style.display="none";


}else{


box.style.display="block";


}


};





// تحديث حالة الطلب

window.updateStatus = async function(id,status){


try{


await updateDoc(

doc(db,"orders",id),

{

status:status

}

);



console.log("تم تحديث الحالة");


}

catch(error){


console.error(error);

alert("حدث خطأ أثناء تحديث الحالة");


}


};







// حفظ الملاحظات

window.saveNote = async function(id){



let note =
document.getElementById(
"note-"+id
).value;



try{


await updateDoc(

doc(db,"orders",id),

{

note:note

}

);



alert("تم حفظ الملاحظة");


}


catch(error){


console.error(error);

alert("فشل حفظ الملاحظة");


}


};







// حذف الطلب


window.deleteOrder = async function(id){



let confirmDelete =
confirm("هل تريد حذف هذا الطلب؟");



if(!confirmDelete){

return;

}



try{


await deleteDoc(

doc(db,"orders",id)

);



alert("تم حذف الطلب");


loadOrders();


}



catch(error){


console.error(error);

alert("فشل حذف الطلب");


}


};







// البحث


searchInput.addEventListener(
"input",
function(){



let value =
this.value.toLowerCase();



let result =
orders.filter(order=>{


return (


String(order.orderNumber)
.includes(value)


||


(order.name || "")
.toLowerCase()
.includes(value)


||


(order.phone || "")
.includes(value)


||


(order.wilaya || "")
.toLowerCase()
.includes(value)


);



});



displayOrders(result);



});
    
// التأكد من وجود نوع التوصيل

function getDeliveryType(order){


if(order.delivery){

return order.delivery;

}


if(order.deliveryType){

return order.deliveryType;

}


return "غير محدد";


}




// إعادة تحميل الطلبات بعد أي تحديث

window.refreshOrders = function(){

loadOrders();

};
    </script>

</body>

</html>
