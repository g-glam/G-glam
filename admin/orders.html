<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الطلبات - G-Glam</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
}

h1{
text-align:center;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,
td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

th{
background:#000;
color:white;
}

tr:nth-child(even){
background:#f9f9f9;
}

</style>

</head>

<body>

<h1>
📦 الطلبات
</h1>

<table>

<thead>

<tr>

<th>الاسم</th>

<th>الهاتف</th>

<th>الولاية</th>

<th>المجموع</th>

<th>المنتجات</th>

</tr>

</thead>

<tbody id="ordersTable">

</tbody>

</table>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const firebaseConfig = {

apiKey: "AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain: "g-glam.firebaseapp.com",

projectId: "g-glam",

storageBucket: "g-glam.firebasestorage.app",

messagingSenderId: "997228419719",

appId: "1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId: "G-WX1K1F83F6"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


async function loadOrders(){

const table =
document.getElementById("ordersTable");

table.innerHTML = "";

const querySnapshot =
await getDocs(
collection(db,"orders")
);

querySnapshot.forEach((orderDoc)=>{

const order = orderDoc.data();

let productsText = "";

if(order.items){

order.items.forEach(item=>{

productsText +=
item.name +
" × " +
(item.quantity || 1) +
"<br>";

});

}

table.innerHTML += `

<tr>

<td>${order.name || ""}</td>

<td>${order.phone || ""}</td>

<td>${order.wilaya || ""}</td>

<td>${order.total || 0} DA</td>

<td>${productsText}</td>

</tr>

`;

});

}

loadOrders();
  </script>

</body>

</html>
