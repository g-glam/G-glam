<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>طلبات G-Glam</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
margin:0;
}

h1{
text-align:center;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

th,
td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

th{
background:#000;
color:white;
}

tr:nth-child(even){
background:#f9f9f9;
}

select{
padding:8px;
border-radius:6px;
border:1px solid #ccc;
}

</style>

</head>

<body>

<h1>
📦 إدارة الطلبات
</h1>

<table>

<thead>

<tr>

<th>الاسم</th>

<th>الهاتف</th>

<th>الولاية</th>

<th>المجموع</th>

<th>المنتجات</th>

<th>الحالة</th>

<th>تحديث</th>

</tr>

</thead>

<tbody id="ordersTable">

</tbody>

</table>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain: "g-glam.firebaseapp.com",

projectId: "g-glam",

storageBucket: "g-glam.firebasestorage.app",

messagingSenderId: "997228419719",

appId: "1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId: "G-WX1K1F83F6"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const table =
document.getElementById("ordersTable");
  async function loadOrders(){

table.innerHTML = "";

const querySnapshot =
await getDocs(
collection(db,"orders")
);

querySnapshot.forEach((orderDoc)=>{

const order = orderDoc.data();

let productsText = "";

if(order.products){

order.products.forEach(product=>{

productsText +=
(product.name || "") +
"<br>اللون: " +
(product.color || "-") +
"<br>الكمية: " +
(product.quantity || 1) +
"<hr>";

});

}

table.innerHTML += `

<tr>

<td>${order.name || ""}</td>

<td>${order.phone || ""}</td>

<td>${order.wilaya || ""}</td>

<td>${order.total || 0} DA</td>

<td>${productsText}</td>

<td>
${order.status || "جديد"}
</td>

<td>

<select
onchange="window.updateStatus(
'${orderDoc.id}',
this.value
)">

<option value="جديد"
${order.status==="جديد"?"selected":""}>
جديد
</option>

<option value="تم التأكيد"
${order.status==="تم التأكيد"?"selected":""}>
تم التأكيد
</option>

<option value="تم الشحن"
${order.status==="تم الشحن"?"selected":""}>
تم الشحن
</option>

<option value="تم التسليم"
${order.status==="تم التسليم"?"selected":""}>
تم التسليم
</option>

<option value="ملغي"
${order.status==="ملغي"?"selected":""}>
ملغي
</option>

</select>

</td>

</tr>

`;

});

}

loadOrders();
  window.updateStatus = async function(
orderId,
newStatus
){

try{

await updateDoc(
doc(db,"orders",orderId),
{
status:newStatus
}
);

alert(
"تم تحديث حالة الطلب"
);

}catch(error){

console.error(error);

alert(
"فشل تحديث الحالة"
);

}

};

</script>

</body>

</html>
