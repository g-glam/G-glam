<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>طلبات G-Glam</title>


<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}


h1{
    text-align:center;
    margin-bottom:20px;
}


/* شريط البحث */

.search-container{
    text-align:center;
    margin-bottom:20px;
}


#searchInput{

    width:90%;
    max-width:500px;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;

}



/* الجدول */

.table-container{

    overflow-x:auto;

}


table{

    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 0 10px rgba(0,0,0,0.1);

}



th{

    background:#000;
    color:white;
    padding:10px;
    border:1px solid #ddd;
    white-space:nowrap;

}


td{

    padding:10px;
    text-align:center;
    border:1px solid #ddd;
    white-space:nowrap;

}



tr:nth-child(even){

    background:#fafafa;

}



/* الهاتف */

.phone-link{

    color:green;
    text-decoration:none;
    font-weight:bold;

}



/* واتساب */

.whatsapp-link{

    color:#008000;
    text-decoration:none;

}



/* المنتجات */

.product-button{

    cursor:pointer;
    color:blue;
    font-weight:bold;

}


.products-details{

    display:none;
    background:#fff;
    border:1px solid #ddd;
    padding:10px;
    border-radius:6px;

}



/* الملاحظات */


textarea{

    width:160px;
    height:60px;
    padding:5px;
    border-radius:6px;
    border:1px solid #ccc;
    resize:none;

}



button{

    background:#000;
    color:white;
    border:none;
    padding:7px 12px;
    border-radius:6px;
    cursor:pointer;

}



select{

    padding:7px;
    border-radius:6px;
    border:1px solid #ccc;

}



/* الهاتف */

@media(max-width:600px){

body{

padding:10px;

}


table{

font-size:13px;

}


textarea{

width:120px;

}

}


</style>

</head>


<body>


<h1>
📦 إدارة طلبات G-Glam
</h1>



<div class="search-container">


<input 
type="text"
id="searchInput"
placeholder="🔍 ابحث بالاسم أو الهاتف أو الولاية أو رقم الطلب">


</div>



<div class="table-container">


<table>


<thead>


<tr>

<th>🆔 رقم الطلب</th>

<th>📅 تاريخ الطلب</th>

<th>👤 الاسم</th>

<th>📞 الهاتف</th>

<th>📍 الولاية</th>

<th>🏠 العنوان</th>

<th>🚚 نوع التوصيل</th>

<th>🛍️ المنتجات</th>

<th>💰 المجموع</th>

<th>📝 ملاحظات</th>

<th>🔄 الحالة</th>


</tr>


</thead>



<tbody id="ordersTable">


</tbody>



</table>


</div>



<script type="module">
  import { initializeApp } 
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
collection,
getDocs,
doc,
updateDoc

}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";



const firebaseConfig = {


apiKey: "AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain: "g-glam.firebaseapp.com",

projectId: "g-glam",

storageBucket: "g-glam.firebasestorage.app",

messagingSenderId: "997228419719",

appId: "1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId: "G-WX1K1F83F6"


};



const app = initializeApp(firebaseConfig);


const db = getFirestore(app);



const ordersTable =
document.getElementById("ordersTable");

const searchInput =
document.getElementById("searchInput");



let allOrders=[];



// جلب الطلبات

async function loadOrders(){


const snapshot =
await getDocs(
collection(db,"orders")
);



allOrders=[];



snapshot.forEach((item)=>{


allOrders.push({

id:item.id,

...item.data()

});


});



displayOrders(allOrders);



}



// عرض الطلبات

function displayOrders(orders){


ordersTable.innerHTML="";



orders.forEach((order)=>{


let products="";



if(order.products){


order.products.forEach(product=>{


products += `

<div>

<b>${product.name || ""}</b>

<br>

اللون:
${product.color || "-"}

<br>

الكمية:
${product.quantity || 1}

<hr>

</div>

`;


});


}



ordersTable.innerHTML += `



<tr>


<td>

${order.id}

</td>



<td>

${order.date || "-"}

</td>



<td>

${order.name || ""}

</td>



<td>


<a class="phone-link"
href="tel:${order.phone}">

📞 ${order.phone || ""}

</a>


<br>


<a class="whatsapp-link"
target="_blank"
href="https://wa.me/213${order.phone?.substring(1)}">

💬 واتساب

</a>


</td>




<td>

${order.wilaya || ""}

</td>



<td>

${order.address || ""}

</td>



<td>

${order.delivery || "-"}

</td>




<td>


<span 
class="product-button"
onclick="showProducts(this)">

🛍️ عرض

</span>



<div class="products-details">

${products}

</div>



</td>




<td>

${order.total || 0} DA

</td>




<td>


<textarea id="note-${order.id}">

${order.note || ""}

</textarea>


<br>


<button onclick="saveNote('${order.id}')">

حفظ

</button>


</td>





<td>


<select onchange="updateStatus('${order.id}',this.value)">



<option value="تم التأكيد"
${order.status==="تم التأكيد"?"selected":""}>

تم التأكيد

</option>



<option value="تم الشحن"
${order.status==="تم الشحن"?"selected":""}>

تم الشحن

</option>



<option value="تم التسليم"
${order.status==="تم التسليم"?"selected":""}>

تم التسليم

</option>



<option value="ملغي"
${order.status==="ملغي"?"selected":""}>

ملغي

</option>



</select>


</td>



</tr>



`;



});


}




loadOrders();



// البحث

searchInput.addEventListener("input",()=>{


let text =
searchInput.value.toLowerCase();



let result =
allOrders.filter(order=>{


return (

(order.id || "").toLowerCase().includes(text)

||

(order.name || "").toLowerCase().includes(text)

||

(order.phone || "").includes(text)

||

(order.wilaya || "").toLowerCase().includes(text)


);


});



displayOrders(result);



});
  // إظهار وإخفاء المنتجات

window.showProducts = function(element){

let box = element.nextElementSibling;


if(box.style.display === "block"){

box.style.display="none";

}else{

box.style.display="block";

}


};




// تحديث حالة الطلب

window.updateStatus = async function(orderId,newStatus){


try{


await updateDoc(

doc(db,"orders",orderId),

{

status:newStatus

}

);



console.log("تم تحديث الحالة");


}


catch(error){


console.error(error);

alert("حدث خطأ أثناء تحديث الحالة");


}


};






// حفظ الملاحظات

window.saveNote = async function(orderId){



let note =
document.getElementById(
"note-"+orderId
).value;



try{


await updateDoc(

doc(db,"orders",orderId),

{

note:note

}

);



alert("✅ تم حفظ الملاحظة");


}


catch(error){


console.error(error);

alert("❌ فشل حفظ الملاحظة");


}


};





</script>


</body>


</html>
