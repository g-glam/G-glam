<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>G-Glam | طلباتي</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#222;
}

/* SIDEBAR */

.sidebar{
position:fixed;
right:0;
top:0;
height:100vh;
width:70px;
background:#111;
color:white;
overflow:hidden;
transition:.3s;
z-index:1000;
}

.sidebar:hover{
width:230px;
}

.logo{
height:70px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
border-bottom:1px solid #333;
}

.menu{
margin-top:20px;
}

.menu a{
display:flex;
align-items:center;
gap:15px;
padding:15px;
color:white;
text-decoration:none;
white-space:nowrap;
}

.menu a:hover{
background:#222;
}

.icon{
min-width:35px;
text-align:center;
font-size:20px;
}

.text{
opacity:0;
transition:.3s;
}

.sidebar:hover .text{
opacity:1;
}

/* CONTENT */

.content{
margin-right:70px;
padding:20px;
}

.header{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-bottom:20px;
}

.header h1{
margin:0;
}

.header p{
color:#777;
}

.search-box{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:20px;
}

.search-box input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
}

.table-box{
background:white;
padding:15px;
border-radius:12px;
overflow-x:auto;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

table{
width:100%;
border-collapse:collapse;
min-width:1100px;
}

th{
background:#111;
color:white;
padding:12px;
}

td{
padding:12px;
text-align:center;
border-bottom:1px solid #eee;
}

tr:hover{
background:#fafafa;
}

button{
border:none;
padding:8px 14px;
border-radius:7px;
cursor:pointer;
}

.save-btn{
background:#111;
color:white;
}

.delete-btn{
background:#c62828;
color:white;
}

.products-btn{
background:#333;
color:white;
}

select{
padding:8px;
border-radius:7px;
border:1px solid #ccc;
}

textarea{
width:160px;
height:60px;
padding:8px;
border-radius:7px;
border:1px solid #ccc;
resize:none;
}

.products-box{
background:#f8f8f8;
padding:10px;
margin-top:10px;
border-radius:8px;
}

.loading{
padding:30px;
text-align:center;
}

.error{
display:none;
background:#f8d7da;
color:#721c24;
padding:15px;
border-radius:8px;
margin-bottom:15px;
}

@media(max-width:700px){

.sidebar{
width:60px;
}

.sidebar:hover{
width:200px;
}

.content{
margin-right:60px;
padding:10px;
}

}

</style>

</head>

<body>


<div class="sidebar">

<div class="logo">
G-Glam
</div>

<div class="menu">

<a href="store-dashboard.html">
<span class="icon">⌂</span>
<span class="text">لوحة التحكم</span>
</a>

<a href="products.html">
<span class="icon">□</span>
<span class="text">منتجاتي</span>
</a>

<a href="orders.html">
<span class="icon">▣</span>
<span class="text">طلباتي</span>
</a>

<a href="delivery.html">
<span class="icon">🚚</span>
<span class="text">أسعار التوصيل</span>
</a>

<a href="settings.html">
<span class="icon">⚙</span>
<span class="text">الإعدادات</span>
</a>

</div>

</div>


<div class="content">


<div class="header">

<h1>
🛒 طلبات المتجر
</h1>

<p id="storeName">
جاري تحميل المتجر...
</p>

</div>


<div
class="error"
id="error">
</div>


<div class="search-box">

<input
id="searchInput"
placeholder="البحث بالاسم أو الهاتف أو الولاية أو رقم الطلب">

</div>


<div class="table-box">

<div
id="loading"
class="loading">

⏳ جاري تحميل الطلبات...

</div>


<table id="ordersTableBox" style="display:none;">

<thead>

<tr>

<th>رقم الطلب</th>
<th>التاريخ</th>
<th>الاسم</th>
<th>الهاتف</th>
<th>الولاية</th>
<th>العنوان</th>
<th>التوصيل</th>
<th>المنتجات</th>
<th>المجموع</th>
<th>الملاحظات</th>
<th>الحالة</th>
<th>حذف</th>

</tr>

</thead>

<tbody id="ordersTable">
</tbody>

</table>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
getFirestore,
collection,
query,
where,
getDocs,
doc,
updateDoc,
deleteDoc
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:"g-glam.firebaseapp.com",

projectId:"g-glam",

storageBucket:"g-glam.firebasestorage.app",

messagingSenderId:"997228419719",

appId:"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:"G-WX1K1F83F6"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


let storeId=null;

let orders=[];


function showError(message){

const box=
document.getElementById("error");

box.textContent=message;

box.style.display="block";

}


function formatDate(timestamp){

if(!timestamp)return "-";

if(timestamp.toDate){

return timestamp
.toDate()
.toLocaleDateString("ar-DZ");

}

return String(timestamp);

}


async function getStore(email){

const snapshot=
await getDocs(
query(
collection(db,"stores"),
where("email","==",email)
)
);

if(snapshot.empty){

throw new Error(
"لم يتم العثور على المتجر."
);

}

return {
id:snapshot.docs[0].id,
data:snapshot.docs[0].data()
};

}


async function loadOrders(){

const snapshot=
await getDocs(
query(
collection(db,"orders"),
where("storeId","==",storeId)
)
);


orders=[];


let number=1001;


snapshot.forEach(item=>{

orders.push({

firebaseId:item.id,

orderNumber:number++,

...item.data()

});

});


displayOrders(orders);

document.getElementById("loading")
.style.display="none";

document.getElementById("ordersTableBox")
.style.display="table";

}


function displayOrders(data){

const table=
document.getElementById("ordersTable");

table.innerHTML="";


if(data.length===0){

table.innerHTML=`

<tr>

<td colspan="12">

لا توجد طلبات حاليًا

</td>

</tr>

`;

return;

}


data.forEach(order=>{


let products="";


if(Array.isArray(order.products)){

order.products.forEach(product=>{

products+=`

<div>

<strong>
${escapeText(product.name || "")}
</strong>

<br>

اللون:
${escapeText(product.color || "-")}

<br>

الكمية:
${product.quantity || 1}

<hr>

</div>

`;

});

}


const delivery=
order.deliveryType ||
order.delivery ||
"غير محدد";


table.innerHTML+=`

<tr>

<td>
#${order.orderNumber}
</td>

<td>
${formatDate(order.createdAt)}
</td>

<td>
${escapeText(order.name || "")}
</td>

<td>
<a href="tel:${escapeAttribute(order.phone || "")}">
${escapeText(order.phone || "")}
</a>
</td>

<td>
${escapeText(order.wilaya || "")}
</td>

<td>
${escapeText(order.address || "")}
</td>

<td>
${escapeText(delivery)}
</td>

<td>

<button
class="products-btn"
onclick="toggleProducts(this)">

عرض

</button>

<div
class="products-box"
style="display:none">

${products}

</div>

</td>

<td>
${Number(order.total || 0)} DA
</td>

<td>

<textarea
id="note-${order.firebaseId}">${escapeText(order.note || "")}</textarea>

<br>

<button
class="save-btn"
onclick="saveNote('${escapeAttribute(order.firebaseId)}')">

حفظ

</button>

</td>

<td>

<select
onchange="updateStatus('${escapeAttribute(order.firebaseId)}',this.value)">

<option value="جديد"
${(!order.status || order.status==="جديد")?"selected":""}>
جديد
</option>

<option value="تم التأكيد"
${order.status==="تم التأكيد"?"selected":""}>
تم التأكيد
</option>

<option value="تم الشحن"
${order.status==="تم الشحن"?"selected":""}>
تم الشحن
</option>

<option value="تم التسليم"
${order.status==="تم التسليم"?"selected":""}>
تم التسليم
</option>

<option value="ملغي"
${order.status==="ملغي"?"selected":""}>
ملغي
</option>

</select>

</td>

<td>

<button
class="delete-btn"
onclick="deleteOrder('${escapeAttribute(order.firebaseId)}')">

حذف

</button>

</td>

</tr>

`;

});

}


window.toggleProducts=function(button){

const box=
button.nextElementSibling;

box.style.display=
box.style.display==="block"
?"none"
:"block";

};


window.updateStatus=async function(id,status){

try{

await updateDoc(
doc(db,"orders",id),
{
status:status
}
);

}
catch(error){

console.error(error);

alert("فشل تحديث حالة الطلب.");

}

};


window.saveNote=async function(id){

const textarea=
document.getElementById("note-"+id);

if(!textarea)return;

try{

await updateDoc(
doc(db,"orders",id),
{
note:textarea.value
}
);

alert("تم حفظ الملاحظة ✅");

}
catch(error){

console.error(error);

alert("فشل حفظ الملاحظة.");

}

};


window.deleteOrder=async function(id){

if(!confirm("هل تريد حذف هذا الطلب؟"))return;


try{

await deleteDoc(
doc(db,"orders",id)
);

await loadOrders();

}
catch(error){

console.error(error);

alert("فشل حذف الطلب.");

}

};


document
.getElementById("searchInput")
.addEventListener("input",function(){

const value=
this.value.toLowerCase().trim();


const result=
orders.filter(order=>{

return (

String(order.orderNumber)
.includes(value)

||

String(order.name || "")
.toLowerCase()
.includes(value)

||

String(order.phone || "")
.includes(value)

||

String(order.wilaya || "")
.toLowerCase()
.includes(value)

);

});


displayOrders(result);

});


function escapeText(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttribute(value){

return String(value)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}


onAuthStateChanged(auth,async(user)=>{

if(!user){

window.location.href="store-login.html";

return;

}


try{

const store=
await getStore(user.email);

storeId=store.id;

document.getElementById("storeName")
.textContent=
store.data.name || "متجري";

await loadOrders();

}

catch(error){

console.error(error);

document.getElementById("loading")
.style.display="none";

showError(error.message);

}

});

</script>

</body>

</html>
