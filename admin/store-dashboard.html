<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة المتجر - G-Glam</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#222;
}

/* =========================
   HEADER
========================= */

.header{
background:#111;
color:white;
padding:16px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:24px;
font-weight:bold;
}

.logout{
background:#d9534f;
border:none;
color:white;
padding:10px 16px;
border-radius:8px;
cursor:pointer;
font-size:14px;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
position:fixed;
right:0;
top:0;
height:100vh;
width:70px;
background:#111;
color:white;
overflow:hidden;
transition:.3s;
z-index:1000;
}

.sidebar:hover{
width:230px;
}

.sidebar-logo{
height:70px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
border-bottom:1px solid #333;
white-space:nowrap;
}

.menu{
margin-top:15px;
}

.menu a{
display:flex;
align-items:center;
gap:15px;
padding:15px;
color:white;
text-decoration:none;
white-space:nowrap;
}

.menu a:hover{
background:#222;
}

.icon{
min-width:35px;
text-align:center;
font-size:20px;
}

.text{
opacity:0;
transition:.3s;
}

.sidebar:hover .text{
opacity:1;
}

/* =========================
   CONTENT
========================= */

.content{
margin-right:70px;
padding:20px;
}

.welcome{
background:white;
padding:25px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.welcome h1{
margin-top:0;
}

.email{
color:#777;
}

/* =========================
   CARDS
========================= */

.cards{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card h3{
margin-top:0;
color:#666;
}

.number{
font-size:32px;
font-weight:bold;
}

.card-link{
display:block;
text-decoration:none;
color:inherit;
}

/* =========================
   LOADING / ERROR
========================= */

.loading{
text-align:center;
padding:30px;
background:white;
border-radius:12px;
}

.error{
background:#f8d7da;
color:#721c24;
padding:15px;
border-radius:10px;
margin-bottom:15px;
display:none;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

.sidebar{
width:60px;
}

.sidebar:hover{
width:200px;
}

.content{
margin-right:60px;
padding:10px;
}

.cards{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>


<!-- =========================
     القائمة
========================= -->

<div class="sidebar">

<div class="sidebar-logo">
G-Glam
</div>

<div class="menu">

<a href="store-dashboard.html">

<span class="icon">⌂</span>

<span class="text">
لوحة التحكم
</span>

</a>


<a href="products.html">

<span class="icon">□</span>

<span class="text">
منتجاتي
</span>

</a>


<a href="orders.html">

<span class="icon">▣</span>

<span class="text">
طلباتي
</span>

</a>


<a href="delivery.html">

<span class="icon">🚚</span>

<span class="text">
أسعار التوصيل
</span>

</a>


<a href="settings.html">

<span class="icon">⚙</span>

<span class="text">
إعدادات المتجر
</span>

</a>

</div>

</div>


<!-- =========================
     المحتوى
========================= -->

<div class="content">


<div
class="error"
id="errorMessage">
</div>


<div
class="loading"
id="loading">

⏳ جاري تحميل المتجر...

</div>


<div
id="dashboard"
style="display:none;">


<div class="welcome">

<h1 id="storeName">
متجري
</h1>

<p>
مرحبًا بك في لوحة التحكم الخاصة بمتجرك 👋
</p>

<p
class="email"
id="ownerEmail">
</p>

</div>


<div class="cards">


<a
href="products.html"
class="card-link">

<div class="card">

<h3>
📦 عدد المنتجات
</h3>

<div
class="number"
id="productsCount">

0

</div>

</div>

</a>


<a
href="orders.html"
class="card-link">

<div class="card">

<h3>
🛒 عدد الطلبات
</h3>

<div
class="number"
id="ordersCount">

0

</div>

</div>

</a>


<a
href="orders.html"
class="card-link">

<div class="card">

<h3>
🆕 الطلبات الجديدة
</h3>

<div
class="number"
id="newOrders">

0

</div>

</div>

</a>


</div>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
getFirestore,
collection,
query,
where,
getDocs
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:"g-glam.firebaseapp.com",

projectId:"g-glam",

storageBucket:"g-glam.firebasestorage.app",

messagingSenderId:"997228419719",

appId:"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:"G-WX1K1F83F6"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


const loading =
document.getElementById("loading");

const dashboard =
document.getElementById("dashboard");

const errorMessage =
document.getElementById("errorMessage");


function showError(message){

loading.style.display="none";

errorMessage.textContent=message;

errorMessage.style.display="block";

}


onAuthStateChanged(auth,async(user)=>{

if(!user){

window.location.href="store-login.html";

return;

}


try{

const email=user.email;

document.getElementById("ownerEmail").textContent=email;


/* البحث عن المتجر */

const storesQuery=query(
collection(db,"stores"),
where("email","==",email)
);

const storesSnapshot=
await getDocs(storesQuery);


if(storesSnapshot.empty){

showError(
"لم يتم العثور على متجر مرتبط بهذا الحساب."
);

return;

}


const storeDoc=
storesSnapshot.docs[0];

const store=
storeDoc.data();

const storeId=
storeDoc.id;


/* اسم المتجر */

document.getElementById("storeName").textContent=
store.name || "متجري";


/* المنتجات */

const productsQuery=query(
collection(db,"products"),
where("storeId","==",storeId)
);

const productsSnapshot=
await getDocs(productsQuery);

document.getElementById("productsCount").textContent=
productsSnapshot.size;


/* الطلبات */

const ordersQuery=query(
collection(db,"orders"),
where("storeId","==",storeId)
);

const ordersSnapshot=
await getDocs(ordersQuery);

document.getElementById("ordersCount").textContent=
ordersSnapshot.size;


let newCount=0;

ordersSnapshot.forEach(item=>{

const order=item.data();

if(
!order.status ||
order.status==="جديد" ||
order.status==="تم التأكيد"
){

newCount++;

}

});


document.getElementById("newOrders").textContent=
newCount;


loading.style.display="none";

dashboard.style.display="block";

}

catch(error){

console.error(error);

showError(
"حدث خطأ أثناء تحميل بيانات المتجر: "+
error.message
);

}

});


</script>

</body>
</html>
