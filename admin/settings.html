<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>G-Glam | إعدادات المتجر</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f5f5f5;
color:#222;
}

/* SIDEBAR */

.sidebar{
position:fixed;
right:0;
top:0;
height:100vh;
width:70px;
background:#111;
color:white;
overflow:hidden;
transition:.3s;
z-index:1000;
}

.sidebar:hover{
width:230px;
}

.logo{
height:70px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
border-bottom:1px solid #333;
}

.menu{
margin-top:20px;
}

.menu a{
display:flex;
align-items:center;
gap:15px;
padding:15px;
color:white;
text-decoration:none;
white-space:nowrap;
}

.menu a:hover{
background:#222;
}

.icon{
min-width:35px;
text-align:center;
font-size:20px;
}

.text{
opacity:0;
transition:.3s;
}

.sidebar:hover .text{
opacity:1;
}

/* CONTENT */

.content{
margin-right:70px;
padding:20px;
}

.header{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-bottom:20px;
}

.header h1{
margin:0;
}

.header p{
color:#777;
}

.settings-box{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-bottom:20px;
}

.settings-box h2{
margin-top:0;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

input,
textarea{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
margin-bottom:15px;
font-size:15px;
}

textarea{
height:100px;
resize:none;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#111;
color:white;
font-size:17px;
cursor:pointer;
}

button:disabled{
opacity:.5;
}

.message{
display:none;
padding:12px;
border-radius:8px;
margin-bottom:15px;
text-align:center;
}

.success{
background:#d4edda;
color:#155724;
}

.error{
background:#f8d7da;
color:#721c24;
}

.email{
background:#f5f5f5;
padding:12px;
border-radius:8px;
margin-bottom:15px;
color:#666;
}

@media(max-width:700px){

.sidebar{
width:60px;
}

.sidebar:hover{
width:200px;
}

.content{
margin-right:60px;
padding:10px;
}

}

</style>

</head>

<body>


<div class="sidebar">

<div class="logo">
G-Glam
</div>

<div class="menu">

<a href="store-dashboard.html">
<span class="icon">⌂</span>
<span class="text">لوحة التحكم</span>
</a>

<a href="products.html">
<span class="icon">□</span>
<span class="text">منتجاتي</span>
</a>

<a href="orders.html">
<span class="icon">▣</span>
<span class="text">طلباتي</span>
</a>

<a href="delivery.html">
<span class="icon">🚚</span>
<span class="text">أسعار التوصيل</span>
</a>

<a href="settings.html">
<span class="icon">⚙</span>
<span class="text">الإعدادات</span>
</a>

</div>

</div>


<div class="content">


<div class="header">

<h1>
⚙️ إعدادات المتجر
</h1>

<p>
إدارة معلومات متجرك
</p>

</div>


<div
id="success"
class="message success">
</div>


<div
id="error"
class="message error">
</div>


<div class="settings-box">

<h2>
معلومات المتجر
</h2>


<label>
البريد الإلكتروني لصاحب المتجر
</label>

<div
id="email"
class="email">

⏳ جاري التحميل...

</div>


<label>
اسم المتجر
</label>

<input
type="text"
id="storeName"
placeholder="اسم المتجر">


<label>
رقم الهاتف
</label>

<input
type="tel"
id="phone"
placeholder="مثال: 0550000000">


<label>
العنوان
</label>

<textarea
id="address"
placeholder="عنوان المتجر">
</textarea>


<button
id="saveBtn">

💾 حفظ الإعدادات

</button>

</div>


<div class="settings-box">

<h2>
🚚 التوصيل
</h2>

<p>
يمكنك إدارة أسعار التوصيل حسب الولاية من صفحة أسعار التوصيل.
</p>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
getFirestore,
collection,
query,
where,
getDocs,
doc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:"g-glam.firebaseapp.com",

projectId:"g-glam",

storageBucket:"g-glam.firebasestorage.app",

messagingSenderId:"997228419719",

appId:"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:"G-WX1K1F83F6"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


let storeId=null;


function showMessage(text,success){

const s=
document.getElementById("success");

const e=
document.getElementById("error");

s.style.display="none";

e.style.display="none";

if(success){

s.textContent=text;

s.style.display="block";

}else{

e.textContent=text;

e.style.display="block";

}

setTimeout(()=>{

s.style.display="none";

e.style.display="none";

},3000);

}


async function loadSettings(user){

try{

const snapshot=
await getDocs(
query(
collection(db,"stores"),
where("email","==",user.email)
)
);


if(snapshot.empty){

showMessage(
"لم يتم العثور على متجر مرتبط بهذا الحساب.",
false
);

return;

}


const storeDoc=
snapshot.docs[0];

storeId=
storeDoc.id;

const store=
storeDoc.data();


document.getElementById("email")
.textContent=
user.email;


document.getElementById("storeName")
.value=
store.name || "";


document.getElementById("phone")
.value=
store.phone || "";


document.getElementById("address")
.value=
store.address || "";

}
catch(error){

console.error(error);

showMessage(
"حدث خطأ أثناء تحميل الإعدادات.",
false
);

}

}


document
.getElementById("saveBtn")
.addEventListener(
"click",
async()=>{

if(!storeId){

showMessage(
"المتجر غير جاهز.",
false
);

return;

}


const name=
document.getElementById("storeName")
.value.trim();

const phone=
document.getElementById("phone")
.value.trim();

const address=
document.getElementById("address")
.value.trim();


if(!name){

showMessage(
"يرجى إدخال اسم المتجر.",
false
);

return;

}


const button=
document.getElementById("saveBtn");

button.disabled=true;

button.textContent=
"⏳ جاري الحفظ...";


try{

await updateDoc(
doc(db,"stores",storeId),
{
name:name,
phone:phone,
address:address
}
);


showMessage(
"تم حفظ إعدادات المتجر بنجاح ✅",
true
);

}
catch(error){

console.error(error);

showMessage(
"فشل حفظ الإعدادات: "+
error.message,
false
);

}
finally{

button.disabled=false;

button.textContent=
"💾 حفظ الإعدادات";

}

});


onAuthStateChanged(auth,user=>{

if(!user){

window.location.href="store-login.html";

return;

}

loadSettings(user);

});

</script>

</body>

</html>
