<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
G-Glam | الإعدادات
</title>


<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

margin:0;
background:#f5f5f5;
color:#222;

}


/* القائمة الجانبية */

.sidebar{

position:fixed;
right:0;
top:0;
height:100vh;
width:70px;
background:#111;
color:white;
overflow:hidden;
transition:.3s;
z-index:1000;

}


.sidebar:hover{

width:230px;

}



.logo{

height:70px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
border-bottom:1px solid #333;

}



.menu{

margin-top:20px;

}



.menu a{

display:flex;
align-items:center;
gap:15px;
padding:15px;
color:white;
text-decoration:none;

}



.menu a:hover{

background:#222;

}



.icon{

min-width:35px;
text-align:center;

}



.text{

opacity:0;
transition:.3s;

}



.sidebar:hover .text{

opacity:1;

}


/* المحتوى */

.content{

margin-right:70px;
padding:20px;

}


.header{

background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:20px;

}


.header h1{

margin:0;

}
  

.header p{

color:#777;

}




.settings-box{

background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-bottom:20px;

}



.settings-box h2{

margin-top:0;

}




label{

display:block;
margin-bottom:8px;
font-weight:bold;

}



input,
textarea{

width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
margin-bottom:15px;

}



textarea{

height:100px;
resize:none;

}



button{

width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#111;
color:white;
font-size:17px;
cursor:pointer;

}



button:hover{

opacity:.9;

}



@media(max-width:700px){


.sidebar{

width:60px;

}



.sidebar:hover{

width:200px;

}



.content{

margin-right:60px;
padding:10px;

}


}


</style>


</head>



<body>



<div class="sidebar">


<div class="logo">

G-Glam

</div>

</span>

<span class="icon">⚙</span>

<span class="text">

</span>

</a>



</div>


</div>


<div class="content">



<div class="header">

<h1>

G-Glam

</h1>


<p>

إعدادات المتجر

</p>


</div>





<div class="settings-box">


<h2>

معلومات المتجر

</h2>



<label>

اسم المتجر

</label>


<input

type="text"

value="G-Glam">





<label>

رقم الهاتف

</label>


<input

type="tel"

placeholder="أدخل رقم الهاتف">





<label>

</label>


<textarea

placeholder="عنوان المتجر">

</textarea>




<button>

حفظ الإعدادات

</div>
