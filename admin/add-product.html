<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | إضافة منتج</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f5f5f5;
color:#222;
}

/* =========================
   القائمة الجانبية
========================= */

.sidebar{
position:fixed;
right:0;
top:0;
height:100vh;
width:70px;
background:#111;
color:white;
overflow:hidden;
transition:.3s;
z-index:1000;
}

.sidebar:hover{
width:230px;
}

.logo{
height:70px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
border-bottom:1px solid #333;
white-space:nowrap;
}

.menu{
margin-top:20px;
}

.menu a{
display:flex;
align-items:center;
gap:15px;
padding:15px;
color:white;
text-decoration:none;
white-space:nowrap;
transition:.2s;
}

.menu a:hover{
background:#222;
}

.icon{
min-width:35px;
text-align:center;
font-size:20px;
}

.text{
opacity:0;
transition:.3s;
}

.sidebar:hover .text{
opacity:1;
}

/* =========================
   المحتوى
========================= */

.content{
margin-right:70px;
padding:20px;
}

.header{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-bottom:20px;
}

.header h1{
margin:0;
font-size:28px;
}

.header p{
color:#777;
margin-bottom:0;
}

/* =========================
   الصندوق
========================= */

.form-box{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
max-width:800px;
margin:auto;
}

.form-group{
margin-bottom:18px;
}

label{
display:block;
font-weight:bold;
margin-bottom:8px;
}

input,
textarea{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:9px;
font-size:16px;
outline:none;
}

input:focus,
textarea:focus{
border-color:#111;
}

textarea{
height:120px;
resize:vertical;
}

/* =========================
   الصور
========================= */

.image-box{
border:2px dashed #ddd;
padding:20px;
border-radius:12px;
text-align:center;
background:#fafafa;
}

.image-box input{
border:none;
background:white;
}

.preview{
display:none;
width:180px;
height:180px;
object-fit:cover;
border-radius:12px;
margin:15px auto 0;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

/* =========================
   زر الحفظ
========================= */

.save-btn{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#111;
color:white;
font-size:18px;
cursor:pointer;
}

.save-btn:hover{
opacity:.9;
}

.save-btn:disabled{
background:#777;
cursor:not-allowed;
}

/* =========================
   الرسائل
========================= */

.message{
display:none;
padding:13px;
border-radius:9px;
margin-bottom:18px;
text-align:center;
}

.success{
background:#d4edda;
color:#155724;
}

.error{
background:#f8d7da;
color:#721c24;
}

/* =========================
   حالة التحميل
========================= */

.loading{
display:none;
text-align:center;
margin-top:15px;
color:#777;
}

/* =========================
   الهاتف
========================= */

@media(max-width:700px){

.sidebar{
width:60px;
}

.sidebar:hover{
width:200px;
}

.content{
margin-right:60px;
padding:10px;
}

.form-box{
padding:18px;
}

.header h1{
font-size:23px;
}

}

</style>

</head>

<body>


<!-- =========================
     القائمة الجانبية
========================= -->

<div class="sidebar">

<div class="logo">
G-Glam
</div>

<div class="menu">

<a href="index.html">

<span class="icon">⌂</span>

<span class="text">
الرئيسية
</span>

</a>


<a href="orders.html">

<span class="icon">▣</span>

<span class="text">
الطلبات
</span>

</a>


<a href="products.html">

<span class="icon">□</span>

<span class="text">
المنتجات
</span>

</a>


<a href="add-product.html">

<span class="icon">+</span>

<span class="text">
إضافة منتج
</span>

</a>


<a href="delivery.html">

<span class="icon">🚚</span>

<span class="text">
أسعار التوصيل
</span>

</a>


<a href="settings.html">

<span class="icon">⚙</span>

<span class="text">
الإعدادات
</span>

</a>

</div>

</div>


<!-- =========================
     المحتوى
========================= -->

<div class="content">


<div class="header">

<h1>
➕ إضافة منتج
</h1>

<p>
إضافة منتج جديد إلى متجر G-Glam
</p>

</div>


<div class="form-box">


<div
id="successMessage"
class="message success">
</div>


<div
id="errorMessage"
class="message error">
</div>


<!-- اسم المنتج -->

<div class="form-group">

<label>
اسم المنتج
</label>

<input
type="text"
id="name"
placeholder="مثال: Plump Lip Gloss">

</div>


<!-- السعر -->

<div class="form-group">

<label>
السعر DA
</label>

<input
type="number"
id="price"
placeholder="مثال: 250"
min="0">

</div>


<!-- الوصف -->

<div class="form-group">

<label>
وصف المنتج
</label>

<textarea
id="description"
placeholder="اكتب وصف المنتج هنا..."></textarea>

</div>


<!-- الألوان -->

<div class="form-group">

<label>
الألوان
</label>

<input
type="text"
id="colors"
placeholder="مثال: Beige,Nude,Pink">

<small style="color:#777;">
اكتب الألوان وافصل بينها بفاصلة ,
</small>

</div>


<!-- المخزون -->

<div class="form-group">

<label>
المخزون
</label>

<input
type="number"
id="stock"
placeholder="مثال: 20"
min="0">

</div>


<!-- الصورة -->

<div class="form-group">

<label>
📷 صورة المنتج
</label>

<div class="image-box">

<p>
اختر صورة المنتج
</p>

<input
type="file"
id="imageFile"
accept="image/*">

<img
id="preview"
class="preview"
alt="معاينة الصورة">

</div>

</div>


<!-- زر الإضافة -->

<button
class="save-btn"
id="addBtn">

➕ إضافة المنتج

</button>


<div
class="loading"
id="loading">

⏳ جاري رفع الصورة وإضافة المنتج...

</div>


</div>

</div>


<script type="module">


/* =========================
   Firebase
========================= */

import { initializeApp }

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
collection,
addDoc,
serverTimestamp

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


import {

getAuth,
onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


/* =========================
   Firebase Config
========================= */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =========================
   تشغيل Firebase
========================= */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);


/* =========================
   العناصر
========================= */

const nameInput =
document.getElementById("name");

const priceInput =
document.getElementById("price");

const descriptionInput =
document.getElementById("description");

const colorsInput =
document.getElementById("colors");

const stockInput =
document.getElementById("stock");

const imageFile =
document.getElementById("imageFile");

const preview =
document.getElementById("preview");

const addBtn =
document.getElementById("addBtn");

const loading =
document.getElementById("loading");

const successMessage =
document.getElementById("successMessage");

const errorMessage =
document.getElementById("errorMessage");


/* =========================
   بيانات المستخدم
========================= */

let currentUser = null;


/* =========================
   التحقق من تسجيل الدخول
========================= */

onAuthStateChanged(auth, async(user)=>{

if(!user){

alert(
"يجب تسجيل الدخول أولاً."
);

window.location.href =
"store-login.html";

return;

}

currentUser = user;

});


/* =========================
   معاينة الصورة
========================= */

imageFile.addEventListener(
"change",
function(){

const file =
this.files[0];

if(!file){

preview.style.display="none";

return;

}


/* التحقق من نوع الصورة */

if(!file.type.startsWith("image/")){

alert(
"يرجى اختيار ملف صورة صحيح."
);

this.value="";

preview.style.display="none";

return;

}


/* حجم الصورة */

if(file.size > 5 * 1024 * 1024){

alert(
"حجم الصورة يجب ألا يتجاوز 5MB."
);

this.value="";

preview.style.display="none";

return;

}


const reader =
new FileReader();


reader.onload=function(e){

preview.src =
e.target.result;

preview.style.display="block";

};


reader.readAsDataURL(file);

});


/* =========================
   الرسائل
========================= */

function showSuccess(message){

successMessage.textContent =
message;

successMessage.style.display =
"block";

errorMessage.style.display =
"none";

}


function showError(message){

errorMessage.textContent =
message;

errorMessage.style.display =
"block";

successMessage.style.display =
"none";

}


/* =========================
   إضافة المنتج
========================= */

addBtn.addEventListener(
"click",
async function(){


/* إخفاء الرسائل */

successMessage.style.display =
"none";

errorMessage.style.display =
"none";


/* التحقق من المستخدم */

if(!currentUser){

showError(
"يجب تسجيل الدخول أولاً."
);

return;

}


/* =========================
   قراءة البيانات
========================= */

const name =
nameInput.value.trim();


const price =
Number(priceInput.value);


const description =
descriptionInput.value.trim();


const colors =
colorsInput.value
.split(",")
.map(color=>color.trim())
.filter(color=>color);


const stock =
Number(stockInput.value);


const selectedImage =
imageFile.files[0];


/* =========================
   التحقق
========================= */

if(!name){

showError(
"يرجى إدخال اسم المنتج."
);

nameInput.focus();

return;

}


if(
priceInput.value === "" ||
isNaN(price) ||
price < 0
){

showError(
"يرجى إدخال سعر صحيح."
);

priceInput.focus();

return;

}


if(
stockInput.value === "" ||
isNaN(stock) ||
stock < 0
){

showError(
"يرجى إدخال كمية مخزون صحيحة."
);

stockInput.focus();

return;

}


if(!selectedImage){

showError(
"يرجى اختيار صورة المنتج."
);

return;

}


/* =========================
   بدء التحميل
========================= */

addBtn.disabled =
true;

loading.style.display =
"block";


try{


/* =========================
   1. رفع الصورة إلى Cloudinary
========================= */

const formData =
new FormData();


formData.append(
"file",
selectedImage
);


formData.append(
"upload_preset",
"gglam_products"
);


const response =
await fetch(

"https://api.cloudinary.com/v1_1/g82dvrkr/image/upload",

{

method:"POST",

body:formData

}

);


/* التحقق من الاستجابة */

if(!response.ok){

throw new Error(
"فشل رفع الصورة إلى Cloudinary."
);

}


const imageData =
await response.json();


if(!imageData.secure_url){

throw new Error(
"لم يتم الحصول على رابط الصورة."
);

}


const imageUrl =
imageData.secure_url;


/* =========================
   2. الحصول على متجر صاحب الحساب
========================= */

const email =
currentUser.email;


/*
نحن نستخدم email هنا
للبحث عن المتجر المرتبط بالحساب
*/


import {

query,
where,
getDocs

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const storesQuery =
query(

collection(db,"stores"),

where(
"email",
"==",
email
)

);


const storesSnapshot =
await getDocs(
storesQuery
);


if(storesSnapshot.empty){

throw new Error(
"لم يتم العثور على متجر مرتبط بهذا الحساب."
);

}


const storeDoc =
storesSnapshot.docs[0];


const storeId =
storeDoc.id;


/* =========================
   3. حفظ المنتج في Firestore
========================= */

await addDoc(

collection(db,"products"),

{

name:name,

price:price,

description:description,

colors:colors,

stock:stock,

image:imageUrl,

storeId:storeId,

ownerEmail:email,

createdAt:serverTimestamp(),

updatedAt:serverTimestamp()

}

);


/* =========================
   نجاح
========================= */

showSuccess(
"تمت إضافة المنتج بنجاح ✅"
);


/* تنظيف النموذج */

nameInput.value="";

priceInput.value="";

descriptionInput.value="";

colorsInput.value="";

stockInput.value="";

imageFile.value="";

preview.src="";

preview.style.display="none";


/* الانتقال بعد لحظة */

setTimeout(()=>{

window.location.href =
"products.html";

},1200);


}

catch(error){

console.error(
"Add product error:",
error
);


showError(
"حدث خطأ أثناء إضافة المنتج: "+
error.message
);

}


finally{

addBtn.disabled =
false;

loading.style.display =
"none";

}

});


</script>

</body>

</html>
