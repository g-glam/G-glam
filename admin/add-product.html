<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إضافة منتج - G-Glam</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

h1{
text-align:center;
margin-bottom:20px;
}

input,
textarea{
width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ddd;
border-radius:8px;
}

textarea{
height:120px;
resize:none;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#0084ff;
color:white;
font-size:18px;
cursor:pointer;
}

.preview{
width:150px;
display:none;
margin:15px auto;
border-radius:10px;
}

.success{
display:none;
background:#d4edda;
color:#155724;
padding:10px;
border-radius:8px;
margin-bottom:15px;
text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h1>➕ إضافة منتج جديد</h1>

<div class="success" id="successMsg">
تمت إضافة المنتج بنجاح ✅
</div>

<input
type="text"
id="name"
placeholder="اسم المنتج">

<input
type="number"
id="price"
placeholder="السعر">

<textarea
id="description"
placeholder="وصف المنتج">
</textarea>

<input
type="text"
id="colors"
placeholder="الألوان مثال: Beige,Nude,Pink">

<input
type="number"
id="stock"
placeholder="المخزون">

<label>
📷 اختر صورة المنتج
</label>

<input
type="file"
id="imageFile"
accept="image/*">

<img
id="preview"
class="preview">

<button id="saveBtn">
حفظ المنتج
</button>

</div>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const firebaseConfig = {

apiKey: "AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain: "g-glam.firebaseapp.com",

projectId: "g-glam",

storageBucket: "g-glam.firebasestorage.app",

messagingSenderId: "997228419719",

appId: "1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId: "G-WX1K1F83F6"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

let selectedImage = null;


// معاينة الصورة

document
.getElementById("imageFile")
.addEventListener("change", function(){

selectedImage = this.files[0];

if(!selectedImage) return;

const reader = new FileReader();

reader.onload = function(e){

const preview =
document.getElementById("preview");

preview.src = e.target.result;

preview.style.display = "block";

};

reader.readAsDataURL(selectedImage);

});
  document
.getElementById("saveBtn")
.addEventListener("click", async () => {

const name =
document.getElementById("name").value.trim();

const price =
Number(document.getElementById("price").value);

const description =
document.getElementById("description").value.trim();

const colors =
document.getElementById("colors").value
.split(",")
.map(c => c.trim())
.filter(c => c !== "");

const stock =
Number(document.getElementById("stock").value);


if(
!name ||
!price ||
!selectedImage
){
alert("يرجى ملء جميع الحقول واختيار صورة");
return;
}

try{

const formData = new FormData();

formData.append(
"file",
selectedImage
);

formData.append(
"upload_preset",
"gglam_products"
);


const uploadResponse =
await fetch(
"https://api.cloudinary.com/v1_1/g82dvrkr/image/upload",
{
method:"POST",
body:formData
}
);

const uploadData =
await uploadResponse.json();

const imageUrl =
uploadData.secure_url;


await addDoc(
collection(db,"products"),
{
name:name,
price:price,
description:description,
colors:colors,
stock:stock,
image:imageUrl,
createdAt:serverTimestamp()
}
);

document.getElementById("successMsg").style.display="block";

document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("description").value="";
document.getElementById("colors").value="";
document.getElementById("stock").value="";
document.getElementById("imageFile").value="";

document.getElementById("preview").style.display="none";

selectedImage = null;

window.scrollTo({
top:0,
behavior:"smooth"
});

}catch(error){

console.error(error);

alert(
"حدث خطأ أثناء رفع الصورة أو حفظ المنتج"
);

}

});
  </script>

</body>

</html>
