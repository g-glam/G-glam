<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G-Glam | إضافة منتج</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
color:#222;
}

/* القائمة */

.sidebar{
position:fixed;
right:0;
top:0;
height:100vh;
width:70px;
background:#111;
color:white;
overflow:hidden;
transition:.3s;
z-index:1000;
}

.sidebar:hover{
width:230px;
}

.logo{
height:70px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
border-bottom:1px solid #333;
white-space:nowrap;
}

.menu{
margin-top:20px;
}

.menu a{
display:flex;
align-items:center;
gap:15px;
padding:15px;
color:white;
text-decoration:none;
white-space:nowrap;
}

.menu a:hover{
background:#222;
}

.icon{
min-width:35px;
text-align:center;
font-size:20px;
}

.text{
opacity:0;
transition:.3s;
}

.sidebar:hover .text{
opacity:1;
}

/* المحتوى */

.content{
margin-right:70px;
padding:20px;
}

.header{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-bottom:20px;
}

.header h1{
font-size:28px;
}

.header p{
color:#777;
margin-top:8px;
}

/* النموذج */

.form-box{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
max-width:700px;
}

.form-box h2{
margin-bottom:20px;
}

.store-info{
background:#f8f5f0;
padding:15px;
border-radius:10px;
margin-bottom:20px;
}

.store-info p{
margin:6px 0;
}

input,
textarea{

width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

textarea{
height:120px;
resize:none;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:8px;
background:#111;
color:white;
font-size:17px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

/* الصور */

.preview-container{
display:flex;
flex-wrap:wrap;
gap:10px;
margin:15px 0;
}

.preview-container img{
width:120px;
height:120px;
object-fit:cover;
border-radius:10px;
}

/* الرسائل */

.success{
display:none;
background:#d4edda;
color:#155724;
padding:12px;
border-radius:8px;
margin-bottom:15px;
text-align:center;
}

.error{
display:none;
background:#f8d7da;
color:#721c24;
padding:12px;
border-radius:8px;
margin-bottom:15px;
text-align:center;
}

.loading{
display:none;
background:#fff3cd;
color:#856404;
padding:12px;
border-radius:8px;
margin-bottom:15px;
text-align:center;
}

@media(max-width:700px){

.sidebar{
width:60px;
}

.sidebar:hover{
width:200px;
}

.content{
margin-right:60px;
padding:10px;
}

}

</style>

</head>

<body>


<!-- القائمة الجانبية -->

<div class="sidebar">

<div class="logo">
G-Glam
</div>

<div class="menu">

<a href="dashboard.html">

<span class="icon">⌂</span>

<span class="text">
الرئيسية
</span>

</a>


<a href="orders.html">

<span class="icon">▣</span>

<span class="text">
الطلبات
</span>

</a>


<a href="products.html">

<span class="icon">□</span>

<span class="text">
المنتجات
</span>

</a>


<a href="add-product.html">

<span class="icon">+</span>

<span class="text">
إضافة منتج
</span>

</a>


<a href="delivery.html">

<span class="icon">🚚</span>

<span class="text">
أسعار التوصيل
</span>

</a>


<a href="settings.html">

<span class="icon">⚙</span>

<span class="text">
الإعدادات
</span>

</a>

</div>

</div>


<!-- المحتوى -->

<div class="content">


<div class="header">

<h1>
G-Glam
</h1>

<p>
إضافة منتج جديد للمتجر
</p>

</div>


<div class="form-box">

<h2>
➕ إضافة منتج
</h2>


<!-- معلومات المتجر -->

<div class="store-info">

<p>
<strong>🏪 المتجر:</strong>

<span id="storeName">
جاري التحميل...
</span>

</p>

<p>
<strong>📧 صاحب المتجر:</strong>

<span id="ownerEmail">
جاري التحميل...
</span>

</p>

</div>


<!-- الرسائل -->

<div
class="success"
id="successMsg">

تمت إضافة المنتج بنجاح ✅

</div>


<div
class="error"
id="errorMsg">

حدث خطأ أثناء إضافة المنتج

</div>


<div
class="loading"
id="loadingMsg">

⏳ جاري رفع المنتج، يرجى الانتظار...

</div>


<!-- اسم المنتج -->

<label>
اسم المنتج
</label>

<input
id="name"
type="text"
placeholder="مثال: Lip Gloss">


<!-- السعر -->

<label>
السعر DA
</label>

<input
id="price"
type="number"
placeholder="مثال: 250"
min="0">


<!-- الوصف -->

<label>
وصف المنتج
</label>

<textarea
id="description"
placeholder="اكتب وصف المنتج هنا">
</textarea>


<!-- الألوان -->

<label>
الألوان
</label>

<input
id="colors"
type="text"
placeholder="مثال: Beige,Nude,Pink">


<!-- المخزون -->

<label>
المخزون
</label>

<input
id="stock"
type="number"
placeholder="مثال: 20"
min="0">


<!-- الصور -->

<label>
📷 صور المنتج
</label>

<input
id="imageFiles"
type="file"
accept="image/*"
multiple>


<div
class="preview-container"
id="previewContainer">
</div>


<!-- زر الحفظ -->

<button
id="saveBtn">

حفظ المنتج

</button>


</div>

</div>


<script type="module">


/* ================================
   Firebase
================================ */

import { initializeApp }

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
collection,
addDoc,
serverTimestamp,
getDocs,
query,
where

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


import {

getAuth,
onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);


/* ================================
   العناصر
================================ */

const nameInput =
document.getElementById("name");

const priceInput =
document.getElementById("price");

const descriptionInput =
document.getElementById("description");

const colorsInput =
document.getElementById("colors");

const stockInput =
document.getElementById("stock");

const imageFiles =
document.getElementById("imageFiles");

const previewContainer =
document.getElementById("previewContainer");

const saveBtn =
document.getElementById("saveBtn");

const storeNameElement =
document.getElementById("storeName");

const ownerEmailElement =
document.getElementById("ownerEmail");

const successMsg =
document.getElementById("successMsg");

const errorMsg =
document.getElementById("errorMsg");

const loadingMsg =
document.getElementById("loadingMsg");


/* ================================
   بيانات المتجر
================================ */

let ownerEmail = "";

let storeName = "";

let selectedImages = [];


/*
   نحاول أولًا الحصول على البريد
   من Firebase Authentication.

   وإذا لم يكن موجودًا، نستخدم
   البريد المخزن في localStorage.
*/

function getOwnerEmail(){

const user =
auth.currentUser;

if(user && user.email){

return user.email;

}


/* احتمال وجود البريد في localStorage */

const savedEmail =
localStorage.getItem("storeOwnerEmail");

if(savedEmail){

return savedEmail;

}


/* بعض المشاريع تستخدم ownerEmail */

const savedOwnerEmail =
localStorage.getItem("ownerEmail");

if(savedOwnerEmail){

return savedOwnerEmail;

}

return "";

}


/* ================================
   تحميل بيانات المتجر
================================ */

async function loadStore(){

try{

ownerEmail =
getOwnerEmail();


/*
   إذا لم يوجد بريد،
   لا نمنع الصفحة مباشرة،
   حتى لا يتعطل المشروع القديم.
*/

if(!ownerEmail){

ownerEmailElement.textContent =
"غير محدد";

storeNameElement.textContent =
"G-Glam";

return;

}


ownerEmailElement.textContent =
ownerEmail;


/*
   البحث عن المتجر بواسطة ownerEmail
*/

const q =
query(

collection(db,"stores"),

where(
"ownerEmail",
"==",
ownerEmail
)

);


const snapshot =
await getDocs(q);


if(snapshot.empty){

storeName =
"G-Glam";

storeNameElement.textContent =
storeName;

return;

}


/*
   في حالة وجود أكثر من متجر
   نستخدم أول متجر حاليًا.
*/

const storeDoc =
snapshot.docs[0];

const storeData =
storeDoc.data();


storeName =
storeData.storeName ||
"G-Glam";


storeNameElement.textContent =
storeName;


/*
   حفظ البيانات محليًا
*/

localStorage.setItem(
"storeOwnerEmail",
ownerEmail
);

localStorage.setItem(
"storeName",
storeName
);

localStorage.setItem(
"storeId",
storeDoc.id
);


}catch(error){

console.error(
"Store loading error:",
error
);

storeNameElement.textContent =
"G-Glam";

}

}


/* ================================
   Firebase Auth
================================ */

onAuthStateChanged(
auth,
async function(user){

if(user && user.email){

ownerEmail =
user.email;

}

await loadStore();

}
);


/* ================================
   معاينة الصور
================================ */

imageFiles.addEventListener(
"change",
function(){

selectedImages =
Array.from(this.files);


previewContainer.innerHTML =
"";


selectedImages.forEach(
function(file){

const reader =
new FileReader();


reader.onload =
function(e){

const img =
document.createElement("img");

img.src =
e.target.result;

previewContainer.appendChild(img);

};


reader.readAsDataURL(file);

}

);

}
);


/* ================================
   حفظ المنتج
================================ */

saveBtn.addEventListener(
"click",
async function(){

/* إخفاء الرسائل */

successMsg.style.display =
"none";

errorMsg.style.display =
"none";


/* البيانات */

const name =
nameInput.value.trim();


const price =
Number(
priceInput.value
);


const description =
descriptionInput.value.trim();


const colors =
colorsInput.value

.split(",")

.map(
function(c){

return c.trim();

}
)

.filter(
function(c){

return c;

}
);


const stock =
Number(
stockInput.value
);


/* الحصول على البريد */

if(!ownerEmail){

ownerEmail =
getOwnerEmail();

}


/* التحقق */

if(!name){

alert(
"يرجى إدخال اسم المنتج"
);

return;

}


if(
price <= 0 ||
isNaN(price)
){

alert(
"يرجى إدخال سعر صحيح"
);

return;

}


if(
selectedImages.length === 0
){

alert(
"يرجى اختيار صورة واحدة على الأقل"
);

return;

}


/*
   إذا لم يوجد صاحب متجر
*/

if(!ownerEmail){

const continueWithoutEmail =
confirm(

"لم يتم العثور على بريد صاحب المتجر.\n\n" +

"هل تريدين إضافة المنتج إلى المتجر الرئيسي G-Glam؟"

);


if(!continueWithoutEmail){

return;

}

}


/* تعطيل الزر */

saveBtn.disabled =
true;

loadingMsg.style.display =
"block";


try{


/* ============================
   رفع الصور إلى Cloudinary
============================ */

let images = [];


for(
let file of selectedImages
){


const formData =
new FormData();


formData.append(
"file",
file
);


formData.append(
"upload_preset",
"gglam_products"
);


const response =
await fetch(

"https://api.cloudinary.com/v1_1/g82dvrkr/image/upload",

{

method:"POST",

body:formData

}

);


if(!response.ok){

throw new Error(
"فشل رفع الصورة إلى Cloudinary"
);

}


const data =
await response.json();


if(!data.secure_url){

throw new Error(
"لم يتم الحصول على رابط الصورة"
);

}


images.push(
data.secure_url
);

}


/* ============================
   الصورة الرئيسية
============================ */

const mainImage =
images[0];


/* ============================
   بيانات المنتج
============================ */

const productData = {

name:name,

price:price,

description:description,

colors:colors,

stock:stock,

image:mainImage,

images:images,

/*
   البريد الخاص بصاحب المتجر
*/

ownerEmail:
ownerEmail || "",

/*
   اسم المتجر
*/

storeName:
storeName || "G-Glam",

/*
   معرف المتجر إذا كان موجودًا
*/

storeId:
localStorage.getItem("storeId") || "",

createdAt:
serverTimestamp()

};


/* ============================
   إضافة المنتج إلى Firestore
============================ */

await addDoc(

collection(
db,
"products"
),

productData

);


/* نجاح */

loadingMsg.style.display =
"none";

successMsg.style.display =
"block";


/* تفريغ الحقول */

nameInput.value =
"";

priceInput.value =
"";

descriptionInput.value =
"";

colorsInput.value =
"";

stockInput.value =
"";

imageFiles.value =
"";

previewContainer.innerHTML =
"";

selectedImages =
[];


/*
   بعد الإضافة نذهب إلى
   صفحة المنتجات
*/

setTimeout(
function(){

window.location.href =
"products.html";

},
1200
);


}catch(error){

console.error(
"Add product error:",
error
);


loadingMsg.style.display =
"none";

errorMsg.textContent =

"❌ حدث خطأ أثناء إضافة المنتج: " +
error.message;


errorMsg.style.display =
"block";


saveBtn.disabled =
false;

}

}
);


</script>

</body>

</html>
