<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إضافة منتج - G-Glam</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:20px;
}

.container{
max-width:600px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

h1{
text-align:center;
margin-bottom:20px;
}

input,
textarea{
width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ddd;
border-radius:8px;
}

textarea{
height:120px;
resize:none;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#0084ff;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

</style>

</head>

<body>

<div class="container">

<h1>
➕ إضافة منتج جديد
</h1>

<input
type="text"
id="name"
placeholder="اسم المنتج">

<input
type="number"
id="price"
placeholder="السعر">

<input
type="text"
id="image"
placeholder="رابط الصورة">

<textarea
id="description"
placeholder="وصف المنتج">
</textarea>

<button id="saveBtn">
حفظ المنتج
</button>

</div>
<script>

document.getElementById("saveBtn").onclick = function(){

let name = document.getElementById("name").value;
let price = document.getElementById("price").value;
let image = document.getElementById("image").value;
let description = document.getElementById("description").value;


if(name=="" || price=="" || image==""){
alert("يرجى ملء جميع المعلومات الأساسية");
return;
}


// جلب المنتجات القديمة
let products = JSON.parse(localStorage.getItem("products")) || [];


// إنشاء منتج جديد
let newProduct = {

id: Date.now(),

name:name,

price:price,

image:image,

description:description

};


// إضافة المنتج
products.push(newProduct);


// حفظ المنتجات
localStorage.setItem(
"products",
JSON.stringify(products)
);


alert("تمت إضافة المنتج بنجاح ✅");


// تفريغ الخانات
document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("image").value="";
document.getElementById("description").value="";


};

</script>


</body>

</html>
