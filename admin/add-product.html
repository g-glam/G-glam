<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
G-Glam | إضافة منتج
</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

margin:0;

background:#f5f5f5;

color:#222;

}

/* =========================
   القائمة الجانبية
========================= */

.sidebar{

position:fixed;

right:0;

top:0;

height:100vh;

width:70px;

background:#111;

color:white;

overflow:hidden;

transition:.3s;

z-index:1000;

}

.sidebar:hover{

width:230px;

}

.logo{

height:70px;

display:flex;

align-items:center;

justify-content:center;

font-size:22px;

font-weight:bold;

border-bottom:1px solid #333;

white-space:nowrap;

}

.menu{

margin-top:20px;

}

.menu a{

display:flex;

align-items:center;

gap:15px;

padding:15px;

color:white;

text-decoration:none;

white-space:nowrap;

transition:.2s;

}

.menu a:hover{

background:#222;

}

.icon{

min-width:35px;

text-align:center;

font-size:20px;

}

.text{

opacity:0;

transition:.3s;

}

.sidebar:hover .text{

opacity:1;

}


/* =========================
   المحتوى
========================= */

.content{

margin-right:70px;

padding:20px;

}

.header{

background:white;

padding:20px;

border-radius:12px;

box-shadow:0 2px 10px rgba(0,0,0,.08);

margin-bottom:20px;

}

.header h1{

margin:0;

font-size:28px;

}

.header p{

margin-top:8px;

color:#777;

}


/* =========================
   الصندوق
========================= */

.form-box{

max-width:750px;

margin:auto;

background:white;

padding:25px;

border-radius:15px;

box-shadow:0 2px 10px rgba(0,0,0,.08);

}


/* =========================
   العناوين
========================= */

.form-box h2{

margin-top:0;

margin-bottom:25px;

}


/* =========================
   الحقول
========================= */

.form-group{

margin-bottom:18px;

}

.form-group label{

display:block;

font-weight:bold;

margin-bottom:8px;

}

input,
textarea,
select{

width:100%;

padding:13px;

border:1px solid #ddd;

border-radius:8px;

font-size:15px;

outline:none;

background:white;

}

input:focus,
textarea:focus,
select:focus{

border-color:#111;

}

textarea{

height:120px;

resize:vertical;

}


/* =========================
   الصف
========================= */

.row{

display:grid;

grid-template-columns:1fr 1fr;

gap:15px;

}


/* =========================
   رفع الصورة
========================= */

.image-box{

border:2px dashed #ddd;

border-radius:12px;

padding:20px;

text-align:center;

margin-bottom:20px;

}

.image-box p{

color:#777;

margin-top:0;

}

.image-box input{

border:none;

padding:5px;

}

.preview{

display:none;

width:180px;

height:180px;

object-fit:cover;

margin:15px auto 0;

border-radius:12px;

border:1px solid #ddd;

}


/* =========================
   الألوان
========================= */

.colors-help{

font-size:13px;

color:#777;

margin-top:-8px;

margin-bottom:10px;

}


/* =========================
   زر الحفظ
========================= */

.save-btn{

width:100%;

padding:15px;

border:none;

border-radius:10px;

background:#111;

color:white;

font-size:18px;

cursor:pointer;

margin-top:10px;

}

.save-btn:hover{

opacity:.9;

}

.save-btn:disabled{

background:#777;

cursor:not-allowed;

}


/* =========================
   رسالة النجاح
========================= */

.message{

display:none;

padding:13px;

border-radius:8px;

margin-bottom:20px;

text-align:center;

}

.success{

background:#d4edda;

color:#155724;

}

.error{

background:#f8d7da;

color:#721c24;

}


/* =========================
   معلومات المتجر
========================= */

.store-info{

background:#f8f8f8;

padding:12px;

border-radius:8px;

margin-bottom:20px;

font-size:14px;

color:#555;

}


/* =========================
   الهاتف
========================= */

@media(max-width:700px){

.sidebar{

width:60px;

}

.sidebar:hover{

width:200px;

}

.content{

margin-right:60px;

padding:10px;

}

.form-box{

padding:18px;

}

.row{

grid-template-columns:1fr;

gap:0;

}

}

</style>

</head>


<body>


<!-- =========================
     القائمة الجانبية
========================= -->

<div class="sidebar">

<div class="logo">

G-Glam

</div>


<div class="menu">


<a href="store-dashboard.html">

<span class="icon">
⌂
</span>

<span class="text">
لوحة المتجر
</span>

</a>


<a href="orders.html">

<span class="icon">
▣
</span>

<span class="text">
الطلبات
</span>

</a>


<a href="products.html">

<span class="icon">
□
</span>

<span class="text">
المنتجات
</span>

</a>


<a href="add-product.html">

<span class="icon">
+
</span>

<span class="text">
إضافة منتج
</span>

</a>


<a href="delivery.html">

<span class="icon">
🚚
</span>

<span class="text">
أسعار التوصيل
</span>

</a>


<a href="settings.html">

<span class="icon">
⚙
</span>

<span class="text">
الإعدادات
</span>

</a>


</div>

</div>


<!-- =========================
     المحتوى
========================= -->

<div class="content">


<div class="header">

<h1>

➕ إضافة منتج

</h1>

<p>

إضافة منتج جديد إلى متجرك

</p>

</div>


<div class="form-box">


<h2>

معلومات المنتج

</h2>


<div
class="message success"
id="successMessage">

تمت إضافة المنتج بنجاح ✅

</div>


<div
class="message error"
id="errorMessage">

</div>


<div
class="store-info"
id="storeInfo">

⏳ جاري التحقق من المتجر...

</div>


<!-- =========================
     اسم المنتج
========================= -->

<div class="form-group">

<label>

اسم المنتج

</label>

<input

type="text"

id="name"

placeholder="مثال: Lip Gloss">

</div>


<!-- =========================
     السعر والمخزون
========================= -->

<div class="row">


<div class="form-group">

<label>

السعر DA

</label>

<input

type="number"

id="price"

placeholder="مثال: 250"

min="0"

step="1">

</div>


<div class="form-group">

<label>

المخزون

</label>

<input

type="number"

id="stock"

placeholder="مثال: 20"

min="0"

step="1">

</div>


</div>


<!-- =========================
     الوصف
========================= -->

<div class="form-group">

<label>

وصف المنتج

</label>

<textarea

id="description"

placeholder="اكتب وصفًا مختصرًا للمنتج...">

</textarea>

</div>


<!-- =========================
     الألوان
========================= -->

<div class="form-group">

<label>

الألوان المتوفرة

</label>

<input

type="text"

id="colors"

placeholder="Beige, Nude, Pink">

<div class="colors-help">

اكتب الألوان مفصولة بفاصلة ,

</div>

</div>


<!-- =========================
     صورة المنتج
========================= -->

<div class="form-group">

<label>

📷 صورة المنتج

</label>


<div class="image-box">

<p>

اختر صورة المنتج

</p>


<input

type="file"

id="imageFile"

accept="image/jpeg,image/png,image/webp">


<img

id="preview"

class="preview"

alt="معاينة الصورة">

</div>

</div>


<!-- =========================
     زر الحفظ
========================= -->

<button

class="save-btn"

id="saveBtn"

disabled>

💾 إضافة المنتج

</button>


</div>

</div>


<script type="module">


/* =========================
   Firebase
========================= */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getAuth,

onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


import {

getFirestore,

collection,

query,

where,

getDocs,

addDoc,

serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =========================
   Firebase Config
========================= */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =========================
   تشغيل Firebase
========================= */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =========================
   العناصر
========================= */

const nameInput =
document.getElementById("name");

const priceInput =
document.getElementById("price");

const descriptionInput =
document.getElementById("description");

const colorsInput =
document.getElementById("colors");

const stockInput =
document.getElementById("stock");

const imageFile =
document.getElementById("imageFile");

const preview =
document.getElementById("preview");

const saveBtn =
document.getElementById("saveBtn");

const storeInfo =
document.getElementById("storeInfo");

const successMessage =
document.getElementById("successMessage");

const errorMessage =
document.getElementById("errorMessage");


/* =========================
   متغيرات المتجر
========================= */

let currentUser = null;

let currentStoreId = null;

let currentStore = null;

let selectedImage = null;


/* =========================
   الرسائل
========================= */

function showSuccess(message){

successMessage.textContent =
message;

successMessage.style.display =
"block";

errorMessage.style.display =
"none";

}


function showError(message){

errorMessage.textContent =
message;

errorMessage.style.display =
"block";

successMessage.style.display =
"none";

}


function hideMessages(){

successMessage.style.display =
"none";

errorMessage.style.display =
"none";

}


/* =========================
   التحقق من تسجيل الدخول
========================= */

onAuthStateChanged(
auth,
async(user)=>{


if(!user){

window.location.href =
"store-login.html";

return;

}


currentUser = user;


try{


/* =========================
   البحث عن متجر المستخدم
========================= */

const storesQuery =

query(

collection(db,"stores"),

where(
"email",
"==",
user.email
)

);


const storesSnapshot =

await getDocs(
storesQuery
);


if(storesSnapshot.empty){

storeInfo.innerHTML =
"❌ لم يتم العثور على متجر مرتبط بهذا الحساب.";

showError(
"لا يوجد متجر مرتبط بحسابك."
);

return;

}


const storeDoc =
storesSnapshot.docs[0];


currentStoreId =
storeDoc.id;


currentStore =
storeDoc.data();


storeInfo.innerHTML =

"🏪 المتجر: <strong>" +

(
currentStore.name ||
"G-Glam"
)

+

"</strong><br>"

+

"📧 البريد: "

+

user.email;


saveBtn.disabled =
false;


}

catch(error){

console.error(error);

showError(
"حدث خطأ أثناء تحميل بيانات المتجر: "
+
error.message
);

}

});


/* =========================
   معاينة الصورة
========================= */

imageFile.addEventListener(
"change",
function(){

hideMessages();

selectedImage =
this.files[0] || null;


if(!selectedImage){

preview.style.display =
"none";

preview.src =
"";

return;

}


/* التحقق من نوع الصورة */

if(
!selectedImage.type.startsWith("image/")
){

showError(
"الملف المختار ليس صورة."
);

this.value="";

selectedImage=null;

preview.style.display =
"none";

return;

}


/* حجم الصورة */

if(
selectedImage.size >
5 * 1024 * 1024
){

showError(
"حجم الصورة يجب أن يكون أقل من 5MB."
);

this.value="";

selectedImage=null;

preview.style.display =
"none";

return;

}


const reader =
new FileReader();


reader.onload =
function(e){

preview.src =
e.target.result;

preview.style.display =
"block";

};


reader.readAsDataURL(
selectedImage
);

});


/* =========================
   رفع الصورة إلى Cloudinary
========================= */

async function uploadImage(file){


const formData =
new FormData();


formData.append(
"file",
file
);


formData.append(
"upload_preset",
"gglam_products"
);


const response =

await fetch(

"https://api.cloudinary.com/v1_1/g82dvrkr/image/upload",

{

method:"POST",

body:formData

}

);


if(!response.ok){

throw new Error(
"فشل رفع الصورة إلى Cloudinary"
);

}


const data =
await response.json();


if(!data.secure_url){

throw new Error(
"لم يتم الحصول على رابط الصورة"
);

}


return data.secure_url;

}


/* =========================
   إضافة المنتج
========================= */

saveBtn.addEventListener(
"click",
async function(){


hideMessages();


/* التأكد من المتجر */

if(
!currentUser ||
!currentStoreId
){

showError(
"لم يتم تحميل بيانات المتجر بعد."
);

return;

}


/* البيانات */

const name =
nameInput.value.trim();


const price =
Number(
priceInput.value
);


const description =
descriptionInput.value.trim();


const stock =
Number(
stockInput.value
);


/* الألوان */

const colors =

colorsInput.value

.split(",")

.map(
color=>color.trim()
)

.filter(
color=>color
);


/* =========================
   التحقق
========================= */

if(!name){

showError(
"يرجى إدخال اسم المنتج."
);

nameInput.focus();

return;

}


if(
priceInput.value === "" ||
price < 0
){

showError(
"يرجى إدخال سعر صحيح."
);

priceInput.focus();

return;

}


if(
stockInput.value === "" ||
stock < 0
){

showError(
"يرجى إدخال كمية مخزون صحيحة."
);

stockInput.focus();

return;

}


if(!description){

showError(
"يرجى إدخال وصف المنتج."
);

descriptionInput.focus();

return;

}


if(!selectedImage){

showError(
"يرجى اختيار صورة للمنتج."
);

return;

}


/* =========================
   تعطيل الزر
========================= */

saveBtn.disabled =
true;

saveBtn.textContent =
"⏳ جاري إضافة المنتج...";


try{


/* =========================
   رفع الصورة
========================= */

saveBtn.textContent =
"⏳ جاري رفع الصورة...";


const imageUrl =
await uploadImage(
selectedImage
);


/* =========================
   حفظ المنتج في Firestore
========================= */

saveBtn.textContent =
"⏳ جاري حفظ المنتج...";


const productData = {

name:name,

price:price,

description:description,

colors:colors,

stock:stock,

image:imageUrl,

storeId:currentStoreId,

storeName:
currentStore.name ||
"G-Glam",

ownerEmail:
currentUser.email,

createdAt:
serverTimestamp(),

updatedAt:
serverTimestamp()

};


await addDoc(

collection(
db,
"products"
),

productData

);


/* =========================
   نجاح
========================= */

showSuccess(
"تمت إضافة المنتج بنجاح ✅"
);


/* تفريغ الحقول */

nameInput.value="";

priceInput.value="";

descriptionInput.value="";

colorsInput.value="";

stockInput.value="";

imageFile.value="";

selectedImage=null;

preview.src="";

preview.style.display="none";


window.scrollTo({

top:0,

behavior:"smooth"

});


}

catch(error){

console.error(
"Add product error:",
error
);

showError(

"حدث خطأ أثناء إضافة المنتج: "

+

error.message

);

}

finally{

saveBtn.disabled =
false;

saveBtn.textContent =
"💾 إضافة المنتج";

}

});


</script>

</body>

</html>
