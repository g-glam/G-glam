<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إضافة منتج - G-Glam</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

h1{
text-align:center;
margin-bottom:20px;
}

input,
textarea{
width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ddd;
border-radius:8px;
}

textarea{
height:120px;
resize:none;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#0084ff;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.success{
display:none;
background:#d4edda;
color:#155724;
padding:10px;
border-radius:8px;
margin-bottom:15px;
text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h1>➕ إضافة منتج جديد</h1>

<div class="success" id="successMsg">
تمت إضافة المنتج بنجاح ✅
</div>
<input
type="text"
id="name"
placeholder="اسم المنتج">

<input
type="number"
id="price"
placeholder="السعر بالدينار">

<input
type="text"
id="image"
placeholder="رابط الصورة">

<textarea
id="description"
placeholder="وصف المنتج">
</textarea>

<input
type="text"
id="colors"
placeholder="الألوان (مثال: Beige,Nude,Pink)">

<input
type="number"
id="stock"
placeholder="المخزون المتوفر">

<button id="saveBtn">
حفظ المنتج
</button>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
  const firebaseConfig = {

apiKey: "AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain: "g-glam.firebaseapp.com",

projectId: "g-glam",

storageBucket: "g-glam.firebasestorage.app",

messagingSenderId: "997228419719",

appId: "1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId: "G-WX1K1F83F6"

};


// تشغيل Firebase
const app = initializeApp(firebaseConfig);

const db = getFirestore(app);
document.getElementById("saveBtn")
.addEventListener("click", async () => {

const name =
document.getElementById("name").value.trim();

const price =
Number(document.getElementById("price").value);

const image =
document.getElementById("image").value.trim();

const description =
document.getElementById("description").value.trim();

const colors =
document.getElementById("colors").value
.split(",")
.map(color => color.trim())
.filter(color => color !== "");

const stock =
Number(document.getElementById("stock").value);


if(
!name ||
!price ||
!image
){
alert("يرجى ملء جميع الحقول المطلوبة");
return;
}

try{

await addDoc(
collection(db,"products"),
{
name:name,
price:price,
image:image,
description:description,
colors:colors,
stock:stock,
createdAt:serverTimestamp()
}
);

document.getElementById("successMsg").style.display="block";

document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("image").value="";
document.getElementById("description").value="";
document.getElementById("colors").value="";
document.getElementById("stock").value="";

window.scrollTo({
top:0,
behavior:"smooth"
});

}catch(error){

console.error(error);

alert(
"حدث خطأ أثناء حفظ المنتج"
);

}

});
  </script>

</body>

</html>
