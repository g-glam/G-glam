<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
G-Glam | إضافة منتج
</title>


<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}


body{

background:#f5f5f5;
color:#222;

}



/* القائمة الجانبية */

.sidebar{

position:fixed;
right:0;
top:0;
height:100vh;
width:70px;
background:#111;
color:white;
overflow:hidden;
transition:.3s;
z-index:1000;

}



.sidebar:hover{

width:230px;

}



.logo{

height:70px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
border-bottom:1px solid #333;
white-space:nowrap;

}



.menu{

margin-top:20px;

}



.menu a{

display:flex;
align-items:center;
gap:15px;
padding:15px;
color:white;
text-decoration:none;
white-space:nowrap;

}



.menu a:hover{

background:#222;

}



.icon{

min-width:35px;
text-align:center;
font-size:20px;

}



.text{

opacity:0;
transition:.3s;

}



.sidebar:hover .text{

opacity:1;

}



/* المحتوى */


.content{

margin-right:70px;
padding:20px;

}



.header{

background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-bottom:20px;

}



.header h1{

font-size:28px;

}


.header p{

color:#777;
margin-top:8px;

}
  
.form-box{

background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
max-width:700px;
}



input,
textarea{

width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;

}



textarea{

height:120px;
resize:none;

}



label{

display:block;
margin-bottom:8px;
font-weight:bold;

}



button{

width:100%;
padding:14px;
border:none;
border-radius:8px;
background:#111;
color:white;
font-size:17px;
cursor:pointer;

}



button:hover{

opacity:.9;

}



.preview{

width:160px;
display:none;
margin:15px auto;
border-radius:10px;

}



.success{

display:none;
background:#d4edda;
color:#155724;
padding:12px;
border-radius:8px;
margin-bottom:15px;
text-align:center;

}



@media(max-width:700px){


.sidebar{

width:60px;

}


.sidebar:hover{

width:200px;

}



.content{

margin-right:60px;
padding:10px;

}


}



</style>


</head>



<body>



<div class="sidebar">



<div class="logo">

G-Glam

</div>




<div class="menu">



<a href="index.html">

<span class="icon">⌂</span>

<span class="text">
الرئيسية
</span>

</a>




<a href="orders.html">

<span class="icon">▣</span>

<span class="text">
الطلبات
</span>

</a>




<a href="products.html">

<span class="icon">□</span>

<span class="text">
المنتجات
</span>

</a>




<a href="add-product.html">

<span class="icon">+</span>

<span class="text">
إضافة منتج
</span>

</a>




<a href="settings.html">

<span class="icon">⚙</span>

<span class="text">
الإعدادات
</span>

</a>



</div>


</div>





<div class="content">


<div class="header">

<h1>
G-Glam
</h1>


<p>
إضافة منتج جديد للمتجر
</p>


</div>





<div class="form-box">


<h2>
إضافة منتج
</h2>


<br>



<div class="success" id="successMsg">

تمت إضافة المنتج بنجاح

</div>



<input
id="name"
type="text"
placeholder="اسم المنتج">



<input
id="price"
type="number"
placeholder="السعر DA">



<textarea
id="description"
placeholder="وصف المنتج">

</textarea>



<input
id="colors"
type="text"
placeholder="الألوان مثال: Beige,Nude,Pink">



<input
id="stock"
type="number"
placeholder="المخزون">



<label>

صورة المنتج

</label>



<input
id="imageFile"
type="file"
accept="image/*">



<img
id="preview"
class="preview">



<button id="saveBtn">

حفظ المنتج

</button>


</div>


</div>

<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
collection,
addDoc,
serverTimestamp

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";





const firebaseConfig = {


apiKey: "AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain: "g-glam.firebaseapp.com",

projectId: "g-glam",

storageBucket: "g-glam.firebasestorage.app",

messagingSenderId: "997228419719",

appId: "1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId: "G-WX1K1F83F6"


};





const app = initializeApp(firebaseConfig);



const db = getFirestore(app);




let selectedImage = null;







// معاينة الصورة


document

.getElementById("imageFile")

.addEventListener("change",function(){



selectedImage = this.files[0];



if(!selectedImage){

return;

}




let reader = new FileReader();



reader.onload=function(e){


let preview =

document.getElementById("preview");



preview.src=e.target.result;



preview.style.display="block";



};



reader.readAsDataURL(selectedImage);



});










// حفظ المنتج


document

.getElementById("saveBtn")

.addEventListener("click",async()=>{



let name =

document.getElementById("name")

.value.trim();



let price =

Number(

document.getElementById("price").value

);



let description =

document.getElementById("description")

.value.trim();





let colors =

document.getElementById("colors")

.value

.split(",")

.map(c=>c.trim())

.filter(c=>c);



let stock =

Number(

document.getElementById("stock").value

);






if(

!name ||

!price ||

!selectedImage

){


alert("يرجى إدخال الاسم والسعر واختيار صورة");


return;


}







try{



const formData = new FormData();



formData.append(

"file",

selectedImage

);





formData.append(

"upload_preset",

"gglam_products"

);





const response = await fetch(


"https://api.cloudinary.com/v1_1/g82dvrkr/image/upload",


{


method:"POST",


body:formData


}


);





const data = await response.json();




const imageUrl =

data.secure_url;
  
await addDoc(

collection(db,"products"),

{


name:name,


price:price,


description:description,


colors:colors,


stock:stock,


image:imageUrl,


createdAt:serverTimestamp()



}

);






document

.getElementById("successMsg")

.style.display="block";






// تفريغ الحقول


document.getElementById("name").value="";


document.getElementById("price").value="";


document.getElementById("description").value="";


document.getElementById("colors").value="";


document.getElementById("stock").value="";


document.getElementById("imageFile").value="";




document

.getElementById("preview")

.style.display="none";



selectedImage=null;






setTimeout(()=>{


window.location.href="products.html";


},1500);






}

catch(error){



console.error(error);



alert(

"حدث خطأ أثناء إضافة المنتج"

);



}



});
  
</script>


</body>


</html>
