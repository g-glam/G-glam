<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-Glam | إضافة منتج</title>

<style>
*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f5f5f5;
color:#222;
}

.sidebar{
position:fixed;
right:0;
top:0;
height:100vh;
width:70px;
background:#111;
color:white;
overflow:hidden;
transition:.3s;
z-index:1000;
}

.sidebar:hover{
width:230px;
}

.logo{
height:70px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
border-bottom:1px solid #333;
}

.menu{
margin-top:20px;
}

.menu a{
display:flex;
align-items:center;
gap:15px;
padding:15px;
color:white;
text-decoration:none;
white-space:nowrap;
}

.menu a:hover{
background:#222;
}

.icon{
min-width:35px;
text-align:center;
font-size:20px;
}

.text{
opacity:0;
transition:.3s;
}

.sidebar:hover .text{
opacity:1;
}

.content{
margin-right:70px;
padding:20px;
}

.header{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-bottom:20px;
}

.header h1{
margin:0;
}

.header p{
color:#777;
}

.box{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
max-width:700px;
margin:auto;
}

label{
display:block;
font-weight:bold;
margin-bottom:7px;
}

input,
textarea{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
margin-bottom:15px;
font-size:15px;
}

textarea{
height:120px;
resize:none;
}

.preview{
width:180px;
height:180px;
object-fit:cover;
display:block;
margin:10px auto 20px;
border-radius:12px;
background:#f3f3f3;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:9px;
background:#111;
color:white;
font-size:17px;
cursor:pointer;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.message{
display:none;
padding:12px;
border-radius:8px;
margin-bottom:15px;
text-align:center;
}

.success{
background:#d4edda;
color:#155724;
}

.error{
background:#f8d7da;
color:#721c24;
}

@media(max-width:700px){

.sidebar{
width:60px;
}

.sidebar:hover{
width:200px;
}

.content{
margin-right:60px;
padding:10px;
}

.box{
padding:15px;
}

}
</style>
</head>

<body>

<div class="sidebar">

<div class="logo">
G-Glam
</div>

<div class="menu">

<a href="index.html">
<span class="icon">⌂</span>
<span class="text">الرئيسية</span>
</a>

<a href="orders.html">
<span class="icon">▣</span>
<span class="text">الطلبات</span>
</a>

<a href="products.html">
<span class="icon">□</span>
<span class="text">المنتجات</span>
</a>

<a href="add-product.html">
<span class="icon">＋</span>
<span class="text">إضافة منتج</span>
</a>

<a href="delivery.html">
<span class="icon">🚚</span>
<span class="text">أسعار التوصيل</span>
</a>

<a href="stores.html">
<span class="icon">🏪</span>
<span class="text">المتاجر</span>
</a>

<a href="settings.html">
<span class="icon">⚙</span>
<span class="text">الإعدادات</span>
</a>

</div>
</div>

<div class="content">

<div class="header">

<h1>➕ إضافة منتج</h1>

<p>إضافة منتج جديد إلى متجر G-Glam</p>

</div>

<div class="box">

<div id="success" class="message success"></div>

<div id="error" class="message error"></div>

<label>اسم المنتج</label>

<input
id="name"
type="text"
placeholder="مثال: Lip Gloss"
>

<label>السعر DA</label>

<input
id="price"
type="number"
min="0"
placeholder="مثال: 250"
>

<label>وصف المنتج</label>

<textarea
id="description"
placeholder="اكتب وصف المنتج..."
></textarea>

<label>الألوان</label>

<input
id="colors"
type="text"
placeholder="مثال: Beige,Nude,Pink"
>

<label>المخزون</label>

<input
id="stock"
type="number"
min="0"
placeholder="مثال: 20"
>

<label>صورة المنتج</label>

<input
id="imageFile"
type="file"
accept="image/*"
>

<img
id="preview"
class="preview"
style="display:none;"
alt="معاينة الصورة"
>

<button
id="addBtn"
type="button"
>
➕ إضافة المنتج
</button>

</div>
</div>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig={

apiKey:"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:"g-glam.firebaseapp.com",

projectId:"g-glam",

storageBucket:"g-glam.firebasestorage.app",

messagingSenderId:"997228419719",

appId:"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:"G-WX1K1F83F6"

};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

let selectedImage=null;

const imageFile=
document.getElementById("imageFile");

const preview=
document.getElementById("preview");

imageFile.addEventListener("change",()=>{

selectedImage=imageFile.files[0]||null;

if(!selectedImage){

preview.style.display="none";

return;

}

const reader=new FileReader();

reader.onload=e=>{

preview.src=e.target.result;

preview.style.display="block";

};

reader.readAsDataURL(selectedImage);

});

document
.getElementById("addBtn")
.addEventListener("click",addProduct);

async function addProduct(){

const button=
document.getElementById("addBtn");

const name=
document.getElementById("name")
.value.trim();

const price=
Number(
document.getElementById("price").value
);

const description=
document.getElementById("description")
.value.trim();

const colors=
document.getElementById("colors")
.value
.split(",")
.map(x=>x.trim())
.filter(x=>x);

const stock=
Number(
document.getElementById("stock").value
);

if(!name){

showError("يرجى إدخال اسم المنتج");

return;

}

if(!price || price<0){

showError("يرجى إدخال سعر صحيح");

return;

}

if(stock<0){

showError("المخزون غير صحيح");

return;

}

if(!selectedImage){

showError("يرجى اختيار صورة المنتج");

return;

}

button.disabled=true;

button.textContent="⏳ جاري إضافة المنتج...";

try{

/* رفع الصورة إلى Cloudinary */

const formData=new FormData();

formData.append(
"file",
selectedImage
);

formData.append(
"upload_preset",
"gglam_products"
);

const response=await fetch(

"https://api.cloudinary.com/v1_1/g82dvrkr/image/upload",

{
method:"POST",
body:formData
}

);

if(!response.ok){

throw new Error(
"فشل رفع الصورة"
);

}

const imageData=
await response.json();

const imageUrl=
imageData.secure_url;

if(!imageUrl){

throw new Error(
"لم يتم الحصول على رابط الصورة"
);

}

/* إضافة المنتج إلى Firestore */

await addDoc(

collection(db,"products"),

{

name:name,

price:price,

description:description,

colors:colors,

stock:stock,

image:imageUrl,

storeId:"main-store",

createdAt:serverTimestamp(),

updatedAt:serverTimestamp()

}

);

showSuccess(
"تمت إضافة المنتج بنجاح ✅"
);

/* تنظيف */

document.getElementById("name").value="";

document.getElementById("price").value="";

document.getElementById("description").value="";

document.getElementById("colors").value="";

document.getElementById("stock").value="";

imageFile.value="";

preview.src="";

preview.style.display="none";

selectedImage=null;

}

catch(error){

console.error(error);

showError(
"حدث خطأ: "+error.message
);

}

finally{

button.disabled=false;

button.textContent="➕ إضافة المنتج";

}

}

function showSuccess(message){

const element=
document.getElementById("success");

element.textContent=message;

element.style.display="block";

document.getElementById("error")
.style.display="none";

}

function showError(message){

const element=
document.getElementById("error");

element.textContent=message;

element.style.display="block";

document.getElementById("success")
.style.display="none";

}

</script>

</body>
</html>
