<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-Glam | أسعار التوصيل</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f5f5f5;
color:#222;
}

/* SIDEBAR */

.sidebar{
position:fixed;
right:0;
top:0;
height:100vh;
width:70px;
background:#111;
color:white;
overflow:hidden;
transition:.3s;
z-index:1000;
}

.sidebar:hover{
width:230px;
}

.logo{
height:70px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
border-bottom:1px solid #333;
white-space:nowrap;
}

.menu{
margin-top:20px;
}

.menu a{
display:flex;
align-items:center;
gap:15px;
padding:15px;
color:white;
text-decoration:none;
white-space:nowrap;
}

.menu a:hover{
background:#222;
}

.icon{
min-width:35px;
text-align:center;
font-size:20px;
}

.text{
opacity:0;
transition:.3s;
}

.sidebar:hover .text{
opacity:1;
}

/* CONTENT */

.content{
margin-right:70px;
padding:20px;
}

.header{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-bottom:20px;
}

.header h1{
margin:0;
font-size:28px;
}

.header p{
color:#777;
margin-bottom:0;
}

/* BOX */

.box{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}

.top h2{
margin:0;
}

.top-buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.add-btn,
.import-btn{
border:none;
padding:12px 18px;
border-radius:8px;
cursor:pointer;
font-size:15px;
}

.add-btn{
background:#111;
color:white;
}

.import-btn{
background:#B89B7A;
color:white;
}

.import-btn:disabled{
opacity:.6;
cursor:not-allowed;
}

/* SEARCH */

.search{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
margin-bottom:15px;
outline:none;
}

/* TABLE */

.table-container{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:650px;
}

th,
td{
padding:14px 10px;
border-bottom:1px solid #eee;
text-align:center;
}

th{
background:#f7f7f7;
}

.edit-btn{
background:#eee;
border:none;
padding:8px 12px;
border-radius:7px;
cursor:pointer;
margin-left:5px;
}

.delete-btn{
background:#f1dede;
color:#9b3030;
border:none;
padding:8px 12px;
border-radius:7px;
cursor:pointer;
}

.empty{
text-align:center;
padding:30px;
color:#777;
}

/* MESSAGES */

.message{
display:none;
padding:12px;
border-radius:8px;
margin-bottom:15px;
text-align:center;
}

.success{
background:#d4edda;
color:#155724;
}

.error{
background:#f8d7da;
color:#721c24;
}

/* MODAL */

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
align-items:center;
justify-content:center;
z-index:2000;
padding:20px;
}

.modal.active{
display:flex;
}

.modal-box{
background:white;
width:100%;
max-width:450px;
border-radius:15px;
padding:25px;
}

.modal-box h2{
margin-top:0;
margin-bottom:20px;
}

.form-group{
margin-bottom:15px;
}

.form-group label{
display:block;
font-weight:bold;
margin-bottom:7px;
}

.form-group input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

.form-group input:disabled{
background:#eee;
}

.buttons{
display:flex;
gap:10px;
margin-top:20px;
}

.buttons button{
flex:1;
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
}

.save{
background:#111;
color:white;
}

.cancel{
background:#eee;
}

.save:disabled{
opacity:.6;
cursor:not-allowed;
}

/* MOBILE */

@media(max-width:700px){

.sidebar{
width:60px;
}

.sidebar:hover{
width:200px;
}

.content{
margin-right:60px;
padding:10px;
}

.top{
align-items:stretch;
}

.top-buttons{
width:100%;
}

.add-btn,
.import-btn{
flex:1;
}

}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">
G-Glam
</div>

<div class="menu">

<a href="index.html">
<span class="icon">⌂</span>
<span class="text">الرئيسية</span>
</a>

<a href="orders.html">
<span class="icon">▣</span>
<span class="text">الطلبات</span>
</a>

<a href="products.html">
<span class="icon">□</span>

<a href="add-product.html">
<span class="icon">+</span>

<a href="delivery.html">

<a href="settings.html">
<span class="icon">⚙</span>
<span class="text">الإعدادات</span>
</a>

</div>

</div>


<!-- CONTENT -->

<div class="content">

<div class="header">

<h1>
🚚 أسعار التوصيل
</h1>

<p>
إدارة أسعار التوصيل حسب الولاية
</p>

</div>


<div class="box">

<div class="top">

<h2>
ولايات التوصيل
</h2>

<div class="top-buttons">

<button
class="import-btn"
id="importBtn">

📥 استيراد الأسعار الحالية

</button>

<button
class="add-btn"
id="addBtn">

➕ إضافة ولاية

</button>

</div>

</div>


<div
id="success"
class="message success">
</div>

<div
id="error"
class="message error">
</div>


<input
id="searchInput"
class="search"
type="search"
placeholder="🔎 البحث عن ولاية...">


<div class="table-container">

<table>

<thead>

<tr>

<th>
#
</th>

<th>
الولاية
</th>

<th>
إلى المكتب
</th>

<th>
إلى المنزل
</th>

<th>
الإجراءات
</th>

</tr>

</thead>

<tbody id="deliveryList">

<tr>

<td colspan="5" class="empty">

⏳ جاري تحميل الولايات...

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>


<!-- MODAL -->

<div
class="modal"
id="modal">

<div class="modal-box">

<h2 id="modalTitle">
إضافة ولاية
</h2>


<div class="form-group">

<label>
اسم الولاية
</label>

<input
type="text"
id="wilaya"
placeholder="مثال: Batna">

</div>


<div class="form-group">

<label>
سعر التوصيل إلى المكتب DA
</label>

<input
type="number"
id="office"
placeholder="مثال: 400"
min="0">

</div>


<div class="form-group">

<label>
سعر التوصيل إلى المنزل DA
</label>

<input
type="number"
id="home"
placeholder="مثال: 500"
min="0">

</div>


<div class="buttons">

<button
class="cancel"
id="cancelBtn">

إلغاء

</button>

<button
class="save"
id="saveBtn">

💾 حفظ

</button>

</div>

</div>

</div>


<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
collection,
getDocs,
doc,
setDoc,
deleteDoc

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* CURRENT TARIFFS */

const tarifs = {

"Adrar":{office:1100,home:1400},
"Chlef":{office:450,home:650},
"Laghouat":{office:700,home:1000},
"Oum El Bouaghi":{office:500,home:650},
"Batna":{office:400,home:500},
"Bejaia":{office:500,home:650},
"Biskra":{office:600,home:950},
"Bechar":{office:1100,home:1400},
"Blida":{office:450,home:650},
"Bouira":{office:450,home:650},
"Tamanrasset":{office:1400,home:1600},
"Tebessa":{office:600,home:950},
"Tlemcen":{office:500,home:650},
"Tiaret":{office:500,home:650},
"Tizi Ouzou":{office:450,home:650},
"Alger":{office:450,home:700},
"Djelfa":{office:600,home:900},
"Jijel":{office:500,home:650},
"Setif":{office:450,home:650},
"Saida":{office:600,home:900},
"Skikda":{office:500,home:650},
"Sidi Bel Abbes":{office:500,home:650},
"Annaba":{office:500,home:650},
"Guelma":{office:600,home:900},
"Constantine":{office:450,home:650},
"Medea":{office:450,home:650},
"Mostaganem":{office:500,home:650},
"M'Sila":{office:500,home:650},
"Mascara":{office:600,home:900},
"Ouargla":{office:800,home:1100},
"Oran":{office:450,home:650},
"El Bayadh":{office:800,home:1100},
"Illizi":{office:1700,home:2000},
"Bordj Bou Arreridj":{office:450,home:650},
"Boumerdes":{office:450,home:650},
"El Tarf":{office:600,home:950},
"Tindouf":{office:1400,home:1600},
"Tissemsilt":{office:500,home:650},
"El Oued":{office:800,home:1100},
"Khenchela":{office:600,home:900},
"Souk Ahras":{office:600,home:900},
"Tipaza":{office:450,home:650},
"Mila":{office:500,home:650},
"Ain Defla":{office:450,home:650},
"Naama":{office:800,home:1100},
"Ain Temouchent":{office:600,home:900},
"Ghardaia":{office:800,home:1100},
"Relizane":{office:500,home:650},
"El M'Ghair":{office:1100,home:1400},
"El Menia":{office:1700,home:2000},
"Ouled Djellal":{office:700,home:1000},
"Bordj Badji Mokhtar":{office:1000,home:1400},
"Beni Abbes":{office:1100,home:1400},
"Timimoun":{office:1700,home:2000},
"Touggourt":{office:800,home:1100},
"Djanet":{office:1700,home:2000},
"In Salah":{office:800,home:1100},
"In Guezzam":{office:1000,home:1300},

/* الأسعار الخاصة */

"Zana el beida":{office:50,home:50},
"Ain Djasser":{office:150,home:150},
"Seriana":{office:150,home:150}

};


/* ORDER */

const wilayaOrder = Object.keys(tarifs);


/* ELEMENTS */

const list =
document.getElementById("deliveryList");

const searchInput =
document.getElementById("searchInput");

const modal =
document.getElementById("modal");

const wilayaInput =
document.getElementById("wilaya");

const officeInput =
document.getElementById("office");

const homeInput =
document.getElementById("home");

const modalTitle =
document.getElementById("modalTitle");

const saveBtn =
document.getElementById("saveBtn");

let editingId=null;
let deliveryItems=[];


/* LOAD */

async function loadDelivery(){

list.innerHTML=`

<tr>
<td colspan="5" class="empty">
⏳ جاري التحميل...
</td>
</tr>

`;

try{

const snapshot =
await getDocs(
collection(db,"delivery")
);

deliveryItems=[];

snapshot.forEach(item=>{

deliveryItems.push({

id:item.id,
...item.data()

});

});


deliveryItems.sort((a,b)=>{

const indexA =
wilayaOrder.indexOf(a.id);

const indexB =
wilayaOrder.indexOf(b.id);

if(indexA===-1)
return 1;

if(indexB===-1)
return -1;

return indexA-indexB;

});


displayDelivery();

}

catch(error){

console.error(error);

list.innerHTML=`

<tr>

<td colspan="5" class="empty">

❌ حدث خطأ أثناء تحميل الأسعار

<br><br>

${escapeHtml(error.message)}

</td>

</tr>

`;

}

}


/* DISPLAY */

function displayDelivery(){

const value =
searchInput.value
.trim()
.toLowerCase();


const filtered =
deliveryItems.filter(item=>
item.id.toLowerCase()
.includes(value)
);


list.innerHTML="";


if(filtered.length===0){

list.innerHTML=`

<tr>

<td colspan="5" class="empty">

📭 لا توجد ولاية

</td>

</tr>

`;

return;

}


filtered.forEach((item,index)=>{

const originalIndex =
wilayaOrder.indexOf(item.id);


const number =
originalIndex===-1
?index+1
:originalIndex+1;


const row =
document.createElement("tr");


row.innerHTML=`

<td>

<strong>
${String(number).padStart(2,"0")}
</strong>

</td>

<td>

<strong>
${escapeHtml(item.id)}
</strong>

</td>

<td>
${Number(item.office||0)} DA
</td>

<td>
${Number(item.home||0)} DA
</td>

<td>

<button
class="edit-btn"
data-action="edit"
data-id="${escapeAttribute(item.id)}">

✏️ تعديل

</button>

<button
class="delete-btn"
data-action="delete"
data-id="${escapeAttribute(item.id)}">

🗑️ حذف

</button>

</td>

`;

list.appendChild(row);

});

}


/* ADD */

document
.getElementById("addBtn")
.addEventListener(
"click",
()=>{

editingId=null;

modalTitle.textContent=
"إضافة ولاية";

wilayaInput.value="";
officeInput.value="";
homeInput.value="";

wilayaInput.disabled=false;

modal.classList.add("active");

});


/* CANCEL */

document
.getElementById("cancelBtn")
.addEventListener(
"click",
closeModal
);


function closeModal(){

modal.classList.remove("active");

}


/* EDIT / DELETE */

list.addEventListener(
"click",
async event=>{

const button =
event.target.closest("button");

if(!button)
return;


const id =
button.dataset.id;

const action =
button.dataset.action;


if(action==="edit"){

const item =
deliveryItems.find(
x=>x.id===id
);

if(!item){

alert(
"لم يتم العثور على الولاية"
);

return;

}

editingId=id;

modalTitle.textContent=
"تعديل أسعار "+id;

wilayaInput.value=id;

officeInput.value=
item.office ?? 0;

homeInput.value=
item.home ?? 0;

wilayaInput.disabled=true;

modal.classList.add("active");

}


if(action==="delete"){

const ok =
confirm(
"هل تريد حذف أسعار التوصيل لولاية:\n\n"+
id+
"؟"
);

if(!ok)
return;


try{

await deleteDoc(
doc(
db,
"delivery",
id
)
);

showMessage(
"تم حذف الولاية بنجاح ✅",
true
);

await loadDelivery();

}
catch(error){

console.error(error);

showMessage(
"حدث خطأ أثناء الحذف: "+
error.message,
false
);

}

}

});


/* SAVE */

saveBtn.addEventListener(
"click",
async()=>{

const wilaya =
wilayaInput.value.trim();

const officeValue =
officeInput.value;

const homeValue =
homeInput.value;


if(!wilaya){

alert(
"يرجى إدخال اسم الولاية"
);

return;

}


if(
officeValue==="" ||
homeValue===""
){

alert(
"يرجى إدخال سعر المكتب والمنزل"
);

return;

}


const office =
Number(officeValue);

const home =
Number(homeValue);


if(
isNaN(office) ||
isNaN(home) ||
office<0 ||
home<0
){

alert(
"يرجى إدخال أسعار صحيحة"
);

return;

}


try{

saveBtn.disabled=true;

saveBtn.textContent=
"⏳ جاري الحفظ...";


/* ADD */

if(!editingId){

const exists =
deliveryItems.some(
item=>
item.id.toLowerCase()===
wilaya.toLowerCase()
);

if(exists){

alert(
"هذه الولاية موجودة بالفعل"
);

saveBtn.disabled=false;

saveBtn.textContent=
"💾 حفظ";

return;

}


await setDoc(

doc(
db,
"delivery",
wilaya
),

{

office:office,
home:home

}

);

showMessage(
"تمت إضافة الولاية بنجاح ✅",
true
);

}


/* EDIT */

else{

await setDoc(

doc(
db,
"delivery",
editingId
),

{

office:office,
home:home

}

);

showMessage(
"تم تعديل الأسعار بنجاح ✅",
true
);

}


closeModal();

await loadDelivery();

}

catch(error){

console.error(error);

showMessage(
"❌ حدث خطأ: "+
error.message,
false
);

}

finally{

saveBtn.disabled=false;

saveBtn.textContent=
"💾 حفظ";

}

});


/* IMPORT */

document
.getElementById("importBtn")
.addEventListener(
"click",
importTarifs
);


async function importTarifs(){

const ok =
confirm(

"سيتم استيراد جميع الولايات والأسعار الحالية إلى Firebase.\n\n"+
"إذا كانت الولاية موجودة سيتم تحديث سعرها.\n\n"+
"هل تريد المتابعة؟"

);

if(!ok)
return;


const button =
document.getElementById("importBtn");

button.disabled=true;

button.textContent=
"⏳ جاري الاستيراد...";


try{

let count=0;


for(
const [wilaya,prices]
of Object.entries(tarifs)
){

await setDoc(

doc(
db,
"delivery",
wilaya
),

{

office:prices.office,
home:prices.home

}

);

count++;

}


showMessage(
"تم استيراد "+count+" ولاية بنجاح ✅",
true
);

await loadDelivery();

}

catch(error){

console.error(error);

showMessage(
"❌ فشل الاستيراد: "+
error.message,
false
);

}

finally{

button.disabled=false;

button.textContent=
"📥 استيراد الأسعار الحالية";

}

}


/* SEARCH */

searchInput.addEventListener(
"input",
displayDelivery
);


/* MESSAGES */

function showMessage(
text,
success
){

const element =
document.getElementById(
success
?"success"
:"error"
);

const other =
document.getElementById(
success
?"error"
:"success"
);

other.style.display="none";

element.textContent=text;

element.style.display="block";


setTimeout(()=>{

element.style.display="none";

},3000);

}


/* ESCAPE */

function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function escapeAttribute(value){

return escapeHtml(value);

}


/* START */

loadDelivery();

</script>

</body>
</html>
