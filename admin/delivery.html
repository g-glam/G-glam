<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

collection,
getDocs,

}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:"g-glam.firebaseapp.com",

projectId:"g-glam",

storageBucket:"g-glam.firebasestorage.app",

messagingSenderId:"997228419719",

appId:"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:"G-WX1K1F83F6"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


let editingId=null;


const tarifs={

"Zana el beida":{office:50,home:50},
"Ain Djasser":{office:150,home:150},
"Seriana":{office:150,home:150},

"Adrar":{office:1100,home:1400},
"Chlef":{office:450,home:650},
"Laghouat":{office:700,home:1000},

"Bouira":{office:450,home:650},
"Tamanrasset":{office:1400,home:1600},
"Tebessa":{office:600,home:950},
"Tlemcen":{office:500,home:650},
"Tiaret":{office:500,home:650},
"Tizi Ouzou":{office:450,home:650},
"Alger":{office:450,home:700},
"Djelfa":{office:600,home:900},
"Jijel":{office:500,home:650},
"Setif":{office:450,home:650},
"Saida":{office:600,home:900},
"Skikda":{office:500,home:650},
"Sidi Bel Abbes":{office:500,home:650},
"Annaba":{office:500,home:650},
"Guelma":{office:600,home:900},
"Constantine":{office:450,home:650},
"Medea":{office:450,home:650},
"Mostaganem":{office:500,home:650},
"M'Sila":{office:500,home:650},
"Mascara":{office:600,home:900},
"Ouargla":{office:800,home:1100},
"Oran":{office:450,home:650},
"El Bayadh":{office:800,home:1100},
"Illizi":{office:1700,home:2000},
"Bordj Bou Arreridj":{office:450,home:650},
"Boumerdes":{office:450,home:650},
"El Tarf":{office:600,home:950},
"Tindouf":{office:1400,home:1600},
"Tissemsilt":{office:500,home:650},
"El Oued":{office:800,home:1100},
"Khenchela":{office:600,home:900},
"Souk Ahras":{office:600,home:900},

"Naama":{office:800,home:1100},
"Ain Temouchent":{office:600,home:900},
"Ghardaia":{office:800,home:1100},
"Relizane":{office:500,home:650},

"El Menia":{office:1700,home:2000},
"Ouled Djellal":{office:700,home:1000},
"Bordj Badji Mokhtar":{office:1000,home:1400},
"Beni Abbes":{office:1100,home:1400},
"Timimoun":{office:1700,home:2000},
"Touggourt":{office:800,home:1100},
"Djanet":{office:1700,home:2000},
"In Salah":{office:800,home:1100},
"In Guezzam":{office:1000,home:1300}

};


const wilayaOrder=Object.keys(tarifs);


function showMessage(text,success){

const s=document.getElementById("success");

const e=document.getElementById("error");

s.style.display="none";

e.style.display="none";

if(success){

s.textContent=text;

s.style.display="block";

}else{

e.textContent=text;

e.style.display="block";

}

setTimeout(()=>{

s.style.display="none";
e.style.display="none";

},3000);

}


async function loadDelivery(){

const list=
document.getElementById("deliveryList");

list.innerHTML=`
<tr>
<td colspan="4">⏳ جاري التحميل...</td>
</tr>
`;

try{

const snapshot=
await getDocs(collection(db,"delivery"));

list.innerHTML="";


if(snapshot.empty){

list.innerHTML=`
<tr>
<td colspan="4">
لا توجد ولايات.
</td>
</tr>
`;

return;

}


const items=[];

snapshot.forEach(item=>{

items.push({
id:item.id,
...item.data()
});

});


items.sort((a,b)=>{

let A=wilayaOrder.indexOf(a.id);

let B=wilayaOrder.indexOf(b.id);

if(A===-1)return 1;

if(B===-1)return -1;

return A-B;

});


items.forEach((item,index)=>{

const row=
document.createElement("tr");

row.innerHTML=`

<td>
<strong>
${String(index+1).padStart(2,"0")}
</strong>
-
${escapeHtml(item.id)}
</td>

<td>
${Number(item.office || 0)} DA
</td>

<td>
${Number(item.home || 0)} DA
</td>

<td>

<button
class="edit-btn"
data-id="${escapeHtml(item.id)}">

✏️ تعديل

</button>

<button
class="delete-btn"
data-id="${escapeHtml(item.id)}">

🗑️ حذف

</button>

</td>

`;

row.querySelector(".edit-btn")
.addEventListener("click",()=>{
editDelivery(item.id);
});

row.querySelector(".delete-btn")
.addEventListener("click",()=>{
deleteDelivery(item.id);
});

list.appendChild(row);

});

}

catch(error){

console.error(error);

showMessage(
"حدث خطأ أثناء تحميل الأسعار.",
false
);

}

}


window.openAdd=function(){

editingId=null;

document.getElementById("modalTitle")
.textContent="إضافة ولاية";

document.getElementById("wilaya")
.value="";

document.getElementById("office")
.value="";

document.getElementById("home")
.value="";

document.getElementById("wilaya")
.disabled=false;

document.getElementById("modal")
.classList.add("active");

};


window.closeModal=function(){

document.getElementById("modal")
.classList.remove("active");

};


async function editDelivery(id){

try{

const snap=
await getDocs(collection(db,"delivery"));

let found=null;

snap.forEach(item=>{

if(item.id===id){
found=item.data();
}

});


if(!found){

alert("الولاية غير موجودة.");

return;

}


editingId=id;

document.getElementById("modalTitle")
.textContent=
"تعديل أسعار "+id;

document.getElementById("wilaya")
.value=id;

document.getElementById("office")
.value=found.office || 0;

document.getElementById("home")
.value=found.home || 0;

document.getElementById("wilaya")
.disabled=true;

document.getElementById("modal")
.classList.add("active");

}
catch(error){

console.error(error);

alert("حدث خطأ.");

}

}


window.saveDelivery=async function(){

const wilaya=
document.getElementById("wilaya")
.value.trim();

const officeInput=
document.getElementById("office").value;

const homeInput=
document.getElementById("home").value;


if(!wilaya){

alert("أدخل اسم الولاية.");

return;

}


if(
officeInput==="" ||
homeInput===""
){

alert("أدخل السعرين.");

return;

}


const office=Number(officeInput);

const home=Number(homeInput);


if(office<0 || home<0){

alert("السعر لا يمكن أن يكون سالبًا.");

return;

}


try{

if(!editingId){

const snap=
await getDocs(collection(db,"delivery"));

let exists=false;

snap.forEach(item=>{

if(
item.id.toLowerCase()===
wilaya.toLowerCase()
){

exists=true;

}

});


if(exists){

alert("هذه الولاية موجودة بالفعل.");

return;

}


await setDoc(
doc(db,"delivery",wilaya),
{
office:office,
home:home
}
);

showMessage(
"تمت إضافة الولاية بنجاح ✅",
true
);

}else{

await setDoc(
doc(db,"delivery",editingId),
{
office:office,
home:home
}
);

showMessage(
"تم تعديل الأسعار بنجاح ✅",
true
);

}


closeModal();

await loadDelivery();

}
catch(error){

console.error(error);

showMessage(
"حدث خطأ: "+error.message,
false
);

}

};


async function deleteDelivery(id){

if(!confirm(
"هل تريد حذف أسعار "+id+"؟"
))return;


try{

await deleteDoc(
doc(db,"delivery",id)
);

showMessage(
"تم الحذف بنجاح 🗑️",
true
);

await loadDelivery();

}
catch(error){

console.error(error);

showMessage(
"فشل الحذف.",
false
);

}

}


async function importAllTarifs(){

if(!confirm(
"سيتم إضافة/تحديث جميع أسعار الولايات. هل تريد المتابعة؟"
))return;


const button=
document.getElementById("importBtn");

button.disabled=true;

button.textContent=
"⏳ جاري الاستيراد...";


try{

let count=0;

for(
const [wilaya,prices]
of Object.entries(tarifs)
){

await setDoc(
doc(db,"delivery",wilaya),
{
office:prices.office,
home:prices.home
}
);

count++;

}


alert(
"تم استيراد "+count+" ولاية بنجاح ✅"
);

await loadDelivery();

}
catch(error){

console.error(error);

alert(
"حدث خطأ أثناء الاستيراد."
);

}
finally{

button.disabled=false;

button.textContent=
"📥 استيراد الأسعار الحالية";

}

}


document
.getElementById("importBtn")
.addEventListener(
"click",
importAllTarifs
);


function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


onAuthStateChanged(auth,user=>{

if(!user){

window.location.href="store-login.html";

return;

}

loadDelivery();

});

</script>
