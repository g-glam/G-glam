const deliveryList =

/* =========================
   تحميل الولايات
========================= */

async function loadDelivery(){

deliveryList.innerHTML = `

<tr>

<td colspan="5">

⏳ جاري التحميل...

</td>

</tr>

`;

try{


const snapshot =
await getDocs(

collection(
db,
"delivery"
)

);


deliveryItems = [];


snapshot.forEach(item=>{

deliveryItems.push({

id:item.id,

...item.data()

});

});


sortDelivery();

renderDelivery();


}

catch(error){

console.error(error);

deliveryList.innerHTML = `

<tr>

<td colspan="5">

❌ حدث خطأ أثناء تحميل الولايات

</td>

</tr>

`;

}

}


/* =========================
   ترتيب
========================= */

function sortDelivery(){

deliveryItems.sort(
(a,b)=>{

const indexA =
wilayaOrder.indexOf(a.id);

const indexB =
wilayaOrder.indexOf(b.id);


if(indexA === -1 &&
indexB === -1){

return a.id.localeCompare(
b.id
);

}


if(indexA === -1){

return 1;

}


if(indexB === -1){

return -1;

}


return indexA - indexB;

});

}


/* =========================
   عرض الولايات
========================= */

function renderDelivery(){

const search =
searchInput.value
.trim()
.toLowerCase();


const filtered =
deliveryItems.filter(item=>{

return item.id
.toLowerCase()
.includes(search);

});


deliveryList.innerHTML = "";


if(filtered.length === 0){

deliveryList.innerHTML = `

<tr>

<td
colspan="5"
class="empty">

لا توجد ولاية مطابقة 🔎

</td>

</tr>

`;

return;

}


filtered.forEach((item,index)=>{


const originalIndex =
wilayaOrder.indexOf(item.id);


const number =
originalIndex >= 0
?
originalIndex + 1
:
index + 1;


const row =
document.createElement("tr");


row.innerHTML = `

<td>

<strong>
${String(number).padStart(2,"0")}
</strong>

</td>

<td>

<strong>
${escapeHtml(item.id)}
</strong>

</td>

<td>

${Number(item.office || 0)}
 DA

</td>

<td>

${Number(item.home || 0)}
 DA

</td>

<td>

<button
class="edit-btn"
data-id="${escapeAttr(item.id)}">

✏️ تعديل

</button>


<button
class="delete-btn"
data-id="${escapeAttr(item.id)}">

🗑️ حذف

</button>

</td>

`;


deliveryList.appendChild(row);

});

}

/* =========================

========================= */

deliveryList.addEventListener(
"click",
async(event)=>{


const button =
event.target.closest("button");


if(!button){

return;

}


const id =
button.dataset.id;


if(button.classList.contains(
"edit-btn"
)){

editDelivery(id);

}


if(button.classList.contains(
"delete-btn"
)){

deleteDelivery(id);

}

});


/* =========================
   تعديل ولاية
========================= */

function editDelivery(id){

const item =
deliveryItems.find(
item=>item.id === id
);


if(!item){

alert(
"لم يتم العثور على الولاية."
);

return;

}


editingId = id;


modalTitle.textContent =
"تعديل أسعار "+id;


wilayaInput.value =
id;


officeInput.value =
item.office || 0;


homeInput.value =
item.home || 0;


wilayaInput.disabled =
true;


modal.classList.add(
"active"
);

}


/* =========================
   حفظ
========================= */

saveBtn.addEventListener(
"click",
saveDelivery
);


async function saveDelivery(){


const wilaya =
wilayaInput.value.trim();


const officeValue =
officeInput.value;


const homeValue =
homeInput.value;


if(!wilaya){

alert(
"يرجى إدخال اسم الولاية."
);

return;

}


if(
officeValue === "" ||
homeValue === ""
){

alert(
"يرجى إدخال سعر المكتب وسعر المنزل."
);

return;

}


const office =
Number(officeValue);


const home =
Number(homeValue);


if(
Number.isNaN(office) ||
Number.isNaN(home)
){

alert(
"يرجى إدخال أسعار صحيحة."
);

return;

}


if(
office < 0 ||
home < 0
){

alert(
"السعر لا يمكن أن يكون سالبًا."
);

return;

}


saveBtn.disabled =
true;

saveBtn.textContent =
"⏳ جاري الحفظ...";


try{


/* إضافة */

if(!editingId){


const exists =
deliveryItems.some(
item=>
item.id.toLowerCase()
===
wilaya.toLowerCase()
);


if(exists){

alert(
"هذه الولاية موجودة بالفعل."
);

return;

}


await setDoc(

doc(
db,
"delivery",
wilaya
),

{

office:office,

home:home

}

);


showMessage(
"تمت إضافة الولاية بنجاح ✅",
true
);

}


/* تعديل */

else{


await setDoc(

doc(
db,
"delivery",
editingId
),

{

office:office,

home:home

}

);


showMessage(
"تم تعديل أسعار الولاية بنجاح ✅",
true
);

}


closeModal();

await loadDelivery();


}

catch(error){

console.error(error);

showMessage(
"حدث خطأ أثناء الحفظ: "+
error.message,
false
);

}

finally{

saveBtn.disabled =
false;

saveBtn.textContent =
"💾 حفظ";

}

}

async function deleteDelivery(id){


const confirmed =

id+
"\n\nسيتم حذف أسعار التوصيل الخاصة بها."

if(!confirmed){

return;

}


try{


await deleteDoc(

doc(
db,
"delivery",
id
)

);


showMessage(
"تم حذف الولاية بنجاح 🗑️",
true
);


await loadDelivery();


}

catch(error){

console.error(error);

showMessage(
"حدث خطأ أثناء الحذف: "+
error.message,
false
);

}

}

   استيراد الأسعار
========================= */

document
.getElementById("importBtn")
.addEventListener(
"click",
importAllTarifs
);


async function importAllTarifs(){


const confirmed =
confirm(

"سيتم إضافة جميع الولايات والأسعار الموجودة في القائمة إلى Firebase.\n\n"+
"إذا كانت الولاية موجودة سيتم تحديث سعرها.\n\n"+
"هل تريد المتابعة؟"

);


if(!confirmed){

return;

}


const button =
document.getElementById(
"importBtn"
);


button.disabled =
true;

button.textContent =
"⏳ جاري الاستيراد...";


try{


let count = 0;


for(
const [wilaya,prices]
of Object.entries(tarifs)
){


await setDoc(

doc(
db,
"delivery",
wilaya
),

{

office:
prices.office,

home:
prices.home

}

);


count++;

}


showMessage(

"تم استيراد "+
count+
" ولاية بنجاح ✅",

true

);


await loadDelivery();


}

catch(error){

console.error(error);

showMessage(

"حدث خطأ أثناء الاستيراد: "+
error.message,

false

);

}

finally{

button.disabled =
false;

button.textContent =
"📥 استيراد الأسعار الحالية";

}

}


/* =========================
   الرسائل
========================= */

function showMessage(
text,
success
){

const successBox =
document.getElementById(
"success"
);

const errorBox =
document.getElementById(
"error"
);


successBox.style.display =
"none";

errorBox.style.display =
"none";


if(success){

successBox.textContent =
text;

successBox.style.display =
"block";

}

else{

errorBox.textContent =
text;

errorBox.style.display =
"block";

}


setTimeout(()=>{

successBox.style.display =
"none";

errorBox.style.display =
"none";

},4000);

}


/* =========================
   حماية HTML
========================= */

function escapeHtml(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


function escapeAttr(value){

return escapeHtml(value);

}

loadDelivery();
