<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | لوحة تحكم الأدمن</title>

<style>

/* =========================
   GENERAL
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f0e8;
color:#222;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{

position:fixed;
right:0;
top:0;

width:250px;
height:100vh;

background:#111;
color:white;

padding:20px;

z-index:1000;

}

.logo{

font-size:24px;
font-weight:bold;

text-align:center;

padding:15px 0 25px;

border-bottom:1px solid #333;

margin-bottom:20px;

}

.menu a{

display:block;

color:white;

text-decoration:none;

padding:14px;

border-radius:10px;

margin-bottom:8px;

background:#1d1d1d;

}

.menu a:hover{

background:#333;

}

.menu a.active{

background:#b89b7a;

}

/* =========================
   CONTENT
========================= */

.content{

margin-right:250px;

padding:25px;

}

/* =========================
   HEADER
========================= */

.header{

background:white;

border-radius:18px;

padding:25px;

margin-bottom:20px;

box-shadow:
0 3px 15px rgba(0,0,0,.06);

}

.header h1{

font-size:28px;

margin-bottom:8px;

}

.header p{

color:#777;

}

/* =========================
   STATS
========================= */

.stats{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:15px;

margin-bottom:20px;

}

.stat{

background:white;

padding:20px;

border-radius:18px;

box-shadow:
0 3px 15px rgba(0,0,0,.06);

}

.stat-title{

color:#777;

font-size:14px;

margin-bottom:10px;

}

.stat-value{

font-size:28px;

font-weight:bold;

}

/* =========================
   SEARCH
========================= */

.search-box{

background:white;

padding:15px;

border-radius:15px;

margin-bottom:20px;

}

.search-box input{

width:100%;

padding:13px;

border:1px solid #ddd;

border-radius:10px;

font-size:16px;

}

/* =========================
   STORE GRID
========================= */

.stores{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:20px;

}

/* =========================
   STORE CARD
========================= */

.store-card{

background:white;

border-radius:18px;

padding:18px;

box-shadow:
0 3px 15px rgba(0,0,0,.06);

}

.store-card h2{

font-size:20px;

margin-bottom:15px;

}

.info{

margin-bottom:9px;

color:#555;

line-height:1.5;

}

.info strong{

color:#222;

}

/* =========================
   STATUS
========================= */

.status{

display:inline-block;

padding:7px 13px;

border-radius:20px;

font-size:13px;

margin:10px 0;

}

.status-pending{

background:#fff3cd;

color:#856404;

}

.status-approved{

background:#d4edda;

color:#155724;

}

.status-rejected{

background:#f8d7da;

color:#721c24;

}

/* =========================
   RECEIPT
========================= */

.receipt{

margin-top:15px;

padding-top:15px;

border-top:1px solid #eee;

}

.receipt-title{

font-weight:bold;

margin-bottom:10px;

}

.receipt img{

width:100%;

height:250px;

object-fit:contain;

background:#f5f5f5;

border-radius:12px;

border:1px solid #ddd;

cursor:pointer;

}

/* =========================
   BUTTONS
========================= */

.buttons{

display:flex;

gap:8px;

margin-top:15px;

}

.buttons button{

flex:1;

border:none;

padding:11px;

border-radius:9px;

cursor:pointer;

font-size:14px;

}

.approve-btn{

background:#198754;

color:white;

}

.reject-btn{

background:#c62828;

color:white;

}

.delete-btn{

background:#eee;

color:#333;

}

.buttons button:hover{

opacity:.85;

}

/* =========================
   EMPTY
========================= */

.empty{

background:white;

padding:40px;

text-align:center;

border-radius:18px;

color:#777;

grid-column:1/-1;

}

/* =========================
   MODAL
========================= */

.modal{

position:fixed;

inset:0;

background:rgba(0,0,0,.75);

display:none;

align-items:center;

justify-content:center;

padding:20px;

z-index:2000;

}

.modal.active{

display:flex;

}

.modal-content{

position:relative;

max-width:900px;

max-height:90vh;

}

.modal-content img{

max-width:100%;

max-height:85vh;

display:block;

border-radius:12px;

background:white;

}

.close-modal{

position:absolute;

top:-18px;

left:-18px;

width:45px;

height:45px;

border:none;

border-radius:50%;

background:white;

font-size:28px;

cursor:pointer;

}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px){

.stores{

grid-template-columns:
repeat(2,1fr);

}

.stats{

grid-template-columns:
repeat(2,1fr);

}

}

@media(max-width:700px){

.sidebar{

position:relative;

width:100%;

height:auto;

padding:10px;

}

.logo{

padding:10px;

margin-bottom:10px;

}

.menu{

display:grid;

grid-template-columns:
1fr 1fr;

gap:5px;

}

.menu a{

margin:0;

}

.content{

margin-right:0;

padding:10px;

}

.stores{

grid-template-columns:1fr;

}

.stats{

grid-template-columns:
1fr 1fr;

}

}

@media(max-width:450px){

.stats{

grid-template-columns:1fr;

}

}

</style>

</head>


<body>


<!-- =========================
     SIDEBAR
========================= -->

<div class="sidebar">

<div class="logo">

G-Glam Admin

</div>


<div class="menu">

<a
href="admin-dashboard.html"
class="active">

🏠 لوحة التحكم

</a>


<a
href="dashboard.html">

🏪 لوحة المتجر

</a>


<a
href="orders.html">

📦 الطلبات

</a>


<a
href="products.html">

🛍 المنتجات

</a>


<a
href="#"
id="logoutBtn">

🚪 تسجيل الخروج

</a>

</div>

</div>


<!-- =========================
     CONTENT
========================= -->

<div class="content">


<div class="header">

<h1>

لوحة تحكم الأدمن 👑

</h1>

<p>

إدارة المتاجر وطلبات الدفع

</p>

</div>


<!-- =========================
     STATS
========================= -->

<div class="stats">


<div class="stat">

<div class="stat-title">

إجمالي الطلبات

</div>

<div
class="stat-value"
id="totalCount">

0

</div>

</div>


<div class="stat">

<div class="stat-title">

قيد المراجعة

</div>

<div
class="stat-value"
id="pendingCount">

0

</div>

</div>


<div class="stat">

<div class="stat-title">

المتاجر المقبولة

</div>

<div
class="stat-value"
id="approvedCount">

0

</div>

</div>


<div class="stat">

<div class="stat-title">

المرفوضة

</div>

<div
class="stat-value"
id="rejectedCount">

0

</div>

</div>


</div>


<!-- =========================
     SEARCH
========================= -->

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="🔎 البحث عن صاحب متجر أو بريد أو اسم متجر">

</div>


<!-- =========================
     STORES
========================= -->

<div
class="stores"
id="storesContainer">

<div class="empty">

⏳ جاري تحميل طلبات المتاجر...

</div>

</div>


</div>


<!-- =========================
     RECEIPT MODAL
========================= -->

<div
class="modal"
id="receiptModal">


<div class="modal-content">


<button
class="close-modal"
id="closeModal">

×

</button>


<img
id="modalReceipt"
src=""
alt="وصل الدفع">

</div>

</div>


<script type="module">


/* =========================
   FIREBASE
========================= */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,

collection,

getDocs,

doc,

updateDoc,

deleteDoc

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =========================
   CONFIG
========================= */

const firebaseConfig={

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


const app=
initializeApp(
firebaseConfig
);

const db=
getFirestore(app);


/* =========================
   ELEMENTS
========================= */

const storesContainer=
document.getElementById(
"storesContainer"
);

const searchInput=
document.getElementById(
"searchInput"
);

const totalCount=
document.getElementById(
"totalCount"
);

const pendingCount=
document.getElementById(
"pendingCount"
);

const approvedCount=
document.getElementById(
"approvedCount"
);

const rejectedCount=
document.getElementById(
"rejectedCount"
);

const receiptModal=
document.getElementById(
"receiptModal"
);

const modalReceipt=
document.getElementById(
"modalReceipt"
);

const closeModal=
document.getElementById(
"closeModal"
);


let stores=[];


/* =========================
   LOAD STORES
========================= */

async function loadStores(){

try{


const snapshot=
await getDocs(

collection(
db,
"storeApplications"
)

);


stores=[];


snapshot.forEach(
item=>{

stores.push({

id:item.id,

...item.data()

});

});


updateStats();

displayStores(
stores
);


}catch(error){

console.error(error);

storesContainer.innerHTML=`

<div class="empty">

❌ حدث خطأ أثناء تحميل المتاجر

<br><br>

${error.message}

</div>

`;

}

}


/* =========================
   STATS
========================= */

function updateStats(){

totalCount.textContent=
stores.length;


pendingCount.textContent=

stores.filter(
store=>
!store.status ||
store.status==="pending"
).length;


approvedCount.textContent=

stores.filter(
store=>
store.status==="approved"
).length;


rejectedCount.textContent=

stores.filter(
store=>
store.status==="rejected"
).length;

}


/* =========================
   DISPLAY STORES
========================= */

function displayStores(data){

storesContainer.innerHTML="";


if(data.length===0){

storesContainer.innerHTML=`

<div class="empty">

لا توجد نتائج

</div>

`;

return;

}


data.forEach(
store=>{


const card=
document.createElement(
"div"
);

card.className=
"store-card";


/* الحالة */

const status=
store.status ||
"pending";


let statusText=
"قيد المراجعة ⏳";

let statusClass=
"status-pending";


if(status==="approved"){

statusText=
"مقبول ✅";

statusClass=
"status-approved";

}


if(status==="rejected"){

statusText=
"مرفوض ❌";

statusClass=
"status-rejected";

}


/* التاريخ */

let date="-";


if(store.createdAt){

if(
store.createdAt.toDate
){

date=
store.createdAt
.toDate()
.toLocaleString(
"ar-DZ"
);

}else{

date=
store.createdAt;

}

}


/* الوصل */

const receipt=

store.paymentReceipt ||

store.receipt ||

store.receiptUrl ||

"";


let receiptHTML="";


if(receipt){

receiptHTML=`

<div class="receipt">

<div class="receipt-title">

💳 وصل الدفع — 3500 DA

</div>

<img

class="receipt-image"

src="${receipt}"

data-src="${receipt}"

alt="وصل الدفع">

</div>

`;

}else{

receiptHTML=`

<div class="receipt">

<div class="receipt-title">

⚠️ لم يتم رفع وصل الدفع

</div>

</div>

`;

}


/* البطاقة */

card.innerHTML=`

<h2>

🏪 ${
store.storeName ||
"متجر بدون اسم"
}

</h2>


<div class="info">

👤

<strong>
صاحب المتجر:
</strong>

${
store.name ||
store.ownerName ||
"غير محدد"
}

</div>


<div class="info">

📧

<strong>
البريد:
</strong>

${store.email || "غير محدد"}

</div>


<div class="info">

📱

<strong>
الهاتف:
</strong>

${store.phone || "غير محدد"}

</div>


<div class="info">

💰

<strong>
المبلغ:
</strong>

${store.amount || 3500} DA

</div>


<div class="info">

📅

<strong>
تاريخ الطلب:
</strong>

${date}

</div>


<span
class="status ${statusClass}">

${statusText}

</span>


${receiptHTML}


<div class="buttons">


${
status!=="approved"

?

`

<button
class="approve-btn"
data-id="${store.id}">

✅ قبول

</button>

`

:""

}


${
status!=="rejected"

?

`

<button
class="reject-btn"
data-id="${store.id}">

❌ رفض

</button>

`

:""

}


<button
class="delete-btn"
data-id="${store.id}">

🗑️ حذف

</button>


</div>

`;


/* فتح الوصل */

const receiptImage=
card.querySelector(
".receipt-image"
);


if(receiptImage){

receiptImage.addEventListener(
"click",
function(){

modalReceipt.src=
this.dataset.src;

receiptModal.classList.add(
"active"
);

}
);

}


/* قبول */

const approveBtn=
card.querySelector(
".approve-btn"
);


if(approveBtn){

approveBtn.addEventListener(
"click",
function(){

approveStore(
this.dataset.id
);

}
);

}


/* رفض */

const rejectBtn=
card.querySelector(
".reject-btn"
);


if(rejectBtn){

rejectBtn.addEventListener(
"click",
function(){

rejectStore(
this.dataset.id
);

}
);

}


/* حذف */

const deleteBtn=
card.querySelector(
".delete-btn"
);


deleteBtn.addEventListener(
"click",
function(){

deleteStore(
this.dataset.id
);

}
);


storesContainer.appendChild(
card
);

});

}


/* =========================
   APPROVE
========================= */

async function approveStore(id){

const ok=
confirm(
"هل أنت متأكد من قبول صاحب المتجر؟"
);

if(!ok)return;


try{


await updateDoc(

doc(
db,
"storeApplications",
id
),

{

status:
"approved",

approvedAt:
new Date()

}

);


alert(
"تم قبول صاحب المتجر بنجاح ✅"
);


await loadStores();


}catch(error){

console.error(error);

alert(
"حدث خطأ أثناء القبول:\n"+
error.message
);

}

}


/* =========================
   REJECT
========================= */

async function rejectStore(id){

const ok=
confirm(
"هل أنت متأكد من رفض صاحب المتجر؟"
);

if(!ok)return;


try{


await updateDoc(

doc(
db,
"storeApplications",
id
),

{

status:
"rejected",

rejectedAt:
new Date()

}

);


alert(
"تم رفض صاحب المتجر ❌"
);


await loadStores();


}catch(error){

console.error(error);

alert(
"حدث خطأ أثناء الرفض:\n"+
error.message
);

}

}


/* =========================
   DELETE
========================= */

async function deleteStore(id){

const ok=
confirm(
"سيتم حذف طلب صاحب المتجر نهائيًا.\nهل تريد المتابعة؟"
);

if(!ok)return;


try{


await deleteDoc(

doc(
db,
"storeApplications",
id
)

);


alert(
"تم حذف الطلب 🗑️"
);


await loadStores();


}catch(error){

console.error(error);

alert(
"حدث خطأ أثناء الحذف:\n"+
error.message
);

}

}


/* =========================
   SEARCH
========================= */

searchInput.addEventListener(
"input",
function(){

const value=
this.value
.toLowerCase()
.trim();


const result=
stores.filter(
store=>{

const name=
(
store.name ||
store.ownerName ||
""
)
.toLowerCase();


const email=
(
store.email ||
""
)
.toLowerCase();


const storeName=
(
store.storeName ||
""
)
.toLowerCase();


return (

name.includes(value)

||

email.includes(value)

||

storeName.includes(value)

);

});


displayStores(result);

});


/* =========================
   MODAL
========================= */

closeModal.addEventListener(
"click",
function(){

receiptModal.classList.remove(
"active"
);

modalReceipt.src="";

});


receiptModal.addEventListener(
"click",
function(e){

if(
e.target===receiptModal
){

receiptModal.classList.remove(
"active"
);

modalReceipt.src="";

}

});


/* =========================
   LOGOUT
========================= */

document
.getElementById(
"logoutBtn"
)
.addEventListener(
"click",
function(e){

e.preventDefault();


const ok=
confirm(
"هل تريد تسجيل الخروج؟"
);

if(!ok)return;


localStorage.removeItem(
"adminLogged"
);


window.location.href=
"login.html";

});


/* =========================
   START
========================= */

loadStores();

</script>

</body>

   </html>
