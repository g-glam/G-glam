<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | لوحة تحكم الأدمن</title>

<style>

:root{
--bg:#F5F0E8;
--card:#fff;
--text:#222;
--muted:#777;
--accent:#B89B7A;
--dark:#222;
--success:#d4edda;
--successText:#155724;
--danger:#f8d7da;
--dangerText:#721c24;
--warning:#fff3cd;
--warningText:#856404;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
min-height:100vh;
}


/* =========================
   الشريط العلوي
========================= */

.header{

background:#fff;

padding:15px 25px;

display:flex;

align-items:center;

justify-content:space-between;

box-shadow:0 2px 12px rgba(0,0,0,.08);

position:sticky;

top:0;

z-index:100;

}

.logo{

font-size:25px;

font-weight:bold;

}

.admin-title{

color:#777;

font-size:14px;

}


/* =========================
   المحتوى
========================= */

.container{

max-width:1200px;

margin:auto;

padding:25px 15px 50px;

}

.page-title{

margin-bottom:20px;

}

.page-title h1{

font-size:28px;

margin-bottom:7px;

}

.page-title p{

color:var(--muted);

}


/* =========================
   الإحصائيات
========================= */

.stats{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:15px;

margin-bottom:25px;

}

.stat{

background:#fff;

padding:20px;

border-radius:18px;

box-shadow:
0 3px 15px rgba(0,0,0,.05);

}

.stat-title{

color:var(--muted);

font-size:14px;

margin-bottom:10px;

}

.stat-value{

font-size:28px;

font-weight:bold;

}


/* =========================
   الرسائل
========================= */

.message{

display:none;

padding:13px;

border-radius:10px;

margin-bottom:20px;

text-align:center;

}

.success{

background:var(--success);

color:var(--successText);

}

.error{

background:var(--danger);

color:var(--dangerText);

}

.warning{

background:var(--warning);

color:var(--warningText);

}


/* =========================
   الطلبات
========================= */

.section{

background:#fff;

border-radius:18px;

padding:20px;

margin-bottom:25px;

box-shadow:
0 3px 15px rgba(0,0,0,.05);

}

.section-header{

display:flex;

align-items:center;

justify-content:space-between;

gap:10px;

margin-bottom:20px;

}

.section-header h2{

font-size:21px;

}

.refresh-btn{

background:#222;

color:#fff;

border:none;

padding:10px 15px;

border-radius:10px;

cursor:pointer;

}


/* =========================
   بطاقة الطلب
========================= */

.request-card{

border:1px solid #eee;

border-radius:16px;

padding:18px;

margin-bottom:15px;

background:#fff;

}

.request-header{

display:flex;

justify-content:space-between;

align-items:center;

gap:10px;

margin-bottom:15px;

}

.store-name{

font-size:20px;

font-weight:bold;

}

.status{

padding:7px 12px;

border-radius:20px;

font-size:13px;

font-weight:bold;

}

.status-pending{

background:var(--warning);

color:var(--warningText);

}

.status-approved{

background:var(--success);

color:var(--successText);

}

.status-rejected{

background:var(--danger);

color:var(--dangerText);

}


/* =========================
   المعلومات
========================= */

.info-grid{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:10px;

margin-bottom:15px;

}

.info{

background:#f8f8f8;

padding:12px;

border-radius:10px;

}

.info-label{

font-size:12px;

color:#777;

margin-bottom:5px;

}

.info-value{

font-weight:bold;

word-break:break-word;

}


/* =========================
   الوصل
========================= */

.receipt-box{

margin-top:15px;

background:#fafafa;

border:1px solid #eee;

border-radius:14px;

padding:15px;

}

.receipt-title{

font-weight:bold;

margin-bottom:10px;

}

.receipt-image{

width:100%;

max-width:400px;

max-height:500px;

object-fit:contain;

border-radius:10px;

border:1px solid #ddd;

background:#fff;

display:block;

margin:auto;

cursor:pointer;

}

.receipt-link{

display:block;

text-align:center;

margin-top:10px;

color:#8d7358;

font-weight:bold;

text-decoration:none;

}


/* =========================
   الأزرار
========================= */

.actions{

display:flex;

gap:10px;

margin-top:18px;

}

.actions button{

flex:1;

padding:13px;

border:none;

border-radius:10px;

cursor:pointer;

font-size:15px;

font-weight:bold;

}

.approve-btn{

background:#198754;

color:white;

}

.reject-btn{

background:#dc3545;

color:white;

}

.delete-btn{

background:#eee;

color:#333;

}

.actions button:disabled{

opacity:.5;

cursor:not-allowed;

}


/* =========================
   المتاجر المقبولة
========================= */

.store-row{

border:1px solid #eee;

border-radius:14px;

padding:15px;

margin-bottom:10px;

display:flex;

justify-content:space-between;

align-items:center;

gap:15px;

}

.store-info h3{

margin-bottom:6px;

}

.store-info p{

color:#777;

font-size:14px;

}


/* =========================
   لا يوجد
========================= */

.empty{

padding:35px;

text-align:center;

color:#777;

background:#fafafa;

border-radius:12px;

}


/* =========================
   النافذة
========================= */

.image-modal{

position:fixed;

inset:0;

background:rgba(0,0,0,.8);

display:none;

align-items:center;

justify-content:center;

padding:20px;

z-index:1000;

}

.image-modal.active{

display:flex;

}

.image-modal img{

max-width:95%;

max-height:90vh;

border-radius:10px;

}

.close-modal{

position:absolute;

top:15px;

left:20px;

background:#fff;

border:none;

width:45px;

height:45px;

border-radius:50%;

font-size:25px;

cursor:pointer;

}


/* =========================
   الهاتف
========================= */

@media(max-width:900px){

.stats{

grid-template-columns:
repeat(2,1fr);

}

}


@media(max-width:600px){

.header{

padding:15px;

}

.container{

padding:15px 10px;

}

.page-title h1{

font-size:23px;

}

.stats{

grid-template-columns:1fr 1fr;

}

.info-grid{

grid-template-columns:1fr;

}

.request-header{

align-items:flex-start;

flex-direction:column;

}

.actions{

flex-direction:column;

}

.store-row{

align-items:flex-start;

flex-direction:column;

}

}

</style>

</head>


<body>


<header class="header">

<div class="logo">
G-Glam Admin
</div>

<div class="admin-title">
إدارة المتاجر
</div>

</header>


<main class="container">


<div class="page-title">

<h1>
لوحة تحكم الأدمن 👑
</h1>

<p>
إدارة أصحاب المتاجر وطلبات الدفع
</p>

</div>


<!-- =========================
     الإحصائيات
========================= -->

<div class="stats">


<div class="stat">

<div class="stat-title">
إجمالي الطلبات
</div>

<div
class="stat-value"
id="totalCount">

0

</div>

</div>


<div class="stat">

<div class="stat-title">
طلبات قيد المراجعة
</div>

<div
class="stat-value"
id="pendingCount">

0

</div>

</div>


<div class="stat">

<div class="stat-title">
متاجر مقبولة
</div>

<div
class="stat-value"
id="approvedCount">

0

</div>

</div>


<div class="stat">

<div class="stat-title">
طلبات مرفوضة
</div>

<div
class="stat-value"
id="rejectedCount">

0

</div>

</div>


</div>


<div
class="message success"
id="successMessage">
</div>


<div
class="message error"
id="errorMessage">
</div>


<div
class="message warning"
id="warningMessage">
</div>


<!-- =========================
     الطلبات
========================= -->

<div class="section">


<div class="section-header">

<h2>
📋 طلبات إنشاء المتاجر
</h2>

<button
class="refresh-btn"
id="refreshBtn">

🔄 تحديث

</button>

</div>


<div
id="requestsContainer">

<div class="empty">

⏳ جاري تحميل الطلبات...

</div>

</div>


</div>


<!-- =========================
     المتاجر المقبولة
========================= -->

<div class="section">


<div class="section-header">

<h2>
🏪 المتاجر المقبولة
</h2>

</div>


<div
id="approvedStoresContainer">

<div class="empty">

⏳ جاري تحميل المتاجر...

</div>

</div>


</div>


</main>


<!-- =========================
     عرض الوصل
========================= -->

<div
class="image-modal"
id="imageModal">

<button
class="close-modal"
id="closeModal">

×

</button>

<img
id="modalImage"
src=""
alt="وصل الدفع">

</div>


<script type="module">


/* =====================================================
   Firebase
===================================================== */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {
getAuth,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


import {
getFirestore,
collection,
getDocs,
doc,
getDoc,
setDoc,
deleteDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =====================================================
   Firebase Config
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =====================================================
   Firebase Initialization
===================================================== */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =====================================================
   Admin Email
===================================================== */

const ADMIN_EMAIL =
"loxenteam@gmail.com";


/* =====================================================
   العناصر
===================================================== */

const requestsContainer =
document.getElementById(
"requestsContainer"
);

const approvedStoresContainer =
document.getElementById(
"approvedStoresContainer"
);

const totalCount =
document.getElementById(
"totalCount"
);

const pendingCount =
document.getElementById(
"pendingCount"
);

const approvedCount =
document.getElementById(
"approvedCount"
);

const rejectedCount =
document.getElementById(
"rejectedCount"
);

const refreshBtn =
document.getElementById(
"refreshBtn"
);

const imageModal =
document.getElementById(
"imageModal"
);

const modalImage =
document.getElementById(
"modalImage"
);

const closeModal =
document.getElementById(
"closeModal"
);


/* =====================================================
   رسائل
===================================================== */

function showSuccess(text){

const box =
document.getElementById(
"successMessage"
);

box.textContent =
text;

box.style.display =
"block";

setTimeout(
()=>{

box.style.display =
"none";

},
3500
);

}


function showError(text){

const box =
document.getElementById(
"errorMessage"
);

box.textContent =
text;

box.style.display =
"block";

setTimeout(
()=>{

box.style.display =
"none";

},
6000
);

}


/* =====================================================
   حماية الصفحة
===================================================== */

onAuthStateChanged(
auth,
async function(user){

if(!user){

window.location.href =
"login.html";

return;

}


if(
(user.email || "").toLowerCase()
!==
ADMIN_EMAIL.toLowerCase()
){

alert(
"غير مسموح لك بالدخول إلى لوحة الأدمن."
);

await signOut(auth);

window.location.href =
"login.html";

return;

}


/* الأدمن صحيح */

await loadRequests();

await loadApprovedStores();

}
);


/* =====================================================
   تحميل الطلبات من STORES
===================================================== */

async function loadRequests(){

try{

requestsContainer.innerHTML = `

<div class="empty">
⏳ جاري تحميل الطلبات...
</div>

`;


/*
   مهم جدًا:
   الطلبات موجودة في stores
*/

const snapshot =
await getDocs(
collection(
db,
"stores"
)
);


const allStores = [];


snapshot.forEach(
item=>{

allStores.push({

id:item.id,

...item.data()

});

});


/*
   الطلبات التي لم يتم قبولها
   أو المرفوضة أيضًا
*/

const requests =
allStores.filter(
store=>{

return (
store.status === "pending"
||
store.status === "rejected"
||
store.status === "approved"
);

}
);


/* =====================================================
   الإحصائيات
===================================================== */

totalCount.textContent =
requests.length;


pendingCount.textContent =
requests.filter(
x=>
x.status === "pending"
).length;


approvedCount.textContent =
requests.filter(
x=>
x.status === "approved"
||
x.status === "active"
).length;


rejectedCount.textContent =
requests.filter(
x=>
x.status === "rejected"
).length;


/* =====================================================
   لا توجد طلبات
===================================================== */

if(requests.length === 0){

requestsContainer.innerHTML = `

<div class="empty">

لا توجد طلبات متاجر حاليًا.

</div>

`;

return;

}


/* =====================================================
   ترتيب الأحدث
===================================================== */

requests.sort(
(a,b)=>{

const aTime =
a.createdAt?.seconds || 0;

const bTime =
b.createdAt?.seconds || 0;

return bTime - aTime;

});


requestsContainer.innerHTML = "";


/* =====================================================
   إنشاء البطاقات
===================================================== */

requests.forEach(
request=>{

requestsContainer.appendChild(
createRequestCard(request)
);

});


}catch(error){

console.error(
"LOAD STORES ERROR:",
error
);

requestsContainer.innerHTML = `

<div class="empty">

❌ حدث خطأ أثناء تحميل الطلبات.

<br><br>

${escapeHtml(error.message)}

</div>

`;

}

}


/* =====================================================
   بطاقة الطلب
===================================================== */

function createRequestCard(request){

const card =
document.createElement("div");

card.className =
"request-card";


let statusText =
"قيد المراجعة";

let statusClass =
"status-pending";


if(
request.status === "approved"
||
request.status === "active"
){

statusText =
"مقبول";

statusClass =
"status-approved";

}


if(
request.status === "rejected"
){

statusText =
"مرفوض";

statusClass =
"status-rejected";

}


const receipt =
request.receiptUrl || "";


card.innerHTML = `

<div class="request-header">

<div class="store-name">

🏪 ${escapeHtml(
request.storeName || "بدون اسم"
)}

</div>

<div class="status ${statusClass}">

${statusText}

</div>

</div>


<div class="info-grid">


<div class="info">

<div class="info-label">
صاحب المتجر
</div>

<div class="info-value">

${escapeHtml(
request.ownerName || "-"
)}

</div>

</div>


<div class="info">

<div class="info-label">
البريد الإلكتروني
</div>

<div class="info-value">

${escapeHtml(
request.ownerEmail ||
request.email ||
"-"
)}

</div>

</div>


<div class="info">

<div class="info-label">
UID
</div>

<div class="info-value">

${escapeHtml(
request.ownerUid ||
request.ownerId ||
request.id ||
"-"
)}

</div>

</div>


<div class="info">

<div class="info-label">
المبلغ
</div>

<div class="info-value">

${Number(
request.amount ||
request.paymentAmount ||
3500
)} DA

</div>

</div>


<div class="info">

<div class="info-label">
طريقة الدفع
</div>

<div class="info-value">

${escapeHtml(
request.paymentMethod ||
"CCP / RIB"
)}

</div>

</div>


<div class="info">

<div class="info-label">
حالة الدفع
</div>

<div class="info-value">

${escapeHtml(
request.paymentStatus ||
"pending"
)}

</div>

</div>


</div>


<!-- =========================
     الوصل
========================= -->

<div class="receipt-box">

<div class="receipt-title">

🧾 وصل الدفع

</div>


${
receipt

?

`

<img
class="receipt-image"
src="${escapeAttribute(receipt)}"
alt="وصل الدفع"
data-receipt="${escapeAttribute(receipt)}"
>

<a
class="receipt-link"
href="${escapeAttribute(receipt)}"
target="_blank"
rel="noopener">

🔗 فتح الوصل في صفحة جديدة

</a>

`

:

`

<div class="empty">

❌ لم يتم إرفاق وصل الدفع

</div>

`

}


</div>


<!-- =========================
     الأزرار
========================= -->

<div class="actions">


<button
class="approve-btn"
data-action="approve"
data-id="${escapeAttribute(
request.id
)}"
${request.status === "approved" ||
request.status === "active"
? "disabled"
: ""}>

✅ قبول المتجر

</button>


<button
class="reject-btn"
data-action="reject"
data-id="${escapeAttribute(
request.id
)}"
${request.status === "rejected"
? "disabled"
: ""}>

❌ رفض المتجر

</button>


<button
class="delete-btn"
data-action="delete"
data-id="${escapeAttribute(
request.id
)}">

🗑️ حذف الطلب

</button>


</div>

`;


/* =====================================================
   صورة الوصل
===================================================== */

const receiptImage =
card.querySelector(
".receipt-image"
);


if(receiptImage){

receiptImage.addEventListener(
"click",
function(){

modalImage.src =
this.dataset.receipt;

imageModal.classList.add(
"active"
);

});

}


/* =====================================================
   الأزرار
===================================================== */

card
.querySelectorAll(
"button[data-action]"
)
.forEach(
button=>{

button.addEventListener(
"click",
function(){

const action =
this.dataset.action;

const id =
this.dataset.id;


if(action === "approve"){

approveStore(id);

}

else if(action === "reject"){

rejectStore(id);

}

else if(action === "delete"){

deleteRequest(id);

}

});

});


return card;

}


/* =====================================================
   قبول المتجر
===================================================== */

async function approveStore(id){

const ok =
confirm(
"هل أنت متأكد من قبول هذا المتجر؟\n\nبعد القبول سيتمكن صاحب المتجر من الدخول إلى لوحة التحكم."
);


if(!ok){

return;

}


try{


const storeRef =
doc(
db,
"stores",
id
);


const storeSnap =
await getDoc(
storeRef
);


if(!storeSnap.exists()){

showError(
"الطلب غير موجود."
);

return;

}


const store =
storeSnap.data();


/*
   تحديث نفس الوثيقة
*/

await setDoc(

storeRef,

{

status:
"active",

paymentStatus:
"approved",

approvedAt:
serverTimestamp(),

approvedBy:
ADMIN_EMAIL,

updatedAt:
serverTimestamp()

},

{

merge:true

}

);


/*
   تحديث users
*/

await setDoc(

doc(
db,
"users",
id
),

{

fullName:
store.ownerName || "",

email:
store.ownerEmail ||
store.email ||
"",

storeId:
id,

storeName:
store.storeName ||
store.name ||
"",

status:
"active",

paymentStatus:
"approved",

updatedAt:
serverTimestamp()

},

{

merge:true

}

);


/* LocalStorage غير مهم للأدمن */


showSuccess(
"تم قبول المتجر بنجاح ✅"
);


await loadRequests();

await loadApprovedStores();


}catch(error){

console.error(
"APPROVE ERROR:",
error
);

showError(
"حدث خطأ أثناء قبول المتجر: " +
error.message
);

}

}


/* =====================================================
   رفض المتجر
===================================================== */

async function rejectStore(id){

const reason =
prompt(
"اكتب سبب رفض طلب المتجر:"
);


if(reason === null){

return;

}


try{


const storeRef =
doc(
db,
"stores",
id
);


await setDoc(

storeRef,

{

status:
"rejected",

paymentStatus:
"rejected",

rejectionReason:
reason.trim(),

rejectedAt:
serverTimestamp(),

rejectedBy:
ADMIN_EMAIL,

updatedAt:
serverTimestamp()

},

{

merge:true

}

);


/*
   تحديث users
*/

await setDoc(

doc(
db,
"users",
id
),

{

status:
"rejected",

paymentStatus:
"rejected",

updatedAt:
serverTimestamp()

},

{

merge:true

}

);


showSuccess(
"تم رفض طلب المتجر ❌"
);


await loadRequests();

await loadApprovedStores();


}catch(error){

console.error(
"REJECT ERROR:",
error
);

showError(
"حدث خطأ أثناء رفض الطلب: " +
error.message
);

}

}


/* =====================================================
   حذف الطلب
===================================================== */

async function deleteRequest(id){

const ok =
confirm(
"هل تريد حذف طلب المتجر نهائيًا؟"
);


if(!ok){

return;

}


try{


await deleteDoc(

doc(
db,
"stores",
id

)

);


showSuccess(
"تم حذف الطلب."
);


await loadRequests();

await loadApprovedStores();


}catch(error){

console.error(
"DELETE ERROR:",
error
);

showError(
"حدث خطأ أثناء حذف الطلب: " +
error.message
);

}

}


/* =====================================================
   المتاجر المقبولة
===================================================== */

async function loadApprovedStores(){

try{

approvedStoresContainer.innerHTML = `

<div class="empty">

⏳ جاري تحميل المتاجر...

</div>

`;


const snapshot =
await getDocs(
collection(
db,
"stores"
)
);


const stores = [];


snapshot.forEach(
item=>{

const store =
item.data();


/*
   عرض المتاجر المقبولة أو النشطة فقط
*/

if(
store.status === "approved"
||
store.status === "active"
){

stores.push({

id:item.id,

...store

});

}

});


/* =====================================================
   لا توجد متاجر
===================================================== */

if(stores.length === 0){

approvedStoresContainer.innerHTML = `

<div class="empty">

لا توجد متاجر مقبولة حاليًا.

</div>

`;

return;

}


/* =====================================================
   ترتيب الأحدث
===================================================== */

stores.sort(
(a,b)=>{

const aTime =
a.approvedAt?.seconds ||
a.createdAt?.seconds ||
0;

const bTime =
b.approvedAt?.seconds ||
b.createdAt?.seconds ||
0;

return bTime - aTime;

});


approvedStoresContainer.innerHTML = "";


/* =====================================================
   إنشاء صفوف المتاجر
===================================================== */

stores.forEach(
store=>{

const row =
document.createElement("div");

row.className =
"store-row";


row.innerHTML = `

<div class="store-info">

<h3>

🏪 ${escapeHtml(
store.storeName ||
store.name ||
"بدون اسم"
)}

</h3>


<p>

👤 ${escapeHtml(
store.ownerName ||
"-"
)}

</p>


<p>

📧 ${escapeHtml(
store.ownerEmail ||
store.email ||
"-"
)}

</p>


<p>

🆔 ${escapeHtml(
store.ownerUid ||
store.ownerId ||
store.id ||
"-"
)}

</p>

</div>


<div>

<span class="status status-approved">

نشط

</span>

</div>

`;


approvedStoresContainer.appendChild(
row
);

});


}catch(error){

console.error(
"LOAD APPROVED STORES ERROR:",
error
);


approvedStoresContainer.innerHTML = `

<div class="empty">

❌ تعذر تحميل المتاجر المقبولة.

<br><br>

${escapeHtml(
error.message
)}

</div>

`;

}

}


/* =====================================================
   حماية النص HTML
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
   حماية الخصائص
===================================================== */

function escapeAttribute(value){

return escapeHtml(value);

}
