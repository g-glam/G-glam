<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | لوحة تحكم الأدمن</title>

<style>

:root{
--bg:#F5F0E8;
--card:#fff;
--text:#222;
--muted:#777;
--accent:#B89B7A;
--dark:#222;
--success:#d4edda;
--successText:#155724;
--danger:#f8d7da;
--dangerText:#721c24;
--warning:#fff3cd;
--warningText:#856404;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
min-height:100vh;
}


/* =========================
   الشريط العلوي
========================= */

.header{

background:#fff;

padding:15px 25px;

display:flex;

align-items:center;

justify-content:space-between;

box-shadow:0 2px 12px rgba(0,0,0,.08);

position:sticky;

top:0;

z-index:100;

}

.logo{

font-size:25px;

font-weight:bold;

}

.admin-title{

color:#777;

font-size:14px;

}


/* =========================
   المحتوى
========================= */

.container{

max-width:1200px;

margin:auto;

padding:25px 15px 50px;

}

.page-title{

margin-bottom:20px;

}

.page-title h1{

font-size:28px;

margin-bottom:7px;

}

.page-title p{

color:var(--muted);

}


/* =========================
   الإحصائيات
========================= */

.stats{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:15px;

margin-bottom:25px;

}

.stat{

background:#fff;

padding:20px;

border-radius:18px;

box-shadow:
0 3px 15px rgba(0,0,0,.05);

}

.stat-title{

color:var(--muted);

font-size:14px;

margin-bottom:10px;

}

.stat-value{

font-size:28px;

font-weight:bold;

}


/* =========================
   الرسائل
========================= */

.message{

display:none;

padding:13px;

border-radius:10px;

margin-bottom:20px;

text-align:center;

}

.success{

background:var(--success);

color:var(--successText);

}

.error{

background:var(--danger);

color:var(--dangerText);

}

.warning{

background:var(--warning);

color:var(--warningText);

}


/* =========================
   الطلبات
========================= */

.section{

background:#fff;

border-radius:18px;

padding:20px;

margin-bottom:25px;

box-shadow:
0 3px 15px rgba(0,0,0,.05);

}

.section-header{

display:flex;

align-items:center;

justify-content:space-between;

gap:10px;

margin-bottom:20px;

}

.section-header h2{

font-size:21px;

}

.refresh-btn{

background:#222;

color:#fff;

border:none;

padding:10px 15px;

border-radius:10px;

cursor:pointer;

}


/* =========================
   بطاقة صاحب المتجر
========================= */

.request-card{

border:1px solid #eee;

border-radius:16px;

padding:18px;

margin-bottom:15px;

background:#fff;

}

.request-header{

display:flex;

justify-content:space-between;

align-items:center;

gap:10px;

margin-bottom:15px;

}

.store-name{

font-size:20px;

font-weight:bold;

}

.status{

padding:7px 12px;

border-radius:20px;

font-size:13px;

font-weight:bold;

}

.status-pending{

background:var(--warning);

color:var(--warningText);

}

.status-approved{

background:var(--success);

color:var(--successText);

}

.status-rejected{

background:var(--danger);

color:var(--dangerText);

}


/* المعلومات */

.info-grid{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:10px;

margin-bottom:15px;

}

.info{

background:#f8f8f8;

padding:12px;

border-radius:10px;

}

.info-label{

font-size:12px;

color:#777;

margin-bottom:5px;

}

.info-value{

font-weight:bold;

word-break:break-word;

}


/* =========================
   الوصل
========================= */

.receipt-box{

margin-top:15px;

background:#fafafa;

border:1px solid #eee;

border-radius:14px;

padding:15px;

}

.receipt-title{

font-weight:bold;

margin-bottom:10px;

}

.receipt-image{

width:100%;

max-width:400px;

max-height:500px;

object-fit:contain;

border-radius:10px;

border:1px solid #ddd;

background:#fff;

display:block;

margin:auto;

cursor:pointer;

}

.receipt-link{

display:block;

text-align:center;

margin-top:10px;

color:#8d7358;

font-weight:bold;

text-decoration:none;

}


/* =========================
   الأزرار
========================= */

.actions{

display:flex;

gap:10px;

margin-top:18px;

}

.actions button{

flex:1;

padding:13px;

border:none;

border-radius:10px;

cursor:pointer;

font-size:15px;

font-weight:bold;

}

.approve-btn{

background:#198754;

color:white;

}

.reject-btn{

background:#dc3545;

color:white;

}

.delete-btn{

background:#eee;

color:#333;

}

.actions button:disabled{

opacity:.5;

cursor:not-allowed;

}


/* =========================
   المتاجر المقبولة
========================= */

.store-row{

border:1px solid #eee;

border-radius:14px;

padding:15px;

margin-bottom:10px;

display:flex;

justify-content:space-between;

align-items:center;

gap:15px;

}

.store-info h3{

margin-bottom:6px;

}

.store-info p{

color:#777;

font-size:14px;

}


/* =========================
   لا يوجد
========================= */

.empty{

padding:35px;

text-align:center;

color:#777;

background:#fafafa;

border-radius:12px;

}


/* =========================
   النافذة
========================= */

.image-modal{

position:fixed;

inset:0;

background:rgba(0,0,0,.8);

display:none;

align-items:center;

justify-content:center;

padding:20px;

z-index:1000;

}

.image-modal.active{

display:flex;

}

.image-modal img{

max-width:95%;

max-height:90vh;

border-radius:10px;

}

.close-modal{

position:absolute;

top:15px;

left:20px;

background:#fff;

border:none;

width:45px;

height:45px;

border-radius:50%;

font-size:25px;

cursor:pointer;

}


/* =========================
   الهاتف
========================= */

@media(max-width:900px){

.stats{

grid-template-columns:
repeat(2,1fr);

}

}


@media(max-width:600px){

.header{

padding:15px;

}

.container{

padding:15px 10px;

}

.page-title h1{

font-size:23px;

}

.stats{

grid-template-columns:1fr 1fr;

}

.info-grid{

grid-template-columns:1fr;

}

.request-header{

align-items:flex-start;

flex-direction:column;

}

.actions{

flex-direction:column;

}

.store-row{

align-items:flex-start;

flex-direction:column;

}

}

</style>

</head>


<body>


<header class="header">

<div class="logo">

G-Glam Admin

</div>

<div class="admin-title">

إدارة المتاجر

</div>

</header>


<main class="container">


<div class="page-title">

<h1>
لوحة تحكم الأدمن 👑
</h1>

<p>
إدارة أصحاب المتاجر وطلبات الدفع
</p>

</div>


<!-- الإحصائيات -->

<div class="stats">


<div class="stat">

<div class="stat-title">
إجمالي الطلبات
</div>

<div
class="stat-value"
id="totalCount">

0

</div>

</div>


<div class="stat">

<div class="stat-title">
طلبات قيد المراجعة
</div>

<div
class="stat-value"
id="pendingCount">

0

</div>

</div>


<div class="stat">

<div class="stat-title">
متاجر مقبولة
</div>

<div
class="stat-value"
id="approvedCount">

0

</div>

</div>


<div class="stat">

<div class="stat-title">
طلبات مرفوضة
</div>

<div
class="stat-value"
id="rejectedCount">

0

</div>

</div>


</div>


<div
class="message success"
id="successMessage">
</div>


<div
class="message error"
id="errorMessage">
</div>


<div
class="message warning"
id="warningMessage">
</div>


<!-- الطلبات -->

<div class="section">


<div class="section-header">

<h2>
📋 طلبات إنشاء المتاجر
</h2>

<button
class="refresh-btn"
id="refreshBtn">

🔄 تحديث

</button>

</div>


<div
id="requestsContainer">

<div class="empty">

⏳ جاري تحميل الطلبات...

</div>

</div>


</div>


<!-- المتاجر المقبولة -->

<div class="section">


<div class="section-header">

<h2>
🏪 المتاجر المقبولة
</h2>

</div>


<div
id="approvedStoresContainer">

<div class="empty">

⏳ جاري تحميل المتاجر...

</div>

</div>


</div>


</main>


<!-- عرض الوصل بحجم كبير -->

<div
class="image-modal"
id="imageModal">

<button
class="close-modal"
id="closeModal">

×
</button>

<img
id="modalImage"
src=""
alt="وصل الدفع">

</div>


<script type="module">


/* =========================
   Firebase
========================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
collection,
getDocs,
doc,
getDoc,
setDoc,
deleteDoc,
serverTimestamp

}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


/* =========================
   العناصر
========================= */

const requestsContainer =
document.getElementById(
"requestsContainer"
);

const approvedStoresContainer =
document.getElementById(
"approvedStoresContainer"
);

const totalCount =
document.getElementById(
"totalCount"
);

const pendingCount =
document.getElementById(
"pendingCount"
);

const approvedCount =
document.getElementById(
"approvedCount"
);

const rejectedCount =
document.getElementById(
"rejectedCount"
);

const refreshBtn =
document.getElementById(
"refreshBtn"
);

const imageModal =
document.getElementById(
"imageModal"
);

const modalImage =
document.getElementById(
"modalImage"
);

const closeModal =
document.getElementById(
"closeModal"
);


/* =========================
   الرسائل
========================= */

function showSuccess(text){

const box =
document.getElementById(
"successMessage"
);

box.textContent = text;

box.style.display = "block";

setTimeout(()=>{

box.style.display="none";

},3500);

}


function showError(text){

const box =
document.getElementById(
"errorMessage"
);

box.textContent = text;

box.style.display = "block";

setTimeout(()=>{

box.style.display="none";

},5000);

}


/* =========================
   تحميل الطلبات
========================= */

async function loadRequests(){

try{

requestsContainer.innerHTML = `

<div class="empty">
⏳ جاري تحميل الطلبات...
</div>

`;


const snapshot =
await getDocs(
collection(
db,
"storeRequests"
)
);


const requests = [];


snapshot.forEach(
item=>{

requests.push({

id:item.id,

...item.data()

});

});


/* الإحصائيات */

totalCount.textContent =
requests.length;


pendingCount.textContent =
requests.filter(
x=>x.status === "pending"
).length;


approvedCount.textContent =
requests.filter(
x=>x.status === "approved"
).length;


rejectedCount.textContent =
requests.filter(
x=>x.status === "rejected"
).length;


if(requests.length === 0){

requestsContainer.innerHTML = `

<div class="empty">

لا توجد طلبات متاجر حاليًا.

</div>

`;

return;

}


/* الأحدث أولًا */

requests.sort(
(a,b)=>{

const aTime =
a.createdAt?.seconds || 0;

const bTime =
b.createdAt?.seconds || 0;

return bTime-aTime;

});


requestsContainer.innerHTML = "";


requests.forEach(
request=>{

requestsContainer.appendChild(
createRequestCard(request)
);

});


}catch(error){

console.error(error);

requestsContainer.innerHTML = `

<div class="empty">

❌ حدث خطأ أثناء تحميل الطلبات.

<br><br>

${escapeHtml(error.message)}

</div>

`;

}

}


/* =========================
   إنشاء بطاقة الطلب
========================= */

function createRequestCard(request){

const card =
document.createElement("div");

card.className =
"request-card";


let statusText =
"قيد المراجعة";

let statusClass =
"status-pending";


if(request.status === "approved"){

statusText =
"مقبول";

statusClass =
"status-approved";

}


if(request.status === "rejected"){

statusText =
"مرفوض";

statusClass =
"status-rejected";

}


const receipt =
request.receiptUrl || "";


card.innerHTML = `

<div class="request-header">

<div class="store-name">

🏪 ${escapeHtml(
request.storeName || "بدون اسم"
)}

</div>

<div class="status ${statusClass}">

${statusText}

</div>

</div>


<div class="info-grid">


<div class="info">

<div class="info-label">
صاحب المتجر
</div>

<div class="info-value">

${escapeHtml(
request.ownerName || "-"
)}

</div>

</div>


<div class="info">

<div class="info-label">
البريد الإلكتروني
</div>

<div class="info-value">

${escapeHtml(
request.ownerEmail || "-"
)}

</div>

</div>


<div class="info">

<div class="info-label">
UID
</div>

<div class="info-value">

${escapeHtml(
request.ownerUid || request.id || "-"
)}

</div>

</div>


<div class="info">

<div class="info-label">
المبلغ
</div>

<div class="info-value">

${Number(
request.amount || 0
)} DA

</div>

</div>


</div>


<div class="receipt-box">

<div class="receipt-title">

🧾 وصل الدفع

</div>


${
receipt

?

`

<img
class="receipt-image"
src="${escapeAttribute(receipt)}"
alt="وصل الدفع"
data-receipt="${escapeAttribute(receipt)}"
>

<a
class="receipt-link"
href="${escapeAttribute(receipt)}"
target="_blank"
rel="noopener">

🔗 فتح الوصل في صفحة جديدة

</a>

`

:

`

<div class="empty">

❌ لم يتم إرفاق وصل الدفع

</div>

`

}


</div>


<div class="actions">


<button
class="approve-btn"
data-action="approve"
data-id="${escapeAttribute(
request.id
)}"
${request.status === "approved" ? "disabled" : ""}>

✅ قبول المتجر

</button>


<button
class="reject-btn"
data-action="reject"
data-id="${escapeAttribute(
request.id
)}"
${request.status === "rejected" ? "disabled" : ""}>

❌ رفض المتجر

</button>


<button
class="delete-btn"
data-action="delete"
data-id="${escapeAttribute(
request.id
)}">

🗑️ حذف الطلب

</button>


</div>

`;


/* صورة الوصل */

const receiptImage =
card.querySelector(
".receipt-image"
);


if(receiptImage){

receiptImage.addEventListener(
"click",
function(){

modalImage.src =
this.dataset.receipt;

imageModal.classList.add(
"active"
);

});

}


/* الأزرار */

card
.querySelectorAll(
"button[data-action]"
)
.forEach(
button=>{

button.addEventListener(
"click",
function(){

const action =
this.dataset.action;

const id =
this.dataset.id;


if(action === "approve"){

approveStore(id);

}

else if(action === "reject"){

rejectStore(id);

}

else if(action === "delete"){

deleteRequest(id);

}

});

});


return card;

}


/* =========================
   قبول المتجر
========================= */

async function approveStore(id){

const ok =
confirm(
"هل أنت متأكد من قبول هذا المتجر؟\n\nبعد القبول سيتمكن صاحب المتجر من الدخول إلى لوحة التحكم."
);


if(!ok)return;


try{

const requestRef =
doc(
db,
"storeRequests",
id
);


const requestSnap =
await getDoc(
requestRef
);


if(!requestSnap.exists()){

showError(
"الطلب غير موجود."
);

return;

}


const request =
requestSnap.data();


/*
   تغيير حالة الطلب
*/

await setDoc(

requestRef,

{

status:"approved",

approvedAt:
serverTimestamp()

},

{

merge:true

}

);


/*
   إنشاء بيانات المتجر
*/

await setDoc(

doc(
db,
"stores",
id
),

{

ownerId:
request.ownerUid,

ownerName:
request.ownerName,

ownerEmail:
request.ownerEmail,

storeName:
request.storeName,

status:
"active",

paymentStatus:
"approved",

paymentAmount:
request.amount || 3500,

receiptUrl:
request.receiptUrl || "",

createdAt:
request.createdAt ||
serverTimestamp(),

approvedAt:
serverTimestamp()

},

{

merge:true

}

);


/*
   تحديث users
*/

await setDoc(

doc(
db,
"users",
id
),

{

fullName:
request.ownerName,

email:
request.ownerEmail,

storeId:
id,

storeName:
request.storeName,

status:
"active",

paymentStatus:
"approved",

updatedAt:
serverTimestamp()

},

{

merge:true

}

);


showSuccess(
"تم قبول المتجر بنجاح ✅"
);


await loadRequests();

await loadApprovedStores();


}catch(error){

console.error(error);

showError(
"حدث خطأ أثناء قبول المتجر: " +
error.message
);

}

}


/* =========================
   رفض المتجر
========================= */

async function rejectStore(id){

const reason =
prompt(
"يمكنك كتابة سبب الرفض (اختياري):"
);


if(reason === null){

return;

}


try{

const requestRef =
doc(
db,
"storeRequests",
id
);


await setDoc(

requestRef,

{

status:"rejected",

rejectionReason:
reason.trim(),

rejectedAt:
serverTimestamp()

},

{

merge:true

}

);


showSuccess(
"تم رفض طلب المتجر ❌"
);


await loadRequests();

await loadApprovedStores();


}catch(error){

console.error(error);

showError(
"حدث خطأ أثناء رفض الطلب: " +
error.message
);

}

}


/* =========================
   حذف الطلب
========================= */

async function deleteRequest(id){

const ok =
confirm(
"هل تريد حذف طلب المتجر نهائيًا؟"
);


if(!ok)return;


try{

await deleteDoc(

doc(
db,
"storeRequests",
id
)

);


showSuccess(
"تم حذف الطلب."
);


await loadRequests();

await loadApprovedStores();


}catch(error){

console.error(error);

showError(
"حدث خطأ أثناء حذف الطلب."
);

}

}


/* =========================
   المتاجر المقبولة
========================= */

async function loadApprovedStores(){

try{

const snapshot =
await getDocs(
collection(
db,
"stores"
)
);


approvedStoresContainer.innerHTML = "";


if(snapshot.empty){

approvedStoresContainer.innerHTML = `

<div class="empty">

لا توجد متاجر مقبولة حاليًا.

</div>

`;

return;

}


snapshot.forEach(
item=>{

const store =
item.data();


const row =
document.createElement("div");

row.className =
"store-row";


row.innerHTML = `

<div class="store-info">

<h3>

🏪 ${escapeHtml(
store.storeName || "بدون اسم"
)}

</h3>

<p>

👤 ${escapeHtml(
store.ownerName || "-"
)}

</p>

<p>

📧 ${escapeHtml(
store.ownerEmail || "-"
)}

</p>

</div>


<div>

<span class="status status-approved">

نشط

</span>

</div>

`;


approvedStoresContainer.appendChild(
row
);

});


}catch(error){

console.error(error);

approvedStoresContainer.innerHTML = `

<div class="empty">

❌ تعذر تحميل المتاجر.

</div>

`;

}

}


/* =========================
   حماية النص
========================= */

function escapeHtml(value){

return String(value ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


function escapeAttribute(value){

return escapeHtml(value);

}


/* =========================
   تحديث
========================= */

refreshBtn.addEventListener(
"click",
async function(){

refreshBtn.disabled=true;

refreshBtn.textContent =
"⏳ جاري التحديث...";


await loadRequests();

await loadApprovedStores();


refreshBtn.disabled=false;

refreshBtn.textContent =
"🔄 تحديث";

});


/* =========================
   إغلاق صورة الوصل
========================= */

closeModal.addEventListener(
"click",
function(){

imageModal.classList.remove(
"active"
);

modalImage.src="";

});


imageModal.addEventListener(
"click",
function(event){

if(event.target === imageModal){

imageModal.classList.remove(
"active"
);

modalImage.src="";

}

});


/* =========================
   تشغيل
========================= */

loadRequests();
