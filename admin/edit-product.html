<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G-Glam | تعديل المنتج</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f5f5f5;
color:#222;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
background:#fff;
padding:25px;
border-radius:15px;
box-shadow:0 2px 12px rgba(0,0,0,.08);
}

h1{
text-align:center;
margin-top:0;
margin-bottom:25px;
}

.form-group{
margin-bottom:16px;
}

label{
display:block;
font-weight:bold;
margin-bottom:7px;
}

input,
textarea{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:9px;
font-size:15px;
outline:none;
}

input:focus,
textarea:focus{
border-color:#111;
}

textarea{
height:120px;
resize:vertical;
}

.hint{
font-size:13px;
color:#777;
margin-top:5px;
}

.image-section{
margin:20px 0;
text-align:center;
}

.preview{
width:180px;
height:180px;
object-fit:cover;
border-radius:12px;
border:1px solid #ddd;
display:block;
margin:15px auto;
background:#f5f5f5;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-size:17px;
cursor:pointer;
}

.update-btn{
background:#111;
color:white;
}

.update-btn:disabled{
opacity:.6;
cursor:not-allowed;
}

.back-btn{
background:#eee;
color:#222;
margin-top:10px;
}

.message{
display:none;
padding:12px;
border-radius:9px;
margin-bottom:15px;
text-align:center;
}

.success{
background:#d4edda;
color:#155724;
}

.error{
background:#f8d7da;
color:#721c24;
}

.loading{
text-align:center;
padding:20px;
color:#777;
}

</style>

</head>

<body>

<div class="container">

<h1>✏️ تعديل المنتج</h1>

<div
id="loading"
class="loading">

⏳ جاري تحميل بيانات المنتج...

</div>

<div
id="success"
class="message success">

تم تعديل المنتج بنجاح ✅

</div>

<div
id="error"
class="message error">
</div>

<div id="form" style="display:none;">

<div class="form-group">

<label for="name">
اسم المنتج
</label>

<input
type="text"
id="name"
placeholder="اسم المنتج">

</div>


<div class="form-group">

<label for="price">
السعر DA
</label>

<input
type="number"
id="price"
placeholder="مثال: 150"
min="0">

</div>


<div class="form-group">

<label for="description">
وصف المنتج
</label>

<textarea
id="description"
placeholder="اكتب وصف المنتج..."></textarea>

</div>


<div class="form-group">

<label for="colors">
الألوان
</label>

<input
type="text"
id="colors"
placeholder="Beige, Nude, Pink">

<div class="hint">
اكتب الألوان مفصولة بفاصلة ,
</div>

</div>


<div class="form-group">

<label for="stock">
المخزون
</label>

<input
type="number"
id="stock"
placeholder="مثال: 10"
min="0">

</div>


<div class="image-section">

<label>
📷 صورة المنتج
</label>

<img
id="preview"
class="preview"
src=""
alt="صورة المنتج">

<input
type="file"
id="imageFile"
accept="image/*">

<div class="hint">
اترك الصورة بدون اختيار للاحتفاظ بالصورة الحالية.
</div>

</div>


<button
id="updateBtn"
class="update-btn">

💾 حفظ التعديلات

</button>


<button
id="backBtn"
class="back-btn">

↩️ العودة إلى المنتجات

</button>

</div>

</div>


<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
doc,
getDoc,
updateDoc

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* =========================
   الحصول على ID المنتج
========================= */

const params =
new URLSearchParams(
window.location.search
);

const productId =
params.get("id");


if(!productId){

document.getElementById("loading").style.display="none";

showError("لم يتم تحديد المنتج.");

throw new Error("Product ID is missing");

}


/* =========================
   المتغيرات
========================= */

let oldImage = "";

let selectedImage = null;


/* =========================
   العناصر
========================= */

const loading =
document.getElementById("loading");

const form =
document.getElementById("form");

const nameInput =
document.getElementById("name");

const priceInput =
document.getElementById("price");

const descriptionInput =
document.getElementById("description");

const colorsInput =
document.getElementById("colors");

const stockInput =
document.getElementById("stock");

const imageFile =
document.getElementById("imageFile");

const preview =
document.getElementById("preview");

const updateBtn =
document.getElementById("updateBtn");


/* =========================
   تحميل المنتج
========================= */

async function loadProduct(){

try{

const productRef =
doc(
db,
"products",
productId
);

const productSnap =
await getDoc(productRef);


if(!productSnap.exists()){

loading.style.display="none";

showError(
"المنتج غير موجود في قاعدة البيانات."
);

return;

}


const product =
productSnap.data();


/* الاسم */

nameInput.value =
product.name || "";


/* السعر */

priceInput.value =
product.price ?? "";


/* الوصف */

descriptionInput.value =
product.description || "";


/* الألوان */

if(Array.isArray(product.colors)){

colorsInput.value =
product.colors.join(", ");

}

else{

colorsInput.value =
product.colors || "";

}


/* المخزون */

stockInput.value =
product.stock ?? 0;


/* الصورة */

oldImage =
product.image || "";


if(oldImage){

preview.src =
oldImage;

}

else{

preview.style.display="none";

}


/* إظهار النموذج */

loading.style.display="none";

form.style.display="block";


}

catch(error){

console.error(error);

loading.style.display="none";

showError(
"حدث خطأ أثناء تحميل المنتج."
);

}

}


loadProduct();


/* =========================
   اختيار صورة جديدة
========================= */

imageFile.addEventListener(
"change",
function(){

selectedImage =
this.files[0] || null;


if(!selectedImage){

return;

}


/* معاينة الصورة */

const reader =
new FileReader();


reader.onload =
function(event){

preview.src =
event.target.result;

preview.style.display="block";

};


reader.readAsDataURL(
selectedImage
);

});


/* =========================
   رفع الصورة إلى Cloudinary
========================= */

async function uploadToCloudinary(file){

const formData =
new FormData();


formData.append(
"file",
file
);


formData.append(
"upload_preset",
"gglam_products"
);


const response =
await fetch(

"https://api.cloudinary.com/v1_1/g82dvrkr/image/upload",

{

method:"POST",

body:formData

}

);


if(!response.ok){

throw new Error(
"Cloudinary upload failed"
);

}


const data =
await response.json();


if(!data.secure_url){

throw new Error(
"لم يتم الحصول على رابط الصورة"
);

}


return data.secure_url;

}


/* =========================
   حفظ التعديلات
========================= */

updateBtn.addEventListener(
"click",
async function(){

hideMessages();


const name =
nameInput.value.trim();


const priceValue =
priceInput.value;


const description =
descriptionInput.value.trim();


const colors =
colorsInput.value

.split(",")

.map(color =>
color.trim()
)

.filter(color =>
color !== ""
);


const stockValue =
stockInput.value;


/* التحقق */

if(!name){

showError(
"يرجى إدخال اسم المنتج."
);

return;

}


if(
priceValue === "" ||
Number(priceValue) < 0
){

showError(
"يرجى إدخال سعر صحيح."
);

return;

}


if(
stockValue === "" ||
Number(stockValue) < 0
){

showError(
"يرجى إدخال مخزون صحيح."
);

return;

}


const price =
Number(priceValue);


const stock =
Number(stockValue);


try{

updateBtn.disabled=true;

updateBtn.textContent=
"⏳ جاري الحفظ...";


/* الصورة القديمة */

let imageUrl =
oldImage;


/* إذا اختار صورة جديدة */

if(selectedImage){

updateBtn.textContent=
"⏳ جاري رفع الصورة...";


imageUrl =
await uploadToCloudinary(
selectedImage
);

}


/* تحديث Firestore */

updateBtn.textContent=
"⏳ جاري حفظ البيانات...";


const productRef =
doc(
db,
"products",
productId
);


await updateDoc(

productRef,

{

name:name,

price:price,

description:description,

colors:colors,

stock:stock,

image:imageUrl

}

);


/* نجاح */

document.getElementById(
"success"
).style.display="block";


window.scrollTo({

top:0,

behavior:"smooth"

});


updateBtn.textContent=
"✅ تم الحفظ";


/*
بعد ثانيتين العودة
*/

setTimeout(()=>{

window.location.href=
"products.html";

},2000);


}

catch(error){

console.error(error);

showError(
"حدث خطأ أثناء حفظ التعديلات: "+
error.message
);


updateBtn.disabled=false;

updateBtn.textContent=
"💾 حفظ التعديلات";

}

});


/* =========================
   العودة
========================= */

document
.getElementById("backBtn")
.addEventListener(
"click",
function(){

window.location.href=
"products.html";

});


/* =========================
   الرسائل
========================= */

function showError(message){

const error =
document.getElementById("error");

error.textContent =
message;

error.style.display="block";

window.scrollTo({

top:0,

behavior:"smooth"

});

}


function hideMessages(){

document.getElementById(
"error"
).style.display="none";

document.getElementById(
"success"
).style.display="none";

}

</script>

</body>

</html>
