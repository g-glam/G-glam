<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | تعديل المنتج</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f5f5f5;
color:#222;
}

/* =========================
   القائمة الجانبية
========================= */

.sidebar{
position:fixed;
right:0;
top:0;
height:100vh;
width:70px;
background:#111;
color:white;
overflow:hidden;
transition:.3s;
z-index:1000;
}

.sidebar:hover{
width:230px;
}

.logo{
height:70px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
border-bottom:1px solid #333;
white-space:nowrap;
}

.menu{
margin-top:20px;
}

.menu a{
display:flex;
align-items:center;
gap:15px;
padding:15px;
color:white;
text-decoration:none;
white-space:nowrap;
}

.menu a:hover{
background:#222;
}

.icon{
min-width:35px;
text-align:center;
font-size:20px;
}

.text{
opacity:0;
transition:.3s;
}

.sidebar:hover .text{
opacity:1;
}

/* =========================
   المحتوى
========================= */

.content{
margin-right:70px;
padding:20px;
}

.header{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-bottom:20px;
}

.header h1{
margin:0;
}

.header p{
color:#777;
margin-bottom:0;
}

/* =========================
   الصندوق
========================= */

.form-box{
max-width:700px;
margin:auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.form-group{
margin-bottom:18px;
}

label{
display:block;
font-weight:bold;
margin-bottom:8px;
}

input,
textarea{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

textarea{
height:120px;
resize:none;
}

input:focus,
textarea:focus{
outline:none;
border-color:#111;
}

/* =========================
   الصورة
========================= */

.image-label{
display:block;
font-weight:bold;
margin-bottom:8px;
}

.preview-box{
text-align:center;
margin:15px 0;
}

#preview{
width:180px;
height:180px;
object-fit:cover;
border-radius:12px;
border:1px solid #ddd;
display:none;
margin:auto;
}

.no-image{
color:#888;
padding:30px;
}

/* =========================
   الزر
========================= */

.update-btn{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#111;
color:white;
font-size:17px;
cursor:pointer;
}

.update-btn:hover{
opacity:.9;
}

.update-btn:disabled{
opacity:.6;
cursor:not-allowed;
}

/* =========================
   الرسائل
========================= */

.message{
display:none;
padding:13px;
border-radius:8px;
text-align:center;
margin-bottom:15px;
}

.success{
background:#d4edda;
color:#155724;
}

.error{
background:#f8d7da;
color:#721c24;
}

/* =========================
   الهاتف
========================= */

@media(max-width:700px){

.sidebar{
width:60px;
}

.sidebar:hover{
width:200px;
}

.content{
margin-right:60px;
padding:10px;
}

.form-box{
padding:18px;
}

}

</style>

</head>

<body>


<!-- =========================
     القائمة الجانبية
========================= -->

<div class="sidebar">

<div class="logo">
G-Glam
</div>

<div class="menu">

<a href="index.html">
<span class="icon">⌂</span>
<span class="text">الرئيسية</span>
</a>

<a href="orders.html">
<span class="icon">▣</span>
<span class="text">الطلبات</span>
</a>

<a href="products.html">
<span class="icon">□</span>
<span class="text">المنتجات</span>
</a>

<a href="add-product.html">
<span class="icon">+</span>
<span class="text">إضافة منتج</span>
</a>

<a href="delivery.html">
<span class="icon">🚚</span>
<span class="text">أسعار التوصيل</span>
</a>

<a href="settings.html">
<span class="icon">⚙</span>
<span class="text">الإعدادات</span>
</a>

</div>

</div>


<!-- =========================
     المحتوى
========================= -->

<div class="content">

<div class="header">

<h1>
✏️ تعديل المنتج
</h1>

<p>
تعديل معلومات المنتج والصورة والمخزون
</p>

</div>


<div class="form-box">


<div
id="success"
class="message success">
</div>


<div
id="error"
class="message error">
</div>


<!-- اسم المنتج -->

<div class="form-group">

<label>
اسم المنتج
</label>

<input
id="name"
type="text"
placeholder="اسم المنتج">

</div>


<!-- السعر -->

<div class="form-group">

<label>
السعر DA
</label>

<input
id="price"
type="number"
min="0"
placeholder="مثال: 150">

</div>


<!-- الوصف -->

<div class="form-group">

<label>
وصف المنتج
</label>

<textarea
id="description"
placeholder="اكتب وصف المنتج..."></textarea>

</div>


<!-- الألوان -->

<div class="form-group">

<label>
الألوان
</label>

<input
id="colors"
type="text"
placeholder="Beige, Nude, Pink">

<small>
اكتب الألوان مفصولة بفاصلة ,
</small>

</div>


<!-- المخزون -->

<div class="form-group">

<label>
المخزون
</label>

<input
id="stock"
type="number"
min="0"
placeholder="مثال: 20">

</div>


<!-- الصورة -->

<div class="form-group">

<label class="image-label">
📷 تغيير صورة المنتج
</label>

<input
id="imageFile"
type="file"
accept="image/*">

</div>


<div class="preview-box">

<img
id="preview"
src=""
alt="صورة المنتج">

<div
id="noImage"
class="no-image">

لا توجد صورة

</div>

</div>


<button
id="updateBtn"
class="update-btn">

💾 حفظ التعديلات

</button>


</div>

</div>


<script type="module">


/* =========================
   Firebase
========================= */

import { initializeApp }

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
doc,
getDoc,
updateDoc

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:"g-glam.firebaseapp.com",

projectId:"g-glam",

storageBucket:"g-glam.firebasestorage.app",

messagingSenderId:"997228419719",

appId:"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:"G-WX1K1F83F6"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* =========================
   الحصول على ID المنتج
========================= */

const params =
new URLSearchParams(
window.location.search
);

const productId =
params.get("id");


if(!productId){

alert("لم يتم تحديد المنتج.");

window.location.href="products.html";

}


/* =========================
   المتغيرات
========================= */

let oldImage="";

let selectedImage=null;


/* =========================
   العناصر
========================= */

const nameInput =
document.getElementById("name");

const priceInput =
document.getElementById("price");

const descriptionInput =
document.getElementById("description");

const colorsInput =
document.getElementById("colors");

const stockInput =
document.getElementById("stock");

const imageFile =
document.getElementById("imageFile");

const preview =
document.getElementById("preview");

const noImage =
document.getElementById("noImage");

const updateBtn =
document.getElementById("updateBtn");

const success =
document.getElementById("success");

const errorBox =
document.getElementById("error");


/* =========================
   عرض رسالة
========================= */

function showMessage(
element,
message
){

element.textContent=message;

element.style.display="block";

setTimeout(()=>{

element.style.display="none";

},4000);

}


/* =========================
   عرض الصورة
========================= */

function showImage(url){

if(url){

preview.src=url;

preview.style.display="block";

noImage.style.display="none";

}else{

preview.style.display="none";

noImage.style.display="block";

}

}


/* =========================
   تحميل المنتج
========================= */

async function loadProduct(){

try{

if(!productId)return;


const productRef =
doc(
db,
"products",
productId
);


const productSnap =
await getDoc(productRef);


if(!productSnap.exists()){

alert("المنتج غير موجود.");

window.location.href="products.html";

return;

}


const product =
productSnap.data();


nameInput.value =
product.name || "";


priceInput.value =
product.price ?? "";


descriptionInput.value =
product.description || "";


if(Array.isArray(product.colors)){

colorsInput.value =
product.colors.join(", ");

}else{

colorsInput.value =
product.colors || "";

}


stockInput.value =
product.stock ?? "";


oldImage =
product.image || "";


showImage(oldImage);

}

catch(error){

console.error(error);

showMessage(
errorBox,
"❌ حدث خطأ أثناء تحميل المنتج."
);

}

}


/* =========================
   اختيار صورة جديدة
========================= */

imageFile.addEventListener(
"change",
function(){

selectedImage =
this.files[0] || null;


if(!selectedImage){

showImage(oldImage);

return;

}


const reader =
new FileReader();


reader.onload =
function(event){

showImage(
event.target.result
);

};


reader.readAsDataURL(
selectedImage
);

});


/* =========================
   تحديث المنتج
========================= */

updateBtn.addEventListener(
"click",
async function(){

const name =
nameInput.value.trim();


const price =
Number(priceInput.value);


const description =
descriptionInput.value.trim();


const colors =
colorsInput.value
.split(",")
.map(color=>color.trim())
.filter(color=>color);


const stock =
Number(stockInput.value);


if(!name){

alert("يرجى إدخال اسم المنتج.");

return;

}


if(
priceInput.value === "" ||
price < 0
){

alert("يرجى إدخال سعر صحيح.");

return;

}


if(
stockInput.value === "" ||
stock < 0
){

alert("يرجى إدخال مخزون صحيح.");

return;

}


updateBtn.disabled=true;

updateBtn.textContent=
"⏳ جاري الحفظ...";


try{

let imageUrl =
oldImage;


/* =========================
   رفع صورة جديدة
========================= */

if(selectedImage){

const formData =
new FormData();


formData.append(
"file",
selectedImage
);


formData.append(
"upload_preset",
"gglam_products"
);


const response =
await fetch(

"https://api.cloudinary.com/v1_1/g82dvrkr/image/upload",

{

method:"POST",

body:formData

}

);


if(!response.ok){

throw new Error(
"فشل رفع الصورة"
);

}


const data =
await response.json();


if(!data.secure_url){

throw new Error(
"لم يتم الحصول على رابط الصورة"
);

}


imageUrl =
data.secure_url;

}


/* =========================
   تحديث Firebase
========================= */

await updateDoc(

doc(
db,
"products",
productId
),

{

name:name,

price:price,

description:description,

colors:colors,

stock:stock,

image:imageUrl

}

);


showMessage(
success,
"تم تعديل المنتج بنجاح ✅"
);


setTimeout(()=>{

window.location.href=
"products.html";

},1200);

}

catch(error){

console.error(error);

showMessage(
errorBox,
"❌ حدث خطأ أثناء حفظ التعديلات: "+
error.message
);

}

finally{

updateBtn.disabled=false;

updateBtn.textContent=
"💾 حفظ التعديلات";

}

});


/* =========================
   تشغيل
========================= */

loadProduct();

</script>

</body>

</html>
