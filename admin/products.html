<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | المنتجات</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#222;
}

/* القائمة الجانبية */

.sidebar{
position:fixed;
right:0;
top:0;
height:100vh;
width:70px;
background:#111;
color:white;
overflow:hidden;
transition:.3s;
z-index:1000;
}

.sidebar:hover{
width:230px;
}

.logo{
height:70px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
border-bottom:1px solid #333;
white-space:nowrap;
}

.menu{
margin-top:20px;
}

.menu a{
display:flex;
align-items:center;
gap:15px;
padding:15px;
color:white;
text-decoration:none;
white-space:nowrap;
}

.menu a:hover{
background:#222;
}

.icon{
min-width:35px;
text-align:center;
font-size:20px;
}

.text{
opacity:0;
transition:.3s;
}

.sidebar:hover .text{
opacity:1;
}

/* المحتوى */

.content{
margin-right:70px;
padding:20px;
}

.header{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-bottom:20px;
}

.header h1{
margin:0;
}

.header p{
color:#777;
margin-bottom:0;
}

/* معلومات المتجر */

.store-info{
background:#fff;
padding:15px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.store-info p{
margin:6px 0;
}

/* البحث */

.search-box{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:20px;
}

.search-box input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
}

/* شبكة المنتجات */

.products-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
}

.product-card{
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
text-align:center;
}

.product-card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:10px;
background:#eee;
}

.product-card h3{
margin:12px 0;
}

.price{
font-size:18px;
font-weight:bold;
}

.stock{
color:#666;
margin:10px 0;
}

button{
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
font-size:14px;
}

.edit-btn{
background:#111;
color:white;
margin-left:5px;
}

.delete-btn{
background:#c62828;
color:white;
}

.empty{
background:white;
padding:30px;
border-radius:12px;
text-align:center;
color:#777;
grid-column:1/-1;
}

.loading{
background:white;
padding:30px;
border-radius:12px;
text-align:center;
grid-column:1/-1;
}

.error{
background:#f8d7da;
color:#721c24;
padding:20px;
border-radius:12px;
text-align:center;
grid-column:1/-1;
}

@media(max-width:1000px){

.products-grid{
grid-template-columns:repeat(3,1fr);
}

}

@media(max-width:700px){

.products-grid{
grid-template-columns:1fr;
}

.content{
margin-right:60px;
padding:10px;
}

.sidebar{
width:60px;
}

.sidebar:hover{
width:200px;
}

}

</style>

</head>

<body>


<!-- القائمة الجانبية -->

<div class="sidebar">

<div class="logo">
G-Glam
</div>

<div class="menu">

<a href="dashboard.html">

<span class="icon">⌂</span>

<span class="text">
الرئيسية
</span>

</a>

<a href="orders.html">

<span class="icon">▣</span>

<span class="text">
الطلبات
</span>

</a>

<a href="products.html">

<span class="icon">□</span>

<span class="text">
المنتجات
</span>

</a>

<a href="add-product.html">

<span class="icon">+</span>

<span class="text">
إضافة منتج
</span>

</a>

<a href="delivery.html">

<span class="icon">🚚</span>

<span class="text">
أسعار التوصيل
</span>

</a>

<a href="settings.html">

<span class="icon">⚙</span>

<span class="text">
الإعدادات
</span>

</a>

</div>

</div>


<!-- المحتوى -->

<div class="content">


<div class="header">

<h1>
G-Glam
</h1>

<p>
إدارة منتجات متجرك
</p>

</div>


<!-- معلومات المتجر -->

<div class="store-info">

<p>
<strong>🏪 المتجر:</strong>

<span id="storeName">
جاري التحميل...
</span>
</p>

<p>
<strong>📧 البريد:</strong>

<span id="ownerEmail">
جاري التحميل...
</span>
</p>

<p>
<strong>🛍️ عدد المنتجات:</strong>

<span id="productsCount">
0
</span>

</p>

</div>


<!-- البحث -->

<div class="search-box">

<input
id="searchInput"
type="text"
placeholder="🔎 البحث عن منتج...">

</div>


<!-- المنتجات -->

<div
class="products-grid"
id="productsList">

<div class="loading">
⏳ جاري تحميل منتجات متجرك...
</div>

</div>


</div>


<script type="module">


/* =========================================
   Firebase
========================================= */

import { initializeApp }

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
collection,
getDocs,
doc,
deleteDoc,
query,
where

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


import {

getAuth,
onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


/* =========================================
   Firebase Config
========================================= */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);


/* =========================================
   العناصر
========================================= */

const productsList =
document.getElementById(
"productsList"
);

const searchInput =
document.getElementById(
"searchInput"
);

const storeNameElement =
document.getElementById(
"storeName"
);

const ownerEmailElement =
document.getElementById(
"ownerEmail"
);

const productsCountElement =
document.getElementById(
"productsCount"
);


/* =========================================
   المتغيرات
========================================= */

let products = [];

let currentOwnerEmail = "";

let currentStoreId = "";

let currentStoreName = "";


/* =========================================
   الحصول على البريد
========================================= */

function getSavedEmail(){

const savedEmail =
localStorage.getItem(
"storeOwnerEmail"
);

if(savedEmail){

return savedEmail;

}


const savedOwnerEmail =
localStorage.getItem(
"ownerEmail"
);

if(savedOwnerEmail){

return savedOwnerEmail;

}


return "";

}


/* =========================================
   تحميل بيانات المتجر
========================================= */

async function loadStoreAndProducts(){

try{


/*
   أولًا نحصل على المستخدم
*/

const user =
auth.currentUser;


/*
   البريد من Firebase Authentication
*/

if(user && user.email){

currentOwnerEmail =
user.email;

}


/*
   إذا لم يوجد المستخدم،
   نحاول localStorage
*/

if(!currentOwnerEmail){

currentOwnerEmail =
getSavedEmail();

}


/*
   إذا لم نجد البريد
*/

if(!currentOwnerEmail){

ownerEmailElement.textContent =
"غير مسجل";

storeNameElement.textContent =
"غير معروف";

productsList.innerHTML = `

<div class="error">

❌ لم يتم العثور على صاحب المتجر.

<br><br>

يرجى تسجيل الدخول أولًا.

</div>

`;

return;

}


/*
   عرض البريد
*/

ownerEmailElement.textContent =
currentOwnerEmail;


/* =====================================
   البحث عن متجر صاحب البريد
===================================== */

const storeQuery =
query(

collection(db,"stores"),

where(
"ownerEmail",
"==",
currentOwnerEmail
)

);


const storeSnapshot =
await getDocs(
storeQuery
);


/*
   إذا وجد المتجر
*/

if(!storeSnapshot.empty){

const storeDoc =
storeSnapshot.docs[0];

const storeData =
storeDoc.data();


currentStoreId =
storeDoc.id;


currentStoreName =
storeData.storeName ||
"G-Glam";


storeNameElement.textContent =
currentStoreName;


/*
   حفظ المعلومات
*/

localStorage.setItem(
"storeId",
currentStoreId
);

localStorage.setItem(
"storeName",
currentStoreName
);

localStorage.setItem(
"storeOwnerEmail",
currentOwnerEmail
);

}
else{

/*
   لم نجد متجرًا لهذا البريد
*/

currentStoreName =
"G-Glam";

storeNameElement.textContent =
"G-Glam";

}


/* =====================================
   تحميل المنتجات
===================================== */


/*
   مهم جدًا:

   نبحث فقط عن المنتجات التي
   ownerEmail فيها يساوي بريد
   صاحب المتجر الحالي.
*/

const productsQuery =
query(

collection(db,"products"),

where(
"ownerEmail",
"==",
currentOwnerEmail
)

);


const snapshot =
await getDocs(
productsQuery
);


products = [];


snapshot.forEach(
function(item){

products.push({

id:item.id,

...item.data()

});

});


/*
   عدد المنتجات
*/

productsCountElement.textContent =
products.length;


/*
   عرض المنتجات
*/

displayProducts(products);


}catch(error){

console.error(
"Products loading error:",
error
);

productsList.innerHTML = `

<div class="error">

❌ حدث خطأ أثناء تحميل المنتجات.

<br><br>

${error.message}

</div>

`;

}

}


/* =========================================
   عرض المنتجات
========================================= */

function displayProducts(data){

productsList.innerHTML = "";


if(data.length === 0){

productsList.innerHTML = `

<div class="empty">

🛍️ لا توجد منتجات في متجرك حاليًا.

<br><br>

يمكنك إضافة منتج جديد من زر
<strong>إضافة منتج</strong>.

</div>

`;

return;

}


data.forEach(
function(product){


const card =
document.createElement(
"div"
);

card.className =
"product-card";


const image =
product.image ||
"https://via.placeholder.com/400x400?text=G-Glam";


card.innerHTML = `

<img
src="${image}"
alt="${escapeHtml(product.name || 'منتج')}"
>


<h3>

${escapeHtml(
product.name || "بدون اسم"
)}

</h3>


<div class="price">

${product.price || 0} DA

</div>


<div class="stock">

المخزون:

${product.stock || 0}

</div>


<button
class="edit-btn"
data-id="${product.id}">

✏️ تعديل

</button>


<button
class="delete-btn"
data-id="${product.id}">

🗑️ حذف

</button>

`;


/*
   زر التعديل
*/

card
.querySelector(".edit-btn")
.addEventListener(
"click",
function(){

editProduct(
product.id
);

}
);


/*
   زر الحذف
*/

card
.querySelector(".delete-btn")
.addEventListener(
"click",
function(){

deleteProduct(
product.id
);

}
);


productsList.appendChild(card);

}

);

}


/* =========================================
   حماية HTML
========================================= */

function escapeHtml(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =========================================
   تعديل المنتج
========================================= */

function editProduct(id){

window.location.href =
"edit-product.html?id=" + id;

}


/* =========================================
   حذف المنتج
========================================= */

async function deleteProduct(id){

const confirmDelete =
confirm(
"هل تريد حذف هذا المنتج؟"
);


if(!confirmDelete){

return;

}


try{


await deleteDoc(

doc(
db,
"products",
id
)

);


alert(
"تم حذف المنتج بنجاح ✅"
);


/*
   إعادة تحميل منتجات
   صاحب المتجر الحالي فقط
*/

await loadStoreAndProducts();


}catch(error){

console.error(error);

alert(

"حدث خطأ أثناء حذف المنتج:\n" +
error.message

);

}

}


/* =========================================
   البحث
========================================= */

searchInput.addEventListener(
"input",
function(){

const value =
this.value
.trim()
.toLowerCase();


const result =
products.filter(
function(product){

return (

product.name &&

product.name
.toLowerCase()
.includes(value)

);

}
);


displayProducts(result);

}
);


/* =========================================
   انتظار تسجيل الدخول
========================================= */

onAuthStateChanged(
auth,
async function(user){

/*
   إذا كان المستخدم مسجلًا
*/

if(user && user.email){

currentOwnerEmail =
user.email;


/*
   تحميل المتجر والمنتجات
*/

await loadStoreAndProducts();

}

else{

/*
   إذا لم يكن Firebase Auth
   يحمل المستخدم، نحاول localStorage
*/

currentOwnerEmail =
getSavedEmail();


if(currentOwnerEmail){

await loadStoreAndProducts();

}
else{

productsList.innerHTML = `

<div class="error">

❌ يجب تسجيل الدخول إلى حساب صاحب المتجر أولًا.

</div>

`;

}

}

});


</script>

</body>

</html>
