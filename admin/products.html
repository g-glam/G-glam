<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G-Glam | المنتجات</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#222;

}


/* القائمة الجانبية */

.sidebar{

position:fixed;
right:0;
top:0;
height:100vh;
width:70px;
background:#111;
color:white;
overflow:hidden;
transition:.3s;
z-index:1000;

}


.sidebar:hover{

width:230px;

}



.logo{

height:70px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
border-bottom:1px solid #333;
white-space:nowrap;

}



.menu{

margin-top:20px;

}



.menu a{

display:flex;
align-items:center;
gap:15px;
padding:15px;
color:white;
text-decoration:none;
white-space:nowrap;

}



.menu a:hover{

background:#222;

}



.icon{

min-width:35px;
text-align:center;
font-size:20px;

}



.text{

opacity:0;
transition:.3s;

}



.sidebar:hover .text{

opacity:1;

}


/* المحتوى */

.content{

margin-right:70px;
padding:20px;

}


.header{

background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-bottom:20px;

}


.header h1{

margin:0;

}


.header p{

color:#777;

}
  /* البحث */

.search-box{

background:white;
padding:15px;
border-radius:12px;
margin-bottom:20px;

}



.search-box input{

width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;

}



/* شبكة المنتجات */

.products-grid{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;

}




.product-card{

background:white;
padding:15px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
text-align:center;

}




.product-card img{

width:100%;
height:220px;
object-fit:cover;
border-radius:10px;

}




.product-card h3{

margin:12px 0;

}




.price{

font-size:18px;
font-weight:bold;

}




.stock{

color:#666;
margin:10px 0;

}




button{

border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
font-size:14px;

}




.edit-btn{

background:#111;
color:white;
margin-left:5px;

}




.delete-btn{

background:#c62828;
color:white;

}





@media(max-width:1000px){

.products-grid{

grid-template-columns:repeat(3,1fr);

}

}



@media(max-width:700px){


.products-grid{

grid-template-columns:1fr;

}


.content{

margin-right:60px;
padding:10px;

}


.sidebar{

width:60px;

}


.sidebar:hover{

width:200px;

}


}


</style>


</head>


<body>



<!-- القائمة الجانبية -->

<div class="sidebar">


<div class="logo">

G-Glam

</div>



<div class="menu">


<a href="index.html">

<span class="icon">⌂</span>

<span class="text">
الرئيسية
</span>

</a>




<a href="orders.html">

<span class="icon">▣</span>

<span class="text">
الطلبات
</span>

</a>




<a href="products.html">

<span class="icon">□</span>

<span class="text">
المنتجات
</span>

</a>




<a href="add-product.html">

<span class="icon">+</span>

<span class="text">
إضافة منتج
</span>

</a>




<a href="settings.html">

<span class="icon">⚙</span>

<span class="text">
الإعدادات
</span>

</a>


</div>


</div>

<div class="content">


<div class="header">

<h1>
G-Glam
</h1>


<p>
إدارة المنتجات
</p>

</div>




<div class="search-box">


<input

id="searchInput"

type="text"

placeholder="البحث عن منتج...">


</div>





<div class="products-grid" id="productsList">


</div>



</div>







<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";



import {

getFirestore,

collection,

getDocs,

doc,

deleteDoc

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";





const firebaseConfig = {


apiKey: "AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain: "g-glam.firebaseapp.com",

projectId: "g-glam",

storageBucket: "g-glam.firebasestorage.app",

messagingSenderId: "997228419719",

appId: "1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId: "G-WX1K1F83F6"

};




const app = initializeApp(firebaseConfig);



const db = getFirestore(app);




const productsList =

document.getElementById("productsList");



const searchInput =

document.getElementById("searchInput");




let products=[];






async function loadProducts(){


productsList.innerHTML="";


const snapshot = await getDocs(

collection(db,"products")

);



products=[];




snapshot.forEach((item)=>{


products.push({

id:item.id,

...item.data()

});


});



displayProducts(products);


}





function displayProducts(data){


productsList.innerHTML="";



data.forEach(product=>{


productsList.innerHTML += `


<div class="product-card">


<img src="${product.image || ''}">



<h3>

${product.name || ''}

</h3>




<div class="price">

${product.price || 0} DA

</div>




<div class="stock">

المخزون:

${product.stock || 0}

</div>




<button

class="edit-btn"

onclick="editProduct('${product.id}')">

تعديل

</button>





<button

class="delete-btn"

onclick="deleteProduct('${product.id}')">

حذف

</button>



</div>


`;



});


}





loadProducts();
  


// فتح صفحة تعديل المنتج


window.editProduct = function(id){


window.location.href =

"edit-product.html?id=" + id;


};







// حذف المنتج


window.deleteProduct = async function(id){



let confirmDelete = confirm(

"هل تريد حذف هذا المنتج؟"

);



if(!confirmDelete){

return;

}



try{


await deleteDoc(

doc(db,"products",id)

);



alert(

"تم حذف المنتج بنجاح"

);



loadProducts();



}


catch(error){


console.error(error);


alert(

"حدث خطأ أثناء حذف المنتج"

);


}


};







// البحث عن منتج


searchInput.addEventListener(

"input",

function(){



let value =

this.value.toLowerCase();




let result = products.filter(product=>{



return (


product.name &&

product.name

.toLowerCase()

.includes(value)


);



});




displayProducts(result);



});





</script>


</body>
