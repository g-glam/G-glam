<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | المنتجات</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f5f5f5;
color:#222;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
position:fixed;
right:0;
top:0;
height:100vh;
width:70px;
background:#111;
color:white;
overflow:hidden;
transition:.3s;
z-index:1000;
}

.sidebar:hover{
width:230px;
}

.logo{
height:70px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
border-bottom:1px solid #333;
white-space:nowrap;
}

.menu{
margin-top:20px;
}

.menu a{
display:flex;
align-items:center;
gap:15px;
padding:15px;
color:white;
text-decoration:none;
white-space:nowrap;
transition:.2s;
}

.menu a:hover{
background:#222;
}

.icon{
min-width:35px;
text-align:center;
font-size:20px;
}

.text{
opacity:0;
transition:.3s;
}

.sidebar:hover .text{
opacity:1;
}

/* =========================
   CONTENT
========================= */

.content{
margin-right:70px;
padding:20px;
}

.header{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-bottom:20px;
}

.header h1{
margin:0;
font-size:28px;
}

.header p{
color:#777;
margin-bottom:0;
}

/* =========================
   TOP
========================= */

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
margin-bottom:20px;
flex-wrap:wrap;
}

.add-btn{
background:#111;
color:white;
border:none;
padding:12px 18px;
border-radius:8px;
cursor:pointer;
font-size:15px;
text-decoration:none;
display:inline-block;
}

.add-btn:hover{
opacity:.9;
}

/* =========================
   SEARCH
========================= */

.search-box{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.search-box input{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
outline:none;
}

.search-box input:focus{
border-color:#111;
}

/* =========================
   PRODUCTS
========================= */

.products-box{
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.products-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
}

/* =========================
   CARD
========================= */

.product-card{
background:white;
border:1px solid #eee;
border-radius:14px;
overflow:hidden;
transition:.2s;
position:relative;
}

.product-card:hover{
transform:translateY(-2px);
box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.product-image{
width:100%;
height:220px;
object-fit:cover;
background:#f5f5f5;
display:block;
}

.no-image{
height:220px;
display:flex;
align-items:center;
justify-content:center;
background:#f3f3f3;
color:#999;
font-size:45px;
}

.product-info{
padding:15px;
}

.product-name{
font-size:18px;
font-weight:bold;
margin-bottom:8px;
}

.product-price{
font-size:18px;
font-weight:bold;
margin-bottom:8px;
}

.product-description{
font-size:14px;
color:#777;
line-height:1.6;
height:45px;
overflow:hidden;
margin-bottom:10px;
}

.product-stock{
font-size:14px;
margin-bottom:12px;
}

.colors{
display:flex;
flex-wrap:wrap;
gap:5px;
margin-bottom:12px;
}

.color{
background:#f1f1f1;
padding:5px 8px;
border-radius:5px;
font-size:12px;
}

.actions{
display:flex;
gap:7px;
}

.actions button{
flex:1;
border:none;
padding:10px 5px;
border-radius:7px;
cursor:pointer;
font-size:13px;
}

.edit-btn{
background:#eee;
color:#222;
}

.delete-btn{
background:#f1dede;
color:#a00000;
}

.edit-btn:hover,
.delete-btn:hover{
opacity:.8;
}

/* =========================
   LOADING
========================= */

.loading{
text-align:center;
padding:50px;
color:#777;
font-size:18px;
}

/* =========================
   EMPTY
========================= */

.empty{
text-align:center;
padding:50px;
color:#777;
font-size:18px;
}

/* =========================
   ERROR
========================= */

.message{
display:none;
padding:12px;
border-radius:8px;
margin-bottom:15px;
text-align:center;
}

.error{
background:#f8d7da;
color:#721c24;
}

.success{
background:#d4edda;
color:#155724;
}

/* =========================
   MOBILE
========================= */

@media(max-width:1100px){

.products-grid{
grid-template-columns:repeat(3,1fr);
}

}

@media(max-width:800px){

.products-grid{
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.product-image,
.no-image{
height:180px;
}

}

@media(max-width:700px){

.sidebar{
width:60px;
}

.sidebar:hover{
width:200px;
}

.content{
margin-right:60px;
padding:10px;
}

.header{
padding:15px;
}

.header h1{
font-size:22px;
}

.products-grid{
grid-template-columns:1fr;
}

.product-image,
.no-image{
height:240px;
}

}

/* =========================
   SMALL SCREEN
========================= */

@media(max-width:400px){

.products-grid{
grid-template-columns:1fr;
}

.product-image,
.no-image{
height:220px;
}

}

</style>

</head>

<body>


<!-- =========================
     SIDEBAR
========================= -->

<div class="sidebar">

<div class="logo">
G-Glam
</div>

<div class="menu">

<a href="index.html">

<span class="icon">⌂</span>

<span class="text">
الرئيسية
</span>

</a>


<a href="orders.html">

<span class="icon">▣</span>

<span class="text">
الطلبات
</span>

</a>


<a href="products.html">

<span class="icon">□</span>

<span class="text">
المنتجات
</span>

</a>


<a href="add-product.html">

<span class="icon">＋</span>

<span class="text">
إضافة منتج
</span>

</a>


<a href="delivery.html">

<span class="icon">🚚</span>

<span class="text">
أسعار التوصيل
</span>

</a>


<a href="stores.html">

<span class="icon">🏪</span>

<span class="text">
المتاجر
</span>

</a>


<a href="settings.html">

<span class="icon">⚙</span>

<span class="text">
الإعدادات
</span>

</a>

</div>

</div>


<!-- =========================
     CONTENT
========================= -->

<div class="content">


<div class="header">

<div class="top">

<div>

<h1>
📦 المنتجات
</h1>

<p>
إدارة منتجات متجر G-Glam
</p>

</div>


<a
href="add-product.html"
class="add-btn">

➕ إضافة منتج

</a>

</div>

</div>


<!-- الرسائل -->

<div
id="successMessage"
class="message success">
</div>


<div
id="errorMessage"
class="message error">
</div>


<!-- البحث -->

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="🔎 البحث عن اسم المنتج أو الوصف أو اللون...">

</div>


<!-- المنتجات -->

<div class="products-box">

<div
id="loading"
class="loading">

⏳ جاري تحميل المنتجات...

</div>


<div
id="productsGrid"
class="products-grid"
style="display:none;">
</div>


<div
id="empty"
class="empty"
style="display:none;">

📦 لا توجد منتجات

</div>

</div>


</div>


<script type="module">


/* =========================
   FIREBASE
========================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
collection,
getDocs,
doc,
deleteDoc

}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


/* =========================
   ELEMENTS
========================= */

const productsGrid =
document.getElementById("productsGrid");

const loading =
document.getElementById("loading");

const empty =
document.getElementById("empty");

const searchInput =
document.getElementById("searchInput");

const successMessage =
document.getElementById("successMessage");

const errorMessage =
document.getElementById("errorMessage");


/* =========================
   DATA
========================= */

let products = [];


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

loading.style.display="block";

productsGrid.style.display="none";

empty.style.display="none";

productsGrid.innerHTML="";


try{

const snapshot =
await getDocs(
collection(db,"products")
);


products=[];


snapshot.forEach(item=>{

products.push({

id:item.id,

...item.data()

});

});


loading.style.display="none";


if(products.length===0){

empty.style.display="block";

return;

}


productsGrid.style.display="grid";


displayProducts(products);


}

catch(error){

console.error(error);

loading.style.display="none";

showError(
"حدث خطأ أثناء تحميل المنتجات: "+
error.message
);

}

}


/* =========================
   DISPLAY PRODUCTS
========================= */

function displayProducts(data){

productsGrid.innerHTML="";


if(data.length===0){

empty.style.display="block";

return;

}


empty.style.display="none";


data.forEach(product=>{


const card =
document.createElement("div");

card.className="product-card";


/* الصورة */

let imageHTML="";


if(product.image){

imageHTML=`

<img
class="product-image"
src="${escapeAttribute(product.image)}"
alt="${escapeAttribute(product.name || "منتج")}"
loading="lazy"
onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">

<div
class="no-image"
style="display:none;">

📷

</div>

`;

}

else{

imageHTML=`

<div class="no-image">

📷

</div>

`;

}


/* الألوان */

let colorsHTML="";


if(
Array.isArray(product.colors)
&&
product.colors.length>0
){

colorsHTML=`

<div class="colors">

${
product.colors
.map(color=>`

<span class="color">
${escapeHTML(color)}
</span>

`)
.join("")
}

</div>

`;

}


/* المخزون */

let stock =
Number(product.stock || 0);


let stockText="";

if(stock<=0){

stockText=`
<span style="color:#c62828;">
❌ نفد المخزون
</span>
`;

}

else{

stockText=`
<span style="color:#2e7d32;">
✅ المخزون: ${stock}
</span>
`;

}


/* البطاقة */

card.innerHTML=`

${imageHTML}

<div class="product-info">

<div class="product-name">

${escapeHTML(product.name || "بدون اسم")}

</div>


<div class="product-price">

${Number(product.price || 0).toLocaleString("fr-DZ")}
DA

</div>


<div class="product-description">

${escapeHTML(product.description || "لا يوجد وصف")}

</div>


<div class="product-stock">

${stockText}

</div>


${colorsHTML}


<div class="actions">


<button
class="edit-btn"
data-id="${escapeAttribute(product.id)}">

✏️ تعديل

</button>


<button
class="delete-btn"
data-id="${escapeAttribute(product.id)}">

🗑️ حذف

</button>


</div>


</div>

`;


productsGrid.appendChild(card);


});


/* أزرار التعديل */

document
.querySelectorAll(".edit-btn")
.forEach(button=>{

button.addEventListener(
"click",
()=>{

const id =
button.dataset.id;

window.location.href =
"edit-product.html?id="+
encodeURIComponent(id);

}

);

});


/* أزرار الحذف */

document
.querySelectorAll(".delete-btn")
.forEach(button=>{

button.addEventListener(
"click",
()=>{

const id =
button.dataset.id;

deleteProduct(id);

}

);

});

}


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id){


const product =
products.find(
item=>item.id===id
);


if(!product){

showError(
"لم يتم العثور على المنتج."
);

return;

}


const productName =
product.name ||
"هذا المنتج";


const confirmed =
confirm(

"⚠️ هل أنت متأكد من حذف المنتج؟\n\n"+
productName+
"\n\n"+
"سيتم حذف المنتج من Firestore."

);


if(!confirmed){

return;

}


try{


await deleteDoc(

doc(
db,
"products",
id
)

);


showSuccess(
"تم حذف المنتج بنجاح ✅"
);


await loadProducts();


}

catch(error){

console.error(error);

showError(
"فشل حذف المنتج: "+
error.message
);

}

}


/* =========================
   SEARCH
========================= */

searchInput
.addEventListener(
"input",
function(){

const value =
this.value
.trim()
.toLowerCase();


if(!value){

displayProducts(products);

return;

}


const result =
products.filter(product=>{


const name =
String(
product.name || ""
)
.toLowerCase();


const description =
String(
product.description || ""
)
.toLowerCase();


const storeId =
String(
product.storeId || ""
)
.toLowerCase();


let colors="";


if(
Array.isArray(product.colors)
){

colors =
product.colors
.join(" ")
.toLowerCase();

}


return (

name.includes(value)

||

description.includes(value)

||

colors.includes(value)

||

storeId.includes(value)

);

});


displayProducts(result);

}
);


/* =========================
   MESSAGES
========================= */

function showSuccess(message){

successMessage.textContent =
message;

successMessage.style.display =
"block";

errorMessage.style.display =
"none";


setTimeout(()=>{

successMessage.style.display =
"none";

},3000);

}


function showError(message){

errorMessage.textContent =
message;

errorMessage.style.display =
"block";

successMessage.style.display =
"none";


setTimeout(()=>{

errorMessage.style.display =
"none";

},5000);

}


/* =========================
   SECURITY / HTML
========================= */

function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


function escapeAttribute(value){

return escapeHTML(value);

}


/* =========================
   START
========================= */

loadProducts();

</script>

</body>

</html>
