<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | المنتجات</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

margin:0;

background:#f5f5f5;

color:#222;

}

/* =========================
   القائمة الجانبية
========================= */

.sidebar{

position:fixed;

right:0;
top:0;

height:100vh;

width:70px;

background:#111;

color:white;

overflow:hidden;

transition:.3s;

z-index:1000;

}

.sidebar:hover{

width:230px;

}

.logo{

height:70px;

display:flex;

align-items:center;

justify-content:center;

font-size:22px;

font-weight:bold;

border-bottom:1px solid #333;

white-space:nowrap;

}

.menu{

margin-top:20px;

}

.menu a{

display:flex;

align-items:center;

gap:15px;

padding:15px;

color:white;

text-decoration:none;

white-space:nowrap;

transition:.2s;

}

.menu a:hover{

background:#222;

}

.icon{

min-width:35px;

text-align:center;

font-size:20px;

}

.text{

opacity:0;

transition:.3s;

}

.sidebar:hover .text{

opacity:1;

}

/* =========================
   المحتوى
========================= */

.content{

margin-right:70px;

padding:20px;

}

.header{

background:white;

padding:20px;

border-radius:12px;

box-shadow:0 2px 10px rgba(0,0,0,.08);

margin-bottom:20px;

}

.header h1{

margin:0;

font-size:28px;

}

.header p{

margin-bottom:0;

color:#777;

}

/* =========================
   شريط الأدوات
========================= */

.toolbar{

background:white;

padding:15px;

border-radius:12px;

box-shadow:0 2px 10px rgba(0,0,0,.08);

margin-bottom:20px;

display:flex;

gap:10px;

align-items:center;

justify-content:space-between;

flex-wrap:wrap;

}

.search{

flex:1;

min-width:200px;

}

.search input{

width:100%;

padding:12px;

border:1px solid #ddd;

border-radius:8px;

font-size:15px;

}

.add-btn{

background:#111;

color:white;

border:none;

padding:12px 18px;

border-radius:8px;

cursor:pointer;

font-size:15px;

text-decoration:none;

display:inline-block;

}

/* =========================
   المنتجات
========================= */

.products-box{

background:white;

padding:15px;

border-radius:12px;

box-shadow:0 2px 10px rgba(0,0,0,.08);

}

.loading{

text-align:center;

padding:40px;

color:#777;

}

.products-grid{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:18px;

}

.product-card{

border:1px solid #eee;

border-radius:12px;

overflow:hidden;

background:white;

transition:.2s;

}

.product-card:hover{

box-shadow:
0 5px 15px
rgba(0,0,0,.10);

transform:translateY(-2px);

}

.product-image{

width:100%;

height:200px;

object-fit:cover;

background:#f1f1f1;

display:block;

}

.product-info{

padding:15px;

}

.product-name{

font-size:18px;

font-weight:bold;

margin-bottom:8px;

}

.product-description{

color:#777;

font-size:14px;

height:40px;

overflow:hidden;

margin-bottom:10px;

}

.price{

font-size:18px;

font-weight:bold;

margin-bottom:8px;

}

.stock{

font-size:14px;

margin-bottom:12px;

}

.stock.ok{

color:#198754;

}

.stock.low{

color:#d97706;

}

.stock.empty{

color:#c62828;

font-weight:bold;

}

.actions{

display:flex;

gap:8px;

}

.actions button{

flex:1;

border:none;

padding:10px;

border-radius:7px;

cursor:pointer;

font-size:14px;

}

.edit-btn{

background:#eee;

color:#222;

}

.delete-btn{

background:#f1dede;

color:#a00000;

}

.empty{

text-align:center;

padding:50px 20px;

color:#777;

}

.error{

background:#f8d7da;

color:#721c24;

padding:15px;

border-radius:10px;

margin-bottom:15px;

display:none;

}

/* =========================
   الهاتف
========================= */

@media(max-width:1000px){

.products-grid{

grid-template-columns:
repeat(3,1fr);

}

}

@media(max-width:700px){

.sidebar{

width:60px;

}

.sidebar:hover{

width:200px;

}

.content{

margin-right:60px;

padding:10px;

}

.products-grid{

grid-template-columns:
repeat(2,1fr);

gap:10px;

}

.product-image{

height:160px;

}

.product-info{

padding:10px;

}

.product-name{

font-size:16px;

}

.actions{

flex-direction:column;

}

}

@media(max-width:450px){

.products-grid{

grid-template-columns:1fr;

}

.product-image{

height:220px;

}

}

</style>

</head>


<body>


<!-- =========================
     القائمة الجانبية
========================= -->

<div class="sidebar">

<div class="logo">

G-Glam

</div>

<div class="menu">


<a href="index.html">

<span class="icon">⌂</span>

<span class="text">

الرئيسية

</span>

</a>


<a href="orders.html">

<span class="icon">▣</span>

<span class="text">

الطلبات

</span>

</a>


<a href="products.html">

<span class="icon">□</span>

<span class="text">

المنتجات

</span>

</a>


<a href="add-product.html">

<span class="icon">+</span>

<span class="text">

إضافة منتج

</span>

</a>


<a href="delivery.html">

<span class="icon">🚚</span>

<span class="text">

أسعار التوصيل

</span>

</a>


<a href="settings.html">

<span class="icon">⚙</span>

<span class="text">

الإعدادات

</span>

</a>


</div>

</div>


<!-- =========================
     المحتوى
========================= -->

<div class="content">


<div class="header">

<h1>

📦 المنتجات

</h1>

<p>

إدارة منتجات متجر G-Glam

</p>

</div>


<div
class="toolbar">


<div
class="search">

<input
type="text"
id="searchInput"
placeholder="🔍 البحث عن منتج...">

</div>


<a
href="add-product.html"
class="add-btn">

➕ إضافة منتج

</a>


</div>


<div
id="errorMessage"
class="error">
</div>


<div
class="products-box">


<div
id="loading"
class="loading">

⏳ جاري تحميل المنتجات...

</div>


<div
id="productsGrid"
class="products-grid">

</div>


<div
id="empty"
class="empty"
style="display:none;">

📦 لا توجد منتجات

</div>


</div>


</div>


<script type="module">


/* =========================
   Firebase
========================= */

import {

initializeApp

}

from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,

collection,

getDocs,

doc,

deleteDoc

}

from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


/* =========================
   العناصر
========================= */

const productsGrid =
document.getElementById(
"productsGrid"
);

const loading =
document.getElementById(
"loading"
);

const empty =
document.getElementById(
"empty"
);

const errorMessage =
document.getElementById(
"errorMessage"
);

const searchInput =
document.getElementById(
"searchInput"
);


let products=[];


/* =========================
   تحميل المنتجات
========================= */

async function loadProducts(){

loading.style.display="block";

productsGrid.innerHTML="";

empty.style.display="none";

errorMessage.style.display="none";


try{


const snapshot =
await getDocs(

collection(
db,
"products"
)

);


products=[];


snapshot.forEach(item=>{

products.push({

id:item.id,

...item.data()

});

});


loading.style.display="none";


displayProducts(products);


}

catch(error){

console.error(error);

loading.style.display="none";

errorMessage.textContent=
"حدث خطأ أثناء تحميل المنتجات: "+
error.message;

errorMessage.style.display="block";

}

}


/* =========================
   عرض المنتجات
========================= */

function displayProducts(data){

productsGrid.innerHTML="";


if(data.length===0){

empty.style.display="block";

return;

}


empty.style.display="none";


data.forEach(product=>{


const card =
document.createElement("div");

card.className=
"product-card";


let stock =
Number(product.stock || 0);


let stockClass="ok";

let stockText=
"المخزون: "+
stock;


if(stock<=0){

stockClass="empty";

stockText=
"❌ نفد المخزون";

}

else if(stock<=5){

stockClass="low";

stockText=
"⚠️ المخزون: "+
stock;

}


const image =
product.image ||
"";


card.innerHTML=`


${
image

?

`<img
class="product-image"
src="${escapeAttribute(image)}"
alt="${escapeAttribute(product.name || "منتج")}"
onerror="this.style.display='none';">`

:

`<div
class="product-image"
style="
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
">

🛍️

</div>`

}


<div
class="product-info">


<div
class="product-name">

${escapeHtml(
product.name || "بدون اسم"
)}

</div>


<div
class="product-description">

${escapeHtml(
product.description || "لا يوجد وصف"
)}

</div>


<div
class="price">

${Number(product.price || 0)}
DA

</div>


<div
class="stock ${stockClass}">

${stockText}

</div>


<div
class="actions">


<button
class="edit-btn"
data-id="${escapeAttribute(product.id)}">

✏️ تعديل

</button>


<button
class="delete-btn"
data-id="${escapeAttribute(product.id)}">

🗑️ حذف

</button>


</div>


</div>

`;


productsGrid.appendChild(card);

});


/* أزرار التعديل */

document
.querySelectorAll(".edit-btn")
.forEach(button=>{

button.addEventListener(
"click",
()=>{

const id =
button.dataset.id;

window.location.href =
"edit-product.html?id="+
encodeURIComponent(id);

});

});


/* أزرار الحذف */

document
.querySelectorAll(".delete-btn")
.forEach(button=>{

button.addEventListener(
"click",
()=>{

deleteProduct(
button.dataset.id
);

});

});

}


/* =========================
   حذف المنتج
========================= */

async function deleteProduct(id){

const product =
products.find(
item=>item.id===id
);


const name =
product?.name ||
"هذا المنتج";


const confirmed =
confirm(

"هل أنت متأكد من حذف المنتج؟\n\n"+
name+
"\n\nلا يمكن التراجع عن هذه العملية."

);


if(!confirmed){

return;

}


try{


await deleteDoc(

doc(
db,
"products",
id
)

);


alert(
"تم حذف المنتج بنجاح ✅"
);


await loadProducts();


}

catch(error){

console.error(error);

alert(
"حدث خطأ أثناء حذف المنتج:\n"+
error.message
);

}

}


/* =========================
   البحث
========================= */

searchInput
.addEventListener(
"input",
function(){

const value =
this.value
.trim()
.toLowerCase();


if(!value){

displayProducts(products);

return;

}


const result =
products.filter(product=>{

const name =
String(
product.name || ""
)
.toLowerCase();


const description =
String(
product.description || ""
)
.toLowerCase();


return (

name.includes(value)

||

description.includes(value)

);

});


displayProducts(result);

});


/* =========================
   حماية النصوص
========================= */

function escapeHtml(text){

return String(text)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


function escapeAttribute(text){

return escapeHtml(text);

}


/* =========================
   تشغيل
========================= */

loadProducts();

</script>


</body>

</html>
