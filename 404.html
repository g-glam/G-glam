<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاري التوجيه...</title>
  <script>
    (function () {
      // جلب المسار المطلق من الرابط (مثال: /zidistore أو /my-shop)
      const pathSegments = window.location.pathname.split('/').filter(p => p && p !== 'index.html');
      
      // إذا كان هناك اسم متجر مكتوب في الرابط
      if (pathSegments.length > 0) {
        const storeSlug = pathSegments[pathSegments.length - 1];
        
        // حفظ اسم المتجر في التخزين المحلي لتسهيل استرجاعه
        localStorage.setItem("storeSlug", storeSlug);
        
        // إعادة التوجيه الفوري إلى index.html مع تحويل المسار إلى Query Parameter
        window.location.replace('/index.html?store=' + encodeURIComponent(storeSlug));
      } else {
        // التوجيه إلى الصفحة الرئيسية العادية
        window.location.replace('/index.html');
      }
    })();
  </script>
</head>
<body style="background: #F4F4F4; font-family: sans-serif; text-align: center; padding-top: 50px;">
  <p>جاري تحويلك إلى المتجر...</p>
</body>
</html>
