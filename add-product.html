<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G-Glam | إضافة منتج</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>

:root{
--orange:#F47B20;
--orange-dark:#DF6810;
--bg:#F7F7F7;
--sidebar:#EEEEEE;
--card:#FFFFFF;
--text:#333333;
--dark:#222222;
--muted:#777777;
--border:#E5E5E5;
--input:#FAFAFA;
--success:#198754;
--success-bg:#EAF7EF;
--error:#C62828;
--error-bg:#FDECEC;
--shadow:0 4px 18px rgba(0,0,0,.06);
}

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:"Tajawal",sans-serif;
}

body{
background:var(--bg);
color:var(--text);
min-height:100vh;
}

/* =========================
SIDEBAR
========================= */

.sidebar{
position:fixed;
right:0;
top:0;
height:100vh;
width:72px;
background:var(--sidebar);
border-left:1px solid var(--border);
overflow:hidden;
transition:.3s;
z-index:1000;
box-shadow:-3px 0 15px rgba(0,0,0,.04);
}

.sidebar:hover{
width:235px;
}

.logo{
height:76px;
display:flex;
align-items:center;
justify-content:center;
font-size:23px;
font-weight:800;
color:var(--dark);
border-bottom:1px solid #ddd;
white-space:nowrap;
}

.logo span{
color:var(--orange);
}

.menu{
margin-top:18px;
padding:0 10px;
}

.menu a{
display:flex;
align-items:center;
gap:14px;
height:52px;
padding:0 10px;
margin-bottom:7px;
border-radius:12px;
color:#555;
text-decoration:none;
white-space:nowrap;
transition:.2s;
}

.menu a:hover{
background:#E3E3E3;
color:var(--dark);
}

.menu a.active{
background:var(--orange);
color:white;
box-shadow:0 5px 15px rgba(244,123,32,.20);
}

.icon{
min-width:35px;
text-align:center;
font-size:20px;
}

.text{
opacity:0;
transition:.25s;
font-size:14px;
font-weight:700;
}

.sidebar:hover .text{
opacity:1;
}

/* =========================
CONTENT
========================= */

.content{
margin-right:72px;
padding:25px;
}

/* =========================
HEADER
========================= */

.header{
background:var(--card);
border:1px solid var(--border);
border-radius:18px;
padding:25px;
box-shadow:var(--shadow);
margin-bottom:22px;
position:relative;
overflow:hidden;
}

.header::before{
content:"";
position:absolute;
right:0;
top:0;
width:5px;
height:100%;
background:var(--orange);
}

.header h1{
font-size:27px;
font-weight:800;
color:var(--dark);
margin-bottom:7px;
}

.header p{
font-size:14px;
color:var(--muted);
}

.store-info{
margin-top:14px;
font-size:14px;
line-height:2;
color:var(--muted);
}

.store-info strong{
color:var(--dark);
}

/* =========================
BOX
========================= */

.box{
background:white;
border:1px solid var(--border);
padding:25px;
border-radius:18px;
box-shadow:var(--shadow);
max-width:760px;
margin:auto;
}

/* =========================
LOADING
========================= */

.loading{
text-align:center;
padding:40px 20px;
color:var(--muted);
font-size:15px;
}

/* =========================
FORM
========================= */

.form-group{
margin-bottom:18px;
}

label{
display:block;
font-size:14px;
font-weight:700;
color:var(--dark);
margin-bottom:8px;
}

.required{
color:var(--orange);
}

input,
textarea{
width:100%;
padding:13px 14px;
border:1px solid var(--border);
border-radius:11px;
background:var(--input);
color:var(--dark);
font-size:14px;
outline:none;
transition:.2s;
}

input:focus,
textarea:focus{
border-color:var(--orange);
background:white;
box-shadow:0 0 0 3px rgba(244,123,32,.10);
}

textarea{
height:120px;
resize:vertical;
min-height:100px;
}

/* =========================
IMAGE UPLOAD
========================= */

.image-upload{
border:2px dashed #D9D9D9;
border-radius:14px;
padding:20px;
background:#FAFAFA;
text-align:center;
transition:.2s;
}

.image-upload:hover{
border-color:var(--orange);
background:#FFF9F5;
}

.image-upload input{
border:none;
background:transparent;
padding:8px;
box-shadow:none;
}

.image-help{
font-size:12px;
color:var(--muted);
margin-top:8px;
}

/* =========================
IMAGE PREVIEWS
========================= */

.preview-container{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
margin-top:15px;
}

.preview-item{
.preview-item{
position:relative;
height:140px;
border-radius:12px;
overflow:hidden;
border:1px solid var(--border);
background:#F3F3F3;
}

.preview-item img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.preview-number{
position:absolute;
top:7px;
right:7px;
background:rgba(0,0,0,.65);
color:white;
font-size:11px;
font-weight:bold;
padding:4px 8px;
border-radius:20px;
z-index:5;
}

.delete-image{
position:absolute;
top:7px;
left:7px;
width:32px;
height:32px;
padding:0;
border:none;
border-radius:50%;
background:#E53935;
color:white;
font-size:15px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
z-index:10;
box-shadow:0 2px 7px rgba(0,0,0,.2);
}

.delete-image:hover{
background:#C62828;
transform:scale(1.05);
}
/* =========================
BUTTON
========================= */

button{
font-family:"Tajawal",sans-serif;
}

.add-btn{
width:100%;
padding:14px;
border:none;
border-radius:11px;
background:var(--orange);
color:white;
font-size:16px;
font-weight:800;
cursor:pointer;
transition:.2s;
margin-top:5px;
box-shadow:0 5px 15px rgba(244,123,32,.18);
}

.add-btn:hover{
background:var(--orange-dark);
transform:translateY(-1px);
}

.add-btn:disabled{
opacity:.6;
cursor:not-allowed;
transform:none;
}

/* =========================
MESSAGES
========================= */

.message{
display:none;
padding:13px 15px;
border-radius:11px;
margin-bottom:18px;
text-align:center;
font-size:14px;
font-weight:500;
}

.success{
background:var(--success-bg);
color:var(--success);
border:1px solid #C9E8D5;
}

.error{
background:var(--error-bg);
color:var(--error);
border:1px solid #F0CACA;
}

/* =========================
MOBILE
========================= */

@media(max-width:700px){

.sidebar{
width:62px;
}

.sidebar:hover{
width:205px;
}

.content{
margin-right:62px;
padding:12px;
}

.header{
padding:20px;
}

.header h1{
font-size:23px;
}

.box{
padding:18px;
}

.preview-container{
grid-template-columns:repeat(2,1fr);
}

.preview-item{
height:150px;
}

}

@media(max-width:400px){

.content{
padding:10px;
}

.box{
padding:15px;
}

.preview-container{
grid-template-columns:1fr 1fr;
gap:8px;
}

.preview-item{
height:125px;
}

}

/* =========================
SCROLLBAR
========================= */

::-webkit-scrollbar{
width:7px;
}

::-webkit-scrollbar-track{
background:#F1F1F1;
}

::-webkit-scrollbar-thumb{
background:#CCC;
border-radius:10px;
}

::-webkit-scrollbar-thumb:hover{
background:var(--orange);
}

</style>
</head>

<body>

<!-- =========================
SIDEBAR
========================= -->

<div class="sidebar">

<div class="logo">
G-<span>Glam</span>
</div>

<div class="menu">

<a href="dashboard.html">
<span class="icon">🏠</span>
<span class="text">الرئيسية</span>
</a>

<a href="orders.html">
<span class="icon">📦</span>
<span class="text">الطلبات</span>
</a>

<a href="products.html">
<span class="icon">🛍️</span>
<span class="text">المنتجات</span>
</a>

<a href="add-product.html" class="active">
<span class="icon">➕</span>
<span class="text">إضافة منتج</span>
</a>

<a href="delivery.html">
<span class="icon">🚚</span>
<span class="text">أسعار التوصيل</span>
</a>

<a href="settings.html">
<span class="icon">⚙️</span>
<span class="text">الإعدادات</span>
</a>

<a href="#" id="logoutBtn">
<span class="icon">🚪</span>
<span class="text">تسجيل الخروج</span>
</a>

</div>
</div>

<!-- =========================
CONTENT
========================= -->

<div class="content">

<div class="header">

<h1>➕ إضافة منتج</h1>

<p>
إضافة منتج جديد إلى متجرك
</p>

<div class="store-info">

🏪 المتجر:
<strong id="storeName">
جاري التحميل...
</strong>

<br>

📧 الحساب:
<strong id="ownerEmail">
جاري التحميل...
</strong>

</div>

</div>

<div class="box">

<div
id="loadingMessage"
class="loading">

⏳ جاري التحقق من حسابك ومتجرك...

</div>

<div
id="formContainer"
style="display:none;">

<div
id="success"
class="message success">
</div>

<div
id="error"
class="message error">
</div>

<!-- NAME -->

<div class="form-group">

<label>
اسم المنتج <span class="required">*</span>
</label>

<input
id="name"
type="text"
placeholder="مثال: Lip Gloss">

</div>

<!-- PRICE -->

<div class="form-group">

<label>
السعر DA <span class="required">*</span>
</label>

<input
id="price"
type="number"
min="0"
placeholder="مثال: 250">

</div>

<!-- DESCRIPTION -->

<div class="form-group">

<label>
وصف المنتج
</label>

<textarea
id="description"
placeholder="اكتب وصف المنتج بالتفصيل..."></textarea>

</div>

<!-- COLORS -->

<div class="form-group">

<label>
الألوان
</label>

<input
id="colors"
type="text"
placeholder="مثال: Beige,Nude,Pink">

</div>

<!-- STOCK -->

<div class="form-group">

<label>
المخزون
</label>

<input
id="stock"
type="number"
min="0"
placeholder="مثال: 20">

</div>

<!-- IMAGE -->

<div class="form-group">

<label>
صور المنتج <span class="required">*</span>
</label>

<div class="image-upload">

<input
id="imageFile"
type="file"
accept="image/*"
multiple>

<div class="image-help">
يمكنك اختيار أكثر من صورة للمنتج
</div>

</div>

<div
id="previewContainer"
class="preview-container">
</div>

</div>

<button
id="addBtn"
class="add-btn"
type="button">

➕ إضافة المنتج

</button>

</div>

</div>

</div>

<script type="module">

/* =========================
FIREBASE IMPORTS
========================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
serverTimestamp,
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


/* =========================
FIREBASE CONFIG
========================= */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =========================
INITIALIZE
========================= */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);


/* =========================
ELEMENTS
========================= */

const loadingMessage =
document.getElementById("loadingMessage");

const formContainer =
document.getElementById("formContainer");

const storeNameElement =
document.getElementById("storeName");

const ownerEmailElement =
document.getElementById("ownerEmail");

const imageFile =
document.getElementById("imageFile");

const previewContainer =
document.getElementById("previewContainer");

const addBtn =
document.getElementById("addBtn");


/* =========================
STORE VARIABLES
========================= */

let currentUserUid = "";
let currentUserEmail = "";
let currentStoreId = "";
let currentStoreName = "";

let selectedImages = [];


/* =========================
IMAGE PREVIEW
========================= */

imageFile.addEventListener(
"change",
function(){

selectedImages =
Array.from(imageFile.files || []);

previewContainer.innerHTML = "";

if(!selectedImages.length){
return;
}

selectedImages.forEach(
(file,index)=>{

if(!file.type.startsWith("image/")){
return;
}

const reader =
new FileReader();

reader.onload =
function(event){

const item =
document.createElement("div");

item.className =
"preview-item";

item.innerHTML = `

<img
src="${event.target.result}"
alt="صورة المنتج">

<div class="preview-number">
${index + 1}
</div>

`;

previewContainer.appendChild(item);

};

reader.readAsDataURL(file);

});

});


/* =========================
LOAD STORE
========================= */

async function loadStore(){

try{

const user =
auth.currentUser;

if(!user){

window.location.href =
"login.html";

return;

}

currentUserUid =
user.uid;

currentUserEmail =
user.email || "";


/* =========================
STORE DOCUMENT
========================= */

const storeRef =
doc(
db,
"stores",
currentUserUid
);

const storeSnapshot =
await getDoc(storeRef);


if(!storeSnapshot.exists()){

alert(
"⚠️ لم يتم العثور على متجر مرتبط بهذا الحساب."
);

await signOut(auth);

window.location.href =
"login.html";

return;

}


const store =
storeSnapshot.data();

currentStoreId =
storeSnapshot.id;


/* =========================
STATUS
========================= */

const status =
String(
store.status || "pending"
)
.toLowerCase()
.trim();


if(
status === "pending" ||
status === "waiting" ||
status === "review"
){

alert(
"⏳ متجرك مازال قيد المراجعة من طرف الإدارة."
);

window.location.href =
"dashboard.html";

return;

}


if(
status === "rejected" ||
status === "refused"
){

alert(
"❌ تم رفض إنشاء متجرك.\n\nالسبب:\n" +
(
store.rejectionReason ||
"لم يتم ذكر سبب الرفض."
)
);

await signOut(auth);

window.location.href =
"login.html";

return;

}


if(
status !== "approved" &&
status !== "active"
){

alert(
"⚠️ متجرك غير نشط حاليًا."
);

window.location.href =
"dashboard.html";

return;

}


/* =========================
STORE DATA
========================= */

currentStoreName =
store.storeName ||
store.name ||
"G-Glam";

currentUserEmail =
store.ownerEmail ||
store.email ||
user.email ||
"";


storeNameElement.textContent =
currentStoreName;

ownerEmailElement.textContent =
currentUserEmail;


/* =========================
SHOW FORM
========================= */

loadingMessage.style.display =
"none";

formContainer.style.display =
"block";


}catch(error){

console.error(
"LOAD STORE ERROR:",
error
);

loadingMessage.innerHTML = `
❌ حدث خطأ أثناء التحقق من المتجر.
<br><br>
${escapeHtml(error.message)}
`;

}

}


/* =========================
ADD PRODUCT
========================= */

addBtn.addEventListener(
"click",
addProduct
);


async function addProduct(){

const user =
auth.currentUser;

if(!user){

showError(
"انتهت جلسة تسجيل الدخول. يرجى تسجيل الدخول من جديد."
);

return;

}


/* =========================
VALUES
========================= */

const name =
document.getElementById("name")
.value
.trim();

const price =
Number(
document.getElementById("price")
.value
);

const description =
document.getElementById("description")
.value
.trim();

const colors =
document.getElementById("colors")
.value
.split(",")
.map(x=>x.trim())
.filter(x=>x);

const stock =
Number(
document.getElementById("stock")
.value
);


/* =========================
VALIDATION
========================= */

if(!name){

showError(
"يرجى إدخال اسم المنتج."
);

return;

}

if(
isNaN(price) ||
price < 0
){

showError(
"يرجى إدخال سعر صحيح."
);

return;

}

if(
isNaN(stock) ||
stock < 0
){

showError(
"يرجى إدخال كمية مخزون صحيحة."
);

return;

}

if(!selectedImages.length){

showError(
"يرجى اختيار صورة واحدة على الأقل."
);

return;

}


/* =========================
BUTTON
========================= */

addBtn.disabled = true;

addBtn.textContent =
"⏳ جاري إضافة المنتج...";


try{

/* =========================
UPLOAD IMAGES
========================= */

const imageUrls = [];


for(
let i = 0;
i < selectedImages.length;
i++
){

const formData =
new FormData();

formData.append(
"file",
selectedImages[i]
);

formData.append(
"upload_preset",
"gglam_products"
);


const response =
await fetch(

"https://api.cloudinary.com/v1_1/g82dvrkr/image/upload",

{
method:"POST",
body:formData
}

);


if(!response.ok){

throw new Error(
"فشل رفع الصورة رقم " +
(i + 1)
);

}


const imageData =
await response.json();


if(!imageData.secure_url){

throw new Error(
"لم يتم الحصول على رابط الصورة رقم " +
(i + 1)
);

}


imageUrls.push(
imageData.secure_url
);

}


/* =========================
SAVE PRODUCT
========================= */

await addDoc(

collection(db,"products"),

{

name:name,

price:price,

description:description,

colors:colors,

stock:stock,

/*
الصورة الأولى
للتوافق مع النظام القديم
*/

image:imageUrls[0],

/*
جميع الصور
*/

images:imageUrls,


/*
STORE OWNERSHIP
*/

ownerUid:user.uid,

storeId:user.uid,

ownerEmail:
user.email ||
currentUserEmail,

storeName:
currentStoreName,


/*
TIMESTAMPS
*/

createdAt:
serverTimestamp(),

updatedAt:
serverTimestamp()

}

);


/* =========================
SUCCESS
========================= */

showSuccess(
"✅ تمت إضافة المنتج إلى متجرك بنجاح."
);


/* =========================
CLEAR
========================= */

document.getElementById("name").value = "";

document.getElementById("price").value = "";

document.getElementById("description").value = "";

document.getElementById("colors").value = "";

document.getElementById("stock").value = "";

imageFile.value = "";

previewContainer.innerHTML = "";

selectedImages = [];


}catch(error){

console.error(
"ADD PRODUCT ERROR:",
error
);

showError(
"❌ حدث خطأ أثناء إضافة المنتج: " +
error.message
);

}finally{

addBtn.disabled = false;

addBtn.textContent =
"➕ إضافة المنتج";

}

}


/* =========================
SUCCESS
========================= */

function showSuccess(message){

const element =
document.getElementById("success");

element.textContent =
message;

element.style.display =
"block";

document.getElementById(
"error"
).style.display =
"none";

setTimeout(
function(){

element.style.display =
"none";

},
4000
);

}


/* =========================
ERROR
========================= */

function showError(message){

const element =
document.getElementById("error");

element.textContent =
message;

element.style.display =
"block";

document.getElementById(
"success"
).style.display =
"none";

}


/* =========================
ESCAPE HTML
========================= */

function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
LOGOUT
========================= */

document
.getElementById("logoutBtn")
.addEventListener(
"click",
async function(event){

event.preventDefault();

const confirmLogout =
confirm(
"هل تريد تسجيل الخروج؟"
);

if(!confirmLogout){
return;
}

try{

await signOut(auth);

window.location.href =
"login.html";

}catch(error){

console.error(
"LOGOUT ERROR:",
error
);

showError(
"❌ تعذر تسجيل الخروج."
);

}

});


/* =========================
AUTH STATE
========================= */

onAuthStateChanged(
auth,
async function(user){

if(!user){

window.location.href =
"login.html";

return;

}

currentUserUid =
user.uid;

currentUserEmail =
user.email || "";

await loadStore();

});

</script>

</body>
</html>
