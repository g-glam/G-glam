<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | إضافة منتج</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f5f5f5;
color:#222;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{

position:fixed;

right:0;
top:0;

height:100vh;

width:70px;

background:#111;

color:white;

overflow:hidden;

transition:.3s;

z-index:1000;

}

.sidebar:hover{

width:230px;

}

.logo{

height:70px;

display:flex;

align-items:center;

justify-content:center;

font-size:22px;

font-weight:bold;

border-bottom:1px solid #333;

}

.menu{

margin-top:20px;

}

.menu a{

display:flex;

align-items:center;

gap:15px;

padding:15px;

color:white;

text-decoration:none;

white-space:nowrap;

}

.menu a:hover{

background:#222;

}

.icon{

min-width:35px;

text-align:center;

font-size:20px;

}

.text{

opacity:0;

transition:.3s;

}

.sidebar:hover .text{

opacity:1;

}


/* =========================
   CONTENT
========================= */

.content{

margin-right:70px;

padding:20px;

}

.header{

background:white;

padding:20px;

border-radius:12px;

box-shadow:
0 2px 10px rgba(0,0,0,.08);

margin-bottom:20px;

}

.header h1{

margin:0;

}

.header p{

color:#777;

margin-bottom:8px;

}

.store-info{

font-size:14px;

color:#555;

margin-top:10px;

}

.store-info strong{

color:#111;

}


/* =========================
   BOX
========================= */

.box{

background:white;

padding:20px;

border-radius:12px;

box-shadow:
0 2px 10px rgba(0,0,0,.08);

max-width:700px;

margin:auto;

}


/* =========================
   LABELS
========================= */

label{

display:block;

font-weight:bold;

margin-bottom:7px;

}


/* =========================
   INPUTS
========================= */

input,
textarea{

width:100%;

padding:12px;

border:1px solid #ddd;

border-radius:8px;

margin-bottom:15px;

font-size:15px;

outline:none;

}

input:focus,
textarea:focus{

border-color:#111;

}

textarea{

height:120px;

resize:none;

}


/* =========================
   PREVIEW
========================= */

.preview{

width:180px;

height:180px;

object-fit:cover;

display:block;

margin:10px auto 20px;

border-radius:12px;

background:#f3f3f3;

}


/* =========================
   BUTTON
========================= */

button{

width:100%;

padding:14px;

border:none;

border-radius:9px;

background:#111;

color:white;

font-size:17px;

cursor:pointer;

}

button:hover{

background:#222;

}

button:disabled{

opacity:.6;

cursor:not-allowed;

}


/* =========================
   MESSAGES
========================= */

.message{

display:none;

padding:12px;

border-radius:8px;

margin-bottom:15px;

text-align:center;

}

.success{

background:#d4edda;

color:#155724;

}

.error{

background:#f8d7da;

color:#721c24;

}


/* =========================
   LOADING
========================= */

.loading{

text-align:center;

padding:30px;

color:#777;

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

.sidebar{

width:60px;

}

.sidebar:hover{

width:200px;

}

.content{

margin-right:60px;

padding:10px;

}

.box{

padding:15px;

}

.header{

padding:16px;

}

}

</style>

</head>


<body>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<div class="sidebar">

<div class="logo">

G-Glam

</div>


<div class="menu">


<a href="dashboard.html">

<span class="icon">⌂</span>

<span class="text">
الرئيسية
</span>

</a>


<a href="orders.html">

<span class="icon">▣</span>

<span class="text">
الطلبات
</span>

</a>


<a href="products.html">

<span class="icon">□</span>

<span class="text">
المنتجات
</span>

</a>


<a href="add-product.html">

<span class="icon">＋</span>

<span class="text">
إضافة منتج
</span>

</a>


<a href="delivery.html">

<span class="icon">🚚</span>

<span class="text">
أسعار التوصيل
</span>

</a>


<a href="settings.html">

<span class="icon">⚙</span>

<span class="text">
الإعدادات
</span>

</a>


<a href="#"
id="logoutBtn">

<span class="icon">🚪</span>

<span class="text">
تسجيل الخروج
</span>

</a>


</div>

</div>


<!-- =====================================================
     CONTENT
===================================================== -->

<div class="content">


<div class="header">

<h1>
➕ إضافة منتج
</h1>

<p>
إضافة منتج جديد إلى متجرك
</p>

<div class="store-info">

🏪 المتجر:
<strong id="storeName">
جاري التحميل...
</strong>

<br>

📧 الحساب:
<strong id="ownerEmail">
جاري التحميل...
</strong>

</div>

</div>


<!-- =====================================================
     PRODUCT FORM
===================================================== -->

<div class="box">


<div
id="loadingMessage"
class="loading">

⏳ جاري التحقق من حسابك ومتجرك...

</div>


<div
id="formContainer"
style="display:none;">


<div
id="success"
class="message success">
</div>


<div
id="error"
class="message error">
</div>


<!-- NAME -->

<label>
اسم المنتج
</label>

<input
id="name"
type="text"
placeholder="مثال: Lip Gloss"
>


<!-- PRICE -->

<label>
السعر DA
</label>

<input
id="price"
type="number"
min="0"
placeholder="مثال: 250"
>


<!-- DESCRIPTION -->

<label>
وصف المنتج
</label>

<textarea
id="description"
placeholder="اكتب وصف المنتج..."
></textarea>


<!-- COLORS -->

<label>
الألوان
</label>

<input
id="colors"
type="text"
placeholder="مثال: Beige,Nude,Pink"
>


<!-- STOCK -->

<label>
المخزون
</label>

<input
id="stock"
type="number"
min="0"
placeholder="مثال: 20"
>


<!-- IMAGE -->

<label>
صورة المنتج
</label>

<input
id="imageFile"
type="file"
accept="image/*"
>


<img
id="preview"
class="preview"
style="display:none;"
alt="معاينة الصورة"
>


<!-- ADD -->

<button
id="addBtn"
type="button">

➕ إضافة المنتج

</button>


</div>

</div>

</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
collection,
addDoc,
serverTimestamp,
doc,
getDoc

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


import {

getAuth,
onAuthStateChanged,
signOut

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);


/* =====================================================
   ELEMENTS
===================================================== */

const loadingMessage =
document.getElementById(
"loadingMessage"
);

const formContainer =
document.getElementById(
"formContainer"
);

const storeNameElement =
document.getElementById(
"storeName"
);

const ownerEmailElement =
document.getElementById(
"ownerEmail"
);

const imageFile =
document.getElementById(
"imageFile"
);

const preview =
document.getElementById(
"preview"
);

const addBtn =
document.getElementById(
"addBtn"
);


/* =====================================================
   STORE VARIABLES
===================================================== */

let currentUserUid = "";

let currentUserEmail = "";

let currentStoreId = "";

let currentStoreName = "";

let selectedImage = null;


/* =====================================================
   IMAGE PREVIEW
===================================================== */

imageFile.addEventListener(
"change",
function(){

selectedImage =
imageFile.files[0] || null;


if(!selectedImage){

preview.style.display =
"none";

preview.src = "";

return;

}


/* التحقق من نوع الصورة */

if(
!selectedImage.type.startsWith(
"image/"
)
){

showError(
"يرجى اختيار ملف صورة فقط."
);

imageFile.value = "";

selectedImage = null;

preview.style.display =
"none";

return;

}


/* معاينة الصورة */

const reader =
new FileReader();


reader.onload =
function(event){

preview.src =
event.target.result;

preview.style.display =
"block";

};


reader.readAsDataURL(
selectedImage
);

});


/* =====================================================
   CHECK STORE
===================================================== */

async function loadStore(){

try{


const user =
auth.currentUser;


if(!user){

window.location.href =
"login.html";

return;

}


/* =====================================================
   CURRENT USER UID
===================================================== */

currentUserUid =
user.uid;

currentUserEmail =
user.email || "";


/* =====================================================
   STORE DOCUMENT
   stores/{UID}
===================================================== */

const storeRef =
doc(
db,
"stores",
currentUserUid
);


const storeSnapshot =
await getDoc(storeRef);


if(
!storeSnapshot.exists()
){

alert(
"⚠️ لم يتم العثور على متجر مرتبط بهذا الحساب."
);

await signOut(auth);

window.location.href =
"login.html";

return;

}


const store =
storeSnapshot.data();


currentStoreId =
storeSnapshot.id;


/* =====================================================
   STORE STATUS
===================================================== */

const status =

String(
store.status || "pending"
)
.toLowerCase()
.trim();


if(

status === "pending" ||

status === "waiting" ||

status === "review"

){

alert(
"⏳ متجرك مازال قيد المراجعة من طرف الإدارة."
);

window.location.href =
"dashboard.html";

return;

}


if(

status === "rejected" ||

status === "refused"

){

alert(

"❌ تم رفض إنشاء متجرك.\n\n" +

"السبب:\n" +

(
store.rejectionReason ||
"لم يتم ذكر سبب الرفض."
)

);

await signOut(auth);

window.location.href =
"login.html";

return;

}


if(

status !== "approved" &&

status !== "active"

){

alert(
"⚠️ متجرك غير نشط حاليًا."
);

window.location.href =
"dashboard.html";

return;

}


/* =====================================================
   STORE DATA
===================================================== */

currentStoreName =

store.storeName ||

store.name ||

"G-Glam";


currentUserEmail =

store.ownerEmail ||

store.email ||

user.email ||

"";


storeNameElement.textContent =
currentStoreName;

ownerEmailElement.textContent =
currentUserEmail;


/* =====================================================
   SHOW FORM
===================================================== */

loadingMessage.style.display =
"none";

formContainer.style.display =
"block";


}catch(error){

console.error(
"LOAD STORE ERROR:",
error
);

alert(
"❌ حدث خطأ أثناء التحقق من المتجر."
);

}

}


/* =====================================================
   ADD PRODUCT
===================================================== */

addBtn.addEventListener(
"click",
addProduct
);


async function addProduct(){

/* =====================================================
   CHECK LOGIN
===================================================== */

const user =
auth.currentUser;


if(!user){

showError(
"انتهت جلسة تسجيل الدخول. يرجى تسجيل الدخول من جديد."
);

return;

}


/* =====================================================
   GET VALUES
===================================================== */

const name =
document.getElementById(
"name"
).value.trim();


const price =
Number(
document.getElementById(
"price"
).value
);


const description =
document.getElementById(
"description"
).value.trim();


const colors =
document.getElementById(
"colors"
)
.value
.split(",")
.map(
x => x.trim()
)
.filter(
x => x
);


const stock =
Number(
document.getElementById(
"stock"
).value
);


/* =====================================================
   VALIDATION
===================================================== */

if(!name){

showError(
"يرجى إدخال اسم المنتج."
);

return;

}


if(
isNaN(price) ||
price < 0
){

showError(
"يرجى إدخال سعر صحيح."
);

return;

}


if(
isNaN(stock) ||
stock < 0
){

showError(
"يرجى إدخال كمية مخزون صحيحة."
);

return;

}


if(!selectedImage){

showError(
"يرجى اختيار صورة المنتج."
);

return;

}


/* =====================================================
   DISABLE BUTTON
===================================================== */

addBtn.disabled =
true;

addBtn.textContent =
"⏳ جاري إضافة المنتج...";


try{


/* =====================================================
   CLOUDINARY
===================================================== */

const formData =
new FormData();


formData.append(
"file",
selectedImage
);


formData.append(
"upload_preset",
"gglam_products"
);


const response =
await fetch(

"https://api.cloudinary.com/v1_1/g82dvrkr/image/upload",

{

method:"POST",

body:formData

}

);


if(!response.ok){

throw new Error(
"فشل رفع الصورة إلى Cloudinary."
);

}


const imageData =
await response.json();


const imageUrl =
imageData.secure_url;


if(!imageUrl){

throw new Error(
"لم يتم الحصول على رابط الصورة."
);

}


/* =====================================================
   SAVE PRODUCT
===================================================== */

await addDoc(

collection(
db,
"products"
),

{

/* =========================
   PRODUCT DATA
========================= */

name:name,

price:price,

description:description,

colors:colors,

stock:stock,

image:imageUrl,

images:[
imageUrl
],


/* =========================
   STORE OWNERSHIP
========================= */

/*
   هذا هو أهم جزء.

   كل منتج مربوط مباشرة
   بـ UID صاحب المتجر.
*/

ownerUid:user.uid,

storeId:user.uid,

ownerEmail:

user.email || currentUserEmail,

storeName:
currentStoreName,


/* =========================
   TIMESTAMPS
========================= */

createdAt:
serverTimestamp(),

updatedAt:
serverTimestamp()

}

);


/* =====================================================
   SUCCESS
===================================================== */

showSuccess(
"✅ تمت إضافة المنتج إلى متجرك بنجاح."
);


/* =====================================================
   CLEAR FORM
===================================================== */

document.getElementById(
"name"
).value = "";


document.getElementById(
"price"
).value = "";


document.getElementById(
"description"
).value = "";


document.getElementById(
"colors"
).value = "";


document.getElementById(
"stock"
).value = "";


imageFile.value = "";


preview.src = "";

preview.style.display =
"none";


selectedImage =
null;


}catch(error){

console.error(
"ADD PRODUCT ERROR:",
error
);


showError(
"❌ حدث خطأ أثناء إضافة المنتج:\n" +
error.message
);


}finally{

addBtn.disabled =
false;

addBtn.textContent =
"➕ إضافة المنتج";

}

}


/* =====================================================
   SUCCESS MESSAGE
===================================================== */

function showSuccess(message){

const element =
document.getElementById(
"success"
);

element.textContent =
message;

element.style.display =
"block";


document.getElementById(
"error"
).style.display =
"none";


setTimeout(
function(){

element.style.display =
"none";

},
4000
);

}


/* =====================================================
   ERROR MESSAGE
===================================================== */

function showError(message){

const element =
document.getElementById(
"error"
);

element.textContent =
message;

element.style.display =
"block";


document.getElementById(
"success"
).style.display =
"none";

}


/* =====================================================
   LOGOUT
===================================================== */

document
.getElementById("logoutBtn")
.addEventListener(
"click",
async function(event){

event.preventDefault();


const confirmLogout =
confirm(
"هل تريد تسجيل الخروج؟"
);


if(!confirmLogout){

return;

}


try{

await signOut(auth);

window.location.href =
"login.html";


}catch(error){

console.error(
"LOGOUT ERROR:",
error
);

showError(
"❌ تعذر تسجيل الخروج."
);

}

});


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(

auth,

async function(user){

if(!user){

window.location.href =
"login.html";

return;

}


/*
   تحميل متجر المستخدم
*/

await loadStore();

});

</script>

</body>

  </html>
