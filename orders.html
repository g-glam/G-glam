<!DOCTYPE html>
<html lang="ar" dir="rtl">

<meta charset="UTF-8">

content="width=device-width, initial-scale=1.0">

<title>G-Glam | الطلبات</title>

<style>

/* =====================================================
   COLORS
===================================================== */

:root{

--orange:#F47B20;
--orange-dark:#DF6810;

--bg:#F7F7F7;
--sidebar:#EEEEEE;
--card:#FFFFFF;

--text:#333333;
--dark:#222222;
--muted:#777777;

--border:#E5E5E5;

--success:#198754;
--success-bg:#E7F6ED;

--warning:#D97706;
--warning-bg:#FFF4E5;

--blue:#2563EB;
--blue-bg:#EAF1FF;

--shadow:0 4px 18px rgba(0,0,0,.06);

}


/* =====================================================
   RESET
===================================================== */

*{

box-sizing:border-box;

margin:0;
padding:0;

font-family:Arial,sans-serif;

}

body{

background:var(--bg);

color:var(--text);

min-height:100vh;

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

position:fixed;

right:0;
top:0;

height:100vh;

width:75px;

background:var(--sidebar);

border-left:1px solid var(--border);

overflow:hidden;

transition:.3s;

z-index:1000;

box-shadow:-3px 0 15px rgba(0,0,0,.04);

}

.sidebar:hover{

width:240px;

}


/* =====================================================
   LOGO
===================================================== */
   .logo{

height:78px;

display:flex;

align-items:center;

justify-content:center;

font-size:23px;

font-weight:800;

color:var(--dark);

border-bottom:1px solid #ddd;

white-space:nowrap;

}

.logo span{

color:var(--orange);

}


/* =====================================================
   MENU
===================================================== */

.menu{

margin-top:18px;

padding:0 10px;

}

.menu a{

display:flex;

align-items:center;

gap:15px;

height:52px;

padding:0 10px;

margin-bottom:7px;

border-radius:12px;

color:#555;

text-decoration:none;

white-space:nowrap;

transition:.2s;

}

.menu a:hover{

background:#E4E4E4;

color:var(--dark);

}

.menu a.active{

background:var(--orange);

color:white;

box-shadow:
0 5px 15px rgba(244,123,32,.20);

}

.icon{

min-width:35px;

text-align:center;

font-size:20px;

}

.text{

opacity:0;

transition:.25s;

font-size:14px;

font-weight:bold;

}

.sidebar:hover .text{

opacity:1;

}


/* =====================================================
   CONTENT
===================================================== */

.content{

margin-right:75px;

padding:25px;

}


/* =====================================================
   HEADER
===================================================== */

.header{

background:var(--card);

border:1px solid var(--border);

border-radius:18px;

padding:25px;

box-shadow:var(--shadow);

margin-bottom:22px;

position:relative;

overflow:hidden;

}

.header::before{

content:"";

position:absolute;

right:0;

top:0;

width:5px;

height:100%;

background:var(--orange);

}

.header h1{

font-size:27px;

color:var(--dark);

margin-bottom:8px;

}

.header p{

color:var(--muted);

font-size:14px;

}

.owner-email{

font-size:13px;

color:var(--muted);

margin-top:13px;

}

.owner-email span{

color:var(--dark);

font-weight:bold;

   }
/* =====================================================
   MESSAGES
===================================================== */

.message{

display:none;

padding:14px 18px;

border-radius:12px;

margin-bottom:18px;

text-align:center;

font-size:14px;

}

.success{

background:var(--success-bg);

color:#155724;

border:1px solid #c5e8d3;

}

.error{

background:#FBE7EA;

color:#721c24;

border:1px solid #efc7cc;

}


/* =====================================================
   STATISTICS
===================================================== */

.stats{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:18px;

margin-bottom:22px;

}

.stat{

background:white;

border:1px solid var(--border);

border-radius:18px;

padding:22px;

box-shadow:var(--shadow);

position:relative;

overflow:hidden;

}

.stat::after{

content:"";

position:absolute;

bottom:0;

right:0;

height:3px;

width:100%;

background:var(--orange);

}

.stat-title{

color:var(--muted);

font-size:14px;

margin-bottom:12px;

}

.stat-value{

font-size:28px;

font-weight:800;

color:var(--dark);

}


/* =====================================================
   ORDERS SECTION
===================================================== */

.section{

background:white;

border:1px solid var(--border);

padding:22px;

border-radius:18px;

box-shadow:var(--shadow);

}

.section-header{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:20px;

}

.section-header h2{

font-size:21px;

color:var(--dark);

}


/* =====================================================
   ORDERS GRID
===================================================== */

.orders{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:18px;

}


/* =====================================================
   ORDER CARD
===================================================== */

.order{

background:white;

border:1px solid var(--border);

border-radius:17px;

padding:20px;

transition:.25s;

}

.order:hover{

transform:translateY(-3px);

box-shadow:
0 8px 25px rgba(0,0,0,.08);

   }

   /* =====================================================
   ORDER HEADER
===================================================== */

.order-header{

display:flex;

align-items:center;

justify-content:space-between;

gap:10px;

padding-bottom:15px;

border-bottom:1px solid var(--border);

margin-bottom:15px;

}

.order-title{

font-size:17px;

font-weight:bold;

color:var(--dark);

}

.order-id{

font-size:11px;

color:#999;

margin-top:5px;

direction:ltr;

text-align:right;

}


/* =====================================================
   STATUS
===================================================== */

.status{

display:inline-block;

padding:7px 11px;

border-radius:20px;

font-size:12px;

font-weight:bold;

white-space:nowrap;

}

.status-processing{

background:var(--warning-bg);

color:var(--warning);

}

.status-confirmed{

background:var(--blue-bg);

color:var(--blue);

}

.status-shipped{

background:#F3E8FF;

color:#7C3AED;

}

.status-delivered{

background:var(--success-bg);

color:var(--success);

}


/* =====================================================
   CUSTOMER INFO
===================================================== */

.info-grid{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:10px;

margin-bottom:17px;

}

.info{

background:#FAFAFA;

border:1px solid #eee;

border-radius:11px;

padding:11px;

}

.info-label{

font-size:11px;

color:#999;

margin-bottom:5px;

}

.info-value{

font-size:13px;

font-weight:bold;

color:var(--dark);

word-break:break-word;

}


/* =====================================================
   PRODUCTS
===================================================== */

.products-title{

font-size:14px;

font-weight:bold;

margin-bottom:10px;

color:var(--dark);

}

.product{

align-items:center;

gap:10px;

padding:10px 0;

}

}

font-weight:bold;

}

}

.product-price{

font-weight:bold;

color:var(--orange);

   }
   /* =====================================================
   TOTAL
===================================================== */

.total-box{

background:#FFF8F2;

border:1px solid #FFE3CE;

border-radius:13px;

padding:14px;

margin-top:15px;

}

.total-row{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:7px;

font-size:13px;

}

.total-row:last-child{

margin-bottom:0;

}

.total-final{

font-size:18px;

font-weight:800;

color:var(--orange);

padding-top:8px;

border-top:1px solid #FFE3CE;

}


/* =====================================================
   STATUS CONTROL
===================================================== */

.status-control{

margin-top:17px;

padding-top:17px;

border-top:1px solid var(--border);

}

.status-control label{

display:block;

font-size:13px;

font-weight:bold;

margin-bottom:8px;

}

select{

width:100%;

padding:12px;

border:1px solid var(--border);

border-radius:11px;

background:white;

color:var(--dark);

font-size:14px;

outline:none;

}

select:focus{

border-color:var(--orange);

box-shadow:
0 0 0 3px rgba(244,123,32,.10);

}


/* =====================================================
   SAVE BUTTON
===================================================== */

.save-btn{

width:100%;

padding:12px;

border:none;

border-radius:11px;

background:var(--orange);

color:white;

font-size:14px;

font-weight:bold;

cursor:pointer;

margin-top:9px;

transition:.2s;

}

.save-btn:hover{

background:var(--orange-dark);

transform:translateY(-1px);

}


/* =====================================================
   EMPTY
===================================================== */

.empty{

background:#FAFAFA;

border:1px dashed #D8D8D8;

padding:45px 20px;

text-align:center;

color:var(--muted);

border-radius:15px;

grid-column:1/-1;

line-height:2;

}

.empty-icon{

font-size:40px;

margin-bottom:10px;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

text-align:center;

padding:45px;

color:var(--muted);

grid-column:1/-1;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:1000px){

repeat(2,1fr);

1fr;

/* =====================================================

@media(max-width:700px){

   /* =====================================================

@media(max-width:550px){

/* =====================================================

/* =====================================================

}

background:var(--orange);

}

</style>

<!-- =====================================================

<script type="module">


/* =====================================================
   IMPORTS
===================================================== */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
collection,
getDocs,
query,
where,
doc,
getDoc,
updateDoc,
orderBy

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


import {

getAuth,
onAuthStateChanged,
signOut

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);


/* =====================================================
   ELEMENTS
===================================================== */

const storeNameElement =
document.getElementById(
"storeName"
);

const ownerEmailElement =
document.getElementById(
"ownerEmail"
);

const ordersContainer =
document.getElementById(
"ordersContainer"
);

const totalOrders =
document.getElementById(
"totalOrders"
);

const processingOrders =
document.getElementById(
"processingOrders"
);

const shippedOrders =
document.getElementById(
"shippedOrders"
);

const deliveredOrders =
document.getElementById(
"deliveredOrders"
);


/* =====================================================
   VARIABLES
===================================================== */

let currentOwnerUid = "";

let currentOwnerEmail = "";

let currentStoreId = "";

let currentStoreName = "G-Glam";


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(value ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =====================================================
   LOAD STORE + SECURITY
===================================================== */

async function loadStore(){

try{


if(!auth.currentUser){

window.location.href =
"login.html";

return;

}


currentOwnerUid =
auth.currentUser.uid;


currentOwnerEmail =
auth.currentUser.email || "";


/* =====================================================
   STORES/{UID}
===================================================== */

const storeRef =
doc(
db,
"stores",
currentOwnerUid
);


const storeSnapshot =
await getDoc(storeRef);


if(!storeSnapshot.exists()){

alert(
"⚠️ لم يتم العثور على متجر مرتبط بهذا الحساب."
);

await signOut(auth);

window.location.href =
"login.html";

return;

}


const store =
storeSnapshot.data();

currentStoreId =
storeSnapshot.id;


/* =====================================================
   STATUS
===================================================== */

const status =
String(
store.status || "pending"
)
.toLowerCase()
.trim();


   if(

status === "pending" ||

status === "waiting" ||

status === "review"

){

alert(
"⏳ طلب إنشاء متجرك مازال قيد المراجعة من طرف الإدارة."
);

await signOut(auth);

window.location.href =
"login.html";

return;

}


if(

status === "rejected" ||

status === "refused"

){

alert(

"❌ تم رفض طلب إنشاء المتجر.\n\n" +

"سبب الرفض:\n" +

(
store.rejectionReason ||
"لم يتم ذكر سبب الرفض."
)

);

await signOut(auth);

window.location.href =
"login.html";

return;

}


if(

status !== "approved" &&

status !== "active"

){

alert(
"⚠️ لا يمكنك الدخول إلى لوحة الطلبات حاليًا."
);

await signOut(auth);

window.location.href =
"login.html";

return;

}


/* =====================================================
   STORE INFORMATION
===================================================== */

currentStoreName =

store.storeName ||

store.name ||

"G-Glam";


currentOwnerEmail =

store.ownerEmail ||

store.email ||

auth.currentUser.email ||

"";


storeNameElement.textContent =
currentStoreName;


ownerEmailElement.textContent =
currentOwnerEmail;


/* =====================================================
   LOAD ORDERS
===================================================== */

await loadOrders();


}catch(error){

console.error(
"STORE ERROR:",
error
);

alert(
"❌ حدث خطأ أثناء التحقق من المتجر."
);

}

}


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

try{


ordersContainer.innerHTML = `

<div class="loading">

⏳ جاري تحميل الطلبات...

</div>

`;


/* =====================================================
   IMPORTANT:
   ORDERS BELONG TO OWNER UID
===================================================== */

const q =
query(

collection(
db,
"orders"
),

where(
"ownerUid",
"==",
currentOwnerUid
)

);


let snapshot;


try{

snapshot =
await getDocs(q);

}catch(error){

/*
   دعم الطلبات القديمة التي تستخدم ownerEmail
*/

if(

error.code === "failed-precondition" ||

error.code === "permission-denied"

){

const oldQuery =
query(

collection(
db,
"orders"
),

where(
"ownerEmail",
"==",
currentOwnerEmail
)

);

snapshot =
await getDocs(oldQuery);

}else{

throw error;

}

}


/* =====================================================
   STATISTICS
===================================================== */

totalOrders.textContent =
snapshot.size;

let processing = 0;

let shipped = 0;

let delivered = 0;


snapshot.forEach(
orderDoc=>{

const order =
orderDoc.data();

const status =
order.status ||
"قيد المعالجة";


if(
status === "قيد المعالجة"
){

processing++;

}

if(
status === "تم الشحن"
){

shipped++;

}

if(
status === "تم التوصيل"
){

delivered++;

}

});


processingOrders.textContent =
processing;

shippedOrders.textContent =
shipped;

deliveredOrders.textContent =
delivered;


/* =====================================================
   EMPTY
===================================================== */

if(snapshot.empty){

ordersContainer.innerHTML = `

<div class="empty">

<div class="empty-icon">

📦

</div>

لا توجد طلبات لحد الآن.

<br>

ستظهر طلبات زبائنك هنا عند وصولها.

</div>

`;

return;

}


/* =====================================================
   SORT CLIENT SIDE
===================================================== */

const orders =
snapshot.docs
.map(
docSnap=>({

id:docSnap.id,
data:docSnap.data()

})
);


orders.sort(
(a,b)=>{

const aTime =
a.data.createdAt?.seconds ||
0;

const bTime =
b.data.createdAt?.seconds ||
0;

return bTime-aTime;

}
);


ordersContainer.innerHTML = "";


/* =====================================================
   RENDER
===================================================== */

orders.forEach(
item=>{

renderOrder(
item.id,
item.data
);

});


}catch(error){

console.error(
"ORDERS ERROR:",
error
);

ordersContainer.innerHTML = `

<div class="empty">

❌ حدث خطأ أثناء تحميل الطلبات.

<br><br>

${escapeHtml(error.message)}

</div>

`;

}

}


/* =====================================================
   RENDER ORDER
===================================================== */

function renderOrder(id,order){

let productsHTML = "";


if(
Array.isArray(order.products) &&
order.products.length
){

order.products.forEach(
product=>{

const quantity =
Number(
product.quantity || 1
);


const price =
Number(
product.price || 0
);


productsHTML += `

<div class="product">

<div>

<div class="product-name">

${escapeHtml(
product.name || "منتج"
)}

</div>

/* =====================================================
   UPDATE STATUS
===================================================== */

async function updateStatus(id){

try{


const select =
document.getElementById(
"status-" + id
);


if(!select){

return;

}


const newStatus =
select.value;


/* =====================================================
   UPDATE ONLY THIS ORDER
===================================================== */

await updateDoc(

doc(
db,
"orders",
id
),

{

status:newStatus

}

);


showSuccess(
"✅ تم تحديث حالة الطلب بنجاح"
);


await loadOrders();


}catch(error){

console.error(
"UPDATE STATUS ERROR:",
error
);

showError(
"❌ تعذر تحديث حالة الطلب."
);

}

}


/* =====================================================
   MESSAGES
===================================================== */

function showSuccess(text){

const box =
document.getElementById(
"successMessage"
);

box.textContent =
text;

box.style.display =
"block";


setTimeout(
function(){

box.style.display =
"none";

},
3000
);

}


function showError(text){

const box =
document.getElementById(
"errorMessage"
);

box.textContent =
text;

box.style.display =
"block";


setTimeout(
function(){

box.style.display =
"none";

},
4000
);

}

const ok =

);


if(!ok){

}


try{

localStorage.removeItem(
"storeId"
);

"ownerUid"
);

"storeName"
);

localStorage.removeItem(
"ownerEmail"
);

"storeOwnerEmail"
);

"paymentStatus"
);


window.location.href =
"login.html";


}catch(error){

);

);

}

});


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(

auth,

async function(user){

if(!user){

window.location.href =
"login.html";

return;

}


currentOwnerUid =
user.uid;

currentOwnerEmail =
user.email || "";


ownerEmailElement.textContent =
currentOwnerEmail;


await loadStore();

});
