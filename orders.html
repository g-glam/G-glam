<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#F47B20">

    <title>G-Glam | الطلبات</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #F47B20;
            --primary-dark: #d9630e;
            --bg: #f6f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #d9dee7;

            --row-even: #ffffff;
            --row-odd: #fff7f0;

            --success: #16a34a;
            --warning: #f59e0b;
            --danger: #dc2626;
            --info: #2563eb;

            --shadow:
                0 8px 25px rgba(0, 0, 0, 0.07);
        }

        body.dark {
            --bg: #111827;
            --card: #1f2937;
            --text: #f3f4f6;
            --muted: #9ca3af;
            --border: #374151;

            --row-even: #1f2937;
            --row-odd: #263241;
        }

        body {
            font-family: "Tajawal", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        button,
        input,
        textarea,
        select {
            font-family: inherit;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =========================
           TOPBAR
        ========================== */

        .topbar {
            height: 72px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 3px 15px rgba(0, 0, 0, .04);
        }

        .topbar-right,
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .store-box {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .store-image {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            background: #eee;
        }

        .store-name {
            font-size: 16px;
            font-weight: 800;
        }

        .store-subtitle {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        .top-action {
            width: 42px;
            height: 42px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: .2s;
        }

        .top-action:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* =========================
           SIDEBAR
        ========================== */

        .layout {
            display: flex;
            min-height: calc(100vh - 72px);
        }

        .sidebar {
            width: 245px;
            background: var(--card);
            border-left: 1px solid var(--border);
            padding: 20px 14px;
            flex-shrink: 0;
        }

        .sidebar-title {
            font-size: 12px;
            color: var(--muted);
            padding: 10px 13px;
            margin-bottom: 5px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 14px;
            margin-bottom: 6px;
            border-radius: 12px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
            transition: .2s;
        }

        .nav-item i {
            width: 20px;
            text-align: center;
        }

        .nav-item:hover {
            background: rgba(244, 123, 32, .09);
            color: var(--primary);
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 5px 15px rgba(244, 123, 32, .22);
        }

        /* =========================
           MAIN
        ========================== */

        .main {
            flex: 1;
            min-width: 0;
            padding: 28px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 25px;
        }

        .page-title {
            font-size: 27px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .page-description {
            color: var(--muted);
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 11px;
            padding: 11px 17px;
            cursor: pointer;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: .2s;
            font-size: 13px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-secondary {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* =========================
           STATS
        ========================== */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 22px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 19px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(244, 123, 32, .12);
            color: var(--primary);
            font-size: 19px;
        }

        .stat-label {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 3px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 800;
        }

        /* =========================
           TABLE CARD
        ========================== */

        .orders-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .card-toolbar {
            padding: 17px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .toolbar-title {
            font-weight: 800;
            font-size: 17px;
        }

        .toolbar-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
        }

        .search-box i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
        }

        .search-box input {
            width: 230px;
            padding: 10px 38px 10px 12px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            border-radius: 10px;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border: 2px solid var(--border);
            border-radius: 14px;
            margin: 18px;
            width: calc(100% - 36px);
        }

        .orders-table {
            width: 100%;
            min-width: 1450px;
            border-collapse: separate;
            border-spacing: 0;
            text-align: right;
        }

        .orders-table th {
            background: #f3f4f6;
            color: #374151;
            font-size: 12px;
            font-weight: 800;
            padding: 15px 12px;
            border-bottom: 2px solid var(--border);
            border-left: 1px solid var(--border);
            white-space: nowrap;
        }

        body.dark .orders-table th {
            background: #111827;
            color: #f3f4f6;
        }

        .orders-table td {
            padding: 14px 12px;
            border-bottom: 1px solid var(--border);
            border-left: 1px solid var(--border);
            font-size: 13px;
            vertical-align: middle;
        }

        .orders-table tr:nth-child(even) td {
            background: var(--row-even);
        }

        .orders-table tr:nth-child(odd) td {
            background: var(--row-odd);
        }

        .orders-table tbody tr:hover td {
            background: rgba(244, 123, 32, .08);
        }

        .orders-table tbody tr.selected td {
            background: rgba(244, 123, 32, .14);
        }

        .orders-table th:last-child,
        .orders-table td:last-child {
            border-left: none;
        }

        .orders-table tbody tr:last-child td {
            border-bottom: none;
        }

        .order-number {
            font-weight: 800;
            color: var(--primary);
        }

        .customer-name {
            font-weight: 800;
            margin-bottom: 3px;
        }

        .customer-phone {
            color: var(--muted);
            font-size: 11px;
        }

        .products-summary {
            max-width: 250px;
        }

        .product-line {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 6px;
        }

        .product-line:last-child {
            margin-bottom: 0;
        }

        .product-line-name {
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-qty {
            background: rgba(244, 123, 32, .12);
            color: var(--primary);
            padding: 2px 7px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .total-price {
            color: var(--primary);
            font-weight: 800;
            white-space: nowrap;
        }

        .notes {
            max-width: 180px;
            line-height: 1.7;
            color: var(--muted);
        }

        /* =========================
           STATUS
        ========================== */

        .status-select {
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            border-radius: 9px;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }

        .status-select:focus {
            border-color: var(--primary);
        }

        .status-confirmed {
            color: var(--success);
        }

        .status-shipped {
            color: var(--info);
        }

        .status-delivered {
            color: #059669;
        }

        .status-cancelled {
            color: var(--danger);
        }

        .status-pending {
            color: var(--warning);
        }

        /* =========================
           ACTIONS
        ========================== */

        .action-buttons {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .icon-btn {
            width: 35px;
            height: 35px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: .2s;
        }

        .icon-btn:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        .icon-btn.delete:hover {
            color: white;
            background: var(--danger);
            border-color: var(--danger);
        }

        /* =========================
           EMPTY / LOADING
        ========================== */

        .loading,
        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--muted);
        }

        .loading i,
        .empty-state i {
            font-size: 40px;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .empty-state h3 {
            color: var(--text);
            margin-bottom: 7px;
        }

        /* =========================
           MODAL
        ========================== */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .62);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 3000;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: min(900px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, .25);
        }

        .modal-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            position: sticky;
            top: 0;
            background: var(--card);
            z-index: 2;
        }

        .modal-title {
            font-size: 19px;
            font-weight: 800;
        }

        .close-modal {
            width: 38px;
            height: 38px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            border-radius: 10px;
            cursor: pointer;
        }

        .close-modal:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        .modal-body {
            padding: 22px;
        }

        /* =========================
           PRODUCT SUMMARY
        ========================== */

        .product-summary-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .product-summary-card {
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 15px;
            text-align: center;
            background: var(--bg);
        }

        .product-summary-card span {
            display: block;
            color: var(--muted);
            font-size: 11px;
            margin-bottom: 4px;
        }

        .product-summary-card strong {
            font-size: 19px;
            font-weight: 800;
        }

        .product-details {
            display: grid;
            gap: 13px;
        }

        .product-card {
            border: 2px solid var(--border);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            gap: 15px;
            background: var(--card);
        }

        .product-card:hover {
            border-color: rgba(244, 123, 32, .5);
        }

        .product-image {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid var(--border);
            flex-shrink: 0;
            background: #f3f4f6;
        }

        .product-info {
            flex: 1;
            min-width: 0;
        }

        .product-name {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 9px;
        }

        .product-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 10px;
        }

        .meta-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 9px;
            font-size: 11px;
            color: var(--muted);
        }

        .meta-item strong {
            color: var(--text);
        }

        .product-extra-fields {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 7px;
            margin-top: 8px;
        }

        .extra-field {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 9px;
            font-size: 11px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .extra-label {
            color: var(--muted);
            font-weight: 700;
        }

        .extra-value {
            color: var(--text);
            font-weight: 700;
        }

        .product-line-total {
            min-width: 100px;
            text-align: left;
            align-self: center;
            color: var(--primary);
            font-weight: 800;
            font-size: 15px;
        }

        /* =========================
           PHONE MODAL
        ========================== */

        .phone-content {
            text-align: center;
            padding: 10px;
        }

        .phone-number {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
            margin: 15px 0 22px;
            direction: ltr;
        }

        .phone-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* =========================
           TOAST
        ========================== */

        .toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #111827;
            color: white;
            padding: 13px 18px;
            border-radius: 11px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
            transform: translateY(100px);
            opacity: 0;
            pointer-events: none;
            transition: .3s;
            z-index: 5000;
            font-size: 13px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: var(--success);
        }

        .toast.error {
            background: var(--danger);
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 1100px) {

            .sidebar {
                width: 210px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 800px) {

            .topbar {
                padding: 0 13px;
            }

            .sidebar {
                display: none;
            }

            .main {
                padding: 16px;
            }

            .page-header {
                flex-direction: column;
            }

            .page-title {
                font-size: 23px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .stat-card {
                padding: 14px;
            }

            .stat-icon {
                width: 42px;
                height: 42px;
            }

            .search-box input {
                width: 100%;
            }

            .search-box {
                width: 100%;
            }

            .card-toolbar {
                align-items: stretch;
            }

            .toolbar-actions {
                width: 100%;
            }

            .product-summary-stats {
                grid-template-columns: 1fr;
            }

            .product-card {
                flex-direction: column;
            }

            .product-image {
                width: 100%;
                height: 180px;
            }

            .product-line-total {
                text-align: right;
            }

            .product-extra-fields {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 500px) {

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .store-subtitle {
                display: none;
            }

            .store-name {
                font-size: 13px;
            }

            .store-image {
                width: 38px;
                height: 38px;
            }

            .header-actions {
                width: 100%;
            }

            .header-actions .btn {
                flex: 1;
            }

        }

    </style>
</head>

<body>

<!-- =========================
     TOPBAR
========================= -->

<header class="topbar">

    <div class="topbar-right">

        <div class="store-box">

            <img id="storeImage"
                 class="store-image"
                 src="https://via.placeholder.com/100">

            <div>
                <div id="storeName"
                     class="store-name">
                    متجري
                </div>

                <div class="store-subtitle">
                    لوحة تحكم المتجر
                </div>
            </div>

        </div>

    </div>

    <div class="topbar-left">

        <a id="viewStoreBtn"
           href="index.html"
           class="top-action"
           title="عرض المتجر">

            <i class="fa-solid fa-store"></i>

        </a>

        <button class="top-action"
                id="darkModeBtn"
                title="الوضع الليلي">

            <i class="fa-solid fa-moon"></i>

        </button>

    </div>

</header>


<div class="layout">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <div class="sidebar-title">
            القائمة الرئيسية
        </div>

        <a href="dashboard.html"
           class="nav-item">

            <i class="fa-solid fa-chart-line"></i>
            <span>لوحة التحكم</span>

        </a>

        <a href="orders.html"
           class="nav-item active">

            <i class="fa-solid fa-cart-shopping"></i>
            <span>الطلبات</span>

        </a>

        <a href="products.html"
           class="nav-item">

            <i class="fa-solid fa-box"></i>
            <span>المنتجات</span>

        </a>

        <a href="add-product.html"
           class="nav-item">

            <i class="fa-solid fa-plus"></i>
            <span>إضافة منتج</span>

        </a>

        <a href="delivery.html"
           class="nav-item">

            <i class="fa-solid fa-truck"></i>
            <span>التوصيل</span>

        </a>

        <a href="settings.html"
           class="nav-item">

            <i class="fa-solid fa-gear"></i>
            <span>الإعدادات</span>

        </a>

        <a href="#"
           id="logoutBtn"
           class="nav-item">

            <i class="fa-solid fa-right-from-bracket"></i>
            <span>تسجيل الخروج</span>

        </a>

    </aside>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="main">

        <div class="page-header">

            <div>

                <h1 class="page-title">
                    الطلبات
                </h1>

                <p class="page-description">
                    إدارة ومتابعة جميع طلبات متجرك
                </p>

            </div>

            <div class="header-actions">

                <button class="btn btn-secondary"
                        onclick="loadOrders()">

                    <i class="fa-solid fa-rotate"></i>
                    تحديث

                </button>

                <button class="btn btn-danger"
                        id="deleteSelectedBtn"
                        style="display:none;">

                    <i class="fa-solid fa-trash"></i>
                    حذف المحدد

                </button>

            </div>

        </div>


        <!-- =========================
             STATS
        ========================== -->

        <section class="stats">

            <div class="stat-card">

                <div class="stat-icon">
                    <i class="fa-solid fa-receipt"></i>
                </div>

                <div>
                    <div class="stat-label">
                        إجمالي الطلبات
                    </div>

                    <div id="totalOrders"
                         class="stat-value">
                        0
                    </div>
                </div>

            </div>


            <div class="stat-card">

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    import {
        getFirestore,
        collection,
        doc,
        getDoc,
        getDocs,
        query,
        where,
        updateDoc,
        deleteDoc
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


    /* =========================
       FIREBASE
    ========================== */

    const firebaseConfig = {

        apiKey: "AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

        authDomain: "g-glam.firebaseapp.com",

        projectId: "g-glam",

        storageBucket: "g-glam.firebasestorage.app",

        messagingSenderId: "997228419719",

        appId: "1:997228419719:web:f9d88de7ea2c6f457e3622",

        measurementId: "G-WX1K1F83F6"

    };


    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);

    const db =
        getFirestore(app);


    /* =========================
       VARIABLES
    ========================== */

    let currentOwnerUid = null;
    let currentOwnerEmail = null;

    let currentStoreId = null;

    let orders = [];

    let filteredOrders = [];


    /* =========================
       ELEMENTS
    ========================== */

    const tableContainer =
        document.getElementById("tableContainer");

    const searchInput =
        document.getElementById("searchInput");

    const deleteSelectedBtn =
        document.getElementById("deleteSelectedBtn");


    /* =========================
       DARK MODE
    ========================== */

    const darkModeBtn =
        document.getElementById("darkModeBtn");

    function applyDarkMode() {

        const enabled =
            localStorage.getItem("gGlamDarkMode") === "true";

        document.body.classList.toggle(
            "dark",
            enabled
        );

        darkModeBtn.innerHTML =
            enabled
                ? '<i class="fa-solid fa-sun"></i>'
                : '<i class="fa-solid fa-moon"></i>';
    }

    darkModeBtn.addEventListener(
        "click",
        () => {

            const enabled =
                document.body.classList.toggle("dark");

            localStorage.setItem(
                "gGlamDarkMode",
                enabled
            );

            applyDarkMode();

        }
    );

    applyDarkMode();


    /* =========================
       TOAST
    ========================== */

    function showToast(
        message,
        type = ""
    ) {

        const toast =
            document.getElementById("toast");

        toast.textContent = message;

        toast.className =
            "toast show " + type;

        setTimeout(() => {

            toast.className = "toast";

        }, 3000);

    }


    /* =========================
       LOAD STORE
    ========================== */

    async function loadStore() {

        if (!currentOwnerUid) {
            return;
        }

        try {

            let storeSnapshot = null;

            const savedStoreId =
                localStorage.getItem("storeDocumentId") ||
                localStorage.getItem("storeId");


            /* محاولة استخدام storeId المحفوظ */

            if (savedStoreId) {

                try {

                    const savedRef =
                        doc(
                            db,
                            "stores",
                            savedStoreId
                        );

                    const savedDoc =
                        await getDoc(savedRef);

                    if (savedDoc.exists()) {

                        const data =
                            savedDoc.data();

                        if (
                            !data.ownerUid ||
                            data.ownerUid === currentOwnerUid
                        ) {

                            storeSnapshot =
                                savedDoc;

                        }

                    }

                } catch (error) {

                    console.warn(
                        "Saved store lookup failed",
                        error
                    );

                }

            }


            /* البحث المباشر بواسطة UID */

            if (!storeSnapshot) {

                try {

                    const directRef =
                        doc(
                            db,
                            "stores",
                            currentOwnerUid
                        );

                    const directDoc =
                        await getDoc(directRef);

                    if (directDoc.exists()) {

                        const data =
                            directDoc.data();

                        if (
                            !data.ownerUid ||
                            data.ownerUid === currentOwnerUid
                        ) {

                            storeSnapshot =
                                directDoc;

                        }

                    }

                } catch (error) {

                    console.warn(
                        "Direct store lookup failed",
                        error
                    );

                }

            }


            /* البحث بواسطة ownerUid */

            if (!storeSnapshot) {

                const q =
                    query(
                        collection(db, "stores"),
                        where(
                            "ownerUid",
                            "==",
                            currentOwnerUid
                        )
                    );

                const snap =
                    await getDocs(q);

                if (!snap.empty) {

                    storeSnapshot =
                        snap.docs[0];

                }

            }


            /* fallback بالبريد */

            if (
                !storeSnapshot &&
                currentOwnerEmail
            ) {

                const q =
                    query(
                        collection(db, "stores"),
                        where(
                            "ownerEmail",
                            "==",
                            currentOwnerEmail
                        )
                    );

                const snap =
                    await getDocs(q);

                if (!snap.empty) {

                    const candidate =
                        snap.docs.find(
                            d => {

                                const data =
                                    d.data();

                                return !data.ownerUid ||
                                    data.ownerUid === currentOwnerUid;

                            }
                        );

                    if (candidate) {
                        storeSnapshot =
                            candidate;
                    }

                }

            }


            if (!storeSnapshot) {

                showToast(
                    "لم يتم العثور على المتجر",
                    "error"
                );

                return;

            }


            const storeData =
                storeSnapshot.data();

            currentStoreId =
                storeSnapshot.id;


            /* التحقق من الملكية */

            if (
                storeData.ownerUid &&
                storeData.ownerUid !== currentOwnerUid
            ) {

                showToast(
                    "لا تملك صلاحية الوصول لهذا المتجر",
                    "error"
                );

                return;

            }


            /* حالة المتجر */

            if (
                storeData.status &&
                ![
                    "approved",
                    "active"
                ].includes(
                    String(storeData.status).toLowerCase()
                )
            ) {

                showToast(
                    "المتجر غير مفعل حاليًا",
                    "error"
                );

            }


            localStorage.setItem(
                "storeId",
                currentStoreId
            );

            localStorage.setItem(
                "storeDocumentId",
                currentStoreId
            );

            localStorage.setItem(
                "storeOwnerUid",
                currentOwnerUid
            );


            const storeName =
                storeData.storeName ||
                storeData.name ||
                "متجري";


            localStorage.setItem(
                "storeName",
                storeName
            );


            document.getElementById(
                "storeName"
            ).textContent =
                storeName;


            const image =
                storeData.image ||
                storeData.logo ||
                storeData.storeImage;


            if (image) {

                document.getElementById(
                    "storeImage"
                ).src = image;

            }


            document.getElementById(
                "viewStoreBtn"
            ).href =
                "index.html?store=" +
                encodeURIComponent(currentStoreId);


            await loadOrders();

        } catch (error) {

            console.error(error);

            showToast(
                "حدث خطأ أثناء تحميل بيانات المتجر",
                "error"
            );

        }

    }


    /* =========================
       LOAD ORDERS
    ========================== */

    window.loadOrders =
        async function () {

            if (!currentOwnerUid) {
                return;
            }

            tableContainer.innerHTML = `

                <div class="loading">

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    <div>
                        جاري تحميل الطلبات...
                    </div>

                </div>

            `;

            try {

                const q =
                    query(
                        collection(db, "orders"),
                        where(
                            "ownerUid",
                            "==",
                            currentOwnerUid
                        )
                    );

                const snapshot =
                    await getDocs(q);

                orders =
                    snapshot.docs.map(
                        docSnap => ({

                            id: docSnap.id,

                            ...docSnap.data()

                        })
                    );


                orders.sort(
                    (a, b) => {

                        const dateA =
                            a.createdAt?.seconds ||
                            0;

                        const dateB =
                            b.createdAt?.seconds ||
                            0;

                        return dateB - dateA;

                    }
                );


                filteredOrders =
                    [...orders];


                updateStats();

                renderOrders();

            } catch (error) {

                console.error(
                    "Orders loading error:",
                    error
                );

                tableContainer.innerHTML = `

                    <div class="empty-state">

                        <i class="fa-solid fa-triangle-exclamation"></i>

                        <h3>
                            تعذر تحميل الطلبات
                        </h3>

                        <p>
                            تحقق من الاتصال وقواعد Firestore
                        </p>

                    </div>

                `;

            }

        };


    /* =========================
       STATS
    ========================== */

    function updateStats() {

        document.getElementById(
            "totalOrders"
        ).textContent =
            orders.length;


        document.getElementById(
            "confirmedOrders"
        ).textContent =
            orders.filter(
                o =>
                    normalizeStatus(o.status) === "confirmed"
            ).length;


        document.getElementById(
            "shippedOrders"
        ).textContent =
            orders.filter(
                o =>
                    normalizeStatus(o.status) === "shipped"
            ).length;


        document.getElementById(
            "deliveredOrders"
        ).textContent =
            orders.filter(
                o =>
                    normalizeStatus(o.status) === "delivered"
            ).length;

    }


    /* =========================
       STATUS NORMALIZATION
    ========================== */

    function normalizeStatus(status) {

        const value =
            String(status || "")
                .trim()
                .toLowerCase();


        if (
            value === "confirmed" ||
            value === "confirm" ||
            value === "مؤكد" ||
            value === "مؤكدة"
        ) {
            return "confirmed";
        }


        if (
            value === "shipped" ||
            value === "shipping" ||
            value === "قيد الشحن"
        ) {
            return "shipped";
        }


        if (
            value === "delivered" ||
            value === "delivery" ||
            value === "تم التوصيل" ||
            value === "تم التوصيل"
        ) {
            return "delivered";
        }


        if (
            value === "cancelled" ||
            value === "canceled" ||
            value === "ملغى" ||
            value === "ملغاة"
        ) {
            return "cancelled";
        }


        return "pending";

    }


    /* =========================
       DATE
    ========================== */

    function formatDate(value) {

        if (!value) {
            return "—";
        }

        let date;

        if (
            typeof value === "object" &&
            value.seconds
        ) {

            date =
                new Date(
                    value.seconds * 1000
                );

        } else {

            date =
                new Date(value);

        }


        if (isNaN(date.getTime())) {
            return "—";
        }


        return date.toLocaleDateString(
            "ar-DZ",
            {
                year: "numeric",
                month: "short",
                day: "numeric"
            }
        );

    }


    /* =========================
       MONEY
    ========================== */

    function formatPrice(value) {

        const number =
            Number(value) || 0;

        return number.toLocaleString(
            "ar-DZ"
        ) + " دج";

    }


    /* =========================
       PRODUCTS NORMALIZATION
    ========================== */

    function getOrderProducts(order) {

        let products =
            order.products ||
            order.items ||
            order.cart ||
            [];


        if (!Array.isArray(products)) {

            if (
                products &&
                typeof products === "object"
            ) {

                products =
                    Object.values(products);

            } else {

                products = [];

            }

        }


        return products;

    }


    /* =========================
       RENDER PRODUCTS SUMMARY
    ========================== */

    function renderProductsSummary(order) {

        const products =
            getOrderProducts(order);


        if (!products.length) {

            return `
                <span style="color:var(--muted)">
                    لا توجد منتجات
                </span>
            `;

        }


        return `

            <div class="products-summary">

                ${products.slice(0, 3).map(product => {

                    const name =
                        product.name ||
                        product.title ||
                        product.productName ||
                        "منتج";


                    const quantity =
                        Number(
                            product.quantity ||
                            product.qty ||
                            1
                        );


                    return `

                        <div class="product-line">

                            <span class="product-qty">
                                ×${quantity}
                            </span>

                            <span class="product-line-name">
                                ${escapeHtml(name)}
                            </span>

                        </div>

                    `;

                }).join("")}


                ${
                    products.length > 3
                        ? `
                            <div style="
                                color:var(--muted);
                                font-size:11px;
                                margin-top:5px;
                            ">
                                + ${products.length - 3} منتجات أخرى
                            </div>
                          `
                        : ""
                }

            </div>

        `;

    }


    /* =========================
       RENDER ORDERS
    ========================== */

    function renderOrders() {

        if (!filteredOrders.length) {

            tableContainer.innerHTML = `

                <div class="empty-state">

                    <i class="fa-solid fa-receipt"></i>

                    <h3>
                        لا توجد طلبات
                    </h3>

                    <p>
                        ستظهر الطلبات الجديدة هنا
                    </p>

                </div>

            `;

            updateDeleteButton();

            return;

        }


        let html = `

            <div class="table-wrapper">

                <table class="orders-table">

                    <thead>

                        <tr>

                            <th style="width:45px;">
                                <input type="checkbox"
                                       id="selectAll">
                            </th>

                            <th>
                                رقم الطلب
                            </th>

                            <th>
                                التاريخ
                            </th>

                            <th>
                                العميل
                            </th>

                            <th>
                                الهاتف
                            </th>

                            <th>
                                الولاية
                            </th>

                            <th>
                                العنوان
                            </th>

                            <th>
                                التوصيل
                            </th>

                            <th>
                                المنتجات
                            </th>

                            <th>
                                الإجمالي
                            </th>

                            <th>
                                الملاحظات
                            </th>

                            <th>
                                الحالة
                            </th>

                            <th>
                                الإجراء
                            </th>

                        </tr>

                    </thead>

                    <tbody>

        `;


        filteredOrders.forEach(
            (order, index) => {

                const status =
                    normalizeStatus(
                        order.status
                    );


                const customerName =
                    order.customerName ||
                    order.name ||
                    order.fullName ||
                    "غير محدد";


                const phone =
                    order.phone ||
                    order.customerPhone ||
                    order.mobile ||
                    "";


                const wilaya =
                    order.wilaya ||
                    order.state ||
                    order.city ||
                    "—";


                const address =
                    order.address ||
                    order.customerAddress ||
                    "—";


                const delivery =
                    Number(
                        order.deliveryPrice ||
                        order.shippingPrice ||
                        order.delivery ||
                        0
                    );


                const total =
                    Number(
                        order.total ||
                        order.totalPrice ||
                        order.grandTotal ||
                        0
                    );


                const notes =
                    order.notes ||
                    order.note ||
                    "—";


                html += `

                    <tr data-order-id="${escapeHtml(order.id)}">

                        <td>

                            <input type="checkbox"
                                   class="order-checkbox"
                                   data-id="${escapeHtml(order.id)}">

                        </td>


                        <td>

                            <span class="order-number">
                                #${String(index + 1).padStart(4, "0")}
                            </span>

                        </td>


                        <td>
                            ${formatDate(order.createdAt)}
                        </td>


                        <td>

                            <div class="customer-name">
                                ${escapeHtml(customerName)}
                            </div>

                            ${
                                phone
                                    ? `
                                        <div class="customer-phone">
                                            ${escapeHtml(phone)}
                                        </div>
                                      `
                                    : ""
                            }

                        </td>


                        <td>

                            ${
                                phone
                                    ? `
                                        <button
                                            class="icon-btn"
                                            onclick="openPhoneModal('${escapeJs(phone)}')"
                                            title="عرض رقم الهاتف">

                                            <i class="fa-solid fa-phone"></i>

                                        </button>
                                      `
                                    : "—"
                            }

                        </td>


                        <td>
                            ${escapeHtml(wilaya)}
                        </td>


                        <td>
                            ${escapeHtml(address)}
                        </td>


                        <td>
                            ${formatPrice(delivery)}
                        </td>


                        <td>

                            <button
                                class="btn btn-secondary"
                                onclick="openProductsModal('${escapeJs(order.id)}')">

                                <i class="fa-solid fa-box-open"></i>

                                عرض المنتجات

                            </button>

                        </td>


                        <td>

                            <span class="total-price">
                                ${formatPrice(total)}
                            </span>

                        </td>


                        <td>

                            <div class="notes">
                                ${escapeHtml(notes)}
                            </div>

                        </td>


                        <td>

                            <select
                                class="status-select status-${status}"
                                onchange="changeOrderStatus('${escapeJs(order.id)}', this.value)">

                                <option value="pending"
                                    ${status === "pending" ? "selected" : ""}>
                                    قيد الانتظار
                                </option>

                                <option value="confirmed"
                                    ${status === "confirmed" ? "selected" : ""}>
                                    مؤكدة
                                </option>

                                <option value="shipped"
                                    ${status === "shipped" ? "selected" : ""}>
                                    قيد الشحن
                                </option>

                                <option value="delivered"
                                    ${status === "delivered" ? "selected" : ""}>
                                    تم التوصيل
                                </option>

                                <option value="cancelled"
                                    ${status === "cancelled" ? "selected" : ""}>
                                    ملغاة
                                </option>

                            </select>

                        </td>


                        <td>

                            <div class="action-buttons">

                                <button
                                    class="icon-btn delete"
                                    onclick="deleteOrder('${escapeJs(order.id)}')"
                                    title="حذف الطلب">

                                    <i class="fa-solid fa-trash"></i>

                                </button>

                            </div>

                        </td>

                    </tr>

                `;

            }
        );


        html += `

                    </tbody>

                </table>

            </div>

        `;


        tableContainer.innerHTML =
            html;


        setupCheckboxes();

    }


    /* =========================
       CHECKBOXES
    ========================== */

    function setupCheckboxes() {

        const selectAll =
            document.getElementById(
                "selectAll"
            );


        const checkboxes =
            document.querySelectorAll(
                ".order-checkbox"
            );


        if (selectAll) {

            selectAll.addEventListener(
                "change",
                () => {

                    checkboxes.forEach(
                        checkbox => {

                            checkbox.checked =
                                selectAll.checked;

                            checkbox.closest("tr")
                                ?.classList.toggle(
                                    "selected",
                                    checkbox.checked
                                );

                        }
                    );

                    updateDeleteButton();

                }
            );

        }


        checkboxes.forEach(
            checkbox => {

                checkbox.addEventListener(
                    "change",
                    () => {

                        checkbox.closest("tr")
                            ?.classList.toggle(
                                "selected",
                                checkbox.checked
                            );

                        updateDeleteButton();

                    }
                );

            }
        );

    }


    function updateDeleteButton() {

        const selected =
            document.querySelectorAll(
                ".order-checkbox:checked"
            );


        deleteSelectedBtn.style.display =
            selected.length
                ? "inline-flex"
                : "none";

    }


    /* =========================
       SEARCH
    ========================== */

    searchInput.addEventListener(
        "input",
        () => {

            const search =
                searchInput.value
                    .trim()
                    .toLowerCase();


            if (!search) {

                filteredOrders =
                    [...orders];

            } else {

                filteredOrders =
                    orders.filter(
                        order => {

                            const values = [

                                order.customerName,
                                order.name,
                                order.fullName,
                                order.phone,
                                order.customerPhone,
                                order.wilaya,
                                order.address,
                                order.notes,
                                order.note

                            ];


                            return values.some(
                                value =>
                                    String(value || "")
                                        .toLowerCase()
                                        .includes(search)
                            );

                        }
                    );

            }


            renderOrders();

        }
    );


    /* =========================
       CHANGE STATUS
    ========================== */

    window.changeOrderStatus =
        async function (
            orderId,
            newStatus
        ) {

            try {

                const orderRef =
                    doc(
                        db,
                        "orders",
                        orderId
                    );

                const orderDoc =
                    await getDoc(orderRef);


                if (!orderDoc.exists()) {

                    showToast(
                        "الطلب غير موجود",
                        "error"
                    );

                    return;

                }


                const data =
                    orderDoc.data();


                if (
                    data.ownerUid &&
                    data.ownerUid !== currentOwnerUid
                ) {

                    showToast(
                        "لا تملك صلاحية تعديل هذا الطلب",
                        "error"
                    );

                    return;

                }


                await updateDoc(
                    orderRef,
                    {
                        status: newStatus
                    }
                );


                const order =
                    orders.find(
                        o =>
                            o.id === orderId
                    );


                if (order) {
                    order.status =
                        newStatus;
                }


                updateStats();

                showToast(
                    "تم تحديث حالة الطلب",
                    "success"
                );


            } catch (error) {

                console.error(error);

                showToast(
                    "تعذر تحديث حالة الطلب",
                    "error"
                );

                renderOrders();

            }

        };


    /* =========================
       DELETE ORDER
    ========================== */

    window.deleteOrder =
        async function (
            orderId
        ) {

            if (
                !confirm(
                    "هل أنت متأكد من حذف هذا الطلب؟"
                )
            ) {
                return;
            }


            try {

                const orderRef =
                    doc(
                        db,
                        "orders",
                        orderId
                    );


                const orderDoc =
                    await getDoc(orderRef);


                if (!orderDoc.exists()) {

                    showToast(
                        "الطلب غير موجود",
                        "error"
                    );

                    return;

                }


                const data =
                    orderDoc.data();


                if (
                    data.ownerUid &&
                    data.ownerUid !== currentOwnerUid
                ) {

                    showToast(
                        "لا تملك صلاحية حذف هذا الطلب",
                        "error"
                    );

                    return;

                }


                await deleteDoc(
                    orderRef
                );


                orders =
                    orders.filter(
                        order =>
                            order.id !== orderId
                    );


                filteredOrders =
                    filteredOrders.filter(
                        order =>
                            order.id !== orderId
                    );


                updateStats();

                renderOrders();

                showToast(
                    "تم حذف الطلب",
                    "success"
                );


            } catch (error) {

                console.error(error);

                showToast(
                    "تعذر حذف الطلب",
                    "error"
                );

            }

        };


    /* =========================
       DELETE SELECTED
    ========================== */

    deleteSelectedBtn.addEventListener(
        "click",
        async () => {

            const selected =
                Array.from(
                    document.querySelectorAll(
                        ".order-checkbox:checked"
                    )
                ).map(
                    checkbox =>
                        checkbox.dataset.id
                );


            if (!selected.length) {
                return;
            }


            if (
                !confirm(
                    `هل أنت متأكد من حذف ${selected.length} طلب؟`
                )
            ) {
                return;
            }


            try {

                let deletedCount = 0;


                for (
                    const orderId of selected
                ) {

                    const orderRef =
                        doc(
                            db,
                            "orders",
                            orderId
                        );


                    const orderDoc =
                        await getDoc(orderRef);


                    if (!orderDoc.exists()) {
                        continue;
                    }


                    const data =
                        orderDoc.data();


                    if (
                        data.ownerUid &&
                        data.ownerUid !== currentOwnerUid
                    ) {
                        continue;
                    }


                    await deleteDoc(
                        orderRef
                    );

                    deletedCount++;

                }


                orders =
                    orders.filter(
                        order =>
                            !selected.includes(
                                order.id
                            )
                    );


                filteredOrders =
                    filteredOrders.filter(
                        order =>
                            !selected.includes(
                                order.id
                            )
                    );


                updateStats();

                renderOrders();

                showToast(
                    `تم حذف ${deletedCount} طلب`,
                    "success"
                );


            } catch (error) {

                console.error(error);

                showToast(
                    "حدث خطأ أثناء حذف الطلبات",
                    "error"
                );

            }

        }
    );


    /* =========================
       PRODUCT MODAL
       IMPORTANT:
       id / storeId / ownerUid
       are hidden from display only.
    ========================== */

    window.openProductsModal =
        function (
            orderId
        ) {

            const order =
                orders.find(
                    o =>
                        o.id === orderId
                );


            if (!order) {

                showToast(
                    "لم يتم العثور على الطلب",
                    "error"
                );

                return;

            }


            const products =
                getOrderProducts(order);


            let totalPieces = 0;

            let productsSubtotal = 0;


            products.forEach(
                product => {

                    const quantity =
                        Number(
                            product.quantity ||
                            product.qty ||
                            1
                        );


                    const price =
                        Number(
                            product.price ||
                            product.unitPrice ||
                            0
                        );


                    totalPieces +=
                        quantity;


                    productsSubtotal +=
                        price * quantity;

                }
            );


            let html = `

                <div class="product-summary-stats">

                    <div class="product-summary-card">

                        <span>
                            عدد المنتجات
                        </span>

                        <strong>
                            ${products.length}
                        </strong>

                    </div>


                    <div class="product-summary-card">

                        <span>
                            إجمالي القطع
                        </span>

                        <strong>
                            ${totalPieces}
                        </strong>

                    </div>


                    <div class="product-summary-card">

                        <span>
                            مجموع المنتجات
                        </span>

                        <strong>
                            ${formatPrice(productsSubtotal)}
                        </strong>

                    </div>

                </div>


                <div class="product-details">

            `;


            if (!products.length) {

                html += `

                    <div class="empty-state">

                        <i class="fa-solid fa-box-open"></i>

                        <h3>
                            لا توجد منتجات
                        </h3>

                    </div>

                `;

            } else {

                products.forEach(
                    product => {

                        const name =
                            product.name ||
                            product.title ||
                            product.productName ||
                            "منتج";


                        const quantity =
                            Number(
                                product.quantity ||
                                product.qty ||
                                1
                            );


                        const price =
                            Number(
                                product.price ||
                                product.unitPrice ||
                                0
                            );


                        const lineTotal =
                            price * quantity;


                        const image =
                            product.image ||
                            (
                                Array.isArray(product.images)
                                    ? product.images[0]
                                    : ""
                            ) ||
                            "https://via.placeholder.com/150";


                        /*
                         * هذه الحقول لن تظهر للمستخدم:
                         *
                         * id
                         * storeId
                         * ownerUid
                         *
                         * وكذلك الحقول الأساسية التي يتم عرضها
                         * في مكانها المخصص.
                         */

                        const ignoredFields = new Set([

                            "id",
                            "storeId",
                            "ownerUid",

                            "name",
                            "title",
                            "productName",

                            "image",
                            "images",

                            "price",
                            "unitPrice",

                            "quantity",
                            "qty"

                        ]);


                        const extraFields = [];


                        Object.entries(
                            product
                        ).forEach(
                            ([key, value]) => {

                                if (
                                    ignoredFields.has(key)
                                ) {
                                    return;
                                }


                                if (
                                    value === null ||
                                    value === undefined ||
                                    value === ""
                                ) {
                                    return;
                                }


                                if (
                                    typeof value === "object"
                                ) {
                                    return;
                                }


                                extraFields.push({

                                    key,

                                    value:
                                        String(value)

                                });

                            }
                        );


                        html += `

                            <div class="product-card">

                                <img
                                    class="product-image"
                                    src="${escapeHtml(image)}"
                                    alt="${escapeHtml(name)}"
                                    onerror="this.src='https://via.placeholder.com/150';"
                                >


                                <div class="product-info">

                                    <div class="product-name">
                                        ${escapeHtml(name)}
                                    </div>


                                    <div class="product-meta">

                                        <div class="meta-item">

                                            الكمية:
                                            <strong>
                                                ${quantity}
                                            </strong>

                                        </div>


                                        <div class="meta-item">

                                            سعر الوحدة:
                                            <strong>
                                                ${formatPrice(price)}
                                            </strong>

                                        </div>

                                    </div>


                                    ${
                                        extraFields.length
                                            ? `

                                                <div class="product-extra-fields">

                                                    ${extraFields.map(
                                                        field => `

                                                            <div class="extra-field">

                                                                <span class="extra-label">
                                                                    ${escapeHtml(formatFieldName(field.key))}:
                                                                </span>

                                                                <span class="extra-value">
                                                                    ${escapeHtml(field.value)}
                                                                </span>

                                                            </div>

                                                        `
                                                    ).join("")}

                                                </div>

                                              `
                                            : ""
                                    }

                                </div>


                                <div class="product-line-total">

                                    ${formatPrice(lineTotal)}

                                </div>

                            </div>

                        `;

                    }
                );

            }


            html += `
                </div>
            `;


            document.getElementById(
                "productsModalBody"
            ).innerHTML =
                html;


            document.getElementById(
                "productsModal"
            ).classList.add("show");

        };


    /* =========================
       FORMAT FIELD NAME
    ========================== */

    function formatFieldName(
        key
    ) {

        const names = {

            description: "الوصف",

            category: "التصنيف",

            categoryName: "التصنيف",

            color: "اللون",

            size: "المقاس",

            sku: "رمز المنتج",

            stock: "المخزون",

            brand: "العلامة التجارية",

            material: "الخامة",

            discount: "الخصم",

            oldPrice: "السعر السابق",

            currency: "العملة",

            code: "الكود",

            barcode: "الباركود"

        };


        if (names[key]) {
            return names[key];
        }


        return key
            .replace(
                /([A-Z])/g,
                " $1"
            )
            .replace(
                /^./,
                char =>
                    char.toUpperCase()
            );

    }


    /* =========================
       CLOSE PRODUCT MODAL
    ========================== */

    window.closeProductsModal =
        function () {

            document.getElementById(
                "productsModal"
            ).classList.remove("show");

        };


    /* =========================
       PHONE MODAL
    ========================== */

    window.openPhoneModal =
        function (
            phone
        ) {

            const cleanPhone =
                String(phone || "")
                    .trim();


            if (!cleanPhone) {
                return;
            }


            document.getElementById(
                "phoneNumber"
            ).textContent =
                cleanPhone;


            document.getElementById(
                "callBtn"
            ).href =
                "tel:" + cleanPhone;


            const whatsappNumber =
                cleanPhone
                    .replace(
                        /\D/g,
                        ""
                    );


            document.getElementById(
                "whatsappBtn"
            ).href =
                "https://wa.me/" +
                whatsappNumber;


            document.getElementById(
                "phoneModal"
            ).classList.add("show");

        };


    window.closePhoneModal =
        function () {

            document.getElementById(
                "phoneModal"
            ).classList.remove("show");

        };


    /* =========================
       ESCAPE HTML
    ========================== */

    function escapeHtml(
        value
    ) {

        return String(value ?? "")
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    function escapeJs(
        value
    ) {

        return String(value ?? "")
            .replace(
                /\\/g,
                "\\\\"
            )
            .replace(
                /'/g,
                "\\'"
            )
            .replace(
                /"/g,
                '\\"'
            )
            .replace(
                /\n/g,
                "\\n"
            )
            .replace(
                /\r/g,
                "\\r"
            );

    }


    /* =========================
       CLOSE MODALS ON OUTSIDE
    ========================== */

    document.getElementById(
        "productsModal"
    ).addEventListener(
        "click",
        event => {

            if (
                event.target ===
                document.getElementById(
                    "productsModal"
                )
            ) {

                closeProductsModal();

            }

        }
    );


    document.getElementById(
        "phoneModal"
    ).addEventListener(
        "click",
        event => {

            if (
                event.target ===
                document.getElementById(
                    "phoneModal"
                )
            ) {

                closePhoneModal();

            }

        }
    );


    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Escape"
            ) {

                closeProductsModal();

                closePhoneModal();

            }

        }
    );


    /* =========================
       LOGOUT
    ========================== */

    document.getElementById(
        "logoutBtn"
    ).addEventListener(
        "click",
        async event => {

            event.preventDefault();

            try {

                await signOut(auth);

                localStorage.removeItem(
                    "storeId"
                );

                localStorage.removeItem(
                    "storeDocumentId"
                );

                localStorage.removeItem(
                    "storeOwnerUid"
                );

                localStorage.removeItem(
                    "storeName"
                );

                window.location.href =
                    "store-login.html";

            } catch (error) {

                console.error(error);

                showToast(
                    "تعذر تسجيل الخروج",
                    "error"
                );

            }

        }
    );


    /* =========================
       AUTH
    ========================== */

    onAuthStateChanged(
        auth,
        async user => {

            if (!user) {

                window.location.href =
                    "store-login.html";

                return;

            }


            currentOwnerUid =
                user.uid;


            currentOwnerEmail =
                user.email || "";


            await loadStore();

        }
    );

</script>
