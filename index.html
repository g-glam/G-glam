    <style>

        :root {

            --bg: #F4F4F4;

            --card: #FFFFFF;

            --text: #222222;

            --accent: #F47B20;

            --accent-dark: #DF6810;

            --accent-light: #FFF1E6;

            --muted: #777777;

            --border: #E8E8E8;

            --danger: #D9534F;

            --shadow:
                0 4px 15px rgba(0, 0, 0, .06);

        }


        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

            font-family:
                "Tajawal",
                Arial,
                sans-serif;

        }


        body {

            background: var(--bg);

            color: var(--text);

            padding-bottom: 90px;

            transition:
                background .3s ease,
                color .3s ease;

        }


        /* ================================
           HEADER
        ================================= */

        header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 18px 20px;

            background: var(--bg);

            position: sticky;

            top: 0;

            z-index: 100;

        }


        .logo {

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .logo img {

            width: 120px;

            height: auto;

            max-height: 55px;

            object-fit: contain;

            display: block;

        }


        .menu-btn,
        .cart-icon {

            width: 42px;

            height: 42px;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            position: relative;

        }


        .menu-btn svg,
        .cart-icon svg {

            width: 27px;

            height: 27px;

            stroke: currentColor;

            fill: none;

            stroke-width: 2;

            stroke-linecap: round;

            stroke-linejoin: round;

        }


        .cart-count {

            position: absolute;

            top: -2px;

            left: -2px;

            background: var(--accent);

            color: #FFFFFF;

            font-size: 11px;

            font-weight: bold;

            width: 20px;

            height: 20px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        /* ================================
           STORE INFORMATION
        ================================= */

        .store-banner {

            width: calc(100% - 30px);

            max-width: 900px;

            margin: 18px auto 22px;

            background: var(--card);

            border-radius: 24px;

            padding: 25px 20px 25px;

            text-align: center;

            border: 1px solid var(--border);

            box-shadow:
                0 6px 22px rgba(0, 0, 0, .07);

            position: relative;

            overflow: hidden;

        }


        .store-banner::before {

            content: "";

            position: absolute;

            top: 0;

            right: 0;

            width: 5px;

            height: 100%;

            background: var(--accent);

        }


        /* ================================
           STORE IMAGE
        ================================= */

        .store-banner-image {

            display: flex;

            justify-content: center;

            align-items: center;

            margin-bottom: 18px;

        }


        .store-banner-image img {

            width: 120px;

            height: 120px;

            border-radius: 50%;

            object-fit: cover;

            background: #F1F1F1;

            border: 5px solid #FFFFFF;

            box-shadow:
                0 6px 20px rgba(0, 0, 0, .12);

            display: block;

        }


        /* ================================
           STORE COVER
        ================================= */

        .store-cover {

            width: 100%;

            margin: 0 auto 20px;

            border-radius: 18px;

            overflow: hidden;

            display: none;

            background: #EEEEEE;

            border: 1px solid var(--border);

        }


        .store-cover img {

            width: 100%;

            height: auto;

            min-height: 150px;

            max-height: 360px;

            object-fit: cover;

            object-position: center;

            display: block;

        }


        .store-banner h1 {

            font-size: 26px;

            font-weight: 800;

            color: var(--text);

            margin-bottom: 7px;

        }


        .store-banner p {

            font-size: 14px;

            color: var(--muted);

            line-height: 1.8;

        }


        /* ================================
           SEARCH
        ================================= */

        .search-box {

            padding: 0 15px 20px;

            max-width: 900px;

            margin: auto;

        }


        .search-box input {

            width: 100%;

            padding: 15px 20px;

            border: 1px solid var(--border);

            border-radius: 30px;

            background: var(--card);

            color: var(--text);

            box-shadow: var(--shadow);

            font-size: 15px;

            outline: none;

        }


        .search-box input:focus {

            border-color: var(--accent);

            box-shadow:
                0 0 0 3px
                rgba(244, 123, 32, .10);

        }


        /* ================================
           SIDEBAR
        ================================= */

        .sidebar {

            position: fixed;

            top: 0;

            right: -280px;

            width: 280px;

            height: 100%;

            background: var(--card);

            box-shadow:
                -4px 0 15px rgba(0, 0, 0, .1);

            z-index: 999;

            transition:
                right .3s;

            padding-top: 30px;

        }


        .sidebar.active {

            right: 0;

        }


        .sidebar a {

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 16px 25px;

            text-decoration: none;

            color: var(--text);

            font-size: 17px;

            border-bottom:
                1px solid var(--border);

        }


        .sidebar a svg {

            width: 21px;

            height: 21px;

            stroke: currentColor;

            fill: none;

            stroke-width: 2;

            stroke-linecap: round;

            stroke-linejoin: round;

            flex-shrink: 0;

        }


        .sidebar a:hover {

            background: var(--accent-light);

            color: var(--accent-dark);

        }


        .overlay {

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, .35);

            display: none;

            z-index: 998;

        }


        .overlay.active {

            display: block;

        }


        /* ================================
           PRODUCTS
        ================================= */

        .products {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;

            padding: 15px;

            max-width: 1400px;

            margin: auto;

        }


        /* إطار المنتج فقط */

        .card {

            background: transparent;

            border: 2px solid var(--accent);

            border-radius: 16px;

            overflow: hidden;

            box-shadow: none;

            transition:
                transform .2s ease,
                border-color .2s ease;

        }


        .card:hover {

            transform:
                translateY(-2px);

            border-color:
                var(--accent-dark);

        }


        /*
         * إخفاء صورة المنتج
         * لأن المنتج أصبح داخل إطار فقط
         */

        .card > img {

            display: none;

        }


        .card-content {

            padding: 18px 14px;

            text-align: center;

            background: transparent;

        }


        .card h3 {

            font-size: 16px;

            margin-bottom: 10px;

            min-height: auto;

            height: auto;

            overflow: visible;

            line-height: 1.6;

            color: var(--text);

        }


        .price {

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 14px;

            color: var(--accent-dark);

        }


        /* ================================
           PRODUCT BUTTONS
        ================================= */

        .details-btn {

            display: block;

            width: 100%;

            text-align: center;

            padding: 10px;

            border: 1px solid var(--accent);

            border-radius: 10px;

            background: transparent;

            color: var(--accent-dark);

            text-decoration: none;

            cursor: pointer;

            margin-bottom: 8px;

            font-weight: bold;

        }


        .details-btn:hover {

            background:
                var(--accent-light);

        }


        .add-btn {

            width: 100%;

            padding: 10px;

            border: none;

            border-radius: 10px;

            background: var(--accent);

            color: #FFFFFF;

            cursor: pointer;

            font-weight: bold;

        }


        .add-btn:hover {

            background:
                var(--accent-dark);

        }


        .add-btn:disabled {

            background: #BDBDBD;

            cursor: not-allowed;

        }


        /* ================================
           LOADING / EMPTY
        ================================= */

        .loading {

            grid-column: 1 / -1;

            text-align: center;

            padding: 50px 20px;

            color: var(--muted);

        }


        .empty {

            grid-column: 1 / -1;

            text-align: center;

            padding: 50px 20px;

            color: var(--muted);

            background: transparent;

            border-radius: 18px;

            border:
                2px solid var(--accent);

        }


        /* ================================
           FLOATING CART
        ================================= */

        .floating-cart {

            position: fixed;

            bottom: 15px;

            right: 50%;

            transform:
                translateX(50%);

            width: 90%;

            max-width: 500px;

            background: var(--accent);

            color: #FFFFFF;

            padding: 16px;

            border-radius: 30px;

            text-align: center;

            text-decoration: none;

            box-shadow:
                0 8px 20px
                rgba(244, 123, 32, .25);

            z-index: 500;

            font-weight: bold;

        }


        .floating-cart-inner {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

        }


        .floating-cart svg {

            width: 21px;

            height: 21px;

            stroke: currentColor;

            fill: none;

            stroke-width: 2;

            stroke-linecap: round;

            stroke-linejoin: round;

        }


        .floating-cart:hover {

            background:
                var(--accent-dark);

        }


        /* ================================
           THEMES
        ================================= */

        body.theme-orange {

            --accent: #F47B20;

            --accent-dark: #DF6810;

            --accent-light: #FFF1E6;

        }


        body.theme-blue {

            --accent: #2563EB;

            --accent-dark: #1D4ED8;

            --accent-light: #EFF6FF;

        }


        body.theme-green {

            --accent: #16A34A;

            --accent-dark: #15803D;

            --accent-light: #F0FDF4;

        }


        body.theme-pink {

            --accent: #DB2777;

            --accent-dark: #BE185D;

            --accent-light: #FDF2F8;

        }


        body.theme-purple {

            --accent: #7C3AED;

            --accent-dark: #6D28D9;

            --accent-light: #F5F3FF;

        }


        /* ================================
           TABLET
        ================================= */

        @media (min-width: 768px) {

            .products {

                grid-template-columns:
                    repeat(4, 1fr);

            }

        }


        /* ================================
           DESKTOP
        ================================= */

        @media (min-width: 1000px) {

            :root {

                --card: #0D1B2A;

                --text: #F4F7FB;

                --muted: #AAB7C7;

                --border: #1D334A;

                --danger: #EF6461;

                --shadow:
                    0 8px 25px

            }


            body {

                background: var(--bg);

                color: var(--text);

            }


            header {

                background: var(--bg);

                border-bottom:
                    1px solid #172A40;

                box-shadow:
                    0 2px 15px
                    rgba(0, 0, 0, .20);

            }


            .store-banner {

                background: var(--card);

                border-color: var(--border);

                box-shadow:
                    0 8px 28px

            }


            .store-banner h1 {

                color: var(--text);

            }


            .store-banner p {

                color: var(--muted);

            }


            .store-cover {

                border-color:
                    var(--border);

                background:
                    #142538;

            }


            .search-box input {

                background: var(--card);

                color: var(--text);

                border-color: var(--border);

            }


            .sidebar {

                background: #0A1726;

            }


            .sidebar a {

                color: #E8EEF5;

                border-bottom-color:
                    #1A2D42;

            }


            .sidebar a:hover {

                background: #17283A;

                color: var(--accent);

            }


            .card {

                background: transparent;

                border-color:
                    var(--accent);

            }


            .card h3 {

                color: var(--text);

            }


            .empty {

                background: transparent;

                border-color:
                    var(--accent);

                color: var(--muted);

            }

        }


        @media (min-width: 1200px) {

            .products {

                grid-template-columns:
                    repeat(5, 1fr);

            }

        }


        /* ================================
           SMALL MOBILE
        ================================= */

        @media (max-width: 400px) {

            .logo img {

                width: 105px;

                max-height: 50px;

            }


            .menu-btn,
            .cart-icon {

                width: 38px;

                height: 38px;

            }


            .menu-btn svg,
            .cart-icon svg {

                width: 25px;

                height: 25px;

            }


            .store-banner {

                width:
                    calc(100% - 20px);

                margin-top: 12px;

                padding:
                    20px 12px 22px;

            }


            .store-banner-image img {

                width: 100px;

                height: 100px;

            }


            .store-cover {

                border-radius: 14px;

                margin-bottom: 16px;

            }


            .store-cover img {

                min-height: 110px;

                max-height: 220px;

            }


            .store-banner h1 {

                font-size: 22px;

            }


            .store-banner p {

                font-size: 13px;

            }


            .products {

                gap: 10px;

                padding: 10px;

            }


            .card-content {

                padding: 15px 10px;

            }


            .card h3 {

                font-size: 14px;

            }


            .price {

                font-size: 16px;

            }

        }


        /* ================================
           MOBILE COLORS
        ================================= */

        @media (max-width: 999px) {

            body {

                background: #F4F4F4;

                color: #222222;

            }


            header {

                background: #F4F4F4;

            }


            .store-banner {

                background: #FFFFFF;

            }


            .store-banner h1 {

                color: #222222;

            }


            .store-banner p {

                color: #777777;

            }


            .search-box input {

                background: #FFFFFF;

                color: #222222;

            }


            .sidebar {

                background: #FFFFFF;

            }


            .sidebar a {

                color: #222222;

            }


            .card {

                background: transparent;

            }


            .card h3 {

                color: #222222;

            }


            .empty {

                background: transparent;

            }

        }


        /* ================================
           SCROLLBAR
        ================================= */

        @media (min-width: 1000px) {

            ::-webkit-scrollbar {

                width: 8px;

                height: 8px;

            }


            ::-webkit-scrollbar-track {

                background: #07111F;

            }


            ::-webkit-scrollbar-thumb {

                background: #263E57;

                border-radius: 10px;

            }


            ::-webkit-scrollbar-thumb:hover {

                background: var(--accent);

            }

        }


        @media (max-width: 999px) {

            ::-webkit-scrollbar {

                width: 6px;

                height: 6px;

            }


            ::-webkit-scrollbar-track {

                background: #F1F1F1;

            }


            ::-webkit-scrollbar-thumb {

                background: #CCC;

                border-radius: 10px;

            }


            ::-webkit-scrollbar-thumb:hover {

                background: var(--accent);

            }

        }

    </style>

</head>

            );


        /* ================================
           الحصول على ID المتجر
        ================================= */

        const params =
            new URLSearchParams(
                window.location.search
            );


        let storeIdentifier =
            params.get(
                "store"
            );


        /* ================================
           المسار كاحتياط
        ================================= */

        if (!storeIdentifier) {

            const pathParts =
                window.location.pathname
                    .split("/")
                    .filter(
                        p =>
                            p &&
                            p !== "index.html"
                    );


            if (
                pathParts.length > 0
            ) {

                storeIdentifier =
                    pathParts[
                        pathParts.length - 1
                    ];

            }

        }


        /* ================================
           LocalStorage
        ================================= */

        if (!storeIdentifier) {

            storeIdentifier =
                localStorage.getItem(
                    "storeId"
                );

        }


        let storeUid =
            storeIdentifier;


        let allProducts = [];


        let currentStore = null;


        /* ================================
           التحقق من المتجر
        ================================= */

        if (!storeIdentifier) {

            productsContainer.innerHTML = `

                <div class="empty">

                    <div
                        style="
                            margin-bottom:15px;
                        "
                    >

                        لم يتم تحديد المتجر

                    </div>


                    <p>

                        يجب فتح رابط المتجر الخاص بصاحبه.

                    </p>

                </div>

            `;

            throw new Error(
                "STORE ID NOT FOUND"
            );

        }


        /* ================================
           Escape HTML
        ================================= */

        function escapeHtml(value) {

            return String(
                value ?? ""
            )

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

        }


        /* ================================
           تطبيق الثيم
        ================================= */

        function applyStoreTheme(theme) {

            document.body.classList.remove(

                "theme-orange",

                "theme-blue",

                "theme-green",

                "theme-pink",

                "theme-purple"

            );


            const validThemes = [

                "orange",

                "blue",

                "green",

                "pink",

                "purple"

            ];


            const selectedTheme =
                validThemes.includes(theme)
                    ? theme
                    : "orange";


            document.body.classList.add(
                "theme-" +
                selectedTheme
            );

        }


        /* ================================
           روابط التنقل
        ================================= */

        function updateNavigationLinks() {

            const storeParamVal =
                storeUid;


            document.getElementById(
                "homeLink"
            ).href =
                "index.html?store=" +
                encodeURIComponent(
                    storeParamVal
                );


            document.getElementById(
                "cartLink"
            ).href =
                "cart.html?store=" +
                encodeURIComponent(
                    storeParamVal
                );


            document.getElementById(
                "floatingCart"
            ).href =
                "cart.html?store=" +
                encodeURIComponent(
                    storeParamVal
                );

        }


        /* ================================
           تحميل المتجر
        ================================= */

        async function loadStore() {

            try {

                const storeRef =
                    doc(
                        db,
                        "stores",
                        storeIdentifier
                    );


                const storeSnap =
                    await getDoc(
                        storeRef
                    );


                if (
                    !storeSnap.exists()
                ) {

                    showStoreError(
                        "المتجر غير موجود."
                    );

                    return false;

                }


                currentStore =
                    storeSnap.data();


                storeUid =
                    storeSnap.id;


                localStorage.setItem(
                    "storeId",
                    storeUid
                );


                /* ================================
                   الثيم
                ================================= */

                applyStoreTheme(

                    currentStore.theme
                    ||
                    "orange"

                );


                /* ================================
                   حالة المتجر
                ================================= */

                const status =
                    String(
                        currentStore.status
                        ||
                        "approved"
                    )
                    .toLowerCase()
                    .trim();


                if (

                    status !== "approved"

                    &&

                    status !== "active"

                ) {

                    showStoreError(
                        "هذا المتجر غير متاح حاليًا."
                    );

                    return false;

                }


                /* ================================
                   اسم المتجر
                ================================= */

                const name =
                    currentStore.storeName
                    ||
                    currentStore.name
                    ||
                    "G-Glam";


                storeNameElement.textContent =
                    name;


                document.title =
                    name +
                    " | المتجر";


                /* ================================
                   الوصف
                ================================= */

                storeDescriptionElement.textContent =

                    currentStore.description
                    ||
                    "Bienvenue dans notre boutique";


                /* ================================
                   صورة المتجر
                ================================= */

                const image =

                    currentStore.storeImage
                    ||
                    currentStore.image
                    ||
                    currentStore.logo
                    ||
                    currentStore.photoURL
                    ||
                    "";


                if (image) {

                    storeImage.src =
                        image;

                    storeImage.style.display =
                        "block";

                }

                else {

                    storeImage.style.display =
                        "none";

                }


                /* ================================
                   غلاف المتجر
                   
                   يتم أخذه من إعدادات لوحة التحكم
                   ================================ */

                const coverImage =

                    currentStore.coverImage

                    ||

                    currentStore.storeCover

                    ||

                    currentStore.cover

                    ||

                    currentStore.bannerImage

                    ||

                    currentStore.storeBanner

                    ||

                    currentStore.banner

                    ||

                    "";


                if (coverImage) {

                    storeCoverImage.src =
                        coverImage;


                    storeCover.style.display =
                        "block";


                    storeCoverImage.onerror =
                        function () {

                            storeCover.style.display =
                                "none";

                        };

                }

                else {

                    storeCover.style.display =
                        "none";

                }


                /* ================================
                   الاتصال
                ================================= */

                const contactLink =
                    document.getElementById(
                        "contactLink"
                    );


                if (
                    currentStore.facebook
                ) {

                    contactLink.href =
                        currentStore.facebook;

                }

                else if (
                    currentStore.phone
                ) {

                    contactLink.href =
                        "tel:" +
                        currentStore.phone;

                }

                else {

                    contactLink.href =
                        "#";

                }


                updateNavigationLinks();


                return true;

            }

            catch (error) {

                console.error(
                    "STORE LOAD ERROR:",
                    error
                );


                showStoreError(
                    "حدث خطأ أثناء تحميل المتجر."
                );


                return false;

            }

        }


        /* ================================
           تحميل المنتجات
        ================================= */

        async function loadProducts() {

            try {

                productsContainer.innerHTML = `

                    <div class="loading">

                        جاري تحميل المنتجات...

                    </div>

                `;


                let snapshot;


                try {

                    const productsQuery =
                        query(

                            collection(
                                db,
                                "products"
                            ),

                            where(
                                "ownerUid",
                                "==",
                                storeUid
                            )

                        );


                    snapshot =
                        await getDocs(
                            productsQuery
                        );

                }

                catch (error) {

                    console.log(
                        "ownerUid query failed",
                        error
                    );


                    const oldQuery =
                        query(

                            collection(
                                db,
                                "products"
                            ),

                            where(
                                "storeId",
                                "==",
                                storeUid
                            )

                        );


                    snapshot =
                        await getDocs(
                            oldQuery
                        );

                }


                allProducts = [];


                snapshot.forEach(
                    productDoc => {

                        allProducts.push({

                            id:
                                productDoc.id,

                            ...productDoc.data()

                        });

                    }
                );


                renderProducts(
                    allProducts
                );

            }

            catch (error) {

                console.error(
                    "PRODUCTS ERROR:",
                    error
                );


                productsContainer.innerHTML = `

                    <div class="empty">

                        حدث خطأ أثناء تحميل المنتجات.

                        <br>
                        <br>

                        ${escapeHtml(
                            error.message || ""
                        )}

                    </div>

                `;

            }

        }


        /* ================================
           عرض المنتجات
        ================================= */

        function renderProducts(products) {

            productsContainer.innerHTML =
                "";


            if (
                !products.length
            ) {

                productsContainer.innerHTML = `

                    <div class="empty">

                        لا توجد منتجات في هذا المتجر حاليًا.

                    </div>

                `;

                return;

            }


            products.forEach(
                product => {


                    const name =
                        product.name
                        ||
                        "منتج";


                    const price =
                        Number(
                            product.price ||
                            0
                        );


                    const stock =
                        Number(
                            product.stock ??
                            0
                        );


                    const outOfStock =
                        stock <= 0;


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "card";


                    card.innerHTML = `

                        <div
                            class="card-content"
                        >

                            <h3>

                                ${escapeHtml(
                                    name
                                )}

                            </h3>


                            <div
                                class="price"
                            >

                                ${price} DA

                            </div>


                            <button
                                class="details-btn"
                            >

                                عرض المنتج

                            </button>


                            <button
                                class="add-btn"

                                ${
                                    outOfStock
                                        ? "disabled"
                                        : ""
                                }
                            >

                                ${
                                    outOfStock
                                        ? "غير متوفر"
                                        : "أضف إلى السلة"
                                }

                            </button>

                        </div>

                    `;


                    /* ================================
                       عرض المنتج
                    ================================= */

                    card
                        .querySelector(
                            ".details-btn"
                        )
                        .addEventListener(
                            "click",
                            function () {

                                window.location.href =

                                    "product.html?id=" +

                                    encodeURIComponent(
                                        product.id
                                    )

                                    +

                                    "&store=" +

                                    encodeURIComponent(
                                        storeUid
                                    );

                            }
                        );


                    /* ================================
                       إضافة للسلة
                    ================================= */

                    const addButton =
                        card.querySelector(
                            ".add-btn"
                        );


                    if (
                        !outOfStock
                    ) {

                        addButton.addEventListener(
                            "click",
                            function () {

                                addToCart(
                                    product
                                );

                            }
                        );

                    }


                    productsContainer.appendChild(
                        card
                    );

                }
            );

        }


        /* ================================
           إضافة المنتج للسلة
        ================================= */

        function addToCart(product) {

            let cart =

                JSON.parse(
                    localStorage.getItem(
                        "cart"
                    )
                )

                ||

                [];


            const otherStoreItems =

                cart.filter(
                    item =>

                        item.storeUid

                        &&

                        item.storeUid !==
                        storeUid

                );


            if (
                otherStoreItems.length
            ) {

                const confirmChange =
                    confirm(

                        "السلة تحتوي منتجات من متجر آخر.\n\n" +

                        "هل تريد إفراغ السلة والشراء من هذا المتجر؟"

                    );


                if (
                    !confirmChange
                ) {

                    return;

                }


                cart = [];

            }


            const existing =

                cart.find(
                    item =>

                        item.id ===
                        product.id

                        &&

                        item.storeUid ===
                        storeUid

                );


            if (
                existing
            ) {

                existing.quantity +=
                    1;

            }

            else {

                cart.push({

                    id:
                        product.id,

                    name:
                        product.name,

                    price:
                        Number(
                            product.price ||
                            0
                        ),

                    image:

                        product.image

                        ||

                        (

                            Array.isArray(
                                product.images
                            )

                            &&

                            product.images.length

                            ?

                            product.images[0]

                            :

                            ""

                        ),

                    quantity:
                        1,

                    color:
                        "بدون لون",

                    storeUid:
                        storeUid,

                    storeName:

                        currentStore?.storeName

                        ||

                        currentStore?.name

                        ||

                        "G-Glam"

                });

            }


            localStorage.setItem(

                "cart",

                JSON.stringify(
                    cart
                )

            );


            localStorage.setItem(
                "cartStoreId",
                storeUid
            );


            updateCartCount();


            alert(
                "تمت إضافة المنتج إلى السلة"
            );

        }


        /* ================================
           عدد السلة
        ================================= */

        function updateCartCount() {

            let cart =

                JSON.parse(
                    localStorage.getItem(
                        "cart"
                    )
                )

                ||

                [];


            const storeCart =

                cart.filter(
                    item =>

                        item.storeUid ===
                        storeUid

                );


            let total =
                0;


            storeCart.forEach(
                item => {

                    total +=

                        Number(
                            item.quantity ||
                            0
                        );

                }
            );


            cartCount.textContent =
                total;

        }


        /* ================================
           البحث
        ================================= */

        searchInput.addEventListener(
            "input",
            function () {

                const keyword =

                    this.value
                        .toLowerCase()
                        .trim();


                if (
                    !keyword
                ) {

                    renderProducts(
                        allProducts
                    );

                    return;

                }


                const filtered =

                    allProducts.filter(
                        product => {

                            const name =

                                String(
                                    product.name ||
                                    ""
                                )
                                .toLowerCase();


                            const description =

                                String(
                                    product.description ||
                                    ""
                                )
                                .toLowerCase();


                            return (

                                name.includes(
                                    keyword
                                )

                                ||

                                description.includes(
                                    keyword
                                )

                            );

                        }
                    );


                renderProducts(
                    filtered
                );

            }
        );


        /* ================================
           زر السلة
        ================================= */

        document
            .getElementById(
                "cartButton"
            )
            .addEventListener(
                "click",
                function () {

                    window.location.href =

                        "cart.html?store=" +

                        encodeURIComponent(
                            storeUid
                        );

                }
            );


        /* ================================
           القائمة الجانبية
        ================================= */

        const sidebar =
            document.getElementById(
                "sidebar"
            );


        const overlay =
            document.getElementById(
                "overlay"
            );


        const menuBtn =
            document.getElementById(
                "menuBtn"
            );


        menuBtn.addEventListener(
            "click",
            function () {

                sidebar.classList.add(
                    "active"
                );


                overlay.classList.add(
                    "active"
                );

            }
        );


        overlay.addEventListener(
            "click",
            function () {

                sidebar.classList.remove(
                    "active"
                );


                overlay.classList.remove(
                    "active"
                );

            }
        );


        /* ================================
           خطأ المتجر
        ================================= */

        function showStoreError(message) {

            productsContainer.innerHTML = `

                <div
                    class="empty"
                >

                    <div
                        style="
                            margin-bottom:15px;
                        "
                    >

                        ${escapeHtml(
                            message
                        )}

                    </div>


                    <p
                        style="
                            margin-top:10px;
                            color:#777;
                        "
                    >

                        تحقق من رابط المتجر.

                    </p>

                </div>

            `;

        }


        /* ================================
           بدء الصفحة
        ================================= */

        updateCartCount();


        const storeLoaded =
            await loadStore();


        if (
            storeLoaded
        ) {

            await loadProducts();

        }

    </script>


    <!-- ================================
         SERVICE WORKER
    ================================= -->

    <script>

        if (
            "serviceWorker" in navigator
        ) {

            window.addEventListener(
                "load",
                function () {

                    navigator.serviceWorker

                        .register(
                            "service-worker.js"
                        )

                        .then(
                            function () {

                                console.log(
                                    "G-Glam PWA جاهز"
                                );

                            }
                        )

                        .catch(
                            function (error) {

                                console.log(
                                    "خطأ في PWA:",
                                    error
                                );

                            }
                        );

                }
            );

        }

    </script>


</body>
