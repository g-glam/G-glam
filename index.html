<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-Glam</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f8f8f8;
margin:0;
padding:0;
}

header{
background:#000;
color:white;
text-align:center;
padding:15px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
padding:15px;
}

.card{
background:white;
padding:10px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
text-align:center;
}

.card img{
width:100%;
border-radius:10px;
}

button{
background:#ff4fc3;
color:white;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
width:100%;
}

.cart-btn{
display:block;
margin:15px;
text-align:center;
background:black;
color:white;
padding:12px;
text-decoration:none;
border-radius:8px;
}
</style>
</head>

<body>

<header>
<h1>G-Glam</h1>
</header>

<a class="cart-btn" href="cart.html">🛒 عرض السلة</a>

<div class="products">

<div class="card">
<img src="https://via.placeholder.com/300x300">
<h3>Concealer</h3>
<p>150 DA</p>
<button onclick="addToCart('Concealer',150)">
أضف إلى السلة
</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/300x300">
<h3>Lip Gloss</h3>
<p>250 DA</p>
<button onclick="addToCart('Lip Gloss',250)">
أضف إلى السلة
</button>
</div>

</div>

<script>
function addToCart(name,price){

let cart=
JSON.parse(localStorage.getItem('cart'))||[];

cart.push({
name:name,
price:price
});

localStorage.setItem(
'cart',
JSON.stringify(cart)
);

alert('تمت إضافة المنتج إلى السلة');
}
</script>

</body>
</html>
