<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#08111F"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="apple-touch-icon"
        href="icons/icon-192.png"
    >

    <title>G-Glam | المتجر</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =====================================================
           ROOT
        ===================================================== */

        :root {

            --bg: #08111F;

            --header: #091321;

            --card: #111E2E;

            --card-light: #172536;

            --text: #FFFFFF;

            --muted: #9AA9BB;

            --border: #223449;

            --accent: #FF7900;

            --accent-dark: #E96800;

            --input: #1B293A;

            --danger: #EF4444;

            --shadow:
                0 8px 25px rgba(0, 0, 0, .28);

        }


        /* =====================================================
           RESET
        ===================================================== */

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

            font-family:
                "Tajawal",
                Arial,
                sans-serif;

        }


        html {

            scroll-behavior: smooth;

        }


        body {

            min-height: 100vh;

            background: var(--bg);

            color: var(--text);

            padding-bottom: 95px;

        }


        button,
        input {

            font-family:
                "Tajawal",
                Arial,
                sans-serif;

        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {

            height: 70px;

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 24px;

            background:
                var(--header);

            border-bottom:
                1px solid #17283B;

            position: sticky;

            top: 0;

            z-index: 1000;

        }


        .logo {

            position: absolute;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .logo img {

            width: 145px;

            max-height: 52px;

            object-fit: contain;

            display: block;

        }


        .menu-btn,
        .cart-icon {

            width: 42px;

            height: 42px;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            position: relative;

            color: #FFFFFF;

            border-radius: 10px;

        }


        .menu-btn:hover,
        .cart-icon:hover {

            background:
                rgba(255, 255, 255, .06);

        }


        .menu-btn svg,
        .cart-icon svg {

            width: 29px;

            height: 29px;

        }


        .cart-count {

            position: absolute;

            top: -2px;

            right: -3px;

            width: 21px;

            height: 21px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: var(--accent);

            color: #FFFFFF;

            font-size: 11px;

            font-weight: 800;

            border: 2px solid var(--header);

        }


        /* =====================================================
           STORE HERO
        ===================================================== */

        .store-section {

            width: 100%;

            position: relative;

        }


        .store-cover {

            width: 100%;

            height: 285px;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #18283B,
                    #0B1727
                );

            display: none;

        }


        .store-cover img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            object-position: center;

            display: block;

        }


        .store-info {

            text-align: center;

            padding:
                0 20px 32px;

            position: relative;

        }


        .store-banner-image {

            width: 145px;

            height: 145px;

            margin:
                -72px auto 18px;

            position: relative;

            z-index: 5;

        }


        .store-banner-image img {

            width: 145px;

            height: 145px;

            border-radius: 50%;

            object-fit: cover;

            display: block;

            background: var(--card);

            border:
                5px solid var(--bg);

            box-shadow:
                0 7px 22px
                rgba(0, 0, 0, .45);

        }


        .store-banner h1 {

            font-size: 34px;

            line-height: 1.3;

            font-weight: 800;

            color: #FFFFFF;

            margin-bottom: 4px;

        }


        .store-banner p {

            font-size: 16px;

            color: var(--muted);

            line-height: 1.8;

        }


        /* =====================================================
           SEARCH
        ===================================================== */

        .search-section {

            width: 100%;

            max-width: 1100px;

            margin:
                0 auto 20px;

            padding:
                0 25px;

        }


        .search-box {

            position: relative;

            width: 100%;

        }


        .search-box input {

            width: 100%;

            height: 52px;

            padding:
                0 22px 0 55px;

            border: none;

            outline: none;

            border-radius: 30px;

            background:
                var(--input);

            color: #FFFFFF;

            font-size: 15px;

            border:
                1px solid transparent;

            transition: .2s;

        }


        .search-box input::placeholder {

            color: #9AA9BB;

        }


        .search-box input:focus {

            border-color:
                rgba(255, 121, 0, .55);

            box-shadow:
                0 0 0 3px
                rgba(255, 121, 0, .08);

        }


        .search-icon {

            position: absolute;

            left: 18px;

            top: 50%;

            transform:
                translateY(-50%);

            width: 23px;

            height: 23px;

            color: #DDE5ED;

            pointer-events: none;

        }


        /* =====================================================
           PRODUCTS
        ===================================================== */

        .products {

            width: 100%;

            max-width: 1100px;

            margin: 0 auto;

            padding:
                0 25px;

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 14px;

        }


        /* =====================================================
           PRODUCT CARD
        ===================================================== */

        .card {

            min-width: 0;

            background:
                var(--card);

            border:
                1px solid var(--border);

            border-radius: 10px;

            overflow: hidden;

            box-shadow:
                0 5px 16px
                rgba(0, 0, 0, .18);

            transition:
                transform .2s ease,
                border-color .2s ease;

        }


        .card:hover {

            transform:
                translateY(-3px);

            border-color:
                rgba(255, 121, 0, .35);

        }


        .card img {

            width: 100%;

            aspect-ratio: 1 / 1;

            object-fit: cover;

            display: block;

            background: #182638;

        }


        .card-content {

            padding:
                11px 12px 13px;

        }


        .card h3 {

            color: #FFFFFF;

            font-size: 15px;

            font-weight: 700;

            line-height: 1.55;

            height: 47px;

            overflow: hidden;

            margin-bottom: 3px;

            text-align: center;

        }


        .price {

            color: var(--accent);

            font-size: 17px;

            font-weight: 800;

            text-align: center;

            margin-bottom: 9px;

        }


        /* =====================================================
           DETAILS BUTTON
        ===================================================== */

        .details-btn {

            width: 100%;

            height: 35px;

            border:
                1.5px solid var(--accent);

            border-radius: 7px;

            background: transparent;

            color: #FFFFFF;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            margin-bottom: 8px;

            transition: .2s;

        }


        .details-btn:hover {

            background:
                var(--accent);

            color: #FFFFFF;

        }


        /* =====================================================
           ADD TO CART
        ===================================================== */

        .add-btn {

            width: 100%;

            height: 35px;

            border: none;

            border-radius: 7px;

            background:
                var(--accent);

            color: #FFFFFF;

            font-size: 13px;

            font-weight: 800;

            cursor: pointer;

            transition: .2s;

        }


        .add-btn:hover {

            background:
                var(--accent-dark);

        }


        .add-btn:disabled {

            background: #465364;

            color: #AEB8C3;

            cursor: not-allowed;

        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {

            grid-column: 1 / -1;

            min-height: 250px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            color: var(--muted);

            text-align: center;

        }


        .loading svg {

            width: 36px;

            height: 36px;

            margin-bottom: 12px;

            animation:
                spin 1s linear infinite;

        }


        @keyframes spin {

            from {

                transform:
                    rotate(0deg);

            }

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* =====================================================
           EMPTY
        ===================================================== */

        .empty {

            grid-column: 1 / -1;

            text-align: center;

            padding: 55px 20px;

            color: var(--muted);

            background:
                var(--card);

            border:
                1px solid var(--border);

            border-radius: 15px;

        }


        .empty h2 {

            color: #FFFFFF;

            margin-top: 10px;

        }


        .empty-icon {

            width: 50px;

            height: 50px;

            color: var(--accent);

        }


        /* =====================================================
           FLOATING CART
        ===================================================== */

        .floating-cart {

            position: fixed;

            bottom: 18px;

            left: 50%;

            transform:
                translateX(-50%);

            width: calc(100% - 50px);

            max-width: 540px;

            height: 53px;

            background:
                var(--accent);

            color: #FFFFFF;

            text-decoration: none;

            border-radius: 28px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            font-size: 16px;

            font-weight: 800;

            box-shadow:
                0 8px 25px
                rgba(255, 121, 0, .25);

            z-index: 900;

            transition: .2s;

        }


        .floating-cart:hover {

            background:
                var(--accent-dark);

            transform:
                translateX(-50%)
                translateY(-2px);

        }


        .floating-cart svg {

            width: 22px;

            height: 22px;

        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {

            position: fixed;

            top: 0;

            left: -300px;

            width: 280px;

            height: 100vh;

            background:
                #0D1928;

            border-right:
                1px solid var(--border);

            box-shadow:
                5px 0 25px
                rgba(0, 0, 0, .35);

            z-index: 2000;

            transition:
                left .3s ease;

            padding-top: 80px;

        }


        .sidebar.active {

            left: 0;

        }


        .sidebar a {

            display: flex;

            align-items: center;

            gap: 13px;

            padding:
                17px 25px;

            color: #FFFFFF;

            text-decoration: none;

            border-bottom:
                1px solid #1C2C3E;

            font-size: 16px;

        }


        .sidebar a:hover {

            background:
                #152437;

            color:
                var(--accent);

        }


        .sidebar a svg {

            width: 22px;

            height: 22px;

            flex-shrink: 0;

        }


        .overlay {

            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, .55);

            display: none;

            z-index: 1900;

        }


        .overlay.active {

            display: block;

        }


        /* =====================================================
           DESKTOP LARGE
        ===================================================== */

        @media (min-width: 1200px) {

            .store-cover {

                height: 285px;

            }


            .products {

                max-width: 1100px;

            }


            .search-section {

                max-width: 1100px;

            }

        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 900px) {

            .products {

                grid-template-columns:
                    repeat(4, 1fr);

            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            header {

                height: 64px;

                padding:
                    0 16px;

            }


            .logo img {

                width: 120px;

                max-height: 45px;

            }


            .menu-btn,
            .cart-icon {

                width: 38px;

                height: 38px;

            }


            .menu-btn svg,
            .cart-icon svg {

                width: 26px;

                height: 26px;

            }


            .store-cover {

                height: 190px;

            }


            .store-banner-image {

                width: 112px;

                height: 112px;

                margin:
                    -56px auto 15px;

            }


            .store-banner-image img {

                width: 112px;

                height: 112px;

                border-width: 4px;

            }


            .store-info {

                padding:
                    0 15px 25px;

            }


            .store-banner h1 {

                font-size: 27px;

            }


            .store-banner p {

                font-size: 14px;

            }


            .search-section {

                padding:
                    0 15px;

                margin-bottom: 12px;

            }


            .search-box input {

                height: 48px;

                font-size: 14px;

            }


            .products {

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 10px;

                padding:
                    0 10px;

            }


            .card {

                border-radius: 10px;

            }


            .card-content {

                padding:
                    9px;

            }


            .card h3 {

                font-size: 13px;

                height: 42px;

            }


            .price {

                font-size: 15px;

            }


            .details-btn,
            .add-btn {

                height: 34px;

                font-size: 12px;

            }


            .floating-cart {

                width:
                    calc(100% - 30px);

                bottom: 12px;

            }

        }


        /* =====================================================
           SMALL MOBILE
        ===================================================== */

        @media (max-width: 380px) {

            .store-cover {

                height: 160px;

            }


            .store-banner h1 {

                font-size: 24px;

            }


            .card h3 {

                font-size: 12px;

            }


            .card-content {

                padding: 8px;

            }


            .details-btn,
            .add-btn {

                font-size: 11px;

            }

        }


        /* =====================================================
           SCROLLBAR
        ===================================================== */

        ::-webkit-scrollbar {

            width: 7px;

            height: 7px;

        }


        ::-webkit-scrollbar-track {

            background:
                #08111F;

        }


        ::-webkit-scrollbar-thumb {

            background:
                #263B51;

            border-radius: 10px;

        }


        ::-webkit-scrollbar-thumb:hover {

            background:
                var(--accent);

        }

    </style>

</head>

                "g-glam.firebasestorage.app",

            messagingSenderId:
                "997228419719",

            appId:
                "1:997228419719:web:f9d88de7ea2c6f457e3622",

            measurementId:
                "G-WX1K1F83F6"

        };


        const app =
            initializeApp(
                firebaseConfig
            );


        const db =
            getFirestore(
                app
            );


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const productsContainer =
            document.getElementById(
                "productsContainer"
            );


        const searchInput =
            document.getElementById(
                "searchInput"
            );


        const cartCount =
            document.getElementById(
                "cartCount"
            );


        const storeNameElement =
            document.getElementById(
                "storeName"
            );


        const storeDescriptionElement =
            document.getElementById(
                "storeDescription"
            );


        const storeImage =
            document.getElementById(
                "storeImage"
            );


        const storeCover =
            document.getElementById(
                "storeCover"
            );


        const storeCoverImage =
            document.getElementById(
                "storeCoverImage"
            );


        /* =====================================================
           STORE ID
        ===================================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        let storeIdentifier =
            params.get(
                "store"
            );


        if (!storeIdentifier) {

            const pathParts =
                window.location.pathname
                    .split("/")
                    .filter(
                        p =>
                            p &&
                            p !== "index.html"
                    );


            if (
                pathParts.length > 0
            ) {

                storeIdentifier =
                    pathParts[
                        pathParts.length - 1
                    ];

            }

        }


        if (!storeIdentifier) {

            storeIdentifier =
                localStorage.getItem(
                    "storeId"
                );

        }


        let storeUid =
            storeIdentifier;


        let allProducts = [];


        let currentStore = null;


        /* =====================================================
           ESCAPE HTML
        ===================================================== */

        function escapeHtml(value) {

            return String(
                value ?? ""
            )

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        function updateNavigationLinks() {

            const encodedStore =
                encodeURIComponent(
                    storeUid
                );


            document.getElementById(
                "homeLink"
            ).href =
                "index.html?store=" +
                encodedStore;


            document.getElementById(
                "cartLink"
            ).href =
                "cart.html?store=" +
                encodedStore;


            document.getElementById(
                "floatingCart"
            ).href =
                "cart.html?store=" +
                encodedStore;

        }


        /* =====================================================
           LOAD STORE
        ===================================================== */

        async function loadStore() {

            try {


                const storeRef =
                    doc(
                        db,
                        "stores",
                        storeIdentifier
                    );


                const storeSnap =
                    await getDoc(
                        storeRef
                    );


                if (
                    !storeSnap.exists()
                ) {

                    showStoreError(
                        "المتجر غير موجود."
                    );

                    return false;

                }


                currentStore =
                    storeSnap.data();


                storeUid =
                    storeSnap.id;


                localStorage.setItem(
                    "storeId",
                    storeUid
                );


                /* =================================================
                   STATUS
                ================================================= */

                const status =
                    String(
                        currentStore.status
                        ||
                        "approved"
                    )
                    .toLowerCase()
                    .trim();


                if (

                    status !== "approved"

                    &&

                    status !== "active"

                ) {

                    showStoreError(
                        "هذا المتجر غير متاح حاليًا."
                    );

                    return false;

                }


                /* =================================================
                   STORE NAME
                ================================================= */

                const name =
                    currentStore.storeName
                    ||
                    currentStore.name
                    ||
                    "G-Glam";


                storeNameElement.textContent =
                    name;


                document.title =
                    name +
                    " | المتجر";


                /* =================================================
                   DESCRIPTION
                ================================================= */

                storeDescriptionElement.textContent =

                    currentStore.description
                    ||
                    "Bienvenue dans notre boutique";


                /* =================================================
                   STORE IMAGE
                ================================================= */

                const image =

                    currentStore.storeImage
                    ||
                    currentStore.image
                    ||
                    currentStore.logo
                    ||
                    currentStore.photoURL
                    ||
                    "";


                if (image) {

                    storeImage.src =
                        image;

                    storeImage.style.display =
                        "block";

                }

                else {

                    storeImage.style.display =
                        "none";

                }


                /* =================================================
                   STORE COVER
                ================================================= */

                const cover =

                    currentStore.storeCoverImage
                    ||
                    currentStore.storeCover
                    ||
                    currentStore.coverImage
                    ||
                    currentStore.cover
                    ||
                    currentStore.banner
                    ||
                    currentStore.storeBanner
                    ||
                    "";


                if (cover) {

                    storeCoverImage.src =
                        cover;

                    storeCover.style.display =
                        "block";

                }

                else {

                    storeCover.style.display =
                        "none";

                }


                /* =================================================
                   CONTACT
                ================================================= */

                const contactLink =
                    document.getElementById(
                        "contactLink"
                    );


                if (
                    currentStore.facebook
                ) {

                    contactLink.href =
                        currentStore.facebook;

                }

                else if (
                    currentStore.phone
                ) {

                    contactLink.href =
                        "tel:" +
                        currentStore.phone;

                }

                else {

                    contactLink.href =
                        "#";

                }


                updateNavigationLinks();


                return true;

            }


            catch (error) {

                console.error(
                    "STORE LOAD ERROR:",
                    error
                );


                showStoreError(
                    "حدث خطأ أثناء تحميل المتجر."
                );


                return false;

            }

        }


        /* =====================================================
           LOAD PRODUCTS
        ===================================================== */

        async function loadProducts() {

            try {


                productsContainer.innerHTML = `

                    <div class="loading">

                        <svg>

                            <use href="#icon-loader"></use>

                        </svg>

                        <div>
                            جاري تحميل المنتجات...
                        </div>

                    </div>

                `;


                let snapshot;


                try {

                    const productsQuery =
                        query(

                            collection(
                                db,
                                "products"
                            ),

                            where(
                                "ownerUid",
                                "==",
                                storeUid
                            )

                        );


                    snapshot =
                        await getDocs(
                            productsQuery
                        );

                }


                catch (error) {

                    console.log(
                        "ownerUid query failed",
                        error
                    );


                    const oldQuery =
                        query(

                            collection(
                                db,
                                "products"
                            ),

                            where(
                                "storeId",
                                "==",
                                storeUid
                            )

                        );


                    snapshot =
                        await getDocs(
                            oldQuery
                        );

                }


                allProducts = [];


                snapshot.forEach(
                    productDoc => {

                        allProducts.push({

                            id:
                                productDoc.id,

                            ...productDoc.data()

                        });

                    }
                );


                renderProducts(
                    allProducts
                );

            }


            catch (error) {

                console.error(
                    "PRODUCTS ERROR:",
                    error
                );


                productsContainer.innerHTML = `

                    <div class="empty">

                        <div>
                            حدث خطأ أثناء تحميل المنتجات.
                        </div>

                    </div>

                `;

            }

        }


        /* =====================================================
           RENDER PRODUCTS
        ===================================================== */

        function renderProducts(products) {

            productsContainer.innerHTML =
                "";


            if (
                !products.length
            ) {

                productsContainer.innerHTML = `

                    <div class="empty">

                        <svg class="empty-icon">

                            <use href="#icon-bag"></use>

                        </svg>

                        <h2>
                            لا توجد منتجات
                        </h2>

                        <p
                            style="
                                margin-top:8px;
                            "
                        >
                            لا توجد منتجات في هذا المتجر حاليًا.
                        </p>

                    </div>

                `;

                return;

            }


            products.forEach(
                product => {


                    const image =

                        product.image

                        ||

                        (

                            Array.isArray(
                                product.images
                            )

                            &&

                            product.images.length

                            ?

                            product.images[0]

                            :

                            ""

                        );


                    const name =
                        product.name
                        ||
                        "منتج";


                    const price =
                        Number(
                            product.price ||
                            0
                        );


                    /*
                       المخزون لا يظهر للمستخدم.
                       نستخدمه فقط لتعطيل الزر إذا كان صفرًا.
                    */

                    const stock =
                        Number(
                            product.stock ??
                            0
                        );


                    const outOfStock =
                        stock <= 0;


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "card";


                    card.innerHTML = `

                        <img

                            src="${escapeHtml(
                                image
                            )}"

                            alt="${escapeHtml(
                                name
                            )}"

                            onerror="
                                this.style.display='none';
                            "

                        >


                        <div class="card-content">


                            <h3>

                                ${escapeHtml(
                                    name
                                )}

                            </h3>


                            <div class="price">

                                ${price} DA

                            </div>


                            <button
                                class="details-btn"
                                type="button"
                            >

                                عرض المنتج

                            </button>


                            <button
                                class="add-btn"
                                type="button"

                                ${
                                    outOfStock
                                        ? "disabled"
                                        : ""
                                }
                            >

                                ${
                                    outOfStock
                                        ? "غير متوفر"
                                        : "أضف إلى السلة"
                                }

                            </button>


                        </div>

                    `;


                    /* =================================================
                       DETAILS
                    ================================================= */

                    card
                        .querySelector(
                            ".details-btn"
                        )
                        .addEventListener(
                            "click",
                            function () {

                                window.location.href =

                                    "product.html?id=" +

                                    encodeURIComponent(
                                        product.id
                                    )

                                    +

                                    "&store=" +

                                    encodeURIComponent(
                                        storeUid
                                    );

                            }
                        );


                    /* =================================================
                       ADD TO CART
                    ================================================= */

                    const addButton =
                        card.querySelector(
                            ".add-btn"
                        );


                    if (
                        !outOfStock
                    ) {

                        addButton.addEventListener(
                            "click",
                            function () {

                                addToCart(
                                    product
                                );

                            }
                        );

                    }


                    productsContainer.appendChild(
                        card
                    );

                }
            );

        }


        /* =====================================================
           ADD TO CART
        ===================================================== */

        function addToCart(product) {

            let cart =

                JSON.parse(
                    localStorage.getItem(
                        "cart"
                    )
                )

                ||

                [];


            const otherStoreItems =

                cart.filter(
                    item =>

                        item.storeUid

                        &&

                        item.storeUid !==
                        storeUid

                );


            if (
                otherStoreItems.length
            ) {

                const confirmChange =
                    confirm(

                        "السلة تحتوي منتجات من متجر آخر.\n\n" +

                        "هل تريد إفراغ السلة والشراء من هذا المتجر؟"

                    );


                if (
                    !confirmChange
                ) {

                    return;

                }


                cart = [];

            }


            const existing =

                cart.find(
                    item =>

                        item.id ===
                        product.id

                        &&

                        item.storeUid ===
                        storeUid

                );


            if (
                existing
            ) {

                existing.quantity +=
                    1;

            }


            else {

                cart.push({

                    id:
                        product.id,

                    name:
                        product.name,

                    price:
                        Number(
                            product.price ||
                            0
                        ),

                    image:

                        product.image

                        ||

                        (

                            Array.isArray(
                                product.images
                            )

                            &&

                            product.images.length

                            ?

                            product.images[0]

                            :

                            ""

                        ),

                    quantity:
                        1,

                    color:
                        "بدون لون",

                    storeUid:
                        storeUid,

                    storeName:

                        currentStore?.storeName

                        ||

                        currentStore?.name

                        ||

                        "G-Glam"

                });

            }


            localStorage.setItem(

                "cart",

                JSON.stringify(
                    cart
                )

            );


            localStorage.setItem(
                "cartStoreId",
                storeUid
            );


            updateCartCount();


            alert(
                "تمت إضافة المنتج إلى السلة"
            );

        }


        /* =====================================================
           CART COUNT
        ===================================================== */

        function updateCartCount() {

            let cart =

                JSON.parse(
                    localStorage.getItem(
                        "cart"
                    )
                )

                ||

                [];


            const storeCart =

                cart.filter(
                    item =>

                        item.storeUid ===
                        storeUid

                );


            let total =
                0;


            storeCart.forEach(
                item => {

                    total +=

                        Number(
                            item.quantity ||
                            0
                        );

                }
            );


            cartCount.textContent =
                total;

        }


        /* =====================================================
           SEARCH
        ===================================================== */

        searchInput.addEventListener(
            "input",
            function () {


                const keyword =

                    this.value
                        .toLowerCase()
                        .trim();


                if (
                    !keyword
                ) {

                    renderProducts(
                        allProducts
                    );

                    return;

                }


                const filtered =

                    allProducts.filter(
                        product => {


                            const name =

                                String(
                                    product.name ||
                                    ""
                                )
                                .toLowerCase();


                            const description =

                                String(
                                    product.description ||
                                    ""
                                )
                                .toLowerCase();


                            return (

                                name.includes(
                                    keyword
                                )

                                ||

                                description.includes(
                                    keyword
                                )

                            );

                        }
                    );


                renderProducts(
                    filtered
                );

            }
        );


        /* =====================================================
           CART BUTTON
        ===================================================== */

        document
            .getElementById(
                "cartButton"
            )
            .addEventListener(
                "click",
                function () {

                    window.location.href =

                        "cart.html?store=" +

                        encodeURIComponent(
                            storeUid
                        );

                }
            );


        /* =====================================================
           SIDEBAR
        ===================================================== */

        const sidebar =
            document.getElementById(
                "sidebar"
            );


        const overlay =
            document.getElementById(
                "overlay"
            );


        const menuBtn =
            document.getElementById(
                "menuBtn"
            );


        menuBtn.addEventListener(
            "click",
            function () {

                sidebar.classList.add(
                    "active"
                );


                overlay.classList.add(
                    "active"
                );

            }
        );


        overlay.addEventListener(
            "click",
            function () {

                sidebar.classList.remove(
                    "active"
                );


                overlay.classList.remove(
                    "active"
                );

            }
        );


        /* =====================================================
           STORE ERROR
        ===================================================== */

        function showStoreError(message) {

            productsContainer.innerHTML = `

                <div class="empty">

                    <svg class="empty-icon">

                        <use href="#icon-store"></use>

                    </svg>


                    <h2>

                        ${escapeHtml(
                            message
                        )}

                    </h2>


                    <p
                        style="
                            margin-top:10px;
                        "
                    >

                        تحقق من رابط المتجر.

                    </p>

                </div>

            `;

        }


        /* =====================================================
           START
        ===================================================== */

        updateCartCount();


        const storeLoaded =
            await loadStore();


        if (
            storeLoaded
        ) {

            await loadProducts();

        }

    </script>


    <!-- =====================================================
         SERVICE WORKER
    ===================================================== -->

    <script>

        if (
            "serviceWorker" in navigator
        ) {

            window.addEventListener(
                "load",
                function () {

                    navigator.serviceWorker

                        .register(
                            "service-worker.js"
                        )

                        .then(
                            function () {

                                console.log(
                                    "G-Glam PWA جاهز"
                                );

                            }
                        )

                        .catch(
                            function (error) {

                                console.log(
                                    "خطأ في PWA:",
                                    error
                                );

                            }
                        );

                }
            );

        }

    </script>


</body>

</html>
