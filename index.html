<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G-Glam</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f8f8f8;
margin:0;
padding:0;
}

header{
background:#000;
color:white;
text-align:center;
padding:15px;
}

.cart-btn{
display:block;
margin:15px;
text-align:center;
background:black;
color:white;
padding:12px;
text-decoration:none;
border-radius:8px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
padding:15px;
}

.card{
background:white;
padding:10px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,.1);
text-align:center;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:10px;
}

.card h3{
margin:10px 0;
font-size:16px;
}

.card p{
font-weight:bold;
}

button{
background:#ff4fc3;
color:white;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
width:100%;
margin-top:8px;
}

.details-btn{
background:black;
}

</style>

</head>

<body>

<header>
<h1>G-Glam</h1>
</header>

<a class="cart-btn" href="cart.html">
🛒 عرض السلة
</a>

<div
class="products"
id="productsContainer">
</div>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const firebaseConfig = {

apiKey: "AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain: "g-glam.firebaseapp.com",

projectId: "g-glam",

storageBucket: "g-glam.firebasestorage.app",

messagingSenderId: "997228419719",

appId: "1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId: "G-WX1K1F83F6"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const productsContainer =
document.getElementById(
"productsContainer"
);
async function loadProducts(){

productsContainer.innerHTML = "";

const querySnapshot =
await getDocs(
collection(db,"products")
);

querySnapshot.forEach((doc)=>{

const product = doc.data();

productsContainer.innerHTML += `

<div class="card">

<img
src="${product.image}"
alt="${product.name}">

<h3>
${product.name}
</h3>

<p>
${product.price} DA
</p>

<button
class="details-btn"
onclick="viewProduct('${doc.id}')">
عرض المنتج
</button>

<button
onclick="addToCart(
'${product.name}',
${product.price}
)">
أضف إلى السلة
</button>

</div>

`;

});

}

loadProducts();
    function addToCart(name,price){

let cart =
JSON.parse(
localStorage.getItem("cart")
) || [];

cart.push({
name:name,
price:price,
quantity:1
});

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

alert("تمت إضافة المنتج إلى السلة");

}


function viewProduct(productId){

window.location.href =
"product.html?id=" + productId;

}

</script>

</body>

</html>
