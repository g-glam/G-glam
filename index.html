<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#F4F4F4">

<title>المتجر</title>

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
rel="stylesheet">


<style>

:root{

--bg:#f4f4f4;
--card:#fff;
--orange:#f47b20;
--orange-dark:#df6810;
--orange-light:#fff0e5;
--text:#222;
--muted:#777;
--border:#e8e8e8;
--danger:#d9534f;

--shadow:
0 4px 18px rgba(0,0,0,.06);

}

*{

margin:0;
padding:0;
box-sizing:border-box;

font-family:"Tajawal",sans-serif;

}

body{

background:var(--bg);
color:var(--text);
padding-bottom:95px;

}


/* ==============================
HEADER
============================== */

header{

height:72px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 18px;

background:var(--bg);

position:sticky;

top:0;

z-index:100;

border-bottom:1px solid rgba(0,0,0,.03);

}

.menu-btn,
.cart-btn{

width:42px;
height:42px;

display:flex;

align-items:center;
justify-content:center;

border:none;

background:#fff;

border-radius:12px;

font-size:22px;

cursor:pointer;

box-shadow:var(--shadow);

position:relative;

}

.store-title{

font-size:23px;

font-weight:800;

text-align:center;

max-width:65%;

overflow:hidden;

white-space:nowrap;

text-overflow:ellipsis;

}

.cart-count{

position:absolute;

top:-5px;

left:-5px;

width:20px;
height:20px;

border-radius:50%;

background:var(--orange);

color:#fff;

font-size:11px;

font-weight:bold;

display:flex;

align-items:center;
justify-content:center;

}


/* ==============================
STORE INFO
============================== */

.store-info{

text-align:center;

padding:18px 15px 12px;

}

.store-info h1{

font-size:26px;

font-weight:800;

margin-bottom:5px;

}

.store-info p{

font-size:14px;

color:var(--muted);

line-height:1.7;

}


/* ==============================
SEARCH
============================== */

.search{

padding:5px 15px 20px;

}

.search input{

width:100%;

height:48px;

border:1px solid var(--border);

border-radius:25px;

background:#fff;

padding:0 20px;

font-size:15px;

outline:none;

box-shadow:var(--shadow);

}

.search input:focus{

border-color:var(--orange);

box-shadow:
0 0 0 3px rgba(244,123,32,.10);

}


/* ==============================
PRODUCTS
============================== */

.products{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:14px;

padding:0 15px;

}

.card{

background:#fff;

border-radius:17px;

overflow:hidden;

border:1px solid rgba(0,0,0,.03);

box-shadow:var(--shadow);

}

.product-image{

width:100%;

aspect-ratio:1/1;

object-fit:cover;

display:block;

background:#eee;

}

.product-content{

padding:12px;

}

.product-name{

font-size:15px;

font-weight:700;

line-height:1.5;

height:45px;

overflow:hidden;

}

.product-description{

font-size:12px;

color:#888;

line-height:1.5;

height:36px;

overflow:hidden;

margin-top:4px;

}

.price{

font-size:18px;

font-weight:800;

color:var(--orange-dark);

margin:9px 0;

}

.stock{

font-size:12px;

color:#777;

margin-bottom:8px;

}

.stock.out{

color:var(--danger);

font-weight:bold;

}

.add-btn{

width:100%;

height:40px;

border:none;

border-radius:10px;

background:var(--orange);

color:#fff;

font-size:13px;

font-weight:bold;

cursor:pointer;

}

.add-btn:hover{

background:var(--orange-dark);

}

.add-btn:disabled{

background:#bbb;

cursor:not-allowed;

}


/* ==============================
LOADING / EMPTY
============================== */

.loading,
.empty{

grid-column:1/-1;

text-align:center;

padding:60px 20px;

color:#777;

}

.empty{

background:#fff;

border-radius:16px;

}


/* ==============================
SIDEBAR
============================== */

.overlay{

position:fixed;

inset:0;

background:rgba(0,0,0,.4);

display:none;

z-index:998;

}

.overlay.active{

display:block;

}

.sidebar{

position:fixed;

right:-290px;

top:0;

width:290px;

height:100vh;

background:#fff;

z-index:999;

transition:.3s;

box-shadow:-5px 0 20px rgba(0,0,0,.12);

}

.sidebar.active{

right:0;

}

.sidebar-header{

padding:25px;

border-bottom:1px solid var(--border);

font-size:22px;

font-weight:800;

}

.sidebar-link{

display:block;

padding:17px 22px;

text-decoration:none;

color:#333;

border-bottom:1px solid #eee;

font-size:16px;

}

.sidebar-link:hover{

background:var(--orange-light);

color:var(--orange-dark);

}


/* ==============================
FLOATING CART
============================== */

.floating-cart{

position:fixed;

bottom:15px;

left:50%;

transform:translateX(-50%);

width:90%;

max-width:500px;

height:52px;

display:flex;

align-items:center;

justify-content:center;

background:var(--orange);

color:white;

text-decoration:none;

border-radius:28px;

font-weight:800;

box-shadow:
0 8px 25px rgba(244,123,32,.25);

z-index:500;

}


/* ==============================
DESKTOP
============================== */

@media(min-width:768px){

.products{

grid-template-columns:repeat(4,1fr);

}

}

@media(min-width:1200px){

.products{

grid-template-columns:repeat(5,1fr);

}

}


/* ==============================
MOBILE
============================== */

@media(max-width:400px){

.products{

padding:0 10px;

gap:10px;

}

.product-content{

padding:10px;

}

.product-name{

font-size:14px;

}

.price{

font-size:16px;

}

}

</style>

</head>


<body>


<!-- SIDEBAR -->

<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">

<div class="sidebar-header" id="sideStoreName">

المتجر

</div>

<a class="sidebar-link" id="homeLink">
🏠 الرئيسية
</a>

<a class="sidebar-link" id="cartLink">
🛒 السلة
</a>

<a
class="sidebar-link"
id="contactLink"
target="_blank">

📞 اتصل بنا

</a>

</aside>


<!-- HEADER -->

<header>

<button class="menu-btn" id="menuBtn">
☰
</button>

<div class="store-title" id="headerStoreName">
المتجر
</div>

<button class="cart-btn" id="cartBtn">

🛒

<span class="cart-count" id="cartCount">
0
</span>

</button>

</header>


<!-- STORE INFORMATION -->

<section class="store-info">

<h1 id="storeName">
جاري تحميل المتجر...
</h1>

<p id="storeDescription">
</p>

</section>


<!-- SEARCH -->

<div class="search">

<input
type="search"
id="searchInput"
placeholder="ابحث عن منتج...">

</div>


<!-- PRODUCTS -->

<section
class="products"
id="products">

<div class="loading">

⏳ جاري تحميل المنتجات...

</div>

</section>


<!-- FLOATING CART -->

<a
class="floating-cart"
id="floatingCart">

🛒 عرض السلة

</a>


<script type="module">


/* =====================================================
FIREBASE
===================================================== */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {
getFirestore,
doc,
getDoc,
collection,
getDocs,
query,
where
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* =====================================================
ELEMENTS
===================================================== */

const productsElement=
document.getElementById("products");

const storeNameElement=
document.getElementById("storeName");

const headerStoreName=
document.getElementById("headerStoreName");

const sideStoreName=
document.getElementById("sideStoreName");

const storeDescription=
document.getElementById("storeDescription");

const searchInput=
document.getElementById("searchInput");

const cartCount=
document.getElementById("cartCount");


/* =====================================================
GET STORE ID
===================================================== */

const params=
new URLSearchParams(
window.location.search
);


/*
المتجر:

index.html?store=OWNER_UID
*/

let storeUid=
params.get("store");


/*
إذا لم يوجد في الرابط
نحاول من localStorage
*/

if(!storeUid){

storeUid=
localStorage.getItem("storeId");

}


/* =====================================================
CHECK STORE ID
===================================================== */

if(!storeUid){

productsElement.innerHTML=`

<div class="empty">

<div style="font-size:50px">
🏪
</div>

<h2>
لم يتم تحديد المتجر
</h2>

<p style="margin-top:10px">
رابط المتجر غير صحيح.
</p>

</div>

`;

throw new Error(
"STORE UID NOT FOUND"
);

}


/* =====================================================
CURRENT STORE
===================================================== */

let currentStore=null;

let allProducts=[];


/* =====================================================
HELPERS
===================================================== */

function valueFrom(
object,
keys,
fallback=""
){

for(const key of keys){

if(
object &&
object[key] !== undefined &&
object[key] !== null &&
String(object[key]).trim() !== ""
){

return object[key];

}

}

return fallback;

}


function escapeHtml(value){

return String(value ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =====================================================
LOAD STORE
===================================================== */

async function loadStore(){

try{

/*
أولاً:

stores/{storeUid}
*/

let snapshot=
await getDoc(
doc(
db,
"stores",
storeUid
)
);


/*
إذا لم يوجد المتجر مباشرة،
نبحث باستخدام ownerUid.
*/

if(!snapshot.exists()){

const q=
query(
collection(db,"stores"),
where(
"ownerUid",
"==",
storeUid
)
);

const result=
await getDocs(q);

if(!result.empty){

snapshot=
result.docs[0];

}

}


/*
لم يتم العثور
*/

if(!snapshot.exists()){

showError(
"لم يتم العثور على بيانات هذا المتجر."
);

return false;

}


currentStore=
snapshot.data();


/* =====================================================
STATUS
===================================================== */

const status=
String(
valueFrom(
currentStore,
["status"],
"approved"
)
).toLowerCase();


if(
status!=="approved" &&
status!=="active"
){

showError(
"هذا المتجر غير متاح حاليًا."
);

return false;

}


/* =====================================================
STORE NAME

يدعم أكثر من اسم للحقل
===================================================== */

const name=
valueFrom(
currentStore,
[
"storeName",
"name",
"shopName",
"storeTitle",
"title"
],
"G-Glam"
);


/* =====================================================
DESCRIPTION
===================================================== */

const description=
valueFrom(
currentStore,
[
"description",
"storeDescription",
"shopDescription",
"bio"
],
""
);


/* =====================================================
DISPLAY
===================================================== */

storeNameElement.textContent=
name;

headerStoreName.textContent=
name;

sideStoreName.textContent=
name;

storeDescription.textContent=
description;

document.title=
name;


/* =====================================================
CONTACT
===================================================== */

const contactLink=
document.getElementById(
"contactLink"
);


const facebook=
valueFrom(
currentStore,
[
"facebook",
"facebookUrl",
"facebookLink"
],
""
);


const phone=
valueFrom(
currentStore,
[
"phone",
"phoneNumber",
"telephone"
],
""
);


if(facebook){

contactLink.href=
facebook;

}

else if(phone){

contactLink.href=
"tel:"+phone;

}

else{

contactLink.href="#";

}


return true;

}

catch(error){

console.error(
"STORE ERROR:",
error
);

showError(
"حدث خطأ أثناء تحميل معلومات المتجر."
);

return false;

}

}


/* =====================================================
LOAD PRODUCTS
===================================================== */

async function loadProducts(){

try{

productsElement.innerHTML=`

<div class="loading">
⏳ جاري تحميل المنتجات...
</div>

`;


/*
الطريقة الأساسية:

products.ownerUid
*/

let q=
query(
collection(db,"products"),
where(
"ownerUid",
"==",
storeUid
)
);

let snapshot=
await getDocs(q);


/*
إذا لم توجد منتجات،
ندعم storeId أيضًا.
*/

if(snapshot.empty){

q=
query(
collection(db,"products"),
where(
"storeId",
"==",
storeUid
)
);

snapshot=
await getDocs(q);

}


/*
نجمع المنتجات
*/

allProducts=[];

snapshot.forEach(
item=>{

allProducts.push({

id:item.id,

...item.data()

});

});


renderProducts(
allProducts
);

}

catch(error){

console.error(
"PRODUCTS ERROR:",
error
);

productsElement.innerHTML=`

<div class="empty">

❌ حدث خطأ أثناء تحميل المنتجات.

<br><br>

<span style="font-size:12px;color:#999">
${escapeHtml(error.message)}
</span>

</div>

`;

}

}


/* =====================================================
GET PRODUCT IMAGE
===================================================== */

function getProductImage(
product
){

if(product.image){

return product.image;

}

if(
Array.isArray(product.images) &&
product.images.length
){

return product.images[0];

}

if(product.imageUrl){

return product.imageUrl;

}

return "";

}


/* =====================================================
RENDER PRODUCTS
===================================================== */

function renderProducts(
products
){

productsElement.innerHTML="";


if(!products.length){

productsElement.innerHTML=`

<div class="empty">

<div style="font-size:45px">
🛍️
</div>

<h3 style="margin-top:10px">
لا توجد منتجات حاليًا
</h3>

</div>

`;

return;

}


products.forEach(
product=>{

const name=
valueFrom(
product,
[
"name",
"productName",
"title"
],
"منتج"
);


const description=
valueFrom(
product,
[
"description",
"productDescription"
],
""
);


const price=
Number(
valueFrom(
product,
[
"price",
"productPrice"
],
0
)
);


const stock=
Number(
valueFrom(
product,
[
"stock",
"quantity",
"availableStock"
],
0
)
);


const image=
getProductImage(product);


const card=
document.createElement("article");

card.className="card";


card.innerHTML=`

<img
class="product-image"
src="${escapeHtml(image)}"
alt="${escapeHtml(name)}"
onerror="this.src='';this.style.background='#eee';">


<div class="product-content">

<div class="product-name">

${escapeHtml(name)}

</div>


${
description
?
`
<div class="product-description">
${escapeHtml(description)}
</div>
`
:
""
}


<div class="price">

${price.toLocaleString("fr-DZ")}
DA

</div>


<div class="stock ${
stock<=0 ? "out" : ""
}">

${
stock<=0
?
"غير متوفر حاليًا"
:
"متوفر: "+stock
}

</div>


<button
class="add-btn"
${stock<=0 ? "disabled" : ""}>

${
stock<=0
?
"غير متوفر"
:
"أضف إلى السلة"
}

</button>

</div>

`;


/* =====================================================
ADD TO CART
===================================================== */

const button=
card.querySelector(".add-btn");


if(stock>0){

button.addEventListener(
"click",
()=>{

addToCart(
product,
name,
price,
image
);

}
);

}


productsElement.appendChild(card);

});

}


/* =====================================================
ADD TO CART
===================================================== */

function addToCart(
product,
name,
price,
image
){

let cart=
JSON.parse(
localStorage.getItem("cart")
)||[];


/*
منع خلط منتجات متجرين
*/

const differentStore=
cart.some(
item=>
item.storeUid &&
item.storeUid!==storeUid
);


if(differentStore){

const ok=
confirm(
"السلة تحتوي منتجات من متجر آخر.\n\nهل تريد إفراغ السلة والشراء من هذا المتجر؟"
);

if(!ok)return;

cart=[];

}


const existing=
cart.find(
item=>
item.id===product.id &&
item.storeUid===storeUid
);


if(existing){

existing.quantity=
Number(existing.quantity||0)+1;

}

else{

cart.push({

id:product.id,

name:name,

price:price,

image:image,

quantity:1,

storeUid:storeUid,

storeName:
valueFrom(
currentStore,
[
"storeName",
"name",
"shopName"
],
"G-Glam"
),

/*
نحفظ بعض معلومات المنتج
حتى تستعملها السلة
*/

description:
valueFrom(
product,
[
"description",
"productDescription"
],
"")

});

}


localStorage.setItem(
"cart",
JSON.stringify(cart)
);

localStorage.setItem(
"cartStoreId",
storeUid
);


updateCartCount();

alert(
"تمت إضافة المنتج إلى السلة 🛒"
);

}


/* =====================================================
CART COUNT
===================================================== */

function updateCartCount(){

const cart=
JSON.parse(
localStorage.getItem("cart")
)||[];


let count=0;


cart.forEach(
item=>{

if(
item.storeUid===storeUid
){

count+=
Number(
item.quantity||0
);

}

});


cartCount.textContent=
count;

}


/* =====================================================
SEARCH
===================================================== */

searchInput.addEventListener(
"input",
function(){

const keyword=
this.value
.trim()
.toLowerCase();


if(!keyword){

renderProducts(
allProducts
);

return;

}


const result=
allProducts.filter(
product=>{

const name=
String(
valueFrom(
product,
["name","productName","title"],
""
)
).toLowerCase();


const description=
String(
valueFrom(
product,
["description","productDescription"],
""
)
).toLowerCase();


return(
name.includes(keyword) ||
description.includes(keyword)
);

});


renderProducts(result);

});


/* =====================================================
LINKS
===================================================== */

const storeQuery=
"?store="+
encodeURIComponent(storeUid);


document.getElementById(
"homeLink"
).href=
"index.html"+storeQuery;


document.getElementById(
"cartLink"
).href=
"cart.html"+storeQuery;


document.getElementById(
"floatingCart"
).href=
"cart.html"+storeQuery;


document.getElementById(
"cartBtn"
).addEventListener(
"click",
()=>{

window.location.href=
"cart.html"+storeQuery;

}
);


/* =====================================================
SIDEBAR
===================================================== */

const sidebar=
document.getElementById("sidebar");

const overlay=
document.getElementById("overlay");

document.getElementById(
"menuBtn"
).addEventListener(
"click",
()=>{

sidebar.classList.add("active");

overlay.classList.add("active");

}
);


overlay.addEventListener(
"click",
()=>{

sidebar.classList.remove("active");

overlay.classList.remove("active");

}
);


/* =====================================================
ERROR
===================================================== */

function showError(message){

productsElement.innerHTML=`

<div class="empty">

<div style="font-size:50px">
🏪
</div>

<h2>
${escapeHtml(message)}
</h2>

<p style="margin-top:10px;color:#777">
تحقق من رابط المتجر.
</p>

</div>

`;

}


/* =====================================================
START
===================================================== */

localStorage.setItem(
"storeId",
storeUid
);

updateCartCount();


const loaded=
await loadStore();


if(loaded){

await loadProducts();

}

</script>


<script>

if("serviceWorker" in navigator){

window.addEventListener(
"load",
()=>{

navigator.serviceWorker
.register(
"service-worker.js"
)
.catch(
error=>
console.log(
"Service Worker:",
error
)
);

});

}

</script>

</body>

</html>
