<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" id="theme-color-meta" content="#FFFFFF">
    <title>G-Glam Store</title>
    
    <!-- CSS Styles -->
    <style>
        :root {
            --bg: #FAFAFA;
            --header: #FFFFFF;
            --card: #FFFFFF;
            --card-light: #F7F7F7;
            --text: #1F2937;
            --muted: #6B7280;
            --border: #E5E7EB;
            --accent: #F97316;
            --accent-dark: #EA580C;
            --input: #FFFFFF;
            --input-text: #1F2937;
            --sidebar: #FFFFFF;
            --sidebar-hover: #FFF7ED;
        }

        /* =====================================================
           THEMES DEFINITIONS
        ===================================================== */
        body.theme-orange {
            --bg: #FAFAFA;
            --header: #FFFFFF;
            --card: #FFFFFF;
            --card-light: #F7F7F7;
            --text: #1F2937;
            --muted: #6B7280;
            --border: #E5E7EB;
            --accent: #F97316;
            --accent-dark: #EA580C;
            --input: #FFFFFF;
            --input-text: #1F2937;
            --sidebar: #FFFFFF;
            --sidebar-hover: #FFF7ED;
        }

        body.theme-blue {
            --bg: #F8FAFC;
            --header: #FFFFFF;
            --card: #FFFFFF;
            --card-light: #F1F5F9;
            --text: #0F172A;
            --muted: #64748B;
            --border: #E2E8F0;
            --accent: #2563EB;
            --accent-dark: #1D4ED8;
            --input: #FFFFFF;
            --input-text: #0F172A;
            --sidebar: #FFFFFF;
            --sidebar-hover: #EFF6FF;
        }

        body.theme-green {
            --bg: #F0FDF4;
            --header: #FFFFFF;
            --card: #FFFFFF;
            --card-light: #DCFCE7;
            --text: #14532D;
            --muted: #475569;
            --border: #BBF7D0;
            --accent: #16A34A;
            --accent-dark: #15803D;
            --input: #FFFFFF;
            --input-text: #14532D;
            --sidebar: #FFFFFF;
            --sidebar-hover: #F0FDF4;
        }

        body.theme-purple {
            --bg: #FAF5FF;
            --header: #FFFFFF;
            --card: #FFFFFF;
            --card-light: #F3E8FF;
            --text: #581C87;
            --muted: #6B7280;
            --border: #E9D5FF;
            --accent: #9333EA;
            --accent-dark: #7E22CE;
            --input: #FFFFFF;
            --input-text: #581C87;
            --sidebar: #FFFFFF;
            --sidebar-hover: #FAF5FF;
        }

        body.theme-pink {
            --bg: #FDF2F8;
            --header: #FFFFFF;
            --card: #FFFFFF;
            --card-light: #FCE7F3;
            --text: #831843;
            --muted: #6B7280;
            --border: #FBCFE8;
            --accent: #DB2777;
            --accent-dark: #BE185D;
            --input: #FFFFFF;
            --input-text: #831843;
            --sidebar: #FFFFFF;
            --sidebar-hover: #FDF2F8;
        }

        body.theme-dark {
            --bg: #0B0F17;
            --header: #111827;
            --card: #1F2937;
            --card-light: #374151;
            --text: #F9FAFB;
            --muted: #9CA3AF;
            --border: #374151;
            --accent: #F97316;
            --accent-dark: #EA580C;
            --input: #1F2937;
            --input-text: #F9FAFB;
            --sidebar: #111827;
            --sidebar-hover: #1F2937;
        }

        /* --- NEW THEMES --- */
        body.theme-gold {
            --bg: #FAF8F5;
            --header: #FFFFFF;
            --card: #FFFFFF;
            --card-light: #FDFBF7;
            --text: #3D332A;
            --muted: #786C5E;
            --border: #EFE6D5;
            --accent: #D4AF37;
            --accent-dark: #B59226;
            --input: #FFFFFF;
            --input-text: #3D332A;
            --sidebar: #FFFFFF;
            --sidebar-hover: #FAF5E8;
        }

        body.theme-red {
            --bg: #FFF5F5;
            --header: #FFFFFF;
            --card: #FFFFFF;
            --card-light: #FFF8F8;
            --text: #4A1515;
            --muted: #7A5252;
            --border: #FADCDC;
            --accent: #E53E3E;
            --accent-dark: #C53030;
            --input: #FFFFFF;
            --input-text: #4A1515;
            --sidebar: #FFFFFF;
            --sidebar-hover: #FFF0F0;
        }

        body.theme-emerald {
            --bg: #F0FDF4;
            --header: #FFFFFF;
            --card: #FFFFFF;
            --card-light: #F7FEFA;
            --text: #064E3B;
            --muted: #475569;
            --border: #DCFCE7;
            --accent: #059669;
            --accent-dark: #047857;
            --input: #FFFFFF;
            --input-text: #064E3B;
            --sidebar: #FFFFFF;
            --sidebar-hover: #ECFDF5;
        }

        body.theme-black {
            --bg: #121212;
            --header: #1E1E1E;
            --card: #1E1E1E;
            --card-light: #252525;
            --text: #F3F4F6;
            --muted: #9CA3AF;
            --border: #333333;
            --accent: #D4AF37;
            --accent-dark: #B59226;
            --input: #2A2A2A;
            --input-text: #F3F4F6;
            --sidebar: #1E1E1E;
            --sidebar-hover: #2A2A2A;
        }

        /* Basic Page Styles */
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            background-color: var(--header);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-accent {
            background-color: var(--accent);
            color: #FFFFFF;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        .btn-accent:hover {
            background-color: var(--accent-dark);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="theme-orange">

    <header>
        <h2>G-Glam Store</h2>
        <button class="btn-accent">تسوق الآن</button>
    </header>

    <div class="container">
        <div class="card">
            <h3>مرحباً بكم في المتجر</h3>
            <p style="color: var(--muted);">يتم تحميل التيم المختار تلقائياً وبسلاسة.</p>
        </div>
    </div>

    <!-- JavaScript Script -->
    <script>
        const themeColorMeta = document.getElementById("theme-color-meta");

        /* =====================================================
           APPLY STORE THEME FUNCTION
        ===================================================== */
        function applyStoreTheme(theme) {
            const validThemes = [
                "orange",
                "blue",
                "green",
                "purple",
                "pink",
                "dark",
                "gold",
                "red",
                "emerald",
                "black"
            ];

            theme = String(theme || "orange").toLowerCase().trim();

            if (!validThemes.includes(theme)) {
                theme = "orange";
            }

            // إزالة كافة كلاسات التيمات القديمة
            document.body.className = document.body.className
                .split(' ')
                .filter(c => !c.startsWith('theme-'))
                .join(' ');

            // إضافة كلاس التيم المحدد
            document.body.classList.add("theme-" + theme);

            // إعداد لون شريط شاشة الهاتف للمتصفح
            const themeColors = {
                orange: "#FFFFFF",
                blue: "#FFFFFF",
                green: "#FFFFFF",
                purple: "#FFFFFF",
                pink: "#FFFFFF",
                gold: "#FFFFFF",
                red: "#FFFFFF",
                emerald: "#FFFFFF",
                dark: "#0B0F17",
                black: "#1E1E1E"
            };

            if (themeColorMeta) {
                themeColorMeta.content = themeColors[theme] || "#FFFFFF";
            }

            localStorage.setItem("gglamStoreTheme", theme);
        }

        // استرجاع التيم المحفوظ أو تطبيق التيم الافتراضي عند فتح الصفحة
        document.addEventListener("DOMContentLoaded", function() {
            const savedTheme = localStorage.getItem("gglamStoreTheme") || "orange";
            applyStoreTheme(savedTheme);
        });
    </script>
</body>
</html>
