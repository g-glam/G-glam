<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#F4F4F4">

<link rel="manifest"
      href="manifest.json">

<link rel="apple-touch-icon"
      href="icons/icon-192.png">

<title>المتجر</title>

<!-- Tajawal -->
<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
rel="stylesheet">


<style>

/* =====================================================
   COLORS
===================================================== */

:root{

--bg:#F4F4F4;

--card:#FFFFFF;

--text:#222222;

--accent:#F47B20;

--accent-dark:#DF6810;

--accent-light:#FFF1E6;

--muted:#777777;

--border:#E7E7E7;

--danger:#D9534F;

--shadow:
0 4px 15px rgba(0,0,0,.06);

}


/* =====================================================
   RESET
===================================================== */

*{

margin:0;
padding:0;

box-sizing:border-box;

font-family:
"Tajawal",
Arial,
sans-serif;

}


/* =====================================================
   BODY
===================================================== */

body{

background:var(--bg);

color:var(--text);

padding-bottom:90px;

min-height:100vh;

}


/* =====================================================
   HEADER
===================================================== */

header{

display:flex;

align-items:center;

justify-content:space-between;

padding:15px 18px;

background:var(--bg);

position:sticky;

top:0;

z-index:100;

}


/* =====================================================
   STORE LOGO / NAME
===================================================== */

.logo{

font-size:25px;

font-weight:800;

color:#222;

text-align:center;

max-width:65%;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

}

.logo span{

color:var(--accent);

}


/* =====================================================
   MENU
===================================================== */

.menu-btn{

font-size:27px;

cursor:pointer;

width:42px;

height:42px;

display:flex;

align-items:center;

justify-content:center;

}


/* =====================================================
   CART
===================================================== */

.cart-icon{

font-size:26px;

cursor:pointer;

position:relative;

width:42px;

height:42px;

display:flex;

align-items:center;

justify-content:center;

}


.cart-count{

position:absolute;

top:-2px;

left:-2px;

background:var(--accent);

color:#fff;

font-size:11px;

font-weight:800;

width:20px;

height:20px;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

}


/* =====================================================
   STORE HERO
===================================================== */

.store-info{

text-align:center;

padding:8px 15px 20px;

}


.store-image{

width:80px;

height:80px;

border-radius:50%;

object-fit:cover;

background:#EAEAEA;

border:3px solid #FFE0C8;

margin-bottom:10px;

display:none;

}


.store-info h1{

font-size:23px;

font-weight:800;

margin-bottom:5px;

}


.store-info p{

font-size:13px;

color:var(--muted);

}


/* =====================================================
   SEARCH
===================================================== */

.search-box{

padding:0 15px 20px;

}


.search-box input{

width:100%;

padding:14px 20px;

border:1px solid var(--border);

border-radius:30px;

background:#fff;

box-shadow:var(--shadow);

font-size:15px;

outline:none;

}


.search-box input:focus{

border-color:var(--accent);

box-shadow:
0 0 0 3px rgba(244,123,32,.10);

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

position:fixed;

top:0;

right:-280px;

width:280px;

height:100%;

background:#fff;

box-shadow:
-4px 0 15px rgba(0,0,0,.12);

z-index:999;

transition:.3s;

padding-top:25px;

}


.sidebar.active{

right:0;

}


.sidebar-header{

padding:20px;

border-bottom:1px solid #eee;

text-align:center;

}


.sidebar-store-image{

width:65px;

height:65px;

border-radius:50%;

object-fit:cover;

display:none;

margin:auto auto 10px;

}


.sidebar-store-name{

font-size:18px;

font-weight:800;

}


.sidebar a{

display:block;

padding:16px 25px;

text-decoration:none;

color:#222;

font-size:16px;

border-bottom:1px solid #eee;

transition:.2s;

}


.sidebar a:hover{

background:var(--accent-light);

color:var(--accent-dark);

}


/* =====================================================
   OVERLAY
===================================================== */

.overlay{

position:fixed;

inset:0;

background:rgba(0,0,0,.35);

display:none;

z-index:998;

}


.overlay.active{

display:block;

}


/* =====================================================
   PRODUCTS
===================================================== */

.products{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:15px;

padding:15px;

}


/* =====================================================
   PRODUCT CARD
===================================================== */

.card{

background:var(--card);

border-radius:18px;

overflow:hidden;

box-shadow:var(--shadow);

border:1px solid rgba(0,0,0,.03);

transition:.2s;

}


.card:hover{

transform:translateY(-2px);

}


/* =====================================================
   PRODUCT IMAGE
===================================================== */

.product-image{

width:100%;

aspect-ratio:1/1;

object-fit:cover;

display:block;

background:#F1F1F1;

}


/* =====================================================
   PRODUCT CONTENT
===================================================== */

.card-content{

padding:12px;

}


.card h3{

font-size:15px;

margin-bottom:8px;

height:42px;

overflow:hidden;

line-height:1.5;

}


/* =====================================================
   PRICE
===================================================== */

.price{

font-size:17px;

font-weight:800;

margin-bottom:8px;

color:var(--accent-dark);

}


/* =====================================================
   STOCK
===================================================== */

.stock{

font-size:12px;

color:var(--muted);

margin-bottom:10px;

}


/* =====================================================
   BUTTONS
===================================================== */

.product-buttons{

display:flex;

flex-direction:column;

gap:7px;

}


/* =====================================================
   VIEW BUTTON
===================================================== */

.details-btn{

display:block;

width:100%;

text-align:center;

padding:10px;

border:none;

border-radius:12px;

background:#FFF1E6;

color:var(--accent-dark);

cursor:pointer;

font-weight:800;

font-size:13px;

transition:.2s;

}


.details-btn:hover{

background:#FFE2CC;

}


/* =====================================================
   ADD BUTTON
===================================================== */

.add-btn{

width:100%;

padding:10px;

border:none;

border-radius:12px;

background:var(--accent);

color:#fff;

cursor:pointer;

font-weight:800;

font-size:13px;

transition:.2s;

}


.add-btn:hover{

background:var(--accent-dark);

}


.add-btn:disabled{

background:#BDBDBD;

cursor:not-allowed;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

grid-column:1/-1;

text-align:center;

padding:60px 20px;

color:var(--muted);

font-size:15px;

}


/* =====================================================
   EMPTY
===================================================== */

.empty{

grid-column:1/-1;

text-align:center;

padding:50px 20px;

color:var(--muted);

background:#fff;

border-radius:18px;

border:1px solid var(--border);

}


/* =====================================================
   ERROR
===================================================== */

.error-box{

grid-column:1/-1;

background:#fff;

border-radius:18px;

padding:35px 20px;

text-align:center;

border:1px solid #f0d0d0;

}


.error-icon{

font-size:45px;

margin-bottom:12px;

}


.error-title{

font-size:19px;

font-weight:800;

margin-bottom:8px;

}


.error-text{

font-size:13px;

color:var(--muted);

line-height:1.8;

}


/* =====================================================
   FLOATING CART
===================================================== */

.floating-cart{

position:fixed;

bottom:15px;

right:50%;

transform:translateX(50%);

width:90%;

max-width:500px;

background:var(--accent);

color:#fff;

padding:15px;

border-radius:30px;

text-align:center;

text-decoration:none;

box-shadow:
0 8px 20px rgba(244,123,32,.25);

z-index:500;

font-weight:800;

}


/* =====================================================
   TABLET
===================================================== */

@media(min-width:768px){

.products{

grid-template-columns:
repeat(4,1fr);

}

}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:1200px){

.products{

grid-template-columns:
repeat(5,1fr);

}

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:400px){

.products{

gap:10px;

padding:10px;

}

.card-content{

padding:10px;

}

.card h3{

font-size:14px;

}

.price{

font-size:16px;

}

}


/* =====================================================
   DESKTOP STORE HEADER
===================================================== */

@media(min-width:768px){

.store-image{

width:90px;

height:90px;

}

.store-info h1{

font-size:27px;

}

}

</style>

</head>


<body>


<!-- =====================================================
     OVERLAY
===================================================== -->

<div
class="overlay"
id="overlay">
</div>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<div
class="sidebar"
id="sidebar">


<div class="sidebar-header">

<img
id="sidebarStoreImage"
class="sidebar-store-image"
src=""
alt="صورة المتجر"
>

<div
id="sidebarStoreName"
class="sidebar-store-name">

المتجر

</div>

</div>


<a
href="#"
id="homeLink">

🏠 الرئيسية

</a>


<a
href="#"
id="cartLink">

🛒 السلة

</a>


<a
href="#"
id="contactLink">

📞 اتصل بنا

</a>


</div>


<!-- =====================================================
     HEADER
===================================================== -->

<header>


<div
class="menu-btn"
id="menuBtn">

☰

</div>


<div
class="logo"
id="headerLogo">

جاري التحميل...

</div>


<div
class="cart-icon"
id="cartButton">

🛒

<span
class="cart-count"
id="cartCount">

0

</span>

</div>


</header>


<!-- =====================================================
     STORE INFORMATION
===================================================== -->

<div
class="store-info">


<img
id="storeImage"
class="store-image"
src=""
alt="صورة المتجر"
>


<h1
id="storeName">

جاري تحميل المتجر...

</h1>


<p
id="storeDescription">

جاري تحميل معلومات المتجر...

</p>


</div>


<!-- =====================================================
     SEARCH
===================================================== -->

<div
class="search-box">


<input
type="text"
id="searchInput"
placeholder="ابحث عن منتج..."
autocomplete="off"
>


</div>


<!-- =====================================================
     PRODUCTS
===================================================== -->

<div
class="products"
id="productsContainer">


<div class="loading">

⏳ جاري تحميل المتجر...

</div>


</div>


<!-- =====================================================
     FLOATING CART
===================================================== -->

<a
href="#"
id="floatingCart"
class="floating-cart">

🛒 عرض السلة

</a>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">


/* =====================================================
   FIREBASE IMPORT
===================================================== */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
collection,
getDocs,
query,
where,
doc,
getDoc

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const productsContainer =
document.getElementById(
"productsContainer"
);


const searchInput =
document.getElementById(
"searchInput"
);


const cartCount =
document.getElementById(
"cartCount"
);


const storeNameElement =
document.getElementById(
"storeName"
);


const storeDescriptionElement =
document.getElementById(
"storeDescription"
);


const headerLogo =
document.getElementById(
"headerLogo"
);


const storeImage =
document.getElementById(
"storeImage"
);


const sidebarStoreImage =
document.getElementById(
"sidebarStoreImage"
);


const sidebarStoreName =
document.getElementById(
"sidebarStoreName"
);


/* =====================================================
   GET STORE UID
===================================================== */

/*

رابط المتجر:

index.html?store=UID

مثال:

index.html?store=C8Zx1XPqbLRlHx0kyfQd7nNRCcQ2

*/

const params =
new URLSearchParams(
window.location.search
);


let storeUid =
params.get("store");


/* =====================================================
   FALLBACK LOCAL STORAGE
===================================================== */

if(!storeUid){

storeUid =
localStorage.getItem(
"storeId"
);

}


/* =====================================================
   STORE UID REQUIRED
===================================================== */

if(!storeUid){

showError(
"لم يتم تحديد المتجر",
"افتح رابط المتجر الخاص بالتاجر."
);

throw new Error(
"STORE UID NOT FOUND"
);

}


/* =====================================================
   SAVE STORE
===================================================== */

localStorage.setItem(
"storeId",
storeUid
);


/* =====================================================
   VARIABLES
===================================================== */

let currentStore = null;

let allProducts = [];


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
   GET STORE FIELD
===================================================== */

function getStoreField(
store,
fields,
fallback=""
){

for(
const field of fields
){

if(
store &&
store[field] !== undefined &&
store[field] !== null &&
String(store[field]).trim() !== ""
){

return store[field];

}

}

return fallback;

}


/* =====================================================
   LOAD STORE
===================================================== */

async function loadStore(){

try{


/*
   المتجر محفوظ في:

   stores/{UID}
*/

const storeRef =
doc(
db,
"stores",
storeUid
);


const storeSnapshot =
await getDoc(
storeRef
);


/* =====================================================
   STORE NOT FOUND
===================================================== */

if(
!storeSnapshot.exists()
){

showError(
"المتجر غير موجود",
"لم نجد متجرًا مرتبطًا بهذا الرابط."
);

return false;

}


/* =====================================================
   STORE DATA
===================================================== */

currentStore =
storeSnapshot.data();


/* =====================================================
   STATUS
===================================================== */

const status =

String(
currentStore.status ||
"approved"
)

.toLowerCase()
.trim();


/*
   المتجر يجب أن يكون مقبولًا.
*/

if(
status !== "approved" &&
status !== "active"
){

showError(
"المتجر غير متاح حاليًا",
"هذا المتجر لم يتم تفعيله أو تمت إيقافه."
);

return false;

}


/* =====================================================
   STORE NAME
===================================================== */

const name =

getStoreField(
currentStore,
[
"storeName",
"name",
"shopName",
"title"
],
"G-Glam"
);


currentStore.storeName =
name;


/* =====================================================
   STORE DESCRIPTION
===================================================== */

const description =

getStoreField(
currentStore,
[
"description",
"storeDescription",
"shopDescription"
],
"مرحبا بكم في متجرنا"
);


/* =====================================================
   STORE IMAGE
===================================================== */

const image =

getStoreField(
currentStore,
[
"storeImage",
"image",
"logo",
"logoUrl",
"photoURL"
],
""
);


/* =====================================================
   DISPLAY STORE
===================================================== */

storeNameElement.textContent =
name;


/*
   حسب طلبك:
   عنوان المتجر يحتوي فقط
   على اسم متجر التاجر.
*/

headerLogo.textContent =
name;


sidebarStoreName.textContent =
name;


storeDescriptionElement.textContent =
description;


document.title =
name;


/* =====================================================
   STORE IMAGE
===================================================== */

if(image){

storeImage.src =
image;

storeImage.style.display =
"block";


sidebarStoreImage.src =
image;

sidebarStoreImage.style.display =
"block";

}


/* =====================================================
   SAVE STORE DATA
===================================================== */

localStorage.setItem(
"storeId",
storeUid
);

localStorage.setItem(
"storeName",
name
);


/* =====================================================
   CONTACT
===================================================== */

const contactLink =
document.getElementById(
"contactLink"
);


const facebook =

getStoreField(
currentStore,
[
"facebook",
"facebookUrl"
],
""
);


const instagram =

getStoreField(
currentStore,
[
"instagram",
"instagramUrl"
],
""
);


const phone =

getStoreField(
currentStore,
[
"phone",
"phoneNumber",
"telephone"
],
""
);


if(facebook){

contactLink.href =
facebook;

contactLink.target =
"_blank";

}

else if(instagram){

contactLink.href =
instagram;

contactLink.target =
"_blank";

}

else if(phone){

contactLink.href =
"tel:" + phone;

}

else{

contactLink.href =
"#";

}


/* =====================================================
   STORE LOADED
===================================================== */

return true;


}

catch(error){

console.error(
"STORE ERROR:",
error
);


showError(
"تعذر تحميل المتجر",
error.message
);

return false;

}

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

try{


productsContainer.innerHTML = `

<div class="loading">

⏳ جاري تحميل المنتجات...

</div>

`;


/*
   المنتجات الخاصة بهذا التاجر
*/

const productsQuery =
query(

collection(
db,
"products"
),

where(
"ownerUid",
"==",
storeUid
)

);


const snapshot =
await getDocs(
productsQuery
);


allProducts = [];


snapshot.forEach(
productDoc => {

allProducts.push({

id:
productDoc.id,

...productDoc.data()

});

});


/* =====================================================
   RENDER
===================================================== */

renderProducts(
allProducts
);


}

catch(error){

console.error(
"PRODUCTS ERROR:",
error
);


showError(
"تعذر تحميل المنتجات",
error.message
);

}

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(
products
){

productsContainer.innerHTML =
"";


if(
!products.length
){

productsContainer.innerHTML = `

<div class="empty">

<div
style="
font-size:45px;
margin-bottom:12px;
">

🛍️

</div>

لا توجد منتجات في هذا المتجر حاليًا.

</div>

`;

return;

}


/* =====================================================
   PRODUCTS
===================================================== */

products.forEach(
product => {


const image =

product.image ||

(
Array.isArray(
product.images
)
&&
product.images.length
?
product.images[0]
:
""
);


const name =

product.name ||

"منتج";


const price =

Number(
product.price || 0
);


const stock =

Number(
product.stock ?? 0
);


const outOfStock =
stock <= 0;


/* =====================================================
   CARD
===================================================== */

const card =
document.createElement(
"div"
);


card.className =
"card";


card.innerHTML = `

<img

class="product-image"

src="${escapeHtml(
image
)}"

alt="${escapeHtml(
name
)}"

onerror="
this.src='data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27400%27 height=%27400%27%3E%3Crect width=%27100%25%27 height=%27100%25%27 fill=%27%23eeeeee%27/%3E%3Ctext x=%2750%25%27 y=%2750%25%27 text-anchor=%27middle%27 dominant-baseline=%27middle%27 font-size=%2720%27 fill=%27%23999999%27%3Eبدون صورة%3C/text%3E%3C/svg%3E';
"

>


<div class="card-content">


<h3>

${escapeHtml(
name
)}

</h3>


<div class="price">

${price.toLocaleString(
"ar-DZ"
)} DA

</div>


<div class="stock">

${
outOfStock

?

"غير متوفر حاليًا"

:

"متوفر: " + stock

}

</div>


<div class="product-buttons">


<button

class="details-btn"

type="button"

>

👁️ عرض المنتج

</button>


<button

class="add-btn"

type="button"

${outOfStock ? "disabled" : ""}

>

${
outOfStock

?

"غير متوفر"

:

"🛒 أضف إلى السلة"

}

</button>


</div>


</div>

`;


/* =====================================================
   VIEW PRODUCT
===================================================== */

const detailsButton =
card.querySelector(
".details-btn"
);


detailsButton.addEventListener(
"click",
function(){

viewProduct(
product.id
);

}
);


/* =====================================================
   ADD TO CART
===================================================== */

const addButton =
card.querySelector(
".add-btn"
);


if(
!outOfStock
){

addButton.addEventListener(
"click",
function(){

addToCart(
product
);

}
);

}


productsContainer.appendChild(
card
);

});

}


/* =====================================================
   VIEW PRODUCT
===================================================== */

function viewProduct(
productId
){

window.location.href =

"product.html?id=" +

encodeURIComponent(
productId
) +

"&store=" +

encodeURIComponent(
storeUid
);

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(
product
){

let cart =

JSON.parse(
localStorage.getItem(
"cart"
)
) || [];


/* =====================================================
   REMOVE OTHER STORE PRODUCTS
===================================================== */

const differentStore =
cart.some(
item =>
item.storeUid &&
item.storeUid !== storeUid
);


if(
differentStore
){

const change =
confirm(

"السلة تحتوي منتجات من متجر آخر.\n\n" +

"هل تريد إفراغ السلة والشراء من هذا المتجر؟"

);


if(!change){

return;

}


cart = [];

}


/* =====================================================
   EXISTING PRODUCT
===================================================== */

const existing =

cart.find(
item =>

item.id ===
product.id &&

item.storeUid ===
storeUid

);


if(existing){

existing.quantity =
Number(
existing.quantity || 0
) + 1;

}

else{

const image =

product.image ||

(
Array.isArray(
product.images
)
&&
product.images.length
?
product.images[0]
:
""
);


cart.push({

id:
product.id,

name:
product.name ||
"منتج",

price:
Number(
product.price || 0
),

image:
image,

quantity:
1,

storeUid:
storeUid,

storeName:

currentStore?.storeName ||
"G-Glam"

});

}


/* =====================================================
   SAVE CART
===================================================== */

localStorage.setItem(
"cart",
JSON.stringify(
cart
)
);


localStorage.setItem(
"cartStoreId",
storeUid
);


/* =====================================================
   UPDATE
===================================================== */

updateCartCount();


alert(
"تمت إضافة المنتج إلى السلة 🛒"
);

}


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
) || [];


const storeCart =

cart.filter(
item =>
item.storeUid ===
storeUid
);


let total = 0;


storeCart.forEach(
item => {

total +=
Number(
item.quantity || 0
);

});


cartCount.textContent =
total;

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
"input",
function(){

const keyword =

this.value
.toLowerCase()
.trim();


if(!keyword){

renderProducts(
allProducts
);

return;

}


const filtered =

allProducts.filter(
product => {


const name =

String(
product.name || ""
)
.toLowerCase();


const description =

String(
product.description || ""
)
.toLowerCase();


return (

name.includes(
keyword
)

||

description.includes(
keyword
)

);

});


renderProducts(
filtered
);

});


/* =====================================================
   NAVIGATION
===================================================== */

document
.getElementById(
"homeLink"
)
.href =

"index.html?store=" +

encodeURIComponent(
storeUid
);


document
.getElementById(
"cartLink"
)
.href =

encodeURIComponent(

);

.getElementById(

)

);


/* =====================================================

===================================================== */

document
.getElementById(
"cartButton"
)
.addEventListener(
"click",
function(){

window.location.href =

"cart.html?store=" +

encodeURIComponent(
storeUid
);

});


/* =====================================================
   SIDEBAR
===================================================== */

document.getElementById(
"sidebar"
);


const overlay =

);


const menuBtn =
document.getElementById(

);

===================================================== */

)

   START

updateCartCount();

await loadStore();

storeLoaded
){

await loadProducts();
