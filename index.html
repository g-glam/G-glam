<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>المتجر</title>

<link
href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

/* =====================================================
   الألوان
===================================================== */

:root{

--orange:#f47b20;
--orange-dark:#df6810;

--bg:#f3f3f3;
--white:#ffffff;

--text:#333;
--muted:#888;

--border:#e7e7e7;

--success:#198754;

--shadow:0 4px 18px rgba(0,0,0,.07);

}


/* =====================================================
   RESET
===================================================== */

*{

box-sizing:border-box;

margin:0;

padding:0;

font-family:"Tajawal",Arial,sans-serif;

}


body{

background:var(--bg);

color:var(--text);

min-height:100vh;

}


/* =====================================================
   HEADER
===================================================== */

.header{

background:var(--white);

height:72px;

border-bottom:1px solid var(--border);

position:sticky;

top:0;

z-index:1000;

box-shadow:0 2px 10px rgba(0,0,0,.04);

}


.header-inner{

max-width:1300px;

height:100%;

margin:auto;

padding:0 18px;

display:flex;

align-items:center;

justify-content:space-between;

gap:15px;

}


/* اسم المتجر */

.store-title{

font-size:24px;

font-weight:800;

color:var(--text);

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

}


.store-title span{

color:var(--orange);

}


/* السلة */

.cart-button{

position:relative;

display:flex;

align-items:center;

justify-content:center;

gap:7px;

height:44px;

padding:0 15px;

border:none;

border-radius:11px;

background:var(--orange);

color:white;

font-size:15px;

font-weight:700;

cursor:pointer;

text-decoration:none;

transition:.2s;

}


.cart-button:hover{

background:var(--orange-dark);

transform:translateY(-1px);

}


.cart-count{

min-width:22px;

height:22px;

padding:0 5px;

display:flex;

align-items:center;

justify-content:center;

background:white;

color:var(--orange);

border-radius:20px;

font-size:12px;

font-weight:800;

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

width:100%;

max-width:1300px;

margin:auto;

padding:25px 18px 50px;

}


/* =====================================================
   STORE HERO
===================================================== */

.store-hero{

background:var(--white);

border-radius:18px;

padding:28px;

margin-bottom:22px;

box-shadow:var(--shadow);

text-align:center;

}


.store-hero h1{

font-size:30px;

font-weight:800;

color:var(--text);

margin-bottom:8px;

}


.store-hero h1 span{

color:var(--orange);

}


.store-hero p{

font-size:14px;

color:var(--muted);

}


/* =====================================================
   SEARCH
===================================================== */

.search-area{

margin-bottom:22px;

}


.search-box{

position:relative;

width:100%;

}


.search-box input{

width:100%;

height:50px;

border:1px solid var(--border);

border-radius:12px;

background:white;

padding:0 45px 0 15px;

outline:none;

font-size:15px;

color:var(--text);

transition:.2s;

}


.search-box input:focus{

border-color:var(--orange);

box-shadow:0 0 0 3px rgba(244,123,32,.08);

}


.search-icon{

position:absolute;

right:16px;

top:50%;

transform:translateY(-50%);

font-size:19px;

color:#999;

pointer-events:none;

}


/* =====================================================
   PRODUCTS HEADER
===================================================== */

.products-header{

display:flex;

align-items:center;

justify-content:space-between;

gap:15px;

margin-bottom:15px;

}


.products-title{

font-size:21px;

font-weight:800;

color:var(--text);

}


.products-count{

font-size:13px;

color:var(--muted);

}


/* =====================================================
   PRODUCTS GRID
===================================================== */

.products-grid{

display:grid;

grid-template-columns:
repeat(4,minmax(0,1fr));

gap:18px;

}


/* =====================================================
   PRODUCT CARD
===================================================== */

.product-card{

background:white;

border-radius:16px;

overflow:hidden;

box-shadow:var(--shadow);

border:1px solid transparent;

transition:.2s;

display:flex;

flex-direction:column;

}


.product-card:hover{

transform:translateY(-3px);

box-shadow:0 7px 22px rgba(0,0,0,.09);

border-color:#f4e1d3;

}


/* صورة المنتج */

.product-image-box{

width:100%;

aspect-ratio:1/1;

background:#f7f7f7;

position:relative;

overflow:hidden;

}


.product-image{

width:100%;

height:100%;

object-fit:cover;

display:block;

}


.no-image{

width:100%;

height:100%;

display:flex;

align-items:center;

justify-content:center;

color:#aaa;

font-size:45px;

}


/* حالة المخزون */

.stock-badge{

position:absolute;

top:10px;

right:10px;

padding:6px 9px;

border-radius:20px;

background:rgba(255,255,255,.95);

font-size:11px;

font-weight:700;

}


.stock-badge.out{

color:#dc3545;

}


.stock-badge.available{

color:var(--success);

}


/* معلومات المنتج */

.product-info{

padding:15px;

display:flex;

flex-direction:column;

flex:1;

}


.product-name{

font-size:17px;

font-weight:800;

color:var(--text);

margin-bottom:7px;

line-height:1.5;

}


.product-description{

font-size:13px;

line-height:1.7;

color:var(--muted);

margin-bottom:10px;

display:-webkit-box;

-webkit-line-clamp:2;

-webkit-box-orient:vertical;

overflow:hidden;

}


.product-bottom{

margin-top:auto;

display:flex;

align-items:center;

justify-content:space-between;

gap:8px;

}


.product-price{

font-size:18px;

font-weight:800;

color:var(--orange);

white-space:nowrap;

}


.add-cart-btn{

border:none;

background:#fff0e5;

color:var(--orange);

height:38px;

padding:0 11px;

border-radius:9px;

font-size:13px;

font-weight:800;

cursor:pointer;

transition:.2s;

white-space:nowrap;

}


.add-cart-btn:hover{

background:var(--orange);

color:white;

}


.add-cart-btn:disabled{

background:#eee;

color:#999;

cursor:not-allowed;

}


/* =====================================================
   EMPTY / LOADING
===================================================== */

.loading{

background:white;

border-radius:16px;

padding:50px 20px;

text-align:center;

color:#999;

box-shadow:var(--shadow);

}


.loading-icon{

font-size:38px;

margin-bottom:12px;

}


.empty{

grid-column:1/-1;

background:white;

border-radius:16px;

padding:50px 20px;

text-align:center;

color:#999;

box-shadow:var(--shadow);

}


.empty-icon{

font-size:42px;

margin-bottom:10px;

}


.error{

background:#fff0f0;

color:#b42318;

border:1px solid #f5cccc;

border-radius:12px;

padding:15px;

margin-bottom:20px;

display:none;

}


/* =====================================================
   TOAST
===================================================== */

.toast{

position:fixed;

bottom:25px;

left:50%;

transform:
translateX(-50%)
translateY(100px);

background:#222;

color:white;

padding:13px 18px;

border-radius:12px;

font-size:14px;

font-weight:600;

z-index:5000;

opacity:0;

transition:.3s;

pointer-events:none;

}


.toast.show{

opacity:1;

transform:
translateX(-50%)
translateY(0);

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

text-align:center;

padding:25px 15px;

color:#aaa;

font-size:12px;

}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:1050px){

.products-grid{

grid-template-columns:
repeat(3,minmax(0,1fr));

}

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

.header{

height:65px;

}


.store-title{

font-size:20px;

}


.cart-button{

height:40px;

padding:0 11px;

font-size:13px;

}


.container{

padding:15px 12px 35px;

}


.store-hero{

padding:22px 15px;

border-radius:15px;

}


.store-hero h1{

font-size:24px;

}


.products-grid{

grid-template-columns:
repeat(2,minmax(0,1fr));

gap:10px;

}


.product-info{

padding:11px;

}


.product-name{

font-size:15px;

}


.product-description{

font-size:12px;

}


.product-price{

font-size:15px;

}


.add-cart-btn{

font-size:11px;

padding:0 8px;

height:35px;

}

}


/* =====================================================
   SMALL PHONE
===================================================== */

@media(max-width:400px){

.products-grid{

gap:8px;

}


.product-bottom{

align-items:flex-end;

flex-direction:column;

}


.add-cart-btn{

width:100%;

}

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

<div class="header-inner">


<div
class="store-title"
id="headerStoreName">

جاري التحميل...

</div>


<a
href="cart.html"
class="cart-button">

🛒 السلة

<span
class="cart-count"
id="cartCount">

0

</span>

</a>


</div>

</header>


<!-- =====================================================
     CONTENT
===================================================== -->

<main class="container">


<!-- رسالة الخطأ -->

<div
class="error"
id="errorMessage">
</div>


<!-- =====================================================
     STORE HERO
===================================================== -->

<section class="store-hero">

<h1 id="heroStoreName">

جاري تحميل المتجر...

</h1>

<p>

مرحبًا بك في متجرنا 🛍️

</p>

</section>


<!-- =====================================================
     SEARCH
===================================================== -->

<div class="search-area">

<div class="search-box">

<span class="search-icon">

🔍

</span>

<input
type="search"
id="searchInput"
placeholder="ابحث عن منتج...">

</div>

</div>


<!-- =====================================================
     PRODUCTS HEADER
===================================================== -->

<div class="products-header">

<div class="products-title">

🛍️ المنتجات

</div>

<div
class="products-count"
id="productsCount">

0 منتج

</div>

</div>


<!-- =====================================================
     PRODUCTS
===================================================== -->

<div
class="products-grid"
id="productsGrid">

<div class="loading">

<div class="loading-icon">

⏳

</div>

جاري تحميل المنتجات...

</div>

</div>


</main>


<footer class="footer">

جميع الحقوق محفوظة © G-Glam

</footer>


<!-- TOAST -->

<div
class="toast"
id="toast">

تمت إضافة المنتج إلى السلة 🛒

</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">


/* =====================================================
   Firebase Imports
===================================================== */

import {

initializeApp

}

from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
doc,
getDoc,
collection,
getDocs,
query,
where

}

from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =====================================================
   Firebase Config
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =====================================================
   Firebase
===================================================== */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* =====================================================
   Elements
===================================================== */

const headerStoreName =
document.getElementById(
"headerStoreName"
);

const heroStoreName =
document.getElementById(
"heroStoreName"
);

const productsGrid =
document.getElementById(
"productsGrid"
);

const productsCount =
document.getElementById(
"productsCount"
);

const searchInput =
document.getElementById(
"searchInput"
);

const cartCount =
document.getElementById(
"cartCount"
);

const errorMessage =
document.getElementById(
"errorMessage"
);

const toast =
document.getElementById(
"toast"
);


/* =====================================================
   Variables
===================================================== */

let currentStoreId = null;

let currentStore = null;

let allProducts = [];


/* =====================================================
   معرفة المتجر
===================================================== */

function getStoreId(){

const params =
new URLSearchParams(
window.location.search
);

const urlStoreId =
params.get("storeId");


if(urlStoreId){

return urlStoreId;

}


/*
   احتياطًا إذا فتح صاحب المتجر
   الرابط من نفس الجهاز
*/

const savedStoreId =
localStorage.getItem(
"storeId"
);


if(savedStoreId){

return savedStoreId;

}


return null;

}


/* =====================================================
   رسالة الخطأ
===================================================== */

function showError(message){

errorMessage.textContent =
message;

errorMessage.style.display =
"block";

}


/* =====================================================
   إخفاء الخطأ
===================================================== */

function hideError(){

errorMessage.style.display =
"none";

}


/* =====================================================
   حماية HTML
===================================================== */

function escapeHtml(value){

return String(value ?? "")

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
   تحويل السعر
===================================================== */

function getPrice(product){

const price =
product.price ??
product.productPrice ??
product.amount ??
0;

const number =
Number(price);


if(Number.isNaN(number)){

return 0;

}


return number;

}


/* =====================================================
   صورة المنتج
===================================================== */

function getProductImage(product){

/*
   ندعم أكثر من اسم حتى يتوافق
   مع المنتجات الموجودة حاليًا.
*/

if(product.image){

return product.image;

}


if(product.imageUrl){

return product.imageUrl;

}


if(product.photoURL){

return product.photoURL;

}


if(product.photoUrl){

return product.photoUrl;

}


if(
Array.isArray(product.images)
&&
product.images.length > 0
){

return product.images[0];

}


return "";

}


/* =====================================================
   المخزون
===================================================== */

function getStock(product){

if(
product.stock !== undefined
&&
product.stock !== null
){

return Number(product.stock);

}


if(
product.quantity !== undefined
&&
product.quantity !== null
){

return Number(product.quantity);

}


return null;

}


/* =====================================================
   حالة المنتج
===================================================== */

function isProductAvailable(product){

/*
   إذا كان للمنتج status صريح
*/

if(
product.status === "inactive"
||
product.status === "disabled"
||
product.status === "hidden"
){

return false;

}


/*
   إذا كان المخزون محددًا
*/

const stock =
getStock(product);


if(
stock !== null
&&
stock <= 0
){

return false;

}


return true;

}


/* =====================================================
   تحميل المتجر
===================================================== */

async function loadStore(){

currentStoreId =
getStoreId();


if(!currentStoreId){

showError(
"لم يتم تحديد المتجر. يرجى فتح رابط المتجر الصحيح."
);

productsGrid.innerHTML = `

<div class="empty">

<div class="empty-icon">
🏪
</div>

لم يتم العثور على معرف المتجر.

</div>

`;

return false;

}


try{

const storeRef =
doc(
db,
"stores",
currentStoreId
);


const storeSnap =
await getDoc(storeRef);


if(!storeSnap.exists()){

showError(
"المتجر غير موجود."
);

productsGrid.innerHTML = `

<div class="empty">

<div class="empty-icon">
🏪
</div>

هذا المتجر غير موجود أو تم حذفه.

</div>

`;

return false;

}


currentStore =
storeSnap.data();


/*
   المتجر يجب أن يكون مقبولًا
*/

if(
currentStore.status === "rejected"
){

showError(
"هذا المتجر غير متاح حاليًا."
);

productsGrid.innerHTML = `

<div class="empty">

<div class="empty-icon">
❌
</div>

المتجر غير متاح حاليًا.

</div>

`;

return false;

}


/*
   اسم المتجر
*/

const storeName =
currentStore.storeName ||
currentStore.name ||
"G-Glam";


document.title =
escapeHtml(storeName);


headerStoreName.textContent =
storeName;


heroStoreName.textContent =
storeName;


return true;

}

catch(error){

console.error(
"STORE LOAD ERROR:",
error
);

showError(
"حدث خطأ أثناء تحميل بيانات المتجر."
);

return false;

}


/* =====================================================
   تحميل المنتجات
===================================================== */

async function loadProducts(){

try{

productsGrid.innerHTML = `

<div class="loading">

<div class="loading-icon">
⏳
</div>

جاري تحميل المنتجات...

</div>

`;


/*
   المنتجات المرتبطة بالمتجر
*/

const productsRef =
collection(
db,
"products"
);


const productsQuery =
query(
productsRef,
where(
"storeId",
"==",
currentStoreId
)
);


const snapshot =
await getDocs(
productsQuery
);


allProducts = [];


snapshot.forEach(
item=>{

allProducts.push({

id:item.id,

...item.data()

});

});


/*
   إذا لم نجد storeId
   في المنتجات، لن نعرض منتجات
   متاجر أخرى.
*/

renderProducts(
allProducts
);

}

catch(error){

console.error(
"PRODUCTS LOAD ERROR:",
error
);

productsGrid.innerHTML = `

<div class="empty">

<div class="empty-icon">
❌
</div>

حدث خطأ أثناء تحميل المنتجات.

<br><br>

${escapeHtml(
error.message
)}

</div>

`;

}

}


/* =====================================================
   عرض المنتجات
===================================================== */

function renderProducts(products){

const search =
(
searchInput.value || ""
)
.trim()
.toLowerCase();


let list =
products;


if(search){

list =
products.filter(
product=>{

const text = [

product.name,

product.productName,

product.title,

product.description,

product.category

]
.join(" ")
.toLowerCase();

return text.includes(
search
);

});

}


/*
   عدد المنتجات
*/

productsCount.textContent =
`${list.length} منتج`;


/*
   لا توجد منتجات
*/

if(list.length === 0){

productsGrid.innerHTML = `

<div class="empty">

<div class="empty-icon">
📦
</div>

${
search
?
"لا توجد منتجات مطابقة للبحث."
:
"لا توجد منتجات في هذا المتجر حاليًا."
}

</div>

`;

return;

}


productsGrid.innerHTML = "";


list.forEach(
product=>{

const name =
product.name ||
product.productName ||
product.title ||
"منتج";


const description =
product.description ||
"";


const price =
getPrice(product);


const image =
getProductImage(product);


const available =
isProductAvailable(product);


const stock =
getStock(product);


const card =
document.createElement(
"article"
);


card.className =
"product-card";


card.innerHTML = `

<div class="product-image-box">

${
image

?

`

<img
class="product-image"
src="${escapeHtml(image)}"
alt="${escapeHtml(name)}"
loading="lazy">

`

:

`

<div class="no-image">
📦
</div>

`

}


${
stock !== null

?

`

<div
class="stock-badge ${
available
?
"available"
:
"out"
}">

${
available
?
`متوفر`
:
`نفد المخزون`
}

</div>

`

:

""

}

</div>


<div class="product-info">


<div class="product-name">

${escapeHtml(name)}

</div>


${
description

?

`

<div class="product-description">

${escapeHtml(description)}

</div>

`

:

""

}


<div class="product-bottom">


<div class="product-price">

${price.toLocaleString("fr-DZ")}
 DA

</div>


<button
class="add-cart-btn"
data-product-id="${escapeHtml(product.id)}"
${available ? "" : "disabled"}>

${
available
?
"🛒 أضف للسلة"
:
"غير متوفر"
}

</button>


</div>


</div>

`;


productsGrid.appendChild(
card
);

});

}


/* =====================================================
   السلة
===================================================== */

function getCart(){

try{

const cart =
JSON.parse(
localStorage.getItem(
"gglam_cart"
)
);


if(
Array.isArray(cart)
){

return cart;

}

}

catch(error){

console.error(error);

}


return [];

}


/* =====================================================
   حفظ السلة
===================================================== */

function saveCart(cart){

localStorage.setItem(
"gglam_cart",
JSON.stringify(cart)
);

}


/* =====================================================
   تحديث عدد السلة
===================================================== */

function updateCartCount(){

const cart =
getCart();


let count = 0;


cart.forEach(
item=>{

count +=
Number(item.quantity || 0);

});


cartCount.textContent =
count;

}


/* =====================================================
   إضافة منتج للسلة
===================================================== */

function addToCart(productId){

const product =
allProducts.find(
item =>
item.id === productId
);


if(!product){

showToast(
"تعذر العثور على المنتج."
);

return;

}


if(
!isProductAvailable(product)
){

showToast(
"هذا المنتج غير متوفر حاليًا."
);

return;

}


const cart =
getCart();


/*
   نحافظ على storeId داخل السلة
   لأن السلة لاحقًا ستحتاج معرفة
   المتجر الذي ينتمي إليه الطلب.
*/

const existing =
cart.find(
item =>
item.productId === product.id
&&
item.storeId === currentStoreId
);


if(existing){

existing.quantity =
Number(existing.quantity || 0)
+
1;

}

else{

cart.push({

productId:
product.id,

storeId:
currentStoreId,

storeName:
currentStore?.storeName ||
currentStore?.name ||
"G-Glam",

name:
product.name ||
product.productName ||
product.title ||
"منتج",

price:
getPrice(product),

image:
getProductImage(product),

quantity:1

});

}


saveCart(cart);

updateCartCount();

showToast(
"تمت إضافة المنتج إلى السلة 🛒"
);

}


/* =====================================================
   زر إضافة للسلة
===================================================== */

productsGrid.addEventListener(
"click",
function(event){

const button =
event.target.closest(
".add-cart-btn"
);


if(!button){

return;

}


const productId =
button.dataset.productId;


addToCart(productId);

});


/* =====================================================
   البحث
===================================================== */

searchInput.addEventListener(
"input",
function(){

renderProducts(
allProducts
);

});


/* =====================================================
   Toast
===================================================== */

let toastTimer = null;


function showToast(message){

toast.textContent =
message;

toast.classList.add(
"show"
);


clearTimeout(
toastTimer
);


toastTimer =
setTimeout(
function(){

toast.classList.remove(
"show"
);

},
2500
);

}


/* =====================================================
   تشغيل
===================================================== */

async function init(){

hideError();

updateCartCount();


const storeLoaded =
await loadStore();


if(!storeLoaded){

return;

}


await loadProducts();

}


init();

</script>
