<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#FFFFFF"
        id="themeColorMeta"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="apple-touch-icon"
        href="icons/icon-192.png"
    >

    <title>G-Glam | المتجر</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =====================================================
           ROOT
        ===================================================== */

        :root {

            --bg: #F4F4F4;

            --header: #FFFFFF;

            --card: #FFFFFF;

            --card-light: #FAFAFA;

            --text: #374151;

            --muted: #6B7280;

            --border: #E5E7EB;

            --accent: #F47B20;

            --accent-dark: #D96610;

            --input: #FFFFFF;

            --input-text: #374151;

            --sidebar: #FFFFFF;

            --sidebar-hover: #FFF7ED;

            --danger: #EF4444;

            --shadow:
                0 8px 25px rgba(0, 0, 0, .10);

        }


        /* =====================================================
           ORANGE THEME
        ===================================================== */

        body.theme-orange {

            --bg: #F4F4F4;

            --header: #FFFFFF;

            --card: #FFFFFF;

            --card-light: #FAFAFA;

            --text: #374151;

            --muted: #6B7280;

            --border: #E5E7EB;

            --accent: #F47B20;

            --accent-dark: #D96610;

            --input: #FFFFFF;

            --input-text: #374151;

            --sidebar: #FFFFFF;

            --sidebar-hover: #FFF7ED;

        }


        /* =====================================================
           BLUE THEME
        ===================================================== */

        body.theme-blue {

            --bg: #EEF5FF;

            --header: #FFFFFF;

            --card: #FFFFFF;

            --card-light: #F8FBFF;

            --text: #1E3A5F;

            --muted: #64748B;

            --border: #D8E5F5;

            --accent: #2563EB;

            --accent-dark: #1D4ED8;

            --input: #FFFFFF;

            --input-text: #1E3A5F;

            --sidebar: #FFFFFF;

            --sidebar-hover: #EFF6FF;

        }


        /* =====================================================
           GREEN THEME
        ===================================================== */

        body.theme-green {

            --bg: #EFFBF4;

            --header: #FFFFFF;

            --card: #FFFFFF;

            --card-light: #F8FFFA;

            --text: #14532D;

            --muted: #64748B;

            --border: #D9F0E1;

            --accent: #16A34A;

            --accent-dark: #15803D;

            --input: #FFFFFF;

            --input-text: #14532D;

            --sidebar: #FFFFFF;

            --sidebar-hover: #F0FDF4;

        }


        /* =====================================================
           PURPLE THEME
        ===================================================== */

        body.theme-purple {

            --bg: #F7F0FF;

            --header: #FFFFFF;

            --card: #FFFFFF;

            --card-light: #FCF9FF;

            --text: #4C1D95;

            --muted: #6B7280;

            --border: #E8DDF5;

            --accent: #7C3AED;

            --accent-dark: #6D28D9;

            --input: #FFFFFF;

            --input-text: #4C1D95;

            --sidebar: #FFFFFF;

            --sidebar-hover: #F5F3FF;

        }


        /* =====================================================
           PINK THEME
        ===================================================== */

        body.theme-pink {

            --bg: #FFF1F5;

            --header: #FFFFFF;

            --card: #FFFFFF;

            --card-light: #FFF8FA;

            --text: #881337;

            --muted: #6B7280;

            --border: #F3D5DF;

            --accent: #E11D48;

            --accent-dark: #BE123C;

            --input: #FFFFFF;

            --input-text: #881337;

            --sidebar: #FFFFFF;

            --sidebar-hover: #FFF1F5;

        }


        /* =====================================================
           DARK STORE THEME
        ===================================================== */

        body.theme-dark {

            --bg: #07111F;

            --header: #0A1726;

            --card: #0D1B2A;

            --card-light: #132337;

            --text: #F3F4F6;

            --muted: #9AA9BB;

            --border: #223449;

            --accent: #F47B20;

            --accent-dark: #D96610;

            --input: #172536;

            --input-text: #F3F4F6;

            --sidebar: #0D1928;

            --sidebar-hover: #152437;

        }


        /* =====================================================
           RESET
        ===================================================== */

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

            font-family:
                "Tajawal",
                Arial,
                sans-serif;

        }


        html {

            scroll-behavior: smooth;

        }


        body {

            min-height: 100vh;

            background: var(--bg);

            color: var(--text);

            padding-bottom: 95px;

            transition:
                background .25s ease,
                color .25s ease;

        }


        button,
        input {

            font-family:
                "Tajawal",
                Arial,
                sans-serif;

        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {

            height: 70px;

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 24px;

            background: var(--header);

            border-bottom:
                1px solid var(--border);

            position: sticky;

            top: 0;

            z-index: 1000;

            transition:
                background .25s ease,
                border-color .25s ease;

        }


        /* =====================================================
           STORE NAME IN HEADER
        ===================================================== */

        .logo {

            position: absolute;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

            display: flex;

            align-items: center;

            justify-content: center;

            width: max-content;

            max-width: 55%;

            text-align: center;

        }


        .logo span {

            color:
                var(--accent);

            font-size: 27px;

            line-height: 1.2;

            font-weight: 800;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            transition:
                color .25s ease;

        }


        .menu-btn,
        .cart-icon {

            width: 42px;

            height: 42px;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            position: relative;

            color: var(--text);

            border-radius: 10px;

            transition:
                background .2s,
                color .2s;

        }


        .menu-btn:hover,
        .cart-icon:hover {

            background:
                var(--sidebar-hover);

            color:
                var(--accent);

        }


        .menu-btn svg,
        .cart-icon svg {

            width: 29px;

            height: 29px;

        }


        .cart-count {

            position: absolute;

            top: -2px;

            right: -3px;

            width: 21px;

            height: 21px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: var(--accent);

            color: #FFFFFF;

            font-size: 11px;

            font-weight: 800;

            border:
                2px solid var(--header);

        }


        /* =====================================================
           STORE HERO
        ===================================================== */

        .store-section {

            width: 100%;

            position: relative;

        }


        .store-cover {

            width: 100%;

            height: 285px;

            overflow: hidden;

            background:
                var(--card-light);

            display: none;

        }


        .store-cover img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            object-position: center;

            display: block;

        }


        .store-info {

            text-align: center;

            padding:
                0 20px 32px;

            position: relative;

        }


        .store-banner-image {

            width: 145px;

            height: 145px;

            margin:
                -72px auto 18px;

            position: relative;

            z-index: 5;

        }


        .store-banner-image img {

            width: 145px;

            height: 145px;

            border-radius: 50%;

            object-fit: cover;

            display: block;

            background: var(--card);

            border:
                5px solid var(--bg);

            box-shadow:
                0 7px 22px
                rgba(0, 0, 0, .25);

        }


        .store-banner h1 {

            font-size: 34px;

            line-height: 1.3;

            font-weight: 800;

            color: var(--text);

            margin-bottom: 4px;

        }


        .store-banner p {

            font-size: 16px;

            color: var(--muted);

            line-height: 1.8;

        }


        /* =====================================================
           SEARCH
        ===================================================== */

        .search-section {

            width: 100%;

            max-width: 1100px;

            margin:
                0 auto 20px;

            padding:
                0 25px;

        }


        .search-box {

            position: relative;

            width: 100%;

        }


        .search-box input {

            width: 100%;

            height: 52px;

            padding:
                0 22px 0 55px;

            border: none;

            outline: none;

            border-radius: 30px;

            background:
                var(--input);

            color:
                var(--input-text);

            font-size: 15px;

            border:
                1px solid var(--border);

            transition: .2s;

        }


        .search-box input::placeholder {

            color:
                var(--muted);

        }


        .search-box input:focus {

            border-color:
                var(--accent);

            box-shadow:
                0 0 0 3px
                color-mix(
                    in srgb,
                    var(--accent) 12%,
                    transparent
                );

        }


        .search-icon {

            position: absolute;

            left: 18px;

            top: 50%;

            transform:
                translateY(-50%);

            width: 23px;

            height: 23px;

            color:
                var(--muted);

            pointer-events: none;

        }


        /* =====================================================
           PRODUCTS
        ===================================================== */

        .products {

            width: 100%;

            max-width: 1100px;

            margin: 0 auto;

            padding:
                0 25px;

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 14px;

        }


        /* =====================================================
           PRODUCT CARD
        ===================================================== */

        .card {

            min-width: 0;

            background:
                var(--card);

            border:
                1px solid var(--border);

            border-radius: 10px;

            overflow: hidden;

            box-shadow:
                0 5px 16px
                rgba(0, 0, 0, .08);

            transition:
                transform .2s ease,
                border-color .2s ease,
                background .25s ease;

        }


        .card:hover {

            transform:
                translateY(-3px);

            border-color:
                var(--accent);

        }


        .card img {

            width: 100%;

            aspect-ratio: 1 / 1;

            object-fit: cover;

            display: block;

            background:
                var(--card-light);

        }


        .card-content {

            padding:
                11px 12px 13px;

        }


        .card h3 {

            color:
                var(--text);

            font-size: 15px;

            font-weight: 700;

            line-height: 1.55;

            height: 47px;

            overflow: hidden;

            margin-bottom: 3px;

            text-align: center;

        }


        .price {

            color:
                var(--accent);

            font-size: 17px;

            font-weight: 800;

            text-align: center;

            margin-bottom: 9px;

        }


        /* =====================================================
           DETAILS BUTTON
        ===================================================== */

        .details-btn {

            width: 100%;

            height: 35px;

            border:
                1.5px solid var(--accent);

            border-radius: 7px;

            background: transparent;

            color:
                var(--text);

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            margin-bottom: 8px;

            transition: .2s;

        }


        .details-btn:hover {

            background:
                var(--accent);

            color: #FFFFFF;

        }


        /* =====================================================
           ADD TO CART
        ===================================================== */

        .add-btn {

            width: 100%;

            height: 35px;

            border: none;

            border-radius: 7px;

            background:
                var(--accent);

            color: #FFFFFF;

            font-size: 13px;

            font-weight: 800;

            cursor: pointer;

            transition: .2s;

        }


        .add-btn:hover {

            background:
                var(--accent-dark);

        }


        .add-btn:disabled {

            background: #9CA3AF;

            color: #E5E7EB;

            cursor: not-allowed;

        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {

            grid-column: 1 / -1;

            min-height: 250px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            color:
                var(--muted);

            text-align: center;

        }


        .loading svg {

            width: 36px;

            height: 36px;

            margin-bottom: 12px;

            animation:
                spin 1s linear infinite;

        }


        @keyframes spin {

            from {

                transform:
                    rotate(0deg);

            }

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* =====================================================
           EMPTY
        ===================================================== */

        .empty {

            grid-column: 1 / -1;

            text-align: center;

            padding: 55px 20px;

            color:
                var(--muted);

            background:
                var(--card);

            border:
                1px solid var(--border);

            border-radius: 15px;

        }


        .empty h2 {

            color:
                var(--text);

            margin-top: 10px;

        }


        .empty-icon {

            width: 50px;

            height: 50px;

            color:
                var(--accent);

        }


        /* =====================================================
           SOCIAL MEDIA SECTION
        ===================================================== */

        .social-section {

            width: 100%;

            max-width: 1100px;

            margin:
                45px auto 30px;

            padding:
                0 25px;

            scroll-margin-top: 90px;

        }


        .social-box {

            background:
                var(--card);

            border:
                1px solid var(--border);

            border-radius: 18px;

            padding:
                28px 20px;

            text-align: center;

            box-shadow:
                0 5px 18px
                rgba(0, 0, 0, .06);

        }


        .social-title {

            color:
                var(--text);

            font-size: 24px;

            font-weight: 800;

            margin-bottom: 7px;

        }


        .social-description {

            color:
                var(--muted);

            font-size: 14px;

            margin-bottom: 22px;

        }


        .social-links {

            display: flex;

            flex-wrap: wrap;

            align-items: center;

            justify-content: center;

            gap: 12px;

        }


        .social-link {

            min-width: 125px;

            min-height: 48px;

            padding:
                10px 16px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            border:
                1px solid var(--border);

            border-radius: 12px;

            background:
                var(--card-light);

            color:
                var(--text);

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            transition:
                transform .2s ease,
                background .2s ease,
                border-color .2s ease,
                color .2s ease;

        }


        .social-link:hover {

            transform:
                translateY(-2px);

            border-color:
                var(--accent);

            color:
                var(--accent);

            background:
                var(--sidebar-hover);

        }


        .social-link svg {

            width: 22px;

            height: 22px;

            flex-shrink: 0;

        }


        .social-empty {

            color:
                var(--muted);

            font-size: 14px;

            padding:
                10px;

        }


        /* =====================================================
           FLOATING CART
        ===================================================== */

        .floating-cart {

            position: fixed;

            bottom: 18px;

            left: 50%;

            transform:
                translateX(-50%);

            width:
                calc(100% - 50px);

            max-width: 540px;

            height: 53px;

            background:
                var(--accent);

            color: #FFFFFF;

            text-decoration: none;

            border-radius: 28px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            font-size: 16px;

            font-weight: 800;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, .18);

            z-index: 900;

            transition: .2s;

        }


        .floating-cart:hover {

            background:
                var(--accent-dark);

            transform:
                translateX(-50%)
                translateY(-2px);

        }


        .floating-cart svg {

            width: 22px;

            height: 22px;

        }


        /* =====================================================
           SIDEBAR - RIGHT SIDE
        ===================================================== */

        .sidebar {

            position: fixed;

            top: 0;

            right: -300px;

            left: auto;

            width: 280px;

            height: 100vh;

            background:
                var(--sidebar);

            border-left:
                1px solid var(--border);

            border-right: none;

            box-shadow:
                -5px 0 25px
                rgba(0, 0, 0, .25);

            z-index: 2000;

            transition:
                right .3s ease,
                background .25s ease;

            padding-top: 80px;

        }


        .sidebar.active {

            right: 0;

            left: auto;

        }


        .sidebar a {

            display: flex;

            align-items: center;

            gap: 13px;

            padding:
                17px 25px;

            color:
                var(--text);

            text-decoration: none;

            border-bottom:
                1px solid var(--border);

            font-size: 16px;

            transition:
                background .2s,
                color .2s;

        }


        .sidebar a:hover {

            background:
                var(--sidebar-hover);

            color:
                var(--accent);

        }


        .sidebar a svg {

            width: 22px;

            height: 22px;

            flex-shrink: 0;

        }


        /* =====================================================
           OVERLAY
        ===================================================== */

        .overlay {

            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, .55);

            display: none;

            z-index: 1900;

        }


        .overlay.active {

            display: block;

        }


        /* =====================================================
           DESKTOP LARGE
        ===================================================== */

        @media (min-width: 1200px) {

            .store-cover {

                height: 285px;

            }


            .products {

                max-width: 1100px;

            }


            .search-section {

                max-width: 1100px;

            }

        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 900px) {

            .products {

                grid-template-columns:
                    repeat(4, 1fr);

            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            header {

                height: 64px;

                padding:
                    0 16px;

            }


            .logo {

                max-width: 55%;

            }


            .logo span {

                font-size: 21px;

            }


            .menu-btn,
            .cart-icon {

                width: 38px;

                height: 38px;

            }


            .menu-btn svg,
            .cart-icon svg {

                width: 26px;

                height: 26px;

            }


            .store-cover {

                height: 190px;

            }


            .store-banner-image {

                width: 112px;

                height: 112px;

                margin:
                    -56px auto 15px;

            }


            .store-banner-image img {

                width: 112px;

                height: 112px;

                border-width: 4px;

            }


            .store-info {

                padding:
                    0 15px 25px;

            }


            .store-banner h1 {

                font-size: 27px;

            }


            .store-banner p {

                font-size: 14px;

            }


            .search-section {

                padding:
                    0 15px;

                margin-bottom: 12px;

            }


            .search-box input {

                height: 48px;

                font-size: 14px;

            }


            .products {

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 10px;

                padding:
                    0 10px;

            }


            .card {

                border-radius: 10px;

            }


            .card-content {

                padding: 9px;

            }


            .card h3 {

                font-size: 13px;

                height: 42px;

            }


            .price {

                font-size: 15px;

            }


            .details-btn,
            .add-btn {

                height: 34px;

                font-size: 12px;

            }


            .social-section {

                padding:
                    0 15px;

                margin-top: 35px;

            }


            .social-box {

                padding:
                    24px 14px;

            }


            .social-title {

                font-size: 21px;

            }


            .social-links {

                gap: 9px;

            }


            .social-link {

                min-width:
                    calc(50% - 5px);

                font-size: 13px;

                padding:
                    10px 8px;

            }


            .floating-cart {

                width:
                    calc(100% - 30px);

                bottom: 12px;

            }

        }


        /* =====================================================
           SMALL MOBILE
        ===================================================== */

        @media (max-width: 380px) {

            .store-cover {

                height: 160px;

            }


            .logo span {

                font-size: 18px;

            }


            .store-banner h1 {

                font-size: 24px;

            }


            .card h3 {

                font-size: 12px;

            }


            .card-content {

                padding: 8px;

            }


            .details-btn,
            .add-btn {

                font-size: 11px;

            }


            .social-link {

                min-width:
                    100%;

            }

        }


        /* =====================================================
           SCROLLBAR
        ===================================================== */

        ::-webkit-scrollbar {

            width: 7px;

            height: 7px;

        }


        ::-webkit-scrollbar-track {

            background:
                var(--bg);

        }


        ::-webkit-scrollbar-thumb {

            background:
                #9CA3AF;

            border-radius: 10px;

        }


        ::-webkit-scrollbar-thumb:hover {

            background:
                var(--accent);

        }

    </style>

</head>


<body class="theme-orange">

         SVG ICONS

        <symbol

        /* =====================================================
           STORE ID
        ===================================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        let storeIdentifier =
            params.get(
                "store"
            );


        if (!storeIdentifier) {

            const pathParts =
                window.location.pathname
                    .split("/")
                    .filter(
                        p =>
                            p &&
                            p !== "index.html"
                    );


            if (
                pathParts.length > 0
            ) {

                storeIdentifier =
                    pathParts[
                        pathParts.length - 1
                    ];

            }

        }


        if (!storeIdentifier) {

            storeIdentifier =
                localStorage.getItem(
                    "storeId"
                );

        }


        let storeUid =
            storeIdentifier;


        let allProducts = [];

        /* =====================================================
           ESCAPE HTML
        ===================================================== */

        function escapeHtml(value) {

            return String(
                value ?? ""
            )

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

        }


        /* =====================================================
           NORMALIZE SOCIAL URL
        ===================================================== */

        function normalizeSocialUrl(
            value,
            type
        ) {

            if (
                !value
            ) {

                return "";

            }


            let url =
                String(
                    value
                ).trim();


            if (!url) {

                return "";

            }


            /*
             * إذا كان الرابط مكتوبًا كاملًا
             * نستخدمه مباشرة.
             */

            if (
                /^https?:\/\//i.test(
                    url
                )
            ) {

                return url;

            }


            /*
             * WhatsApp
             */

            if (
                type === "whatsapp"
            ) {

                let number =
                    url.replace(
                        /[^0-9+]/g,
                        ""
                    );


                number =
                    number.replace(
                        /^\+/,
                        ""
                    );


                /*
                 * الجزائر:
                 * إذا كان الرقم 05 / 06 / 07
                 * نضيف 213.
                 */

                if (
                    /^0[567]/.test(
                        number
                    )
                ) {

                    number =
                        "213" +
                        number.substring(
                            1
                        );

                }


                return
                    "https://wa.me/" +
                    number;

            }


            /*
             * Instagram
             */

            if (
                type === "instagram"
            ) {

                return
                    "https://instagram.com/" +
                    url.replace(
                        /^@/,
                        ""
                    );

            }


            /*
             * TikTok
             */

            if (
                type === "tiktok"
            ) {

                return
                    "https://www.tiktok.com/@" +
                    url.replace(
                        /^@/,
                        ""
                    );

            }


            /*
             * Telegram
             */

            if (
                type === "telegram"
            ) {

                return
                    "https://t.me/" +
                    url.replace(
                        /^@/,
                        ""
                    );

            }


            /*
             * Facebook
             */

            if (
                type === "facebook"
            ) {

                return
                    "https://facebook.com/" +
                    url.replace(
                        /^@/,
                        ""
                    );

            }


            /*
             * YouTube
             */

            if (
                type === "youtube"
            ) {

                return
                    "https://youtube.com/" +
                    url.replace(
                        /^@/,
                        ""
                    );

            }


            /*
             * X / Twitter
             */

            if (
                type === "twitter"
            ) {

                return
                    "https://x.com/" +
                    url.replace(
                        /^@/,
                        ""
                    );

            }


            return url;

        }


        /* =====================================================
           ADD SOCIAL LINK
        ===================================================== */

        function addSocialLink(
            type,
            label,
            value,
            icon
        ) {

            const url =
                normalizeSocialUrl(
                    value,
                    type
                );


            if (!url) {

                return;

            }


            const link =
                document.createElement(
                    "a"
                );


            link.className =
                "social-link";


            link.href =
                url;


            link.target =
                "_blank";


            link.rel =
                "noopener noreferrer";


            link.innerHTML = `

                <svg>

                    <use href="#icon-${icon}"></use>

                </svg>

                <span>
                    ${escapeHtml(label)}
                </span>

            `;


            socialLinks.appendChild(
                link
            );

        }


        /* =====================================================
           LOAD SOCIAL MEDIA
        ===================================================== */

        function renderSocialLinks() {

            socialLinks.innerHTML =
                "";


            if (
                !currentStore
            ) {

                socialLinks.innerHTML = `

                    <div class="social-empty">

                        لا توجد معلومات تواصل حاليًا.

                    </div>

                `;

                return;

            }


            /*
             * WhatsApp
             */

            addSocialLink(

                "whatsapp",

                "واتساب",

                currentStore.whatsapp
                ||
                currentStore.whatsApp
                ||
                currentStore.whatsappNumber,

                "whatsapp"

            );


            /*
             * Facebook
             */

            addSocialLink(

                "facebook",

                "Facebook",

                currentStore.facebook
                ||
                currentStore.facebookUrl
                ||
                currentStore.facebookLink,

                "facebook"

            );


            /*
             * Instagram
             */

            addSocialLink(

                "instagram",

                "Instagram",

                currentStore.instagram
                ||
                currentStore.instagramUrl
                ||
                currentStore.instagramLink,

                "instagram"

            );


            /*
             * TikTok
             */

            addSocialLink(

                "tiktok",

                "TikTok",

                currentStore.tiktok
                ||
                currentStore.tikTok
                ||
                currentStore.tiktokUrl
                ||
                currentStore.tiktokLink,

                "tiktok"

            );


            /*
             * YouTube
             */

            addSocialLink(

                "youtube",

                "YouTube",

                currentStore.youtube
                ||
                currentStore.youtubeUrl
                ||
                currentStore.youtubeLink,

                "youtube"

            );


            /*
             * Telegram
             */

            addSocialLink(

                "telegram",

                "Telegram",

                currentStore.telegram
                ||
                currentStore.telegramUrl
                ||
                currentStore.telegramLink,

                "telegram"

            );


            /*
             * X / Twitter
             */

            addSocialLink(

                "twitter",

                "X",

                currentStore.twitter
                ||
                currentStore.x
                ||
                currentStore.twitterUrl
                ||
                currentStore.xUrl,

                "x"

            );


            /*
             * الهاتف
             */

            const phone =
                currentStore.phone
                ||
                currentStore.phoneNumber
                ||
                currentStore.mobile;


            if (phone) {

                const phoneLink =
                    document.createElement(
                        "a"
                    );


                phoneLink.className =
                    "social-link";


                phoneLink.href =
                    "tel:" +
                    String(
                        phone
                    ).replace(
                        /\s/g,
                        ""
                    );


                phoneLink.innerHTML = `

                    <svg>

                        <use href="#icon-phone"></use>

                    </svg>

                    <span>
                        اتصل بنا
                    </span>

                `;


                socialLinks.appendChild(
                    phoneLink
                );

            }


            /*
             * إذا لم يوجد أي رابط
             */

            if (
                !socialLinks.children.length
            ) {

                socialLinks.innerHTML = `

                    <div class="social-empty">

                        لم يضف التاجر روابط التواصل بعد.

                    </div>

                `;

            }

        }


        /* =====================================================
           APPLY STORE THEME
        ===================================================== */

        function applyStoreTheme(theme) {

            const validThemes = [

                "orange",

                "blue",

                "green",

                "purple",

                "pink",

                "dark"

            ];


            theme =
                String(
                    theme || "orange"
                )
                .toLowerCase()
                .trim();


            if (
                !validThemes.includes(
                    theme
                )
            ) {

                theme =
                    "orange";

            }


            document.body.classList.remove(

                "theme-orange",

                "theme-blue",

                "theme-green",

                "theme-purple",

                "theme-pink",

                "theme-dark"

            );


            document.body.classList.add(
                "theme-" + theme
            );


            const themeColors = {

                orange: "#FFFFFF",

                blue: "#FFFFFF",

                green: "#FFFFFF",

                purple: "#FFFFFF",

                pink: "#FFFFFF",

                dark: "#0A1726"

            };


            themeColorMeta.content =
                themeColors[
                    theme
                ];


            localStorage.setItem(
                "gglamStoreTheme",
                theme
            );

        }


        /* =====================================================
           INITIAL THEME
        ===================================================== */

        const savedStoreTheme =
            localStorage.getItem(
                "gglamStoreTheme"
            )
            ||
            "orange";


        applyStoreTheme(
            savedStoreTheme
        );

        ===================================================== */

            const encodedStore =
                encodeURIComponent(

        /* =====================================================
           LOAD STORE
        ===================================================== */

        async function loadStore() {

            try {


                if (
                    !storeIdentifier
                ) {

                    showStoreError(
                        "لم يتم تحديد المتجر."
                    );

                    return false;

                }


                const storeRef =
                    doc(
                        db,
                        "stores",
                        storeIdentifier
                    );


                const storeSnap =
                    await getDoc(
                        storeRef
                    );


                if (
                    !storeSnap.exists()
                ) {

                    showStoreError(
                        "المتجر غير موجود."
                    );

                    return false;

                }


                currentStore =
                    storeSnap.data();


                storeUid =
                    storeSnap.id;


                localStorage.setItem(
                    "storeId",
                    storeUid
                );


                /* =================================================
                   STATUS
                ================================================= */

                const status =
                    String(
                        currentStore.status
                        ||
                        "approved"
                    )
                    .toLowerCase()
                    .trim();


                if (

                    status !== "approved"

                    &&

                    status !== "active"

                ) {

                    showStoreError(
                        "هذا المتجر غير متاح حاليًا."
                    );

                    return false;

                }


                /* =================================================
                   STORE THEME
                ================================================= */

                const storeTheme =
                    String(
                        currentStore.theme
                        ||
                        "orange"
                    )
                    .toLowerCase()
                    .trim();


                applyStoreTheme(
                    storeTheme
                );


                /* =================================================
                   STORE NAME
                ================================================= */

                const name =
                    currentStore.storeName
                    ||
                    currentStore.name
                    ||
                    "G-Glam";


                storeNameElement.textContent =
                    name;


                headerStoreName.textContent =
                    name;


                document.title =
                    name +
                    " | المتجر";


                /* =================================================
                   DESCRIPTION
                ================================================= */

                storeDescriptionElement.textContent =

                    currentStore.description
                    ||
                    "Bienvenue dans notre boutique";


                /* =================================================
                   STORE IMAGE
                ================================================= */

                const image =

                    currentStore.storeImage
                    ||
                    currentStore.image
                    ||
                    currentStore.logo
                    ||
                    currentStore.photoURL
                    ||
                    "";


                if (image) {

                    storeImage.src =
                        image;

                    storeImage.style.display =
                        "block";

                }

                else {

                    storeImage.style.display =
                        "none";

                }


                /* =================================================
                   STORE COVER
                ================================================= */

                const cover =

                    currentStore.storeCoverImage
                    ||
                    currentStore.storeCover
                    ||
                    currentStore.coverImage
                    ||
                    currentStore.cover
                    ||
                    currentStore.banner
                    ||
                    currentStore.storeBanner
                    ||
                    "";


                if (cover) {

                    storeCoverImage.src =
                        cover;

                    storeCover.style.display =
                        "block";

                }

                else {

                    storeCover.style.display =
                        "none";

                }


                /* =================================================
                   SOCIAL MEDIA
                ================================================= */

                renderSocialLinks();


                updateNavigationLinks();


                return true;

            }


            catch (error) {

                console.error(
                    "STORE LOAD ERROR:",
                    error
                );


                showStoreError(
                    "حدث خطأ أثناء تحميل المتجر."
                );


                return false;

            }

        }


        /* =====================================================
           LOAD PRODUCTS
        ===================================================== */

        async function loadProducts() {

            try {


                productsContainer.innerHTML = `

                    <div class="loading">

                        <svg>

                            <use href="#icon-loader"></use>

                        </svg>

                        <div>
                            جاري تحميل المنتجات...
                        </div>

                    </div>

                `;


                let snapshot;


                try {

                    const productsQuery =
                        query(

                            collection(
                                db,
                                "products"
                            ),

                            where(
                                "ownerUid",
                                "==",
                                storeUid
                            )

                        );


                    snapshot =
                        await getDocs(
                            productsQuery
                        );

                }


                catch (error) {

                    console.log(
                        "ownerUid query failed",
                        error
                    );


                    const oldQuery =
                        query(

                            collection(
                                db,
                                "products"
                            ),

                            where(
                                "storeId",
                                "==",
                                storeUid
                            )

                        );


                    snapshot =
                        await getDocs(
                            oldQuery
                        );

                }


                allProducts = [];


                snapshot.forEach(
                    productDoc => {

                        allProducts.push({

                            id:
                                productDoc.id,

                            ...productDoc.data()

                        });

                    }
                );


                renderProducts(
                    allProducts
                );

            }


            catch (error) {

                console.error(
                    "PRODUCTS ERROR:",
                    error
                );


                productsContainer.innerHTML = `

                    <div class="empty">

                        <div>
                            حدث خطأ أثناء تحميل المنتجات.
                        </div>

                    </div>

                `;

            }

        }


        /* =====================================================
           RENDER PRODUCTS
        ===================================================== */

        function renderProducts(products) {

            productsContainer.innerHTML =
                "";


            if (
                !products.length
            ) {

                productsContainer.innerHTML = `

                    <div class="empty">

                        <svg class="empty-icon">

                            <use href="#icon-bag"></use>

                        </svg>

                        <h2>
                            لا توجد منتجات
                        </h2>

                        <p
                            style="
                                margin-top:8px;
                            "
                        >
                            لا توجد منتجات في هذا المتجر حاليًا.
                        </p>

                    </div>

                `;

                return;

            }


            products.forEach(
                product => {


                    const image =

                        product.image

                        ||

                        (

                            Array.isArray(
                                product.images
                            )

                            &&

                            product.images.length

                            ?

                            product.images[0]

                            :

                            ""

                        );


                    const name =
                        product.name
                        ||
                        "منتج";


                    const price =
                        Number(
                            product.price ||
                            0
                        );


                    /*
                     * المخزون لا يظهر للمستخدم.
                     * نستخدمه فقط لتعطيل الزر إذا كان صفرًا.
                     */

                    const stock =
                        Number(
                            product.stock ??
                            0
                        );


                    const outOfStock =
                        stock <= 0;


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "card";


                    card.innerHTML = `

                        <img

                            src="${escapeHtml(
                                image
                            )}"

                            alt="${escapeHtml(
                                name
                            )}"

                            onerror="
                                this.style.display='none';
                            "

                        >


                        <div class="card-content">


                            <h3>

                                ${escapeHtml(
                                    name
                                )}

                            </h3>


                            <div class="price">

                                ${price} DA

                            </div>


                            <button
                                class="details-btn"
                                type="button"
                            >

                                عرض المنتج

                            </button>


                            <button
                                class="add-btn"
                                type="button"

                                ${
                                    outOfStock
                                        ? "disabled"
                                        : ""
                                }
                            >

                                ${
                                    outOfStock
                                        ? "غير متوفر"
                                        : "أضف إلى السلة"
                                }

                            </button>


                        </div>

                    `;


                    /* =================================================
                       DETAILS
                    ================================================= */

                    card
                        .querySelector(
                            ".details-btn"
                        )
                        .addEventListener(
                            "click",
                            function() {

                                window.location.href =

                                    "product.html?id=" +

                                    encodeURIComponent(
                                        product.id
                                    )

                                    +

                                    "&store=" +

                                    encodeURIComponent(
                                        storeUid
                                    );

                            }
                        );


                    /* =================================================
                       ADD TO CART
                    ================================================= */

                    const addButton =
                        card.querySelector(
                            ".add-btn"
                        );


                    if (
                        !outOfStock
                    ) {

                        addButton.addEventListener(
                            "click",
                            function() {

                                addToCart(
                                    product
                                );

                            }
                        );

                    }


                    productsContainer.appendChild(
                        card
                    );

                }
            );

        }


        /* =====================================================
           ADD TO CART
        ===================================================== */

        function addToCart(product) {

            let cart =

                JSON.parse(
                    localStorage.getItem(
                        "cart"
                    )
                )

                ||

                [];


            const otherStoreItems =

                cart.filter(
                    item =>

                        item.storeUid

                        &&

                        item.storeUid !==
                        storeUid

                );


            if (
                otherStoreItems.length
            ) {

                const confirmChange =
                    confirm(

                        "السلة تحتوي منتجات من متجر آخر.\n\n" +

                        "هل تريد إفراغ السلة والشراء من هذا المتجر؟"

                    );


                if (
                    !confirmChange
                ) {

                    return;

                }


                cart = [];

            }


            const existing =

                cart.find(
                    item =>

                        item.id ===
                        product.id

                        &&

                        item.storeUid ===
                        storeUid

                );


            if (
                existing
            ) {

                existing.quantity +=
                    1;

            }


            else {

                cart.push({

                    id:
                        product.id,

                    name:
                        product.name,

                    price:
                        Number(
                            product.price ||
                            0
                        ),

                    image:

                        product.image

                        ||

                        (

                            Array.isArray(
                                product.images
                            )

                            &&

                            product.images.length

                            ?

                            product.images[0]

                            :

                            ""

                        ),

                    quantity:
                        1,

                    color:
                        "بدون لون",

                    storeUid:
                        storeUid,

                    storeName:

                        currentStore?.storeName

                        ||

                        currentStore?.name

                        ||

                        "G-Glam"

                });

            }


            localStorage.setItem(

                "cart",

                JSON.stringify(
                    cart
                )

            );


            localStorage.setItem(
                "cartStoreId",
                storeUid
            );


            updateCartCount();


            alert(
                "تمت إضافة المنتج إلى السلة"
            );

        }


        /* =====================================================
           CART COUNT
        ===================================================== */

        function updateCartCount() {

            let cart =

                JSON.parse(
                    localStorage.getItem(
                        "cart"
                    )
                )

                ||

                [];


            const storeCart =

                cart.filter(
                    item =>

                        item.storeUid ===
                        storeUid

                );


            let total =
                0;


            storeCart.forEach(
                item => {

                    total +=

                        Number(
                            item.quantity ||
                            0
                        );

                }
            );


            cartCount.textContent =
                total;

        }


        /* =====================================================
           SEARCH
        ===================================================== */

        searchInput.addEventListener(
            "input",
            function() {


                const keyword =

                    this.value
                        .toLowerCase()
                        .trim();


                if (
                    !keyword
                ) {

                    renderProducts(
                        allProducts
                    );

                    return;

                }


                const filtered =

                    allProducts.filter(
                        product => {


                            const name =

                                String(
                                    product.name ||
                                    ""
                                )
                                .toLowerCase();


                            const description =

                                String(
                                    product.description ||
                                    ""
                                )
                                .toLowerCase();


                            return (

                                name.includes(
                                    keyword
                                )

                                ||

                                description.includes(
                                    keyword
                                )

                            );

                        }
                    );


                renderProducts(
                    filtered
                );

            }
        );


        /* =====================================================
           CART BUTTON
        ===================================================== */

        document
            .getElementById(
                "cartButton"
            )
            .addEventListener(
                "click",
                function() {

                    window.location.href =

                        "cart.html?store=" +

                        encodeURIComponent(
                            storeUid
                        );

                }
            );


        /* =====================================================
           SIDEBAR
        ===================================================== */

        const sidebar =
            document.getElementById(
                "sidebar"
            );


        const overlay =
            document.getElementById(
                "overlay"
            );


        const menuBtn =
            document.getElementById(
                "menuBtn"
            );


        const contactLink =
            document.getElementById(
                "contactLink"
            );


        menuBtn.addEventListener(
            "click",
            function() {

                sidebar.classList.add(
                    "active"
                );


                overlay.classList.add(
                    "active"
                );

            }
        );


        overlay.addEventListener(
            "click",
            function() {

                sidebar.classList.remove(
                    "active"
                );


                overlay.classList.remove(
                    "active"
                );

            }
        );


        /*
         * عند الضغط على "اتصل بنا":
         * يغلق القائمة ثم ينتقل إلى
         * قسم التواصل أسفل المتجر.
         */

        contactLink.addEventListener(
            "click",
            function(event) {

                event.preventDefault();


                sidebar.classList.remove(
                    "active"
                );


                overlay.classList.remove(
                    "active"
                );


                const socialSection =
                    document.getElementById(
                        "socialSection"
                    );


                if (
                    socialSection
                ) {

                    socialSection.scrollIntoView({

                        behavior:
                            "smooth",

                        block:
                            "start"

                    });

                }

            }
        );


        /*
         * إغلاق القائمة بعد الضغط
         * على الرئيسية أو السلة.
         */

        document
            .querySelectorAll(
                ".sidebar a:not(#contactLink)"
            )
            .forEach(
                function(link) {

                    link.addEventListener(
                        "click",
                        function() {

                            sidebar.classList.remove(
                                "active"
                            );


                            overlay.classList.remove(
                                "active"
                            );

                        }
                    );

                }
            );


        /* =====================================================
           STORE ERROR
        ===================================================== */

        function showStoreError(message) {

            headerStoreName.textContent =
                "G-Glam";


            productsContainer.innerHTML = `

                <div class="empty">

                    <svg class="empty-icon">

                        <use href="#icon-store"></use>

                    </svg>


                    <h2>

                        ${escapeHtml(
                            message
                        )}

                    </h2>


                    <p
                        style="
                            margin-top:10px;
                        "
                    >

                        تحقق من رابط المتجر.

                    </p>

                </div>

            `;


            socialLinks.innerHTML = `

                <div class="social-empty">

                    لا توجد معلومات تواصل.

                </div>

            `;

        }


        /* =====================================================
           START
        ===================================================== */

        updateCartCount();


        const storeLoaded =
            await loadStore();


        if (
            storeLoaded
        ) {

            updateCartCount();

            await loadProducts();

        }

    </script>


    <!-- =====================================================
         SERVICE WORKER
    ===================================================== -->

    <script>

        if (
            "serviceWorker" in navigator
        ) {

            window.addEventListener(
                "load",
                function() {

                    navigator.serviceWorker

                        .register(
                            "service-worker.js"
                        )

                        .then(
                            function() {

                                console.log(
                                    "G-Glam PWA جاهز"
                                );

                            }
                        )

                        .catch(
                            function(error) {

                                console.log(
                                    "خطأ في PWA:",
                                    error
                                );

                            }
                        );

                }
            );

        }

    </script>


</body>

</html>
