<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G-Glam</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f8f8f8;
    margin:0;
    padding:0;
}

header{
    background:#000;
    color:white;
    text-align:center;
    padding:15px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    padding:15px;
}

.card{
    background:white;
    padding:10px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
    text-align:center;
}

.card img{
    width:100%;
    border-radius:10px;
}

.card a{
    text-decoration:none;
    color:black;
}

button{
    background:#ff4fc3;
    color:white;
    border:none;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
    width:100%;
    margin-top:8px;
}

.details-btn{
    background:black;
}

.cart-btn{
    display:block;
    margin:15px;
    text-align:center;
    background:black;
    color:white;
    padding:12px;
    text-decoration:none;
    border-radius:8px;
}

/* القائمة الجانبية */

.drawer{
    position:fixed;
    top:0;
    right:-350px;
    width:320px;
    height:100%;
    background:white;
    padding:20px;
    box-shadow:-2px 0 10px rgba(0,0,0,.2);
    transition:.3s;
    z-index:9999;
    overflow:auto;
}

.drawer select,
.drawer input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:8px;
    box-sizing:border-box;
}

.close-btn{
    background:#555;
}

</style>

</head>

<body>

<header>
<h1>G-Glam</h1>
</header>

<a class="cart-btn" href="cart.html">
🛒 عرض السلة
</a>

<div class="products">

<!-- المنتج الأول -->

<div class="card">

<a href="concealer-rubyrose.html">

<img src="images - 2026-07-30T173056.527.jpeg"
alt="Concealer Ruby Rose">

<h3>
Concealer Ruby Rose
</h3>

</a>

<p>
150 DA
</p>

<a href="concealer-rubyrose.html">

<button class="details-btn">
عرض المنتج
</button>

</a>

<button onclick="openDrawer()">
أضف إلى السلة
</button>

</div>

<!-- المنتج الثاني -->

<div class="card">

<a href="lipgloss.html">

<img src="1785433980071.png"
alt="Lip Gloss">

<h3>
Lip Gloss
</h3>

</a>

<p>
250 DA
</p>

<a href="lipgloss.html">

<button class="details-btn">
عرض المنتج
</button>

</a>

<button onclick="addToCart('Lip Gloss',250)">
أضف إلى السلة
</button>

</div>

<!-- المنتج الثالث -->

<div class="card">

<a href="pencilcase.html">

<img src="1785499182902.png"
alt="مقلمة مدرسية">

<h3>
مقلمة مدرسية
</h3>

</a>

<p>
500 DA
</p>

<a href="pencilcase.html">

<button class="details-btn">
عرض المنتج
</button>

</a>

<button onclick="window.location.href='pencilcase.html'">
أضف إلى السلة
</button>

</div>

</div>

<!-- القائمة الجانبية الخاصة بالكونسيلر -->

<div id="drawer" class="drawer">

<h2>Concealer Ruby Rose</h2>

<p>السعر: 150 DA</p>

<label><b>اختيار اللون:</b></label>

<select id="drawerColor">
<option>01 Beige</option>
<option>02 Natural</option>
<option>03 Honey</option>
</select>

<label><b>الكمية:</b></label>

<input
type="number"
id="drawerQty"
value="1"
min="1">

<button onclick="addDrawerToCart()">
🛒 إضافة إلى السلة
</button>

<button
class="close-btn"
onclick="closeDrawer()">
إغلاق
</button>

</div>

<script>

function openDrawer(){

document.getElementById("drawer").style.right = "0";

}

function closeDrawer(){

document.getElementById("drawer").style.right = "-350px";

}

function addDrawerToCart(){

let color =
document.getElementById("drawerColor").value;

let quantity =
parseInt(document.getElementById("drawerQty").value);

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

cart.push({
name:"Concealer Ruby Rose",
price:150,
color:color,
quantity:quantity
});

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

alert("تمت إضافة المنتج إلى السلة");

closeDrawer();

}

function addToCart(name, price){

let cart =
JSON.parse(localStorage.getItem('cart')) || [];

cart.push({
name:name,
price:price
});

localStorage.setItem(
'cart',
JSON.stringify(cart)
);

alert('تمت إضافة ' + name + ' إلى السلة');

}

</script>

</body>
</html>
