    <style>
        :root {
            --bg:#F4F4F4;
            --header:#FFFFFF;
            --card:#FFFFFF;
            --card-light:#FAFAFA;
            --text:#374151;
            --muted:#6B7280;
            --border:#E5E7EB;
            --accent:#F47B20;
            --accent-dark:#D96610;
            --input:#FFFFFF;
            --input-text:#374151;
            --sidebar:#FFFFFF;
            --sidebar-hover:#FFF7ED;
            --danger:#EF4444;
            --shadow: 0 8px 25px rgba(0,0,0,.10);
            --theme-gradient: linear-gradient(135deg, #F47B20, #D96610);
        }

        body.theme-orange { --bg:#F4F4F4; --header:#FFFFFF; --card:#FFFFFF; --card-light:#FAFAFA; --text:#374151; --muted:#6B7280; --border:#E5E7EB; --accent:#F47B20; --accent-dark:#D96610; --input:#FFFFFF; --input-text:#374151; --sidebar:#FFFFFF; --sidebar-hover:#FFF7ED; }
        body.theme-blue { --bg:#EEF5FF; --header:#FFFFFF; --card:#FFFFFF; --card-light:#F8FBFF; --text:#1E3A5F; --muted:#64748B; --border:#D8E5F5; --accent:#1769AA; --accent-dark:#12558B; --input:#FFFFFF; --input-text:#1E3A5F; --sidebar:#FFFFFF; --sidebar-hover:#EFF6FF; }
        body.theme-green { --bg:#EFFBF4; --header:#FFFFFF; --card:#FFFFFF; --card-light:#F8FFFA; --text:#14532D; --muted:#64748B; --border:#D9F0E1; --accent:#198754; --accent-dark:#146C43; --input:#FFFFFF; --input-text:#14532D; --sidebar:#FFFFFF; --sidebar-hover:#F0FDF4; }
        body.theme-purple { --bg:#F7F0FF; --header:#FFFFFF; --card:#FFFFFF; --card-light:#FCF9FF; --text:#4C1D95; --muted:#6B7280; --border:#E8DDF5; --accent:#7B3FC6; --accent-dark:#632FA4; --input:#FFFFFF; --input-text:#4C1D95; --sidebar:#FFFFFF; --sidebar-hover:#F5F3FF; }
        body.theme-pink { --bg:#FFF1F5; --header:#FFFFFF; --card:#FFFFFF; --card-light:#FFF8FA; --text:#881337; --muted:#6B7280; --border:#F3D5DF; --accent:#D94F87; --accent-dark:#B83E70; --input:#FFFFFF; --input-text:#881337; --sidebar:#FFFFFF; --sidebar-hover:#FFF1F5; }
        body.theme-dark { --bg:#07111F; --header:#0A1726; --card:#0D1B2A; --card-light:#132337; --text:#F3F4F6; --muted:#9AA9BB; --border:#223449; --accent:#F47B20; --accent-dark:#D96610; --input:#172536; --input-text:#F3F4F6; --sidebar:#0D1928; --sidebar-hover:#152437; }
        body.theme-red { --bg:#FFF5F5; --header:#FFFFFF; --card:#FFFFFF; --card-light:#FFF9F9; --text:#7F1D1D; --muted:#6B7280; --border:#F3D4D4; --accent:#E63946; --accent-dark:#C92F3B; --input:#FFFFFF; --input-text:#7F1D1D; --sidebar:#FFFFFF; --sidebar-hover:#FFF1F2; }
        body.theme-teal { --bg:#EFFCFE; --header:#FFFFFF; --card:#FFFFFF; --card-light:#F7FEFF; --text:#164E63; --muted:#64748B; --border:#D4F1F5; --accent:#00B4D8; --accent-dark:#0096B7; --input:#FFFFFF; --input-text:#164E63; --sidebar:#FFFFFF; --sidebar-hover:#ECFEFF; }
        body.theme-gold { --bg:#FAF8F0; --header:#FFFFFF; --card:#FFFFFF; --card-light:#FFFDF5; --text:#5F4B12; --muted:#786F5A; --border:#EDE3BE; --accent:#D4AF37; --accent-dark:#B8941F; --input:#FFFFFF; --input-text:#5F4B12; --sidebar:#FFFFFF; --sidebar-hover:#FFF9E6; }
        body.theme-luxury { --bg:#111111; --header:#191919; --card:#1C1C1C; --card-light:#242424; --text:#F5F5F5; --muted:#B8B8B8; --border:#383838; --accent:#D4AF37; --accent-dark:#B8941F; --input:#222222; --input-text:#F5F5F5; --sidebar:#181818; --sidebar-hover:#292929; }
        body.theme-sunset { --bg:#FFF6F1; --header:#FFFFFF; --card:#FFFFFF; --card-light:#FFF9F6; --text:#4A2530; --muted:#75636A; --border:#F2D8CC; --accent:#FD1D1D; --accent-dark:#D91313; --input:#FFFFFF; --input-text:#4A2530; --sidebar:#FFFFFF; --sidebar-hover:#FFF0E8; }
        body.theme-emerald { --bg:#EFFAF5; --header:#FFFFFF; --card:#FFFFFF; --card-light:#F6FCF9; --text:#064E3B; --muted:#64748B; --border:#D4EDE3; --accent:#0F5132; --accent-dark:#0A3D26; --input:#FFFFFF; --input-text:#064E3B; --sidebar:#FFFFFF; --sidebar-hover:#ECFDF5; }
        body.theme-navy { --bg:#EEF2F7; --header:#FFFFFF; --card:#FFFFFF; --card-light:#F7F9FC; --text:#0B1F3A; --muted:#64748B; --border:#D7E0EA; --accent:#0B1F3A; --accent-dark:#07152A; --input:#FFFFFF; --input-text:#0B1F3A; --sidebar:#FFFFFF; --sidebar-hover:#EEF3F8; }
        body.theme-brown { --bg:#F8F3F0; --header:#FFFFFF; --card:#FFFFFF; --card-light:#FCF8F6; --text:#4E342E; --muted:#75645F; --border:#E7D8D1; --accent:#795548; --accent-dark:#5D4037; --input:#FFFFFF; --input-text:#4E342E; --sidebar:#FFFFFF; --sidebar-hover:#F5ECE8; }
        body.theme-rose { --bg:#FFF1F7; --header:#FFFFFF; --card:#FFFFFF; --card-light:#FFF8FB; --text:#831843; --muted:#75616C; --border:#F1D4E1; --accent:#BE185D; --accent-dark:#9D174D; --input:#FFFFFF; --input-text:#831843; --sidebar:#FFFFFF; --sidebar-hover:#FFF0F6; }
        body.theme-indigo { --bg:#EEF2FF; --header:#FFFFFF; --card:#FFFFFF; --card-light:#F7F8FF; --text:#312E81; --muted:#636A8A; --border:#D8DDF5; --accent:#4338CA; --accent-dark:#3730A3; --input:#FFFFFF; --input-text:#312E81; --sidebar:#FFFFFF; --sidebar-hover:#EEF2FF; }
        body.theme-custom-solid { --bg:#F7F7F7; --header:#FFFFFF; --card:#FFFFFF; --card-light:#FAFAFA; --text:#374151; --muted:#6B7280; --border:#E5E7EB; --input:#FFFFFF; --input-text:#374151; --sidebar:#FFFFFF; }
        body.theme-custom-gradient { --bg:#F7F7F7; --header:#FFFFFF; --card:#FFFFFF; --card-light:#FAFAFA; --text:#374151; --muted:#6B7280; --border:#E5E7EB; --input:#FFFFFF; --input-text:#374151; --sidebar:#FFFFFF; --sidebar-hover:#F7F7F7; }

        body.theme-custom-gradient .logo span,
        body.theme-custom-gradient .price {
            background:var(--theme-gradient);
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
        }

        body.theme-custom-gradient .add-btn,
        body.theme-custom-gradient .floating-cart { background:var(--theme-gradient); }
        body.theme-custom-gradient .cart-count { background:var(--accent); }
        body.theme-custom-gradient .add-btn:hover,
        body.theme-custom-gradient .floating-cart:hover { filter:brightness(.92); }
        body.theme-custom-gradient .details-btn:hover { background:var(--theme-gradient); color:#FFFFFF; }
        body.theme-custom-gradient .menu-btn:hover,
        body.theme-custom-gradient .cart-icon:hover { color:var(--accent); }
        body.theme-custom-gradient .card:hover { border-color:var(--accent); }
        body.theme-custom-gradient .social-link:hover { background:var(--theme-gradient); border-color:transparent; color:#FFFFFF; }
        body.theme-custom-solid .logo span,
        body.theme-custom-solid .price { color:var(--accent); }
        body.theme-custom-solid .card:hover { border-color:var(--accent); }

        * { margin:0; padding:0; box-sizing:border-box; font-family:"Tajawal",Arial,sans-serif; }
        html { scroll-behavior:smooth; }
        body { min-height:100vh; background:var(--bg); color:var(--text); padding-bottom:95px; transition:background .25s ease,color .25s ease; }
        button, input { font-family:"Tajawal",Arial,sans-serif; }

        header {
            height:70px; width:100%; display:flex; align-items:center; justify-content:space-between; padding:0 24px;
            background:var(--header); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:1000;
            transition:background .25s ease,border-color .25s ease;
        }
        .logo { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; align-items:center; justify-content:center; width:max-content; max-width:55%; text-align:center; }
        .logo span { color:var(--accent); font-size:27px; line-height:1.2; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .menu-btn, .cart-icon { width:42px; height:42px; display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; color:var(--text); border-radius:10px; transition:background .2s,color .2s; }
        .menu-btn:hover, .cart-icon:hover { background:var(--sidebar-hover); color:var(--accent); }
        .menu-btn svg, .cart-icon svg { width:29px; height:29px; }
        .cart-count { position:absolute; top:-2px; right:-3px; width:21px; height:21px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--accent); color:#FFFFFF; font-size:11px; font-weight:800; border:2px solid var(--header); }

        .store-section { width:100%; position:relative; }
        .store-cover { width:100%; height:285px; overflow:hidden; background:var(--card-light); display:none; }
        .store-cover img { width:100%; height:100%; object-fit:cover; object-position:center; display:block; }
        .store-info { text-align:center; padding:0 20px 32px; position:relative; }
        .store-banner-image { width:145px; height:145px; margin:-72px auto 18px; position:relative; z-index:5; }
        .store-banner-image img { width:145px; height:145px; border-radius:50%; object-fit:cover; display:block; background:var(--card); border:5px solid var(--bg); box-shadow:0 7px 22px rgba(0,0,0,.25); }
        .store-banner h1 { font-size:34px; line-height:1.3; font-weight:800; color:var(--text); margin-bottom:4px; }
        .store-banner p { font-size:16px; color:var(--muted); line-height:1.8; }

        .search-section { width:100%; max-width:1100px; margin:0 auto 14px; padding:0 25px; }
        .search-box { position:relative; width:100%; }
        .search-box input { width:100%; height:52px; padding:0 22px 0 55px; outline:none; border-radius:30px; background:var(--input); color:var(--input-text); font-size:15px; border:1px solid var(--border); transition:.2s; }
        .search-box input::placeholder { color:var(--muted); }
        .search-box input:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent); }
        .search-icon { position:absolute; left:18px; top:50%; transform:translateY(-50%); width:23px; height:23px; color:var(--muted); pointer-events:none; }

        .categories-section { width:100%; max-width:1100px; margin:0 auto 20px; padding:0 25px; }
        .categories-title { display:flex; align-items:center; justify-content:space-between; margin-bottom:11px; }
        .categories-title h2 { font-size:19px; font-weight:800; color:var(--text); }
        .categories-scroll { display:flex; align-items:center; gap:9px; overflow-x:auto; overflow-y:hidden; padding:3px 2px 8px; scrollbar-width:thin; }
        .categories-scroll::-webkit-scrollbar { height:5px; }
        .categories-scroll::-webkit-scrollbar-track { background:transparent; }
        .categories-scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:10px; }
        .category-btn { flex:0 0 auto; min-width:82px; height:40px; padding:0 17px; border:1px solid var(--border); border-radius:22px; background:var(--card); color:var(--text); font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; transition:.2s ease; }
        .category-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--sidebar-hover); }
        .category-btn.active { background:var(--accent); border-color:var(--accent); color:#FFFFFF; box-shadow:0 4px 12px rgba(0,0,0,.10); }

        .products { width:100%; max-width:1100px; margin:0 auto; padding:0 25px; display:grid; grid-template-columns:repeat(5,1fr); gap:14px; }
        .card { min-width:0; background:var(--card); border:1px solid var(--border); border-radius:10px; overflow:hidden; box-shadow:0 5px 16px rgba(0,0,0,.08); transition:transform .2s ease, border-color .2s ease, background .25s ease; }
        .card:hover { transform:translateY(-3px); border-color:var(--accent); }
        .card img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:var(--card-light); }
        .card-content { padding:11px 12px 13px; }
        .card h3 { color:var(--text); font-size:15px; font-weight:700; line-height:1.55; height:47px; overflow:hidden; margin-bottom:3px; text-align:center; }
        .price { color:var(--accent); font-size:17px; font-weight:800; text-align:center; margin-bottom:9px; }
        .details-btn { width:100%; height:35px; border:1.5px solid var(--accent); border-radius:7px; background:transparent; color:var(--text); font-size:13px; font-weight:700; cursor:pointer; margin-bottom:8px; transition:.2s; }
        .details-btn:hover { background:var(--accent); color:#FFFFFF; }
        .add-btn { width:100%; height:35px; border:none; border-radius:7px; background:var(--accent); color:#FFFFFF; font-size:13px; font-weight:800; cursor:pointer; transition:.2s; }
        .add-btn:hover { background:var(--accent-dark); }
        .add-btn:disabled { background:#9CA3AF; color:#E5E7EB; cursor:not-allowed; }

        .loading { grid-column:1/-1; min-height:250px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--muted); text-align:center; }
        .loading svg { width:36px; height:36px; margin-bottom:12px; animation:spin 1s linear infinite; }
        @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }

        .empty { grid-column:1/-1; text-align:center; padding:55px 20px; color:var(--muted); background:var(--card); border:1px solid var(--border); border-radius:15px; }
        .empty h2 { color:var(--text); margin-top:10px; }
        .empty-icon { width:50px; height:50px; color:var(--accent); }

        .social-section { width:100%; max-width:1100px; margin:45px auto 30px; padding:0 25px; scroll-margin-top:90px; }
        .social-box { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:28px 20px; text-align:center; box-shadow:0 5px 18px rgba(0,0,0,.06); }
        .social-title { color:var(--text); font-size:24px; font-weight:800; margin-bottom:7px; }
        .social-description { color:var(--muted); font-size:14px; margin-bottom:22px; }
        .social-links { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px; }
        .social-link { min-width:125px; min-height:48px; padding:10px 16px; display:inline-flex; align-items:center; justify-content:center; gap:9px; border:1px solid var(--border); border-radius:12px; background:var(--card-light); color:var(--text); text-decoration:none; font-size:14px; font-weight:700; transition:transform .2s ease, background .2s ease, border-color .2s ease, color .2s ease; }
        .social-link:hover { transform:translateY(-2px); border-color:var(--accent); color:var(--accent); background:var(--sidebar-hover); }
        .social-link svg { width:22px; height:22px; flex-shrink:0; }
        .social-empty { color:var(--muted); font-size:14px; padding:10px; }

        .floating-cart { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); width:calc(100% - 50px); max-width:540px; height:53px; background:var(--accent); color:#FFFFFF; text-decoration:none; border-radius:28px; display:flex; align-items:center; justify-content:center; gap:9px; font-size:16px; font-weight:800; box-shadow:0 8px 25px rgba(0,0,0,.18); z-index:900; transition:.2s; }
        .floating-cart:hover { background:var(--accent-dark); transform:translateX(-50%) translateY(-2px); }
        .floating-cart svg { width:22px; height:22px; }

        .sidebar { position:fixed; top:0; right:-300px; width:280px; height:100vh; background:var(--sidebar); border-left:1px solid var(--border); box-shadow:-5px 0 25px rgba(0,0,0,.25); z-index:2000; transition:right .3s ease, background .25s ease; padding-top:80px; }
        .sidebar.active { right:0; }
        .sidebar a { display:flex; align-items:center; gap:13px; padding:17px 25px; color:var(--text); text-decoration:none; border-bottom:1px solid var(--border); font-size:16px; transition:background .2s, color .2s; }
        .sidebar a:hover { background:var(--sidebar-hover); color:var(--accent); }
        .sidebar a svg { width:22px; height:22px; flex-shrink:0; }

        .overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:1900; }
        .overlay.active { display:block; }

        @media (max-width:900px) { .products { grid-template-columns:repeat(4,1fr); } }
        @media (max-width:700px) {
            header { height:64px; padding:0 16px; }
            .logo { max-width:55%; }
            .logo span { font-size:21px; }
            .menu-btn, .cart-icon { width:38px; height:38px; }
            .menu-btn svg, .cart-icon svg { width:26px; height:26px; }
            .store-cover { height:190px; }
            .store-banner-image { width:112px; height:112px; margin:-56px auto 15px; }
            .store-banner-image img { width:112px; height:112px; border-width:4px; }
            .store-info { padding:0 15px 25px; }
            .store-banner h1 { font-size:27px; }
            .store-banner p { font-size:14px; }
            .search-section { padding:0 15px; margin-bottom:10px; }
            .search-box input { height:48px; font-size:14px; }
            .categories-section { padding:0 15px; margin-bottom:15px; }
            .categories-title h2 { font-size:17px; }
            .category-btn { height:38px; min-width:76px; padding:0 14px; font-size:12px; }
            .products { grid-template-columns:repeat(2,1fr); gap:10px; padding:0 10px; }
            .card-content { padding:9px; }
            .card h3 { font-size:13px; height:42px; }
            .price { font-size:15px; }
            .details-btn, .add-btn { height:34px; font-size:12px; }
            .social-section { padding:0 15px; margin-top:35px; }
            .social-box { padding:24px 14px; }
            .social-title { font-size:21px; }
            .social-links { gap:9px; }
            .social-link { min-width:calc(50% - 5px); font-size:13px; padding:10px 8px; }
            .floating-cart { width:calc(100% - 30px); bottom:12px; }
        }
        @media (max-width:380px) {
            .store-cover { height:160px; }
            .logo span { font-size:18px; }
            .store-banner h1 { font-size:24px; }
            .card h3 { font-size:12px; }
            .card-content { padding:8px; }
            .details-btn, .add-btn { font-size:11px; }
            .social-link { min-width:100%; }
            .category-btn { font-size:11px; padding:0 12px; }
        }

        ::-webkit-scrollbar { width:7px; height:7px; }
        ::-webkit-scrollbar-track { background:var(--bg); }
        ::-webkit-scrollbar-thumb { background:#9CA3AF; border-radius:10px; }
        ::-webkit-scrollbar-thumb:hover { background:var(--accent); }
    </style>
</head>

// Pixels Logic
function initPixels(store) {

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function normalizeSocialUrl(value, type) {
    if (!value) return "";
    let url = String(value).trim();
    if (!url) return "";
    if (/^https?:\/\//i.test(url)) return url;

    if (type === "whatsapp") {
        let number = url.replace(/[^0-9+]/g, "").replace(/^\+/, "");
        if (/^0[567]/.test(number)) number = "213" + number.substring(1);
        return "https://wa.me/" + number;
    }
    if (type === "instagram") return "https://instagram.com/" + url.replace(/^@/, "");
    if (type === "tiktok") return "https://www.tiktok.com/@" + url.replace(/^@/, "");
    if (type === "telegram") return "https://t.me/" + url.replace(/^@/, "");
    if (type === "facebook") return "https://facebook.com/" + url.replace(/^@/, "");
    if (type === "youtube") return "https://youtube.com/" + url.replace(/^@/, "");
    if (type === "twitter") return "https://x.com/" + url.replace(/^@/, "");
    return url;
}

function addSocialLink(type, label, value, icon) {
    const url = normalizeSocialUrl(value, type);
    if (!url) return;
    const link = document.createElement("a");

    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.innerHTML = `

}

    addSocialLink("instagram", "Instagram", currentStore.instagram || currentStore.instagramUrl || currentStore.instagramLink, "instagram");
    addSocialLink("tiktok", "TikTok", currentStore.tiktok || currentStore.tikTok || currentStore.tiktokUrl || currentStore.tiktokLink, "tiktok");

}

// Color Utility Helpers
function normalizeHexColor(color) {
    if (typeof color !== "string") return null;
    let value = color.trim();
    if (!value) return null;
    if (!value.startsWith("#")) value = "#" + value;
    if (/^#[0-9a-fA-F]{3}$/.test(value)) {
        value = "#" + value[1] + value[1] + value[2] + value[2] + value[3] + value[3];
    }
    if (!/^#[0-9a-fA-F]{6}$/.test(value)) return null;
    return value.toUpperCase();
}

function hexToRgb(hex) {
    const value = normalizeHexColor(hex);
    if (!value) return null;
    return {
        r: parseInt(value.substring(1,3), 16),
        g: parseInt(value.substring(3,5), 16),
        b: parseInt(value.substring(5,7), 16)
    };
}

function rgbToHex(r,g,b) {
    const clamp = value => Math.max(0, Math.min(255, Math.round(value)));
    return "#" + [r,g,b].map(value => clamp(value).toString(16).padStart(2,"0")).join("").toUpperCase();
}

function darkenColor(hex, amount = 0.18) {
    const rgb = hexToRgb(hex);
    if (!rgb) return "#333333";
    return rgbToHex(rgb.r * (1 - amount), rgb.g * (1 - amount), rgb.b * (1 - amount));
}

function rgbaFromHex(hex, alpha = 0.08) {
    const rgb = hexToRgb(hex);
    if (!rgb) return `rgba(0,0,0,${alpha})`;
    return `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
}

// Apply Store Theme
function applyStoreTheme(themeOrStore) {
    const validThemes = ["orange","blue","green","purple","pink","dark","red","teal","gold","luxury","sunset","emerald","navy","brown","rose","indigo"];
    const oldThemeClasses = validThemes.map(t => "theme-" + t).concat(["theme-custom-solid", "theme-custom-gradient"]);

    document.body.classList.remove(...oldThemeClasses);
    document.body.style.removeProperty("--accent");
    document.body.style.removeProperty("--accent-dark");
    document.body.style.removeProperty("--theme-gradient");
    document.body.style.removeProperty("--sidebar-hover");

    const themeColorsMap = {
        orange:"#F47B20", blue:"#1769AA", green:"#198754", purple:"#7B3FC6",
        pink:"#D94F87", dark:"#0A1726", red:"#E63946", teal:"#00B4D8",
        gold:"#D4AF37", luxury:"#D4AF37", sunset:"#FD1D1D", emerald:"#0F5132",
        navy:"#0B1F3A", brown:"#795548", rose:"#BE185D", indigo:"#4338CA"
    };

    if (typeof themeOrStore === "string") {
        let theme = String(themeOrStore || "orange").toLowerCase().trim();
        if (!validThemes.includes(theme)) theme = "orange";
        document.body.classList.add("theme-" + theme);
        themeColorMeta.content = themeColorsMap[theme] || "#FFFFFF";
        localStorage.setItem("gglamStoreTheme", theme);
        localStorage.setItem("gglamThemeType", "legacy");
        return;
    }

    const store = themeOrStore || {};
    const themeType = String(store.themeType || "").toLowerCase().trim();

    if (themeType === "gradient" && Array.isArray(store.themeColors)) {
        const colors = store.themeColors.map(normalizeHexColor).filter(Boolean).slice(0,4);
        if (colors.length >= 2) {
            const direction = String(store.themeDirection || "135deg").trim();
            const safeDirection = /^(\d{1,3}deg|to\s+(left|right|top|bottom)(\s+(left|right|top|bottom))?)$/i.test(direction) ? direction : "135deg";
            const gradient = "linear-gradient(" + safeDirection + ", " + colors.join(", ") + ")";
            const firstColor = colors[0];

            document.body.classList.add("theme-custom-gradient");
            document.body.style.setProperty("--accent", firstColor);
            document.body.style.setProperty("--accent-dark", darkenColor(firstColor, 0.20));
            document.body.style.setProperty("--theme-gradient", gradient);
            document.body.style.setProperty("--sidebar-hover", rgbaFromHex(firstColor, 0.08));

            themeColorMeta.content = firstColor;
            localStorage.setItem("gglamStoreTheme", "custom-gradient");
            localStorage.setItem("gglamThemeType", "gradient");
            localStorage.setItem("gglamThemeColors", JSON.stringify(colors));
            localStorage.setItem("gglamThemeDirection", safeDirection);
            return;
        }
    }

    if (themeType === "solid") {
        const solidColor = normalizeHexColor(Array.isArray(store.themeColors) ? store.themeColors[0] : null) || normalizeHexColor(store.themeColor);
        const savedTheme = String(store.theme || "").toLowerCase().trim();

        if (validThemes.includes(savedTheme)) {
            document.body.classList.add("theme-" + savedTheme);
            themeColorMeta.content = solidColor || themeColorsMap[savedTheme] || "#FFFFFF";
            localStorage.setItem("gglamStoreTheme", savedTheme);
            localStorage.setItem("gglamThemeType", "solid");
            if (solidColor) localStorage.setItem("gglamThemeColor", solidColor);
            return;
        }

        if (solidColor) {
            document.body.classList.add("theme-custom-solid");
            document.body.style.setProperty("--accent", solidColor);
            document.body.style.setProperty("--accent-dark", darkenColor(solidColor, 0.20));
            document.body.style.setProperty("--sidebar-hover", rgbaFromHex(solidColor, 0.08));
            themeColorMeta.content = solidColor;
            localStorage.setItem("gglamStoreTheme", "custom-solid");
            localStorage.setItem("gglamThemeType", "solid");
            localStorage.setItem("gglamThemeColor", solidColor);
            return;
        }
    }

    let theme = String(store.theme || localStorage.getItem("gglamStoreTheme") || "orange").toLowerCase().trim();
    if (!validThemes.includes(theme)) theme = "orange";
    document.body.classList.add("theme-" + theme);
    themeColorMeta.content = themeColorsMap[theme] || "#FFFFFF";
    localStorage.setItem("gglamStoreTheme", theme);
    localStorage.setItem("gglamThemeType", "legacy");
}

// Load Initial Saved Theme
const savedThemeType = localStorage.getItem("gglamThemeType");
if (savedThemeType === "solid") {
    const savedColor = localStorage.getItem("gglamThemeColor");
    const savedTheme = localStorage.getItem("gglamStoreTheme");
    applyStoreTheme({ themeType: "solid", theme: savedTheme, themeColors: savedColor ? [savedColor] : [] });
} else if (savedThemeType === "gradient") {
    let savedColors = [];
    try { savedColors = JSON.parse(localStorage.getItem("gglamThemeColors") || "[]"); } catch(e) { savedColors = []; }
    applyStoreTheme({ themeType: "gradient", themeColors: savedColors, themeDirection: localStorage.getItem("gglamThemeDirection") || "135deg" });
} else {
    applyStoreTheme(localStorage.getItem("gglamStoreTheme") || "orange");
}

function updateNavigationLinks() {
    if (!storeUid) return;
    const encodedStore = encodeURIComponent(storeUid);
    document.getElementById("homeLink").href = "index.html?store=" + encodedStore;
    document.getElementById("cartLink").href = "cart.html?store=" + encodedStore;
    document.getElementById("floatingCart").href = "cart.html?store=" + encodedStore;
}

// Store Loader
async function loadStore() {
    try {
        if (!storeIdentifier) {
            showStoreError("لم يتم تحديد المتجر.");
            return false;
        }

        const storeRef = doc(db, "stores", storeIdentifier);
        const storeSnap = await getDoc(storeRef);

        if (!storeSnap.exists()) {
            showStoreError("المتجر غير موجود.");
            return false;
        }

        currentStore = storeSnap.data();
        storeUid = storeSnap.id;
        localStorage.setItem("storeId", storeUid);

        const status = String(currentStore.status || "approved").toLowerCase().trim();
        if (status !== "approved" && status !== "active") {
            showStoreError("هذا المتجر غير متاح حاليًا.");
            return false;
        }

        initPixels(currentStore);
        applyStoreTheme(currentStore);

        const name = currentStore.storeName || currentStore.name || "G-Glam";
        storeNameElement.textContent = name;
        headerStoreName.textContent = name;
        document.title = name + " | المتجر";
        storeDescriptionElement.textContent = currentStore.description || "Bienvenue dans notre boutique";

        const image = currentStore.storeImage || currentStore.image || currentStore.logo || currentStore.photoURL || "";
        if (image) {
            storeImage.src = image;
            storeImage.style.display = "block";
        } else {
            storeImage.removeAttribute("src");
            storeImage.style.display = "none";
        }

        const cover = currentStore.storeCoverImage || currentStore.storeCover || currentStore.coverImage || currentStore.cover || currentStore.banner || currentStore.storeBanner || "";
        if (cover) {
            storeCoverImage.src = cover;
            storeCover.style.display = "block";
        } else {
            storeCoverImage.removeAttribute("src");
            storeCover.style.display = "none";
        }

        renderSocialLinks();
        updateNavigationLinks();
        return true;
    } catch(error) {
        console.error("STORE LOAD ERROR:", error);
        showStoreError("حدث خطأ أثناء تحميل المتجر.");
        return false;
    }
}

// Category Operations
async function loadCategories() {
    categoriesContainer.innerHTML = `<button type="button" class="category-btn active" data-category-id="all">الكل</button>`;
    try {
        if (!storeUid) return;
        const categoriesQuery = query(collection(db, "categories"), where("storeId", "==", storeUid));
        const snapshot = await getDocs(categoriesQuery);

        allCategories = [];
        const usedCategoryIds = new Set();
        const usedCategoryNames = new Set();

        snapshot.forEach(categoryDoc => {
            const data = categoryDoc.data();
            const categoryId = String(categoryDoc.id).trim();
            const name = String(data.name || data.categoryName || "").trim();

            if (!categoryId || !name) return;
            const categoryStoreId = String(data.storeId || "").trim();
            if (categoryStoreId && categoryStoreId !== String(storeUid)) return;

            const normalizedName = name.toLowerCase().replace(/\s+/g, " ");
            if (usedCategoryIds.has(categoryId) || usedCategoryNames.has(normalizedName)) return;

            usedCategoryIds.add(categoryId);
            usedCategoryNames.add(normalizedName);
            allCategories.push({ id: categoryId, name: name, storeId: categoryStoreId || storeUid, ownerUid: data.ownerUid || "" });
        });

        allCategories.sort((a,b) => a.name.localeCompare(b.name, "ar"));

        if (currentCategoryId !== "all" && !allCategories.some(cat => String(cat.id) === String(currentCategoryId))) {
            currentCategoryId = "all";
        }
        renderCategories();
    } catch(error) {
        console.error("CATEGORIES ERROR:", error);
        allCategories = [];
        currentCategoryId = "all";
        renderCategories();
    }
}

function renderCategories() {
    categoriesContainer.innerHTML = "";
    const allButton = document.createElement("button");
    allButton.type = "button";
    allButton.className = "category-btn" + (currentCategoryId === "all" ? " active" : "");
    allButton.dataset.categoryId = "all";
    allButton.textContent = "الكل";
    categoriesContainer.appendChild(allButton);

    allCategories.forEach(category => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "category-btn" + (String(currentCategoryId) === String(category.id) ? " active" : "");
        button.dataset.categoryId = category.id;
        button.textContent = category.name;
        button.title = category.name;
        categoriesContainer.appendChild(button);
    });
}

function productMatchesCategory(product, categoryId) {
    if (categoryId === "all") return true;
    if (String(product.categoryId || "") === String(categoryId)) return true;

    const category = allCategories.find(item => String(item.id) === String(categoryId));
    if (category && String(product.categoryName || product.category || "").trim() === String(category.name).trim()) {
        return true;
    }
    return false;
}

function getFilteredProducts() {
    const keyword = String(searchInput.value || "").toLowerCase().trim();
    return allProducts.filter(product => {
        if (!productMatchesCategory(product, currentCategoryId)) return false;
        if (!keyword) return true;

        const name = String(product.name || "").toLowerCase();
        const description = String(product.description || "").toLowerCase();
        const categoryName = String(product.categoryName || product.category || "").toLowerCase();

        return name.includes(keyword) || description.includes(keyword) || categoryName.includes(keyword);
    });
}

categoriesContainer.addEventListener("click", function(event) {
    const button = event.target.closest(".category-btn");
    if (!button) return;

    currentCategoryId = button.dataset.categoryId || "all";
    categoriesContainer.querySelectorAll(".category-btn").forEach(item => {
        item.classList.toggle("active", item === button);
    });

    renderProducts(getFilteredProducts());

    const productsTop = productsContainer.getBoundingClientRect().top + window.scrollY - 100;
    window.scrollTo({ top: Math.max(0, productsTop), behavior: "smooth" });
});

function getProductCreatedTime(product) {
    const value = product.createdAt;
    if (!value) return 0;
    if (typeof value.toMillis === "function") return value.toMillis();
    if (value instanceof Date) return value.getTime();
    if (typeof value === "object" && typeof value.seconds === "number") {
        return (value.seconds * 1000) + Math.floor(Number(value.nanoseconds || 0) / 1000000);
    }
    if (typeof value === "number") return value < 100000000000 ? value * 1000 : value;
    if (typeof value === "string") {
        const parsed = Date.parse(value);
        if (!Number.isNaN(parsed)) return parsed;
        const numeric = Number(value);
        if (!Number.isNaN(numeric)) return numeric < 100000000000 ? numeric * 1000 : numeric;
    }
    return 0;
}

async function loadProducts() {
    try {
        productsContainer.innerHTML = `
            <div class="loading">
                <svg><use href="#icon-loader"></use></svg>
                <div>جاري تحميل المنتجات...</div>
            </div>`;

        let snapshot;
        try {
            const productsQuery = query(collection(db, "products"), where("storeId", "==", storeUid));
            snapshot = await getDocs(productsQuery);
        } catch(error) {
            console.warn("storeId query failed, trying ownerUid:", error);
            const legacyQuery = query(collection(db, "products"), where("ownerUid", "==", storeUid));
            snapshot = await getDocs(legacyQuery);
        }

        allProducts = [];
        snapshot.forEach(productDoc => {
            const data = productDoc.data();
            const productStoreId = String(data.storeId || "").trim();
            if (productStoreId && productStoreId !== String(storeUid)) return;

            allProducts.push({ id: productDoc.id, ...data });
        });

        allProducts.sort((a,b) => getProductCreatedTime(b) - getProductCreatedTime(a));
        renderProducts(getFilteredProducts());
    } catch(error) {
        console.error("PRODUCTS ERROR:", error);
        productsContainer.innerHTML = `
            <div class="empty">
                <svg class="empty-icon"><use href="#icon-bag"></use></svg>
                <h2>حدث خطأ</h2>
                <p style="margin-top:10px;">تعذر تحميل منتجات المتجر.</p>
            </div>`;
    }
}

function getProductImage(product) {
    if (product.image) return product.image;
    if (Array.isArray(product.images) && product.images.length) return product.images[0];
    return "";
}

function renderProducts(products) {
    productsContainer.innerHTML = "";
    if (!products.length) {
        productsContainer.innerHTML = `
            <div class="empty">
                <svg class="empty-icon"><use href="#icon-bag"></use></svg>
                <h2>لا توجد منتجات</h2>
                <p style="margin-top:8px;">${currentCategoryId !== "all" ? "لا توجد منتجات في هذا التصنيف حاليًا." : "لا توجد منتجات في هذا المتجر حاليًا."}</p>
            </div>`;
        return;
    }

    products.forEach(product => {
        const image = getProductImage(product);
        const name = product.name || "منتج";
        const price = Number(product.price || 0);
        const stock = Number(product.stock ?? 0);
        const outOfStock = stock <= 0;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            ${image ? `
                <img src="${escapeHtml(image)}" alt="${escapeHtml(name)}" loading="lazy" onerror="this.style.display='none';">
            ` : `
                <div style="aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; background:var(--card-light); color:var(--muted);">
                    <svg style="width:50px; height:50px; color:var(--accent);"><use href="#icon-bag"></use></svg>
                </div>
            `}
            <div class="card-content">
                <h3>${escapeHtml(name)}</h3>
                <div class="price">${price.toLocaleString("fr-DZ")} DA</div>
                <button class="details-btn" type="button">عرض المنتج</button>
                <button class="add-btn" type="button" ${outOfStock ? "disabled" : ""}>
                    ${outOfStock ? "غير متوفر" : "أضف إلى السلة"}
                </button>
            </div>
        `;

        card.querySelector(".details-btn").addEventListener("click", function() {
            window.location.href = "product.html?id=" + encodeURIComponent(product.id) + "&store=" + encodeURIComponent(storeUid);
        });

        const addButton = card.querySelector(".add-btn");
        if (!outOfStock) {
            addButton.addEventListener("click", function() { addToCart(product); });
        }

        productsContainer.appendChild(card);
    });
}

function addToCart(product) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    const otherStoreItems = cart.filter(item => item.storeUid && item.storeUid !== storeUid);

    if (otherStoreItems.length) {
        const confirmChange = confirm("السلة تحتوي منتجات من متجر آخر.\n\nهل تريد إفراغ السلة والشراء من هذا المتجر؟");
        if (!confirmChange) return;
        cart = [];
    }

    const existing = cart.find(item => item.id === product.id && item.storeUid === storeUid);
    if (existing) {
        existing.quantity = Number(existing.quantity || 0) + 1;
    } else {
        cart.push({
            id: product.id,
            name: product.name || "منتج",
            price: Number(product.price || 0),
            image: getProductImage(product),
            quantity: 1,
            color: "بدون لون",
            storeUid: storeUid,
            storeName: currentStore?.storeName || currentStore?.name || "G-Glam"
        });
    }

    localStorage.setItem("cart", JSON.stringify(cart));
    localStorage.setItem("cartStoreId", storeUid);
    updateCartCount();

    if (typeof window.fbq === "function") {
        window.fbq("track", "AddToCart", {
            content_name: product.name || "",
            content_ids: [product.id],
            value: Number(product.price || 0),
            currency: "DZD"
        });
    }

    if (typeof window.ttq !== "undefined" && typeof window.ttq.track === "function") {
        window.ttq.track("AddToCart", {
            content_name: product.name || "",
            content_id: product.id,
            value: Number(product.price || 0),
            currency: "DZD"
        });
    }

    alert("تمت إضافة المنتج إلى السلة");
}

function updateCartCount() {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    const storeCart = cart.filter(item => item.storeUid === storeUid);
    let total = 0;
    storeCart.forEach(item => { total += Number(item.quantity || 0); });
    cartCount.textContent = total;
}

// Events Listener
searchInput.addEventListener("input", function() {
    renderProducts(getFilteredProducts());
});

document.getElementById("cartButton").addEventListener("click", function() {
    if (!storeUid) return;
    window.location.href = "cart.html?store=" + encodeURIComponent(storeUid);
});

document.getElementById("cartButton").addEventListener("keydown", function(event) {
    if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        this.click();
    }
});

function openSidebar() {
    sidebar.classList.add("active");
    overlay.classList.add("active");
}

function closeSidebar() {
    sidebar.classList.remove("active");
    overlay.classList.remove("active");
}

menuBtn.addEventListener("click", openSidebar);
overlay.addEventListener("click", closeSidebar);
contactLink.addEventListener("click", closeSidebar);

// Initialize Page App Sequence
async function initApp() {
    const isLoaded = await loadStore();
    if (isLoaded) {
        await loadCategories();
        await loadProducts();
        updateCartCount();
    }
}

initApp();
</script>
</body>
