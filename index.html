<style>

/* =====================================================
   ROOT
===================================================== */

:root {

    --primary:#f97316;

    --primary-dark:#ea580c;

    --primary-light:#fff7ed;

    --background:#ffffff;

    --card:#ffffff;

    --text:#222222;

    --muted:#777777;

    --border:#eeeeee;

    --danger:#dc2626;

    --success:#16a34a;

    --shadow:
        0 4px 18px rgba(0,0,0,.07);

}


/* =====================================================
   RESET
===================================================== */

* {

    box-sizing:border-box;

    margin:0;

    padding:0;

}


html {

    scroll-behavior:smooth;

}


body {

    font-family:'Tajawal',sans-serif;

    background:var(--background);

    color:var(--text);

    min-height:100vh;

    padding-bottom:90px;

}


button,
input {

    font-family:inherit;

}


button {

    border:none;

    cursor:pointer;

}


a {

    color:inherit;

    text-decoration:none;

}


/* =====================================================
   THEMES
===================================================== */

body.theme-orange {

    --primary:#f97316;
    --primary-dark:#ea580c;
    --primary-light:#fff7ed;

}


body.theme-blue {

    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --primary-light:#eff6ff;

}


body.theme-green {

    --primary:#16a34a;
    --primary-dark:#15803d;
    --primary-light:#f0fdf4;

}


body.theme-purple {

    --primary:#9333ea;
    --primary-dark:#7e22ce;
    --primary-light:#faf5ff;

}


body.theme-pink {

    --primary:#ec4899;
    --primary-dark:#db2777;
    --primary-light:#fdf2f8;

}


body.theme-dark {

    --primary:#f97316;
    --primary-dark:#ea580c;
    --primary-light:#292524;

    --background:#18181b;
    --card:#27272a;
    --text:#f4f4f5;
    --muted:#a1a1aa;
    --border:#3f3f46;

}


body.theme-red {

    --primary:#dc2626;
    --primary-dark:#b91c1c;
    --primary-light:#fef2f2;

}


body.theme-teal {

    --primary:#0d9488;
    --primary-dark:#0f766e;
    --primary-light:#f0fdfa;

}


body.theme-gold {

    --primary:#ca8a04;
    --primary-dark:#a16207;
    --primary-light:#fefce8;

}


body.theme-luxury {

    --primary:#b08d57;
    --primary-dark:#8c6b35;
    --primary-light:#faf7f0;

}


body.theme-sunset {

    --primary:#f43f5e;
    --primary-dark:#e11d48;
    --primary-light:#fff1f2;

}


body.theme-emerald {

    --primary:#059669;
    --primary-dark:#047857;
    --primary-light:#ecfdf5;

}


body.theme-navy {

    --primary:#1e3a8a;
    --primary-dark:#172554;
    --primary-light:#eff6ff;

}


body.theme-brown {

    --primary:#92400e;
    --primary-dark:#78350f;
    --primary-light:#fffbeb;

}


body.theme-rose {

    --primary:#e11d48;
    --primary-dark:#be123c;
    --primary-light:#fff1f2;

}


body.theme-indigo {

    --primary:#4f46e5;
    --primary-dark:#4338ca;
    --primary-light:#eef2ff;

}


/* =====================================================
   HEADER
===================================================== */

.header {

    position:sticky;

    top:0;

    z-index:1000;

    height:64px;

    background:var(--card);

    border-bottom:1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 15px;

}


.header-button {

    width:42px;

    height:42px;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:var(--primary-light);

    color:var(--primary);

    position:relative;

}


.header-title {

    flex:1;

    text-align:center;

    font-size:18px;

    font-weight:800;

    padding:0 10px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.cart-count {

    position:absolute;

    top:-4px;

    right:-4px;

    min-width:19px;

    height:19px;

    padding:0 4px;

    border-radius:20px;

    background:#ef4444;

    color:white;

    font-size:10px;

    font-weight:800;

    display:flex;

    align-items:center;

    justify-content:center;

}


/* =====================================================
   STORE
===================================================== */

.store-container {

    max-width:1400px;

    margin:auto;

    padding:20px 15px 0;

}


.store-cover {

    display:none;

    width:100%;

    height:220px;

    object-fit:cover;

    border-radius:20px;

    margin-bottom:18px;

}


.store-info {

    text-align:center;

    margin-bottom:20px;

}


.store-image {

    width:92px;

    height:92px;

    border-radius:50%;

    object-fit:cover;

    border:4px solid var(--card);

    box-shadow:
        0 4px 15px rgba(0,0,0,.12);

    background:#f3f4f6;

}


.store-name {

    margin-top:10px;

    font-size:23px;

    font-weight:800;

}


.store-description {

    margin:6px auto 0;

    max-width:650px;

    color:var(--muted);

    font-size:14px;

    line-height:1.8;

}


/* =====================================================
   SEARCH
===================================================== */

.search-wrapper {

    max-width:700px;

    margin:0 auto 22px;

    position:relative;

}


.search-wrapper svg {

    position:absolute;

    right:15px;

    top:50%;

    transform:translateY(-50%);

    color:#999;

}


#searchInput {

    width:100%;

    height:48px;

    border:1px solid var(--border);

    border-radius:14px;

    background:var(--card);

    padding:0 46px 0 15px;

    outline:none;

    color:var(--text);

    font-size:14px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.03);

}


#searchInput:focus {

    border-color:var(--primary);

}


/* =====================================================
   PRODUCTS
===================================================== */

.products-grid {

    display:grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));

    gap:15px;

}


.product-card {

    background:var(--card);

    border:1px solid var(--border);

    border-radius:17px;

    overflow:hidden;

    box-shadow:var(--shadow);

    transition:.2s;

}


.product-card:hover {

    transform:translateY(-2px);

}


.product-image-wrapper {

    position:relative;

    aspect-ratio:1/1;

    background:#f5f5f5;

    overflow:hidden;

}


.product-image {

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

}


.product-content {

    padding:11px;

    text-align:center;

}


.product-name {

    font-size:14px;

    font-weight:700;

    line-height:1.5;

    min-height:42px;

    display:flex;

    align-items:center;

    justify-content:center;

}


/* =====================================================
   OLD PRICE
===================================================== */

.old-price {

    color:#9ca3af;

    font-size:12px;

    font-weight:600;

    line-height:1.4;

    margin-top:5px;

    margin-bottom:1px;

    text-decoration:line-through;

    text-decoration-thickness:1.5px;

}


/* =====================================================
   CURRENT PRICE
===================================================== */

.price {

    color:var(--primary);

    font-size:17px;

    font-weight:800;

    margin-top:5px;

    margin-bottom:9px;

}


/* =====================================================
   PRODUCT BUTTONS
===================================================== */

.product-actions {

    display:grid;

    grid-template-columns:1fr;

    gap:7px;

}


.product-button {

    min-height:38px;

    border-radius:10px;

    padding:7px 8px;

    font-size:12px;

    font-weight:700;

    transition:.2s;

}


.view-product {

    background:var(--primary-light);

    color:var(--primary);

}


.add-cart {

    background:var(--primary);

    color:#fff;

}


.add-cart:hover {

    background:var(--primary-dark);

}


.view-product:hover {

    opacity:.85;

}


/* =====================================================
   EMPTY
===================================================== */

.empty-state {

    text-align:center;

    padding:60px 20px;

    color:var(--muted);

}


.empty-state svg {

    width:55px;

    height:55px;

    margin-bottom:12px;

    color:#aaa;

}


/* =====================================================
   SOCIAL
===================================================== */

.social-section {

    max-width:850px;

    margin:45px auto 20px;

    text-align:center;

    padding:25px 15px;

    border-top:1px solid var(--border);

}


.social-title {

    font-size:18px;

    font-weight:800;

    margin-bottom:18px;

}


.social-links {

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:10px;

}


.social-link {

    width:43px;

    height:43px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:var(--primary-light);

    color:var(--primary);

    transition:.2s;

}


.social-link:hover {

    transform:translateY(-2px);

}


.phone-link {

    width:auto;

    border-radius:13px;

    padding:0 15px;

    gap:7px;

}


/* =====================================================
   FLOATING CART
===================================================== */

.floating-cart {

    position:fixed;

    bottom:20px;

    left:20px;

    z-index:900;

    width:58px;

    height:58px;

    border-radius:50%;

    background:var(--primary);

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:center;

    box-shadow:
        0 7px 22px rgba(0,0,0,.20);

}


.floating-cart .cart-count {

    top:-2px;

    right:-2px;

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar-overlay {

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.45);

    z-index:1998;

    opacity:0;

    visibility:hidden;

    transition:.25s;

}


.sidebar-overlay.active {

    opacity:1;

    visibility:visible;

}


.sidebar {

    position:fixed;

    top:0;

    right:-310px;

    width:290px;

    max-width:85%;

    height:100vh;

    background:var(--card);

    z-index:1999;

    transition:.25s;

    padding:20px;

    box-shadow:
        -5px 0 25px rgba(0,0,0,.12);

}


.sidebar.active {

    right:0;

}


.sidebar-header {

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:25px;

}


.sidebar-title {

    font-size:20px;

    font-weight:800;

}


.close-sidebar {

    width:40px;

    height:40px;

    border-radius:10px;

    background:var(--primary-light);

    color:var(--primary);

    display:flex;

    align-items:center;

    justify-content:center;

}


.sidebar-link {

    width:100%;

    min-height:50px;

    display:flex;

    align-items:center;

    gap:12px;

    padding:0 14px;

    border-radius:12px;

    margin-bottom:8px;

    font-weight:700;

    color:var(--text);

}


.sidebar-link:hover {

    background:var(--primary-light);

    color:var(--primary);

}


.sidebar-link svg {

    color:var(--primary);

}


/* =====================================================
   LOADING
===================================================== */

.loading {

    min-height:250px;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    gap:12px;

    color:var(--muted);

}


.loader {

    width:38px;

    height:38px;

    border:4px solid var(--primary-light);

    border-top-color:var(--primary);

    border-radius:50%;

    animation:spin .8s linear infinite;

}


@keyframes spin {

    to {
        transform:rotate(360deg);
    }

}


/* =====================================================
   ERROR
===================================================== */

.error-box {

    max-width:600px;

    margin:40px auto;

    padding:25px;

    text-align:center;

    background:#fef2f2;

    color:#b91c1c;

    border:1px solid #fecaca;

    border-radius:15px;

    line-height:1.8;

}


body.theme-dark .error-box {

    background:#3f1818;

    border-color:#7f1d1d;

    color:#fecaca;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width:1100px) {

    .products-grid {

        grid-template-columns:
            repeat(4,minmax(0,1fr));

    }

}


@media (max-width:800px) {

    .products-grid {

        grid-template-columns:
            repeat(3,minmax(0,1fr));

        gap:12px;

    }

}


@media (max-width:600px) {

    .store-container {

        padding:15px 10px 0;

    }

    .products-grid {

        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:9px;

    }

    .product-content {

        padding:8px;

    }

    .product-name {

        font-size:12px;

        min-height:37px;

    }

    .old-price {

        font-size:10px;

        margin-top:3px;

    }

    .price {

        font-size:14px;

        margin-top:3px;

        margin-bottom:7px;

    }

    .product-button {

        min-height:34px;

        font-size:10px;

        padding:6px;

    }

    .store-image {

        width:82px;

        height:82px;

    }

    .store-name {

        font-size:20px;

    }

}


@media (max-width:380px) {

    .products-grid {

        gap:7px;

    }

    .product-content {

        padding:7px 5px;

    }

    .product-name {

        font-size:11px;

    }

    .old-price {

        font-size:9px;

    }

    .price {

        font-size:13px;

    }

}


/* =====================================================
   SVG
===================================================== */

svg {

    width:22px;

    height:22px;

    fill:none;

    stroke:currentColor;

    stroke-width:2;

    stroke-linecap:round;

    stroke-linejoin:round;

}

</style>

</head>

import {
    initializeApp

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   STORE IDENTIFIER
===================================================== */

function getStoreIdentifier() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const fromUrl =
        params.get("store");


    if (fromUrl) {

        return fromUrl;

    }


    const parts =
        window.location.pathname
        .split("/")
        .filter(Boolean);


    const last =
        parts[parts.length - 1];


    if (
        last &&
        last !== "index.html" &&
        !last.includes(".")
    ) {

        return last;

    }


    return localStorage.getItem(
        "storeId"
    );

}


let storeIdentifier =
    getStoreIdentifier();

/* =====================================================
   SOCIAL URL
===================================================== */

function normalizeSocialUrl(
    value,
    type = ""
) {

    if (!value) return "";

    value =
        String(value).trim();


    if (
        value.startsWith("http://") ||
        value.startsWith("https://")
    ) {

        return value;

    }


    if (type === "whatsapp") {

        let number =
            value.replace(
                /[^0-9]/g,
                ""
            );


        if (
            number.startsWith("0") &&
            number.length === 10
        ) {

            number =
                "213" +
                number.substring(1);

        }


        return number
            ? `https://wa.me/${number}`
            : "";

    }


    const clean =
        value.replace(
            /^@/,
            ""
        );


    const urls = {

        instagram:
            `https://instagram.com/${clean}`,

        tiktok:
            `https://tiktok.com/@${clean}`,

        telegram:
            `https://t.me/${clean}`,

        facebook:
            `https://facebook.com/${clean}`,

        youtube:
            `https://youtube.com/@${clean}`,

        x:
            `https://x.com/${clean}`

    };


    return urls[type] || value;

}

/* =====================================================
   COLOR HELPERS
===================================================== */

function normalizeHexColor(color) {

    if (!color) return null;

    color =
        String(color).trim();


    if (
        /^#[0-9a-fA-F]{6}$/.test(color)
    ) {

        return color;

    }


    if (
        /^#[0-9a-fA-F]{3}$/.test(color)
    ) {

        return "#" +
            color[1] + color[1] +
            color[2] + color[2] +
            color[3] + color[3];

    }


    return null;

}


function hexToRgb(hex) {

    hex =
        normalizeHexColor(hex);


    if (!hex) return null;


    return {

        r:parseInt(
            hex.substring(1,3),
            16
        ),

        g:parseInt(
            hex.substring(3,5),
            16
        ),

        b:parseInt(
            hex.substring(5,7),
            16
        )

    };

}


function rgbToHex(r,g,b) {

    return "#" +
        [r,g,b]
        .map(
            value =>
                Math.max(
                    0,
                    Math.min(
                        255,
                        value
                    )
                )
                .toString(16)
                .padStart(2,"0")
        )
        .join("");

}


function darkenColor(
    hex,
    amount = 0.15
) {

    const rgb =
        hexToRgb(hex);


    if (!rgb) return hex;


    return rgbToHex(

        Math.round(
            rgb.r *
            (1 - amount)
        ),

        Math.round(
            rgb.g *
            (1 - amount)
        ),

        Math.round(
            rgb.b *
            (1 - amount)
        )

    );

}


function rgbaFromHex(
    hex,
    alpha = .1
) {

    const rgb =
        hexToRgb(hex);


    if (!rgb) {

        return `rgba(0,0,0,${alpha})`;

    }


    return `
        rgba(
            ${rgb.r},
            ${rgb.g},
            ${rgb.b},
            ${alpha}
        )
    `;

}


/* =====================================================
   STORE THEME
===================================================== */

function applyStoreTheme(
    themeOrStore
) {

    const validThemes = [

        "orange",
        "blue",
        "green",
        "purple",
        "pink",
        "dark",
        "red",
        "teal",
        "gold",
        "luxury",
        "sunset",
        "emerald",
        "navy",
        "brown",
        "rose",
        "indigo"

    ];


    document.body.classList.remove(
        ...validThemes.map(
            theme =>
                `theme-${theme}`
        )
    );


    document.body.style.removeProperty(
        "--primary"
    );

    document.body.style.removeProperty(
        "--primary-dark"
    );

    document.body.style.removeProperty(
        "--primary-light"
    );

    document.body.style.removeProperty(
        "--background"
    );

    document.body.style.removeProperty(
        "--card"
    );

    document.body.style.removeProperty(
        "--text"
    );

    document.body.style.removeProperty(
        "--muted"
    );

    document.body.style.removeProperty(
        "--border"
    );


    if (
        typeof themeOrStore ===
        "string"
    ) {

        if (
            validThemes.includes(
                themeOrStore
            )
        ) {

            document.body.classList.add(
                `theme-${themeOrStore}`
            );

            localStorage.setItem(
                "storeTheme",
                themeOrStore
            );

            return;

        }

    }


    const store =
        themeOrStore || {};


    const themeType =
        store.themeType;


    const themeColors =
        Array.isArray(
            store.themeColors
        )
        ? store.themeColors
        : [];


    if (
        themeType === "gradient" &&
        themeColors.length >= 2
    ) {

        const c1 =
            normalizeHexColor(
                themeColors[0]
            );


        const c2 =
            normalizeHexColor(
                themeColors[1]
            );


        if (c1 && c2) {

            document.body.style.setProperty(
                "--primary",
                c1
            );

            document.body.style.setProperty(
                "--primary-dark",
                darkenColor(c1,.15)
            );

            document.body.style.setProperty(
                "--primary-light",
                rgbaFromHex(c1,.10)
            );

            document.body.style.setProperty(
                "--background",
                `linear-gradient(
                    135deg,
                    ${c1},
                    ${c2}
                )`
            );

        }

        return;

    }


    if (
        themeType === "solid"
    ) {

        const custom =
            normalizeHexColor(
                themeColors[0] ||
                store.themeColor
            );


        if (custom) {

            document.body.style.setProperty(
                "--primary",
                custom
            );

            document.body.style.setProperty(
                "--primary-dark",
                darkenColor(custom,.15)
            );

            document.body.style.setProperty(
                "--primary-light",
                rgbaFromHex(custom,.10)
            );

            localStorage.setItem(
                "storeTheme",
                "custom"
            );

            return;

        }

    }


    const savedTheme =
        store.theme ||
        localStorage.getItem(
            "storeTheme"
        ) ||
        "orange";


    if (
        validThemes.includes(
            savedTheme
        )
    ) {

        document.body.classList.add(
            `theme-${savedTheme}`
        );

    } else {

        document.body.classList.add(
            "theme-orange"
        );

    }

}

/* =====================================================
   LOAD STORE
===================================================== */

async function loadStore() {

    if (!storeIdentifier) {

        showStoreError(
            "لم يتم تحديد المتجر."
        );

        return false;

    }


    try {

        const storeRef =
            doc(
                db,
                "stores",
                storeIdentifier
            );


        const snap =
            await getDoc(
                storeRef
            );


        if (!snap.exists()) {

            showStoreError(
                "المتجر غير موجود."
            );

            return false;

        }


        currentStore =
            snap.data();


        storeUid =
            snap.id;


        localStorage.setItem(
            "storeId",
            storeUid
        );


        const status =
            String(
                currentStore.status ||
                ""
            ).toLowerCase();


        if (
            status &&
            status !== "approved" &&
            status !== "active"
        ) {

            showStoreError(
                "هذا المتجر غير متاح حاليًا."
            );

            return false;

        }


        initPixels(
            currentStore
        );


        applyStoreTheme(
            currentStore
        );


        const name =
            currentStore.storeName ||
            currentStore.name ||
            "G-Glam";


        const description =
            currentStore.description ||
            "Bienvenue dans notre boutique";


        headerStoreName.textContent =
            name;


        storeName.textContent =
            name;


        storeDescription.textContent =
            description;


        const image =
            currentStore.storeImage ||
            currentStore.image ||
            currentStore.logo ||
            currentStore.photoURL;


        if (image) {

            storeImage.src =
                image;

        }


        const cover =
            currentStore.storeCoverImage ||
            currentStore.storeCover ||
            currentStore.coverImage ||
            currentStore.cover ||
            currentStore.banner ||
            currentStore.storeBanner;


        if (cover) {

            storeCover.src =
                cover;

            storeCover.style.display =
                "block";

        }


        renderSocialLinks(
            currentStore
        );


        updateNavigationLinks();


        return true;

    } catch(error) {

        console.error(
            error
        );


        showStoreError(
            "حدث خطأ أثناء تحميل المتجر."
        );


        return false;

    }

}


/* =====================================================
   PRODUCT IMAGE
===================================================== */

function getProductImage(
    product
) {

    if (
        product.image
    ) {

        return product.image;

    }


    if (
        Array.isArray(
            product.images
        ) &&
        product.images.length
    ) {

        return product.images[0];

    }


    return "gglamlogo.png";

}


/* =====================================================
   OLD PRICE
===================================================== */

function getOldPrice(
    product
) {

    const possibleValues = [

        product.oldPrice,

        product.previousPrice,

        product.originalPrice,

        product.compareAtPrice,

        product.priceBeforeDiscount

    ];


    for (
        const value
        of possibleValues
    ) {

        if (
            value !== undefined &&
            value !== null &&
            value !== ""
        ) {

            const number =
                Number(value);


            if (
                Number.isFinite(number) &&
                number > 0
            ) {

                return number;

            }

        }

    }


    return 0;

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts() {

    if (!storeUid) return;


    try {

        let products = [];


        try {

            const q =
                query(
                    collection(
                        db,
                        "products"
                    ),
                    where(
                        "ownerUid",
                        "==",
                        storeUid
                    )
                );


            const snap =
                await getDocs(q);


            products =
                snap.docs.map(
                    item => ({

                        id:item.id,

                        ...item.data()

                    })
                );

        } catch(error) {

            console.log(
                "ownerUid query failed",
                error
            );

        }


        if (
            !products.length
        ) {

            try {

                const q =
                    query(
                        collection(
                            db,
                            "products"
                        ),
                        where(
                            "storeId",
                            "==",
                            storeUid
                        )
                    );


                const snap =
                    await getDocs(q);


                products =
                    snap.docs.map(
                        item => ({

                            id:item.id,

                            ...item.data()

                        })
                    );

            } catch(error) {

                console.log(
                    "storeId query failed",
                    error
                );

            }

        }


        products.sort(
            (a,b) => {

                const aTime =
                    a.createdAt?.seconds ||
                    0;


                const bTime =
                    b.createdAt?.seconds ||
                    0;


                return bTime -
                    aTime;

            }
        );


        allProducts =
            products;


        renderProducts(
            allProducts
        );

    } catch(error) {

        console.error(
            error
        );


        productsContainer.innerHTML = `

            <div class="error-box">

                تعذر تحميل المنتجات حاليًا.

            </div>

        `;

    }

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(
    products
) {

    if (!products.length) {

        productsContainer.innerHTML = `

            <div class="empty-state">

                <svg>
                    <use href="#icon-bag"></use>
                </svg>

                <div>
                    لا توجد منتجات متاحة حاليًا.
                </div>

            </div>

        `;

        return;

    }


    const grid =
        document.createElement(
            "div"
        );


    grid.className =
        "products-grid";


    products.forEach(
        product => {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "product-card";


            const price =
                Number(
                    product.price || 0
                );


            const oldPrice =
                getOldPrice(
                    product

            const showOldPrice =
                oldPrice > price &&
                price > 0;


            const image =
                getProductImage(
                    product
                );


            const name =
                product.name ||
                product.title ||
                "منتج";


            const safeId =
                encodeURIComponent(
                    product.id
                );


            card.innerHTML = `

                <div class="product-image-wrapper">

                    <img
                        class="product-image"
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(name)}"
                        loading="lazy"
                        onerror="
                            this.src='gglamlogo.png'
                        "
                    >

                </div>


                <div class="product-content">

                    <div class="product-name">

                        ${escapeHtml(name)}

                    </div>


                    ${
                        showOldPrice
                        ?
                        `

                        <div class="old-price">

                            ${oldPrice.toLocaleString("fr-DZ")}
                            DA

                        </div>

                        `
                        :
                        ""
                    }


                    <div class="price">

                        ${price.toLocaleString("fr-DZ")}
                        DA

                    </div>


                    <div class="product-actions">

                        <button
                            class="product-button view-product"
                            data-id="${safeId}"
                        >

                            عرض المنتج

                        </button>


                        <button
                            class="product-button add-cart"
                            data-id="${safeId}"
                        >

                            أضف إلى السلة

                        </button>

                    </div>

                </div>

            `;


            card.querySelector(
                ".view-product"
            ).addEventListener(
                "click",
                () => {

                    viewProduct(
                        product.id
                    );

                }
            );


            card.querySelector(
                ".add-cart"
            ).addEventListener(
                "click",
                () => {

                    addToCart(
                        product
                    );

                }
            );


            grid.appendChild(
                card
            );

        }
    );


    productsContainer.innerHTML = "";

    productsContainer.appendChild(
        grid
    );

}

/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(
    product
) {

    try {

        let cart =
            JSON.parse(
                localStorage.getItem(
                    "cart"
                ) || "[]"
            );


        const otherStoreItems =
            cart.filter(
                item =>
                    item.storeUid &&
                    item.storeUid !==
                    storeUid
            );


        if (
            otherStoreItems.length
        ) {

            const clear =
                confirm(
                    "السلة تحتوي على منتجات من متجر آخر. هل تريد تفريغ السلة وإضافة هذا المنتج؟"
                );


            if (!clear) {

                return;

            }


            cart = [];

        }


        const existingIndex =
            cart.findIndex(
                item =>
                    String(item.id) ===
                    String(product.id) &&
                    item.storeUid ===
                    storeUid
            );


        if (
            existingIndex !== -1
        ) {

            cart[existingIndex].quantity =
                Number(
                    cart[existingIndex].quantity ||
                    1
                ) + 1;

        } else {

            cart.push({

                id:
                    product.id,

                name:
                    product.name ||
                    product.title ||
                    "منتج",

                price:
                    Number(
                        product.price || 0
                    ),

                image:
                    getProductImage(
                        product
                    ),

                quantity:
                    1,

                color:
                    "بدون لون",

                storeUid:
                    storeUid,

                storeName:
                    currentStore?.storeName ||
                    currentStore?.name ||
                    ""

            });

        }


        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );


        localStorage.setItem(
            "cartStoreId",
            storeUid
        );


        updateCartCount();


        try {

            if (
                typeof window.fbq ===
                "function"
            ) {

                window.fbq(
                    "track",
                    "AddToCart",
                    {

                        content_ids:[
                            product.id
                        ],

                        content_name:
                            product.name ||
                            product.title,

                        value:
                            Number(
                                product.price ||
                                0
                            ),

                        currency:
                            "DZD"

                    }
                );

            }

        } catch(e) {}


        try {

            if (
                window.ttq &&
                typeof window.ttq.track ===
                "function"
            ) {

                window.ttq.track(
                    "AddToCart",
                    {

                        content_id:
                            product.id,

                        content_name:
                            product.name ||
                            product.title,

                        value:
                            Number(
                                product.price ||
                                0
                            ),

                        currency:
                            "DZD"

                    }
                );

            }

        } catch(e) {}


        alert(
            "تمت إضافة المنتج إلى السلة"
        );

    } catch(error) {

        console.error(
            error
        );

        alert(
            "تعذر إضافة المنتج إلى السلة."
        );

    }

}


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount() {

    try {

        const cart =
            JSON.parse(
                localStorage.getItem(
                    "cart"
                ) || "[]"
            );


        const count =
            cart
            .filter(
                item =>
                    !storeUid ||
                    item.storeUid ===
                    storeUid
            )
            .reduce(
                (
                    total,
                    item
                ) =>
                    total +
                    Number(
                        item.quantity ||
                        0
                    ),
                0
            );


        document.getElementById(
            "headerCartCount"
        ).textContent =
            count;


        document.getElementById(
            "floatingCartCount"
        ).textContent =
            count;

    } catch(error) {

        console.error(
            error
        );

    }

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    () => {

        const term =
            searchInput.value
            .trim()
            .toLowerCase();


        if (!term) {

            renderProducts(
                allProducts
            );

            return;

        }


        const filtered =
            allProducts.filter(
                product => {

                    const name =
                        String(
                            product.name ||
                            product.title ||
                            ""
                        ).toLowerCase();


                    const description =
                        String(
                            product.description ||
                            ""
                        ).toLowerCase();


                    return (
                        name.includes(term) ||
                        description.includes(term)
                    );

                }
            );


        renderProducts(
            filtered
        );

    }
);


/* =====================================================
   SIDEBAR
===================================================== */

const sidebar =
    document.getElementById(
        "sidebar"
    );


const sidebarOverlay =
    document.getElementById(
        "sidebarOverlay"
    );


function openSidebar() {

    sidebar.classList.add(
        "active"
    );

    sidebarOverlay.classList.add(
        "active"
    );

}


function closeSidebar() {

    sidebar.classList.remove(
        "active"
    );

    sidebarOverlay.classList.remove(
        "active"
    );

}


document.getElementById(
    "menuButton"
).addEventListener(
    "click",
    openSidebar
);


document.getElementById(
    "closeSidebar"
).addEventListener(
    "click",
    closeSidebar
);


sidebarOverlay.addEventListener(
    "click",
    closeSidebar
);


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeSidebar();

        }

    }
);


/* =====================================================
   CONTACT
===================================================== */

document.getElementById(
    "sidebarContact"
).addEventListener(
    "click",
    () => {

        closeSidebar();


        document.getElementById(
            "socialSection"
        ).scrollIntoView({

            behavior:"smooth"

        });

    }
);


/* =====================================================
   START
===================================================== */

async function start() {

    updateCartCount();


    const storeLoaded =
        await loadStore();


    if (
        storeLoaded
    ) {

        updateCartCount();

        await loadProducts();

    }

}


start();


/* =====================================================
   SERVICE WORKER
===================================================== */

if (
    "serviceWorker" in navigator
) {

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker
                .register(
                    "service-worker.js"
                )
                .catch(
                    error =>
                        console.log(
                            "Service Worker:",
                            error
                        )
                );

        }
    );

}

</script>
