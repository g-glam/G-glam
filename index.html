<style>

/* =====================================================
   ROOT
===================================================== */

:root {

    --accent:#F47B20;
    --accent-dark:#D95F0B;
    --accent-light:#FFF3E8;

    --bg:#FFFFFF;
    --card:#FFFFFF;
    --card-light:#F8F8F8;

    --text:#151515;
    --muted:#777777;

    --border:#E8E8E8;

    --header:#FFFFFF;

    --danger:#E63946;

    --shadow:
        0 8px 25px rgba(
            0,
            0,
            0,
            .07
        );

    --radius:18px;

}


/* =====================================================
   THEMES
===================================================== */

body.theme-orange {
    --accent:#F47B20;
    --accent-dark:#D95F0B;
    --accent-light:#FFF3E8;
}

body.theme-blue {
    --accent:#1769AA;
    --accent-dark:#0D4F82;
    --accent-light:#EAF4FF;
}

body.theme-green {
    --accent:#198754;
    --accent-dark:#11683F;
    --accent-light:#EAF8F0;
}

body.theme-purple {
    --accent:#7B3FC6;
    --accent-dark:#5D279A;
    --accent-light:#F4ECFF;
}

body.theme-pink {
    --accent:#D94F87;
    --accent-dark:#B6386B;
    --accent-light:#FFF0F6;
}

body.theme-dark {
    --accent:#0A1726;
    --accent-dark:#000C18;
    --accent-light:#EAF0F6;
}

body.theme-red {
    --accent:#E63946;
    --accent-dark:#B92531;
    --accent-light:#FFF0F1;
}

body.theme-teal {
    --accent:#00B4D8;
    --accent-dark:#008EAB;
    --accent-light:#E8FAFF;
}

body.theme-gold {
    --accent:#D4AF37;
    --accent-dark:#A98B1E;
    --accent-light:#FFF9E5;
}

body.theme-luxury {
    --accent:#D4AF37;
    --accent-dark:#A98B1E;
    --accent-light:#FFF9E5;
}

body.theme-sunset {
    --accent:#FD1D1D;
    --accent-dark:#C90F0F;
    --accent-light:#FFF0F0;
}

body.theme-emerald {
    --accent:#0F5132;
    --accent-dark:#083B24;
    --accent-light:#EAF6EF;
}

body.theme-navy {
    --accent:#0B1F3A;
    --accent-dark:#061327;
    --accent-light:#EAF0F8;
}

body.theme-brown {
    --accent:#795548;
    --accent-dark:#593D34;
    --accent-light:#F5EFEC;
}

body.theme-rose {
    --accent:#BE185D;
    --accent-dark:#951248;
    --accent-light:#FFF0F7;
}

body.theme-indigo {
    --accent:#4338CA;
    --accent-dark:#31269A;
    --accent-light:#EEF0FF;
}


/* =====================================================
   RESET
===================================================== */

* {

    box-sizing:border-box;
    margin:0;
    padding:0;

}

html {

    scroll-behavior:smooth;

}

body {

    font-family:
        "Cairo",
        Arial,
        sans-serif;

    background:var(--bg);

    color:var(--text);

    min-height:100vh;

}

button,
input {

    font-family:inherit;

}

button {

    cursor:pointer;

}

a {

    color:inherit;
    text-decoration:none;

}


/* =====================================================
   HEADER
===================================================== */

.header {

    position:sticky;

    top:0;

    z-index:1000;

    height:70px;

    background:
        var(--header);

    border-bottom:
        1px solid var(--border);

    box-shadow:
        0 2px 12px
        rgba(
            0,
            0,
            0,
            .04
        );

}

.header-inner {

    max-width:1400px;

    height:100%;

    margin:auto;

    padding:
        0 20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

}

.header-right,
.header-left {

    display:flex;

    align-items:center;

    gap:10px;

}

.icon-button {

    width:45px;
    height:45px;

    border:none;

    border-radius:50%;

    background:
        var(--accent-light);

    color:
        var(--accent);

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:19px;

    transition:.2s;

}

.icon-button:hover {

    background:
        var(--accent);

    color:#fff;

    transform:
        translateY(-2px);

}

.header-store-name {

    font-size:20px;

    font-weight:800;

    color:var(--text);

}


/* =====================================================
   CART
===================================================== */

.cart-button {

    position:relative;

}

.cart-count {

    position:absolute;

    top:-3px;
    left:-3px;

    min-width:20px;
    height:20px;

    padding:
        0 5px;

    border-radius:20px;

    background:
        var(--danger);

    color:#fff;

    font-size:11px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:800;

}


/* =====================================================
   SIDEBAR
===================================================== */

.overlay {

    position:fixed;

    inset:0;

    background:
        rgba(
            0,
            0,
            0,
            .45
        );

    z-index:2000;

    opacity:0;

    visibility:hidden;

    transition:.25s;

}

.overlay.active {

    opacity:1;

    visibility:visible;

}

.sidebar {

    position:fixed;

    top:0;
    right:0;

    width:min(
        320px,
        88vw
    );

    height:100vh;

    background:#fff;

    z-index:2100;

    transform:
        translateX(110%);

    transition:
        transform .3s ease;

    box-shadow:
        -10px 0 30px
        rgba(
            0,
            0,
            0,
            .15
        );

    padding:
        25px 18px;

}

.sidebar.active {

    transform:
        translateX(0);

}

.sidebar-title {

    font-size:25px;

    font-weight:900;

    color:var(--accent);

    padding:
        10px 12px 25px;

    border-bottom:
        1px solid var(--border);

    margin-bottom:15px;

}

.sidebar a {

    display:flex;

    align-items:center;

    gap:13px;

    padding:
        14px;

    border-radius:12px;

    margin-bottom:7px;

    transition:.2s;

}

.sidebar a:hover {

    background:
        var(--accent-light);

    color:
        var(--accent);

}

.sidebar a i {

    width:22px;

    text-align:center;

}


/* =====================================================
   MAIN
===================================================== */

main {

    max-width:1400px;

    margin:auto;

    padding:
        20px;

}


/* =====================================================
   STORE COVER
===================================================== */

.store-cover {

    position:relative;

    overflow:hidden;

    border-radius:
        0 0 25px 25px;

    margin-bottom:20px;

    background:
        var(--accent-light);

}

.store-cover-image {

    width:100%;

    height:
        clamp(
            180px,
            28vw,
            350px
        );

    object-fit:cover;

    display:block;

}

.store-cover::after {

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            to bottom,
            transparent 40%,
            rgba(
                0,
                0,
                0,
                .35
            )
        );

    pointer-events:none;

}

.store-info {

    position:relative;

    z-index:2;

    display:flex;

    align-items:center;

    gap:18px;

    padding:
        0 25px 25px;

    margin-top:-55px;

}

.store-logo {

    width:110px;
    height:110px;

    border-radius:50%;

    object-fit:cover;

    background:#fff;

    border:
        5px solid #fff;

    box-shadow:
        0 5px 20px
        rgba(
            0,
            0,
            0,
            .15
        );

}

.store-details {

    background:
        rgba(
            255,
            255,
            255,
            .96
        );

    border-radius:15px;

    padding:
        12px 18px;

}

.store-name {

    font-size:26px;

    font-weight:900;

    color:
        var(--accent);

}

.store-description {

    color:
        var(--muted);

    font-size:14px;

    margin-top:3px;

}


/* =====================================================
   SEARCH
===================================================== */

.search-wrapper {

    margin:
        20px 0;

}

.search-box {

    position:relative;

}

.search-box i {

    position:absolute;

    right:17px;

    top:50%;

    transform:
        translateY(-50%);

    color:
        var(--muted);

}

.search-input {

    width:100%;

    height:55px;

    border:
        1px solid var(--border);

    border-radius:16px;

    background:
        var(--card);

    outline:none;

    padding:
        0 50px 0 18px;

    font-size:15px;

    color:
        var(--text);

    transition:.2s;

}

.search-input:focus {

    border-color:
        var(--accent);

    box-shadow:
        0 0 0 3px
        var(--accent-light);

}


/* =====================================================
   CATEGORIES
===================================================== */

.categories-section {

    margin:
        25px 0;

}

.categories-title {

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:13px;

}

.categories-title h2 {

    font-size:20px;

    font-weight:900;

}

.categories-scroll {

    display:flex;

    align-items:center;

    gap:9px;

    overflow-x:auto;

    padding:
        4px 2px 10px;

    scrollbar-width:thin;

}

.categories-scroll::-webkit-scrollbar {

    height:4px;

}

.categories-scroll::-webkit-scrollbar-thumb {

    background:
        var(--accent);

    border-radius:10px;

}

.category-btn {

    flex:
        0 0 auto;

    border:
        1px solid var(--border);

    background:#fff;

    color:
        var(--text);

    border-radius:30px;

    padding:
        9px 19px;

    font-size:14px;

    font-weight:700;

    white-space:nowrap;

    transition:.2s;

}

.category-btn:hover {

    border-color:
        var(--accent);

    color:
        var(--accent);

}

.category-btn.active {

    background:
        var(--accent);

    border-color:
        var(--accent);

    color:#fff;

    box-shadow:
        0 5px 15px
        rgba(
            0,
            0,
            0,
            .12
        );

}

.category-empty {

    width:100%;

    text-align:center;

    color:
        var(--muted);

    padding:15px;

}


/* =====================================================
   PRODUCTS
===================================================== */

.products-section {

    margin-top:25px;

}

.products-container {

    display:grid;

    grid-template-columns:
        repeat(
            4,
            minmax(
                0,
                1fr
            )
        );

    gap:20px;

}

.card {

    background:
        var(--card);

    border:
        1px solid var(--border);

    border-radius:
        var(--radius);

    overflow:hidden;

    box-shadow:
        var(--shadow);

    transition:
        transform .2s,
        box-shadow .2s;

}

.card:hover {

    transform:
        translateY(-4px);

    box-shadow:
        0 14px 35px
        rgba(
            0,
            0,
            0,
            .10
        );

}

.card > img {

    display:block;

    width:100%;

    aspect-ratio:1/1;

    object-fit:cover;

}

.card-content {

    padding:15px;

}

.card-content h3 {

    font-size:16px;

    font-weight:800;

    line-height:1.6;

    min-height:51px;

}

.price {

    margin:
        7px 0 12px;

    color:
        var(--accent);

    font-size:21px;

    font-weight:900;

}

.details-btn,
.add-btn {

    width:100%;

    min-height:44px;

    border-radius:11px;

    font-size:14px;

    font-weight:800;

    transition:.2s;

}

.details-btn {

    background:
        var(--accent);

    color:#fff;

    border:
        1px solid var(--accent);

    margin-bottom:8px;

}

.details-btn:hover {

    background:
        var(--accent-dark);

    border-color:
        var(--accent-dark);

}

.add-btn {

    background:#fff;

    color:#111;

    border:
        1px solid #111;

}

.add-btn:hover {

    background:#111;

    color:#fff;

}

.add-btn:disabled {

    opacity:.55;

    cursor:not-allowed;

    background:#eee;

    color:#777;

    border-color:#ddd;

}


/* =====================================================
   EMPTY / LOADING
===================================================== */

.empty,
.loading {

    grid-column:
        1 / -1;

    min-height:250px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    color:
        var(--muted);

    padding:30px;

}

.empty h2 {

    color:
        var(--text);

}

.empty-icon {

    width:55px;

    height:55px;

    color:
        var(--accent);

    margin-bottom:12px;

}

.loading svg {

    width:45px;
    height:45px;

    color:
        var(--accent);

    animation:
        spin 1s linear infinite;

    margin-bottom:10px;

}

@keyframes spin {

    from {
        transform:rotate(0);
    }

    to {
        transform:rotate(360deg);
    }

}


/* =====================================================
   SOCIAL
===================================================== */

.social-section {

    margin:
        45px 0 25px;

    padding:
        25px;

    border-radius:
        20px;

    background:
        var(--accent-light);

    text-align:center;

}

.social-section h2 {

    margin-bottom:18px;

    font-size:21px;

}

.social-links {

    display:flex;

    align-items:center;

    justify-content:center;

    flex-wrap:wrap;

    gap:10px;

}

.social-link {

    width:45px;
    height:45px;

    border-radius:50%;

    background:#fff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:19px;

    transition:.2s;

    box-shadow:
        0 3px 10px
        rgba(
            0,
            0,
            0,
            .07
        );

}

.social-link:hover {

    background:
        var(--accent);

    color:#fff;

    transform:
        translateY(-3px);

}

.social-empty {

    color:
        var(--muted);

}


/* =====================================================
   FLOATING CART
===================================================== */

.floating-cart {

    position:fixed;

    left:20px;

    bottom:20px;

    width:58px;
    height:58px;

    border-radius:50%;

    background:
        var(--accent);

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:center;

    z-index:1500;

    box-shadow:
        0 8px 25px
        rgba(
            0,
            0,
            0,
            .2
        );

    font-size:21px;

    transition:.2s;

}

.floating-cart:hover {

    transform:
        translateY(-3px)
        scale(1.03);

}

.floating-cart-count {

    position:absolute;

    top:-3px;

    right:-3px;

    min-width:21px;

    height:21px;

    padding:
        0 5px;

    background:
        var(--danger);

    border-radius:20px;

    color:#fff;

    font-size:11px;

    font-weight:900;

    display:flex;

    align-items:center;

    justify-content:center;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1100px){

    .products-container {

        grid-template-columns:
            repeat(
                3,
                minmax(
                    0,
                    1fr
                )
            );

    }

}

@media(max-width:700px){

    .header {

        height:62px;

    }

    .header-inner {

        padding:
            0 12px;

    }

    .header-store-name {

        font-size:17px;

    }

    main {

        padding:
            12px;

    }

    .store-info {

        align-items:flex-end;

        padding:
            0 12px 18px;

        margin-top:-42px;

    }

    .store-logo {

        width:85px;
        height:85px;

    }

    .store-details {

        padding:
            8px 12px;

    }

    .store-name {

        font-size:20px;

    }

    .store-description {

        font-size:12px;

    }

    .products-container {

        grid-template-columns:
            repeat(
                2,
                minmax(
                    0,
                    1fr
                )
            );

        gap:11px;

    }

    .card-content {

        padding:11px;

    }

    .card-content h3 {

        font-size:14px;

        min-height:45px;

    }

    .price {

        font-size:18px;

    }

    .details-btn,
    .add-btn {

        min-height:40px;

        font-size:12px;

    }

}

@media(max-width:390px){

    .products-container {

        grid-template-columns:
            1fr;

    }

}


/* =====================================================
   CUSTOM THEMES
===================================================== */

body.theme-custom-solid {

    --accent:
        var(--custom-accent);

    --accent-dark:
        var(--custom-accent);

    --accent-light:
        color-mix(
            in srgb,
            var(--custom-accent) 10%,
            white
        );

}

body.theme-custom-gradient {

    --accent:
        var(--custom-accent-start);

    --accent-dark:
        var(--custom-accent-start);

}

</style>

</head>


<body class="theme-orange">

/* =====================================================

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(

    );

}

function initPixels(

        );

    try {

/* =====================================================
   SOCIAL URL
===================================================== */

function normalizeSocialUrl(
    type,
    value
) {

    if (!value) {
        return "";
    }

    let url =
        String(
            value
        ).trim();


    if (
        type === "instagram"
    ) {

        return (
            "https://instagram.com/" +
            url.replace(
                /^@/,
                ""
            )
        );

    }


    if (
        type === "tiktok"
    ) {

        return (
            "https://www.tiktok.com/@" +
            url.replace(
                /^@/,
                ""
            )
        );

    }


    if (
        type === "facebook"
    ) {

        if (
            !/^https?:\/\//i.test(
                url
            )
        ) {

            return (
                "https://facebook.com/" +
                url.replace(
                    /^@/,
                    ""
                )
            );

        }

    }


    if (
        type === "telegram"
    ) {

        if (
            !/^https?:\/\//i.test(
                url
            )
        ) {

            return (
                "https://t.me/" +
                url.replace(
                    /^@/,
                    ""
                )
            );

        }

    }


    if (
        type === "whatsapp"
    ) {

        const phone =
            url.replace(
                /\D/g,
                ""
            );

        return (
            "https://wa.me/" +
            phone
        );

    }


    if (
        !/^https?:\/\//i.test(
            url
        )
    ) {

        return (
            "https://" +
            url
        );

    }

    return url;

}

function renderSocialLinks() {

    socialLinks.innerHTML =

    if (!currentStore) {

        socialLinks.innerHTML = `

                لا توجد معلومات تواصل.
            </div>
        `;

        return;

    }


    const social = {

        facebook:

            currentStore.facebookUrl
            ||
            currentStore.facebookLink,

        instagram:
            currentStore.instagram
            ||
            currentStore.instagramUrl
            ||
            currentStore.instagramLink,

        tiktok:
            currentStore.tiktok
            ||
            currentStore.tiktokUrl
            ||
            currentStore.tiktokLink,

        telegram:
            currentStore.telegram
            ||
            currentStore.telegramUrl
            ||
            currentStore.telegramLink,

        whatsapp:
            currentStore.whatsapp
            ||
            currentStore.whatsappNumber
            ||
            currentStore.whatsappUrl,

        website:
            currentStore.website
            ||
            currentStore.websiteUrl

    };


    const icons = {

        facebook:
            "fa-brands fa-facebook-f",

        instagram:
            "fa-brands fa-instagram",

        tiktok:
            "fa-brands fa-tiktok",

        telegram:
            "fa-brands fa-telegram",

        whatsapp:
            "fa-brands fa-whatsapp",

        website:
            "fa-solid fa-globe"

    };


    Object.keys(
        social
    ).forEach(
        type => {

            const value =
                social[type];

            if (!value) {
                return;
            }


            const url =
                normalizeSocialUrl(

                );

            if (!url) {

            const link =

            link.rel =
                "noopener noreferrer";

            link.innerHTML = `
                <i class="${icons[type]}"></i>
            `;

            socialLinks.appendChild(
                link
            );

        }
    );


    if (
        !socialLinks.children.length
    ) {

        socialLinks.innerHTML = `
            <div class="social-empty">
                لا توجد معلومات تواصل.

}


/* =====================================================
   APPLY THEME
===================================================== */

function applyStoreTheme(
    store
) {

    document.body.className =
        document.body.className
            .split(" ")
            .filter(
                className =>
                    !className.startsWith(
                        "theme-"
                    )
            )
            .join(" ");


    const validThemes = [

        "orange",
        "blue",
        "green",
        "purple",
        "pink",
        "dark",
        "red",
        "teal",
        "gold",
        "luxury",
        "sunset",
        "emerald",
        "navy",
        "brown",
        "rose",
        "indigo"

    ];


    let themeType =
        String(
            store?.themeType
            ||
            ""
        )
        .toLowerCase()
        .trim();


    let theme =
        String(
            store?.theme
            ||
            localStorage.getItem(
                "gglamStoreTheme"
            )
            ||
            "orange"
        )
        .toLowerCase()
        .trim();


    /* =================================================
       GRADIENT
    ================================================== */

    if (
        themeType === "gradient"
    ) {

        let colors =
            Array.isArray(
                store?.themeColors
            )
            ?
            store.themeColors
            :
            [];


        if (!colors.length) {

            try {

                colors =
                    JSON.parse(
                        localStorage.getItem(
                            "gglamThemeColors"
                        )
                        ||
                        "[]"
                    );

            }

            catch(error) {

                colors = [];

            }

        }


        const start =
            colors[0]
            ||
            "#F47B20";

        const end =
            colors[1]
            ||
            "#FFB36B";

        const direction =
            store?.themeDirection
            ||
            localStorage.getItem(
                "gglamThemeDirection"
            )
            ||
            "135deg";


        document.documentElement.style
            .setProperty(
                "--custom-accent-start",
                start
            );


        document.documentElement.style
            .setProperty(
                "--custom-accent-end",
                end
            );


        document.body.classList.add(
            "theme-custom-gradient"
        );


        document.documentElement.style
            .setProperty(
                "--accent",
                start
            );


        document.documentElement.style
            .setProperty(
                "--accent-dark",
                start
            );


        document.documentElement.style
            .setProperty(
                "--accent-light",
                start
            );


        themeColorMeta.content =
            start;


        document.body.style.setProperty(
            "--store-gradient",
            `linear-gradient(${direction}, ${start}, ${end})`
        );


        localStorage.setItem(
            "gglamStoreTheme",
            theme
        );

        localStorage.setItem(
            "gglamThemeType",
            "gradient"
        );

        localStorage.setItem(
            "gglamThemeColors",
            JSON.stringify(
                colors
            )
        );

        localStorage.setItem(
            "gglamThemeDirection",
            direction
        );

        return;

    }


    /* =================================================
       SOLID / LEGACY
    ================================================== */

    if (
        !validThemes.includes(
            theme
        )
    ) {

        theme =
            "orange";

    }


    document.body.classList.add(
        "theme-" + theme
    );


    const legacyThemeColors = {

        orange:"#F47B20",
        blue:"#1769AA",
        green:"#198754",
        purple:"#7B3FC6",
        pink:"#D94F87",
        dark:"#0A1726",
        red:"#E63946",
        teal:"#00B4D8",
        gold:"#D4AF37",
        luxury:"#D4AF37",
        sunset:"#FD1D1D",
        emerald:"#0F5132",
        navy:"#0B1F3A",
        brown:"#795548",
        rose:"#BE185D",
        indigo:"#4338CA"

    };


    let selectedColor =
        store?.themeColor
        ||
        (
            Array.isArray(
                store?.themeColors
            )
            ?
            store.themeColors[0]
            :
            ""
        )
        ||
        localStorage.getItem(
            "gglamThemeColor"
        )
        ||
        legacyThemeColors[theme]
        ||
        "#F47B20";


    if (
        themeType === "solid"
        &&
        selectedColor
    ) {

        document.documentElement.style
            .setProperty(
                "--accent",
                selectedColor
            );

        document.documentElement.style
            .setProperty(
                "--accent-dark",
                selectedColor
            );

        document.documentElement.style
            .setProperty(
                "--accent-light",
                selectedColor
            );

        themeColorMeta.content =
            selectedColor;

        localStorage.setItem(
            "gglamThemeColor",
            selectedColor
        );

    }

    else {

        themeColorMeta.content =
            legacyThemeColors[theme]
            ||
            "#FFFFFF";

    }


    localStorage.setItem(
        "gglamStoreTheme",
        theme
    );

    localStorage.setItem(
        "gglamThemeType",
        themeType || "legacy"
    );

}


/* =====================================================

/* =====================================================
   LOAD STORE
===================================================== */

async function loadStore() {

    try {

        if (!storeIdentifier) {

            showStoreError(
                "لم يتم تحديد المتجر."
            );

            return false;

        }


        const storeRef =
            doc(
                db,
                "stores",
                storeIdentifier
            );


        const storeSnap =
            await getDoc(
                storeRef
            );


        if (!storeSnap.exists()) {

            showStoreError(
                "المتجر غير موجود."
            );

            return false;

        }


        currentStore =
            storeSnap.data();


        /*
         * مهم:
         *
         * storeSnap.id
         * هو storeId الحقيقي.
         */

        storeUid =
            storeSnap.id;


        localStorage.setItem(
            "storeId",
            storeUid
        );


        const status =
            String(
                currentStore.status
                ||
                "approved"
            )
            .toLowerCase()
            .trim();


        if (
            status !== "approved"
            &&
            status !== "active"
        ) {

            showStoreError(
                "هذا المتجر غير متاح حاليًا."
            );

            return false;

        }


        initPixels(
            currentStore
        );


        applyStoreTheme(
            currentStore
        );


        const name =
            currentStore.storeName
            ||
            currentStore.name
            ||
            "G-Glam";


        storeNameElement.textContent =
            name;


        headerStoreName.textContent =
            name;


        document.title =
            name +
            " | المتجر";


        storeDescriptionElement.textContent =
            currentStore.description
            ||
            "Bienvenue dans notre boutique";


        const image =
            currentStore.storeImage
            ||
            currentStore.image
            ||
            currentStore.logo
            ||
            currentStore.photoURL
            ||
            "";


        if (image) {

            storeImage.src =
                image;

            storeImage.style.display =
                "block";

        }

        else {

            storeImage.removeAttribute(
                "src"
            );

            storeImage.style.display =
                "none";

        }


        const cover =
            currentStore.storeCoverImage
            ||
            currentStore.storeCover
            ||
            currentStore.coverImage
            ||
            currentStore.cover
            ||
            currentStore.banner
            ||
            currentStore.storeBanner
            ||
            "";


        if (cover) {

            storeCoverImage.src =
                cover;

            storeCoverImage.style.display =
                "block";

        }

        else {

            storeCoverImage.removeAttribute(
                "src"
            );

            storeCoverImage.style.display =
                "none";

        }


        renderSocialLinks();

        updateNavigationLinks();


        return true;

    }

    catch(error) {

        console.error(
            "STORE LOAD ERROR:",
            error
        );


        showStoreError(
            "حدث خطأ أثناء تحميل المتجر."
        );


        return false;

    }

}

        }


        /*
         * =================================================
         * المصدر الأساسي للتصنيفات
         *
         * categories/{id}
         *
         * storeId == storeUid
         * =================================================
         */

        const categoriesQuery =
            query(

                collection(
                    db,
                    "categories"
                ),

                where(
                    "storeId",
                    "==",
                    storeUid
                )

            );


        const snapshot =
            await getDocs(
                categoriesQuery
            );


        const uniqueNames =
            new Set();


        snapshot.forEach(
            categoryDoc => {

                const data =
                    categoryDoc.data();


                /*
                 * حماية إضافية:
                 *
                 * لا نعرض أي تصنيف لا يخص
                 * المتجر الحالي.
                 */

                if (
                    String(
                        data.storeId || ""
                    )
                    !==
                    String(
                        storeUid
                    )
                ) {

                    return;

                }


                const name =
                    String(
                        data.name
                        ||
                        data.categoryName
                        ||
                        ""
                    ).trim();


                if (!name) {
                    return;
                }


                const normalized =
                    normalizeCategoryName(
                        name
                    );


                /*
                 * منع تكرار نفس اسم التصنيف.
                 */

                if (
                    uniqueNames.has(
                        normalized
                    )
                ) {

                    return;

                }


                uniqueNames.add(
                    normalized
                );


                allCategories.push({

                    id:
                        categoryDoc.id,

                    name:
                        name,

                    storeId:
                        data.storeId ||
                        storeUid,

                    ownerUid:
                        data.ownerUid ||
                        "",

                    ownerEmail:
                        data.ownerEmail ||
                        "",

                    storeName:
                        data.storeName ||
                        ""

                });

            }
        );


        /*
         * ترتيب أبجدي عربي.
         */

        allCategories.sort(
            (a,b) =>
                a.name.localeCompare(
                    b.name,
                    "ar"
                )
        );


        renderCategories();

    }

    catch(error) {

        console.error(
            "CATEGORIES ERROR:",
            error
        );


        allCategories = [];


        renderCategories();

    }

}

/* =====================================================
   PRODUCT CATEGORY MATCH
===================================================== */

function productMatchesCategory(
    product,
    categoryId
) {

    if (
        categoryId === "all"
    ) {

        return true;

    }


    /*
     * الربط الأساسي:
     *
     * product.categoryId
     * =
     * categories document ID
     */

    if (
        String(
            product.categoryId || ""
        )
        ===
        String(
            categoryId
        )
    ) {

        return true;

    }


    /*
     * توافق مع المنتجات القديمة
     * التي لا تحتوي categoryId.
     */

    const category =
        allCategories.find(
            item =>
                String(
                    item.id
                )
                ===
                String(
                    categoryId
                )
        );


    if (
        category
    ) {

        const productCategory =
            String(
                product.categoryName
                ||
                product.category
                ||
                ""
            ).trim();


        if (
            normalizeCategoryName(
                productCategory
            )
            ===
            normalizeCategoryName(
                category.name
            )
        ) {

            return true;

        }

    }


    return false;

}


/* =====================================================
   FILTER PRODUCTS
===================================================== */

function getFilteredProducts() {

    const keyword =
        String(
            searchInput.value || ""
        )
        .toLowerCase()
        .trim();


    return allProducts.filter(
        product => {

            if (
                !productMatchesCategory(
                    product,
                    currentCategoryId
                )
            ) {

                return false;

            }


            if (!keyword) {
                return true;
            }


            const name =
                String(
                    product.name || ""
                )
                .toLowerCase();


            const description =
                String(
                    product.description || ""
                )
                .toLowerCase();


            const categoryName =
                String(
                    product.categoryName
                    ||
                    product.category
                    ||
                    ""
                )
                .toLowerCase();


            return (

                name.includes(
                    keyword
                )

                ||

                description.includes(
                    keyword
                )

                ||

                categoryName.includes(
                    keyword
                )

            );

        }
    );

}

/* =====================================================
   PRODUCT DATE
===================================================== */

function getProductCreatedTime(
    product
) {

    const value =
        product.createdAt;


    if (!value) {
        return 0;
    }


    /*
     * Firestore Timestamp
     */

    if (
        typeof value.toMillis ===
        "function"
    ) {

        return value.toMillis();

    }


    /*
     * JS Date
     */

    if (
        value instanceof Date
    ) {

        return value.getTime();

    }


    /*
     * Firebase Timestamp-like object
     */

    if (
        typeof value === "object"
        &&
        typeof value.seconds === "number"
    ) {

        return (

            value.seconds * 1000

            +

            Math.floor(
                Number(
                    value.nanoseconds || 0
                )
                /
                1000000
            )

        );

    }


    /*
     * رقم أو تاريخ نصي
     */

    if (
        typeof value === "number"
    ) {

        return (
            value < 100000000000
            ?
            value * 1000
            :
            value
        );

    }


    if (
        typeof value === "string"
    ) {

        const parsed =
            Date.parse(
                value
            );


        if (
            !Number.isNaN(
                parsed
            )
        ) {

            return parsed;

        }


        const numeric =
            Number(
                value
            );


        if (
            !Number.isNaN(
                numeric
            )
        ) {

            return (
                numeric < 100000000000
                ?
                numeric * 1000
                :
                numeric
            );

        }

    }


    return 0;

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts() {

    try {

        productsContainer.innerHTML = `

            <div class="loading">

                <svg>
                    <use href="#icon-loader"></use>
                </svg>

                <div>
                    جاري تحميل المنتجات...
                </div>

            </div>

        `;


        let snapshot;


        /*
         * =================================================
         * الاستعلام الأساسي
         *
         * products.storeId == storeUid
         * =================================================
         */

        try {

            const productsQuery =
                query(

                    collection(
                        db,
                        "products"
                    ),

                    where(
                        "storeId",
                        "==",
                        storeUid
                    )

                );


            snapshot =
                await getDocs(
                    productsQuery
                );

        }

        catch(error) {

            console.warn(
                "storeId query failed, trying ownerUid:",
                error
            );


            /*
             * توافق مع المنتجات القديمة.
             */

            const legacyQuery =
                query(

                    collection(
                        db,
                        "products"
                    ),

                    where(
                        "ownerUid",
                        "==",
                        storeUid
                    )

                );


            snapshot =
                await getDocs(
                    legacyQuery
                );

        }


        allProducts = [];


        snapshot.forEach(
            productDoc => {

                const data =
                    productDoc.data();


                /*
                 * حماية إضافية:
                 *
                 * المنتج يجب أن يكون للمتجر الحالي.
                 */

                if (
                    data.storeId
                    &&
                    String(
                        data.storeId
                    )
                    !==
                    String(
                        storeUid
                    )
                ) {

                    return;

                }


                allProducts.push({

                    id:
                        productDoc.id,

                    ...data

                });

            }
        );


        /*
         * الأحدث أولًا.
         */

        allProducts.sort(
            (a,b) =>
                getProductCreatedTime(b)
                -
                getProductCreatedTime(a)
        );


        renderProducts(
            getFilteredProducts()
        );

    }

    catch(error) {

        console.error(
            "PRODUCTS ERROR:",
            error
        );


        productsContainer.innerHTML = `

            <div class="empty">

                <svg class="empty-icon">
                    <use href="#icon-bag"></use>
                </svg>

                <h2>
                    حدث خطأ
                </h2>

                <p style="margin-top:10px;">
                    تعذر تحميل منتجات المتجر.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   GET PRODUCT IMAGE
===================================================== */

function getProductImage(
    product
) {

    if (
        product.image
    ) {

        return product.image;

    }


    if (
        Array.isArray(
            product.images
        )
        &&
        product.images.length
    ) {

        return product.images[0];

    }


    return "";

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(
    products
) {

    productsContainer.innerHTML =
        "";


    if (
        !products.length
    ) {

        productsContainer.innerHTML = `

            <div class="empty">

                <svg class="empty-icon">
                    <use href="#icon-bag"></use>
                </svg>

                <h2>
                    لا توجد منتجات
                </h2>

                <p style="margin-top:8px;">

                    ${
                        currentCategoryId !== "all"
                        ?
                        "لا توجد منتجات في هذا التصنيف حاليًا."
                        :
                        "لا توجد منتجات في هذا المتجر حاليًا."
                    }

                </p>

            </div>

        `;

        return;

    }


    products.forEach(
        product => {

            const image =
                getProductImage(
                    product
                );


            const name =
                product.name ||
                "منتج";


            const price =
                Number(
                    product.price || 0
                );


            const stock =
                Number(
                    product.stock ?? 0
                );


            const outOfStock =
                stock <= 0;


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            card.innerHTML = `

                ${
                    image
                    ?
                    `
                    <img
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(name)}"
                        loading="lazy"
                        onerror="
                            this.style.display='none';
                        "
                    >
                    `
                    :
                    `
                    <div
                        style="
                            aspect-ratio:1/1;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            background:var(--card-light);
                            color:var(--muted);
                        "
                    >

                        <svg
                            style="
                                width:50px;
                                height:50px;
                                color:var(--accent);
                            "
                        >

                            <use href="#icon-bag"></use>

                        </svg>

                    </div>
                    `
                }


                <div class="card-content">

                    <h3>
                        ${escapeHtml(name)}
                    </h3>


                    <div class="price">

                        ${
                            price.toLocaleString(
                                "fr-DZ"
                            )
                        }
                        DA

                    </div>


                    <button
                        class="details-btn"
                        type="button"
                    >
                        عرض المنتج
                    </button>


                    <button
                        class="add-btn"
                        type="button"
                        ${
                            outOfStock
                            ?
                            "disabled"
                            :
                            ""
                        }
                    >

                        ${
                            outOfStock
                            ?
                            "غير متوفر"
                            :
                            "أضف إلى السلة"
                        }

                    </button>

                </div>

            `;


            /*
             * عرض المنتج
             */

            card
                .querySelector(
                    ".details-btn"
                )
                .addEventListener(
                    "click",
                    function() {

                        window.location.href =
                            "product.html?id=" +
                            encodeURIComponent(
                                product.id
                            ) +
                            "&store=" +
                            encodeURIComponent(
                                storeUid
                            );

                    }
                );


            const addButton =
                card.querySelector(
                    ".add-btn"
                );


            if (
                !outOfStock
            ) {

                addButton.addEventListener(
                    "click",
                    function() {

                        addToCart(
                            product
                        );

                    }
                );

            }


            productsContainer.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(
    product
) {

    let cart =
        JSON.parse(
            localStorage.getItem(
                "cart"
            )
        )
        ||
        [];


    const otherStoreItems =
        cart.filter(
            item =>
                item.storeUid
                &&
                item.storeUid !==
                storeUid
        );


    if (
        otherStoreItems.length
    ) {

        const confirmChange =
            confirm(
                "السلة تحتوي منتجات من متجر آخر.\n\n" +
                "هل تريد إفراغ السلة والشراء من هذا المتجر؟"
            );


        if (!confirmChange) {
            return;
        }


        cart = [];

    }


    const existing =
        cart.find(
            item =>
                item.id ===
                product.id
                &&
                item.storeUid ===
                storeUid
        );


    if (
        existing
    ) {

        existing.quantity =
            Number(
                existing.quantity || 0
            )
            +
            1;

    }

    else {

        cart.push({

            id:
                product.id,

            name:
                product.name ||
                "منتج",

            price:
                Number(
                    product.price || 0
                ),

            image:
                getProductImage(
                    product
                ),

            quantity:
                1,

            color:
                "بدون لون",

            storeUid:
                storeUid,

            storeName:
                currentStore?.storeName
                ||
                currentStore?.name
                ||
                "G-Glam"

        });

    }


    localStorage.setItem(
        "cart",
        JSON.stringify(
            cart
        )
    );


    localStorage.setItem(
        "cartStoreId",
        storeUid
    );


    updateCartCount();


    /*
     * META PIXEL
     */

    if (
        typeof window.fbq ===
        "function"
    ) {

        window.fbq(
            "track",
            "AddToCart",
            {

                content_name:
                    product.name ||
                    "",

                content_ids:
                    [product.id],

                value:
                    Number(
                        product.price ||
                        0
                    ),

                currency:
                    "DZD"

            }
        );

    }


    /*
     * TIKTOK PIXEL
     */

    if (
        typeof window.ttq !==
        "undefined"
        &&
        typeof window.ttq.track ===
        "function"
    ) {

        window.ttq.track(
            "AddToCart",
            {

                content_name:
                    product.name ||
                    "",

                content_id:
                    product.id,

                value:
                    Number(
                        product.price ||
                        0
                    ),

                currency:
                    "DZD"

            }
        );

    }


    alert(
        "تمت إضافة المنتج إلى السلة"
    );

}


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount() {

    let cart =
        JSON.parse(
            localStorage.getItem(
                "cart"
            )
        )
        ||
        [];


    const storeCart =
        cart.filter(
            item =>
                item.storeUid ===
                storeUid
        );


    let total =
        0;


    storeCart.forEach(
        item => {

            total +=
                Number(
                    item.quantity || 0
                );

        }
    );


    cartCount.textContent =
        total;


    floatingCartCount.textContent =
        total;

}
