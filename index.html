<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#F4F4F4">

<link rel="manifest"
href="manifest.json">

<link rel="apple-touch-icon"
href="icons/icon-192.png">

<title>G-Glam | المتجر</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
rel="stylesheet">


<style>

/* =====================================================
   COLORS - MOBILE / TABLET LIGHT MODE
===================================================== */

:root{

--bg:#F4F4F4;

--card:#FFFFFF;

--text:#222222;

--accent:#F47B20;

--accent-dark:#DF6810;

--accent-light:#FFF1E6;

--muted:#777777;

--border:#E8E8E8;

--danger:#D9534F;

--shadow:
0 4px 15px rgba(0,0,0,.06);

}


/* =====================================================
   RESET
===================================================== */

*{

margin:0;
padding:0;

box-sizing:border-box;

font-family:"Tajawal",Arial,sans-serif;

}


/* =====================================================
   BODY
===================================================== */

body{

background:var(--bg);

color:var(--text);

padding-bottom:90px;

transition:
background .3s ease,
color .3s ease;

}


/* =====================================================
   HEADER
===================================================== */

header{

display:flex;

align-items:center;

justify-content:space-between;

padding:18px 20px;

background:var(--bg);

position:sticky;

top:0;

z-index:100;

transition:
background .3s ease;

}


/* =====================================================
   LOGO
===================================================== */

.logo{

display:flex;

align-items:center;

justify-content:center;

}


.logo img{

width:120px;

height:auto;

max-height:55px;

object-fit:contain;

display:block;

}


/* =====================================================
   MENU + CART
===================================================== */

.menu-btn,
.cart-icon{

font-size:27px;

cursor:pointer;

position:relative;

}


/* =====================================================
   CART COUNT
===================================================== */

.cart-count{

position:absolute;

top:-8px;

left:-8px;

background:var(--accent);

color:#fff;

font-size:11px;

font-weight:bold;

width:20px;

height:20px;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

}


/* =====================================================
   STORE VERTICAL FRAME
===================================================== */

.store-banner{

width:calc(100% - 30px);

max-width:700px;

margin:18px auto 22px;

background:#FFFFFF;

border-radius:24px;

padding:30px 20px 25px;

text-align:center;

border:1px solid var(--border);

box-shadow:

0 6px 22px rgba(0,0,0,.07);

position:relative;

overflow:hidden;

transition:
background .3s ease,
border-color .3s ease,
box-shadow .3s ease;

}


/* =====================================================
   ORANGE SIDE FRAME
===================================================== */

.store-banner::before{

content:"";

position:absolute;

top:0;

right:0;

width:6px;

height:100%;

background:var(--accent);

}


/* =====================================================
   STORE IMAGE CONTAINER
===================================================== */

.store-banner-image{

display:flex;

justify-content:center;

align-items:center;

margin-bottom:16px;

}


/* =====================================================
   STORE IMAGE
===================================================== */

.store-banner-image img{

width:120px;

height:120px;

border-radius:50%;

object-fit:cover;

background:#F1F1F1;

border:5px solid #FFFFFF;

box-shadow:

0 6px 20px rgba(0,0,0,.12);

display:block;

}


/* =====================================================
   STORE NAME
===================================================== */

.store-banner h1{

font-size:26px;

font-weight:800;

color:#222;

margin-bottom:7px;

transition:color .3s ease;

}


/* =====================================================
   STORE DESCRIPTION
===================================================== */

.store-banner p{

font-size:14px;

color:var(--muted);

line-height:1.8;

transition:color .3s ease;

}


/* =====================================================
   SEARCH
===================================================== */

.search-box{

padding:0 15px 20px;

}


.search-box input{

width:100%;

padding:15px 20px;

border:1px solid var(--border);

border-radius:30px;

background:#fff;

box-shadow:var(--shadow);

font-size:15px;

outline:none;

transition:
background .3s ease,
color .3s ease,
border-color .2s,
box-shadow .2s;

}


.search-box input:focus{

border-color:var(--accent);

box-shadow:

0 0 0 3px rgba(244,123,32,.10);

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

position:fixed;

top:0;

right:-280px;

width:280px;

height:100%;

background:#fff;

box-shadow:

-4px 0 15px rgba(0,0,0,.1);

z-index:999;

transition:
right .3s,
background .3s ease;

padding-top:30px;

}


.sidebar.active{

right:0;

}


.sidebar a{

display:block;

padding:16px 25px;

text-decoration:none;

color:#222;

font-size:17px;

border-bottom:1px solid #eee;

transition:
background .2s,
color .2s,
border-color .3s;

}


.sidebar a:hover{

background:var(--accent-light);

color:var(--accent-dark);

}


/* =====================================================
   OVERLAY
===================================================== */

.overlay{

position:fixed;

inset:0;

background:rgba(0,0,0,.35);

display:none;

z-index:998;

}


.overlay.active{

display:block;

}


/* =====================================================
   PRODUCTS
===================================================== */

.products{

display:grid;

grid-template-columns:

repeat(2,1fr);

gap:15px;

padding:15px;

}


/* =====================================================
   PRODUCT CARD
===================================================== */

.card{

background:var(--card);

border-radius:18px;

overflow:hidden;

box-shadow:var(--shadow);

transition:
.2s,
background .3s ease,
border-color .3s ease,
box-shadow .3s ease;

border:1px solid rgba(0,0,0,.03);

}


.card:hover{

transform:translateY(-2px);

}


/* =====================================================
   PRODUCT IMAGE
===================================================== */

.card img{

width:100%;

aspect-ratio:1/1;

object-fit:cover;

display:block;

background:#F1F1F1;

}


/* =====================================================
   PRODUCT CONTENT
===================================================== */

.card-content{

padding:12px;

}


.card h3{

font-size:15px;

margin-bottom:8px;

height:38px;

overflow:hidden;

line-height:1.5;

}


/* =====================================================
   PRICE
===================================================== */

.price{

font-size:17px;

font-weight:bold;

margin-bottom:10px;

color:var(--accent-dark);

}


/* =====================================================
   DETAILS BUTTON
===================================================== */

.details-btn{

display:block;

width:100%;

text-align:center;

padding:10px;

border:none;

border-radius:12px;

background:var(--accent);

color:#fff;

text-decoration:none;

cursor:pointer;

margin-bottom:8px;

font-weight:bold;

transition:.2s;

}


.details-btn:hover{

background:var(--accent-dark);

}


/* =====================================================
   ADD TO CART
===================================================== */

.add-btn{

width:100%;

padding:10px;

border:none;

border-radius:12px;

background:var(--accent);

color:#fff;

cursor:pointer;

font-weight:bold;

transition:.2s;

}


.add-btn:hover{

background:var(--accent-dark);

}


.add-btn:disabled{

background:#BDBDBD;

cursor:not-allowed;

}


/* =====================================================
   EMPTY / LOADING
===================================================== */

.loading{

grid-column:1/-1;

text-align:center;

padding:50px 20px;

color:var(--muted);

}


.empty{

grid-column:1/-1;

text-align:center;

padding:50px 20px;

color:var(--muted);

background:#fff;

border-radius:18px;

border:1px solid var(--border);

transition:
background .3s ease,
border-color .3s ease,
color .3s ease;

}


/* =====================================================
   FLOATING CART
===================================================== */

.floating-cart{

position:fixed;

bottom:15px;

right:50%;

transform:translateX(50%);

width:90%;

max-width:500px;

background:var(--accent);

color:#fff;

padding:16px;

border-radius:30px;

text-align:center;

text-decoration:none;

box-shadow:

0 8px 20px rgba(244,123,32,.25);

z-index:500;

font-weight:bold;

transition:.2s;

}


.floating-cart:hover{

background:var(--accent-dark);

}


/* =====================================================
   TABLET
===================================================== */

@media(min-width:768px){

.products{

grid-template-columns:

repeat(4,1fr);

}

}


/* =====================================================
   DESKTOP
   DARK BLUE MODE
===================================================== */

@media(min-width:1000px){

:root{

--bg:#07111F;

--card:#0D1B2A;

--text:#F4F7FB;

--accent:#F47B20;

--accent-dark:#FF8C32;

--accent-light:#17283A;

--muted:#AAB7C7;

--border:#1D334A;

--danger:#EF6461;

--shadow:

0 8px 25px rgba(0,0,0,.30);

}


body{

background:#07111F;

color:#F4F7FB;

}


header{

background:#07111F;

border-bottom:1px solid #172A40;

box-shadow:
0 2px 15px rgba(0,0,0,.20);

}


/* STORE */

.store-banner{

background:#0D1B2A;

border-color:#1D334A;

box-shadow:

0 8px 28px rgba(0,0,0,.30);

}


.store-banner h1{

color:#F4F7FB;

}


.store-banner p{

color:#AAB7C7;

}


/* SEARCH */

.search-box input{

background:#0D1B2A;

color:#F4F7FB;

border-color:#1D334A;

box-shadow:

0 5px 18px rgba(0,0,0,.25);

}


.search-box input::placeholder{

color:#7F91A6;

}


/* SIDEBAR */

.sidebar{

background:#0A1726;

box-shadow:

-5px 0 20px rgba(0,0,0,.35);

}


.sidebar a{

color:#E8EEF5;

border-bottom-color:#1A2D42;

}


.sidebar a:hover{

background:#17283A;

color:#FF8C32;

}


/* CARDS */

.card{

background:#0D1B2A;

border-color:#1D334A;

box-shadow:

0 8px 24px rgba(0,0,0,.28);

}


.card h3{

color:#F4F7FB;

}


/* EMPTY */

.empty{

background:#0D1B2A;

border-color:#1D334A;

color:#AAB7C7;

}


/* LOADING */

.loading{

color:#AAB7C7;

}


/* PRODUCT IMAGE */

.card img{

background:#142538;

}


/* STORE IMAGE */

.store-banner-image img{

border-color:#0D1B2A;

}


/* FLOATING CART */

.floating-cart{

box-shadow:

0 10px 25px rgba(0,0,0,.35);

}

}


/* =====================================================
   LARGE DESKTOP
===================================================== */

@media(min-width:1200px){

.products{

grid-template-columns:

repeat(5,1fr);

}

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:400px){

.logo img{

width:105px;

max-height:50px;

}

.menu-btn,
.cart-icon{

font-size:25px;

}

.store-banner{

width:calc(100% - 20px);

margin-top:12px;

padding:25px 15px 22px;

}

.store-banner-image img{

width:100px;

height:100px;

}

.store-banner h1{

font-size:22px;

}

.store-banner p{

font-size:13px;

}

.products{

gap:10px;

padding:10px;

}

.card-content{

padding:10px;

}

.card h3{

font-size:14px;

}

.price{

font-size:16px;

}

}


/* =====================================================
   MOBILE ALWAYS LIGHT
===================================================== */

@media(max-width:999px){

body{

background:#F4F4F4;

color:#222222;

}

header{

background:#F4F4F4;

}

.store-banner{

background:#FFFFFF;

}

.store-banner h1{

color:#222222;

}

.store-banner p{

color:#777777;

}

.search-box input{

background:#FFFFFF;

color:#222222;

}

.sidebar{

background:#FFFFFF;

}

.sidebar a{

color:#222222;

}

.card{

background:#FFFFFF;

}

.card h3{

color:#222222;

}

.empty{

background:#FFFFFF;

}

}


/* =====================================================
   SCROLLBAR DESKTOP
===================================================== */

@media(min-width:1000px){

::-webkit-scrollbar{

width:8px;

height:8px;

}

::-webkit-scrollbar-track{

background:#07111F;

}

::-webkit-scrollbar-thumb{

background:#263E57;

border-radius:10px;

}

::-webkit-scrollbar-thumb:hover{

background:#F47B20;

}

}


/* =====================================================
   NORMAL SCROLLBAR
===================================================== */

@media(max-width:999px){

::-webkit-scrollbar{

width:6px;

height:6px;

}

::-webkit-scrollbar-track{

background:#F1F1F1;

}

::-webkit-scrollbar-thumb{

background:#CCC;

border-radius:10px;

}

::-webkit-scrollbar-thumb:hover{

background:#F47B20;

}

}

</style>

</head>


<body>

     OVERLAY
===================================================== -->

<div
class="overlay"
id="overlay">
</div>


<!-- =====================================================

===================================================== -->

<div
class="sidebar"
id="sidebar">


<a
href="#"
id="homeLink">

🏠 الرئيسية

</a>


<a
href="#"
id="cartLink">

🛒 السلة

</a>


<a
href="#"
id="contactLink"
target="_blank">

📞 اتصل بنا

</a>


</div>


<!-- =====================================================
     HEADER
===================================================== -->

<header>


<div
class="menu-btn"
id="menuBtn">

☰

</div>


<div
class="logo">

<img
src="logotrans.png"
alt="G-Glam"
>

</div>


<div
class="cart-icon"
id="cartButton">

🛒

<span

id="cartCount">

0

</div>


</header>

===================================================== -->

<div

<div

src=""

>

     FLOATING CART

id="floatingCart"
class="floating-cart">

🛒 عرض السلة

</a>


<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
collection,
getDocs,
query,
where,
doc,
getDoc

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:

"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:

"g-glam.firebaseapp.com",

projectId:

"g-glam",

storageBucket:

"g-glam.firebasestorage.app",

messagingSenderId:

"997228419719",

appId:

"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:

"G-WX1K1F83F6"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const productsContainer =
document.getElementById(
"productsContainer"
);


const searchInput =
document.getElementById(
"searchInput"
);


const cartCount =
document.getElementById(
"cartCount"
);


const storeNameElement =
document.getElementById(
"storeName"
);


const storeDescriptionElement =
document.getElementById(
"storeDescription"
);


const storeImage =
document.getElementById(
"storeImage"
);


/* =====================================================
   GET STORE IDENTIFIER (SLUG OR UID)
===================================================== */

const params = new URLSearchParams(window.location.search);
let rawStoreParam = params.get("store");

// في حال تم فتح الرابط مباشرة مثل domain.com/myshop
if (!rawStoreParam) {
  const pathParts = window.location.pathname.split('/').filter(p => p && p !== 'index.html');
  if (pathParts.length > 0) {
    rawStoreParam = pathParts[pathParts.length - 1];
  }
}

// Fallback من التخزين المحلي
if (!rawStoreParam) {
  rawStoreParam = localStorage.getItem("storeSlug") || localStorage.getItem("storeId");
}

let storeIdentifier = rawStoreParam;
let storeUid = null;


/* =====================================================
   CHECK IDENTIFIER REQUIRED
===================================================== */

if(!storeIdentifier){

productsContainer.innerHTML = `

<div class="empty">

<div
style="
font-size:50px;
margin-bottom:15px;
">

🏪

</div>


<h2>

لم يتم تحديد المتجر

</h2>


<p
style="
margin-top:10px;
">

يجب فتح رابط المتجر الخاص بصاحبه.

</p>

</div>

`;

throw new Error(
"STORE IDENTIFIER NOT FOUND"
);

}


/* =====================================================
   VARIABLES
===================================================== */

let allProducts = [];

let currentStore = null;


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
   UPDATE NAVIGATION LINKS
===================================================== */

function updateNavigationLinks() {
  const storeParamVal = currentStore?.slug || storeUid || storeIdentifier;

  document.getElementById("homeLink").href = "index.html?store=" + encodeURIComponent(storeParamVal);
  document.getElementById("cartLink").href = "cart.html?store=" + encodeURIComponent(storeParamVal);
  document.getElementById("floatingCart").href = "cart.html?store=" + encodeURIComponent(storeParamVal);
}


/* =====================================================
   LOAD STORE
===================================================== */

async function loadStore(){

try{

let storeSnap = null;

// 1. البحث باستخدام slug أولاً
const slugQuery = query(
  collection(db, "stores"),
  where("slug", "==", storeIdentifier)
);
const slugSnap = await getDocs(slugQuery);

if (!slugSnap.empty) {
  const docObj = slugSnap.docs[0];
  currentStore = docObj.data();
  storeUid = docObj.id; // تعيين الـ ownerUid الحقيقي للمتجر
} else {
  // 2. إذا لم يجد بالـ slug، نحاول البحث مباشرة بالـ UID كـ Document ID
  const storeRef = doc(db, "stores", storeIdentifier);
  storeSnap = await getDoc(storeRef);

  if (storeSnap.exists()) {
    currentStore = storeSnap.data();
    storeUid = storeSnap.id;
  } else {
    showStoreError("المتجر غير موجود.");
    return false;
  }
}

/* =====================================================
   SAVE CURRENT STORE DATA
===================================================== */

localStorage.setItem("storeId", storeUid);
if (currentStore.slug) {
  localStorage.setItem("storeSlug", currentStore.slug);
}


/* =====================================================
   CHECK STATUS
===================================================== */

const status =

String(
currentStore.status ||
"approved"
)

.toLowerCase()
.trim();


if(

status !== "approved" &&

status !== "active"

){

showStoreError(
"هذا المتجر غير متاح حاليًا."
);

return false;

}


/* =====================================================
   STORE NAME
===================================================== */

const name =

currentStore.storeName ||

currentStore.name ||

"G-Glam";


storeNameElement.textContent =
name;


document.title =
name + " | المتجر";


/* =====================================================
   STORE DESCRIPTION
===================================================== */

storeDescriptionElement.textContent =

currentStore.description ||

"Bienvenue dans notre boutique";


/* =====================================================
   STORE IMAGE
===================================================== */

const image =

currentStore.storeImage ||

currentStore.image ||

currentStore.logo ||

currentStore.photoURL ||

"";


if(image){

storeImage.src =
image;

storeImage.style.display =
"block";

}

else{

storeImage.style.display =
"none";

}


/* =====================================================
   CONTACT
===================================================== */

const contactLink =
document.getElementById(
"contactLink"
);


if(
currentStore.facebook
){

contactLink.href =
currentStore.facebook;

}

else if(
currentStore.phone
){

contactLink.href =
"tel:" +
currentStore.phone;

}

else{

contactLink.href =
"#";

}

// تحديث روابط التنقل
updateNavigationLinks();

return true;


}

catch(error){

console.error(
"STORE LOAD ERROR:",
error
);


showStoreError(
"حدث خطأ أثناء تحميل المتجر."
);


return false;

}

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

try{


productsContainer.innerHTML = `

<div class="loading">

⏳ جاري تحميل المنتجات...

</div>

`;


let snapshot;


/* =====================================================
   PRIMARY QUERY
===================================================== */

try{


const productsQuery =
query(

collection(
db,
"products"
),

where(
"ownerUid",
"==",
storeUid
)

);


snapshot =
await getDocs(
productsQuery
);


}

catch(error){

console.log(
"ownerUid query failed",
error
);


/* =====================================================
   OLD STORE ID
===================================================== */

const oldQuery =
query(

collection(
db,
"products"
),

where(
"storeId",
"==",
storeUid
)

);


snapshot =
await getDocs(
oldQuery
);

}


/* =====================================================
   PRODUCTS ARRAY
===================================================== */

allProducts = [];


snapshot.forEach(
productDoc => {

allProducts.push({

id:
productDoc.id,

...productDoc.data()

});

});


renderProducts(
allProducts
);


}

catch(error){

console.error(
"PRODUCTS ERROR:",
error
);


productsContainer.innerHTML = `

<div class="empty">

❌ حدث خطأ أثناء تحميل المنتجات.

<br><br>

${escapeHtml(
error.message || ""
)}

</div>

`;

}

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(
products
){

productsContainer.innerHTML =
"";


if(
!products.length
){

productsContainer.innerHTML = `

<div class="empty">

<div
style="
font-size:45px;
">

🛍️

</div>

<br>

لا توجد منتجات في هذا المتجر حاليًا.

</div>

`;

return;

}


products.forEach(
product => {


const image =

product.image ||

(

Array.isArray(
product.images
)

&&

product.images.length

?

product.images[0]

:

""

);


const name =

product.name ||

"منتج";


const price =

Number(
product.price || 0
);


const stock =

Number(
product.stock ?? 0
);


const outOfStock =
stock <= 0;


const card =
document.createElement(
"div"
);


card.className =
"card";


card.innerHTML = `

<img

src="${escapeHtml(
image
)}"

alt="${escapeHtml(
name
)}"

onerror="
this.src='https://via.placeholder.com/400x400?text=Product';
"

>


<div
class="card-content">


<h3>

${escapeHtml(
name
)}

</h3>


<div
class="price">

${price} DA

</div>


${
outOfStock

?

`

<div
style="
color:#c00;
font-size:13px;
font-weight:bold;
margin-bottom:8px;
">

غير متوفر حاليًا

</div>

`

:

`

<div
style="
color:#777;
font-size:12px;
margin-bottom:8px;
">

متوفر: ${stock}

</div>

`

}


<button
class="details-btn">

عرض المنتج

</button>


<button
class="add-btn"

${

outOfStock

?

"disabled"

:

""

}

>

${

outOfStock

?

"غير متوفر"

:

"أضف إلى السلة"

}

</button>


</div>

`;


/* =====================================================
   VIEW PRODUCT
===================================================== */

card
.querySelector(
".details-btn"
)
.addEventListener(
"click",
function(){

const storeParamVal = currentStore?.slug || storeUid;

window.location.href =

"product.html?id=" +

encodeURIComponent(
product.id
) +

"&store=" +

encodeURIComponent(
storeParamVal
);

}
);


/* =====================================================
   ADD TO CART
===================================================== */

const addButton =
card.querySelector(
".add-btn"
);


if(
!outOfStock
){

addButton.addEventListener(
"click",
function(){

addToCart(
product
);

}
);

}


productsContainer.appendChild(
card
);

});

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(
product
){

let cart =

JSON.parse(
localStorage.getItem(
"cart"
)
) || [];


/* =====================================================
   OTHER STORE
===================================================== */

const otherStoreItems =

cart.filter(
item =>

item.storeUid &&

item.storeUid !== storeUid

);


if(
otherStoreItems.length
){

const confirmChange =
confirm(

"السلة تحتوي منتجات من متجر آخر.\n\n" +

"هل تريد إفراغ السلة والشراء من هذا المتجر؟"

);


if(
!confirmChange
){

return;

}


cart = [];

}


/* =====================================================
   EXISTING PRODUCT
===================================================== */

const existing =

cart.find(
item =>

item.id ===
product.id &&

item.storeUid ===
storeUid

);


if(
existing
){

existing.quantity += 1;

}

else{

cart.push({

id:
product.id,

name:
product.name,

price:
Number(
product.price || 0
),

image:

product.image ||

(

Array.isArray(
product.images
)

&&

product.images.length

?

product.images[0]

:

""

),

quantity:
1,

color:
"بدون لون",

storeUid:
storeUid,

storeName:

currentStore?.storeName ||

currentStore?.name ||

"G-Glam"

});

}


localStorage.setItem(

"cart",

JSON.stringify(
cart
)

);


localStorage.setItem(
"cartStoreId",
storeUid
);


updateCartCount();


alert(
"تمت إضافة المنتج إلى السلة 🛒"
);

}


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount(){

let cart =

JSON.parse(
localStorage.getItem(
"cart"
)
) || [];


const storeCart =

cart.filter(
item =>

item.storeUid ===
storeUid

);


let total = 0;


storeCart.forEach(
item => {

total +=

Number(
item.quantity || 0
);

});


cartCount.textContent =
total;

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
"input",
function(){

const keyword =

this.value
.toLowerCase()
.trim();


if(
!keyword
){

renderProducts(
allProducts
);

return;

}


const filtered =

allProducts.filter(
product => {


const name =

String(
product.name || ""
)
.toLowerCase();


const description =

String(
product.description || ""
)
.toLowerCase();


return (

name.includes(
keyword
)

||

description.includes(
keyword
)

);

});


renderProducts(
filtered
);

});
