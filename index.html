<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" id="themeColorMeta" content="#FFFFFF">
    <title>المتجر الإلكتروني</title>
    
    <style>
        /* =====================================================
           THEME & CSS VARIABLES SETUP
        ===================================================== */
        :root {
            /* Default Theme (Orange) */
            --bg: #F8FAFC;
            --header: #FFFFFF;
            --card: #FFFFFF;
            --sidebar: #FFFFFF;
            --text: #0F172A;
            --accent: #F97316;
            --accent-dark: #EA580C;
            --border: #E2E8F0;
            --input-text: #0F172A;
        }

        /* Preset Themes Classes */
        body.theme-orange {
            --bg: #F8FAFC; --header: #FFFFFF; --card: #FFFFFF;
            --text: #0F172A; --accent: #F97316; --accent-dark: #EA580C;
        }
        body.theme-blue {
            --bg: #F0F9FF; --header: #FFFFFF; --card: #FFFFFF;
            --text: #0C4A6E; --accent: #0284C7; --accent-dark: #0369A1;
        }
        body.theme-green {
            --bg: #F0FDF4; --header: #FFFFFF; --card: #FFFFFF;
            --text: #14532D; --accent: #16A34A; --accent-dark: #15803D;
        }
        body.theme-purple {
            --bg: #FAF5FF; --header: #FFFFFF; --card: #FFFFFF;
            --text: #581C87; --accent: #9333EA; --accent-dark: #7E22CE;
        }
        body.theme-pink {
            --bg: #FDF2F8; --header: #FFFFFF; --card: #FFFFFF;
            --text: #831843; --accent: #EC4899; --accent-dark: #DB2777;
        }
        body.theme-dark {
            --bg: #0A1726; --header: #1E293B; --card: #1E293B;
            --sidebar: #1E293B; --text: #F8FAFC; --accent: #F97316;
            --accent-dark: #EA580C; --border: #334155; --input-text: #F8FAFC;
        }

        /* Basic Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            transition: background-color 0.3s ease, color 0.3s ease;
            min-height: 100vh;
        }

        header {
            background-color: var(--header);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .product-card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #FFFFFF;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s ease;
            width: 100%;
            margin-top: 1rem;
        }

        .btn-primary:hover {
            background-color: var(--accent-dark);
        }
    </style>
</head>
<body class="theme-orange">

    <header>
        <div class="logo" id="storeName">اسم المتجر</div>
    </header>

    <div class="container">
        <h1 id="welcomeText">مرحباً بكم في متجرنا</h1>
        <div class="products-grid" id="productsGrid">
            <!-- سيتم تحميل المنتجات هنا ديناميكياً -->
        </div>
    </div>

    <!-- Firebase SDK Modular (v11) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

        // إعدادات مشروع Firebase الخاص بك
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const themeColorMeta = document.getElementById("themeColorMeta");

        /* =====================================================
           APPLY STORE THEME & CUSTOM COLORS
        ===================================================== */
        function applyStoreTheme(storeData) {
            let theme = typeof storeData === 'string' ? storeData : (storeData?.theme || storeData?.storeTheme || "orange");
            theme = String(theme).toLowerCase().trim();

            const validThemes = ["orange", "blue", "green", "purple", "pink", "dark"];

            if (!validThemes.includes(theme)) {
                theme = "orange";
            }

            // إزالة جميع كلاسات الثيمات القائمة
            document.body.classList.remove(
                "theme-orange",
                "theme-blue",
                "theme-green",
                "theme-purple",
                "theme-pink",
                "theme-dark"
            );

            // إضافة كلاس الثيم المحدد
            document.body.classList.add("theme-" + theme);

            // قراءة وتطبيق الألوان المخصصة عند حفظها من settings.html
            if (typeof storeData === 'object' && storeData !== null) {
                
                // اللون الرئيسي (Primary Accent)
                const primaryColor = storeData.primaryColor || storeData.accentColor || storeData.themeColor;
                if (primaryColor) {
                    document.documentElement.style.setProperty('--accent', primaryColor);
                    document.documentElement.style.setProperty('--accent-dark', primaryColor);
                }

                // لون الخلفية (Background)
                const bgColor = storeData.backgroundColor || storeData.bgColor;
                if (bgColor) {
                    document.documentElement.style.setProperty('--bg', bgColor);
                }

                // لون الهيدر / البطاقات (Header & Cards)
                const cardBg = storeData.cardColor || storeData.headerBg;
                if (cardBg) {
                    document.documentElement.style.setProperty('--header', cardBg);
                    document.documentElement.style.setProperty('--card', cardBg);
                    document.documentElement.style.setProperty('--sidebar', cardBg);
                }

                // لون النصوص (Text Color)
                const textColor = storeData.textColor;
                if (textColor) {
                    document.documentElement.style.setProperty('--text', textColor);
                    document.documentElement.style.setProperty('--input-text', textColor);
                }
            }

            // تحديث لون شريط المتصفح للأجهزة المحمولة
            const themeColors = {
                orange: "#FFFFFF",
                blue: "#FFFFFF",
                green: "#FFFFFF",
                purple: "#FFFFFF",
                pink: "#FFFFFF",
                dark: "#0A1726"
            };

            if (themeColorMeta) {
                themeColorMeta.content = (typeof storeData === 'object' && storeData?.primaryColor) 
                    ? storeData.primaryColor 
                    : (themeColors[theme] || "#FFFFFF");
            }

            localStorage.setItem("gglamStoreTheme", theme);
        }

        /* =====================================================
           LOAD STORE & PRODUCTS DATA
        ===================================================== */
        async function loadStore() {
            // حدد معرف المتجر المطلوبة قراءته (مثال: من الرابط أو ثابت)
            const storeId = "DEFAULT_STORE_ID"; 

            try {
                const storeRef = doc(db, "stores", storeId);
                const storeSnap = await getDoc(storeRef);

                if (storeSnap.exists()) {
                    const currentStore = storeSnap.data();

                    // 1. تحديث اسم المتجر
                    if (currentStore.name) {
                        document.getElementById("storeName").textContent = currentStore.name;
                    }

                    // 2. تطبيق الثيم والألوان المخصصة
                    applyStoreTheme(currentStore);

                    // 3. تحميل منتجات المتجر
                    loadProducts(storeId);
                } else {
                    console.warn("لم يتم العثور على وثيقة المتجر.");
                }
            } catch (error) {
                console.error("خطأ أثناء جلب بيانات المتجر:", error);
            }
        }

        async function loadProducts(storeId) {
            const productsGrid = document.getElementById("productsGrid");
            productsGrid.innerHTML = "";

            try {
                const productsRef = collection(db, "stores", storeId, "products");
                const querySnapshot = await getDocs(productsRef);

                querySnapshot.forEach((docSnap) => {
                    const product = docSnap.data();
                    const card = document.createElement("div");
                    card.className = "product-card";
                    card.innerHTML = `
                        <img src="${product.image || 'https://via.placeholder.com/200'}" alt="${product.name}">
                        <h3>${product.name || 'منتج بدون عنوان'}</h3>
                        <p style="margin: 0.5rem 0; font-weight: bold; color: var(--accent);">${product.price || 0} د.ج</p>
                        <button class="btn-primary">شراء الآن</button>
                    `;
                    productsGrid.appendChild(card);
                });
            } catch (error) {
                console.error("خطأ أثناء تحميل المنتجات:", error);
            }
        }

        // تشغيل التحميل عند فتح الصفحة
        window.addEventListener("DOMContentLoaded", loadStore);
    </script>
</body>
</html>
