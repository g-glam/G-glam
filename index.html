<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam</title>

<style>

:root{

--bg:#F5F0E8;
--card:#FFFFFF;
--text:#222222;
--accent:#B89B7A;
--shadow:0 4px 15px rgba(0,0,0,.06);

}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:var(--bg);
color:var(--text);
padding-bottom:90px;

}

header{

display:flex;
align-items:center;
justify-content:space-between;
padding:20px;
background:var(--bg);
position:sticky;
top:0;
z-index:100;
}

.logo{

font-size:34px;
font-weight:800;
letter-spacing:1px;

}

.menu-btn,
.cart-icon{

font-size:28px;
cursor:pointer;
position:relative;

}

.cart-count{

position:absolute;
top:-8px;
left:-8px;
background:#d66;
color:#fff;
font-size:12px;
width:20px;
height:20px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;

}

.search-box{

padding:0 15px 20px;

}

.search-box input{

width:100%;
padding:15px 20px;
border:none;
border-radius:30px;
background:#fff;
box-shadow:var(--shadow);
font-size:15px;
outline:none;

}

/* القائمة الجانبية */

.sidebar{

position:fixed;
top:0;
right:-280px;
width:280px;
height:100%;
background:#fff;
box-shadow:-4px 0 15px rgba(0,0,0,.1);
z-index:999;
transition:.3s;
padding-top:30px;

}

.sidebar.active{

right:0;

}

.sidebar a{

display:block;
padding:16px 25px;
text-decoration:none;
color:#222;
font-size:17px;
border-bottom:1px solid #eee;

}

.sidebar a:hover{

background:#f5f5f5;

}

.overlay{

position:fixed;
inset:0;
background:rgba(0,0,0,.35);
display:none;
z-index:998;

}

.overlay.active{

display:block;

}
    
/* المنتجات */

.products{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:15px;

}

.card{

background:var(--card);
border-radius:18px;
overflow:hidden;
box-shadow:var(--shadow);
transition:.2s;

}

.card:hover{

transform:translateY(-2px);

}

.card img{

width:100%;
aspect-ratio:1/1;
object-fit:cover;
display:block;

}

.card-content{

padding:12px;

}

.card h3{

font-size:15px;
margin-bottom:8px;
height:38px;
overflow:hidden;

}

.price{

font-size:17px;
font-weight:bold;
margin-bottom:10px;

}

.details-btn{

display:block;
width:100%;
text-align:center;
padding:10px;
border:none;
border-radius:12px;
background:#222;
color:#fff;
text-decoration:none;
cursor:pointer;
margin-bottom:8px;

}

.add-btn{

width:100%;
padding:10px;
border:none;
border-radius:12px;
background:var(--accent);
color:#fff;
cursor:pointer;

}

/* زر السلة العائم */

.floating-cart{

position:fixed;
bottom:15px;
right:50%;
transform:translateX(50%);
width:90%;
max-width:500px;
background:#222;
color:#fff;
padding:16px;
border-radius:30px;
text-align:center;
text-decoration:none;
box-shadow:0 8px 20px rgba(0,0,0,.2);
z-index:500;

}

@media(min-width:768px){

.products{

grid-template-columns:
repeat(4,1fr);

}

}

@media(min-width:1200px){

.products{

grid-template-columns:
repeat(5,1fr);

}

}

</style>

</head>

<body>

<div class="overlay"
id="overlay">

</div>

<div class="sidebar"
id="sidebar">

<a href="index.html">
الرئيسية
</a>

<a href="#">
جميع المنتجات
</a>

<a href="cart.html">
السلة
</a>

<a href="#">
تتبع الطلب
</a>

<a href="#">
اتصل بنا
</a>

</div>

<header>

<div class="menu-btn"
id="menuBtn">

☰

</div>

<div class="logo">

G-Glam

</div>

<div
class="cart-icon"
onclick="window.location.href='cart.html'">

🛒

<span
class="cart-count"
id="cartCount">

0

</span>

</div>

</header>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="ابحث عن منتج...">

</div>

<div
class="products"
id="productsContainer">

</div>

<a
href="cart.html"
class="floating-cart">

🛒 عرض السلة

</a>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {

apiKey:"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:"g-glam.firebaseapp.com",

projectId:"g-glam",

storageBucket:"g-glam.firebasestorage.app",

messagingSenderId:"997228419719",

appId:"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:"G-WX1K1F83F6"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const productsContainer =

document.getElementById(
"productsContainer"
);

let allProducts = [];
    
async function loadProducts(){

productsContainer.innerHTML = "";

const querySnapshot =

await getDocs(
collection(db,"products")
);

allProducts = [];

querySnapshot.forEach((productDoc)=>{

const product = productDoc.data();

allProducts.push({

id:productDoc.id,

...product

});

});

renderProducts(allProducts);

}

function renderProducts(products){

productsContainer.innerHTML = "";

products.forEach(product => {

const image =

product.image ||

(
product.images &&
product.images.length
? product.images[0]
: ""
);

productsContainer.innerHTML += `

<div class="card">

<img
src="${image}"
alt="${product.name}">

<div class="card-content">

<h3>

${product.name}

</h3>

<div class="price">

${product.price} DA

</div>

<button
class="details-btn"
onclick="viewProduct('${product.id}')">

عرض المنتج

</button>

<button
class="add-btn"
onclick="addToCart(
'${product.id}',
'${product.name}',
${product.price},
'${image}'
)">

أضف إلى السلة

</button>

</div>

</div>

`;

});

}
    
window.addToCart = function(

id,
name,
price,
image

){

let cart =

JSON.parse(
localStorage.getItem("cart")
) || [];

let existing =

cart.find(item =>
item.id === id
);

if(existing){

existing.quantity += 1;

}else{

cart.push({

id:id,

name:name,

price:price,

image:image,

quantity:1

});

}

localStorage.setItem(

"cart",

JSON.stringify(cart)

);

updateCartCount();

};

window.viewProduct = function(productId){

window.location.href =

"product.html?id=" + productId;

};

function updateCartCount(){

let cart =

JSON.parse(
localStorage.getItem("cart")
) || [];

let total = 0;

cart.forEach(item=>{

total += item.quantity;

});

document.getElementById(
"cartCount"
).textContent = total;

}
    
document
.getElementById("searchInput")
.addEventListener("input",function(){

const keyword =

this.value
.toLowerCase()
.trim();

if(!keyword){

renderProducts(allProducts);

return;

}

const filtered =

allProducts.filter(product =>

(product.name || "")
.toLowerCase()
.includes(keyword)

);

renderProducts(filtered);

});

const sidebar =
document.getElementById("sidebar");

const overlay =
document.getElementById("overlay");

document
.getElementById("menuBtn")
.addEventListener("click",()=>{

sidebar.classList.add("active");

overlay.classList.add("active");

});

overlay.addEventListener("click",()=>{

sidebar.classList.remove("active");

overlay.classList.remove("active");

});

updateCartCount();

loadProducts();

</script>

</body>

</html>
