<style>

/* =====================================================
   COLORS
===================================================== */

:root{

--bg:#F4F4F4;

--white:#FFFFFF;

--text:#222222;

--muted:#777777;

--orange:#F47B20;

--orange-dark:#DF6810;

--orange-light:#FFF1E6;

--border:#E7E7E7;

--danger:#D9534F;

--shadow:
0 4px 18px rgba(0,0,0,.06);

}


/* =====================================================
   RESET
===================================================== */

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:"Tajawal",Arial,sans-serif;

}


/* =====================================================
   BODY
===================================================== */

body{

background:var(--bg);

color:var(--text);

min-height:100vh;

padding-bottom:90px;

}


/* =====================================================
   HEADER
===================================================== */

header{

height:72px;

background:var(--bg);

display:flex;

align-items:center;

justify-content:space-between;

padding:0 18px;

position:sticky;

top:0;

z-index:1000;

border-bottom:1px solid rgba(0,0,0,.04);

}


/* =====================================================
   MENU
===================================================== */

.menu-btn{

width:42px;

height:42px;

display:flex;

align-items:center;

justify-content:center;

font-size:25px;

cursor:pointer;

border-radius:12px;

transition:.2s;

}

.menu-btn:hover{

background:#E9E9E9;

}


/* =====================================================
   STORE NAME
===================================================== */

.header-store-name{

font-size:22px;

font-weight:800;

color:#222;

text-align:center;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

max-width:60%;

}


/* =====================================================
   STORE NAME ORANGE PART
===================================================== */

.header-store-name span{

color:var(--orange);

}


/* =====================================================
   CART
===================================================== */

.cart-button{

position:relative;

width:42px;

height:42px;

display:flex;

align-items:center;

justify-content:center;

font-size:24px;

cursor:pointer;

border-radius:12px;

transition:.2s;

}

.cart-button:hover{

background:#E9E9E9;

}


.cart-count{

position:absolute;

top:-2px;

left:-2px;

width:20px;

height:20px;

border-radius:50%;

background:var(--orange);

color:#fff;

font-size:11px;

font-weight:800;

display:flex;

align-items:center;

justify-content:center;

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

position:fixed;

top:0;

right:-290px;

width:290px;

height:100vh;

background:#fff;

z-index:3000;

box-shadow:
-5px 0 20px rgba(0,0,0,.12);

transition:.3s;

padding-top:20px;

}


.sidebar.active{

right:0;

}


/* =====================================================
   SIDEBAR HEADER
===================================================== */

.sidebar-header{

padding:20px;

border-bottom:1px solid var(--border);

text-align:center;

}


.sidebar-store-image{

width:75px;

height:75px;

border-radius:50%;

object-fit:cover;

background:#F1F1F1;

border:3px solid var(--orange-light);

margin-bottom:10px;

}


.sidebar-store-name{

font-size:18px;

font-weight:800;

}


/* =====================================================
   SIDEBAR LINKS
===================================================== */

.sidebar-link{

display:flex;

align-items:center;

gap:12px;

padding:16px 22px;

text-decoration:none;

color:#333;

font-size:15px;

font-weight:600;

border-bottom:1px solid #F1F1F1;

transition:.2s;

}


.sidebar-link:hover{

background:var(--orange-light);

color:var(--orange-dark);

}


/* =====================================================
   OVERLAY
===================================================== */

.overlay{

position:fixed;

inset:0;

background:rgba(0,0,0,.35);

z-index:2500;

display:none;

}


.overlay.active{

display:block;

}


/* =====================================================
   STORE HERO
===================================================== */

.store-hero{

padding:15px;

}


.store-card{

background:#fff;

border:1px solid var(--border);

border-radius:20px;

padding:22px 18px;

text-align:center;

}


.store-image{

width:90px;

height:90px;

border-radius:50%;

object-fit:cover;

background:#F1F1F1;

border:4px solid var(--orange-light);

margin-bottom:12px;

}


.store-name{

font-size:25px;

font-weight:800;

margin-bottom:7px;

color:#222;

}


.store-description{

font-size:14px;

color:var(--muted);

margin:auto;

}


/* =====================================================
   SEARCH
===================================================== */

.search-wrapper{

padding:0 15px 18px;

}


.search-box{

position:relative;

}


.search-box input{

width:100%;

height:52px;

padding:0 48px 0 18px;

border-radius:28px;

outline:none;

background:#fff;

font-size:15px;

box-shadow:var(--shadow);

transition:.2s;

}


.search-box input:focus{

border-color:var(--orange);

box-shadow:
0 0 0 3px rgba(244,123,32,.10);

}


.search-icon{

position:absolute;

right:18px;

top:50%;

transform:translateY(-50%);

font-size:20px;

color:#888;

pointer-events:none;

}


/* =====================================================
   PRODUCTS TITLE
===================================================== */

.products-header{

display:flex;

align-items:center;

justify-content:space-between;

padding:0 15px 12px;

}


.products-title{

font-size:20px;

font-weight:800;

}


.products-count{

font-size:13px;

color:var(--muted);

}


/* =====================================================
   PRODUCTS
===================================================== */

.products{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:14px;

padding:0 15px;

}


/* =====================================================
   PRODUCT CARD
===================================================== */

.product-card{

background:#fff;

border-radius:18px;

overflow:hidden;

border:1px solid rgba(0,0,0,.04);

box-shadow:var(--shadow);

transition:.2s;

}


.product-card:hover{

transform:translateY(-2px);

}


/* =====================================================
   PRODUCT IMAGE
===================================================== */

.product-image-wrapper{

position:relative;

width:100%;

aspect-ratio:1/1;

background:#F1F1F1;

overflow:hidden;

}


.product-image{

width:100%;

height:100%;

object-fit:cover;

display:block;

}


/* =====================================================
   OUT OF STOCK
===================================================== */

.stock-badge{

position:absolute;

top:10px;

right:10px;

background:var(--danger);

color:#fff;

padding:5px 9px;

border-radius:8px;

font-size:11px;

font-weight:700;

}


/* =====================================================
   PRODUCT CONTENT
===================================================== */

.product-content{

padding:12px;

}


.product-name{

font-size:15px;

font-weight:700;

line-height:1.5;

min-height:45px;

display:-webkit-box;

-webkit-line-clamp:2;

-webkit-box-orient:vertical;

overflow:hidden;

}


.product-description{

font-size:12px;

color:var(--muted);

line-height:1.6;

margin-top:5px;

min-height:19px;

display:-webkit-box;

-webkit-line-clamp:1;

-webkit-box-orient:vertical;

overflow:hidden;

}


/* =====================================================
   PRICE
===================================================== */

.product-price{

font-size:17px;

font-weight:800;

color:var(--orange-dark);

margin-top:8px;

}


/* =====================================================
   STOCK
===================================================== */

.product-stock{

font-size:12px;

color:var(--muted);

margin-top:4px;

}


/* =====================================================
   BUTTONS
===================================================== */

.product-actions{

display:flex;

gap:7px;

margin-top:10px;

}


.product-actions button{

border:none;

cursor:pointer;

border-radius:10px;

font-family:"Tajawal",Arial,sans-serif;

font-weight:700;

font-size:12px;

padding:10px 6px;

transition:.2s;

}


.details-button{

flex:1;

background:var(--orange-light);

color:var(--orange-dark);

}


.details-button:hover{

background:#FFE2CC;

}


.add-button{

flex:1;

background:var(--orange);

color:#fff;

}


.add-button:hover{

background:var(--orange-dark);

}


.add-button:disabled{

background:#BDBDBD;

cursor:not-allowed;

}


/* =====================================================
   EMPTY
===================================================== */

.empty{

grid-column:1/-1;

background:#fff;

border:1px dashed #D8D8D8;

border-radius:18px;

padding:55px 20px;

text-align:center;

color:var(--muted);

}


.empty-icon{

font-size:48px;

margin-bottom:12px;

}


.empty h2{

font-size:18px;

color:#444;

margin-bottom:8px;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

grid-column:1/-1;

text-align:center;

padding:55px 20px;

color:var(--muted);

}


.spinner{

width:35px;

height:35px;

border:4px solid #E5E5E5;

border-top-color:var(--orange);

border-radius:50%;

margin:0 auto 15px;

animation:spin .8s linear infinite;

}


@keyframes spin{

to{

transform:rotate(360deg);

}

}


/* =====================================================
   FLOATING CART
===================================================== */

.floating-cart{

position:fixed;

bottom:15px;

right:50%;

transform:translateX(50%);

width:calc(100% - 30px);

max-width:520px;

height:54px;

background:var(--orange);

color:#fff;

border-radius:28px;

display:flex;

align-items:center;

justify-content:center;

gap:8px;

text-decoration:none;

font-weight:800;

font-size:15px;

box-shadow:
0 8px 25px rgba(244,123,32,.28);

z-index:1500;

transition:.2s;

}


.floating-cart:hover{

background:var(--orange-dark);

}


/* =====================================================
   TOAST
===================================================== */

.toast{

position:fixed;

bottom:82px;

right:50%;

transform:
translateX(50%)
translateY(20px);

background:#222;

color:#fff;

padding:13px 20px;

border-radius:12px;

font-size:14px;

font-weight:600;

opacity:0;

visibility:hidden;

transition:.3s;

z-index:4000;

max-width:90%;

text-align:center;

}


.toast.show{

opacity:1;

visibility:visible;

transform:
translateX(50%)
translateY(0);

}


/* =====================================================
   TABLET
===================================================== */

@media(min-width:600px){

.products{

grid-template-columns:
repeat(3,1fr);

}


/* =====================================================

===================================================== */

@media(min-width:900px){

repeat(4,1fr);

.store-hero{

.products-header{

}

/* =====================================================

}

}


/* =====================================================

===================================================== */

@media(min-width:700px){

.store-card{

padding:28px;

}


.store-image{

width:110px;

height:110px;

}

}

<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
doc,
onSnapshot,
collection,
query,
where,
onSnapshot

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
initializeApp(
firebaseConfig
);


const db =
getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const storeNameElement =
document.getElementById(
"storeName"
);


const headerStoreName =
document.getElementById(
"headerStoreName"
);


const sidebarStoreName =
document.getElementById(
"sidebarStoreName"
);


const storeDescription =
document.getElementById(
"storeDescription"
);


const storeImage =
document.getElementById(
"storeImage"
);


const sidebarStoreImage =
document.getElementById(
"sidebarStoreImage"
);


const productsContainer =
document.getElementById(
"productsContainer"
);


const productsCount =
document.getElementById(
"productsCount"
);


const searchInput =
document.getElementById(
"searchInput"
);


const cartCount =
document.getElementById(
"cartCount"
);


const floatingCartCount =
document.getElementById(
"floatingCartCount"
);


const toast =
document.getElementById(
"toast"
);


/* =====================================================
   GET STORE UID
===================================================== */

const params =
new URLSearchParams(
window.location.search
);


/*
   المتجر يجب أن يفتح هكذا:

   index.html?store=UID

*/

let storeUid =
params.get("store");


/*
   لا نعتمد على localStorage
   لتحديد متجر الزبون.

   الرابط هو المصدر الأساسي.

   localStorage يستخدم فقط
   كحل احتياطي إذا لم يوجد
   store في الرابط.
*/

if(!storeUid){

storeUid =
localStorage.getItem(
"storeId"
);

}


/* =====================================================
   STORE UID MISSING
===================================================== */

if(!storeUid){

showStoreError(
"لم يتم تحديد المتجر."
);

throw new Error(
"STORE UID NOT FOUND"
);

}


/* =====================================================
   SAVE CURRENT STORE
===================================================== */

localStorage.setItem(
"storeId",
storeUid
);


/* =====================================================
   CURRENT DATA
===================================================== */

let currentStore = null;

let allProducts = [];

let unsubscribeStore = null;

let unsubscribeProducts = null;


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
   FORMAT PRICE
===================================================== */

function formatPrice(price){

const number =
Number(price || 0);


return number.toLocaleString(
"fr-FR"
) + " DA";

}


/* =====================================================
   STORE IMAGE
===================================================== */

function setStoreImage(
url
){

if(!url){

storeImage.style.display =
"none";

sidebarStoreImage.style.display =
"none";

return;

}


storeImage.src =
url;

storeImage.style.display =
"inline-block";


sidebarStoreImage.src =
url;

sidebarStoreImage.style.display =
"inline-block";


storeImage.onerror =
function(){

this.style.display =
"none";

};


sidebarStoreImage.onerror =
function(){

this.style.display =
"none";

};

}


/* =====================================================
   LOAD STORE REAL-TIME
===================================================== */

function listenToStore(){

const storeRef =
doc(
db,
"stores",
storeUid
);


/*
   onSnapshot يعني:

   إذا التاجر غير الاسم
   أو الصورة
   أو الوصف

   المتجر يتحدث مباشرة.
*/

unsubscribeStore =
onSnapshot(

storeRef,

(snapshot)=>{


/* =================================================
   STORE NOT FOUND
================================================= */

if(!snapshot.exists()){

showStoreError(
"هذا المتجر غير موجود."
);

return;

}


/* =================================================
   STORE DATA
================================================= */

currentStore =
snapshot.data();


/* =================================================
   STORE STATUS
================================================= */

const status =

String(
currentStore.status ||
"approved"
)

.toLowerCase()
.trim();


/*
   المتجر العمومي يظهر فقط
   إذا كان مقبولًا / نشطًا.
*/

if(

status !== "approved" &&

status !== "active"

){

showStoreError(
"هذا المتجر غير متاح حاليًا."
);

return;

}


/* =================================================
   STORE NAME
================================================= */

const name =

currentStore.storeName ||

currentStore.name ||

"متجر";


/* =================================================
   STORE DESCRIPTION
================================================= */

const description =

currentStore.description ||

"";


/* =================================================
   STORE IMAGE
================================================= */

const image =

currentStore.storeImage ||

currentStore.image ||

currentStore.logo ||

"";


/* =================================================
   DISPLAY
================================================= */

storeNameElement.textContent =
name;


headerStoreName.textContent =
name;


sidebarStoreName.textContent =
name;


storeDescription.textContent =
description;


setStoreImage(
image
);


/* =================================================
   TITLE
================================================= */

document.title =
name;


/* =================================================
   SAVE STORE INFO
================================================= */

localStorage.setItem(
"currentStoreUid",
storeUid
);


localStorage.setItem(
"currentStoreName",
name
);


/* =================================================
   CONTACT
================================================= */

setupContact(
currentStore
);


},

(error)=>{

console.error(
"STORE LISTENER ERROR:",
error
);

showStoreError(
"تعذر تحميل معلومات المتجر."
);

}

);

}


/* =====================================================
   LOAD PRODUCTS REAL-TIME
===================================================== */

function listenToProducts(){

const productsRef =
collection(
db,
"products"
);


/*
   نفس البنية الموجودة
   في dashboard.html:

   products
   ownerUid == currentOwnerUid

   وبالنسبة للمتجر العام:

   ownerUid == storeUid
*/

const productsQuery =
query(

productsRef,

where(
"ownerUid",
"==",
storeUid
)

);


/*
   onSnapshot:

   إضافة منتج من لوحة التاجر
   → يظهر في المتجر.

   تعديل السعر
   → السعر يتغير.

   تعديل الصورة
   → الصورة تتغير.

   حذف المنتج
   → يختفي.

*/

unsubscribeProducts =
onSnapshot(

productsQuery,

(snapshot)=>{


allProducts = [];


snapshot.forEach(
(productDoc)=>{

allProducts.push({

id:
productDoc.id,

...productDoc.data()

});

});


/*
   ترتيب المنتجات
   حسب createdAt إذا كان موجودًا.

   بدون الاعتماد عليه
   إذا لم يكن موجودًا.
*/

allProducts.sort(
(a,b)=>{

const aTime =
getTimeValue(
a.createdAt
);

const bTime =
getTimeValue(
b.createdAt
);

return bTime - aTime;

});


renderProducts(
allProducts
);


},

(error)=>{

console.error(
"PRODUCTS LISTENER ERROR:",
error
);


productsContainer.innerHTML = `

<div class="empty">

<div class="empty-icon">
⚠️
</div>

<h2>
تعذر تحميل المنتجات
</h2>

<p>
تحقق من صلاحيات Firestore.
</p>

</div>

`;

}

);

}


/* =====================================================
   DATE VALUE
===================================================== */

function getTimeValue(
value
){

if(!value){

return 0;

}


try{

if(
typeof value.toMillis ===
"function"
){

return value.toMillis();

}


if(
value.seconds
){

return value.seconds * 1000;

}


const date =
new Date(value);


if(
!isNaN(
date.getTime()
)
){

return date.getTime();

}


}catch(error){

return 0;

}


return 0;

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(
products
){

productsContainer.innerHTML =
"";


productsCount.textContent =

products.length +

(
products.length === 1
?
" منتج"
:
" منتجات"
);


/* =================================================
   EMPTY
================================================= */

if(!products.length){

productsContainer.innerHTML = `

<div class="empty">

<div class="empty-icon">
🛍️
</div>

<h2>
لا توجد منتجات حاليًا
</h2>

<p>
سيتم عرض المنتجات هنا عند إضافتها من لوحة تحكم المتجر.
</p>

</div>

`;

return;

}


/* =================================================
   CREATE CARDS
================================================= */

products.forEach(
product=>{

const card =
createProductCard(
product
);

productsContainer.appendChild(
card
);

});

}


/* =====================================================
   CREATE PRODUCT CARD
===================================================== */

function createProductCard(
product
){

const card =
document.createElement(
"div"
);


card.className =
"product-card";


/* =================================================
   PRODUCT DATA
================================================= */

const name =

product.name ||

"منتج";


const description =

product.description ||

"";


const price =

Number(
product.price || 0
);


const stock =

Number(
product.stock ?? 0
);


const image =

product.image ||

(

Array.isArray(
product.images
)

&&

product.images.length

?

product.images[0]

:

"https://via.placeholder.com/500x500?text=Product"

);


/* =================================================
   STOCK
================================================= */

const outOfStock =
stock <= 0;


/* =================================================
   CARD
================================================= */

card.innerHTML = `

<div class="product-image-wrapper">

<img

class="product-image"

src="${escapeHtml(
image
)}"

alt="${escapeHtml(
name
)}"

>

${
outOfStock

?

`

<span class="stock-badge">

غير متوفر

</span>

`

:

""

}

</div>


<div class="product-content">

<div class="product-name">

${escapeHtml(
name
)}

</div>


<div class="product-description">

${escapeHtml(
description
)}

</div>


<div class="product-price">

${formatPrice(
price
)}

</div>


<div class="product-stock">

${
outOfStock

?

"غير متوفر حاليًا"

:

"متوفر: " + stock

}

</div>


<div class="product-actions">


<button
class="details-button"
type="button">

عرض المنتج

</button>


<button
class="add-button"
type="button"
${outOfStock ? "disabled" : ""}>

${
outOfStock

?

"غير متوفر"

:

"أضف للسلة"

}

</button>


</div>

</div>

`;


/* =================================================
   IMAGE ERROR
================================================= */

const imageElement =
card.querySelector(
".product-image"
);


imageElement.onerror =
function(){

this.src =
"https://via.placeholder.com/500x500?text=Product";

};


/* =================================================
   DETAILS
================================================= */

card
.querySelector(
".details-button"
)
.addEventListener(
"click",
()=>{

viewProduct(
product.id
);

}
);


/* =================================================
   ADD
================================================= */

const addButton =
card.querySelector(
".add-button"
);


if(!outOfStock){

addButton.addEventListener(
"click",
()=>{

addToCart(
product
);

}
);

}


return card;

}


/* =====================================================
   VIEW PRODUCT
===================================================== */

function viewProduct(
productId
){

/*
   نحافظ على UID المتجر
   عند فتح صفحة المنتج.
*/

window.location.href =

"product.html?id=" +

encodeURIComponent(
productId
) +

"&store=" +

encodeURIComponent(
storeUid
);

}


/* =====================================================
   CART
===================================================== */

function getCart(){

return JSON.parse(

localStorage.getItem(
"cart"
)

) || [];

}


/* =====================================================
   SAVE CART
===================================================== */

function saveCart(
cart
){

localStorage.setItem(

"cart",

JSON.stringify(
cart
)

);


/*
   نخزن المتجر أيضًا
   لمنع خلط متاجر مختلفة.
*/

localStorage.setItem(
"cartStoreId",
storeUid
);


updateCartCount();

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(
product
){

let cart =
getCart();


/*
   حذف منتجات متجر آخر
   إذا كانت موجودة.
*/

const hasOtherStore =

cart.some(
item =>

item.storeUid !==
storeUid

);


if(hasOtherStore){

const confirmed =
confirm(

"السلة تحتوي منتجات من متجر آخر.\n\n" +

"هل تريد إفراغ السلة والشراء من هذا المتجر؟"

);


if(!confirmed){

return;

}


cart = [];

}


/* =================================================
   EXISTING PRODUCT
================================================= */

const existing =

cart.find(
item =>

item.id ===
product.id &&

item.storeUid ===
storeUid

);


if(existing){

existing.quantity =
Number(
existing.quantity || 0
) + 1;


/*
   تحديث السعر من Firebase
   حتى لا يبقى السعر القديم.
*/

existing.price =
Number(
product.price || 0
);

existing.name =
product.name ||
existing.name;

existing.image =
product.image ||
existing.image;

}

else{

cart.push({

id:
product.id,

name:
product.name ||
"منتج",

price:
Number(
product.price || 0
),

image:

product.image ||

(

Array.isArray(
product.images
)

&&

product.images.length

?

product.images[0]

:

""

),

quantity:
1,

storeUid:
storeUid,

storeName:

currentStore?.storeName ||

currentStore?.name ||

"متجر"

});

}


/* =================================================
   SAVE
================================================= */

saveCart(
cart
);


showToast(
"تمت إضافة المنتج إلى السلة 🛒"
);

}


/* =====================================================
   UPDATE CART COUNT
===================================================== */

function updateCartCount(){

const cart =
getCart();


const storeCart =

cart.filter(
item =>

item.storeUid ===
storeUid

);


let total = 0;


storeCart.forEach(
item=>{

total +=
Number(
item.quantity || 0
);

});


cartCount.textContent =
total;


floatingCartCount.textContent =
total;

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
"input",
function(){

const keyword =

this.value
.toLowerCase()
.trim();


if(!keyword){

renderProducts(
allProducts
);

return;

}


const filtered =

allProducts.filter(
product=>{

const name =

String(
product.name || ""
)
.toLowerCase();


const description =

String(
product.description || ""
)
.toLowerCase();


return (

name.includes(
keyword
)

||

description.includes(
keyword
)

);

});


renderProducts(
filtered
);

});
