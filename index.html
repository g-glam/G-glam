<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta id="themeColorMeta" name="theme-color" content="#FFFFFF">
    <title>G-Glam Store</title>

    <style>
        /* =====================================================
           1. BASE RESET & TRANSITIONS
        ===================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        /* =====================================================
           2. THEME DEFINITIONS (CSS VARIABLES)
        ===================================================== */
        :root {
            --bg: #F4F4F4;
            --header: #FFFFFF;
            --card: #FFFFFF;
            --card-light: #FAFAFA;
            --text: #374151;
            --muted: #6B7280;
            --border: #E5E7EB;
            --accent: #F47B20;
            --accent-dark: #D96610;
            --input: #FFFFFF;
            --input-text: #374151;
            --sidebar: #FFFFFF;
            --sidebar-hover: #FFF7ED;
            --danger: #EF4444;
            --shadow: 0 8px 25px rgba(0, 0, 0, .10);
        }

        /* ORANGE THEME */
        body.theme-orange {
            --bg: #F4F4F4;
            --header: #FFFFFF;
            --card: #FFFFFF;
            --card-light: #FAFAFA;
            --text: #374151;
            --muted: #6B7280;
            --border: #E5E7EB;
            --accent: #F47B20;
            --accent-dark: #D96610;
            --input: #FFFFFF;
            --input-text: #374151;
            --sidebar: #FFFFFF;
            --sidebar-hover: #FFF7ED;
        }

        /* BLUE THEME */
        body.theme-blue {
            --bg: #EEF5FF;
            --header: #FFFFFF;
            --card: #FFFFFF;
            --card-light: #F8FBFF;
            --text: #1E3A5F;
            --muted: #64748B;
            --border: #D8E5F5;
            --accent: #2563EB;
            --accent-dark: #1D4ED8;
            --input: #FFFFFF;
            --input-text: #1E3A5F;
            --sidebar: #FFFFFF;
            --sidebar-hover: #EFF6FF;
        }

        /* GREEN THEME */
        body.theme-green {
            --bg: #EFFBF4;
            --header: #FFFFFF;
            --card: #FFFFFF;
            --card-light: #F8FFFA;
            --text: #14532D;
            --muted: #64748B;
            --border: #D9F0E1;
            --accent: #16A34A;
            --accent-dark: #15803D;
            --input: #FFFFFF;
            --input-text: #14532D;
            --sidebar: #FFFFFF;
            --sidebar-hover: #F0FDF4;
        }

        /* PURPLE THEME */
        body.theme-purple {
            --bg: #F7F0FF;
            --header: #FFFFFF;
            --card: #FFFFFF;
            --card-light: #FCF9FF;
            --text: #4C1D95;
            --muted: #6B7280;
            --border: #E8DDF5;
            --accent: #7C3AED;
            --accent-dark: #6D28D9;
            --input: #FFFFFF;
            --input-text: #4C1D95;
            --sidebar: #FFFFFF;
            --sidebar-hover: #F5F3FF;
        }

        /* PINK THEME */
        body.theme-pink {
            --bg: #FFF1F5;
            --header: #FFFFFF;
            --card: #FFFFFF;
            --card-light: #FFF8FA;
            --text: #881337;
            --muted: #6B7280;
            --border: #F3D5DF;
            --accent: #E11D48;
            --accent-dark: #BE123C;
            --input: #FFFFFF;
            --input-text: #881337;
            --sidebar: #FFFFFF;
            --sidebar-hover: #FFF1F5;
        }

        /* RED THEME */
        body.theme-red {
            --bg: #FFF5F5;
            --header: #FFFFFF;
            --card: #FFFFFF;
            --card-light: #FFF8F8;
            --text: #7F1D1D;
            --muted: #6B7280;
            --border: #FEE2E2;
            --accent: #DC2626;
            --accent-dark: #B91C1C;
            --input: #FFFFFF;
            --input-text: #7F1D1D;
            --sidebar: #FFFFFF;
            --sidebar-hover: #FEF2F2;
        }

        /* TEAL THEME */
        body.theme-teal {
            --bg: #F0FDFA;
            --header: #FFFFFF;
            --card: #FFFFFF;
            --card-light: #F7FEFC;
            --text: #134E4A;
            --muted: #64748B;
            --border: #CCFBF1;
            --accent: #0D9488;
            --accent-dark: #0F766E;
            --input: #FFFFFF;
            --input-text: #134E4A;
            --sidebar: #FFFFFF;
            --sidebar-hover: #CCFBF1;
        }

        /* GOLD / YELLOW THEME */
        body.theme-gold {
            --bg: #FEFCE8;
            --header: #FFFFFF;
            --card: #FFFFFF;
            --card-light: #FFFEF5;
            --text: #713F12;
            --muted: #71717A;
            --border: #FEF08A;
            --accent: #D97706;
            --accent-dark: #B45309;
            --input: #FFFFFF;
            --input-text: #713F12;
            --sidebar: #FFFFFF;
            --sidebar-hover: #FEF3C7;
        }

        /* DARK THEME */
        body.theme-dark {
            --bg: #07111F;
            --header: #0A1726;
            --card: #0D1B2A;
            --card-light: #132337;
            --text: #F3F4F6;
            --muted: #9AA9BB;
            --border: #223449;
            --accent: #F47B20;
            --accent-dark: #D96610;
            --input: #172536;
            --input-text: #F3F4F6;
            --sidebar: #0D1928;
            --sidebar-hover: #152437;
        }

        /* =====================================================
           3. BASIC LAYOUT STYLES
        ===================================================== */
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        header {
            background-color: var(--header);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            background-color: var(--card-light);
        }

        .product-title {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .product-price {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .btn-buy {
            background-color: var(--accent);
            color: #FFFFFF;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            text-align: center;
        }

        .btn-buy:hover {
            background-color: var(--accent-dark);
        }
    </style>
</head>
<body class="theme-orange">

    <header>
        <div class="logo" id="storeName">اسم المتجر</div>
    </header>

    <div class="container">
        <div class="grid" id="productsGrid">
            <div class="product-card">
                <div>
                    <h3 class="product-title">منتج تجريبي</h3>
                    <div class="product-price">2500 د.ج</div>
                </div>
                <button class="btn-buy">شراء الآن</button>
            </div>
        </div>
    </div>

    <script>
        const themeColorMeta = document.getElementById("themeColorMeta");

        /* =====================================================
           APPLY STORE THEME DYNAMICALLY
        ===================================================== */
        function applyStoreTheme(theme) {
            const validThemes = [
                "orange",
                "blue",
                "green",
                "purple",
                "pink",
                "red",
                "teal",
                "gold",
                "dark"
            ];

            theme = String(theme || "orange").toLowerCase().trim();

            if (!validThemes.includes(theme)) {
                theme = "orange";
            }

            // إزالة كافة أصناف الثيمات سابقة التطبيق
            document.body.className = document.body.className
                .split(" ")
                .filter(c => !c.startsWith("theme-"))
                .join(" ");

            // تطبيق صنف الثيم المحدد
            document.body.classList.add("theme-" + theme);

            // إسناد لون شريط النظام العلوي بحسب الثيم
            const themeMetaColors = {
                orange: "#FFFFFF",
                blue: "#FFFFFF",
                green: "#FFFFFF",
                purple: "#FFFFFF",
                pink: "#FFFFFF",
                red: "#FFFFFF",
                teal: "#FFFFFF",
                gold: "#FFFFFF",
                dark: "#0A1726"
            };

            if (themeColorMeta) {
                themeColorMeta.content = themeMetaColors[theme] || "#FFFFFF";
            }

            localStorage.setItem("gglamStoreTheme", theme);
        }

        // استرجاع الثيم المخزن عند تحميل الصفحة
        document.addEventListener("DOMContentLoaded", () => {
            const savedTheme = localStorage.getItem("gglamStoreTheme") || "orange";
            applyStoreTheme(savedTheme);
        });
    </script>
</body>
</html>
