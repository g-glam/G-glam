*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Tajawal",Arial,sans-serif
}

html{
    scroll-behavior:smooth
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    padding-bottom:95px;
    transition:background .25s ease,color .25s ease
}

button,
input{
    font-family:"Tajawal",Arial,sans-serif
}

header{
    height:70px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    background:var(--header);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:1000;
    transition:background .25s,border-color .25s
}

.logo{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    display:flex;
    align-items:center;
    justify-content:center;
    width:max-content;
    max-width:55%;
    text-align:center
}

.logo span{
    color:var(--accent);
    font-size:27px;
    line-height:1.2;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
}

.menu-btn,
.cart-icon{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
    color:var(--text);
    border-radius:10px;
    transition:background .2s,color .2s
}

.menu-btn:hover,
.cart-icon:hover{
    background:var(--sidebar-hover);
    color:var(--accent)
}

.menu-btn svg,
.cart-icon svg{
    width:29px;
    height:29px
}

.cart-count{
    position:absolute;
    top:-2px;
    right:-3px;
    width:21px;
    height:21px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--accent);
    color:#FFF;
    font-size:11px;
    font-weight:800;
    border:2px solid var(--header)
}

.store-section{
    width:100%;
    position:relative
}

.store-cover{
    width:100%;
    height:285px;
    overflow:hidden;
    background:var(--card-light);
    display:none
}

.store-cover img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:block
}

.store-info{
    text-align:center;
    padding:0 20px 32px;
    position:relative
}

.store-banner-image{
    width:145px;
    height:145px;
    margin:-72px auto 18px;
    position:relative;
    z-index:5
}

.store-banner-image img{
    width:145px;
    height:145px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    background:var(--card);
    border:5px solid var(--bg);
    box-shadow:0 7px 22px rgba(0,0,0,.25)
}

.store-banner h1{
    font-size:34px;
    line-height:1.3;
    font-weight:800;
    color:var(--text);
    margin-bottom:4px
}

.store-banner p{
    font-size:16px;
    color:var(--muted);
    line-height:1.8
}

.search-section{
    width:100%;
    max-width:1100px;
    margin:0 auto 14px;
    padding:0 25px
}

.search-box{
    position:relative;
    width:100%
}

.search-box input{
    width:100%;
    height:52px;
    border:1px solid var(--border);
    border-radius:14px;
    background:var(--input);
    color:var(--input-text);
    padding:0 50px 0 18px;
    outline:none;
    font-size:15px;
    transition:border-color .2s,box-shadow .2s
}

.search-box input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(244,123,32,.10)
}

.search-box input::placeholder{
    color:var(--muted)
}

.search-icon{
    position:absolute;
    right:17px;
    top:50%;
    transform:translateY(-50%);
    width:23px;
    height:23px;
    color:var(--muted);
    pointer-events:none
}

/* =====================================================
   التصنيفات
===================================================== */

.categories-section{
    width:100%;
    max-width:1100px;
    margin:0 auto 20px;
    padding:0 25px;
    box-sizing:border-box
}

.categories-title{
    width:100%;
    margin-bottom:10px
}

.categories-title h2{
    margin:0;
    font-size:19px;
    font-weight:800;
    color:var(--text)
}

/*
   مهم:
   جميع التصنيفات + زر "الكل"
   تكون في صف أفقي واحد.
*/
.categories-scroll{
    width:100%;
    display:flex !important;
    flex-direction:row !important;
    flex-wrap:nowrap !important;
    align-items:center;
    justify-content:flex-start;
    gap:9px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:3px 2px 8px;
    box-sizing:border-box;
    white-space:nowrap;
    direction:rtl;
    scrollbar-width:thin
}

.categories-scroll::-webkit-scrollbar{
    height:5px
}

.categories-scroll::-webkit-scrollbar-track{
    background:transparent
}

.categories-scroll::-webkit-scrollbar-thumb{
    background:var(--border);
    border-radius:10px
}

.categories-scroll .category-btn{
    display:inline-flex !important;
    flex:0 0 auto !important;
    width:auto !important;
    min-width:82px;
    max-width:none;
    height:40px;
    align-items:center;
    justify-content:center;
    padding:0 17px;
    white-space:nowrap;
    writing-mode:horizontal-tb;
    border:1px solid var(--border);
    border-radius:22px;
    background:var(--card);
    color:var(--text);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    transition:.2s ease
}

.categories-scroll .category-btn:hover{
    border-color:var(--accent);
    color:var(--accent);
    background:var(--sidebar-hover)
}

.categories-scroll .category-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#FFF;
    box-shadow:0 4px 12px rgba(0,0,0,.10)
}

.category-empty{
    width:100%;
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:10px 0
}

.products{
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:0 25px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.05);
    transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(0,0,0,.10);
    border-color:var(--accent)
}

.card img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
    background:var(--card-light)
}

.card-content{
    padding:13px
}

.card h3{
    font-size:15px;
    font-weight:800;
    color:var(--text);
    line-height:1.5;
    height:45px;
    overflow:hidden
}

.card-category{
    font-size:11px;
    color:var(--accent);
    font-weight:700;
    margin:4px 0 6px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
}

.price{
    font-size:17px;
    font-weight:800;
    color:var(--accent);
    margin-bottom:7px
}

.old-price{
    color:var(--muted);
    text-decoration:line-through;
    font-size:12px;
    margin-bottom:10px
}

.details-btn,
.add-btn{
    width:100%;
    height:38px;
    border-radius:9px;
    font-size:13px;
    font-weight:800;
    cursor:pointer;
    transition:.2s ease
}

.details-btn{
    background:transparent;
    color:var(--text);
    border:1px solid var(--border);
    margin-bottom:7px
}

.details-btn:hover{
    background:var(--accent);
    border-color:var(--accent);
    color:#FFF
}

.add-btn{
    background:var(--accent);
    color:#FFF;
    border:1px solid var(--accent)
}

.add-btn:hover{
    background:var(--accent-dark);
    border-color:var(--accent-dark)
}

.loading{
    grid-column:1/-1;
    text-align:center;
    padding:55px 20px;
    color:var(--muted)
}

.loading svg{
    width:38px;
    height:38px;
    animation:spin 1s linear infinite;
    color:var(--accent);
    margin-bottom:10px
}

@keyframes spin{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:55px 20px;
    color:var(--muted);
    background:var(--card);
    border:1px solid var(--border);
    border-radius:15px
}

.empty h2{
    color:var(--text);
    margin-top:10px
}

.empty-icon{
    width:50px;
    height:50px;
    color:var(--accent)
}

.social-section{
    width:100%;
    max-width:1100px;
    margin:45px auto 30px;
    padding:0 25px;
    scroll-margin-top:90px
}

.social-box{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:28px 20px;
    text-align:center;
    box-shadow:0 5px 18px rgba(0,0,0,.06)
}

.social-title{
    color:var(--text);
    font-size:24px;
    font-weight:800;
    margin-bottom:7px
}

.social-description{
    color:var(--muted);
    font-size:14px;
    margin-bottom:22px
}

.social-links{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:12px
}

.social-link{
    min-width:125px;
    min-height:48px;
    padding:10px 16px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--card-light);
    color:var(--text);
    text-decoration:none;
    font-size:14px;
    font-weight:700;
    transition:transform .2s ease,background .2s ease,border-color .2s ease,color .2s ease
}

.social-link:hover{
    transform:translateY(-2px);
    border-color:var(--accent);
    color:var(--accent);
    background:var(--sidebar-hover)
}

.social-link svg{

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig={

    apiKey:"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

    measurementId:"G-WX1K1F83F6"

};


const app=initializeApp(firebaseConfig);

const db=getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const productsContainer=
    document.getElementById("productsContainer");

const searchInput=
    document.getElementById("searchInput");

const cartCount=
    document.getElementById("cartCount");

const floatingCartCount=
    document.getElementById("floatingCartCount");

const storeNameElement=
    document.getElementById("storeName");

const headerStoreName=
    document.getElementById("headerStoreName");

const storeDescriptionElement=
    document.getElementById("storeDescription");

const storeImage=
    document.getElementById("storeImage");

const storeCover=
    document.getElementById("storeCover");

const storeCoverImage=
    document.getElementById("storeCoverImage");

const themeColorMeta=
    document.getElementById("themeColorMeta");

const socialLinks=
    document.getElementById("socialLinks");

const categoriesContainer=
    document.getElementById("categoriesContainer");

const sidebar=
    document.getElementById("sidebar");

const overlay=
    document.getElementById("overlay");

const menuBtn=
    document.getElementById("menuBtn");

const cartButton=
    document.getElementById("cartButton");

const cartLink=
    document.getElementById("cartLink");

const homeLink=
    document.getElementById("homeLink");

const contactLink=
    document.getElementById("contactLink");

const floatingCart=
    document.getElementById("floatingCart");


/* =====================================================
   STORE IDENTIFIER
===================================================== */

const params=
    new URLSearchParams(
        window.location.search
    );

let storeIdentifier=
    params.get("store");


if(!storeIdentifier){

    const pathParts=
        window.location.pathname
        .split("/")
        .filter(
            p=>
                p &&
                p!=="index.html"
        );

    if(pathParts.length){

        const lastPart=
            pathParts[pathParts.length-1];

        if(!lastPart.includes(".")){

            storeIdentifier=
                lastPart;

        }

    }

}


if(!storeIdentifier){

    storeIdentifier=
        localStorage.getItem("storeId")||"";

}


let storeUid=
    storeIdentifier;

let currentStoreId="";

let currentOwnerUid="";

let allProducts=[];

let allCategories=[];

let currentCategoryId="all";

let currentStore=null;


/* =====================================================
   CART
===================================================== */

function getCartKey(){

    return "gglam_cart_"+currentStoreId;

}


function getCart(){

    if(!currentStoreId)return[];

    try{

        const saved=
            localStorage.getItem(
                getCartKey()
            );

        const cart=
            saved?JSON.parse(saved):[];

        return Array.isArray(cart)
            ?cart
            :[];

    }catch(error){

        console.error(
            "GET CART ERROR:",
            error
        );

        return[];

    }

}


function saveCart(cart){

    if(!currentStoreId)return;

    localStorage.setItem(
        getCartKey(),
        JSON.stringify(cart)
    );

}


function updateCartCount(){

    const cart=
        getCart();

    const count=
        cart.reduce(
            (total,item)=>
                total+
                (
                    Number(item.quantity)||1
                ),
            0
        );

    cartCount.textContent=
        String(count);

    if(floatingCartCount){

        floatingCartCount.textContent=
            String(count);

    }

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(product){

    if(!currentStoreId)return;

    const cart=
        getCart();

    const productId=
        String(product.id);

    const existing=
        cart.find(
            item=>
                String(item.id)===productId
        );


    if(existing){

        existing.quantity=
            (
                Number(existing.quantity)||1
            )+1;

    }else{

        cart.push({

            id:product.id,

            name:product.name||"منتج",

            price:Number(product.price)||0,

            oldPrice:Number(product.oldPrice)||0,

            image:getProductImage(product),

            quantity:1

        });

    }


    saveCart(cart);

    updateCartCount();


    const buttons=
        document.querySelectorAll(
            `[data-add-product-id="${CSS.escape(productId)}"]`
        );


    buttons.forEach(button=>{

        const original=
            button.textContent;

        button.textContent=
            "تمت الإضافة ✓";

        button.disabled=true;

        setTimeout(()=>{

            button.textContent=
                original;

            button.disabled=false;

        },900);

    });

}


/* =====================================================
   OPEN PRODUCT
===================================================== */

function openProduct(product){

    if(!currentStoreId||!product?.id)return;

    const url=
        "product.html?store="+
        encodeURIComponent(currentStoreId)+
        "&product="+
        encodeURIComponent(product.id);

    window.location.href=url;

}


/* =====================================================
   FORMAT PRICE
===================================================== */

function formatPrice(value){

    const number=
        Number(value)||0;

    return number.toLocaleString(
        "fr-FR"
    )+" DA";

}


/* =====================================================
   PRODUCT IMAGE
===================================================== */

function getProductImage(product){

    return String(
        product.image||
        product.imageUrl||
        product.mainImage||
        (
            Array.isArray(product.images)
                ?product.images[0]
                :""
        )||
        "data:image/svg+xml;charset=UTF-8,"+
        encodeURIComponent(
            `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600">
                <rect width="100%" height="100%" fill="#f3f4f6"/>
                <text x="50%" y="50%"
                    dominant-baseline="middle"
                    text-anchor="middle"
                    fill="#9ca3af"
                    font-size="28">
                    لا توجد صورة
                </text>
            </svg>`
        )
    );

}


/* =====================================================
   CATEGORY HELPERS
===================================================== */

function normalizeCategoryName(name){

    return String(name||"")
        .trim()
        .replace(/\s+/g," ")
        .toLocaleLowerCase("ar");

}


function getProductCategoryId(product){

    return String(
        product.categoryId||""
    ).trim();

}


function getProductCategoryName(product){

    return String(
        product.categoryName||
        product.category||
        ""
    ).trim();

}


/* =====================================================
   CATEGORY FILTER
===================================================== */

function productMatchesCategory(product){

    if(currentCategoryId==="all"){

        return true;

    }


    const productCategoryId=
        getProductCategoryId(product);


    /*
     * الربط الأساسي بين المنتج والتصنيف
     * يعتمد على categoryId.
     *
     * categoryName يستخدم للعرض والبحث فقط.
     */

    return(
        productCategoryId===
        String(currentCategoryId)
    );

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(){

    const term=
        String(
            searchInput.value||""
        )
        .trim()
        .toLocaleLowerCase("ar");


    const filtered=
        allProducts.filter(product=>{

            if(
                !productMatchesCategory(
                    product
                )
            ){

                return false;

            }


            if(!term){

                return true;

            }


            const name=
                String(
                    product.name||""
                )
                .toLocaleLowerCase("ar");


            const shortDescription=
                String(
                    product.shortDescription||""
                )
                .toLocaleLowerCase("ar");


            const category=
                String(
                    getProductCategoryName(
                        product
                    )
                )
                .toLocaleLowerCase("ar");


            return(
                name.includes(term)||
                shortDescription.includes(term)||
                category.includes(term)
            );

        });


    productsContainer.innerHTML="";


    if(!filtered.length){

        productsContainer.innerHTML=`

            <div class="empty">

                <svg class="empty-icon">
                    <use href="#icon-search"></use>
                </svg>

                <h2>
                    لا توجد منتجات
                </h2>

                <p>
                    لم نجد منتجات مطابقة
                    للبحث أو التصنيف المحدد.
                </p>

            </div>

        `;

        return;

    }


    const fragment=
        document.createDocumentFragment();


    filtered.forEach(product=>{

        const card=
            document.createElement("article");

        card.className="card";


        const image=
            document.createElement("img");

        image.src=
            getProductImage(product);

        image.alt=
            String(
                product.name||"منتج"
            );

        image.loading="lazy";


        image.onerror=function(){

            this.src=
                "data:image/svg+xml;charset=UTF-8,"+
                encodeURIComponent(

                    `<svg xmlns="http://www.w3.org/2000/svg"
                        width="600"
                        height="600">

                        <rect
                            width="100%"
                            height="100%"
                            fill="#f3f4f6"
                        />

                        <text
                            x="50%"
                            y="50%"
                            dominant-baseline="middle"
                            text-anchor="middle"
                            fill="#9ca3af"
                            font-size="28">

                            لا توجد صورة

                        </text>

                    </svg>`

                );

        };


        const content=
            document.createElement("div");

        content.className=
            "card-content";


        const title=
            document.createElement("h3");

        title.textContent=
            String(
                product.name||"منتج"
            );


        const category=
            document.createElement("div");

        category.className=
            "card-category";

        category.textContent=
            getProductCategoryName(
                product
            );


        const price=
            document.createElement("div");

        price.className="price";

        price.textContent=
            formatPrice(
                product.price
            );


        content.appendChild(title);


        if(
            getProductCategoryName(
                product
            )
        ){

            content.appendChild(
                category
            );

        }


        const oldPrice=
            Number(
                product.oldPrice
            )||0;

        const currentPrice=
            Number(
                product.price
            )||0;


        if(
            oldPrice>
            currentPrice &&
            currentPrice>0
        ){

            const old=
                document.createElement(
                    "div"
                );

            old.className=
                "old-price";

            old.textContent=
                formatPrice(
                    oldPrice
                );

            content.appendChild(
                price
            );

            content.appendChild(
                old
            );

        }else{

            content.appendChild(
                price
            );

        }


        const details=
            document.createElement(
                "button"
            );

        details.type="button";

        details.className=
            "details-btn";

        details.textContent=
            "عرض المنتج";

        details.addEventListener(
            "click",
            ()=>{
                openProduct(
                    product
                );
            }
        );


        const add=
            document.createElement(
                "button"
            );

        add.type="button";

        add.className=
            "add-btn";

        add.dataset.addProductId=
            String(product.id);

        add.textContent=
            "أضف إلى السلة";

        add.addEventListener(
            "click",
            ()=>{
                addToCart(
                    product
                );
            }
        );


        content.appendChild(
            details
        );

        content.appendChild(
            add
        );


        card.appendChild(
            image
        );

        card.appendChild(
            content
        );


        fragment.appendChild(
            card
        );

    });


    productsContainer.appendChild(
        fragment
    );

}

/* =====================================================
   LOAD CATEGORIES
===================================================== */

async function loadCategories(){

    categoriesContainer.innerHTML=`

        <button
            type="button"
            class="category-btn active"
            data-category-id="all"
        >
            الكل
        </button>

    `;


    try{

        if(
            !currentStoreId||
            !currentOwnerUid
        ){

            return;

        }


        const categoriesQuery=
            query(

                collection(
                    db,
                    "categories"
                ),

                where(
                    "storeId",
                    "==",
                    currentStoreId
                ),

                where(
                    "ownerUid",
                    "==",
                    currentOwnerUid
                )

            );


        const snapshot=
            await getDocs(
                categoriesQuery
            );


        const unique=
            new Map();


        snapshot.forEach(
            categoryDoc=>{

                const data=
                    categoryDoc.data()||{};


                const name=
                    String(
                        data.name||""
                    ).trim();


                const ownerUid=
                    String(
                        data.ownerUid||""
                    );


                const storeId=
                    String(
                        data.storeId||""
                    );


                if(
                    !name||
                    ownerUid!==currentOwnerUid||
                    storeId!==currentStoreId
                ){

                    return;

                }


                const normalized=
                    normalizeCategoryName(
                        name
                    );


                if(!unique.has(normalized)){

                    unique.set(
                        normalized,
                        {

                            id:
                                categoryDoc.id,

                            name,

                            storeId,

                            ownerUid,

                            ownerEmail:
                                String(
                                    data.ownerEmail||""
                                ),

                            storeName:
                                String(
                                    data.storeName||""
                                )

                        }
                    );

                }

            }
        );


        allCategories=
            Array.from(
                unique.values()
            ).sort(
                (a,b)=>
                    a.name.localeCompare(
                        b.name,
                        "ar"
                    )
            );


        if(
            !allCategories.some(
                category=>
                    category.id===
                    currentCategoryId
            )
        ){

            currentCategoryId=
                "all";

        }


        renderCategories(
            currentCategoryId
        );


    }catch(error){

        console.error(
            "LOAD CATEGORIES ERROR:",
            error
        );


        allCategories=[];

        currentCategoryId=
            "all";


        renderCategories(
            "all"
        );

    }

}
    async function loadProducts(){

    if(!currentStoreId){

        productsContainer.innerHTML=`

            <div class="empty">

                <h2>
                    تعذر تحميل المنتجات
                </h2>

                <p>
                    لم يتم تحديد المتجر بشكل صحيح.
                </p>

            </div>

        `;

        return;

    }


    productsContainer.innerHTML=`

        <div class="loading">

            <svg>
                <use href="#icon-loader"></use>
            </svg>

            <div>
                جاري تحميل المنتجات...
            </div>

        </div>

    `;


    try{

        /*
         * تحميل المنتجات المرتبطة بالمتجر
         * وبصاحب المتجر معًا.
         *
         * ownerUid و storeId هما الرابط
         * الأساسي بين المنتجات والمتجر.
         */

        const productsQuery=
            query(

                collection(
                    db,
                    "products"
                ),

                where(
                    "ownerUid",
                    "==",
                    currentOwnerUid
                ),

                where(
                    "storeId",
                    "==",
                    currentStoreId
                )

            );


        const snapshot=
            await getDocs(
                productsQuery
            );


        allProducts=[];


        snapshot.forEach(
            productDoc=>{

                const data=
                    productDoc.data()||{};


                allProducts.push({

                    id:
                        productDoc.id,

                    ...data

                });

            }
        );


        /*
         * الأحدث أولاً
         */

        allProducts.sort(
            (a,b)=>{

                const aTime=
                    a.createdAt?.seconds||0;

                const bTime=
                    b.createdAt?.seconds||0;

                return bTime-aTime;

            }
        );


        renderProducts();


    }catch(error){

        console.error(
            "LOAD PRODUCTS ERROR:",
            error
        );


        productsContainer.innerHTML=`

            <div class="empty">

                <h2>
                    تعذر تحميل المنتجات
                </h2>

                <p>
                    حدث خطأ أثناء تحميل
                    منتجات المتجر.
                </p>

            </div>

        `;

    }

}

/* =====================================================
   THEME
===================================================== */

function applyStoreTheme(
    themeOrStore
){

    const validThemes=[

        "orange",
        "blue",
        "green",
        "purple",
        "pink",
        "dark",
        "red",
        "teal",
        "gold",
        "luxury",
        "sunset",
        "emerald",
        "navy",
        "brown",
        "rose",
        "indigo",
        "custom-solid",
        "custom-gradient"

    ];


    let theme="orange";


    let store=
        themeOrStore;


    if(
        typeof themeOrStore==="string"
    ){

        theme=
            themeOrStore;

        store={};

    }else if(
        themeOrStore &&
        typeof themeOrStore==="object"
    ){

        theme=
            String(
                themeOrStore.theme||
                themeOrStore.storeTheme||
                themeOrStore.themeName||
                "orange"
            )
            .trim()
            .toLowerCase();

    }


    if(
        !validThemes.includes(
            theme
        )
    ){

        theme="orange";

    }


    document.body.classList.remove(
        ...validThemes.map(
            value=>"theme-"+value
        )
    );


    document.body.classList.add(
        "theme-"+theme
    );


    /*
     * الألوان القديمة المستخدمة
     * عند عدم وجود إعدادات مخصصة.
     */

    const legacyThemeColors={

        orange:"#F47B20",

        blue:"#1769AA",

        green:"#198754",

        purple:"#7B3FC6",

        pink:"#D94F87",

        dark:"#F47B20",

        red:"#E63946",

        teal:"#00B4D8",

        gold:"#D4AF37",

        luxury:"#D4AF37",

        sunset:"#FD1D1D",

        emerald:"#0F5132",

        navy:"#0B1F3A",

        brown:"#795548",

        rose:"#BE185D",

        indigo:"#4338CA"

    };


    /*
     * ألوان مخصصة
     */

    const customColor=
        String(
            store.customColor||
            store.primaryColor||
            store.accentColor||
            ""
        ).trim();


    const customGradient=
        String(
            store.customGradient||
            store.gradient||
            store.themeGradient||
            ""
        ).trim();


    if(
        theme==="custom-solid" &&
        customColor
    ){

        document.documentElement.style.setProperty(
            "--accent",
            customColor
        );

    }else if(
        theme==="custom-gradient" &&
        customGradient
    ){

        document.documentElement.style.setProperty(
            "--theme-gradient",
            customGradient
        );


        const firstColor=
            extractFirstGradientColor(
                customGradient
            );


        if(firstColor){

            document.documentElement.style.setProperty(
                "--accent",
                firstColor
            );

        }

    }else{

        const color=
            legacyThemeColors[theme]||
            "#F47B20";


        document.documentElement.style.setProperty(
            "--accent",
            color
        );

    }


    updateThemeMeta();

}


/* =====================================================
   GRADIENT COLOR
===================================================== */

function extractFirstGradientColor(
    gradient
){

    const match=
        String(
            gradient||""
        ).match(
            /(#[0-9a-fA-F]{3,8}|rgba?\([^)]+\)|hsla?\([^)]+\))/
        );


    return match
        ?match[1]
        :"";

}


/* =====================================================
   THEME META
===================================================== */

function updateThemeMeta(){

    if(!themeColorMeta)return;


    const accent=
        getComputedStyle(
            document.documentElement
        )
        .getPropertyValue(
            "--accent"
        )
        .trim();


    if(accent){

        themeColorMeta.setAttribute(
            "content",
            accent
        );

    }

}

===================================================== */

async function loadStore(){

    if(!storeIdentifier){

        storeNameElement.textContent=
            "المتجر غير محدد";

        headerStoreName.textContent=
            "G-Glam";


        productsContainer.innerHTML=`

            <div class="empty">

                <h2>
                    المتجر غير محدد
                </h2>

                <p>
                    يرجى فتح رابط المتجر الصحيح.
                </p>

            </div>

        `;

        return;

    }


    try{

        /*
         * أول محاولة:
         * storeIdentifier باعتباره
         * document ID الحقيقي للمتجر.
         */

        let storeSnap=
            await getDoc(
                doc(
                    db,
                    "stores",
                    storeIdentifier
                )
            );


        /*
         * دعم الروابط القديمة فقط.
         * بعد العثور على المتجر يتم استخدام
         * storeSnap.id الحقيقي في كل العمليات.
         */

        if(
            !storeSnap.exists()
        ){

            const ownerQuery=
                query(

                    collection(
                        db,
                        "stores"
                    ),

                    where(
                        "ownerUid",
                        "==",
                        storeIdentifier
                    )

                );


            const ownerSnapshot=
                await getDocs(
                    ownerQuery
                );


            if(
                !ownerSnapshot.empty
            ){

                storeSnap=
                    ownerSnapshot.docs[0];

            }

        }


        /*
         * دعم الروابط القديمة التي تستخدم البريد.
         */

        if(
            !storeSnap.exists()
        ){

            const emailQuery=
                query(

                    collection(
                        db,
                        "stores"
                    ),

                    where(
                        "ownerEmail",
                        "==",
                        storeIdentifier
                    )

                );


            const emailSnapshot=
                await getDocs(
                    emailQuery
                );


            if(
                !emailSnapshot.empty
            ){

                storeSnap=
                    emailSnapshot.docs[0];

            }

        }


        if(
            !storeSnap.exists()
        ){

            storeNameElement.textContent=
                "المتجر غير موجود";

            headerStoreName.textContent=
                "G-Glam";


            productsContainer.innerHTML=`

                <div class="empty">

                    <h2>
                        المتجر غير موجود
                    </h2>

                    <p>
                        تأكد من رابط المتجر
                        وحاول مرة أخرى.
                    </p>

                </div>

            `;

            return;

        }


        /*
         * storeSnap.id هو storeId الحقيقي.
         */

        currentStoreId=
            storeSnap.id;


        currentStore=
            storeSnap.data()||{};


        /*
         * ownerUid الحقيقي لصاحب المتجر.
         */

        currentOwnerUid=
            String(
                currentStore.ownerUid||
                currentStore.ownerUID||
                ""
            );


        storeUid=
            currentStoreId;


        localStorage.setItem(
            "storeId",
            currentStoreId
        );


        /*
         * حالة المتجر.
         */

        const status=
            String(
                currentStore.status||
                "approved"
            )
            .toLowerCase()
            .trim();


        if(
            status &&
            ![
                "approved",
                "active",
                "published"
            ].includes(status)
        ){

            storeNameElement.textContent=
                "المتجر غير متاح";

            headerStoreName.textContent=
                String(
                    currentStore.name||
                    currentStore.storeName||
                    "G-Glam"
                );


            productsContainer.innerHTML=`

                <div class="empty">

                    <h2>
                        المتجر غير متاح حاليًا
                    </h2>

                    <p>
                        هذا المتجر لم يتم تفعيله بعد.
                    </p>

                </div>

            `;

            return;

        }


        /*
         * إعدادات المتجر.
         */

        initPixels(
            currentStore
        );


        applyStoreTheme(
            currentStore
        );


        const name=
            String(
                currentStore.name||
                currentStore.storeName||
                currentStore.title||
                "G-Glam"
            ).trim();


        const description=
            String(
                currentStore.description||
                currentStore.storeDescription||
                "Bienvenue dans notre boutique"
            ).trim();


        storeNameElement.textContent=
            name;


        headerStoreName.textContent=
            name;


        storeDescriptionElement.textContent=
            description;


        /*
         * صورة المتجر.
         */

        const imageUrl=
            String(
                currentStore.image||
                currentStore.logo||
                currentStore.storeImage||
                currentStore.logoUrl||
                ""
            ).trim();


        if(imageUrl){

            storeImage.src=
                imageUrl;

            storeImage.style.display=
                "block";

        }else{

            storeImage.removeAttribute(
                "src"
            );

        }


        /*
         * غلاف المتجر.
         */

        const coverUrl=
            String(
                currentStore.cover||
                currentStore.coverImage||
                currentStore.storeCover||
                currentStore.coverUrl||
                ""
            ).trim();


        if(coverUrl){

            storeCoverImage.src=
                coverUrl;

            storeCover.style.display=
                "block";

        }else{

            storeCoverImage.removeAttribute(
                "src"
            );

            storeCover.style.display=
                "none";

        }


        renderSocialLinks();

        updateNavigationLinks();

        updateCartCount();


        /*
         * التصنيفات أولاً.
         */

        await loadCategories();


        /*
         * ثم المنتجات.
         */

        await loadProducts();

    }catch(error){

        console.error(
            "LOAD STORE ERROR:",
            error
        );


        storeNameElement.textContent=
            "تعذر تحميل المتجر";

        headerStoreName.textContent=
            "G-Glam";


        productsContainer.innerHTML=`

            <div class="empty">

                <h2>
                    تعذر تحميل المتجر
                </h2>

                <p>
                    حدث خطأ أثناء الاتصال
                    بقاعدة البيانات.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   INITIALIZE
===================================================== */

loadStore();


/* =====================================================
   UPDATE CART WHEN PAGE BECOMES VISIBLE
===================================================== */

document.addEventListener(
    "visibilitychange",
    ()=>{

        if(
            !document.hidden
        ){

            updateCartCount();

        }

    }
);


window.addEventListener(
    "storage",
    event=>{

        if(
            currentStoreId &&
            event.key===
            getCartKey()
        ){

            updateCartCount();

        }

    }
);


</script>
