<title>G-Glam | المتجر</title>

<style>

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html {
    scroll-behavior:smooth;
}

body {
    font-family:"Tajawal",Arial,sans-serif;
    background:#f7f7f7;
    color:#222;
    min-height:100vh;
}

:root {
    --accent:#F47B20;
    --accent-dark:#d96410;
    --bg:#f7f7f7;
    --card:#ffffff;
    --text:#222222;
    --muted:#777777;
    --border:#e5e5e5;
    --sidebar:#ffffff;
    --sidebar-hover:#f5f5f5;
    --danger:#e53935;
}

body.theme-orange {
    --accent:#F47B20;
}

body.theme-blue {
    --accent:#1769AA;
}

body.theme-green {
    --accent:#198754;
}

body.theme-purple {
    --accent:#7B3FC6;
}

body.theme-pink {
    --accent:#D94F87;
}

body.theme-dark {
    --accent:#0A1726;
    --bg:#111827;
    --card:#1f2937;
    --text:#ffffff;
    --muted:#c5c5c5;
    --border:#374151;
    --sidebar:#1f2937;
    --sidebar-hover:#374151;
}

body.theme-red {
    --accent:#E63946;
}

body.theme-teal {
    --accent:#00B4D8;
}

body.theme-gold,
body.theme-luxury {
    --accent:#D4AF37;
}

body.theme-sunset {
    --accent:#FD1D1D;
}

body.theme-emerald {
    --accent:#0F5132;
}

body.theme-navy {
    --accent:#0B1F3A;
}

body.theme-brown {
    --accent:#795548;
}

body.theme-rose {
    --accent:#BE185D;
}

body.theme-indigo {
    --accent:#4338CA;
}

/* =========================
   HEADER
========================= */

.header {
    width:100%;
    height:64px;
    background:var(--card);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    position:sticky;
    top:0;
    z-index:1000;
}

.header-right,
.header-left {
    display:flex;
    align-items:center;
    gap:12px;
}

.header button,
.header a {
    text-decoration:none;
}

.icon-btn {
    width:42px;
    height:42px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.icon-btn svg {
    width:21px;
    height:21px;
}

.header-store-name {
    font-weight:800;
    font-size:17px;
    color:var(--text);
}

/* =========================
   SIDEBAR
========================= */

.overlay {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:1500;
    display:none;
}

.overlay.show {
    display:block;
}

.sidebar {
    position:fixed;
    top:0;
    right:-310px;
    width:290px;
    height:100vh;
    background:var(--sidebar);
    z-index:2000;
    transition:right .25s ease;
    box-shadow:-5px 0 25px rgba(0,0,0,.12);
    padding:20px;
}

.sidebar.open {
    right:0;
}

.sidebar-title {
    font-size:21px;
    font-weight:800;
    color:var(--text);
    margin-bottom:25px;
}

.sidebar a {
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px;
    border-radius:12px;
    color:var(--text);
    text-decoration:none;
    margin-bottom:6px;
}

.sidebar a:hover {
    background:var(--sidebar-hover);
}

.sidebar svg {
    width:20px;
    height:20px;
}

/* =========================
   STORE HERO
========================= */

.store-cover {
    width:100%;
    max-width:1100px;
    margin:20px auto 0;
    padding:0 25px;
}

.store-cover-image {
    width:100%;
    height:230px;
    object-fit:cover;
    border-radius:20px;
    display:block;
    background:#eee;
}

.store-info {
    max-width:1100px;
    margin:-45px auto 25px;
    position:relative;
    z-index:5;
    padding:0 25px;
}

.store-info-inner {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
    display:flex;
    align-items:center;
    gap:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.store-image {
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid var(--card);
    box-shadow:0 2px 10px rgba(0,0,0,.15);
    background:#eee;
}

.store-text {
    flex:1;
}

.store-text h1 {
    font-size:25px;
    font-weight:800;
    color:var(--text);
    margin-bottom:7px;
}

.store-text p {
    color:var(--muted);
    font-size:14px;
}

/* =========================
   SEARCH
========================= */

.search-section {
    width:100%;
    max-width:1100px;
    margin:0 auto 20px;
    padding:0 25px;
}

.search-box {
    position:relative;
}

.search-box input {
    width:100%;
    height:48px;
    border:1px solid var(--border);
    border-radius:14px;
    background:var(--card);
    color:var(--text);
    padding:0 48px 0 15px;
    font-family:inherit;
    outline:none;
    font-size:14px;
}

.search-box input:focus {
    border-color:var(--accent);
}

.search-box svg {
    position:absolute;
    right:16px;
    top:14px;
    width:20px;
    height:20px;
    color:var(--muted);
}

/* =========================
   CATEGORIES
========================= */

.categories-section {
    width:100%;
    max-width:1100px;
    margin:0 auto 20px;
    padding:0 25px;
}

.categories-title {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:11px;
}

.categories-title h2 {
    font-size:19px;
    font-weight:800;
    color:var(--text);
}

.categories-scroll {
    display:flex;
    align-items:center;
    gap:9px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:3px 2px 8px;
    scrollbar-width:thin;
}

.category-btn {
    flex:0 0 auto;
    min-width:82px;
    height:40px;
    padding:0 17px;
    border:1px solid var(--border);
    border-radius:22px;
    background:var(--card);
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    transition:.2s ease;
}

.category-btn:hover {
    border-color:var(--accent);
    color:var(--accent);
    background:var(--sidebar-hover);
}

.category-btn.active {
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    box-shadow:0 4px 12px rgba(0,0,0,.10);
}

/* =========================
   PRODUCTS
========================= */

.products {
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:0 25px 35px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
}

.product-card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    transition:.2s ease;
}

.product-card:hover {
    transform:translateY(-2px);
    box-shadow:0 7px 20px rgba(0,0,0,.08);
}

.product-image-box {
    width:100%;
    aspect-ratio:1/1;
    background:#f1f1f1;
    overflow:hidden;
}

.product-image {
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.product-content {
    padding:13px;
}

.product-name {
    font-size:15px;
    font-weight:800;
    color:var(--text);
    line-height:1.5;
    min-height:45px;
}

.product-price {
    font-size:16px;
    font-weight:800;
    color:var(--accent);
    margin:7px 0 12px;
}

.product-actions {
    display:flex;
    flex-direction:column;
    gap:8px;
}

.product-btn {
    width:100%;
    height:40px;
    border-radius:10px;
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
}

.view-btn {
    background:var(--accent);
    color:#fff;
    border:1px solid var(--accent);
}

.cart-btn {
    background:var(--card);
    color:var(--text);
    border:1px solid var(--text);
}

.loading,
.empty-products,
.error-products {
    grid-column:1/-1;
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
}

.loading svg {
    width:30px;
    height:30px;
    animation:spin 1s linear infinite;
    margin-bottom:10px;
}

@keyframes spin {
    to {
        transform:rotate(360deg);
    }
}

/* =========================
   SOCIAL
========================= */

.social-section {
    width:100%;
    max-width:1100px;
    margin:20px auto 80px;
    padding:25px;
    text-align:center;
}

.social-section h2 {
    font-size:20px;
    font-weight:800;
    color:var(--text);
    margin-bottom:8px;
}

.social-section p {
    color:var(--muted);
    font-size:14px;
    margin-bottom:18px;
}

.social-links {
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

.social-link {
    width:44px;
    height:44px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    text-decoration:none;
}

.social-link svg {
    width:21px;
    height:21px;
}

/* =========================
   FLOATING CART
========================= */

.floating-cart {
    position:fixed;
    left:20px;
    bottom:20px;
    width:56px;
    height:56px;
    background:var(--accent);
    color:#fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    z-index:900;
    box-shadow:0 7px 20px rgba(0,0,0,.2);
}

.floating-cart svg {
    width:24px;
    height:24px;
}

.cart-count {
    position:absolute;
    top:-4px;
    right:-4px;
    min-width:21px;
    height:21px;
    padding:0 5px;
    border-radius:20px;
    background:#e53935;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:800;
}

/* =========================
   FOOTER
========================= */

.footer {
    text-align:center;
    padding:25px;
    color:var(--muted);
    border-top:1px solid var(--border);
    font-size:13px;
}

/* =========================
   MOBILE
========================= */

@media (max-width:900px) {

    .products {
        grid-template-columns:repeat(4,1fr);
    }

}

@media (max-width:600px) {

    .header {
        padding:0 12px;
    }

    .store-cover {
        padding:0 12px;
    }

    .store-cover-image {
        height:180px;
        border-radius:15px;
    }

    .store-info {
        padding:0 12px;
        margin-top:-35px;
    }

    .store-info-inner {
        padding:15px;
    }

    .store-image {
        width:70px;
        height:70px;
    }

    .store-text h1 {
        font-size:20px;
    }

    .search-section,
    .categories-section {
        padding:0 12px;
    }

    .products {
        grid-template-columns:repeat(2,1fr);
        gap:10px;
        padding:0 12px 30px;
    }

    .product-content {
        padding:10px;
    }

    .product-name {
        font-size:13px;
    }

    .product-price {
        font-size:14px;
    }

    .product-btn {
        height:37px;
        font-size:12px;
    }

}

</style>

</head>

const params =

    );


let storeIdentifier =
    params.get("store");


if (!storeIdentifier) {

    const pathParts =
        window.location.pathname
            .split("/")
            .filter(
                part =>
                    part &&
                    part !== "index.html"
            );

    if (pathParts.length > 0) {

        const lastPart =
            pathParts[
                pathParts.length - 1
            ];

        if (!lastPart.includes(".")) {

            storeIdentifier =
                lastPart;

        }

    }

}


if (!storeIdentifier) {

    storeIdentifier =
        localStorage.getItem(

        );

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   THEME
========================================================= */

function normalizeHexColor(value) {

    const color =
        String(
            value || ""
        ).trim();

    if (
        /^#[0-9A-Fa-f]{6}$/.test(color)
    ) {
        return color;
    }

    if (
        /^#[0-9A-Fa-f]{3}$/.test(color)
    ) {

        return "#" +
            color[1] + color[1] +
            color[2] + color[2] +
            color[3] + color[3];

    }

    return "";

}


function applyStoreTheme(store = {}) {

    const validThemes = [

        "orange",
        "blue",
        "green",
        "purple",
        "pink",
        "dark",
        "red",
        "teal",
        "gold",
        "luxury",
        "sunset",
        "emerald",
        "navy",
        "brown",
        "rose",
        "indigo"

    ];


    let theme =
        String(
            store.theme ||
            localStorage.getItem(
                "gglamStoreTheme"
            ) ||
            "orange"
        )
        .toLowerCase()
        .trim();


    const themeType =
        String(
            store.themeType ||
            localStorage.getItem(
                "gglamThemeType"
            ) ||
            "legacy"
        )
        .toLowerCase();


    document.body.className =
        "";


    if (
        themeType === "solid"
        &&
        store.themeColor
    ) {

        const color =
            normalizeHexColor(
                store.themeColor
            );

        if (color) {

            document.body.style.setProperty(
                "--accent",
                color
            );

            themeColorMeta.content =
                color;

            localStorage.setItem(
                "gglamThemeColor",
                color
            );

        }

        document.body.classList.add(
            "theme-orange"
        );

        return;

    }


    if (
        themeType === "gradient"
    ) {

        let colors =
            Array.isArray(
                store.themeColors
            )
                ? store.themeColors
                : [];

        colors =
            colors
                .map(normalizeHexColor)
                .filter(Boolean);


        if (colors.length >= 2) {

            document.body.style.background =
                "linear-gradient(135deg," +
                colors.join(",") +
                ")";

        }


        document.body.classList.add(
            "theme-orange"
        );

        return;

    }


    if (
        !validThemes.includes(theme)
    ) {

        theme =
            "orange";

    }


    document.body.classList.add(
        "theme-" + theme
    );


    const legacyThemeColors = {

        orange:"#F47B20",
        blue:"#1769AA",
        green:"#198754",
        purple:"#7B3FC6",
        pink:"#D94F87",
        dark:"#0A1726",
        red:"#E63946",
        teal:"#00B4D8",
        gold:"#D4AF37",
        luxury:"#D4AF37",
        sunset:"#FD1D1D",
        emerald:"#0F5132",
        navy:"#0B1F3A",
        brown:"#795548",
        rose:"#BE185D",
        indigo:"#4338CA"

    };


    themeColorMeta.content =
        legacyThemeColors[
            theme
        ] || "#FFFFFF";


    localStorage.setItem(
        "gglamStoreTheme",
        theme
    );

    localStorage.setItem(
        "gglamThemeType",
        "legacy"
    );

}


/* =========================================================
   SOCIAL
========================================================= */

function normalizeSocialUrl(
    value,
    type
) {

    let url =
        String(
            value || ""
        ).trim();

    if (!url) {
        return "";
    }


    if (
        /^https?:\/\//i.test(url)
    ) {
        return url;
    }


    url =
        url.replace(
            /^@/,
            ""
        );


    if (type === "instagram") {
        return "https://instagram.com/" + url;
    }


    if (type === "tiktok") {
        return "https://www.tiktok.com/@" + url;
    }


    if (type === "telegram") {
        return "https://t.me/" + url;
    }


    if (type === "facebook") {
        return "https://facebook.com/" + url;
    }


    if (type === "youtube") {
        return "https://youtube.com/" + url;
    }


    if (type === "x") {
        return "https://x.com/" + url;
    }


    if (type === "whatsapp") {

        return "https://wa.me/" +
            url.replace(
                /[^\d+]/g,
                ""
            );

    }


    return url;

}


function addSocialLink(
    type,
    value,
    label
) {

    const url =
        normalizeSocialUrl(
            value,
            type
        );

    if (!url) {
        return;
    }


    const link =
        document.createElement("a");

    link.className =
        "social-link";

    link.href =
        url;

    link.target =
        "_blank";

    link.rel =
        "noopener noreferrer";

    link.title =
        label;

    link.textContent =
        label;

    socialLinks.appendChild(
        link
    );

}


function renderSocialLinks() {

    socialLinks.innerHTML =
        "";


    const store =
        currentStore || {};


    addSocialLink(
        "facebook",

        store.facebookUrl,

    );


    addSocialLink(
        "instagram",
        store.instagram ||
        store.instagramUrl,
        "Instagram"
    );


    addSocialLink(
        "tiktok",
        store.tiktok ||
        store.tiktokUrl,
        "TikTok"
    );


    addSocialLink(
        "youtube",
        store.youtube ||
        store.youtubeUrl,
        "YouTube"
    );


    addSocialLink(
        "telegram",
        store.telegram ||
        store.telegramUrl,
        "Telegram"
    );


    addSocialLink(
        "whatsapp",
        store.whatsapp ||

    );


    if (

========================================================= */

async function loadStore() {

    try {

        if (!storeIdentifier) {

            showStoreError(
                "لم يتم تحديد المتجر."
            );

            return false;

        }


        const storeRef =
            doc(
                db,
                "stores",
                storeIdentifier
            );


        const storeSnap =
            await getDoc(
                storeRef
            );


        if (!storeSnap.exists()) {

            showStoreError(
                "المتجر غير موجود."
            );

            return false;

        }


        currentStore =
            storeSnap.data();


        storeUid =
            storeSnap.id;


        localStorage.setItem(
            "storeId",
            storeUid
        );


        const status =
            String(
                currentStore.status ||
                "approved"
            )
            .toLowerCase()
            .trim();


        if (
            status !== "approved"
            &&
            status !== "active"
        ) {

            showStoreError(
                "هذا المتجر غير متاح حاليًا."
            );

            return false;

        }


        applyStoreTheme(
            currentStore
        );


        const name =
            currentStore.storeName ||
            currentStore.name ||
            "G-Glam";


        storeNameElement.textContent =
            name;


        headerStoreName.textContent =
            name;


        document.title =
            name + " | المتجر";


        storeDescriptionElement.textContent =
            currentStore.description ||
            "Bienvenue dans notre boutique";


        const image =
            currentStore.storeImage ||
            currentStore.image ||
            currentStore.logo ||
            currentStore.photoURL ||
            "";


        if (image) {

            storeImage.src =
                image;

            storeImage.style.display =
                "block";

        }
        else {

            storeImage.removeAttribute(
                "src"
            );

            storeImage.style.display =
                "none";

        }


        const cover =
            currentStore.storeCoverImage ||
            currentStore.storeCover ||
            currentStore.coverImage ||
            currentStore.cover ||
            currentStore.banner ||
            currentStore.storeBanner ||
            "";


        if (cover) {

            storeCoverImage.src =
                cover;

            storeCover.style.display =
                "block";

        }
        else {

            storeCoverImage.removeAttribute(
                "src"
            );

            storeCover.style.display =
                "none";

        }


        renderSocialLinks();

        updateNavigationLinks();


        return true;

    }
    catch(error) {

        console.error(
            "STORE LOAD ERROR:",
            error
        );


        showStoreError(
            "حدث خطأ أثناء تحميل المتجر."
        );


        return false;

    }

}


/* =========================================================
   NORMALIZE CATEGORY NAME
========================================================= */

function normalizeCategoryName(
    value
) {

    return String(
        value || ""
    )
    .replace(
        /\s+/g,
        " "
    )
    .trim()
    .toLowerCase();

}


/* =========================================================
   LOAD CATEGORIES
========================================================= */

async function loadCategories() {

    /*
       مهم جدًا:

       التصنيفات تأتي من:
       categories

       وليس من:
       products

       والربط يكون بواسطة:
       storeId
    */


    categoriesContainer.innerHTML = `
        <button
            type="button"
            class="category-btn active"
            data-category-id="all"
        >
            الكل
        </button>
    `;


    allCategories = [];


    try {

        if (!storeUid) {

            console.warn(
                "لا يوجد storeUid لتحميل التصنيفات."
            );

            return;

        }


        const categoriesRef =
            collection(
                db,
                "categories"
            );


        const categoriesQuery =
            query(
                categoriesRef,
                where(
                    "storeId",
                    "==",
                    storeUid
                )
            );


        const snapshot =
            await getDocs(
                categoriesQuery
            );


        const usedIds =
            new Set();


        const usedNames =
            new Set();


        snapshot.forEach(
            categoryDoc => {

                const data =
                    categoryDoc.data();


                const name =
                    String(
                        data.name ||
                        data.categoryName ||
                        ""
                    ).trim();


                if (!name) {
                    return;
                }


                const categoryStoreId =
                    String(
                        data.storeId ||
                        ""
                    ).trim();


                /*
                   حماية إضافية:
                   لا نعرض تصنيفًا تابعًا لمتجر آخر.
                */

                if (
                    categoryStoreId !==
                    String(storeUid)
                ) {

                    return;

                }


                const normalizedName =
                    normalizeCategoryName(
                        name
                    );


                /*
                   منع تكرار نفس التصنيف.
                */

                if (
                    usedIds.has(
                        categoryDoc.id
                    )
                ) {

                    return;

                }


                if (
                    usedNames.has(
                        normalizedName
                    )
                ) {

                    return;

                }


                usedIds.add(
                    categoryDoc.id
                );


                usedNames.add(
                    normalizedName
                );


                allCategories.push({

                    id:
                        categoryDoc.id,

                    name:
                        name,

                    storeId:
                        categoryStoreId,

                    ownerUid:
                        data.ownerUid || ""

                });

            }
        );


        /*
           ترتيب أبجدي عربي.
        */

        allCategories.sort(
            (a,b) =>
                a.name.localeCompare(
                    b.name,
                    "ar"
                )
        );


        /*
           إذا كان التصنيف المحدد سابقًا
           لم يعد موجودًا، نرجع إلى الكل.
        */

        if (
            currentCategoryId !== "all"
            &&
            !allCategories.some(
                category =>
                    String(
                        category.id
                    ) ===
                    String(
                        currentCategoryId
                    )
            )
        ) {

            currentCategoryId =
                "all";

        }


        renderCategories();


        console.log(
            "التصنيفات التي تم تحميلها:",
            allCategories
        );


    }
    catch(error) {

        console.error(
            "CATEGORIES ERROR:",
            error
        );


        /*
           حتى إذا حدث خطأ،
           يبقى زر الكل ظاهرًا.
        */

        allCategories = [];

        currentCategoryId =
            "all";

        renderCategories();

    }

}

/* =========================================================
   CATEGORY MATCH
========================================================= */

function productMatchesCategory(
    product,
    categoryId
) {

    if (
        categoryId === "all"
    ) {

        return true;

    }


    const selectedCategory =
        allCategories.find(
            category =>
                String(
                    category.id
                ) ===
                String(
                    categoryId
                )
        );


    if (!selectedCategory) {

        return false;

    }


    /*
       الطريقة الأساسية:
       categoryId
    */

    if (
        String(
            product.categoryId || ""
        ) ===
        String(
            selectedCategory.id
        )
    ) {

        return true;

    }


    /*
       دعم categoryName.
    */

    const productCategoryName =
        normalizeCategoryName(
            product.categoryName
        );


    const selectedCategoryName =
        normalizeCategoryName(
            selectedCategory.name
        );


    if (
        productCategoryName &&
        productCategoryName ===
        selectedCategoryName
    ) {

        return true;

    }


    /*
       دعم الحقل القديم category.
    */

    const oldCategory =
        normalizeCategoryName(
            product.category
        );


    if (
        oldCategory &&
        oldCategory ===
        selectedCategoryName
    ) {

        return true;

    }


    return false;

}


/* =========================================================
   FILTER PRODUCTS
========================================================= */

function getFilteredProducts() {

    const keyword =
        String(
            searchInput.value || ""
        )
        .toLowerCase()
        .trim();


    return allProducts.filter(
        product => {

            /*
               أولًا التصنيف.
            */

            if (
                !productMatchesCategory(
                    product,
                    currentCategoryId
                )
            ) {

                return false;

            }


            /*
               ثانيًا البحث.
            */

            if (!keyword) {

                return true;

            }


            const name =
                String(
                    product.name || ""
                )
                .toLowerCase();


            const description =
                String(
                    product.description || ""
                )
                .toLowerCase();


            const categoryName =
                String(
                    product.categoryName ||
                    product.category ||
                    ""
                )
                .toLowerCase();


            return (

                name.includes(
                    keyword
                )

                ||

                description.includes(
                    keyword
                )

                ||

                categoryName.includes(
                    keyword
                )

            );

        }
    );

}


/* =========================================================
   PRODUCT IMAGE
========================================================= */

function getProductImage(
    product
) {

    if (
        product.image
    ) {

        return product.image;

    }


    if (
        Array.isArray(
            product.images
        )
        &&
        product.images.length
    ) {

        return product.images[0];

    }


    return "";

}


/* =========================================================
   PRODUCT TIME
========================================================= */

function getProductCreatedTime(
    product
) {

    const value =
        product.createdAt;


    if (
        value &&
        typeof value.toMillis ===
        "function"
    ) {

        return value.toMillis();

    }


    if (
        value &&
        typeof value.seconds ===
        "number"
    ) {

        return value.seconds * 1000;

    }


    if (
        value instanceof Date
    ) {

        return value.getTime();

    }


    if (
        typeof value === "number"
    ) {

        return value;

    }


    if (
        typeof value === "string"
    ) {

        const time =
            Date.parse(value);


        if (!Number.isNaN(time)) {

            return time;

        }

    }


    return 0;

}


/* =========================================================
   FORMAT PRICE
========================================================= */

function formatPrice(
    value
) {

    const number =
        Number(
            value
        );


    if (
        !Number.isFinite(
            number
        )
    ) {

        return "0 DA";

    }


    return number.toLocaleString(
        "fr-FR"
    ) + " DA";

}

/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts() {

    productsContainer.innerHTML = `

        <div class="loading">

            <svg>
                <use href="#icon-loader"></use>
            </svg>

            <div>
                جاري تحميل المنتجات...
            </div>

        </div>

    `;


    allProducts = [];


    try {

        if (!storeUid) {

            throw new Error(
                "storeUid غير موجود"
            );

        }


        /*
           الاستعلام الأساسي:
           products بواسطة storeId
        */

        let productsSnapshot;


        try {

            const productsQuery =
                query(
                    collection(
                        db,
                        "products"
                    ),
                    where(
                        "storeId",
                        "==",
                        storeUid
                    )
                );


            productsSnapshot =
                await getDocs(
                    productsQuery
                );

        }
        catch(error) {

            console.warn(
                "فشل استعلام storeId، سيتم تجربة ownerUid:",
                error
            );


            const fallbackQuery =
                query(
                    collection(
                        db,
                        "products"
                    ),
                    where(
                        "ownerUid",
                        "==",
                        storeUid
                    )
                );


            productsSnapshot =
                await getDocs(
                    fallbackQuery
                );

        }


        productsSnapshot.forEach(
            productDoc => {

                const data =
                    productDoc.data();


                /*
                   حماية إضافية من ظهور منتجات متجر آخر.
                */

                if (
                    data.storeId &&
                    String(
                        data.storeId
                    ) !==
                    String(
                        storeUid
                    )
                ) {

                    return;

                }


                allProducts.push({

                    id:
                        productDoc.id,

                    ...data

                });

            }
        );


        allProducts.sort(
            (a,b) =>
                getProductCreatedTime(b) -
                getProductCreatedTime(a)
        );


        renderProducts(
            getFilteredProducts()
        );


    }
    catch(error) {

        console.error(
            "PRODUCTS ERROR:",
            error
        );


        productsContainer.innerHTML = `

            <div class="error-products">

                حدث خطأ أثناء تحميل المنتجات.

            </div>

        `;

    }

}


/* =========================================================
   ADD TO CART
========================================================= */

function addToCart(
    product
) {

    try {

        let cart = [];


        try {

            cart =
                JSON.parse(
                    localStorage.getItem(
                        "cart"
                    ) || "[]"
                );

            if (
                !Array.isArray(cart)
            ) {

                cart = [];

            }

        }
        catch(error) {

            cart = [];

        }


        /*
           منع خلط منتجات متاجر مختلفة.
        */

        const otherStoreProducts =
            cart.filter(
                item =>
                    item.storeUid &&
                    String(
                        item.storeUid
                    ) !==
                    String(
                        storeUid
                    )
            );


        if (
            otherStoreProducts.length
        ) {

            const confirmClear =
                confirm(
                    "السلة تحتوي على منتجات من متجر آخر. هل تريد حذفها وإضافة هذا المنتج؟"
                );


            if (!confirmClear) {

                return;

            }


            cart =
                cart.filter(
                    item =>
                        !item.storeUid ||
                        String(
                            item.storeUid
                        ) ===
                        String(
                            storeUid
                        )
                );

        }


        const existing =
            cart.find(
                item =>
                    String(
                        item.id
                    ) ===
                    String(
                        product.id
                    )
                    &&
                    String(
                        item.storeUid || ""
                    ) ===
                    String(
                        storeUid
                    )
            );


        if (existing) {

            existing.quantity =
                Number(
                    existing.quantity || 1
                ) + 1;

        }
        else {

            cart.push({

                id:
                    product.id,

                name:
                    product.name || "",

                price:
                    Number(
                        product.price || 0
                    ),

                image:
                    getProductImage(
                        product
                    ),

                quantity:
                    1,

                storeUid:
                    storeUid,

                storeName:
                    currentStore?.storeName ||
                    currentStore?.name ||
                    "G-Glam",

                categoryId:
                    product.categoryId || "",

                categoryName:
                    product.categoryName ||
                    product.category ||
                    ""

            });

        }


        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );


        updateCartCount();


        alert(
            "تمت إضافة المنتج إلى السلة."
        );


    }
    catch(error) {

        console.error(
            "ADD CART ERROR:",
            error
        );


        alert(
            "تعذر إضافة المنتج إلى السلة."
        );

    }

}


/* =========================================================
   UPDATE CART COUNT
========================================================= */

function updateCartCount() {

    try {

        const cart =
            JSON.parse(
                localStorage.getItem(
                    "cart"
                ) || "[]"
            );


        if (
            !Array.isArray(cart)
        ) {

            cartCount.textContent =
                "0";

            return;

        }


        const count =
            cart.reduce(
                (total,item) => {

                    if (
                        String(
                            item.storeUid || ""
                        ) !==
                        String(
                            storeUid || ""
                        )
                    ) {

                        return total;

                    }


                    return total +
                        Number(
                            item.quantity || 0
                        );

                },
                0
            );


        cartCount.textContent =
            String(count);

    }
    catch(error) {

        cartCount.textContent =
            "0";

    }

}

/* =========================================================
   PRODUCT BUTTONS
========================================================= */

productsContainer.addEventListener(
    "click",
    function(event) {

        const button =
            event.target.closest(
                "[data-action]"
            );


        if (!button) {
            return;
        }


        const productId =
            button.dataset.productId;


        if (!productId) {
            return;
        }


        const product =
            allProducts.find(
                item =>
                    String(
                        item.id
                    ) ===
                    String(
                        productId
                    )
            );


        if (!product) {
            return;
        }


        const action =
            button.dataset.action;


        if (
            action === "cart"
        ) {

            addToCart(
                product
            );

            return;

        }


        if (
            action === "view"
        ) {

            const url =
                "product.html?id=" +
                encodeURIComponent(
                    productId
                ) +
                "&store=" +
                encodeURIComponent(
                    storeUid
                );


            window.location.href =
                url;

        }

    }
);
