         STYLE

    <style>

        /* =====================================================
           ROOT
        ====================================================== */

        :root {

            --bg:
                #F4F4F4;

            --header:
                #FFFFFF;

            --card:
                #FFFFFF;

            --card-light:
                #FAFAFA;

            --text:
                #374151;

            --muted:
                #6B7280;

            --border:

            --accent:
                #F47B20;

            --accent-dark:
                #D96610;

            --input:

            --input-text:
                #374151;

            --sidebar:

            --sidebar-hover:
                #FFF7ED;

            --danger:
                #EF4444;

            --shadow:
                0 8px 25px rgba(0,0,0,.10);

            --theme-gradient:
                linear-gradient(
                    135deg,
                    #F47B20,
                    #D94F87
                );

        }

        }


        /* =====================================================
           CUSTOM SOLID
        ====================================================== */

        body.theme-custom-solid {

            --bg:#F7F7F7;
            --header:#FFFFFF;
            --card:#FFFFFF;
            --card-light:#FAFAFA;
            --text:#374151;
            --muted:#6B7280;
            --border:#E5E7EB;
            --input:#FFFFFF;
            --input-text:#374151;
            --sidebar:#FFFFFF;

        }


        /* =====================================================
           CUSTOM GRADIENT
        ====================================================== */

        body.theme-custom-gradient {

            --bg:#F7F7F7;
            --header:#FFFFFF;
            --card:#FFFFFF;
            --card-light:#FAFAFA;
            --text:#374151;
            --muted:#6B7280;
            --border:#E5E7EB;
            --input:#FFFFFF;
            --input-text:#374151;
            --sidebar:#FFFFFF;

        }


        /* =====================================================
           RESET
        ====================================================== */

        * {

            box-sizing:border-box;

            margin:0;
            padding:0;

        }


        html {

            scroll-behavior:smooth;

        }


        body {

            font-family:
                "Tajawal",
                Arial,
                sans-serif;

            background:
                var(--bg);

            color:
                var(--text);

            min-height:
                100vh;

            transition:
                background .25s ease,
                color .25s ease;

        }


        button,
        input {

            font-family:
                inherit;

        }


        button {

            cursor:pointer;

        }


        a {

            text-decoration:none;

            color:inherit;

        }


        /* =====================================================
           HEADER
        ====================================================== */

        header {

            position:
                sticky;

            top:0;

            z-index:1000;

            height:72px;

            background:
                var(--header);

            border-bottom:
                1px solid var(--border);

            display:flex;

            align-items:center;

            justify-content:space-between;

            padding:
                0 22px;

            box-shadow:
                0 2px 12px rgba(0,0,0,.05);

        }


        .header-side {

            display:flex;

            align-items:center;

            gap:10px;

            min-width:90px;

        }


        .header-center {

            position:absolute;

            left:50%;

            transform:
                translateX(-50%);

            display:flex;

            align-items:center;

            justify-content:center;

            max-width:
                55%;

        }


        .logo {

            display:flex;

            align-items:center;

            gap:8px;

            font-size:22px;

            font-weight:800;

            white-space:nowrap;

        }


        .logo img {

            width:42px;

            height:42px;

            object-fit:contain;

            border-radius:50%;

        }


        .logo span {

            color:
                var(--accent);

        }


        body.theme-custom-gradient .logo span {

            background:
                var(--theme-gradient);

            -webkit-background-clip:
                text;

            background-clip:
                text;

            color:
                transparent;

        }


        .icon-btn {

            position:relative;

            width:44px;
            height:44px;

            border:0;

            border-radius:12px;

            background:
                transparent;

            color:
                var(--text);

            display:flex;

            align-items:center;

            justify-content:center;

            font-size:19px;

            transition:.2s;

        }


        .icon-btn:hover {

            background:
                var(--sidebar-hover);

            color:
                var(--accent);

        }


        body.theme-custom-gradient .icon-btn:hover {

            background:
                var(--theme-gradient);

            color:#fff;

        }


        .cart-count {

            position:absolute;

            top:-3px;

            right:-3px;

            min-width:19px;

            height:19px;

            padding:0 5px;

            border-radius:50px;

            background:
                var(--accent);

            color:#fff;

            font-size:11px;

            font-weight:800;

            display:flex;

            align-items:center;

            justify-content:center;

        }


        body.theme-custom-gradient .cart-count {

            background:
                var(--theme-gradient);

        }


        /* =====================================================
           SIDEBAR
        ====================================================== */

        .overlay {

            position:fixed;

            inset:0;

            background:
                rgba(0,0,0,.45);

            z-index:1998;

            opacity:0;

            visibility:hidden;

            transition:.25s;

        }


        .overlay.active {

            opacity:1;

            visibility:visible;

        }


        .sidebar {

            position:fixed;

            top:0;

            right:-320px;

            width:300px;

            height:100vh;

            z-index:1999;

            background:
                var(--sidebar);

            border-left:
                1px solid var(--border);

            box-shadow:
                -8px 0 30px rgba(0,0,0,.12);

            transition:
                right .3s ease;

            padding:25px 18px;

            overflow-y:auto;

        }


        .sidebar.active {

            right:0;

        }


        .sidebar-header {

            display:flex;

            align-items:center;

            justify-content:space-between;

            margin-bottom:28px;

            padding-bottom:18px;

            border-bottom:
                1px solid var(--border);

        }


        .sidebar-logo {

            display:flex;

            align-items:center;

            gap:9px;

            font-weight:800;

            font-size:21px;

        }


        .sidebar-logo img {

            width:42px;
            height:42px;

            object-fit:contain;

        }


        .sidebar-close {

            border:0;

            background:
                transparent;

            color:
                var(--muted);

            width:40px;
            height:40px;

            border-radius:10px;

            font-size:20px;

        }


        .sidebar-close:hover {

            background:
                var(--sidebar-hover);

            color:
                var(--accent);

        }


        .sidebar-links {

            display:flex;

            flex-direction:column;

            gap:7px;

        }


        .sidebar-link {

            display:flex;

            align-items:center;

            gap:14px;

            padding:13px 15px;

            border-radius:12px;

            color:
                var(--text);

            transition:.2s;

        }


        .sidebar-link:hover {

            background:
                var(--sidebar-hover);

            color:
                var(--accent);

        }


        .sidebar-link i {

            width:22px;

            text-align:center;

            color:
                var(--accent);

        }


        /* =====================================================
           STORE HERO
        ====================================================== */

        .store-hero {

            position:relative;

            background:
                var(--card);

            border-bottom:
                1px solid var(--border);

        }


        .store-cover {

            width:100%;

            height:250px;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent-dark)
                );

            overflow:hidden;

        }


        body.theme-custom-gradient .store-cover {

            background:
                var(--theme-gradient);

        }


        .store-cover img {

            width:100%;

            height:100%;

            object-fit:cover;

            display:block;

        }


        .store-info {

            position:relative;

            max-width:1200px;

            margin:0 auto;

            padding:
                0 22px 28px;

            text-align:center;

        }


        .store-image-wrap {

            width:112px;

            height:112px;

            border-radius:50%;

            padding:4px;

            background:
                var(--card);

            margin:
                -56px auto 14px;

            position:relative;

            z-index:2;

            box-shadow:
                0 6px 20px rgba(0,0,0,.14);

        }


        .store-image {

            width:100%;

            height:100%;

            border-radius:50%;

            object-fit:cover;

            border:
                2px solid var(--border);

        }


        .store-name {

            font-size:29px;

            font-weight:800;

            color:
                var(--text);

            margin-bottom:8px;

        }


        .store-description {

            color:
                var(--muted);

            font-size:15px;

            line-height:1.8;

            max-width:700px;

            margin:0 auto;

        }


        /* =====================================================
           MAIN
        ====================================================== */

        main {

            max-width:1200px;

            margin:0 auto;

            padding:
                30px 20px 100px;

        }


        /* =====================================================
           SEARCH
        ====================================================== */

        .search-wrap {

            position:relative;

            margin-bottom:30px;

        }


        .search-wrap i {

            position:absolute;

            right:17px;

            top:50%;

            transform:
                translateY(-50%);

            color:
                var(--muted);

            pointer-events:none;

        }


        #searchInput {

            width:100%;

            height:52px;

            border:
                1px solid var(--border);

            border-radius:15px;

            background:
                var(--input);

            color:
                var(--input-text);

            padding:
                0 48px 0 18px;

            outline:none;

            font-size:15px;

            transition:.2s;

        }


        #searchInput:focus {

            border-color:
                var(--accent);

            box-shadow:
                0 0 0 3px
                rgba(244,123,32,.10);

        }


        /* =====================================================
           SECTION TITLE
        ====================================================== */

        .products-title {

            display:flex;

            align-items:center;

            justify-content:space-between;

            gap:10px;

            margin-bottom:20px;

        }


        .products-title h2 {

            font-size:22px;

            font-weight:800;

        }


        .products-title span {

            color:
                var(--muted);

            font-size:13px;

        }


        /* =====================================================
           PRODUCTS
        ====================================================== */

        .products-grid {

            display:grid;

            grid-template-columns:
                repeat(4, minmax(0,1fr));

            gap:20px;

        }


        .product-card {

            background:
                var(--card);

            border:
                1px solid var(--border);

            border-radius:18px;

            overflow:hidden;

            box-shadow:
                0 4px 15px rgba(0,0,0,.05);

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                border-color .2s ease;

        }


        .product-card:hover {

            transform:
                translateY(-4px);

            box-shadow:
                var(--shadow);

            border-color:
                var(--accent);

        }


        .product-image-wrap {

            position:relative;

            width:100%;

            aspect-ratio:1/1;

            background:
                var(--card-light);

            overflow:hidden;

        }


        .product-image {

            width:100%;

            height:100%;

            object-fit:cover;

            display:block;

            transition:
                transform .3s ease;

        }


        .product-card:hover
        .product-image {

            transform:
                scale(1.04);

        }


        .product-body {

            padding:15px;

        }


        .product-name {

            font-size:16px;

            font-weight:700;

            color:
                var(--text);

            line-height:1.6;

            min-height:51px;

        }


        .product-price {

            margin:
                7px 0 13px;

            font-size:19px;

            font-weight:800;

            color:
                var(--accent);

        }


        body.theme-custom-gradient .product-price {

            background:
                var(--theme-gradient);

            -webkit-background-clip:
                text;

            background-clip:
                text;

            color:
                transparent;

        }


        .product-actions {

            display:grid;

            grid-template-columns:
                1fr 1fr;

            gap:8px;

        }


        .details-btn,
        .add-btn {

            min-height:42px;

            border-radius:11px;

            font-weight:700;

            font-size:13px;

            transition:.2s;

        }


        .details-btn {

            border:
                1px solid var(--border);

            background:
                var(--card);

            color:
                var(--text);

        }


        .details-btn:hover {

            border-color:
                var(--accent);

            color:
                var(--accent);

        }


        .add-btn {

            border:0;

            background:
                var(--accent);

            color:#fff;

        }


        .add-btn:hover {

            background:
                var(--accent-dark);

            transform:
                translateY(-1px);

        }


        body.theme-custom-gradient .add-btn {

            background:
                var(--theme-gradient);

        }


        /* =====================================================
           EMPTY / LOADING
        ====================================================== */

        .loading-box,
        .empty-box {

            text-align:center;

            padding:60px 20px;

            background:
                var(--card);

            border:
                1px solid var(--border);

            border-radius:18px;

            color:
                var(--muted);

        }


        .loading-box i {

            font-size:30px;

            color:
                var(--accent);

            margin-bottom:12px;

        }


        .empty-box i {

            font-size:42px;

            color:
                var(--muted);

            margin-bottom:15px;

        }


        .error-box {

            padding:25px;

            background:
                #FFF5F5;

            border:
                1px solid #FECACA;

            border-radius:15px;

            color:
                #991B1B;

            text-align:center;

        }


        /* =====================================================

            brown:"#795548",

        };


        /* =====================================================
           NORMALIZE HEX
        ====================================================== */

        function normalizeHexColor(
            value,
            fallback = ""
        ) {

            let hex =
                String(
                    value || ""
                )
                .trim()
                .toUpperCase();


            if (!hex) {

                return fallback;

            }


            if (
                !hex.startsWith("#")
            ) {

                hex =
                    "#" + hex;

            }


            if (
                /^#[0-9A-F]{6}$/.test(
                    hex
                )
            ) {

                return hex;

            }


            if (
                /^#[0-9A-F]{3}$/.test(
                    hex
                )
            ) {

                return "#" +
                    hex
                        .slice(1)
                        .split("")
                        .map(
                            function(c) {

                                return c + c;

                            }
                        )
                        .join("");

            }


            return fallback;

        }


        /* =====================================================
           DARKEN HEX
        ====================================================== */

        function darkenHex(
            hex,
            amount = .22
        ) {

            const color =
                normalizeHexColor(
                    hex,
                    "#F47B20"
                );


            const r =
                parseInt(
                    color.slice(1,3),
                    16
                );


            const g =
                parseInt(
                    color.slice(3,5),
                    16
                );


            const b =
                parseInt(
                    color.slice(5,7),
                    16
                );


            const values = [
                r,
                g,
                b
            ];


            return "#" +
                values
                    .map(
                        function(value) {

                            return Math.max(
                                0,
                                Math.round(
                                    value *
                                    (1 - amount)
                                )
                            )
                            .toString(16)
                            .padStart(
                                2,
                                "0"
                            );

                        }
                    )
                    .join("")
                    .toUpperCase();

        }


        /* =====================================================
           APPLY STORE THEME
        ====================================================== */

        function applyStoreTheme(
            store
        ) {

            const oldThemeClasses =
                [
                    ...body.classList
                ]
                .filter(
                    function(className) {

                        return className.startsWith(
                            "theme-"
                        );

                    }
                );


            oldThemeClasses.forEach(
                function(className) {

                    body.classList.remove(
                        className
                    );

                }
            );


            body.style.removeProperty(
                "--theme-gradient"
            );


            body.style.removeProperty(
                "--accent"
            );


            body.style.removeProperty(
                "--accent-dark"
            );


            body.style.removeProperty(
                "--sidebar-hover"
            );


            const themeType =
                String(
                    store?.themeType ||
                    ""
                )
                .toLowerCase()
                .trim();


            /* =================================================
               GRADIENT
            ================================================== */

            if (
                themeType ===
                "gradient"
            ) {

                const rawColors =
                    Array.isArray(
                        store.themeColors
                    )
                        ? store.themeColors
                        : [];


                const colors =
                    rawColors
                        .map(
                            function(color) {

                                return normalizeHexColor(
                                    color,
                                    ""
                                );

                            }
                        )
                        .filter(Boolean)
                        .slice(0,3);


                if (
                    colors.length >= 2
                ) {

                    const direction =
                        String(
                            store.themeDirection ||
                            "135deg"
                        )
                        .trim();


                    const gradient =
                        `linear-gradient(${direction}, ${colors.join(", ")})`;


                    body.classList.add(
                        "theme-custom-gradient"
                    );


                    body.style.setProperty(
                        "--theme-gradient",
                        gradient
                    );


                    body.style.setProperty(
                        "--accent",
                        colors[0]
                    );


                    body.style.setProperty(
                        "--accent-dark",
                        darkenHex(
                            colors[0]
                        )
                    );


                    body.style.setProperty(
                        "--sidebar-hover",
                        "rgba(0,0,0,.04)"
                    );


                    themeColorMeta.content =
                        colors[0];


                    return;

                }

            }


            /* =================================================
               CUSTOM SOLID
            ================================================== */

            const customColor =
                normalizeHexColor(
                    store?.themeColor,
                    ""
                );


            if (
                customColor &&
                (
                    themeType === "solid" ||
                    String(
                        store?.theme || ""
                    ).toLowerCase() ===
                    "custom"
                )
            ) {

                body.classList.add(
                    "theme-custom-solid"
                );


                body.style.setProperty(
                    "--accent",
                    customColor
                );


                body.style.setProperty(
                    "--accent-dark",
                    darkenHex(
                        customColor
                    )
                );


                body.style.setProperty(
                    "--sidebar-hover",
                    "color-mix(in srgb, " +
                    customColor +
                    " 9%, white)"
                );


                themeColorMeta.content =
                    customColor;


                return;

            }


            /* =================================================
               LEGACY THEME
            ================================================== */

            let theme =
                String(
                    store?.theme ||
                    "orange"
                )
                .toLowerCase()
                .trim();


            if (
                !legacyThemes.has(
                    theme
                )
            ) {

                theme =
                    "orange";

            }


            body.classList.add(
                "theme-" + theme
            );


            const accent =
                themeColors[
                    theme
                ] ||
                "#F47B20";


            themeColorMeta.content =
                accent;

        }


        /* =====================================================

        function getStoreIdentifier() {

            const params =
                new URLSearchParams(
                    window.location.search
                );


            const queryStore =
                params.get(
                    "store"
                );


            if (
                queryStore &&
                queryStore.trim()
            ) {

                return queryStore.trim();

            }


            const path =
                window.location.pathname
                .split("/")
                .filter(Boolean);


            const last =
                path[path.length - 1];


            if (
                last &&
                last !== "index.html" &&
                !last.includes(".")
            ) {

                return last;

            }


            const savedStore =
                localStorage.getItem(
                    "storeId"
                );


            if (
                savedStore
            ) {

                return savedStore;

            }


            return "";

        }


        storeUid =
            getStoreIdentifier();


        /* =====================================================
           ESCAPE HTML
        ====================================================== */

        function escapeHtml(
            value
        ) {

            return String(
                value ?? ""
            )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

        }


        /* =====================================================
           NORMALIZE SOCIAL URL
        ====================================================== */

        function normalizeSocialUrl(
            value,
            type
        ) {

            let input =
                String(
                    value || ""
                )
                .trim();


            if (!input) {

                return "";

            }


            if (
                /^https?:\/\//i.test(
                    input
                )
            ) {

                return input;

            }


            input =
                input.replace(
                    /^www\./i,
                    ""
                );


            /* WHATSAPP */

            if (
                type === "whatsapp"
            ) {

                let phone =
                    input.replace(
                        /[^\d+]/g,
                        ""
                    );


                phone =
                    phone.replace(
                        /^\+/,
                        ""
                    );


                if (
                    /^0[567]/.test(
                        phone
                    )
                ) {

                    phone =
                        "213" +
                        phone.slice(1);

                }


                if (
                    phone.length >= 9
                ) {

                    return (
                        "https://wa.me/" +
                        phone
                    );

                }


                return "";

            }


            /* INSTAGRAM */

            if (
                type === "instagram"
            ) {

                input =
                    input
                    .replace(
                        /^instagram\.com\//i,
                        ""
                    )
                    .replace(
                        /^@/,
                        ""
                    );


                return (
                    "https://instagram.com/" +
                    input
                );

            }


            /* TIKTOK */

            if (
                type === "tiktok"
            ) {

                input =
                    input
                    .replace(
                        /^tiktok\.com\//i,
                        ""
                    )
                    .replace(
                        /^@/,
                        ""
                    );


                return (
                    "https://www.tiktok.com/@" +
                    input
                );

            }


            /* TELEGRAM */

            if (
                type === "telegram"
            ) {

                input =
                    input
                    .replace(
                        /^t\.me\//i,
                        ""
                    )
                    .replace(
                        /^@/,
                        ""
                    );


                return (
                    "https://t.me/" +
                    input
                );

            }


            /* FACEBOOK */

            if (
                type === "facebook"
            ) {

                input =
                    input
                    .replace(
                        /^facebook\.com\//i,
                        ""
                    )
                    .replace(
                        /^@/,
                        ""
                    );


                return (
                    "https://facebook.com/" +
                    input
                );

            }


            /* X */

            if (
                type === "twitter" ||
                type === "x"
            ) {

                input =
                    input
                    .replace(
                        /^(twitter|x)\.com\//i,
                        ""
                    )
                    .replace(
                        /^@/,
                        ""
                    );


                return (
                    "https://x.com/" +
                    input
                );

            }


            return input;

        }


        /* =====================================================
           INIT PIXELS
        ====================================================== */

        function initPixels(
            store
        ) {

            try {

                const metaPixelId =
                    store.metaPixelId ||
                    store.facebookPixelId ||
                    store.metaPixel ||
                    "";


                if (
                    metaPixelId &&
                    typeof window.fbq ===
                    "function"
                ) {

                    window.fbq(
                        "init",
                        String(
                            metaPixelId
                        )
                    );


                    window.fbq(
                        "track",
                        "PageView"
                    );

                }


                const tiktokPixelId =
                    store.tiktokPixelId ||
                    store.tikTokPixelId ||
                    store.tiktokPixel ||
                    "";


                if (
                    tiktokPixelId &&
                    window.ttq
                ) {

                    window.ttq.load(
                        String(
                            tiktokPixelId
                        )
                    );


                    window.ttq.page();

                }

            }

            catch(error) {

                console.error(
                    "Pixel error:",
                    error
                );

            }

        }


        /* =====================================================
           GET STORE
        ====================================================== */

        async function getStore() {

            if (!storeUid) {

                throw new Error(
                    "لم يتم تحديد المتجر."
                );

            }


            /*
             * UID هو المعرف الأساسي.
             * نبدأ دائمًا بالبحث في:
             *
             * stores/{UID}
             */

            const directRef =
                doc(
                    db,
                    "stores",
                    storeUid
                );


            const directSnapshot =
                await getDoc(
                    directRef
                );


            if (
                directSnapshot.exists()
            ) {

                return {
                    id:
                        directSnapshot.id,

                    ...directSnapshot.data()
                };

            }


            /*
             * fallback اختياري إذا كان الرابط
             * يستخدم storeId أو slug.
             */

            try {

                const storeIdQuery =
                    query(
                        collection(
                            db,
                            "stores"
                        ),
                        where(
                            "storeId",
                            "==",
                            storeUid
                        )
                    );


                const result =
                    await getDocs(
                        storeIdQuery
                    );


                if (
                    !result.empty
                ) {

                    const item =
                        result.docs[0];


                    return {
                        id:item.id,
                        ...item.data()
                    };

                }

            }

            catch(error) {

                console.warn(
                    "storeId fallback:",
                    error
                );

            }


            try {

                const slugQuery =
                    query(
                        collection(
                            db,
                            "stores"
                        ),
                        where(
                            "slug",
                            "==",
                            storeUid
                        )
                    );


                const result =
                    await getDocs(
                        slugQuery
                    );


                if (
                    !result.empty
                ) {

                    const item =
                        result.docs[0];


                    return {
                        id:item.id,
                        ...item.data()
                    };

                }

            }

            catch(error) {

                console.warn(
                    "slug fallback:",
                    error
                );

            }


            throw new Error(
                "لم يتم العثور على المتجر."
            );

        }


        /* =====================================================
           LOAD STORE
        ====================================================== */

        async function loadStore() {

            try {

                currentStore =
                    await getStore();


                /*
                 * حفظ UID نفسه كمعرف المتجر.
                 */

                if (
                    currentStore.id
                ) {

                    localStorage.setItem(
                        "storeId",
                        currentStore.id
                    );

                }


                /* THEME */

                applyStoreTheme(
                    currentStore
                );


                /* STORE NAME */

                const name =
                    currentStore.storeName ||
                    currentStore.name ||
                    "G-Glam";


                storeNameElement.textContent =
                    name;


                headerStoreName.textContent =
                    name;


                /* DESCRIPTION */

                storeDescriptionElement.textContent =
                    currentStore.description ||
                    "";


                /* STORE IMAGE */

                const image =
                    currentStore.storeImage ||
                    currentStore.image ||
                    currentStore.logo ||
                    currentStore.photoURL ||
                    "logotrans.png";


                storeImage.src =
                    image;


                headerStoreImage.src =
                    image;


                sidebarLogo.src =
                    image;


                /* COVER */

                const cover =
                    currentStore.storeCoverImage ||
                    currentStore.coverImage ||
                    currentStore.storeBanner ||
                    currentStore.cover ||
                    "";


                if (
                    cover
                ) {

                    storeCoverImage.src =
                        cover;

                }

                else {

                    storeCoverImage.style.display =
                        "none";

                }


                /* SOCIAL */

                renderSocialLinks(
                    currentStore
                );


                /* PIXELS */

                initPixels(
                    currentStore
                );


                /* PRODUCTS */

                await loadProducts();

            }

            catch(error) {

                console.error(
                    "Store load error:",
                    error
                );


                productsContainer.innerHTML =
                    `
                    <div class="error-box">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <br><br>
                        ${escapeHtml(
                            error.message ||
                            "حدث خطأ أثناء تحميل المتجر."
                        )}
                    </div>
                    `;

            }

        }


        /* =====================================================
           LOAD PRODUCTS
        ====================================================== */

        async function loadProducts() {

            productsContainer.innerHTML =
                `
                <div class="loading-box">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    <p>جاري تحميل المنتجات...</p>
                </div>
                `;


            try {

                const productsRef =
                    collection(
                        db,
                        "products"
                    );


                let documents = [];


                /*
                 * UID أولاً.
                 */

                try {

                    const q =
                        query(
                            productsRef,
                            where(
                                "storeUid",
                                "==",
                                storeUid
                            )
                        );


                    const snapshot =
                        await getDocs(q);


                    documents =
                        snapshot.docs;

                }

                catch(error) {

                    console.warn(
                        "storeUid query failed:",
                        error
                    );

                }


                /*
                 * دعم ownerUid.
                 */

                if (
                    documents.length === 0
                ) {

                    try {

                        const q =
                            query(
                                productsRef,
                                where(
                                    "ownerUid",
                                    "==",
                                    storeUid
                                )
                            );


                        const snapshot =
                            await getDocs(q);


                        documents =
                            snapshot.docs;

                    }

                    catch(error) {

                        console.warn(
                            "ownerUid query failed:",
                            error
                        );

                    }

                }


                /*
                 * دعم storeId في البيانات القديمة.
                 */

                if (
                    documents.length === 0
                ) {

                    try {

                        const q =
                            query(
                                productsRef,
                                where(
                                    "storeId",
                                    "==",
                                    storeUid
                                )
                            );


                        const snapshot =
                            await getDocs(q);


                        documents =
                            snapshot.docs;

                    }

                    catch(error) {

                        console.warn(
                            "storeId query failed:",
                            error
                        );

                    }

                }


                allProducts =
                    documents
                        .map(
                            function(item) {

                                return {
                                    id:item.id,
                                    ...item.data()
                                };

                            }
                        )
                        .filter(
                            function(product) {

                                const status =
                                    String(
                                        product.status ||
                                        "active"
                                    )
                                    .toLowerCase();


                                return (
                                    status !==
                                    "deleted" &&
                                    status !==
                                    "inactive"
                                );

                            }
                        );


                /*
                 * ترتيب المنتجات.
                 */

                allProducts.sort(
                    function(a,b) {

                        const aTime =
                            a.createdAt?.seconds ||
                            0;


                        const bTime =
                            b.createdAt?.seconds ||
                            0;


                        return bTime -
                            aTime;

                    }
                );


                renderProducts(
                    allProducts
                );

            }

            catch(error) {

                console.error(
                    "Products error:",
                    error
                );


                productsContainer.innerHTML =
                    `
                    <div class="error-box">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <br><br>
                        تعذر تحميل المنتجات.
                    </div>
                    `;

            }

        }


        /* =====================================================
           PRODUCT IMAGE
        ====================================================== */

        function getProductImage(
            product
        ) {

            if (
                product.image
            ) {

                return product.image;

            }


            if (
                product.imageUrl
            ) {

                return product.imageUrl;

            }


            if (
                product.productImage
            ) {

                return product.productImage;

            }


            if (
                Array.isArray(
                    product.images
                ) &&
                product.images.length
            ) {

                return product.images[0];

            }


            return "logotrans.png";

        }


        /* =====================================================
           PRODUCT PRICE
        ====================================================== */

        function formatPrice(
            value
        ) {

            if (
                value === undefined ||
                value === null ||
                value === ""
            ) {

                return "";

            }


            const number =
                Number(
                    String(value)
                        .replace(
                            /[^\d.]/g,
                            ""
                        )
                );


            if (
                Number.isNaN(
                    number
                )
            ) {

                return escapeHtml(
                    value
                );

            }


            return (
                new Intl.NumberFormat(
                    "fr-DZ"
                ).format(
                    number
                ) +
                " دج"
            );

        }


        /* =====================================================
           RENDER PRODUCTS
        ====================================================== */

        function renderProducts(
            products
        ) {

            productsCount.textContent =
                products.length +
                " منتج";


            if (
                !products.length
            ) {

                productsContainer.innerHTML =
                    `
                    <div class="empty-box">
                        <i class="fa-solid fa-box-open"></i>
                        <p>
                            لا توجد منتجات متاحة حاليًا.
                        </p>
                    </div>
                    `;

                return;

            }


            productsContainer.innerHTML =
                products
                    .map(
                        function(product) {

                            const id =
                                product.id;


                            const name =
                                product.name ||
                                product.productName ||
                                product.title ||
                                "منتج";


                            const price =
                                product.price ??
                                product.productPrice ??
                                "";


                            const image =
                                getProductImage(
                                    product
                                );


                            return `
                                <article
                                    class="product-card"
                                    data-product-id="${escapeHtml(id)}"
                                    data-name="${escapeHtml(name.toLowerCase())}"
                                >

                                    <a
                                        href="${getProductUrl(id)}"
                                        class="product-image-wrap"
                                    >

                                        <img
                                            src="${escapeHtml(image)}"
                                            class="product-image"
                                            alt="${escapeHtml(name)}"
                                            loading="lazy"
                                            onerror="this.src='logotrans.png'"
                                        >

                                    </a>


                                    <div class="product-body">

                                        <div class="product-name">

                                            ${escapeHtml(name)}

                                        </div>


                                        <div class="product-price">

                                            ${formatPrice(price)}

                                        </div>


                                        <div class="product-actions">

                                            <a
                                                href="${getProductUrl(id)}"
                                                class="details-btn"
                                                style="
                                                    display:flex;
                                                    align-items:center;
                                                    justify-content:center;
                                                "
                                            >

                                                <i
                                                    class="fa-solid fa-eye"
                                                    style="margin-left:5px"
                                                ></i>

                                                عرض المنتج

                                            </a>


                                            <button
                                                type="button"
                                                class="add-btn"
                                                data-add-product="${escapeHtml(id)}"
                                            >

                                                <i
                                                    class="fa-solid fa-cart-plus"
                                                    style="margin-left:5px"
                                                ></i>

                                                أضف للسلة

                                            </button>

                                        </div>

                                    </div>

                                </article>
                            `;

                        }
                    )
                    .join("");


            document
                .querySelectorAll(
                    "[data-add-product]"
                )
                .forEach(
                    function(button) {

                        button.addEventListener(
                            "click",
                            function() {

                                const productId =
                                    this.dataset.addProduct;


                                addToCart(
                                    productId
                                );

                            }
                        );

                    }
                );

        }


        /* =====================================================
           PRODUCT URL
        ====================================================== */

        function getProductUrl(
            productId
        ) {

            return (
                "product.html?store=" +
                encodeURIComponent(
                    storeUid
                ) +
                "&id=" +
                encodeURIComponent(
                    productId
                )
            );

        }


        /* =====================================================
           SEARCH
        ====================================================== */

        searchInput.addEventListener(
            "input",
            function() {

                const search =
                    this.value
                        .trim()
                        .toLowerCase();


                if (!search) {

                    renderProducts(
                        allProducts
                    );

                    return;

                }


                const filtered =
                    allProducts.filter(
                        function(product) {

                            const name =
                                String(
                                    product.name ||
                                    product.productName ||
                                    product.title ||
                                    ""
                                )
                                .toLowerCase();


                            const description =
                                String(
                                    product.description ||
                                    ""
                                )
                                .toLowerCase();


                            return (
                                name.includes(
                                    search
                                ) ||
                                description.includes(
                                    search
                                )
                            );

                        }
                    );


                renderProducts(
                    filtered
                );

        });


        /* =====================================================
           CART STORAGE KEY
        ====================================================== */

        function getCartKey() {

            return (
                "gglam_cart_" +
                String(
                    storeUid ||
                    "default"
                )
            );

        }


        /* =====================================================
           GET CART
        ====================================================== */

        function getCart() {

            try {

                const raw =
                    localStorage.getItem(
                        getCartKey()
                    );


                if (!raw) {

                    return [];

                }


                const parsed =
                    JSON.parse(
                        raw
                    );


                return Array.isArray(
                    parsed
                )
                    ? parsed
                    : [];

            }

            catch(error) {

                console.error(
                    "Cart parse error:",
                    error
                );


                return [];

            }

        }


        /* =====================================================
           SAVE CART
        ====================================================== */

        function saveCart(
            cart
        ) {

            localStorage.setItem(
                getCartKey(),
                JSON.stringify(
                    cart
                )
            );


            updateCartCount();

        }


        /* =====================================================
           ADD TO CART
        ====================================================== */

        function addToCart(
            productId
        ) {

            const product =
                allProducts.find(
                    function(item) {

                        return (
                            item.id ===
                            productId
                        );

                    }
                );


            if (!product) {

                return;

            }


            const cart =
                getCart();


            const existing =
                cart.find(
                    function(item) {

                        return (
                            item.productId ===
                            productId
                        );

                    }
                );


            if (existing) {

                existing.quantity =
                    Number(
                        existing.quantity ||
                        1
                    ) + 1;

            }

            else {

                cart.push({

                    productId:
                        product.id,

                    name:
                        product.name ||
                        product.productName ||
                        product.title ||
                        "منتج",

                    price:
                        product.price ??
                        product.productPrice ??
                        0,

                    image:
                        getProductImage(
                            product
                        ),

                    quantity:
                        1

                });

            }


            saveCart(
                cart
            );


            showCartAddedMessage();

        }


        /* =====================================================
           UPDATE CART COUNT
        ====================================================== */

        function updateCartCount() {

            const cart =
                getCart();


            const total =
                cart.reduce(
                    function(sum,item) {

                        return (
                            sum +
                            Number(
                                item.quantity ||
                                1
                            )
                        );

                    },
                    0
                );


            cartCount.textContent =
                total;


            floatingCartCount.textContent =
                total;

        }


        /* =====================================================
           CART MESSAGE
        ====================================================== */

        function showCartAddedMessage() {

            const old =
                document.getElementById(
                    "cartAddedToast"
                );


            if (old) {

                old.remove();

            }


            const toast =
                document.createElement(
                    "div"
                );


            toast.id =
                "cartAddedToast";


            toast.innerHTML =
                `
                <i class="fa-solid fa-check"></i>
                تمت إضافة المنتج إلى السلة
                `;


            Object.assign(
                toast.style,
                {

                    position:"fixed",

                    top:"85px",

                    left:"50%",

                    transform:
                        "translateX(-50%)",

                    zIndex:"3000",

                    background:
                        "var(--accent)",

                    color:"#fff",

                    padding:
                        "12px 20px",

                    borderRadius:
                        "12px",

                    boxShadow:
                        "0 8px 25px rgba(0,0,0,.18)",

                    fontWeight:"700",

                    fontSize:"14px"

                }
            );


            document.body.appendChild(
                toast
            );


            setTimeout(
                function() {

                    toast.remove();

                },
                1800
            );

        }


        /* =====================================================
           GO TO CART
        ====================================================== */

        function goToCart() {

            window.location.href =
                "cart.html?store=" +
                encodeURIComponent(
                    storeUid
                );

        }


        cartButton.addEventListener(
            "click",
            goToCart
        );


        floatingCart.addEventListener(
            "click",
            goToCart
        );


        cartLink.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                goToCart();

            }
        );


        /* =====================================================
           SOCIAL LINKS
        ====================================================== */

        function renderSocialLinks(
            store
        ) {

            socialLinks.innerHTML =
                "";


            const socials = [

                {
                    type:"instagram",
                    value:
                        store.instagram ||
                        store.social?.instagram ||
                        "",
                    icon:
                        "fa-brands fa-instagram"
                },

                {
                    type:"facebook",
                    value:
                        store.facebook ||
                        store.social?.facebook ||
                        "",
                    icon:
                        "fa-brands fa-facebook"
                },

                {
                    type:"tiktok",
                    value:
                        store.tiktok ||
                        store.social?.tiktok ||
                        "",
                    icon:
                        "fa-brands fa-tiktok"
                },

                {
                    type:"twitter",
                    value:
                        store.twitter ||
                        store.social?.twitter ||
                        "",
                    icon:
                        "fa-brands fa-x-twitter"
                },

                {
                    type:"whatsapp",
                    value:
                        store.whatsapp ||
                        store.contactWhatsapp ||
                        store.social?.whatsapp ||
                        "",
                    icon:
                        "fa-brands fa-whatsapp"
                },

                {
                    type:"telegram",
                    value:
                        store.telegram ||
                        store.social?.telegram ||
                        "",
                    icon:
                        "fa-brands fa-telegram"
                },

                {
                    type:"phone",
                    value:
                        store.phone ||
                        "",
                    icon:
                        "fa-solid fa-phone"
                }

            ];


            let count = 0;


            socials.forEach(
                function(item) {

                    if (
                        !item.value
                    ) {

                        return;

                    }


                    let url = "";


                    if (
                        item.type ===
                        "phone"
                    ) {

                        const phone =
                            String(
                                item.value
                            )
                            .replace(
                                /[^\d+]/g,
                                ""
                            );


                        url =
                            "tel:" +
                            phone;

                    }

                    else {

                        url =
                            normalizeSocialUrl(
                                item.value,
                                item.type
                            );

                    }


                    if (!url) {

                        return;

                    }


                    const link =
                        document.createElement(
                            "a"
                        );


                    link.className =
                        "social-link";


                    link.href =
                        url;


                    link.target =
                        "_blank";


                    link.rel =
                        "noopener noreferrer";


                    link.innerHTML =
                        `
                        <i class="${item.icon}"></i>
                        `;


                    socialLinks.appendChild(
                        link
                    );


                    count++;

                }
            );


            if (
                count > 0
            ) {

                socialSection.style.display =
                    "block";

            }

            else {

                socialSection.style.display =
                    "none";

            }

        }


        /* =====================================================
           SIDEBAR
        ====================================================== */

        function openSidebar() {

            sidebar.classList.add(
                "active"
            );


            overlay.classList.add(
                "active"
            );


            document.body.style.overflow =
                "hidden";

        }


        function closeSidebar() {

            sidebar.classList.remove(
                "active"
            );


            overlay.classList.remove(
                "active"
            );


            document.body.style.overflow =
                "";

        }


        menuBtn.addEventListener(
            "click",
            openSidebar
        );


        sidebarClose.addEventListener(
            "click",
            closeSidebar
        );


        overlay.addEventListener(
            "click",
            closeSidebar
        );


        contactLink.addEventListener(
            "click",
            function() {

                closeSidebar();

            }
        );


        homeLink.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                closeSidebar();

                window.scrollTo(
                    {
                        top:0,
                        behavior:"smooth"
                    }
                );

            }
        );


        /* =====================================================
           INITIALIZATION
        ====================================================== */

        updateCartCount();


        loadStore();

    </script>


</body>
