<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#F5F5F5">

<title>جاري تحميل المتجر...</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

<style>

/* =====================================================
   COLORS
===================================================== */

:root{

    --bg:#F5F5F5;

    --card:#FFFFFF;

    --text:#222222;

    --muted:#777777;

    --orange:#F47B20;

    --orange-dark:#DF6810;

    --orange-light:#FFF1E6;

    --border:#E8E8E8;

    --danger:#D9534F;

    --shadow:
        0 4px 18px rgba(0,0,0,.06);
}


/* =====================================================
   RESET
===================================================== */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

    font-family:"Tajawal",Arial,sans-serif;

}


/* =====================================================
   BODY
===================================================== */

body{

    background:var(--bg);

    color:var(--text);

    min-height:100vh;

    padding-bottom:90px;

}


/* =====================================================
   HEADER
===================================================== */

header{

    position:sticky;

    top:0;

    z-index:1000;

    height:72px;

    background:rgba(245,245,245,.96);

    backdrop-filter:blur(10px);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 18px;

    border-bottom:1px solid var(--border);

}


/* =====================================================
   MENU
===================================================== */

.menu-btn{

    width:44px;

    height:44px;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#fff;

    border:1px solid var(--border);

    cursor:pointer;

    font-size:22px;

}


/* =====================================================
   STORE LOGO
===================================================== */

.header-store{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:9px;

    min-width:0;

    flex:1;

    margin:0 10px;

}


.header-store-image{

    width:40px;

    height:40px;

    border-radius:50%;

    object-fit:cover;

    background:#eee;

    border:2px solid #FFE0C8;

}


.header-store-name{

    font-size:18px;

    font-weight:800;

    max-width:190px;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;

}


/* =====================================================
   CART
===================================================== */

.cart-btn{

    width:44px;

    height:44px;

    border-radius:12px;

    background:#fff;

    border:1px solid var(--border);

    cursor:pointer;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:21px;

}


.cart-count{

    position:absolute;

    top:-5px;

    left:-5px;

    width:20px;

    height:20px;

    border-radius:50%;

    background:var(--orange);

    color:#fff;

    font-size:11px;

    font-weight:800;

    display:flex;

    align-items:center;

    justify-content:center;

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

    position:fixed;

    top:0;

    right:-290px;

    width:280px;

    height:100vh;

    background:#fff;

    z-index:2000;

    box-shadow:-5px 0 20px rgba(0,0,0,.12);

    transition:.3s;

    padding-top:20px;

}


.sidebar.active{

    right:0;

}


.sidebar-title{

    padding:20px;

    border-bottom:1px solid var(--border);

    font-size:20px;

    font-weight:800;

}


.sidebar-title span{

    color:var(--orange);

}


.sidebar a{

    display:flex;

    align-items:center;

    gap:12px;

    padding:16px 22px;

    text-decoration:none;

    color:#333;

    border-bottom:1px solid #f1f1f1;

    font-weight:600;

}


.sidebar a:hover{

    background:var(--orange-light);

    color:var(--orange-dark);

}


/* =====================================================
   OVERLAY
===================================================== */

.overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.35);

    z-index:1900;

    display:none;

}


.overlay.active{

    display:block;

}


/* =====================================================
   STORE HERO
===================================================== */

.store-hero{

    background:#fff;

    margin:18px 15px;

    padding:24px 18px;

    border-radius:20px;

    border:1px solid var(--border);

    box-shadow:var(--shadow);

    text-align:center;

}


.store-hero-image{

    width:85px;

    height:85px;

    border-radius:50%;

    object-fit:cover;

    background:#eee;

    border:3px solid #FFE0C8;

    margin-bottom:12px;

}


.store-hero-name{

    font-size:25px;

    font-weight:800;

    margin-bottom:7px;

}


.store-hero-description{

    color:var(--muted);

    font-size:14px;

    line-height:1.7;

}


/* =====================================================
   SEARCH
===================================================== */

.search-container{

    padding:0 15px 18px;

}


.search-box{

    width:100%;

    height:50px;

    border-radius:28px;

    border:1px solid var(--border);

    background:#fff;

    padding:0 20px;

    font-size:15px;

    outline:none;

    box-shadow:var(--shadow);

}


.search-box:focus{

    border-color:var(--orange);

    box-shadow:
        0 0 0 3px rgba(244,123,32,.10);

}


/* =====================================================
   PRODUCTS HEADER
===================================================== */

.products-header{

    padding:0 15px 12px;

    display:flex;

    justify-content:space-between;

    align-items:center;

}


.products-header h2{

    font-size:20px;

    font-weight:800;

}


.products-header span{

    color:var(--muted);

    font-size:13px;

}


/* =====================================================
   PRODUCTS
===================================================== */

.products{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:14px;

    padding:0 15px;

}


/* =====================================================
   PRODUCT CARD
===================================================== */

.product-card{

    background:#fff;

    border-radius:18px;

    overflow:hidden;

    border:1px solid var(--border);

    box-shadow:var(--shadow);

}


.product-image{

    width:100%;

    aspect-ratio:1/1;

    object-fit:cover;

    background:#f0f0f0;

    display:block;

}


.product-content{

    padding:12px;

}


.product-name{

    font-size:15px;

    font-weight:700;

    line-height:1.5;

    height:45px;

    overflow:hidden;

}


.product-price{

    margin-top:7px;

    margin-bottom:10px;

    font-size:17px;

    font-weight:800;

    color:var(--orange-dark);

}


.product-stock{

    color:var(--muted);

    font-size:12px;

    margin-bottom:10px;

}


.product-button{

    width:100%;

    border:none;

    background:var(--orange);

    color:#fff;

    padding:11px 8px;

    border-radius:11px;

    font-size:13px;

    font-weight:700;

    cursor:pointer;

}


.product-button:hover{

    background:var(--orange-dark);

}


.product-button:disabled{

    background:#bbb;

    cursor:not-allowed;

}


/* =====================================================
   EMPTY
===================================================== */

.empty{

    grid-column:1/-1;

    background:#fff;

    border:1px dashed #ddd;

    border-radius:18px;

    padding:50px 20px;

    text-align:center;

    color:var(--muted);

    line-height:1.9;

}


.empty-icon{

    font-size:45px;

    margin-bottom:12px;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    grid-column:1/-1;

    background:#fff;

    border-radius:18px;

    padding:50px 20px;

    text-align:center;

    color:var(--muted);

}


/* =====================================================
   FLOATING CART
===================================================== */

.floating-cart{

    position:fixed;

    z-index:1500;

    bottom:15px;

    right:50%;

    transform:translateX(50%);

    width:90%;

    max-width:500px;

    background:var(--orange);

    color:#fff;

    text-decoration:none;

    padding:15px;

    border-radius:30px;

    text-align:center;

    font-weight:800;

    box-shadow:
        0 8px 25px rgba(244,123,32,.25);

}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:768px){

    .products{

        grid-template-columns:
            repeat(4,1fr);

    }

    .store-hero{

        max-width:1000px;

        margin:25px auto;

    }

    .search-container{

        max-width:1000px;

        margin:auto;

    }

    .products-header{

        max-width:1000px;

        margin:auto;

    }

}


/* =====================================================
   LARGE DESKTOP
===================================================== */

@media(min-width:1200px){

    .products{

        grid-template-columns:
            repeat(5,1fr);

        max-width:1200px;

        margin:auto;

    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:380px){

    .products{

        gap:9px;

        padding:0 10px;

    }

    .store-hero{

        margin:12px 10px;

    }

    .search-container{

        padding:0 10px 15px;

    }

    .products-header{

        padding:0 10px 10px;

    }

    .product-content{

        padding:9px;

    }

    .product-name{

        font-size:14px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     OVERLAY
===================================================== -->

<div
    class="overlay"
    id="overlay">
</div>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<div
    class="sidebar"
    id="sidebar">


<div class="sidebar-title">

متجر <span id="sidebarStoreName">...</span>

</div>


<a href="#" id="homeLink">

🏠 الرئيسية

</a>


<a href="#" id="cartLink">

🛒 السلة

</a>


<a href="#" id="contactLink">

📞 اتصل بنا

</a>


</div>


<!-- =====================================================
     HEADER
===================================================== -->

<header>


<button
    class="menu-btn"
    id="menuBtn">

☰

</button>


<div class="header-store">


<img
    id="headerStoreImage"
    class="header-store-image"
    src=""
    alt="متجر">


<div
    id="headerStoreName"
    class="header-store-name">

جاري التحميل...

</div>


</div>


<button
    class="cart-btn"
    id="cartButton">

🛒

<span
    class="cart-count"
    id="cartCount">

0

</span>

</button>


</header>


<!-- =====================================================
     STORE
===================================================== -->

<section class="store-hero">


<img
    id="storeImage"
    class="store-hero-image"
    src=""
    alt="صورة المتجر">


<h1
    id="storeName"
    class="store-hero-name">

جاري تحميل المتجر...

</h1>


<p
    id="storeDescription"
    class="store-hero-description">

</p>


</section>


<!-- =====================================================
     SEARCH
===================================================== -->

<div class="search-container">


<input
    type="search"
    id="searchInput"
    class="search-box"
    placeholder="ابحث عن منتج...">


</div>


<!-- =====================================================
     PRODUCTS HEADER
===================================================== -->

<div class="products-header">


<h2>

🛍️ المنتجات

</h2>


<span id="productsNumber">

0 منتج

</span>


</div>


<!-- =====================================================
     PRODUCTS
===================================================== -->

<div
    class="products"
    id="productsContainer">


<div class="loading">

⏳ جاري تحميل المنتجات...

</div>


</div>


<!-- =====================================================
     FLOATING CART
===================================================== -->

<a
    href="#"
    id="floatingCart"
    class="floating-cart">

🛒 عرض السلة

</a>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    doc,
    getDoc
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

    authDomain:
    "g-glam.firebaseapp.com",

    projectId:
    "g-glam",

    storageBucket:
    "g-glam.firebasestorage.app",

    messagingSenderId:
    "997228419719",

    appId:
    "1:997228419719:web:f9d88de7ea2c6f457e3622",

    measurementId:
    "G-WX1K1F83F6"
};


/* =====================================================
   INIT
===================================================== */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const productsContainer =
document.getElementById(
    "productsContainer"
);

const storeName =
document.getElementById(
    "storeName"
);

const storeDescription =
document.getElementById(
    "storeDescription"
);

const storeImage =
document.getElementById(
    "storeImage"
);

const headerStoreName =
document.getElementById(
    "headerStoreName"
);

const headerStoreImage =
document.getElementById(
    "headerStoreImage"
);

const sidebarStoreName =
document.getElementById(
    "sidebarStoreName"
);

const productsNumber =
document.getElementById(
    "productsNumber"
);

const searchInput =
document.getElementById(
    "searchInput"
);

const cartCount =
document.getElementById(
    "cartCount"
);


/* =====================================================
   STORE UID
===================================================== */

const params =
new URLSearchParams(
    window.location.search
);


let storeUid =
params.get("store");


/*
   إذا لم يوجد في الرابط،
   نحاول استعمال القيمة المحفوظة.
*/

if(!storeUid){

    storeUid =
    localStorage.getItem(
        "storeId"
    );

}


/* =====================================================
   REQUIRE STORE
===================================================== */

if(!storeUid){

    showError(
        "لم يتم تحديد متجر."
    );

    throw new Error(
        "STORE UID NOT FOUND"
    );
}


/* =====================================================
   CURRENT STORE
===================================================== */

let currentStore = null;

let allProducts = [];


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   IMAGE
===================================================== */

function getProductImage(product){

    if(product.image){

        return product.image;

    }

    if(
        Array.isArray(
            product.images
        )
        &&
        product.images.length > 0
    ){

        return product.images[0];

    }

    return "";

}


/* =====================================================
   LOAD STORE
===================================================== */

async function loadStore(){

    try{

        const storeRef =
        doc(
            db,
            "stores",
            storeUid
        );


        const snapshot =
        await getDoc(
            storeRef
        );


        if(!snapshot.exists()){

            showError(
                "المتجر غير موجود."
            );

            return false;

        }


        currentStore =
        snapshot.data();


        /* =============================================
           STATUS
        ============================================= */

        const status =
        String(
            currentStore.status ||
            "approved"
        )
        .toLowerCase()
        .trim();


        if(
            status !== "approved" &&
            status !== "active"
        ){

            showError(
                "هذا المتجر غير متاح حاليًا."
            );

            return false;

        }


        /* =============================================
           NAME
        ============================================= */

        const name =

            currentStore.storeName ||

            currentStore.name ||

            "المتجر";


        storeName.textContent =
        name;


        headerStoreName.textContent =
        name;


        sidebarStoreName.textContent =
        name;


        document.title =
        name;


        /* =============================================
           DESCRIPTION
        ============================================= */

        storeDescription.textContent =

            currentStore.description ||

            "مرحبًا بكم في متجرنا";


        /* =============================================
           IMAGE
        ============================================= */

        const image =

            currentStore.storeImage ||

            currentStore.image ||

            currentStore.logo ||

            currentStore.photoURL ||

            "";


        if(image){

            storeImage.src =
            image;

            headerStoreImage.src =
            image;

        }

        else{

            storeImage.style.display =
            "none";

            headerStoreImage.style.display =
            "none";

        }


        /* =============================================
           CONTACT
        ============================================= */

        const contactLink =
        document.getElementById(
            "contactLink"
        );


        if(currentStore.facebook){

            contactLink.href =
            currentStore.facebook;

            contactLink.target =
            "_blank";

        }

        else if(currentStore.instagram){

            contactLink.href =
            currentStore.instagram;

            contactLink.target =
            "_blank";

        }

        else if(currentStore.phone){

            contactLink.href =
            "tel:" +
            currentStore.phone;

        }

        else{

            contactLink.href =
            "#";

        }


        /* =============================================
           SAVE STORE
        ============================================= */

        localStorage.setItem(
            "storeId",
            storeUid
        );


        localStorage.setItem(
            "storeName",
            name
        );


        return true;

    }

    catch(error){

        console.error(
            "LOAD STORE ERROR:",
            error
        );


        showError(
            "تعذر تحميل معلومات المتجر."
        );


        return false;

    }

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

    productsContainer.innerHTML = `

        <div class="loading">

            ⏳ جاري تحميل المنتجات...

        </div>

    `;


    try{

        /*
           المنتجات التابعة لهذا المتجر فقط
        */

        const productsQuery =
        query(

            collection(
                db,
                "products"
            ),

            where(
                "ownerUid",
                "==",
                storeUid
            )

        );


        const snapshot =
        await getDocs(
            productsQuery
        );


        allProducts = [];


        snapshot.forEach(
            item => {

                allProducts.push({

                    id:
                    item.id,

                    ...item.data()

                });

            }
        );


        renderProducts(
            allProducts
        );


    }

    catch(error){

        console.error(
            "LOAD PRODUCTS ERROR:",
            error
        );


        /*
           دعم البيانات القديمة
           التي تستخدم storeId.
        */

        try{

            const oldQuery =
            query(

                collection(
                    db,
                    "products"
                ),

                where(
                    "storeId",
                    "==",
                    storeUid
                )

            );


            const oldSnapshot =
            await getDocs(
                oldQuery
            );


            allProducts = [];


            oldSnapshot.forEach(
                item => {

                    allProducts.push({

                        id:
                        item.id,

                        ...item.data()

                    });

                }
            );


            renderProducts(
                allProducts
            );

        }

        catch(oldError){

            console.error(
                "OLD PRODUCTS ERROR:",
                oldError
            );


            productsContainer.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    حدث خطأ أثناء تحميل المنتجات.

                </div>

            `;

        }

    }

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(
    products
){

    productsContainer.innerHTML =
    "";


    productsNumber.textContent =
    products.length +
    " منتج";


    if(products.length === 0){

        productsContainer.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🛍️
                </div>

                لا توجد منتجات في هذا المتجر حاليًا.

            </div>

        `;

        return;

    }


    products.forEach(
        product => {

            const image =
            getProductImage(
                product
            );


            const name =
            product.name ||
            "منتج";


            const price =
            Number(
                product.price || 0
            );


            const stock =
            Number(
                product.stock ?? 0
            );


            const outOfStock =
            stock <= 0;


            const card =
            document.createElement(
                "div"
            );


            card.className =
            "product-card";


            card.innerHTML = `

                ${
                    image

                    ?

                    `
                    <img
                        class="product-image"
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(name)}"
                        onerror="
                            this.src='';
                            this.style.background='#eee';
                        "
                    >
                    `

                    :

                    `
                    <div
                        class="product-image"
                        style="
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            font-size:40px;
                        "
                    >
                        🛍️
                    </div>
                    `
                }


                <div class="product-content">

                    <div class="product-name">

                        ${escapeHtml(name)}

                    </div>


                    <div class="product-price">

                        ${price.toLocaleString("fr-FR")}
                        DA

                    </div>


                    <div class="product-stock">

                        ${
                            outOfStock

                            ?

                            "غير متوفر حاليًا"

                            :

                            "متوفر: " + stock
                        }

                    </div>


                    <button
                        class="product-button"
                        ${outOfStock ? "disabled" : ""}
                    >

                        ${
                            outOfStock

                            ?

                            "غير متوفر"

                            :

                            "🛒 أضف إلى السلة"
                        }

                    </button>

                </div>

            `;


            const button =
            card.querySelector(
                ".product-button"
            );


            if(!outOfStock){

                button.addEventListener(
                    "click",
                    function(){

                        addToCart(
                            product
                        );

                    }
                );

            }


            productsContainer.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(
    product
){

    let cart = [];


    try{

        cart =
        JSON.parse(
            localStorage.getItem(
                "cart"
            )
        ) || [];

    }

    catch{

        cart = [];

    }


    /*
       منع خلط منتجات متاجر مختلفة
    */

    const otherStoreItems =
    cart.filter(
        item =>
        item.storeUid &&
        item.storeUid !== storeUid
    );


    if(
        otherStoreItems.length > 0
    ){

        const answer =
        confirm(
            "السلة تحتوي منتجات من متجر آخر.\n\nهل تريد إفراغ السلة والشراء من هذا المتجر؟"
        );


        if(!answer){

            return;

        }


        cart = [];

    }


    const existing =
    cart.find(
        item =>

        item.id === product.id &&

        item.storeUid === storeUid
    );


    if(existing){

        existing.quantity =
        Number(
            existing.quantity || 0
        ) + 1;

    }

    else{

        cart.push({

            id:
            product.id,

            name:
            product.name || "منتج",

            price:
            Number(
                product.price || 0
            ),

            image:
            getProductImage(
                product
            ),

            quantity:
            1,

            storeUid:
            storeUid,

            storeName:

            currentStore?.storeName ||

            currentStore?.name ||

            "المتجر"

        });

    }


    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );


    localStorage.setItem(
        "cartStoreId",
        storeUid
    );


    updateCartCount();


    alert(
        "تمت إضافة المنتج إلى السلة 🛒"
    );

}


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount(){

    let cart = [];


    try{

        cart =
        JSON.parse(
            localStorage.getItem(
                "cart"
            )
        ) || [];

    }

    catch{

        cart = [];

    }


    const storeItems =
    cart.filter(
        item =>
        item.storeUid === storeUid
    );


    let total = 0;


    storeItems.forEach(
        item => {

            total +=
            Number(
                item.quantity || 0
            );

        }
    );


    cartCount.textContent =
    total;

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    function(){

        const keyword =
        this.value
        .trim()
        .toLowerCase();


        if(!keyword){

            renderProducts(
                allProducts
            );

            return;

        }


        const filtered =
        allProducts.filter(
            product => {

                const name =
                String(
                    product.name || ""
                )
                .toLowerCase();


                const description =
                String(
                    product.description || ""
                )
                .toLowerCase();


                return (

                    name.includes(
                        keyword
                    )

                    ||

                    description.includes(
                        keyword
                    )

                );

            }
        );


        renderProducts(
            filtered
        );

    }
);
