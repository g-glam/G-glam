<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#F47B20">

<title>G-Glam | إعدادات المتجر</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<!-- Font Awesome -->
<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

/* =====================================================
   VARIABLES
===================================================== */

:root{

--orange:#F47B20;
--orange-dark:#DF6810;

--bg:#F7F7F7;
--card:#FFFFFF;

--dark:#222222;
--dark-2:#333333;

--text:#333333;
--muted:#888888;

--border:#E9E9E9;

--success:#198754;
--success-bg:#E5F5EC;

--danger:#DC3545;
--danger-bg:#FBE7EA;

--blue:#1769AA;
--blue-bg:#EAF4FF;

--shadow:0 4px 18px rgba(0,0,0,.06);

}


/* =====================================================
   RESET
===================================================== */

*{

box-sizing:border-box;

margin:0;
padding:0;

font-family:"Tajawal",Arial,sans-serif;

}


html{

scroll-behavior:smooth;

}


body{

background:var(--bg);

color:var(--text);

min-height:100vh;

transition:
background .3s,
color .3s;

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

position:fixed;

right:0;
top:0;

height:100vh;

width:75px;

background:#EEEEEE;

color:#444;

overflow:hidden;

transition:.3s;

z-index:1100;

box-shadow:-3px 0 15px rgba(0,0,0,.04);

border-left:1px solid #E3E3E3;

}

.sidebar:hover{

width:240px;

}


/* =====================================================
   LOGO
===================================================== */

.logo{

height:78px;

display:flex;

align-items:center;

justify-content:center;

border-bottom:1px solid #DDDDDD;

white-space:nowrap;

padding:10px;

}

.logo img{

width:48px;

height:48px;

object-fit:contain;

display:block;

transition:.3s;

}

.sidebar:hover .logo img{

width:130px;

height:55px;

}


/* =====================================================
   MENU
===================================================== */

.menu{

margin-top:18px;

padding:0 10px;

}

.menu a{

display:flex;

align-items:center;

gap:15px;

height:52px;

padding:0 10px;

margin-bottom:7px;

border-radius:12px;

color:#555;

text-decoration:none;

white-space:nowrap;

transition:.2s;

}

.menu a:hover{

background:#E3E3E3;

color:#222;

}

.menu a.active{

background:var(--orange);

color:white;

box-shadow:
0 5px 15px rgba(244,123,32,.22);

}


/* =====================================================
   PROFESSIONAL ICONS
===================================================== */

.icon{

width:35px;

min-width:35px;

height:35px;

display:flex;

align-items:center;

justify-content:center;

text-align:center;

font-size:18px;

transition:.25s;

}

.icon i{

font-size:18px;

width:20px;

text-align:center;

}

.menu a:hover .icon{

transform:scale(1.08);

}

.menu a.active .icon{

color:white;

}


/* =====================================================
   TEXT
===================================================== */

.text{

opacity:0;

transition:.25s;

font-size:14px;

font-weight:700;

}

.sidebar:hover .text{

opacity:1;

}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{

position:fixed;

top:0;

right:75px;

left:0;

height:78px;

background:white;

border-bottom:1px solid var(--border);

display:flex;

align-items:center;

justify-content:space-between;

padding:0 25px;

z-index:1000;

box-shadow:
0 2px 12px rgba(0,0,0,.04);

transition:.3s;

}


/* =====================================================
   STORE TOP
===================================================== */

.store-top{

display:flex;

align-items:center;

gap:12px;

min-width:0;

}


.store-image{

width:48px;

height:48px;

border-radius:50%;

object-fit:cover;

background:#F1F1F1;

border:2px solid #FFE0C8;

flex-shrink:0;

}


/* =====================================================
   STORE DETAILS
===================================================== */

.store-details{

display:flex;

flex-direction:column;

min-width:0;

}

.store-label{

font-size:11px;

color:#999;

margin-bottom:2px;

}

.store-top-name{

font-size:16px;

font-weight:800;

color:#222;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

max-width:250px;

}


/* =====================================================
   TOP ACTIONS
===================================================== */

.topbar-actions{

display:flex;

align-items:center;

gap:10px;

}


/* =====================================================
   THEME
===================================================== */

.theme-btn{

width:42px;

height:42px;

border-radius:12px;

border:1px solid #E5E5E5;

background:#F7F7F7;

color:#333;

display:flex;

align-items:center;

justify-content:center;

font-size:18px;

cursor:pointer;

transition:.25s;

}

.theme-btn:hover{

background:#FFF1E6;

border-color:#FFD2B0;

transform:translateY(-1px);

}


/* =====================================================
   VIEW STORE
===================================================== */

.view-store-btn{

display:flex;

align-items:center;

gap:7px;

background:#FFF1E6;

color:var(--orange-dark);

text-decoration:none;

padding:10px 15px;

border-radius:11px;

font-size:13px;

font-weight:700;

transition:.2s;

white-space:nowrap;

border:1px solid #FFE0CA;

}

.view-store-btn:hover{

background:var(--orange);

color:white;

}


/* =====================================================
   CONTENT
===================================================== */

.content{

margin-right:75px;

padding:103px 25px 25px;

transition:.3s;

max-width:900px;

}


/* =====================================================
   MESSAGES
===================================================== */

.message{

display:none;

padding:14px 18px;

border-radius:12px;

margin-bottom:18px;

text-align:center;

font-size:14px;

}

.success{

background:var(--success-bg);

color:#155724;

border:1px solid #c5e8d3;

}

.error{

background:var(--danger-bg);

color:#721c24;

border:1px solid #efc7cc;

}


/* =====================================================
   SECTION
===================================================== */

.section{

background:white;

border:1px solid var(--border);

padding:25px;

border-radius:18px;

box-shadow:var(--shadow);

margin-bottom:22px;

}

.section-header{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:20px;

border-bottom:1px solid var(--border);

padding-bottom:15px;

}

.section-header h2{

font-size:21px;

color:var(--dark);

display:flex;

align-items:center;

gap:9px;

}

.section-header h2 i{

color:var(--orange);

font-size:20px;

}


/* =====================================================
   FORM STYLES
===================================================== */

.form-group{

margin-bottom:20px;

}

.form-group label{

display:block;

font-size:14px;

font-weight:700;

color:var(--dark);

margin-bottom:8px;

}

.form-group input,
.form-group textarea,
.form-group select{

width:100%;

padding:12px 15px;

border:1px solid var(--border);

border-radius:12px;

background:#FAFAFA;

color:var(--text);

font-size:14px;

outline:none;

transition:.2s;

}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{

border-color:var(--orange);

background:white;

box-shadow:0 0 0 3px rgba(244,123,32,.12);

}

.form-group textarea{

resize:vertical;

min-height:100px;

}

.image-preview-wrapper{

display:flex;

align-items:center;

gap:15px;

margin-top:10px;

}

.image-preview{

width:70px;

height:70px;

border-radius:50%;

object-fit:cover;

background:#F1F1F1;

border:2px solid #FFE0C8;

}


/* =====================================================
   SAVE BUTTON
===================================================== */

.save-btn{

background:var(--orange);

color:white;

border:none;

padding:13px 25px;

border-radius:12px;

cursor:pointer;

font-size:15px;

font-weight:700;

transition:.2s;

box-shadow:0 4px 12px rgba(244,123,32,.2);

display:inline-flex;

align-items:center;

gap:8px;

}

.save-btn:hover{

background:var(--orange-dark);

transform:translateY(-1px);

}


/* =====================================================
   DARK MODE DESKTOP
===================================================== */

@media(min-width:1000px){

body.dark-mode{

--bg:#07111F;
--card:#0D1B2A;

--dark:#F4F7FB;
--dark-2:#E8EEF5;

--text:#E8EEF5;
--muted:#AAB7C7;

--border:#1D334A;

--shadow:0 8px 28px rgba(0,0,0,.30);

background:#07111F;

color:#E8EEF5;

}

body.dark-mode .topbar{

background:#07111F;

border-bottom-color:#172A40;

}

body.dark-mode .sidebar{

background:#0A1726;

color:#E8EEF5;

border-left-color:#1A2D42;

}

body.dark-mode .menu a{

color:#C9D4DF;

}

body.dark-mode .menu a:hover{

background:#17283A;

color:#fff;

}

body.dark-mode .section{

background:#0D1B2A;

border-color:#1D334A;

}

body.dark-mode .section-header{

border-bottom-color:#1D334A;

}

body.dark-mode .form-group label{

color:#F4F7FB;

}

body.dark-mode .form-group input,
body.dark-mode .form-group textarea,
body.dark-mode .form-group select{

background:#102234;

border-color:#1D334A;

color:#E8EEF5;

}

body.dark-mode .form-group input:focus,
body.dark-mode .form-group textarea:focus,
body.dark-mode .form-group select:focus{

border-color:#FF8C32;

background:#13283B;

}

body.dark-mode .theme-btn{

background:#17283A;

color:#FFD28F;

border-color:#29425B;

}

body.dark-mode .view-store-btn{

background:#17283A;

color:#FF8C32;

border-color:#5A3A22;

}

}


/* =====================================================
   MOBILE & TABLET RESPONSIVE
===================================================== */

@media(max-width:800px){

.sidebar{

width:65px;

}

.sidebar:hover{

width:210px;

}

.topbar{

right:65px;

}

.content{

margin-right:65px;

padding-top:93px;

}

}

@media(max-width:550px){

.sidebar{

width:60px;

}

.topbar{

right:60px;

height:68px;

padding:0 12px;

}

.content{

padding:83px 12px 20px;

margin-right:60px;

}

.store-image{

width:42px;

height:42px;

}

.store-label{

display:none;

}

.store-top-name{

font-size:14px;

max-width:120px;

}

.view-store-btn{

padding:8px 10px;

font-size:11px;

}

.section{

padding:18px;

}

}

</style>

</head>


<body>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<div class="sidebar">

<div class="logo">

<img
src="logotrans.png"
alt="G-Glam"
>

</div>


<div class="menu">

<a href="dashboard.html">

<span class="icon">

</span>

الرئيسية
</span>

</div>

</div>


<!-- =====================================================
     TOP BAR
===================================================== -->

<div class="topbar">

<div class="store-top">

<img
id="topStoreImage"
class="store-image"
src="logotrans.png"
alt="صورة المتجر"
>

<div class="store-details">

<div class="store-label">
متجرك
</div>

جاري التحميل...
</div>

</div>

</div>


<div class="topbar-actions">

<button
type="button"
class="theme-btn"
id="themeBtn"
title="الوضع الليلي">

<i class="fa-solid fa-moon"></i>

</button>

<a
href="#"
id="viewStoreBtn"
target="_blank"
class="view-store-btn">

<i class="fa-solid fa-eye"></i>

عرض المتجر

</a>

</div>

</div>


<!-- =====================================================
     CONTENT
===================================================== -->

<div class="content">

<div class="message success" id="successMessage"></div>
<div class="message error" id="errorMessage"></div>

<div class="section">

<div class="section-header">

<h2>

<i class="fa-solid fa-sliders"></i>

إعدادات المتجر العامة

</h2>

</div>

<form id="settingsForm">

<div class="form-group">

<label>اسم المتجر</label>

<input type="text" id="storeNameInput" required placeholder="أدخل اسم المتجر">

</div>

<div class="form-group">

<label>رابط المتجر (Slug)</label>

<input type="text" id="storeSlugInput" required placeholder="store-name">

</div>

<div class="form-group">

<label>رابط صورة/شعار المتجر (URL)</label>

<input type="url" id="storeImageInput" placeholder="https://example.com/logo.png">

<div class="image-preview-wrapper">

<img id="storeImagePreview" class="image-preview" src="logotrans.png" alt="معاينة الشعار">

<span style="font-size:12px; color:var(--muted);">معاينة الشعار الحالية</span>

</div>

</div>

<div class="form-group">

<label>رقم الهاتف / الواتساب</label>

<input type="tel" id="storePhoneInput" placeholder="06XXXXXXXX">

</div>

<div class="form-group">

<label>وصف المتجر</label>

<textarea id="storeDescInput" placeholder="أدخل وصفًا قصيرًا لمتجرك..."></textarea>

</div>

<button type="submit" class="save-btn" id="saveSettingsBtn">

<i class="fa-solid fa-floppy-disk"></i>

حفظ التغييرات

</button>

</form>

</div>

</div>


<script type="module">

/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey: "AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",
authDomain: "g-glam.firebaseapp.com",
projectId: "g-glam",
storageBucket: "g-glam.firebasestorage.app",
messagingSenderId: "997228419719",
appId: "1:997228419719:web:f9d88de7ea2c6f457e3622",
measurementId: "G-WX1K1F83F6"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* =====================================================
   ELEMENTS & VARIABLES
===================================================== */

const themeBtn = document.getElementById("themeBtn");
const topStoreName = document.getElementById("topStoreName");
const topStoreImage = document.getElementById("topStoreImage");
const viewStoreBtn = document.getElementById("viewStoreBtn");

const storeNameInput = document.getElementById("storeNameInput");
const storeSlugInput = document.getElementById("storeSlugInput");
const storeImageInput = document.getElementById("storeImageInput");
const storePhoneInput = document.getElementById("storePhoneInput");
const storeDescInput = document.getElementById("storeDescInput");
const storeImagePreview = document.getElementById("storeImagePreview");
const settingsForm = document.getElementById("settingsForm");

let currentOwnerUid = "";

/* =====================================================
   THEME SETUP
===================================================== */

function applyTheme(){

const isDesktop = window.innerWidth >= 1000;
const savedTheme = localStorage.getItem("gGlamDashboardTheme");

if(isDesktop && savedTheme === "dark"){

document.body.classList.add("dark-mode");
themeBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';

}else{

document.body.classList.remove("dark-mode");
themeBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';

}

}

themeBtn.addEventListener("click", function(){

if(window.innerWidth < 1000) return;

const isDark = document.body.classList.toggle("dark-mode");
localStorage.setItem("gGlamDashboardTheme", isDark ? "dark" : "light");
themeBtn.innerHTML = isDark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';

});

window.addEventListener("resize", applyTheme);
applyTheme();

/* =====================================================
   LOAD SETTINGS
===================================================== */

async function loadStoreSettings(){

try{

const docRef = doc(db, "stores", currentOwnerUid);
const docSnap = await getDoc(docRef);

if(docSnap.exists()){

const data = docSnap.data();

const storeName = data.storeName || data.name || "G-Glam";
const storeSlug = data.slug || data.storeSlug || currentOwnerUid;
const storeImage = data.storeImage || data.image || data.logo || "logotrans.png";

topStoreName.textContent = storeName;
topStoreImage.src = storeImage;
viewStoreBtn.href = "index.html?store=" + encodeURIComponent(storeSlug);

storeNameInput.value = storeName;
storeSlugInput.value = storeSlug;
storeImageInput.value = data.storeImage || data.image || data.logo || "";
storePhoneInput.value = data.phone || data.whatsapp || "";
storeDescInput.value = data.description || "";
storeImagePreview.src = storeImage;

}

}catch(error){

console.error("LOAD SETTINGS ERROR:", error);
showError("❌ حدث خطأ أثناء تحميل بيانات الإعدادات.");

}

}

/* =====================================================
   PREVIEW IMAGE
===================================================== */

storeImageInput.addEventListener("input", function(){

const url = this.value.trim();
storeImagePreview.src = url || "logotrans.png";

});

/* =====================================================
   SAVE SETTINGS
===================================================== */

settingsForm.addEventListener("submit", async function(e){

e.preventDefault();

try{

const updatedData = {

storeName: storeNameInput.value.trim(),
slug: storeSlugInput.value.trim(),
storeImage: storeImageInput.value.trim(),
phone: storePhoneInput.value.trim(),
description: storeDescInput.value.trim()

};

const docRef = doc(db, "stores", currentOwnerUid);
await updateDoc(docRef, updatedData);

// Update Local Storage
localStorage.setItem("storeName", updatedData.storeName);
localStorage.setItem("storeSlug", updatedData.slug);

topStoreName.textContent = updatedData.storeName;
topStoreImage.src = updatedData.storeImage || "logotrans.png";
viewStoreBtn.href = "index.html?store=" + encodeURIComponent(updatedData.slug);

showSuccess("تم حفظ الإعدادات بنجاح ✅");

}catch(error){

console.error("SAVE SETTINGS ERROR:", error);
showError("❌ حدث خطأ أثناء حفظ التغييرات.");

}

});

/* =====================================================
   MESSAGES
===================================================== */

function showSuccess(text){

const box = document.getElementById("successMessage");
box.textContent = text;
box.style.display = "block";
setTimeout(() => { box.style.display = "none"; }, 3000);

}

function showError(text){

const box = document.getElementById("errorMessage");
box.textContent = text;
box.style.display = "block";
setTimeout(() => { box.style.display = "none"; }, 4000);

}

/* =====================================================
   AUTH & LOGOUT
===================================================== */

document.getElementById("logoutBtn").addEventListener("click", async function(e){

e.preventDefault();
if(!confirm("هل تريد تسجيل الخروج؟")) return;

try{

await signOut(auth);
localStorage.clear();
window.location.href = "login.html";

}catch(error){

showError("❌ تعذر تسجيل الخروج.");

}

});

onAuthStateChanged(auth, async function(user){

if(!user){

window.location.href = "login.html";
return;

}

currentOwnerUid = user.uid;
await loadStoreSettings();

});

</script>

</body>
