<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | تسجيل الدخول</title>

<style>

:root{

--bg:#f3f3f3;
--card:#ffffff;

--orange:#f47b20;
--orange-dark:#df6810;

--text:#555;
--text-dark:#444;
--muted:#999;

--border:#e7e7e7;
--input-bg:#fafafa;

--success:#198754;
--success-bg:#dff3e7;

--danger:#dc3545;
--danger-bg:#fbe1e4;

--warning:#b77900;
--warning-bg:#fff2cc;

--shadow:0 8px 30px rgba(0,0,0,.07);

}

*{

box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;

}

body{

min-height:100vh;

background:var(--bg);

color:var(--text);

display:flex;

align-items:center;

justify-content:center;

padding:20px;

}

.background-decoration{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:0;

}

.circle-one{

position:absolute;

width:280px;
height:280px;

border-radius:50%;

background:rgba(244,123,32,.07);

top:-100px;
right:-80px;

}

.circle-two{

position:absolute;

width:220px;
height:220px;

border-radius:50%;

background:rgba(244,123,32,.05);

bottom:-80px;
left:-60px;

}

.card{

position:relative;

z-index:1;

width:100%;

max-width:440px;

background:var(--card);

border-radius:22px;

box-shadow:var(--shadow);

border:1px solid rgba(0,0,0,.03);

padding:35px;

}

.logo-wrapper{

text-align:center;

margin-bottom:8px;

}

.logo{

font-size:34px;

font-weight:800;

letter-spacing:-1px;

color:#222;

}

.logo span{

color:var(--orange);

}

.subtitle{

text-align:center;

font-size:14px;

color:var(--muted);

margin-bottom:30px;

}

.title{

font-size:22px;

font-weight:bold;

color:var(--text-dark);

margin-bottom:7px;

}

.title-description{

font-size:13px;

color:var(--muted);

margin-bottom:25px;

line-height:1.7;

}

.form-group{

margin-bottom:18px;

}

label{

display:block;

font-size:14px;

font-weight:bold;

color:var(--text-dark);

margin-bottom:8px;

}

.input-wrapper{

position:relative;

}

.input-icon{

position:absolute;

right:14px;

top:50%;

transform:translateY(-50%);

font-size:17px;

color:#aaa;

pointer-events:none;

}

input{

width:100%;

height:50px;

padding:0 45px 0 14px;

border:1px solid var(--border);

border-radius:11px;

background:var(--input-bg);

font-size:15px;

color:var(--text-dark);

outline:none;

transition:.2s;

}

input::placeholder{

color:#aaa;

}

input:focus{

border-color:var(--orange);

background:#fff;

box-shadow:0 0 0 3px rgba(244,123,32,.09);

}

#loginBtn{

width:100%;

height:52px;

border:none;

border-radius:11px;

background:var(--orange);

color:#fff;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.2s;

margin-top:5px;

box-shadow:0 4px 12px rgba(244,123,32,.20);

}

#loginBtn:hover{

background:var(--orange-dark);

transform:translateY(-1px);

}

#loginBtn:active{

transform:translateY(0);

}

#loginBtn:disabled{

opacity:.6;

cursor:not-allowed;

transform:none;

}

#message{

display:none;

margin-top:18px;

padding:14px 15px;

border-radius:11px;

font-size:13px;

line-height:1.8;

text-align:center;

}

.message-info{

background:var(--warning-bg);

color:#856404;

border:1px solid #f0df9d;

}

.message-success{

background:var(--success-bg);

color:#155724;

border:1px solid #c4e5d0;

}

.message-error{

background:var(--danger-bg);

color:#721c24;

border:1px solid #efc5ca;

}

.message-warning{

background:#eeeeee;

color:#555;

border:1px solid #ddd;

}

.register{

text-align:center;

margin-top:25px;

padding-top:20px;

border-top:1px solid #eee;

font-size:14px;

color:#999;

}

.register a{

color:var(--orange);

font-weight:bold;

text-decoration:none;

margin-right:4px;

}

.register a:hover{

text-decoration:underline;

}

.security-note{

display:flex;

align-items:center;

justify-content:center;

gap:6px;

margin-top:18px;

font-size:11px;

color:#aaa;

}

@media(max-width:500px){

body{

padding:15px;

}

.card{

padding:27px 20px;

border-radius:19px;

}

.logo{

font-size:31px;

}

.title{

font-size:20px;

}

}

@media(max-width:350px){

.card{

padding:23px 16px;

}

input{

height:48px;

}

#loginBtn{

height:50px;

}

}

</style>

</head>


<body>


<div class="background-decoration">

<div class="circle-one"></div>

<div class="circle-two"></div>

</div>


<div class="card">


<div class="logo-wrapper">

<div class="logo">

G-<span>Glam</span>

</div>

</div>


<div class="subtitle">

إدارة متجرك بسهولة وأمان

</div>


<h2 class="title">

تسجيل الدخول

</h2>


<div class="title-description">

أدخل بيانات حسابك للوصول إلى لوحة التحكم الخاصة بمتجرك.

</div>


<div class="form-group">

<label for="email">

البريد الإلكتروني

</label>


<div class="input-wrapper">

<span class="input-icon">

✉️

</span>


<input

id="email"

type="email"

placeholder="example@gmail.com"

autocomplete="email">

</div>

</div>


<div class="form-group">

<label for="password">

كلمة المرور

</label>


<div class="input-wrapper">

<span class="input-icon">

🔒

</span>


<input

id="password"

type="password"

placeholder="أدخل كلمة المرور"

autocomplete="current-password">

</div>

</div>


<button

id="loginBtn">

تسجيل الدخول

</button>


<div id="message"></div>


<div class="register">

ليس لديك متجر؟

<a href="register.html">

إنشاء متجر جديد

</a>

</div>


<div class="security-note">

🔐 بيانات الدخول محمية بواسطة Firebase

</div>


</div>


<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getAuth,
signInWithEmailAndPassword

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


import {

getFirestore,
doc,
getDoc,
onSnapshot

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const message =
document.getElementById("message");


/* =====================================================
   STORE LISTENER
===================================================== */

let storeUnsubscribe = null;


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(text,type){

message.innerHTML =
text;

message.className = "";

message.classList.add(type);

message.style.display =
"block";

}


/* =====================================================
   RESET BUTTON
===================================================== */

function resetButton(){

loginBtn.disabled =
false;

loginBtn.textContent =
"تسجيل الدخول";

}


/* =====================================================
   FIND STORE BY UID
===================================================== */

async function findStore(uid){

try{

const storeRef =
doc(
db,
"stores",
uid
);

const snapshot =
await getDoc(storeRef);

if(!snapshot.exists()){

return null;

}

return {

id:
snapshot.id,

data:
snapshot.data()

};

}

catch(error){

console.error(
"FIND STORE ERROR:",
error
);

throw error;

}

}


/* =====================================================
   SAVE STORE DATA
===================================================== */

function saveStoreData(
user,
storeId,
storeData
){

const storeName =

storeData.storeName ||

storeData.name ||

"G-Glam";


localStorage.setItem(
"storeId",
storeId
);


localStorage.setItem(
"storeOwnerEmail",
user.email || ""
);


localStorage.setItem(
"ownerEmail",
user.email || ""
);


localStorage.setItem(
"ownerUid",
user.uid
);


localStorage.setItem(
"storeName",
storeName
);

}


/* =====================================================
   WATCH STORE STATUS
===================================================== */

function watchStoreStatus(
user
){

/* إلغاء المراقبة القديمة */

if(storeUnsubscribe){

storeUnsubscribe();

storeUnsubscribe =
null;

}


/* مرجع المتجر */

const storeRef =
doc(
db,
"stores",
user.uid
);


/* مراقبة Firestore */

storeUnsubscribe =

onSnapshot(

storeRef,

function(snapshot){

if(!snapshot.exists()){

return;

}


const storeData =
snapshot.data();


const status =

String(

storeData.status ||

"pending"

)

.toLowerCase()
.trim();


/* =====================================================
   APPROVED
===================================================== */

if(

status === "approved" ||

status === "active" ||

status === "accepted"

){

saveStoreData(
user,
user.uid,
storeData
);


localStorage.setItem(
"paymentStatus",
"approved"
);


showMessage(

"✅ <strong>تم قبول متجرك!</strong><br><br>" +

"تمت الموافقة من طرف الإدارة.<br>" +

"جاري فتح لوحة التحكم...",

"message-success"

);


if(storeUnsubscribe){

storeUnsubscribe();

storeUnsubscribe =
null;

}


setTimeout(

function(){

window.location.href =
"dashboard.html";

},

700

);


return;

}


/* =====================================================
   REJECTED
===================================================== */

if(

status === "rejected" ||

status === "refused"

){

localStorage.setItem(
"paymentStatus",
"rejected"
);


const reason =

storeData.rejectionReason ||

"لم يتم ذكر سبب الرفض.";


showMessage(

"❌ <strong>تم رفض طلب إنشاء المتجر.</strong><br><br>" +

"<strong>سبب الرفض:</strong><br>" +

escapeHtml(reason) +

"<br><br>" +

"يرجى التواصل مع الإدارة.",

"message-error"

);


return;

}


/* =====================================================
   PENDING
===================================================== */

showMessage(

"⏳ <strong>تم تسجيل الدخول بنجاح.</strong><br><br>" +

"طلب متجرك قيد المراجعة.<br>" +

"عند موافقة الإدارة سيتم إدخالك إلى لوحة التحكم تلقائيًا.",

"message-info"

);

},

function(error){

console.error(
"STORE LISTENER ERROR:",
error
);


if(
error.code ===
"permission-denied"
){

showMessage(

"❌ لا توجد صلاحية للوصول إلى بيانات المتجر.<br><br>" +

"تأكدي من أن UID الخاص بحسابك هو نفسه معرف المتجر في Firestore.",

"message-error"

);

}

else{

showMessage(

"❌ حدث خطأ أثناء مراقبة حالة المتجر.<br><br>" +

escapeHtml(
error.message || ""
),

"message-error"

);

}

}

);

}


/* =====================================================
   LOGIN
===================================================== */

loginBtn.addEventListener(

"click",

async function(){

const email =

emailInput.value
.trim()
.toLowerCase();


const password =
passwordInput.value;


if(!email){

showMessage(

"⚠️ يرجى إدخال البريد الإلكتروني.",

"message-error"

);

return;

}


if(!password){

showMessage(

"⚠️ يرجى إدخال كلمة المرور.",

"message-error"

);

return;

}


/* =====================================================
   DISABLE BUTTON
===================================================== */

loginBtn.disabled =
true;

loginBtn.textContent =
"⏳ جاري تسجيل الدخول...";


try{


/* =====================================================
   FIREBASE AUTHENTICATION
===================================================== */

const result =

await signInWithEmailAndPassword(

auth,

email,

password

);


const user =
result.user;


if(!user){

throw new Error(
"لم يتم العثور على المستخدم."
);

}


/* =====================================================
   GET STORE
===================================================== */

showMessage(

"⏳ جاري التحقق من بيانات متجرك...",

"message-info"

);


const store =
await findStore(
user.uid
);


/* =====================================================
   NO STORE
===================================================== */

if(!store){

showMessage(

"⚠️ تم تسجيل الدخول بنجاح، ولكن لم يتم العثور على بيانات متجرك.<br><br>" +

"تأكدي من استخدام نفس الحساب الذي تم إنشاء المتجر به.",

"message-warning"

);


resetButton();

return;

}


/* =====================================================
   STORE DATA
===================================================== */

const storeId =
store.id;

const storeData =
store.data;


const status =

String(

storeData.status ||

"pending"

)

.toLowerCase()
.trim();


/* =====================================================
   SAVE DATA
===================================================== */

saveStoreData(
user,
storeId,
storeData
);


/* =====================================================
   APPROVED / ACTIVE
===================================================== */

if(

status === "approved" ||

status === "active" ||

status === "accepted"

){

localStorage.setItem(
"paymentStatus",
"approved"
);


showMessage(

"✅ <strong>تم قبول متجرك!</strong><br><br>" +

"جاري فتح لوحة التحكم...",

"message-success"

);


setTimeout(

function(){

window.location.href =
"dashboard.html";

},

500

);

return;

}


/* =====================================================
   REJECTED
===================================================== */

if(

status === "rejected" ||

status === "refused"

){

localStorage.setItem(
"paymentStatus",
"rejected"
);


const reason =

storeData.rejectionReason ||

"لم يتم ذكر سبب الرفض.";


showMessage(

"❌ <strong>تم رفض طلب إنشاء المتجر.</strong><br><br>" +

"<strong>سبب الرفض:</strong><br>" +

escapeHtml(reason) +

"<br><br>" +

"يرجى التواصل مع الإدارة.",

"message-error"

);


resetButton();

return;

}


/* =====================================================
   PENDING
===================================================== */

localStorage.setItem(
"paymentStatus",
"pending"
);


showMessage(

"⏳ <strong>تم تسجيل الدخول بنجاح.</strong><br><br>" +

"طلب متجرك قيد المراجعة.<br>" +

"عند موافقة الإدارة سيتم إدخالك إلى لوحة التحكم تلقائيًا.",

"message-info"

);


/* =====================================================
   START REAL-TIME LISTENER
===================================================== */

watchStoreStatus(
user
);


resetButton();

}

catch(error){

console.error(
"LOGIN ERROR:",
error
);


let errorMessage =
"حدث خطأ أثناء تسجيل الدخول.";


/* =====================================================
   AUTH ERRORS
===================================================== */

if(

error.code ===
"auth/invalid-credential"

){

errorMessage =
"❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.";

}

else if(

error.code ===
"auth/user-not-found"

){

errorMessage =
"❌ لا يوجد حساب بهذا البريد الإلكتروني.";

}

else if(

error.code ===
"auth/wrong-password"

){

errorMessage =
"❌ كلمة المرور غير صحيحة.";

}

else if(

error.code ===
"auth/invalid-email"

){

errorMessage =
"❌ البريد الإلكتروني غير صحيح.";

}

else if(

error.code ===
"auth/too-many-requests"

){

errorMessage =
"⚠️ تم إجراء محاولات كثيرة. حاولي مرة أخرى لاحقًا.";

}

else if(

error.code ===
"auth/network-request-failed"

){

errorMessage =
"⚠️ تأكدي من اتصال الإنترنت.";

}

else if(

error.code ===
"permission-denied"

){

errorMessage =

"❌ لا توجد صلاحية للوصول إلى بيانات المتجر.<br><br>" +

"تأكدي من أن UID الخاص بالحساب هو نفسه معرف المتجر في Firestore.";

}

else{

errorMessage =

"❌ حدث خطأ أثناء تسجيل الدخول.<br><br>" +

escapeHtml(
error.message || ""
);

}


showMessage(

errorMessage,

"message-error"

);


resetButton();

}

});


/* =====================================================
   ENTER KEY - PASSWORD
===================================================== */

passwordInput.addEventListener(

"keydown",

function(event){

if(
event.key === "Enter"
){

loginBtn.click();

}

});


/* =====================================================
   ENTER KEY - EMAIL
===================================================== */

emailInput.addEventListener(

"keydown",

function(event){

if(
event.key === "Enter"
){

passwordInput.focus();

}

});


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


</script>


</body>

</html>
