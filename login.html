<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
G-Glam | تسجيل الدخول
</title>

<style>

:root{

--bg:#F5F0E8;
--card:#FFFFFF;
--text:#222;
--accent:#B89B7A;
--shadow:0 5px 20px rgba(0,0,0,.07);

}

*{

box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;

}

body{

background:var(--bg);
color:var(--text);
min-height:100vh;

display:flex;
align-items:center;
justify-content:center;

padding:20px;

}

.container{

width:100%;
max-width:500px;

}

.logo{

text-align:center;
font-size:38px;
font-weight:800;
margin-bottom:8px;

}

.subtitle{

text-align:center;
color:#666;
margin-bottom:25px;

}

.card{

background:var(--card);
border-radius:20px;
padding:25px;
box-shadow:var(--shadow);

}

h1{

font-size:24px;
margin-bottom:20px;

}

label{

display:block;
font-weight:bold;
margin-bottom:7px;

}

input{

width:100%;
padding:14px;
border:none;
background:#f7f7f7;
border-radius:14px;
font-size:16px;
margin-bottom:15px;
outline:none;

}

input:focus{

box-shadow:0 0 0 2px var(--accent);

}

button{

width:100%;
padding:15px;
border:none;
border-radius:14px;
background:#222;
color:white;
font-size:17px;
cursor:pointer;
margin-top:5px;

}

button:hover{

opacity:.9;

}

.register{

text-align:center;
margin-top:18px;

}

.register a{

color:#8d7358;
font-weight:bold;
text-decoration:none;

}

.message{

margin-top:15px;
padding:12px;
border-radius:12px;
display:none;
text-align:center;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

G-Glam

</div>

<div class="subtitle">

الدخول إلى متجرك

</div>

<div class="card">

<h1>

تسجيل الدخول

</h1>

<label>

البريد الإلكتروني

</label>

<input
type="email"
id="email"
placeholder="example@gmail.com">

<label>

كلمة المرور

</label>

<input
type="password"
id="password"
placeholder="كلمة المرور">

<button
id="loginBtn">

تسجيل الدخول

</button>

<div
class="message"
id="message">

</div>

<div class="register">

ليس لديك حساب؟

<a href="register.html">

إنشاء متجر

</a>

</div>

</div>

</div>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {

getAuth,
signInWithEmailAndPassword

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {

getFirestore,
doc,
getDoc

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);


const loginBtn =
document.getElementById(
"loginBtn"
);


const message =
document.getElementById(
"message"
);
  
loginBtn.addEventListener(
"click",
async function(){

const email =
document.getElementById(
"email"
).value.trim();

const password =
document.getElementById(
"password"
).value;


if(!email || !password){

showMessage(
"يرجى إدخال البريد الإلكتروني وكلمة المرور",
true
);

return;

}


loginBtn.disabled = true;

loginBtn.textContent =
"جاري تسجيل الدخول...";


try{

const userCredential =

await signInWithEmailAndPassword(

auth,
email,
password

);


const user =
userCredential.user;


const userRef =

doc(
db,
"users",
user.uid
);


const userSnap =

await getDoc(userRef);


if(!userSnap.exists()){

showMessage(
"لم يتم العثور على بيانات المتجر",
true
);

await auth.signOut();

loginBtn.disabled = false;

loginBtn.textContent =
"تسجيل الدخول";

return;

}


const userData =
userSnap.data();


localStorage.setItem(
"storeId",
userData.storeId
);


localStorage.setItem(
"storeName",
userData.storeName
);


localStorage.setItem(
"ownerEmail",
userData.email
);


window.location.href =
"dashboard.html";

}
catch(error){

console.error(error);

showMessage(
"❌ رمز الخطأ: " +
(error.code || "غير معروف") +
"<br><br>" +
(error.message || "لا توجد تفاصيل"),
true
);

loginBtn.disabled = false;

loginBtn.textContent =
"تسجيل الدخول";

  }


if(
error.code ===
"auth/invalid-credential"
){

text =
"البريد الإلكتروني أو كلمة المرور غير صحيحة";

}

else if(
error.code ===
"auth/user-not-found"
){

text =
"هذا الحساب غير موجود";

}

else if(
error.code ===
"auth/wrong-password"
){

text =
"كلمة المرور غير صحيحة";

}

else if(
error.code ===
"auth/invalid-email"
){

text =
"البريد الإلكتروني غير صحيح";

}


showMessage(
text,
true
);


loginBtn.disabled = false;

loginBtn.textContent =
"تسجيل الدخول";

}

});
  
function showMessage(
text,
error
){

message.textContent =
text;

message.style.display =
"block";

if(error){

message.style.background =
"#f8d7da";

message.style.color =
"#842029";

}else{

message.style.background =
"#d1e7dd";

message.style.color =
"#0f5132";

}

}
  </script>

</body>

</html>
