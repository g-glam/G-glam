<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | تسجيل الدخول</title>

<style>

/* =====================================================
   الألوان
===================================================== */

:root{

--bg:#f3f3f3;
--card:#ffffff;

--orange:#f47b20;
--orange-dark:#df6810;

--text:#555;
--text-dark:#444;
--muted:#999;

--border:#e7e7e7;
--input-bg:#fafafa;

--success:#198754;
--success-bg:#dff3e7;

--danger:#dc3545;
--danger-bg:#fbe1e4;

--warning:#b77900;
--warning-bg:#fff2cc;

--shadow:0 8px 30px rgba(0,0,0,.07);

}


/* =====================================================
   RESET
===================================================== */

*{

box-sizing:border-box;

margin:0;
padding:0;

font-family:Arial,sans-serif;

}


/* =====================================================
   BODY
===================================================== */

body{

min-height:100vh;

background:var(--bg);

color:var(--text);

display:flex;

align-items:center;

justify-content:center;

padding:20px;

}


/* =====================================================
   BACKGROUND
===================================================== */

.background-decoration{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:0;

}

.circle-one{

position:absolute;

width:280px;

height:280px;

border-radius:50%;

background:rgba(244,123,32,.07);

top:-100px;

right:-80px;

}

.circle-two{

position:absolute;

width:220px;

height:220px;

border-radius:50%;

background:rgba(244,123,32,.05);

bottom:-80px;

left:-60px;

}


/* =====================================================
   CARD
===================================================== */

.card{

position:relative;

z-index:1;

width:100%;

max-width:440px;

background:var(--card);

border-radius:22px;

box-shadow:var(--shadow);

border:1px solid rgba(0,0,0,.03);

padding:35px;

}


/* =====================================================
   LOGO
===================================================== */

.logo-wrapper{

text-align:center;

margin-bottom:8px;

}

.logo{

font-size:34px;

font-weight:800;

letter-spacing:-1px;

color:#222;

}

.logo span{

color:var(--orange);

}


/* =====================================================
   SUBTITLE
===================================================== */

.subtitle{

text-align:center;

font-size:14px;

color:var(--muted);

margin-bottom:30px;

}


/* =====================================================
   TITLE
===================================================== */

.title{

font-size:22px;

font-weight:bold;

color:var(--text-dark);

margin-bottom:7px;

}

.title-description{

font-size:13px;

color:var(--muted);

margin-bottom:25px;

line-height:1.7;

}


/* =====================================================
   FORM
===================================================== */

.form-group{

margin-bottom:18px;

}


/* =====================================================
   LABEL
===================================================== */

label{

display:block;

font-size:14px;

font-weight:bold;

color:var(--text-dark);

margin-bottom:8px;

}


/* =====================================================
   INPUT WRAPPER
===================================================== */

.input-wrapper{

position:relative;

}


/* =====================================================
   INPUT ICON
===================================================== */

.input-icon{

position:absolute;

right:14px;

top:50%;

transform:translateY(-50%);

font-size:17px;

color:#aaa;

pointer-events:none;

}


/* =====================================================
   INPUT
===================================================== */

input{

width:100%;

height:50px;

padding:0 45px 0 14px;

border:1px solid var(--border);

border-radius:11px;

background:var(--input-bg);

font-size:15px;

color:var(--text-dark);

outline:none;

transition:.2s;

}

input::placeholder{

color:#aaa;

}

input:focus{

border-color:var(--orange);

background:#fff;

box-shadow:0 0 0 3px rgba(244,123,32,.09);

}


/* =====================================================
   LOGIN BUTTON
===================================================== */

#loginBtn{

width:100%;

height:52px;

border:none;

border-radius:11px;

background:var(--orange);

color:#fff;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.2s;

margin-top:5px;

box-shadow:0 4px 12px rgba(244,123,32,.20);

}

#loginBtn:hover{

background:var(--orange-dark);

transform:translateY(-1px);

}

#loginBtn:active{

transform:translateY(0);

}

#loginBtn:disabled{

opacity:.6;

cursor:not-allowed;

transform:none;

}


/* =====================================================
   MESSAGE
===================================================== */

#message{

display:none;

margin-top:18px;

padding:14px 15px;

border-radius:11px;

font-size:13px;

line-height:1.8;

text-align:center;

}


/* =====================================================
   MESSAGE TYPES
===================================================== */

.message-info{

background:var(--warning-bg);

color:#856404;

border:1px solid #f0df9d;

}


.message-success{

background:var(--success-bg);

color:#155724;

border:1px solid #c4e5d0;

}


.message-error{

background:var(--danger-bg);

color:#721c24;

border:1px solid #efc5ca;

}


.message-warning{

background:#eeeeee;

color:#555;

border:1px solid #ddd;

}


/* =====================================================
   REGISTER
===================================================== */

.register{

text-align:center;

margin-top:25px;

padding-top:20px;

border-top:1px solid #eee;

font-size:14px;

color:#999;

}

.register a{

color:var(--orange);

font-weight:bold;

text-decoration:none;

margin-right:4px;

}

.register a:hover{

text-decoration:underline;

}


/* =====================================================
   SECURITY
===================================================== */

.security-note{

display:flex;

align-items:center;

justify-content:center;

gap:6px;

margin-top:18px;

font-size:11px;

color:#aaa;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px){

body{

padding:15px;

}

.card{

padding:27px 20px;

border-radius:19px;

}

.logo{

font-size:31px;

}

.title{

font-size:20px;

}

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:350px){

.card{

padding:23px 16px;

}

input{

height:48px;

}

#loginBtn{

height:50px;

}

}

</style>

</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background-decoration">

<div class="circle-one"></div>

<div class="circle-two"></div>

</div>


<!-- =====================================================
     LOGIN CARD
===================================================== -->

<div class="card">


<div class="logo-wrapper">

<div class="logo">

G-<span>Glam</span>

</div>

</div>


<div class="subtitle">

إدارة متجرك بسهولة وأمان

</div>


<h2 class="title">

تسجيل الدخول

</h2>


<div class="title-description">

أدخل بيانات حسابك للوصول إلى لوحة التحكم الخاصة بمتجرك.

</div>


<!-- =====================================================
     EMAIL
===================================================== -->

<div class="form-group">

<label for="email">

البريد الإلكتروني

</label>


<div class="input-wrapper">

<span class="input-icon">

✉️

</span>


<input

id="email"

type="email"

placeholder="example@gmail.com"

autocomplete="email">

</div>

</div>


<!-- =====================================================
     PASSWORD
===================================================== -->

<div class="form-group">

<label for="password">

كلمة المرور

</label>


<div class="input-wrapper">

<span class="input-icon">

🔒

</span>


<input

id="password"

type="password"

placeholder="أدخل كلمة المرور"

autocomplete="current-password">

</div>

</div>


<!-- =====================================================
     LOGIN BUTTON
===================================================== -->

<button

id="loginBtn">

تسجيل الدخول

</button>


<!-- =====================================================
     MESSAGE
===================================================== -->

<div

id="message">

</div>


<!-- =====================================================
     REGISTER
===================================================== -->

<div class="register">

ليس لديك متجر؟

<a href="register.html">

إنشاء متجر جديد

</a>

</div>


<!-- =====================================================
     SECURITY
===================================================== -->

<div class="security-note">

🔐 بيانات الدخول محمية بواسطة Firebase

</div>


</div>


<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getAuth,
signInWithEmailAndPassword

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


import {

getFirestore,
doc,
getDoc

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const emailInput =
document.getElementById("email");


const passwordInput =
document.getElementById("password");


const loginBtn =
document.getElementById("loginBtn");


const message =
document.getElementById("message");


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(text,type){

message.innerHTML =
text;

message.className =
"";

message.classList.add(type);

message.style.display =
"block";

}


/* =====================================================
   FIND STORE BY UID
===================================================== */

/*

مهم جدًا:

الـ Document ID في مجموعة stores
عندك هو نفس UID لصاحب المتجر.

مثال:

stores/
1r8XxSE2h4V4aR1eeCXZSZcHuyL2

و:

ownerUid =
1r8XxSE2h4V4aR1eeCXZSZcHuyL2

لذلك نقرأ المتجر مباشرة بواسطة UID.

*/

async function findStore(uid){

try{

const storeRef =
doc(
db,
"stores",
uid
);


const snapshot =
await getDoc(storeRef);


if(!snapshot.exists()){

return null;

}


return {

id:
snapshot.id,

data:
snapshot.data()

};

}

catch(error){

console.error(
"FIND STORE ERROR:",
error
);

throw error;

}

}


/* =====================================================
   LOGIN
===================================================== */

loginBtn.addEventListener(

"click",

async function(){

const email =
emailInput.value
.trim()
.toLowerCase();


const password =
passwordInput.value;


if(!email){

showMessage(

"⚠️ يرجى إدخال البريد الإلكتروني.",

"message-error"

);

return;

}


if(!password){

showMessage(

"⚠️ يرجى إدخال كلمة المرور.",

"message-error"

);

return;

}


/* تعطيل الزر */

loginBtn.disabled =
true;

loginBtn.textContent =
"⏳ جاري تسجيل الدخول...";


try{


/* =====================================================
   FIREBASE AUTHENTICATION
===================================================== */

const result =

await signInWithEmailAndPassword(

auth,

email,

password

);


const user =
result.user;


/* =====================================================
   التأكد من تسجيل الدخول
===================================================== */

if(!user){

throw new Error(
"لم يتم العثور على المستخدم."
);

}


/* =====================================================
   التحقق من المتجر بواسطة UID
===================================================== */

showMessage(

"⏳ جاري التحقق من بيانات متجرك...",

"message-info"

);


const store =
await findStore(
user.uid
);


/* =====================================================
   لا يوجد متجر
===================================================== */

if(!store){

showMessage(

"⚠️ تم تسجيل الدخول بنجاح، ولكن لم يتم العثور على بيانات متجرك.<br><br>" +

"تأكدي من استخدام نفس الحساب الذي تم إنشاء المتجر به.",

"message-warning"

);


loginBtn.disabled =
false;

loginBtn.textContent =
"تسجيل الدخول";

return;

}


/* =====================================================
   STORE DATA
===================================================== */

const storeId =
store.id;


const storeData =
store.data;


/* =====================================================
   STORE STATUS
===================================================== */

const status =

String(

storeData.status ||

"pending"

)

.toLowerCase()
.trim();


/* =====================================================
   STORE NAME
===================================================== */

const storeName =

storeData.storeName ||

storeData.name ||

"G-Glam";


/* =====================================================
   SAVE STORE DATA
===================================================== */

localStorage.setItem(
"storeId",
storeId
);


localStorage.setItem(
"storeOwnerEmail",
user.email || email
);


localStorage.setItem(
"ownerEmail",
user.email || email
);


localStorage.setItem(
"ownerUid",
user.uid
);


localStorage.setItem(
"storeName",
storeName
);


/* =====================================================
   PENDING
===================================================== */

if(

status === "pending" ||

status === "waiting" ||

status === "review"

){

localStorage.setItem(
"paymentStatus",
"pending"
);


showMessage(

"⏳ <strong>تم تسجيل الدخول بنجاح.</strong><br><br>" +

"سيتم مراجعة طلبك والتأكد من الدفع من طرف الإدارة، وبعد تأكيد الدفع ستتمكن من الدخول إلى متجرك.",

"message-info"

);


loginBtn.disabled =
false;

loginBtn.textContent =
"تسجيل الدخول";

return;

}


/* =====================================================
   REJECTED
===================================================== */

if(

status === "rejected" ||

status === "refused"

){

localStorage.setItem(
"paymentStatus",
"rejected"
);


const reason =

storeData.rejectionReason ||

"لم يتم ذكر سبب الرفض.";


showMessage(

"❌ <strong>تم رفض طلب إنشاء المتجر.</strong><br><br>" +

"<strong>سبب الرفض:</strong><br>" +

escapeHtml(reason) +

"<br><br>" +

"يرجى التواصل مع الإدارة.",

"message-error"

);


loginBtn.disabled =
false;

loginBtn.textContent =
"تسجيل الدخول";

return;

}


/* =====================================================
   APPROVED / ACTIVE
===================================================== */

if(

status === "approved" ||

status === "accepted" ||

status === "active"

){

localStorage.setItem(
"paymentStatus",
"approved"
);


showMessage(

"✅ <strong>تم قبول متجرك بنجاح!</strong><br><br>" +

"تم التأكد من الدفع من طرف الإدارة.<br>" +

"جاري الدخول إلى لوحة التحكم الخاصة بمتجرك...",

"message-success"

);


/* الدخول إلى لوحة المتجر */

setTimeout(

function(){

window.location.href =
"dashboard.html";

},

1000

);

return;

}


/* =====================================================
   UNKNOWN STATUS
===================================================== */

showMessage(

"⚠️ حالة طلب المتجر غير معروفة.<br><br>" +

"الحالة الحالية: " +

escapeHtml(status) +

"<br><br>" +

"يرجى التواصل مع الإدارة.",

"message-warning"

);


loginBtn.disabled =
false;

loginBtn.textContent =
"تسجيل الدخول";


}

catch(error){

console.error(
"LOGIN ERROR:",
error
);


let errorMessage =
"حدث خطأ أثناء تسجيل الدخول.";


/* =====================================================
   FIREBASE AUTH ERRORS
===================================================== */

if(

error.code ===
"auth/invalid-credential"

){

errorMessage =
"❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.";

}


else if(

error.code ===
"auth/user-not-found"

){

errorMessage =
"❌ لا يوجد حساب بهذا البريد الإلكتروني.";

}


else if(

error.code ===
"auth/wrong-password"

){

errorMessage =
"❌ كلمة المرور غير صحيحة.";

}


else if(

error.code ===
"auth/invalid-email"

){

errorMessage =
"❌ البريد الإلكتروني غير صحيح.";

}


else if(

error.code ===
"auth/too-many-requests"

){

errorMessage =
"⚠️ تم إجراء محاولات كثيرة. حاولي مرة أخرى لاحقًا.";

}


else if(

error.code ===
"auth/network-request-failed"

){

errorMessage =
"⚠️ تأكدي من اتصال الإنترنت.";

}


/* =====================================================
   FIRESTORE PERMISSION ERROR
===================================================== */

else if(

error.code ===
"permission-denied"

){

errorMessage =

"❌ لا توجد صلاحية للوصول إلى بيانات المتجر.<br><br>" +

"تأكدي من أن UID الخاص بالحساب هو نفسه معرف المتجر في Firestore.";

}


/* =====================================================
   OTHER ERROR
===================================================== */

else{

errorMessage =

"❌ حدث خطأ أثناء تسجيل الدخول.<br><br>" +

escapeHtml(
error.message || ""
);

}


showMessage(

errorMessage,

"message-error"

);


loginBtn.disabled =
false;

loginBtn.textContent =
"تسجيل الدخول";

}

});


/* =====================================================
   ENTER KEY
===================================================== */

passwordInput.addEventListener(

"keydown",

function(event){

if(
event.key === "Enter"
){

loginBtn.click();

}

});


emailInput.addEventListener(

"keydown",

function(event){

if(
event.key === "Enter"
){

passwordInput.focus();

}

});


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}

</script>


</body>

</html>
