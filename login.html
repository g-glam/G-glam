<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | تسجيل الدخول</title>

<style>

body{

margin:0;
font-family:Arial,sans-serif;
background:#F5F0E8;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

padding:20px;

}

.card{

background:white;
width:100%;
max-width:400px;

padding:30px;

border-radius:20px;

box-shadow:0 5px 20px rgba(0,0,0,.08);

}

.logo{

text-align:center;
font-size:38px;
font-weight:bold;
margin-bottom:10px;

}

.subtitle{

text-align:center;
color:#777;
margin-bottom:25px;

}

label{

display:block;
font-weight:bold;
margin-bottom:7px;

}

input{

width:100%;
padding:14px;

border:1px solid #ddd;

border-radius:12px;

font-size:16px;

margin-bottom:15px;

box-sizing:border-box;

}

button{

width:100%;

padding:15px;

border:none;

border-radius:12px;

background:#222;

color:white;

font-size:17px;

cursor:pointer;

}

button:disabled{

opacity:.6;

}

#message{

margin-top:15px;

padding:12px;

border-radius:10px;

text-align:center;

display:none;

line-height:1.6;

}

</style>

</head>


<body>


<div class="card">


<div class="logo">
G-Glam
</div>


<div class="subtitle">
الدخول إلى متجرك
</div>


<h2>
تسجيل الدخول
</h2>


<label>
البريد الإلكتروني
</label>


<input
id="email"
type="email"
placeholder="example@gmail.com">


<label>
كلمة المرور
</label>


<input
id="password"
type="password"
placeholder="كلمة المرور">


<button id="loginBtn">
تسجيل الدخول
</button>


<div id="message">
</div>


</div>


<script type="module">


/* Firebase */

import { initializeApp }

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getAuth,
signInWithEmailAndPassword

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const loginBtn =
document.getElementById(
"loginBtn"
);

const message =
document.getElementById(
"message"
);


/* رسالة */

function showMessage(text){

message.innerHTML =
text;

message.style.display =
"block";

}


/* الضغط على تسجيل الدخول */

loginBtn.addEventListener(
"click",
async function(){

const email =
document.getElementById(
"email"
).value.trim();

const password =
document.getElementById(
"password"
).value;


if(!email){

showMessage(
"⚠️ أدخلي البريد الإلكتروني"
);

return;

}


if(!password){

showMessage(
"⚠️ أدخلي كلمة المرور"
);

return;

}


loginBtn.disabled =
true;

loginBtn.textContent =
"جاري الدخول...";


try{


const result =

await signInWithEmailAndPassword(

auth,
email,
password

);


const user =
result.user;


showMessage(

"✅ تسجيل الدخول نجح!<br><br>" +

"الحساب:<br>" +

user.email +

"<br><br>" +

"UID:<br>" +

user.uid +

"<br><br>" +

"جاري الانتقال إلى Dashboard..."

);


/*

   ننتظر ثانية واحدة
   حتى نرى نتيجة الاختبار

*/

setTimeout(

function(){

window.location.href =
"dashboard.html";

},

1000

);


}


catch(error){

console.error(error);


showMessage(

"❌ فشل تسجيل الدخول<br><br>" +

"رمز الخطأ:<br>" +

error.code +

"<br><br>" +

error.message

);


loginBtn.disabled =
false;

loginBtn.textContent =
"تسجيل الدخول";

}

});


</script>


</body>

</html>
