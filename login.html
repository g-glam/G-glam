<style>

/* =====================================================
   COLORS
===================================================== */

:root{

--orange:#F47B20;
--orange-dark:#DF6810;
--orange-light:#FFF1E6;

--bg:#F7F7F7;
--white:#FFFFFF;

--text:#222222;

/* =====================================================
   RESET
===================================================== */

margin:0;
padding:0;

"Tajawal",

/* =====================================================
   BODY
===================================================== */

/* =====================================================
   HEADER
===================================================== */

.header{

width:100%;

height:82px;

===================================================== */

===================================================== */

===================================================== */

/* =====================================================

20px 0 40px;

/* =====================================================

===================================================== */

.image-frame{

position:relative;

width:100%;

background:#fff;

padding:10px;

border-radius:0 18px 18px 0;

box-shadow:

0 25px 65px

clip-path:

polygon(
0% 0%,
91% 0%,
100% 100%,
8% 100%
);

rotate(-1.5deg);

transition:.3s;

}


/* =====================================================

===================================================== */

display:block;

width:100%;

aspect-ratio:16/10;

}


.image-frame:hover{

rotate(0deg)
translateY(-5px);

0 30px 75px
rgba(244,123,32,.23),

0 15px 40px
rgba(0,0,0,.13);

}

.orange-line.bottom-2{

<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getAuth,
signInWithEmailAndPassword

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


import {

getFirestore,
doc,
getDoc,
onSnapshot

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const message =
document.getElementById("message");

const togglePassword =
document.getElementById("togglePassword");


/* =====================================================
   PASSWORD VISIBILITY
===================================================== */

togglePassword.addEventListener(

"click",

function(){

if(
passwordInput.type === "password"
){

passwordInput.type =
"text";

togglePassword.textContent =
"🙈";

togglePassword.setAttribute(
"aria-label",
"إخفاء كلمة المرور"
);

}

else{

passwordInput.type =
"password";

togglePassword.textContent =
"👁";

togglePassword.setAttribute(
"aria-label",
"إظهار كلمة المرور"
);

}

}

);


/* =====================================================
   STORE LISTENER
===================================================== */

let storeUnsubscribe = null;


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(text,type){

message.innerHTML =
text;

message.className = "";

message.classList.add(type);

message.style.display =
"block";

}


/* =====================================================
   RESET BUTTON
===================================================== */

function resetButton(){

loginBtn.disabled =
false;

loginBtn.textContent =
"تسجيل الدخول";

}


/* =====================================================
   FIND STORE BY UID
===================================================== */

async function findStore(uid){

try{

const storeRef =
doc(
db,
"stores",
uid
);

const snapshot =
await getDoc(storeRef);

if(!snapshot.exists()){

return null;

}

return {

id:
snapshot.id,

data:
snapshot.data()

};

}

catch(error){

console.error(
"FIND STORE ERROR:",
error
);

throw error;

}

}


/* =====================================================
   SAVE STORE DATA
===================================================== */

function saveStoreData(
user,
storeId,
storeData
){

const storeName =

storeData.storeName ||

storeData.name ||

"G-Glam";


localStorage.setItem(
"storeId",
storeId
);


localStorage.setItem(
"storeOwnerEmail",
user.email || ""
);


localStorage.setItem(
"ownerEmail",
user.email || ""
);


localStorage.setItem(
"ownerUid",
user.uid
);


localStorage.setItem(
"storeName",
storeName
);

}


/* =====================================================
   WATCH STORE STATUS
===================================================== */

function watchStoreStatus(user){

if(storeUnsubscribe){

storeUnsubscribe();

storeUnsubscribe =
null;

}


const storeRef =
doc(
db,
"stores",
user.uid
);


storeUnsubscribe =

onSnapshot(

storeRef,

function(snapshot){

if(!snapshot.exists()){

return;

}


const storeData =
snapshot.data();


const status =

String(

storeData.status ||

"pending"

)

.toLowerCase()
.trim();


/* APPROVED */

if(

status === "approved" ||

status === "active" ||

status === "accepted"

){

saveStoreData(
user,
user.uid,
storeData
);


localStorage.setItem(
"paymentStatus",
"approved"
);


showMessage(

"✅ <strong>تم قبول متجرك!</strong><br><br>" +

"تمت الموافقة من طرف الإدارة.<br>" +

"جاري فتح لوحة التحكم...",

"message-success"

);


if(storeUnsubscribe){

storeUnsubscribe();

storeUnsubscribe =
null;

}


setTimeout(

function(){

window.location.href =
"dashboard.html";

},

700

);


return;

}


/* REJECTED */

if(

status === "rejected" ||

status === "refused"

){

localStorage.setItem(
"paymentStatus",
"rejected"
);


const reason =

storeData.rejectionReason ||

"لم يتم ذكر سبب الرفض.";


showMessage(

"❌ <strong>تم رفض طلب إنشاء المتجر.</strong><br><br>" +

"<strong>سبب الرفض:</strong><br>" +

escapeHtml(reason) +

"<br><br>" +

"يرجى التواصل مع الإدارة.",

"message-error"

);


return;

}


/* PENDING */

showMessage(

"⏳ <strong>تم تسجيل الدخول بنجاح.</strong><br><br>" +

"طلب متجرك قيد المراجعة.<br>" +

"عند موافقة الإدارة سيتم إدخالك إلى لوحة التحكم تلقائيًا.",

);

},

function(error){

);

else{

/* =====================================================
   LOGIN
===================================================== */

loginBtn.addEventListener(

"click",

async function(){

const email =

emailInput.value
.trim()
.toLowerCase();


const password =
passwordInput.value;


if(!email){

showMessage(

"⚠️ يرجى إدخال البريد الإلكتروني.",

"message-error"

);

return;

}


if(!password){

showMessage(

"⚠️ يرجى إدخال كلمة المرور.",

"message-error"

);

return;

}


loginBtn.disabled =
true;

loginBtn.textContent =
"⏳ جاري تسجيل الدخول...";


try{


/* AUTH */

const result =

await signInWithEmailAndPassword(

auth,

email,

password

);


const user =
result.user;


if(!user){

throw new Error(
"لم يتم العثور على المستخدم."
);

}


/* FIND STORE */

showMessage(

"⏳ جاري التحقق من بيانات متجرك...",

"message-info"

);


const store =
await findStore(
user.uid
);


/* NO STORE */

if(!store){

showMessage(

"⚠️ تم تسجيل الدخول بنجاح، ولكن لم يتم العثور على بيانات متجرك.<br><br>" +

"تأكدي من استخدام نفس الحساب الذي تم إنشاء المتجر به.",

"message-warning"

);


resetButton();

return;

}


/* STORE DATA */

const storeId =
store.id;

const storeData =
store.data;


const status =

String(

storeData.status ||

"pending"

)

.toLowerCase()
.trim();


/* SAVE */

saveStoreData(
user,
storeId,
storeData
);


/* APPROVED */

if(

status === "approved" ||

status === "active" ||

status === "accepted"

){

localStorage.setItem(
"paymentStatus",
"approved"
);


showMessage(

"✅ <strong>تم قبول متجرك!</strong><br><br>" +

"جاري فتح لوحة التحكم...",

"message-success"

);


setTimeout(

function(){

window.location.href =
"dashboard.html";

},

500

);

return;

}


/* REJECTED */

if(

status === "rejected" ||

status === "refused"

){

localStorage.setItem(
"paymentStatus",
"rejected"
);


const reason =

storeData.rejectionReason ||

"لم يتم ذكر سبب الرفض.";


showMessage(

"❌ <strong>تم رفض طلب إنشاء المتجر.</strong><br><br>" +

"<strong>سبب الرفض:</strong><br>" +

escapeHtml(reason) +

"<br><br>" +

"يرجى التواصل مع الإدارة.",

"message-error"

);


resetButton();

return;

}


/* PENDING */

localStorage.setItem(
"paymentStatus",
"pending"
);


showMessage(

"⏳ <strong>تم تسجيل الدخول بنجاح.</strong><br><br>" +

"طلب متجرك قيد المراجعة.<br>" +

"عند موافقة الإدارة سيتم إدخالك إلى لوحة التحكم تلقائيًا.",

"message-info"

);


/* REAL TIME */

watchStoreStatus(
user
);


resetButton();

}

catch(error){

console.error(
"LOGIN ERROR:",
error
);


let errorMessage =
"حدث خطأ أثناء تسجيل الدخول.";


if(

error.code ===
"auth/invalid-credential"

){

errorMessage =
"❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.";

}

else if(

error.code ===
"auth/user-not-found"

){

errorMessage =
"❌ لا يوجد حساب بهذا البريد الإلكتروني.";

}

else if(

error.code ===
"auth/wrong-password"

){

errorMessage =
"❌ كلمة المرور غير صحيحة.";

}

else if(

error.code ===
"auth/invalid-email"

){

errorMessage =
"❌ البريد الإلكتروني غير صحيح.";

}

else if(

error.code ===
"auth/too-many-requests"

){

errorMessage =
"⚠️ تم إجراء محاولات كثيرة. حاولي مرة أخرى لاحقًا.";

}

else if(

error.code ===
"auth/network-request-failed"

){

errorMessage =
"⚠️ تأكدي من اتصال الإنترنت.";

}

else if(

error.code ===
"permission-denied"

){

errorMessage =

"❌ لا توجد صلاحية للوصول إلى بيانات المتجر.<br><br>" +

"تأكدي من أن UID الخاص بالحساب هو نفسه معرف المتجر في Firestore.";

}

else{

errorMessage =

"❌ حدث خطأ أثناء تسجيل الدخول.<br><br>" +

escapeHtml(
error.message || ""
);

}


showMessage(

errorMessage,

"message-error"

);


resetButton();

}

});

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}
