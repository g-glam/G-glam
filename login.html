<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | تسجيل الدخول</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
font-family:Arial,sans-serif;

background:#F5F0E8;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

padding:20px;

}

.card{

background:white;

width:100%;
max-width:420px;

padding:30px;

border-radius:20px;

box-shadow:0 5px 20px rgba(0,0,0,.08);

}

.logo{

text-align:center;

font-size:38px;

font-weight:bold;

margin-bottom:10px;

}

.subtitle{

text-align:center;

color:#777;

margin-bottom:25px;

}

h2{

margin-bottom:20px;

}

label{

display:block;

font-weight:bold;

margin-bottom:7px;

}

input{

width:100%;

padding:14px;

border:1px solid #ddd;

border-radius:12px;

font-size:16px;

margin-bottom:15px;

}

button{

width:100%;

padding:15px;

border:none;

border-radius:12px;

background:#222;

color:white;

font-size:17px;

cursor:pointer;

}

button:disabled{

opacity:.6;

cursor:not-allowed;

}

#message{

margin-top:15px;

padding:14px;

border-radius:10px;

text-align:center;

display:none;

line-height:1.7;

}

.message-info{

background:#fff3cd;

color:#856404;

}

.message-success{

background:#d4edda;

color:#155724;

}

.message-error{

background:#f8d7da;

color:#721c24;

}

.message-warning{

background:#e2e3e5;

color:#383d41;

}

.register{

text-align:center;

margin-top:20px;

color:#777;

}

.register a{

color:#222;

font-weight:bold;

text-decoration:none;

}

</style>

</head>


<body>


<div class="card">


<div class="logo">
G-Glam
</div>


<div class="subtitle">
الدخول إلى متجرك
</div>


<h2>
تسجيل الدخول
</h2>


<label>
البريد الإلكتروني
</label>

<input
id="email"
type="email"
placeholder="example@gmail.com"
autocomplete="email">


<label>
كلمة المرور
</label>

<input
id="password"
type="password"
placeholder="كلمة المرور"
autocomplete="current-password">


<button id="loginBtn">
تسجيل الدخول
</button>


<div id="message">
</div>


<div class="register">

ليس لديك متجر؟

<a href="register.html">
إنشاء متجر
</a>

</div>


</div>


<script type="module">


/* =========================================
   Firebase
========================================= */

import {

initializeApp

}

from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getAuth,
signInWithEmailAndPassword

}

from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


import {

getFirestore,
collection,
query,
where,
getDocs

}

from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =========================================
   Firebase Config
========================================= */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =========================================
   تشغيل Firebase
========================================= */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =========================================
   العناصر
========================================= */

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const message =
document.getElementById("message");


/* =========================================
   عرض الرسائل
========================================= */

function showMessage(
text,
type
){

message.innerHTML =
text;

message.className =
"";

message.classList.add(
type
);

message.style.display =
"block";

}


/* =========================================
   البحث عن متجر صاحب الحساب
========================================= */

async function findStore(
email
){

const q =
query(

collection(
db,
"stores"
),

where(
"ownerEmail",
"==",
email
)

);


const snapshot =
await getDocs(q);


if(snapshot.empty){

return null;

}


/*

إذا كان هناك أكثر من متجر
نستخدم أول متجر حاليًا

*/

const storeDoc =
snapshot.docs[0];


return {

id:
storeDoc.id,

data:
storeDoc.data()

};

}


/* =========================================
   تسجيل الدخول
========================================= */

loginBtn.addEventListener(

"click",

async function(){

const email =
emailInput.value
.trim()
.toLowerCase();

const password =
passwordInput.value;


if(!email){

showMessage(
"⚠️ أدخلي البريد الإلكتروني",
"message-error"
);

return;

}


if(!password){

showMessage(
"⚠️ أدخلي كلمة المرور",
"message-error"
);

return;

}


/* تعطيل الزر */

loginBtn.disabled =
true;

loginBtn.textContent =
"جاري الدخول...";


try{


/* =====================================
   تسجيل الدخول في Firebase Auth
===================================== */

const result =

await signInWithEmailAndPassword(

auth,

email,

password

);


const user =
result.user;


/* =====================================
   البحث عن متجر صاحب الحساب
===================================== */

showMessage(

"⏳ جاري التحقق من حالة المتجر...",

"message-info"

);


const store =
await findStore(
email
);


/* =====================================
   لا يوجد متجر
===================================== */

if(!store){

showMessage(

"⚠️ تم تسجيل الدخول بنجاح، ولكن لم يتم العثور على بيانات متجرك.<br><br>" +

"يرجى إكمال تسجيل المتجر والدفع قبل الدخول إلى لوحة التحكم.",

"message-warning"

);

loginBtn.disabled =
false;

loginBtn.textContent =
"تسجيل الدخول";

return;

}


/* =====================================
   بيانات المتجر
===================================== */

const storeData =
store.data;


/*

الحالة الموجودة في Firestore

*/

const status =
String(
storeData.status || "pending"
)
.toLowerCase();


/* =====================================
   حفظ بيانات المتجر محليًا
===================================== */

localStorage.setItem(
"storeId",
store.id
);

localStorage.setItem(
"storeOwnerEmail",
user.email
);

localStorage.setItem(
"ownerEmail",
user.email
);

localStorage.setItem(
"storeName",

storeData.storeName ||
"G-Glam"

);


/* =====================================
   الحالة: قيد المراجعة
===================================== */

if(

status === "pending" ||

status === "waiting" ||

status === "review"

){

showMessage(

"🟡 تم تسجيل الدخول بنجاح.<br><br>" +

"وصل الدفع الخاص بك قيد المراجعة من طرف الإدارة.<br><br>" +

"<strong>3500 DA</strong><br><br>" +

"سيتم فتح لوحة التحكم بعد قبول طلبك.",

"message-info"

);


loginBtn.disabled =
false;

loginBtn.textContent =
"تسجيل الدخول";

return;

}


/* =====================================
   الحالة: مرفوض
===================================== */

if(

status === "rejected" ||

status === "refused"

){

const reason =
storeData.rejectionReason ||
"لم يتم ذكر سبب الرفض.";


showMessage(

"🔴 تم رفض طلب إنشاء المتجر.<br><br>" +

"<strong>السبب:</strong><br>" +

reason +

"<br><br>" +

"يمكنك التواصل مع الإدارة.",

"message-error"

);


loginBtn.disabled =
false;

loginBtn.textContent =
"تسجيل الدخول";

return;

}


/* =====================================
   الحالة: مقبول
===================================== */

if(

status === "approved" ||

status === "accepted" ||

status === "active"

){

showMessage(

"✅ تم قبول متجرك بنجاح!<br><br>" +

"جاري الدخول إلى لوحة التحكم...",

"message-success"

);


/*

انتظار بسيط ثم الدخول

*/

setTimeout(

function(){

window.location.href =
"dashboard.html";

},

1000

);

return;

}


/* =====================================
   حالة غير معروفة
===================================== */

showMessage(

"⚠️ حالة المتجر غير معروفة.<br><br>" +

"يرجى التواصل مع الإدارة.",

"message-warning"

);


loginBtn.disabled =
false;

loginBtn.textContent =
"تسجيل الدخول";


}

catch(error){

console.error(
"Login error:",
error
);


/* =====================================
   أخطاء Firebase
===================================== */

let errorMessage =
"حدث خطأ أثناء تسجيل الدخول.";


if(

error.code ===
"auth/invalid-credential"

){

errorMessage =
"❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.";

}


else if(

error.code ===
"auth/user-not-found"

){

errorMessage =
"❌ لا يوجد حساب بهذا البريد الإلكتروني.";

}


else if(

error.code ===
"auth/wrong-password"

){

errorMessage =
"❌ كلمة المرور غير صحيحة.";

}


else if(

error.code ===
"auth/invalid-email"

){

errorMessage =
"❌ البريد الإلكتروني غير صحيح.";

}


else if(

error.code ===
"auth/too-many-requests"

){

errorMessage =
"⚠️ محاولات كثيرة. حاولي مرة أخرى لاحقًا.";

}


else if(

error.code ===
"auth/network-request-failed"

){

errorMessage =
"⚠️ تأكدي من اتصال الإنترنت.";

}


showMessage(

errorMessage,

"message-error"

);


loginBtn.disabled =
false;

loginBtn.textContent =
"تسجيل الدخول";

}

}

);


/* =========================================
   السماح بالضغط Enter
========================================= */

passwordInput.addEventListener(

"keydown",

function(event){

if(
event.key ===
"Enter"
){

loginBtn.click();

}

}

);

</script>


</body>

</html>
