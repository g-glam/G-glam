<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | تسجيل الدخول</title>

<style>

:root{

--bg:#F5F0E8;
--card:#FFFFFF;
--text:#222;
--accent:#B89B7A;
--shadow:0 5px 20px rgba(0,0,0,.07);

}

*{

box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;

}

body{

background:var(--bg);
color:var(--text);
min-height:100vh;

display:flex;
align-items:center;
justify-content:center;

padding:20px;

}

.container{

width:100%;
max-width:500px;

}

.logo{

text-align:center;
font-size:38px;
font-weight:800;
margin-bottom:8px;

}

.subtitle{

text-align:center;
color:#666;
margin-bottom:25px;

}

.card{

background:var(--card);
border-radius:20px;
padding:25px;
box-shadow:var(--shadow);

}

h1{

font-size:24px;
margin-bottom:20px;

}

label{

display:block;
font-weight:bold;
margin-bottom:7px;

}

input{

width:100%;
padding:14px;
border:none;
background:#f7f7f7;
border-radius:14px;
font-size:16px;
margin-bottom:15px;
outline:none;

}

input:focus{

box-shadow:0 0 0 2px var(--accent);

}

button{

width:100%;
padding:15px;
border:none;
border-radius:14px;
background:#222;
color:white;
font-size:17px;
cursor:pointer;
margin-top:5px;

}

button:hover{

opacity:.9;

}

button:disabled{

opacity:.6;
cursor:not-allowed;

}

.register{

text-align:center;
margin-top:18px;

}

.register a{

color:#8d7358;
font-weight:bold;
text-decoration:none;

}

.message{

margin-top:15px;
padding:12px;
border-radius:12px;
display:none;
text-align:center;
line-height:1.6;

}

</style>

</head>

<body>


<div class="container">


<div class="logo">

G-Glam

</div>


<div class="subtitle">

الدخول إلى متجرك

</div>


<div class="card">


<h1>

تسجيل الدخول

</h1>


<label>

البريد الإلكتروني

</label>


<input
type="email"
id="email"
placeholder="example@gmail.com"
autocomplete="email">


<label>

كلمة المرور

</label>


<input
type="password"
id="password"
placeholder="كلمة المرور"
autocomplete="current-password">


<button
id="loginBtn">

تسجيل الدخول

</button>


<div
class="message"
id="message">
</div>


<div class="register">

ليس لديك حساب؟

<a href="register.html">

إنشاء متجر

</a>

</div>


</div>

</div>


<script type="module">


/* =================================
   Firebase
================================= */

import { initializeApp }

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getAuth,
signInWithEmailAndPassword,
signOut

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


import {

getFirestore,
doc,
getDoc

}

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =================================
   Firebase Config
================================= */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =================================
   تشغيل Firebase
================================= */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =================================
   العناصر
================================= */

const loginBtn =
document.getElementById(
"loginBtn"
);

const message =
document.getElementById(
"message"
);

const emailInput =
document.getElementById(
"email"
);

const passwordInput =
document.getElementById(
"password"
);


/* =================================
   رسالة
================================= */

function showMessage(
text,
error = true
){

message.innerHTML =
text;

message.style.display =
"block";


if(error){

message.style.background =
"#f8d7da";

message.style.color =
"#842029";

}
else{

message.style.background =
"#d1e7dd";

message.style.color =
"#0f5132";

}

}


/* =================================
   تسجيل الدخول
================================= */

loginBtn.addEventListener(
"click",
async function(){

const email =
emailInput.value.trim();

const password =
passwordInput.value;


if(!email || !password){

showMessage(
"⚠️ يرجى إدخال البريد الإلكتروني وكلمة المرور",
true
);

return;

}


loginBtn.disabled =
true;

loginBtn.textContent =
"جاري تسجيل الدخول...";


try{


/* ===============================
   Firebase Authentication
=============================== */

const userCredential =

await signInWithEmailAndPassword(

auth,
email,
password

);


const user =
userCredential.user;


/* ===============================
   الحصول على بيانات المستخدم
=============================== */

const userRef =

doc(
db,
"users",
user.uid
);


const userSnap =

await getDoc(
userRef
);


/* ===============================
   لا توجد بيانات المستخدم
=============================== */

if(!userSnap.exists()){

await signOut(auth);


showMessage(

"⚠️ تم تسجيل الدخول في Firebase، " +
"لكن لم يتم العثور على بيانات المتجر في Firestore.<br><br>" +

"UID:<br>" +
user.uid,

true

);


loginBtn.disabled =
false;

loginBtn.textContent =
"تسجيل الدخول";

return;

}


/* ===============================
   بيانات المتجر
=============================== */

const userData =
userSnap.data();


/* ===============================
   حفظ البيانات
=============================== */

localStorage.setItem(

"storeId",

userData.storeId || ""

);


localStorage.setItem(

"storeName",

userData.storeName || "G-Glam"

);


localStorage.setItem(

"ownerEmail",

userData.email || user.email

);


/* ===============================
   نجاح
=============================== */

showMessage(

"✅ تم تسجيل الدخول بنجاح<br>" +
"جاري فتح لوحة التحكم...",

false

);


/* ===============================
   Dashboard
=============================== */

setTimeout(

function(){

window.location.href =
"dashboard.html";

},

700

);


}


/* =================================
   خطأ
================================= */

catch(error){

console.error(
"Firebase Error:",
error
);


let errorText =
"❌ حدث خطأ أثناء تسجيل الدخول";


if(
error.code ===
"auth/invalid-credential"
){

errorText =
"❌ البريد الإلكتروني أو كلمة المرور غير صحيحة";

}


else if(
error.code ===
"auth/user-not-found"
){

errorText =
"❌ هذا الحساب غير موجود في Firebase Authentication";

}


else if(
error.code ===
"auth/wrong-password"
){

errorText =
"❌ كلمة المرور غير صحيحة";

}


else if(
error.code ===
"auth/invalid-email"
){

errorText =
"❌ البريد الإلكتروني غير صحيح";

}


else if(
error.code ===
"auth/too-many-requests"
){

errorText =
"⚠️ تم إجراء محاولات كثيرة. حاولي مرة أخرى لاحقًا";

}


else if(
error.code ===
"auth/network-request-failed"
){

errorText =
"❌ مشكلة في الاتصال بالإنترنت";

}


showMessage(

errorText +

"<br><br>" +

"<small>" +
"رمز Firebase: " +
(error.code || "غير معروف") +
"</small>",

true

);


loginBtn.disabled =
false;

loginBtn.textContent =
"تسجيل الدخول";

}

});


/* =================================
   الضغط على Enter
================================= */

passwordInput.addEventListener(
"keydown",
function(event){

if(
event.key ===
"Enter"
){

loginBtn.click();

}

});


</script>


</body>

</html>
