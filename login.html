<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#F47B20">

<title>G-Glam | تسجيل الدخول</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">


<style>

/* =====================================================
   COLORS
===================================================== */

:root{

--orange:#F47B20;
--orange-dark:#DF6810;
--orange-light:#FFF1E6;

--bg:#F7F7F7;
--card:#FFFFFF;

--text:#555;
--text-dark:#333;
--muted:#999;

--border:#E7E7E7;
--input-bg:#FAFAFA;

--success:#198754;
--success-bg:#DFF3E7;

--danger:#DC3545;
--danger-bg:#FBE1E4;

--warning:#B77900;
--warning-bg:#FFF2CC;

--shadow:
0 15px 45px rgba(0,0,0,.08);

}


/* =====================================================
   RESET
===================================================== */

*{

box-sizing:border-box;

margin:0;
padding:0;

font-family:
"Tajawal",
Arial,
sans-serif;

}


/* =====================================================
   BODY
===================================================== */

body{

min-height:100vh;

background:

linear-gradient(
135deg,
#FFFFFF 0%,
#FFFFFF 55%,
#FFF6EF 100%
);

color:var(--text);

display:flex;

align-items:center;

justify-content:center;

padding:30px;

overflow-x:hidden;

}


/* =====================================================
   BACKGROUND DECORATION
===================================================== */

.background-decoration{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:0;

}


.circle-one{

position:absolute;

width:360px;

height:360px;

border-radius:50%;

background:
rgba(244,123,32,.07);

top:-150px;

right:-120px;

}


.circle-two{

position:absolute;

width:300px;

height:300px;

border-radius:50%;

background:
rgba(244,123,32,.05);

bottom:-130px;

left:-100px;

}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.login-container{

position:relative;

z-index:1;

width:100%;

max-width:1050px;

display:grid;

grid-template-columns:
1fr
440px;

direction:ltr;

align-items:center;

gap:70px;

}


/* =====================================================
   LEFT IMAGE
===================================================== */

.login-image{

direction:rtl;

display:flex;

align-items:center;

justify-content:center;

position:relative;

min-height:520px;

}


.login-image img{

display:block;

width:100%;

max-width:500px;

height:auto;

object-fit:contain;

filter:
drop-shadow(
0 25px 35px
rgba(244,123,32,.12)
);

}


/* =====================================================
   IMAGE DECORATION
===================================================== */

.image-decoration{

position:absolute;

width:120px;

height:120px;

border-radius:50%;

border:3px solid
rgba(244,123,32,.16);

top:35px;

left:25px;

}


.image-decoration::after{

content:"";

position:absolute;

width:15px;

height:15px;

background:var(--orange);

border-radius:50%;

right:-7px;

bottom:20px;

}


/* =====================================================
   LOGIN CARD
===================================================== */

.card{

direction:rtl;

position:relative;

width:100%;

background:var(--card);

border-radius:24px;

box-shadow:var(--shadow);

border:1px solid
rgba(0,0,0,.04);

padding:38px;

}


/* =====================================================
   CARD TOP
===================================================== */

.card-top{

text-align:center;

margin-bottom:28px;

}


/* =====================================================
   PLATFORM TITLE
===================================================== */

.platform-title{

font-size:18px;

font-weight:800;

color:#333;

margin-bottom:9px;

}


.platform-title span{

color:var(--orange);

}


/* =====================================================
   LOGIN TITLE
===================================================== */

.title{

font-size:25px;

font-weight:900;

color:var(--text-dark);

margin-bottom:8px;

}


.title-description{

font-size:13px;

color:var(--muted);

line-height:1.8;

}


/* =====================================================
   FORM GROUP
===================================================== */

.form-group{

margin-bottom:18px;

}


label{

display:block;

font-size:14px;

font-weight:800;

color:var(--text-dark);

margin-bottom:8px;

}


/* =====================================================
   INPUT WRAPPER
===================================================== */

.input-wrapper{

position:relative;

}


/* =====================================================
   INPUT ICON
===================================================== */

.input-icon{

position:absolute;

right:14px;

top:50%;

transform:
translateY(-50%);

font-size:17px;

color:#aaa;

pointer-events:none;

z-index:2;

}


/* =====================================================
   INPUT
===================================================== */

input{

width:100%;

height:52px;

padding:
0 45px
0 48px;

border:1px solid
var(--border);

border-radius:11px;

background:var(--input-bg);

font-size:15px;

color:var(--text-dark);

outline:none;

transition:.2s;

}


input::placeholder{

color:#aaa;

}


input:focus{

border-color:
var(--orange);

background:#fff;

box-shadow:
0 0 0 3px
rgba(244,123,32,.09);

}


/* =====================================================
   PASSWORD EYE BUTTON
===================================================== */

.password-toggle{

position:absolute;

left:13px;

top:50%;

transform:
translateY(-50%);

width:32px;

height:32px;

border:none;

background:transparent;

display:flex;

align-items:center;

justify-content:center;

font-size:18px;

cursor:pointer;

color:#999;

border-radius:8px;

transition:.2s;

z-index:3;

}


.password-toggle:hover{

background:var(--orange-light);

color:var(--orange);

}


/* =====================================================
   LOGIN BUTTON
===================================================== */

#loginBtn{

width:100%;

height:53px;

border:none;

border-radius:11px;

background:var(--orange);

color:#fff;

font-size:16px;

font-weight:800;

cursor:pointer;

transition:.2s;

margin-top:6px;

box-shadow:
0 6px 16px
rgba(244,123,32,.22);

}


#loginBtn:hover{

background:
var(--orange-dark);

transform:
translateY(-1px);

}


#loginBtn:active{

transform:
translateY(0);

}


#loginBtn:disabled{

opacity:.6;

cursor:not-allowed;

transform:none;

}


/* =====================================================
   MESSAGE
===================================================== */

#message{

display:none;

margin-top:18px;

padding:14px 15px;

border-radius:11px;

font-size:13px;

line-height:1.8;

text-align:center;

}


.message-info{

background:
var(--warning-bg);

color:#856404;

border:1px solid #F0DF9D;

}


.message-success{

background:
var(--success-bg);

color:#155724;

border:1px solid #C4E5D0;

}


.message-error{

background:
var(--danger-bg);

color:#721C24;

border:1px solid #EFC5CA;

}


.message-warning{

background:#EEEEEE;

color:#555;

border:1px solid #DDD;

}


/* =====================================================
   REGISTER
===================================================== */

.register{

text-align:center;

margin-top:25px;

padding-top:20px;

border-top:1px solid #eee;

font-size:14px;

color:#999;

}


.register a{

color:var(--orange);

font-weight:bold;

text-decoration:none;

margin-right:4px;

}


.register a:hover{

text-decoration:underline;

}


/* =====================================================
   SECURITY NOTE
===================================================== */

.security-note{

display:flex;

align-items:center;

justify-content:center;

gap:6px;

margin-top:18px;

font-size:11px;

color:#aaa;

}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:900px){

body{

padding:25px;

}


.login-container{

grid-template-columns:
1fr
400px;

gap:35px;

}


.login-image{

min-height:420px;

}


.login-image img{

max-width:390px;

}

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

body{

padding:18px;

}


.login-container{

display:flex;

flex-direction:column;

gap:10px;

width:100%;

max-width:440px;

}


.login-image{

order:1;

width:100%;

min-height:auto;

height:auto;

padding:0 10px 5px;

}


.login-image img{

width:100%;

max-width:330px;

}


.image-decoration{

width:80px;

height:80px;

top:5px;

left:5px;

}


.card{

order:2;

padding:30px 22px;

border-radius:20px;

}


.platform-title{

font-size:17px;

}


.title{

font-size:22px;

}


.title-description{

font-size:12px;

}

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:400px){

body{

padding:12px;

}


.login-container{

gap:5px;

}


.login-image{

padding:0;

}


.login-image img{

max-width:270px;

}


.card{

padding:25px 17px;

border-radius:18px;

}


.platform-title{

font-size:16px;

}


.title{

font-size:20px;

}


.title-description{

font-size:12px;

}


input{

height:49px;

}


#loginBtn{

height:50px;

}

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media(max-width:340px){

.login-image img{

max-width:230px;

}


.card{

padding:
22px 14px;

}

}

</style>

</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background-decoration">

<div class="circle-one"></div>

<div class="circle-two"></div>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="login-container">


<!-- ===================================================
     LEFT IMAGE
=================================================== -->

<div class="login-image">


<div class="image-decoration"></div>


<img

src="logobig.png"

alt="G-Glam">

</div>


<!-- ===================================================
     LOGIN CARD
=================================================== -->

<div class="card">


<!-- =================================================
     CARD HEADER
================================================= -->

<div class="card-top">


<div class="platform-title">

منصة <span>G-Glam</span>

</div>


<h2 class="title">

تسجيل الدخول

</h2>


<div class="title-description">

أدخل بيانات حسابك للوصول إلى لوحة التحكم الخاصة بمتجرك.

</div>


</div>


<!-- =================================================
     EMAIL
================================================= -->

<div class="form-group">


<label for="email">

البريد الإلكتروني

</label>


<div class="input-wrapper">


<span class="input-icon">

✉️

</span>


<input

id="email"

type="email"

placeholder="example@gmail.com"

autocomplete="email">


</div>

</div>


<!-- =================================================
     PASSWORD
================================================= -->

<div class="form-group">


<label for="password">

كلمة المرور

</label>


<div class="input-wrapper">


<span class="input-icon">

🔒

</span>


<input

id="password"

type="password"

placeholder="أدخل كلمة المرور"

autocomplete="current-password">


<button

type="button"

class="password-toggle"

id="passwordToggle"

aria-label="إظهار كلمة المرور">

👁️

</button>


</div>

</div>


<!-- =================================================
     LOGIN BUTTON
================================================= -->

<button

id="loginBtn">

تسجيل الدخول

</button>


<!-- =================================================
     MESSAGE
================================================= -->

<div id="message"></div>


<!-- =================================================
     REGISTER
================================================= -->

<div class="register">

ليس لديك متجر؟

<a href="register.html">

إنشاء متجر جديد

</a>

</div>


<!-- =================================================
     SECURITY
================================================= -->

<div class="security-note">

🔐 بيانات الدخول محمية بواسطة Firebase

</div>


</div>


</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getAuth,
signInWithEmailAndPassword

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


import {

getFirestore,
doc,
getDoc,
onSnapshot

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const passwordToggle =
document.getElementById("passwordToggle");

const loginBtn =
document.getElementById("loginBtn");

const message =
document.getElementById("message");


/* =====================================================
   PASSWORD SHOW / HIDE
===================================================== */

passwordToggle.addEventListener(

"click",

function(){

if(
passwordInput.type === "password"
){

passwordInput.type =
"text";

passwordToggle.textContent =
"🙈";

passwordToggle.setAttribute(
"aria-label",
"إخفاء كلمة المرور"
);

}

else{

passwordInput.type =
"password";

passwordToggle.textContent =
"👁️";

passwordToggle.setAttribute(
"aria-label",
"إظهار كلمة المرور"
);

}

}

);


/* =====================================================
   STORE LISTENER
===================================================== */

let storeUnsubscribe = null;


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(text,type){

message.innerHTML =
text;

message.className = "";

message.classList.add(type);

message.style.display =
"block";

}


/* =====================================================
   RESET BUTTON
===================================================== */

function resetButton(){

loginBtn.disabled =
false;

loginBtn.textContent =
"تسجيل الدخول";

}


/* =====================================================
   FIND STORE BY UID
===================================================== */

async function findStore(uid){

try{

const storeRef =
doc(
db,
"stores",
uid
);

const snapshot =
await getDoc(storeRef);

if(!snapshot.exists()){

return null;

}

return {

id:
snapshot.id,

data:
snapshot.data()

};

}

catch(error){

console.error(
"FIND STORE ERROR:",
error
);

throw error;

}

}


/* =====================================================
   SAVE STORE DATA
===================================================== */

function saveStoreData(
user,
storeId,
storeData
){

const storeName =

storeData.storeName ||

storeData.name ||

"G-Glam";


localStorage.setItem(
"storeId",
storeId
);


localStorage.setItem(
"storeOwnerEmail",
user.email || ""
);


localStorage.setItem(
"ownerEmail",
user.email || ""
);


localStorage.setItem(
"ownerUid",
user.uid
);


localStorage.setItem(
"storeName",
storeName
);

}


/* =====================================================
   WATCH STORE STATUS
===================================================== */

function watchStoreStatus(
user
){

if(storeUnsubscribe){

storeUnsubscribe();

storeUnsubscribe =
null;

}


const storeRef =
doc(
db,
"stores",
user.uid
);


storeUnsubscribe =

onSnapshot(

storeRef,

function(snapshot){

if(!snapshot.exists()){

return;

}


const storeData =
snapshot.data();


const status =

String(

storeData.status ||

"pending"

)

.toLowerCase()
.trim();


/* =====================================================
   APPROVED
===================================================== */

if(

status === "approved" ||

status === "active" ||

status === "accepted"

){

saveStoreData(
user,
user.uid,
storeData
);


localStorage.setItem(
"paymentStatus",
"approved"
);


showMessage(

"✅ <strong>تم قبول متجرك!</strong><br><br>" +

"تمت الموافقة من طرف الإدارة.<br>" +

"جاري فتح لوحة التحكم...",

"message-success"

);


if(storeUnsubscribe){

storeUnsubscribe();

storeUnsubscribe =
null;

}


setTimeout(

function(){

window.location.href =
"dashboard.html";

},

700

);


return;

}


/* =====================================================
   REJECTED
===================================================== */

if(

status === "rejected" ||

status === "refused"

){

localStorage.setItem(
"paymentStatus",
"rejected"
);


const reason =

storeData.rejectionReason ||

"لم يتم ذكر سبب الرفض.";


showMessage(

"❌ <strong>تم رفض طلب إنشاء المتجر.</strong><br><br>" +

"<strong>سبب الرفض:</strong><br>" +

escapeHtml(reason) +

"<br><br>" +

"يرجى التواصل مع الإدارة.",

"message-error"

);


return;

}


/* =====================================================
   PENDING
===================================================== */

showMessage(

"⏳ <strong>تم تسجيل الدخول بنجاح.</strong><br><br>" +

"طلب متجرك قيد المراجعة.<br>" +

"عند موافقة الإدارة سيتم إدخالك إلى لوحة التحكم تلقائيًا.",

"message-info"

);

},

function(error){

console.error(
"STORE LISTENER ERROR:",
error
);


if(
error.code ===
"permission-denied"
){

showMessage(

"❌ لا توجد صلاحية للوصول إلى بيانات المتجر.<br><br>" +

"تأكدي من أن UID الخاص بحسابك هو نفسه معرف المتجر في Firestore.",

"message-error"

);

}

else{

showMessage(

"❌ حدث خطأ أثناء مراقبة حالة المتجر.<br><br>" +

escapeHtml(
error.message || ""
),

"message-error"

);

}

}

);

}


/* =====================================================
   LOGIN
===================================================== */

loginBtn.addEventListener(

"click",

async function(){

const email =

emailInput.value
.trim()
.toLowerCase();


const password =
passwordInput.value;


if(!email){

showMessage(

"⚠️ يرجى إدخال البريد الإلكتروني.",

"message-error"

);

return;

}


if(!password){

showMessage(

"⚠️ يرجى إدخال كلمة المرور.",

"message-error"

);

return;

}


/* =====================================================
   DISABLE BUTTON
===================================================== */

loginBtn.disabled =
true;

loginBtn.textContent =
"⏳ جاري تسجيل الدخول...";


try{


/* =====================================================
   FIREBASE AUTHENTICATION
===================================================== */

const result =

await signInWithEmailAndPassword(

auth,

email,

password

);


const user =
result.user;


if(!user){

throw new Error(
"لم يتم العثور على المستخدم."
);

}


/* =====================================================
   GET STORE
===================================================== */

showMessage(

"⏳ جاري التحقق من بيانات متجرك...",

"message-info"

);


const store =
await findStore(
user.uid
);


/* =====================================================
   NO STORE
===================================================== */

if(!store){

showMessage(

"⚠️ تم تسجيل الدخول بنجاح، ولكن لم يتم العثور على بيانات متجرك.<br><br>" +

"تأكدي من استخدام نفس الحساب الذي تم إنشاء المتجر به.",

"message-warning"

);


resetButton();

return;

}


/* =====================================================
   STORE DATA
===================================================== */

const storeId =
store.id;

const storeData =
store.data;


const status =

String(

storeData.status ||

"pending"

)

.toLowerCase()
.trim();


/* =====================================================
   SAVE DATA
===================================================== */

saveStoreData(
user,
storeId,
storeData
);


/* =====================================================
   APPROVED / ACTIVE
===================================================== */

if(

status === "approved" ||

status === "active" ||

status === "accepted"

){

localStorage.setItem(
"paymentStatus",
"approved"
);


showMessage(

"✅ <strong>تم قبول متجرك!</strong><br><br>" +

"جاري فتح لوحة التحكم...",

"message-success"

);


setTimeout(

function(){

window.location.href =
"dashboard.html";

},

500

);

return;

}


/* =====================================================
   REJECTED
===================================================== */

if(

status === "rejected" ||

status === "refused"

){

localStorage.setItem(
"paymentStatus",
"rejected"
);


const reason =

storeData.rejectionReason ||

"لم يتم ذكر سبب الرفض.";


showMessage(

"❌ <strong>تم رفض طلب إنشاء المتجر.</strong><br><br>" +

"<strong>سبب الرفض:</strong><br>" +

escapeHtml(reason) +

"<br><br>" +

"يرجى التواصل مع الإدارة.",

"message-error"

);


resetButton();

return;

}


/* =====================================================
   PENDING
===================================================== */

localStorage.setItem(
"paymentStatus",
"pending"
);


showMessage(

"⏳ <strong>تم تسجيل الدخول بنجاح.</strong><br><br>" +

"طلب متجرك قيد المراجعة.<br>" +

"عند موافقة الإدارة سيتم إدخالك إلى لوحة التحكم تلقائيًا.",

"message-info"

);


/* =====================================================
   START REAL-TIME LISTENER
===================================================== */

watchStoreStatus(
user
);


resetButton();

}

catch(error){

console.error(
"LOGIN ERROR:",
error
);


let errorMessage =
"حدث خطأ أثناء تسجيل الدخول.";


/* =====================================================
   AUTH ERRORS
===================================================== */

if(

error.code ===
"auth/invalid-credential"

){

errorMessage =
"❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.";

}

else if(

error.code ===
"auth/user-not-found"

){

errorMessage =
"❌ لا يوجد حساب بهذا البريد الإلكتروني.";

}

else if(

error.code ===
"auth/wrong-password"

){

errorMessage =
"❌ كلمة المرور غير صحيحة.";

}

else if(

error.code ===
"auth/invalid-email"

){

errorMessage =
"❌ البريد الإلكتروني غير صحيح.";

}

else if(

error.code ===
"auth/too-many-requests"

){

errorMessage =
"⚠️ تم إجراء محاولات كثيرة. حاولي مرة أخرى لاحقًا.";

}

else if(

"auth/network-request-failed"

){

errorMessage =

}

else{

);

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}
