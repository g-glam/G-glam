storeId,

){

const storeName =

storeData.storeName ||

storeData.name ||

"G-Glam";


localStorage.setItem(
"storeId",
storeId
);


localStorage.setItem(
"storeOwnerEmail",
user.email || ""
);


localStorage.setItem(
"ownerEmail",
user.email || ""
);


localStorage.setItem(
"ownerUid",
user.uid
);


localStorage.setItem(
"storeName",
storeName
);

}


/* =====================================================
   WATCH STORE STATUS
===================================================== */

function watchStoreStatus(user){

if(storeUnsubscribe){

storeUnsubscribe();

storeUnsubscribe =
null;

}


const storeRef =
doc(
db,
"stores",
user.uid
);


storeUnsubscribe =

onSnapshot(

storeRef,

function(snapshot){

if(!snapshot.exists()){

return;

}


const storeData =
snapshot.data();


const status =

String(

storeData.status ||
"pending"

)

.toLowerCase()
.trim();


/* =================================================
   APPROVED
================================================= */

if(

status === "approved" ||

status === "active" ||

status === "accepted"

){

saveStoreData(
user,
user.uid,
storeData
);


localStorage.setItem(
"paymentStatus",
"approved"
);


showMessage(

"✅ <strong>تم قبول متجرك!</strong><br><br>" +

"تمت الموافقة من طرف الإدارة.<br>" +

"جاري فتح لوحة التحكم...",

"message-success"

);


if(storeUnsubscribe){

storeUnsubscribe();

storeUnsubscribe =
null;

}


setTimeout(

function(){

window.location.href =
"dashboard.html";

},

700

);


return;

}


/* =================================================
   REJECTED
================================================= */

if(

status === "rejected" ||

status === "refused"

){

localStorage.setItem(
"paymentStatus",
"rejected"
);


const reason =

storeData.rejectionReason ||

"لم يتم ذكر سبب الرفض.";


showMessage(

"❌ <strong>تم رفض طلب إنشاء المتجر.</strong><br><br>" +

"<strong>سبب الرفض:</strong><br>" +

escapeHtml(reason) +

"<br><br>" +

"يرجى التواصل مع الإدارة.",

"message-error"

);


return;

}


/* =================================================
   PENDING
================================================= */

showMessage(

"⏳ <strong>تم تسجيل الدخول بنجاح.</strong><br><br>" +

"طلب متجرك قيد المراجعة.<br>" +

"عند موافقة الإدارة سيتم إدخالك إلى لوحة التحكم تلقائيًا.",

"message-info"

);

},

function(error){

console.error(
"STORE LISTENER ERROR:",
error
);


if(
error.code ===
"permission-denied"
){

showMessage(

"❌ لا توجد صلاحية للوصول إلى بيانات المتجر.<br><br>" +

"تأكدي من أن UID الخاص بحسابك هو نفسه معرف المتجر في Firestore.",

"message-error"

);

}

else{

showMessage(

"❌ حدث خطأ أثناء مراقبة حالة المتجر.<br><br>" +

escapeHtml(
error.message || ""
),

"message-error"

);

}

});

}


/* =====================================================
   LOGIN
===================================================== */

loginBtn.addEventListener(

"click",

async function(){

const email =

emailInput.value
.trim()
.toLowerCase();


const password =
passwordInput.value;


if(!email){

showMessage(

"⚠️ يرجى إدخال البريد الإلكتروني.",

"message-error"

);

return;

}


if(!password){

showMessage(

"⚠️ يرجى إدخال كلمة المرور.",

"message-error"

);

return;

}


/* =================================================
   DISABLE BUTTON
================================================= */

loginBtn.disabled =
true;

loginBtn.textContent =
"⏳ جاري تسجيل الدخول...";


try{


/* =================================================
   AUTHENTICATION
================================================= */

const result =

await signInWithEmailAndPassword(

auth,

email,

password

);


const user =
result.user;


if(!user){

throw new Error(
"لم يتم العثور على المستخدم."
);

}


/* =================================================
   FIND STORE
================================================= */

showMessage(

"⏳ جاري التحقق من بيانات متجرك...",

"message-info"

);


const store =
await findStore(
user.uid
);


/* =================================================
   NO STORE
================================================= */

if(!store){

showMessage(

"⚠️ تم تسجيل الدخول بنجاح، ولكن لم يتم العثور على بيانات متجرك.<br><br>" +

"تأكدي من استخدام نفس الحساب الذي تم إنشاء المتجر به.",

"message-warning"

);


resetButton();

return;

}


/* =================================================
   STORE DATA
================================================= */

const storeId =
store.id;

const storeData =
store.data;


const status =

String(

storeData.status ||
"pending"

)

.toLowerCase()
.trim();


/* =================================================
   SAVE
================================================= */

saveStoreData(
user,
storeId,
storeData
);


/* =================================================
   APPROVED
================================================= */

if(

status === "approved" ||

status === "active" ||

status === "accepted"

){

localStorage.setItem(
"paymentStatus",
"approved"
);


showMessage(

"✅ <strong>تم قبول متجرك!</strong><br><br>" +

"جاري فتح لوحة التحكم...",

"message-success"

);


setTimeout(

function(){

window.location.href =
"dashboard.html";

},

500

);

return;

}


/* =================================================
   REJECTED
================================================= */

if(

status === "rejected" ||

status === "refused"

){

localStorage.setItem(
"paymentStatus",
"rejected"
);


const reason =

storeData.rejectionReason ||

"لم يتم ذكر سبب الرفض.";


showMessage(

"❌ <strong>تم رفض طلب إنشاء المتجر.</strong><br><br>" +

"<strong>سبب الرفض:</strong><br>" +

escapeHtml(reason) +

"<br><br>" +

"يرجى التواصل مع الإدارة.",

"message-error"

);


resetButton();

return;

}


/* =================================================
   PENDING
================================================= */

localStorage.setItem(
"paymentStatus",
"pending"
);


showMessage(

"⏳ <strong>تم تسجيل الدخول بنجاح.</strong><br><br>" +

"طلب متجرك قيد المراجعة.<br>" +

"عند موافقة الإدارة سيتم إدخالك إلى لوحة التحكم تلقائيًا.",

"message-info"

);


/* =================================================
   REAL TIME
================================================= */

watchStoreStatus(
user
);


resetButton();

}

catch(error){

console.error(
"LOGIN ERROR:",
error
);


let errorMessage =
"حدث خطأ أثناء تسجيل الدخول.";


if(

error.code ===
"auth/invalid-credential"

){

errorMessage =
"❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.";

}

else if(

error.code ===
"auth/user-not-found"

){

errorMessage =
"❌ لا يوجد حساب بهذا البريد الإلكتروني.";

}

else if(

error.code ===
"auth/wrong-password"

){

errorMessage =
"❌ كلمة المرور غير صحيحة.";

}

else if(

error.code ===
"auth/invalid-email"

){

errorMessage =
"❌ البريد الإلكتروني غير صحيح.";

}

else if(

error.code ===
"auth/too-many-requests"

){

errorMessage =
"⚠️ تم إجراء محاولات كثيرة. حاولي مرة أخرى لاحقًا.";

}

else if(

error.code ===
"auth/network-request-failed"

){

errorMessage =
"⚠️ تأكدي من اتصال الإنترنت.";

}

else if(

error.code ===
"permission-denied"

){

errorMessage =

"❌ لا توجد صلاحية للوصول إلى بيانات المتجر.<br><br>" +

"تأكدي من أن UID الخاص بالحساب هو نفسه معرف المتجر في Firestore.";

}

else{

errorMessage =

"❌ حدث خطأ أثناء تسجيل الدخول.<br><br>" +

escapeHtml(
error.message || ""
);

}


showMessage(

errorMessage,

"message-error"

);


resetButton();

}

});


/* =====================================================
   ENTER KEY - PASSWORD
===================================================== */

passwordInput.addEventListener(

"keydown",

function(event){

if(
event.key === "Enter"
){

loginBtn.click();

}

});


/* =====================================================
   ENTER KEY - EMAIL
===================================================== */

emailInput.addEventListener(

"keydown",

function(event){

if(
event.key === "Enter"
){

passwordInput.focus();

}

});


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}
