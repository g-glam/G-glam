<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#F47B20"
    id="themeColorMeta"
>

<link
    rel="manifest"
    href="manifest.json"
>

<link
    rel="apple-touch-icon"
    href="icons/icon-192.png"
>

<title>المنتج | G-Glam</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Tajawal",Arial,sans-serif;
}

:root{

    --bg:#F4F4F4;

    --header:#FFFFFF;

    --card:#FFFFFF;

    --card-light:#FCFCFC;

    --text:#222222;

    --muted:#777777;

    --border:#E8E8E8;

    --accent:#F47B20;

    --accent-dark:#DF6810;

    --input:#F8F8F8;

    --input-text:#333333;

    --sidebar:#FFFFFF;

    --sidebar-hover:#FFF1E6;

    --danger:#D9534F;

    --danger-bg:#FDECEC;

    --success:#198754;

    --success-bg:#EFFAF3;

    --shadow:0 6px 22px rgba(0,0,0,.07);

    --theme-gradient:linear-gradient(
        135deg,
        #F47B20,
        #DF6810
    );
}


/* =====================================================
   BODY
===================================================== */

body{

    background:var(--bg);

    color:var(--text);

    min-height:100vh;

    padding-bottom:40px;

}


/* =====================================================
   HEADER
===================================================== */

header{

    position:sticky;

    top:0;

    z-index:100;

    height:78px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:12px 24px;

    background:var(--header);

    border-bottom:1px solid var(--border);

    box-shadow:0 2px 12px rgba(0,0,0,.04);

}

.logo{

    position:absolute;

    left:50%;

    top:50%;

    transform:translate(-50%,-50%);

    display:flex;

    align-items:center;

    justify-content:center;

}

.logo img{

    width:120px;

    max-height:55px;

    object-fit:contain;

    display:block;

}

.menu-btn,
.cart-icon{

    width:45px;

    height:45px;

    border:none;

    background:transparent;

    color:var(--text);

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:12px;

    cursor:pointer;

    font-size:21px;

    transition:.2s;

    position:relative;

}

.menu-btn:hover,
.cart-icon:hover{

    background:var(--sidebar-hover);

    color:var(--accent);

}

.cart-count{

    position:absolute;

    top:-4px;

    left:-4px;

    width:20px;

    height:20px;

    border-radius:50%;

    background:var(--accent);

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:10px;

    font-weight:800;

}


/* =====================================================
   STORE BAR
===================================================== */

.store-info{

    width:calc(100% - 30px);

    max-width:1200px;

    margin:18px auto 0;

    padding:12px 18px;

    border:1px solid var(--border);

    border-radius:16px;

    background:var(--card);

    color:var(--muted);

    text-align:center;

    font-size:14px;

    box-shadow:var(--shadow);

}

.store-info strong{

    color:var(--text);

    font-weight:800;

}


/* =====================================================
   MAIN
===================================================== */

.product-container{

    width:calc(100% - 30px);

    max-width:1200px;

    margin:20px auto 50px;

}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-btn{

    display:inline-flex;

    align-items:center;

    gap:8px;

    text-decoration:none;

    color:var(--accent-dark);

    background:var(--sidebar-hover);

    padding:10px 15px;

    border-radius:12px;

    font-size:14px;

    font-weight:700;

    margin-bottom:18px;

    transition:.2s;

}

.back-btn:hover{

    background:var(--accent);

    color:#fff;

}


/* =====================================================
   PRODUCT LAYOUT
===================================================== */

.product-layout{

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        minmax(0,1fr);

    direction:ltr;

    gap:30px;

    align-items:start;

}


/* =====================================================
   COLUMNS
===================================================== */

.product-gallery,
.product-info{

    direction:rtl;

}


/* =====================================================
   CARD
===================================================== */

.product-card{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:24px;

    box-shadow:var(--shadow);

    overflow:hidden;

}


/* =====================================================
   GALLERY
===================================================== */

.gallery-card{

    padding:20px;

}

.main-image-wrapper{

    width:100%;

    aspect-ratio:1 / 1;

    max-height:650px;

    border-radius:20px;

    overflow:hidden;

    background:var(--card-light);

    border:1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

}

.main-image-wrapper img{

    width:100%;

    height:100%;

    object-fit:contain;

    display:block;

}

.image-placeholder{

    color:var(--muted);

    font-size:60px;

    opacity:.5;

}


/* =====================================================
   THUMBNAILS
===================================================== */

.thumbnails{

    display:flex;

    gap:10px;

    margin-top:14px;

    overflow-x:auto;

    padding:2px;

    scrollbar-width:thin;

}

.thumbnail{

    width:75px;

    height:75px;

    flex:0 0 75px;

    border-radius:13px;

    overflow:hidden;

    border:2px solid var(--border);

    background:var(--card-light);

    cursor:pointer;

    transition:.2s;

    padding:0;

}

.thumbnail:hover{

    border-color:var(--accent);

}

.thumbnail.active{

    border-color:var(--accent);

    box-shadow:
        0 0 0 2px
        color-mix(
            in srgb,
            var(--accent) 18%,
            transparent
        );

}

.thumbnail img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

}


/* =====================================================
   PRICE
===================================================== */

.price-box{

    padding:20px 4px 5px;

}

.current-price{

    font-size:32px;

    font-weight:800;

    color:var(--accent);

    line-height:1.3;

}

.old-price{

    margin-top:5px;

    color:var(--muted);

    font-size:16px;

    text-decoration:line-through;

}


/* =====================================================
   DESCRIPTION
===================================================== */

.full-description{

    margin-top:25px;

    padding-top:22px;

    border-top:1px solid var(--border);

}

.description-title{

    font-size:20px;

    font-weight:800;

    margin-bottom:12px;

    display:flex;

    align-items:center;

    gap:8px;

}

.description-title i{

    color:var(--accent);

}

.description-content{

    color:var(--text);

    font-size:15px;

    line-height:2;

    overflow-wrap:anywhere;

}

.description-content img{

    max-width:100%;

    height:auto;

    border-radius:14px;

    margin:10px 0;

}

.description-content table{

    max-width:100%;

    overflow:auto;

}


/* =====================================================
   DESCRIPTIVE IMAGES
===================================================== */

.descriptive-images{

    margin-top:25px;

    padding-top:22px;

    border-top:1px solid var(--border);

}

.descriptive-images-grid{

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:12px;

}

.descriptive-images-grid img{

    width:100%;

    height:auto;

    display:block;

    border-radius:15px;

    border:1px solid var(--border);

}


/* =====================================================
   INFO CARD
===================================================== */

.info-card{

    padding:25px;

    position:sticky;

    top:98px;

}

.product-title{

    font-size:30px;

    line-height:1.5;

    font-weight:800;

    color:var(--text);

    margin-bottom:10px;

}

.short-description{

    color:var(--muted);

    font-size:15px;

    line-height:1.9;

    margin-bottom:25px;

}


/* =====================================================
   OPTION SECTIONS
===================================================== */

.option-section{

    margin-top:20px;

}

.option-label{

    display:block;

    font-size:15px;

    font-weight:800;

    margin-bottom:10px;

}

.option-required{

    color:var(--accent);

}

.color-options{

    display:flex;

    flex-wrap:wrap;

    gap:9px;

}

.color-option{

    border:1px solid var(--border);

    background:var(--input);

    color:var(--text);

    border-radius:12px;

    padding:10px 15px;

    cursor:pointer;

    font-size:14px;

    font-weight:700;

    transition:.2s;

}

.color-option:hover{

    border-color:var(--accent);

}

.color-option.active{

    background:var(--accent);

    border-color:var(--accent);

    color:#fff;

}

.size-select{

    width:100%;

    padding:14px;

    border:1px solid var(--border);

    border-radius:13px;

    background:var(--input);

    color:var(--input-text);

    font-size:14px;

    outline:none;

}

.size-select:focus{

    border-color:var(--accent);

    box-shadow:
        0 0 0 3px
        rgba(244,123,32,.10);

}


/* =====================================================
   QUANTITY
===================================================== */

.quantity-section{

    margin-top:20px;

}

.quantity-box{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:18px;

    background:var(--card-light);

    border:1px solid var(--border);

    border-radius:14px;

    padding:9px;

    width:180px;

}

.quantity-btn{

    width:40px;

    height:40px;

    border:none;

    border-radius:50%;

    background:var(--accent);

    color:#fff;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:18px;

    transition:.2s;

}

.quantity-btn:hover{

    background:var(--accent-dark);

    transform:scale(1.04);

}

.quantity-value{

    min-width:35px;

    text-align:center;

    font-size:18px;

    font-weight:800;

}


/* =====================================================
   ORDER BUTTON
===================================================== */

.buy-button{

    width:100%;

    margin-top:25px;

    border:none;

    border-radius:16px;

    padding:17px 20px;

    background:var(--theme-gradient);

    color:#fff;

    font-size:18px;

    font-weight:800;

    cursor:pointer;

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.12);

    transition:.2s;

}

.buy-button:hover{

    transform:translateY(-2px);

    filter:brightness(1.04);

}

.buy-button i{

    margin-left:7px;

}


/* =====================================================
   ORDER FORM
===================================================== */

.order-form-section{

    margin-top:25px;

    padding-top:25px;

    border-top:1px solid var(--border);

}

.order-form-title{

    font-size:22px;

    font-weight:800;

    margin-bottom:18px;

    display:flex;

    align-items:center;

    gap:9px;

}

.order-form-title i{

    color:var(--accent);

}

.notice{

    background:var(--sidebar-hover);

    border:1px solid var(--border);

    border-radius:12px;

    padding:12px 14px;

    color:var(--muted);

    font-size:13px;

    line-height:1.8;

    margin-bottom:18px;

}

.form-group{

    margin-bottom:15px;

}

.form-group label{

    display:block;

    margin-bottom:7px;

    font-size:13px;

    font-weight:700;

}

.required{

    color:var(--accent);

}

input,
select{

    width:100%;

    padding:14px 15px;

    border:1px solid var(--border);

    border-radius:13px;

    background:var(--input);

    color:var(--input-text);

    font-size:14px;

    outline:none;

    transition:.2s;

}

input:focus,
select:focus{

    border-color:var(--accent);

    background:var(--card);

    box-shadow:
        0 0 0 3px
        rgba(244,123,32,.10);

}

select{

    cursor:pointer;

}

.delivery-loading{

    display:none;

    margin-top:-5px;

    margin-bottom:12px;

    color:var(--muted);

    font-size:13px;

}

.delivery-error{

    display:none;

    background:var(--danger-bg);

    color:var(--danger);

    border:1px solid rgba(217,83,79,.2);

    padding:12px;

    border-radius:11px;

    font-size:13px;

    text-align:center;

    margin-bottom:15px;

}


/* =====================================================
   TOTALS
===================================================== */

.total-box{

    margin-top:12px;

    padding:14px;

    border-radius:13px;

    background:#222;

    color:#fff;

    text-align:center;

    font-size:15px;

    font-weight:700;

}

.total-box.final{

    background:var(--theme-gradient);

    font-size:19px;

}


/* =====================================================
   SUBMIT BUTTON
===================================================== */

.submit-order{

    width:100%;

    margin-top:16px;

    border:none;

    border-radius:15px;

    padding:16px;

    background:var(--accent);

    color:#fff;

    font-size:17px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;

}

.submit-order:hover{

    background:var(--accent-dark);

    transform:translateY(-1px);

}

.submit-order:disabled{

    background:#BDBDBD;

    cursor:not-allowed;

    transform:none;

    opacity:.8;

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

    position:fixed;

    top:0;

    right:-290px;

    width:290px;

    height:100vh;

    background:var(--sidebar);

    box-shadow:-5px 0 20px rgba(0,0,0,.12);

    z-index:999;

    transition:.3s;

    padding-top:30px;

}

.sidebar.active{

    right:0;

}

.sidebar-title{

    padding:0 25px 20px;

    border-bottom:1px solid var(--border);

    font-size:24px;

    font-weight:800;

}

.sidebar a{

    display:flex;

    align-items:center;

    gap:12px;

    padding:16px 25px;

    text-decoration:none;

    color:var(--text);

    font-size:16px;

    font-weight:600;

    border-bottom:1px solid var(--border);

    transition:.2s;

}

.sidebar a i{

    width:22px;

    text-align:center;

    color:var(--accent);

}

.sidebar a:hover{

    background:var(--sidebar-hover);

    color:var(--accent-dark);

}

.overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.35);

    z-index:998;

    display:none;

}

.overlay.active{

    display:block;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    min-height:350px;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    gap:12px;

    color:var(--muted);

}

.loading i{

    font-size:30px;

    color:var(--accent);

}


/* =====================================================
   ERROR
===================================================== */

.error-box{

    max-width:700px;

    margin:40px auto;

    background:var(--card);

    border:1px solid var(--border);

    border-radius:20px;

    padding:40px 25px;

    text-align:center;

    box-shadow:var(--shadow);

}

.error-box i{

    font-size:45px;

    color:var(--danger);

    margin-bottom:15px;

}

.error-box h2{

    margin-bottom:10px;

}

.error-box p{

    color:var(--muted);

    line-height:1.8;

}

.error-box a{

    display:inline-block;

    margin-top:18px;

    background:var(--accent);

    color:#fff;

    padding:12px 22px;

    border-radius:12px;

    text-decoration:none;

    font-weight:700;

}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:901px){

    .product-gallery{

        order:2;

    }

    .product-info{

        order:1;

    }

}


/* =====================================================
   TABLET / MOBILE
===================================================== */

@media(max-width:900px){

    header{

        height:70px;

        padding:10px 15px;

    }

    .logo img{

        width:105px;

    }

    .product-container{

        width:calc(100% - 20px);

        margin-top:15px;

    }

    .product-layout{

        display:flex;

        flex-direction:column;

        gap:15px;

    }

    .product-gallery{

        order:1;

        width:100%;

    }

    .product-info{

        order:2;

        width:100%;

    }

    .info-card{

        position:static;

        padding:18px;

    }

    .gallery-card{

        padding:12px;

    }

    .product-title{

        font-size:24px;

    }

    .current-price{

        font-size:28px;

    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:500px){

    .store-info{

        width:calc(100% - 16px);

        margin-top:10px;

    }

    .product-container{

        width:calc(100% - 16px);

    }

    .main-image-wrapper{

        border-radius:16px;

    }

    .thumbnail{

        width:65px;

        height:65px;

        flex-basis:65px;

    }

    .product-title{

        font-size:21px;

    }

    .short-description{

        font-size:14px;

    }

    .descriptive-images-grid{

        grid-template-columns:1fr;

    }

    .quantity-box{

        width:100%;

    }

}


/* =====================================================
   DARK DESKTOP BASE
===================================================== */

@media(min-width:1000px){

    :root{

        --bg:#07111F;

        --header:#07111F;

        --card:#0D1B2A;

        --card-light:#102234;

        --text:#F4F7FB;

        --muted:#AAB7C7;

        --border:#1D334A;

        --input:#102234;

        --input-text:#F4F7FB;

        --sidebar:#0A1726;

        --sidebar-hover:#17283A;

        --shadow:0 6px 22px rgba(0,0,0,.20);

    }

    body{

        background:var(--bg);

        color:var(--text);

    }

    header{

        background:var(--header);

        border-bottom-color:#172A40;

    }

    .store-info{

        background:var(--card);

    }

    .store-info strong{

        color:#F4F7FB;

    }

    .product-card{

        background:var(--card);

    }

    .main-image-wrapper{

        background:#102234;

    }

    .description-content{

        color:#E8EEF5;

    }

    .size-select{

        background:var(--input);

        color:#F4F7FB;

    }

    select option{

        background:#0D1B2A;

        color:#F4F7FB;

    }

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function safeUrl(value){

    return String(value || "")
        .replace(/"/g,"%22")
        .replace(/'/g,"%27")
        .replace(/</g,"%3C")
        .replace(/>/g,"%3E");

}


/* =====================================================
   LOAD PRODUCT
===================================================== */

async function loadProduct(){

    if(!productId){

        showError(
            "لم يتم تحديد المنتج."
        );

        return;

    }


    try{

        const productRef =
        doc(
            db,
            "products",
            String(productId)
        );

        const productSnap =
        await getDoc(
            productRef
        );


        if(!productSnap.exists()){

            showError(
                "المنتج غير موجود أو تم حذفه."
            );

            return;

        }


        product = {

            id:
            productSnap.id,

            ...productSnap.data()

        };


        /* =============================================
           UID FIRST
        ============================================= */

        currentOwnerUid =
        String(
            product.ownerUid ||
            ""
        );


        currentStoreId =
        String(
            product.storeId ||
            currentStoreId ||
            currentOwnerUid ||
            ""
        );


        await loadStoreForProduct();


        applyStoreTheme(
            currentStore || {}
        );


        renderProduct();


        updateCartCount();


        await loadDelivery();


        updateOrderTotals();


    }catch(error){

        console.error(
            "PRODUCT LOAD ERROR:",
            error
        );

        showError(
            "تعذر تحميل المنتج."
        );

    }

}


/* =====================================================
   LOAD STORE
===================================================== */

async function loadStoreForProduct(){

    let storeSnap = null;


    /* =============================================
       FIRST:
       stores/{ownerUid}
    ============================================= */

    if(currentOwnerUid){

        try{

            const ownerRef =
            doc(
                db,
                "stores",
                String(currentOwnerUid)
            );

            const ownerSnap =
            await getDoc(
                ownerRef
            );

            if(ownerSnap.exists()){

                storeSnap =
                ownerSnap;

            }

        }catch(error){

            console.warn(
                "OWNER STORE LOOKUP ERROR:",
                error
            );

        }

    }


    /* =============================================
       SECOND:
       stores/{storeId}
    ============================================= */

    if(
        !storeSnap &&
        currentStoreId
    ){

        try{

            const storeRef =
            doc(
                db,
                "stores",
                String(currentStoreId)
            );

            const snap =
            await getDoc(
                storeRef
            );

            if(snap.exists()){

                storeSnap =
                snap;

            }

        }catch(error){

            console.warn(
                "STORE LOOKUP ERROR:",
                error
            );

        }

    }


    if(storeSnap){

        currentStore =
        storeSnap.data();

        currentStoreName =
        currentStore.storeName ||
        currentStore.name ||
        product.storeName ||
        "G-Glam";


        if(!currentOwnerUid){

            currentOwnerUid =
            String(
                currentStore.ownerUid ||
                currentStore.ownerId ||
                currentStore.uid ||
                ""
            );

        }

    }else{

        currentStore =
        {};

        currentStoreName =
        product.storeName ||
        "G-Glam";

    }


    /* =============================================
       LOCAL STORAGE
    ============================================= */

    if(currentStoreId){

        localStorage.setItem(
            "storeId",
            String(currentStoreId)
        );

        localStorage.setItem(
            "storeDocumentId",
            String(currentStoreId)
        );

    }

    if(currentOwnerUid){

        localStorage.setItem(
            "ownerUid",
            String(currentOwnerUid)
        );

    }

    localStorage.setItem(
        "storeName",
        currentStoreName
    );


    /* =============================================
       STORE INFO
    ============================================= */

    storeInfo.innerHTML = `

        متجر:
        <strong>
            ${escapeHtml(currentStoreName)}
        </strong>

    `;


    const storeQuery =
    currentStoreId
    ?
    "?store=" +
    encodeURIComponent(
        String(currentStoreId)
    )
    :
    "";


    document.getElementById(
        "homeLink"
    ).href =
    "index.html" +
    storeQuery;


    document.getElementById(
        "cartLink"
    ).href =
    "cart.html" +
    storeQuery;


    document.getElementById(
        "cartButton"
    ).onclick =
    function(){

        window.location.href =
        "cart.html" +
        storeQuery;

    };

}


/* =====================================================
   THEME
===================================================== */

function applyStoreTheme(store){

    const body =
    document.body;


    const builtInThemes = [

        "orange",
        "blue",
        "green",
        "purple",
        "pink",
        "dark",
        "red",
        "teal",
        "gold",
        "luxury",
        "sunset",
        "emerald",
        "navy",
        "brown",
        "rose",
        "indigo"

    ];


    const oldClasses = [

        "theme-orange",
        "theme-blue",
        "theme-green",
        "theme-purple",
        "theme-pink",
        "theme-dark",
        "theme-red",
        "theme-teal",
        "theme-gold",
        "theme-luxury",
        "theme-sunset",
        "theme-emerald",
        "theme-navy",
        "theme-brown",
        "theme-rose",
        "theme-indigo",
        "theme-custom-solid",
        "theme-custom-gradient"

    ];


    oldClasses.forEach(
        cls =>
        body.classList.remove(cls)
    );


    body.style.removeProperty(
        "--accent"
    );

    body.style.removeProperty(
        "--accent-dark"
    );

    body.style.removeProperty(
        "--sidebar-hover"
    );

    body.style.removeProperty(
        "--theme-gradient"
    );

    body.style.removeProperty(
        "--custom-gradient"
    );


    /* =============================================
       THEME TYPE
    ============================================= */

    const themeType =
    String(
        store?.themeType ||
        ""
    ).toLowerCase();


    let colors =
    Array.isArray(
        store?.themeColors
    )
    ?
    store.themeColors.filter(Boolean)
    :
    [];


    /* =============================================
       GRADIENT
    ============================================= */

    if(
        themeType === "gradient" &&
        colors.length >= 2
    ){

        colors =
        colors.slice(0,4);


        const gradient =
        "linear-gradient(135deg," +
        colors.join(",") +
        ")";


        body.classList.add(
            "theme-custom-gradient"
        );


        body.style.setProperty(
            "--custom-gradient",
            gradient
        );


        body.style.setProperty(
            "--theme-gradient",
            gradient
        );


        body.style.setProperty(
            "--accent",
            colors[0]
        );


        body.style.setProperty(
            "--accent-dark",
            colors[1]
        );


        body.style.setProperty(
            "--sidebar-hover",
            colors[0]
        );


        themeColorMeta.content =
        colors[0];


        localStorage.setItem(
            "gglamStoreTheme",
            JSON.stringify({
                themeType:"gradient",
                themeColors:colors
            })
        );


        return;

    }


    /* =============================================
       SOLID
    ============================================= */

    if(
        themeType === "solid" &&
        colors.length >= 1
    ){

        const color =
        colors[0];


        body.classList.add(
            "theme-custom-solid"
        );


        body.style.setProperty(
            "--accent",
            color
        );


        body.style.setProperty(
            "--accent-dark",
            color
        );


        body.style.setProperty(
            "--sidebar-hover",
            color
        );


        body.style.setProperty(
            "--theme-gradient",
            `linear-gradient(
                135deg,
                ${color},
                ${color}
            )`
        );


        themeColorMeta.content =
        color;


        localStorage.setItem(
            "gglamStoreTheme",
            JSON.stringify({
                themeType:"solid",
                themeColors:[color]
            })
        );


        return;

    }


    /* =============================================
       BUILT-IN THEME
    ============================================= */

    const theme =
    String(
        store?.theme ||
        localStorage.getItem(
            "gglamStoreTheme"
        ) ||
        "orange"
    ).replace(
        "theme-",
        ""
    );


    if(
        builtInThemes.includes(theme)
    ){

        body.classList.add(
            "theme-" + theme
        );


        const accent =
        getComputedStyle(body)
            .getPropertyValue(
                "--accent"
            )
            .trim();


        if(accent){

            themeColorMeta.content =
            accent;

        }


        return;

    }


    body.classList.add(
        "theme-orange"
    );

}

/* =====================================================
   PRODUCT EVENTS
===================================================== */

function setupProductEvents(){

    /* =============================================
       THUMBNAILS
    ============================================= */

    const thumbnails =
    document.querySelectorAll(
        ".thumbnail"
    );

    const mainImage =
    document.getElementById(
        "mainProductImage"
    );


    thumbnails.forEach(
        button => {

            button.addEventListener(
                "click",
                function(){

                    const image =
                    this.dataset.image;


                    if(
                        mainImage &&
                        image
                    ){

                        mainImage.src =
                        image;

                        mainImage.style.display =
                        "block";

                        const placeholder =
                        document.getElementById(
                            "imagePlaceholder"
                        );

                        if(placeholder){

                            placeholder.style.display =
                            "none";

                        }

                    }


                    thumbnails.forEach(
                        item =>
                        item.classList.remove(
                            "active"
                        )
                    );


                    this.classList.add(
                        "active"
                    );

                }
            );

        }
    );


    /* =============================================
       COLORS
    ============================================= */

    const colorButtons =
    document.querySelectorAll(
        ".color-option"
    );


    colorButtons.forEach(
        button => {

            button.addEventListener(
                "click",
                function(){

                    selectedColor =
                    this.dataset.color ||
                    "";


                    colorButtons.forEach(
                        item =>
                        item.classList.remove(
                            "active"
                        )
                    );


                    this.classList.add(
                        "active"
                    );


                    updateOrderButton();

                }
            );

        }
    );


    /* =============================================
       SIZE
    ============================================= */

    const sizeSelect =
    document.getElementById(
        "sizeSelect"
    );


    if(sizeSelect){

        sizeSelect.addEventListener(
            "change",
            function(){

                selectedSize =
                this.value;

                updateOrderButton();

            }
        );

    }


    /* =============================================
       QUANTITY
    ============================================= */

    document
    .getElementById(
        "quantityMinus"
    )
    ?.addEventListener(
        "click",
        function(){

            quantity =
            Math.max(
                1,
                quantity - 1
            );

            updateQuantityUI();

        }
    );


    document
    .getElementById(
        "quantityPlus"
    )
    ?.addEventListener(
        "click",
        function(){

            quantity++;

            updateQuantityUI();

        }
    );


    /* =============================================
       BUY BUTTON
    ============================================= */

    document
    .getElementById(
        "buyButton"
    )
    ?.addEventListener(
        "click",
        function(){

            const form =
            document.getElementById(
                "orderFormSection"
            );

            if(form){

                form.scrollIntoView({
                    behavior:"smooth",
                    block:"start"
                });

            }

        }
    );


    /* =============================================
       DELIVERY
    ============================================= */

    document
    .getElementById(
        "wilaya"
    )
    ?.addEventListener(
        "change",
        function(){

            updateDelivery();

            updateOrderButton();

        }
    );


    document
    .getElementById(
        "deliveryType"
    )
    ?.addEventListener(
        "change",
        function(){

            updateDelivery();

            updateOrderButton();

        }
    );


    /* =============================================
       CUSTOMER INPUT
    ============================================= */

    [
        "customerName",
        "customerPhone",
        "commune",
        "address"
    ].forEach(
        id => {

            document
            .getElementById(id)
            ?.addEventListener(
                "input",
                updateOrderButton
            );

        }
    );


    /* =============================================
       SUBMIT
    ============================================= */

    document
    .getElementById(
        "submitOrder"
    )
    ?.addEventListener(
        "click",
        sendOrder
    );

}


/* =====================================================
   QUANTITY UI
===================================================== */

function updateQuantityUI(){

    const element =
    document.getElementById(
        "quantityValue"
    );


    if(element){

        element.textContent =
        quantity;

    }


    updateOrderTotals();

}


/* =====================================================
   LOAD DELIVERY
===================================================== */

async function loadDelivery(){

    const loading =
    document.getElementById(
        "deliveryLoading"
    );

    const error =
    document.getElementById(
        "deliveryError"
    );

    const select =
    document.getElementById(
        "wilaya"
    );


    if(!loading || !select){

        return;

    }


    loading.style.display =
    "block";

    error.style.display =
    "none";


    select.innerHTML = `

        <option value="">
            جاري تحميل الولايات...
        </option>

    `;


    deliveryItems = [];


    try{

        /* =============================================
           IMPORTANT:
           DELIVERY IS PRIVATE TO OWNER UID
        ============================================= */

        if(!currentOwnerUid){

            throw new Error(
                "تعذر تحديد صاحب المتجر."
            );

        }


        const deliveryRef =
        collection(
            db,
            "stores",
            String(currentOwnerUid),
            "delivery"
        );


        const snapshot =
        await getDocs(
            deliveryRef
        );


        snapshot.forEach(
            docSnap => {

                const data =
                docSnap.data();


                const wilayaName =
                data.name ||
                data.wilaya ||
                data.title ||
                docSnap.id;


                const officeValue =
                data.office ??
                data.officePrice ??
                data.bureau ??
                data.bureauPrice ??
                0;


                const homeValue =
                data.home ??
                data.homePrice ??
                data.domicile ??
                data.homeDelivery ??
                0;


                deliveryItems.push({

                    id:
                    docSnap.id,

                    name:
                    String(
                        wilayaName
                    ),

                    office:
                    Number(
                        officeValue
                    ) || 0,

                    home:
                    Number(
                        homeValue
                    ) || 0

                });

            }
        );


        deliveryItems.sort(
            (a,b) => {

                const aNum =
                parseInt(
                    String(a.id)
                        .match(/\d+/)?.[0]
                );


                const bNum =
                parseInt(
                    String(b.id)
                        .match(/\d+/)?.[0]
                );


                if(
                    !Number.isNaN(aNum) &&
                    !Number.isNaN(bNum)
                ){

                    return aNum - bNum;

                }


                return a.name.localeCompare(
                    b.name,
                    "ar"
                );

            }
        );


        select.innerHTML = `

            <option value="">
                اختر الولاية
            </option>

        `;


        if(
            deliveryItems.length === 0
        ){

            select.innerHTML = `

                <option value="">
                    لا توجد ولايات متاحة
                </option>

            `;


            error.textContent =
            "❌ لا توجد أسعار توصيل لهذا المتجر حاليًا.";


            error.style.display =
            "block";

        }else{

            deliveryItems.forEach(
                item => {

                    const option =
                    document.createElement(
                        "option"
                    );


                    option.value =
                    item.id;


                    option.textContent =
                    item.name;


                    select.appendChild(
                        option
                    );

                }
            );

        }


        loading.style.display =
        "none";


        updateDelivery();

        updateOrderButton();


    }catch(errorValue){

        console.error(
            "PRIVATE DELIVERY LOAD ERROR:",
            errorValue
        );


        select.innerHTML = `

            <option value="">
                تعذر تحميل الولايات
            </option>

        `;


        error.textContent =
        "❌ تعذر تحميل أسعار التوصيل لهذا المتجر.";


        error.style.display =
        "block";


        loading.style.display =
        "none";

    }

}


/* =====================================================
   GET DELIVERY ITEM
===================================================== */

function getDeliveryItem(){

    const select =
    document.getElementById(
        "wilaya"
    );


    if(!select){

        return null;

    }


    const wilaya =
    select.value;


    if(!wilaya){

        return null;

    }


    return deliveryItems.find(
        item =>
        String(item.id) ===
        String(wilaya)
    ) || null;

}


/* =====================================================
   UPDATE DELIVERY
===================================================== */

function updateDelivery(){

    const deliveryPriceElement =
    document.getElementById(
        "deliveryPrice"
    );


    if(!deliveryPriceElement){

        return;

    }


    const item =
    getDeliveryItem();


    const type =
    document.getElementById(
        "deliveryType"
    )?.value || "";


    if(
        !item ||
        !type
    ){

        deliveryCost =
        0;


        deliveryPriceElement.textContent =
        "سعر التوصيل: --";


        updateOrderTotals();

        return;

    }


    if(
        type === "إلى المكتب"
    ){

        deliveryCost =
        Number(item.office) || 0;

    }else{

        deliveryCost =
        Number(item.home) || 0;

    }


    deliveryPriceElement.textContent =
    "سعر التوصيل: " +
    deliveryCost +
    " DA";


    updateOrderTotals();

}


/* =====================================================
   UPDATE TOTALS
===================================================== */

function updateOrderTotals(){

    const price =
    Number(
        product?.price || 0
    );


    const productTotal =
    price * quantity;


    const productTotalElement =
    document.getElementById(
        "productTotal"
    );


    const finalTotalElement =
    document.getElementById(
        "finalTotal"
    );


    if(productTotalElement){

        productTotalElement.textContent =
        "مجموع المنتج: " +
        productTotal +
        " DA";

    }


    if(finalTotalElement){

        finalTotalElement.textContent =
        "المجموع النهائي: " +
        (
            productTotal +
            Number(deliveryCost)
        ) +
        " DA";

    }

}


/* =====================================================
   VALIDATE PHONE
===================================================== */

function validatePhone(phone){

    const normalized =
    phone.replace(
        /[\s\-().]/g,
        ""
    );


    return /^0(5|6|7)[0-9]{8}$/.test(
        normalized
    );

}


/* =====================================================
   REQUIRED OPTIONS
===================================================== */

function optionsAreValid(){

    const colors =
    Array.isArray(product?.colors)
    ?
    product.colors.filter(Boolean)
    :
    [];


    const sizes =
    Array.isArray(product?.sizes)
    ?
    product.sizes.filter(Boolean)
    :
    [];


    if(
        colors.length &&
        !selectedColor
    ){

        return false;

    }


    if(
        sizes.length &&
        !selectedSize
    ){

        return false;

    }


    return true;

}


/* =====================================================
   ORDER BUTTON STATE
===================================================== */

function updateOrderButton(){

    const button =
    document.getElementById(
        "submitOrder"
    );


    if(!button){

        return;

    }


    const name =
    document.getElementById(
        "customerName"
    )?.value.trim() || "";


    const phone =
    document.getElementById(
        "customerPhone"
    )?.value.trim() || "";


    const wilaya =
    document.getElementById(
        "wilaya"
    )?.value || "";


    const delivery =
    document.getElementById(
        "deliveryType"
    )?.value || "";


    const valid =
    Boolean(
        name &&
        phone &&
        wilaya &&
        delivery &&
        optionsAreValid()
    );


    button.disabled =
    !valid;

}


/* =====================================================
   SEND ORDER
===================================================== */

async function sendOrder(){

    if(!product){

        alert(
            "تعذر تحديد المنتج."
        );

        return;

    }


    const name =
    document.getElementById(
        "customerName"
    ).value.trim();


    const phone =
    document.getElementById(
        "customerPhone"
    ).value.trim();


    const wilaya =
    document.getElementById(
        "wilaya"
    ).value;


    const commune =
    document.getElementById(
        "commune"
    ).value.trim();


    const address =
    document.getElementById(
        "address"
    ).value.trim();


    const delivery =
    document.getElementById(
        "deliveryType"
    ).value;


    const ownerUid =
    String(
        currentOwnerUid ||
        product.ownerUid ||
        ""
    );


    const storeId =
    String(
        product.storeId ||
        currentStoreId ||
        ownerUid
    );


    /* =============================================
       REQUIRED DATA
    ============================================= */

    if(
        !name ||
        !phone ||
        !wilaya ||
        !delivery
    ){

        alert(
            "يرجى ملء جميع المعلومات المطلوبة."
        );

        return;

    }


    /* =============================================
       OPTIONS
    ============================================= */

    if(!optionsAreValid()){

        const hasColors =
        Array.isArray(product.colors) &&
        product.colors.length > 0;


        const hasSizes =
        Array.isArray(product.sizes) &&
        product.sizes.length > 0;


        if(
            hasColors &&
            !selectedColor
        ){

            alert(
                "يرجى اختيار اللون."
            );

            return;

        }


        if(
            hasSizes &&
            !selectedSize
        ){

            alert(
                "يرجى اختيار المقاس."
            );

            return;

        }

    }


    /* =============================================
       PHONE
    ============================================= */

    if(!validatePhone(phone)){

        alert(
            "❌ يرجى إدخال رقم هاتف جزائري صحيح."
        );

        return;

    }


    /* =============================================
       OWNER
    ============================================= */

    if(!ownerUid){

        alert(
            "تعذر تحديد صاحب المتجر.\n\n" +
            "يرجى العودة إلى صفحة المتجر والمحاولة مرة أخرى."
        );

        return;

    }


    /* =============================================
       DELIVERY
    ============================================= */

    const deliveryItem =
    getDeliveryItem();


    if(!deliveryItem){

        alert(
            "تعذر العثور على سعر التوصيل لهذه الولاية."
        );

        return;

    }


    updateDelivery();


    if(
        deliveryCost < 0 ||
        Number.isNaN(
            deliveryCost
        )
    ){

        alert(
            "تعذر حساب سعر التوصيل."
        );

        return;

    }


    /* =============================================
       TOTAL
    ============================================= */

    const unitPrice =
    Math.max(
        0,
        Number(
            product.price || 0
        )
    );


    const finalQuantity =
    Math.max(
        1,
        Number(quantity || 1)
    );


    const productTotal =
    unitPrice *
    finalQuantity;


    const finalTotal =
    productTotal +
    Number(deliveryCost);


    /* =============================================
       BUTTON
    ============================================= */

    const button =
    document.getElementById(
        "submitOrder"
    );


    button.disabled =
    true;


    button.innerHTML = `

        <i
            class="fa-solid fa-spinner fa-spin">
        </i>

        جاري إرسال الطلب...

    `;


    try{

        /* =========================================
           PRODUCT
        ========================================= */

        const orderProduct = {

            id:
            String(
                product.id || ""
            ),

            name:
            String(
                product.name ||
                "منتج"
            ),

            price:
            unitPrice,

            quantity:
            finalQuantity,

            total:
            productTotal,

            image:
            String(
                product.image ||
                (
                    Array.isArray(
                        product.images
                    ) &&
                    product.images.length
                    ?
                    product.images[0]
                    :
                    ""
                )
            ),

            color:
            String(
                selectedColor ||
                "بدون لون"
            ),

            size:
            String(
                selectedSize ||
                "بدون قياس"
            ),

            ownerUid:
            ownerUid,

            storeId:
            storeId

        };


        /* =========================================
           ORDER DATA
           SAME STRUCTURE AS CART.HTML
        ========================================= */

        const orderData = {

            ownerUid:
            ownerUid,

            storeId:
            storeId,

            storeName:
            currentStoreName,

            name:
            name,

            phone:
            phone,

            wilaya:
            wilaya,

            commune:
            commune,

            address:
            address,

            delivery:
            delivery,

            deliveryPrice:
            Number(
                deliveryCost
            ),

            products:[
                orderProduct
            ],

            productsTotal:
            Number(
                productTotal
            ),

            total:
            Number(
                finalTotal
            ),

            status:
            "قيد المعالجة",

            note:
            "",

            date:
            new Date().toLocaleString(
                "ar-DZ"
            ),

            createdAt:
            serverTimestamp()

        };


        /* =========================================
           SAVE TO SAME ORDERS COLLECTION
        ========================================= */

        await addDoc(
            collection(
                db,
                "orders"
            ),
            orderData
        );


        /* =========================================
           SUCCESS
        ========================================= */

        alert(
            "تم إرسال الطلب بنجاح ✅"
        );


        window.location.href =
        "index.html?store=" +
        encodeURIComponent(
            storeId
        );


    }catch(error){

        console.error(
            "DIRECT ORDER ERROR:",
            error
        );


        alert(
            "❌ فشل إرسال الطلب.\n\n" +
            "السبب:\n" +
            (
                error?.message ||
                "خطأ غير معروف"
            )
        );


        button.disabled =
        false;


        button.innerHTML = `

            <i
                class="fa-solid fa-box">
            </i>

            إرسال الطلب

        `;

    }

}


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount(){

    let cart = [];

    try{

        cart =
        JSON.parse(
            localStorage.getItem(
                "cart"
            ) || "[]"
        );

    }catch(error){

        cart = [];

    }


    if(!Array.isArray(cart)){

        cart = [];

    }


    let count =
    0;


    cart.forEach(
        item => {

            const itemStore =
            String(
                item?.storeId ||
                item?.storeUid ||
                item?.ownerUid ||
                ""
            );


            /* =====================================
               ONLY CURRENT STORE
            ====================================== */

            if(
                currentStoreId &&
                itemStore &&
                itemStore !==
                String(currentStoreId)
            ){

                return;

            }


            count +=
            Math.max(
                1,
                Number(
                    item?.quantity || 1
                )
            );

        }
    );


    cartCount.textContent =
    count;

}
