<style>

:root{

    --bg:#F4F4F4;
    --header:#FFFFFF;
    --card:#FFFFFF;
    --card-light:#FAFAFA;
    --text:#374151;
    --muted:#6B7280;
    --border:#E5E7EB;
    --accent:#F47B20;
    --accent-dark:#D96610;
    --input:#FFFFFF;
    --input-text:#374151;
    --sidebar:#FFFFFF;
    --sidebar-hover:#FFF7ED;

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Tajawal",Arial,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    padding-bottom:30px;
}

button,
input,
select,
textarea{
    font-family:"Tajawal",Arial,sans-serif;
}

header{
    height:70px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    background:var(--header);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.logo span{
    color:var(--accent);
    font-size:27px;
    font-weight:800;
    white-space:nowrap;
}

.menu-btn,
.cart-icon{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
    color:var(--text);
    border-radius:10px;
}

.menu-btn svg,
.cart-icon svg{
    width:29px;
    height:29px;
}

.cart-count{
    position:absolute;
    top:-2px;
    right:-3px;
    width:21px;
    height:21px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    font-size:11px;
    font-weight:800;
    border:2px solid var(--header);
}

.store-info-bar{
    width:100%;
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:11px 18px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
}

.store-info-bar strong{
    color:var(--text);
}

.product-page{
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:25px;
}

.back-button{
    display:inline-flex;
    align-items:center;
    gap:8px;
    height:42px;
    padding:0 17px;
    margin-bottom:20px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--card);
    color:var(--text);
    text-decoration:none;
    font-size:14px;
    font-weight:700;
}

.back-button svg{
    width:20px;
    height:20px;
}

.product-layout{
    display:grid;
    grid-template-columns:minmax(0,1.15fr) minmax(330px,.85fr);
    gap:24px;
    align-items:start;
}

.gallery-card,
.product-info-card,
.order-section{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.gallery-card{
    padding:15px;
}

.main-image-wrapper{
    width:100%;
    border-radius:13px;
    overflow:hidden;
    background:var(--card-light);
}

.main-image{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
}

.no-image{
    width:100%;
    aspect-ratio:1/1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:var(--muted);
}

.thumbnails{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding:12px 2px 3px;
}

.thumbnail{
    width:72px;
    height:72px;
    flex:0 0 72px;
    border:2px solid transparent;
    border-radius:9px;
    overflow:hidden;
    cursor:pointer;
    background:var(--card-light);
    padding:0;
}

.thumbnail.active{
    border-color:var(--accent);
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.product-info-card{
    padding:24px;
}

.product-name{
    color:var(--text);
    font-size:29px;
    font-weight:800;
    line-height:1.45;
    margin-bottom:9px;
}

.product-short-description{
    color:var(--muted);
    font-size:14px;
    line-height:1.8;
    margin-bottom:15px;
}

.price-area{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:20px;
}

.product-price{
    color:var(--accent);
    font-size:27px;
    font-weight:800;
}

.old-price{
    color:var(--muted);
    text-decoration:line-through;
}

.option-group{
    margin-top:19px;
}

.option-label{
    display:block;
    color:var(--text);
    font-size:15px;
    font-weight:800;
    margin-bottom:9px;
}

.color-options{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.color-button{
    min-width:48px;
    min-height:39px;
    padding:6px 12px;
    border:1px solid var(--accent);
    border-radius:9px;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
    font-size:13px;
    font-weight:700;
}

.color-button.active{
    box-shadow:
        0 0 0 2px var(--card),
        0 0 0 4px var(--accent);
}

.size-select{
    width:100%;
    height:46px;
    padding:0 13px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--input);
    color:var(--input-text);
}

.quantity-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:20px;
}

.quantity-box{
    display:flex;
    align-items:center;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
}

.quantity-button{
    width:42px;
    height:42px;
    border:none;
    background:var(--card-light);
    color:var(--text);
    font-size:21px;
    cursor:pointer;
}

.quantity-value{
    width:45px;
    text-align:center;
    font-weight:800;
}

.product-actions{
    margin-top:18px;
}

.add-cart-button{
    min-width:135px;
    min-height:38px;
    padding:7px 15px;
    border:1px solid var(--border);
    border-radius:8px;
    background:transparent;
    color:var(--text);
    font-size:12px;
    font-weight:800;
    cursor:pointer;
}

.add-cart-button.added{
    color:var(--accent);
    border-color:var(--accent);
}

.buy-button,
.submit-order{
    width:100%;
    height:52px;
    margin-top:15px;
    border:none;
    border-radius:11px;
    background:var(--accent);
    color:#fff;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

.order-section{
    margin-top:25px;
    padding:24px;
}

.order-title{
    font-size:22px;
    font-weight:800;
    margin-bottom:5px;
}

.order-subtitle{
    color:var(--muted);
    font-size:13px;
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    border:1px solid #D1D5DB;
    border-radius:14px;
    overflow:hidden;
}

.form-group{
    padding:14px;
    border-bottom:1px solid #D1D5DB;
}

.form-group:nth-child(odd){
    border-left:1px solid #D1D5DB;
}

.form-group.full{
    grid-column:1/-1;
    border-left:0;
}

.form-label{
    display:block;
    font-size:14px;
    font-weight:700;
    margin-bottom:7px;
}

.form-control,
.delivery-select{
    width:100%;
    height:47px;
    padding:0 13px;
    border:1px solid #D1D5DB;
    border-radius:10px;
    outline:none;
    background:var(--input);
    color:var(--input-text);
    font-size:14px;
}

textarea.form-control{
    height:95px;
    padding:12px 13px;
    resize:vertical;
}

.order-summary{
    margin-top:20px;
    border:1px solid #D1D5DB;
    border-radius:14px;
    padding:15px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    padding:10px 2px;
    border-bottom:1px solid #E5E7EB;
}

.summary-total{
    display:flex;
    justify-content:space-between;
    margin-top:4px;
    padding:13px 2px 0;
    border-top:1px solid #D1D5DB;
    font-size:18px;
    font-weight:800;
}

.total-value{
    color:var(--accent);
}

.success-message{
    display:none;
    margin-top:15px;
    padding:14px;
    border-radius:10px;
    background:#ECFDF5;
    color:#047857;
    text-align:center;
    font-weight:700;
}

.social-section{
    width:100%;
    max-width:1100px;
    margin:45px auto 30px;
    padding:0 25px;
}

.social-box{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:28px 20px;
    text-align:center;
}

.social-title{
    font-size:24px;
    font-weight:800;
    margin-bottom:7px;
}

.social-description{
    color:var(--muted);
    font-size:14px;
    margin-bottom:22px;
}

.social-links{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
}

.social-link{
    min-width:125px;
    min-height:48px;
    padding:10px 16px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--card-light);
    color:var(--text);
    text-decoration:none;
}

.sidebar{
    position:fixed;
    top:0;
    right:-300px;
    width:280px;
    height:100vh;
    background:var(--sidebar);
    z-index:2000;
    transition:right .3s ease;
    padding-top:80px;
}

.sidebar.active{
    right:0;
}

.sidebar a{
    display:flex;
    align-items:center;
    gap:13px;
    padding:17px 25px;
    color:var(--text);
    text-decoration:none;
    border-bottom:1px solid var(--border);
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    z-index:1900;
}

.overlay.active{
    display:block;
}

.loading-page{
    min-height:65vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:var(--muted);
}

.error-box{
    max-width:650px;
    margin:50px auto;
    padding:45px 25px;
    text-align:center;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
}

@media(max-width:900px){

    .product-layout{
        grid-template-columns:1fr;
    }

}

@media(max-width:700px){

    header{
        height:64px;
        padding:0 16px;
    }

    .logo span{
        font-size:21px;
    }

    .product-page{
        padding:15px 10px;
    }

    .product-info-card,
    .order-section{
        padding:17px;
    }

    .product-name{
        font-size:23px;
    }

    .product-price{
        font-size:23px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .form-group:nth-child(odd){
        border-left:0;
    }

}

</style>

/* =====================================================

const params=

const productId=

const urlStoreId=

/* =====================================================

const productContainer=

const storeInfo=

/* =====================================================

===================================================== */

let product=null;

let currentStoreId=
    urlStoreId ||
    localStorage.getItem("storeId") ||

let currentOwnerUid=
    localStorage.getItem("ownerUid") ||
    null;

let currentStoreName=

let selectedSize="";

let deliveryCost=0;

/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(value){

    return String(value??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function safeUrl(value){

    if(!value){
        return "";
    }

    const url=
        String(value).trim();

    if(
        /^https?:\/\//i.test(url) ||
        /^data:image\//i.test(url)
    ){

        return url;

    }

    return "";

}


function formatPrice(value){

    return Number(
        value||0
    ).toLocaleString(
        "fr-FR"
    );

}


/* =====================================================
   STORE
===================================================== */

async function loadStore(){

    if(!currentStoreId){
        return null;
    }

    try{

        const storeRef=
            doc(
                db,
                "stores",
                String(currentStoreId)
            );

        const storeSnap=
            await getDoc(
                storeRef
            );

        let storeData={};

        if(storeSnap.exists()){

            storeData={

                id:
                    storeSnap.id,

                ...storeSnap.data()

            };

        }else{

            storeData={

                id:
                    String(currentStoreId)

            };

        }


        /*
         * STORE SETTINGS
         */

        try{

            const settingsRef=
                doc(
                    db,
                    "storeSettings",
                    String(currentStoreId)
                );

            const settingsSnap=
                await getDoc(
                    settingsRef
                );

            if(settingsSnap.exists()){

                storeData={

                    ...storeData,

                    ...settingsSnap.data(),

                    id:
                        String(currentStoreId)

                };

            }

        }catch(error){

            console.warn(
                "Store settings error:",
                error
            );

        }


        /*
         * IMPORTANT
         * OWNER UID
         */

        if(storeData.ownerUid){

            currentOwnerUid=
                String(
                    storeData.ownerUid
                );

        }


        /*
         * FALLBACK
         */

        if(!currentOwnerUid){

            currentOwnerUid=
                String(
                    storeData.id ||
                    currentStoreId
                );

        }


        if(currentOwnerUid){

            localStorage.setItem(
                "ownerUid",
                currentOwnerUid
            );

        }


        localStorage.setItem(
            "storeId",
            String(currentStoreId)
        );


        return storeData;

    }catch(error){

        console.error(
            "Store error:",
            error
        );

        return null;

    }

}


/* =====================================================
   GET STORE OWNER UID
   SAME PRINCIPLE AS CART.HTML
===================================================== */

function getStoreOwnerUid(){

    /*
     * 1 — current owner UID
     */

    if(currentOwnerUid){

        return String(
            currentOwnerUid
        );

    }


    /*
     * 2 — product owner UID
     */

    if(product?.ownerUid){

        return String(
            product.ownerUid
        );

    }


    /*
     * 3 — localStorage owner UID
     */

    const savedOwnerUid=
        localStorage.getItem(
            "ownerUid"
        );

    if(savedOwnerUid){

        return String(
            savedOwnerUid
        );

    }


    /*
     * 4 — current store owner UID
     */

    if(currentStore?.ownerUid){

        return String(
            currentStore.ownerUid
        );

    }


    /*
     * 5 — FINAL FALLBACK
     * SAME AS CART.HTML
     */

    if(currentStoreId){

        return String(
            currentStoreId
        );

    }


    return null;

}


/* =====================================================
   DELIVERY
   EXACT SAME FIRESTORE PATH AS CART.HTML
===================================================== */

async function loadDeliveryData(){

    deliveryData=[];
    deliveryLoaded=false;


    const select=
        document.getElementById(
            "customerWilaya"
        );


    if(select){

        select.innerHTML="";

        select.disabled=true;

    }


    try{

        /*
         * GET REAL OWNER UID
         */

        const ownerUid=
            getStoreOwnerUid();


        if(!ownerUid){

            throw new Error(
                "Owner UID غير متوفر"
            );

        }


        currentOwnerUid=
            String(ownerUid);


        localStorage.setItem(
            "ownerUid",
            currentOwnerUid
        );


        /*
         * =================================================
         * EXACT SAME PATH AS CART.HTML
         * =================================================
         *
         * stores/{ownerUid}/delivery
         *
         */

        const deliveryRef=
            collection(
                db,
                "stores",
                String(ownerUid),
                "delivery"
            );


        /*
         * GET ALL WILAYAS
         */

        const snapshot=
            await getDocs(
                deliveryRef
            );


        snapshot.forEach(
            docSnap=>{

                const data=
                    docSnap.data() || {};


                /*
                 * WILAYA NAME
                 */

                const name=
                    data.name ||
                    data.wilaya ||
                    data.title ||
                    docSnap.id;


                /*
                 * OFFICE
                 */

                const office=
                    Number(
                        data.office ??
                        data.officePrice ??
                        data.bureau ??
                        data.bureauPrice ??
                        0
                    );


                /*
                 * HOME
                 */

                const home=
                    Number(
                        data.home ??
                        data.homePrice ??
                        data.domicile ??
                        data.homeDelivery ??
                        0
                    );


                deliveryData.push({

                    id:
                        docSnap.id,

                    name:
                        String(name),

                    office:
                        Number.isFinite(office)
                        ?
                        office
                        :
                        0,

                    home:
                        Number.isFinite(home)
                        ?
                        home
                        :
                        0

                });

            }
        );


        /*
         * SAME SORTING AS CART.HTML
         */

        deliveryData.sort(
            (a,b)=>{

                const na=
                    parseInt(
                        String(a.id).replace(
                            /\D/g,
                            ""
                        ),
                        10
                    ) || 999;


                const nb=
                    parseInt(
                        String(b.id).replace(
                            /\D/g,
                            ""
                        ),
                        10
                    ) || 999;


                if(na!==nb){

                    return na-nb;

                }


                return String(a.name)
                    .localeCompare(
                        String(b.name),
                        "ar"
                    );

            }
        );


        deliveryLoaded=true;


        console.log(
            "Delivery loaded:",
            deliveryData.length,
            deliveryData
        );


        populateWilayaSelect();


    }catch(error){

        console.error(
            "Delivery loading error:",
            error
        );


        deliveryData=[];
        deliveryLoaded=false;


        populateWilayaSelect();

    }

}


/* =====================================================
   POPULATE WILAYA
===================================================== */

function populateWilayaSelect(){

    const select=
        document.getElementById(
            "customerWilaya"
        );


    if(!select){
        return;
    }


    select.innerHTML="";


    const firstOption=
        document.createElement(
            "option"
        );


    firstOption.value="";


    firstOption.textContent=
        deliveryLoaded
        ?
        "اختر الولاية"
        :
        "تعذر تحميل الولايات";


    firstOption.selected=true;


    select.appendChild(
        firstOption
    );


    if(!deliveryLoaded){

        select.disabled=true;

        return;

    }


    if(!deliveryData.length){

        const emptyOption=
            document.createElement(
                "option"
            );


        emptyOption.value="";


        emptyOption.textContent=
            "لا توجد ولايات متاحة";


        emptyOption.disabled=true;


        select.appendChild(
            emptyOption
        );


        select.disabled=true;

        return;

    }


    select.disabled=false;


    /*
     * ALL WILAYAS FROM
     *
     * stores/{ownerUid}/delivery
     *
     */

    deliveryData.forEach(
        item=>{

            const option=
                document.createElement(
                    "option"
                );


            option.value=
                String(item.id);


            option.textContent=
                String(item.name);


            select.appendChild(
                option
            );

        }
    );


    updateDelivery();

}


/* =====================================================
   SELECTED DELIVERY
===================================================== */

function getSelectedDelivery(){

    const select=
        document.getElementById(
            "customerWilaya"
        );


    if(!select){
        return null;
    }


    const wilaya=
        String(
            select.value||""
        ).trim();


    if(!wilaya){
        return null;
    }


    return deliveryData.find(
        item=>
            String(item.id).trim()===
            wilaya
    ) || null;

}


/* =====================================================
   PRODUCT
===================================================== */

async function loadProduct(){

    if(!productId){

        showError(
            "لم يتم تحديد المنتج."
        );

        return;

    }


    try{

        const productRef=
            doc(
                db,
                "products",
                productId
            );


        const productSnap=
            await getDoc(
                productRef
            );


        if(!productSnap.exists()){

            showError(
                "المنتج غير موجود."
            );

            return;

        }


        product={

            id:
                productSnap.id,

            ...productSnap.data()

        };


        /*
         * VERIFY STORE
         */

        if(
            currentStoreId &&
            product.storeId &&
            String(product.storeId)!==
            String(currentStoreId)
        ){

            showError(
                "هذا المنتج لا ينتمي إلى هذا المتجر."
            );

            return;

        }


        /*
         * REAL STORE ID
         */

        currentStoreId=
            product.storeId ||
            currentStoreId;


        /*
         * REAL OWNER UID
         */

        currentOwnerUid=
            product.ownerUid ||
            currentOwnerUid ||
            localStorage.getItem(
                "ownerUid"
            ) ||
            null;


        /*
         * SAVE
         */

        if(currentStoreId){

            localStorage.setItem(
                "storeId",
                String(currentStoreId)
            );

            localStorage.setItem(
                "storeDocumentId",
                String(currentStoreId)
            );

        }


        if(currentOwnerUid){

            localStorage.setItem(
                "ownerUid",
                String(currentOwnerUid)
            );

        }


        /*
         * LOAD STORE
         */

        currentStore=
            await loadStore();


        if(currentStore){

            currentStoreName=
                String(
                    currentStore.storeName ||
                    currentStore.name ||
                    "G-Glam"
                );


            headerStoreName.textContent=
                currentStoreName;


            storeInfo.innerHTML=`

                <strong>
                    ${escapeHtml(
                        currentStoreName
                    )}
                </strong>

            `;

        }


        /*
         * IMPORTANT:
         *
         * DELIVERY IS LOADED ONLY
         * AFTER OWNER UID IS READY
         */

        await loadDeliveryData();


        renderProduct();


    }catch(error){

        console.error(
            "Product loading error:",
            error
        );


        showError(
            "حدث خطأ أثناء تحميل المنتج."
        );

    }

}

/* =====================================================
   EVENTS
===================================================== */

function bindProductEvents(){

    const backButton=
        document.getElementById(
            "backButton"
        );


    if(backButton){

        backButton.addEventListener(
            "click",
            event=>{

                event.preventDefault();

                goToStore();

            }
        );

    }


    document
        .querySelectorAll(".thumbnail")
        .forEach(
            thumbnail=>{

                thumbnail.addEventListener(
                    "click",
                    function(){

                        const main=
                            document.getElementById(
                                "mainProductImage"
                            );


                        if(main){

                            main.src=
                                this.dataset.image;

                        }


                        document
                            .querySelectorAll(
                                ".thumbnail"
                            )
                            .forEach(
                                item=>
                                    item.classList.remove(
                                        "active"
                                    )
                            );


                        this.classList.add(
                            "active"
                        );

                    }
                );

            }
        );


    document
        .querySelectorAll(".color-button")
        .forEach(
            button=>{

                button.addEventListener(
                    "click",
                    function(){

                        selectedColor=
                            this.dataset.color;


                        document
                            .querySelectorAll(
                                ".color-button"
                            )
                            .forEach(
                                item=>
                                    item.classList.remove(
                                        "active"
                                    )
                            );


                        this.classList.add(
                            "active"
                        );

                    }
                );

            }
        );


    const sizeSelect=
        document.getElementById(
            "sizeSelect"
        );


    if(sizeSelect){

        sizeSelect.addEventListener(
            "change",
            function(){

                selectedSize=
                    this.value;

            }
        );

    }


    const decrease=
        document.getElementById(
            "decreaseQuantity"
        );


    if(decrease){

        decrease.addEventListener(
            "click",
            function(){

                if(quantity>1){

                    quantity--;

                    updateQuantityUI();

                    updateSummary();

                }

            }
        );

    }


    const increase=
        document.getElementById(
            "increaseQuantity"
        );


    if(increase){

        increase.addEventListener(
            "click",
            function(){

                quantity++;

                updateQuantityUI();

                updateSummary();

            }
        );

    }


    const addCartButton=
        document.getElementById(
            "addCartButton"
        );


    if(addCartButton){

        addCartButton.addEventListener(
            "click",
            addCurrentProductToCart
        );

    }


    const buyButton=
        document.getElementById(
            "buyButton"
        );


    if(buyButton){

        buyButton.addEventListener(
            "click",
            function(){

                const section=
                    document.getElementById(
                        "orderSection"
                    );


                if(section){

                    section.scrollIntoView({
                        behavior:"smooth",
                        block:"start"
                    });

                }

            }
        );

    }


    const orderForm=
        document.getElementById(
            "orderForm"
        );


    if(orderForm){

        orderForm.addEventListener(
            "submit",
            submitOrder
        );

    }


    const deliveryType=
        document.getElementById(
            "deliveryType"
        );


    if(deliveryType){

        deliveryType.addEventListener(
            "change",
            updateDelivery
        );

    }


    const wilaya=
        document.getElementById(
            "customerWilaya"
        );


    if(wilaya){

        wilaya.addEventListener(
            "change",
            updateDelivery
        );

    }

}

/* =====================================================
   CART
===================================================== */

function getCart(){

    try{

        const cart=
            JSON.parse(
                localStorage.getItem(
                    "cart"
                )||"[]"
            );


        if(Array.isArray(cart)){

            return cart;

        }

    }catch(error){

        console.warn(
            "Cart loading error:",
            error
        );

    }


    return [];

}


function saveCart(cart){

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );


    if(currentStoreId){

        localStorage.setItem(
            "cartStoreId",
            String(currentStoreId)
        );

    }


    if(currentOwnerUid){

        localStorage.setItem(
            "ownerUid",
            String(currentOwnerUid)
        );

    }


    updateCartCount();

}


function addCurrentProductToCart(){

    if(!product){
        return;
    }


    const cart=
        getCart();


    const itemId=
        String(product.id)+
        "_"+
        String(selectedColor)+
        "_"+
        String(selectedSize);


    const storeId=
        String(
            product.storeId||
            currentStoreId||
            ""
        );


    const existing=
        cart.find(
            item=>
                String(
                    item.cartItemId||""
                )===itemId &&

                String(
                    item.storeId||
                    item.storeUid||
                    item.ownerUid||
                    ""
                )===storeId
        );


    const price=
        Number(
            product.price||0
        );


    if(existing){

        existing.quantity=
            Number(
                existing.quantity||0
            )+
            Number(
                quantity||1
            );

    }else{

        cart.push({

            cartItemId:
                itemId,

            id:
                product.id,

            productId:
                product.id,

            storeId:
                storeId,

            ownerUid:
                product.ownerUid||
                currentOwnerUid||
                "",

            storeName:
                currentStoreName,

            name:
                product.name||
                "منتج",

            price:
                price,

            quantity:
                Number(quantity)||1,

            color:
                selectedColor,

            size:
                selectedSize,

            image:
                product.image||
                (
                    Array.isArray(product.images)
                    ?
                    product.images[0]
                    :
                    ""
                )||
                "",

            addedAt:
                new Date().toISOString()

        });

    }


    saveCart(cart);


    const button=
        document.getElementById(
            "addCartButton"
        );


    if(button){

        button.classList.add(
            "added"
        );


        button.textContent=
            "✓ تمت الإضافة";


        setTimeout(
            ()=>{

                button.classList.remove(
                    "added"
                );

                button.textContent=
                    "أضف إلى السلة";

            },
            1500
        );

    }

}


function updateCartCount(){

    const cart=
        getCart();


    const count=
        cart.reduce(
            (total,item)=>
                total+
                Number(
                    item.quantity||0
                ),
            0
        );


    cartCount.textContent=
        count;

}


/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(){

    if(!product){
        return;
    }


    const price=
        Number(
            product.price||0
        );


    const total=
        price*quantity+
        Number(
            deliveryCost||0
        );


    const productElement=
        document.getElementById(
            "summaryProductPrice"
        );


    const deliveryElement=
        document.getElementById(
            "summaryDelivery"
        );


    const totalElement=
        document.getElementById(
            "summaryTotal"
        );


    if(productElement){

        productElement.textContent=
            formatPrice(
                price*quantity
            )+
            " دج";

    }


    if(deliveryElement){

        const selected=
            getSelectedDelivery();


        deliveryElement.textContent=
            selected
            ?
            formatPrice(
                deliveryCost
            )+" دج"
            :
            "يُحسب حسب الولاية";

    }


    if(totalElement){

        totalElement.textContent=
            formatPrice(
                total
            )+
            " دج";

    }

}


/* =====================================================
   DELIVERY PRICE
===================================================== */

function updateDelivery(){

    deliveryCost=0;


    const found=
        getSelectedDelivery();


    const typeElement=
        document.getElementById(
            "deliveryType"
        );


    const type=
        typeElement
        ?
        String(
            typeElement.value||
            "التوصيل إلى المنزل"
        )
        :
        "التوصيل إلى المنزل";


    if(!found){

        updateSummary();

        return;

    }


    if(
        type.includes("المكتب")
    ){

        deliveryCost=
            Number(
                found.office
            )||0;

    }else{

        deliveryCost=
            Number(
                found.home
            )||0;

    }


    updateSummary();

}


/* =====================================================
   PHONE
===================================================== */

function normalizePhone(phone){

    return String(
        phone||""
    )
    .trim()
    .replace(
        /[\s()-]/g,
        ""
    );

}


function isValidAlgerianPhone(phone){

    return /^(0[5-7][0-9]{8}|\+213[5-7][0-9]{8})$/
        .test(
            normalizePhone(phone)
        );

}


/* =====================================================
   SUBMIT ORDER
===================================================== */

async function submitOrder(event){

    event.preventDefault();


    if(!product){
        return;
    }


    const name=
        document
            .getElementById(
                "customerName"
            )
            .value
            .trim();


    const phone=
        normalizePhone(
            document
                .getElementById(
                    "customerPhone"
                )
                .value
        );


    const wilayaSelect=
        document.getElementById(
            "customerWilaya"
        );


    const wilayaId=
        wilayaSelect
        ?
        wilayaSelect.value.trim()
        :
        "";


    const commune=
        document
            .getElementById(
                "customerCommune"
            )
            .value
            .trim();


    const address=
        document
            .getElementById(
                "customerAddress"
            )
            .value
            .trim();


    const deliveryType=
        document
            .getElementById(
                "deliveryType"
            )
            .value;


    if(
        !name||
        !phone||
        !wilayaId||
        !commune||
        !address
    ){

        alert(
            "يرجى إدخال جميع المعلومات المطلوبة."
        );

        return;

    }


    if(
        !isValidAlgerianPhone(phone)
    ){

        alert(
            "يرجى إدخال رقم هاتف جزائري صحيح."
        );

        return;

    }


    const selected=
        getSelectedDelivery();


    if(!selected){

        alert(
            "يرجى اختيار الولاية بشكل صحيح."
        );

        return;

    }


    if(
        deliveryType.includes("المكتب")
    ){

        deliveryCost=
            Number(
                selected.office
            )||0;

    }else{

        deliveryCost=
            Number(
                selected.home
            )||0;

    }


    const price=
        Number(
            product.price||0
        );


    const productTotal=
        price*
        Number(
            quantity||1
        );


    const total=
        productTotal+
        deliveryCost;


    /*
     * UID FIRST
     */

    const finalOwnerUid=
        String(
            product.ownerUid||
            currentOwnerUid||
            localStorage.getItem(
                "ownerUid"
            )||
            ""
        );


    /*
     * REAL STORE DOCUMENT ID
     */

    const finalStoreId=
        String(
            product.storeId||
            currentStoreId||
            localStorage.getItem(
                "storeId"
            )||
            ""
        );


    if(!finalOwnerUid){

        alert(
            "تعذر تحديد صاحب المتجر."
        );

        return;

    }


    if(!finalStoreId){

        alert(
            "تعذر تحديد المتجر."
        );

        return;

    }


    const selectedWilayaName=
        String(
            selected.name||
            wilayaId
        );


    const orderProducts=[

        {

            id:
                product.id,

            name:
                product.name||
                "منتج",

            price:
                price,

            quantity:
                Number(quantity)||1,

            total:
                productTotal,

            image:
                product.image||
                (
                    Array.isArray(product.images)
                    ?
                    product.images[0]
                    :
                    ""
                )||
                "",

            color:
                selectedColor,

            size:
                selectedSize,

            ownerUid:
                finalOwnerUid,

            storeId:
                finalStoreId

        }

    ];


    const orderData={

        ownerUid:
            finalOwnerUid,

        storeId:
            finalStoreId,

        storeName:
            currentStoreName||
            "G-Glam",

        name:
            name,

        phone:
            phone,

        wilaya:
            selectedWilayaName,

        commune:
            commune,

        address:
            address,

        delivery:
            deliveryType,

        deliveryPrice:
            Number(
                deliveryCost
            ),

        deliveryWilaya:
            selectedWilayaName,

        products:
            orderProducts,

        productsTotal:
            productTotal,

        total:
            total,

        status:
            "قيد المعالجة",

        note:
            "",

        date:
            new Date().toLocaleString(
                "ar-DZ"
            ),

        createdAt:
            serverTimestamp(),

        productId:
            product.id,

        productName:
            product.name||
            "منتج",

        productPrice:
            price,

        quantity:
            Number(quantity)||1,

        color:
            selectedColor,

        size:
            selectedSize,

        productTotal:
            productTotal,

        deliveryCost:
            deliveryCost,

        customerName:
            name,

        customerPhone:
            phone,

        customerWilaya:
            selectedWilayaName,

        customerCommune:
            commune,

        customerAddress:
            address,

        deliveryType:
            deliveryType

    };


    const button=
        document.getElementById(
            "submitOrder"
        );


    button.disabled=true;

    button.textContent=
        "جاري إرسال الطلب...";


    try{

        await addDoc(
            collection(
                db,
                "orders"
            ),
            orderData
        );


        const success=
            document.getElementById(
                "successMessage"
            );


        success.style.display=
            "block";


        success.textContent=
            "تم إرسال طلبك بنجاح، سنتواصل معك لتأكيد الطلب.";


        document
            .getElementById(
                "orderForm"
            )
            .reset();


        deliveryCost=0;

        quantity=1;

        updateQuantityUI();

        updateSummary();


    }catch(error){

        console.error(
            "Order error:",
            error
        );


        alert(
            "حدث خطأ أثناء إرسال الطلب. يرجى المحاولة مرة أخرى."
        );

    }finally{

        button.disabled=false;

        button.textContent=
            "تأكيد الطلب";

    }

}

    }

}


function goToCart(){

    if(currentStoreId){

            "cart.html?store="+

            );

    }else{

        window.location.href=
            "cart.html";

    }

}

    );

}

    );

}

);
