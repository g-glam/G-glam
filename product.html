}

body.theme-custom-gradient .floating-cart,
body.theme-custom-gradient .add-cart-button,
body.theme-custom-gradient .submit-order {

body.theme-custom-gradient .add-cart-button:hover,

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Tajawal",Arial,sans-serif;
}

html {
    scroll-behavior:smooth;
}

body {
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    padding-bottom:95px;
    transition:background .25s ease,color .25s ease;
}

button,
input,
select,
textarea {
    font-family:"Tajawal",Arial,sans-serif;
}

header {
    height:70px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    background:var(--header);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:1000;
}

.logo {
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    display:flex;
    align-items:center;
    justify-content:center;
    width:max-content;
    max-width:55%;
    text-align:center;
}

.logo span {
    color:var(--accent);
    font-size:27px;
    line-height:1.2;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.menu-btn,
.cart-icon {
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
    color:var(--text);
    border-radius:10px;
}

.menu-btn:hover,
.cart-icon:hover {
    background:var(--sidebar-hover);
    color:var(--accent);
}

.menu-btn svg,
.cart-icon svg {
    width:29px;
    height:29px;
}

.cart-count {
    position:absolute;
    top:-2px;
    right:-3px;
    width:21px;
    height:21px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--accent);
    color:#FFFFFF;
    font-size:11px;
    font-weight:800;
    border:2px solid var(--header);
}

.store-info-bar {
    width:100%;
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:11px 18px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
}

.store-info-bar strong {
    color:var(--text);
}

.product-page {
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:25px;
}

.back-button {
    display:inline-flex;
    align-items:center;
    gap:8px;
    height:42px;
    padding:0 17px;
    margin-bottom:20px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--card);
    color:var(--text);
    text-decoration:none;
    font-size:14px;
    font-weight:700;
}

.back-button:hover {
    color:var(--accent);
    border-color:var(--accent);
    background:var(--sidebar-hover);
}

.back-button svg {
    width:20px;
    height:20px;
}

.product-layout {
    display:grid;
    grid-template-columns:minmax(0,1.15fr) minmax(330px,.85fr);
    gap:24px;
    align-items:start;
}

.gallery-card,
.product-info-card,
.order-section {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.gallery-card {
    padding:15px;
}

.main-image-wrapper {
    width:100%;
    border-radius:13px;
    overflow:hidden;
    background:var(--card-light);
}

.main-image {
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
}

.no-image {
    width:100%;
    aspect-ratio:1/1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    background:var(--card-light);
}

.no-image svg {
    width:65px;
    height:65px;
    color:var(--accent);
    margin-bottom:10px;
}

.thumbnails {
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding:12px 2px 3px;
}

.thumbnail {
    width:72px;
    height:72px;
    flex:0 0 72px;
    border:2px solid transparent;
    border-radius:9px;
    overflow:hidden;
    cursor:pointer;
    background:var(--card-light);
    padding:0;
}

.thumbnail.active {
    border-color:var(--accent);
}

.thumbnail img {
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.product-info-card {
    padding:24px;
}

.product-name {
    color:var(--text);
    font-size:29px;
    font-weight:800;
    line-height:1.45;
    margin-bottom:9px;
}

.product-short-description {
    color:var(--muted);
    font-size:14px;
    line-height:1.8;
    margin-bottom:15px;
}

.price-area {
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:20px;
}

.product-price {
    color:var(--accent);
    font-size:27px;
    font-weight:800;
}

.old-price {
    color:var(--muted);
    text-decoration:line-through;
    font-size:16px;
}

.description-section {
    margin-top:20px;
    padding-top:18px;
    border-top:1px solid var(--border);
}

.section-title {
    color:var(--text);
    font-size:19px;
    font-weight:800;
    margin-bottom:10px;
}

.description {
    color:var(--text);
    font-size:14px;
    line-height:2;
    word-break:break-word;
}

.description p {
    margin-bottom:9px;
}

.description img {
    max-width:100%;
    height:auto;
    border-radius:10px;
    display:block;
    margin:12px auto;
}

.descriptive-images {
    margin-top:18px;
}

.descriptive-images img {
    width:100%;
    height:auto;
    display:block;
    border-radius:12px;
    margin-bottom:12px;
    border:1px solid var(--border);
}

/* أزرار المنتج */

.product-actions {
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.product-action-button {
    width:100%;
    min-height:51px;
    border-radius:11px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.order-product-button {
    border:none;
    background:var(--accent);
    color:#FFFFFF;
}

.order-product-button:hover {
    background:var(--accent-dark);
}

.add-cart-button {
    border:2px solid var(--accent);
    background:transparent;
    color:var(--accent);
}

.add-cart-button:hover {
    background:var(--sidebar-hover);
}

.add-cart-button.added {
    background:var(--accent);
    color:#FFFFFF;
}

.option-group {
    margin-top:19px;
}

.option-label {
    display:block;
    color:var(--text);
    font-size:15px;
    font-weight:800;
    margin-bottom:9px;
}

.color-options {
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.color-button {
    min-width:48px;
    min-height:39px;
    padding:6px 12px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--card-light);
    color:var(--text);
    cursor:pointer;
    font-size:13px;
    font-weight:700;
}

.color-button.active {
    border-color:var(--accent);
    background:var(--accent);
    color:#FFFFFF;
}

.size-select {
    width:100%;
    height:46px;
    padding:0 13px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--input);
    color:var(--input-text);
    outline:none;
}

.quantity-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-top:20px;
}

.quantity-box {
    display:flex;
    align-items:center;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    background:var(--input);
}

.quantity-button {
    width:42px;
    height:42px;
    border:none;
    background:var(--card-light);
    color:var(--text);
    font-size:21px;
    cursor:pointer;
}

.quantity-value {
    width:45px;
    text-align:center;
    font-size:15px;
    font-weight:800;
}

/*
   لا يوجد هنا أي كود للمخزون.
   لا يوجد stock.
   لا يوجد inventory.
   لا يوجد زر المنتج غير متوفر.
*/

.buy-button {
    width:100%;
    height:52px;
    margin-top:20px;
    border:none;
    border-radius:11px;
    background:var(--accent);
    color:#FFFFFF;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

.buy-button:hover {
    background:var(--accent-dark);
}

.order-section {
    margin-top:25px;
    padding:24px;
}

.order-title {
    color:var(--text);
    font-size:22px;
    font-weight:800;
    margin-bottom:5px;
}

.order-subtitle {
    color:var(--muted);
    font-size:13px;
    margin-bottom:20px;
}

.form-grid {
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;
}

.form-group {
    min-width:0;
}

.form-group.full {
    grid-column:1/-1;
}

.form-label {
    display:block;
    color:var(--text);
    font-size:14px;
    font-weight:700;
    margin-bottom:7px;
}

.form-control {
    width:100%;
    height:47px;

function escapeHtml(value) {

        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

function safeUrl(value) {

    ) {

function normalizeHexColor(color) {

    if (
        typeof color !== "string"
    ) {
        return null;
    }

    let value =
        color.trim();

    if (!value) return null;

    if (!value.startsWith("#")) {
        value = "#" + value;
    }

    if (
        /^#[0-9a-fA-F]{3}$/.test(value)
    ) {

        value =
            "#" +
            value[1] + value[1] +
            value[2] + value[2] +
            value[3] + value[3];

    }

    if (
        !/^#[0-9a-fA-F]{6}$/.test(value)
    ) {

    }

    return value.toUpperCase();

}


function hexToRgb(hex) {

function rgbToHex(r,g,b) {

    const clamp =
        value =>

                0,
                Math.min(
                    255,
                    Math.round(value)
                )
            );

    return "#" +
        [r,g,b]
        .map(
            value =>
                clamp(value)
                .toString(16)
                .padStart(2,"0")
        )
        .join("")
        .toUpperCase();

}

) {

        rgb.g * (1 - amount),
        rgb.b * (1 - amount)
    );

}


function rgbaFromHex(
    hex,
    alpha = 0.08
) {

    const rgb =
        hexToRgb(hex);

    if (!rgb) {
        return `rgba(0,0,0,${alpha})`;
    }

    return `rgba(
        ${rgb.r},
        ${rgb.g},
        ${rgb.b},
        ${alpha}
    )`;

}


/* THEME */

function applyStoreTheme(
    themeOrStore
) {

    const oldThemes = [

        "theme-orange",
        "theme-blue",
        "theme-green",
        "theme-purple",
        "theme-pink",
        "theme-dark",
        "theme-red",
        "theme-teal",
        "theme-gold",
        "theme-luxury",
        "theme-sunset",
        "theme-emerald",
        "theme-navy",
        "theme-brown",
        "theme-rose",
        "theme-indigo",
        "theme-custom-solid",
        "theme-custom-gradient"

    ];

    document.body.classList.remove(
        ...oldThemes
    );

    document.body.style.removeProperty(
        "--accent"
    );

    document.body.style.removeProperty(
        "--accent-dark"
    );

    document.body.style.removeProperty(
        "--theme-gradient"
    );

    document.body.style.removeProperty(
        "--sidebar-hover"
    );


    if (
        typeof themeOrStore === "string"
    ) {

        let theme =
            String(
                themeOrStore ||
                "orange"
            )
            .toLowerCase()
            .trim();

        if (
            !validThemes.includes(theme)
        ) {
            theme = "orange";
        }

        document.body.classList.add(
            "theme-" + theme
        );

        themeColorMeta.content =
            themeColors[theme] ||
            "#FFFFFF";

        return;
    }


    const store =
        themeOrStore || {};

    const themeType =
        String(
            store.themeType || ""
        )
        .toLowerCase()
        .trim();


    if (
        themeType === "gradient" &&
        Array.isArray(store.themeColors)
    ) {

        const colors =
            store.themeColors
            .map(normalizeHexColor)
            .filter(Boolean)
            .slice(0,4);

        if (colors.length >= 2) {

            const direction =
                String(
                    store.themeDirection ||
                    "135deg"
                );

            const safeDirection =
                /^(\d{1,3}deg|to\s+(left|right|top|bottom)(\s+(left|right|top|bottom))?)$/i
                .test(direction)
                ?
                direction
                :
                "135deg";

            const gradient =
                "linear-gradient(" +
                safeDirection +
                ", " +
                colors.join(", ") +
                ")";

            document.body.classList.add(
                "theme-custom-gradient"
            );

            document.body.style.setProperty(
                "--accent",
                colors[0]
            );

            document.body.style.setProperty(
                "--accent-dark",
                darkenColor(colors[0])
            );

            document.body.style.setProperty(
                "--theme-gradient",
                gradient
            );

            document.body.style.setProperty(
                "--sidebar-hover",
                rgbaFromHex(colors[0])
            );

            themeColorMeta.content =
                colors[0];

            return;
        }
    }


    if (
        themeType === "solid"
    ) {

        const solidColor =
            normalizeHexColor(
                Array.isArray(store.themeColors)
                ?
                store.themeColors[0]
                :
                null
            )
            ||
            normalizeHexColor(
                store.themeColor
            );

        const savedTheme =
            String(
                store.theme || ""
            )
            .toLowerCase()
            .trim();

        if (
            validThemes.includes(savedTheme)
        ) {

            document.body.classList.add(
                "theme-" + savedTheme
            );

            if (solidColor) {

                document.body.style.setProperty(
                    "--accent",
                    solidColor
                );

                document.body.style.setProperty(
                    "--accent-dark",
                    darkenColor(solidColor)
                );

                document.body.style.setProperty(
                    "--sidebar-hover",
                    rgbaFromHex(solidColor)
                );

            }

            themeColorMeta.content =
                solidColor ||
                themeColors[savedTheme];

            return;
        }

        if (solidColor) {

            document.body.classList.add(
                "theme-custom-solid"
            );

            document.body.style.setProperty(
                "--accent",
                solidColor
            );

            document.body.style.setProperty(
                "--accent-dark",
                darkenColor(solidColor)
            );

            document.body.style.setProperty(
                "--sidebar-hover",
                rgbaFromHex(solidColor)
            );

            themeColorMeta.content =
                solidColor;

            return;
        }
    }


    let theme =
        String(
            store.theme ||
            "orange"
        )
        .toLowerCase()
        .trim();

    if (!validThemes.includes(theme)) {
        theme = "orange";
    }

    document.body.classList.add(
        "theme-" + theme
    );

    themeColorMeta.content =
        themeColors[theme] ||
        "#FFFFFF";

}


/* SOCIAL */

function normalizeSocialUrl(
    value,
    type
) {

    if (!value) return "";

    let url =
        String(value).trim();

    if (!url) return "";

    if (
        /^https?:\/\//i.test(url)
    ) {
        return url;
    }

    if (type === "whatsapp") {

        let number =
            url.replace(
                /[^0-9+]/g,
                ""
            );

        number =
            number.replace(
                /^\+/,
                ""
            );

        if (/^0[567]/.test(number)) {

            number =
                "213" +
                number.substring(1);

        }

        return "https://wa.me/" + number;
    }

    if (type === "instagram") {

        return "https://instagram.com/" +
            url.replace(/^@/,"");

    }

    if (type === "tiktok") {

        return "https://www.tiktok.com/@" +
            url.replace(/^@/,"");

    }

    if (type === "telegram") {

        return "https://t.me/" +
            url.replace(/^@/,"");

    }

    if (type === "facebook") {

        return "https://facebook.com/" +
            url.replace(/^@/,"");

    }

    if (type === "youtube") {

        return "https://youtube.com/" +
            url.replace(/^@/,"");

    }

    if (type === "twitter") {

        return "https://x.com/" +
            url.replace(/^@/,"");

    }

    return url;

}


function addSocialLink(
    type,
    label,
    value,
    icon
) {

    const url =
        normalizeSocialUrl(
            value,
            type
        );

    if (!url) return;

    const link =
        document.createElement("a");

    link.className =
        "social-link";

    link.href =
        url;

    link.target =
        "_blank";

    link.rel =
        "noopener noreferrer";

    link.innerHTML = `

        <svg aria-hidden="true">

            <use href="#icon-${icon}"></use>

        </svg>

        <span>
            ${escapeHtml(label)}
        </span>

    `;

    socialLinks.appendChild(link);

}

            <div class="social-empty">

        `;

}


/* STORE */

async function loadStore() {

    if (!currentStoreId) {
        return null;
    }

    try {

        const storeRef =
            doc(
                db,
                "stores",
                currentStoreId
            );

        const storeSnap =
            await getDoc(storeRef);

        if (storeSnap.exists()) {

            return {
                id:storeSnap.id,
                ...storeSnap.data()
            };

        }

    } catch(error) {

        console.error(
            "Store error:",
            error
        );

    }

    return null;

}


/* PRODUCT */

async function loadProduct() {

    if (!productId) {

        showError(
            "لم يتم تحديد المنتج."
        );

        return;

    }

    try {

        const productRef =
            doc(
                db,
                "products",
                productId
            );

        const productSnap =
            await getDoc(
                productRef
            );

        if (!productSnap.exists()) {

            showError(
                "المنتج غير موجود."
            );

            return;

        }

        product = {

            id:
                productSnap.id,

            ...productSnap.data()

        };


        if (
            currentStoreId &&
            product.storeId &&
            product.storeId !== currentStoreId
        ) {

            showError(
                "هذا المنتج لا ينتمي إلى هذا المتجر."
            );

            return;

        }


        currentStoreId =
            product.storeId ||
            currentStoreId;

        currentOwnerUid =
            product.ownerUid ||
            null;


        renderProduct();

    } catch(error) {

        console.error(
            error
        );

        showError(
            "حدث خطأ أثناء تحميل المنتج."
        );

    }

}

/* DESCRIPTION */

function formatDescription(
    text
) {

    const escaped =
        escapeHtml(text);

    return escaped
        .replace(
            /\n/g,
            "<br>"
        );

}


/* PRICE */

function formatPrice(
    value
) {

    return Number(
        value || 0
    ).toLocaleString(
        "fr-FR"
    );

}


/* EVENTS */

function bindProductEvents() {

    const backButton =
        document.getElementById(
            "backButton"
        );

    if (backButton) {

        backButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                goToStore();

            }
        );

    }


    document
        .querySelectorAll(
            ".thumbnail"
        )
        .forEach(
            thumbnail => {

                thumbnail.addEventListener(
                    "click",
                    function() {

                        const image =
                            this.dataset.image;

                        const main =
                            document.getElementById(
                                "mainProductImage"
                            );

                        if (main) {
                            main.src = image;
                        }

                        document
                            .querySelectorAll(
                                ".thumbnail"
                            )
                            .forEach(
                                item =>
                                    item.classList.remove(
                                        "active"
                                    )
                            );

                        this.classList.add(
                            "active"
                        );

                    }
                );

            }
        );


    document
        .querySelectorAll(
            ".color-button"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    function() {

                        selectedColor =
                            this.dataset.color;

                        document
                            .querySelectorAll(
                                ".color-button"
                            )
                            .forEach(
                                item =>
                                    item.classList.remove(
                                        "active"
                                    )
                            );

                        this.classList.add(
                            "active"
                        );

                    }
                );

            }
        );


    const sizeSelect =
        document.getElementById(
            "sizeSelect"
        );

    if (sizeSelect) {

        sizeSelect.addEventListener(
            "change",
            function() {

                selectedSize =
                    this.value;

            }
        );

    }


    const decrease =
        document.getElementById(
            "decreaseQuantity"
        );

    if (decrease) {

        decrease.addEventListener(
            "click",
            function() {

                if (quantity > 1) {

                    quantity--;

                    updateQuantityUI();

                    updateSummary();

                }

            }
        );

    }


    const increase =
        document.getElementById(
            "increaseQuantity"
        );

    if (increase) {

        increase.addEventListener(
            "click",
            function() {

                quantity++;

                updateQuantityUI();

                updateSummary();

            }
        );

    }


    const addCartButton =
        document.getElementById(
            "addCartButton"
        );

    if (addCartButton) {

        addCartButton.addEventListener(
            "click",
            addCurrentProductToCart
        );

    }


    const orderProductButton =
        document.getElementById(
            "orderProductButton"
        );

    if (orderProductButton) {

        orderProductButton.addEventListener(
            "click",
            function() {

                document
                    .getElementById(
                        "orderSection"
                    )
                    ?.scrollIntoView({
                        behavior:"smooth",
                        block:"start"
                    });

            }
        );

    }


    const buyButton =
        document.getElementById(
            "buyButton"
        );

    if (buyButton) {

        buyButton.addEventListener(
            "click",
            function() {

                document
                    .getElementById(
                        "orderSection"
                    )
                    ?.scrollIntoView({
                        behavior:"smooth",
                        block:"start"
                    });

            }
        );

    }


    const orderForm =
        document.getElementById(
            "orderForm"
        );

    if (orderForm) {

        orderForm.addEventListener(
            "submit",

        );

    }

        .forEach(
            radio => {

            }
        );

}


/* QUANTITY UI */

function updateQuantityUI() {

    const value =
        document.getElementById(
            "quantityValue"
        );

    if (value) {

        value.textContent =
            quantity;

    }

}


/* CART */

function getCart() {

    try {

        const cart =
            JSON.parse(
                localStorage.getItem(
                    "gglamCart"
                ) ||
                "[]"
            );

        return Array.isArray(cart)
            ?
            cart
            :
            [];

    } catch(error) {

        return [];

    }

}


function saveCart(cart) {

    localStorage.setItem(
        "gglamCart",
        JSON.stringify(cart)
    );

    updateCartCount();

}


function addCurrentProductToCart() {

    if (!product) return;

    const cart =
        getCart();

    const itemId =
        product.id +
        "_" +
        selectedColor +
        "_" +
        selectedSize;

    const existing =
        cart.find(
            item =>
                item.cartItemId === itemId
        );

    const price =
        Number(
            product.price || 0
        );


    if (existing) {

        existing.quantity =
            Number(existing.quantity || 0) +
            quantity;

    } else {

        cart.push({

            cartItemId:itemId,

            id:product.id,

            productId:product.id,

            storeId:
                product.storeId ||
                currentStoreId,

            ownerUid:
                product.ownerUid ||
                currentOwnerUid ||
                "",

            storeName:
                product.storeName ||
                currentStoreName,

            name:
                product.name ||
                "منتج",

            price:price,

            quantity:quantity,

            color:selectedColor,

            size:selectedSize,

            image:
                product.image ||
                (
                    Array.isArray(product.images)
                    ?
                    product.images[0]
                    :
                    ""
                ) ||
                "",

            addedAt:
                new Date().toISOString()

        });

    }


    saveCart(cart);


    const button =
        document.getElementById(
            "addCartButton"
        );

    if (button) {

        button.classList.add(
            "added"
        );

        button.textContent =
            "✓ تمت الإضافة إلى السلة";

        setTimeout(
            function() {

                button.classList.remove(
                    "added"
                );

                button.textContent =
                    "أضف إلى السلة";

            },
            1500
        );

    }

}


/* CART COUNT */

function updateCartCount() {

    const cart =
        getCart();

    const count =
        cart.reduce(
            (
                total,
                item
            ) =>
                total +
                Number(
                    item.quantity || 0
                ),
            0
        );

    cartCount.textContent =
        count;

}


/* SUMMARY */

function updateSummary() {

    if (!product) return;

    const price =
        Number(
            product.price || 0
        );

    const total =
        price * quantity +
        Number(deliveryCost || 0);


    const productName =
        document.getElementById(
            "summaryProduct"
        );

    const quantityElement =
        document.getElementById(
            "summaryQuantity"
        );

    const productPrice =
        document.getElementById(
            "summaryProductPrice"
        );

    const deliveryElement =
        document.getElementById(
            "summaryDelivery"
        );

    const totalElement =
        document.getElementById(
            "summaryTotal"
        );


    if (productName) {

        productName.textContent =
            product.name ||
            "منتج";

    }

    if (quantityElement) {

        quantityElement.textContent =
            quantity;

    }

    if (productPrice) {

        productPrice.textContent =
            formatPrice(
                price * quantity
            ) +
            " دج";

    }

    if (deliveryElement) {

        if (deliveryCost > 0) {

            deliveryElement.textContent =
                formatPrice(
                    deliveryCost
                ) +
                " دج";

        } else {

            deliveryElement.textContent =
                "يُحسب حسب الولاية";

        }

    }

    if (totalElement) {

        totalElement.textContent =
            formatPrice(total) +
            " دج";

    }

}


/* DELIVERY */

async function updateDelivery() {

    const wilaya =
        document.getElementById(
            "customerWilaya"
        )?.value.trim();

    const selected =
        document.querySelector(
            'input[name="deliveryType"]:checked'
        );

    const type =
        selected
        ?
        selected.value
        :
        "التوصيل إلى المنزل";


    deliveryCost = 0;


    if (!wilaya) {

        updateSummary();

        return;

    }


    try {

        let found = null;


        if (currentStoreId) {

            const deliveryRef =
                collection(
                    db,
                    "delivery"
                );

            const q =
                query(
                    deliveryRef,
                    where(
                        "storeId",
                        "==",
                        currentStoreId
                    )
                );

            const snap =
                await getDocs(q);


            snap.forEach(
                item => {

                    const data =
                        item.data();

                    const dataWilaya =
                        String(
                            data.wilaya ||
                            data.name ||
                            data.wilayaName ||
                            ""
                        )
                        .trim()
                        .toLowerCase();

                    if (
                        dataWilaya ===
                        wilaya.toLowerCase()
                    ) {

                        found = data;

                    }

                }
            );

        }


        if (!found) {

            const deliveryRef =
                collection(
                    db,
                    "delivery"
                );

            const snap =
                await getDocs(
                    deliveryRef
                );

            snap.forEach(
                item => {

                    const data =
                        item.data();

                    const dataWilaya =
                        String(
                            data.wilaya ||
                            data.name ||
                            data.wilayaName ||
                            ""
                        )
                        .trim()
                        .toLowerCase();

                    if (
                        dataWilaya ===
                        wilaya.toLowerCase()
                    ) {

                        found = data;

                    }

                }
            );

        }


        if (found) {

            if (
                type.includes("المكتب")
            ) {

                deliveryCost =
                    Number(
                        found.officePrice ||
                        found.office ||
                        found.priceOffice ||
                        found.price ||
                        0
                    );

            } else {

                deliveryCost =
                    Number(
                        found.homePrice ||
                        found.home ||
                        found.priceHome ||
                        found.price ||
                        0
                    );

            }

        }

    } catch(error) {

        console.error(
            "Delivery error:",
            error
        );

    }


    updateSummary();

}


/* ORDER */

async function submitOrder(
    event
) {

    event.preventDefault();


    if (!product) return;


    const submitButton =
        document.getElementById(
            "submitOrder"
        );

    const successMessage =
        document.getElementById(
            "successMessage"
        );


    const customerName =
        document.getElementById(
            "customerName"
        ).value.trim();

    const customerPhone =
        document.getElementById(
            "customerPhone"
        ).value.trim();

    const customerWilaya =
        document.getElementById(
            "customerWilaya"
        ).value.trim();

    const customerCommune =
        document.getElementById(
            "customerCommune"
        ).value.trim();

    const customerAddress =
        document.getElementById(
            "customerAddress"
        ).value.trim();

    const customerNotes =
        document.getElementById(
            "customerNotes"
        ).value.trim();


    const deliveryType =
        document.querySelector(
            'input[name="deliveryType"]:checked'
        )?.value ||
        "التوصيل إلى المنزل";


    if (
        !customerName ||
        !customerPhone ||
        !customerWilaya ||
        !customerAddress
    ) {

        alert(
            "يرجى إدخال جميع المعلومات المطلوبة."
        );

        return;

    }


    submitButton.disabled =
        true;

    submitButton.textContent =
        "جاري إرسال الطلب...";


    try {

        const price =
            Number(
                product.price || 0
            );

        const productTotal =
            price * quantity;

        const total =
            productTotal +
            Number(
                deliveryCost || 0
            );


        const orderData = {

            productId:
                product.id,

            productName:
                product.name ||
                "منتج",

            productPrice:
                price,

            quantity:
                quantity,

            color:
                selectedColor,

            size:
                selectedSize,

            productTotal:
                productTotal,

            deliveryCost:
                Number(
                    deliveryCost || 0
                ),

            total:
                total,

            customerName:
                customerName,

            customerPhone:
                customerPhone,

            customerWilaya:
                customerWilaya,

            customerCommune:
                customerCommune,

            customerAddress:
                customerAddress,

            customerNotes:
                customerNotes,

            deliveryType:
                deliveryType,

            storeId:
                product.storeId ||
                currentStoreId ||
                "",

            ownerUid:
                product.ownerUid ||
                currentOwnerUid ||
                "",

            storeName:
                product.storeName ||
                currentStoreName ||
                "",

            status:
                "جديد",

            createdAt:
                serverTimestamp()

        };


        await addDoc(
            collection(
                db,
                "orders"
            ),
            orderData
        );


        if (
            typeof fbq === "function"
        ) {

            fbq(
                "track",
                "Purchase",
                {
                    value:total,
                    currency:"DZD",
                    content_name:
                        product.name ||
                        "منتج"
                }
            );

        }


        if (
            window.ttq &&
            typeof window.ttq.track === "function"
        ) {

            window.ttq.track(
                "CompletePayment",
                {
                    value:total,
                    currency:"DZD",
                    content_name:
                        product.name ||
                        "منتج"
                }
            );

        }


        successMessage.style.display =
            "block";

        successMessage.textContent =
            "تم إرسال طلبك بنجاح، سنتواصل معك لتأكيد الطلب.";


        document
            .getElementById(
                "orderForm"
            )
            .reset();


        selectedColor =
            product.colors?.length
            ?
            product.colors[0]
            :
            "بدون لون";

        selectedSize =
            product.sizes?.length
            ?
            product.sizes[0]
            :
            "";


        quantity = 1;

        deliveryCost = 0;

        updateQuantityUI();

        updateSummary();


        window.scrollTo({
            top:
                successMessage
                .getBoundingClientRect()
                .top +
                window.scrollY -
                100,
            behavior:"smooth"
        });


    } catch(error) {

        console.error(
            "Order error:",
            error
        );

        alert(
            "حدث خطأ أثناء إرسال الطلب. يرجى المحاولة مرة أخرى."
        );

    } finally {

        submitButton.disabled =
            false;

        submitButton.textContent =
            "تأكيد الطلب";

    }

}

/* LOAD */

async function initializePage() {

    updateCartCount();


    /* تحميل المتجر */

    currentStore =
        await loadStore();


    if (currentStore) {

        currentStoreName =
            currentStore.name ||
            currentStore.storeName ||
            currentStore.title ||
            "G-Glam";

        headerStoreName.textContent =
            currentStoreName;


        storeInfo.innerHTML = `
            <strong>
                ${escapeHtml(currentStoreName)}
            </strong>
        `;


        applyStoreTheme(
            currentStore
        );


        renderSocialLinks();

    } else {

        headerStoreName.textContent =
            "G-Glam";

        storeInfo.innerHTML =
            "G-Glam";

        renderSocialLinks();

    }


    /* تحميل المنتج */

    await loadProduct();

}


initializePage();
