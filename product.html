<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#FFFFFF"
    id="themeColorMeta"
>

<link
    rel="manifest"
    href="manifest.json"
>

<link
    rel="apple-touch-icon"
    href="icons/icon-192.png"
>

<title>المنتج | G-Glam</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Tajawal",Arial,sans-serif;
}


/* =====================================================
   ROOT
===================================================== */

:root{

    --bg:#F5F5F5;
    --header:#F5F5F5;

    --card:#FFFFFF;
    --card-soft:#FCFCFC;

    --text:#222222;
    --text-soft:#444444;

    --muted:#777777;

    --border:#E8E8E8;

    --accent:#F47B20;
    --accent-dark:#DF6810;
    --accent-light:#FFF1E6;

    --accent-rgb:244,123,32;

    --theme-gradient:
        linear-gradient(
            135deg,
            #F47B20,
            #FF9B54
        );

    --sidebar-hover:#FFF1E6;

    --danger:#D9534F;
    --danger-bg:#FDECEC;

    --success:#198754;
    --success-bg:#EFFAF3;

    --shadow:
        0 6px 22px rgba(0,0,0,.07);

    --shadow-soft:
        0 4px 15px rgba(0,0,0,.05);

}


/* =====================================================
   BODY
===================================================== */

body{

    min-height:100vh;

    background:var(--bg);

    color:var(--text);

    padding-bottom:120px;

    transition:
        background .25s ease,
        color .25s ease;

}


/* =====================================================
   HEADER
===================================================== */

header{

    position:sticky;

    top:0;

    z-index:100;

    width:100%;

    min-height:78px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:14px 22px;

    background:var(--header);

    border-bottom:1px solid var(--border);

}


.logo{

    display:flex;

    align-items:center;

    justify-content:center;

    min-width:120px;

    max-width:240px;

    text-align:center;

}


#storeOwnerName{

    display:block;

    max-width:220px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    color:var(--text);

    font-size:20px;

    font-weight:800;

}


.menu-btn,
.cart-icon{

    width:46px;

    height:46px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:14px;

    color:var(--text);

    cursor:pointer;

    position:relative;

    transition:.2s;

}


.menu-btn{

    font-size:21px;

}


.cart-icon{

    font-size:21px;

}


.menu-btn:hover,
.cart-icon:hover{

    background:var(--accent-light);

    color:var(--accent);

}


/* =====================================================
   CART COUNT
===================================================== */

.cart-count{

    position:absolute;

    top:-4px;

    left:-4px;

    width:20px;

    height:20px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    background:var(--accent);

    color:#fff;

    font-size:10px;

    font-weight:800;

    border:2px solid var(--bg);

}


/* =====================================================
   STORE INFO
===================================================== */

.store-info{

    width:calc(100% - 30px);

    max-width:1000px;

    margin:15px auto;

    padding:13px 20px;

    border-radius:17px;

    background:var(--card);

    border:1px solid var(--border);

    box-shadow:var(--shadow-soft);

    color:var(--muted);

    text-align:center;

    font-size:14px;

}


.store-info strong{

    color:var(--text);

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

    width:calc(100% - 30px);

    max-width:1180px;

    margin:0 auto;

}


/* =====================================================
   PRODUCT
===================================================== */

.product-card{

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        minmax(0,1fr);

    gap:30px;

    background:var(--card);

    border:1px solid var(--border);

    border-radius:25px;

    padding:25px;

    box-shadow:var(--shadow);

}


/* =====================================================
   GALLERY
===================================================== */

.gallery{

    min-width:0;

}


.main-image{

    width:100%;

    height:500px;

    border-radius:20px;

    overflow:hidden;

    background:var(--accent-light);

    border:1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:center;

}


.main-image img{

    width:100%;

    height:100%;

    object-fit:contain;

    display:block;

}


.no-image{

    color:var(--muted);

    font-size:55px;

}


.thumbnails{

    display:flex;

    gap:10px;

    margin-top:14px;

    overflow-x:auto;

    padding-bottom:5px;

}


.thumbnail{

    width:72px;

    height:72px;

    flex:0 0 72px;

    border-radius:12px;

    overflow:hidden;

    border:2px solid var(--border);

    background:var(--card-soft);

    cursor:pointer;

}


.thumbnail.active{

    border-color:var(--accent);

}


.thumbnail img{

    width:100%;

    height:100%;

    object-fit:cover;

}


/* =====================================================
   PRODUCT INFO
===================================================== */

.product-info{

    display:flex;

    flex-direction:column;

    min-width:0;

}


.product-name{

    margin-bottom:10px;

    color:var(--text);

    font-size:30px;

    font-weight:800;

    line-height:1.5;

}


.product-description{

    margin-bottom:20px;

    color:var(--muted);

    font-size:15px;

    line-height:2;

}


.price-box{

    display:flex;

    align-items:center;

    flex-wrap:wrap;

    gap:12px;

    margin-bottom:22px;

}


.price{

    color:var(--accent-dark);

    font-size:27px;

    font-weight:800;

}


.old-price{

    color:#999;

    text-decoration:line-through;

    font-size:16px;

}


/* =====================================================
   OPTIONS
===================================================== */

.option-section{

    margin-bottom:18px;

}


.option-title{

    margin-bottom:8px;

    color:var(--text);

    font-size:15px;

    font-weight:800;

}


.color-options{

    display:flex;

    flex-wrap:wrap;

    gap:8px;

}


.color-btn{

    padding:9px 14px;

    border-radius:11px;

    border:1px solid var(--border);

    background:var(--card-soft);

    color:var(--text);

    cursor:pointer;

    font-size:13px;

    font-weight:700;

}


.color-btn.active{

    background:var(--accent);

    border-color:var(--accent);

    color:#fff;

}


.size-select{

    width:100%;

    padding:13px;

    border-radius:13px;

    border:1px solid var(--border);

    outline:none;

    background:var(--card-soft);

    color:var(--text);

    cursor:pointer;

}


/* =====================================================
   QUANTITY
===================================================== */

.quantity-box{

    display:flex;

    align-items:center;

    gap:14px;

    margin-bottom:20px;

}


.quantity-label{

    color:var(--text);

    font-size:14px;

    font-weight:800;

}


.quantity-controls{

    display:flex;

    align-items:center;

    gap:12px;

    padding:6px;

    border-radius:14px;

    background:var(--accent-light);

}


.quantity-btn{

    width:38px;

    height:38px;

    border:0;

    border-radius:50%;

    background:var(--accent);

    color:#fff;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

}


.quantity-value{

    min-width:30px;

    text-align:center;

    font-weight:800;

}


/* =====================================================
   PRODUCT BUTTONS
===================================================== */

.product-buttons{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

}


.add-cart-btn,
.buy-now-btn{

    min-height:52px;

    border:0;

    border-radius:15px;

    color:#fff;

    font-size:15px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;

}


.add-cart-btn{

    background:var(--accent);

}


.buy-now-btn{

    background:var(--theme-gradient);

}


.add-cart-btn:hover,
.buy-now-btn:hover{

    transform:translateY(-2px);

}


/* =====================================================
   ORDER FORM
===================================================== */

.order-form-card{

    margin-top:25px;

    background:var(--card);

    border:1px solid var(--border);

    border-radius:25px;

    padding:25px;

    box-shadow:var(--shadow);

}


.section-title{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:20px;

    color:var(--text);

    font-size:21px;

    font-weight:800;

}


.section-title i{

    color:var(--accent);

}


.notice{

    margin-bottom:20px;

    padding:13px 15px;

    border-radius:13px;

    background:var(--accent-light);

    border:1px solid
        rgba(
            var(--accent-rgb),
            .18
        );

    color:var(--accent-dark);

    font-size:13px;

    line-height:1.9;

}


.form-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:15px;

}


.form-group{

    margin-bottom:15px;

}


.form-group.full{

    grid-column:1 / -1;

}


.form-group label{

    display:block;

    margin-bottom:7px;

    color:var(--text-soft);

    font-size:13px;

    font-weight:700;

}


.required{

    color:var(--accent);

}


.form-group input,
.form-group select{

    width:100%;

    padding:13px 14px;

    border-radius:13px;

    border:1px solid var(--border);

    outline:none;

    background:var(--card-soft);

    color:var(--text);

    font-size:14px;

    transition:.2s;

}


.form-group input:focus,
.form-group select:focus{

    border-color:var(--accent);

    background:var(--card);

    box-shadow:
        0 0 0 3px
        rgba(
            var(--accent-rgb),
            .10
        );

}


.delivery-loading{

    display:none;

    margin:-5px 0 12px;

    color:var(--muted);

    font-size:12px;

}


.delivery-loading i{

    color:var(--accent);

    margin-left:5px;

}


.delivery-error{

    display:none;

    margin-bottom:15px;

    padding:12px;

    border-radius:11px;

    background:var(--danger-bg);

    border:1px solid #F5D0D0;

    color:#B42318;

    text-align:center;

    font-size:13px;

}


/* =====================================================
   TOTALS
===================================================== */

.order-totals{

    margin-top:10px;

    display:grid;

    gap:10px;

}


.total-box{

    padding:14px;

    border-radius:14px;

    background:var(--accent-light);

    color:var(--text);

    text-align:center;

    font-size:15px;

    font-weight:700;

}


.total-box strong{

    color:var(--accent-dark);

}


.total-box.final{

    background:var(--theme-gradient);

    color:#fff;

    font-size:19px;

    font-weight:800;

}


.total-box.final strong{

    color:#fff;

}


/* =====================================================
   SEND ORDER
===================================================== */

.send-order-btn{

    width:100%;

    margin-top:15px;

    min-height:54px;

    border:0;

    border-radius:16px;

    background:var(--theme-gradient);

    color:#fff;

    font-size:17px;

    font-weight:800;

    cursor:pointer;

    box-shadow:
        0 8px 24px
        rgba(
            var(--accent-rgb),
            .22
        );

}


.send-order-btn:disabled{

    background:#BDBDBD;

    cursor:not-allowed;

    box-shadow:none;

}


/* =====================================================
   SOCIAL
===================================================== */

.social-section{

    margin-top:25px;

    padding:25px;

    background:var(--card);

    border:1px solid var(--border);

    border-radius:25px;

    box-shadow:var(--shadow);

}


.social-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:10px;

}


.social-link{

    min-height:48px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    border-radius:13px;

    background:var(--accent-light);

    color:var(--accent-dark);

    text-decoration:none;

    font-size:13px;

    font-weight:700;

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

    position:fixed;

    top:0;

    right:-300px;

    z-index:999;

    width:290px;

    height:100vh;

    padding-top:25px;

    background:var(--card);

    box-shadow:
        -5px 0 20px
        rgba(0,0,0,.12);

    transition:.3s;

}


.sidebar.active{

    right:0;

}


.sidebar-title{

    padding:5px 25px 20px;

    margin-bottom:5px;

    border-bottom:1px solid var(--border);

    color:var(--text);

    font-size:24px;

    font-weight:800;

}


.sidebar a{

    display:flex;

    align-items:center;

    gap:12px;

    padding:16px 25px;

    border-bottom:1px solid var(--border);

    color:var(--text);

    text-decoration:none;

    font-size:15px;

    font-weight:600;

}


.sidebar a i{

    width:22px;

    text-align:center;

    color:var(--accent);

}


.sidebar a:hover{

    background:var(--sidebar-hover);

    color:var(--accent-dark);

}


/* =====================================================
   OVERLAY
===================================================== */

.overlay{

    position:fixed;

    inset:0;

    z-index:998;

    display:none;

    background:rgba(0,0,0,.40);

}


.overlay.active{

    display:block;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    min-height:300px;

    display:flex;

    align-items:center;

    justify-content:center;

    color:var(--muted);

}


.loading i{

    margin-left:7px;

    color:var(--accent);

}


/* =====================================================
   THEMES
===================================================== */

.theme-orange{
    --accent:#F47B20;
    --accent-dark:#DF6810;
    --accent-light:#FFF1E6;
    --accent-rgb:244,123,32;
}

.theme-blue{
    --accent:#1769AA;
    --accent-dark:#0E4F84;
    --accent-light:#EAF4FC;
    --accent-rgb:23,105,170;
}

.theme-green{
    --accent:#198754;
    --accent-dark:#12633D;
    --accent-light:#EAF8F1;
    --accent-rgb:25,135,84;
}

.theme-purple{
    --accent:#7B3FC6;
    --accent-dark:#5E2999;
    --accent-light:#F3ECFB;
    --accent-rgb:123,63,198;
}

.theme-pink{
    --accent:#D94F87;
    --accent-dark:#AE3568;
    --accent-light:#FCECF3;
    --accent-rgb:217,79,135;
}

.theme-red{
    --accent:#E63946;
    --accent-dark:#B92A35;
    --accent-light:#FDECEE;
    --accent-rgb:230,57,70;
}

.theme-teal{
    --accent:#00B4D8;
    --accent-dark:#008BA8;
    --accent-light:#E8FAFE;
    --accent-rgb:0,180,216;
}

.theme-gold{
    --accent:#D4AF37;
    --accent-dark:#A7861F;
    --accent-light:#FBF6E6;
    --accent-rgb:212,175,55;
}

.theme-luxury{
    --accent:#D4AF37;
    --accent-dark:#A7861F;
    --accent-light:#211E14;
    --accent-rgb:212,175,55;
}

.theme-sunset{
    --accent:#FD1D1D;
    --accent-dark:#C91010;
    --accent-light:#FFF0E9;
    --accent-rgb:253,29,29;
}

.theme-emerald{
    --accent:#0F5132;
    --accent-dark:#093D25;
    --accent-light:#E9F5EF;
    --accent-rgb:15,81,50;
}

.theme-navy{
    --accent:#0B1F3A;
    --accent-dark:#061426;
    --accent-light:#EAF0F7;
    --accent-rgb:11,31,58;
}

.theme-brown{
    --accent:#795548;
    --accent-dark:#563A31;
    --accent-light:#F3EEEC;
    --accent-rgb:121,85,72;
}

.theme-rose{
    --accent:#BE185D;
    --accent-dark:#971247;
    --accent-light:#FBEAF2;
    --accent-rgb:190,24,93;
}

.theme-indigo{
    --accent:#4338CA;
    --accent-dark:#31279B;
    --accent-light:#EEF0FF;
    --accent-rgb:67,56,202;
}


/* =====================================================
   DARK
===================================================== */

.theme-dark{

    --bg:#07111F;
    --header:#07111F;

    --card:#0D1B2A;
    --card-soft:#102234;

    --text:#F4F7FB;
    --text-soft:#DCE5EE;

    --muted:#AAB7C7;

    --border:#1D334A;

    --accent:#F47B20;
    --accent-dark:#FF8C32;
    --accent-light:#17283A;

    --accent-rgb:244,123,32;

    --danger:#EF6461;
    --danger-bg:#351B20;

    --sidebar-hover:#17283A;

}


.theme-dark body{
    background:#07111F;
    color:#F4F7FB;
}


.theme-dark input,
.theme-dark select{
    background:#102234;
}


.theme-dark select option{
    background:#0D1B2A;
    color:#F4F7FB;
}


.theme-luxury body,
.theme-dark body{
    background:#07111F;
}


.theme-luxury header,
.theme-dark header{
    background:#07111F;
    border-bottom-color:#172A40;
}


.theme-luxury .product-card,
.theme-luxury .order-form-card,
.theme-luxury .social-section,
.theme-dark .product-card,
.theme-dark .order-form-card,
.theme-dark .social-section{
    background:#0D1B2A;
    border-color:#1D334A;
}


.theme-luxury .sidebar,
.theme-dark .sidebar{
    background:#0A1726;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:900px){

    .product-card{

        grid-template-columns:1fr;

    }

    .main-image{

        height:430px;

    }

}


@media(max-width:650px){

    body{

        padding-bottom:60px;

    }

    header{

        min-height:68px;

        padding:11px 14px;

    }

    .logo{

        min-width:100px;

        max-width:170px;

    }

    #storeOwnerName{

        max-width:160px;

        font-size:17px;

    }

    .menu-btn,
    .cart-icon{

        width:43px;

        height:43px;

    }

    .container{

        width:calc(100% - 20px);

    }

    .store-info{

        width:calc(100% - 20px);

    }

    .product-card{

        padding:15px;

        border-radius:20px;

        gap:20px;

    }

    .main-image{

        height:350px;

    }

    .product-name{

        font-size:23px;

    }

    .product-description{

        font-size:14px;

    }

    .product-buttons{

        grid-template-columns:1fr;

    }

    .form-grid{

        grid-template-columns:1fr;

        gap:0;

    }

    .form-group.full{

        grid-column:auto;

    }

    .order-form-card,
    .social-section{

        padding:15px;

        border-radius:20px;

    }

    .social-grid{

        grid-template-columns:
            repeat(2,1fr);

    }

}


@media(max-width:400px){

    .container{

        width:calc(100% - 16px);

    }

    .main-image{

        height:300px;

    }

    .product-name{

        font-size:21px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     OVERLAY
===================================================== -->

<div
    class="overlay"
    id="overlay">
</div>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<div
    class="sidebar"
    id="sidebar">

    <div
        class="sidebar-title"
        id="sidebarOwnerName">

        G-Glam

    </div>


    <a
        href="#"
        id="homeLink">

        <i class="fa-solid fa-house"></i>

        <span>
            الرئيسية
        </span>

    </a>


    <a
        href="#"
        id="cartLink">

        <i class="fa-solid fa-cart-shopping"></i>

        <span>
            السلة
        </span>

    </a>


    <a
        href="#"
        id="contactLink">

        <i class="fa-solid fa-phone"></i>

        <span>
            اتصل بنا
        </span>

    </a>

</div>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div
        class="menu-btn"
        id="menuBtn">

        <i class="fa-solid fa-bars"></i>

    </div>


    <div class="logo">

        <span id="storeOwnerName">
            G-Glam
        </span>

    </div>


    <div
        class="cart-icon"
        id="cartButton">

        <i class="fa-solid fa-cart-shopping"></i>

        <span
            class="cart-count"
            id="cartCount">

            0

        </span>

    </div>

</header>


<!-- =====================================================
     STORE INFO
===================================================== -->

<div
    class="store-info"
    id="storeInfo">

    جاري تحميل المتجر...

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


    <!-- =================================================
         PRODUCT
    ================================================== -->

    <section
        class="product-card"

/* =====================================================
   THEME HELPERS
===================================================== */

function normalizeHexColor(value){

    const v =
    String(value || "")
        .trim();


    if(
        /^#[0-9a-fA-F]{6}$/.test(v)
    ){

        return v.toUpperCase();

    }


    if(
        /^#[0-9a-fA-F]{3}$/.test(v)
    ){

        return (
            "#" +
            v[1] + v[1] +
            v[2] + v[2] +
            v[3] + v[3]
        ).toUpperCase();

    }


    return null;

}


function hexToRgb(hex){

    const normalized =
    normalizeHexColor(hex);


    if(!normalized){

        return null;

    }


    return {

        r:
        parseInt(
            normalized.slice(1,3),
            16
        ),

        g:
        parseInt(
            normalized.slice(3,5),
            16
        ),

        b:
        parseInt(
            normalized.slice(5,7),
            16
        )

    };

}


function rgbaFromHex(
    hex,
    alpha
){

    const rgb =
    hexToRgb(hex);


    if(!rgb){

        return `rgba(0,0,0,${alpha})`;

    }


    return `
        rgba(
            ${rgb.r},
            ${rgb.g},
            ${rgb.b},
            ${alpha}
        )
    `;

}


function darkenColor(
    hex,
    amount=.18
){

    const rgb =
    hexToRgb(hex);


    if(!rgb){

        return "#333333";

    }


    const factor =
    Math.max(
        0,
        Math.min(
            1,
            1 - amount
        )
    );


    const r =
    Math.round(
        rgb.r * factor
    );


    const g =
    Math.round(
        rgb.g * factor
    );


    const b =
    Math.round(
        rgb.b * factor
    );


    return (
        "#" +
        [r,g,b]
        .map(
            x =>
            x
            .toString(16)
            .padStart(2,"0")
        )
        .join("")
        .toUpperCase()
    );

}


/* =====================================================
   APPLY THEME
===================================================== */

function applyStoreTheme(
    themeOrStore
){

    const oldClasses = [

        "theme-orange",
        "theme-blue",
        "theme-green",
        "theme-purple",
        "theme-pink",
        "theme-dark",
        "theme-red",
        "theme-teal",
        "theme-gold",
        "theme-luxury",
        "theme-sunset",
        "theme-emerald",
        "theme-navy",
        "theme-brown",
        "theme-rose",
        "theme-indigo",
        "theme-custom-solid",
        "theme-custom-gradient"

    ];


    document.body.classList.remove(
        ...oldClasses
    );


    const root =
    document.documentElement;


    [
        "--accent",
        "--accent-dark",
        "--accent-light",
        "--accent-rgb",
        "--theme-gradient",
        "--sidebar-hover"
    ].forEach(
        property => {

            root.style.removeProperty(
                property
            );

        }
    );


    if(
        typeof themeOrStore ===
        "string"
    ){

        const theme =
        validThemes.includes(
            themeOrStore
        )
        ?
        themeOrStore
        :
        "orange";


        document.body.classList.add(
            `theme-${theme}`
        );


        themeColorMeta.content =
        themeColors[theme] ||
        "#FFFFFF";


        localStorage.setItem(
            "gglamStoreTheme",
            theme
        );


        localStorage.setItem(
            "gglamThemeType",
            "legacy"
        );


        return;

    }


    const store =
    themeOrStore || {};


    if(
        store.themeType === "gradient" &&
        Array.isArray(
            store.themeColors
        )
    ){

        const colors =
        store.themeColors
            .map(
                normalizeHexColor
            )
            .filter(Boolean)
            .slice(0,4);


        if(colors.length >= 2){

            let direction =
            store.themeDirection ||
            "135deg";


            if(
                !/^(?:\d+(?:\.\d+)?deg|to\s+.+)$/i
                .test(
                    String(direction)
                )
            ){

                direction =
                "135deg";

            }


            const gradient =
            `linear-gradient(
                ${direction},
                ${colors.join(",")}
            )`;


            document.body.classList.add(
                "theme-custom-gradient"
            );


            root.style.setProperty(
                "--theme-gradient",
                gradient
            );


            root.style.setProperty(
                "--accent",
                colors[0]
            );


            root.style.setProperty(
                "--accent-dark",
                darkenColor(
                    colors[0]
                )
            );


            root.style.setProperty(
                "--accent-light",
                rgbaFromHex(
                    colors[0],
                    .10
                )
            );


            const rgb =
            hexToRgb(
                colors[0]
            );


            if(rgb){

                root.style.setProperty(
                    "--accent-rgb",
                    `${rgb.r},${rgb.g},${rgb.b}`
                );

            }


            root.style.setProperty(
                "--sidebar-hover",
                rgbaFromHex(
                    colors[0],
                    .08
                )
            );


            themeColorMeta.content =
            colors[0];


            return;

        }

    }


    if(
        store.themeType === "solid"
    ){

        let solidColor =
        normalizeHexColor(
            Array.isArray(
                store.themeColors
            )
            ?
            store.themeColors[0]
            :
            null
        );


        if(!solidColor){

            solidColor =
            normalizeHexColor(
                store.themeColor
            );

        }


        const builtIn =
        validThemes.includes(
            store.theme
        )
        ?
        store.theme
        :
        null;


        if(builtIn){

            document.body.classList.add(
                `theme-${builtIn}`
            );


            themeColorMeta.content =
            themeColors[builtIn];


            return;

        }


        if(solidColor){

            document.body.classList.add(
                "theme-custom-solid"
            );


            const rgb =
            hexToRgb(
                solidColor
            );


            root.style.setProperty(
                "--accent",
                solidColor
            );


            root.style.setProperty(
                "--accent-dark",
                darkenColor(
                    solidColor
                )
            );


            root.style.setProperty(
                "--accent-light",
                rgbaFromHex(
                    solidColor,
                    .10
                )
            );


            if(rgb){

                root.style.setProperty(
                    "--accent-rgb",
                    `${rgb.r},${rgb.g},${rgb.b}`
                );

            }


            root.style.setProperty(
                "--sidebar-hover",
                rgbaFromHex(
                    solidColor,
                    .08
                )
            );


            themeColorMeta.content =
            solidColor;


            return;

        }

    }


    const fallback =
    validThemes.includes(
        store.theme
    )
    ?
    store.theme
    :
    (
        localStorage.getItem(
            "gglamStoreTheme"
        ) ||
        "orange"
    );


    const finalTheme =
    validThemes.includes(
        fallback
    )
    ?
    fallback
    :
    "orange";


    document.body.classList.add(
        `theme-${finalTheme}`
    );


    themeColorMeta.content =
    themeColors[finalTheme] ||
    "#FFFFFF";

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   SAFE URL
===================================================== */

function safeUrl(value){

    const url =
    String(value || "")
        .trim();


    if(
        /^https?:\/\//i.test(url)
    ){

        return url;

    }


    if(
        /^data:image\//i.test(url)
    ){

        return url;

    }


    return "";

}

function getCart(){

    try{

        let stored =
        localStorage.getItem(
            "cart"
        );


        if(stored){

            const parsed =
            JSON.parse(
                stored
            );


            if(
                Array.isArray(parsed)
            ){

                return parsed;

            }

        }


        const oldCart =
        localStorage.getItem(
            "gglamCart"
        );


        if(oldCart){

            const parsedOld =
            JSON.parse(
                oldCart
            );


            if(
                Array.isArray(parsedOld)
            ){

                localStorage.setItem(
                    "cart",
                    JSON.stringify(
                        parsedOld
                    )
                );


                return parsedOld;

            }

        }

    }catch(error){

        console.error(
            "CART READ ERROR:",
            error
        );

    }


    return [];

}


function saveCart(cart){

    localStorage.setItem(

    );


    if(currentStoreId){

        localStorage.setItem(
            "cartStoreId",

            "ownerUid",
            String(

            )
        );

    }

}

function updateCartCount(){

    const cart =
    getCart();


    let total = 0;


    cart.forEach(
        item => {

            const itemStore =
            String(
                item?.storeId ||
                ""
            );


            if(
                currentStoreId &&
                itemStore &&
                itemStore !==
                String(
                    currentStoreId
                )
            ){

                return;

            }


            total +=
            Math.max(
                1,
                Number(
                    item.quantity ||
                    1
                )
            );

        }
    );


    cartCount.textContent =
    total;

}

function resolveOwnerUid(){

        product.ownerUid

            product.ownerUid
        );

    }


    if(currentStore?.ownerUid){

        return String(
            currentStore.ownerUid
        );

    }


    return currentStoreId

        String(
            currentStoreId
        )
        :
        null;

}

/* =====================================================
   PRODUCT EVENTS
===================================================== */

function attachProductEvents(){

    document
    .querySelectorAll(
        ".thumbnail"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function(){

                    const image =
                    this.dataset.image;


                    const main =
                    document.getElementById(
                        "mainProductImage"
                    );


                    if(main){

                        main.src =
                        image;

                    }


                    document
                    .querySelectorAll(
                        ".thumbnail"
                    )
                    .forEach(
                        item =>
                        item.classList.remove(
                            "active"
                        )
                    );


                    this.classList.add(
                        "active"
                    );

                }
            );

        }
    );


    document
    .querySelectorAll(
        ".color-btn"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function(){

                    selectedColor =
                    this.dataset.color ||
                    "بدون لون";


                    document
                    .querySelectorAll(
                        ".color-btn"
                    )
                    .forEach(
                        item =>
                        item.classList.remove(
                            "active"
                        )
                    );


                    this.classList.add(
                        "active"
                    );


                    updateOrderButton();

                }
            );

        }
    );


    const sizeSelect =
    document.getElementById(
        "sizeSelect"
    );


    if(sizeSelect){

        sizeSelect.addEventListener(
            "change",
            function(){

                selectedSize =
                this.value ||
                "";


                updateOrderButton();

            }
        );

    }


    const minus =
    document.getElementById(
        "minusQuantity"
    );


    const plus =
    document.getElementById(
        "plusQuantity"
    );


    const quantityValue =
    document.getElementById(
        "quantityValue"
    );


    if(minus){

        minus.addEventListener(
            "click",
            function(){

                quantity =
                Math.max(
                    1,
                    quantity - 1
                );


                quantityValue.textContent =
                quantity;


                updateOrderTotals();

                updateOrderButton();

            }
        );

    }


    if(plus){

        plus.addEventListener(
            "click",
            function(){

                const stock =
                product?.stock;


                if(
                    stock !== null &&
                    stock !== undefined &&
                    stock !== "" &&
                    !Number.isNaN(
                        Number(stock)
                    )
                ){

                    if(
                        quantity >=
                        Number(stock)
                    ){

                        alert(
                            "❌ لا توجد كمية إضافية متوفرة."
                        );

                        return;

                    }

                }


                quantity++;


                quantityValue.textContent =
                quantity;


                updateOrderTotals();

                updateOrderButton();

            }
        );

    }


    const addCartBtn =
    document.getElementById(
        "addCartBtn"
    );


    if(addCartBtn){

        addCartBtn.addEventListener(
            "click",
            addCurrentProductToCart
        );

    }


    const buyNowBtn =
    document.getElementById(
        "buyNowBtn"
    );


    if(buyNowBtn){

        buyNowBtn.addEventListener(
            "click",
            function(){

                const form =
                document.getElementById(
                    "orderFormCard"
                );


                if(form){

                    form.scrollIntoView({
                        behavior:"smooth",
                        block:"start"
                    });

                }

            }
        );

    }

}


/* =====================================================
   ADD PRODUCT TO CART
===================================================== */

function addCurrentProductToCart(){

    if(!product){

        return;

    }


    const cart =
    getCart();


    const itemId =
    `${product.id}_${selectedColor}_${selectedSize}`;


    const storeId =
    String(
        product.storeId ||
        currentStoreId ||
        ""
    );


    const ownerUid =
    resolveOwnerUid();


    const existing =
    cart.find(
        item =>

        String(
            item.cartItemId
        ) ===
        itemId &&

        String(
            item.storeId ||
            ""
        ) ===
        storeId

    );


    if(existing){

        const newQuantity =
        Math.max(
            1,
            Number(
                existing.quantity ||
                1
            )
        ) +
        quantity;


        const stock =
        product.stock;


        if(
            stock !== null &&
            stock !== undefined &&
            stock !== "" &&
            !Number.isNaN(
                Number(stock)
            ) &&
            newQuantity >
            Number(stock)
        ){

            alert(
                "❌ لا توجد كمية إضافية متوفرة."
            );

            return;

        }


        existing.quantity =
        newQuantity;

    }else{

        cart.push({

            cartItemId:
            itemId,

            id:
            String(
                product.id
            ),

            productId:
            String(
                product.id
            ),

            storeId:
            storeId,

            ownerUid:
            String(
                ownerUid ||
                ""
            ),

            storeName:
            currentStoreName,

            name:
            String(
                product.name ||
                "منتج"
            ),

            price:
            Number(
                product.price ||
                0
            ),

            quantity:
            quantity,

            color:
            selectedColor,

            size:
            selectedSize,

            image:
            safeUrl(
                product.image ||
                (
                    Array.isArray(
                        product.images
                    )
                    ?
                    product.images[0]
                    :
                    ""
                )
            ),

            addedAt:
            new Date().toISOString()

        });

    }


    saveCart(
        cart
    );


    updateCartCount();


    const button =
    document.getElementById(
        "addCartBtn"
    );


    if(button){

        const original =
        button.innerHTML;


        button.innerHTML = `

            <i class="fa-solid fa-check"></i>

            تمت الإضافة

        `;


        setTimeout(
            function(){

                button.innerHTML =
                original;

            },
            1500
        );

    }

}

/* =====================================================
   LOAD DELIVERY
   نفس مصدر cart.html
===================================================== */

async function loadDelivery(){

    deliveryLoading.style.display =
    "block";


    deliveryError.style.display =
    "none";


    wilayaSelect.innerHTML = `

        <option value="">
            جاري تحميل الولايات...
        </option>

    `;


    deliveryItems = [];


    try{

        const ownerUid =
        getStoreOwnerUid();


        if(!ownerUid){

            throw new Error(
                "تعذر تحديد صاحب المتجر."
            );

        }


        /*
         * نفس مسار cart.html:
         *
         * stores/{ownerUid}/delivery
         */

        const deliveryRef =
        collection(
            db,
            "stores",
            String(
                ownerUid
            ),
            "delivery"
        );


        const snapshot =
        await getDocs(
            deliveryRef
        );


        snapshot.forEach(
            docSnap => {

                const data =
                docSnap.data();


                const wilayaName =
                data.name ||
                data.wilaya ||
                data.title ||
                docSnap.id;


                const officeValue =
                data.office ??
                data.officePrice ??
                data.bureau ??
                data.bureauPrice ??
                0;


                const homeValue =
                data.home ??
                data.homePrice ??
                data.domicile ??
                data.homeDelivery ??
                0;


                deliveryItems.push({

                    id:
                    docSnap.id,

                    name:
                    String(
                        wilayaName
                    ),

                    office:
                    Number(
                        officeValue
                    ) || 0,

                    home:
                    Number(
                        homeValue
                    ) || 0

                });

            }
        );


        deliveryItems.sort(
            (a,b) => {

                const aMatch =
                String(a.id)
                    .match(/\d+/);


                const bMatch =
                String(b.id)
                    .match(/\d+/);


                const aNum =
                aMatch
                ?
                parseInt(
                    aMatch[0]
                )
                :
                NaN;


                const bNum =
                bMatch
                ?
                parseInt(
                    bMatch[0]
                )
                :
                NaN;


                if(
                    !Number.isNaN(aNum) &&
                    !Number.isNaN(bNum)
                ){

                    return aNum - bNum;

                }


                return a.name.localeCompare(
                    b.name,
                    "ar"
                );

            }
        );


        wilayaSelect.innerHTML = `

            <option value="">
                اختر الولاية
            </option>

        `;


        if(
            deliveryItems.length === 0
        ){

            wilayaSelect.innerHTML = `

                <option value="">
                    لا توجد ولايات متاحة
                </option>

            `;


            deliveryError.textContent =
            "❌ لا توجد أسعار توصيل لهذا المتجر حاليًا.";


            deliveryError.style.display =
            "block";

        }else{

            deliveryItems.forEach(
                item => {

                    const option =
                    document.createElement(
                        "option"
                    );


                    option.value =
                    item.id;


                    option.textContent =
                    item.name;


                    wilayaSelect.appendChild(
                        option
                    );

                }
            );

        }


        deliveryLoading.style.display =
        "none";


        updateDelivery();

        updateOrderButton();


    }catch(error){

        console.error(
            "DELIVERY LOAD ERROR:",
            error
        );


        wilayaSelect.innerHTML = `

            <option value="">
                تعذر تحميل الولايات
            </option>

        `;


        deliveryError.textContent =
        "❌ تعذر تحميل أسعار التوصيل لهذا المتجر.";


        deliveryError.style.display =
        "block";


        deliveryLoading.style.display =
        "none";

    }

}

        deliveryCost =
        0;


        deliveryPriceElement.textContent =
        "سعر التوصيل: --";

    }


    if(
        type ===
        "إلى المكتب"

        Number(

    }else{

        Number(

                deliveryCost

            DA

    updateFinalTotal();

/* =====================================================
   PRODUCT TOTAL
===================================================== */

function getProductTotal(){

    if(!product){

        return 0;

    }


    return (
        Math.max(
            0,
            Number(
                product.price ||
                0
            )
        ) *
        Math.max(
            1,
            Number(
                quantity ||
                1
            )
        )
    );

}

/* =====================================================
   PHONE VALIDATION
===================================================== */

function validatePhone(phone){

    const normalized =
    String(phone)
        .replace(
            /[\s\-().]/g,
            ""
        );


    return /^0(5|6|7)[0-9]{8}$/
        .test(
            normalized
        );

}

/* =====================================================
   SOCIAL URL
===================================================== */

function normalizeSocialUrl(
    type,
    value
){

    const raw =
    String(
        value || ""
    )
    .trim();


    if(!raw){

        return "";

    }


    if(
        /^https?:\/\//i.test(raw)
    ){

        return raw;

    }


    const encoded =
    encodeURIComponent(
        raw
    );


    switch(type){

        case "whatsapp":

            return (
                "https://wa.me/" +
                raw.replace(
                    /[^0-9+]/g,
                    ""
                )
            );


        case "instagram":

            return (
                "https://instagram.com/" +
                raw.replace(
                    /^@/,
                    ""
                )
            );


        case "tiktok":

            return (
                "https://www.tiktok.com/@" +
                raw.replace(
                    /^@/,
                    ""
                )
            );


        case "telegram":

            return (
                "https://t.me/" +
                raw.replace(
                    /^@/,
                    ""
                )
            );


        case "facebook":

            return (
                "https://facebook.com/" +
                raw.replace(
                    /^@/,
                    ""
                )
            );


        case "youtube":

            return (
                "https://youtube.com/" +
                raw
            );


        case "twitter":

            return (
                "https://x.com/" +
                raw.replace(
                    /^@/,
                    ""
                )
            );


        case "phone":

            return (
                "tel:" +
                raw
            );


        default:

            return raw;

    }

}

function loadSocialLinks(){

    currentStore ||

    const socials = [

            label:"واتساب",
            icon:"fa-brands fa-whatsapp"
        },

        {
            type:"facebook",

        },

        {
            type:"instagram",
            key:"instagram",
            label:"إنستغرام",
            icon:"fa-brands fa-instagram"
        },

        {
            type:"tiktok",
            key:"tiktok",
            label:"تيك توك",
            icon:"fa-brands fa-tiktok"
        },

        {
            type:"youtube",
            key:"youtube",
            label:"يوتيوب",
            icon:"fa-brands fa-youtube"
        },

        {
            type:"telegram",
            key:"telegram",
            label:"تيليغرام",
            icon:"fa-brands fa-telegram"
        },

        {
            type:"twitter",
            key:"twitter",
            label:"X",
            icon:"fa-brands fa-x-twitter"
        },

        {
            type:"phone",
            key:"phone",
            label:"الهاتف",
            icon:"fa-solid fa-phone"
        }

    ];


    const html =
    socials
    .map(
        item => {

            const value =
            data[item.key] ||
            data.socials?.[item.key] ||
            "";


            const url =
            normalizeSocialUrl(
                item.type,
                value
            );


            if(!url){

            return `

                <a
                    class="social-link"
                    href="${escapeHtml(
                        url
                    )}"
                    target="_blank"
                    rel="noopener noreferrer">

                    <i class="${item.icon}"></i>

                    ${item.label}

                </a>

            `;

        }
    )
    .join("");


    grid.innerHTML =
    html;

}
