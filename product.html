<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#F5F5F5">

<link rel="manifest"
href="manifest.json">

<link rel="apple-touch-icon"
href="icons/icon-192.png">

<title>المنتج | G-Glam</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

/* =====================================================
   COLORS
===================================================== */

:root{

--bg:#F4F4F4;
--card:#FFFFFF;
--text:#222222;
--accent:#F47B20;
--accent-dark:#DF6810;
--accent-light:#FFF1E6;
--muted:#777777;
--border:#E8E8E8;
--danger:#D9534F;
--shadow:0 6px 22px rgba(0,0,0,.07);

}

/* =====================================================
   RESET
===================================================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Tajawal",Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
min-height:100vh;
padding-bottom:40px;
}

/* =====================================================
   HEADER
===================================================== */

header{

display:flex;
align-items:center;
justify-content:space-between;

padding:15px 20px;

background:var(--bg);

position:sticky;
top:0;
z-index:100;

}

.logo{
display:flex;
align-items:center;
justify-content:center;
}

.logo img{

width:120px;
height:auto;
max-height:55px;
object-fit:contain;
display:block;

}

.menu-btn,
.cart-icon{

font-size:27px;
cursor:pointer;

position:relative;

width:45px;
height:45px;

display:flex;
align-items:center;
justify-content:center;

border-radius:12px;

transition:.2s;

}

.menu-btn:hover,
.cart-icon:hover{

background:var(--accent-light);

}

.cart-count{

position:absolute;

top:-5px;
left:-5px;

background:var(--accent);
color:#fff;

font-size:11px;
font-weight:bold;

width:20px;
height:20px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

}

/* =====================================================
   STORE INFO
===================================================== */

.store-info{

width:calc(100% - 30px);
max-width:900px;

margin:10px auto 18px;

background:#fff;

border:1px solid var(--border);

border-radius:18px;

padding:12px 18px;

text-align:center;

color:var(--muted);

font-size:14px;

box-shadow:var(--shadow);

}

.store-info strong{
color:var(--text);
font-weight:800;
}

/* =====================================================
   CONTAINER
===================================================== */

.container{

width:calc(100% - 30px);
max-width:1000px;

margin:0 auto;

}

/* =====================================================
   BACK
===================================================== */

.back-btn{

display:inline-flex;

align-items:center;

gap:6px;

margin-bottom:15px;

padding:10px 15px;

border-radius:12px;

background:var(--accent-light);

color:var(--accent-dark);

text-decoration:none;

font-size:14px;
font-weight:700;

}

/* =====================================================
   PRODUCT CARD
===================================================== */

.product-card{

background:var(--card);

border:1px solid var(--border);

border-radius:25px;

box-shadow:var(--shadow);

padding:20px;

display:grid;

grid-template-columns:1fr 1fr;

gap:30px;

position:relative;

overflow:hidden;

}

.product-card::before{

content:"";

position:absolute;

right:0;
top:0;

width:6px;
height:100%;

background:var(--accent);

}

/* =====================================================
   IMAGES
===================================================== */

.gallery{

width:100%;

}

.main-image{

width:100%;

height:430px;

border-radius:20px;

overflow:hidden;

background:#F2F2F2;

border:1px solid var(--border);

display:flex;

align-items:center;

justify-content:center;

}

.main-image img{

width:100%;
height:100%;

object-fit:contain;

display:block;

}

.thumbnails{

display:flex;

gap:10px;

margin-top:12px;

overflow-x:auto;

padding-bottom:5px;

}

.thumbnail{

width:72px;
height:72px;

flex-shrink:0;

border-radius:12px;

overflow:hidden;

border:2px solid transparent;

background:#F2F2F2;

cursor:pointer;

}

.thumbnail.active{

border-color:var(--accent);

}

.thumbnail img{

width:100%;
height:100%;

object-fit:cover;

}

/* =====================================================
   PRODUCT INFO
===================================================== */

.product-info{

display:flex;

flex-direction:column;

justify-content:flex-start;

}

.product-name{

font-size:28px;

font-weight:800;

line-height:1.5;

margin-bottom:10px;

}

.product-price{

font-size:24px;

font-weight:800;

color:var(--accent-dark);

margin-bottom:18px;

}

.description{

font-size:15px;

line-height:2;

color:var(--muted);

margin-bottom:20px;

white-space:pre-line;

}

/* =====================================================
   OPTIONS
===================================================== */

.option-group{

margin-bottom:18px;

}

.option-label{

display:block;

font-size:14px;

font-weight:800;

margin-bottom:8px;

}

select,
input{

width:100%;

padding:13px 14px;

border:1px solid var(--border);

border-radius:13px;

background:#F8F8F8;

font-size:14px;

outline:none;

color:#333;

}

select:focus,
input:focus{

border-color:var(--accent);

background:#fff;

box-shadow:0 0 0 3px rgba(244,123,32,.10);

}

/* =====================================================
   COLORS
===================================================== */

.color-options{

display:flex;

flex-wrap:wrap;

gap:8px;

}

.color-btn{

border:1px solid var(--border);

background:#fff;

padding:9px 14px;

border-radius:10px;

cursor:pointer;

font-size:13px;

font-weight:600;

}

.color-btn.active{

background:var(--accent);

color:#fff;

border-color:var(--accent);

}

/* =====================================================
   QUANTITY
===================================================== */

.quantity-box{

display:flex;

align-items:center;

justify-content:center;

gap:18px;

background:#F7F7F7;

padding:10px;

border-radius:14px;

margin-bottom:18px;

}

.qty-btn{

width:42px;
height:42px;

border:none;

border-radius:50%;

background:var(--accent);

color:#fff;

font-size:23px;

font-weight:800;

cursor:pointer;

display:flex;

align-items:center;
justify-content:center;

}

.qty-btn:disabled{

background:#BDBDBD;

cursor:not-allowed;

}

.qty-number{

font-size:19px;

font-weight:800;

min-width:35px;

text-align:center;

}

/* =====================================================
   STOCK
===================================================== */

.stock{

font-size:13px;

color:var(--muted);

margin-bottom:15px;

}

.stock.available{

color:#198754;

}

.stock.empty{

color:#D9534F;

font-weight:700;

}

/* =====================================================
   ADD BUTTON
===================================================== */

.add-cart-btn{

width:100%;

padding:16px;

border:none;

border-radius:15px;

background:var(--accent);

color:#fff;

font-size:17px;

font-weight:800;

cursor:pointer;

transition:.2s;

box-shadow:0 7px 18px rgba(244,123,32,.25);

}

.add-cart-btn:hover{

background:var(--accent-dark);

transform:translateY(-1px);

}

.add-cart-btn:disabled{

background:#BDBDBD;

box-shadow:none;

cursor:not-allowed;

transform:none;

}

/* =====================================================
   MESSAGE
===================================================== */

.message{

display:none;

padding:12px;

border-radius:12px;

font-size:14px;

font-weight:700;

text-align:center;

margin-bottom:15px;

}

.message.success{

display:block;

background:#EFFAF3;

color:#198754;

border:1px solid #C9EAD5;

}

.message.error{

display:block;

background:#FDECEC;

color:#B42318;

border:1px solid #F5D0D0;

}

/* =====================================================
   LOADING
===================================================== */

.loading{

text-align:center;

padding:80px 20px;

font-size:16px;

color:var(--muted);

}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

position:fixed;

top:0;

right:-280px;

width:280px;

height:100%;

background:#fff;

box-shadow:-4px 0 15px rgba(0,0,0,.1);

z-index:999;

transition:.3s;

padding-top:30px;

}

.sidebar.active{
right:0;
}

.sidebar-title{

padding:0 25px 20px;

font-size:24px;

font-weight:800;

border-bottom:1px solid #eee;

margin-bottom:5px;

}

.sidebar a{

display:flex;

align-items:center;

gap:10px;

padding:16px 25px;

text-decoration:none;

color:#222;

font-size:16px;

font-weight:600;

border-bottom:1px solid #eee;

}

.sidebar a:hover{

background:var(--accent-light);

color:var(--accent-dark);

}

/* =====================================================
   OVERLAY
===================================================== */

.overlay{

position:fixed;

inset:0;

background:rgba(0,0,0,.35);

display:none;

z-index:998;

}

.overlay.active{
display:block;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

header{
padding:13px 12px;
}

.logo img{
width:105px;
max-height:50px;
}

.container{
width:calc(100% - 20px);
}

.product-card{

display:block;

padding:14px;

border-radius:20px;

}

.main-image{

height:330px;

border-radius:17px;

}

.product-info{

padding-top:20px;

}

.product-name{

font-size:22px;

}

.product-price{

font-size:21px;

}

}

/* =====================================================
   DESKTOP DARK BLUE MODE
===================================================== */

@media(min-width:1000px){

:root{

--bg:#07111F;
--card:#0D1B2A;
--text:#F4F7FB;
--accent:#F47B20;
--accent-dark:#FF8C32;
--accent-light:#17283A;
--muted:#AAB7C7;
--border:#1D334A;

}

body{
background:#07111F;
color:#F4F7FB;
}

header{
background:#07111F;
border-bottom:1px solid #172A40;
}

.store-info{
background:#0D1B2A;
border-color:#1D334A;
}

.store-info strong{
color:#F4F7FB;
}

.product-card{
background:#0D1B2A;
border-color:#1D334A;
box-shadow:0 8px 28px rgba(0,0,0,.30);
}

.main-image{
background:#142538;
border-color:#1D334A;
}

.thumbnail{
background:#142538;
}

.product-name{
color:#F4F7FB;
}

.description{
color:#AAB7C7;
}

.option-label{
color:#E8EEF5;
}

select,
input{

background:#102234;
color:#F4F7FB;
border-color:#1D334A;

}

select:focus,
input:focus{

background:#0D1B2A;

}

.color-btn{

background:#102234;
color:#E8EEF5;
border-color:#1D334A;

}

.color-btn.active{

background:#F47B20;
color:#fff;

}

.quantity-box{
background:#142538;
}

.qty-number{
color:#F4F7FB;
}

.stock{
color:#AAB7C7;
}

.sidebar{
background:#0A1726;
}

.sidebar-title{
color:#F4F7FB;
border-bottom-color:#1A2D42;
}

.sidebar a{
color:#E8EEF5;
border-bottom-color:#1A2D42;
}

.sidebar a:hover{
background:#17283A;
color:#FF8C32;
}

}

@media(max-width:999px){

body{
background:#F4F4F4;
color:#222;
}

header{
background:#F4F4F4;
}

.product-card{
background:#fff;
border-color:#E8E8E8;
}

}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="overlay" id="overlay"></div>

<div class="sidebar" id="sidebar">

<div class="sidebar-title">
G-Glam
</div>

<a href="#" id="homeLink">
🏠
<span>الرئيسية</span>
</a>

<a href="#" id="cartLink">
🛒
<span>السلة</span>
</a>

<a
href="https://www.facebook.com/share/1BNEuBhjHV/"
target="_blank">

📞
<span>اتصل بنا</span>

</a>

</div>


<!-- HEADER -->

<header>

<div class="menu-btn" id="menuBtn">
☰
</div>

<div class="logo">

<img
src="logotrans.png"
alt="G-Glam">

</div>

<div class="cart-icon" id="cartButton">

🛒

<span
class="cart-count"
id="cartCount">

0

</span>

</div>

</header>


<!-- STORE -->

<div
class="store-info"
id="storeInfo">

جاري تحميل المتجر...

</div>


<div class="container">

<a
href="#"
id="backBtn"
class="back-btn">

→ العودة إلى المتجر

</a>


<div
id="productContainer">

<div class="loading">

⏳ جاري تحميل المنتج...

</div>

</div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* =====================================================
   URL
===================================================== */

const params =
new URLSearchParams(
window.location.search
);

const productId =
params.get("id") ||
params.get("product");

const urlStoreId =
params.get("store");


/* =====================================================
   ELEMENTS
===================================================== */

const productContainer =
document.getElementById(
"productContainer"
);

const storeInfo =
document.getElementById(
"storeInfo"
);

const cartCount =
document.getElementById(
"cartCount"
);

const homeLink =
document.getElementById(
"homeLink"
);

const cartLink =
document.getElementById(
"cartLink"
);

const cartButton =
document.getElementById(
"cartButton"
);

const backBtn =
document.getElementById(
"backBtn"
);


/* =====================================================
   VARIABLES
===================================================== */

let product = null;

let currentStoreId =
urlStoreId ||
localStorage.getItem("cartStoreId") ||
null;

let currentStoreName =
"G-Glam";

let selectedColor =
"بدون لون";

let selectedSize =
"بدون قياس";

let quantity = 1;

let images = [];

let selectedImage = 0;


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

return String(value ?? "")

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
   STORE
===================================================== */

async function loadStore(){

if(!currentStoreId){

storeInfo.innerHTML =
"متجر: <strong>G-Glam</strong>";

return;

}

try{

const ref =
doc(
db,
"stores",
currentStoreId
);

const snap =
await getDoc(ref);

if(snap.exists()){

const data =
snap.data();

currentStoreName =
data.storeName ||
data.name ||
"G-Glam";

}

}catch(error){

console.error(
"STORE ERROR:",
error
);

}

storeInfo.innerHTML = `

متجر:

<strong>
${escapeHtml(currentStoreName)}
</strong>

`;

const storeQuery =
"?store=" +
encodeURIComponent(
currentStoreId
);

homeLink.href =
"index.html" +
storeQuery;

cartLink.href =
"cart.html" +
storeQuery;

cartButton.onclick =
function(){

window.location.href =
"cart.html" +
storeQuery;

};

backBtn.href =
"index.html" +
storeQuery;

}


/* =====================================================
   GET PRODUCT
===================================================== */

async function loadProduct(){

if(!productId){

productContainer.innerHTML = `

<div class="loading">

❌ لم يتم تحديد المنتج.

</div>

`;

return;

}

try{

const productRef =
doc(
db,
"products",
productId
);

const productSnap =
await getDoc(productRef);

if(!productSnap.exists()){

productContainer.innerHTML = `

<div class="loading">

❌ المنتج غير موجود.

</div>

`;

return;

}

product = {

id:
productSnap.id,

...productSnap.data()

};


/*
=======================================================
 IMPORTANT:
 STORE ID / OWNER UID
=======================================================
*/

const productStoreId =

product.storeId ||
product.storeUid ||
product.ownerUid ||
"";


if(
!currentStoreId &&
productStoreId
){

currentStoreId =
productStoreId;

localStorage.setItem(
"cartStoreId",
currentStoreId
);

}

if(
currentStoreId &&
productStoreId &&
currentStoreId !== productStoreId
){

console.warn(
"Product store differs from URL store."
);

}


renderProduct();

}catch(error){

console.error(
"PRODUCT ERROR:",
error
);

productContainer.innerHTML = `

<div class="loading">

❌ تعذر تحميل المنتج.

<br><br>

${escapeHtml(
error.message
)}

</div>

`;

}

}


/* =====================================================
   RENDER
===================================================== */

function renderProduct(){

const price =
Number(
product.price || 0
);

const stock =
product.stock;

images = [];

if(
Array.isArray(product.images)
){

images =
product.images.filter(
image => image
);

}

if(
product.image &&
!images.includes(product.image)
){

images.unshift(
product.image
);

}

if(
images.length === 0
){

images = [""];

}

const colors =
Array.isArray(product.colors)
? product.colors
: [];

const sizes =
Array.isArray(product.sizes)
? product.sizes
: [];


/* COLORS */

let colorsHtml = "";

if(colors.length){

colorsHtml = `

<div class="option-group">

<label class="option-label">

اللون

</label>

<div class="color-options">

${colors.map(

(color,index) => `

<button
type="button"
class="color-btn ${index === 0 ? "active" : ""}"
data-color="${escapeHtml(color)}">

${escapeHtml(color)}

</button>

`

).join("")}

</div>

</div>

`;

selectedColor =
colors[0];

}


/* SIZES */

let sizesHtml = "";

if(sizes.length){

selectedSize =
sizes[0];

sizesHtml = `

<div class="option-group">

<label class="option-label">

القياس

</label>

<select id="sizeSelect">

${sizes.map(

(size,index) => `

<option
value="${escapeHtml(size)}"
${index === 0 ? "selected" : ""}>

${escapeHtml(size)}

</option>

`

).join("")}

</select>

</div>

`;

}


let stockText =
"الكمية متوفرة";

let stockClass =
"available";

if(
stock !== undefined &&
stock !== null &&
stock !== ""
){

if(
Number(stock) <= 0
){

stockText =
"❌ المنتج غير متوفر";

stockClass =
"empty";

}else{

stockText =
"الكمية المتوفرة: " +
Number(stock);

}

}


productContainer.innerHTML = `

<div class="product-card">


<div class="gallery">

<div class="main-image">

${
images[selectedImage]

?

`

<img
id="mainProductImage"
src="${escapeHtml(images[selectedImage])}"
alt="${escapeHtml(product.name || "منتج")}"
>

`

:

`

<div style="font-size:50px">
📷
</div>

`

}

</div>


<div class="thumbnails">

${images.map(

(image,index) => `

<div
class="thumbnail ${index === 0 ? "active" : ""}"
data-image="${index}">

${
image

?

`

<img
src="${escapeHtml(image)}"
alt=""
>

`

:

"📷"

}

</div>

`

).join("")}

</div>

</div>


<div class="product-info">


<h1 class="product-name">

${escapeHtml(
product.name || "منتج"
)}

</h1>


<div class="product-price">

${price} DA

</div>


<div class="description">

${escapeHtml(
product.description ||
"لا توجد وصفية لهذا المنتج."
)}

</div>


${colorsHtml}

${sizesHtml}


<div class="stock ${stockClass}">

${stockText}

</div>


<div class="quantity-box">

<button
class="qty-btn"
id="minusBtn">

−

</button>


<span
class="qty-number"
id="qtyNumber">

1

</span>


<button
class="qty-btn"
id="plusBtn">

+

</button>

</div>


<div
id="message"
class="message">

</div>


<button
class="add-cart-btn"
id="addCartBtn"
${stock !== undefined &&
stock !== null &&
stock !== "" &&
Number(stock) <= 0
? "disabled"
: ""}>

🛒 إضافة إلى السلة

</button>


</div>

</div>

`;


setupProductEvents();

}


/* =====================================================
   PRODUCT EVENTS
===================================================== */

function setupProductEvents(){

const plusBtn =
document.getElementById(
"plusBtn"
);

const minusBtn =
document.getElementById(
"minusBtn"
);

const qtyNumber =
document.getElementById(
"qtyNumber"
);

const addBtn =
document.getElementById(
"addCartBtn"
);

plusBtn.onclick =
function(){

const stock =
product.stock;

if(
stock !== undefined &&
stock !== null &&
stock !== "" &&
!isNaN(Number(stock))
){

if(
quantity >= Number(stock)
){

showMessage(
"❌ لا توجد كمية إضافية متوفرة.",
"error"
);

return;

}

}

quantity++;

qtyNumber.textContent =
quantity;

};


minusBtn.onclick =
function(){

addBtn.onclick =

/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(){

if(!product){

return;

}


const productStoreId =

product.storeId ||
product.storeUid ||
product.ownerUid ||
currentStoreId ||
"";


if(
currentStoreId &&
productStoreId &&
currentStoreId !== productStoreId
){

showMessage(
"❌ هذا المنتج تابع لمتجر مختلف.",
"error"
);

return;

}


/* =====================================================
   CART
===================================================== */

let cart =

JSON.parse(
localStorage.getItem("cart")
) || [];


const ownerUid =

product.ownerUid ||
product.storeUid ||
product.storeId ||
currentStoreId ||
localStorage.getItem("ownerUid") ||
"";


/*
=======================================================
 IMPORTANT MULTI-STORE LOGIC
=======================================================
*/

if(
currentStoreId
){

const existingDifferentStore =
cart.some(

item => {

const itemStore =
item.storeId ||
item.storeUid ||
item.ownerUid ||
"";

return (
itemStore &&
itemStore !== currentStoreId
);

}

);


if(existingDifferentStore){

const confirmChange =
confirm(

"السلة تحتوي على منتجات من متجر آخر.\n\n" +

"هل تريد إفراغ السلة وإضافة هذا المنتج؟"

);

if(!confirmChange){

return;

}

cart = [];

}

}


/* =====================================================
   SAME PRODUCT / OPTIONS
===================================================== */

const existingIndex =
cart.findIndex(

item =>

String(item.id) ===
String(product.id)

&&

(
item.storeId ||
item.storeUid ||
item.ownerUid ||
""
) === productStoreId

&&

(item.color || "بدون لون") ===
selectedColor

&&

(item.size || "بدون قياس") ===
selectedSize

);


if(existingIndex !== -1){

const newQuantity =

Number(
cart[existingIndex].quantity || 1
) +
quantity;


if(
product.stock !== undefined &&
product.stock !== null &&
product.stock !== "" &&
!isNaN(Number(product.stock)) &&
newQuantity > Number(product.stock)
){

showMessage(
"❌ الكمية المطلوبة تتجاوز المخزون المتوفر.",
"error"
);

return;

}


cart[existingIndex].quantity =
newQuantity;

}else{


const image =

product.image ||

(
Array.isArray(product.images) &&
product.images.length
?
product.images[0]
:
""
);


cart.push({

id:
product.id,

name:
product.name || "منتج",

price:
Number(product.price || 0),

quantity:
quantity,

stock:
product.stock ?? null,

image:
image,

images:
Array.isArray(product.images)
?
product.images
:
[],

color:
selectedColor,

size:
selectedSize,

storeId:
productStoreId,

storeUid:
product.storeUid ||
productStoreId,

ownerUid:
ownerUid

});

}


/* SAVE */

localStorage.setItem(
"cart",
JSON.stringify(cart)
);


if(currentStoreId){

localStorage.setItem(
"cartStoreId",
currentStoreId
);

}


updateCartCount();


showMessage(
"تمت إضافة المنتج إلى السلة ✅",
"success"
);


/* BUTTON */

const addBtn =
document.getElementById(
"addCartBtn"
);

if(addBtn){

addBtn.textContent =
"✅ تمت الإضافة إلى السلة";

setTimeout(

function(){

addBtn.textContent =
"🛒 إضافة إلى السلة";

},

1800

);

}

}


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount(){

const cart =

JSON.parse(
localStorage.getItem("cart")
) || [];


let total = 0;


cart.forEach(

item => {

const itemStore =

item.storeId ||
item.storeUid ||
item.ownerUid ||
"";


if(
!currentStoreId ||
!itemStore ||
itemStore === currentStoreId
){

total +=
Number(
item.quantity || 1
);

}

});


cartCount.textContent =
total;

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
text,
type
){

const message =
document.getElementById(
"message"
);

if(!message)
return;

message.textContent =
text;

message.className =
"message " +
type;

setTimeout(

function(){

message.className =
"message";

},

3000

);

}

===================================================== */

);

);

);

});

   START
===================================================== */

await loadStore();

await loadProduct();

updateCartCount();


console.log(
"G-Glam Product Started"
);
