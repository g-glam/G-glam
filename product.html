* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Tajawal",Arial,sans-serif;
}

html {
    scroll-behavior:smooth;
}

body {
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    padding-bottom:95px;
    transition:
        background .25s ease,
        color .25s ease;
}

button,
input,
select,
textarea {
    font-family:"Tajawal",Arial,sans-serif;
}

/* HEADER */

header {
    height:70px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    background:var(--header);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:1000;
}

.logo {
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    display:flex;
    align-items:center;
    justify-content:center;
    width:max-content;
    max-width:55%;
    text-align:center;
}

.logo span {
    color:var(--accent);
    font-size:27px;
    line-height:1.2;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.store-logo {
    width:43px;
    height:43px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--accent);
    display:none;
}

.menu-btn,
.cart-icon {
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
    color:var(--text);
    border-radius:10px;
}

.menu-btn:hover,
.cart-icon:hover {
    background:var(--sidebar-hover);
    color:var(--accent);
}

.menu-btn svg,
.cart-icon svg {
    width:29px;
    height:29px;
}

.cart-count {
    position:absolute;
    top:-2px;
    right:-3px;
    width:21px;
    height:21px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--accent);
    color:#FFFFFF;
    font-size:11px;
    font-weight:800;
    border:2px solid var(--header);
}

/* STORE INFO */

.store-info-bar {
    width:100%;
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:11px 18px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
}

.store-info-bar strong {
    color:var(--text);
}

/* PRODUCT PAGE */

.product-page {
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:25px;
}

/* BACK */

.back-button {
    display:inline-flex;
    align-items:center;
    gap:8px;
    height:42px;
    padding:0 17px;
    margin-bottom:20px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--card);
    color:var(--text);
    text-decoration:none;
    font-size:14px;
    font-weight:700;
}

.back-button:hover {
    color:var(--accent);
    border-color:var(--accent);
    background:var(--sidebar-hover);
}

.back-button svg {
    width:20px;
    height:20px;
}

/* PRODUCT LAYOUT */

.product-layout {
    display:grid;
    grid-template-columns:
        minmax(0,1.15fr)
        minmax(330px,.85fr);
    gap:24px;
    align-items:start;
}

/* GALLERY */

.gallery-card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:15px;
    box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.main-image-wrapper {
    width:100%;
    border-radius:13px;
    overflow:hidden;
    background:var(--card-light);
    position:relative;
}

.main-image {
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
}

.no-image {
    width:100%;
    aspect-ratio:1/1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    background:var(--card-light);
}

.no-image svg {
    width:65px;
    height:65px;
    color:var(--accent);
    margin-bottom:10px;
}

/* THUMBNAILS */

.thumbnails {
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding:12px 2px 3px;
}

.thumbnail {
    width:72px;
    height:72px;
    flex:0 0 72px;
    border:2px solid transparent;
    border-radius:9px;
    overflow:hidden;
    cursor:pointer;
    background:var(--card-light);
    padding:0;
}

.thumbnail.active {
    border-color:var(--accent);
}

.thumbnail img {
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* PRODUCT INFO */

.product-info-card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:24px;
    box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.product-name {
    color:var(--text);
    font-size:29px;
    font-weight:800;
    line-height:1.45;
    margin-bottom:9px;
}

.product-short-description {
    color:var(--muted);
    font-size:14px;
    line-height:1.8;
    margin-bottom:15px;
}

.price-area {
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:20px;
}

.product-price {
    color:var(--accent);
    font-size:27px;
    font-weight:800;
}

.old-price {
    color:var(--muted);
    text-decoration:line-through;
    font-size:16px;
}

/* DESCRIPTION */

.description-section {
    margin-top:20px;
    padding-top:18px;
    border-top:1px solid var(--border);
}

.section-title {
    color:var(--text);
    font-size:19px;
    font-weight:800;
    margin-bottom:10px;
}

.description {
    color:var(--text);
    font-size:14px;
    line-height:2;
    word-break:break-word;
}

.description p {
    margin-bottom:9px;
}

.description img {
    max-width:100%;
    height:auto;
    border-radius:10px;
    display:block;
    margin:12px auto;
}

/* DESCRIPTIVE IMAGES */

.descriptive-images {
    margin-top:18px;
}

.descriptive-images img {
    width:100%;
    height:auto;
    display:block;
    border-radius:12px;
    margin-bottom:12px;
    border:1px solid var(--border);
}

/* OPTIONS */

.option-group {
    margin-top:19px;
}

.option-label {
    display:block;
    color:var(--text);
    font-size:15px;
    font-weight:800;
    margin-bottom:9px;
}

.color-options {
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.color-button {
    min-width:48px;
    min-height:39px;
    padding:6px 12px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--card-light);
    color:var(--text);
    cursor:pointer;
    font-size:13px;
    font-weight:700;
}

.color-button.active {
    border-color:var(--accent);
    background:var(--accent);
    color:#FFFFFF;
}

.size-select {
    width:100%;
    height:46px;
    padding:0 13px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--input);
    color:var(--input-text);
    outline:none;
}

.size-select:focus {
    border-color:var(--accent);
}

/* QUANTITY */

.quantity-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-top:20px;
}

.quantity-box {
    display:flex;
    align-items:center;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    background:var(--input);
}

.quantity-button {
    width:42px;
    height:42px;
    border:none;
    background:var(--card-light);
    color:var(--text);
    font-size:21px;
    cursor:pointer;
}

.quantity-value {
    width:45px;
    text-align:center;
    font-size:15px;
    font-weight:800;
}

/* =====================================================
   PRODUCT ACTION BUTTONS
===================================================== */

.product-action-buttons {
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:20px;
}

/* اطلب المنتج - أحمر */

.product-action-buttons .buy-button {
    width:100%;
    height:52px;
    margin-top:0;
    border:1px solid #E63946;
    border-radius:11px;
    background:#E63946;
    color:#FFFFFF;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.product-action-buttons .buy-button:hover {
    background:#C92F3B;
    border-color:#C92F3B;
    transform:translateY(-1px);
}

.product-action-buttons .buy-button:disabled {
    background:#9CA3AF;
    border-color:#9CA3AF;
    color:#FFFFFF;
    cursor:not-allowed;
    transform:none;
}

/* أضف إلى السلة - أبيض بإطار أسود */

.add-cart-button {
    width:100%;
    height:52px;
    border:1.5px solid #111111;
    border-radius:11px;
    background:#FFFFFF;
    color:#111111;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.add-cart-button svg {
    width:22px;
    height:22px;
}

.add-cart-button:hover {
    background:#F5F5F5;
    border-color:#000000;
    transform:translateY(-1px);
}

.add-cart-button.added {
    background:#FFFFFF;
    color:#111111;
    border-color:#111111;
}

.add-cart-button:disabled {
    background:#F3F4F6;
    color:#9CA3AF;
    border-color:#9CA3AF;
    cursor:not-allowed;
    transform:none;
}

/* ORDER */

.order-section {
    margin-top:25px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:24px;
    box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.order-title {
    color:var(--text);
    font-size:22px;
    font-weight:800;
    margin-bottom:5px;
}

.order-subtitle {
    color:var(--muted);
    font-size:13px;
    margin-bottom:20px;
}

/* FORM */

.form-grid {
    display:grid;
    grid-template-columns:
        repeat(2,minmax(0,1fr));
    gap:14px;
}

.form-group {
    min-width:0;
}

.form-group.full {
    grid-column:1/-1;
}

.form-label {
    display:block;
    color:var(--text);
    font-size:14px;
    font-weight:700;
    margin-bottom:7px;
}

.form-control {
    width:100%;
    height:47px;
    padding:0 13px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:var(--input);
    color:var(--input-text);
    font-size:14px;
}

textarea.form-control {
    height:95px;
    padding:12px 13px;
    resize:vertical;
}

.form-control:focus {
    border-color:var(--accent);
}

.delivery-types {
    display:grid;
    grid-template-columns:
        repeat(2,minmax(0,1fr));
    gap:9px;
}

.delivery-option {
    position:relative;
}

.delivery-option input {
    position:absolute;
    opacity:0;
    pointer-events:none;
}

.delivery-label {
    min-height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--card-light);
    color:var(--text);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
}

.delivery-option input:checked + .delivery-label {
    border-color:var(--accent);
    background:var(--sidebar-hover);
    color:var(--accent);
}

/* TOTALS */

.order-summary {
    margin-top:20px;
    border-top:1px solid var(--border);
    padding-top:17px;
}

.summary-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    color:var(--muted);
    font-size:14px;
    margin-bottom:10px;
}

.summary-row strong {
    color:var(--text);
}

.summary-total {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:13px;
    padding-top:13px;
    border-top:1px dashed var(--border);
    color:var(--text);
    font-size:18px;
    font-weight:800;
}

.total-value {
    color:var(--accent);
}

/* SUBMIT */

.submit-order {
    width:100%;
    min-height:52px;
    margin-top:20px;
    border:none;
    border-radius:11px;
    background:var(--accent);
    color:#FFFFFF;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

.submit-order:hover {
    background:var(--accent-dark);
}

.submit-order:disabled {
    background:#9CA3AF;
    cursor:not-allowed;
}

/* SOCIAL */

.social-section {
    width:100%;
    max-width:1100px;
    margin:45px auto 30px;
    padding:0 25px;
    scroll-margin-top:90px;
}

.social-box {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:28px 20px;
    text-align:center;
    box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.social-title {
    color:var(--text);
    font-size:24px;
    font-weight:800;
    margin-bottom:7px;
}

.social-description {
    color:var(--muted);
    font-size:14px;
    margin-bottom:22px;
}

.social-links {
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:12px;
}

.social-link {
    min-width:125px;
    min-height:48px;
    padding:10px 16px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--card-light);
    color:var(--text);
    text-decoration:none;
    font-size:14px;
    font-weight:700;
}

.social-link:hover {
    border-color:var(--accent);
    color:var(--accent);
    background:var(--sidebar-hover);
}

.social-link svg {
    width:22px;
    height:22px;
}

.social-empty {
    color:var(--muted);
    font-size:14px;
    padding:10px;
}

/* FLOATING CART */

.floating-cart {
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    width:calc(100% - 50px);
    max-width:540px;
    height:53px;
    background:var(--accent);
    color:#FFFFFF;
    text-decoration:none;
    border-radius:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    font-size:16px;
    font-weight:800;
    box-shadow:0 8px 25px rgba(0,0,0,.18);
    z-index:900;
}

.floating-cart:hover {
    background:var(--accent-dark);
}

.floating-cart svg {
    width:22px;
    height:22px;
}

/* SIDEBAR */

.sidebar {
    position:fixed;
    top:0;
    right:-300px;
    width:280px;
    height:100vh;
    background:var(--sidebar);
    border-left:1px solid var(--border);
    box-shadow:-5px 0 25px rgba(0,0,0,.25);
    z-index:2000;
    transition:right .3s ease;
    padding-top:80px;
}

.sidebar.active {
    right:0;
}

.sidebar a {
    display:flex;
    align-items:center;
    gap:13px;
    padding:17px 25px;
    color:var(--text);
    text-decoration:none;
    border-bottom:1px solid var(--border);
    font-size:16px;
}

.sidebar a:hover {
    background:var(--sidebar-hover);
    color:var(--accent);
}

.sidebar a svg {
    width:22px;
    height:22px;
}

/* OVERLAY */

.overlay {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    z-index:1900;
}

.overlay.active {
    display:block;
}

/* LOADING */

.loading-page {
    min-height:65vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    text-align:center;
}

.loading-page svg {
    width:42px;
    height:42px;
    margin-bottom:12px;
    animation:spin 1s linear infinite;
}

@keyframes spin {

    from {
        transform:rotate(0deg);
    }

    to {
        transform:rotate(360deg);
    }

}

/* ERROR */

.error-box {
    max-width:650px;
    margin:50px auto;
    padding:45px 25px;
    text-align:center;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
}

.error-box svg {
    width:55px;
    height:55px;
    color:var(--danger);
    margin-bottom:12px;
}

.error-box h2 {
    color:var(--text);
    margin-bottom:8px;
}

.error-box p {
    color:var(--muted);
}

/* SCROLLBAR */

::-webkit-scrollbar {
    width:7px;
    height:7px;
}

::-webkit-scrollbar-track {
    background:var(--bg);
}

::-webkit-scrollbar-thumb {
    background:#9CA3AF;
    border-radius:10px;
}

/* TABLET */

@media (max-width:900px) {

    .product-layout {
        grid-template-columns:1fr;
    }

    .product-info-card {
        position:static;
    }

}

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

/* SAFE URL */

function safeUrl(value) {

    if (!value) return "";

    const url =
        String(value).trim();

    if (
        /^https?:\/\//i.test(url) ||
        /^data:image\//i.test(url)
    ) {
        return url;
    }

    return "";

}

/* COLOR HELPERS */

function normalizeHexColor(color) {

    if (typeof color !== "string")
        return null;

    let value =
        color.trim();

    if (!value)
        return null;

    if (!value.startsWith("#"))
        value = "#" + value;

    if (
        /^#[0-9a-fA-F]{3}$/.test(value)
    ) {

        value =
            "#" +
            value[1] + value[1] +
            value[2] + value[2] +
            value[3] + value[3];

    }

    if (
        !/^#[0-9a-fA-F]{6}$/.test(value)
    ) {
        return null;
    }

    return value.toUpperCase();

}

function hexToRgb(hex) {

    const value =
        normalizeHexColor(hex);

    if (!value)
        return null;

    return {

        r:
            parseInt(
                value.substring(1,3),
                16
            ),

        g:
            parseInt(
                value.substring(3,5),
                16
            ),

        b:
            parseInt(
                value.substring(5,7),
                16
            )

    };

}

function rgbToHex(r,g,b) {

    const clamp =
        value =>
            Math.max(
                0,
                Math.min(
                    255,
                    Math.round(value)
                )
            );

    return "#" +

        [
            r,
            g,
            b
        ]

        .map(
            value =>
                clamp(value)
                .toString(16)
                .padStart(2,"0")
        )

        .join("")

        .toUpperCase();

}

function darkenColor(
    hex,
    amount=0.20
) {

    const rgb =
        hexToRgb(hex);

    if (!rgb)
        return "#333333";

    return rgbToHex(

        rgb.r * (1 - amount),

        rgb.g * (1 - amount),

        rgb.b * (1 - amount)

    );

}

function rgbaFromHex(
    hex,
    alpha=0.08
) {

    const rgb =
        hexToRgb(hex);

    if (!rgb)
        return `rgba(0,0,0,${alpha})`;

    return `
        rgba(
            ${rgb.r},
            ${rgb.g},
            ${rgb.b},
            ${alpha}
        )
    `;

}

/* APPLY THEME */

function applyStoreTheme(themeOrStore) {

    const oldThemeClasses = [

        "theme-orange",
        "theme-blue",
        "theme-green",
        "theme-purple",
        "theme-pink",
        "theme-dark",
        "theme-red",
        "theme-teal",
        "theme-gold",
        "theme-luxury",
        "theme-sunset",
        "theme-emerald",
        "theme-navy",
        "theme-brown",
        "theme-rose",
        "theme-indigo",
        "theme-custom-solid",
        "theme-custom-gradient"

    ];

    document.body.classList.remove(
        ...oldThemeClasses
    );

    document.body.style.removeProperty(
        "--accent"
    );

    document.body.style.removeProperty(
        "--accent-dark"
    );

    document.body.style.removeProperty(
        "--theme-gradient"
    );

    document.body.style.removeProperty(
        "--sidebar-hover"
    );

    if (
        typeof themeOrStore === "string"
    ) {

        let theme =
            String(
                themeOrStore ||
                "orange"
            )
            .toLowerCase()
            .trim();

        if (
            !validThemes.includes(theme)
        ) {
            theme = "orange";
        }

        document.body.classList.add(
            "theme-" + theme
        );

        themeColorMeta.content =
            themeColors[theme] ||
            "#FFFFFF";

        return;

    }

    const store =
        themeOrStore || {};

    const themeType =
        String(
            store.themeType ||
            ""
        )
        .toLowerCase()
        .trim();

    if (
        themeType === "gradient" &&
        Array.isArray(
            store.themeColors
        )
    ) {

        const colors =
            store.themeColors
                .map(normalizeHexColor)
                .filter(Boolean)
                .slice(0,4);

        if (colors.length >= 2) {

            const direction =
                String(
                    store.themeDirection ||
                    "135deg"
                ).trim();

            const safeDirection =
                /^(\d{1,3}deg|to\s+(left|right|top|bottom)(\s+(left|right|top|bottom))?)$/i
                    .test(direction)
                    ?
                    direction
                    :
                    "135deg";

            const gradient =
                "linear-gradient(" +
                safeDirection +
                ", " +
                colors.join(", ") +
                ")";

            const firstColor =
                colors[0];

            document.body.classList.add(
                "theme-custom-gradient"
            );

            document.body.style.setProperty(
                "--accent",
                firstColor
            );

            document.body.style.setProperty(
                "--accent-dark",
                darkenColor(firstColor)
            );

            document.body.style.setProperty(
                "--theme-gradient",
                gradient
            );

            document.body.style.setProperty(
                "--sidebar-hover",
                rgbaFromHex(firstColor)
            );

            themeColorMeta.content =
                firstColor;

            return;

        }

    }

    if (themeType === "solid") {

        const solidColor =
            normalizeHexColor(
                Array.isArray(
                    store.themeColors
                )
                ?
                store.themeColors[0]
                :
                null
            ) ||
            normalizeHexColor(
                store.themeColor
            );

        const savedTheme =
            String(
                store.theme ||
                ""
            )
            .toLowerCase()
            .trim();

        if (
            validThemes.includes(
                savedTheme
            )
        ) {

            document.body.classList.add(
                "theme-" +
                savedTheme
            );

            themeColorMeta.content =
                solidColor ||
                themeColors[
                    savedTheme
                ] ||
                "#FFFFFF";

            return;

        }

        if (solidColor) {

            document.body.classList.add(
                "theme-custom-solid"
            );

            document.body.style.setProperty(
                "--accent",
                solidColor
            );

            document.body.style.setProperty(
                "--accent-dark",
                darkenColor(solidColor)
            );

            document.body.style.setProperty(
                "--sidebar-hover",
                rgbaFromHex(solidColor)
            );

            themeColorMeta.content =
                solidColor;

            return;

        }

    }

    let theme =
        String(
            store.theme ||
            "orange"
        )
        .toLowerCase()
        .trim();

    if (
        !validThemes.includes(theme)
    ) {
        theme = "orange";
    }

    document.body.classList.add(
        "theme-" + theme
    );

    themeColorMeta.content =
        themeColors[theme] ||
        "#FFFFFF";

}

/* SOCIAL URL */

function normalizeSocialUrl(
    value,
    type
) {

    if (!value)
        return "";

    let url =
        String(value).trim();

    if (!url)
        return "";

    if (
        /^https?:\/\//i.test(url)
    ) {
        return url;
    }

    if (type === "whatsapp") {

        let number =
            url.replace(
                /[^0-9+]/g,
                ""
            );

        number =
            number.replace(
                /^\+/,
                ""
            );

        if (/^0[567]/.test(number)) {

            number =
                "213" +
                number.substring(1);

        }

        return (
            "https://wa.me/" +
            number
        );

    }

    if (type === "instagram") {

        return (
            "https://instagram.com/" +
            url.replace(/^@/,"")
        );

    }

    if (type === "tiktok") {

        return (
            "https://www.tiktok.com/@" +
            url.replace(/^@/,"")
        );

    }

    if (type === "telegram") {

        return (
            "https://t.me/" +
            url.replace(/^@/,"")
        );

    }

    if (type === "facebook") {

        return (
            "https://facebook.com/" +
            url.replace(/^@/,"")
        );

    }

    if (type === "youtube") {

        return (
            "https://youtube.com/" +
            url.replace(/^@/,"")
        );

    }

    if (type === "twitter") {

        return (
            "https://x.com/" +
            url.replace(/^@/,"")
        );

    }

    return url;

}

/* ADD SOCIAL */

function addSocialLink(
    type,
    label,
    value,
    icon
) {

    const url =
        normalizeSocialUrl(
            value,
            type
        );

    if (!url)
        return;

    const link =
        document.createElement("a");

    link.className =
        "social-link";

    link.href =
        url;

    link.target =
        "_blank";

    link.rel =
        "noopener noreferrer";

    link.innerHTML = `

        <svg aria-hidden="true">

            <use
                href="#icon-${icon}"
            ></use>

        </svg>

        <span>
            ${escapeHtml(label)}
        </span>

    `;

    socialLinks.appendChild(
        link
    );

}

/* LOAD STORE */

async function loadStoreForProduct() {

    try {

        let storeSnap = null;

        if (currentOwnerUid) {

            const ownerStoreRef =
                doc(
                    db,
                    "stores",
                    currentOwnerUid
                );

            const ownerStoreSnap =
                await getDoc(
                    ownerStoreRef
                );

            if (
                ownerStoreSnap.exists()
            ) {

                storeSnap =
                    ownerStoreSnap;

            }

        }

        if (
            !storeSnap &&
            currentStoreId
        ) {

            const storeRef =
                doc(
                    db,
                    "stores",
                    currentStoreId
                );

            const fallbackSnap =
                await getDoc(
                    storeRef
                );

            if (
                fallbackSnap.exists()
            ) {

                storeSnap =
                    fallbackSnap;

            }

        }

        if (!storeSnap) {

            currentStore = null;

            currentStoreName =
                product?.storeName ||
                "G-Glam";

            headerStoreName.textContent =
                currentStoreName;

            storeInfo.innerHTML =
                "متجر: <strong>" +
                escapeHtml(
                    currentStoreName
                ) +
                "</strong>";

            renderSocialLinks();

            updateNavigationLinks();

            return;

        }

        currentStore =
            storeSnap.data();

        currentOwnerUid =
            storeSnap.id;

        currentStoreId =
            storeSnap.id;

        localStorage.setItem(
            "storeId",
            currentStoreId
        );

        localStorage.setItem(
            "storeDocumentId",
            currentStoreId
        );

        localStorage.setItem(
            "ownerUid",
            currentOwnerUid
        );

        const status =
            String(
                currentStore.status ||
                "approved"
            )
            .toLowerCase()
            .trim();

        if (
            status !== "approved" &&
            status !== "active"
        ) {

            showError(
                "هذا المتجر غير متاح حاليًا."
            );

            return;

        }

        const storeName =
            currentStore.storeName ||
            currentStore.name ||
            product?.storeName ||
            "G-Glam";

        currentStoreName =
            storeName;

        headerStoreName.textContent =
            storeName;

        document.title =
            product?.name
            ?
            product.name +
            " | " +
            storeName
            :
            storeName +
            " | المنتج";

        storeInfo.innerHTML =
            "متجر: <strong>" +
            escapeHtml(storeName) +
            "</strong>";

        applyStoreTheme(
            currentStore
        );

        renderSocialLinks();

        updateNavigationLinks();

    } catch(error) {

        console.error(
            "STORE ERROR:",
            error
        );

    }

}

/* LOAD PRODUCT */

async function loadProduct() {

    try {

        if (!productId) {

            showError(
                "لم يتم تحديد المنتج."
            );

            return;

        }

        const productRef =
            doc(
                db,
                "products",
                productId
            );

        const productSnap =
            await getDoc(
                productRef
            );

        if (
            !productSnap.exists()
        ) {

            showError(
                "المنتج غير موجود."
            );

            return;

        }

        product = {

            id:
                productSnap.id,

            ...productSnap.data()

        };

        currentOwnerUid =
            product.ownerUid ||
            product.ownerId ||
            product.uid ||
            null;

        currentStoreId =
            currentStoreId ||
            product.storeId ||
            currentOwnerUid;

        await loadStoreForProduct();

        applyStoreTheme(
            currentStore ||
            product.theme ||
            "orange"
        );

        renderProduct();

        updateCartCount();

        await loadDelivery();

        updateOrderTotals();

        setupProductEvents();

    } catch(error) {

        console.error(
            "PRODUCT LOAD ERROR:",
            error
        );

        showError(
            "حدث خطأ أثناء تحميل المنتج."
        );

    }

}

/* PRODUCT IMAGES */

function getProductImages() {

    let images = [];

    if (
        Array.isArray(
            product.images
        )
    ) {

        images =
            product.images
                .filter(Boolean)
                .map(safeUrl)
                .filter(Boolean);

    }

    if (
        !images.length &&
        product.image
    ) {

        const image =
            safeUrl(
                product.image
            );

        if (image)
            images.push(image);

    }

    return images;

}

/* DESCRIPTIVE IMAGES */

function getDescriptiveImages() {

    if (
        !Array.isArray(
            product.descriptiveImages
        )
    ) {
        return [];
    }

    const visible =
        product.descriptiveImagesVisible ??
        product.showDescriptiveImages ??
        true;

    if (!visible)
        return [];

    return product.descriptiveImages
        .filter(Boolean)
        .map(safeUrl)
        .filter(Boolean);

}

/* EVENTS */

function setupProductEvents() {

    const backButton =
        document.getElementById(
            "backButton"
        );

    if (backButton) {

        backButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                goToStore();

            }
        );

    }

    document
        .querySelectorAll(
            ".thumbnail"
        )
        .forEach(
            thumbnail => {

                thumbnail.addEventListener(
                    "click",
                    function() {

                        const image =
                            this.dataset.image;

                        const mainImage =
                            document.getElementById(
                                "mainProductImage"
                            );

                        if (
                            mainImage &&
                            image
                        ) {

                            mainImage.src =
                                image;

                        }

                        document
                            .querySelectorAll(
                                ".thumbnail"
                            )
                            .forEach(
                                item =>
                                    item.classList.remove(
                                        "active"
                                    )
                            );

                        this.classList.add(
                            "active"
                        );

                    }
                );

            }
        );

    document
        .querySelectorAll(
            ".color-button"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    function() {

                        selectedColor =
                            this.dataset.color ||
                            "بدون لون";

                        document
                            .querySelectorAll(
                                ".color-button"
                            )
                            .forEach(
                                item =>
                                    item.classList.remove(
                                        "active"
                                    )
                            );

                        this.classList.add(
                            "active"
                        );

                        updateOrderButton();

                    }
                );

            }
        );

    const sizeSelect =
        document.getElementById(
            "sizeSelect"
        );

    if (sizeSelect) {

        sizeSelect.addEventListener(
            "change",
            function() {

                selectedSize =
                    this.value || "";

                updateOrderButton();

            }
        );

    }

    const decrease =
        document.getElementById(
            "decreaseQuantity"
        );

    const increase =
        document.getElementById(
            "increaseQuantity"
        );

    if (decrease) {

        decrease.addEventListener(
            "click",
            function() {

                if (
                    quantity > 1
                ) {

                    quantity--;

                    updateQuantityDisplay();

                    updateOrderTotals();

                }

            }
        );

    }

    if (increase) {

        increase.addEventListener(
            "click",
            function() {

                const stock =
                    Number(
                        product?.stock ?? 0
                    );

                if (
                    stock > 0 &&
                    quantity < stock
                ) {

                    quantity++;

                    updateQuantityDisplay();

                    updateOrderTotals();

                }

            }
        );

    }

    /* اطلب المنتج */

    const buyButton =
        document.getElementById(
            "buyButton"
        );

    if (buyButton) {

        buyButton.addEventListener(
            "click",
            function() {

                const orderSection =
                    document.getElementById(
                        "orderSection"
                    );

                if (orderSection) {

                    orderSection.scrollIntoView({
                        behavior:"smooth",
                        block:"start"
                    });

                }

            }
        );

    }

    /* أضف إلى السلة */

    const addCartButton =
        document.getElementById(
            "addCartButton"
        );

    if (addCartButton) {

        addCartButton.addEventListener(
            "click",
            function() {

                addCurrentProductToCart();

            }
        );

    }

    const inputs = [

        "customerName",
        "customerPhone",
        "wilaya",
        "commune",
        "address"

    ];

    inputs.forEach(
        id => {

            const element =
                document.getElementById(
                    id
                );

            if (element) {

                element.addEventListener(
                    "input",
                    updateOrderButton
                );

                element.addEventListener(
                    "change",
                    updateOrderButton
                );

            }

        }
    );

    document
        .querySelectorAll(
            'input[name="deliveryType"]'
        )
        .forEach(
            radio => {

                radio.addEventListener(
                    "change",
                    function() {

                        updateDelivery();

                        updateOrderButton();

                    }
                );

            }
        );

    const orderForm =
        document.getElementById(
            "orderForm"
        );

    if (orderForm) {

        orderForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                await sendOrder();

            }
        );

    }

}

/* =====================================================
   ADD PRODUCT TO CART
===================================================== */

function addCurrentProductToCart() {

    if (!product) {

        alert(
            "المنتج غير متاح."
        );

        return;

    }

    const stock =
        Number(
            product.stock ?? 0
        );

    if (stock <= 0) {

        alert(
            "هذا المنتج غير متوفر حاليًا."
        );

        return;

    }

    if (!currentOwnerUid) {

        alert(
            "تعذر تحديد المتجر."
        );

        return;

    }

    if (!optionsAreValid()) {

        alert(
            "يرجى اختيار خيارات المنتج."
        );

        return;

    }

    let cart = [];

    try {

        cart =
            JSON.parse(
                localStorage.getItem(
                    "cart"
                ) || "[]"
            );

        if (!Array.isArray(cart)) {

            cart = [];

        }

    } catch(error) {

        cart = [];

    }

    const productImage =
        getProductImages()[0] ||
        "";

    const newItem = {

        id:
            product.id,

        productId:
            product.id,

        name:
            product.name ||
            "منتج",

        price:
            Number(
                product.price || 0
            ),

        quantity:
            quantity,

        image:
            productImage,

        color:
            selectedColor ||
            "بدون لون",

        size:
            selectedSize ||
            "",

        storeUid:
            currentOwnerUid,

        storeId:
            currentOwnerUid,

        ownerUid:
            currentOwnerUid,

        storeName:
            currentStoreName

    };

    const existingIndex =
        cart.findIndex(
            item => {

                const itemStore =
                    item.storeUid ||
                    item.storeId ||
                    item.ownerUid;

                return (

                    itemStore ===
                    currentOwnerUid

                    &&

                    (
                        item.productId ===
                        product.id

                        ||

                        item.id ===
                        product.id
                    )

                    &&

                    (
                        item.color ||
                        "بدون لون"
                    ) ===
                    newItem.color

                    &&

                    (
                        item.size ||
                        ""
                    ) ===
                    newItem.size

                );

            }
        );

    if (
        existingIndex >= 0
    ) {

        const existing =
            cart[
                existingIndex
            ];

        const existingQuantity =
            Number(
                existing.quantity ||
                0
            );

        const newQuantity =
            existingQuantity +
            quantity;

        if (
            newQuantity > stock
        ) {

            alert(
                "لا يمكن إضافة كمية أكبر من المخزون المتوفر."
            );

            return;

        }

        existing.quantity =
            newQuantity;

        existing.price =
            newItem.price;

        existing.image =
            newItem.image;

        existing.name =
            newItem.name;

        existing.storeUid =
            currentOwnerUid;

        existing.storeId =
            currentOwnerUid;

        existing.ownerUid =
            currentOwnerUid;

        existing.storeName =
            currentStoreName;

    } else {

        cart.push(
            newItem
        );

    }

    try {

        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );

    } catch(error) {

        console.error(
            "CART SAVE ERROR:",
            error
        );

        alert(
            "تعذر حفظ المنتج في السلة."
        );

        return;

    }

    updateCartCount();

    const addButton =
        document.getElementById(
            "addCartButton"
        );

    if (addButton) {

        const original =
            addButton.innerHTML;

        addButton.innerHTML = `

            <svg aria-hidden="true">

                <use
                    href="#icon-cart"
                ></use>

            </svg>

            <span>
                تمت الإضافة إلى السلة ✓
            </span>

        `;

        addButton.classList.add(
            "added"
        );

        setTimeout(
            () => {

                addButton.innerHTML =
                    original;

                addButton.classList.remove(
                    "added"
                );

            },
            1800
        );

    }

}

/* DELIVERY */

async function loadDelivery() {

    try {

        if (!currentOwnerUid)
            return;

        const deliveryRef =
            collection(
                db,
                "stores",
                currentOwnerUid,
                "delivery"
            );

        const snapshot =
            await getDocs(
                deliveryRef
            );

        deliveryItems = [];

        snapshot.forEach(
            deliveryDoc => {

                const data =
                    deliveryDoc.data();

                const name =
                    data.name ||
                    data.wilaya ||
                    data.title ||
                    "";

                deliveryItems.push({

                    id:
                        deliveryDoc.id,

                    name:
                        name,

                    wilaya:
                        name,

                    office:
                        Number(
                            data.office ??
                            data.officePrice ??
                            data.bureau ??
                            data.bureauPrice ??
                            0
                        ),

                    home:
                        Number(
                            data.home ??
                            data.homePrice ??
                            data.domicile ??
                            data.homeDelivery ??
                            0
                        )

                });

            }
        );

        deliveryItems.sort(
            function(a,b) {

                return a.name.localeCompare(
                    b.name,
                    "ar"
                );

            }
        );

        const wilayaSelect =
            document.getElementById(
                "wilaya"
            );

        if (!wilayaSelect)
            return;

        wilayaSelect.innerHTML = `

            <option value="">
                اختر الولاية
            </option>

        `;

        deliveryItems.forEach(
            item => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    item.name;

                option.textContent =
                    item.name;

                wilayaSelect.appendChild(
                    option
                );

            }
        );

        updateDelivery();

    } catch(error) {

        console.error(
            "DELIVERY ERROR:",
            error
        );

    }

}

/* DELIVERY ITEM */

function getDeliveryItem() {

    const wilaya =
        document.getElementById(
            "wilaya"
        )?.value || "";

    if (!wilaya)
        return null;

    return deliveryItems.find(
        item =>
            item.name === wilaya
    ) || null;

}

/* UPDATE DELIVERY */

function updateDelivery() {

    const item =
        getDeliveryItem();

    const selectedDelivery =
        document.querySelector(
            'input[name="deliveryType"]:checked'
        );

    if (
        !item ||
        !selectedDelivery
    ) {

        deliveryCost =
            0;

        updateOrderTotals();

        return;

    }

    if (
        selectedDelivery.value ===
        "home"
    ) {

        deliveryCost =
            Number(
                item.home || 0
            );

    } else {

        deliveryCost =
            Number(
                item.office || 0
            );

    }

    updateOrderTotals();

}

/* TOTALS */

function updateOrderTotals() {

    const price =
        Number(
            product?.price || 0
        );

    const productsTotal =
        price * quantity;

    const total =
        productsTotal +
        Number(
            deliveryCost || 0
        );

    const productsElement =
        document.getElementById(
            "productsTotal"
        );

    const deliveryElement =
        document.getElementById(
            "deliveryTotal"
        );

    const grandElement =
        document.getElementById(
            "grandTotal"
        );

    if (productsElement) {

        productsElement.textContent =
            productsTotal.toLocaleString(
                "fr-DZ"
            ) +
            " DA";

    }

    if (deliveryElement) {

        deliveryElement.textContent =
            Number(
                deliveryCost || 0
            )
            .toLocaleString(
                "fr-DZ"
            ) +
            " DA";

    }

    if (grandElement) {

        grandElement.textContent =
            total.toLocaleString(
                "fr-DZ"
            ) +
            " DA";

    }

}

/* PHONE */

function validatePhone(phone) {

    const normalized =
        String(phone || "")
            .replace(
                /[\s\-().]/g,
                ""
            );

    return /^0[567]\d{8}$/.test(
        normalized
    );

}

/* OPTIONS */

function optionsAreValid() {

    const colors =
        Array.isArray(
            product?.colors
        )
        ?
        product.colors.filter(Boolean)
        :
        [];

    const sizes =
        Array.isArray(
            product?.sizes
        )
        ?
        product.sizes.filter(Boolean)
        :
        [];

    if (
        colors.length &&
        !selectedColor
    ) {

        return false;

    }

    if (
        sizes.length &&
        !selectedSize
    ) {

        return false;

    }

    return true;

}

/* ORDER BUTTON */

function updateOrderButton() {

    const button =
        document.getElementById(
            "submitOrder"
        );

    if (!button)
        return;

    const name =
        document.getElementById(
            "customerName"
        )
        ?.value.trim() ||
        "";

    const phone =
        document.getElementById(
            "customerPhone"
        )
        ?.value.trim() ||
        "";

    const wilaya =
        document.getElementById(
            "wilaya"
        )
        ?.value ||
        "";

    const delivery =
        document.querySelector(
            'input[name="deliveryType"]:checked'
        );

    const valid =

        Boolean(name)

        &&

        validatePhone(phone)

        &&

        Boolean(wilaya)

        &&

        Boolean(delivery)

        &&

        optionsAreValid();

    button.disabled =
        !valid;

}

async function sendOrder() {

    const button =
        document.getElementById(
            "submitOrder"
        );

    if (!product) {

        alert(
            "المنتج غير متاح."
        );

        return;

    }

    const name =
        document.getElementById(
            "customerName"
        )
        ?.value.trim() ||
        "";

    const phone =
        document.getElementById(
            "customerPhone"
        )
        ?.value.trim() ||
        "";

    const wilaya =
        document.getElementById(
            "wilaya"
        )
        ?.value ||
        "";

    const commune =
        document.getElementById(
            "commune"
        )
        ?.value.trim() ||
        "";

        )

        );

    if (!name) {

        alert(

        );

        return;

    }

    if (
        !validatePhone(phone)
    ) {

        alert(
            "يرجى إدخال رقم هاتف جزائري صحيح."
        );

        return;

    }

    if (!wilaya) {

        alert(
            "يرجى اختيار الولاية."
        );

        return;

    }

    if (!delivery) {

        alert(
            "يرجى اختيار طريقة التوصيل."
        );

        return;

    }

    if (!optionsAreValid()) {

        alert(
            "يرجى اختيار خيارات المنتج."
        );

        return;

    }

    if (!currentOwnerUid) {

        alert(
            "تعذر تحديد المتجر."
        );

        return;

    }

    const deliveryItem =
        getDeliveryItem();

    const deliveryPrice =
        Number(
            deliveryCost || 0
        );

    const productPrice =
        Number(
            product.price || 0
        );

    const productsTotal =
        productPrice *
        quantity;

    const total =
        productsTotal +
        deliveryPrice;

    const orderProduct = {

        id:
            product.id,

        name:
            product.name ||
            "منتج",

        price:
            productPrice,

        quantity:
            quantity,

        image:
            getProductImages()[0] ||
            "",

        color:
            selectedColor ||
            "بدون لون",

        size:
            selectedSize ||
            ""

    };

    const orderData = {

        ownerUid:
            currentOwnerUid,

        storeId:
            currentOwnerUid,

        storeName:
            currentStoreName,

        name:
            name,

        phone:
            phone,

        wilaya:
            wilaya,

        commune:
            commune,

        address:
            address,

        delivery:
            delivery.value,

        deliveryPrice:
            deliveryPrice,

        deliveryWilaya:
            deliveryItem?.name ||
            wilaya,

        products:
            [orderProduct],

        productsTotal:
            productsTotal,

        total:
            total,

        status:
            "قيد المعالجة",

        note:
            "",

        date:
            new Date()
                .toLocaleString(
                    "ar-DZ"
                ),

        createdAt:
            serverTimestamp()

    };

    try {

        if (button) {

            button.disabled =
                true;

            button.textContent =
                "جاري إرسال الطلب...";

        }

        await addDoc(
            collection(
                db,
                "orders"
            ),
            orderData
        );

        if (
            typeof window.fbq ===
            "function"
        ) {

            window.fbq(
                "track",
                "Purchase",
                {

                    content_name:
                        product.name ||
                        "",

                    content_ids:
                        [product.id],

                    value:
                        total,

                    currency:
                        "DZD"

                }
            );

        }

        if (
            typeof window.ttq !==
            "undefined" &&

            typeof window.ttq.track ===
            "function"
        ) {

            window.ttq.track(
                "CompletePayment",
                {

                    content_name:
                        product.name ||
                        "",

                    content_id:
                        product.id,

                    value:
                        total,

                    currency:
                        "DZD"

                }
            );

        }

        alert(
            "تم إرسال طلبك بنجاح ❤️"
        );

        goToStore();

    } catch(error) {

        console.error(
            "ORDER ERROR:",

        );

        alert(
            "تعذر إرسال الطلب. حاول مرة أخرى."
        );

        if (button) {

            button.disabled =
                false;

            button.textContent =
                "تأكيد الطلب";

        }

    }

/* CART COUNT */

function updateCartCount() {

    let cart = [];

    try {

        cart =
            JSON.parse(
                localStorage.getItem(
                    "cart"
                )
            ) || [];

    } catch(error) {

        cart = [];

    }

    const storeKey =
        currentOwnerUid ||
        currentStoreId;

    const storeCart =
        cart.filter(
            item => {

                const itemStore =
                    item.storeUid ||
                    item.storeId ||
                    item.ownerUid;

                return (
                    itemStore ===
                    storeKey
                );

            }
        );

    let total =
        0;

    storeCart.forEach(
        item => {

            total +=
                Number(
                    item.quantity ||
                    0
                );

        }
    );

    cartCount.textContent =
        total;

}

/* GO STORE */

function goToStore() {

    const storeUid =
        currentOwnerUid ||
        currentStoreId ||
        urlStoreId;

    if (!storeUid) {

        window.location.href =
            "index.html";

        return;

    }

    window.location.href =
        "index.html?store=" +
        encodeURIComponent(
            storeUid
        );

}

/* CART BUTTON */

document
    .getElementById(
        "cartButton"
    )
    .addEventListener(
        "click",
        function() {

            const storeUid =
                currentOwnerUid ||
                currentStoreId;

            if (!storeUid)
                return;

            window.location.href =
                "cart.html?store=" +
                encodeURIComponent(
                    storeUid
                );

        }
    );

/* SIDEBAR */

const sidebar =
    document.getElementById(
        "sidebar"
    );

const overlay =
    document.getElementById(
        "overlay"
    );

const menuBtn =
    document.getElementById(
        "menuBtn"
    );

const contactLink =
    document.getElementById(
        "contactLink"
    );

function openSidebar() {

    sidebar.classList.add(
        "active"
    );

    overlay.classList.add(
        "active"
    );

}

function closeSidebar() {

    sidebar.classList.remove(
        "active"
    );

    overlay.classList.remove(
        "active"
    );

}

menuBtn.addEventListener(
    "click",
    openSidebar
);

menuBtn.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" ||
            event.key === " "
        ) {

            event.preventDefault();

            openSidebar();

        }

    }
);

overlay.addEventListener(
    "click",
    closeSidebar
);

/* CONTACT */

contactLink.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        closeSidebar();

        const socialSection =
            document.getElementById(
                "socialSection"
            );

        if (socialSection) {

            socialSection.scrollIntoView({
                behavior:"smooth",
                block:"start"
            });

        }

    }
);

/* SIDEBAR LINKS */

document
    .querySelectorAll(
        ".sidebar a:not(#contactLink)"
    )
    .forEach(
        function(link) {

            link.addEventListener(
                "click",
                closeSidebar
            );

        }
    );

/* ESCAPE */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeSidebar();

        }

    }
);

/* ERROR */

function showError(message) {

    productContainer.innerHTML = `

        <div class="error-box">

            <svg>

                <use
                    href="#icon-store"
                ></use>

            </svg>

            <h2>

                ${escapeHtml(
                    message
                )}

            </h2>

            <p>
                تحقق من رابط المنتج والمتجر.
            </p>

        </div>

    `;

    storeInfo.innerHTML =
        "G-Glam";

    headerStoreName.textContent =
        "G-Glam";

    socialLinks.innerHTML = `

        <div class="social-empty">
            لا توجد معلومات تواصل.
        </div>

    `;

}

/* START */

updateCartCount();

updateNavigationLinks();

await loadProduct();

</script>

<!-- PWA -->

<script>

if (
    "serviceWorker" in
    navigator
) {

    window.addEventListener(
        "load",
        function() {

            navigator.serviceWorker
                .register(
                    "service-worker.js"
                )
                .then(
                    function() {

                        console.log(
                            "G-Glam PWA جاهز"
                        );

                    }
                )
                .catch(
                    function(error) {

                        console.log(
                            "خطأ في PWA:",
                            error
                        );

                    }
                );

        }
    );

}

</script>
