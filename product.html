<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
G-Glam | تفاصيل المنتج
</title>

<style>

:root{

--bg:#F5F0E8;
--card:#FFFFFF;
--text:#222;
--accent:#B89B7A;
--shadow:0 4px 15px rgba(0,0,0,.06);

}

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}

body{

background:var(--bg);
color:var(--text);
padding-bottom:100px;

}

/* HEADER */

header{

display:flex;
align-items:center;
justify-content:space-between;

padding:20px;

background:var(--bg);

position:sticky;
top:0;

z-index:100;

}

.logo{

font-size:34px;
font-weight:800;

}

.menu-btn,
.cart-icon{

font-size:28px;

cursor:pointer;

position:relative;

}

.cart-count{

position:absolute;

top:-8px;
left:-8px;

background:#d66;

color:#fff;

width:20px;
height:20px;

border-radius:50%;

font-size:12px;

display:flex;

align-items:center;
justify-content:center;

}

/* SIDEBAR */

.sidebar{

position:fixed;

top:0;
right:-280px;

width:280px;
height:100%;

background:#fff;

box-shadow:-4px 0 15px rgba(0,0,0,.1);

z-index:999;

transition:.3s;

padding-top:30px;

}

.sidebar.active{

right:0;

}

.sidebar a{

display:block;

padding:16px 25px;

text-decoration:none;

color:#222;

border-bottom:1px solid #eee;

}

.sidebar a:hover{

background:#f5f5f5;

}

.overlay{

position:fixed;

inset:0;

background:rgba(0,0,0,.35);

display:none;

z-index:998;

}

.overlay.active{

display:block;

}

/* STORE INFO */

.store-info{

text-align:center;

padding:10px 15px 0;

color:#777;

font-size:14px;

}

.store-info strong{

color:#222;

}

/* CONTAINER */

.container{

max-width:900px;

margin:15px auto;

background:var(--card);

border-radius:18px;

padding:20px;

box-shadow:var(--shadow);

}

.back-btn{

display:inline-block;

margin-bottom:15px;

text-decoration:none;

color:#222;

font-weight:bold;

}

/* GALLERY */

.gallery-container{

overflow-x:auto;

scroll-snap-type:x mandatory;

margin-bottom:20px;

}

.gallery-container::-webkit-scrollbar{

height:5px;

}

.gallery-track{

display:flex;

gap:10px;

}

.gallery-track img{

width:85%;

max-height:550px;

flex-shrink:0;

border-radius:16px;

scroll-snap-align:center;

object-fit:cover;

}

/* PRODUCT INFO */

h1{

font-size:28px;

margin-bottom:10px;

}

.price{

font-size:24px;

font-weight:bold;

color:var(--accent);

margin-bottom:15px;

}

.description{

line-height:1.8;

color:#555;

margin-bottom:20px;

white-space:pre-line;

}

/* COLORS */

.box-title{

font-weight:bold;

margin-bottom:8px;

}

select{

width:100%;

padding:14px;

border:none;

border-radius:14px;

background:#f8f8f8;

margin-bottom:15px;

outline:none;

}

/* STOCK */

.stock{

font-size:14px;

margin-bottom:15px;

padding:10px;

border-radius:10px;

background:#f8f8f8;

}

.stock.available{

color:#198754;

}

.stock.empty{

color:#b42318;

background:#fdecec;

}

/* QUANTITY */

.qty-box{

display:flex;

justify-content:center;

align-items:center;

gap:15px;

margin-bottom:20px;

}

.qty-btn{

width:42px;
height:42px;

border:none;

border-radius:50%;

background:#222;

color:#fff;

font-size:22px;

cursor:pointer;

}

.qty-btn:disabled{

opacity:.4;

cursor:not-allowed;

}

#quantity{

font-size:22px;

font-weight:bold;

}

/* FLOATING BUTTON */

.floating-add{

position:fixed;

bottom:15px;

right:50%;

transform:translateX(50%);

width:90%;

max-width:500px;

background:#222;

color:#fff;

padding:16px;

border:none;

border-radius:30px;

font-size:18px;

cursor:pointer;

box-shadow:0 8px 20px rgba(0,0,0,.2);

z-index:500;

}

.floating-add:disabled{

background:#999;

cursor:not-allowed;

}

/* LOADING */

.loading{

text-align:center;

padding:50px 20px;

font-size:18px;

color:#777;

}

/* MOBILE */

@media(max-width:600px){

.logo{

font-size:27px;

}

.container{

margin:10px;

padding:15px;

}

h1{

font-size:23px;

}

.gallery-track img{

width:92%;

}

}

</style>

</head>

<body>


<!-- OVERLAY -->

<div
class="overlay"
id="overlay">
</div>


<!-- SIDEBAR -->

<div
class="sidebar"
id="sidebar">

<a id="homeLink"
href="#">
الرئيسية
</a>

<a id="cartLink"
href="#">
🛒 السلة
</a>

<a
href="https://www.facebook.com/share/1BNEuBhjHV/"
target="_blank">

📘 اتصل بنا

</a>

</div>


<!-- HEADER -->

<header>

<div
class="menu-btn"
id="menuBtn">

☰

</div>


<div
class="logo"
id="storeLogo">

G-Glam

</div>


<div
class="cart-icon"
id="cartButton">

🛒

<span
id="cartCount"
class="cart-count">

0

</span>

</div>

</header>


<!-- STORE NAME -->

<div
class="store-info"
id="storeInfo">

جاري تحميل المتجر...

</div>


<!-- PRODUCT -->

<div
class="container"
id="productContainer">

<div class="loading">

⏳ جاري تحميل المنتج...

</div>

</div>


<!-- FLOATING ADD -->

<button
class="floating-add"
id="addButton"
disabled>

🛒 أضف إلى السلة

</button>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
doc,
getDoc

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


/* =====================================================
   URL PARAMETERS
===================================================== */

const params =
new URLSearchParams(
window.location.search
);


const productId =
params.get("id");


/*
   يمكن تمرير store في الرابط،
   لكن المنتج نفسه هو المصدر الأساسي.
*/

const urlStoreId =
params.get("store");


/* =====================================================
   ELEMENTS
===================================================== */

const productContainer =
document.getElementById(
"productContainer"
);

const addButton =
document.getElementById(
"addButton"
);

const cartCount =
document.getElementById(
"cartCount"
);

const storeLogo =
document.getElementById(
"storeLogo"
);

const storeInfo =
document.getElementById(
"storeInfo"
);

const homeLink =
document.getElementById(
"homeLink"
);

const cartLink =
document.getElementById(
"cartLink"
);

const cartButton =
document.getElementById(
"cartButton"
);


/* =====================================================
   VARIABLES
===================================================== */

let currentProduct = null;

let currentProductId = null;

let currentStoreId = null;

let currentStoreName = "G-Glam";

let quantity = 1;

let maxStock = 0;


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(value ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =====================================================
   LOAD PRODUCT
===================================================== */

async function loadProduct(){

try{


if(!productId){

productContainer.innerHTML = `

<div class="loading">

❌ لم يتم اختيار المنتج.

</div>

`;

addButton.disabled = true;

return;

}


/* =====================================================
   GET PRODUCT
===================================================== */

const productRef =
doc(
db,
"products",
productId
);


const productSnap =
await getDoc(productRef);


if(!productSnap.exists()){

productContainer.innerHTML = `

<div class="loading">

❌ المنتج غير موجود.

</div>

`;

addButton.disabled = true;

return;

}


currentProduct =
productSnap.data();


currentProductId =
productSnap.id;


/* =====================================================
   GET STORE ID
===================================================== */

currentStoreId =
currentProduct.storeId ||
urlStoreId ||
"";


if(!currentStoreId){

productContainer.innerHTML = `

<div class="loading">

❌ هذا المنتج غير مرتبط بمتجر.

</div>

`;

addButton.disabled = true;

return;

}


/*
   حماية إضافية:

إذا كان الرابط يحتوي store
وكان مختلفًا عن storeId الحقيقي
نرفض عرض المنتج.
*/

if(

urlStoreId &&

urlStoreId !== currentProduct.storeId

){

productContainer.innerHTML = `

<div class="loading">

❌ المنتج لا ينتمي إلى هذا المتجر.

</div>

`;

addButton.disabled = true;

return;

}


/* =====================================================
   LOAD STORE
===================================================== */

await loadStore();


/* =====================================================
   RENDER PRODUCT
===================================================== */

renderProduct();


/* =====================================================
   CART COUNT
===================================================== */

updateCartCount();


}catch(error){

console.error(
"PRODUCT ERROR:",
error
);


productContainer.innerHTML = `

<div class="loading">

❌ حدث خطأ أثناء تحميل المنتج.

<br><br>

${escapeHtml(error.message)}

</div>

`;

addButton.disabled = true;

}

}


/* =====================================================
   LOAD STORE
===================================================== */

async function loadStore(){

try{


const storeRef =
doc(
db,
"stores",
currentStoreId
);


const storeSnap =
await getDoc(storeRef);


if(storeSnap.exists()){

const store =
storeSnap.data();


currentStoreName =

store.storeName ||

store.name ||

"G-Glam";


}else{

currentStoreName =
"G-Glam";

}


/* =====================================================
   UPDATE STORE UI
===================================================== */

storeLogo.textContent =
currentStoreName;


storeInfo.innerHTML = `

متجر:

<strong>
${escapeHtml(currentStoreName)}
</strong>

`;


/* =====================================================
   STORE LINKS
===================================================== */

homeLink.href =
"index.html?store=" +
encodeURIComponent(
currentStoreId
);


cartLink.href =
"cart.html?store=" +
encodeURIComponent(
currentStoreId
);


cartButton.onclick =
function(){

window.location.href =
"cart.html?store=" +
encodeURIComponent(
currentStoreId
);

};


}catch(error){

console.error(
"STORE LOAD ERROR:",
error
);

}

}


/* =====================================================
   RENDER PRODUCT
===================================================== */

function renderProduct(){

const product =
currentProduct;


/* =====================================================
   STOCK
===================================================== */

maxStock =
Number(
product.stock ?? 0
);


/* =====================================================
   IMAGES
===================================================== */

let images = [];


if(

Array.isArray(product.images) &&

product.images.length

){

images =
product.images.filter(
img => img
);

}


if(

!images.length &&

product.image

){

images = [
product.image
];

}


let galleryHTML = "";


if(images.length){

images.forEach(
img=>{

galleryHTML += `

<img
src="${escapeHtml(img)}"
alt="${escapeHtml(product.name || "منتج")}"
loading="lazy"
onerror="this.style.display='none'"
>

`;

});

}else{

galleryHTML = `

<div
style="
width:100%;
height:300px;
display:flex;
align-items:center;
justify-content:center;
background:#f5f5f5;
border-radius:16px;
color:#999;
">

لا توجد صورة

</div>

`;

}


/* =====================================================
   COLORS
===================================================== */

let colorsHTML = "";


if(

Array.isArray(product.colors) &&

product.colors.length

){

colorsHTML = `

<div class="box-title">

اختيار اللون

</div>

<select id="productColors">

${product.colors.map(
color=>`

<option value="${escapeHtml(color)}">

${escapeHtml(color)}

</option>

`
).join("")}

</select>

`;

}else{

colorsHTML = `

<div class="box-title">

اللون

</div>

<select id="productColors">

<option value="بدون لون">

بدون لون

</option>

</select>

`;

}


/* =====================================================
   STOCK UI
===================================================== */

let stockHTML = "";


if(maxStock > 0){

stockHTML = `

<div class="stock available">

✅ متوفر في المخزون:
<strong>
${maxStock}
</strong>

</div>

`;

}else{

stockHTML = `

<div class="stock empty">

❌ المنتج غير متوفر حاليًا

</div>

`;

}


/* =====================================================
   PRODUCT HTML
===================================================== */

productContainer.innerHTML = `

<a
href="index.html?store=${encodeURIComponent(currentStoreId)}"
class="back-btn">

← العودة إلى المتجر

</a>


<div class="gallery-container">

<div
id="galleryTrack"
class="gallery-track">

${galleryHTML}

</div>

</div>


<h1>

${escapeHtml(
product.name || "منتج"
)}

</h1>


<div class="price">

${Number(product.price || 0)} DA

</div>


<div class="description">

${escapeHtml(
product.description || "لا يوجد وصف للمنتج."
)}

</div>


${stockHTML}


${colorsHTML}


<div class="box-title">

الكمية

</div>


<div class="qty-box">

<button
class="qty-btn"
id="minusBtn">

-

</button>


<span
id="quantity">

1

</span>


<button
class="qty-btn"
id="plusBtn">

+

</button>

</div>

`;


/* =====================================================
   QUANTITY BUTTONS
===================================================== */

const minusBtn =
document.getElementById(
"minusBtn"
);

const plusBtn =
document.getElementById(
"plusBtn"
);


minusBtn.addEventListener(
"click",
function(){

changeQuantity(-1);

});


plusBtn.addEventListener(
"click",
function(){

changeQuantity(1);

});


/* =====================================================
   STOCK CHECK
===================================================== */

if(maxStock <= 0){

minusBtn.disabled = true;

plusBtn.disabled = true;

addButton.disabled = true;

addButton.textContent =
"❌ المنتج غير متوفر";

}else{

minusBtn.disabled = false;

plusBtn.disabled =
maxStock <= 1;

addButton.disabled = false;

addButton.textContent =
"🛒 أضف إلى السلة";

}


/* =====================================================
   ADD BUTTON
===================================================== */

addButton.onclick =
addToCart;

}


/* =====================================================
   CHANGE QUANTITY
===================================================== */

function changeQuantity(value){

if(!currentProduct){

return;

}


quantity += value;


if(quantity < 1){

quantity = 1;

}


if(maxStock > 0 &&
quantity > maxStock){

quantity = maxStock;

}


const quantityElement =
document.getElementById(
"quantity"
);


if(quantityElement){

quantityElement.textContent =
quantity;

}


const plusBtn =
document.getElementById(
"plusBtn"
);


if(plusBtn){

plusBtn.disabled =
quantity >= maxStock;

}

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(){

if(!currentProduct){

return;

}


if(maxStock <= 0){

alert(
"❌ المنتج غير متوفر حاليًا."
);

return;

}


if(quantity > maxStock){

alert(
"❌ الكمية المطلوبة أكبر من المخزون."
);

return;

}


const colorElement =
document.getElementById(
"productColors"
);


const color =
colorElement
? colorElement.value
: "بدون لون";


/* =====================================================
   CART
===================================================== */

let cart =

JSON.parse(
localStorage.getItem("cart")
) || [];


/*
   لا نسمح بخلط منتجات
   متجر مختلف داخل نفس السلة.
*/

const differentStore =
cart.some(
item =>
item.storeId &&
item.storeId !== currentStoreId
);


if(differentStore){

const confirmChange =
confirm(

"السلة تحتوي منتجات من متجر آخر.\n\n" +

"هل تريد تفريغ السلة وإضافة هذا المنتج؟"

);


if(!confirmChange){

return;

}


cart = [];

}


/* =====================================================
   FIND EXISTING
===================================================== */

let existing =

cart.find(
item =>

item.id === currentProductId &&

item.storeId === currentStoreId &&

item.color === color
);


/* =====================================================
   ADD / UPDATE
===================================================== */

if(existing){

if(
existing.quantity + quantity >
maxStock
){

alert(
"❌ لا توجد كمية كافية في المخزون."
);

return;

}


existing.quantity +=
quantity;

}else{

cart.push({

id:
currentProductId,

storeId:
currentStoreId,

storeName:
currentStoreName,

name:
currentProduct.name || "منتج",

price:
Number(currentProduct.price || 0),

image:

currentProduct.image ||

(
Array.isArray(currentProduct.images) &&
currentProduct.images.length
?
currentProduct.images[0]
:
""
),

color:
color,

quantity:
quantity

});

}


/* =====================================================
   SAVE
===================================================== */

localStorage.setItem(

"cart",

JSON.stringify(cart)

);


updateCartCount();


alert(
"تمت إضافة المنتج إلى السلة 🛒"
);


/* العودة إلى السلة */

window.location.href =

"cart.html?store=" +

encodeURIComponent(
currentStoreId
);

}


/* =====================================================
   UPDATE CART COUNT
===================================================== */

function updateCartCount(){

let cart =

JSON.parse(
localStorage.getItem("cart")
) || [];


let total = 0;


cart.forEach(
item=>{

/*
   نعرض فقط عدد منتجات
   المتجر الحالي.
*/

if(

!currentStoreId ||

item.storeId === currentStoreId

){

total +=
Number(item.quantity || 0);

}

});


cartCount.textContent =
total;

}


/* =====================================================
   SIDEBAR
===================================================== */

const sidebar =
document.getElementById(
"sidebar"
);

const overlay =
document.getElementById(
"overlay"
);


document
.getElementById("menuBtn")
.addEventListener(
"click",
()=>{

sidebar.classList.add(
"active"
);

overlay.classList.add(
"active"
);

});


overlay.addEventListener(
"click",
()=>{

sidebar.classList.remove(
"active"
);

overlay.classList.remove(
"active"
);

});


/* =====================================================
   START
===================================================== */

loadProduct();

</script>

</body>

   </html>
