<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#F47B20"
      id="themeColorMeta">

<link rel="manifest"
      href="manifest.json">

<link rel="apple-touch-icon"
      href="icons/icon-192.png">

<title>
G-Glam | تفاصيل المنتج
</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
rel="stylesheet">


<style>

/* =====================================================
   ROOT
===================================================== */

:root{

    --bg:#F5F5F5;
    --header:#FFFFFF;

    --card:#FFFFFF;
    --card-light:#FAFAFA;

    --text:#222222;
    --muted:#777777;

    --border:#E8E8E8;

    --accent:#F47B20;
    --accent-dark:#DF6810;

    --input:#F8F8F8;
    --input-text:#222222;

    --sidebar:#FFFFFF;
    --sidebar-hover:#FFF1E6;

    --danger:#D9534F;
    --success:#198754;

    --shadow:
    0 8px 30px rgba(0,0,0,.06);

    --theme-gradient:
    linear-gradient(135deg,#F47B20,#DF6810);
}


/* =====================================================
   BUILT-IN THEMES
===================================================== */

body.theme-orange{
    --bg:#F5F5F5;
    --header:#FFFFFF;
    --card:#FFFFFF;
    --card-light:#FAFAFA;
    --text:#222222;
    --muted:#777777;
    --border:#E8E8E8;
    --accent:#F47B20;
    --accent-dark:#DF6810;
    --input:#F8F8F8;
    --input-text:#222222;
    --sidebar:#FFFFFF;
    --sidebar-hover:#FFF1E6;
    --theme-gradient:linear-gradient(135deg,#F47B20,#DF6810);
}

body.theme-blue{
    --accent:#2563EB;
    --accent-dark:#1D4ED8;
    --sidebar-hover:#EFF6FF;
    --theme-gradient:linear-gradient(135deg,#2563EB,#1D4ED8);
}

body.theme-green{
    --accent:#16A34A;
    --accent-dark:#15803D;
    --sidebar-hover:#F0FDF4;
    --theme-gradient:linear-gradient(135deg,#16A34A,#15803D);
}

body.theme-purple{
    --accent:#7C3AED;
    --accent-dark:#6D28D9;
    --sidebar-hover:#F5F3FF;
    --theme-gradient:linear-gradient(135deg,#7C3AED,#6D28D9);
}

body.theme-pink{
    --accent:#DB2777;
    --accent-dark:#BE185D;
    --sidebar-hover:#FDF2F8;
    --theme-gradient:linear-gradient(135deg,#DB2777,#BE185D);
}

body.theme-dark{
    --bg:#111111;
    --header:#181818;
    --card:#1D1D1D;
    --card-light:#242424;
    --text:#FFFFFF;
    --muted:#AAAAAA;
    --border:#333333;
    --accent:#F47B20;
    --accent-dark:#DF6810;
    --input:#252525;
    --input-text:#FFFFFF;
    --sidebar:#181818;
    --sidebar-hover:#292929;
    --theme-gradient:linear-gradient(135deg,#F47B20,#DF6810);
}

body.theme-red{
    --accent:#DC2626;
    --accent-dark:#B91C1C;
    --sidebar-hover:#FEF2F2;
    --theme-gradient:linear-gradient(135deg,#DC2626,#B91C1C);
}

body.theme-teal{
    --accent:#0D9488;
    --accent-dark:#0F766E;
    --sidebar-hover:#F0FDFA;
    --theme-gradient:linear-gradient(135deg,#0D9488,#0F766E);
}

body.theme-gold{
    --accent:#CA8A04;
    --accent-dark:#A16207;
    --sidebar-hover:#FEFCE8;
    --theme-gradient:linear-gradient(135deg,#CA8A04,#A16207);
}

body.theme-luxury{
    --bg:#171717;
    --header:#202020;
    --card:#222222;
    --card-light:#292929;
    --text:#FFFFFF;
    --muted:#BDBDBD;
    --border:#3A3A3A;
    --accent:#D4AF37;
    --accent-dark:#B8941F;
    --input:#292929;
    --input-text:#FFFFFF;
    --sidebar:#202020;
    --sidebar-hover:#303030;
    --theme-gradient:linear-gradient(135deg,#D4AF37,#B8941F);
}

body.theme-sunset{
    --accent:#EA580C;
    --accent-dark:#C2410C;
    --sidebar-hover:#FFF7ED;
    --theme-gradient:linear-gradient(135deg,#EA580C,#DB2777);
}

body.theme-emerald{
    --accent:#059669;
    --accent-dark:#047857;
    --sidebar-hover:#ECFDF5;
    --theme-gradient:linear-gradient(135deg,#059669,#047857);
}

body.theme-navy{
    --bg:#F5F7FA;
    --accent:#1E3A8A;
    --accent-dark:#172554;
    --sidebar-hover:#EFF6FF;
    --theme-gradient:linear-gradient(135deg,#1E3A8A,#172554);
}

body.theme-brown{
    --accent:#92400E;
    --accent-dark:#78350F;
    --sidebar-hover:#FFF7ED;
    --theme-gradient:linear-gradient(135deg,#92400E,#78350F);
}

body.theme-rose{
    --accent:#E11D48;
    --accent-dark:#BE123C;
    --sidebar-hover:#FFF1F2;
    --theme-gradient:linear-gradient(135deg,#E11D48,#BE123C);
}

body.theme-indigo{
    --accent:#4F46E5;
    --accent-dark:#4338CA;
    --sidebar-hover:#EEF2FF;
    --theme-gradient:linear-gradient(135deg,#4F46E5,#4338CA);
}


/* =====================================================
   RESET
===================================================== */

*{

    margin:0;
    padding:0;

    box-sizing:border-box;

    font-family:
    "Tajawal",
    Arial,
    sans-serif;

}


html{

    scroll-behavior:smooth;

}


body{

    background:var(--bg);

    color:var(--text);

    min-height:100vh;

    padding-bottom:50px;

    transition:
    background .25s,
    color .25s;

}


/* =====================================================
   HEADER
===================================================== */

header{

    height:76px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 25px;

    background:var(--header);

    border-bottom:1px solid var(--border);

    position:sticky;

    top:0;

    z-index:1000;

    box-shadow:
    0 2px 12px rgba(0,0,0,.04);

}


/* =====================================================
   LOGO
===================================================== */

.logo{

    display:flex;

    align-items:center;

    justify-content:center;

    height:100%;

}


.logo img{

    width:120px;

    height:58px;

    object-fit:contain;

    display:block;

}


/* =====================================================
   MENU + CART
===================================================== */

.menu-btn,
.cart-icon{

    width:45px;

    height:45px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:25px;

    cursor:pointer;

    position:relative;

    border-radius:12px;

    transition:.2s;

    color:var(--text);

}


.menu-btn:hover,
.cart-icon:hover{

    background:var(--sidebar-hover);

}


/* =====================================================
   CART COUNT
===================================================== */

.cart-count{

    position:absolute;

    top:0;

    left:-2px;

    background:var(--accent);

    color:#fff;

    font-size:11px;

    font-weight:800;

    width:20px;

    height:20px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

}


/* =====================================================
   STORE INFO
===================================================== */

.store-info{

    width:calc(100% - 30px);

    max-width:900px;

    margin:14px auto;

    background:var(--card);

    border:1px solid var(--border);

    border-radius:15px;

    padding:11px 18px;

    text-align:center;

    color:var(--muted);

    font-size:14px;

    box-shadow:var(--shadow);

}


.store-info strong{

    color:var(--text);

    font-weight:800;

}


/* =====================================================
   MAIN
===================================================== */

.page-wrapper{

    width:
    calc(100% - 40px);

    max-width:1400px;

    margin:
    20px auto;

}


/* =====================================================
   BACK
===================================================== */

.back-btn{

    display:inline-flex;

    align-items:center;

    gap:7px;

    margin-bottom:18px;

    padding:10px 15px;

    border-radius:12px;

    background:var(--sidebar-hover);

    color:var(--accent-dark);

    text-decoration:none;

    font-size:14px;

    font-weight:700;

    transition:.2s;

}


.back-btn:hover{

    background:var(--accent);

    color:#fff;

}


/* =====================================================
   PRODUCT LAYOUT
===================================================== */

.product-layout{

    display:grid;

    grid-template-columns:
    minmax(0,1.15fr)
    minmax(380px,.85fr);

    gap:35px;

    align-items:start;

}


/* =====================================================
   RIGHT PRODUCT VISUAL
===================================================== */

.product-visual{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:24px;

    padding:22px;

    box-shadow:var(--shadow);

    position:relative;

    overflow:hidden;

}


.product-visual::before{

    content:"";

    position:absolute;

    top:0;

    right:0;

    width:6px;

    height:100%;

    background:var(--accent);

}


/* =====================================================
   MAIN IMAGE
===================================================== */

.main-image-box{

    width:100%;

    height:600px;

    border-radius:20px;

    background:var(--card-light);

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;

}


.main-image-box img{

    width:100%;

    height:100%;

    object-fit:contain;

    display:block;

}


/* =====================================================
   THUMBNAILS
===================================================== */

.thumbnails{

    display:flex;

    gap:10px;

    overflow-x:auto;

    padding:14px 2px 5px;

}


.thumbnails::-webkit-scrollbar{

    height:5px;

}


.thumbnails::-webkit-scrollbar-thumb{

    background:var(--accent);

    border-radius:20px;

}


.thumbnail{

    width:82px;

    height:82px;

    flex:0 0 82px;

    border-radius:13px;

    overflow:hidden;

    border:2px solid transparent;

    cursor:pointer;

    background:var(--card-light);

    transition:.2s;

}


.thumbnail.active{

    border-color:var(--accent);

}


.thumbnail img{

    width:100%;

    height:100%;

    object-fit:cover;

}


/* =====================================================
   PRICE AREA
===================================================== */

.visual-price{

    margin-top:22px;

    padding-top:20px;

    border-top:1px solid var(--border);

}


.current-price{

    color:var(--accent);

    font-size:34px;

    font-weight:800;

    line-height:1.3;

}


.old-price{

    margin-top:5px;

    color:var(--muted);

    font-size:18px;

    text-decoration:line-through;

}


/* =====================================================
   FULL DESCRIPTION
===================================================== */

.full-description{

    margin-top:25px;

    padding-top:22px;

    border-top:1px solid var(--border);

}


.section-heading{

    font-size:20px;

    font-weight:800;

    margin-bottom:12px;

    color:var(--text);

}


.description-text{

    color:var(--muted);

    font-size:15px;

    line-height:2;

    white-space:pre-line;

}


/* =====================================================
   DESCRIPTION IMAGES
===================================================== */

.description-images{

    display:flex;

    flex-direction:column;

    gap:15px;

    margin-top:20px;

}


.description-images img{

    width:100%;

    max-height:700px;

    object-fit:contain;

    border-radius:18px;

    background:var(--card-light);

    display:block;

}


/* =====================================================
   PRODUCT DETAILS / LEFT
===================================================== */

.product-details{

    display:flex;

    flex-direction:column;

    gap:18px;

}


/* =====================================================
   TITLE CARD
===================================================== */

.product-heading{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:22px;

    padding:24px;

    box-shadow:var(--shadow);

}


.product-title{

    font-size:32px;

    font-weight:800;

    line-height:1.5;

    color:var(--text);

    margin-bottom:10px;

}


.short-description{

    color:var(--muted);

    font-size:15px;

    line-height:1.9;

    white-space:pre-line;

}


/* =====================================================
   OPTIONS CARD
===================================================== */

.options-card{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:22px;

    padding:22px;

    box-shadow:var(--shadow);

}


.option-box{

    margin-bottom:18px;

}


.option-box:last-child{

    margin-bottom:0;

}


.box-title{

    font-size:15px;

    font-weight:800;

    color:var(--text);

    margin-bottom:9px;

}


select,
input,
textarea{

    width:100%;

    padding:14px 15px;

    border:1px solid var(--border);

    border-radius:13px;

    background:var(--input);

    color:var(--input-text);

    font-size:15px;

    outline:none;

    transition:.2s;

}


textarea{

    resize:vertical;

    min-height:100px;

}


select:focus,
input:focus,
textarea:focus{

    border-color:var(--accent);

    box-shadow:
    0 0 0 3px
    rgba(0,0,0,.05);

}


/* =====================================================
   STOCK
===================================================== */

.stock{

    font-size:14px;

    margin-top:15px;

    padding:12px 15px;

    border-radius:13px;

    font-weight:600;

}


.stock.available{

    color:#198754;

    background:#EFFAF3;

    border:1px solid #D5F0DE;

}


.stock.empty{

    color:#B42318;

    background:#FDECEC;

    border:1px solid #F5D0D0;

}


/* =====================================================
   QUANTITY
===================================================== */

.quantity-area{

    margin-top:18px;

}


.qty-box{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:18px;

    padding:13px;

    background:var(--input);

    border-radius:16px;

}


.qty-btn{

    width:42px;

    height:42px;

    border:none;

    border-radius:50%;

    background:var(--accent);

    color:#fff;

    font-size:22px;

    font-weight:800;

    cursor:pointer;

}


.qty-btn:disabled{

    background:#BDBDBD;

    opacity:.6;

    cursor:not-allowed;

}


#quantity{

    min-width:40px;

    text-align:center;

    font-size:21px;

    font-weight:800;

}


/* =====================================================
   ORDER NOW
===================================================== */

.order-now{

    width:100%;

    padding:17px;

    border:none;

    border-radius:17px;

    background:var(--theme-gradient);

    color:#fff;

    font-size:18px;

    font-weight:800;

    cursor:pointer;

    box-shadow:
    0 8px 20px rgba(0,0,0,.12);

    transition:.2s;

}


.order-now:hover{

    transform:translateY(-2px);

}


/* =====================================================
   ORDER FORM
===================================================== */

.order-form-card{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:22px;

    padding:22px;

    box-shadow:var(--shadow);

    scroll-margin-top:95px;

}


.order-form-title{

    font-size:22px;

    font-weight:800;

    color:var(--text);

    margin-bottom:6px;

}


.order-form-subtitle{

    color:var(--muted);

    font-size:13px;

    margin-bottom:20px;

}


/* =====================================================
   PRODUCT SUMMARY
===================================================== */

.order-product-summary{

    display:flex;

    gap:12px;

    align-items:center;

    padding:12px;

    background:var(--input);

    border-radius:15px;

    margin-bottom:20px;

}


.order-product-summary img{

    width:65px;

    height:65px;

    object-fit:cover;

    border-radius:11px;

    background:#eee;

}


.order-product-name{

    font-weight:800;

    color:var(--text);

    margin-bottom:4px;

}


.order-product-details{

    color:var(--muted);

    font-size:13px;

    line-height:1.8;

}


/* =====================================================
   FORM GRID
===================================================== */

.form-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:14px;

}


.form-group{

    margin-bottom:4px;

}


.form-group.full{

    grid-column:1 / -1;

}


.form-label{

    display:block;

    margin-bottom:7px;

    font-size:14px;

    font-weight:700;

    color:var(--text);

}


/* =====================================================
   DELIVERY
===================================================== */

.delivery-box{

    margin-top:8px;

    padding-top:18px;

    border-top:1px solid var(--border);

}


.delivery-title{

    font-size:16px;

    font-weight:800;

    margin-bottom:13px;

}


.delivery-price{

    margin-top:10px;

    padding:11px 13px;

    border-radius:12px;

    background:var(--sidebar-hover);

    color:var(--accent-dark);

    font-size:14px;

    font-weight:700;

}


/* =====================================================
   TOTALS
===================================================== */

.totals{

    margin-top:18px;

    padding-top:18px;

    border-top:1px solid var(--border);

}


.total-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    padding:7px 0;

    color:var(--muted);

    font-size:14px;

}


.total-row.final{

    margin-top:8px;

    padding-top:15px;

    border-top:1px dashed var(--border);

    color:var(--text);

    font-size:20px;

    font-weight:800;

}


.total-row.final strong{

    color:var(--accent);

}


/* =====================================================
   SUBMIT ORDER
===================================================== */

.submit-order{

    width:100%;

    margin-top:18px;

    padding:17px;

    border:none;

    border-radius:16px;

    background:var(--theme-gradient);

    color:#fff;

    font-size:17px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;

}


.submit-order:hover{

    transform:translateY(-2px);

}


.submit-order:disabled{

    background:#BDBDBD;

    cursor:not-allowed;

    transform:none;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    text-align:center;

    padding:80px 20px;

    color:var(--muted);

    font-size:16px;

    line-height:2;

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

    position:fixed;

    top:0;

    right:-300px;

    width:290px;

    height:100vh;

    background:var(--sidebar);

    box-shadow:
    -4px 0 20px rgba(0,0,0,.12);

    z-index:2000;

    transition:.3s;

    padding-top:25px;

}


.sidebar.active{

    right:0;

}


.sidebar-title{

    padding:15px 25px 20px;

    font-size:22px;

    font-weight:800;

    color:var(--text);

    border-bottom:1px solid var(--border);

}


.sidebar a{

    display:flex;

    align-items:center;

    gap:12px;

    padding:15px 25px;

    text-decoration:none;

    color:var(--text);

    font-size:15px;

    font-weight:600;

    border-bottom:1px solid var(--border);

    transition:.2s;

}


.sidebar a:hover{

    background:var(--sidebar-hover);

    color:var(--accent-dark);

}


/* =====================================================
   OVERLAY
===================================================== */

.overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.38);

    display:none;

    z-index:1900;

}


.overlay.active{

    display:block;

}


/* =====================================================
   SUCCESS
===================================================== */

.success-box{

    text-align:center;

    padding:35px 20px;

    background:var(--card);

    border-radius:20px;

    border:1px solid var(--border);

}


.success-icon{

    font-size:50px;

    margin-bottom:12px;

}


.success-title{

    font-size:23px;

    font-weight:800;

    margin-bottom:8px;

}


.success-text{

    color:var(--muted);

    line-height:1.9;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px){

    .page-wrapper{

        width:
        calc(100% - 20px);

        margin-top:12px;

    }


    .product-layout{

        grid-template-columns:1fr;

        gap:18px;

    }


    .product-visual{

        padding:15px;

        border-radius:20px;

    }


    .main-image-box{

        height:480px;

    }


    .product-title{

        font-size:26px;

    }


    .current-price{

        font-size:30px;

    }

}


/* =====================================================
   MOBILE SMALL
===================================================== */

@media(max-width:600px){

    header{

        height:68px;

        padding:0 12px;

    }


    .logo img{

        width:105px;

        height:50px;

    }


    .menu-btn,
    .cart-icon{

        width:42px;

        height:42px;

        font-size:23px;

    }


    .store-info{

        width:calc(100% - 20px);

        margin:
        10px auto;

    }


    .back-btn{

        margin-bottom:12px;

    }


    .main-image-box{

        height:390px;

    }


    .thumbnail{

        width:70px;

        height:70px;

        flex-basis:70px;

    }


    .product-heading,
    .options-card,
    .order-form-card{

        padding:17px;

        border-radius:18px;

    }


    .product-title{

        font-size:23px;

    }


    .form-grid{

        grid-template-columns:1fr;

    }


    .form-group.full{

        grid-column:auto;

    }


    .current-price{

        font-size:27px;

    }


    .old-price{

        font-size:16px;

    }

}


/* =====================================================
   VERY SMALL
===================================================== */

@media(max-width:380px){

    .main-image-box{

        height:330px;

    }


    .product-title{

        font-size:21px;

    }


    .order-form-title{

        font-size:20px;

    }

}

</style>

</head>


<body class="theme-orange">

     OVERLAY
===================================================== -->

<div
class="overlay"
id="overlay">
</div>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<div
class="sidebar"
id="sidebar">


<div
class="sidebar-title"
id="sidebarTitle">

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   STOCK
===================================================== */

function getStockValue(product){

    if(
        product.stock === undefined ||
        product.stock === null ||
        product.stock === ""
    ){

        return null;

    }

    const value =
    Number(product.stock);


    if(
        Number.isNaN(value)
    ){

        return null;

    }

    return value;

}


/* =====================================================
   PRICE
===================================================== */

function getProductPrice(){

    return Number(
        currentProduct?.price || 0
    );

}


/* =====================================================
   OLD PRICE
===================================================== */

function getOldPrice(product){

    const value =

        product.oldPrice ??
        product.originalPrice ??
        product.compareAtPrice ??
        product.previousPrice ??
        null;


    if(
        value === null ||
        value === ""
    ){

        return null;

    }


    const number =
    Number(value);


    if(
        Number.isNaN(number) ||
        number <= 0
    ){

        return null;

    }


    return number;

}


/* =====================================================
   GET PRODUCT IMAGES
===================================================== */

function getProductImages(product){

    let images = [];


    if(
        Array.isArray(product.images)
    ){

        images =
        product.images.filter(
            image => image
        );

    }


    if(
        !images.length &&
        product.image
    ){

        images = [
            product.image
        ];

    }


    return images;

}


/* =====================================================
   GET DESCRIPTION IMAGES
===================================================== */

function getDescriptionImages(product){

    const possibleFields = [

        "descriptionImages",

        "descriptiveImages",

        "contentImages",

        "description_images",

        "extraImages"

    ];


    for(
        const field of possibleFields
    ){

        if(
            Array.isArray(product[field]) &&
            product[field].length
        ){

            return product[field].filter(
                image => image
            );

        }

    }


    return [];

}

async function loadProduct(){

    try{

        if(!productId){

            productLayout.innerHTML = `

            <div class="loading">

                ❌ لم يتم اختيار المنتج.

            </div>

            `;

            return;

        }


        /* =================================================
           PRODUCT
        ================================================= */

        const productRef =
        doc(
            db,
            "products",
            productId
        );


        const productSnap =
        await getDoc(
            productRef
        );


        if(
            !productSnap.exists()
        ){

            productLayout.innerHTML = `

            <div class="loading">

                ❌ المنتج غير موجود.

            </div>

            `;

            return;

        }


        currentProduct =
        productSnap.data();


        currentProductId =
        productSnap.id;


        /* =================================================
           OWNER UID — PRIMARY IDENTIFIER
        ================================================= */

        currentOwnerUid =

            currentProduct.ownerUid ||

            currentProduct.storeUid ||

            currentProduct.storeId ||

            urlStoreId ||

            localStorage.getItem(
                "storeId"
            ) ||

            localStorage.getItem(
                "cartStoreId"
            ) ||

            "";


        currentStoreId =
        currentOwnerUid;


        if(!currentOwnerUid){

            productLayout.innerHTML = `

            <div class="loading">

                ❌ هذا المنتج غير مرتبط بمتجر.

            </div>

            `;

            return;

        }


        /* =================================================
           STORE PROTECTION
        ================================================= */

        if(

            urlStoreId &&

            urlStoreId !== currentOwnerUid

        ){

            const urlStoreRef =
            doc(
                db,
                "stores",
                urlStoreId
            );


            const urlStoreSnap =
            await getDoc(
                urlStoreRef
            );


            if(
                urlStoreSnap.exists()
            ){

                const store =
                urlStoreSnap.data();


                const storeOwner =

                    store.ownerUid ||
                    store.ownerId ||
                    store.uid ||
                    urlStoreId;


                if(
                    storeOwner !== currentOwnerUid &&
                    urlStoreId !== currentOwnerUid
                ){

                    productLayout.innerHTML = `

                    <div class="loading">

                        ❌ المنتج لا ينتمي إلى هذا المتجر.

                    </div>

                    `;

                    return;

                }

            }

        }


        /* =================================================
           STORE
        ================================================= */

        await loadStore();


        /* =================================================
           DELIVERY
        ================================================= */

        await loadDelivery();


        /* =================================================
           RENDER
        ================================================= */

        renderProduct();


        updateCartCount();

    }

    catch(error){

        console.error(
            "PRODUCT ERROR:",
            error
        );


        productLayout.innerHTML = `

        <div class="loading">

            ❌ حدث خطأ أثناء تحميل المنتج.

            <br><br>

            ${escapeHtml(
                error.message
            )}

        </div>

        `;

    }

}

/* =====================================================
   APPLY STORE THEME
===================================================== */

function applyStoreTheme(store){

    const validThemes = [

        "orange",
        "blue",
        "green",
        "purple",
        "pink",
        "dark",
        "red",
        "teal",
        "gold",
        "luxury",
        "sunset",
        "emerald",
        "navy",
        "brown",
        "rose",
        "indigo"

    ];


    document.body.classList.remove(

        ...validThemes.map(
            theme =>
            `theme-${theme}`
        ),

        "theme-custom-solid",
        "theme-custom-gradient"

    );


    /* =================================================
       GRADIENT
    ================================================= */

    if(

        store.themeType === "gradient" &&

        Array.isArray(
            store.themeColors
        ) &&

        store.themeColors.length >= 2

    ){

        const colors =
        store.themeColors
        .filter(
            color =>
            typeof color === "string" &&
            /^#[0-9A-Fa-f]{6}$/.test(
                color
            )
        )
        .slice(0,4);


        if(
            colors.length >= 2
        ){

            const direction =
            store.themeDirection ||
            store.gradientDirection ||
            "135deg";


            const gradient =
            `linear-gradient(${direction},${colors.join(",")})`;


            document.body.classList.add(
                "theme-custom-gradient"
            );


            document.documentElement.style
            .setProperty(
                "--accent",
                colors[0]
            );


            document.documentElement.style
            .setProperty(
                "--accent-dark",
                colors[1]
            );


            document.documentElement.style
            .setProperty(
                "--theme-gradient",
                gradient
            );


            document.documentElement.style
            .setProperty(
                "--sidebar-hover",
                colors[0] + "18"
            );


            document
            .getElementById(
                "themeColorMeta"
            )
            .setAttribute(
                "content",
                colors[0]
            );


            return;

        }

    }


    /* =================================================
       SOLID
    ================================================= */

    if(
        store.themeType === "solid"
    ){

        const color =

            Array.isArray(
                store.themeColors
            ) &&

            store.themeColors[0]

            ?

            store.themeColors[0]

            :

            store.themeColor;


        if(
            typeof color === "string" &&
            /^#[0-9A-Fa-f]{6}$/.test(color)
        ){

            document.body.classList.add(
                "theme-custom-solid"
            );


            document.documentElement.style
            .setProperty(
                "--accent",
                color
            );


            document.documentElement.style
            .setProperty(
                "--accent-dark",
                color
            );


            document.documentElement.style
            .setProperty(
                "--theme-gradient",
                `linear-gradient(135deg,${color},${color})`
            );


            document.documentElement.style
            .setProperty(
                "--sidebar-hover",
                color + "18"
            );


            document
            .getElementById(
                "themeColorMeta"
            )
            .setAttribute(
                "content",
                color
            );


            return;

        }

    }


    /* =================================================
       BUILT-IN
    ================================================= */

    const theme =
    store.theme ||
    localStorage.getItem(
        "gglamStoreTheme"
    ) ||
    "orange";


    if(
        validThemes.includes(theme)
    ){

        document.body.classList.add(
            `theme-${theme}`
        );


        const accent =
        getComputedStyle(
            document.documentElement
        )
        .getPropertyValue(
            "--accent"
        )
        .trim();


        if(accent){

            document
            .getElementById(
                "themeColorMeta"
            )
            .setAttribute(
                "content",
                accent
            );

        }

    }

}


/* =====================================================
   LOAD DELIVERY
===================================================== */

async function loadDelivery(){

    deliveryItems = [];


    if(!currentOwnerUid){

        return;

    }


    try{

        const deliveryRef =
        collection(
            db,
            "stores",
            currentOwnerUid,
            "delivery"
        );


        const snapshot =
        await getDocs(
            deliveryRef
        );


        snapshot.forEach(
            docSnap => {

                const data =
                docSnap.data();


                const name =

                    data.name ||

                    data.wilaya ||

                    data.title ||

                    docSnap.id;


                const office =

                    Number(
                        data.office ??
                        data.officePrice ??
                        data.bureau ??
                        data.bureauPrice ??
                        0
                    );


                const home =

                    Number(
                        data.home ??
                        data.homePrice ??
                        data.domicile ??
                        data.homeDelivery ??
                        0
                    );


                deliveryItems.push({

                    id:
                    docSnap.id,

                    name:
                    name,

                    office:
                    office,

                    home:
                    home

                });

            }
        );


        deliveryItems.sort(
            (a,b) => {

                const aNum =
                parseInt(
                    a.id
                );


                const bNum =
                parseInt(
                    b.id
                );


                if(
                    !Number.isNaN(aNum) &&
                    !Number.isNaN(bNum)
                ){

                    return aNum - bNum;

                }


                return String(
                    a.name
                )
                .localeCompare(
                    String(
                        b.name
                    ),
                    "ar"
                );

            }
        );

    }

    catch(error){

        console.error(
            "DELIVERY LOAD ERROR:",
            error
        );

    }

}


/* =====================================================
   GET DELIVERY ITEM
===================================================== */

function getDeliveryItem(){

    const wilaya =
    document.getElementById(
        "orderWilaya"
    );


    if(!wilaya){

        return null;

    }


    return deliveryItems.find(
        item =>
        item.id === wilaya.value
    ) || null;

}


/* =====================================================
   UPDATE DELIVERY
===================================================== */

function updateDelivery(){

    const wilaya =
    document.getElementById(
        "orderWilaya"
    );


    const deliveryType =
    document.getElementById(
        "deliveryType"
    );


    const deliveryPriceElement =
    document.getElementById(
        "deliveryPrice"
    );


    if(
        !wilaya ||
        !deliveryType
    ){

        return;

    }


    const item =
    getDeliveryItem();


    if(!item){

        deliveryCost = 0;


        if(deliveryPriceElement){

            deliveryPriceElement.textContent =
            "اختر الولاية لحساب سعر التوصيل";

        }


        updateFinalTotal();

        return;

    }


    if(
        deliveryType.value ===
        "إلى المكتب"
    ){

        deliveryCost =
        Number(
            item.office || 0
        );

    }else{

        deliveryCost =
        Number(
            item.home || 0
        );

    }


    if(deliveryPriceElement){

        deliveryPriceElement.textContent =
        `سعر التوصيل: ${deliveryCost} DA`;

    }


    updateFinalTotal();

}


/* =====================================================
   UPDATE TOTAL
===================================================== */

function updateFinalTotal(){

    const productsTotalElement =
    document.getElementById(
        "productsTotal"
    );


    const finalTotalElement =
    document.getElementById(
        "finalTotal"
    );


    productsTotal =
    getProductPrice() *
    quantity;


    if(productsTotalElement){

        productsTotalElement.textContent =
        `${productsTotal} DA`;

    }


    if(finalTotalElement){

        finalTotalElement.textContent =
        `${productsTotal + deliveryCost} DA`;

    }

}

/* =====================================================
   GALLERY
===================================================== */

function setupGallery(){

    const thumbnails =
    document.querySelectorAll(
        ".thumbnail"
    );


    const mainImage =
    document.getElementById(
        "mainProductImage"
    );


    if(
        !mainImage
    ){

        return;

    }


    thumbnails.forEach(
        thumbnail => {

            thumbnail.addEventListener(
                "click",
                function(){

                    const image =
                    thumbnail.dataset.image;


                    if(image){

                        mainImage.src =
                        image;

                    }


                    thumbnails.forEach(
                        item =>
                        item.classList.remove(
                            "active"
                        )
                    );


                    thumbnail.classList.add(
                        "active"
                    );

                }
            );

        }
    );

}


/* =====================================================
   QUANTITY
===================================================== */

function setupQuantity(){

    const minusBtn =
    document.getElementById(
        "minusBtn"
    );


    const plusBtn =
    document.getElementById(
        "plusBtn"
    );


    if(!minusBtn || !plusBtn){

        return;

    }


    minusBtn.addEventListener(
        "click",
        function(){

            changeQuantity(-1);

        }
    );


    plusBtn.addEventListener(
        "click",
        function(){

            changeQuantity(1);

        }
    );


    updateQuantityButtons();

}


/* =====================================================
   CHANGE QUANTITY
===================================================== */

function changeQuantity(value){

    quantity += value;


    if(
        quantity < 1
    ){

        quantity = 1;

    }


    if(
        stockLimit !== null &&
        quantity > stockLimit
    ){

        quantity =
        stockLimit;

    }


    const quantityElement =
    document.getElementById(
        "quantity"
    );


    if(quantityElement){

        quantityElement.textContent =
        quantity;

    }


    updateQuantityButtons();

    updateOrderSummary();

    updateFinalTotal();

}


/* =====================================================
   QUANTITY BUTTONS
===================================================== */

function updateQuantityButtons(){

    const minusBtn =
    document.getElementById(
        "minusBtn"
    );


    const plusBtn =
    document.getElementById(
        "plusBtn"
    );


    if(minusBtn){

        minusBtn.disabled =
        quantity <= 1;

    }


    if(plusBtn){

        if(
            stockLimit !== null
        ){

            plusBtn.disabled =
            quantity >= stockLimit;

        }else{

            plusBtn.disabled =
            false;

        }

    }

}

/* =====================================================
   PHONE VALIDATION
===================================================== */

function normalizePhone(phone){

    return String(
        phone || ""
    )
    .replace(
        /[\s\-()]/g,
        ""
    );

}


function isValidPhone(phone){

    const normalized =
    normalizePhone(
        phone
    );


    return /^0(5|6|7)[0-9]{8}$/
    .test(
        normalized
    );

}


/* =====================================================
   SEND ORDER
===================================================== */

async function sendOrder(){

    if(!currentProduct){

        alert(
            "❌ لم يتم تحميل المنتج."
        );

        return;

    }


    const nameElement =
    document.getElementById(
        "customerName"
    );


    const phoneElement =
    document.getElementById(
        "customerPhone"
    );


    const wilayaElement =
    document.getElementById(
        "orderWilaya"
    );


    const communeElement =
    document.getElementById(
        "customerCommune"
    );


    const addressElement =
    document.getElementById(
        "customerAddress"
    );


    const deliveryTypeElement =
    document.getElementById(
        "deliveryType"
    );


    const submitButton =
    document.getElementById(
        "submitOrder"
    );


    const name =
    nameElement.value.trim();


    const phone =
    normalizePhone(
        phoneElement.value
    );


    const wilayaId =
    wilayaElement.value;


    const delivery =
    deliveryTypeElement.value;


    const commune =
    communeElement.value.trim();


    const address =
    addressElement.value.trim();


    /* =================================================
       VALIDATION
    ================================================= */

    if(!name){

        alert(
            "❌ يرجى إدخال الاسم واللقب."
        );

        nameElement.focus();

        return;

    }


    if(!phone){

        alert(
            "❌ يرجى إدخال رقم الهاتف."
        );

        phoneElement.focus();

        return;

    }


    if(
        !isValidPhone(phone)
    ){

        alert(
            "❌ رقم الهاتف غير صحيح.\n\n" +
            "مثال صحيح: 0550123456"
        );

        phoneElement.focus();

        return;

    }


    if(!wilayaId){

        alert(
            "❌ يرجى اختيار الولاية."
        );

        wilayaElement.focus();

        return;

    }


    if(!delivery){

        alert(
            "❌ يرجى اختيار نوع التوصيل."
        );

        return;

    }


    if(
        stockLimit === 0
    ){

        alert(
            "❌ المنتج غير متوفر حاليًا."
        );

        return;

    }


    if(
        stockLimit !== null &&
        quantity > stockLimit
    ){

        alert(
            "❌ الكمية المطلوبة أكبر من المخزون."
        );

        return;

    }


    /* =================================================
       DELIVERY
    ================================================= */

    const deliveryItem =
    getDeliveryItem();


    if(!deliveryItem){

        alert(
            "❌ لم يتم العثور على سعر التوصيل لهذه الولاية."
        );

        return;

    }


    updateDelivery();


    /* =================================================
       PRODUCT OPTIONS
    ================================================= */

    const colorElement =
    document.getElementById(
        "productColors"
    );


    const sizeElement =
    document.getElementById(
        "productSizes"
    );


    const color =

        colorElement &&
        colorElement.value

        ?

        colorElement.value

        :

        "بدون لون";


    const size =

        sizeElement &&
        sizeElement.value

        ?

        sizeElement.value

        :

        "بدون قياس";


    /* =================================================
       PRODUCT ORDER DATA
    ================================================= */

    const price =
    getProductPrice();


    const orderProducts = [

        {

            id:
            currentProductId,

            name:
            currentProduct.name ||
            "منتج",

            price:
            price,

            quantity:
            quantity,

            total:
            price * quantity,

            image:

                currentProduct.image ||

                (

                    Array.isArray(
                        currentProduct.images
                    ) &&

                    currentProduct.images.length

                ?

                    currentProduct.images[0]

                :

                    ""

                ),

            color:
            color,

            size:
            size,

            ownerUid:
            currentOwnerUid,

            storeId:
            currentStoreId

        }

    ];


    /* =================================================
       ORDER DATA
    ================================================= */

    const orderData = {

        ownerUid:
        String(
            currentOwnerUid
        ),

        storeId:
        String(
            currentStoreId ||
            currentOwnerUid
        ),

        storeName:
        currentStoreName,

        name:
        name,

        phone:
        phone,

        wilaya:
        deliveryItem.name,

        commune:
        commune,

        address:
        address,

        delivery:
        delivery,

        deliveryPrice:
        Number(
            deliveryCost
        ),

        products:
        orderProducts,

        productsTotal:
        Number(
            productsTotal
        ),

        total:
        Number(
            productsTotal +
            deliveryCost
        ),

        status:
        "قيد المعالجة",

        note:
        "",

        date:
        new Date()
        .toLocaleString(
            "ar-DZ"
        ),

        createdAt:
        serverTimestamp()

    };


    /* =================================================
       SEND
    ================================================= */

    try{

        submitButton.disabled =
        true;


        submitButton.textContent =
        "⏳ جاري إرسال الطلب...";


        await addDoc(

            collection(
                db,
                "orders"
            ),

            orderData

        );


        /* =================================================
           SUCCESS
        ================================================= */

        productLayout.innerHTML = `

        <div
            class="success-box"
            style="
                grid-column:1/-1;
            ">

            <div class="success-icon">

                ✅

            </div>


            <div class="success-title">

                تم إرسال طلبك بنجاح

            </div>


            <div class="success-text">

                شكرًا لك ${escapeHtml(name)}.

                <br>

                تم إرسال طلبك إلى متجر
                ${escapeHtml(currentStoreName)}.

                <br><br>

                المجموع:

                <strong>
                    ${productsTotal + deliveryCost} DA
                </strong>

            </div>


            <br>


            <a
                href="index.html?store=${encodeURIComponent(
                    currentStoreId
                )}"
                class="order-now"
                style="
                    display:block;
                    text-align:center;
                    text-decoration:none;
                ">

                العودة إلى المتجر

            </a>

        </div>

        `;

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

    catch(error){

        console.error(
            "SEND ORDER ERROR:",
            error
        );


        alert(
            "❌ حدث خطأ أثناء إرسال الطلب.\n\n" +
            error.message
        );


        submitButton.disabled =
        false;


        submitButton.textContent =
        "🛍️ تأكيد الطلب";

    }

}


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount(){

    const cart =

        JSON.parse(
            localStorage.getItem(
                "cart"
            )
        ) || [];


    let total = 0;


    cart.forEach(
        item => {

            const itemStore =

                item.storeId ||

                item.storeUid ||

                item.ownerUid;


            if(

                !currentStoreId ||

                !itemStore ||

                itemStore === currentStoreId

            ){

                total +=
                Number(
                    item.quantity || 0
                );

            }

        }
    );


    cartCount.textContent =
    total;

}
