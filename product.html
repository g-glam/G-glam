<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#F5F5F5">

<link rel="manifest"
href="manifest.json">

<link rel="apple-touch-icon"
href="icons/icon-192.png">

<title>المنتج | G-Glam</title>

href="https://fonts.googleapis.com">

rel="stylesheet">

<style>

/* =====================================================
   COLORS
===================================================== */

:root{

--bg:#F4F4F4;
--card:#FFFFFF;
--text:#222222;
--accent:#F47B20;
--accent-dark:#DF6810;
--accent-light:#FFF1E6;
--muted:#777777;
--border:#E8E8E8;
--danger:#D9534F;
--success:#198754;
--shadow:0 6px 22px rgba(0,0,0,.07);

}

/* =====================================================
   RESET
===================================================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Tajawal",Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
min-height:100vh;
padding-bottom:40px;
}

/* =====================================================
   HEADER
===================================================== */

header{

display:flex;
align-items:center;
justify-content:space-between;

padding:15px 20px;

background:var(--bg);

position:sticky;
top:0;
z-index:100;

}

.logo{
display:flex;
align-items:center;
justify-content:center;
}

.logo img{

width:120px;
height:auto;
max-height:55px;
object-fit:contain;
display:block;

}

.menu-btn,
.cart-icon{

font-size:27px;
cursor:pointer;

position:relative;

width:45px;
height:45px;

display:flex;
align-items:center;
justify-content:center;

border-radius:12px;

transition:.2s;

}

.menu-btn:hover,
.cart-icon:hover{

background:var(--accent-light);

}

.cart-count{

position:absolute;

top:-5px;
left:-5px;

background:var(--accent);
color:#fff;

font-size:11px;
font-weight:bold;

width:20px;
height:20px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

}

/* =====================================================
   STORE INFO
===================================================== */

.store-info{

width:calc(100% - 30px);
max-width:900px;

margin:10px auto 18px;

background:#fff;

border:1px solid var(--border);

border-radius:18px;

padding:12px 18px;

text-align:center;

color:var(--muted);

font-size:14px;

box-shadow:var(--shadow);

}

.store-info strong{
color:var(--text);
font-weight:800;
}

/* =====================================================
   CONTAINER
===================================================== */

.container{

width:calc(100% - 30px);
max-width:1000px;

margin:0 auto;

}

/* =====================================================
   BACK
===================================================== */

.back-btn{

display:inline-flex;

align-items:center;

gap:6px;

margin-bottom:15px;

padding:10px 15px;

border-radius:12px;

background:var(--accent-light);

color:var(--accent-dark);

text-decoration:none;

font-size:14px;
font-weight:700;

}

/* =====================================================
   PRODUCT CARD
===================================================== */

.product-card{

background:var(--card);

border:1px solid var(--border);

border-radius:25px;

box-shadow:var(--shadow);

padding:20px;

display:grid;

grid-template-columns:1fr 1fr;

gap:30px;

position:relative;

overflow:hidden;

}

.product-card::before{

content:"";

position:absolute;

right:0;
top:0;

width:6px;
height:100%;

background:var(--accent);

}

/* =====================================================
   IMAGES
===================================================== */

.gallery{

width:100%;

}

.main-image{

width:100%;

height:430px;

border-radius:20px;

overflow:hidden;

background:#F2F2F2;

border:1px solid var(--border);

display:flex;

align-items:center;

justify-content:center;

}

.main-image img{

width:100%;
height:100%;

object-fit:contain;

display:block;

}

.thumbnails{

display:flex;

gap:10px;

margin-top:12px;

overflow-x:auto;

padding-bottom:5px;

}

.thumbnail{

width:72px;
height:72px;

flex-shrink:0;

border-radius:12px;

overflow:hidden;

border:2px solid transparent;

background:#F2F2F2;

cursor:pointer;

}

.thumbnail.active{

border-color:var(--accent);

}

.thumbnail img{

width:100%;
height:100%;

object-fit:cover;

}

/* =====================================================
   PRODUCT INFO
===================================================== */

.product-info{

display:flex;

flex-direction:column;

justify-content:flex-start;

}

.product-name{

font-size:28px;

font-weight:800;

line-height:1.5;

margin-bottom:10px;

}

.product-price{

font-size:24px;

font-weight:800;

color:var(--accent-dark);

margin-bottom:18px;

}

.description{

font-size:15px;

line-height:2;

color:var(--muted);

margin-bottom:20px;

white-space:pre-line;

}

/* =====================================================
   OPTIONS
===================================================== */

.option-group{

margin-bottom:18px;

}

.option-label{

display:block;

font-size:14px;

font-weight:800;

margin-bottom:8px;

}

select,
input,
textarea{

width:100%;

padding:13px 14px;

border:1px solid var(--border);

border-radius:13px;

background:#F8F8F8;

font-size:14px;

outline:none;

color:#333;

}

textarea{

min-height:90px;

resize:vertical;

line-height:1.8;

}

select:focus,
input:focus,
textarea:focus{

border-color:var(--accent);

background:#fff;

box-shadow:0 0 0 3px rgba(244,123,32,.10);

}

/* =====================================================
   COLORS
===================================================== */

.color-options{

display:flex;

flex-wrap:wrap;

gap:8px;

}

.color-btn{

border:1px solid var(--border);

background:#fff;

padding:9px 14px;

border-radius:10px;

cursor:pointer;

font-size:13px;

font-weight:600;

}

.color-btn.active{

background:var(--accent);

color:#fff;

border-color:var(--accent);

}

/* =====================================================
   QUANTITY
===================================================== */

.quantity-box{

display:flex;

align-items:center;

justify-content:center;

gap:18px;

background:#F7F7F7;

padding:10px;

border-radius:14px;

margin-bottom:18px;

}

.qty-btn{

width:42px;
height:42px;

border:none;

border-radius:50%;

background:var(--accent);

color:#fff;

font-size:23px;

font-weight:800;

cursor:pointer;

display:flex;

align-items:center;
justify-content:center;

}

.qty-btn:disabled{

background:#BDBDBD;

cursor:not-allowed;

}

.qty-number{

font-size:19px;

font-weight:800;

min-width:35px;

text-align:center;

}

/* =====================================================
   STOCK
===================================================== */

.stock{

font-size:13px;

color:var(--muted);

margin-bottom:15px;

}

.stock.available{

color:#198754;

}

.stock.empty{

color:#D9534F;

font-weight:700;

}

/* =====================================================
   BUTTONS
===================================================== */

.add-cart-btn,
.order-now-btn{

width:100%;

padding:16px;

border:none;

border-radius:15px;

color:#fff;

font-size:17px;

font-weight:800;

cursor:pointer;

transition:.2s;

}

.add-cart-btn{

background:var(--accent);

box-shadow:0 7px 18px rgba(244,123,32,.25);

margin-bottom:10px;

}

.add-cart-btn:hover{

background:var(--accent-dark);

transform:translateY(-1px);

}

.order-now-btn{

background:#198754;

box-shadow:0 7px 18px rgba(25,135,84,.20);

}

.order-now-btn:hover{

background:#157347;

transform:translateY(-1px);

}

.add-cart-btn:disabled,
.order-now-btn:disabled{

background:#BDBDBD;

box-shadow:none;

cursor:not-allowed;

transform:none;

}

/* =====================================================
   MESSAGE
===================================================== */

.message{

display:none;

padding:12px;

border-radius:12px;

font-size:14px;

font-weight:700;

text-align:center;

margin-bottom:15px;

}

.message.success{

display:block;

background:#EFFAF3;

color:#198754;

border:1px solid #C9EAD5;

}

.message.error{

display:block;

background:#FDECEC;

color:#B42318;

border:1px solid #F5D0D0;

}

/* =====================================================
   ORDER FORM
===================================================== */

.order-form{

margin-top:30px;

background:var(--card);

border:1px solid var(--border);

border-radius:25px;

box-shadow:var(--shadow);

padding:22px;

position:relative;

overflow:hidden;

}

.order-form::before{

content:"";

position:absolute;

right:0;
top:0;

width:6px;
height:100%;

background:#198754;

}

.order-title{

font-size:24px;

font-weight:800;

margin-bottom:6px;

}

.order-subtitle{

font-size:14px;

color:var(--muted);

line-height:1.8;

margin-bottom:22px;

}

.order-summary{

background:var(--accent-light);

border:1px solid #F7D7BE;

border-radius:16px;

padding:15px;

margin-bottom:20px;

}

.order-summary-title{

font-size:14px;

font-weight:800;

margin-bottom:10px;

}

.summary-row{

display:flex;

align-items:center;

justify-content:space-between;

gap:15px;

padding:5px 0;

font-size:14px;

}

.summary-row span:first-child{

color:var(--muted);

}

.summary-row strong{

font-weight:800;

}

.form-grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:15px;

}

.form-field{

margin-bottom:4px;

}

.form-field.full{

grid-column:1 / -1;

}

.form-label{

display:block;

font-size:14px;

font-weight:800;

margin-bottom:8px;

}

.required{

color:var(--danger);

}

.order-submit{

width:100%;

margin-top:18px;

padding:17px;

border:none;

border-radius:15px;

background:#198754;

color:#fff;

font-size:17px;

font-weight:800;

cursor:pointer;

box-shadow:0 7px 18px rgba(25,135,84,.20);

transition:.2s;

}

.order-submit:hover{

background:#157347;

transform:translateY(-1px);

}

.order-submit:disabled{

background:#BDBDBD;

cursor:not-allowed;

box-shadow:none;

transform:none;

}

.order-success{

display:none;

text-align:center;

padding:25px 15px;

background:#EFFAF3;

border:1px solid #C9EAD5;

border-radius:18px;

margin-top:18px;

}

.order-success.show{

display:block;

}

.order-success-icon{

font-size:48px;

margin-bottom:10px;

}

.order-success-title{

font-size:21px;

font-weight:800;

color:#198754;

margin-bottom:8px;

}

.order-success-text{

font-size:14px;

line-height:1.9;

color:#555;

}

/* =====================================================
   LOADING
===================================================== */

.loading{

text-align:center;

padding:80px 20px;

font-size:16px;

color:var(--muted);

}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

position:fixed;

top:0;

right:-280px;

width:280px;

height:100%;

background:#fff;

box-shadow:-4px 0 15px rgba(0,0,0,.1);

z-index:999;

transition:.3s;

padding-top:30px;

}

.sidebar.active{
right:0;
}

.sidebar-title{

padding:0 25px 20px;

font-size:24px;

font-weight:800;

border-bottom:1px solid #eee;

margin-bottom:5px;

}

.sidebar a{

display:flex;

align-items:center;

gap:10px;

padding:16px 25px;

text-decoration:none;

color:#222;

font-size:16px;

font-weight:600;

border-bottom:1px solid #eee;

}

.sidebar a:hover{

background:var(--accent-light);

color:var(--accent-dark);

}

/* =====================================================
   OVERLAY
===================================================== */

.overlay{

position:fixed;

inset:0;

background:rgba(0,0,0,.35);

display:none;

z-index:998;

}

.overlay.active{
display:block;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

header{
padding:13px 12px;
}

.logo img{
width:105px;
max-height:50px;
}

.container{
width:calc(100% - 20px);
}

.product-card{

display:block;

padding:14px;

border-radius:20px;

}

.main-image{

height:330px;

border-radius:17px;

}

.product-info{

padding-top:20px;

}

.product-name{

font-size:22px;

}

.product-price{

font-size:21px;

}

.order-form{

padding:17px;

border-radius:20px;

margin-top:20px;

}

.order-title{

font-size:21px;

}

.form-grid{

grid-template-columns:1fr;

gap:13px;

}

.form-field.full{

grid-column:auto;

}

}

/* =====================================================
   DESKTOP DARK BLUE MODE
===================================================== */

@media(min-width:1000px){

:root{

--bg:#07111F;
--card:#0D1B2A;
--text:#F4F7FB;
--accent:#F47B20;
--accent-dark:#FF8C32;
--accent-light:#17283A;
--muted:#AAB7C7;
--border:#1D334A;

}

body{
background:#07111F;
color:#F4F7FB;
}

header{
background:#07111F;
border-bottom:1px solid #172A40;
}

.store-info{
background:#0D1B2A;
border-color:#1D334A;
}

.store-info strong{
color:#F4F7FB;
}

.product-card{
background:#0D1B2A;
border-color:#1D334A;
box-shadow:0 8px 28px rgba(0,0,0,.30);
}

.main-image{
background:#142538;
border-color:#1D334A;
}

.thumbnail{
background:#142538;
}

.product-name{
color:#F4F7FB;
}

.description{
color:#AAB7C7;
}

.option-label{
color:#E8EEF5;
}

select,
input,
textarea{

background:#102234;
color:#F4F7FB;
border-color:#1D334A;

}

select:focus,
input:focus,
textarea:focus{

background:#0D1B2A;

}

.color-btn{

background:#102234;
color:#E8EEF5;
border-color:#1D334A;

}

.color-btn.active{

background:#F47B20;
color:#fff;

}

.quantity-box{
background:#142538;
}

.qty-number{
color:#F4F7FB;
}

.stock{
color:#AAB7C7;
}

.sidebar{
background:#0A1726;
}

.sidebar-title{
color:#F4F7FB;
border-bottom-color:#1A2D42;
}

.sidebar a{
color:#E8EEF5;
border-bottom-color:#1A2D42;
}

.sidebar a:hover{
background:#17283A;
color:#FF8C32;
}

.order-form{

background:#0D1B2A;
border-color:#1D334A;

}

.order-summary{

background:#17283A;
border-color:#263E56;

}

.summary-row span:first-child{

color:#AAB7C7;

}

}

@media(max-width:999px){

body{
background:#F4F4F4;
color:#222;
}

header{
background:#F4F4F4;
}

.product-card{
background:#fff;
border-color:#E8E8E8;
}

.order-form{

background:#fff;

}

}

/* =====================================================
   PHONE NUMBER
===================================================== */

.phone-input{

direction:ltr;

text-align:right;

}

/* =====================================================
   FORM ERROR
===================================================== */

.input-error{

border-color:#D9534F !important;

background:#FFF7F7 !important;

}

</style>

</head>

target="_blank">

<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
collection,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* =====================================================
   URL
===================================================== */

const params =
new URLSearchParams(
window.location.search
);

const productId =
params.get("id") ||
params.get("product");

const urlStoreId =
params.get("store");


/* =====================================================
   ELEMENTS
===================================================== */

const productContainer =
document.getElementById(
"productContainer"
);

const storeInfo =
document.getElementById(
"storeInfo"
);

const cartCount =
document.getElementById(
"cartCount"
);

const homeLink =
document.getElementById(
"homeLink"
);

const cartLink =
document.getElementById(
"cartLink"
);

const cartButton =
document.getElementById(
"cartButton"
);

const backBtn =
document.getElementById(
"backBtn"
);


/* =====================================================
   VARIABLES
===================================================== */

let product = null;

let currentStoreId =
urlStoreId ||
localStorage.getItem("cartStoreId") ||
null;

let currentStoreName =
"G-Glam";

let selectedColor =
"بدون لون";

let selectedSize =
"بدون قياس";

let quantity = 1;

let images = [];

let selectedImage = 0;


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

return String(value ?? "")

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
   STORE
===================================================== */

async function loadStore(){

if(!currentStoreId){

storeInfo.innerHTML =
"متجر: <strong>G-Glam</strong>";

homeLink.href =
"index.html";

cartLink.href =
"cart.html";

cartButton.onclick =
function(){

window.location.href =
"cart.html";

};

backBtn.href =
"index.html";

return;

}


try{

const ref =
doc(
db,
"stores",
currentStoreId
);

const snap =
await getDoc(ref);

if(snap.exists()){

const data =
snap.data();

currentStoreName =
data.storeName ||
data.name ||
"G-Glam";

}

}catch(error){

console.error(
"STORE ERROR:",
error
);

}


storeInfo.innerHTML = `

متجر:

<strong>
${escapeHtml(currentStoreName)}
</strong>

`;


const storeQuery =
"?store=" +
encodeURIComponent(
currentStoreId
);


homeLink.href =
"index.html" +
storeQuery;

cartLink.href =
"cart.html" +
storeQuery;

cartButton.onclick =
function(){

window.location.href =
"cart.html" +
storeQuery;

};

backBtn.href =
"index.html" +
storeQuery;

}


/* =====================================================
   GET PRODUCT
===================================================== */

async function loadProduct(){

if(!productId){

productContainer.innerHTML = `

<div class="loading">

❌ لم يتم تحديد المنتج.

</div>

`;

return;

}


try{

const productRef =
doc(
db,
"products",
productId
);

const productSnap =
await getDoc(productRef);

if(!productSnap.exists()){

productContainer.innerHTML = `

<div class="loading">

❌ المنتج غير موجود.

</div>

`;

return;

}


product = {

id:
productSnap.id,

...productSnap.data()

};


/* =====================================================
   STORE ID
===================================================== */

const productStoreId =

product.storeId ||
product.storeUid ||
product.ownerUid ||
"";


if(
!currentStoreId &&
productStoreId
){

currentStoreId =
productStoreId;

localStorage.setItem(
"cartStoreId",
currentStoreId
);

await loadStore();

}


renderProduct();

}catch(error){

console.error(
"PRODUCT ERROR:",
error
);

productContainer.innerHTML = `

<div class="loading">

❌ تعذر تحميل المنتج.

<br><br>

${escapeHtml(
error.message
)}

</div>

`;

}

}


/* =====================================================
   RENDER PRODUCT
===================================================== */

function renderProduct(){

const price =
Number(
product.price || 0
);

const stock =
product.stock;

images = [];


if(
Array.isArray(product.images)
){

images =
product.images.filter(
image => image
);

}


if(
product.image &&

/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(){

if(!product){

return;

}


const productStoreId =

product.storeId ||
product.storeUid ||
product.ownerUid ||
currentStoreId ||
"";


if(
currentStoreId &&
productStoreId &&
currentStoreId !== productStoreId
){

showMessage(
"❌ هذا المنتج تابع لمتجر مختلف.",
"error"
);

return;

}


/* CART */

let cart =

JSON.parse(
localStorage.getItem("cart")
) || [];


const ownerUid =

product.ownerUid ||
product.storeUid ||
product.storeId ||
currentStoreId ||
localStorage.getItem("ownerUid") ||
"";


/* MULTI STORE */

if(
currentStoreId
){

const existingDifferentStore =
cart.some(

item => {

const itemStore =
item.storeId ||
item.storeUid ||
item.ownerUid ||
"";

return (
itemStore &&
itemStore !== currentStoreId
);

}

);


if(existingDifferentStore){

const confirmChange =
confirm(

"السلة تحتوي على منتجات من متجر آخر.\n\n" +

"هل تريد إفراغ السلة وإضافة هذا المنتج؟"

);


if(!confirmChange){

return;

}


cart = [];

}

}


/* SAME PRODUCT */

const existingIndex =
cart.findIndex(

item =>

String(item.id) ===
String(product.id)

&&

(
item.storeId ||
item.storeUid ||
item.ownerUid ||
""
) === productStoreId

&&

(item.color || "بدون لون") ===
selectedColor

&&

(item.size || "بدون قياس") ===
selectedSize

);


if(existingIndex !== -1){

const newQuantity =

Number(
cart[existingIndex].quantity || 1
) +
quantity;


if(
product.stock !== undefined &&
product.stock !== null &&
product.stock !== "" &&
!isNaN(Number(product.stock)) &&
newQuantity > Number(product.stock)
){

showMessage(
"❌ الكمية المطلوبة تتجاوز المخزون المتوفر.",
"error"
);

return;

}


cart[existingIndex].quantity =
newQuantity;

}else{


const image =

product.image ||

(
Array.isArray(product.images) &&
product.images.length
?
product.images[0]
:
""
);


cart.push({

id:
product.id,

name:
product.name || "منتج",

price:
Number(product.price || 0),

quantity:
quantity,

stock:
product.stock ?? null,

image:
image,

images:
Array.isArray(product.images)
?
product.images
:
[],

color:
selectedColor,

size:
selectedSize,

storeId:
productStoreId,

storeUid:
product.storeUid ||
productStoreId,

ownerUid:
ownerUid

});

}


/* SAVE */

localStorage.setItem(
"cart",
JSON.stringify(cart)
);


if(currentStoreId){

localStorage.setItem(
"cartStoreId",
currentStoreId
);

}


updateCartCount();


showMessage(
"تمت إضافة المنتج إلى السلة ✅",
"success"
);


const addBtn =
document.getElementById(
"addCartBtn"
);


if(addBtn){

addBtn.textContent =
"✅ تمت الإضافة إلى السلة";


setTimeout(

function(){

addBtn.textContent =
"🛒 إضافة إلى السلة";

},

1800

);

}

}
