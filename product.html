<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تفاصيل المنتج</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f8f8f8;
margin:0;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

img{
width:100%;
border-radius:12px;
margin-bottom:15px;
}

h1{
margin-bottom:10px;
}

.price{
font-size:22px;
font-weight:bold;
color:#ff4fc3;
margin-bottom:15px;
}

.description{
line-height:1.8;
margin-bottom:20px;
}

select,
input{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:8px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:8px;
background:#ff4fc3;
color:white;
font-size:18px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<img id="productImage">

<h1 id="productName">
جاري التحميل...
</h1>

<div
class="price"
id="productPrice">
</div>

<div
class="description"
id="productDescription">
</div>

<select id="productColors">
</select>

<input
type="number"
id="quantity"
value="1"
min="1">

<button onclick="addToCart()">
🛒 إضافة إلى السلة
</button>

</div>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const firebaseConfig = {

apiKey: "AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain: "g-glam.firebaseapp.com",

projectId: "g-glam",

storageBucket: "g-glam.firebasestorage.app",

messagingSenderId: "997228419719",

appId: "1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId: "G-WX1K1F83F6"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


const params =
new URLSearchParams(
window.location.search
);

const productId =
params.get("id");


let currentProduct = null;


async function loadProduct(){

const docRef =
doc(db,"products",productId);

const docSnap =
await getDoc(docRef);

if(!docSnap.exists()){

document.body.innerHTML =
"<h2>المنتج غير موجود</h2>";

return;

}

currentProduct =
docSnap.data();


document.getElementById(
"productImage"
).src =
currentProduct.image;

document.getElementById(
"productName"
).textContent =
currentProduct.name;

document.getElementById(
"productPrice"
).textContent =
currentProduct.price + " DA";

document.getElementById(
"productDescription"
).textContent =
currentProduct.description || "";


const colorsSelect =
document.getElementById(
"productColors"
);

colorsSelect.innerHTML = "";


if(
currentProduct.colors &&
currentProduct.colors.length
){

currentProduct.colors.forEach(
(color)=>{

colorsSelect.innerHTML +=
`<option>${color}</option>`;

});

}else{

colorsSelect.innerHTML =
`<option>بدون ألوان</option>`;

}

}

loadProduct();
window.addToCart = function(){

if(!currentProduct) return;

const color =
document.getElementById(
"productColors"
).value;

const quantity =
parseInt(
document.getElementById(
"quantity"
).value
) || 1;


let cart =
JSON.parse(
localStorage.getItem("cart")
) || [];


cart.push({

id: productId,

name: currentProduct.name,

price: currentProduct.price,

image: currentProduct.image,

color: color,

quantity: quantity

});


localStorage.setItem(
"cart",
JSON.stringify(cart)
);

alert(
"تمت إضافة المنتج إلى السلة 🛒"
);

};

</script>

</body>

</html>
