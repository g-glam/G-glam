<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#F5F5F5">

<link rel="manifest"
href="manifest.json">

<link rel="apple-touch-icon"
href="icons/icon-192.png">

<title>
G-Glam | تفاصيل المنتج
</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
rel="stylesheet">


<style>

/* =====================================================
   VARIABLES
===================================================== */

:root{

--orange:#F47B20;
--orange-dark:#DF6810;
--orange-light:#FFF1E6;

--bg:#F5F5F5;
--card:#FFFFFF;

--dark:#222222;
--text:#333333;
--muted:#777777;

--border:#E8E8E8;

--danger:#D9534F;
--success:#198754;
--success-bg:#EFFAF3;

--shadow:
0 4px 15px rgba(0,0,0,.06);

}


/* =====================================================
   RESET
===================================================== */

*{

margin:0;
padding:0;

box-sizing:border-box;

font-family:"Tajawal",Arial,sans-serif;

}


/* =====================================================
   BODY
===================================================== */

body{

background:var(--bg);

color:var(--text);

min-height:100vh;

padding-bottom:105px;

}


/* =====================================================
   HEADER
===================================================== */

header{

height:78px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 20px;

background:white;

border-bottom:1px solid var(--border);

position:sticky;

top:0;

z-index:1000;

box-shadow:
0 2px 12px rgba(0,0,0,.04);

}


/* =====================================================
   LOGO
===================================================== */

.logo{

display:flex;

align-items:center;

justify-content:center;

height:100%;

}


.logo img{

width:120px;

height:58px;

object-fit:contain;

display:block;

}


/* =====================================================
   MENU + CART
===================================================== */

.menu-btn,
.cart-icon{

width:45px;

height:45px;

display:flex;

align-items:center;

justify-content:center;

font-size:25px;

cursor:pointer;

position:relative;

border-radius:12px;

transition:.2s;

}


.menu-btn:hover,
.cart-icon:hover{

background:var(--orange-light);

}


/* =====================================================
   CART COUNT
===================================================== */

.cart-count{

position:absolute;

top:1px;

left:0;

background:var(--orange);

color:#fff;

font-size:11px;

font-weight:800;

width:20px;

height:20px;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

}


/* =====================================================
   STORE INFO
===================================================== */

.store-info{

width:calc(100% - 30px);

max-width:700px;

margin:12px auto 18px;

background:#fff;

border:1px solid var(--border);

border-radius:18px;

padding:13px 18px;

text-align:center;

color:var(--muted);

font-size:14px;

box-shadow:var(--shadow);

}


.store-info strong{

color:var(--dark);

font-weight:800;

}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.container{

width:calc(100% - 30px);

max-width:900px;

margin:0 auto 30px;

background:var(--card);

border-radius:24px;

padding:20px;

border:1px solid var(--border);

box-shadow:
0 6px 22px rgba(0,0,0,.07);

position:relative;

overflow:hidden;

}


/* =====================================================
   ORANGE SIDE FRAME
===================================================== */

.container::before{

content:"";

position:absolute;

top:0;

right:0;

width:6px;

height:100%;

background:var(--orange);

}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-btn{

display:inline-flex;

align-items:center;

gap:6px;

margin-bottom:18px;

padding:10px 15px;

border-radius:12px;

background:var(--orange-light);

color:var(--orange-dark);

text-decoration:none;

font-size:14px;

font-weight:700;

transition:.2s;

}


.back-btn:hover{

background:var(--orange);

color:white;

}


/* =====================================================
   GALLERY
===================================================== */

.gallery-container{

width:100%;

overflow-x:auto;

scroll-snap-type:x mandatory;

margin-bottom:25px;

border-radius:20px;

}


.gallery-container::-webkit-scrollbar{

height:5px;

}


.gallery-container::-webkit-scrollbar-thumb{

background:var(--orange);

border-radius:20px;

}


.gallery-track{

display:flex;

gap:12px;

}


.gallery-track img{

width:100%;

max-width:650px;

height:500px;

flex-shrink:0;

border-radius:20px;

scroll-snap-align:center;

object-fit:cover;

display:block;

background:#F1F1F1;

}


/* =====================================================
   PRODUCT TITLE
===================================================== */

h1{

font-size:28px;

font-weight:800;

line-height:1.5;

margin-bottom:8px;

color:var(--dark);

}


/* =====================================================
   PRICE
===================================================== */

.price{

font-size:25px;

font-weight:800;

color:var(--orange-dark);

margin-bottom:18px;

}


/* =====================================================
   DESCRIPTION
===================================================== */

.description{

font-size:15px;

line-height:2;

color:#666;

margin-bottom:20px;

white-space:pre-line;

padding-bottom:18px;

border-bottom:1px solid var(--border);

}


/* =====================================================
   BOX TITLE
===================================================== */

.box-title{

font-size:15px;

font-weight:800;

color:var(--dark);

margin-bottom:9px;

}


/* =====================================================
   OPTIONS
===================================================== */

.option-box{

margin-bottom:18px;

}


/* =====================================================
   SELECT
===================================================== */

select{

width:100%;

padding:14px 16px;

border:1px solid var(--border);

border-radius:14px;

background:#F8F8F8;

color:#222;

font-size:15px;

margin-bottom:5px;

outline:none;

transition:.2s;

}


select:focus{

border-color:var(--orange);

box-shadow:
0 0 0 3px rgba(244,123,32,.10);

}


/* =====================================================
   STOCK
===================================================== */

.stock{

font-size:14px;

margin-bottom:18px;

padding:12px 15px;

border-radius:13px;

font-weight:600;

}


.stock.available{

color:#198754;

background:#EFFAF3;

border:1px solid #D5F0DE;

}


.stock.empty{

color:#B42318;

background:#FDECEC;

border:1px solid #F5D0D0;

}


/* =====================================================
   QUANTITY
===================================================== */

.qty-box{

display:flex;

justify-content:center;

align-items:center;

gap:18px;

margin:10px 0 25px;

padding:15px;

background:#F8F8F8;

border-radius:18px;

}


.qty-btn{

width:44px;

height:44px;

border:none;

border-radius:50%;

background:var(--orange);

color:#fff;

font-size:23px;

font-weight:bold;

cursor:pointer;

transition:.2s;

display:flex;

align-items:center;

justify-content:center;

}


.qty-btn:hover{

background:var(--orange-dark);

}


.qty-btn:disabled{

background:#BDBDBD;

opacity:.6;

cursor:not-allowed;

}


#quantity{

min-width:40px;

text-align:center;

font-size:22px;

font-weight:800;

color:#222;

}


/* =====================================================
   FLOATING ADD BUTTON
===================================================== */

.floating-add{

position:fixed;

bottom:15px;

right:50%;

transform:translateX(50%);

width:90%;

max-width:500px;

background:var(--orange);

color:#fff;

padding:16px;

border:none;

border-radius:30px;

font-size:17px;

font-weight:800;

cursor:pointer;

box-shadow:
0 8px 20px rgba(244,123,32,.25);

z-index:1500;

transition:.2s;

}


.floating-add:hover{

background:var(--orange-dark);

transform:translateX(50%) translateY(-2px);

}


.floating-add:disabled{

background:#BDBDBD;

box-shadow:none;

cursor:not-allowed;

transform:translateX(50%);

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

position:fixed;

top:0;

right:-280px;

width:280px;

height:100vh;

background:#fff;

box-shadow:
-4px 0 15px rgba(0,0,0,.1);

z-index:2000;

transition:.3s;

padding-top:25px;

}


.sidebar.active{

right:0;

}


.sidebar-title{

padding:15px 25px 20px;

font-size:22px;

font-weight:800;

border-bottom:1px solid var(--border);

margin-bottom:5px;

}


.sidebar a{

display:flex;

align-items:center;

gap:12px;

padding:15px 25px;

text-decoration:none;

color:#333;

font-size:15px;

font-weight:600;

border-bottom:1px solid #F2F2F2;

transition:.2s;

}


.sidebar a:hover{

background:var(--orange-light);

color:var(--orange-dark);

}


/* =====================================================
   OVERLAY
===================================================== */

.overlay{

position:fixed;

inset:0;

background:rgba(0,0,0,.35);

display:none;

z-index:1900;

}


.overlay.active{

display:block;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

text-align:center;

padding:60px 20px;

color:var(--muted);

font-size:16px;

line-height:2;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

header{

height:68px;

padding:0 12px;

}


.logo img{

width:105px;

height:50px;

}


.menu-btn,
.cart-icon{

width:42px;

height:42px;

font-size:24px;

}


.store-info{

width:calc(100% - 20px);

margin-top:10px;

margin-bottom:12px;

}


.container{

width:calc(100% - 20px);

margin-bottom:20px;

padding:15px;

border-radius:20px;

}


.gallery-track img{

height:380px;

border-radius:17px;

}


h1{

font-size:23px;

}


.price{

font-size:22px;

}


.description{

font-size:14px;

line-height:1.9;

}


.floating-add{

width:calc(100% - 30px);

font-size:16px;

}

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:400px){

.logo img{

width:100px;

}


.container{

padding:13px;

}


.gallery-track img{

height:320px;

}


h1{

font-size:21px;

}


.price{

font-size:20px;

}


.qty-btn{

width:40px;

height:40px;

}

}

</style>

</head>


<body>


<!-- =====================================================
     OVERLAY
===================================================== -->

<div
class="overlay"
id="overlay">
</div>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<div
class="sidebar"
id="sidebar">


<div class="sidebar-title">

G-Glam

</div>


<a
href="#"
id="homeLink">

🏠

<span>
الرئيسية
</span>

</a>


<a
href="#"
id="cartLink">

🛒

<span>
السلة
</span>

</a>


<a
href="https://www.facebook.com/share/1BNEuBhjHV/"
target="_blank"
rel="noopener">

📞

<span>
اتصل بنا
</span>

</a>


</div>


<!-- =====================================================
     HEADER
===================================================== -->

<header>


<div
class="menu-btn"
id="menuBtn">

☰

</div>


<div
class="logo"
id="storeLogo">

<img
src="logotrans.png"
alt="G-Glam"
>

</div>


<div
class="cart-icon"
id="cartButton">

🛒

<span
id="cartCount"
class="cart-count">

0

</span>

</div>


</header>


<!-- =====================================================
     STORE INFO
===================================================== -->

<div
class="store-info"
id="storeInfo">

جاري تحميل المتجر...

</div>


<!-- =====================================================
     PRODUCT
===================================================== -->

<div
class="container"
id="productContainer">


<div class="loading">

⏳ جاري تحميل المنتج...

</div>


</div>


<!-- =====================================================
     FLOATING ADD
===================================================== -->

<button
class="floating-add"
id="addButton"
disabled>

🛒 أضف إلى السلة

</button>


<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {

initializeApp

}

from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
doc,
getDoc

}

from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


/* =====================================================
   URL PARAMETERS
===================================================== */

const params =
new URLSearchParams(
window.location.search
);


const productId =
params.get("id");


const urlStoreId =
params.get("store");


/* =====================================================
   ELEMENTS
===================================================== */

const productContainer =
document.getElementById(
"productContainer"
);


const addButton =
document.getElementById(
"addButton"
);


const cartCount =
document.getElementById(
"cartCount"
);


const storeLogo =
document.getElementById(
"storeLogo"
);


const storeInfo =
document.getElementById(
"storeInfo"
);


const homeLink =
document.getElementById(
"homeLink"
);


const cartLink =
document.getElementById(
"cartLink"
);


const cartButton =
document.getElementById(
"cartButton"
);


/* =====================================================
   VARIABLES
===================================================== */

let currentProduct = null;

let currentProductId = null;

let currentStoreId = null;

let currentStoreName = "G-Glam";

let quantity = 1;

let stockLimit = null;

let stockVisible = false;


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
   GET STOCK VALUE
===================================================== */

function getStockValue(product){

if(

product.stock === undefined ||

product.stock === null ||

product.stock === ""

){

return null;

}


const value =
Number(product.stock);


if(Number.isNaN(value)){

return null;

}


return value;

}


/* =====================================================
   LOAD PRODUCT
===================================================== */

async function loadProduct(){

try{

if(!productId){

productContainer.innerHTML = `

<div class="loading">

❌ لم يتم اختيار المنتج.

</div>

`;

addButton.disabled = true;

return;

}


/* =====================================================
   PRODUCT
===================================================== */

const productRef =
doc(
db,
"products",
productId
);


const productSnap =
await getDoc(
productRef
);


if(!productSnap.exists()){

productContainer.innerHTML = `

<div class="loading">

❌ المنتج غير موجود.

</div>

`;

addButton.disabled = true;

return;

}


currentProduct =
productSnap.data();


currentProductId =
productSnap.id;


/* =====================================================
   STORE ID
===================================================== */

currentStoreId =

currentProduct.storeId ||

currentProduct.ownerUid ||

urlStoreId ||

localStorage.getItem("storeId") ||

"";


if(!currentStoreId){

productContainer.innerHTML = `

<div class="loading">

❌ هذا المنتج غير مرتبط بمتجر.

</div>

`;

addButton.disabled = true;

return;

}


/* =====================================================
   STORE PROTECTION
===================================================== */

if(

urlStoreId &&

currentProduct.storeId &&

urlStoreId !== currentProduct.storeId &&

currentProduct.ownerUid !== urlStoreId

){

productContainer.innerHTML = `

<div class="loading">

❌ المنتج لا ينتمي إلى هذا المتجر.

</div>

`;

addButton.disabled = true;

return;

}


/* =====================================================
   STORE
===================================================== */

await loadStore();


/* =====================================================
   RENDER
===================================================== */

renderProduct();


/* =====================================================
   CART
===================================================== */

updateCartCount();

}

catch(error){

console.error(
"PRODUCT ERROR:",
error
);


productContainer.innerHTML = `

<div class="loading">

❌ حدث خطأ أثناء تحميل المنتج.

<br><br>

${escapeHtml(
error.message
)}

</div>

`;

addButton.disabled = true;

}

}


/* =====================================================
   LOAD STORE
===================================================== */

async function loadStore(){

try{

const storeRef =
doc(
db,
"stores",
currentStoreId
);


const storeSnap =
await getDoc(
storeRef
);


if(storeSnap.exists()){

const store =
storeSnap.data();


currentStoreName =

store.storeName ||

store.name ||

"G-Glam";

}else{

currentStoreName =
"G-Glam";

}


/* =====================================================
   LOGO
===================================================== */

storeLogo.innerHTML = `

<img
src="logotrans.png"
alt="G-Glam"
>

`;


/* =====================================================
   STORE INFO
===================================================== */

storeInfo.innerHTML = `

متجر:

<strong>
${escapeHtml(
currentStoreName
)}
</strong>

`;


/* =====================================================
   LINKS
===================================================== */

homeLink.href =

"index.html?store=" +

encodeURIComponent(
currentStoreId
);


cartLink.href =

"cart.html?store=" +

encodeURIComponent(
currentStoreId
);


cartButton.onclick =
function(){

window.location.href =

"cart.html?store=" +

encodeURIComponent(
currentStoreId
);

};

}

catch(error){

console.error(
"STORE LOAD ERROR:",
error
);

}

}


/* =====================================================
   RENDER PRODUCT
===================================================== */

function renderProduct(){

const product =
currentProduct;


/* =====================================================
   STOCK
===================================================== */

stockLimit =
getStockValue(product);


stockVisible =
product.stockVisible === true;


/* =====================================================
   IMAGES
===================================================== */

let images = [];


if(

Array.isArray(product.images) &&

product.images.length

){

images =
product.images.filter(
img => img
);

}


if(

!images.length &&

product.image

){

images = [
product.image
];

}


/* =====================================================
   GALLERY
===================================================== */

let galleryHTML = "";


if(images.length){

images.forEach(
img => {

galleryHTML += `

<img
src="${escapeHtml(img)}"
alt="${escapeHtml(
product.name || "منتج"
)}"
loading="lazy"
onerror="this.style.display='none'"
>

`;

});

}else{

galleryHTML = `

<div
style="
width:100%;
height:380px;
display:flex;
align-items:center;
justify-content:center;
background:#F1F1F1;
border-radius:20px;
color:#999;
">

📷 لا توجد صورة

</div>

`;

}


/* =====================================================
   COLORS
===================================================== */

let colorsHTML = "";


if(

Array.isArray(product.colors) &&

product.colors.length

){

colorsHTML = `

<div class="option-box">

<div class="box-title">

اختيار اللون

</div>

<select id="productColors">

${

product.colors.map(
color => `

<option
value="${escapeHtml(color)}">

${escapeHtml(color)}

</option>

`
).join("")

}

</select>

</div>

`;

}


/* =====================================================
   SIZES
===================================================== */

let sizesHTML = "";


if(

Array.isArray(product.sizes) &&

product.sizes.length

){

sizesHTML = `

<div class="option-box">

<div class="box-title">

اختيار القياس

</div>

<select id="productSizes">

${

product.sizes.map(
size => `

<option
value="${escapeHtml(size)}">

${escapeHtml(size)}

</option>

`
).join("")

}

</select>

</div>

`;

}


/* =====================================================
   STOCK UI
===================================================== */

let stockHTML = "";


if(

stockVisible &&

stockLimit !== null

){

if(stockLimit > 0){

stockHTML = `

<div class="stock available">

✅ متوفر في المخزون:

<strong>
${stockLimit}
</strong>

</div>

`;

}else if(stockLimit === 0){

stockHTML = `

<div class="stock empty">

❌ المنتج غير متوفر حاليًا

</div>

`;

}

}


/* =====================================================
   PRODUCT HTML
===================================================== */

productContainer.innerHTML = `

<a
href="index.html?store=${encodeURIComponent(
currentStoreId
)}"
class="back-btn">

← العودة إلى المتجر

</a>


<div class="gallery-container">

<div
id="galleryTrack"
class="gallery-track">

${galleryHTML}

</div>

</div>


<h1>

${escapeHtml(
product.name || "منتج"
)}

</h1>


<div class="price">

${Number(
product.price || 0
)} DA

</div>


<div class="description">

${escapeHtml(
product.description ||
"لا يوجد وصف للمنتج."
)}

</div>


${stockHTML}


${colorsHTML}


${sizesHTML}


<div class="box-title">

الكمية

</div>


<div class="qty-box">


<button
class="qty-btn"
id="minusBtn">

−

</button>


<span
id="quantity">

1

</span>


<button
class="qty-btn"
id="plusBtn">

+

</button>


</div>

`;


/* =====================================================
   BUTTONS
===================================================== */

const minusBtn =
document.getElementById(
"minusBtn"
);


const plusBtn =
document.getElementById(
"plusBtn"
);


minusBtn.addEventListener(
"click",
function(){

changeQuantity(-1);

});


plusBtn.addEventListener(
"click",
function(){

changeQuantity(1);

});


/* =====================================================
   AVAILABILITY
===================================================== */

if(stockLimit === 0){

minusBtn.disabled = true;

plusBtn.disabled = true;

addButton.disabled = true;

addButton.textContent =
"❌ المنتج غير متوفر";

}else{

minusBtn.disabled = true;


if(stockLimit !== null){

plusBtn.disabled =
stockLimit <= 1;

}else{

plusBtn.disabled =
false;

}


addButton.disabled = false;

addButton.textContent =
"🛒 أضف إلى السلة";

}


/* =====================================================
   ADD
===================================================== */

addButton.onclick =
addToCart;

}


/* =====================================================
   CHANGE QUANTITY
===================================================== */

function changeQuantity(value){

if(!currentProduct){

return;

}


quantity += value;


if(quantity < 1){

quantity = 1;

}


if(

stockLimit !== null &&

quantity > stockLimit

){

quantity =
stockLimit;

}


const quantityElement =
document.getElementById(
"quantity"
);


if(quantityElement){

quantityElement.textContent =
quantity;

}


const plusBtn =
document.getElementById(
"plusBtn"
);


if(plusBtn){

if(stockLimit !== null){

plusBtn.disabled =
quantity >= stockLimit;

}else{

plusBtn.disabled =
false;

}

}


const minusBtn =
document.getElementById(
"minusBtn"
);


if(minusBtn){

minusBtn.disabled =
quantity <= 1;

}

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(){

if(!currentProduct){

return;

}


if(stockLimit === 0){

alert(
"❌ المنتج غير متوفر حاليًا."
);

return;

}


if(

stockLimit !== null &&

quantity > stockLimit

){

alert(
"❌ الكمية المطلوبة أكبر من المخزون."
);

return;

}


/* =====================================================
   COLOR
===================================================== */

const colorElement =
document.getElementById(
"productColors"
);


const color =

colorElement
?
colorElement.value
:
"بدون لون";


/* =====================================================
   SIZE
===================================================== */

const sizeElement =
document.getElementById(
"productSizes"
);


const size =

sizeElement
?
sizeElement.value
:
"بدون قياس";


/* =====================================================
   CART
===================================================== */

let cart =

JSON.parse(
localStorage.getItem("cart")
) || [];


/* =====================================================
   DIFFERENT STORE
===================================================== */

const differentStore =

cart.some(
item => {

const itemStore =

item.storeId ||

item.storeUid ||

item.ownerUid;

return (

itemStore &&

itemStore !== currentStoreId

);

});


if(differentStore){

const confirmChange =
confirm(

"السلة تحتوي منتجات من متجر آخر.\n\n" +

"هل تريد تفريغ السلة وإضافة هذا المنتج؟"

);


if(!confirmChange){

return;

}


cart = [];

}


/* =====================================================
   EXISTING PRODUCT
===================================================== */

let existing =

cart.find(
item =>

item.id === currentProductId &&

(

item.storeId === currentStoreId ||

item.storeUid === currentStoreId ||

item.ownerUid === currentStoreId

) &&

item.color === color &&

item.size === size

);


/* =====================================================
   ADD / UPDATE
===================================================== */

if(existing){

if(

stockLimit !== null &&

existing.quantity + quantity >

stockLimit

){

alert(
"❌ لا توجد كمية كافية في المخزون."
);

return;

}


existing.quantity +=
quantity;

}else{

cart.push({

id:
currentProductId,

name:
currentProduct.name ||
"منتج",

price:
Number(
currentProduct.price || 0
),

description:
currentProduct.description ||
"",

image:

currentProduct.image ||

(

Array.isArray(
currentProduct.images
)

&&
currentProduct.images.length

?
currentProduct.images[0]

:
""
),

images:

Array.isArray(
currentProduct.images
)

?
currentProduct.images
:
[],

color:
color,

size:
size,

colors:

Array.isArray(
currentProduct.colors
)

?
currentProduct.colors
:
[],

sizes:

Array.isArray(
currentProduct.sizes
)

?
currentProduct.sizes
:
[],

stock:
stockLimit,

stockVisible:
stockVisible,

quantity:
quantity,

storeId:
currentStoreId,

storeUid:
currentStoreId,

storeName:
currentStoreName

});

}


/* =====================================================
   SAVE
===================================================== */

localStorage.setItem(

"cart",

JSON.stringify(cart)

);


localStorage.setItem(
"cartStoreId",
currentStoreId
);


/* =====================================================
   UPDATE COUNT
===================================================== */

updateCartCount();


alert(
"تمت إضافة المنتج إلى السلة 🛒"
);


/* =====================================================
   GO CART
===================================================== */

window.location.href =

"cart.html?store=" +

encodeURIComponent(
currentStoreId
);

}


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount(){

const cart =

JSON.parse(
localStorage.getItem("cart")
) || [];


let total = 0;


cart.forEach(
item => {

const itemStore =

item.storeId ||

item.storeUid ||

item.ownerUid;


if(

!currentStoreId ||

!itemStore ||

itemStore === currentStoreId

){

total +=

Number(
item.quantity || 0
);

}

});


cartCount.textContent =
total;

}


/* =====================================================
   SIDEBAR
===================================================== */

const sidebar =
document.getElementById(
"sidebar"
);


const overlay =
document.getElementById(
"overlay"
);


const menuBtn =
document.getElementById(
"menuBtn"
);


menuBtn.addEventListener(
"click",
function(){

sidebar.classList.add(
"active"
);

overlay.classList.add(
"active"
);

});


overlay.addEventListener(
"click",
function(){

sidebar.classList.remove(
"active"
);

overlay.classList.remove(
"active"
);

});


/* =====================================================
   START
===================================================== */

loadProduct();

</script>
