<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#F5F5F5"
>

<link
    rel="manifest"
    href="manifest.json"
>

<link
    rel="apple-touch-icon"
    href="icons/icon-192.png"
>

<title>المنتج | G-Glam</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

/* =====================================================
   COLORS
===================================================== */

:root {

    --bg: #F4F4F4;
    --card: transparent;
    --text: #222222;

    --accent: #F47B20;
    --accent-dark: #DF6810;
    --accent-light: #FFF1E6;

    --muted: #777777;
    --border: #E8E8E8;

    --danger: #D9534F;
    --danger-bg: #FDECEC;

    --success: #198754;
    --success-bg: #EFFAF3;

    --shadow: 0 6px 22px rgba(0, 0, 0, .07);

}


/* =====================================================
   RESET
===================================================== */

* {

    margin: 0;
    padding: 0;

    box-sizing: border-box;

    font-family: "Tajawal", Arial, sans-serif;

}


html {

    scroll-behavior: smooth;

}


body {

    background: var(--bg);

    color: var(--text);

    min-height: 100vh;

    padding-bottom: 40px;

}


/* =====================================================
   HEADER
===================================================== */

header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 15px 20px;

    background: var(--bg);

    position: sticky;

    top: 0;

    z-index: 100;

}


.logo {

    display: flex;

    align-items: center;

    justify-content: center;

}


.logo img {

    width: 120px;

    height: auto;

    max-height: 55px;

    object-fit: contain;

    display: block;

}


.menu-btn,
.cart-icon {

    font-size: 22px;

    cursor: pointer;

    position: relative;

    width: 45px;

    height: 45px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 12px;

    transition: .2s;

}


.menu-btn:hover,
.cart-icon:hover {

    background: var(--accent-light);

    color: var(--accent);

}


.cart-count {

    position: absolute;

    top: -5px;

    left: -5px;

    background: var(--accent);

    color: #fff;

    font-size: 11px;

    font-weight: bold;

    width: 20px;

    height: 20px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

}


/* =====================================================
   STORE HERO
===================================================== */

.store-hero {

    width: 100%;

    position: relative;

    margin: 0 auto 95px;

}


.store-cover {

    width: 100%;

    height: 190px;

    overflow: hidden;

    position: relative;

    background:
        linear-gradient(
            135deg,
            #f0f0f0,
            #dddddd
        );

}


.store-cover img {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;

}


.store-cover-placeholder {

    width: 100%;

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #999;

}


.store-cover-placeholder svg {

    width: 55px;

    height: 55px;

    opacity: .55;

}


.store-profile {

    position: absolute;

    right: 50%;

    bottom: -78px;

    transform: translateX(50%);

    display: flex;

    flex-direction: column;

    align-items: center;

    z-index: 5;

}


.store-logo {

    width: 124px;

    height: 124px;

    border-radius: 50%;

    overflow: hidden;

    background: #fff;

    border: 5px solid #fff;

    box-shadow:
        0 7px 25px rgba(0,0,0,.18);

    display: flex;

    align-items: center;

    justify-content: center;

}


.store-logo img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;

}


.store-logo-placeholder {

    width: 100%;

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #999;

    background: #f2f2f2;

}


.store-logo-placeholder svg {

    width: 48px;

    height: 48px;

}


.store-name {

    margin-top: 9px;

    background: #fff;

    padding: 5px 17px;

    border-radius: 30px;

    font-size: 18px;

    font-weight: 800;

    color: #222;

    box-shadow:
        0 4px 15px rgba(0,0,0,.08);

    white-space: nowrap;

}


/* =====================================================
   OLD STORE INFO
===================================================== */

.store-info {

    display: none;

}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    width: calc(100% - 30px);

    max-width: 1000px;

    margin: 0 auto;

}


/* =====================================================
   BACK
===================================================== */

.back-btn {

    display: inline-flex;

    align-items: center;

    gap: 7px;

    margin-bottom: 15px;

    padding: 10px 15px;

    border-radius: 12px;

    background: var(--accent-light);

    color: var(--accent-dark);

    text-decoration: none;

    font-size: 14px;

    font-weight: 700;

}


.back-btn svg {

    width: 16px;

    height: 16px;

}


/* =====================================================
   PRODUCT CARD
===================================================== */

.product-card {

    background: transparent;

    border: 2px solid var(--accent);

    border-radius: 25px;

    box-shadow:
        0 6px 22px rgba(0, 0, 0, .05);

    padding: 20px;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 30px;

    position: relative;

    overflow: hidden;

}


/* =====================================================
   IMAGES
===================================================== */

.gallery {

    width: 100%;

}


.main-image {

    width: 100%;

    height: 430px;

    border-radius: 20px;

    overflow: hidden;

    background: rgba(242,242,242,.75);

    border: 1px solid var(--border);

    display: flex;

    align-items: center;

    justify-content: center;

}


.main-image img {

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: block;

}


.thumbnails {

    display: flex;

    gap: 10px;

    margin-top: 12px;

    overflow-x: auto;

    padding-bottom: 5px;

}


.thumbnail {

    width: 72px;

    height: 72px;

    flex-shrink: 0;

    border-radius: 12px;

    overflow: hidden;

    border: 2px solid transparent;

    background: #F2F2F2;

    cursor: pointer;

}


.thumbnail.active {

    border-color: var(--accent);

}


.thumbnail img {

    width: 100%;

    height: 100%;

    object-fit: cover;

}


/* =====================================================
   SVG EMPTY IMAGE
===================================================== */

.empty-image-icon {

    width: 52px;

    height: 52px;

    color: #aaa;

}


/* =====================================================
   PRODUCT INFO
===================================================== */

.product-info {

    display: flex;

    flex-direction: column;

    justify-content: flex-start;

}


.product-name {

    font-size: 28px;

    font-weight: 800;

    line-height: 1.5;

    margin-bottom: 10px;

}


.product-price {

    font-size: 24px;

    font-weight: 800;

    color: var(--accent-dark);

    margin-bottom: 18px;

}


.description {

    font-size: 15px;

    line-height: 2;

    color: var(--muted);

    margin-bottom: 20px;

    white-space: pre-line;

}


/* =====================================================
   OPTIONS
===================================================== */

.option-group {

    margin-bottom: 18px;

}


.option-label {

    display: block;

    font-size: 14px;

    font-weight: 800;

    margin-bottom: 8px;

}


select,
input {

    width: 100%;

    padding: 13px 14px;

    border: 1px solid var(--border);

    border-radius: 13px;

    background: rgba(248,248,248,.9);

    font-size: 14px;

    outline: none;

    color: #333;

}


select:focus,
input:focus {

    border-color: var(--accent);

    background: #fff;

    box-shadow:
        0 0 0 3px rgba(244,123,32,.10);

}


/* =====================================================
   COLORS
===================================================== */

.color-options {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

}


.color-btn {

    border: 1px solid var(--border);

    background: #fff;

    padding: 9px 14px;

    border-radius: 10px;

    cursor: pointer;

    font-size: 13px;

    font-weight: 600;

}


.color-btn.active {

    background: var(--accent);

    color: #fff;

    border-color: var(--accent);

}


/* =====================================================
   QUANTITY
===================================================== */

.quantity-box {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 18px;

    background: rgba(247,247,247,.9);

    padding: 10px;

    border-radius: 14px;

    margin-bottom: 18px;

}


.qty-btn {

    width: 42px;

    height: 42px;

    border: none;

    border-radius: 50%;

    background: var(--accent);

    color: #fff;

    font-size: 23px;

    font-weight: 800;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

}


.qty-btn:disabled {

    background: #BDBDBD;

    cursor: not-allowed;

}


.qty-number {

    font-size: 19px;

    font-weight: 800;

    min-width: 35px;

    text-align: center;

}


/* =====================================================
   STOCK
   مخفي للمستخدم ولكن منطق المخزون
   يبقى فعالاً في JavaScript
===================================================== */

.stock {

    display: none !important;

}


/* =====================================================
   DIRECT ORDER FORM
===================================================== */

.order-form {

    margin-top: 25px;

    padding-top: 22px;

    border-top: 1px solid var(--border);

}


.order-form-title {

    font-size: 21px;

    font-weight: 800;

    margin-bottom: 16px;

    display: flex;

    align-items: center;

    gap: 9px;

}


.order-form-title i {

    color: var(--accent);

}


.notice {

    background: var(--accent-light);

    border: 1px solid #FFD8BB;

    color: #8A470F;

    padding: 12px 14px;

    border-radius: 12px;

    font-size: 13px;

    line-height: 1.8;

    margin-bottom: 18px;

}


.form-group {

    margin-bottom: 15px;

}


.form-group label {

    display: block;

    font-size: 13px;

    font-weight: 700;

    color: #444;

    margin-bottom: 7px;

}


.required {

    color: var(--accent);

}


.delivery-loading {

    font-size: 13px;

    color: #888;

    margin-top: -5px;

    margin-bottom: 12px;

    display: none;

}


.delivery-error {

    display: none;

    background: var(--danger-bg);

    border: 1px solid #F5D0D0;

    color: #B42318;

    padding: 12px;

    border-radius: 11px;

    font-size: 13px;

    margin-bottom: 15px;

    text-align: center;

}


.total-box {

    background: #222;

    color: #fff;

    padding: 14px;

    border-radius: 13px;

    text-align: center;

    font-size: 15px;

    font-weight: 700;

    margin-top: 12px;

}


.total-box.final {

    background: var(--accent);

    font-size: 19px;

}


.send-order-btn {

    width: 100%;

    padding: 16px;

    margin-top: 15px;

    border: none;

    border-radius: 15px;

    background: var(--accent);

    color: #fff;

    font-size: 17px;

    font-weight: 800;

    cursor: pointer;

    transition: .2s;

    box-shadow:
        0 7px 18px rgba(244,123,32,.25);

}


.send-order-btn:hover {

    background: var(--accent-dark);

    transform: translateY(-1px);

}


.send-order-btn:disabled {

    background: #BDBDBD;

    box-shadow: none;

    cursor: not-allowed;

    transform: none;

}


/* =====================================================
   MESSAGE
===================================================== */

.message {

    display: none;

    padding: 12px;

    border-radius: 12px;

    font-size: 14px;

    font-weight: 700;

    text-align: center;

    margin-bottom: 15px;

}


.message.success {

    display: block;

    background: var(--success-bg);

    color: var(--success);

    border: 1px solid #C9EAD5;

}


.message.error {

    display: block;

    background: var(--danger-bg);

    color: #B42318;

    border: 1px solid #F5D0D0;

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {

    position: fixed;

    top: 0;

    right: -280px;

    width: 280px;

    height: 100%;

    background: #fff;

    box-shadow: -4px 0 15px rgba(0,0,0,.1);

    z-index: 999;

    transition: .3s;

    padding-top: 30px;

}


.sidebar.active {

    right: 0;

}


.sidebar-title {

    padding: 0 25px 20px;

    font-size: 24px;

    font-weight: 800;

    border-bottom: 1px solid #eee;

    margin-bottom: 5px;

}


.sidebar a {

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 16px 25px;

    text-decoration: none;

    color: #222;

    font-size: 16px;

    font-weight: 600;

    border-bottom: 1px solid #eee;

}


.sidebar a i {

    width: 22px;

    text-align: center;

    color: var(--accent);

}


.sidebar a:hover {

    background: var(--accent-light);

    color: var(--accent-dark);

}


/* =====================================================
   OVERLAY
===================================================== */

.overlay {

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.35);

    display: none;

    z-index: 998;

}


.overlay.active {

    display: block;

}


/* =====================================================
   LOADING
===================================================== */

.loading {

    text-align: center;

    padding: 80px 20px;

    font-size: 16px;

    color: var(--muted);

}


.loading svg {

    width: 28px;

    height: 28px;

    margin-bottom: 10px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px) {

    header {

        padding: 13px 12px;

    }


    .logo img {

        width: 105px;

        max-height: 50px;

    }


    .store-cover {

        height: 155px;

    }


    .store-profile {

        bottom: -70px;

    }


    .store-logo {

        width: 112px;

        height: 112px;

    }


    .store-name {

        font-size: 16px;

        margin-top: 7px;

    }


    .store-hero {

        margin-bottom: 85px;

    }


    .container {

        width: calc(100% - 20px);

    }


    .product-card {

        display: block;

        padding: 14px;

        border-radius: 20px;

    }


    .main-image {

        height: 330px;

        border-radius: 17px;

    }


    .product-info {

        padding-top: 20px;

    }


    .product-name {

        font-size: 22px;

    }


    .product-price {

        font-size: 21px;

    }


    .order-form-title {

        font-size: 19px;

    }

}


/* =====================================================
   DESKTOP DARK BLUE MODE
===================================================== */

@media(min-width:1000px) {

    :root {

        --bg: #07111F;

        --card: transparent;

        --text: #F4F7FB;

        --accent: #F47B20;

        --accent-dark: #FF8C32;

        --accent-light: #17283A;

        --muted: #AAB7C7;

        --border: #1D334A;

        --danger: #EF6461;

        --danger-bg: #351B20;

        --success: #35B878;

        --success-bg: #173426;

    }


    body {

        background: #07111F;

        color: #F4F7FB;

    }


    header {

        background: #07111F;

        border-bottom: 1px solid #172A40;

    }


    .store-cover {

        background: #102234;

    }


    .store-logo {

        background: #0D1B2A;

        border-color: #07111F;

    }


    .store-name {

        background: #0D1B2A;

        color: #F4F7FB;

    }


    .product-card {

        background: transparent;

        border-color: #F47B20;

        box-shadow:
            0 8px 28px rgba(0,0,0,.30);

    }


    .main-image {

        background: #142538;

        border-color: #1D334A;

    }


    .thumbnail {

        background: #142538;

    }


    .product-name {

        color: #F4F7FB;

    }


    .description {

        color: #AAB7C7;

    }


    .option-label {

        color: #E8EEF5;

    }


    select,
    input {

        background: #102234;

        color: #F4F7FB;

        border-color: #1D334A;

    }


    select:focus,
    input:focus {

        background: #0D1B2A;

    }


    .color-btn {

        background: #102234;

        color: #E8EEF5;

        border-color: #1D334A;

    }


    .color-btn.active {

        background: var(--accent);

        color: #fff;

    }


    .quantity-box {

        background: #142538;

    }


    .qty-number {

        color: #F4F7FB;

    }


    .order-form {

        border-top-color: #1D334A;

    }


    .form-group label {

        color: #DCE5EE;

    }


    .notice {

        background: #17283A;

        border-color: #5A3A22;

        color: #FFB477;

    }


    .delivery-loading {

        color: #AAB7C7;

    }


    .delivery-error {

        background: #351B20;

        border-color: #5A292E;

        color: #FF8B86;

    }


    .total-box {

        background: #17283A;

        color: #F4F7FB;

    }


    .total-box.final {

        background: var(--accent);

        color: #fff;

    }


    .sidebar {

        background: #0A1726;

    }


    .sidebar-title {

        color: #F4F7FB;

        border-bottom-color: #1A2D42;

    }


    .sidebar a {

        color: #E8EEF5;

        border-bottom-color: #1A2D42;

    }

}


/* =====================================================
   MOBILE LIGHT MODE
===================================================== */

@media(max-width:999px) {

    body {

        background: #F4F4F4;

        color: #222;

    }


    header {

        background: #F4F4F4;

    }


    .product-card {

        background: transparent;

        border-color: var(--accent);

    }


    .sidebar {

        background: #fff;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<div
    class="overlay"
    id="overlay"
></div>


<div
    class="sidebar"
    id="sidebar"
>

    <div class="sidebar-title">

        G-Glam

    </div>


    <a
        href="#"

        </span>

        </span>

    </a>


    <a

    >

        <i class="fa-solid fa-phone"></i>

        <span>
            اتصل بنا
        </span>

    </a>

</div>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div
        class="menu-btn"
        id="menuBtn"
    >

        <i class="fa-solid fa-bars"></i>

    </div>


    <div class="logo">

        <img

    <div

        id="cartButton"
    >

        <span

     STORE HERO
===================================================== -->

    class="store-hero"
    id="storeHero"
>

        class="store-cover"

    >

        <div

        >

            <svg
                viewBox="0 0 24 24"

                stroke-linejoin="round"

                <rect
                    x="3"
                    y="3"
                    width="18"
                    height="18"
                    rx="2"
                />

                <circle
                    cx="8.5"
                    cy="8.5"
                    r="1.5"
                />

                <path
                    d="M21 15l-5-5L5 21"
                />

            </svg>

        </div>

    </div>


    <div class="store-profile">

        <div
            class="store-logo"
            id="storeLogo"
        >

            <div class="store-logo-placeholder">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <circle
                        cx="12"
                        cy="8"
                        r="4"
                    />

                    <path
                        d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"
                    />

                </svg>

            </div>

        </div>


        <div
            class="store-name"
            id="storeName"
        >

            G-Glam

        </div>

    </div>

</section>


<!-- =====================================================
     OLD STORE INFO
===================================================== -->

<div
    class="store-info"
    id="storeInfo"
>

    جاري تحميل المتجر...

</div>


<div class="container">


    <a
        href="#"
        id="backBtn"
        class="back-btn"
    >

        <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        >

            <path d="M9 18l6-6-6-6"></path>

        </svg>

        العودة إلى المتجر

    </a>


    <div id="productContainer">

        <div class="loading">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"

function escapeHtml(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =====================================================
   APPLY THEME
===================================================== */

function applyTheme(hexColor) {

    if (!hexColor) return;

    let color = hexColor.replace("#", "");

    if (color.length === 3) {
        
        color = color.split("").map(c => c + c).join("");

    }

    const r = parseInt(color.substring(0, 2), 16);
    
    const g = parseInt(color.substring(2, 4), 16);
    
    const b = parseInt(color.substring(4, 6), 16);

    const darken = c => Math.max(0, Math.floor(c * 0.85));

    document.documentElement.style.setProperty(
        "--accent",
        "#" + color
    );

    document.documentElement.style.setProperty(
        "--accent-dark",
        "rgb(" + darken(r) + ", " + darken(g) + ", " + darken(b) + ")"
    );

    document.documentElement.style.setProperty(
        "--accent-light",
        "rgba(" + r + ", " + g + ", " + b + ", 0.1)"
    );

}

/* =====================================================
   UPDATE PRODUCTS TOTAL
===================================================== */

function updateProductsTotal() {

    if (!product) {

        return;

    }


    const price =
        Number(
            product.price || 0
        );


    const total =
        price * quantity;


    const element =
        document.getElementById(
            "productsTotal"
        );


    if (element) {

        element.textContent =
            "مجموع المنتج: " +
            total +
            " DA";

    }


    updateFinalTotal();

}


/* =====================================================
   UPDATE FINAL TOTAL
===================================================== */

function updateFinalTotal() {

    if (!product) {

        return;

    }


    const price =
        Number(
            product.price || 0
        );


    const productsTotal =
        price * quantity;


    const finalTotal =
        productsTotal +
        Number(
            deliveryCost || 0
        );


    const element =
        document.getElementById(
            "finalTotal"
        );


    if (element) {

        element.textContent =
            "المجموع النهائي: " +
            finalTotal +
            " DA";

    }

}


/* =====================================================
   PRODUCT EVENTS
===================================================== */

function setupProductEvents() {

    const plusBtn =
        document.getElementById(
            "plusBtn"
        );


    const minusBtn =
        document.getElementById(
            "minusBtn"
        );


    const qtyNumber =
        document.getElementById(
            "qtyNumber"
        );


    if (plusBtn) {

        plusBtn.onclick =
            function () {

                const stock =
                    product.stock;


                if (
                    stock !== undefined &&
                    stock !== null &&
                    stock !== "" &&
                    !isNaN(
                        Number(stock)
                    )
                ) {

                    if (
                        quantity >=
                        Number(stock)
                    ) {

                        showMessage(
                            "❌ لا توجد كمية إضافية متوفرة.",
                            "error"
                        );

                        return;

                    }

                }


                quantity++;

                qtyNumber.textContent =
                    quantity;


                updateProductsTotal();

            };

    }


    if (minusBtn) {

        minusBtn.onclick =
            function () {

                if (
                    quantity > 1
                ) {

                    quantity--;

                    qtyNumber.textContent =
                        quantity;

                    updateProductsTotal();

                }

            };

    }


    /* COLORS */

    document
        .querySelectorAll(
            ".color-btn"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    function () {

                        document
                            .querySelectorAll(
                                ".color-btn"
                            )
                            .forEach(
                                btn =>
                                    btn.classList.remove(
                                        "active"
                                    )
                            );


                        this.classList.add(
                            "active"
                        );


                        selectedColor =
                            this.dataset.color;

                    }
                );

            }
        );


    /* SIZE */

    const sizeSelect =
        document.getElementById(
            "sizeSelect"
        );


    if (sizeSelect) {

        sizeSelect.addEventListener(
            "change",
            function () {

                selectedSize =
                    this.value;

            }
        );

    }


    /* IMAGES */

    document
        .querySelectorAll(
            ".thumbnail"
        )
        .forEach(
            thumbnail => {

                thumbnail.addEventListener(
                    "click",
                    function () {

                        const index =
                            Number(
                                this.dataset.image
                            );


                        selectedImage =
                            index;


                        const mainImage =
                            document.getElementById(
                                "mainProductImage"
                            );


                        if (
                            mainImage &&
                            images[index]
                        ) {

                            mainImage.src =
                                images[index];

                        }


                        document
                            .querySelectorAll(
                                ".thumbnail"
                            )
                            .forEach(
                                item =>
                                    item.classList.remove(
                                        "active"
                                    )
                            );


                        this.classList.add(
                            "active"
                        );

                    }
                );

            }
        );


    /* SEND */

    const sendBtn =
        document.getElementById(
            "sendOrderBtn"
        );


    if (sendBtn) {

        sendBtn.onclick =
            sendOrder;

    }

}


/* =====================================================
   LOAD DELIVERY
===================================================== */

async function loadDelivery() {

    const loading =
        document.getElementById(
            "deliveryLoading"
        );


    const errorBox =
        document.getElementById(
            "deliveryError"
        );


    const wilayaSelect =
        document.getElementById(
            "wilaya"
        );


    if (!loading || !wilayaSelect) {

        return;

    }


    loading.style.display =
        "block";


    if (errorBox) {

        errorBox.style.display =
            "none";

    }


    deliveryItems = [];


    try {

        const ownerUid =
            getStoreOwnerUid();


        if (!ownerUid) {

            throw new Error(
                "تعذر تحديد صاحب المتجر."
            );

        }


        const deliveryRef =
            collection(
                db,
                "stores",
                String(ownerUid),
                "delivery"
            );


        const snapshot =
            await getDocs(
                deliveryRef
            );


        snapshot.forEach(
            docSnap => {

                const data =
                    docSnap.data();


                const wilayaName =

                    data.name ||
                    data.wilaya ||
                    data.title ||
                    docSnap.id;


                const officeValue =

                    data.office ??
                    data.officePrice ??
                    data.bureau ??
                    data.bureauPrice ??
                    0;


                const homeValue =

                    data.home ??
                    data.homePrice ??
                    data.domicile ??
                    data.homeDelivery ??
                    0;


                deliveryItems.push({

                    id:
                        docSnap.id,

                    name:
                        String(
                            wilayaName
                        ),

                    office:
                        Number(
                            officeValue
                        ) || 0,

                    home:
                        Number(
                            homeValue
                        ) || 0

                });

            }
        );


        deliveryItems.sort(
            (a, b) => {

                const aNum =
                    parseInt(
                        String(a.id)
                            .match(
                                /\d+/
                            )?.[0]
                    );


                const bNum =
                    parseInt(
                        String(b.id)
                            .match(
                                /\d+/
                            )?.[0]
                    );


                if (
                    !Number.isNaN(aNum) &&
                    !Number.isNaN(bNum)
                ) {

                    return aNum - bNum;

                }


                return a.name.localeCompare(
                    b.name,
                    "ar"
                );

            }
        );


        wilayaSelect.innerHTML = `

            <option value="">

                اختر الولاية

            </option>

        `;


        if (
            deliveryItems.length === 0
        ) {

            wilayaSelect.innerHTML = `

                <option value="">

                    لا توجد ولايات متاحة

                </option>

            `;


            if (errorBox) {

                errorBox.textContent =
                    "❌ لا توجد أسعار توصيل لهذا المتجر حاليًا.";

                errorBox.style.display =
                    "block";

            }

        }
        else {

            deliveryItems.forEach(
                item => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        item.id;


                    option.textContent =
                        item.name;


                    wilayaSelect.appendChild(
                        option
                    );

                }
            );

        }


        loading.style.display =
            "none";


        updateDelivery();

        updateOrderButton();


    }
    catch (error) {

        console.error(
            "DELIVERY ERROR:",
            error
        );


        wilayaSelect.innerHTML = `

            <option value="">

                تعذر تحميل الولايات

            </option>

        `;


        if (errorBox) {

            errorBox.textContent =
                "❌ تعذر تحميل أسعار التوصيل لهذا المتجر.";

            errorBox.style.display =
                "block";

        }


        loading.style.display =
            "none";

    }

}


/* =====================================================
   GET DELIVERY ITEM
===================================================== */

function getDeliveryItem() {

    const wilayaSelect =
        document.getElementById(
            "wilaya"
        );


    if (!wilayaSelect) {

        return null;

    }


    const wilaya =
        wilayaSelect.value;


    if (!wilaya) {

        return null;

    }


    return deliveryItems.find(
        item =>
            String(item.id) ===
            String(wilaya)
    );

}


/* =====================================================
   UPDATE DELIVERY
===================================================== */

function updateDelivery() {

    const item =
        getDeliveryItem();


    const deliveryType =
        document.getElementById(
            "deliveryType"
        );


    if (!deliveryType) {

        return;

    }


    const type =
        deliveryType.value;


    if (
        !item ||
        !type
    ) {

        deliveryCost = 0;


        const priceElement =
            document.getElementById(
                "deliveryPrice"
            );


        if (priceElement) {

            priceElement.textContent =
                "سعر التوصيل: --";

        }


        updateFinalTotal();

        return;

    }


    if (
        type === "إلى المكتب"
    ) {

        deliveryCost =
            Number(
                item.office
            ) || 0;

    }
    else {

        deliveryCost =
            Number(
                item.home
            ) || 0;

    }


    const priceElement =
        document.getElementById(
            "deliveryPrice"
        );


    if (priceElement) {

        priceElement.textContent =
            "سعر التوصيل: " +
            deliveryCost +
            " DA";

    }


    updateFinalTotal();

}


/* =====================================================
   PHONE VALIDATION
===================================================== */

function validatePhone(phone) {

    const normalized =
        phone.replace(
            /[\s\-().]/g,
            ""
        );


    return /^0(5|6|7)[0-9]{8}$/.test(
        normalized
    );

}


/* =====================================================
   ORDER BUTTON
===================================================== */

function updateOrderButton() {

    const button =
        document.getElementById(
            "sendOrderBtn"
        );


    if (!button) {

        return;

    }


    const name =
        document.getElementById(
            "customerName"
        );


    const phone =
        document.getElementById(
            "customerPhone"
        );


    const wilaya =
        document.getElementById(
            "wilaya"
        );


    const delivery =
        document.getElementById(
            "deliveryType"
        );


    const hasData =

        name &&
        phone &&
        wilaya &&
        delivery &&

        name.value.trim() &&

        phone.value.trim() &&

        wilaya.value &&

        delivery.value;


    const stock =
        product?.stock;


    const hasStock =

        !(
            stock !== undefined &&
            stock !== null &&
            stock !== "" &&
            Number(stock) <= 0
        );


    button.disabled =
        !(
            hasData &&
            hasStock &&
            product
        );

}

[

/* =====================================================
   SEND ORDER
===================================================== */

async function sendOrder() {

    if (!product) {

        return;

    }


    const name =
        document.getElementById(
            "customerName"
        )
            .value
            .trim();


    const phone =
        document.getElementById(
            "customerPhone"
        )
            .value
            .trim();


    const wilaya =
        document.getElementById(
            "wilaya"
        )
            .value;


    const commune =
        document.getElementById(
            "commune"
        )
            .value
            .trim();


    const address =
        document.getElementById(
            "address"
        )
            .value
            .trim();


    const delivery =
        document.getElementById(
            "deliveryType"
        )
            .value;


    const ownerUid =
        getStoreOwnerUid();


    if (
        !name ||
        !phone ||
        !wilaya ||
        !delivery
    ) {

        showMessage(
            "يرجى ملء جميع المعلومات المطلوبة.",
            "error"
        );

        return;

    }


    if (
        !validatePhone(phone)
    ) {

        showMessage(
            "❌ يرجى إدخال رقم هاتف جزائري صحيح.",
            "error"
        );

        return;

    }


    if (!ownerUid) {

        showMessage(
            "❌ تعذر تحديد صاحب المتجر.",
            "error"
        );

        return;

    }


    const stock =
        product.stock;


    if (
        stock !== undefined &&
        stock !== null &&
        stock !== "" &&
        !isNaN(
            Number(stock)
        )
    ) {

        if (
            quantity >
            Number(stock)
        ) {

            showMessage(
                "❌ الكمية المطلوبة غير متوفرة.",
                "error"
            );

            return;

        }

    }


    const deliveryItem =
        getDeliveryItem();


    if (!deliveryItem) {

        showMessage(
            "❌ تعذر العثور على سعر التوصيل لهذه الولاية.",
            "error"
        );

        return;

    }


    updateDelivery();


    const price =
        Number(
            product.price || 0
        );


    const productsTotal =
        price * quantity;


    const total =
        productsTotal +
        deliveryCost;


    const button =
        document.getElementById(
            "sendOrderBtn"
        );


    button.disabled =
        true;


    button.innerHTML = `

        <i
            class="fa-solid fa-spinner fa-spin"
        ></i>

        جاري إرسال الطلب...

    `;


    try {

        const orderProduct = {

            id:
                String(
                    product.id || ""
                ),

            name:
                String(
                    product.name ||
                    "منتج"
                ),

            price:
                price,

            quantity:
                quantity,

            total:
                productsTotal,

            image:
                String(
                    product.image ||
                    (
                        Array.isArray(
                            product.images
                        ) &&
                        product.images.length
                            ? product.images[0]
                            : ""
                    )
                ),

            images:
                Array.isArray(
                    product.images
                )
                    ? product.images
                    : [],

            color:
                String(
                    selectedColor ||
                    "بدون لون"
                ),

            size:
                String(
                    selectedSize ||
                    "بدون قياس"
                ),

            ownerUid:
                String(
                    ownerUid
                ),

            storeId:
                String(
                    currentStoreId ||
                    ownerUid
                )

        };


        const orderData = {

            ownerUid:
                String(
                    ownerUid
                ),

            storeId:
                String(
                    currentStoreId ||
                    ownerUid
                ),

            storeName:
                currentStoreName,

            name:
                name,

            phone:
                phone,

            wilaya:
                wilaya,

            commune:
                commune,

            address:
                address,

            delivery:
                delivery,

            deliveryPrice:
                Number(
                    deliveryCost
                ),

            products:
                [
                    orderProduct
                ],

            productsTotal:
                Number(
                    productsTotal
                ),

            total:
                Number(
                    total
                ),

            status:
                "قيد المعالجة",

            note:
                "",

            date:
                new Date()
                    .toLocaleString(
                        "ar-DZ"
                    ),

            createdAt:
                serverTimestamp()

        };


        await addDoc(
            collection(
                db,
                "orders"
            ),
            orderData
        );


        showMessage(
            "تم إرسال طلبك بنجاح ✅",
            "success"
        );


        button.innerHTML = `

            <i
                class="fa-solid fa-check"
            ></i>

            تم إرسال الطلب بنجاح

        `;


        setTimeout(
            function () {

                const storeQuery =

                    currentStoreId

                    ?

                    "?store=" +
                    encodeURIComponent(
                        currentStoreId
                    )

                    :

                    "";


                window.location.href =
                    "index.html" +
                    storeQuery;

            },
            1800
        );


    }
    catch (error) {

        console.error(
            "ORDER ERROR:",
            error
        );


        showMessage(
            "❌ فشل إرسال الطلب: " +
            (
                error?.message ||
                "خطأ غير معروف"
            ),
            "error"
        );


        button.disabled =
            false;


        button.innerHTML = `

            <i
                class="fa-solid fa-box"
            ></i>

            إرسال الطلب

        `;

    }

}

function showMessage(

    type
) {

    const message =
        document.getElementById(
            "message"
        );


    if (!message) {

        return;

    }


    message.textContent =
        text;


    message.className =
        "message " +
        type;


    setTimeout(
        function () {

            message.className =
                "message";

        },
        4000
    );

}

/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount() {

    const cart =

        JSON.parse(
            localStorage.getItem(
                "cart"
            ) || "[]"
        );


    let total = 0;


    cart.forEach(
        item => {

            const itemStore =

                String(

                    item.storeId ||
                    item.storeUid ||
                    item.ownerUid ||
                    ""

                );


            if (
                !currentStoreId ||
                !itemStore ||
                itemStore ===
                    String(
                        currentStoreId
                    )
            ) {

                total +=
                    Number(
                        item.quantity ||
                        1
                    );

            }

        }
    );


    cartCount.textContent =
        total;

}
