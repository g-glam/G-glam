/* =========================
   GENERAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Tajawal",Arial,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    padding-bottom:30px;
    transition:
        background .25s ease,
        color .25s ease;
}

button,
input,
select,
textarea{
    font-family:"Tajawal",Arial,sans-serif;
}


/* =========================
   HEADER
========================= */

header{
    height:70px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    background:var(--header);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    display:flex;
    align-items:center;
    justify-content:center;
    width:max-content;
    max-width:65%;
    text-align:center;
}

.logo span{
    color:var(--accent);
    font-size:27px;
    line-height:1.2;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.menu-btn,
.cart-icon{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
    color:var(--text);
    border-radius:10px;
}

.menu-btn:hover,
.cart-icon:hover{
    background:var(--sidebar-hover);
    color:var(--accent);
}

.menu-btn svg,
.cart-icon svg{
    width:29px;
    height:29px;
}

.cart-count{
    position:absolute;
    top:-2px;
    right:-3px;
    width:21px;
    height:21px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--accent);
    color:#FFFFFF;
    font-size:11px;
    font-weight:800;
    border:2px solid var(--header);
}


/* =========================
   STORE INFO
========================= */

.store-info-bar{
    width:100%;
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:11px 18px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
}

.store-info-bar strong{
    color:var(--text);
}


/* =========================
   PRODUCT PAGE
========================= */

.product-page{
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:25px;
}

.back-button{
    display:inline-flex;
    align-items:center;
    gap:8px;
    height:42px;
    padding:0 17px;
    margin-bottom:20px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--card);
    color:var(--text);
    text-decoration:none;
    font-size:14px;
    font-weight:700;
}

.back-button:hover{
    color:var(--accent);
    border-color:var(--accent);
    background:var(--sidebar-hover);
}

.back-button svg{
    width:20px;
    height:20px;
}

.product-layout{
    display:grid;
    grid-template-columns:minmax(0,1.15fr) minmax(330px,.85fr);
    gap:24px;
    align-items:start;
}

.gallery-card,
.product-info-card,
.order-section{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.gallery-card{
    padding:15px;
}

.main-image-wrapper{
    width:100%;
    border-radius:13px;
    overflow:hidden;
    background:var(--card-light);
}

.main-image{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
}

.no-image{
    width:100%;
    aspect-ratio:1/1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    background:var(--card-light);
}

.no-image svg{
    width:65px;
    height:65px;
    color:var(--accent);
    margin-bottom:10px;
}

.thumbnails{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding:12px 2px 3px;
}

.thumbnail{
    width:72px;
    height:72px;
    flex:0 0 72px;
    border:2px solid transparent;
    border-radius:9px;
    overflow:hidden;
    cursor:pointer;
    background:var(--card-light);
    padding:0;
}

.thumbnail.active{
    border-color:var(--accent);
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}


/* =========================
   PRODUCT INFORMATION
========================= */

.product-info-card{
    padding:24px;
}

.product-name{
    color:var(--text);
    font-size:29px;
    font-weight:800;
    line-height:1.45;
    margin-bottom:9px;
}

.product-short-description{
    color:var(--muted);
    font-size:14px;
    line-height:1.8;
    margin-bottom:15px;
}

.price-area{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:20px;
}

.product-price{
    color:var(--accent);
    font-size:27px;
    font-weight:800;
}

.old-price{
    color:var(--muted);
    text-decoration:line-through;
    font-size:16px;
    font-weight:600;
}


/* =========================
   OPTIONS
========================= */

.option-group{
    margin-top:19px;
}

.option-label{
    display:block;
    color:var(--text);
    font-size:15px;
    font-weight:800;
    margin-bottom:9px;
}

.color-options{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.color-button{
    min-width:48px;
    min-height:39px;
    padding:6px 12px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--card-light);
    color:var(--text);
    cursor:pointer;
    font-size:13px;
    font-weight:700;
}

.color-button.active{
    border-color:var(--accent);
    background:var(--accent);
    color:#FFFFFF;
}

.size-select{
    width:100%;
    height:46px;
    padding:0 13px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--input);
    color:var(--input-text);
    outline:none;
}

.size-select:focus{
    border-color:var(--accent);
}


/* =========================
   QUANTITY
========================= */

.quantity-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-top:20px;
}

.quantity-row > strong{
    color:var(--text);
    font-size:15px;
    font-weight:800;
}

.quantity-box{
    display:flex;
    align-items:center;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    background:var(--input);
}

.quantity-button{
    width:42px;
    height:42px;
    border:none;
    background:var(--card-light);
    color:var(--text);
    font-size:21px;
    cursor:pointer;
}

.quantity-button:hover{
    color:var(--accent);
}

.quantity-value{
    width:45px;
    text-align:center;
    font-size:15px;
    font-weight:800;
}


/* =========================
   PRODUCT BUTTONS
========================= */

.product-actions{
    margin-top:18px;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
}

.add-cart-button{
    width:auto !important;
    min-width:135px;
    min-height:38px;
    padding:7px 15px;

    border:1px solid var(--border);
    border-radius:8px;

    background:transparent;
    color:var(--text);

    font-size:12px;
    font-weight:800;

    cursor:pointer;
    transition:.2s;
}

.add-cart-button:hover{
    border-color:var(--accent);
    color:var(--accent);
    background:transparent;
}

.add-cart-button.added{
    background:transparent;
    color:var(--accent);
    border-color:var(--accent);
}

.buy-button{
    width:100%;
    height:52px;
    margin-top:15px;

    border:none;
    border-radius:11px;

    background:var(--accent);
    color:#FFFFFF;

    font-size:16px;
    font-weight:800;

    cursor:pointer;
}

.buy-button:hover{
    background:var(--accent-dark);
}


/* =========================
   ORDER SECTION
========================= */

.order-section{
    margin-top:25px;
    padding:24px;
    scroll-margin-top:90px;
}

.order-title{
    color:var(--text);
    font-size:22px;
    font-weight:800;
    margin-bottom:5px;
}

.order-subtitle{
    color:var(--muted);
    font-size:13px;
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));

    border:1px solid #D1D5DB;
    border-radius:14px;

    overflow:hidden;

    background:var(--card);
}

.form-group{
    min-width:0;

    background:var(--card);

    border:0;
    border-radius:0;

    padding:14px;

    border-bottom:1px solid #D1D5DB;
}

.form-group:nth-child(odd){
    border-left:1px solid #D1D5DB;
}

.form-group.full{
    grid-column:1/-1;
    border-left:0;
}

.form-group:last-child{
    border-bottom:0;
}

.form-label{
    display:block;
    color:var(--text);
    font-size:14px;
    font-weight:700;
    margin-bottom:7px;
}

.form-control{
    width:100%;
    height:47px;
    padding:0 13px;

    border:1px solid #D1D5DB;
    border-radius:10px;

    outline:none;

    background:var(--input);
    color:var(--input-text);

    font-size:14px;
}

textarea.form-control{
    height:95px;
    padding:12px 13px;
    resize:vertical;
}

select.form-control{
    appearance:auto;
    -webkit-appearance:auto;
    cursor:pointer;
}

.form-control:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 2px rgba(0,0,0,.03);
}


/* =========================
   DELIVERY SELECT
========================= */

.delivery-select-wrapper{
    width:100%;
}

/* =========================

function escapeHtml(value){

    return String(value??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   SAFE URL
========================= */

function safeUrl(value){

    if(!value) return "";

    const url=String(value).trim();

    if(
        /^https?:\/\//i.test(url) ||
        /^data:image\//i.test(url)
    ){
        return url;
    }

    return "";

}


/* =========================
   COLOR HELPERS
========================= */

function normalizeHexColor(color){

    if(typeof color!=="string"){
        return null;
    }

    let value=color.trim();

    if(!value) return null;

    if(!value.startsWith("#")){
        value="#"+value;
    }

    if(/^#[0-9a-fA-F]{3}$/.test(value)){

        value=
            "#"+
            value[1]+value[1]+
            value[2]+value[2]+
            value[3]+value[3];

    }

    if(!/^#[0-9a-fA-F]{6}$/.test(value)){
        return null;
    }

    return value.toUpperCase();

}


function hexToRgb(hex){

    const value=normalizeHexColor(hex);

    if(!value) return null;

    return{

        r:parseInt(value.substring(1,3),16),

        g:parseInt(value.substring(3,5),16),

        b:parseInt(value.substring(5,7),16)

    };

}


function rgbToHex(r,g,b){

    const clamp=value=>
        Math.max(
            0,
            Math.min(
                255,
                Math.round(value)
            )
        );

    return "#"+
        [r,g,b]
        .map(
            value=>
                clamp(value)
                .toString(16)
                .padStart(2,"0")
        )
        .join("")
        .toUpperCase();

}


function darkenColor(hex,amount=.20){

    const rgb=hexToRgb(hex);

    if(!rgb) return "#333333";

    return rgbToHex(
        rgb.r*(1-amount),
        rgb.g*(1-amount),
        rgb.b*(1-amount)
    );

}


function rgbaFromHex(hex,alpha=.08){

    const rgb=hexToRgb(hex);

    if(!rgb){
        return `rgba(0,0,0,${alpha})`;
    }

    return `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;

}

    if(typeof themeOrStore==="string"){

    const store=themeOrStore||{};

    const themeType=
        String(
            store.themeType||""
        )
        .toLowerCase()
        .trim();


    if(
        themeType==="gradient" &&
        Array.isArray(store.themeColors)
    ){

        const colors=
            store.themeColors
            .map(normalizeHexColor)
            .filter(Boolean)
            .slice(0,4);

        if(colors.length>=2){

            const direction=
                String(
                    store.themeDirection||
                    "135deg"
                );

            const safeDirection=
                /^(\d{1,3}deg|to\s+(left|right|top|bottom)(\s+(left|right|top|bottom))?)$/i
                .test(direction)
                ?
                direction
                :
                "135deg";

            const gradient=
                "linear-gradient("+
                safeDirection+
                ", "+
                colors.join(", ")+
                ")";

            document.body.classList.add(
                "theme-custom-gradient"
            );

            document.body.style.setProperty(
                "--accent",
                colors[0]
            );

            document.body.style.setProperty(
                "--accent-dark",
                darkenColor(colors[0])
            );

            document.body.style.setProperty(
                "--theme-gradient",
                gradient
            );

            document.body.style.setProperty(
                "--sidebar-hover",
                rgbaFromHex(colors[0])
            );

            themeColorMeta.content=colors[0];

            return;
        }

    }


    if(themeType==="solid"){

        const solidColor=
            normalizeHexColor(
                Array.isArray(store.themeColors)
                ?
                store.themeColors[0]
                :
                null
            ) ||
            normalizeHexColor(
                store.themeColor
            );

        const savedTheme=
            String(
                store.theme||""
            )
            .toLowerCase()
            .trim();

        if(validThemes.includes(savedTheme)){

            document.body.classList.add(
                "theme-"+savedTheme
            );

            if(solidColor){

                document.body.style.setProperty(
                    "--accent",
                    solidColor
                );

                document.body.style.setProperty(
                    "--accent-dark",
                    darkenColor(solidColor)
                );

                document.body.style.setProperty(
                    "--sidebar-hover",
                    rgbaFromHex(solidColor)
                );

            }

            themeColorMeta.content=
                solidColor ||
                themeColors[savedTheme];

            return;
        }


        if(solidColor){

            document.body.classList.add(
                "theme-custom-solid"
            );

            document.body.style.setProperty(
                "--accent",
                solidColor
            );

            document.body.style.setProperty(
                "--accent-dark",
                darkenColor(solidColor)
            );

            document.body.style.setProperty(
                "--sidebar-hover",
                rgbaFromHex(solidColor)
            );

            themeColorMeta.content=solidColor;

            return;
        }

    }


    let theme=
        String(
            store.theme||"orange"
        )
        .toLowerCase()
        .trim();

    if(!validThemes.includes(theme)){
        theme="orange";
    }

    document.body.classList.add(
        "theme-"+theme
    );

    themeColorMeta.content=
        themeColors[theme]||"#FFFFFF";

}


/* =========================
   SOCIAL URL
========================= */

function normalizeSocialUrl(value,type){

    if(!value) return "";

    let url=String(value).trim();

    if(!url) return "";

    if(/^https?:\/\//i.test(url)){
        return url;
    }

    if(type==="whatsapp"){

        let number=
            url.replace(
                /[^0-9+]/g,
                ""
            );

        number=
            number.replace(
                /^\+/,
                ""
            );

        if(/^0[567]/.test(number)){
            number=
                "213"+
                number.substring(1);
        }

        return "https://wa.me/"+number;
    }

    if(type==="instagram"){
        return "https://instagram.com/"+
            url.replace(/^@/,"");
    }

    if(type==="tiktok"){
        return "https://www.tiktok.com/@"+
            url.replace(/^@/,"");
    }

    if(type==="telegram"){
        return "https://t.me/"+
            url.replace(/^@/,"");
    }

    if(type==="facebook"){
        return "https://facebook.com/"+
            url.replace(/^@/,"");
    }

    if(type==="youtube"){
        return "https://youtube.com/"+
            url.replace(/^@/,"");
    }

    if(type==="twitter"){
        return "https://x.com/"+
            url.replace(/^@/,"");
    }

    return url;

}


function addSocialLink(
    type,
    label,
    value,
    icon
){

    const url=
        normalizeSocialUrl(
            value,
            type
        );

    if(!url) return;

    const link=
        document.createElement("a");

    link.className="social-link";

    link.href=url;

    link.target="_blank";

    link.rel="noopener noreferrer";

    link.innerHTML=`

        <svg aria-hidden="true">
            <use href="#icon-${icon}"></use>
        </svg>

        <span>
            ${escapeHtml(label)}
        </span>

    `;

    socialLinks.appendChild(link);

}

/* =========================
   STORE
========================= */

async function loadStore(){

    if(!currentStoreId){
        return null;
    }

    try{

        const storeRef=
            doc(
                db,
                "stores",
                currentStoreId
            );

        const storeSnap=
            await getDoc(storeRef);

        let storeData={};

        if(storeSnap.exists()){

            storeData={
                id:storeSnap.id,
                ...storeSnap.data()
            };

        }else{

            storeData={
                id:currentStoreId
            };

        }


        try{

            const settingsRef=
                doc(
                    db,
                    "storeSettings",
                    currentStoreId
                );

            const settingsSnap=
                await getDoc(settingsRef);

            if(settingsSnap.exists()){

                const settingsData=
                    settingsSnap.data();

                storeData={
                    ...storeData,
                    ...settingsData,
                    id:currentStoreId
                };

            }

        }catch(settingsError){

            console.warn(
                "Store settings error:",
                settingsError
            );

        }


        if(storeData.ownerUid){

            currentOwnerUid=
                String(
                    storeData.ownerUid
                );

        }


        if(!currentOwnerUid){

            if(
                storeData.id &&
                /^[A-Za-z0-9_-]{20,}$/.test(
                    String(storeData.id)
                )
            ){

                currentOwnerUid=
                    String(storeData.id);

            }

        }


        if(currentOwnerUid){

            localStorage.setItem(
                "ownerUid",
                currentOwnerUid
            );

        }

        if(currentStoreId){

            localStorage.setItem(
                "storeId",
                currentStoreId
            );

        }


        return storeData;

    }catch(error){

        console.error(
            "Store error:",
            error
        );

    }

    return null;

}

/* =========================
   LOAD DELIVERY DATA
========================= */

async function loadDeliveryData(){

    deliveryData=[];
    deliveryLoaded=false;

    const ownerUid=
        currentOwnerUid ||
        product?.ownerUid ||
        localStorage.getItem("ownerUid") ||
        null;


    if(!ownerUid){

        console.warn(
            "لا يوجد ownerUid لتحميل بيانات التوصيل."
        );

        populateWilayaSelect();

        return;

    }


    currentOwnerUid=ownerUid;


    try{

        const deliveryCollection=
            collection(
                db,
                "stores",
                ownerUid,
                "delivery"
            );

        const snap=
            await getDocs(
                deliveryCollection
            );


        snap.forEach(
            item=>{

                const data=
                    item.data()||{};

                deliveryData.push({

                    id:item.id,

                    office:
                        Number(
                            data.office||0
                        ),

                    home:
                        Number(
                            data.home||0
                        )

                });

            }
        );


        deliveryData.sort(
            (a,b)=>{

                const aNumber=
                    parseInt(
                        String(a.id).split("-")[0]
                    )||0;

                const bNumber=
                    parseInt(
                        String(b.id).split("-")[0]
                    )||0;

                return aNumber-bNumber;

            }
        );


        deliveryLoaded=true;

        populateWilayaSelect();

    }catch(error){

        console.error(
            "Delivery loading error:",
            error
        );

        deliveryData=[];
        deliveryLoaded=false;

        populateWilayaSelect();

    }

}


/* =========================
   POPULATE WILAYA
========================= */

function populateWilayaSelect(){

    const select=
        document.getElementById(
            "customerWilaya"
        );

    if(!select){
        return;
    }


    select.innerHTML="";


    const firstOption=
        document.createElement("option");

    firstOption.value="";

    firstOption.textContent=
        deliveryLoaded
        ?
        "اختر الولاية"
        :
        "تعذر تحميل الولايات";

    firstOption.disabled=
        !deliveryLoaded;

    firstOption.selected=true;

    select.appendChild(
        firstOption
    );


    if(!deliveryLoaded){

        select.disabled=true;

        return;

    }


    select.disabled=false;


    if(!deliveryData.length){

        const emptyOption=
            document.createElement("option");

        emptyOption.value="";

        emptyOption.textContent=
            "لا توجد أسعار توصيل متاحة";

        emptyOption.disabled=true;

        select.appendChild(
            emptyOption
        );

        select.disabled=true;

        return;

    }


    deliveryData.forEach(
        item=>{

            const option=
                document.createElement("option");

            option.value=item.id;

            option.textContent=item.id;

            select.appendChild(
                option
            );

        }
    );

}


/* =========================
   FIND DELIVERY
========================= */

function getSelectedDelivery(){

    const select=
        document.getElementById(
            "customerWilaya"
        );

    if(!select){
        return null;
    }


    const wilaya=
        String(
            select.value||""
        ).trim();


    if(!wilaya){
        return null;
    }


    return deliveryData.find(
        item=>
            String(item.id).trim()===
            wilaya
    )||null;

}


/* =========================
   PRODUCT
========================= */

async function loadProduct(){

    if(!productId){

        showError(
            "لم يتم تحديد المنتج."
        );

        return;

    }


    try{

        const productRef=
            doc(
                db,
                "products",
                productId
            );

        const productSnap=
            await getDoc(
                productRef
            );

        if(!productSnap.exists()){

            showError(
                "المنتج غير موجود."
            );

            return;

        }


        product={
            id:productSnap.id,
            ...productSnap.data()
        };


        if(
            currentStoreId &&
            product.storeId &&
            product.storeId!==currentStoreId
        ){

            showError(
                "هذا المنتج لا ينتمي إلى هذا المتجر."
            );

            return;

        }


        currentStoreId=
            product.storeId ||
            currentStoreId;


        currentOwnerUid=
            product.ownerUid ||
            currentOwnerUid ||
            localStorage.getItem("ownerUid") ||
            null;


        if(
            currentStoreId &&
            (!currentStore ||
            currentStore.id!==currentStoreId)
        ){

            currentStore=
                await loadStore();

            if(currentStore){

                /*
                    جلب الاسم بنفس طريقة index.html
                */

                const name =
                    currentStore.storeName ||
                    currentStore.name ||
                    "G-Glam";

                currentStoreName=
                    String(name).trim() ||
                    "G-Glam";


                headerStoreName.textContent=
                    currentStoreName;

                storeInfo.innerHTML=`
                    <strong>
                        ${escapeHtml(currentStoreName)}
                    </strong>
                `;

                applyStoreTheme(
                    currentStore
                );

                renderSocialLinks();

            }

        }


        await loadDeliveryData();


        renderProduct();


    }catch(error){

        console.error(
            error
        );

        showError(
            "حدث خطأ أثناء تحميل المنتج."
        );

    }

}

                            يُحسب حسب الولاية
                        </strong>

                    </div>


                    <div class="summary-total">

                        <span>
                            المجموع
                        </span>

                        <span
                            class="total-value"
                            id="summaryTotal"
                        >
                            0 دج
                        </span>

                    </div>

                </div>


                <button
                    type="submit"
                    class="submit-order"
                    id="submitOrder"

    `;

}

   PRICE
========================= */

function formatPrice(value){

    return Number(
        value||0
    ).toLocaleString(
        "fr-FR"
    );

}

========================= */

    productContainer.innerHTML=`

/* =========================
   PRODUCT EVENTS
========================= */

function bindProductEvents(){

    const backButton=
        document.getElementById(
            "backButton"
        );

    if(backButton){

        backButton.addEventListener(
            "click",
            event=>{

                event.preventDefault();

                goToStore();

            }
        );

    }


    document
        .querySelectorAll(".thumbnail")
        .forEach(
            thumbnail=>{

                thumbnail.addEventListener(
                    "click",
                    function(){

                        const image=
                            this.dataset.image;

                        const main=
                            document.getElementById(
                                "mainProductImage"
                            );

                        if(main){
                            main.src=image;
                        }

                        document
                            .querySelectorAll(".thumbnail")
                            .forEach(
                                item=>
                                    item.classList.remove(
                                        "active"
                                    )
                            );

                        this.classList.add(
                            "active"
                        );

                    }
                );

            }
        );


    document
        .querySelectorAll(".color-button")
        .forEach(
            button=>{

                button.addEventListener(
                    "click",
                    function(){

                        selectedColor=
                            this.dataset.color;

                        document
                            .querySelectorAll(".color-button")
                            .forEach(
                                item=>
                                    item.classList.remove(
                                        "active"
                                    )
                            );

                        this.classList.add(
                            "active"
                        );

                    }
                );

            }
        );


    const sizeSelect=
        document.getElementById(
            "sizeSelect"
        );

    if(sizeSelect){

        sizeSelect.addEventListener(
            "change",
            function(){

                selectedSize=
                    this.value;

            }
        );

    }


    const decrease=
        document.getElementById(
            "decreaseQuantity"
        );

    if(decrease){

        decrease.addEventListener(
            "click",
            function(){

                if(quantity>1){

                    quantity--;

                    updateQuantityUI();

                    updateSummary();

                }

            }
        );

    }


    const increase=
        document.getElementById(
            "increaseQuantity"
        );

    if(increase){

        increase.addEventListener(
            "click",
            function(){

                quantity++;

                updateQuantityUI();

                updateSummary();

            }

        );

    }


    const addCartButton=
        document.getElementById(
            "addCartButton"
        );

    if(addCartButton){

        addCartButton.addEventListener(
            "click",
            addCurrentProductToCart
        );

    }


    const buyButton=
        document.getElementById(
            "buyButton"
        );

    if(buyButton){

        buyButton.addEventListener(
            "click",
            function(){

                const orderSection=
                    document.getElementById(
                        "orderSection"
                    );

                if(orderSection){

                    orderSection.scrollIntoView({
                        behavior:"smooth",
                        block:"start"
                    });

                }

            }

        );

    }


    const orderForm=
        document.getElementById(
            "orderForm"
        );

    if(orderForm){

        orderForm.addEventListener(
            "submit",
            submitOrder
        );

    }


    const deliveryTypeSelect=
        document.getElementById(
            "deliveryType"
        );

    if(deliveryTypeSelect){

        deliveryTypeSelect.addEventListener(
            "change",
            updateDelivery
        );

    }


    const wilayaSelect=
        document.getElementById(
            "customerWilaya"
        );

    if(wilayaSelect){

        wilayaSelect.addEventListener(
            "change",
            updateDelivery
        );

    }

}

   QUANTITY UI
========================= */

function updateQuantityUI(){

    const value=

    if(value){

/* =========================
   CART
========================= */

function getCart(){

    try{

        const cart=
            JSON.parse(
                localStorage.getItem(
                    "gglamCart"
                )||"[]"
            );

        return Array.isArray(cart)
            ?
            cart
            :
            [];

    }catch(error){

        return [];

    }

}


function saveCart(cart){

    localStorage.setItem(
        "gglamCart",
        JSON.stringify(cart)
    );

    updateCartCount();

}


function addCurrentProductToCart(){

    if(!product) return;

    const cart=getCart();

    const itemId=
        product.id+
        "_"+
        selectedColor+
        "_"+
        selectedSize;

    const existing=
        cart.find(
            item=>
                item.cartItemId===itemId
        );

    const price=
        Number(
            product.price||0
        );


    if(existing){

        existing.quantity=
            Number(
                existing.quantity||0
            )+
            quantity;

    }else{

        cart.push({

            cartItemId:itemId,

            id:product.id,

            productId:product.id,

            storeId:
                product.storeId||
                currentStoreId,

            ownerUid:
                product.ownerUid||
                currentOwnerUid||
                "",

            storeName:
                currentStoreName,

            name:
                product.name||
                "منتج",

            price:price,

            quantity:quantity,

            color:selectedColor,

            size:selectedSize,

            image:
                product.image||
                (
                    Array.isArray(product.images)
                    ?
                    product.images[0]
                    :
                    ""
                )||
                "",

            addedAt:
                new Date().toISOString()

        });

    }


    saveCart(cart);


    const button=
        document.getElementById(
            "addCartButton"
        );

    if(button){

        button.classList.add(
            "added"
        );

        button.textContent=
            "✓ تمت الإضافة";

        setTimeout(
            function(){

                button.classList.remove(
                    "added"
                );

                button.textContent=
                    "أضف إلى السلة";

            },
            1500
        );

    }

}


/* =========================
   CART COUNT
========================= */

function updateCartCount(){

    const cart=getCart();

    const count=
        cart.reduce(
            (
                total,
                item
            )=>
                total+
                Number(
                    item.quantity||0
                ),
            0
        );

    cartCount.textContent=count;

}


/* =========================
   SUMMARY
========================= */

function updateSummary(){

    if(!product) return;

    const price=
        Number(
            product.price||0
        );

    const total=
        price*quantity+
        Number(
            deliveryCost||0
        );


    const productName=
        document.getElementById(
            "summaryProduct"
        );

    const quantityElement=
        document.getElementById(
            "summaryQuantity"
        );

    const productPrice=
        document.getElementById(
            "summaryProductPrice"
        );

    const deliveryElement=
        document.getElementById(
            "summaryDelivery"
        );

    const totalElement=
        document.getElementById(
            "summaryTotal"
        );


    if(productName){

        productName.textContent=
            product.name||
            "منتج";

    }


    if(quantityElement){

        quantityElement.textContent=
            quantity;

    }


    if(productPrice){

        productPrice.textContent=
            formatPrice(
                price*quantity
            )+
            " دج";

    }


    if(deliveryElement){

        if(
            deliveryCost>0
        ){

            deliveryElement.textContent=
                formatPrice(
                    deliveryCost
                )+
                " دج";

        }else{

            deliveryElement.textContent=
                "يُحسب حسب الولاية";

        }

    }


    if(totalElement){

        totalElement.textContent=
            formatPrice(total)+
            " دج";

    }

}


/* =========================
   DELIVERY
========================= */

function updateDelivery(){

    deliveryCost=0;


    const wilayaSelect=
        document.getElementById(
            "customerWilaya"
        );

    const deliveryTypeSelect=
        document.getElementById(
            "deliveryType"
        );


    const wilaya=
        wilayaSelect
        ?
        String(
            wilayaSelect.value||""
        ).trim()
        :
        "";


    const type=
        deliveryTypeSelect
        ?
        String(
            deliveryTypeSelect.value||
            "التوصيل إلى المنزل"
        )
        :
        "التوصيل إلى المنزل";


    if(!wilaya){

        updateSummary();

        return;

    }


    const found=
        getSelectedDelivery();


    if(!found){

        deliveryCost=0;

        updateSummary();

        return;

    }


    if(
        type.includes("المكتب")
    ){

        deliveryCost=
            Number(
                found.office||0
            );

    }else{

        deliveryCost=
            Number(
                found.home||0
            );

    }


    updateSummary();

}


/* =========================
   PHONE VALIDATION
========================= */

function normalizePhone(phone){

    return String(
        phone||""
    )
    .trim()
    .replace(
        /[\s()-]/g,
        ""
    );

}


function isValidAlgerianPhone(phone){

    const normalized=
        normalizePhone(phone);

    return /^(0[5-7][0-9]{8}|\+213[5-7][0-9]{8})$/
        .test(
            normalized
        );

}


/* =========================
   SUBMIT ORDER
========================= */

async function submitOrder(event){

    event.preventDefault();

    if(!product) return;


    const submitButton=
        document.getElementById(
            "submitOrder"
        );

    const successMessage=
        document.getElementById(
            "successMessage"
        );


    const customerName=
        document.getElementById(
            "customerName"
        ).value.trim();


    const customerPhoneRaw=
        document.getElementById(
            "customerPhone"
        ).value.trim();


    const customerPhone=
        normalizePhone(
            customerPhoneRaw
        );


    const customerWilaya=
        document.getElementById(
            "customerWilaya"
        ).value.trim();


    const customerCommune=
        document.getElementById(
            "customerCommune"
        ).value.trim();


    const customerAddress=
        document.getElementById(
            "customerAddress"
        ).value.trim();


    const deliveryTypeSelect=
        document.getElementById(
            "deliveryType"
        );


    const deliveryType=
        deliveryTypeSelect
        ?
        String(
            deliveryTypeSelect.value||
            "التوصيل إلى المنزل"
        )
        :
        "التوصيل إلى المنزل";


    if(
        !customerName||
        !customerPhone||
        !customerWilaya||
        !customerCommune||
        !customerAddress
    ){

        alert(
            "يرجى إدخال جميع المعلومات المطلوبة."
        );

        return;

    }


    if(
        !isValidAlgerianPhone(
            customerPhone
        )
    ){

        alert(
            "يرجى إدخال رقم هاتف جزائري صحيح مثل 0555555555 أو +213555555555."
        );

        document
            .getElementById(
                "customerPhone"
            )
            .focus();

        return;

    }


    const selectedDelivery=
        getSelectedDelivery();


    if(!selectedDelivery){

        alert(
            "يرجى اختيار الولاية بشكل صحيح."
        );

        return;

    }


    if(
        deliveryType.includes("المكتب")
    ){

        deliveryCost=
            Number(
                selectedDelivery.office||0
            );

    }else{

        deliveryCost=
            Number(
                selectedDelivery.home||0
            );

    }


    if(
        !Number.isFinite(deliveryCost) ||
        deliveryCost<0
    ){

        alert(
            "تعذر تحديد سعر التوصيل لهذه الولاية."
        );

        return;

    }


    updateSummary();


    submitButton.disabled=true;

    submitButton.textContent=
        "جاري إرسال الطلب...";


    try{

        const price=
            Number(
                product.price||0
            );

        const productTotal=
            price*quantity;

        const total=
            productTotal+
            Number(
                deliveryCost||0
            );


        const finalOwnerUid=
            product.ownerUid||
            currentOwnerUid||
            localStorage.getItem("ownerUid")||
            "";


        const finalStoreId=
            product.storeId||
            currentStoreId||
            localStorage.getItem("storeId")||
            "";


        const orderData={

            productId:
                product.id,

            productName:
                product.name||
                "منتج",

            productPrice:
                price,

            quantity:
                quantity,

            color:
                selectedColor,

            size:
                selectedSize,

            productTotal:
                productTotal,

            deliveryCost:
                Number(
                    deliveryCost||0
                ),

            total:
                total,

            customerName:
                customerName,

            customerPhone:
                customerPhone,

            customerWilaya:
                customerWilaya,

            customerCommune:
                customerCommune,

            customerAddress:
                customerAddress,

            deliveryType:
                deliveryType,

            storeId:
                finalStoreId,

            ownerUid:
                finalOwnerUid,

            storeName:
                currentStoreName||
                product.storeName||
                "",

            status:
                "جديد",

            createdAt:
                serverTimestamp()

        };


        await addDoc(
            collection(
                db,
                "orders"
            ),
            orderData
        );


        if(
            typeof fbq==="function"
        ){

            fbq(
                "track",
                "Purchase",
                {
                    value:total,
                    currency:"DZD",
                    content_name:
                        product.name||
                        "منتج"
                }
            );

        }


        if(
            window.ttq &&
            typeof window.ttq.track==="function"
        ){

            window.ttq.track(
                "CompletePayment",
                {
                    value:total,
                    currency:"DZD",
                    content_name:
                        product.name||
                        "منتج"
                }
            );

        }


        successMessage.style.display=
            "block";

        successMessage.textContent=
            "تم إرسال طلبك بنجاح، سنتواصل معك لتأكيد الطلب.";


        document
            .getElementById(
                "orderForm"
            )
            .reset();


        const deliveryTypeSelectAfterOrder=
            document.getElementById(
                "deliveryType"
            );

        if(deliveryTypeSelectAfterOrder){

            deliveryTypeSelectAfterOrder.value=
                "التوصيل إلى المنزل";

        }


        const wilayaSelect=
            document.getElementById(
                "customerWilaya"
            );

        if(wilayaSelect){

            wilayaSelect.value="";

        }


        selectedColor=
            Array.isArray(product.colors) &&
            product.colors.length
            ?
            product.colors[0]
            :
            "بدون لون";


        selectedSize=
            Array.isArray(product.sizes) &&
            product.sizes.length
            ?
            product.sizes[0]
            :
            "";


        quantity=1;

        deliveryCost=0;


        document
            .querySelectorAll(".color-button")
            .forEach(
                (button,index)=>{

                    button.classList.toggle(
                        "active",
                        index===0
                    );

                }
            );


        const sizeSelect=
            document.getElementById(
                "sizeSelect"
            );

        if(sizeSelect){

            sizeSelect.value=
                selectedSize;

        }


        updateQuantityUI();

        updateSummary();


        window.scrollTo({

            top:
                successMessage
                .getBoundingClientRect()
                .top+
                window.scrollY-
                100,

            behavior:"smooth"

        });


    }catch(error){

        console.error(
            "Order error:",
            error
        );

        alert(
            "حدث خطأ أثناء إرسال الطلب. يرجى المحاولة مرة أخرى."
        );

    }finally{

        submitButton.disabled=false;

        submitButton.textContent=
            "تأكيد الطلب";

    }

}
