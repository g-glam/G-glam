<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | منتجاتي</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.googleapis.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

:root{

--orange:#F47B20;
--orange-dark:#DF6810;

--bg:#F7F7F7;
--sidebar:#EEEEEE;
--card:#FFFFFF;

--text:#333;
--dark:#222;
--muted:#777;

--border:#E5E5E5;

--success:#198754;
--success-bg:#E8F7EE;

--danger:#DC3545;
--danger-bg:#FDEBEC;

--input:#FFFFFF;
--soft:#FAFAFA;
--hover:#E3E3E3;

--shadow:0 4px 18px rgba(0,0,0,.055);

}


/* =====================================================
DARK MODE VARIABLES
===================================================== */

body.dark-mode{

--bg:#151515;
--sidebar:#202020;
--card:#242424;

--text:#E8E8E8;
--dark:#FFFFFF;
--muted:#A9A9A9;

--border:#383838;

--success-bg:#183526;
--danger-bg:#3A2024;

--input:#292929;
--soft:#202020;
--hover:#303030;

--shadow:0 5px 20px rgba(0,0,0,.25);

}


/* =====================================================
GENERAL
===================================================== */

*{

box-sizing:border-box;
margin:0;
padding:0;

font-family:"Tajawal",Arial,sans-serif;

}

body{

background:var(--bg);
color:var(--text);

min-height:100vh;

transition:
background .25s ease,
color .25s ease;

}


/* =====================================================
SIDEBAR
===================================================== */

.sidebar{

position:fixed;

right:0;
top:0;

height:100vh;

width:75px;

background:var(--sidebar);

border-left:1px solid var(--border);

overflow:hidden;

transition:.3s;

z-index:1100;

box-shadow:-3px 0 15px rgba(0,0,0,.04);

}

.sidebar:hover{

width:240px;

}


/* =====================================================
LOGO
===================================================== */

.logo{

height:78px;

display:flex;

align-items:center;

justify-content:center;

border-bottom:1px solid var(--border);

white-space:nowrap;

padding:10px;

}

.logo img{

width:48px;

height:48px;

object-fit:contain;

display:block;

transition:.3s;

}

.sidebar:hover .logo img{

width:130px;

height:55px;

}


/* =====================================================
MENU
===================================================== */

.menu{

margin-top:18px;

padding:0 10px;

}

.menu a{

display:flex;

align-items:center;

gap:15px;

height:52px;

padding:0 10px;

margin-bottom:7px;

border-radius:12px;

color:var(--muted);

text-decoration:none;

white-space:nowrap;

transition:.2s;

}

.menu a:hover{

background:var(--hover);

color:var(--dark);

}

.menu a.active{

background:var(--orange);

color:white;

box-shadow:
0 5px 15px rgba(244,123,32,.20);

}

.icon{

min-width:35px;

text-align:center;

font-size:20px;

}

.text{

opacity:0;

transition:.25s;

font-size:14px;

font-weight:bold;

}

.sidebar:hover .text{

opacity:1;

}


/* =====================================================
TOP BAR
===================================================== */

.topbar{

position:fixed;

top:0;

right:75px;

left:0;

height:78px;

background:var(--card);

border-bottom:1px solid var(--border);

display:flex;

align-items:center;

justify-content:space-between;

padding:0 25px;

z-index:1000;

box-shadow:
0 2px 12px rgba(0,0,0,.04);

transition:.3s;

}


/* =====================================================
TOPBAR RIGHT SIDE
===================================================== */

.topbar-right{

display:flex;

align-items:center;

gap:10px;

}


/* =====================================================
DARK MODE BUTTON
===================================================== */

.theme-toggle{

width:46px;

height:46px;

border:1px solid var(--border);

border-radius:12px;

background:var(--soft);

color:var(--text);

display:flex;

align-items:center;

justify-content:center;

font-size:21px;

cursor:pointer;

transition:.25s;

flex-shrink:0;

}

.theme-toggle:hover{

background:var(--orange);

border-color:var(--orange);

color:white;

transform:translateY(-1px);

}

.theme-toggle:active{

transform:scale(.94);

}


/* =====================================================
STORE TOP
===================================================== */

.store-top{

display:flex;

align-items:center;

gap:12px;

min-width:0;

}


/* =====================================================
STORE IMAGE
===================================================== */

.store-image{

width:48px;

height:48px;

border-radius:50%;

object-fit:cover;

background:#F1F1F1;

border:2px solid #FFE0C8;

flex-shrink:0;

}


/* =====================================================
STORE DETAILS
===================================================== */

.store-details{

display:flex;

flex-direction:column;

min-width:0;

}

.store-label{

font-size:11px;

color:var(--muted);

margin-bottom:2px;

}

.store-top-name{

font-size:16px;

font-weight:800;

color:var(--dark);

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

max-width:250px;

}


/* =====================================================
VIEW STORE
===================================================== */

.view-store-btn{

display:flex;

align-items:center;

gap:7px;

background:#FFF1E6;

color:var(--orange-dark);

text-decoration:none;

padding:10px 15px;

border-radius:11px;

font-size:13px;

font-weight:700;

transition:.2s;

white-space:nowrap;

border:1px solid #FFE0CA;

cursor:pointer;

}

body.dark-mode .view-store-btn{

background:#38271D;

border-color:#5A3824;

color:#FF9A52;

}

.view-store-btn:hover{

background:var(--orange);

color:white;

}


/* =====================================================
CONTENT
===================================================== */

.content{

margin-right:75px;

padding:103px 25px 25px;

}


/* =====================================================
MESSAGES
===================================================== */

.message{

display:none;

padding:13px 16px;

border-radius:12px;

margin-bottom:18px;

text-align:center;

font-size:14px;

white-space:pre-line;

}

.success-message{

background:var(--success-bg);

color:#146c43;

border:1px solid #c9ead7;

}

body.dark-mode .success-message{

color:#8BE0B0;

border-color:#28583D;

}

.error-message{

background:var(--danger-bg);

color:#842029;

border:1px solid #f1c4ca;

}

body.dark-mode .error-message{

color:#FF9CA7;

border-color:#64333A;

}


/* =====================================================
TOOLBAR
===================================================== */

.toolbar{

display:flex;

align-items:center;

justify-content:space-between;

gap:15px;

margin-bottom:20px;

}

.search-box{

flex:1;

}

.search-box input{

width:100%;

height:48px;

border:1px solid var(--border);

background:var(--input);

color:var(--text);

border-radius:13px;

padding:0 17px;

font-size:14px;

outline:none;

transition:.2s;

}

.search-box input::placeholder{

color:var(--muted);

}

.search-box input:focus{

border-color:var(--orange);

box-shadow:
0 0 0 3px rgba(244,123,32,.08);

}

.add-product-btn{

height:48px;

padding:0 20px;

border:none;

border-radius:13px;

background:var(--orange);

color:white;

font-size:14px;

font-weight:bold;

cursor:pointer;

white-space:nowrap;

transition:.2s;

}

.add-product-btn:hover{

background:var(--orange-dark);

}


/* =====================================================
PRODUCT GRID
===================================================== */

.products-grid{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:18px;

}


/* =====================================================
PRODUCT CARD
===================================================== */

.product-card{

background:var(--card);

border:1px solid var(--border);

border-radius:18px;

overflow:hidden;

box-shadow:var(--shadow);

transition:.25s;

}

.product-card:hover{

transform:translateY(-3px);

box-shadow:
0 9px 25px rgba(0,0,0,.12);

}


/* =====================================================
IMAGE
===================================================== */

.product-image-box{

position:relative;

width:100%;

aspect-ratio:1/1;

background:#F1F1F1;

overflow:hidden;

}

body.dark-mode .product-image-box{

background:#303030;

}

.product-image{

width:100%;

height:100%;

object-fit:cover;

display:block;

}

.no-image{

width:100%;

height:100%;

display:flex;

align-items:center;

justify-content:center;

font-size:55px;

color:#bbb;

}

.image-count{

position:absolute;

left:10px;

top:10px;

background:rgba(0,0,0,.68);

color:white;

padding:6px 9px;

border-radius:20px;

font-size:12px;

}


/* =====================================================
PRODUCT INFO
===================================================== */

.product-info{

padding:15px;

}

.product-info h3{

font-size:16px;

color:var(--dark);

margin-bottom:8px;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

}

.product-price{

font-size:18px;

font-weight:800;

color:var(--orange);

margin-bottom:7px;

}

.product-stock{

font-size:13px;

color:var(--muted);

margin-bottom:7px;

}

.product-stock strong{

color:var(--dark);

}

.product-colors,
.product-sizes{

font-size:12px;

color:var(--muted);

line-height:1.8;

}


/* =====================================================
ACTIONS
===================================================== */

.product-actions{

display:grid;

grid-template-columns:1fr 1fr;

gap:8px;

margin-top:14px;

}

.edit-btn,
.delete-btn{

border:none;

padding:10px 5px;

border-radius:10px;

font-family:"Tajawal",Arial,sans-serif;

font-size:13px;

font-weight:bold;

cursor:pointer;

transition:.2s;

}

.edit-btn{

background:#FFF0E5;

color:var(--orange);

}

body.dark-mode .edit-btn{

background:#3A291F;

color:#FF9A52;

}

.edit-btn:hover{

background:#FFE2CF;

}

body.dark-mode .edit-btn:hover{

background:#4A3224;

}

.delete-btn{

background:#FDEBEC;

color:var(--danger);

}

body.dark-mode .delete-btn{

background:#3A2226;

color:#FF8E99;

}

.delete-btn:hover{

background:#F8D7DA;

}

body.dark-mode .delete-btn:hover{

background:#4A292E;

}


/* =====================================================
LOADING / EMPTY
===================================================== */

.loading,
.empty,
.error-box{

grid-column:1/-1;

background:var(--card);

border:1px solid var(--border);

border-radius:18px;

padding:60px 20px;

text-align:center;

color:var(--muted);

line-height:2;

}

.empty{

border:1px dashed #D5D5D5;

}

.error-box{

background:var(--danger-bg);

border-color:#F1C4CA;

color:#842029;

}

body.dark-mode .error-box{

border-color:#64333A;

color:#FF9CA7;

}


/* =====================================================
MODAL
===================================================== */

.modal{

position:fixed;

inset:0;

background:rgba(0,0,0,.60);

display:none;

align-items:center;

justify-content:center;

padding:20px;

z-index:2000;

}

.modal.active{

display:flex;

}

.modal-box{

width:100%;

max-width:850px;

max-height:94vh;

overflow-y:auto;

background:var(--card);

color:var(--text);

border-radius:22px;

padding:24px;

box-shadow:
0 15px 50px rgba(0,0,0,.30);

}

.modal-header{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:20px;

}

.modal-header h2{

font-size:21px;

color:var(--dark);

}

.close-btn{

width:38px;

height:38px;

border:none;

border-radius:50%;

background:var(--soft);

color:var(--text);

font-size:20px;

cursor:pointer;

}

.close-btn:hover{

background:var(--hover);

}


/* =====================================================
FORM
===================================================== */

.form-group{

margin-bottom:17px;

}

.form-group label{

display:block;

font-size:13px;

font-weight:bold;

margin-bottom:7px;

color:var(--dark);

}

.form-group input,
.form-group textarea,
.simple-input{

width:100%;

border:1px solid var(--border);

border-radius:11px;

padding:12px;

font-size:14px;

outline:none;

background:var(--input);

color:var(--text);

}

.form-group input::placeholder,
.simple-input::placeholder{

color:var(--muted);

}

.form-group input:focus,
.form-group textarea:focus,
.simple-input:focus{

border-color:var(--orange);

box-shadow:
0 0 0 3px rgba(244,123,32,.08);

}


/* =====================================================
DESCRIPTION
===================================================== */

.editor-wrapper{

border:1px solid var(--border);

border-radius:13px;

overflow:hidden;

background:var(--input);

}

.editor-toolbar{

display:flex;

align-items:center;

flex-wrap:wrap;

gap:5px;

padding:8px;

background:var(--soft);

border-bottom:1px solid var(--border);

}

.editor-toolbar button,
.editor-toolbar select,
.editor-toolbar input[type="color"]{

height:34px;

border:1px solid var(--border);

border-radius:7px;

background:var(--input);

color:var(--text);

cursor:pointer;

font-size:12px;

}

.editor-toolbar button{

min-width:34px;

padding:0 8px;

font-weight:bold;

}

.editor-toolbar button:hover{

background:#FFF1E6;

border-color:#FFD1AD;

}

body.dark-mode .editor-toolbar button:hover{

background:#3A291F;

border-color:#66422C;

}

.editor-toolbar select{

padding:0 6px;

}

.editor-toolbar input[type="color"]{

width:38px;

padding:3px;

}

.description-editor{

min-height:150px;

padding:13px;

outline:none;

font-size:15px;

line-height:1.9;

background:var(--input);

color:var(--text);

}

.description-editor:empty::before{

content:attr(data-placeholder);

color:#999;

pointer-events:none;

}


/* =====================================================
TAGS
===================================================== */

.tag-section{

background:var(--soft);

border:1px solid var(--border);

border-radius:13px;

padding:13px;

}

.tag-add-row{

display:flex;

gap:8px;

}

.tag-add-row input{

flex:1;

}

.tag-add-row button{

border:none;

background:var(--orange);

color:white;

border-radius:10px;

padding:0 17px;

font-weight:bold;

cursor:pointer;

}

.tags-list{

display:flex;

flex-wrap:wrap;

gap:8px;

margin-top:12px;

}

.tag{

display:flex;

align-items:center;

gap:7px;

background:var(--input);

border:1px solid var(--border);

color:var(--text);

padding:7px 10px;

border-radius:20px;

font-size:12px;

}

.tag-remove{

width:22px;

height:22px;

border:none;

border-radius:50%;

background:#FDEBEC;

color:#DC3545;

cursor:pointer;

font-weight:bold;

line-height:1;

}

.color-tag{

padding-right:7px;

}

.color-dot{

width:19px;

height:19px;

border-radius:50%;

border:1px solid #CCC;

display:inline-block;

}


/* =====================================================
STOCK
===================================================== */

.stock-visibility{

display:flex;

align-items:center;

justify-content:space-between;

gap:15px;

background:var(--soft);

border:1px solid var(--border);

border-radius:12px;

padding:13px 15px;

}

.stock-visibility-info{

display:flex;

align-items:center;

gap:10px;

}

.stock-visibility-icon{

width:38px;

height:38px;

border-radius:10px;

display:flex;

align-items:center;

justify-content:center;

background:#FFF1E6;

font-size:19px;

}

body.dark-mode .stock-visibility-icon{

background:#3A291F;

}

.stock-visibility-text{

display:flex;

flex-direction:column;

gap:3px;

}

.stock-visibility-title{

font-size:14px;

font-weight:700;

color:var(--dark);

}

.stock-visibility-description{

font-size:11px;

color:var(--muted);

}

.switch{

position:relative;

width:52px;

height:28px;

flex-shrink:0;

}

.switch input{

opacity:0;

width:0;

height:0;

}

.slider{

position:absolute;

cursor:pointer;

inset:0;

background:#CCC;

border-radius:30px;

transition:.25s;

}

.slider::before{

content:"";

position:absolute;

width:22px;

height:22px;

right:3px;

top:3px;

background:white;

border-radius:50%;

box-shadow:0 2px 5px rgba(0,0,0,.15);

transition:.25s;

}

.switch input:checked + .slider{

background:var(--orange);

}

.switch input:checked + .slider::before{

transform:translateX(-24px);

}


/* =====================================================
IMAGES
===================================================== */

.edit-images{

display:flex;

gap:10px;

flex-wrap:wrap;

padding:12px;

background:var(--soft);

border:1px solid var(--border);

border-radius:12px;

margin-bottom:10px;

}

.edit-image-item{

position:relative;

width:90px;

height:90px;

border-radius:10px;

overflow:hidden;

border:1px solid var(--border);

background:#F2F2F2;

}

.edit-preview-image{

width:100%;

height:100%;

object-fit:cover;

}

.remove-image-btn{

position:absolute;

top:4px;

right:4px;

width:25px;

height:25px;

border:none;

border-radius:50%;

background:rgba(220,53,69,.95);

color:white;

display:flex;

align-items:center;

justify-content:center;

font-size:16px;

cursor:pointer;

z-index:5;

}

.new-image-item{

border:2px solid var(--orange);

}

.new-image-label{

position:absolute;

bottom:4px;

left:4px;

right:4px;

background:rgba(244,123,32,.9);

color:white;

font-size:9px;

text-align:center;

padding:2px;

border-radius:5px;

}


/* =====================================================
MODAL ACTIONS
===================================================== */

.modal-actions{

display:grid;

grid-template-columns:1fr 1fr;

gap:10px;

margin-top:22px;

}

.save-btn,
.cancel-btn{

height:47px;

border:none;

border-radius:11px;

font-size:14px;

font-weight:bold;

cursor:pointer;

}

.save-btn{

background:var(--orange);

color:white;

}

.save-btn:disabled{

opacity:.6;

cursor:not-allowed;

}

.cancel-btn{

background:var(--hover);

color:var(--text);

}


/* =====================================================
DARK MODE DATE / FILE INPUT
===================================================== */

body.dark-mode input[type="file"]{

color:var(--text);

}

body.dark-mode input[type="file"]::file-selector-button{

background:#333;

color:#FFF;

border:1px solid #555;

padding:8px 12px;

border-radius:8px;

cursor:pointer;

margin-left:10px;

}


/* =====================================================
RESPONSIVE
===================================================== */

@media(max-width:1100px){

.products-grid{

grid-template-columns:repeat(3,1fr);

}

}

@media(max-width:800px){

.products-grid{

grid-template-columns:repeat(2,1fr);

}

.content{

padding:93px 16px 20px;

}

.toolbar{

align-items:stretch;

flex-direction:column;

}

.add-product-btn{

width:100%;

}

.topbar{

right:65px;

}

.store-top-name{

max-width:200px;

}

}

@media(max-width:550px){

.sidebar{

width:60px;

}

.sidebar:hover{

width:200px;

}

.topbar{

right:60px;

height:68px;

padding:0 12px;

}

.content{

margin-right:60px;

padding:83px 12px 20px;

}

.store-image{

width:42px;

height:42px;

}

.store-label{

display:none;

}

.store-top-name{

font-size:14px;

max-width:120px;

}

.topbar-right{

gap:6px;

}

.theme-toggle{

width:40px;

height:40px;

font-size:18px;

}

.view-store-btn{

padding:8px 10px;

font-size:11px;

}

.products-grid{

grid-template-columns:repeat(2,1fr);

gap:10px;

}

.product-info{

padding:11px;

}

.product-info h3{

font-size:14px;

}

.product-price{

font-size:16px;

}

.product-actions{

grid-template-columns:1fr;

}

.modal{

padding:8px;

}

.modal-box{

padding:15px;

}

.modal-actions{

grid-template-columns:1fr;

}

.tag-add-row{

flex-direction:column;

}

.tag-add-row button{

height:43px;

}

}

@media(max-width:380px){

.products-grid{

grid-template-columns:1fr;

}

.store-top-name{

max-width:95px;

}

.view-store-btn{

font-size:0;

width:40px;

height:40px;

padding:0;

justify-content:center;

}

.view-store-btn::before{

content:"👁️";

font-size:18px;

}

}


/* =====================================================
SCROLLBAR
===================================================== */

::-webkit-scrollbar{

width:7px;

}

::-webkit-scrollbar-track{

background:var(--soft);

}

::-webkit-scrollbar-thumb{

background:#CCC;

border-radius:10px;

}

::-webkit-scrollbar-thumb:hover{

background:var(--orange);

}

body.dark-mode ::-webkit-scrollbar-thumb{

background:#555;

}

body.dark-mode ::-webkit-scrollbar-thumb:hover{

background:var(--orange);

}

</style>

</head>

<body>


<!-- =====================================================
SIDEBAR
===================================================== -->

<div class="sidebar">

<div class="logo">

<img
src="logotrans.png"
alt="G-Glam"
>

</div>

<div class="menu">

<a href="dashboard.html">

<span class="icon">🏠</span>

<span class="text">الرئيسية</span>

</a>

<a href="orders.html">

<span class="icon">📦</span>

<span class="text">الطلبات</span>

function escapeHtml(value){

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

async function loadStore(){

doc(

);

currentStore =
storeSnapshot.data();

currentOwnerEmail =
currentStore.ownerEmail ||
currentStore.email ||
currentOwnerEmail;


const status =
String(
currentStore.status ||
"active"
)
.toLowerCase()
.trim();


if(
status === "pending" ||
status === "waiting" ||
status === "review"
){

loading.style.display =
"none";

"⏳ متجرك مازال قيد المراجعة."
);

if(

){

);

}

}

}
else if(
product.sizes
){

editingSizes =
String(product.sizes)
.split(",")
.map(
s=>s.trim()
)
.filter(Boolean);

}


showStock.checked =
product.showStock !== false;

updateStockVisibilityText();


existingImages = [];


if(
Array.isArray(product.images)
){

existingImages =
[...product.images];

}
else if(
product.image
){

existingImages =
[product.image];

}


selectedImages = [];

editImageFile.value = "";


renderColors();

renderSizes();

renderEditImages();


editModal.classList.add(
"active"
);

}

/* =====================================================
CLOUDINARY
===================================================== */

async function uploadToCloudinary(file){

const formData =
new FormData();


formData.append(
"file",
file
);


formData.append(
"upload_preset",
"gglam_products"
);


const response =
await fetch(

"https://api.cloudinary.com/v1_1/g82dvrkr/image/upload",

{

method:"POST",

body:formData

}

);


if(!response.ok){

throw new Error(
"فشل رفع الصورة إلى Cloudinary."
);

}


const data =
await response.json();


if(!data.secure_url){

throw new Error(
"لم يتم الحصول على رابط الصورة من Cloudinary."
);

}


return data.secure_url;

}


/* =====================================================

===================================================== */

saveEdit.addEventListener(
"click",
saveEditedProduct
);


async function saveEditedProduct(){

if(!editingProductId){

return;

}


const name =
editName.value.trim();


const price =
Number(
editPrice.value
);


const stock =
Number(
editStock.value
);


if(!name){

alert(
"يرجى إدخال اسم المنتج."
);

return;

}


if(
Number.isNaN(price) ||
price < 0
){

alert(
"يرجى إدخال سعر صحيح."
);

return;

}


if(
Number.isNaN(stock) ||
stock < 0
){

alert(
"يرجى إدخال مخزون صحيح."
);

return;

}


const product =
allProducts.find(
p=>p.id === editingProductId
);


if(!product){

alert(
"المنتج غير موجود."
);

return;

}


if(
product.ownerUid !==
currentOwnerUid
){

alert(
"❌ لا يمكنك تعديل منتج لا يخص متجرك."
);

return;

}


saveEdit.disabled =
true;


saveEdit.textContent =
"⏳ جاري الحفظ...";


try{

let finalImages =
[...existingImages];


for(
const file of selectedImages
){

const url =
await uploadToCloudinary(
file
);

finalImages.push(
url
);

}


const description =
descriptionEditor.innerHTML;


const finalColors =
editingColors.map(
color=>({

name:
color.name,

value:
color.value

})
);


const productRef =
doc(
db,
"products",
editingProductId
);


await updateDoc(
productRef,
{

name:name,

price:price,

description:description,

colors:finalColors,

sizes:[
...editingSizes
],

stock:stock,

showStock:
showStock.checked,

images:
finalImages,

image:
finalImages.length
?
finalImages[0]
:
"",

ownerUid:
currentOwnerUid,

storeId:
currentOwnerUid,

updatedAt:
serverTimestamp()

}
);


showSuccess(
"✅ تم تعديل المنتج وحفظ جميع التغييرات بنجاح."
);


closeEditModal();

await loadProducts();

}
catch(error){

console.error(
"UPDATE ERROR:",
error
);

showError(
"❌ حدث خطأ أثناء حفظ المنتج:\n" +
error.message
);

}
finally{

saveEdit.disabled =
false;

saveEdit.textContent =
"💾 حفظ التعديلات";

}

}

/* =====================================================
DELETE PRODUCT
===================================================== */

async function deleteProduct(productId){

const product =
allProducts.find(
p=>p.id === productId
);


if(!product){

return;

}


if(
product.ownerUid !==
currentOwnerUid
){

alert(
"❌ لا يمكنك حذف منتج لا يخص متجرك."
);

return;

}


const confirmed =
confirm(

"هل أنت متأكد من حذف المنتج؟\n\n" +
(
product.name ||
"هذا المنتج"
)

);


if(!confirmed){

return;

}


try{

const productRef =
doc(
db,
"products",
productId
);


const snapshot =
await getDoc(
productRef
);


if(!snapshot.exists()){

showError(
"المنتج غير موجود."
);

return;

}


if(
snapshot.data().ownerUid !==
currentOwnerUid
){

alert(
"❌ لا يمكنك حذف هذا المنتج."
);

return;

}


await deleteDoc(
productRef
);


showSuccess(
"✅ تم حذف المنتج بنجاح."
);


await loadProducts();

}
catch(error){

console.error(
"DELETE ERROR:",
error
);

showError(
"❌ حدث خطأ أثناء حذف المنتج:\n" +
error.message
);

}

}
