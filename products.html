<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1A1A1A">
    <title>G-Glam | منتجاتي (Shopify Admin Style)</title>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        shopify: {
                            bg: '#F1F2F4',
                            darkBg: '#0F0F0F',
                            surface: '#FFFFFF',
                            darkSurface: '#1A1A1A',
                            border: '#E1E3E5',
                            darkBorder: '#2E2E2E',
                            green: '#008060',
                            greenLight: '#E3F1DF',
                            greenBadge: '#AEE9D1',
                            greenBadgeText: '#004B36',
                            topbar: '#1A1A1A',
                            text: '#303030',
                            subtext: '#616161',
                            hover: '#EDEEF0'
                        }
                    },
                    fontFamily: {
                        sans: ['Tajawal', 'Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #D2D5D8;
            border-radius: 10px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #3A3A3A;
        }
        .shopify-shadow {
            box-shadow: 0px 1px 0px rgba(0, 0, 0, 0.05), 0px 2px 4px rgba(0, 0, 0, 0.05);
        }
        .shopify-card-shadow {
            box-shadow: 0 0 0 1px rgba(63, 63, 68, 0.05), 0 1px 3px 0 rgba(63, 63, 68, 0.15);
        }
        .dark .shopify-card-shadow {
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 1px 3px 0 rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

<body class="bg-shopify-bg dark:bg-shopify-darkBg text-shopify-text dark:text-gray-100 font-sans antialiased min-h-screen flex flex-col transition-colors duration-200">

    <!-- =====================================================
         TOPBAR (SHOPIFY MODERN BLACK TOP HEADER)
    ===================================================== -->
    <header class="h-14 bg-shopify-topbar text-white px-4 flex items-center justify-between sticky top-0 z-50 shadow-md">
        <!-- Right side: Logo & Search Bar -->
        <div class="flex items-center gap-4 flex-1 max-w-2xl">
            <div class="flex items-center gap-2 font-bold text-lg tracking-tight pl-2 border-l border-gray-700">
                <div class="w-7 h-7 rounded-lg bg-emerald-600 text-white font-black flex items-center justify-center text-sm shadow-sm">
                    <i class="fa-solid fa-bag-shopping text-xs"></i>
                </div>
                <span class="hidden sm:inline">G-Glam</span>
            </div>
            
            <!-- Global Search Box -->
            <div class="relative flex-1 max-w-md">
                <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </div>
                <input type="text" id="topSearchInput" placeholder="بحث في المنتجات (Ctrl K)" 
                    class="w-full bg-[#2A2A2A] text-gray-200 text-xs rounded-lg pr-9 pl-12 py-1.5 border border-transparent focus:border-gray-500 focus:outline-none transition-all placeholder-gray-400">
                <div class="absolute inset-y-0 left-0 pl-2 flex items-center pointer-events-none">
                    <span class="text-[10px] bg-[#383838] text-gray-300 px-1.5 py-0.5 rounded border border-gray-600">Ctrl K</span>
                </div>
            </div>
        </div>

        <!-- Left Side Actions -->
        <div class="flex items-center gap-2">
            <!-- Theme Toggle -->
            <button type="button" id="themeToggle" title="تغيير المظهر"
                class="w-9 h-9 rounded-lg hover:bg-[#2A2A2A] flex items-center justify-center text-gray-300 hover:text-white transition-colors">
                <i id="themeIcon" class="fa-solid fa-moon"></i>
            </button>

            <!-- Store Profile Badge -->
            <a href="#" id="viewStoreBtn" target="_blank" title="عرض المتجر" class="flex items-center gap-2 pl-2 border-r border-gray-700 mr-1 p-1 rounded-lg hover:bg-[#2A2A2A] transition-colors cursor-pointer">
                <img class="w-7 h-7 rounded-full object-cover border border-gray-600 bg-gray-800" id="topStoreImage" src="logotrans.png" alt="صورة المتجر">
                <div class="hidden md:flex flex-col text-right">
                    <span id="topStoreName" class="text-xs font-bold leading-tight text-gray-200 truncate max-w-[120px]">جاري التحميل...</span>
                    <span class="text-[10px] text-gray-400 flex items-center gap-1">
                        <span>G-Glam Admin</span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                    </span>
                </div>
            </a>
        </div>
    </header>


    <!-- =====================================================
         MAIN LAYOUT (SIDEBAR + MAIN CONTENT)
    ===================================================== -->
    <div class="flex flex-1">

        <!-- SIDEBAR (SHOPIFY STYLE MENU) -->
        <aside class="w-16 md:w-60 bg-shopify-surface dark:bg-shopify-darkSurface border-l border-shopify-border dark:border-shopify-darkBorder flex flex-col justify-between transition-all duration-200 shrink-0">
            <div class="p-2 space-y-1">
                <nav class="space-y-1">
                    <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-semibold text-shopify-subtext dark:text-gray-400 hover:bg-shopify-hover dark:hover:bg-[#262626] hover:text-shopify-text dark:hover:text-white transition-colors">
                        <i class="fa-solid fa-house text-base w-5 text-center"></i>
                        <span class="hidden md:inline">لوحة التحكم</span>
                    </a>

                    <a href="orders.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-semibold text-shopify-subtext dark:text-gray-400 hover:bg-shopify-hover dark:hover:bg-[#262626] hover:text-shopify-text dark:hover:text-white transition-colors">
                        <i class="fa-solid fa-clipboard-list text-base w-5 text-center"></i>
                        <span class="hidden md:inline">الطلبات</span>
                    </a>

                    <a href="products.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-semibold bg-shopify-hover dark:bg-[#262626] text-shopify-text dark:text-white">
                        <i class="fa-solid fa-box-open text-base w-5 text-center text-shopify-green"></i>
                        <span class="hidden md:inline">المنتجات</span>
                    </a>

                    <a href="add-product.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-semibold text-shopify-subtext dark:text-gray-400 hover:bg-shopify-hover dark:hover:bg-[#262626] hover:text-shopify-text dark:hover:text-white transition-colors">
                        <i class="fa-solid fa-circle-plus text-base w-5 text-center"></i>
                        <span class="hidden md:inline">إضافة منتج</span>
                    </a>

                    <a href="delivery.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-semibold text-shopify-subtext dark:text-gray-400 hover:bg-shopify-hover dark:hover:bg-[#262626] hover:text-shopify-text dark:hover:text-white transition-colors">
                        <i class="fa-solid fa-truck text-base w-5 text-center"></i>
                        <span class="hidden md:inline">التوصيل</span>
                    </a>

                    <div class="pt-4 pb-1">
                        <div class="px-3 text-[10px] font-bold text-gray-400 uppercase tracking-wider hidden md:block">الإعدادات</div>
                    </div>

                    <a href="settings.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-semibold text-shopify-subtext dark:text-gray-400 hover:bg-shopify-hover dark:hover:bg-[#262626] hover:text-shopify-text dark:hover:text-white transition-colors">
                        <i class="fa-solid fa-gear text-base w-5 text-center"></i>
                        <span class="hidden md:inline">إعدادات المتجر</span>
                    </a>
                </nav>
            </div>

            <!-- Logout -->
            <div class="p-2 border-t border-shopify-border dark:border-shopify-darkBorder">
                <a href="#" id="logoutBtn" class="flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-semibold text-red-600 hover:bg-red-50 dark:hover:bg-red-950/30 transition-colors">
                    <i class="fa-solid fa-right-from-bracket text-base w-5 text-center"></i>
                    <span class="hidden md:inline">تسجيل الخروج</span>
                </a>
            </div>
        </aside>


        <!-- MAIN CONTENT CONTAINER -->
        <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full space-y-6">

            <!-- PAGE HEADER -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div>
                    <h1 class="text-xl font-bold text-gray-900 dark:text-white">المنتجات</h1>
                    <p class="text-xs text-shopify-subtext dark:text-gray-400 mt-0.5">إدارة منتجات متجرك وتعديل معلوماتها بسهولة.</p>
                </div>
                <div class="flex items-center gap-2">
                    <button type="button" id="addProductBtn" 
                        class="bg-[#303030] hover:bg-[#1A1A1A] dark:bg-white dark:hover:bg-gray-100 text-white dark:text-gray-900 text-xs font-semibold px-4 py-2 rounded-lg shopify-shadow flex items-center gap-2 transition-all">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span>إضافة منتج</span>
                    </button>
                </div>
            </div>


            <!-- PRODUCTS TABLE WRAPPER (SHOPIFY LIST VIEW STYLE) -->
            <section class="bg-shopify-surface dark:bg-shopify-darkSurface border border-shopify-border dark:border-shopify-darkBorder rounded-xl shopify-card-shadow overflow-hidden">
                
                <!-- Table Filters & Tabs Header -->
                <div class="p-3 sm:p-4 border-b border-shopify-border dark:border-shopify-darkBorder flex flex-col sm:flex-row items-center justify-between gap-3">
                    <div class="flex items-center gap-2 text-xs font-semibold text-gray-500 dark:text-gray-400">
                        <button type="button" class="px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-white">الكل</button>
                        <button type="button" class="px-3 py-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800">نشط</button>
                    </div>

                    <!-- Search Input Inside Table Header -->
                    <div class="relative w-full sm:w-72">
                        <span class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-magnifying-glass text-xs"></i>
                        </span>
                        <input id="searchInput" type="text" placeholder="فلترة المنتجات..." 
                            class="w-full bg-shopify-bg dark:bg-shopify-darkBg text-xs rounded-lg pr-9 pl-3 py-2 border border-shopify-border dark:border-shopify-darkBorder focus:border-emerald-600 focus:outline-none">
                    </div>
                </div>

                <!-- Products Dynamic List Container -->
                <div id="productsContainer" class="divide-y divide-shopify-border dark:divide-shopify-darkBorder">
                    <div class="p-12 text-center text-shopify-subtext dark:text-gray-400">
                        <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-shopify-green"></i>
                        <p class="text-xs">جاري تحميل المنتجات...</p>
                    </div>
                </div>
            </section>

        </main>
    </div>


    <!-- =====================================================
         EDIT MODAL (SHOPIFY DRAWER / MODAL STYLE)
    ===================================================== -->
    <div class="modal fixed inset-0 bg-black/60 backdrop-blur-xs z-[2000] hidden items-center justify-center p-3" id="editModal">
        <div class="modal-box w-full max-w-3xl max-h-[92vh] overflow-y-auto bg-shopify-surface dark:bg-shopify-darkSurface border border-shopify-border dark:border-shopify-darkBorder rounded-2xl shadow-2xl p-0">
            
            <div class="modal-header sticky top-0 z-10 bg-shopify-surface dark:bg-shopify-darkSurface border-b border-shopify-border dark:border-shopify-darkBorder px-5 py-4 flex items-center justify-between">
                <h2 class="text-sm font-bold text-gray-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-emerald-600"></i>
                    <span>تعديل المنتج</span>
                </h2>
                <button type="button" class="close-btn w-8 h-8 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-500 hover:text-gray-900 dark:hover:text-white flex items-center justify-center" id="closeModal">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>

            <div class="p-5 space-y-4">
                <!-- PRODUCT NAME -->
                <div>
                    <label class="block mb-1.5 text-xs font-bold text-gray-700 dark:text-gray-300">اسم المنتج *</label>
                    <input id="editName" type="text" placeholder="اسم المنتج" 
                        class="w-full h-10 px-3 text-xs bg-shopify-bg dark:bg-shopify-darkBg border border-shopify-border dark:border-shopify-darkBorder rounded-lg focus:border-emerald-600 focus:outline-none">
                </div>

                <!-- SHORT DESCRIPTION -->
                <div>
                    <label class="block mb-1.5 text-xs font-bold text-gray-700 dark:text-gray-300">وصف مختصر</label>
                    <input id="editShortDescription" type="text" placeholder="اجعل الوصف المختصر واضحًا ومشجعًا." 
                        class="w-full h-10 px-3 text-xs bg-shopify-bg dark:bg-shopify-darkBg border border-shopify-border dark:border-shopify-darkBorder rounded-lg focus:border-emerald-600 focus:outline-none">
                </div>

                <!-- GEMINI AI ASSISTANT -->
                <div class="p-3 rounded-xl bg-purple-50 dark:bg-purple-950/30 border border-purple-200 dark:border-purple-800 flex items-center justify-between">
                    <div class="flex items-center gap-2.5">
                        <i class="fa-solid fa-wand-magic-sparkles text-purple-600 text-sm"></i>
                        <span class="text-xs font-bold text-purple-900 dark:text-purple-300">استعمل الذكاء الاصطناعي Gemini</span>
                    </div>
                    <button type="button" id="editGeminiBtn" class="px-3 py-1.5 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-xs font-semibold shadow-sm transition-colors">
                        تحسين الوصف
                    </button>
                </div>

                <!-- PRICES -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block mb-1.5 text-xs font-bold text-gray-700 dark:text-gray-300">السعر القديم</label>
                        <input id="editOldPrice" type="number" min="0" step="any" placeholder="0.00" 
                            class="w-full h-10 px-3 text-xs bg-shopify-bg dark:bg-shopify-darkBg border border-shopify-border dark:border-shopify-darkBorder rounded-lg focus:border-emerald-600 focus:outline-none">
                    </div>
                    <div>
                        <label class="block mb-1.5 text-xs font-bold text-gray-700 dark:text-gray-300">السعر الجديد *</label>
                        <input id="editPrice" type="number" min="0" step="any" placeholder="0.00" 
                            class="w-full h-10 px-3 text-xs bg-shopify-bg dark:bg-shopify-darkBg border border-shopify-border dark:border-shopify-darkBorder rounded-lg focus:border-emerald-600 focus:outline-none">
                    </div>
                </div>

                <!-- DESCRIPTION -->
                <div>
                    <label class="block mb-1.5 text-xs font-bold text-gray-700 dark:text-gray-300">وصف المنتج المفصل</label>
                    <div class="border border-shopify-border dark:border-shopify-darkBorder rounded-lg overflow-hidden bg-shopify-bg dark:bg-shopify-darkBg">
                        <div class="p-2 bg-gray-100 dark:bg-gray-800 border-b border-shopify-border dark:border-shopify-darkBorder flex flex-wrap gap-1">
                            <button type="button" data-command="bold" class="w-7 h-7 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded text-xs font-bold">B</button>
                            <button type="button" data-command="italic" class="w-7 h-7 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded text-xs italic">I</button>
                            <button type="button" data-command="underline" class="w-7 h-7 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded text-xs underline">U</button>
                        </div>
                        <div id="descriptionEditor" class="p-3 min-h-[120px] text-xs outline-none" contenteditable="true" data-placeholder="اكتب وصف المنتج هنا..."></div>
                    </div>
                </div>

                <!-- COLORS -->
                <div>
                    <label class="block mb-1.5 text-xs font-bold text-gray-700 dark:text-gray-300">ألوان المنتج</label>
                    <div class="p-3 bg-shopify-bg dark:bg-shopify-darkBg border border-shopify-border dark:border-shopify-darkBorder rounded-lg space-y-2">
                        <div class="flex gap-2">
                            <input id="newColorName" type="text" placeholder="اسم اللون (مثل: أحمر)" class="flex-1 h-9 px-3 text-xs bg-white dark:bg-gray-800 border border-shopify-border dark:border-shopify-darkBorder rounded-lg">
                            <input id="newColorValue" type="color" value="#F47B20" class="w-9 h-9 p-1 bg-white dark:bg-gray-800 border border-shopify-border dark:border-shopify-darkBorder rounded-lg">
                            <button type="button" id="addColorBtn" class="px-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold">إضافة</button>
                        </div>
                        <div id="colorsList" class="flex flex-wrap gap-1.5 pt-1"></div>
                    </div>
                </div>

                <!-- SIZES -->
                <div>
                    <label class="block mb-1.5 text-xs font-bold text-gray-700 dark:text-gray-300">قياسات المنتج</label>
                    <div class="p-3 bg-shopify-bg dark:bg-shopify-darkBg border border-shopify-border dark:border-shopify-darkBorder rounded-lg space-y-2">
                        <div class="flex gap-2">
                            <input id="newSize" type="text" placeholder="القياس (مثل: S, M, L أو 38)" class="flex-1 h-9 px-3 text-xs bg-white dark:bg-gray-800 border border-shopify-border dark:border-shopify-darkBorder rounded-lg">
                            <button type="button" id="addSizeBtn" class="px-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold">إضافة</button>
                        </div>
                        <div id="sizesList" class="flex flex-wrap gap-1.5 pt-1"></div>
                    </div>
                </div>

                <!-- IMAGES -->
                <div>
                    <label class="block mb-1.5 text-xs font-bold text-gray-700 dark:text-gray-300">صور المنتج الأساسية</label>
                    <div class="p-3 bg-shopify-bg dark:bg-shopify-darkBg border border-shopify-border dark:border-shopify-darkBorder rounded-lg space-y-3">
                        <div id="editPreview" class="grid grid-cols-4 gap-2"></div>
                        <label for="editImageFile" class="inline-flex items-center gap-2 px-3 py-2 bg-white dark:bg-gray-800 border border-dashed border-emerald-500 text-emerald-600 rounded-lg text-xs font-bold cursor-pointer">
                            <i class="fa-solid fa-camera"></i> إضافة صور جديدة
                        </label>
                        <input id="editImageFile" type="file" accept="image/*" multiple hidden>
                    </div>
                </div>

                <!-- ACTIONS -->
                <div class="pt-3 border-t border-shopify-border dark:border-shopify-darkBorder flex items-center justify-end gap-2">
                    <button type="button" id="cancelEdit" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg text-xs font-semibold">إلغاء</button>
                    <button type="button" id="saveEdit" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold shadow-sm">حفظ التعديلات</button>
                </div>
            </div>
        </div>
    </div>


    <!-- =====================================================
         TOAST NOTIFICATION
    ===================================================== -->
    <div id="toast" class="fixed left-5 bottom-5 min-w-[260px] max-w-[420px] p-3 rounded-xl bg-shopify-surface dark:bg-shopify-darkSurface border border-shopify-border dark:border-shopify-darkBorder shadow-2xl z-[5000] hidden items-center gap-2.5 text-xs font-bold">
        <i id="toastIcon" class="text-sm"></i>
        <span id="toastMessage"></span>
    </div>


    <!-- =====================================================
         FIREBASE & SYSTEM SCRIPT
    ===================================================== -->
    <script type="module">

        const editModal = document.getElementById("editModal");

        const toast = document.getElementById("toast");
        const toastIcon = document.getElementById("toastIcon");
        const toastMessage = document.getElementById("toastMessage");
        const editGeminiBtn = document.getElementById("editGeminiBtn");

        function showSuccess(message) {
            toast.className = "fixed left-5 bottom-5 min-w-[260px] max-w-[420px] p-3 rounded-xl bg-shopify-surface dark:bg-shopify-darkSurface border border-emerald-500 shadow-2xl z-[5000] flex items-center gap-2.5 text-xs font-bold text-emerald-600";
            toastIcon.className = "fa-solid fa-circle-check text-sm text-emerald-500";
            toastMessage.textContent = message;
            setTimeout(() => toast.classList.add("hidden"), 3500);
        }

        function showError(message) {
            toast.className = "fixed left-5 bottom-5 min-w-[260px] max-w-[420px] p-3 rounded-xl bg-shopify-surface dark:bg-shopify-darkSurface border border-red-500 shadow-2xl z-[5000] flex items-center gap-2.5 text-xs font-bold text-red-600";
            toastIcon.className = "fa-solid fa-circle-exclamation text-sm text-red-500";
            toastMessage.textContent = message;
            setTimeout(() => toast.classList.add("hidden"), 5000);
        }

        function escapeHtml(value) {
            return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function getProductImages(product) {
            let images = [];
            if (Array.isArray(product.images)) {
                images = product.images.filter(Boolean).map(value => String(value));
            }
            if (!images.length && product.image) {
                images = [String(product.image)];
            }
            return [...new Set(images)];
        }

        function formatPrice(value) {
            const number = Number(value || 0);
            return number.toLocaleString("ar-DZ") + " DA";
        }

        function applyTheme() {
            const theme = localStorage.getItem("gGlamTheme");
            if (theme === "dark") {
                document.documentElement.classList.add("dark");
                themeIcon.className = "fa-solid fa-sun text-yellow-400";
            } else {
                document.documentElement.classList.remove("dark");
                themeIcon.className = "fa-solid fa-moon text-gray-300";
            }
        }
        applyTheme();

        themeToggle.addEventListener("click", () => {
            const dark = document.documentElement.classList.toggle("dark");
            localStorage.setItem("gGlamTheme", dark ? "dark" : "light");
            themeIcon.className = dark ? "fa-solid fa-sun text-yellow-400" : "fa-solid fa-moon text-gray-300";
        });

        async function loadStore() {
            if (!currentOwnerUid) return;
            let storeSnapshot = null;
            const savedStoreId = localStorage.getItem("storeDocumentId");

            if (savedStoreId) {
                try {
                    const savedStoreSnapshot = await getDoc(doc(db, "stores", savedStoreId));
                    if (savedStoreSnapshot.exists() && savedStoreSnapshot.data().ownerUid === currentOwnerUid) {
                        storeSnapshot = savedStoreSnapshot;
                    }
                } catch (e) {}
            }

            if (!storeSnapshot) {
                const storeQuery = query(collection(db, "stores"), where("ownerUid", "==", currentOwnerUid));
                const storeDocs = await getDocs(storeQuery);
                if (!storeDocs.empty) storeSnapshot = storeDocs.docs[0];
            }

            if (!storeSnapshot) throw new Error("لم يتم العثور على متجر مرتبط بهذا الحساب.");

            currentStoreId = storeSnapshot.id;
            currentStore = { id: storeSnapshot.id, ...storeSnapshot.data() };
            currentStoreName = currentStore.storeName || currentStore.name || "G-Glam";

            const storeImage = currentStore.storeImage || currentStore.image || currentStore.logo || "logotrans.png";
            topStoreName.textContent = currentStoreName;
            topStoreImage.src = storeImage;
            viewStoreBtn.href = "index.html?store=" + encodeURIComponent(currentStoreId);

            localStorage.setItem("storeId", currentStoreId);
            localStorage.setItem("storeDocumentId", currentStoreId);
            localStorage.setItem("storeOwnerUid", currentOwnerUid);
            localStorage.setItem("storeName", currentStoreName);

            await loadProducts();
        }

        async function loadProducts() {
            if (!currentOwnerUid || !currentStoreId) return;
            try {
                const productsQuery = query(collection(db, "products"), where("ownerUid", "==", currentOwnerUid), where("storeId", "==", currentStoreId));
                const snapshot = await getDocs(productsQuery);
                allProducts = snapshot.docs.map(productDoc => ({ id: productDoc.id, ...productDoc.data() }));
                renderProducts(allProducts);
            } catch (error) {
                console.error("loadProducts error:", error);
                showError("تعذر تحميل المنتجات.");
            }
        }

        function renderProducts(products) {
            if (!products.length) {
                productsContainer.innerHTML = `
                    <div class="p-12 text-center text-shopify-subtext dark:text-gray-400">
                        <i class="fa-solid fa-box-open text-3xl mb-3 text-gray-400"></i>
                        <p class="text-sm font-semibold">لا توجد منتجات حاليًا</p>
                        <p class="text-xs text-gray-500 mt-1">أضف أول منتج إلى متجرك.</p>
                    </div>
                `;
                return;
            }

            productsContainer.innerHTML = products.map(product => {
                const images = getProductImages(product);
                const firstImage = images[0] || "";
                return `
                    <div class="p-3 sm:p-4 hover:bg-shopify-hover dark:hover:bg-[#222] transition-colors flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3 min-w-0 flex-1">
                            <div class="relative shrink-0">
                                <img src="${escapeHtml(firstImage)}" alt="صورة المنتج" class="w-12 h-12 rounded-lg object-cover bg-gray-100 border border-shopify-border dark:border-shopify-darkBorder" onerror="this.src='logotrans.png';">
                            </div>
                            <div class="min-w-0 flex-1">
                                <h3 class="text-xs font-bold text-gray-900 dark:text-white truncate">${escapeHtml(product.name || "بدون اسم")}</h3>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300">نشط</span>
                                    <span class="text-[11px] text-shopify-subtext dark:text-gray-400">السعر: <strong class="text-gray-900 dark:text-white">${formatPrice(product.price)}</strong></span>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center gap-2">
                            <button type="button" class="edit-btn text-xs bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 p-2 rounded-lg transition-colors" data-action="edit" data-id="${escapeHtml(product.id)}" title="تعديل">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button type="button" class="delete-btn text-xs bg-red-50 hover:bg-red-100 dark:bg-red-950/40 dark:hover:bg-red-900/50 text-red-600 dark:text-red-400 p-2 rounded-lg transition-colors" data-action="delete" data-id="${escapeHtml(product.id)}" title="حذف">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join("");
        }

        function filterProducts(keyword) {
            const search = keyword.trim().toLocaleLowerCase("ar");
            if (!search) {
                renderProducts(allProducts);
                return;
            }
            const filtered = allProducts.filter(p => (p.name || "").toLocaleLowerCase("ar").includes(search));
            renderProducts(filtered);
        }

        searchInput.addEventListener("input", (e) => filterProducts(e.target.value));
        topSearchInput.addEventListener("input", (e) => filterProducts(e.target.value));

        async function uploadImage(file) {
            if (!file) throw new Error("لم يتم اختيار صورة.");
            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", "gglam_products");
            const response = await fetch("https://api.cloudinary.com/v1_1/g82dvrkr/image/upload", { method: "POST", body: formData });
            const data = await response.json();
            if (!response.ok || !data.secure_url) throw new Error("فشل رفع الصورة.");
            return data.secure_url;
        }

        function renderImages() {
            editPreview.innerHTML = "";
            existingImages.forEach((url, index) => {
                const item = document.createElement("div");
                item.className = "relative aspect-square rounded-lg overflow-hidden border border-shopify-border dark:border-shopify-darkBorder bg-shopify-bg";
                item.innerHTML = `<img src="${escapeHtml(url)}" class="w-full h-full object-cover"><button type="button" class="absolute top-1 right-1 w-6 h-6 bg-black/60 text-white rounded-md flex items-center justify-center text-xs"><i class="fa-solid fa-xmark"></i></button>`;
                item.querySelector("button").addEventListener("click", () => { existingImages.splice(index, 1); renderImages(); });
                editPreview.appendChild(item);
            });
            selectedImages.forEach((file, index) => {
                const item = document.createElement("div");
                item.className = "relative aspect-square rounded-lg overflow-hidden border border-shopify-border dark:border-shopify-darkBorder bg-shopify-bg";
                item.innerHTML = `<img src="${URL.createObjectURL(file)}" class="w-full h-full object-cover"><button type="button" class="absolute top-1 right-1 w-6 h-6 bg-black/60 text-white rounded-md flex items-center justify-center text-xs"><i class="fa-solid fa-xmark"></i></button><span class="absolute bottom-1 right-1 bg-emerald-600 text-white text-[9px] px-1 rounded">جديدة</span>`;
                item.querySelector("button").addEventListener("click", () => { selectedImages.splice(index, 1); renderImages(); });
                editPreview.appendChild(item);
            });
        }

        function renderColors() {
            colorsList.innerHTML = "";
            editingColors.forEach((color, index) => {
                const name = typeof color === "object" ? color.name || "" : color;
                const value = typeof color === "object" ? color.value || "#F47B20" : "#F47B20";
                if (!name) return;
                const tag = document.createElement("div");
                tag.className = "inline-flex items-center gap-1.5 px-2.5 py-1 bg-white dark:bg-gray-800 border border-shopify-border dark:border-shopify-darkBorder rounded-lg text-xs";
                tag.innerHTML = `<span class="w-3.5 h-3.5 rounded-full border border-black/10" style="background:${escapeHtml(value)}"></span><span>${escapeHtml(name)}</span><button type="button" class="text-red-500 hover:text-red-700 ml-1"><i class="fa-solid fa-xmark"></i></button>`;
                tag.querySelector("button").addEventListener("click", () => { editingColors.splice(index, 1); renderColors(); });
                colorsList.appendChild(tag);
            });
        }

        function renderSizes() {
            sizesList.innerHTML = "";
            editingSizes.forEach((size, index) => {
                const value = typeof size === "object" ? size.name || "" : String(size || "");
                if (!value) return;
                const tag = document.createElement("div");
                tag.className = "inline-flex items-center gap-1.5 px-2.5 py-1 bg-white dark:bg-gray-800 border border-shopify-border dark:border-shopify-darkBorder rounded-lg text-xs";
                tag.innerHTML = `<span>${escapeHtml(value)}</span><button type="button" class="text-red-500 hover:text-red-700 ml-1"><i class="fa-solid fa-xmark"></i></button>`;
                tag.querySelector("button").addEventListener("click", () => { editingSizes.splice(index, 1); renderSizes(); });
                sizesList.appendChild(tag);
            });
        }

        async function openEditModal(productId) {
            const product = allProducts.find(item => item.id === productId);
            if (!product) return;
            editingProductId = productId;
            editName.value = product.name || "";
            editShortDescription.value = product.shortDescription || "";
            editPrice.value = product.price ?? "";
            editOldPrice.value = product.oldPrice ?? "";
            descriptionEditor.innerHTML = product.description || "";
            editingColors = Array.isArray(product.colors) ? JSON.parse(JSON.stringify(product.colors)) : [];
            editingSizes = Array.isArray(product.sizes) ? JSON.parse(JSON.stringify(product.sizes)) : [];
            renderColors();
            renderSizes();
            existingImages = getProductImages(product);
            selectedImages = [];
            editImageFile.value = "";
            renderImages();
            editModal.classList.remove("hidden");
            editModal.classList.add("flex");
            document.body.style.overflow = "hidden";
        }

        function closeEditModal() {
            editModal.classList.add("hidden");
            editModal.classList.remove("flex");
            document.body.style.overflow = "";
            editingProductId = null;
        }

        editImageFile.addEventListener("change", e => {
            const files = Array.from(e.target.files || []);
            if (!files.length) return;
            selectedImages.push(...files);
            renderImages();
            editImageFile.value = "";
        });

        addColorBtn.addEventListener("click", () => {
            const name = newColorName.value.trim();
            const value = newColorValue.value || "#F47B20";
            if (!name) return;
            editingColors.push({ name, value });
            newColorName.value = "";
            renderColors();
        });

        addSizeBtn.addEventListener("click", () => {
            const value = newSize.value.trim();
            if (!value) return;
            editingSizes.push(value);
            newSize.value = "";
            renderSizes();
        });

        saveEdit.addEventListener("click", async () => {
            if (!editingProductId) return;
            const name = editName.value.trim();
            const price = Number(editPrice.value);
            const oldPrice = editOldPrice.value === "" ? 0 : Number(editOldPrice.value);

            if (!name || !Number.isFinite(price) || price < 0) {
                alert("يرجى ملء الحقول الإجبارية (الاسم والسعر بشكل صحيح).");
                return;
            }

            saveEdit.disabled = true;
            saveEdit.textContent = "جاري الحفظ...";

            try {
                const uploadedImages = [];
                for (const file of selectedImages) {
                    const url = await uploadImage(file);
                    uploadedImages.push(url);
                }
                const finalImages = [...existingImages, ...uploadedImages].filter(Boolean);
                const mainImage = finalImages[0] || "";

                await updateDoc(doc(db, "products", editingProductId), {
                    name,
                    shortDescription: editShortDescription.value.trim(),
                    price,
                    oldPrice,
                    description: descriptionEditor.innerHTML.trim(),
                    colors: editingColors,
                    sizes: editingSizes,
                    images: finalImages,
                    image: mainImage,
                    updatedAt: serverTimestamp()
                });

                showSuccess("تم تعديل المنتج بنجاح.");
                closeEditModal();
                await loadProducts();
            } catch (error) {
                console.error(error);
                showError("تعذر حفظ التعديلات.");
            } finally {
                saveEdit.disabled = false;
                saveEdit.textContent = "حفظ التعديلات";
            }
        });

        async function deleteProduct(productId) {
            if (!confirm("هل أنت متأكد من حذف هذا المنتج؟")) return;
            try {
                await deleteDoc(doc(db, "products", productId));
                showSuccess("تم حذف المنتج بنجاح.");
                await loadProducts();
            } catch (error) {
                showError("تعذر حذف المنتج.");
            }
        }

        productsContainer.addEventListener("click", e => {
            const btn = e.target.closest("button[data-action]");
            if (!btn) return;
            const action = btn.dataset.action;
            const id = btn.dataset.id;
            if (action === "edit") openEditModal(id);
            if (action === "delete") deleteProduct(id);
        });

        addProductBtn.addEventListener("click", () => window.location.href = "add-product.html");
        closeModal.addEventListener("click", closeEditModal);
        cancelEdit.addEventListener("click", closeEditModal);

        editGeminiBtn.addEventListener("click", () => {
            window.open("https://gemini.google.com/", "_blank");
        });

        logoutBtn.addEventListener("click", async e => {
            e.preventDefault();
            if (!confirm("هل تريد تسجيل الخروج؟")) return;
            await signOut(auth);
            localStorage.clear();
            window.location.href = "store-login.html";
        });

        onAuthStateChanged(auth, async user => {
            if (!user) {
                window.location.href = "store-login.html";
                return;
            }
            currentOwnerUid = user.uid;
            currentOwnerEmail = user.email || "";
            try {
                await loadStore();
            } catch (error) {
                showError(error.message || "تعذر تحميل بيانات المتجر.");
            }
        });
    </script>
</body>
</html>
