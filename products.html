<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>G-Glam | منتجاتي</title>

    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        /* =====================================================
           ROOT
        ===================================================== */

        :root {

            --orange: #F47B20;
            --orange-dark: #DF6810;

            --bg: #F6F7F9;
            --sidebar: #FFFFFF;
            --card: #FFFFFF;

            --text: #333333;
            --dark: #1F1F1F;
            --muted: #777777;

            --border: #E7E7E7;

            --success: #198754;
            --success-bg: #E8F7EE;

            --danger: #DC3545;
            --danger-bg: #FDEBEC;

            --input: #FFFFFF;
            --soft: #F9F9F9;
            --hover: #F0F0F0;

            --shadow:
                0 5px 20px rgba(0, 0, 0, .055);

            --shadow-hover:
                0 12px 30px rgba(0, 0, 0, .11);
        }


        /* =====================================================
           DARK MODE
        ===================================================== */

        body.dark-mode {

            --bg: #07111F;
            --sidebar: #0B1B2E;
            --card: #10243A;

            --text: #EAF4FF;
            --dark: #FFFFFF;
            --muted: #9DB3C9;

            --border: #1D3A55;

            --success-bg: #123A32;
            --danger-bg: #3B2028;

            --input: #0D2034;
            --soft: #0B1B2E;
            --hover: #16344E;

            --shadow:
                0 6px 22px rgba(0, 0, 0, .32);

            --shadow-hover:
                0 14px 35px rgba(0, 0, 0, .42);
        }


        /* =====================================================
           GENERAL
        ===================================================== */

        * {

            box-sizing: border-box;

            margin: 0;
            padding: 0;

            font-family:
                "Tajawal",
                Arial,
                sans-serif;
        }


        html {

            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            background: var(--bg);

            color: var(--text);

            transition:
                background .25s ease,
                color .25s ease;
        }


        button,
        input,
        textarea,
        select {

            font-family:
                "Tajawal",
                Arial,
                sans-serif;
        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {

            position: fixed;

            right: 0;
            top: 0;

            width: 72px;
            height: 100vh;

            background: var(--sidebar);

            border-left:
                1px solid var(--border);

            overflow: hidden;

            z-index: 1100;

            transition: width .3s ease;

            box-shadow:
                -3px 0 16px rgba(0, 0, 0, .035);
        }


        .sidebar:hover {

            width: 235px;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {

            height: 76px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 10px;

            border-bottom:
                1px solid var(--border);

            white-space: nowrap;
        }


        .logo img {

            width: 46px;
            height: 46px;

            object-fit: contain;

            display: block;

            transition: .3s ease;
        }


        .sidebar:hover .logo img {

            width: 125px;
            height: 54px;
        }


        /* =====================================================
           MENU
        ===================================================== */

        .menu {

            padding:
                17px 9px 0;
        }


        .menu a {

            position: relative;

            height: 50px;

            margin-bottom: 7px;

            padding: 0 9px;

            display: flex;

            align-items: center;

            gap: 14px;

            border-radius: 12px;

            color: var(--muted);

            text-decoration: none;

            white-space: nowrap;

            transition: .2s ease;
        }


        .menu a:hover {

            background: var(--hover);

            color: var(--dark);
        }


        .menu a.active {

            background: var(--orange);

            color: #FFFFFF;

            box-shadow:
                0 6px 16px rgba(244, 123, 32, .20);
        }


        .icon {

            width: 35px;
            min-width: 35px;

            height: 35px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 17px;

            transition: .2s ease;
        }


        .icon i {

            width: 20px;

            text-align: center;

            font-size: 17px;
        }


        .menu a:hover .icon {

            transform: scale(1.08);
        }


        .text {

            opacity: 0;

            font-size: 13px;

            font-weight: 700;

            transition: opacity .25s ease;
        }


        .sidebar:hover .text {

            opacity: 1;
        }


        /* =====================================================
           TOPBAR
        ===================================================== */

        .topbar {

            position: fixed;

            top: 0;

            right: 72px;
            left: 0;

            height: 76px;

            background: var(--card);

            border-bottom:
                1px solid var(--border);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 24px;

            z-index: 1000;

            transition: .3s ease;

            box-shadow:
                0 2px 12px rgba(0, 0, 0, .035);
        }


        .store-top {

            display: flex;

            align-items: center;

            gap: 11px;

            min-width: 0;
        }


        .store-image {

            width: 45px;
            height: 45px;

            border-radius: 50%;

            object-fit: cover;

            background: #F1F1F1;

            border:
                2px solid #FFE0C8;

            flex-shrink: 0;
        }


        .store-details {

            display: flex;

            flex-direction: column;

            min-width: 0;
        }


        .store-label {

            font-size: 10px;

            color: var(--muted);

            margin-bottom: 2px;
        }


        .store-top-name {

            max-width: 260px;

            font-size: 16px;

            font-weight: 800;

            color: var(--dark);

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .topbar-right {

            display: flex;

            align-items: center;

            gap: 8px;
        }


        /* =====================================================
           THEME
        ===================================================== */

        .theme-toggle {

            width: 43px;
            height: 43px;

            border:
                1px solid var(--border);

            border-radius: 11px;

            background: var(--soft);

            color: var(--text);

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 17px;

            cursor: pointer;

            transition: .2s ease;
        }


        .theme-toggle:hover {

            background: var(--orange);

            border-color: var(--orange);

            color: #FFFFFF;

            transform: translateY(-1px);
        }


        /* =====================================================
           VIEW STORE
        ===================================================== */

        .view-store-btn {

            height: 43px;

            padding: 0 14px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            background: #FFF1E6;

            border:
                1px solid #FFE0CA;

            border-radius: 11px;

            color: var(--orange-dark);

            text-decoration: none;

            font-size: 12px;

            font-weight: 700;

            white-space: nowrap;

            transition: .2s ease;
        }


        body.dark-mode .view-store-btn {

            background: #102E4A;

            border-color: #1D4B70;

            color: #65B8FF;
        }


        .view-store-btn:hover {

            background: var(--orange);

            border-color: var(--orange);

            color: #FFFFFF;
        }


        /* =====================================================
           CONTENT
        ===================================================== */

        .content {

            margin-right: 72px;

            padding:
                100px 22px 25px;
        }


        /* =====================================================
           MESSAGES
        ===================================================== */

        .message {

            display: none;

            padding: 12px 15px;

            margin-bottom: 17px;

            border-radius: 11px;

            text-align: center;

            font-size: 13px;

            white-space: pre-line;
        }


        .success-message {

            background: var(--success-bg);

            color: #146C43;

            border:
                1px solid #C9EAD7;
        }


        .error-message {

            background: var(--danger-bg);

            color: #842029;

            border:
                1px solid #F1C4CA;
        }


        body.dark-mode .success-message {

            color: #8BE0B0;

            border-color: #28583D;
        }


        body.dark-mode .error-message {

            color: #FF9CA7;

            border-color: #64333A;
        }


        /* =====================================================
           TOOLBAR
        ===================================================== */

        .toolbar {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 18px;
        }


        .search-box {

            position: relative;

            flex: 1;
        }


        .search-box i {

            position: absolute;

            right: 14px;

            top: 50%;

            transform: translateY(-50%);

            color: var(--muted);

            font-size: 14px;

            pointer-events: none;
        }


        .search-box input {

            width: 100%;

            height: 45px;

            padding:
                0 40px 0 15px;

            border:
                1px solid var(--border);

            border-radius: 11px;

            background: var(--input);

            color: var(--text);

            outline: none;

            font-size: 13px;

            transition: .2s ease;
        }


        .search-box input:focus {

            border-color: var(--orange);

            box-shadow:
                0 0 0 3px rgba(244,123,32,.08);
        }


        .add-product-btn {

            height: 45px;

            padding: 0 17px;

            border: none;

            border-radius: 11px;

            background: var(--orange);

            color: #FFFFFF;

            font-size: 13px;

            font-weight: 800;

            cursor: pointer;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            white-space: nowrap;

            transition: .2s ease;
        }


        .add-product-btn:hover {

            background: var(--orange-dark);

            transform: translateY(-1px);
        }


        /* =====================================================
           PRODUCTS GRID
        ===================================================== */

        .products-grid {

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 14px;
        }


        /* =====================================================
           PRODUCT CARD
        ===================================================== */

        .product-card {

            min-width: 0;

            background: var(--card);

            border:
                1px solid var(--border);

            border-radius: 15px;

            overflow: hidden;

            box-shadow: var(--shadow);

            transition:
                transform .22s ease,
                box-shadow .22s ease,
                border-color .22s ease;
        }


        .product-card:hover {

            transform: translateY(-3px);

            box-shadow: var(--shadow-hover);

            border-color:
                rgba(244,123,32,.25);
        }


        /* =====================================================
           PRODUCT IMAGE
        ===================================================== */

        .product-image-box {

            position: relative;

            width: 100%;

            aspect-ratio: 1 / 1;

            overflow: hidden;

            background: #F1F1F1;
        }


        body.dark-mode .product-image-box {

            background: #102A43;
        }


        .product-image {

            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            transition: transform .35s ease;
        }


        .product-card:hover .product-image {

            transform: scale(1.035);
        }


        .no-image {

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #B8B8B8;

            font-size: 38px;
        }


        .image-count {

            position: absolute;

            top: 8px;
            left: 8px;

            min-width: 30px;
            height: 27px;

            padding: 0 8px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 4px;

            background:
                rgba(0,0,0,.68);

            color: #FFFFFF;

            border-radius: 15px;

            font-size: 10px;

            font-weight: 700;
        }


        /* =====================================================
           PRODUCT INFO
        ===================================================== */

        .product-info {

            padding: 12px;
        }


        .product-info h3 {

            margin-bottom: 6px;

            color: var(--dark);

            font-size: 14px;

            font-weight: 800;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .product-price {

            margin-bottom: 6px;

            color: var(--orange);

            font-size: 16px;

            font-weight: 800;
        }

        .old-price-display {
            font-size: 12px;
            color: var(--muted);
            text-decoration: line-through;
            margin-right: 6px;
        }


        .product-stock {

            margin-bottom: 5px;

            color: var(--muted);

            font-size: 11px;
        }


        .product-stock strong {

            color: var(--dark);

            font-weight: 800;
        }


        .product-colors,
        .product-sizes {

            display: flex;

            align-items: center;

            gap: 5px;

            min-width: 0;

            color: var(--muted);

            font-size: 10px;

            line-height: 1.8;
        }


        .product-colors i,
        .product-sizes i {

            width: 14px;

            min-width: 14px;

            text-align: center;

            color: var(--orange);

            font-size: 11px;
        }


        /* =====================================================
           ACTIONS
        ===================================================== */

        .product-actions {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 6px;

            margin-top: 11px;
        }


        .edit-btn,
        .delete-btn {

            height: 34px;

            border: none;

            border-radius: 8px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 5px;

            font-size: 11px;

            font-weight: 800;

            cursor: pointer;

            transition: .2s ease;
        }


        .edit-btn {

            background: #FFF0E5;

            color: var(--orange);
        }


        body.dark-mode .edit-btn {

            background: #102E4A;

            color: #65B8FF;
        }


        .edit-btn:hover {

            background: #FFE2CF;
        }


        body.dark-mode .edit-btn:hover {

            background: #17466A;
        }


        .delete-btn {

            background: #FDEBEC;

            color: var(--danger);
        }


        body.dark-mode .delete-btn {

            background: #3A2028;

            color: #FF8E99;
        }


        .delete-btn:hover {

            background: #F8D7DA;
        }


        body.dark-mode .delete-btn:hover {

            background: #4A292E;
        }


        /* =====================================================
           LOADING / EMPTY
        ===================================================== */

        .loading,
        .empty,
        .error-box {

            grid-column: 1 / -1;

            padding: 55px 20px;

            background: var(--card);

            border:
                1px solid var(--border);

            border-radius: 15px;

            text-align: center;

            color: var(--muted);

            line-height: 2;
        }


        .empty {

            border-style: dashed;
        }


        .error-box {

            background: var(--danger-bg);

            border-color: #F1C4CA;

            color: #842029;
        }


        /* =====================================================
           MODAL
        ===================================================== */

        .modal {

            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 18px;

            background:
                rgba(0,0,0,.60);

            z-index: 2000;
        }


        .modal.active {

            display: flex;
        }


        .modal-box {

            width: 100%;

            max-width: 820px;

            max-height: 94vh;

            overflow-y: auto;

            padding: 22px;

            background: var(--card);

            color: var(--text);

            border-radius: 19px;

            box-shadow:
                0 18px 55px rgba(0,0,0,.30);
        }


        .modal-header {

            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }


        .modal-header h2 {

            display: flex;

            align-items: center;

            gap: 8px;

            color: var(--dark);

            font-size: 20px;
        }


        .modal-header h2 i {

            color: var(--orange);
        }


        .close-btn {

            width: 36px;
            height: 36px;

            border: none;

            border-radius: 50%;

            background: var(--soft);

            color: var(--text);

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            font-size: 17px;
        }


        /* =====================================================
           FORM & LAYOUT (GRID)
        ===================================================== */

        .form-row-2 {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }


        .form-group {

            margin-bottom: 16px;
        }


        .form-group label {

            display: flex;

            align-items: center;

            gap: 6px;

            margin-bottom: 6px;

            color: var(--dark);

            font-size: 12px;

            font-weight: 800;
        }


        .form-group label i {

            color: var(--orange);
        }


        .form-group input,
        .form-group textarea,
        .form-group select,
        .simple-input {

            width: 100%;

            padding: 11px;

            border:
                1px solid var(--border);

            border-radius: 10px;

            outline: none;

            background: var(--input);

            color: var(--text);

            font-size: 13px;
        }


        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus,
        .simple-input:focus {

            border-color: var(--orange);

            box-shadow:
                0 0 0 3px rgba(244,123,32,.08);
        }


        /* =====================================================
           EDITOR
        ===================================================== */

        .editor-wrapper {

            overflow: hidden;

            border:
                1px solid var(--border);

            border-radius: 11px;

            background: var(--input);
        }


        .editor-toolbar {

            display: flex;

            flex-wrap: wrap;

            align-items: center;

            gap: 5px;

            padding: 7px;

            background: var(--soft);

            border-bottom:
                1px solid var(--border);
        }


        .editor-toolbar button,
        .editor-toolbar select,
        .editor-toolbar input[type="color"] {

            height: 32px;

            border:
                1px solid var(--border);

            border-radius: 7px;

            background: var(--input);

            color: var(--text);

            cursor: pointer;

            font-size: 11px;
        }


        .editor-toolbar button {

            min-width: 32px;

            padding: 0 7px;
        }


        .editor-toolbar select {

            padding: 0 5px;
        }


        .editor-toolbar input[type="color"] {

            width: 36px;

            padding: 3px;
        }


        .description-editor {

            min-height: 145px;

            padding: 12px;

            outline: none;

            background: var(--input);

            color: var(--text);

            font-size: 14px;

            line-height: 1.9;
        }


        .description-editor:empty::before {

            content: attr(data-placeholder);

            color: #999;

            pointer-events: none;
        }


        /* =====================================================
           TAGS
        ===================================================== */

        .tag-section {

            padding: 12px;

            background: var(--soft);

            border:
                1px solid var(--border);

            border-radius: 11px;
        }


        .tag-add-row {

            display: flex;

            gap: 7px;
        }


        .tag-add-row input {

            flex: 1;
        }


        .tag-add-row button {

            border: none;

            padding: 0 15px;

            border-radius: 9px;

            background: var(--orange);

            color: #FFFFFF;

            font-size: 12px;

            font-weight: 800;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 5px;
        }


        .tags-list {

            display: flex;

            flex-wrap: wrap;

            gap: 7px;

            margin-top: 10px;
        }


        .tag {

            display: flex;

            align-items: center;

            gap: 6px;

            padding: 6px 9px;

            background: var(--input);

            border:
                1px solid var(--border);

            border-radius: 18px;

            color: var(--text);

            font-size: 11px;
        }


        .tag-remove {

            width: 20px;
            height: 20px;

            border: none;

            border-radius: 50%;

            background: #FDEBEC;

            color: var(--danger);

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            font-size: 9px;
        }


        .color-dot {

            width: 17px;
            height: 17px;

            border-radius: 50%;

            border:
                1px solid #CCC;
        }


        /* =====================================================
           STOCK
        ===================================================== */

        .stock-visibility {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            padding: 12px 14px;

            background: var(--soft);

            border:
                1px solid var(--border);

            border-radius: 11px;
        }


        .stock-visibility-info {

            display: flex;

            align-items: center;

            gap: 9px;
        }


        .stock-visibility-icon {

            width: 36px;
            height: 36px;

            border-radius: 9px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #FFF1E6;

            color: var(--orange);
        }


        body.dark-mode .stock-visibility-icon {

            background: #102E4A;

            color: #65B8FF;
        }


        .stock-visibility-text {

            display: flex;

            flex-direction: column;

            gap: 2px;
        }


        .stock-visibility-title {

            color: var(--dark);

            font-size: 13px;

            font-weight: 800;
        }


        .stock-visibility-description {

            color: var(--muted);

            font-size: 10px;
        }


        .switch {

            position: relative;

            width: 50px;
            height: 27px;
        }


        .switch input {

            opacity: 0;

            width: 0;
            height: 0;
        }


        .slider {

            position: absolute;

            inset: 0;

            background: #CCC;

            border-radius: 30px;

            cursor: pointer;

            transition: .25s;
        }


        .slider::before {

            content: "";

            position: absolute;

            width: 21px;
            height: 21px;

            top: 3px;
            right: 3px;

            background: #FFFFFF;

            border-radius: 50%;

            box-shadow:
                0 2px 5px rgba(0,0,0,.15);

            transition: .25s;
        }


        .switch input:checked + .slider {

            background: var(--orange);
        }


        .switch input:checked + .slider::before {

            transform: translateX(-23px);
        }


        /* =====================================================
           IMAGES EDIT
        ===================================================== */

        .edit-images {

            display: flex;

            flex-wrap: wrap;

            gap: 9px;

            padding: 11px;

            margin-bottom: 9px;

            background: var(--soft);

            border:
                1px solid var(--border);

            border-radius: 11px;
        }


        .edit-image-item {

            position: relative;

            width: 85px;
            height: 85px;

            overflow: hidden;

            border:
                1px solid var(--border);

        /* =====================================================

        ===================================================== */

        function applyTheme() {

            const savedTheme =
                localStorage.getItem(
                    "gGlamTheme"
                );


            if (savedTheme === "dark") {

                document.body.classList.add(
                    "dark-mode"
                );


                themeToggle.innerHTML =
                    '<i class="fa-solid fa-sun"></i>';


                themeToggle.title =
                    "تفعيل الوضع النهاري";

            }
            else {

                document.body.classList.remove(
                    "dark-mode"
                );


                themeToggle.innerHTML =
                    '<i class="fa-solid fa-moon"></i>';


                themeToggle.title =
                    "تفعيل الوضع الليلي";
            }

        }


        applyTheme();


        themeToggle.addEventListener(
            "click",
            () => {

                const dark =
                    document.body.classList.toggle(
                        "dark-mode"
                    );


                if (dark) {

                    localStorage.setItem(
                        "gGlamTheme",
                        "dark"
                    );


                    themeToggle.innerHTML =
                        '<i class="fa-solid fa-sun"></i>';


                    themeToggle.title =

        /* =====================================================

        ===================================================== */

        function escapeHtml(value) {

            return String(
                value ?? ""
            )

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );
        }


        /* =====================================================
           GET CREATED DATE
        ===================================================== */

        function getProductTimestamp(product) {

            if (
                product.createdAt &&
                typeof product.createdAt.toMillis === "function"
            ) {

                return product.createdAt.toMillis();
            }


            if (
                product.createdAt &&
                typeof product.createdAt.seconds === "number"
            ) {

                return (
                    product.createdAt.seconds * 1000
                );
            }


            if (
                product.createdAt instanceof Date
            ) {

                return product.createdAt.getTime();
            }


            if (
                typeof product.createdAt === "string"
            ) {

                const date =
                    new Date(
                        product.createdAt
                    );

                if (!Number.isNaN(date.getTime())) {

                    return date.getTime();
                }
            }


            if (
                typeof product.createdAt === "number"
            ) {

                return product.createdAt;
            }


            return 0;
        }


        /* =====================================================
           SORT PRODUCTS
        ===================================================== */

        function sortProductsNewestFirst(
            products
        ) {

            return [...products].sort(
                (a, b) => {

                    const dateA =
                        getProductTimestamp(a);

                    const dateB =
                        getProductTimestamp(b);


                    return dateB - dateA;
                }
            );
        }

        /* =====================================================
           LOAD STORE
        ===================================================== */

        async function loadStore() {

            try {

                const storeRef =
                    doc(
                        db,
                        "stores",
                        currentOwnerUid
                    );


                const storeSnapshot =
                    await getDoc(
                        storeRef
                    );


                if (
                    !storeSnapshot.exists()
                ) {

                    topStoreName.textContent =
                        "لم يتم العثور على المتجر";


                    loading.style.display =
                        "none";


                    showError(
                        "❌ لم يتم العثور على متجر مرتبط بحسابك."
                    );

                    return;
                }


                currentStore =
                    storeSnapshot.data();


                loadStoreHeader();


                currentOwnerEmail =
                    currentStore.ownerEmail ||
                    currentStore.email ||
                    currentOwnerEmail;


                const status =
                    String(
                        currentStore.status ||
                        "active"
                    )
                    .toLowerCase()
                    .trim();


                if (
                    status === "pending" ||
                    status === "waiting" ||
                    status === "review"
                ) {

                    loading.style.display =
                        "none";


                    showError(
                        "⏳ متجرك مازال قيد المراجعة."
                    );

                    return;
                }


                if (
                    status === "rejected" ||
                    status === "refused"
                ) {

                    loading.style.display =
                        "none";


                    showError(
                        "❌ تم رفض إنشاء المتجر."
                    );

                    return;
                }


                await loadProducts();

            }
            catch (error) {

                console.error(
                    "STORE ERROR:",
                    error
                );


                loading.style.display =
                    "none";


                showError(
                    "❌ تعذر تحميل معلومات المتجر.\n" +
                    error.message
                );
            }

        }

                "block";


            productsContainer.innerHTML =
                "";


            productsContainer.appendChild(
                loading
            );


            try {

                const productsQuery =
                    query(
                        collection(
                            db,
                            "products"
                        ),
                        where(
                            "ownerUid",
                            "==",
                            currentOwnerUid
                        )
                    );


                const snapshot =
                    await getDocs(
                        productsQuery
                    );


                allProducts = [];


                snapshot.forEach(
                    productDoc => {

                        const data =
                            productDoc.data();


                        if (
                            data.ownerUid ===
                            currentOwnerUid
                        ) {

                        }

                );

                        allProducts
                    );

                    "none";

        searchInput.addEventListener(
            "input",
            function () {

                const keyword =
                    this.value
                        .trim()
                        .toLowerCase();


                if (!keyword) {

                    renderProducts(
                        allProducts
                    );

                    return;
                }


                const filtered =
                    allProducts.filter(
                        product => {

                            const name =
                                String(
                                    product.name ||
                                    ""
                                )
                                .toLowerCase();


                            const description =
                                String(
                                    product.description ||
                                    ""
                                )
                                .toLowerCase();


                            const category =
                                String(
                                    product.category ||
                                    ""
                                )
                                .toLowerCase();


                            return (
                                name.includes(
                                    keyword
                                ) ||
                                description.includes(
                                    keyword
                                ) ||
                                category.includes(
                                    keyword
                                )
                            );
                        }
                    );


                renderProducts(
                    filtered
                );

            }
        );


        /* =====================================================
           OPEN EDIT MODAL
        ===================================================== */

        function openEditModal(
            productId
        ) {

            const product =
                allProducts.find(
                    p =>
                        p.id ===
                        productId
                );


            if (!product) {

                alert(
                    "المنتج غير موجود."
                );

                return;
            }


            if (
                product.ownerUid !==
                currentOwnerUid
            ) {

                alert(
                    "❌ هذا المنتج لا يخص متجرك."
                );

                return;
            }


            editingProductId =
                productId;


            /* تعبئة كافة الحقول بنفس هيكل بيانات إضافة منتج */
            editName.value =
                product.name || "";


            editPrice.value =
                product.price ?? "";


            editOldPrice.value =
                product.oldPrice ?? "";


            editCategory.value =
                product.category || "";


            editStatus.value =
                product.status || "active";


            editStock.value =
                product.stock ?? "";


            descriptionEditor.innerHTML =
                product.description || "";


            /* COLORS */

            editingColors = [];


            if (
                Array.isArray(
                    product.colors
                )
            ) {

                product.colors.forEach(
                    color => {

                        if (
                            typeof color ===
                            "object"
                        ) {

                            editingColors.push({

                                name:
                                    color.name || "",

                                value:
                                    color.value ||
                                    "#F47B20"

                            });

                        }
                        else {

                            editingColors.push({

                                name:
                                    String(
                                        color
                                    ),

                                value:
                                    "#F47B20"

                            });

                        }

                    }
                );

            }
            else if (
                product.colors
            ) {

                String(
                    product.colors
                )
                .split(",")
                .forEach(
                    color => {

                        const name =
                            color.trim();


                        if (name) {

                            editingColors.push({

                                name:
                                    name,

                                value:
                                    "#F47B20"

                            });

                        }

                    }
                );

            }


            /* SIZES */

            editingSizes = [];


            if (
                Array.isArray(
                    product.sizes
                )
            ) {

                editingSizes =
                    [
                        ...product.sizes
                    ];

            }
            else if (
                product.sizes
            ) {

                editingSizes =
                    String(
                        product.sizes
                    )
                    .split(",")
                    .map(
                        s =>
                            s.trim()
                    )
                    .filter(
                        Boolean
                    );
            }


            /* STOCK VISIBILITY */

            showStock.checked =
                product.showStock !== false;


            updateStockVisibilityText();


            /* IMAGES */

            existingImages = [];


            if (
                Array.isArray(
                    product.images
                )
            ) {

                existingImages =
                    [
                        ...product.images
                    ];

            }
            else if (
                product.image
            ) {

                existingImages = [
                    product.image
                ];
            }


            selectedImages = [];


            editImageFile.value =
                "";


            renderColors();

            renderSizes();

            renderEditImages();


            editModal.classList.add(
                "active"
            );

        }

                    item
                        .querySelector(
                            ".remove-image-btn"
                        )
                        .addEventListener(
                            "click",
                            () => {

                                existingImages.splice(
                                    index,
                                    1
                                );


                                renderEditImages();

                            }
                        );


                    editPreview.appendChild(
                        item
                    );

                }
            );


            selectedImages.forEach(
                (file, index) => {

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "edit-image-item new-image-item";


                    item.innerHTML = `

                        <img
                            class="edit-preview-image"
                        >


                        <span
                            class="new-image-label"
                        >
                            صورة جديدة
                        </span>


                        <button
                            class="remove-image-btn"
                            type="button"
                        >

                            <i
                                class="fa-solid fa-xmark"
                            ></i>

                        </button>

                    `;


                    const img =
                        item.querySelector(
                            ".edit-preview-image"
                        );


                    const reader =
                        new FileReader();


                    reader.onload =
                        event => {

                            img.src =
                                event.target.result;

                        };


                    reader.readAsDataURL(
                        file
                    );


                    item
                        .querySelector(
                            ".remove-image-btn"
                        )
                        .addEventListener(
                            "click",
                            () => {

                                selectedImages.splice(
                                    index,
                                    1
                                );


                                syncSelectedFiles();

                                renderEditImages();

                            }
                        );


                    editPreview.appendChild(
                        item
                    );

                }
            );

        }


        function syncSelectedFiles() {

            const dataTransfer =
                new DataTransfer();


            selectedImages.forEach(
                file => {

                    dataTransfer.items.add(
                        file
                    );

                }
            );


            editImageFile.files =
                dataTransfer.files;
        }


        editImageFile.addEventListener(
            "change",
            function () {

                const files =
                    Array.from(
                        this.files || []
                    );


                files.forEach(
                    file => {

                        if (
                            file.type.startsWith(
                                "image/"
                            )
                        ) {

                            selectedImages.push(
                                file
                            );
                        }

                    }
                );


                syncSelectedFiles();

                renderEditImages();

            }
        );


        /* =====================================================
           CLOUDINARY
        ===================================================== */

        async function uploadToCloudinary(
            file
        ) {

            const formData =
                new FormData();


            formData.append(
                "file",
                file
            );


            formData.append(
                "upload_preset",
                "gglam_products"
            );


            const response =
                await fetch(

                    "https://api.cloudinary.com/v1_1/g82dvrkr/image/upload",

                    {

                        method:
                            "POST",

                        body:
                            formData
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "فشل رفع الصورة إلى Cloudinary."
                );
            }


            const data =
                await response.json();


            if (!data.secure_url) {

                throw new Error(
                    "لم يتم الحصول على رابط الصورة من Cloudinary."
                );
            }


            return data.secure_url;
        }


        /* =====================================================
           SAVE EDIT
        ===================================================== */

        saveEdit.addEventListener(
            "click",
            saveEditedProduct
        );


        async function saveEditedProduct() {

            if (!editingProductId) {

                return;
            }


            const name =
                editName.value.trim();


            const price =
                Number(
                    editPrice.value
                );


            const oldPrice =
                editOldPrice.value !== ""
                ? Number(editOldPrice.value)
                : null;


            const category =
                editCategory.value.trim();


            const status =
                editStatus.value;


            const stock =
                Number(
                    editStock.value
                );


            if (!name) {

                alert(
                    "يرجى إدخال اسم المنتج."
                );

                return;
            }


            if (
                Number.isNaN(price) ||
                price < 0
            ) {

                alert(
                    "يرجى إدخال سعر صحيح."
                );

                return;
            }


            if (
                Number.isNaN(stock) ||
                stock < 0
            ) {

                alert(
                    "يرجى إدخال مخزون صحيح."
                );

                return;
            }


            const product =
                allProducts.find(
                    p =>
                        p.id ===
                        editingProductId
                );


            if (!product) {

                alert(
                    "المنتج غير موجود."
                );

                return;
            }


            if (
                product.ownerUid !==
                currentOwnerUid
            ) {

                alert(
                    "❌ لا يمكنك تعديل منتج لا يخص متجرك."
                );

                return;
            }


            saveEdit.disabled =
                true;


            saveEdit.innerHTML =
                `
                    <i
                        class="fa-solid fa-spinner fa-spin"
                    ></i>

                    جاري الحفظ...
                `;


            try {

                let finalImages =
                    [
                        ...existingImages
                    ];


                for (
                    const file
                    of selectedImages
                ) {

                    const url =
                        await uploadToCloudinary(
                            file
                        );


                    finalImages.push(
                        url
                    );
                }


                const description =
                    descriptionEditor.innerHTML;


                const finalColors =
                    editingColors.map(
                        color => ({

                            name:
                                color.name,

                            value:
                                color.value

                        })
                    );


                const productRef =
                    doc(
                        db,
                        "products",
                        editingProductId
                    );


                /* تحديث كائن المنتج بنفس الهيكل المستخدم في الإضافة */
                await updateDoc(
                    productRef,
                    {

                        name:
                            name,

                        price:
                            price,

                        oldPrice:
                            oldPrice,

                        category:
                            category,

                        status:
                            status,

                        description:
                            description,

                        colors:
                            finalColors,

                        sizes:
                            [
                                ...editingSizes
                            ],

                        stock:
                            stock,

                        showStock:
                            showStock.checked,

                        images:
                            finalImages,

                        image:
                            finalImages.length
                            ?
                            finalImages[0]
                            :
                            "",

                        ownerUid:
                            currentOwnerUid,

                        storeId:
                            currentOwnerUid,

                        updatedAt:
                            serverTimestamp()

                    }
                );


                showSuccess(
                    "✅ تم تعديل المنتج وحفظ جميع التغييرات بنجاح."
                );


                closeEditModal();


                await loadProducts();

            }
            catch (error) {

                console.error(
                    "UPDATE ERROR:",
                    error
                );


                showError(
                    "❌ حدث خطأ أثناء حفظ المنتج:\n" +
                    error.message
                );

            }
            finally {

                saveEdit.disabled =
                    false;


                saveEdit.innerHTML =
                    `
                        <i
                            class="fa-solid fa-floppy-disk"
                        ></i>

                        حفظ التعديلات
                    `;

            }

        }


        /* =====================================================
           CLOSE MODAL
        ===================================================== */

        function closeEditModal() {

            editModal.classList.remove(
                "active"
            );


            editingProductId =
                null;


            existingImages =
                [];


            selectedImages =
                [];


            editingColors =
                [];


            editingSizes =
                [];


            editImageFile.value =
                "";


            editPreview.innerHTML =
                "";
        }


        document
            .getElementById(
                "closeModal"
            )
            .addEventListener(
                "click",
                closeEditModal
            );


        document
            .getElementById(
                "cancelEdit"
            )
            .addEventListener(
                "click",
                closeEditModal
            );


        editModal.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    editModal
                ) {

                    closeEditModal();
                }

            }
        );


        /* =====================================================
           DELETE PRODUCT
        ===================================================== */

        async function deleteProduct(
            productId
        ) {

            const product =
                allProducts.find(
                    p =>
                        p.id ===
                        productId
                );


            if (!product) {

                return;
            }


            if (
                product.ownerUid !==
                currentOwnerUid
            ) {

                alert(
                    "❌ لا يمكنك حذف منتج لا يخص متجرك."
                );

                return;
            }


            const confirmed =
                confirm(
                    "هل أنت متأكد من حذف المنتج؟\n\n" +
                    (
                        product.name ||
                        "هذا المنتج"
                    )
                );


            if (!confirmed) {

                return;
            }


            try {

                const productRef =
                    doc(
                        db,
                        "products",
                        productId
                    );


                const snapshot =
                    await getDoc(
                        productRef
                    );


                if (
                    !snapshot.exists()
                ) {

                    showError(
                        "المنتج غير موجود."
                    );

                    return;
                }


                if (
                    snapshot.data()
                        .ownerUid !==
                    currentOwnerUid
                ) {

                    alert(
                        "❌ لا يمكنك حذف هذا المنتج."
                    );

                    return;
                }


                await deleteDoc(
                    productRef
                );


                showSuccess(
                    "✅ تم حذف المنتج بنجاح."
                );


                await loadProducts();

            }
            catch (error) {

                console.error(
                    "DELETE ERROR:",
                    error
                );


                showError(
                    "❌ حدث خطأ أثناء حذف المنتج:\n" +
                    error.message
                );

            }

        }


        /* =====================================================
           ADD PRODUCT
        ===================================================== */

        document
            .getElementById(
                "addProductBtn"
            )
            .addEventListener(
                "click",
                () => {

                    window.location.href =
                        "add-product.html";

                }
            );


        /* =====================================================
           LOGOUT
        ===================================================== */

        document
            .getElementById(
                "logoutBtn"
            )
            .addEventListener(
                "click",
                async event => {

                    event.preventDefault();


                    const confirmed =
                        confirm(
                            "هل تريد تسجيل الخروج؟"
                        );


                    if (!confirmed) {

                        return;
                    }


                    try {

                        await signOut(
                            auth
                        );


                        window.location.href =
                            "login.html";

                    }
                    catch (error) {

                        console.error(
                            error
                        );


                        showError(
                            "❌ تعذر تسجيل الخروج."
                        );

                    }

                }
            );


        /* =====================================================
           SUCCESS MESSAGE
        ===================================================== */

        function showSuccess(
            message
        ) {

            const success =
                document.getElementById(
                    "successMessage"
                );


            const error =
                document.getElementById(
                    "errorMessage"
                );


            success.textContent =
                message;


            success.style.display =
                "block";


            error.style.display =
                "none";


            setTimeout(
                () => {

                    success.style.display =
                        "none";

                },
                3500
            );

        }


        /* =====================================================
           ERROR MESSAGE
        ===================================================== */

        function showError(
            message
        ) {

            const error =
                document.getElementById(
                    "errorMessage"
                );


            const success =
                document.getElementById(
                    "successMessage"
                );


            error.textContent =
                message;


            error.style.display =
                "block";


            success.style.display =
                "none";
        }


        /* =====================================================
           INITIAL
        ===================================================== */

        topStoreName.textContent =
            "جاري تحميل المتجر...";


        updateStockVisibilityText();

    </script>
