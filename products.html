<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | المنتجات</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

href="https://fonts.gstatic.com"
crossorigin>

<style>

:root{

--orange:#F47B20;
--orange-dark:#DF6810;

--bg:#F7F7F7;
--card:#FFFFFF;

--dark:#222222;
--dark-2:#333333;

--text:#333333;
--muted:#888888;

--border:#E9E9E9;

--danger:#DC3545;
--danger-bg:#FBE7EA;

--shadow:
0 4px 18px rgba(0,0,0,.06);

}

*{

box-sizing:border-box;

margin:0;
padding:0;

font-family:"Tajawal",Arial,sans-serif;

}

body{

background:var(--bg);

color:var(--text);

min-height:100vh;

}


/* =====================================================
SIDEBAR
===================================================== */

.sidebar{

position:fixed;

right:0;
top:0;

height:100vh;

width:75px;

background:#EEEEEE;

color:#444;

overflow:hidden;

transition:.3s;

z-index:1100;

box-shadow:
-3px 0 15px rgba(0,0,0,.04);

border-left:1px solid #E3E3E3;

}

.sidebar:hover{

width:240px;

}


/* =====================================================
LOGO
===================================================== */

.logo{

height:78px;

display:flex;

align-items:center;

justify-content:center;

border-bottom:1px solid #DDDDDD;

white-space:nowrap;

padding:10px;

}

.logo img{

width:48px;

height:48px;

object-fit:contain;

display:block;

transition:.3s;

}

.sidebar:hover .logo img{

width:130px;

height:55px;

}


/* =====================================================
MENU
===================================================== */

.menu{

margin-top:18px;

padding:0 10px;

}

.menu a{

display:flex;

align-items:center;

gap:15px;

height:52px;

padding:0 10px;

margin-bottom:7px;

border-radius:12px;

color:#555;

text-decoration:none;

white-space:nowrap;

transition:.2s;

}

.menu a:hover{

background:#E3E3E3;

color:#222;

}

.menu a.active{

background:var(--orange);

color:white;

box-shadow:
0 5px 15px rgba(244,123,32,.22);

}

.icon{

min-width:35px;

text-align:center;

font-size:20px;

}

.text{

opacity:0;

transition:.25s;

font-size:14px;

font-weight:700;

}

.sidebar:hover .text{

opacity:1;

}


/* =====================================================
TOP BAR
===================================================== */

.topbar{

position:fixed;

top:0;

right:75px;

left:0;

height:78px;

background:white;

border-bottom:1px solid var(--border);

display:flex;

align-items:center;

justify-content:space-between;

padding:0 25px;

z-index:1000;

box-shadow:
0 2px 12px rgba(0,0,0,.04);

transition:.3s;

}


/* =====================================================
STORE TOP
===================================================== */

.store-top{

display:flex;

align-items:center;

gap:12px;

min-width:0;

}


/* =====================================================
STORE IMAGE
===================================================== */

.store-image{

width:48px;

height:48px;

border-radius:50%;

object-fit:cover;

background:#F1F1F1;

border:2px solid #FFE0C8;

flex-shrink:0;

}


/* =====================================================
STORE DETAILS
===================================================== */

.store-details{

display:flex;

flex-direction:column;

min-width:0;

}

.store-label{

font-size:11px;

color:#999;

margin-bottom:2px;

}

.store-top-name{

font-size:16px;

font-weight:800;

color:#222;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

max-width:250px;

}


/* =====================================================
VIEW STORE
===================================================== */

.view-store-btn{

display:flex;

align-items:center;

gap:7px;

background:#FFF1E6;

color:var(--orange-dark);

text-decoration:none;

padding:10px 15px;

border-radius:11px;

font-size:13px;

font-weight:700;

transition:.2s;

white-space:nowrap;

border:1px solid #FFE0CA;

}

.view-store-btn:hover{

background:var(--orange);

color:white;

}


/* =====================================================
CONTENT
===================================================== */

.content{

margin-right:75px;

padding:103px 25px 25px;

transition:.3s;

}


/* =====================================================
HEADER
===================================================== */

.header{

background:var(--card);

border:1px solid var(--border);

border-radius:18px;

padding:25px;

box-shadow:var(--shadow);

margin-bottom:22px;

position:relative;

overflow:hidden;

}

.header::before{

content:"";

position:absolute;

right:0;

top:0;

width:5px;

height:100%;

background:var(--orange);

}

.header h1{

font-size:27px;

color:var(--dark-2);

margin-bottom:8px;

}

.header p{

color:var(--muted);

font-size:14px;

}

.owner-email{

font-size:13px;

color:var(--muted);

margin-top:13px;

}

.owner-email span{

color:var(--dark-2);

font-weight:700;

}


/* =====================================================
PRODUCT SECTION
===================================================== */

.section{

background:white;

border:1px solid var(--border);

padding:22px;

border-radius:18px;

box-shadow:var(--shadow);

}


/* =====================================================
SECTION HEADER
===================================================== */

.section-header{

display:flex;

align-items:center;

justify-content:space-between;

gap:15px;

margin-bottom:20px;

flex-wrap:wrap;

}

.section-header h2{

font-size:21px;

color:var(--dark);

}


/* =====================================================
ADD BUTTON
===================================================== */

.add-btn{

background:var(--orange);

color:white;

border:none;

padding:11px 18px;

border-radius:11px;

cursor:pointer;

font-size:14px;

font-weight:700;

transition:.2s;

box-shadow:
0 4px 10px rgba(244,123,32,.18);

}

.add-btn:hover{

background:var(--orange-dark);

transform:translateY(-1px);

}


/* =====================================================
SEARCH
===================================================== */

.search{

width:100%;

padding:13px 15px;

border:1px solid var(--border);

border-radius:11px;

font-size:14px;

outline:none;

background:#FCFCFC;

margin-bottom:20px;

transition:.2s;

}

.search:focus{

border-color:var(--orange);

background:white;

box-shadow:
0 0 0 3px rgba(244,123,32,.08);

}


/* =====================================================
PRODUCTS
===================================================== */

.products{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:17px;

}


/* =====================================================
PRODUCT
===================================================== */

.product{

background:white;

border:1px solid var(--border);

border-radius:16px;

padding:10px;

transition:.25s;

overflow:hidden;

}

.product:hover{

transform:translateY(-3px);

box-shadow:
0 8px 25px rgba(0,0,0,.08);

}


/* =====================================================
PRODUCT IMAGE
===================================================== */

.product img{

width:100%;

height:190px;

object-fit:cover;

border-radius:12px;

background:#F2F2F2;

display:block;

}


/* =====================================================
PRODUCT NAME
===================================================== */

.product h3{

font-size:16px;

margin:12px 6px 7px;

color:var(--dark);

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

}


/* =====================================================
PRICE
===================================================== */

.product-price{

font-size:16px;

font-weight:700;

color:var(--orange);

margin:0 6px 8px;

}


/* =====================================================
STOCK
===================================================== */

.product-stock{

font-size:13px;

color:var(--muted);

margin:0 6px 12px;

}


/* =====================================================
BUTTONS
===================================================== */

.product-buttons{

display:flex;

gap:7px;

}

.product-buttons button{

flex:1;

padding:10px 5px;

border:none;

border-radius:9px;

cursor:pointer;

font-size:13px;

font-weight:700;

transition:.2s;

font-family:"Tajawal",Arial,sans-serif;

}

.edit-btn{

background:#FFF1E6;

color:var(--orange-dark);

}

.edit-btn:hover{

background:#FFE2CC;

}

.delete-btn{

background:var(--danger-bg);

color:#B52B39;

}

.delete-btn:hover{

background:#F6D1D6;

}


/* =====================================================
EMPTY
===================================================== */

.empty{

background:#FAFAFA;

border:1px dashed #DDD;

padding:40px 20px;

text-align:center;

color:var(--muted);

border-radius:14px;

grid-column:1/-1;

line-height:1.8;

}


/* =====================================================
MESSAGE
===================================================== */

.message{

display:none;

padding:14px 18px;

border-radius:12px;

margin-bottom:18px;

text-align:center;

font-size:14px;

}

.success{

background:#E5F5EC;

color:#155724;

border:1px solid #C5E8D3;

}

.error{

background:var(--danger-bg);

color:#721c24;

border:1px solid #EFC7CC;

}


/* =====================================================
TABLET
===================================================== */

@media(max-width:1000px){

.products{

grid-template-columns:repeat(3,1fr);

}

}


/* =====================================================
TABLET 2
===================================================== */

@media(max-width:800px){

.sidebar{

width:65px;

}

.sidebar:hover{

width:210px;

}

.topbar{

right:65px;

}

.content{

margin-right:65px;

padding-top:93px;

}

.products{

grid-template-columns:repeat(2,1fr);

}

}


/* =====================================================
MOBILE
===================================================== */

@media(max-width:550px){

.sidebar{

width:60px;

}

.sidebar:hover{

width:200px;

}

.topbar{

right:60px;

height:68px;

padding:0 12px;

}

.content{

padding:83px 12px 20px;

margin-right:60px;

}

.header{

padding:20px;

}

.header h1{

font-size:22px;

}

.section{

padding:15px;

}

.section-header h2{

font-size:18px;

}

.add-btn{

padding:10px 12px;

font-size:12px;

}

.products{

grid-template-columns:1fr 1fr;

gap:10px;

}

.product img{

height:150px;

}

.store-image{

width:42px;

height:42px;

}

.store-label{

display:none;

}

.store-top-name{

font-size:14px;

max-width:120px;

}

.view-store-btn{

padding:8px 10px;

font-size:11px;

}

}


/* =====================================================
SMALL MOBILE
===================================================== */

@media(max-width:380px){

.products{

grid-template-columns:1fr;

}

.product img{

height:190px;

}

.view-store-btn{

font-size:0;

width:40px;

height:40px;

padding:0;

justify-content:center;

}

.view-store-btn::before{

content:"👁️";

font-size:18px;

}

}


/* =====================================================
SCROLLBAR
===================================================== */

::-webkit-scrollbar{

width:7px;

}

::-webkit-scrollbar-track{

background:#F1F1F1;

}

::-webkit-scrollbar-thumb{

background:#CCC;

border-radius:10px;

}

::-webkit-scrollbar-thumb:hover{

background:var(--orange);

}

</style>

<script type="module">


/* =====================================================
FIREBASE
===================================================== */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
collection,
getDocs,
query,
where,
deleteDoc,
doc,
getDoc

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


import {

getAuth,
onAuthStateChanged,
signOut

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


/* =====================================================
CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =====================================================
INITIALIZE
===================================================== */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);


/* =====================================================
ELEMENTS
===================================================== */

const storeNameElement =
document.getElementById("storeName");

const ownerEmailElement =
document.getElementById("ownerEmail");

const topStoreName =
document.getElementById("topStoreName");

const topStoreImage =
document.getElementById("topStoreImage");

const viewStoreBtn =
document.getElementById("viewStoreBtn");

const productsContainer =
document.getElementById("productsContainer");

const searchInput =
document.getElementById("searchInput");

const addProductBtn =
document.getElementById("addProductBtn");


/* =====================================================
VARIABLES
===================================================== */

let currentOwnerUid = "";

let currentOwnerEmail = "";

let currentStoreId = "";

let currentStoreName = "G-Glam";

let currentStore = null;

let allProducts = [];


/* =====================================================
ADD PRODUCT
===================================================== */

addProductBtn.addEventListener(

"click",

function(){

window.location.href =
"add-product.html";

}

);


/* =====================================================
LOAD STORE
===================================================== */

async function loadStore(){

try{

const user =
auth.currentUser;


if(!user){

window.location.href =
"login.html";

return false;

}


currentOwnerUid =
user.uid;

currentOwnerEmail =
user.email || "";


/* =====================================================
FIRST METHOD
stores/{UID}
===================================================== */

let storeSnapshot =

await getDoc(

doc(
db,
"stores",
currentOwnerUid
)

);


/* =====================================================
SECOND METHOD
ownerUid
===================================================== */

if(!storeSnapshot.exists()){

const ownerQuery =
query(

collection(
db,
"stores"
),

where(
"ownerUid",
"==",
currentOwnerUid
)

);


const ownerSnapshot =
await getDocs(
ownerQuery
);


if(!ownerSnapshot.empty){

storeSnapshot =
ownerSnapshot.docs[0];

}

}


/* =====================================================
THIRD METHOD
ownerEmail
===================================================== */

if(!storeSnapshot.exists() &&
currentOwnerEmail){

const emailQuery =
query(

collection(
db,
"stores"
),

where(
"ownerEmail",
"==",
currentOwnerEmail
)

);


const emailSnapshot =
await getDocs(
emailQuery
);


if(!emailSnapshot.empty){

storeSnapshot =
emailSnapshot.docs[0];

}

}


/* =====================================================
STORE NOT FOUND
===================================================== */

if(!storeSnapshot.exists()){

alert(

"⚠️ لم يتم العثور على متجر مرتبط بهذا الحساب."

);

await signOut(auth);

window.location.href =
"login.html";

return false;

}


/* =====================================================
STORE DATA
===================================================== */

currentStore =
storeSnapshot.data();

currentStoreId =
storeSnapshot.id;


/* =====================================================
STATUS
===================================================== */

const status =

String(
currentStore.status ||
"pending"
)

.toLowerCase()
.trim();


if(

status === "pending" ||
status === "waiting" ||
status === "review"

){

alert(
"⏳ طلب إنشاء متجرك مازال قيد المراجعة من طرف الإدارة."
);

await signOut(auth);

window.location.href =
"login.html";

return false;

}


if(

status === "rejected" ||
status === "refused"

){

const reason =

currentStore.rejectionReason ||
"لم يتم ذكر سبب الرفض.";


alert(

"❌ تم رفض طلب إنشاء المتجر.\n\n" +
"سبب الرفض:\n" +
reason

);

await signOut(auth);

window.location.href =
"login.html";

return false;

}


if(

status !== "active" &&
status !== "approved"

){

alert(
"⚠️ لا يمكنك الدخول إلى لوحة التحكم حاليًا."
);

await signOut(auth);

window.location.href =
"login.html";

return false;

}


/* =====================================================
STORE NAME
===================================================== */

currentStoreName =

currentStore.storeName ||

currentStore.name ||

"G-Glam";


/* =====================================================
EMAIL
===================================================== */

currentOwnerEmail =

currentStore.ownerEmail ||

currentStore.email ||

user.email ||

"";


/* =====================================================
STORE IMAGE
===================================================== */

const storeImage =

currentStore.storeImage ||

currentStore.image ||

currentStore.logo ||

currentStore.photoURL ||

"";


if(storeImage){

topStoreImage.src =
storeImage;

}else{

topStoreImage.src =
"logotrans.png";

}


/* =====================================================
DISPLAY
===================================================== */

storeNameElement.textContent =
currentStoreName;

ownerEmailElement.textContent =
currentOwnerEmail;

topStoreName.textContent =
currentStoreName;


/* =====================================================
VIEW STORE
===================================================== */

viewStoreBtn.href =

"index.html?store=" +

encodeURIComponent(
currentOwnerUid
);


/* =====================================================
LOCAL STORAGE
===================================================== */

localStorage.setItem(
"storeId",
currentOwnerUid
);

localStorage.setItem(
"storeDocumentId",
currentStoreId
);

localStorage.setItem(
"storeName",
currentStoreName
);

localStorage.setItem(
"storeOwnerEmail",
currentOwnerEmail
);

localStorage.setItem(
"ownerEmail",
currentOwnerEmail
);

localStorage.setItem(
"ownerUid",
currentOwnerUid
);

localStorage.setItem(
"paymentStatus",
"approved"
);


/* =====================================================
LOAD PRODUCTS
===================================================== */

await loadProducts();

return true;


}catch(error){

console.error(
"LOAD STORE ERROR:",
error
);

showError(
"❌ حدث خطأ أثناء تحميل بيانات المتجر: " +
error.message
);

return false;

}

}


/* =====================================================
LOAD PRODUCTS
===================================================== */

async function loadProducts(){

try{

let snapshot;


/* =====================================================
OWNER UID
===================================================== */

try{

const q =
query(

collection(
db,
"products"
),

where(
"ownerUid",
"==",
currentOwnerUid
)

);

snapshot =
await getDocs(q);


}catch(error){

console.log(
"ownerUid products query failed:",
error
);


/* =====================================================
STORE ID
===================================================== */

try{

const q2 =
query(

collection(
db,
"products"
),

where(
"storeId",
"==",
currentOwnerUid
)

);

snapshot =
await getDocs(q2);


}catch(error2){

console.log(
"storeId products query failed:",
error2
);


/* =====================================================
OWNER EMAIL
===================================================== */

const q3 =
query(

collection(
db,
"products"
),

where(
"ownerEmail",
"==",
currentOwnerEmail
)

);

snapshot =
await getDocs(q3);

}

}


/* =====================================================
STORE PRODUCTS
===================================================== */

allProducts = [];


snapshot.forEach(

productDoc => {

allProducts.push({

id:productDoc.id,

...productDoc.data()

});

});


displayProducts();


}catch(error){

console.error(
"PRODUCTS ERROR:",
error
);


productsContainer.innerHTML = `

<div class="empty">

❌ حدث خطأ أثناء تحميل المنتجات.

<br><br>

${escapeHtml(
error.message || ""
)}

</div>

`;

}

}


/* =====================================================
DISPLAY PRODUCTS
===================================================== */

function displayProducts(){

const searchValue =

searchInput.value
.trim()
.toLowerCase();


const filtered =

allProducts.filter(

product => {

const name =

String(
product.name || ""
)
.toLowerCase();


return name.includes(
searchValue
);

}

);


productsContainer.innerHTML = "";


if(filtered.length === 0){

productsContainer.innerHTML = `

<div class="empty">

📭 لا توجد منتجات مطابقة.

<br><br>

<button
class="add-btn"
id="emptyAddBtn">

➕ إضافة منتج

</button>

</div>

`;


document
.getElementById("emptyAddBtn")
.addEventListener(
"click",
function(){

window.location.href =
"add-product.html";

}
);

return;

}


/* =====================================================
CARDS
===================================================== */

filtered.forEach(

product => {

const card =
document.createElement("div");

card.className =
"product";


const image =

product.image ||

(

Array.isArray(product.images) &&
product.images.length

?

product.images[0]

:

"gglamlogo.png"

);


card.innerHTML = `

<img

src="${escapeHtml(image)}"

alt="${escapeHtml(
product.name || "منتج"
)}"

onerror="this.src='gglamlogo.png';"

>


<h3>

${escapeHtml(
product.name ||
"بدون اسم"
)}

</h3>


<div class="product-price">

${Number(
product.price || 0
)}

DA

</div>


<div class="product-stock">

المخزون:

${Number(
product.stock || 0
)}

</div>


<div class="product-buttons">


<button
class="edit-btn">

✏️ تعديل

</button>


<button
class="delete-btn">

🗑️ حذف

</button>


</div>

`;


/* =====================================================
EDIT
===================================================== */

card
.querySelector(".edit-btn")
.addEventListener(

"click",

function(){

window.location.href =

"edit-product.html?id=" +

encodeURIComponent(
product.id
);

}

);


/* =====================================================
DELETE
===================================================== */

card
.querySelector(".delete-btn")
.addEventListener(

"click",

function(){

deleteProduct(
product.id
);

}

);


productsContainer.appendChild(
card
);

});

}


/* =====================================================
SEARCH
===================================================== */

searchInput.addEventListener(

"input",

displayProducts

);


/* =====================================================
DELETE
===================================================== */

async function deleteProduct(id){

const ok =
confirm(
"هل تريد حذف هذا المنتج؟"
);


if(!ok){

return;

}


try{

await deleteDoc(

doc(
db,
"products",
id
)

);


showSuccess(
"تم حذف المنتج بنجاح ✅"
);


await loadProducts();


}catch(error){

console.error(
"DELETE ERROR:",
error
);


showError(
"❌ حدث خطأ أثناء حذف المنتج: " +
error.message
);

}

}


/* =====================================================
LOGOUT
===================================================== */

document
.getElementById("logoutBtn")
.addEventListener(

"click",

async function(event){

event.preventDefault();


const ok =
confirm(
"هل تريد تسجيل الخروج؟"
);


if(!ok){

return;

}


try{

await signOut(auth);


localStorage.removeItem(
"storeId"
);

localStorage.removeItem(
"storeDocumentId"
);

localStorage.removeItem(
"ownerUid"
);

localStorage.removeItem(
"ownerEmail"
);

localStorage.removeItem(
"storeOwnerEmail"
);

localStorage.removeItem(
"storeName"
);

localStorage.removeItem(
"paymentStatus"
);


window.location.href =
"login.html";


}catch(error){

console.error(
"LOGOUT ERROR:",
error
);

showError(
"❌ تعذر تسجيل الخروج."
);

}

});


/* =====================================================
SUCCESS
===================================================== */

function showSuccess(text){

const box =
document.getElementById(
"successMessage"
);


box.textContent =
text;

box.style.display =
"block";


setTimeout(

function(){

box.style.display =
"none";

},

3000

);

}


/* =====================================================
ERROR
===================================================== */

function showError(text){

const box =
document.getElementById(
"errorMessage"
);


box.textContent =
text;

box.style.display =
"block";


setTimeout(

function(){

box.style.display =
"none";

},

4000

);

}


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
AUTH
===================================================== */

onAuthStateChanged(

auth,

async function(user){

if(!user){

window.location.href =
"login.html";

return;

}


currentOwnerUid =
user.uid;

currentOwnerEmail =
user.email || "";


await loadStore();

});


/* =====================================================
START
===================================================== */

console.log(
"G-Glam Products Started"
);

</script>
