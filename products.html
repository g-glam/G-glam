<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G-Glam | المنتجات</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f6f6f6;
color:#222;
min-height:100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{

position:fixed;

right:0;
top:0;

width:70px;
height:100vh;

background:#111;
color:#fff;

overflow:hidden;

transition:.3s;

z-index:1000;

}

.sidebar:hover{
width:230px;
}

.logo{

height:70px;

display:flex;

align-items:center;

justify-content:center;

font-size:22px;

font-weight:bold;

border-bottom:1px solid #333;

white-space:nowrap;

}

.menu{

margin-top:20px;

}

.menu a{

display:flex;

align-items:center;

gap:15px;

padding:15px;

color:#fff;

text-decoration:none;

white-space:nowrap;

transition:.2s;

}

.menu a:hover{
background:#222;
}

.menu a.active{
background:#222;
}

.icon{

min-width:35px;

text-align:center;

font-size:20px;

}

.text{

opacity:0;

transition:.3s;

}

.sidebar:hover .text{
opacity:1;
}


/* =========================
   CONTENT
========================= */

.content{

margin-right:70px;

padding:25px;

}


/* =========================
   HEADER
========================= */

.header{

background:#fff;

padding:22px;

border-radius:16px;

box-shadow:
0 3px 15px rgba(0,0,0,.06);

margin-bottom:20px;

}

.header h1{

font-size:27px;

margin-bottom:8px;

}

.header p{

color:#777;

font-size:14px;

}

.owner{

margin-top:12px;

font-size:13px;

color:#888;

}

.owner span{

font-weight:bold;

color:#222;

}


/* =========================
   MESSAGES
========================= */

.message{

display:none;

padding:13px;

border-radius:10px;

margin-bottom:15px;

text-align:center;

}

.success{

background:#dff5e5;

color:#17652d;

}

.error{

background:#f9dddd;

color:#842029;

}


/* =========================
   TOOLBAR
========================= */

.toolbar{

display:flex;

align-items:center;

justify-content:space-between;

gap:15px;

margin-bottom:20px;

}

.search{

flex:1;

}

.search input{

width:100%;

padding:14px 18px;

border:1px solid #ddd;

border-radius:12px;

background:#fff;

outline:none;

font-size:14px;

}

.add-product-btn{

background:#111;

color:#fff;

padding:13px 20px;

border-radius:12px;

text-decoration:none;

font-weight:bold;

white-space:nowrap;

}

.add-product-btn:hover{

background:#222;

}


/* =========================
   PRODUCTS GRID
========================= */

.products{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:18px;

}


/* =========================
   PRODUCT CARD
========================= */

.product-card{

background:#fff;

border-radius:17px;

overflow:hidden;

box-shadow:
0 3px 15px rgba(0,0,0,.06);

border:1px solid #eee;

transition:.25s;

}

.product-card:hover{

transform:translateY(-4px);

box-shadow:
0 8px 25px rgba(0,0,0,.10);

}


/* =========================
   PRODUCT IMAGE
========================= */

.product-image{

width:100%;

aspect-ratio:1/1;

background:#f3f3f3;

overflow:hidden;

}

.product-image img{

width:100%;

height:100%;

object-fit:cover;

display:block;

}


/* =========================
   PRODUCT INFO
========================= */

.product-info{

padding:15px;

}

.product-name{

font-size:16px;

font-weight:bold;

margin-bottom:9px;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

}

.product-price{

font-size:17px;

font-weight:bold;

color:#F47B20;

margin-bottom:7px;

}

.product-stock{

font-size:13px;

color:#777;

margin-bottom:15px;

}


/* =========================
   ACTIONS
========================= */

.actions{

display:grid;

grid-template-columns:1fr 1fr;

gap:8px;

}

.edit-btn,
.delete-btn{

border:none;

padding:11px;

border-radius:10px;

font-size:13px;

font-weight:bold;

cursor:pointer;

}

.edit-btn{

background:#f1f1f1;

color:#222;

}

.edit-btn:hover{

background:#e5e5e5;

}

.delete-btn{

background:#ffe5e5;

color:#c62828;

}

.delete-btn:hover{

background:#ffd4d4;

}


/* =========================
   EMPTY
========================= */

.empty{

background:#fff;

border:1px dashed #ccc;

border-radius:15px;

padding:50px 20px;

text-align:center;

color:#777;

grid-column:1/-1;

}

.empty-icon{

font-size:45px;

margin-bottom:12px;

}


/* =========================
   LOADING
========================= */

.loading{

grid-column:1/-1;

background:#fff;

padding:50px;

border-radius:15px;

text-align:center;

color:#777;

}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px){

.products{

grid-template-columns:
repeat(3,1fr);

}

}

@media(max-width:800px){

.products{

grid-template-columns:
repeat(2,1fr);

}

.toolbar{

flex-direction:column;

align-items:stretch;

}

}

@media(max-width:500px){

.sidebar{

width:60px;

}

.sidebar:hover{

width:200px;

}

.content{

margin-right:60px;

padding:12px;

}

.header{

padding:18px;

}

.header h1{

font-size:22px;

}

.products{

grid-template-columns:
repeat(2,1fr);

gap:10px;

}

.product-info{

padding:11px;

}

.product-name{

font-size:14px;

}

.product-price{

font-size:15px;

}

.product-stock{

font-size:12px;

}

.actions{

grid-template-columns:1fr;

}

.add-product-btn{

text-align:center;

}

}

</style>

</head>

<body>


<!-- =========================
     SIDEBAR
========================= -->

<div class="sidebar">

<div class="logo">
G-Glam
</div>

<div class="menu">

<a href="dashboard.html">

<span class="icon">🏠</span>

<span class="text">
الرئيسية
</span>

</a>

<a href="orders.html">

<span class="icon">📦</span>

<span class="text">
الطلبات
</span>

</a>

<a href="products.html"
class="active">

<span class="icon">🛍️</span>

<span class="text">
المنتجات
</span>

</a>

<a href="add-product.html">

<span class="icon">➕</span>

<span class="text">
إضافة منتج
</span>

</a>

<a href="delivery.html">

<span class="icon">🚚</span>

<span class="text">
أسعار التوصيل
</span>

</a>

<a href="stores.html">

<span class="icon">🏪</span>

<span class="text">
المتاجر
</span>

</a>

<a href="settings.html">

<span class="icon">⚙️</span>

<span class="text">
الإعدادات
</span>

</a>

</div>

</div>


<!-- =========================
     CONTENT
========================= -->

<div class="content">


<div class="header">

<h1>
🛍️ منتجات متجري
</h1>

<p>
إدارة المنتجات الخاصة بمتجرك
</p>

<div class="owner">

📧 الحساب:

<span id="ownerEmail">
جاري التحميل...
</span>

</div>

</div>


<div
id="successMessage"
class="message success">
</div>


<div
id="errorMessage"
class="message error">
</div>


<!-- =========================
     TOOLBAR
========================= -->

<div class="toolbar">

<div class="search">

<input
type="text"
id="searchInput"
placeholder="🔎 ابحث عن منتج..."
>

</div>

<a
href="add-product.html"
class="add-product-btn">

➕ إضافة منتج

</a>

</div>


<!-- =========================
     PRODUCTS
========================= -->

<div
class="products"
id="productsContainer">

<div class="loading">

⏳ جاري تحميل المنتجات...

</div>

</div>


</div>


<!-- =========================
     FIREBASE
========================= -->

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getFirestore,
collection,
query,
where,
getDocs,
deleteDoc,
doc
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


const firebaseConfig={

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);


/* =========================
   VARIABLES
========================= */

let currentUid="";

let allProducts=[];


/* =========================
   ELEMENTS
========================= */

const productsContainer =
document.getElementById(
"productsContainer"
);

const ownerEmail =
document.getElementById(
"ownerEmail"
);

const searchInput =
document.getElementById(
"searchInput"
);


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

return String(value ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

productsContainer.innerHTML=`

<div class="loading">

⏳ جاري تحميل المنتجات...

</div>

`;

try{

const productsRef =
collection(
db,
"products"
);


/*
   كل صاحب متجر يرى
   المنتجات التي تحمل UID الخاص به
*/

const q =
query(

productsRef,

where(
"ownerUid",
"==",
currentUid
)

);


const snapshot =
await getDocs(q);


allProducts=[];


snapshot.forEach(
productDoc=>{

allProducts.push({

id:productDoc.id,

...productDoc.data()

});

});


renderProducts(allProducts);


}catch(error){

console.error(
"LOAD PRODUCTS ERROR:",
error
);

productsContainer.innerHTML=`

<div class="empty">

<div class="empty-icon">
❌
</div>

حدث خطأ أثناء تحميل المنتجات.

<br><br>

${escapeHtml(error.message)}

</div>

`;

}

}


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(products){

productsContainer.innerHTML="";


if(!products.length){

productsContainer.innerHTML=`

<div class="empty">

<div class="empty-icon">
🛍️
</div>

لا توجد منتجات في متجرك حاليًا.

<br>

اضغط على "إضافة منتج" لإضافة أول منتج.

</div>

`;

return;

}


products.forEach(
product=>{

const card =
document.createElement(
"div"
);

card.className =
"product-card";


/* الصورة */

const image =

product.image ||

(
Array.isArray(product.images)
&&
product.images.length
?
product.images[0]
:
""
);


/* المخزون */

const stock =
Number(
product.stock || 0
);


card.innerHTML=`

<div class="product-image">

${
image
?
`
<img
src="${escapeHtml(image)}"
alt="${escapeHtml(product.name)}"
loading="lazy"
>
`
:
`
<div style="
height:100%;
display:flex;
align-items:center;
justify-content:center;
font-size:45px;
color:#bbb;
">
🛍️
</div>
`
}

</div>


<div class="product-info">

<div class="product-name">

${escapeHtml(
product.name || "منتج بدون اسم"
)}

</div>


<div class="product-price">

${Number(
product.price || 0
)} DA

</div>


<div class="product-stock">

📦 المخزون:
${stock}

</div>


<div class="actions">


<button
class="edit-btn"
data-id="${escapeHtml(product.id)}">

✏️ تعديل

</button>


<button
class="delete-btn"
data-id="${escapeHtml(product.id)}">

🗑️ حذف

</button>


</div>

</div>

`;


/* تعديل */

card
.querySelector(".edit-btn")
.addEventListener(
"click",
()=>{

window.location.href=
"edit-product.html?id="+
encodeURIComponent(product.id);

});


/* حذف */

card
.querySelector(".delete-btn")
.addEventListener(
"click",
()=>{

deleteProduct(product.id);

});


productsContainer.appendChild(card);

});

}


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(productId){

const product =
allProducts.find(
item=>item.id===productId
);

if(!product){

return;

}


const confirmed =
confirm(

"⚠️ هل أنت متأكد من حذف المنتج؟\n\n"+
(product.name || "هذا المنتج")+
"\n\nلا يمكن التراجع عن هذا الحذف."

);


if(!confirmed){

return;

}


try{

await deleteDoc(

doc(
db,
"products",
productId
)

);


showSuccess(
"✅ تم حذف المنتج بنجاح"
);


await loadProducts();


}catch(error){

console.error(
"DELETE PRODUCT ERROR:",
error
);

showError(
"❌ تعذر حذف المنتج: "+
error.message
);

}

}


/* =========================
   SEARCH
========================= */

searchInput.addEventListener(
"input",
function(){

const keyword =
this.value
.toLowerCase()
.trim();


if(!keyword){

renderProducts(
allProducts
);

return;

}


const filtered =
allProducts.filter(
product=>{

const name =
String(
product.name || ""
)
.toLowerCase();

const description =
String(
product.description || ""
)
.toLowerCase();

return (

name.includes(keyword)

||

description.includes(keyword)

);

});


renderProducts(
filtered
);

});


/* =========================
   MESSAGES
========================= */

function showSuccess(message){

const element =
document.getElementById(
"successMessage"
);

element.textContent =
message;

element.style.display =
"block";


document.getElementById(
"errorMessage"
)
.style.display="none";


setTimeout(
()=>{

element.style.display="none";

},
3000
);

}


function showError(message){

const element =
document.getElementById(
"errorMessage"
);

element.textContent =
message;

element.style.display =
"block";


document.getElementById(
"successMessage"
)
.style.display="none";


setTimeout(
()=>{

element.style.display="none";

},
5000
);

}


/* =========================
   AUTH
========================= */

onAuthStateChanged(
auth,
async user=>{

if(!user){

window.location.href=
"login.html";

return;

}


currentUid =
user.uid;


ownerEmail.textContent =
user.email || "غير معروف";


await loadProducts();

});

</script>

</body>

</html>
