<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:'Tajawal',sans-serif;

:root{

--orange:#F47B20;
--orange-dark:#DF6810;

--bg:#F7F7F7;

}

body{

}

/* ==============================
   SIDEBAR
============================== */

.sidebar{

position:fixed;

right:0;
top:0;

height:100vh;

width:75px;

background:var(--sidebar);

border-left:1px solid var(--border);

overflow:hidden;

transition:.3s;

}

.sidebar:hover{

width:240px;

}

.logo{

height:78px;

display:flex;

align-items:center;

justify-content:center;

font-size:23px;

font-weight:800;

color:var(--dark);

border-bottom:1px solid #ddd;

white-space:nowrap;

}

.logo span{

color:var(--orange);

}

.menu{

margin-top:18px;

padding:0 10px;

}

.menu a{

display:flex;

align-items:center;

gap:15px;

height:52px;

padding:0 10px;

margin-bottom:7px;

border-radius:12px;

color:#555;

text-decoration:none;

white-space:nowrap;

transition:.2s;

}

.menu a:hover{

background:#E4E4E4;

color:var(--dark);

}

.menu a.active{

background:var(--orange);

color:white;

box-shadow:0 5px 15px rgba(244,123,32,.20);

}

.icon{

min-width:35px;

text-align:center;

font-size:20px;

}

.text{

opacity:0;

transition:.25s;

font-size:14px;

font-weight:bold;

}

.sidebar:hover .text{

opacity:1;

}

/* ==============================
   CONTENT
============================== */

.content{

margin-right:75px;

padding:25px;

}

/* ==============================
   HEADER
============================== */

.header{

background:var(--card);

border:1px solid var(--border);

border-radius:18px;

padding:25px;

box-shadow:var(--shadow);

margin-bottom:22px;

position:relative;

overflow:hidden;

}

.header::before{

content:"";

right:0;

top:0;

width:5px;

height:100%;

background:var(--orange);

}

}

}

font-weight:bold;

}

/* ==============================
   TOP BAR
============================== */

.top-bar{

display:flex;

align-items:center;

justify-content:space-between;

gap:15px;

margin-bottom:20px;

}

.search-box{

flex:1;

position:relative;

}

.search-box input{

width:100%;

height:48px;

border:1px solid var(--border);

border-radius:13px;

padding:0 45px 0 15px;

background:white;

font-size:14px;

}

.search-box input:focus{

}

.search-icon{

right:15px;

top:50%;

}

.add-product-btn{

padding:0 20px;

border:none;

border-radius:13px;

color:white;

font-size:14px;

font-weight:bold;

cursor:pointer;

text-decoration:none;

align-items:center;

justify-content:center;

white-space:nowrap;

transition:.2s;

}

.add-product-btn:hover{

background:var(--orange-dark);

transform:translateY(-1px);

}

/* ==============================
   PRODUCTS SECTION
============================== */

.section{

background:white;

border:1px solid var(--border);

border-radius:18px;

padding:22px;

box-shadow:var(--shadow);

}

.section-header{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:20px;

/* ==============================

============================== */

.products-grid{

display:grid;

repeat(4,1fr);

/* ==============================
   PRODUCT CARD
============================== */

.product-card{

position:relative;

}

.product-card:hover{

box-shadow:
0 10px 28px rgba(0,0,0,.09);

}

/* ==============================

============================== */

.product-image{

background:#F2F2F2;

}

.product-image img{

width:100%;

height:100%;

}

.product-card:hover
.product-image img{

}

.image-count{

border-radius:20px;

}

/* ==============================

============================== */

.product-info{

}

.product-name{

}

.product-description{

height:38px;

}

.product-bottom{

}

.product-price{

}

.stock{

.stock.low{

}

.stock.out{

}

/* ==============================
   BUTTONS
============================== */

.card-actions{

display:grid;

grid-template-columns:1fr 1fr;

gap:8px;

}

.edit-btn,
.delete-btn{

height:40px;

border:none;

border-radius:10px;

font-size:13px;

font-weight:bold;

}

.edit-btn{

}

.edit-btn:hover{

}

.delete-btn{

}

.delete-btn:hover{

background:#FFE0D8;

}

/* ==============================
   LOADING
============================== */

.loading{

grid-column:1/-1;

padding:60px 20px;

text-align:center;

color:var(--muted);

font-size:15px;

}

/* ==============================
   EMPTY
============================== */

.empty{

grid-column:1/-1;

padding:60px 20px;

text-align:center;

background:#FAFAFA;

border:1px dashed #D8D8D8;

border-radius:15px;

color:var(--muted);

}

.empty-icon{

font-size:45px;

margin-bottom:10px;

}

.empty a{

display:inline-block;

margin-top:15px;

padding:10px 18px;

background:var(--orange);

color:white;

border-radius:10px;

text-decoration:none;

font-weight:bold;

}

/* ==============================
   MESSAGE
============================== */

.message{

display:none;

padding:13px 18px;

border-radius:12px;

margin-bottom:18px;

text-align:center;

font-size:14px;

}

.success{

background:#E7F6ED;

color:#155724;

border:1px solid #C5E8D3;

}

.error{

background:#FBE7EA;

color:#721C24;

border:1px solid #EFC7CC;

}

/* ==============================
   MODAL
============================== */

.modal-overlay{

position:fixed;

inset:0;

background:rgba(0,0,0,.45);

display:none;

align-items:center;

justify-content:center;

padding:20px;

}

.modal-overlay.active{

display:flex;

}

.modal{

width:100%;

max-width:500px;

background:white;

border-radius:18px;

padding:22px;

}

.modal-header{

display:flex;

align-items:center;

margin-bottom:20px;

}

.modal-header h3{

font-size:20px;

}

.close-modal{

width:35px;

height:35px;

border:none;

border-radius:50%;

background:#F3F3F3;

font-size:20px;

cursor:pointer;

}

.form-group{

margin-bottom:15px;

}

.form-group label{

display:block;

font-size:13px;

font-weight:bold;

margin-bottom:7px;

}

.form-group input,
.form-group textarea{

width:100%;

padding:12px;

border:1px solid var(--border);

border-radius:10px;

outline:none;

}

.form-group textarea{

height:90px;

resize:none;

}

.form-group input:focus,
.form-group textarea:focus{

border-color:var(--orange);

}

.save-edit-btn{

padding:13px;

border:none;

border-radius:10px;

background:var(--orange);

color:white;

font-weight:bold;

font-size:14px;

cursor:pointer;

}

.save-edit-btn:disabled{

opacity:.6;

cursor:not-allowed;

}

</style>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
query,
where,
doc,
getDoc,
updateDoc,
deleteDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);


/* ==============================
   ELEMENTS
============================== */

const productsContainer =
document.getElementById(
"productsContainer"
);

const productCount =
document.getElementById(
"productCount"
);

const searchInput =
document.getElementById(
"searchInput"
);

const storeNameElement =
document.getElementById(
"storeName"
);

const ownerEmailElement =
document.getElementById(
"ownerEmail"
);

const editModal =
document.getElementById(
"editModal"
);

const closeModal =
document.getElementById(
"closeModal"
);

const saveEditBtn =
document.getElementById(
"saveEditBtn"
);


/* ==============================
   VARIABLES
============================== */

let currentOwnerUid = "";

let currentOwnerEmail = "";

let currentStoreId = "";

let currentStoreName = "G-Glam";

let allProducts = [];

let editingProductId = "";


/* ==============================
   ESCAPE HTML
============================== */

function escapeHtml(value){

return String(value ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* ==============================
   SHOW MESSAGE
============================== */

function showSuccess(message){

const element =
document.getElementById(
"successMessage"
);

element.textContent =
message;

element.style.display =
"block";

document.getElementById(
"errorMessage"
).style.display =
"none";

setTimeout(()=>{

element.style.display =
"none";

},3000);

}


function showError(message){

const element =
document.getElementById(
"errorMessage"
);

element.textContent =
message;

element.style.display =
"block";

document.getElementById(
"successMessage"
).style.display =
"none";

}


/* ==============================
   STORE
============================== */

async function loadStore(){

    try{

        const user = auth.currentUser;

        if(!user){

            window.location.href = "login.html";
            return;

        }

        // UID صاحب المتجر
        currentOwnerUid = user.uid;

        // البريد من Firebase Authentication
        currentOwnerEmail = user.email || "";

        ownerEmailElement.textContent =
            currentOwnerEmail || "غير متوفر";

        /*
        ==========================================
        قراءة متجر صاحب الحساب
        stores/{UID}
        ==========================================
        */

        const storeRef = doc(
            db,
            "stores",
            currentOwnerUid
        );

        const storeSnapshot =
            await getDoc(storeRef);

        if(!storeSnapshot.exists()){

            console.error(
                "STORE NOT FOUND:",
                currentOwnerUid
            );

            storeNameElement.textContent =
                "لم يتم العثور على المتجر";

            showError(
                "⚠️ لم يتم العثور على بيانات متجرك في Firebase."
            );

            return;
        }

        const store =
            storeSnapshot.data();

        currentStoreId =
            storeSnapshot.id;

        /*
        ==========================================
        معلومات المتجر
        ==========================================
        */

        currentStoreName =
            store.storeName ||
            store.name ||
            store.shopName ||
            "G-Glam";

        currentOwnerEmail =
            store.ownerEmail ||
            store.email ||
            user.email ||
            "";

        /*
        ==========================================
        عرض المعلومات
        ==========================================
        */

        storeNameElement.textContent =
            currentStoreName;

        ownerEmailElement.textContent =
            currentOwnerEmail;

        /*
        ==========================================
        التحقق من حالة المتجر
        ==========================================
        */

        const status =
            String(
                store.status || "approved"
            )
            .toLowerCase()
            .trim();

        if(
            status === "rejected" ||
            status === "refused"
        ){

            showError(
                "❌ هذا المتجر مرفوض من الإدارة."
            );

            return;
        }

        if(
            status === "pending" ||
            status === "waiting" ||
            status === "review"
        ){

            showError(
                "⏳ متجرك مازال قيد المراجعة."
            );

            return;
        }

        /*
        ==========================================
        تحميل منتجات صاحب المتجر
        ==========================================
        */

        await loadProducts();

    }catch(error){

        console.error(
            "LOAD STORE ERROR:",
            error
        );

        storeNameElement.textContent =
            "G-Glam";

        ownerEmailElement.textContent =
            currentOwnerEmail || "غير متوفر";

        showError(
            "❌ حدث خطأ أثناء تحميل معلومات المتجر: " +
            error.message
        );

    }

}

if(!auth.currentUser){

window.location.href =
"login.html";

return;

}

currentOwnerUid =
auth.currentUser.uid;

currentOwnerEmail =
auth.currentUser.email || "";

ownerEmailElement.textContent =
currentOwnerEmail;


/* ==============================
   STORES/{UID}
============================== */

const storeRef =
doc(
db,
"stores",
currentOwnerUid
);

const storeSnapshot =
await getDoc(storeRef);

if(!storeSnapshot.exists()){

alert(
"⚠️ لم يتم العثور على متجر مرتبط بهذا الحساب."
);

await signOut(auth);

window.location.href =
"login.html";

return;

}

const store =
storeSnapshot.data();

currentStoreId =
storeSnapshot.id;


/* ==============================
   STORE STATUS
============================== */

const status =
String(
store.status || "pending"
)
.toLowerCase()
.trim();

if(
status !== "approved" &&
status !== "active"
){

alert(
"⚠️ متجرك غير مفعل حاليًا."
);

await signOut(auth);

window.location.href =
"login.html";

return;

}


/* ==============================
   STORE INFO
============================== */

currentStoreName =
store.storeName ||
store.name ||
"G-Glam";

currentOwnerEmail =
store.ownerEmail ||
store.email ||
auth.currentUser.email ||
"";

storeNameElement.textContent =
currentStoreName;

ownerEmailElement.textContent =
currentOwnerEmail;


/* ==============================
   LOAD PRODUCTS
============================== */

await loadProducts();

}


/* ==============================
   LOAD PRODUCTS
============================== */

async function loadProducts(){

productsContainer.innerHTML = `

<div class="loading">

⏳ جاري تحميل المنتجات...

</div>

`;

try{

/*
   المنتجات التي أضافها
   صاحب المتجر الحالي فقط
*/

const productsQuery =
query(

collection(
db,
"products"
),

where(
"ownerUid",
"==",
currentOwnerUid
)

);

const snapshot =
await getDocs(
productsQuery
);

allProducts = [];

snapshot.forEach(
productDoc=>{

allProducts.push({

id:productDoc.id,

...productDoc.data()

});

});


renderProducts(
allProducts
);

}catch(error){

console.error(
"LOAD PRODUCTS ERROR:",
error
);

productsContainer.innerHTML = `

<div class="empty">

<div class="empty-icon">
❌
</div>

تعذر تحميل المنتجات.

<br>

${escapeHtml(error.message)}

</div>

`;

}

}


/* ==============================
   RENDER PRODUCTS
============================== */

function renderProducts(products){

productCount.textContent =
products.length + " منتج";

productsContainer.innerHTML = "";

if(!products.length){

productsContainer.innerHTML = `

<div class="empty">

<div class="empty-icon">
🛍️
</div>

لا توجد منتجات في متجرك حاليًا.

<br>

أضف أول منتج إلى متجرك.

<br>

<a href="add-product.html">

➕ إضافة منتج

</a>

</div>

`;

return;

}

products.forEach(
product=>{

const image =
product.image ||
(
Array.isArray(product.images) &&
product.images.length
?
product.images[0]
:
""
);

const imagesCount =
Array.isArray(product.images)
?
product.images.length
:
(image ? 1 : 0);

const stock =
Number(
product.stock || 0
);

let stockClass = "";

if(stock === 0){

stockClass =
"out";

}else if(stock <= 5){

stockClass =
"low";

}

const card =
document.createElement(
"div"
);

card.className =
"product-card";

card.innerHTML = `

<div class="product-image">

${
image
?
`<img
src="${escapeHtml(image)}"
alt="${escapeHtml(product.name)}"
loading="lazy">`
:
`<div style="
height:100%;
display:flex;
align-items:center;
justify-content:center;
font-size:45px;
color:#aaa;
">
🛍️
</div>`
}

${
imagesCount > 1
?
`<div class="image-count">
📷 ${imagesCount}
</div>`
:
""
}

</div>

<div class="product-info">

<div class="product-name">

${escapeHtml(
product.name || "منتج بدون اسم"
)}

</div>

<div class="product-description">

${escapeHtml(
product.description ||
"لا يوجد وصف للمنتج."
)}

</div>

<div class="product-bottom">

<div class="product-price">

${Number(
product.price || 0
)} DA

</div>

<div class="stock ${stockClass}">

المخزون: ${stock}

</div>

</div>

<div class="card-actions">

<button
class="edit-btn"
data-id="${escapeHtml(product.id)}">

✏️ تعديل

</button>

<button
class="delete-btn"
data-id="${escapeHtml(product.id)}">

🗑️ حذف

</button>

</div>

</div>

`;

card
.querySelector(".edit-btn")
.addEventListener(
"click",
()=>openEditModal(product)
);

card
.querySelector(".delete-btn")
.addEventListener(
"click",
()=>deleteProduct(product.id)
);

productsContainer.appendChild(
card
);

});

}


/* ==============================
   SEARCH
============================== */

searchInput.addEventListener(
"input",
function(){

const keyword =
this.value
.toLowerCase()
.trim();

if(!keyword){

renderProducts(
allProducts
);

return;

}

const filtered =
allProducts.filter(
product=>

(
product.name || ""
)
.toLowerCase()
.includes(keyword)

);

renderProducts(
filtered
);

});


/* ==============================
   EDIT MODAL
============================== */

function openEditModal(product){

editingProductId =
product.id;

document.getElementById(
"editName"
).value =
product.name || "";

document.getElementById(
"editPrice"
).value =
product.price || 0;

document.getElementById(
"editDescription"
).value =
product.description || "";

document.getElementById(
"editStock"
).value =
product.stock || 0;

editModal.classList.add(
"active"
);

}


/* ==============================
   CLOSE MODAL
============================== */

closeModal.addEventListener(
"click",
()=>{

editModal.classList.remove(
"active"
);

});

editModal.addEventListener(
"click",
event=>{

if(
event.target === editModal
){

editModal.classList.remove(
"active"
);

}

});


/* ==============================
   SAVE EDIT
============================== */

saveEditBtn.addEventListener(
"click",
async function(){

if(!editingProductId){

return;

}

const name =
document.getElementById(
"editName"
).value.trim();

const price =
Number(
document.getElementById(
"editPrice"
).value
);

const description =
document.getElementById(
"editDescription"
).value.trim();

const stock =
Number(
document.getElementById(
"editStock"
).value
);

if(!name){

showError(
"يرجى إدخال اسم المنتج."
);

return;

}

if(price < 0){

showError(
"السعر غير صحيح."
);

return;

}

if(stock < 0){

showError(
"المخزون غير صحيح."
);

return;

}

saveEditBtn.disabled =
true;

saveEditBtn.textContent =
"⏳ جاري الحفظ...";

try{

await updateDoc(

doc(
db,
"products",
editingProductId
),

{

name:name,

price:price,

description:description,

stock:stock,

updatedAt:
serverTimestamp()

}

);

editModal.classList.remove(
"active"
);

showSuccess(
"✅ تم تعديل المنتج بنجاح."
);

await loadProducts();

}catch(error){

console.error(
"SAVE EDIT ERROR:",
error
);

showError(
"❌ تعذر تعديل المنتج: " +
error.message
);

}finally{

saveEditBtn.disabled =
false;

saveEditBtn.textContent =
"💾 حفظ التعديل";

}

});


/* ==============================
   DELETE PRODUCT
============================== */

async function deleteProduct(
productId
){

const product =
allProducts.find(
item =>
item.id === productId
);

if(!product){

return;

}

const confirmed =
confirm(

"هل أنت متأكد من حذف المنتج؟\n\n" +

(product.name || "هذا المنتج") +

"\n\nلا يمكن التراجع عن هذه العملية."

);

if(!confirmed){

return;

}

try{

await deleteDoc(

doc(
db,
"products",
productId
)

);

showSuccess(
"🗑️ تم حذف المنتج بنجاح."
);

await loadProducts();

}catch(error){

console.error(
"DELETE PRODUCT ERROR:",
error
);

showError(
"❌ تعذر حذف المنتج: " +
error.message
);

}


/* ==============================
   LOGOUT
============================== */

document
.getElementById(
"logoutBtn"
)
.addEventListener(
"click",
async function(event){

event.preventDefault();

if(!confirm(
"هل تريد تسجيل الخروج؟"
)){

return;

}

try{

await signOut(auth);

window.location.href =
"login.html";

}catch(error){

console.error(error);

showError(
"❌ تعذر تسجيل الخروج."
);

}

});


/* ==============================
   AUTH
============================== */

onAuthStateChanged(
auth,
async function(user){

if(!user){

window.location.href =
"login.html";

return;

}

currentOwnerUid =
user.uid;

currentOwnerEmail =
user.email || "";

try{

await loadStore();

}catch(error){

console.error(
"AUTH/STORE ERROR:",
error
);

showError(
"❌ حدث خطأ أثناء تحميل المتجر: " +
error.message
);

}

});

</script>
