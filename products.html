<style>

/* =====================================================
   ROOT
===================================================== */

:root{

--orange:#F47B20;
--orange-dark:#DF6810;

--orange-light:#FFF1E6;
--orange-border:#FFE0CA;

--bg:#F7F7F7;
--card:#FFFFFF;

--dark:#222222;
--dark-2:#333333;

--text:#333333;
--muted:#888888;

--border:#E9E9E9;

--success:#198754;
--success-bg:#E5F5EC;

--danger:#DC3545;
--danger-bg:#FBE7EA;

--sidebar:#EEEEEE;

--shadow:0 4px 18px rgba(0,0,0,.06);

}

/* =====================================================
   RESET
===================================================== */

*{

box-sizing:border-box;

margin:0;
padding:0;

font-family:"Tajawal",Arial,sans-serif;

}

html{

scroll-behavior:smooth;

}

body{

background:var(--bg);

color:var(--text);

min-height:100vh;

}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

position:fixed;

right:0;
top:0;

height:100vh;

width:78px;

background:var(--sidebar);

color:#444;

overflow:hidden;

transition:.3s ease;

z-index:1100;

box-shadow:-3px 0 15px rgba(0,0,0,.04);

border-left:1px solid #E3E3E3;

}

.sidebar:hover{

width:240px;

}

/* =====================================================
   LOGO
===================================================== */

.logo{

height:82px;

display:flex;

align-items:center;

justify-content:center;

border-bottom:1px solid #DCDCDC;

white-space:nowrap;

padding:8px;

background:#EEEEEE;

}

.logo img{

width:58px;

height:58px;

object-fit:contain;

display:block;

transition:.3s ease;

}

.sidebar:hover .logo img{

width:145px;

height:62px;

}

/* =====================================================
   MENU
===================================================== */

.menu{

margin-top:18px;

padding:0 10px;

}

.menu a{

display:flex;

align-items:center;

gap:15px;

height:52px;

padding:0 10px;

margin-bottom:7px;

border-radius:12px;

color:#555;

text-decoration:none;

white-space:nowrap;

transition:.2s ease;

}

.menu a:hover{

background:#E2E2E2;

color:#222;

}

.menu a.active{

background:var(--orange);

color:#FFFFFF;

box-shadow:
0 5px 15px rgba(244,123,32,.22);

}

.icon{

min-width:35px;

width:35px;

height:35px;

display:flex;

align-items:center;

justify-content:center;

text-align:center;

font-size:20px;

}

.menu a:not(.active) .icon{

filter:saturate(.8);

}

.text{

opacity:0;

transition:.25s ease;

font-size:14px;

font-weight:700;

}

.sidebar:hover .text{

opacity:1;

}

/* =====================================================
   TOP BAR
===================================================== */

.topbar{

position:fixed;

top:0;

right:78px;

left:0;

height:82px;

background:#FFFFFF;

border-bottom:1px solid var(--border);

display:flex;

align-items:center;

justify-content:space-between;

padding:0 25px;

z-index:1000;

box-shadow:0 2px 12px rgba(0,0,0,.04);

transition:.3s ease;

}

/* =====================================================
   STORE TOP
===================================================== */

.store-top{

display:flex;

align-items:center;

gap:13px;

min-width:0;

}

/* =====================================================
   STORE IMAGE
===================================================== */

.store-image{

width:52px;

height:52px;

border-radius:50%;

object-fit:cover;

background:#F4F4F4;

border:2px solid var(--orange);

padding:2px;

flex-shrink:0;

box-shadow:

0 3px 10px rgba(244,123,32,.15);

transition:.25s ease;

}

.store-image:hover{

transform:scale(1.05);

}

/* =====================================================
   STORE DETAILS
===================================================== */

.store-details{

display:flex;

flex-direction:column;

justify-content:center;

min-width:0;

}

.store-label{

font-size:11px;

color:#999;

margin-bottom:2px;

}

.store-top-name{

font-size:17px;

font-weight:800;

color:#222;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

max-width:280px;

}

/* =====================================================
   VIEW STORE
===================================================== */

.view-store-btn{

display:flex;

align-items:center;

justify-content:center;

gap:7px;

background:var(--orange-light);

color:var(--orange-dark);

text-decoration:none;

padding:10px 16px;

border-radius:11px;

font-size:13px;

font-weight:700;

transition:.2s ease;

white-space:nowrap;

border:1px solid var(--orange-border);

}

.view-store-btn:hover{

background:var(--orange);

color:#FFFFFF;

box-shadow:
0 5px 12px rgba(244,123,32,.18);

}

/* =====================================================
   CONTENT
===================================================== */

.content{

margin-right:78px;

padding:107px 25px 25px;

transition:.3s ease;

max-width:1600px;

}

/* =====================================================
   MESSAGES
===================================================== */

.message{

display:none;

padding:14px 18px;

border-radius:12px;

margin-bottom:18px;

text-align:center;

font-size:14px;

font-weight:600;

}

.success{

background:var(--success-bg);

color:#155724;

border:1px solid #C5E8D3;

}

.error{

background:var(--danger-bg);

color:#721C24;

border:1px solid #EFC7CC;

}

/* =====================================================
   STATISTICS
===================================================== */

.stats{

display:grid;

grid-template-columns:
repeat(3,minmax(0,1fr));

gap:14px;

margin-bottom:18px;

}

.stat{

background:#FFFFFF;

border:1px solid var(--border);

border-radius:16px;

padding:18px 20px;

box-shadow:var(--shadow);

position:relative;

overflow:hidden;

min-height:112px;

display:flex;

flex-direction:column;

justify-content:center;

}

.stat::after{

content:"";

position:absolute;

bottom:0;

right:0;

height:3px;

width:100%;

background:var(--orange);

opacity:.8;

}

.stat-title{

color:var(--muted);

font-size:13px;

margin-bottom:8px;

display:flex;

align-items:center;

gap:8px;

font-weight:600;

}

.stat-title:first-letter{

color:var(--orange);

}

.stat-value{

font-size:28px;

font-weight:800;

color:var(--dark);

line-height:1.1;

}

/* =====================================================
   ACTIONS
===================================================== */

.actions{

display:grid;

grid-template-columns:
repeat(2,minmax(0,1fr));

gap:14px;

margin-bottom:18px;

}

.action{

background:#FFFFFF;

border:1px solid var(--border);

border-radius:16px;

padding:18px 20px;

text-align:right;

cursor:pointer;

box-shadow:var(--shadow);

transition:.25s ease;

position:relative;

overflow:hidden;

font-family:"Tajawal",Arial,sans-serif;

}

.action::before{

content:"";

position:absolute;

right:0;

top:0;

width:4px;

height:100%;

background:var(--orange);

transform:scaleY(0);

transition:.25s ease;

}

.action:hover{

transform:translateY(-2px);

box-shadow:
0 8px 22px rgba(0,0,0,.08);

}

.action:hover::before{

transform:scaleY(1);

}

.action h3{

font-size:17px;

color:var(--dark);

margin-bottom:6px;

}

.action h3:first-letter{

color:var(--orange);

}

.action p{

color:var(--muted);

font-size:13px;

}

/* =====================================================
   SECTION
===================================================== */

.section{

background:#FFFFFF;

border:1px solid var(--border);

padding:18px;

border-radius:16px;

box-shadow:var(--shadow);

margin-bottom:18px;

}

.section-header{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:16px;

}

.section-header h2{

font-size:19px;

color:var(--dark);

}

/* =====================================================
   ADD BUTTON
===================================================== */

.add-btn{

background:var(--orange);

color:#FFFFFF;

border:none;

padding:10px 16px;

border-radius:10px;

cursor:pointer;

font-size:13px;

font-weight:700;

transition:.2s ease;

box-shadow:
0 4px 10px rgba(244,123,32,.18);

font-family:"Tajawal",Arial,sans-serif;

}

.add-btn:hover{

background:var(--orange-dark);

transform:translateY(-1px);

}

/* =====================================================
   PRODUCTS
===================================================== */

.products{

display:grid;

grid-template-columns:
repeat(4,minmax(0,1fr));

gap:11px;

}

/* =====================================================
   PRODUCT
===================================================== */

.product{

background:#FFFFFF;

border:1px solid var(--border);

border-radius:14px;

padding:8px;

transition:.25s ease;

overflow:hidden;

}

.product:hover{

transform:translateY(-3px);

box-shadow:
0 8px 22px rgba(0,0,0,.08);

}

/* =====================================================
   PRODUCT IMAGE
===================================================== */

.product img{

width:100%;

height:180px;

object-fit:cover;

border-radius:10px;

background:#F2F2F2;

display:block;

}

/* =====================================================
   PRODUCT NAME
===================================================== */

.product h3{

font-size:15px;

margin:10px 5px 6px;

color:var(--dark);

line-height:1.4;

}

/* =====================================================
   PRODUCT PRICE
===================================================== */

.product-price{

font-size:15px;

font-weight:800;

color:var(--orange);

margin:0 5px 6px;

}

/* =====================================================
   PRODUCT STOCK
===================================================== */

.product-stock{

font-size:12px;

color:var(--muted);

margin:0 5px 9px;

}

/* =====================================================
   PRODUCT BUTTONS
===================================================== */

.product-buttons{

display:flex;

gap:6px;

}

.product-buttons button{

flex:1;

padding:9px 4px;

border:none;

border-radius:8px;

cursor:pointer;

font-size:12px;

font-weight:700;

transition:.2s ease;

font-family:"Tajawal",Arial,sans-serif;

}

.edit-btn{

background:#FFF1E6;

color:var(--orange-dark);

}

.edit-btn:hover{

background:#FFE2CC;

}

.delete-btn{

background:var(--danger-bg);

color:#B52B39;

}

.delete-btn:hover{

background:#F6D1D6;

}

/* =====================================================
   EMPTY
===================================================== */

.empty{

background:#FAFAFA;

border:1px dashed #DDD;

padding:35px 18px;

text-align:center;

color:var(--muted);

border-radius:13px;

grid-column:1/-1;

line-height:1.8;

font-size:14px;

}

}

}

.stat-title{

}

}

.actions{

}

.action{

}

.action h3{

}

.action p{

}

.section{

padding:13px;

border-radius:14px;

}

.section-header{

margin-bottom:12px;

}

.section-header h2{

font-size:16px;

}

.add-btn{

}

.products{

repeat(2,minmax(0,1fr));

}

.product{

}

/* =====================================================

===================================================== */

@media(max-width:380px){

}

}

/* =====================================================

===================================================== */

::-webkit-scrollbar{

}

</style>

<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
collection,
getDocs,
query,
where,
deleteDoc,
doc,
getDoc

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


import {

getAuth,
onAuthStateChanged,
signOut

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);


/* =====================================================
   ELEMENTS
===================================================== */

const storeNameStat =
document.getElementById("storeNameStat");

const productsCount =
document.getElementById("productsCount");

const ordersCount =
document.getElementById("ordersCount");

const productsContainer =
document.getElementById("productsContainer");

const topStoreName =
document.getElementById("topStoreName");

const topStoreImage =
document.getElementById("topStoreImage");

const viewStoreBtn =
document.getElementById("viewStoreBtn");


/* =====================================================
   VARIABLES
===================================================== */

let currentOwnerEmail = "";

let currentOwnerUid = "";

let currentStoreId = "";

let currentStoreName = "G-Glam";

let currentStore = null;


/* =====================================================
   LOAD STORE BY UID
===================================================== */

async function loadStore(){

try{

const user =
auth.currentUser;


if(!user){

window.location.href =
"login.html";

return false;

}


/* =====================================================
   AUTH UID
===================================================== */

currentOwnerUid =
user.uid;


/* =====================================================
   EMAIL
===================================================== */

currentOwnerEmail =
user.email || "";


/* =====================================================
   FIRST METHOD
   stores/{UID}
===================================================== */

let storeSnapshot =

await getDoc(

doc(
db,
"stores",
currentOwnerUid
)

);


/* =====================================================
   SECOND METHOD
   ownerUid == UID
===================================================== */

if(!storeSnapshot.exists()){

console.log(
"Store document ID is not UID. Searching ownerUid..."
);


const ownerQuery =
query(

collection(
db,
"stores"
),

where(
"ownerUid",
"==",
currentOwnerUid
)

);


const ownerSnapshot =
await getDocs(
ownerQuery
);


if(!ownerSnapshot.empty){

storeSnapshot =
ownerSnapshot.docs[0];

}

}


/* =====================================================
   THIRD METHOD
   ownerEmail == EMAIL
===================================================== */

if(!storeSnapshot.exists()){

console.log(
"Searching store by ownerEmail..."
);


if(currentOwnerEmail){

const emailQuery =
query(

collection(
db,
"stores"
),

where(
"ownerEmail",
"==",
currentOwnerEmail
)

);


const emailSnapshot =
await getDocs(
emailQuery
);


if(!emailSnapshot.empty){

storeSnapshot =
emailSnapshot.docs[0];

}

}

}


/* =====================================================
   STORE NOT FOUND
===================================================== */

if(!storeSnapshot.exists()){

alert(

"⚠️ لم يتم العثور على متجر مرتبط بهذا الحساب.\n\n" +

"UID:\n" +

currentOwnerUid

);


await signOut(auth);

window.location.href =
"login.html";

return false;

}


/* =====================================================
   STORE DATA
===================================================== */

currentStore =
storeSnapshot.data();

currentStoreId =
storeSnapshot.id;


/* =====================================================
   STORE STATUS
===================================================== */

const status =

String(
currentStore.status ||
"pending"
)

.toLowerCase()
.trim();


/* =====================================================
   PENDING
===================================================== */

if(

status === "pending" ||

status === "waiting" ||

status === "review"

){

alert(
"⏳ طلب إنشاء متجرك مازال قيد المراجعة من طرف الإدارة."
);

await signOut(auth);

window.location.href =
"login.html";

return false;

}


/* =====================================================
   REJECTED
===================================================== */

if(

status === "rejected" ||

status === "refused"

){

const reason =

currentStore.rejectionReason ||

"لم يتم ذكر سبب الرفض.";


alert(

"❌ تم رفض طلب إنشاء المتجر.\n\n" +

"سبب الرفض:\n" +

reason

);


await signOut(auth);

window.location.href =
"login.html";

return false;

}


/* =====================================================
   CHECK APPROVAL
===================================================== */

if(

status !== "active" &&

status !== "approved"

){

alert(
"⚠️ لا يمكنك الدخول إلى لوحة التحكم حاليًا."
);

await signOut(auth);

window.location.href =
"login.html";

return false;

}


/* =====================================================
   STORE NAME
===================================================== */

currentStoreName =

currentStore.storeName ||

currentStore.name ||

"G-Glam";


/* =====================================================
   OWNER EMAIL
===================================================== */

currentOwnerEmail =

currentStore.ownerEmail ||

currentStore.email ||

user.email ||

"";


/* =====================================================
   STORE IMAGE
===================================================== */

const storeImage =

currentStore.storeImage ||

currentStore.image ||

currentStore.logo ||

currentStore.photoURL ||

"";


/* =====================================================
   DISPLAY STORE IMAGE
===================================================== */

if(storeImage){

topStoreImage.src =
storeImage;

}else{

topStoreImage.src =
"logotrans.png";

}


/* =====================================================
   DISPLAY STORE
===================================================== */

storeNameStat.textContent =
currentStoreName;

topStoreName.textContent =
currentStoreName;


/* =====================================================
   STORE URL
===================================================== */

viewStoreBtn.href =

"index.html?store=" +

encodeURIComponent(
currentOwnerUid
);


/* =====================================================
   LOCAL STORAGE
===================================================== */

localStorage.setItem(
"storeId",
currentOwnerUid
);

localStorage.setItem(
"storeDocumentId",
currentStoreId
);

localStorage.setItem(
"storeName",
currentStoreName
);

localStorage.setItem(
"storeOwnerEmail",
currentOwnerEmail
);

localStorage.setItem(
"ownerEmail",
currentOwnerEmail
);

localStorage.setItem(
"ownerUid",
currentOwnerUid
);

localStorage.setItem(
"paymentStatus",
"approved"
);


/* =====================================================
   LOAD PRODUCTS
===================================================== */

await loadProducts();


/* =====================================================
   LOAD ORDERS
===================================================== */

await loadOrders();


return true;


}catch(error){

console.error(
"LOAD STORE ERROR:",
error
);


alert(

"❌ حدث خطأ أثناء تحميل بيانات المتجر.\n\n" +

error.message

);

return false;

}

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

try{

let snapshot;


/* =====================================================
   OWNER UID
===================================================== */

try{

const q =
query(

collection(
db,
"products"
),

where(
"ownerUid",
"==",
currentOwnerUid
)

);

snapshot =
await getDocs(q);

}catch(error){

console.log(
"ownerUid products query failed:",
error
);


/* =====================================================
   STORE ID
===================================================== */

try{

const q2 =
query(

collection(
db,
"products"
),

where(
"storeId",
"==",
currentOwnerUid
)

);

snapshot =
await getDocs(q2);

}catch(error2){

console.log(
"storeId products query failed:",
error2
);


/* =====================================================
   OLD OWNER EMAIL
===================================================== */

const q3 =
query(

collection(
db,
"products"
),

where(
"ownerEmail",
"==",
currentOwnerEmail
)

);

snapshot =
await getDocs(q3);

}

}


/* =====================================================
   COUNT
===================================================== */

productsCount.textContent =
snapshot.size;


/* =====================================================
   CLEAR
===================================================== */

productsContainer.innerHTML =
"";


/* =====================================================
   EMPTY
===================================================== */

if(snapshot.empty){

productsContainer.innerHTML = `

<div class="empty">

لا توجد منتجات حاليًا.

<br><br>

<button
class="add-btn"
onclick="goAddProduct()">

➕ إضافة أول منتج

</button>

</div>

`;

return;

}


/* =====================================================
   PRODUCTS
===================================================== */

snapshot.forEach(

productDoc => {

const product =
productDoc.data();

const id =
productDoc.id;

const card =
document.createElement("div");

card.className =
"product";


const image =

product.image ||

(

Array.isArray(product.images) &&

product.images.length

?

product.images[0]

:

"logotrans.png"

);


card.innerHTML = `

<img

src="${escapeHtml(image)}"

alt="${escapeHtml(
product.name || "منتج"
)}"

onerror="this.src='logotrans.png';"

>


<h3>

${escapeHtml(
product.name ||
"بدون اسم"
)}

</h3>


<div class="product-price">

${Number(
product.price || 0
)} DA

</div>


<div class="product-stock">

المخزون:

${Number(
product.stock || 0
)}

</div>


<div class="product-buttons">


<button
class="edit-btn">

✏️ تعديل

</button>


<button
class="delete-btn">

🗑️ حذف

</button>


</div>

`;


/* =====================================================
   EDIT
===================================================== */

card
.querySelector(".edit-btn")
.addEventListener(
"click",
function(){

window.location.href =

"edit-product.html?id=" +

encodeURIComponent(id);

}
);


/* =====================================================
   DELETE
===================================================== */

card
.querySelector(".delete-btn")
.addEventListener(
"click",
function(){

deleteProduct(id);

}
);


productsContainer.appendChild(card);

});


}catch(error){

console.error(
"PRODUCTS ERROR:",
error
);


productsContainer.innerHTML = `

<div class="empty">

❌ حدث خطأ أثناء تحميل المنتجات.

<br><br>

${escapeHtml(
error.message || ""
)}

</div>

`;

}

}


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

try{

let snapshot;


/* =====================================================
   OWNER UID
===================================================== */

try{

const q =
query(

collection(
db,
"orders"
),

where(
"ownerUid",
"==",
currentOwnerUid
)

);

snapshot =
await getDocs(q);

}catch(error){

console.log(
"ownerUid orders query failed:",
error
);


/* =====================================================
   STORE ID
===================================================== */

try{

const q2 =
query(

collection(
db,
"orders"
),

where(
"storeId",
"==",
currentOwnerUid
)

);

snapshot =
await getDocs(q2);

}catch(error2){

/* =====================================================
   OWNER EMAIL
===================================================== */

const q3 =
query(

collection(
db,
"orders"
),

where(
"ownerEmail",
"==",
currentOwnerEmail
)

);

snapshot =
await getDocs(q3);

}

}


ordersCount.textContent =
snapshot.size;


}catch(error){

console.error(
"ORDERS ERROR:",
error
);

ordersCount.textContent =
"0";

}

}


/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(id){

const ok =
confirm(
"هل تريد حذف هذا المنتج؟"
);


if(!ok){

return;

}


try{

await deleteDoc(

doc(
db,
"products",
id
)

);


showSuccess(
"تم حذف المنتج بنجاح ✅"
);


await loadProducts();


}catch(error){

console.error(
"DELETE PRODUCT ERROR:",
error
);


showError(
"❌ حدث خطأ أثناء حذف المنتج."
);

}

}


/* =====================================================
   NAVIGATION
===================================================== */

window.goAddProduct =
function(){

window.location.href =
"add-product.html";

};


window.goOrders =
function(){

window.location.href =
"orders.html";

};


/* =====================================================
   LOGOUT
===================================================== */

document
.getElementById("logoutBtn")
.addEventListener(
"click",
async function(event){

event.preventDefault();


const ok =
confirm(
"هل تريد تسجيل الخروج؟"
);


if(!ok){

return;

}


try{

await signOut(auth);


/* =====================================================
   CLEAR STORAGE
===================================================== */

localStorage.removeItem(
"storeId"
);

localStorage.removeItem(
"storeDocumentId"
);

localStorage.removeItem(
"ownerUid"
);

localStorage.removeItem(
"ownerEmail"
);

localStorage.removeItem(
"storeOwnerEmail"
);

localStorage.removeItem(
"storeName"
);

localStorage.removeItem(
"paymentStatus"
);


window.location.href =
"login.html";


}catch(error){

console.error(
"LOGOUT ERROR:",
error
);


showError(
"❌ تعذر تسجيل الخروج."
);

}

});


/* =====================================================
   SUCCESS
===================================================== */

function showSuccess(text){

const box =
document.getElementById(
"successMessage"
);


box.textContent =
text;


box.style.display =
"block";


setTimeout(
function(){

box.style.display =
"none";

},
3000
);

}


/* =====================================================
   ERROR
===================================================== */

function showError(text){

const box =
document.getElementById(
"errorMessage"
);


box.textContent =
text;


box.style.display =
"block";


setTimeout(
function(){

box.style.display =
"none";

},
4000
);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
   AUTHENTICATION
===================================================== */

onAuthStateChanged(

auth,

async function(user){

if(!user){

window.location.href =
"login.html";

return;

}


/* =====================================================
   UID
===================================================== */

currentOwnerUid =
user.uid;


/* =====================================================
   EMAIL
===================================================== */

currentOwnerEmail =
user.email || "";


/* =====================================================
   LOAD
===================================================== */

await loadStore();

});


/* =====================================================
   START
===================================================== */

console.log(
"G-Glam Store Dashboard Started"
);

</script>

</body>

</html>
