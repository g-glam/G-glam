<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1A1A1A">
    <title>G-Glam | إدارة المنتجات (Shopify Admin Style)</title>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        shopify: {
                            bg: '#F1F2F4',
                            darkBg: '#0F0F0F',
                            surface: '#FFFFFF',
                            darkSurface: '#1A1A1A',
                            border: '#E1E3E5',
                            darkBorder: '#2E2E2E',
                            green: '#008060',
                            greenLight: '#E3F1DF',
                            greenBadge: '#AEE9D1',
                            greenBadgeText: '#004B36',
                            topbar: '#1A1A1A',
                            text: '#303030',
                            subtext: '#616161',
                            hover: '#EDEEF0'
                        }
                    },
                    fontFamily: {
                        sans: ['Tajawal', 'Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbar & Shadows */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #D2D5D8;
            border-radius: 10px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #3A3A3A;
        }
        
        .shopify-shadow {
            box-shadow: 0px 1px 0px rgba(0, 0, 0, 0.05), 0px 2px 4px rgba(0, 0, 0, 0.05);
        }
        
        .shopify-card-shadow {
            box-shadow: 0 0 0 1px rgba(63, 63, 68, 0.05), 0 1px 3px 0 rgba(63, 63, 68, 0.15);
        }
        .dark .shopify-card-shadow {
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 1px 3px 0 rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

<body class="bg-shopify-bg dark:bg-shopify-darkBg text-shopify-text dark:text-gray-100 font-sans antialiased min-h-screen flex flex-col transition-colors duration-200">

    <!-- =====================================================
         TOPBAR (SHOPIFY MODERN BLACK TOP HEADER)
    ===================================================== -->
    <header class="h-14 bg-shopify-topbar text-white px-4 flex items-center justify-between sticky top-0 z-50 shadow-md">
        <!-- Right side: Logo & Search Bar -->
        <div class="flex items-center gap-4 flex-1 max-w-2xl">
            <div class="flex items-center gap-2 font-bold text-lg tracking-tight pl-2 border-l border-gray-700">
                <div class="w-7 h-7 rounded-lg bg-emerald-600 text-white font-black flex items-center justify-center text-sm shadow-sm">
                    G
                </div>
                <span class="hidden sm:inline">G-Glam</span>
            </div>
            
            <!-- Global Search Box -->
            <div class="relative flex-1 max-w-md">
                <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </div>
                <input type="text" id="searchInput" placeholder="بحث في المنتجات (Ctrl K)" 
                    class="w-full bg-[#2A2A2A] text-gray-200 text-xs rounded-lg pr-9 pl-12 py-1.5 border border-transparent focus:border-gray-500 focus:outline-none transition-all placeholder-gray-400">
                <div class="absolute inset-y-0 left-0 pl-2 flex items-center pointer-events-none">
                    <span class="text-[10px] bg-[#383838] text-gray-300 px-1.5 py-0.5 rounded border border-gray-600">Ctrl K</span>
                </div>
            </div>
        </div>

        <!-- Left Side Actions -->
        <div class="flex items-center gap-2">
            <!-- Theme Toggle -->
            <button type="button" id="themeBtn" title="تغيير المظهر"
                class="w-9 h-9 rounded-lg hover:bg-[#2A2A2A] flex items-center justify-center text-gray-300 hover:text-white transition-colors">
                <i class="fa-solid fa-moon"></i>
            </button>

            <!-- Store Profile Badge -->
            <a href="#" id="viewStoreBtn" target="_blank" title="عرض المتجر" class="flex items-center gap-2 pl-2 border-r border-gray-700 mr-1 p-1 rounded-lg hover:bg-[#2A2A2A] transition-colors cursor-pointer">
                <img class="w-7 h-7 rounded-full object-cover border border-gray-600 bg-gray-800" id="topStoreImage" src="logotrans.png" alt="صورة المتجر">
                <div class="hidden md:flex flex-col text-right">
                    <span id="topStoreName" class="text-xs font-bold leading-tight text-gray-200 truncate max-w-[120px]">جاري التحميل...</span>
                    <span class="text-[10px] text-gray-400 flex items-center gap-1">
                        <span>عرض المتجر</span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                    </span>
                </div>
            </a>
        </div>
    </header>


    <!-- =====================================================
         MAIN LAYOUT (SIDEBAR + MAIN CONTENT)
    ===================================================== -->
    <div class="flex flex-1">

        <!-- SIDEBAR -->
        <aside class="w-16 md:w-60 bg-shopify-surface dark:bg-shopify-darkSurface border-l border-shopify-border dark:border-shopify-darkBorder flex flex-col justify-between transition-all duration-200 shrink-0">
            <div class="p-2 space-y-1">
                <nav class="space-y-1">
                    <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-semibold text-shopify-subtext dark:text-gray-400 hover:bg-shopify-hover dark:hover:bg-[#262626] hover:text-shopify-text dark:hover:text-white transition-colors">
                        <i class="fa-solid fa-house text-base w-5 text-center"></i>
                        <span class="hidden md:inline">الرئيسية</span>
                    </a>

                    <a href="orders.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-semibold text-shopify-subtext dark:text-gray-400 hover:bg-shopify-hover dark:hover:bg-[#262626] hover:text-shopify-text dark:hover:text-white transition-colors">
                        <i class="fa-solid fa-clipboard-list text-base w-5 text-center"></i>
                        <span class="hidden md:inline">الطلبات</span>
                    </a>

                    <a href="products.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-semibold bg-shopify-hover dark:bg-[#262626] text-shopify-text dark:text-white">
                        <i class="fa-solid fa-tag text-base w-5 text-center text-gray-600 dark:text-gray-300"></i>
                        <span class="hidden md:inline">المنتجات</span>
                    </a>

                    <a href="add-product.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-semibold text-shopify-subtext dark:text-gray-400 hover:bg-shopify-hover dark:hover:bg-[#262626] hover:text-shopify-text dark:hover:text-white transition-colors">
                        <i class="fa-solid fa-circle-plus text-base w-5 text-center text-shopify-green"></i>
                        <span class="hidden md:inline">إضافة منتج</span>
                    </a>

                    <a href="delivery.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-semibold text-shopify-subtext dark:text-gray-400 hover:bg-shopify-hover dark:hover:bg-[#262626] hover:text-shopify-text dark:hover:text-white transition-colors">
                        <i class="fa-solid fa-truck text-base w-5 text-center"></i>
                        <span class="hidden md:inline">أسعار التوصيل</span>
                    </a>

                    <div class="pt-4 pb-1">
                        <div class="px-3 text-[10px] font-bold text-gray-400 uppercase tracking-wider hidden md:block">الإعدادات</div>
                    </div>

                    <a href="settings.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-semibold text-shopify-subtext dark:text-gray-400 hover:bg-shopify-hover dark:hover:bg-[#262626] hover:text-shopify-text dark:hover:text-white transition-colors">
                        <i class="fa-solid fa-gear text-base w-5 text-center"></i>
                        <span class="hidden md:inline">إعدادات المتجر</span>
                    </a>
                </nav>
            </div>

            <!-- Footer Sidebar Action: Logout -->
            <div class="p-2 border-t border-shopify-border dark:border-shopify-darkBorder">
                <a href="#" id="logoutBtn" class="flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-semibold text-red-600 hover:bg-red-50 dark:hover:bg-red-950/30 transition-colors">
                    <i class="fa-solid fa-right-from-bracket text-base w-5 text-center"></i>
                    <span class="hidden md:inline">تسجيل الخروج</span>
                </a>
            </div>
        </aside>


        <!-- MAIN CONTENT CONTAINER -->
        <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full space-y-6">

            <!-- HEADER BAR WITH ACTION BUTTONS -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div>
                    <h1 class="text-xl font-bold text-gray-900 dark:text-white">إدارة المنتجات</h1>
                    <p class="text-xs text-shopify-subtext dark:text-gray-400 mt-0.5">استعرض وعدل منتجات متجرك بكل سهولة</p>
                </div>
                <div class="flex items-center gap-2">
                    <button type="button" onclick="goAddProduct()" 
                        class="bg-[#303030] hover:bg-[#1A1A1A] dark:bg-white dark:hover:bg-gray-100 text-white dark:text-gray-900 text-xs font-semibold px-4 py-2 rounded-lg shopify-shadow flex items-center gap-2 transition-all">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span>إضافة منتج جديد</span>
                    </button>
                </div>
            </div>

            <!-- PRODUCTS SECTION -->
            <section class="bg-shopify-surface dark:bg-shopify-darkSurface border border-shopify-border dark:border-shopify-darkBorder rounded-xl shopify-card-shadow overflow-hidden">
                <div class="p-4 border-b border-shopify-border dark:border-shopify-darkBorder flex items-center justify-between">
                    <h2 class="text-sm font-bold text-gray-900 dark:text-white">قائمة المنتجات النشطة</h2>
                </div>

                <div id="productsContainer" class="divide-y divide-shopify-border dark:divide-shopify-darkBorder">
                    <div class="p-8 text-center text-shopify-subtext dark:text-gray-400">
                        <i class="fa-solid fa-spinner fa-spin text-xl mb-2 text-emerald-600"></i>
                        <p class="text-xs">جاري تحميل المنتجات...</p>
                    </div>
                </div>
            </section>

        </main>
    </div>


    <!-- =====================================================
         EDIT MODAL (SHOPIFY STYLE)
    ===================================================== -->
    <div class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4 backdrop-blur-xs" id="editModal">
        <div class="bg-shopify-surface dark:bg-shopify-darkSurface border border-shopify-border dark:border-shopify-darkBorder w-full max-w-3xl max-h-[90vh] overflow-y-auto rounded-2xl shopify-card-shadow p-6 space-y-5">
            
            <div class="flex items-center justify-between border-b border-shopify-border dark:border-shopify-darkBorder pb-4">
                <h2 class="text-base font-bold text-gray-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-emerald-600"></i>
                    تعديل بيانات المنتج
                </h2>
                <button type="button" id="closeModal" class="w-8 h-8 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-500 hover:text-red-500 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- PRODUCT NAME -->
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-gray-700 dark:text-gray-300">اسم المنتج *</label>
                <input id="editName" type="text" placeholder="اسم المنتج" 
                    class="w-full bg-gray-50 dark:bg-gray-900 border border-shopify-border dark:border-shopify-darkBorder rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-emerald-600">
            </div>

            <!-- SHORT DESCRIPTION -->
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-gray-700 dark:text-gray-300">وصف مختصر</label>
                <input id="editShortDescription" type="text" placeholder="اجعل الوصف المختصر واضحًا ومشجعًا للزبون." 
                    class="w-full bg-gray-50 dark:bg-gray-900 border border-shopify-border dark:border-shopify-darkBorder rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-emerald-600">
            </div>

            <!-- GEMINI AI BUTTON -->
            <button type="button" id="editGeminiBtn" 
                class="w-full py-2.5 px-4 bg-purple-50 dark:bg-purple-950/40 border border-purple-200 dark:border-purple-800 rounded-xl text-purple-700 dark:text-purple-300 text-xs font-bold flex items-center justify-center gap-2 transition-all hover:bg-purple-100">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                استعمل الذكاء الاصطناعي Gemini للوصف
            </button>

            <!-- PRICES -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-gray-700 dark:text-gray-300">السعر القديم (اختياري)</label>
                    <input id="editOldPrice" type="number" min="0" step="any" placeholder="0.00" 
                        class="w-full bg-gray-50 dark:bg-gray-900 border border-shopify-border dark:border-shopify-darkBorder rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-emerald-600">
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-gray-700 dark:text-gray-300">السعر الجديد *</label>
                    <input id="editPrice" type="number" min="0" step="any" placeholder="0.00" 
                        class="w-full bg-gray-50 dark:bg-gray-900 border border-shopify-border dark:border-shopify-darkBorder rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-emerald-600">
                </div>
            </div>

            <!-- DESCRIPTION RICH EDITOR -->
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-gray-700 dark:text-gray-300">وصف المنتج التفصيلي</label>
                <div class="border border-shopify-border dark:border-shopify-darkBorder rounded-xl overflow-hidden bg-gray-50 dark:bg-gray-900">
                    <div class="editor-toolbar flex flex-wrap items-center gap-1 p-2 border-b border-shopify-border dark:border-shopify-darkBorder bg-white dark:bg-gray-800">
                        <button type="button" data-command="bold" class="w-7 h-7 rounded border border-gray-200 dark:border-gray-700 text-xs font-bold"><b>B</b></button>
                        <button type="button" data-command="italic" class="w-7 h-7 rounded border border-gray-200 dark:border-gray-700 text-xs italic"><i>I</i></button>
                        <button type="button" data-command="underline" class="w-7 h-7 rounded border border-gray-200 dark:border-gray-700 text-xs underline"><u>U</u></button>
                        <select id="fontName" class="text-xs bg-transparent border border-gray-200 dark:border-gray-700 rounded px-1.5 py-1">
                            <option value="">نوع الخط</option>
                            <option value="Tajawal">Tajawal</option>
                            <option value="Arial">Arial</option>
                        </select>
                        <select id="fontSize" class="text-xs bg-transparent border border-gray-200 dark:border-gray-700 rounded px-1.5 py-1">
                            <option value="">الحجم</option>
                            <option value="2">صغير</option>
                            <option value="3">عادي</option>
                            <option value="5">كبير</option>
                        </select>
                        <input type="color" id="fontColor" value="#333333" class="w-7 h-7 rounded border border-gray-200 p-0.5 bg-transparent cursor-pointer">
                    </div>
                    <div id="descriptionEditor" contenteditable="true" class="p-3 min-h-[120px] text-xs focus:outline-none" data-placeholder="اكتب تفاصيل المنتج هنا..."></div>
                </div>
            </div>

            <!-- COLORS -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-gray-700 dark:text-gray-300">ألوان المنتج</label>
                <div class="p-3 bg-gray-50 dark:bg-gray-900 border border-shopify-border dark:border-shopify-darkBorder rounded-xl space-y-3">
                    <div class="flex items-center gap-2">
                        <input id="newColorName" type="text" placeholder="اسم اللون (مثال: أحمر)" class="flex-1 bg-white dark:bg-gray-800 border border-shopify-border rounded-lg px-3 py-1.5 text-xs">
                        <input id="newColorValue" type="color" value="#008060" class="w-9 h-9 rounded-lg border border-shopify-border p-1 bg-white cursor-pointer">
                        <button type="button" id="addColorBtn" class="bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-lg">إضافة</button>
                    </div>
                    <div class="flex flex-wrap gap-2" id="colorsList"></div>
                </div>
            </div>

            <!-- SIZES -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-gray-700 dark:text-gray-300">قياسات المنتج</label>
                <div class="p-3 bg-gray-50 dark:bg-gray-900 border border-shopify-border dark:border-shopify-darkBorder rounded-xl space-y-3">
                    <div class="flex items-center gap-2">
                        <input id="newSize" type="text" placeholder="مثال: S, M, L أو 38" class="flex-1 bg-white dark:bg-gray-800 border border-shopify-border rounded-lg px-3 py-1.5 text-xs">
                        <button type="button" id="addSizeBtn" class="bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-lg">إضافة</button>
                    </div>
                    <div class="flex flex-wrap gap-2" id="sizesList"></div>
                </div>
            </div>

            <!-- MAIN IMAGES -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-gray-700 dark:text-gray-300">صور المنتج الأساسية</label>
                <div class="p-3 bg-gray-50 dark:bg-gray-900 border border-shopify-border dark:border-shopify-darkBorder rounded-xl space-y-3">
                    <div class="grid grid-cols-4 gap-2" id="editPreview"></div>
                    <div class="flex items-center gap-3">
                        <label for="editImageFile" class="cursor-pointer bg-white dark:bg-gray-800 border border-dashed border-emerald-600 text-emerald-600 text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-2">
                            <i class="fa-solid fa-camera"></i> إضافة صور جديدة
                        </label>
                        <input id="editImageFile" type="file" accept="image/*" multiple hidden>
                    </div>
                </div>
            </div>

            <!-- DESCRIPTIVE IMAGES -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-gray-700 dark:text-gray-300">الصور الوصفية</label>
                <div class="p-3 bg-gray-50 dark:bg-gray-900 border border-shopify-border dark:border-shopify-darkBorder rounded-xl space-y-3">
                    <div class="grid grid-cols-4 gap-2" id="descriptionImagesPreview"></div>
                    <div class="flex items-center gap-3">
                        <label for="descriptionImageFile" class="cursor-pointer bg-white dark:bg-gray-800 border border-dashed border-emerald-600 text-emerald-600 text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-2">
                            <i class="fa-solid fa-plus"></i> إضافة صور وصفية
                        </label>
                        <input id="descriptionImageFile" type="file" accept="image/*" multiple hidden>
                    </div>
                    <label class="flex items-center gap-2 text-xs cursor-pointer pt-1">
                        <input type="checkbox" id="descriptiveImagesVisible" checked class="rounded border-gray-300 text-emerald-600 focus:ring-emerald-500">
                        <span>عرض الصور الوصفية للزبون في متصفح المنتج</span>
                    </label>
                </div>
            </div>

            <!-- MODAL ACTIONS -->
            <div class="flex items-center justify-end gap-3 pt-4 border-t border-shopify-border dark:border-shopify-darkBorder">
                <button type="button" id="cancelEdit" class="px-4 py-2 rounded-lg border border-shopify-border text-xs font-semibold hover:bg-gray-100 dark:hover:bg-gray-800">إلغاء</button>
                <button type="button" id="saveEdit" class="px-5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shopify-shadow flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> حفظ التعديلات
                </button>
            </div>

        </div>
    </div>


    <!-- =====================================================
         TOAST NOTIFICATION
    ===================================================== -->
    <div id="toast" class="fixed bottom-5 left-5 z-50 hidden items-center gap-2 px-4 py-3 rounded-xl shadow-lg text-xs font-bold transition-all">
        <i id="toastIcon"></i>
        <span id="toastMessage"></span>
    </div>


    <!-- =====================================================
         FIREBASE & SYSTEM SCRIPT
    ===================================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, getDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",
            authDomain: "g-glam.firebaseapp.com",
            projectId: "g-glam",
            storageBucket: "g-glam.firebasestorage.app",
            messagingSenderId: "997228419719",
            appId: "1:997228419719:web:f9d88de7ea2c6f457e3622",
            measurementId: "G-WX1K1F83F6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Elements
        const themeBtn = document.getElementById("themeBtn");
        const topStoreName = document.getElementById("topStoreName");
        const topStoreImage = document.getElementById("topStoreImage");
        const viewStoreBtn = document.getElementById("viewStoreBtn");
        const productsContainer = document.getElementById("productsContainer");
        const searchInput = document.getElementById("searchInput");
        const logoutBtn = document.getElementById("logoutBtn");

        const editModal = document.getElementById("editModal");
        const closeModal = document.getElementById("closeModal");
        const cancelEdit = document.getElementById("cancelEdit");
        const saveEdit = document.getElementById("saveEdit");
        const editName = document.getElementById("editName");
        const editShortDescription = document.getElementById("editShortDescription");
        const editPrice = document.getElementById("editPrice");
        const editOldPrice = document.getElementById("editOldPrice");
        const descriptionEditor = document.getElementById("descriptionEditor");

        const newColorName = document.getElementById("newColorName");
        const newColorValue = document.getElementById("newColorValue");
        const addColorBtn = document.getElementById("addColorBtn");
        const colorsList = document.getElementById("colorsList");

        const newSize = document.getElementById("newSize");
        const addSizeBtn = document.getElementById("addSizeBtn");
        const sizesList = document.getElementById("sizesList");

        const editImageFile = document.getElementById("editImageFile");
        const editPreview = document.getElementById("editPreview");
        const descriptionImageFile = document.getElementById("descriptionImageFile");
        const descriptionImagesPreview = document.getElementById("descriptionImagesPreview");
        const descriptiveImagesVisible = document.getElementById("descriptiveImagesVisible");
        const editGeminiBtn = document.getElementById("editGeminiBtn");

        const toast = document.getElementById("toast");
        const toastIcon = document.getElementById("toastIcon");
        const toastMessage = document.getElementById("toastMessage");

        let currentOwnerUid = "";
        let currentOwnerEmail = "";
        let currentStoreId = "";
        let currentStoreName = "G-Glam";
        let allProducts = [];
        let editingProductId = null;
        let existingImages = [];
        let selectedImages = [];
        let existingDescriptiveImages = [];
        let selectedDescriptiveImages = [];
        let editingColors = [];
        let editingSizes = [];

        function showSuccess(text) {
            toast.className = "fixed bottom-5 left-5 z-50 flex items-center gap-2 px-4 py-3 rounded-xl shadow-lg text-xs font-bold bg-emerald-50 text-emerald-800 border border-emerald-200 dark:bg-emerald-950 dark:text-emerald-300";
            toastIcon.className = "fa-solid fa-circle-check text-emerald-600";
            toastMessage.textContent = text;
            setTimeout(() => { toast.classList.add("hidden"); }, 3500);
        }

        function showError(text) {
            toast.className = "fixed bottom-5 left-5 z-50 flex items-center gap-2 px-4 py-3 rounded-xl shadow-lg text-xs font-bold bg-red-50 text-red-800 border border-red-200 dark:bg-red-950 dark:text-red-300";
            toastIcon.className = "fa-solid fa-circle-exclamation text-red-600";
            toastMessage.textContent = text;
            setTimeout(() => { toast.classList.add("hidden"); }, 4000);
        }

        // Theme Setup
        function updateThemeIcon() {
            const isDark = document.documentElement.classList.contains("dark");
            themeBtn.innerHTML = isDark ? '<i class="fa-solid fa-sun text-yellow-400"></i>' : '<i class="fa-solid fa-moon text-gray-300"></i>';
            themeBtn.title = isDark ? "الوضع الفاتح" : "الوضع الليلي";
        }

        function applyTheme() {
            const isDark = localStorage.getItem("gGlamDarkMode") === "true";
            document.documentElement.classList.toggle("dark", isDark);
            updateThemeIcon();
        }

        themeBtn.addEventListener("click", () => {
            const isDark = document.documentElement.classList.toggle("dark");
            localStorage.setItem("gGlamDarkMode", isDark);
            updateThemeIcon();
        });
        applyTheme();

        // Load Store & Products
        async function loadStore() {
            try {
                const user = auth.currentUser;
                if (!user) { window.location.href = "login.html"; return; }

                currentOwnerUid = user.uid;
                currentOwnerEmail = user.email || "";

                let storeSnapshot = null;
                const savedStoreId = localStorage.getItem("storeDocumentId") || localStorage.getItem("storeId");

                if (savedStoreId) {
                    try {
                        const snap = await getDoc(doc(db, "stores", savedStoreId));
                        if (snap.exists() && snap.data().ownerUid === currentOwnerUid) storeSnapshot = snap;
                    } catch (e) {}
                }

                if (!storeSnapshot) {
                    const q = query(collection(db, "stores"), where("ownerUid", "==", currentOwnerUid));
                    const snap = await getDocs(q);
                    if (!snap.empty) storeSnapshot = snap.docs[0];
                }

                if (!storeSnapshot) {
                    showError("⚠️ لم يتم العثور على متجر مرتبط بهذا الحساب.");
                    await signOut(auth);
                    window.location.href = "login.html";
                    return;
                }

                const storeData = storeSnapshot.data();
                currentStoreId = storeSnapshot.id;
                currentStoreName = storeData.storeName || storeData.name || "G-Glam";

                topStoreImage.src = storeData.storeImage || storeData.image || storeData.logo || "logotrans.png";
                topStoreName.textContent = currentStoreName;
                viewStoreBtn.href = "index.html?store=" + encodeURIComponent(currentStoreId);

                await loadProducts();
            } catch (error) {
                console.error("LOAD STORE ERROR:", error);
            }
        }

        function getProductTimestamp(product) {
            const val = product.updatedAt || product.createdAt || product.dateAdded;
            if (!val) return 0;
            if (typeof val.toMillis === "function") return val.toMillis();
            if (val instanceof Date) return val.getTime();
            if (typeof val === "number") return val;
            if (typeof val === "object" && val.seconds) return Number(val.seconds) * 1000;
            return 0;
        }

        function getProductImages(product) {
            let imgs = [];
            if (Array.isArray(product.images)) imgs = product.images.filter(Boolean).map(String);
            if (!imgs.length && product.image) imgs = [String(product.image)];
            return [...new Set(imgs)];
        }

        async function loadProducts() {
            try {
                const q = query(collection(db, "products"), where("ownerUid", "==", currentOwnerUid));
                const snapshot = await getDocs(q);

                allProducts = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
                allProducts.sort((a, b) => getProductTimestamp(b) - getProductTimestamp(a));
                renderProducts(allProducts);
            } catch (error) {
                console.error("LOAD PRODUCTS ERROR:", error);
                productsContainer.innerHTML = `<div class="p-6 text-center text-red-500 text-xs">تعذر تحميل المنتجات</div>`;
            }
        }

        function renderProducts(products) {
            if (!products.length) {
                productsContainer.innerHTML = `
                    <div class="p-8 text-center text-shopify-subtext dark:text-gray-400">
                        <i class="fa-solid fa-box-open text-3xl mb-3 text-gray-400"></i>
                        <p class="text-sm font-semibold">لا توجد منتجات متوفرة حالياً</p>
                        <p class="text-xs text-gray-500 mt-1 mb-4">ابدأ بإضافة منتجاتك لإظهارها للزبائن</p>
                        <button type="button" onclick="goAddProduct()" class="bg-[#303030] dark:bg-white dark:text-gray-900 text-white text-xs font-semibold px-4 py-2 rounded-lg inline-flex items-center gap-2">
                            <i class="fa-solid fa-plus text-xs"></i> إضافة أول منتج
                        </button>
                    </div>
                `;
                return;
            }

            productsContainer.innerHTML = products.map(product => {
                const images = getProductImages(product);
                const firstImage = images[0] || "logotrans.png";

                return `
                    <div class="p-3 sm:p-4 hover:bg-shopify-hover dark:hover:bg-[#222] transition-colors flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3 min-w-0 flex-1">
                            <img src="${escapeHtml(firstImage)}" alt="صورة المنتج" class="w-12 h-12 rounded-lg object-cover bg-gray-100 border border-shopify-border dark:border-shopify-darkBorder" onerror="this.src='logotrans.png';">
                            <div class="min-w-0 flex-1">
                                <h3 class="text-xs font-bold text-gray-900 dark:text-white truncate">${escapeHtml(product.name || "بدون اسم")}</h3>
                                <div class="flex items-center gap-3 mt-1 text-[11px]">
                                    <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300">نشط</span>
                                    <span class="text-shopify-subtext dark:text-gray-400">المخزون: <strong class="text-gray-700 dark:text-gray-200">${Number(product.stock || 0)}</strong></span>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center gap-4">
                            <div class="text-left hidden sm:block">
                                <span class="text-xs font-bold text-gray-900 dark:text-white block">${Number(product.price || 0).toLocaleString("fr-DZ")} DA</span>
                                <span class="text-[10px] text-shopify-subtext dark:text-gray-400">السعر المعروض</span>
                            </div>
                            <div class="flex items-center gap-1">
                                <button type="button" onclick="openEditModal('${product.id}')" class="text-xs bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 p-2 rounded-lg transition-colors" title="تعديل">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                                <button type="button" onclick="deleteProduct('${product.id}')" class="text-xs bg-red-50 hover:bg-red-100 dark:bg-red-950/40 dark:hover:bg-red-900/50 text-red-600 dark:text-red-400 p-2 rounded-lg transition-colors" title="حذف">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join("");
        }

        // Search
        searchInput.addEventListener("input", () => {
            const queryText = searchInput.value.trim().toLowerCase();
            if (!queryText) { renderProducts(allProducts); return; }
            const filtered = allProducts.filter(p => String(p.name || "").toLowerCase().includes(queryText));
            renderProducts(filtered);
        });

        // Cloudinary Upload
        async function uploadImage(file) {
            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", "gglam_products");
            const res = await fetch("https://api.cloudinary.com/v1_1/g82dvrkr/image/upload", { method: "POST", body: formData });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error?.message || "فشل رفع الصورة");
            return data.secure_url;
        }

        // Modal Rendering Helpers
        function renderImages() {
            editPreview.innerHTML = "";
            existingImages.forEach((url, i) => {
                editPreview.innerHTML += `
                    <div class="relative aspect-square rounded-lg overflow-hidden border border-shopify-border bg-white">
                        <img src="${url}" class="w-full h-full object-cover">
                        <button type="button" onclick="removeExistingImage(${i})" class="absolute top-1 left-1 w-6 h-6 bg-black/70 text-white rounded-md flex items-center justify-center text-xs"><i class="fa-solid fa-xmark"></i></button>
                    </div>`;
            });
            selectedImages.forEach((file, i) => {
                const url = URL.createObjectURL(file);
                editPreview.innerHTML += `
                    <div class="relative aspect-square rounded-lg overflow-hidden border border-shopify-border bg-white">
                        <img src="${url}" class="w-full h-full object-cover">
                        <button type="button" onclick="removeNewImage(${i})" class="absolute top-1 left-1 w-6 h-6 bg-black/70 text-white rounded-md flex items-center justify-center text-xs"><i class="fa-solid fa-xmark"></i></button>
                        <span class="absolute right-1 bottom-1 bg-emerald-600 text-white text-[9px] px-1 rounded font-bold">جديدة</span>
                    </div>`;
            });
        }

        window.removeExistingImage = (i) => { existingImages.splice(i, 1); renderImages(); };
        window.removeNewImage = (i) => { selectedImages.splice(i, 1); renderImages(); };

        function renderDescriptiveImages() {
            descriptionImagesPreview.innerHTML = "";
            existingDescriptiveImages.forEach((url, i) => {
                descriptionImagesPreview.innerHTML += `
                    <div class="relative aspect-square rounded-lg overflow-hidden border border-shopify-border bg-white">
                        <img src="${url}" class="w-full h-full object-cover">
                        <button type="button" onclick="removeExistingDescImage(${i})" class="absolute top-1 left-1 w-6 h-6 bg-black/70 text-white rounded-md flex items-center justify-center text-xs"><i class="fa-solid fa-xmark"></i></button>
                    </div>`;
            });
            selectedDescriptiveImages.forEach((file, i) => {
                const url = URL.createObjectURL(file);
                descriptionImagesPreview.innerHTML += `
                    <div class="relative aspect-square rounded-lg overflow-hidden border border-shopify-border bg-white">
                        <img src="${url}" class="w-full h-full object-cover">
                        <button type="button" onclick="removeNewDescImage(${i})" class="absolute top-1 left-1 w-6 h-6 bg-black/70 text-white rounded-md flex items-center justify-center text-xs"><i class="fa-solid fa-xmark"></i></button>
                        <span class="absolute right-1 bottom-1 bg-emerald-600 text-white text-[9px] px-1 rounded font-bold">جديدة</span>
                    </div>`;
            });
        }

        window.removeExistingDescImage = (i) => { existingDescriptiveImages.splice(i, 1); renderDescriptiveImages(); };
        window.removeNewDescImage = (i) => { selectedDescriptiveImages.splice(i, 1); renderDescriptiveImages(); };

        function renderColors() {
            colorsList.innerHTML = "";
            editingColors.forEach((color, i) => {
                const name = typeof color === "object" ? color.name : color;
                const val = typeof color === "object" ? (color.value || color.color || "#008060") : "#008060";
                colorsList.innerHTML += `
                    <div class="flex items-center gap-2 bg-white dark:bg-gray-800 px-3 py-1 rounded-lg border border-shopify-border text-xs">
                        <span class="w-3.5 h-3.5 rounded-full border border-gray-300" style="background:${val}"></span>
                        <span>${escapeHtml(name)}</span>
                        <button type="button" onclick="removeColor(${i})" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-xmark"></i></button>
                    </div>`;
            });
        }
        window.removeColor = (i) => { editingColors.splice(i, 1); renderColors(); };

        function renderSizes() {
            sizesList.innerHTML = "";
            editingSizes.forEach((size, i) => {
                const val = typeof size === "object" ? size.name : size;
                sizesList.innerHTML += `
                    <div class="flex items-center gap-2 bg-white dark:bg-gray-800 px-3 py-1 rounded-lg border border-shopify-border text-xs">
                        <span>${escapeHtml(val)}</span>
                        <button type="button" onclick="removeSize(${i})" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-xmark"></i></button>
                    </div>`;
            });
        }
        window.removeSize = (i) => { editingSizes.splice(i, 1); renderSizes(); };

        // Open/Close Modal
        window.openEditModal = function(id) {
            const product = allProducts.find(p => p.id === id);
            if (!product) return;

            editingProductId = id;
            editName.value = product.name || "";
            editShortDescription.value = product.shortDescription || "";
            editPrice.value = product.price ?? "";
            editOldPrice.value = product.oldPrice ?? "";
            descriptionEditor.innerHTML = product.description || "";

            editingColors = Array.isArray(product.colors) ? JSON.parse(JSON.stringify(product.colors)) : [];
            editingSizes = Array.isArray(product.sizes) ? JSON.parse(JSON.stringify(product.sizes)) : [];
            renderColors();
            renderSizes();

            existingImages = getProductImages(product);
            selectedImages = [];
            renderImages();

            existingDescriptiveImages = Array.isArray(product.descriptiveImages) ? [...product.descriptiveImages] : [];
            selectedDescriptiveImages = [];
            descriptiveImagesVisible.checked = product.descriptiveImagesVisible !== false;
            renderDescriptiveImages();

            editModal.classList.remove("hidden");
            editModal.classList.add("flex");
        }

        function closeModalFn() {
            editModal.classList.add("hidden");
            editModal.classList.remove("flex");
            editingProductId = null;
        }

        closeModal.addEventListener("click", closeModalFn);
        cancelEdit.addEventListener("click", closeModalFn);

        editImageFile.addEventListener("change", (e) => {
            selectedImages.push(...Array.from(e.target.files));
            renderImages();
            editImageFile.value = "";
        });

        descriptionImageFile.addEventListener("change", (e) => {
            selectedDescriptiveImages.push(...Array.from(e.target.files));
            renderDescriptiveImages();
            descriptionImageFile.value = "";
        });

        addColorBtn.addEventListener("click", () => {
            const name = newColorName.value.trim();
            const value = newColorValue.value;
            if (!name) return;
            editingColors.push({ name, value });
            newColorName.value = "";
            renderColors();
        });

        addSizeBtn.addEventListener("click", () => {
            const val = newSize.value.trim();
            if (!val) return;
            editingSizes.push(val);
            newSize.value = "";
            renderSizes();
        });

        // Save
        saveEdit.addEventListener("click", async () => {
            if (!editingProductId) return;
            const name = editName.value.trim();
            const price = Number(editPrice.value);

            if (!name || !Number.isFinite(price)) {
                showError("الرجاء ملء الحقول الإجبارية بشكل صحيح.");
                return;
            }

            saveEdit.disabled = true;
            saveEdit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ...';

            try {
                let newUploaded = [];
                for (const file of selectedImages) newUploaded.push(await uploadImage(file));
                const finalImages = [...existingImages, ...newUploaded];

                let newDescUploaded = [];
                for (const file of selectedDescriptiveImages) newDescUploaded.push(await uploadImage(file));
                const finalDescImages = [...existingDescriptiveImages, ...newDescUploaded];

                await updateDoc(doc(db, "products", editingProductId), {
                    name,
                    shortDescription: editShortDescription.value.trim(),
                    price,
                    oldPrice: editOldPrice.value === "" ? 0 : Number(editOldPrice.value),
                    description: descriptionEditor.innerHTML.trim(),
                    colors: editingColors,
                    sizes: editingSizes,
                    images: finalImages,
                    image: finalImages[0] || "",
                    descriptiveImages: finalDescImages,
                    descriptiveImagesVisible: descriptiveImagesVisible.checked,
                    updatedAt: serverTimestamp()
                });

                showSuccess("تم حفظ التعديلات بنجاح ✅");
                closeModalFn();
                await loadProducts();
            } catch (err) {
                console.error(err);
                showError("حدث خطأ أثناء الحفظ.");
            } finally {
                saveEdit.disabled = false;
                saveEdit.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> حفظ التعديلات';
            }
        });

        // Delete Product
        window.deleteProduct = async function(id) {
            if (!confirm("هل أنت متأكد من رغبتك في حذف هذا المنتج؟")) return;
            try {
                await deleteDoc(doc(db, "products", id));
                showSuccess("تم حذف المنتج بنجاح");
                await loadProducts();
            } catch (err) {
                showError("تعذر حذف المنتج");
            }
        }

        window.goAddProduct = () => { window.location.href = "add-product.html"; };

        // Editor Toolbar Actions
        document.querySelectorAll("[data-command]").forEach(btn => {
            btn.addEventListener("click", () => {
                document.execCommand(btn.dataset.command, false, null);
            });
        });
        document.getElementById("fontName").addEventListener("change", (e) => { if(e.target.value) document.execCommand("fontName", false, e.target.value); });
        document.getElementById("fontSize").addEventListener("change", (e) => { if(e.target.value) document.execCommand("fontSize", false, e.target.value); });
        document.getElementById("fontColor").addEventListener("input", (e) => { document.execCommand("foreColor", false, e.target.value); });

        editGeminiBtn.addEventListener("click", () => window.open("https://gemini.google.com/", "_blank"));

        logoutBtn.addEventListener("click", async (e) => {
            e.preventDefault();
            if (confirm("هل تريد تسجيل الخروج؟")) {
                await signOut(auth);
                localStorage.clear();
                window.location.href = "login.html";
            }
        });

        function escapeHtml(val) {
            return String(val ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "login.html"; return; }
            await loadStore();
        });
    </script>
</body>
</html>
