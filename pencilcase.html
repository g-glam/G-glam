<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مقلمة مدرسية</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f8f8f8;
    margin:0;
    padding:15px;
}

.product{
    background:white;
    padding:15px;
    border-radius:12px;
}

h1{
    text-align:center;
}

.price{
    text-align:center;
    color:#ff4fc3;
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

.slider{
    display:flex;
    overflow-x:auto;
    gap:15px;
    padding-bottom:10px;
}

.item{
    min-width:260px;
    background:white;
    padding:10px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

.item img{
    width:100%;
    height:260px;
    object-fit:cover;
    border-radius:10px;
}

.item input{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:1px solid #ddd;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    background:#ff4fc3;
    color:white;
    border:none;
    padding:12px;
    width:100%;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    margin-top:20px;
}

.back-btn{
    display:block;
    text-align:center;
    margin-top:10px;
    text-decoration:none;
    color:black;
}

</style>

</head>

<body>

<div class="product">

<h1>مقلمة مدرسية</h1>

<div class="price">
Prix : 500 DA
</div>

<div class="slider">

<div class="item">
<img src="1785499182902.png">
<p>مقلمة 1</p>
<input type="number" min="0" value="0" id="qty1">
</div>

<div class="item">
<img src="1785499345924.png">
<p>مقلمة 2</p>
<input type="number" min="0" value="0" id="qty2">
</div>

<div class="item">
<img src="1785499410988.png">
<p>مقلمة 3</p>
<input type="number" min="0" value="0" id="qty3">
</div>

<div class="item">
<img src="1785499644241.png">
<p>مقلمة 4</p>
<input type="number" min="0" value="0" id="qty4">
</div>

<div class="item">
<img src="1785499796512.png">
<p>مقلمة 5</p>
<input type="number" min="0" value="0" id="qty5">
</div>

<div class="item">
<img src="1785500090075.png">
<p>مقلمة 6</p>
<input type="number" min="0" value="0" id="qty6">
</div>

<div class="item">
<img src="1785513078890.png">
<p>مقلمة 7</p>
<input type="number" min="0" value="0" id="qty7">
</div>

<div class="item">
<img src="1785513131640.png">
<p>مقلمة 8</p>
<input type="number" min="0" value="0" id="qty8">
</div>

<div class="item">
<img src="1785513183764.png">
<p>مقلمة 9</p>
<input type="number" min="0" value="0" id="qty9">
</div>

<div class="item">
<img src="1785513233503.png">
<p>مقلمة 10</p>
<input type="number" min="0" value="0" id="qty10">
</div>

<div class="item">
<img src="1785513339875.png">
<p>مقلمة 11</p>
<input type="number" min="0" value="0" id="qty11">
</div>

</div>

<button onclick="addToCart()">
🛒 أضف إلى السلة
</button>

<a href="index.html" class="back-btn">
⬅ العودة للمتجر
</a>

</div>

<script>

function addToCart(){

let cart = JSON.parse(localStorage.getItem("cart")) || [];

for(let i=1;i<=11;i++){

let qty = parseInt(
document.getElementById("qty"+i).value
);

if(qty > 0){

cart.push({
name:"مقلمة مدرسية - موديل " + i,
price:500 * qty,
quantity:qty
});

}

}

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

alert("تمت إضافة المقلمات إلى السلة");

}

</script>

</body>
</html>
