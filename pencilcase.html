<script>

function selectItem(item){

item.classList.toggle("selected");

let qtyBox =
item.querySelector(".qty-box");

if(qtyBox.style.display === "block"){
qtyBox.style.display = "none";
}else{
qtyBox.style.display = "block";
}

}

function addToCart(){

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

for(let i=1;i<=11;i++){

let select =
document.getElementById("qty"+i);

if(select){

let qty =
parseInt(select.value);

if(qty > 0){

cart.push({

name:"مقلمة مدرسية - موديل " + i,

price:500,

quantity:qty

});

}

}

}

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

alert("تمت إضافة المقلمات إلى السلة");

}

</script>
