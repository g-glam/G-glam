        function getDeliveryCollection() {
            if (!currentUser) throw new Error("المستخدم غير مسجل الدخول.");
            return collection(db, "stores", currentUser.uid, "delivery");
        }

        function getDeliveryDocument(wilayaId) {
            if (!currentUser) throw new Error("المستخدم غير مسجل الدخول.");
            return doc(db, "stores", currentUser.uid, "delivery", wilayaId);
        }

        // Theme Setup
        function updateThemeIcon() {
            const isDark = document.documentElement.classList.contains("dark");
            themeToggle.innerHTML = isDark ? '<i class="fa-solid fa-sun text-yellow-400"></i>' : '<i class="fa-solid fa-moon"></i>';
            themeToggle.title = isDark ? "الوضع الفاتح" : "الوضع الليلي";
        }

        function applyTheme() {
            const isDark = localStorage.getItem("gGlamDarkMode") === "true";
            document.documentElement.classList.toggle("dark", isDark);
            updateThemeIcon();
        }

        themeToggle.addEventListener("click", () => {
            const isDark = document.documentElement.classList.toggle("dark");
            localStorage.setItem("gGlamDarkMode", isDark);
            updateThemeIcon();
        });
        applyTheme();

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "login.html"; return; }
            currentUser = user;
            try {
                const storeRef = doc(db, "stores", user.uid);
                const storeSnapshot = await getDoc(storeRef);
                if (!storeSnapshot.exists()) {
                    topStoreName.textContent = "المتجر غير موجود";
                    list.innerHTML = `<tr><td colspan="5" class="empty py-12 text-center text-gray-400 text-xs"><i class="fa-solid fa-circle-exclamation text-lg mb-2"></i><br>لم يتم العثور على بيانات المتجر.</td></tr>`;
                    return;
                }
                const store = storeSnapshot.data();
                const name = store.storeName || store.name || "G-Glam";
                topStoreName.textContent = name;
                const logo = store.storeImage || store.image || store.logo || "logotrans.png";
                topStoreImage.src = logo;
                viewStoreBtn.href = "index.html?store=" + encodeURIComponent(user.uid);

                localStorage.setItem("ownerUid", user.uid);
                localStorage.setItem("storeId", user.uid);
                localStorage.setItem("storeName", name);

                await loadDelivery();

        });

        async function loadDelivery() {
            list.innerHTML = `<tr><td colspan="5" class="empty py-12 text-center text-gray-400 text-xs"><i class="fa-solid fa-spinner fa-spin text-lg mb-2 text-shopify-green"></i><br>جاري تحميل أسعار التوصيل...</td></tr>`;
            try {
                const snapshot = await getDocs(getDeliveryCollection());
                deliveryItems = [];
                snapshot.forEach(item => {
                    deliveryItems.push({ id: item.id, ...item.data() });
                });
                deliveryItems.sort((a, b) => a.id.localeCompare(b.id, "ar"));
                displayDelivery();
            } catch (error) {
                console.error("DELIVERY LOAD ERROR:", error);
                list.innerHTML = `<tr><td colspan="5" class="empty py-12 text-center text-red-500 text-xs"><i class="fa-solid fa-circle-exclamation text-lg mb-2"></i><br>تعذر تحميل أسعار التوصيل.<br>${escapeHtml(error.message)}</td></tr>`;
            }
        }

        function displayDelivery() {
            const value = searchInput.value.trim().toLowerCase();
            const filtered = deliveryItems.filter(item => String(item.id).toLowerCase().includes(value));
            list.innerHTML = "";

            if (!filtered.length) {
                list.innerHTML = `<tr><td colspan="5" class="empty py-12 text-center text-gray-400 text-xs"><i class="fa-solid fa-inbox text-lg mb-2"></i><br>لا توجد ولاية مطابقة للبحث.</td></tr>`;
                return;
            }

            filtered.forEach((item, index) => {
                const row = document.createElement("tr");
                row.className = "hover:bg-gray-50/80 dark:hover:bg-gray-800/50 transition-colors";
                row.innerHTML = `
                    <td class="p-3 text-right text-xs font-bold text-gray-500 dark:text-gray-400 pr-4">${String(index + 1).padStart(2, "0")}</td>
                    <td class="p-3 text-right text-xs font-bold text-gray-900 dark:text-white">${escapeHtml(item.id)}</td>
                    <td class="p-3 text-center text-xs font-bold text-emerald-600 dark:text-emerald-400">${formatPrice(item.office)} DA</td>
                    <td class="p-3 text-center text-xs font-bold text-emerald-600 dark:text-emerald-400">${formatPrice(item.home)} DA</td>
                    <td class="p-3 text-left text-xs space-x-1 space-x-reverse pl-4">
                        <button class="edit-btn px-2.5 py-1.5 bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 rounded-lg font-bold hover:bg-blue-100 transition-colors" data-action="edit" data-id="${escapeAttribute(item.id)}">
                            <i class="fa-solid fa-pen text-[11px]"></i> تعديل
                        </button>
                        <button class="delete-btn px-2.5 py-1.5 bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 rounded-lg font-bold hover:bg-red-100 transition-colors" data-action="delete" data-id="${escapeAttribute(item.id)}">
                            <i class="fa-solid fa-trash text-[11px]"></i> حذف
                        </button>
                    </td>
                `;
                list.appendChild(row);
            });
        }

        function formatPrice(value) {
            const number = Number(value ?? 0);
            if (!Number.isFinite(number)) return "0";
            return number.toLocaleString("fr-DZ");
        }

        autoSeedBtn.addEventListener("click", async () => {
            if (!currentUser) { showMessage("المستخدم غير مسجل الدخول.", false); return; }
            if (!confirm("هل ترغبين في إدخال أسعار التوصيل الـ 58 ولاية تلقائياً دفعة واحدة؟")) return;

            try {
                autoSeedBtn.disabled = true;
                autoSeedBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-shopify-green"></i> <span>جاري التعبئة...</span>';
                const batch = writeBatch(db);
                wilayasList.forEach(w => {
                    const docRef = getDeliveryDocument(w.id);
                    batch.set(docRef, { office: w.office, home: w.home, updatedAt: serverTimestamp() }, { merge: true });
                });
                await batch.commit();
                showMessage("تمت إضافة جميع الولايات الـ 58 بنجاح!", true);
                await loadDelivery();
            } catch (error) {
                console.error("AUTO SEED ERROR:", error);
                showMessage("حدث خطأ أثناء التعبئة التلقائية: " + error.message, false);
            } finally {
                autoSeedBtn.disabled = false;
                autoSeedBtn.innerHTML = '<i class="fa-solid fa-bolt text-shopify-green"></i> <span>تعبئة الـ 58 ولاية تلقائياً</span>';
            }
        });

        document.getElementById("addBtn").addEventListener("click", () => {
            editingId = null;
            modalTitle.textContent = "إضافة ولاية جديدة";
            wilayaInput.value = "";
            officeInput.value = "";
            homeInput.value = "";
            wilayaInput.disabled = false;
            modal.classList.remove("hidden");
            modal.classList.add("flex");
            setTimeout(() => wilayaInput.focus(), 100);
        });

        function closeModal() {
            modal.classList.remove("flex");
            modal.classList.add("hidden");
        }

        document.getElementById("cancelBtn").addEventListener("click", closeModal);
        modal.addEventListener("click", event => { if (event.target === modal) closeModal(); });

        list.addEventListener("click", async event => {
            const button = event.target.closest("button");
            if (!button) return;
            const id = button.dataset.id;
            const action = button.dataset.action;
            if (!id) return;

            if (action === "edit") {
                const item = deliveryItems.find(x => x.id === id);
                if (!item) { showMessage("لم يتم العثور على الولاية.", false); return; }
                editingId = id;
                modalTitle.textContent = "تعديل أسعار " + id;
                wilayaInput.value = id;
                wilayaInput.disabled = true;
                officeInput.value = item.office ?? "";
                homeInput.value = item.home ?? "";
                modal.classList.remove("hidden");
                modal.classList.add("flex");
                setTimeout(() => officeInput.focus(), 100);
            }

            if (action === "delete") {
                if (!confirm("هل تريد حذف أسعار التوصيل لولاية:\n\n" + id + "؟")) return;
                try {
                    await deleteDoc(getDeliveryDocument(id));
                    showMessage("تم حذف الولاية بنجاح.", true);
                    await loadDelivery();
                } catch (error) {
                    console.error("DELETE ERROR:", error);
                    showMessage("حدث خطأ أثناء الحذف: " + error.message, false);
                }
            }
        });

        saveBtn.addEventListener("click", async () => {
            if (!currentUser) { showMessage("المستخدم غير مسجل الدخول.", false); return; }
            const wilaya = wilayaInput.value.trim();
            const officeValue = officeInput.value.trim();
            const homeValue = homeInput.value.trim();

            if (!wilaya) { alert("يرجى إدخال اسم الولاية."); wilayaInput.focus(); return; }
            if (officeValue === "" || homeValue === "") { alert("يرجى إدخال سعر المكتب والمنزل."); return; }

            const office = Number(officeValue);
            const home = Number(homeValue);

            if (!Number.isFinite(office) || !Number.isFinite(home) || office < 0 || home < 0) {
                alert("يرجى إدخال أسعار صحيحة.");
                return;
            }

            if (!Number.isInteger(office) || !Number.isInteger(home)) {
                alert("يرجى إدخال الأسعار بالدينار بدون كسور.");
                return;
            }

            try {
                saveBtn.disabled = true;
                saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>جاري الحفظ...</span>';

                if (!editingId) {
                    const exists = deliveryItems.some(item => item.id.toLowerCase() === wilaya.toLowerCase());
                    if (exists) { alert("هذه الولاية موجودة بالفعل."); return; }
                    await setDoc(getDeliveryDocument(wilaya), { office, home, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
                    showMessage("تمت إضافة الولاية بنجاح.", true);
                } else {
                    await setDoc(getDeliveryDocument(editingId), { office, home, updatedAt: serverTimestamp() }, { merge: true });
                    showMessage("تم تعديل أسعار التوصيل بنجاح.", true);
                }

                closeModal();
                await loadDelivery();
            } catch (error) {
                console.error("SAVE ERROR:", error);
                showMessage("حدث خطأ أثناء الحفظ: " + error.message, false);
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> <span>حفظ</span>';
            }
        });

        searchInput.addEventListener("input", displayDelivery);

        document.getElementById("logoutBtn").addEventListener("click", async event => {
            event.preventDefault();
            if (!confirm("هل تريد تسجيل الخروج؟")) return;
            try {
                await signOut(auth);
                localStorage.clear();
                window.location.href = "login.html";
            } catch (error) {
                console.error("LOGOUT ERROR:", error);
                alert("تعذر تسجيل الخروج.");
            }
        });

        function showMessage(text, success) {
            const element = document.getElementById(success ? "success" : "error");
            const other = document.getElementById(success ? "error" : "success");
            other.style.display = "none";
            element.textContent = text;
            element.classList.remove("hidden");
            element.style.display = "block";
            setTimeout(() => {
                element.style.display = "none";
                element.classList.add("hidden");
            }, 3500);
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function escapeAttribute(value) {
            return escapeHtml(value);
        }
    </script>
</body>

</html>
