<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#F47B20">

<title>G-Glam | أسعار التوصيل</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<!-- =====================================================
     FONT AWESOME
===================================================== -->

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
crossorigin="anonymous"
referrerpolicy="no-referrer"
>


<style>

/* =====================================================
   VARIABLES
===================================================== */

:root{

--orange:#F47B20;
--orange-dark:#DF6810;

--bg:#F7F7F7;
--card:#FFFFFF;

--dark:#222222;
--dark-2:#333333;

--text:#333333;
--muted:#888888;

--border:#E9E9E9;

--sidebar:#EEEEEE;
--sidebar-hover:#E3E3E3;

--input:#FCFCFC;

--table-head:#FAFAFA;
--table-hover:#FFF9F5;

--success:#198754;
--success-bg:#E5F5EC;

--danger:#DC3545;
--danger-bg:#FBE7EA;

--shadow:0 4px 18px rgba(0,0,0,.06);


/* =====================================================
   NIGHT BLUE
===================================================== */

--night:#0B1F3A;
--night-2:#102B4F;
--night-3:#163A67;

--night-text:#EAF3FF;
--night-muted:#9FB4CC;

--night-border:#24476F;
--night-input:#102A49;

--night-table:#0F2948;
--night-hover:#16375D;

}


/* =====================================================
   RESET
===================================================== */

*{

box-sizing:border-box;

margin:0;
padding:0;

font-family:"Tajawal",Arial,sans-serif;

}


body{

background:var(--bg);

color:var(--text);

min-height:100vh;

transition:
background .3s ease,
color .3s ease;

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

position:fixed;

right:0;
top:0;

height:100vh;

width:75px;

background:var(--sidebar);

color:#444;

overflow:hidden;

transition:.3s;

z-index:1100;

box-shadow:-3px 0 15px rgba(0,0,0,.04);

border-left:1px solid var(--border);

}


.sidebar:hover{

width:240px;

}


/* =====================================================
   LOGO
===================================================== */

.logo{

height:78px;

display:flex;

align-items:center;

justify-content:center;

border-bottom:1px solid var(--border);

white-space:nowrap;

padding:10px;

}


.logo img{

width:48px;

height:48px;

object-fit:contain;

display:block;

transition:.3s;

}


.sidebar:hover .logo img{

width:130px;

height:55px;

}


/* =====================================================
   MENU
===================================================== */

.menu{

margin-top:18px;

padding:0 10px;

}


.menu a{

display:flex;

align-items:center;

gap:15px;

height:52px;

padding:0 10px;

margin-bottom:7px;

border-radius:12px;

color:#555;

text-decoration:none;

white-space:nowrap;

transition:.2s;

}


.menu a:hover{

background:var(--sidebar-hover);

color:#222;

}


.menu a.active{

background:var(--orange);

color:white;

box-shadow:
0 5px 15px rgba(244,123,32,.22);

}


/* =====================================================
   FONT AWESOME ICON
===================================================== */

.icon{

min-width:35px;

width:35px;

height:35px;

display:flex;

align-items:center;

justify-content:center;

font-size:18px;

}


.icon i{

display:block;

}


/* =====================================================
   MENU TEXT
===================================================== */

.text{

opacity:0;

transition:.25s;

font-size:14px;

font-weight:700;

}


.sidebar:hover .text{

opacity:1;

}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{

position:fixed;

top:0;

right:75px;

left:0;

height:78px;

background:white;

border-bottom:1px solid var(--border);

display:flex;

align-items:center;

justify-content:space-between;

padding:0 25px;

z-index:1000;

box-shadow:
0 2px 12px rgba(0,0,0,.04);

transition:.3s;

}


/* =====================================================
   STORE TOP
===================================================== */

.store-top{

display:flex;

align-items:center;

gap:12px;

min-width:0;

}


.store-image{

width:48px;

height:48px;

border-radius:50%;

object-fit:cover;

background:#F1F1F1;

border:2px solid #FFE0C8;

flex-shrink:0;

}


.store-details{

display:flex;

flex-direction:column;

min-width:0;

}


.store-label{

font-size:11px;

color:#999;

margin-bottom:2px;

}


.store-top-name{

font-size:16px;

font-weight:800;

color:#222;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

max-width:250px;

}


/* =====================================================
   TOP ACTIONS
===================================================== */

.top-actions{

display:flex;

align-items:center;

gap:9px;

}


/* =====================================================
   DARK MODE BUTTON
===================================================== */

.theme-toggle{

width:43px;

height:43px;

border:none;

border-radius:12px;

background:#EEF3F9;

color:var(--night);

display:flex;

align-items:center;

justify-content:center;

font-size:18px;

cursor:pointer;

transition:.25s;

border:1px solid #DCE5EF;

box-shadow:
0 3px 9px rgba(11,31,58,.08);

}


.theme-toggle:hover{

background:var(--night);

color:white;

transform:translateY(-1px);

}


.theme-toggle i{

transition:.25s;

}


/* =====================================================
   VIEW STORE
===================================================== */

.view-store-btn{

display:flex;

align-items:center;

gap:7px;

background:#FFF1E6;

color:var(--orange-dark);

text-decoration:none;

padding:10px 15px;

border-radius:11px;

font-size:13px;

font-weight:700;

transition:.2s;

white-space:nowrap;

border:1px solid #FFE0CA;

}


.view-store-btn:hover{

background:var(--orange);

color:white;

}


.view-store-btn i{

font-size:15px;

}


/* =====================================================
   CONTENT
===================================================== */

.content{

margin-right:75px;

padding:103px 25px 25px;

transition:.3s;

}


/* =====================================================
   MAIN BOX
===================================================== */

.box{

background:var(--card);

border:1px solid var(--border);

border-radius:18px;

padding:22px;

box-shadow:var(--shadow);

margin-bottom:22px;

transition:.3s;

}


/* =====================================================
   TOP SECTION
===================================================== */

.top{

display:flex;

align-items:center;

justify-content:space-between;

gap:15px;

margin-bottom:20px;

flex-wrap:wrap;

}


.top h2{

font-size:21px;

font-weight:800;

color:var(--dark);

}


/* =====================================================
   TOP BUTTONS
===================================================== */

.top-buttons{

display:flex;

gap:10px;

flex-wrap:wrap;

}


/* =====================================================
   BUTTON
===================================================== */

.add-btn{

border:none;

padding:11px 17px;

border-radius:10px;

cursor:pointer;

font-size:14px;

font-weight:700;

transition:.2s;

font-family:"Tajawal",Arial,sans-serif;

background:var(--orange);

color:white;

box-shadow:
0 4px 10px rgba(244,123,32,.18);

display:flex;

align-items:center;

justify-content:center;

gap:8px;

}


.add-btn:hover{

background:var(--orange-dark);

transform:translateY(-1px);

}


.add-btn:disabled{

opacity:.6;

cursor:not-allowed;

}


/* =====================================================
   SEARCH
===================================================== */

.search-wrapper{

position:relative;

width:100%;

margin-bottom:18px;

}


.search{

width:100%;

padding:13px 45px 13px 15px;

border:1px solid var(--border);

border-radius:10px;

font-size:14px;

outline:none;

background:var(--input);

color:var(--text);

transition:.2s;

font-family:"Tajawal",Arial,sans-serif;

}


.search-icon{

position:absolute;

right:16px;

top:50%;

transform:translateY(-50%);

color:var(--muted);

font-size:15px;

pointer-events:none;

}


.search::placeholder{

color:var(--muted);

}


.search:focus{

border-color:var(--orange);

background:white;

box-shadow:
0 0 0 3px rgba(244,123,32,.08);

}


.search:focus + .search-icon{

color:var(--orange);

}


/* =====================================================
   TABLE
===================================================== */

.table-container{

overflow-x:auto;

border:1px solid var(--border);

border-radius:13px;

}


table{

width:100%;

border-collapse:collapse;

min-width:700px;

background:var(--card);

}


th,
td{

padding:14px 10px;

border-bottom:1px solid var(--border);

text-align:center;

font-size:14px;

}


th{

background:var(--table-head);

color:#555;

font-weight:800;

}


tbody tr{

transition:.15s;

}


tbody tr:hover{

background:var(--table-hover);

}


tbody tr:last-child td{

border-bottom:none;

}


/* =====================================================
   PRICE
===================================================== */

.price{

font-weight:700;

color:var(--orange-dark);

}


/* =====================================================
   ACTION BUTTONS
===================================================== */

.edit-btn,
.delete-btn{

border:none;

padding:8px 12px;

border-radius:8px;

cursor:pointer;

font-family:"Tajawal",Arial,sans-serif;

font-size:13px;

font-weight:700;

transition:.2s;

display:inline-flex;

align-items:center;

justify-content:center;

gap:6px;

}


.edit-btn{

background:#FFF1E6;

color:var(--orange-dark);

margin-left:5px;

}


.edit-btn:hover{

background:#FFE0C7;

}


.delete-btn{

background:var(--danger-bg);

color:#B52B39;

}


.delete-btn:hover{

background:#F6D1D6;

}


.edit-btn i,
.delete-btn i{

font-size:13px;

}


/* =====================================================
   EMPTY
===================================================== */

.empty{

text-align:center;

padding:35px 20px;

color:var(--muted);

font-size:14px;

line-height:1.8;

}


.loading-icon{

margin-left:6px;

}


/* =====================================================
   MESSAGES
===================================================== */

.message{

display:none;

padding:13px 16px;

border-radius:10px;

margin-bottom:15px;

text-align:center;

font-size:14px;

font-weight:600;

}


.success{

background:var(--success-bg);

color:#155724;

border:1px solid #c9e8d3;

}


.error{

background:var(--danger-bg);

color:#721c24;

border:1px solid #efc7cc;

}


/* =====================================================
   MODAL
===================================================== */

.modal{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.45);

align-items:center;

justify-content:center;

z-index:2000;

padding:20px;

}


.modal.active{

display:flex;

}


.modal-box{

background:white;

width:100%;

max-width:460px;

border-radius:18px;

padding:25px;

box-shadow:
0 15px 45px rgba(0,0,0,.18);

transition:.3s;

}


.modal-box h2{

margin:0 0 22px;

font-size:21px;

font-weight:800;

color:var(--dark);

}


/* =====================================================
   FORM
===================================================== */

.form-group{

margin-bottom:16px;

}


.form-group label{

display:block;

font-weight:700;

font-size:14px;

margin-bottom:7px;

color:#444;

}


.form-group input{

width:100%;

padding:12px 13px;

border:1px solid var(--border);

border-radius:9px;

font-size:14px;

outline:none;

font-family:"Tajawal",Arial,sans-serif;

background:var(--input);

color:var(--text);

}


.form-group input::placeholder{

color:var(--muted);

}


.form-group input:focus{

border-color:var(--orange);

box-shadow:
0 0 0 3px rgba(244,123,32,.08);

}


.form-group input:disabled{

background:#F3F3F3;

color:#777;

}


/* =====================================================
   MODAL BUTTONS
===================================================== */

.buttons{

display:flex;

gap:10px;

margin-top:22px;

}


.buttons button{

flex:1;

padding:12px;

border:none;

border-radius:9px;

cursor:pointer;

font-family:"Tajawal",Arial,sans-serif;

font-size:14px;

font-weight:700;

display:flex;

align-items:center;

justify-content:center;

gap:7px;

}


.save{

background:var(--orange);

color:white;

}


.save:hover{

background:var(--orange-dark);

}


.cancel{

background:#F1F1F1;

color:#444;

}


.cancel:hover{

background:#E7E7E7;

}


.save:disabled{

opacity:.6;

cursor:not-allowed;

}


/* =====================================================
   NIGHT MODE
===================================================== */

body.dark-mode{

--bg:var(--night);

--card:var(--night-2);

--dark:var(--night-text);

--dark-2:#DDEBFA;

--text:#DCE9F7;

--muted:var(--night-muted);

--border:var(--night-border);

--sidebar:var(--night-2);

--sidebar-hover:var(--night-3);

--input:var(--night-input);

--table-head:var(--night-3);

--table-hover:var(--night-hover);

--shadow:
0 5px 22px rgba(0,0,0,.25);

}


body.dark-mode .sidebar{

color:#DDEBFA;

border-left-color:var(--night-border);

box-shadow:-4px 0 18px rgba(0,0,0,.22);

}


body.dark-mode .menu a{

color:#B9CBE0;

}


body.dark-mode .menu a:hover{

color:white;

}


body.dark-mode .menu a.active{

background:var(--orange);

color:white;

}


body.dark-mode .topbar{

background:var(--night-2);

border-bottom-color:var(--night-border);

box-shadow:
0 2px 14px rgba(0,0,0,.22);

}


body.dark-mode .store-label{

color:#8FA8C2;

}


body.dark-mode .store-top-name{

color:var(--night-text);

}


body.dark-mode .store-image{

background:#173454;

border-color:#315A83;

}


body.dark-mode .theme-toggle{

background:#17385F;

border-color:#315A83;

color:#DCEBFF;

}


body.dark-mode .theme-toggle:hover{

background:#214C7D;

color:white;

}


body.dark-mode .view-store-btn{

background:#193553;

border-color:#315A83;

color:#BFD8F2;

}


body.dark-mode .view-store-btn:hover{

background:var(--orange);

color:white;

border-color:var(--orange);

}


body.dark-mode .search{

background:var(--night-input);

color:var(--night-text);

border-color:var(--night-border);

}


body.dark-mode .search:focus{

background:#153657;

}


body.dark-mode .search-icon{

color:#9FB4CC;

}


body.dark-mode .search:focus + .search-icon{

color:var(--orange);

}


body.dark-mode .table-container{

border-color:var(--night-border);

}


body.dark-mode th{

color:#DCE9F7;

}


body.dark-mode td{

color:#DCE9F7;

}


body.dark-mode .price{

color:#FFB56E;

}


body.dark-mode .edit-btn{

background:#193553;

color:#BFD8F2;

}


body.dark-mode .edit-btn:hover{

background:#244B73;

}


body.dark-mode .delete-btn{

background:#492936;

color:#FFB8C1;

}


body.dark-mode .delete-btn:hover{

background:#613441;

}


body.dark-mode .modal{

background:rgba(0,0,0,.65);

}


body.dark-mode .modal-box{

background:var(--night-2);

border:1px solid var(--night-border);

}


body.dark-mode .modal-box h2{

color:var(--night-text);

}


body.dark-mode .form-group label{

color:#DCE9F7;

}


body.dark-mode .form-group input{

background:var(--night-input);

color:var(--night-text);

border-color:var(--night-border);

}


body.dark-mode .form-group input:disabled{

background:#17304D;

color:#8FA8C2;

}


body.dark-mode .cancel{

background:#1B3858;

color:#DCE9F7;

}


body.dark-mode .cancel:hover{

background:#25486B;

}


body.dark-mode .empty{

color:#9FB4CC;

}


body.dark-mode ::-webkit-scrollbar-track{

background:#0A1B31;

}


body.dark-mode ::-webkit-scrollbar-thumb{

background:#315170;

}


body.dark-mode ::-webkit-scrollbar-thumb:hover{

background:var(--orange);

}


/* =====================================================
   MOBILE TOP BAR
===================================================== */

@media(max-width:700px){

.sidebar{

width:60px;

}


.sidebar:hover{

width:200px;

}


.topbar{

right:60px;

height:68px;

padding:0 12px;

}


.store-image{

width:42px;

height:42px;

}


.store-top-name{

font-size:14px;

max-width:150px;

}


.view-store-btn{

padding:8px 10px;

font-size:11px;

}


.theme-toggle{

width:40px;

height:40px;

font-size:18px;

}


.top-actions{

gap:6px;

}


.content{

margin-right:60px;

padding:83px 12px 20px;

}


.box{

padding:15px;

}


.top{

align-items:stretch;

}


.top h2{

font-size:19px;

}


.top-buttons{

width:100%;

}


.add-btn{

flex:1;

}

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:500px){

.store-label{

display:none;

}


.store-top-name{

max-width:145px;

}


.view-store-btn{

font-size:0;

width:40px;

height:40px;

padding:0;

justify-content:center;

}


.view-store-btn i{

font-size:18px;

}

}


@media(max-width:400px){

.sidebar{

width:58px;

}


.sidebar:hover{

width:190px;

}


.topbar{

right:58px;

}


.content{

margin-right:58px;

padding:80px 9px 20px;

}


.store-image{

width:40px;

height:40px;

}


.store-top-name{

font-size:13px;

max-width:110px;

}


.box{

padding:12px;

}


.top-buttons{

flex-direction:column;

}


.add-btn{

width:100%;

}


.top-actions{

gap:5px;

}


.theme-toggle{

width:38px;

height:38px;

font-size:17px;

}


}


/* =====================================================
   SCROLLBAR
===================================================== */

::-webkit-scrollbar{

width:7px;

height:7px;

}


::-webkit-scrollbar-track{

background:#F1F1F1;

}


::-webkit-scrollbar-thumb{

background:#CCC;

border-radius:10px;

}


::-webkit-scrollbar-thumb:hover{

background:var(--orange);

}

</style>

</head>

<script type="module">


/* =====================================================
   THEME
===================================================== */

const themeToggle =
document.getElementById("themeToggle");


function applyTheme(){

const savedTheme =
localStorage.getItem("g-glam-theme");


if(savedTheme === "dark"){

document.body.classList.add(
"dark-mode"
);

themeToggle.innerHTML =
'<i class="fa-solid fa-sun"></i>';

themeToggle.title =
"الوضع النهاري";

themeToggle.setAttribute(
"aria-label",
"تفعيل الوضع النهاري"
);

}else{

document.body.classList.remove(
"dark-mode"
);

themeToggle.innerHTML =
'<i class="fa-solid fa-moon"></i>';

themeToggle.title =
"الوضع الليلي";

themeToggle.setAttribute(
"aria-label",
"تفعيل الوضع الليلي"
);

}

}


applyTheme();


themeToggle.addEventListener(
"click",
function(){

const isDark =
document.body.classList.toggle(
"dark-mode"
);


if(isDark){

localStorage.setItem(
"g-glam-theme",
"dark"
);

themeToggle.innerHTML =
'<i class="fa-solid fa-sun"></i>';

themeToggle.title =
"الوضع النهاري";

themeToggle.setAttribute(
"aria-label",
"تفعيل الوضع النهاري"
);

}else{

localStorage.setItem(
"g-glam-theme",
"light"
);

themeToggle.innerHTML =
'<i class="fa-solid fa-moon"></i>';

themeToggle.title =
"الوضع الليلي";

themeToggle.setAttribute(
"aria-label",
"تفعيل الوضع الليلي"
);

}

});


/* =====================================================
   IMPORTS
===================================================== */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {

getFirestore,
collection,
getDocs,
doc,
setDoc,
deleteDoc,
getDoc

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


import {

getAuth,
onAuthStateChanged,
signOut

}

from

"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


const auth =
getAuth(app);


/* =====================================================
   ELEMENTS
===================================================== */

const list =
document.getElementById("deliveryList");

const searchInput =
document.getElementById("searchInput");

const modal =
document.getElementById("modal");

const wilayaInput =
document.getElementById("wilaya");

const officeInput =
document.getElementById("office");

const homeInput =
document.getElementById("home");

const modalTitle =
document.getElementById("modalTitle");

const saveBtn =
document.getElementById("saveBtn");

const topStoreName =
document.getElementById("topStoreName");

const topStoreImage =
document.getElementById("topStoreImage");

const viewStoreBtn =
document.getElementById("viewStoreBtn");


/* =====================================================
   VARIABLES
===================================================== */

let editingId = null;

let deliveryItems = [];

let currentUser = null;

let currentStore = null;


/* =====================================================
   LOAD AUTH + STORE
===================================================== */

onAuthStateChanged(

auth,

async function(user){

if(!user){

window.location.href =
"login.html";

return;

}


currentUser =
user;


try{

/* =====================================================
   FIND STORE
===================================================== */

let storeSnapshot =
await getDoc(

doc(
db,
"stores",
user.uid
)

);


/* =====================================================
   FALLBACK OWNER UID
===================================================== */

if(!storeSnapshot.exists()){

const storesSnapshot =
await getDocs(
collection(
db,
"stores"
)
);


const found =
storesSnapshot.docs.find(

item => {

const data =
item.data();

return (

data.ownerUid === user.uid ||

data.ownerId === user.uid ||

data.ownerEmail === user.email

);

});


if(found){

storeSnapshot =
found;

}

}


/* =====================================================
   STORE FOUND
===================================================== */

if(
storeSnapshot.exists()
){

const store =
storeSnapshot.data();

currentStore =
store;


/* =====================================================
   STORE NAME
===================================================== */

const name =

store.storeName ||

store.name ||

store.title ||

"G-Glam";


topStoreName.textContent =
name;


/* =====================================================
   TOP STORE IMAGE
===================================================== */

const logo =

store.storeImage ||

store.image ||

store.logo ||

store.storeLogo ||

store.logoUrl ||

store.photoURL ||

"";


if(logo){

topStoreImage.src =
logo;

}else{

topStoreImage.src =
"logotrans.png";

}


/* =====================================================
   VIEW STORE
===================================================== */

const storeId =

store.storeId ||

store.id ||

store.ownerUid ||

user.uid;


viewStoreBtn.href =
"index.html?store=" +
encodeURIComponent(
storeId
);


/* =====================================================
   LOCAL STORAGE
===================================================== */

localStorage.setItem(
"storeId",
user.uid
);

localStorage.setItem(
"storeDocumentId",
storeSnapshot.id
);

localStorage.setItem(
"storeName",
name
);

localStorage.setItem(
"storeOwnerEmail",
store.ownerEmail ||
store.email ||
user.email ||
""
);

localStorage.setItem(
"ownerEmail",
store.ownerEmail ||
store.email ||
user.email ||
""
);

localStorage.setItem(
"ownerUid",
user.uid
);

}


/* =====================================================
   STORE NOT FOUND
===================================================== */

else{

topStoreName.textContent =
"G-Glam";

topStoreImage.src =
"logotrans.png";

viewStoreBtn.href =
"index.html?store=" +
encodeURIComponent(
user.uid
);

}


await loadDelivery();


}catch(error){

console.error(
"AUTH / STORE ERROR:",
error
);


showMessage(

"حدث خطأ أثناء تحميل بيانات المتجر: " +
error.message,

false

);

}

});


/* =====================================================
   LOAD DELIVERY
===================================================== */

async function loadDelivery(){

list.innerHTML = `

<tr>

<td
colspan="5"
class="empty">

<i class="fa-solid fa-spinner fa-spin loading-icon"></i>

جاري تحميل الولايات...

</td>

</tr>

`;


try{

const snapshot =
await getDocs(

collection(
db,
"delivery"
)

);


deliveryItems = [];


snapshot.forEach(

item=>{

deliveryItems.push({

id:item.id,

...item.data()

});

});


displayDelivery();


}catch(error){

console.error(
"DELIVERY LOAD ERROR:",
error
);


list.innerHTML = `

<tr>

<td
colspan="5"
class="empty">

<i class="fa-solid fa-circle-exclamation"></i>

حدث خطأ أثناء تحميل أسعار التوصيل.

<br><br>

${escapeHtml(
error.message
)}

</td>

</tr>

`;

}

}


/* =====================================================
   DISPLAY DELIVERY
===================================================== */

function displayDelivery(){

const value =
searchInput.value
.trim()
.toLowerCase();


const filtered =
deliveryItems.filter(

item =>

item.id
.toLowerCase()
.includes(value)

);


list.innerHTML = "";


if(
filtered.length === 0
){

list.innerHTML = `

<tr>

<td
colspan="5"
class="empty">

<i class="fa-solid fa-inbox"></i>

<br>

لا توجد ولاية مطابقة للبحث.

</td>

</tr>

`;

return;

}


filtered.forEach(

(item,index)=>{

const number =
index + 1;


const row =
document.createElement("tr");


row.innerHTML = `

<td>

<strong>

${String(number).padStart(2,"0")}

</strong>

</td>


<td>

<strong>

${escapeHtml(item.id)}

</strong>

</td>


<td>

<span class="price">

${Number(item.office || 0)} DA

</span>

</td>


<td>

<span class="price">

${Number(item.home || 0)} DA

</span>

</td>


<td>

<button
class="edit-btn"
data-action="edit"
data-id="${escapeAttribute(item.id)}">

<i class="fa-solid fa-pen"></i>

<span>
تعديل
</span>

</button>


<button
class="delete-btn"
data-action="delete"
data-id="${escapeAttribute(item.id)}">

<i class="fa-solid fa-trash"></i>

<span>
حذف
</span>

</button>

</td>

`;


list.appendChild(row);

});

}


/* =====================================================
   ADD WILAYA
===================================================== */

document
.getElementById("addBtn")
.addEventListener(

"click",

()=>{

editingId = null;

modalTitle.textContent =
"إضافة ولاية";

wilayaInput.value = "";

officeInput.value = "";

homeInput.value = "";

wilayaInput.disabled = false;

modal.classList.add("active");

wilayaInput.focus();

});


/* =====================================================
   CLOSE MODAL
===================================================== */

document
.getElementById("cancelBtn")
.addEventListener(
"click",
closeModal
);


function closeModal(){

modal.classList.remove(
"active"
);

}


modal.addEventListener(

"click",

function(event){

if(event.target === modal){

closeModal();

}

});


/* =====================================================
   TABLE ACTIONS
===================================================== */

list.addEventListener(

"click",

async function(event){

const button =
event.target.closest("button");


if(!button)
return;


const id =
button.dataset.id;

const action =
button.dataset.action;


if(action === "edit"){

const item =
deliveryItems.find(
x => x.id === id
);


if(!item){

alert(
"لم يتم العثور على الولاية."
);

return;

}


editingId = id;

modalTitle.textContent =
"تعديل أسعار " + id;

wilayaInput.value =
id;

officeInput.value =
item.office ?? 0;

homeInput.value =
item.home ?? 0;

wilayaInput.disabled =
true;

modal.classList.add("active");

officeInput.focus();

}


if(action === "delete"){

const ok =
confirm(

"هل تريد حذف أسعار التوصيل لولاية:\n\n" +
id +
"؟"

);


if(!ok)
return;


try{

await deleteDoc(

doc(
db,
"delivery",
id
)

);


showMessage(
"تم حذف الولاية بنجاح",
true
);


await loadDelivery();


}catch(error){

console.error(
"DELETE ERROR:",
error
);


showMessage(

"حدث خطأ أثناء الحذف: " +
error.message,

false

);

}

}

});


/* =====================================================
   SAVE DELIVERY
===================================================== */

saveBtn.addEventListener(

"click",

async function(){

const wilaya =
wilayaInput.value.trim();

const officeValue =
officeInput.value;

const homeValue =
homeInput.value;


if(!wilaya){

alert(
"يرجى إدخال اسم الولاية."
);

return;

}


if(
officeValue === "" ||
homeValue === ""
){

alert(
"يرجى إدخال سعر المكتب والمنزل."
);

return;

}


const office =
Number(officeValue);

const home =
Number(homeValue);


if(

isNaN(office) ||
isNaN(home) ||
office < 0 ||
home < 0

){

alert(
"يرجى إدخال أسعار صحيحة."
);

return;

}


try{

saveBtn.disabled = true;

saveBtn.innerHTML =
'<i class="fa-solid fa-spinner fa-spin"></i><span>جاري الحفظ...</span>';


if(!editingId){

const exists =
deliveryItems.some(

item =>

item.id.toLowerCase() ===
wilaya.toLowerCase()

);


if(exists){

alert(
"هذه الولاية موجودة بالفعل."
);

saveBtn.disabled = false;

saveBtn.innerHTML =
'<i class="fa-solid fa-floppy-disk"></i><span>حفظ</span>';

return;

}


await setDoc(

doc(
db,
"delivery",
wilaya
),

{

office:office,

home:home

}

);


showMessage(
"تمت إضافة الولاية بنجاح",
true
);


}else{

await setDoc(

doc(
db,
"delivery",
editingId
),

{

office:office,

home:home

}

);


showMessage(
"تم تعديل الأسعار بنجاح",
true
);

}


closeModal();

await loadDelivery();


}catch(error){

console.error(
"SAVE ERROR:",
error
);


showMessage(

"حدث خطأ أثناء الحفظ: " +
error.message,

false

);


}finally{

saveBtn.disabled = false;

saveBtn.innerHTML =
'<i class="fa-solid fa-floppy-disk"></i><span>حفظ</span>';

}

});


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
"input",
displayDelivery
);


/* =====================================================
   LOGOUT
===================================================== */

document
.getElementById("logoutBtn")
.addEventListener(

async function(event){

event.preventDefault();

localStorage.removeItem(

);

);

);

}catch(error){

"LOGOUT ERROR:",
error
);


alert(
"تعذر تسجيل الخروج."
);

}

});


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
text,
success
){

const element =
document.getElementById(
success
?
"success"
:
"error"
);


const other =
document.getElementById(
success
?
"error"
:
"success"
);


other.style.display =
"none";


element.textContent =
text;

element.style.display =
"block";


setTimeout(

()=>{

element.style.display =
"none";

},

3500

);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


function escapeAttribute(value){

return escapeHtml(value);

}

);

</script>
