/* =====================================================
   COLORS
===================================================== */

:root{

--orange:#F47B20;

--bg:#F7F7F7;

--dark:#222222;
--dark-2:#333333;

--text:#333333;
--muted:#888888;

--border:#E9E9E9;

--success:#198754;
--success-bg:#E5F5EC;

--danger:#DC3545;
--danger-bg:#FBE7EA;

--shadow:0 4px 18px rgba(0,0,0,.06);

}


/* =====================================================
   RESET
===================================================== */

*{

box-sizing:border-box;

margin:0;
padding:0;

font-family:"Tajawal",sans-serif;

}


/* =====================================================
   BODY
===================================================== */

body{

margin:0;

background:var(--bg);

color:var(--text);

min-height:100vh;

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

position:fixed;

right:0;
top:0;

height:100vh;

width:75px;

background:var(--dark);

color:white;

overflow:hidden;

transition:.3s;

z-index:1000;

box-shadow:-4px 0 20px rgba(0,0,0,.08);

}

.sidebar:hover{

width:240px;

}


/* =====================================================
   LOGO
===================================================== */

.logo{

height:78px;

display:flex;

align-items:center;

justify-content:center;

font-size:23px;

font-weight:800;

border-bottom:1px solid #3a3a3a;

white-space:nowrap;

}

.logo span{

color:var(--orange);

}


/* =====================================================
   MENU
===================================================== */

.menu{

margin-top:18px;

padding:0 10px;

}

.menu a{

display:flex;

align-items:center;

gap:15px;

height:52px;

padding:0 10px;

margin-bottom:7px;

border-radius:12px;

color:#ddd;

text-decoration:none;

white-space:nowrap;

transition:.2s;

}

.menu a:hover{

background:#333;

color:white;

}

.menu a.active{

background:var(--orange);

color:white;

box-shadow:
0 5px 15px rgba(244,123,32,.25);

}

.icon{

min-width:35px;

text-align:center;

font-size:20px;

}

.text{

opacity:0;

transition:.25s;

font-size:14px;

font-weight:bold;

}

.sidebar:hover .text{

opacity:1;

}


/* =====================================================
   CONTENT
===================================================== */

.content{

margin-right:75px;

padding:25px;

transition:.3s;

}


/* =====================================================
   HEADER
===================================================== */

.header{

background:var(--card);

border:1px solid var(--border);

border-radius:18px;

padding:25px;

box-shadow:var(--shadow);

margin-bottom:22px;

position:relative;

overflow:hidden;

}

.header::before{

content:"";

position:absolute;

right:0;

top:0;

width:5px;

height:100%;

background:var(--orange);

}

.header h1{

font-size:27px;

color:var(--dark-2);

margin-bottom:8px;

}

.header p{

color:var(--muted);

font-size:14px;

}


/* =====================================================
   BOX
===================================================== */

.box{

background:white;

border:1px solid var(--border);

padding:22px;

border-radius:18px;

box-shadow:var(--shadow);

}


/* =====================================================
   TOP
===================================================== */

.top{

display:flex;

justify-content:space-between;

align-items:center;

gap:10px;

margin-bottom:20px;

flex-wrap:wrap;

}

.top h2{

margin:0;

font-size:21px;

color:var(--dark);

}

.top-buttons{

display:flex;

gap:10px;

flex-wrap:wrap;

}


/* =====================================================
   BUTTONS
===================================================== */

.add-btn,
.import-btn{

border:none;

padding:11px 18px;

border-radius:11px;

cursor:pointer;

font-size:14px;

font-weight:bold;

transition:.2s;

}

.add-btn{

background:var(--orange);

color:white;

box-shadow:
0 4px 10px rgba(244,123,32,.18);

}

.add-btn:hover{

background:var(--orange-dark);

transform:translateY(-1px);

}

.import-btn{

background:#FFF1E6;

color:var(--orange-dark);

border:1px solid #FFE0C7;

}

.import-btn:hover{

background:#FFE2CC;

}

.import-btn:disabled{

opacity:.6;

cursor:not-allowed;

}


/* =====================================================
   SEARCH
===================================================== */

.search{

width:100%;

padding:13px 15px;

border:1px solid var(--border);

border-radius:11px;

font-size:14px;

margin-bottom:18px;

outline:none;

background:#fff;

transition:.2s;

}

.search:focus{

border-color:var(--orange);

box-shadow:
0 0 0 3px rgba(244,123,32,.10);

}


/* =====================================================
   TABLE
===================================================== */

.table-container{

overflow-x:auto;

}

table{

width:100%;

border-collapse:collapse;

min-width:650px;

}

th,
td{

padding:14px 10px;

border-bottom:1px solid var(--border);

text-align:center;

}

th{

background:#FAFAFA;

color:var(--dark);

font-size:14px;

}

td{

}

tbody tr{

transition:.2s;

}

tbody tr:hover{

border:none;

padding:8px 12px;

border-radius:8px;

cursor:pointer;

margin-left:5px;

font-family:"Tajawal",sans-serif;

font-weight:bold;

}

.edit-btn:hover{

background:#FFE2CC;

}

.delete-btn{

background:var(--danger-bg);

color:#B52B39;

border:none;

padding:8px 12px;

border-radius:8px;

cursor:pointer;

font-family:"Tajawal",sans-serif;

font-weight:bold;

}

.delete-btn:hover{

background:#F6D1D6;

}


/* =====================================================
   EMPTY
===================================================== */

.empty{

text-align:center;

padding:35px 20px;

color:var(--muted);

line-height:1.8;

}


/* =====================================================
   MESSAGES
===================================================== */

.message{

display:none;

padding:13px 15px;

border-radius:11px;

margin-bottom:15px;

text-align:center;

font-size:14px;

}

.success{

background:var(--success-bg);

color:#155724;

border:1px solid #c5e8d3;

}

.error{

background:var(--danger-bg);

color:#721c24;

border:1px solid #efc7cc;

}


/* =====================================================
   MODAL
===================================================== */

.modal{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.5);

align-items:center;

justify-content:center;

z-index:2000;

padding:20px;

}

.modal.active{

display:flex;

}

.modal-box{

background:white;

width:100%;

max-width:450px;

border-radius:18px;

padding:25px;

box-shadow:
0 15px 50px rgba(0,0,0,.15);

}

.modal-box h2{

margin-top:0;

margin-bottom:20px;

color:var(--dark);

}

.form-group{

margin-bottom:15px;

}

.form-group label{

display:block;

font-weight:bold;

margin-bottom:7px;

font-size:14px;

}

.form-group input{

width:100%;

padding:12px;

border:1px solid var(--border);

border-radius:9px;

font-size:14px;

outline:none;

}

.form-group input:focus{

border-color:var(--orange);

box-shadow:
0 0 0 3px rgba(244,123,32,.10);

}

.form-group input:disabled{

background:#eee;

}

.buttons{

display:flex;

gap:10px;

margin-top:20px;

.buttons button{

flex:1;

padding:12px;

border:none;

border-radius:9px;

cursor:pointer;

font-family:"Tajawal",sans-serif;

font-weight:bold;

.save{

background:var(--orange);

background:var(--orange-dark);

.cancel{

/* =====================================================

@media(max-width:700px){

font-size:22px;

.box{

padding:15px;

align-items:stretch;

width:100%;

.add-btn,

/* =====================================================

::-webkit-scrollbar{

width:7px;

height:7px;

::-webkit-scrollbar-track{

background:#f1f1f1;

}

::-webkit-scrollbar-thumb{

background:#ccc;

border-radius:10px;

}

::-webkit-scrollbar-thumb:hover{

background:var(--orange);

}

</style>

);


/* =====================================================
   VARIABLES
===================================================== */

let editingId = null;

let deliveryItems = [];


/* =====================================================
   LOAD
===================================================== */

async function loadDelivery(){

list.innerHTML = `

<tr>

<td
colspan="5"
class="empty">

⏳ جاري التحميل...

</td>

</tr>

`;


try{

const snapshot =
await getDocs(
collection(
db,
"delivery"
)
);


deliveryItems = [];


snapshot.forEach(
item=>{

deliveryItems.push({

id:item.id,

...item.data()

});

});


deliveryItems.sort(
(a,b)=>{

const indexA =
wilayaOrder.indexOf(a.id);

const indexB =
wilayaOrder.indexOf(b.id);


if(indexA === -1)
return 1;


if(indexB === -1)
return -1;


return indexA-indexB;

});


displayDelivery();


}catch(error){

console.error(error);


list.innerHTML = `

<tr>

<td
colspan="5"
class="empty">

❌ حدث خطأ أثناء تحميل الأسعار

<br><br>

${escapeHtml(
error.message
)}

</td>

</tr>

`;

}

}


/* =====================================================
   DISPLAY
===================================================== */

function displayDelivery(){

const value =
searchInput.value
.trim()
.toLowerCase();


const filtered =
deliveryItems.filter(
item=>
item.id
.toLowerCase()
.includes(value)
);


list.innerHTML = "";


if(filtered.length === 0){

list.innerHTML = `

<tr>

<td
colspan="5"
class="empty">

📭 لا توجد ولاية

</td>

</tr>

`;

return;

}


filtered.forEach(
(item,index)=>{

const originalIndex =
wilayaOrder.indexOf(
item.id
);


const number =
originalIndex === -1
? index + 1
: originalIndex + 1;


const row =
document.createElement(
"tr"
);


row.innerHTML = `

<td>

<strong>

${String(
number
).padStart(2,"0")}

</strong>

</td>


<td>

<strong>

${escapeHtml(
item.id
)}

</strong>

</td>


<td>

${Number(
item.office || 0
)} DA

</td>


<td>

${Number(
item.home || 0
)} DA

</td>


<td>

<button
class="edit-btn"
data-action="edit"
data-id="${escapeAttribute(
item.id
)}">

✏️ تعديل

</button>


<button
class="delete-btn"
data-action="delete"
data-id="${escapeAttribute(
item.id
)}">

🗑️ حذف

</button>

</td>

`;


list.appendChild(row);

});

}

officeInput.value = "";

homeInput.value = "";


wilayaInput.disabled = false;


modal.classList.add(
"active"

});

   CANCEL
===================================================== */

document
.getElementById(
"cancelBtn"
)
.addEventListener(
"click",
closeModal
);


function closeModal(){

modal.classList.remove(
"active"
);

}

/* =====================================================
   ORDER
===================================================== */

const wilayaOrder =
Object.keys(tarifs);


/* =====================================================
   ELEMENTS
===================================================== */

const list =
document.getElementById("deliveryList");

const searchInput =
document.getElementById("searchInput");

const modal =
document.getElementById("modal");

const wilayaInput =
document.getElementById("wilaya");

const officeInput =
document.getElementById("office");

const homeInput =
document.getElementById("home");

const modalTitle =
document.getElementById("modalTitle");

const saveBtn =
document.getElementById("saveBtn");

let editingId = null;

let deliveryItems = [];


/* =====================================================
   LOAD
===================================================== */

async function loadDelivery(){

list.innerHTML = `

<tr>

<td colspan="5"
class="empty">

⏳ جاري التحميل...

</td>

</tr>

`;

try{

const snapshot =
await getDocs(
collection(db,"delivery")
);

deliveryItems = [];


snapshot.forEach(item=>{

deliveryItems.push({

id:item.id,
...item.data()

});

});


deliveryItems.sort((a,b)=>{

const indexA =
wilayaOrder.indexOf(a.id);

const indexB =
wilayaOrder.indexOf(b.id);


if(indexA === -1)
return 1;


if(indexB === -1)
return -1;


return indexA - indexB;

});


displayDelivery();


}

catch(error){

console.error(error);


list.innerHTML = `

<tr>

<td colspan="5"
class="empty">

❌ حدث خطأ أثناء تحميل الأسعار

<br><br>

${escapeHtml(error.message)}

</td>

</tr>

`;

}

}


/* =====================================================
   DISPLAY
===================================================== */

function displayDelivery(){

const value =
searchInput.value
.trim()
.toLowerCase();


const filtered =
deliveryItems.filter(item=>

item.id
.toLowerCase()
.includes(value)

);


list.innerHTML = "";


if(filtered.length === 0){

list.innerHTML = `

<tr>

<td colspan="5"
class="empty">

📭 لا توجد ولاية

</td>

</tr>

`;

return;

}


filtered.forEach((item,index)=>{

const originalIndex =
wilayaOrder.indexOf(item.id);


const number =
originalIndex === -1
? index + 1
: originalIndex + 1;


const row =
document.createElement("tr");


row.innerHTML = `

<td>

<strong>

${String(number).padStart(2,"0")}

</strong>

</td>


<td>

<strong>

${escapeHtml(item.id)}

</strong>

</td>


<td>

${Number(item.office || 0)}
DA

</td>


<td>

${Number(item.home || 0)}
DA

</td>


<td>

<button

class="edit-btn"

data-action="edit"

data-id="${escapeAttribute(item.id)}">

✏️ تعديل

</button>


<button

class="delete-btn"

data-action="delete"

data-id="${escapeAttribute(item.id)}">

🗑️ حذف

</button>

</td>

`;

list.appendChild(row);

});

}


/* =====================================================
   ADD
===================================================== */

document
.getElementById("addBtn")
.addEventListener(
"click",
()=>{

editingId = null;

modalTitle.textContent =
"إضافة ولاية";

wilayaInput.value = "";

officeInput.value = "";

homeInput.value = "";

wilayaInput.disabled = false;

modal.classList.add("active");

}
);


/* =====================================================
   CANCEL
===================================================== */

document
.getElementById("cancelBtn")
.addEventListener(
"click",
closeModal
);


function closeModal(){

modal.classList.remove("active");

}


/* =====================================================
   EDIT / DELETE
===================================================== */

list.addEventListener(
"click",
async event=>{

const button =
event.target.closest("button");


if(!button)
return;


const id =
button.dataset.id;

const action =
button.dataset.action;


/* =====================================================
   EDIT
===================================================== */

if(action === "edit"){

const item =
deliveryItems.find(
x => x.id === id
);


if(!item){

alert(
"لم يتم العثور على الولاية"
);

return;

}


editingId = id;

modalTitle.textContent =
"تعديل أسعار " + id;

wilayaInput.value = id;

officeInput.value =
item.office ?? 0;

homeInput.value =
item.home ?? 0;

wilayaInput.disabled = true;

modal.classList.add("active");

}


/* =====================================================
   DELETE
===================================================== */

if(action === "delete"){

const ok =
confirm(

"هل تريد حذف أسعار التوصيل لولاية:\n\n" +
id +
"؟"

);


if(!ok)
return;


try{

await deleteDoc(

doc(
db,
"delivery",
id
)

);


showMessage(
"تم حذف الولاية بنجاح ✅",
true
);


await loadDelivery();


}

catch(error){

console.error(error);


showMessage(

"حدث خطأ أثناء الحذف: " +
error.message,

false

);

}

}

}
);


/* =====================================================
   SAVE
===================================================== */

saveBtn.addEventListener(
"click",
async()=>{

const wilaya =
wilayaInput.value.trim();

const officeValue =
officeInput.value;

const homeValue =
homeInput.value;


if(!wilaya){

alert(
"يرجى إدخال اسم الولاية"
);

return;

}


if(
officeValue === "" ||
homeValue === ""
){

alert(
"يرجى إدخال سعر المكتب والمنزل"
);

return;

}


const office =
Number(officeValue);

const home =
Number(homeValue);


if(
isNaN(office) ||
isNaN(home) ||
office < 0 ||
home < 0
){

alert(
"يرجى إدخال أسعار صحيحة"
);

return;

}


try{

saveBtn.disabled = true;

saveBtn.textContent =
"⏳ جاري الحفظ...";


/* =====================================================
   ADD
===================================================== */

if(!editingId){

const exists =
deliveryItems.some(
item =>
item.id.toLowerCase() ===
wilaya.toLowerCase()
);


if(exists){

alert(
"هذه الولاية موجودة بالفعل"
);

saveBtn.disabled = false;

saveBtn.textContent =
"💾 حفظ";

return;

}


await setDoc(

doc(
db,
"delivery",
wilaya
),

{

office: office,

home: home

}

);


showMessage(
"تمت إضافة الولاية بنجاح ✅",
true
);

}


/* =====================================================
   EDIT
===================================================== */

else{

await setDoc(

doc(
db,
"delivery",
editingId
),

{

office: office,

home: home

}

);


showMessage(
"تم تعديل الأسعار بنجاح ✅",
true
);

}


closeModal();

await loadDelivery();


}

catch(error){

console.error(error);


showMessage(

"❌ حدث خطأ: " +
error.message,

false

);

}

finally{

saveBtn.disabled = false;

saveBtn.textContent =
"💾 حفظ";

}

}
);


/* =====================================================
   IMPORT
===================================================== */

document
.getElementById("importBtn")
.addEventListener(
"click",
importTarifs
);


async function importTarifs(){

const ok =
confirm(

"سيتم استيراد جميع الولايات والأسعار الحالية إلى Firebase.\n\n" +

"إذا كانت الولاية موجودة سيتم تحديث سعرها.\n\n" +

"هل تريد المتابعة؟"

);


if(!ok)
return;


const button =
document.getElementById("importBtn");


button.disabled = true;

button.textContent =
"⏳ جاري الاستيراد...";


try{

let count = 0;


for(
const [wilaya,prices]
of Object.entries(tarifs)
){

await setDoc(

doc(
db,
"delivery",
wilaya
),

{

office: prices.office,

home: prices.home

}

);


count++;

}


showMessage(

"تم استيراد " +
count +
" ولاية بنجاح ✅",

true

);


await loadDelivery();


}

catch(error){

console.error(error);


showMessage(

"❌ فشل الاستيراد: " +
error.message,

false

);

}

finally{

button.disabled = false;

button.textContent =
"📥 استيراد الأسعار الحالية";

}

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
"input",
displayDelivery
);


/* =====================================================
   MESSAGES
===================================================== */

function showMessage(
text,
success
){

const element =
document.getElementById(
success
? "success"
: "error"
);


const other =
document.getElementById(
success
? "error"
: "success"
);


other.style.display =
"none";


element.textContent =
text;


element.style.display =
"block";


setTimeout(()=>{

element.style.display =
"none";

},3000);

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

return String(value ?? "")

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


function escapeAttribute(value){

return escapeHtml(value);

}


/* =====================================================
   START
===================================================== */

loadDelivery();

</script>
