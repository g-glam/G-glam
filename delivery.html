<style>

:root{

--orange:#F47B20;
--orange-dark:#DF6810;

--bg:#F7F7F7;
--card:#FFFFFF;

--dark:#222;
--text:#333;
--muted:#888;

--border:#E9E9E9;

--sidebar:#EEEEEE;
--sidebar-hover:#E3E3E3;

--input:#FCFCFC;

--table-head:#FAFAFA;
--table-hover:#FFF9F5;

--success:#198754;
--success-bg:#E5F5EC;

--danger:#DC3545;
--danger-bg:#FBE7EA;

--night:#0B1F3A;
--night-2:#102B4F;
--night-3:#163A67;
--night-text:#EAF3FF;
--night-muted:#9FB4CC;
--night-border:#24476F;
--night-input:#102A49;

--shadow:0 4px 18px rgba(0,0,0,.06);

}

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:"Tajawal",Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
min-height:100vh;
transition:.3s;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

position:fixed;

right:0;
top:0;

height:100vh;

width:75px;

background:var(--sidebar);

overflow:hidden;

transition:.3s;

z-index:1100;

box-shadow:-3px 0 15px rgba(0,0,0,.04);

border-left:1px solid var(--border);

}

.sidebar:hover{
width:240px;
}

.logo{

height:78px;

display:flex;

align-items:center;

justify-content:center;

border-bottom:1px solid var(--border);

padding:10px;

}

.logo img{

width:48px;
height:48px;

object-fit:contain;

transition:.3s;

}

.sidebar:hover .logo img{

width:130px;
height:55px;

}

.menu{

margin-top:18px;

padding:0 10px;

}

.menu a{

display:flex;

align-items:center;

gap:15px;

height:52px;

padding:0 10px;

margin-bottom:7px;

border-radius:12px;

color:#555;

text-decoration:none;

white-space:nowrap;

transition:.2s;

}

.menu a:hover{

background:var(--sidebar-hover);

color:#222;

}

.menu a.active{

background:var(--orange);

color:white;

box-shadow:0 5px 15px rgba(244,123,32,.22);

}

.icon{

min-width:35px;

width:35px;

height:35px;

display:flex;

align-items:center;

justify-content:center;

font-size:18px;

}

.text{

opacity:0;

transition:.25s;

font-size:14px;

font-weight:700;

}

.sidebar:hover .text{
opacity:1;
}


/* =====================================================
   TOPBAR
===================================================== */

.topbar{

position:fixed;

top:0;

right:75px;

left:0;

height:78px;

background:white;

border-bottom:1px solid var(--border);

display:flex;

align-items:center;

justify-content:space-between;

padding:0 25px;

z-index:1000;

box-shadow:0 2px 12px rgba(0,0,0,.04);

}

.store-top{

display:flex;

align-items:center;

gap:12px;

min-width:0;

}

.store-image{

width:48px;

height:48px;

border-radius:50%;

object-fit:cover;

background:#F1F1F1;

border:2px solid #FFE0C8;

}

.store-details{

display:flex;

flex-direction:column;

min-width:0;

}

.store-label{

font-size:11px;

color:#999;

margin-bottom:2px;

}

.store-top-name{

font-size:16px;

font-weight:800;

color:#222;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

max-width:250px;

}

.top-actions{

display:flex;

align-items:center;

gap:9px;

}

.theme-toggle{

width:43px;

height:43px;

border:none;

border-radius:12px;

background:#EEF3F9;

color:var(--night);

display:flex;

align-items:center;

justify-content:center;

font-size:18px;

cursor:pointer;

border:1px solid #DCE5EF;

}

.view-store-btn{

display:flex;

align-items:center;

gap:7px;

background:#FFF1E6;

color:var(--orange-dark);

text-decoration:none;

padding:10px 15px;

border-radius:11px;

font-size:13px;

font-weight:700;

border:1px solid #FFE0CA;

}


/* =====================================================
   CONTENT
===================================================== */

.content{

margin-right:75px;

padding:103px 25px 25px;

}

.box{

background:var(--card);

border:1px solid var(--border);

border-radius:18px;

padding:22px;

box-shadow:var(--shadow);

}

.top{

display:flex;

align-items:center;

justify-content:space-between;

gap:15px;

margin-bottom:20px;

flex-wrap:wrap;

}

.top h2{

font-size:21px;

font-weight:800;

color:var(--dark);

}

.add-btn{

border:none;

padding:11px 17px;

border-radius:10px;

cursor:pointer;

font-size:14px;

font-weight:700;

background:var(--orange);

color:white;

display:flex;

align-items:center;

justify-content:center;

gap:8px;

}

.add-btn:hover{

background:var(--orange-dark);

}


/* =====================================================
   MESSAGES
===================================================== */

.message{

display:none;

padding:13px 16px;

border-radius:10px;

margin-bottom:15px;

text-align:center;

font-size:14px;

font-weight:600;

}

.success{

background:var(--success-bg);

color:#155724;

border:1px solid #c9e8d3;

}

.error{

background:var(--danger-bg);

color:#721c24;

border:1px solid #efc7cc;

}


/* =====================================================
   SEARCH
===================================================== */

.search-wrapper{

position:relative;

width:100%;

margin-bottom:18px;

}

.search{

width:100%;

padding:13px 45px 13px 15px;

border:1px solid var(--border);

border-radius:10px;

font-size:14px;

outline:none;

background:var(--input);

color:var(--text);

}

.search:focus{

border-color:var(--orange);

}

.search-icon{

position:absolute;

right:16px;

top:50%;

transform:translateY(-50%);

color:var(--muted);

pointer-events:none;

}


/* =====================================================
   TABLE
===================================================== */

.table-container{

overflow-x:auto;

border:1px solid var(--border);

border-radius:13px;

}

table{

width:100%;

border-collapse:collapse;

min-width:700px;

background:var(--card);

}

th,
td{

padding:14px 10px;

border-bottom:1px solid var(--border);

text-align:center;

font-size:14px;

}

th{

background:var(--table-head);

color:#555;

font-weight:800;

}

tbody tr:hover{

background:var(--table-hover);

}

.price{

font-weight:700;

color:var(--orange-dark);

}


/* =====================================================
   BUTTONS
===================================================== */

.edit-btn,
.delete-btn{

border:none;

padding:8px 12px;

border-radius:8px;

cursor:pointer;

font-size:13px;

font-weight:700;

display:inline-flex;

align-items:center;

justify-content:center;

gap:6px;

}

.edit-btn{

background:#FFF1E6;

color:var(--orange-dark);

margin-left:5px;

}

.delete-btn{

background:var(--danger-bg);

color:#B52B39;

}

.edit-btn:hover{

background:#FFE4D0;

}

.delete-btn:hover{

background:#F6D5DA;

}


/* =====================================================
   EMPTY
===================================================== */

.empty{

text-align:center;

padding:35px 20px;

color:var(--muted);

font-size:14px;

line-height:1.8;

}


/* =====================================================
   MODAL
===================================================== */

.modal{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.45);

align-items:center;

justify-content:center;

z-index:2000;

padding:20px;

}

.modal.active{

display:flex;

}

.modal-box{

background:white;

width:100%;

max-width:460px;

border-radius:18px;

padding:25px;

box-shadow:0 15px 45px rgba(0,0,0,.18);

}

.modal-box h2{

margin-bottom:22px;

font-size:21px;

font-weight:800;

color:var(--dark);

}

.form-group{

margin-bottom:16px;

}

.form-group label{

display:block;

font-weight:700;

font-size:14px;

margin-bottom:7px;

color:#444;

}

.form-group input{

width:100%;

padding:12px 13px;

border:1px solid var(--border);

border-radius:9px;

font-size:14px;

outline:none;

background:var(--input);

color:var(--text);

}

.form-group input:focus{

border-color:var(--orange);

}

.form-group input:disabled{

background:#F3F3F3;

color:#777;

}

.buttons{

display:flex;

gap:10px;

margin-top:22px;

}

.buttons button{

flex:1;

padding:12px;

border:none;

border-radius:9px;

cursor:pointer;

font-size:14px;

font-weight:700;

display:flex;

align-items:center;

justify-content:center;

gap:7px;

}

.save{

background:var(--orange);

color:white;

}

.cancel{

background:#F1F1F1;

color:#444;

}

.save:hover{

background:var(--orange-dark);

}

.save:disabled{

opacity:.6;

cursor:not-allowed;

}


/* =====================================================
   DARK MODE
===================================================== */

body.dark-mode{

--bg:var(--night);

--card:var(--night-2);

--dark:var(--night-text);

--text:#DCE9F7;

--muted:var(--night-muted);

--border:var(--night-border);

--sidebar:var(--night-2);

--sidebar-hover:var(--night-3);

--input:var(--night-input);

--table-head:var(--night-3);

--table-hover:#16375D;

}

body.dark-mode .topbar{

background:var(--night-2);

border-bottom-color:var(--night-border);

}

body.dark-mode .store-top-name,
body.dark-mode .modal-box h2,
body.dark-mode .form-group label,
body.dark-mode th,
body.dark-mode td{

color:var(--night-text);

}

body.dark-mode .menu a{

color:#B9CBE0;

}

body.dark-mode .search,
body.dark-mode .form-group input{

background:var(--night-input);

color:var(--night-text);

border-color:var(--night-border);

}

body.dark-mode .modal-box{

background:var(--night-2);

border:1px solid var(--night-border);

}

body.dark-mode .form-group input:disabled{

background:#17304D;

color:#8FA8C2;

}

body.dark-mode .cancel{

background:#1B3858;

color:#DCE9F7;

}

body.dark-mode .edit-btn{

background:#193553;

color:#BFD8F2;

}

body.dark-mode .delete-btn{

background:#492936;

color:#FFB8C1;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

.sidebar{

width:60px;

}

.sidebar:hover{

width:200px;

}

.topbar{

right:60px;

height:68px;

padding:0 12px;

}

.content{

margin-right:60px;

padding:83px 12px 20px;

}

.box{

padding:15px;

}

.store-image{

width:42px;

height:42px;

}

.store-top-name{

font-size:14px;

max-width:150px;

}

.view-store-btn{

padding:8px 10px;

font-size:11px;

}

.add-btn{

flex:1;

}

}

@media(max-width:500px){

.store-label{

display:none;

}

.view-store-btn span{

display:none;

}

.view-store-btn{

width:40px;

height:40px;

padding:0;

justify-content:center;

}

.top-actions{

gap:5px;

}

.top h2{

font-size:18px;

}

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:360px){

.store-top-name{

max-width:110px;

}

.content{

padding-left:8px;

padding-right:8px;

}

.box{

padding:12px;

}

}

</style>

</head>

<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {
getFirestore,
collection,
getDocs,
doc,
setDoc,
deleteDoc,
getDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


import {
getAuth,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBqt5JH9AR1n4vdZlImLKB_jZi1jTe63Jo",

authDomain:
"g-glam.firebaseapp.com",

projectId:
"g-glam",

storageBucket:
"g-glam.firebasestorage.app",

messagingSenderId:
"997228419719",

appId:
"1:997228419719:web:f9d88de7ea2c6f457e3622",

measurementId:
"G-WX1K1F83F6"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);


/* =====================================================
   ELEMENTS
===================================================== */

const list =
document.getElementById("deliveryList");

const searchInput =
document.getElementById("searchInput");

const modal =
document.getElementById("modal");

const wilayaInput =
document.getElementById("wilaya");

const officeInput =
document.getElementById("office");

const homeInput =
document.getElementById("home");

const modalTitle =
document.getElementById("modalTitle");

const saveBtn =
document.getElementById("saveBtn");

const topStoreName =
document.getElementById("topStoreName");

const topStoreImage =
document.getElementById("topStoreImage");

const viewStoreBtn =
document.getElementById("viewStoreBtn");

const themeToggle =
document.getElementById("themeToggle");


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;

let deliveryItems = [];

let editingId = null;


/* =====================================================
   DELIVERY PATH
===================================================== */

/*
   مهم:

   أسعار التوصيل خاصة بكل متجر.

   المسار:

   stores/{UID}/delivery/{wilaya}

   مثال:

   stores/C8Zx1XPqbLRlHx0kyfQd7nNRCcQ2/delivery/Batna

   لا يوجد ownerUid داخل وثيقة delivery.
*/

function getDeliveryCollection(){

if(!currentUser){

throw new Error(
"المستخدم غير مسجل الدخول."
);

}

return collection(
db,
"stores",
currentUser.uid,
"delivery"
);

}


function getDeliveryDocument(wilayaId){

if(!currentUser){

throw new Error(
"المستخدم غير مسجل الدخول."
);

}

return doc(
db,
"stores",
currentUser.uid,
"delivery",
wilayaId
);

}


/* =====================================================
   THEME
===================================================== */

function applyTheme(){

const saved =
localStorage.getItem("g-glam-theme");


if(saved === "dark"){

document.body.classList.add(
"dark-mode"
);

themeToggle.innerHTML =
'<i class="fa-solid fa-sun"></i>';

}else{

document.body.classList.remove(
"dark-mode"
);

themeToggle.innerHTML =
'<i class="fa-solid fa-moon"></i>';

}

}


applyTheme();


themeToggle.addEventListener(
"click",
()=>{

const dark =
document.body.classList.toggle(
"dark-mode"
);


localStorage.setItem(
"g-glam-theme",
dark ? "dark" : "light"
);


themeToggle.innerHTML =
dark

?

'<i class="fa-solid fa-sun"></i>'

:

'<i class="fa-solid fa-moon"></i>';

}
);


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(

auth,

async(user)=>{


if(!user){

window.location.href =
"login.html";

return;

}


currentUser = user;


try{


/*
   المتجر مرتبط مباشرة بـ UID.

   مثال:

   stores/C8Zx1XPqbLRlHx0kyfQd7nNRCcQ2
*/

const storeRef =
doc(
db,
"stores",
user.uid
);


const storeSnapshot =
await getDoc(storeRef);


if(!storeSnapshot.exists()){

topStoreName.textContent =
"المتجر غير موجود";


list.innerHTML = `

<tr>

<td
colspan="5"
class="empty">

<i class="fa-solid fa-circle-exclamation"></i>

<br><br>

لم يتم العثور على بيانات المتجر.

</td>

</tr>

`;

return;

}


const store =
storeSnapshot.data();


/* STORE NAME */

const name =
store.storeName ||
store.name ||
"G-Glam";


topStoreName.textContent =
name;


/* STORE IMAGE */

const logo =
store.storeImage ||
store.image ||
store.logo ||
store.storeLogo ||
store.logoUrl ||
store.photoURL ||
"";


topStoreImage.src =
logo || "logotrans.png";


/* VIEW STORE */

viewStoreBtn.href =
"index.html?store=" +
encodeURIComponent(
user.uid
);


/* LOCAL STORAGE */

localStorage.setItem(
"ownerUid",
user.uid
);

localStorage.setItem(
"storeId",
user.uid
);

localStorage.setItem(
"storeName",
name
);


/* LOAD DELIVERY */

await loadDelivery();


}catch(error){

console.error(
"STORE LOAD ERROR:",
error
);


showMessage(
"حدث خطأ أثناء تحميل المتجر: " +
error.message,
false
);

}

}
);


/* =====================================================
   LOAD DELIVERY
===================================================== */

async function loadDelivery(){

list.innerHTML = `

<tr>

<td
colspan="5"
class="empty">

<i class="fa-solid fa-spinner fa-spin"></i>

<br>

جاري تحميل أسعار التوصيل...

</td>

</tr>

`;


try{


/*
   القراءة من:

   stores/{UID}/delivery
*/

const snapshot =
await getDocs(
getDeliveryCollection()
);


deliveryItems = [];


snapshot.forEach(
item=>{

deliveryItems.push({

id:item.id,

...item.data()

});

});


/*
   ترتيب الولايات أبجديًا
*/

deliveryItems.sort(
(a,b)=>
a.id.localeCompare(
b.id,
"ar"
)
);


displayDelivery();


}catch(error){

console.error(
"DELIVERY LOAD ERROR:",
error
);


list.innerHTML = `

<tr>

<td
colspan="5"
class="empty">

<i class="fa-solid fa-circle-exclamation"></i>

<br><br>

تعذر تحميل أسعار التوصيل.

<br><br>

${escapeHtml(
error.message
)}

</td>

</tr>

`;

}

}


/* =====================================================
   DISPLAY DELIVERY
===================================================== */

function displayDelivery(){

const value =
searchInput.value
.trim()
.toLowerCase();


const filtered =
deliveryItems.filter(
item=>

String(item.id)
.toLowerCase()
.includes(value)

);


list.innerHTML = "";


if(!filtered.length){

list.innerHTML = `

<tr>

<td
colspan="5"
class="empty">

<i class="fa-solid fa-inbox"></i>

<br><br>

لا توجد ولاية مطابقة للبحث.

</td>

</tr>

`;

return;

}


filtered.forEach(
(item,index)=>{


const row =
document.createElement("tr");


row.innerHTML = `

<td>

<strong>

${String(index + 1).padStart(2,"0")}

</strong>

</td>


<td>

<strong>

${escapeHtml(item.id)}

</strong>

</td>


<td>

<span class="price">

${formatPrice(item.office)} DA

</span>

</td>


<td>

<span class="price">

${formatPrice(item.home)} DA

</span>

</td>


<td>


<button
class="edit-btn"
data-action="edit"
data-id="${escapeAttribute(item.id)}">

<i class="fa-solid fa-pen"></i>

تعديل

</button>


<button
class="delete-btn"
data-action="delete"
data-id="${escapeAttribute(item.id)}">

<i class="fa-solid fa-trash"></i>

حذف

</button>


</td>

`;


list.appendChild(row);

});

}


/* =====================================================
   FORMAT PRICE
===================================================== */

function formatPrice(value){

const number =
Number(value ?? 0);


if(!Number.isFinite(number))
return "0";


return number.toLocaleString(
"fr-DZ"
);

}


/* =====================================================
   ADD BUTTON
===================================================== */

document
.getElementById("addBtn")
.addEventListener(
"click",
()=>{


editingId = null;


modalTitle.textContent =
"إضافة ولاية";


wilayaInput.value = "";

officeInput.value = "";

homeInput.value = "";


wilayaInput.disabled =
false;


modal.classList.add(
"active"
);


setTimeout(
()=>{
wilayaInput.focus();

100
);

);


/* =====================================================
   CLOSE MODAL
===================================================== */

document
.getElementById("cancelBtn")
.addEventListener(

closeModal

modal.classList.remove(
"active"
);

}

/* =====================================================
   TABLE ACTIONS
===================================================== */

list.addEventListener(
"click",
async event=>{


const button =
event.target.closest("button");


if(!button)
return;


const id =
button.dataset.id;


const action =
button.dataset.action;


if(!id)
return;


/* =================================================
   EDIT
================================================= */

if(action === "edit"){

const item =
deliveryItems.find(
x=>x.id === id
);


if(!item){

showMessage(
"لم يتم العثور على الولاية.",
false
);

return;

}


editingId = id;


modalTitle.textContent =
"تعديل أسعار " + id;


wilayaInput.value =
id;


wilayaInput.disabled =
true;


officeInput.value =
item.office ?? "";


homeInput.value =
item.home ?? "";


modal.classList.add(
"active"
);


setTimeout(
()=>{
officeInput.focus();
},
100
);

}


/* =================================================
   DELETE
================================================= */

if(action === "delete"){


const ok =
confirm(

"هل تريد حذف أسعار التوصيل لولاية:\n\n" +
id +
"؟"

);


if(!ok)
return;


try{


/*
   حذف:

   stores/{UID}/delivery/{wilaya}
*/

await deleteDoc(
getDeliveryDocument(id)
);


showMessage(
"تم حذف الولاية بنجاح.",
true
);


await loadDelivery();


}catch(error){

console.error(
"DELETE ERROR:",
error
);


showMessage(
"حدث خطأ أثناء الحذف: " +
error.message,
false
);

}

}

}
);


/* =====================================================
   SAVE
===================================================== */

saveBtn.addEventListener(
"click",
async()=>{


if(!currentUser){

showMessage(
"المستخدم غير مسجل الدخول.",
false
);

return;

}


const wilaya =
wilayaInput.value.trim();


const officeValue =
officeInput.value.trim();


const homeValue =
homeInput.value.trim();


/* VALIDATE WILAYA */

if(!wilaya){

alert(
"يرجى إدخال اسم الولاية."
);

wilayaInput.focus();

return;

}


/* VALIDATE PRICES */

if(
officeValue === "" ||
homeValue === ""
){

alert(
"يرجى إدخال سعر المكتب والمنزل."
);

return;

}


const office =
Number(officeValue);


const home =
Number(homeValue);


if(
!Number.isFinite(office) ||
!Number.isFinite(home) ||
office < 0 ||
home < 0
){

alert(
"يرجى إدخال أسعار صحيحة."
);

return;

}


/* INTEGER ONLY */

if(
!Number.isInteger(office) ||
!Number.isInteger(home)
){

alert(
"يرجى إدخال الأسعار بالدينار بدون كسور."
);

return;

}


try{


saveBtn.disabled = true;


saveBtn.innerHTML =

'<i class="fa-solid fa-spinner fa-spin"></i>' +
'<span>جاري الحفظ...</span>';


/* =================================================
   ADD
================================================= */

if(!editingId){


const exists =
deliveryItems.some(
item =>

item.id
.toLowerCase()
===
wilaya
.toLowerCase()

);


if(exists){

alert(
"هذه الولاية موجودة بالفعل."
);

return;

}


/*
   إنشاء وثيقة:

   stores/{UID}/delivery/{wilaya}

   بدون ownerUid.
*/

await setDoc(

getDeliveryDocument(wilaya),

{

office: office,

home: home,

createdAt:
serverTimestamp(),

updatedAt:
serverTimestamp()

}

);


showMessage(
"تمت إضافة الولاية بنجاح.",
true
);

}


/* =================================================
   EDIT
================================================= */

else{


/*
   تعديل:

   stores/{UID}/delivery/{editingId}

   لا نغير اسم الولاية.

   لا نغير مسار الوثيقة.

   لا يوجد ownerUid.
*/

await setDoc(

getDeliveryDocument(
editingId
),

{

office: office,

home: home,

updatedAt:
serverTimestamp()

},

{

merge:true

}

);


showMessage(
"تم تعديل أسعار التوصيل بنجاح.",
true
);

}


closeModal();


await loadDelivery();


}catch(error){

console.error(
"SAVE ERROR:",
error
);


showMessage(
"حدث خطأ أثناء الحفظ: " +
error.message,
false
);


}finally{


saveBtn.disabled =
false;


saveBtn.innerHTML =

'<i class="fa-solid fa-floppy-disk"></i>' +
'<span>حفظ</span>';

}

}
);


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
"input",
displayDelivery
);

/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
text,
success
){

const element =
document.getElementById(
success
?
"success"
:
"error"
);


const other =
document.getElementById(
success
?
"error"
:
"success"
);


other.style.display =
"none";


element.textContent =
text;


element.style.display =
"block";


setTimeout(
()=>{

element.style.display =
"none";

},
3500
);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(value ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


function escapeAttribute(value){

return escapeHtml(value);

}
