.form-group label{

.form-group input{

.form-group input:disabled{

.buttons button{

flex:1;
padding:12px;
border:none;

.save{

.save:hover{

.cancel{

const wilayaOrder =
Object.keys(tarifs);
   const list =
document.getElementById(
"deliveryList"
);

const searchInput =
document.getElementById(
"searchInput"
);

const modal =

const ownerEmailElement =

let editingId = null;

let deliveryItems = [];

let currentUser = null;


onAuthStateChanged(

auth,

async function(user){

if(!user){

window.location.href =
"login.html";

return;

}

currentUser =
user;

try{

const storeRef =
doc(
db,
"stores",
user.uid
);

const storeSnapshot =
await getDoc(
storeRef
);

if(
storeSnapshot.exists()
){

const store =
storeSnapshot.data();

storeNameElement.textContent =
store.storeName ||
store.name ||
"G-Glam";

ownerEmailElement.textContent =
store.ownerEmail ||
store.email ||
user.email ||
"";

}else{

storeNameElement.textContent =
"G-Glam";

ownerEmailElement.textContent =
user.email || "";

}

await loadDelivery();

}catch(error){

console.error(
"AUTH / STORE ERROR:",
error
);

showMessage(
"❌ حدث خطأ أثناء تحميل بيانات المتجر: " +

}

});
   async function loadDelivery(){

list.innerHTML = `

<tr>

<td
colspan="5"
class="empty">

⏳ جاري تحميل الولايات...

</td>

</tr>

`;

try{

const snapshot =
await getDocs(

collection(
db,
"delivery"
)

);

deliveryItems = [];

snapshot.forEach(

item=>{

deliveryItems.push({

id:item.id,

...item.data()

});

});

deliveryItems.sort(

(a,b)=>{

const indexA =
wilayaOrder.indexOf(
a.id
);

const indexB =
wilayaOrder.indexOf(
b.id
);

if(indexA === -1)
return 1;

if(indexB === -1)
return -1;

return indexA - indexB;

});

displayDelivery();

}catch(error){

console.error(
"DELIVERY LOAD ERROR:",
error
);

list.innerHTML = `

<tr>

<td
colspan="5"
class="empty">

❌ حدث خطأ أثناء تحميل أسعار التوصيل.

<br><br>

${escapeHtml(
error.message
)}

</td>

</tr>

`;

}

}


function displayDelivery(){

const value =
searchInput.value
.trim()
.toLowerCase();

const filtered =
deliveryItems.filter(

item =>

item.id
.toLowerCase()
.includes(value)

);

list.innerHTML = "";

if(
filtered.length === 0
){

list.innerHTML = `

<tr>

<td
colspan="5"
class="empty">

📭 لا توجد ولاية مطابقة للبحث.

</td>

</tr>

`;

return;

}

filtered.forEach(

(item,index)=>{

const originalIndex =
wilayaOrder.indexOf(
item.id
);

const number =
originalIndex === -1
?
index + 1
:
originalIndex + 1;

const row =
document.createElement(
"tr"
);

row.innerHTML = `

<td>

<strong>

${String(
number
).padStart(
2,
"0"
)}

</strong>

</td>

<td>

<strong>

${escapeHtml(
item.id
)}

</strong>

</td>

<td>

<span class="price">

${Number(
item.office || 0
)}

DA

</span>

</td>

<td>

<span class="price">

${Number(
item.home || 0
)}

DA

</span>

</td>

<td>

<button
class="edit-btn"
data-action="edit"
data-id="${escapeAttribute(
item.id
)}">

✏️ تعديل

</button>

<button
class="delete-btn"
data-action="delete"
data-id="${escapeAttribute(
item.id
)}">

🗑️ حذف

</button>

</td>

`;

list.appendChild(
row
);

});

}
   document
.getElementById(
"addBtn"
)
.addEventListener(

"click",

()=>{

editingId = null;

modalTitle.textContent =
"إضافة ولاية";

wilayaInput.value = "";

officeInput.value = "";

homeInput.value = "";

wilayaInput.disabled = false;

modal.classList.add(
"active"
);

});


document
.getElementById(
"cancelBtn"
)
.addEventListener(

"click",

closeModal

);


function closeModal(){

modal.classList.remove(
"active"
);

}


modal.addEventListener(

"click",

function(event){

if(
event.target === modal
){

closeModal();

}

});


list.addEventListener(

"click",

async function(event){

const button =
event.target.closest(
"button"
);

if(!button)
return;

const id =
button.dataset.id;

const action =
button.dataset.action;


if(
action === "edit"
){

const item =
deliveryItems.find(

x =>
x.id === id

);

if(!item){

alert(
"لم يتم العثور على الولاية."
);

return;

}

function showMessage(
text,
success
){

const element =
document.getElementById(

success
?
"success"
:
"error"

);

const other =
document.getElementById(

success
?
"error"
:
"success"

);

other.style.display =
"none";

element.textContent =
text;

element.style.display =
"block";

setTimeout(

()=>{

element.style.display =
"none";

},

3500

);

}


function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


function escapeAttribute(value){

return escapeHtml(
value
);

}
